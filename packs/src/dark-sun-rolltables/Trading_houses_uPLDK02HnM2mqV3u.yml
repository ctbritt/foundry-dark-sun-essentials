    description: >-
      House Vordon EDIT  House Vordon's Banner  Once one of the most feared and
      respected of Athas 's great houses, House Vordon has become something of a
      laughingstock. This transformation is mainly due to the demented excesses
      of Tyr's Sorcerer-King Kalak. Kalak diverted valuable resources to the
      construction of a massive ziggurat and all but bankrupted his city. This
      caused massive resentment among Tyr's nobles and merchants. With Kalak's
      excesses at an end and the city in the hands of revolutionaries and former
      slaves, House Vordon is poised to return to prominence once more.
    name: ''
