    description: >-
      House Stel Based in Urik, it's not surprising that House Stel is the most
      militant of the trading houses. Stel deals in weapons, ceramics, iron,
      obsidian, wood, feathers, slaves and gold. There are more rumors about
      them dealing with Elves, and therefore stolen cargos, than any other
      house. However, there is little doubt that any house would do this, if the
      profit were enough. There is no proof that they have ever broken the
      Merchants' Code, which makes it tough to do anything against them.
    name: ''
