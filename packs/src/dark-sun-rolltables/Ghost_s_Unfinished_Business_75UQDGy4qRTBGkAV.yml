    description: >-
      A pirate captain was burying his treasure when he happened upon a lovely
      Nymph. He sought her out each month and soon they both fell in love. He
      was already betrothed, but this was an arranged marriage and he wasn’t
      happy. The Nymph and captain were to wed in secret when the jilted fiance
      shows up in a fiery flash. She cursed the cheating fiance to forever sail
      the seas and to never step foot on dry land. To the Nymph, she cursed her
      to become a wooden figurehead. The clause of the curse was this: True love
      would never be found as long as the white sands fall down. The captain
      piloted the ‘Cursed Heart’ ship and when he died, became a sorrowful
      ghost. Somewhere on another ship, the nymph comes alive only for one hour
      a night on a full moon. The cursed heart will always attack the Sea Nymph
      in order to take the wooden figurehead. The sorceress (jilted fiance)
      guarded the never-ending hourglass at the top of her tower. When she died,
