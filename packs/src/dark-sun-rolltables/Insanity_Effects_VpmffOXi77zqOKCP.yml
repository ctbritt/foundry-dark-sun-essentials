    description: >-
      Whenever you meet a new character, roll 1d8: 01: You see everything they
      do in a negative light; 2: You feel compelled to steal from this person,
      regardless ofthe circumstances. This effect then transfers to them, and
      they feel compelled to steal from you. It will not transfer again after
      this; 3: You see the character as being extremely ugly. Make a WIS save.
      On a failed save, you have disadvantage on all rolls related to anything
      other than that character, as you’re too focused on them; 4:You feel
      extremely apathetic towards them. You don’t care about anything that
      happens to them, or what they do; 5: You feel compelled to protect the
      character at all costs, through whatever means you feel will be most
      effective; 6: you find the character extremely attractive, regardless of
      their appearance or your sexuality; 7: The character is now your new “best
      friend”. You cannot help but find similarities between the two of you, and
      you care a great deal about them as a person, as well as their opinion of
      you. Any compliments or gifts you receive from them are elating, and any
      insults they give deal 2d4 emotional damage, which heals over 1d6 hours;
      8: You feel no special way towards this character.
    name: ''
