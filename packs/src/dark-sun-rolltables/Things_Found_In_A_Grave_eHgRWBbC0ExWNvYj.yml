    description: >-
      Touching the body causes the eyes of the occupant to snap open and the
      mouth to open in a silent, vein bulging scream as the color drains from
      the youth’s skin and the flesh begins to decompose and slough off before
      your eyes, rotting to nothing seconds after separating from the body. You
      can see the limbs twitching and trying to move, but as more flesh and
      muscle rots away, the efforts are weaker and weaker. After almost a full
      minute of this, the youth can no longer move any of its body except for
      its eyes and what remains of its face. Its eyes dart around, you can tell
      that it is intelligent but clearly terrified and in maddening agony. Any
      healing magic seems to cause it even more pain, and it is impossible to
      put it out of its misery. Eventually it rots to nothingness.
    name: ''
