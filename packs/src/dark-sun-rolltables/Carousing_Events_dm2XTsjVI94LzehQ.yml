    description: >-
      You wake up on a cold stone table; your naked body shakes from the icy
      touch. As you begin to get up a sharp pain comes over your chest. You ever
      so slowly shift and lift yourself up and as you look down you see there is
      now a long, red, thick scar over where your heart is. You look around the
      room and see demonic runes, bones, tiki torches and that the walls of this
      room are the sides of a small cave. The exit to the cave is just ahead,
      you spot your items there in a pile, the light of the early morning is
      just beginning to pierce the cloudy sky. Something sinister happened last
      night; you pray it will not come back to haunt you.
