    description: >-
      It’s the annual Ferret-legging Endurance competition. In the sport of
      ferret-legging, competitors tie their trousers at the ankles before
      placing two ferrets inside and securely fastening their belts to prevent
      the ferrets from escaping. Each competitor then stands in front of the
      judges for as long as he can. Competitors cannot be drunk or drugged, nor
      can the ferrets be sedated. In addition, competitors are not allowed to
      wear underwear beneath their trousers which must allow the ferrets free
      access from one leg to the other and the ferrets must have a full set of
      teeth that must not have been filed or otherwise blunted. The winner is
      the person who lasts the longest.
