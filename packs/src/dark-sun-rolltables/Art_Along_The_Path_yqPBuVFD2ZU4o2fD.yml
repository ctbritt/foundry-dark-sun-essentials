    description: >-
      A tree stump covered in bent pennies. It looks like passers by have jammed
      the edges of pennies and other small coins into the cracks and bark of
      this large stump and bent them down to create an almost scale-effect on
      the bark. Over the years after the bark space ran out pennies were jammed
      between other pennies, and so on, growing the stump over time.
    name: ''
