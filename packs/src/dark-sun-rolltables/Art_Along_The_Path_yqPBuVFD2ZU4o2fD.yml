    description: >-
      The path here dips down between an outcrop of stone that is densely
      covered in mosses and ferns. As the trail moves down, the stones raise up,
      towering far overhead yet still close enough to touch. At the nadir of the
      path a wooden bridge zigzags through two massive mossy stones. The
      railings of the bridge have wooden logs arranged in a fan pattern. Water
      drips down from the moss onto the passers of the bridge. The bridge
      crosses a skinny creek before the path slopes upwards again.
    name: ''
    _key: '!tables.results!yqPBuVFD2ZU4o2fD.7KTvtqPIyMkFdwTD'
