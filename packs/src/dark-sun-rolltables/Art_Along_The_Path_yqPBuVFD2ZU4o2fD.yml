    description: >-
      A vast collection of lamps and lanterns have been hung around the path,
      some along the sides in tree branches or hung from iron rods, some hanging
      down from above, some placed directly on the ground. No two lamps are the
      same, some are iron, some wood, some paper, some ornate, some elaborate,
      some elven, some dwarven. At night they all illuminate on their own,
      flicking on over the course of the sunset, in no discernible pattern.
    name: ''
    _key: '!tables.results!yqPBuVFD2ZU4o2fD.5WnW9jQ4EpGLhiNI'
