    description: >-
      In the dense forest someone has made a simple wooden frame of a house,
      with no walls or roof. At the center of the house they have hung a lit
      chandelier, and placed a lovely mahogany table with seating for eight, and
      a full place setting. The table, plates and chandler have become worn over
