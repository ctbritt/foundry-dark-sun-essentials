      systemVersion: 5.2.4
      lastModifiedBy: null
    description: >-
      A small mossy cottage can be seen of a branch in the trail. The cottage is
      made of red pine with forest green roof tiles. It’s roof is a sharp
      steeple with a lit coppola. The cottage looks too small for anyone to
      really live in, perhaps enough space to keep out of any passing rain.
      Inside the walls of the house are completely painted with a detailed map
      of the area. A day’s ration for two people can be found in a chest by the
      entrance.
    name: ''
    _key: '!tables.results!yqPBuVFD2ZU4o2fD.MCAHyWDz6ma81HhH'
