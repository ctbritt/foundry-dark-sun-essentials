    description: >-
      The path happens upon a low wall made of loose stones. The wall is easy
      enough to hop over, but the path follows along only one side of the wall.
      After a few minutes of walking, a stone arched Moon Gate has been made,
      which the path follows through and continues onward.
    name: ''
    _key: '!tables.results!yqPBuVFD2ZU4o2fD.tnNBAyfmRA1rZcBR'
