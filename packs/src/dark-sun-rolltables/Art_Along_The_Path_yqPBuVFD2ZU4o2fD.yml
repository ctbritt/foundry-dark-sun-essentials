      systemVersion: 5.2.4
      lastModifiedBy: null
    description: >-
      The path intersects with a calm river where a flat disc of stone, about
      10′ across, is floating at the water’s edge. The river is causing the
      stone to rotate but it is caught in place by an outcrop of rock. As the
      river rotates the stone disc the disc grinds out more of the rock it has
      caught on. It has clearly been here for years as the stone it is stuck on
      has a sizable divot formed from the rotation.
    name: ''
    _key: '!tables.results!yqPBuVFD2ZU4o2fD.OwCGyQlqvukNlPQz'
