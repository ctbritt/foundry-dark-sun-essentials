    description: >-
      The path is unpaved, and generally unkempt, but you happen upon a short
      wide staircase, regal enough for any king. The staircase is 10 steps tall
      and wide enough for 5. It boasts a wide stone banister carved of marble.
      Carvings of plants and forest creatures decorate the sides. Someone has
      come through and pried all the gems from their eyes and the gold plating
      from the staircase in general, but the impressive stonework remains. The
      staircase connects to a higher portion of the path, which continues on as
      normal.
    name: ''
    _key: '!tables.results!yqPBuVFD2ZU4o2fD.OJFfxH0cQaNECHDL'
