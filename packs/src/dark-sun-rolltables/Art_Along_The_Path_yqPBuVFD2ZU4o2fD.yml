    description: >-
      The trees and plants here have all been tagged or marked with small signs,
      in delicate calligraphy. The signs name the plants and list some common
      uses. The signs help anyone who is looking to improve their foraging,
      granting a 1D4 bonus to foraging rolls for the next week.
    name: ''
