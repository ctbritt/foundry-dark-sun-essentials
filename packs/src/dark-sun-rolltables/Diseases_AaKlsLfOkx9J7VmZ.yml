    description: >-
      Vorel’s Phage – Disease starts by imposing one Exhaustion level on the
      affected creature, in which small patches of bumps errupt on the inflicted
      creature’s skin and the joints swell painfully. After an incubation period
      of 1d4-1 nights, the creature gains another level of Exhaustion and the
      bumps become raised and fungal looking. On the firstboccurance of a new
      moon after the incubation period, the infected creature gains 2 more
      Exhaustion levels. If this kills the creature, it rises again after 1d4-1
      nights as a wight. If a blood moon occurs at any point after incubation,
      the creature instead just succeed in a DC 15 Constitution saving throw or
      die immediately, raising in a minute as a wight. Exhaustion levels gained
      by this disease reappear every morning and only a miracle, wish or some
      other similar magic can permanently remove them without curing the
      disease.
    name: ''
    _key: '!tables.results!AaKlsLfOkx9J7VmZ.iG0EZitC0qITbqGM'
