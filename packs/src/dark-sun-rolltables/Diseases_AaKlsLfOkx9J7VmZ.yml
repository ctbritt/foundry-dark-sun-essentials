      bloodfungus grows mycelium throughout the mortal body, feeding on the
      nutrients passed through the digestive tract and blood stream. After two
      months of relatively silent incubation, the mycelium will flower, bursting
      small fruiting-body stalks the size of an index finger from the skin along
      the afflicted’s appendages, which flower in a day and quickly begin to
      release spores. Further, the mortal’s nervous system is affected,
