      airborne spores. First sign of symptoms appears to be nothing more than
      mild acne. Soon, several of the ‘zits’ begin to grow larger. Not
      unnaturally large for such blemishes. Finally, a single ‘puff’ quickly
      grows to the size of a grape and bursts into a small cloud of spores that
      quickly spread in a breeze, infecting those around the host, as well as
      leaving a large ‘pockmark’ in it’s place. The fungus, while growing inside
      the host, causes ever growing feelings of loss and loneliness, pushing the
      host to seek out more and more companionship. If the fungus is allowed to
      reach fruition and spore, the sense of loneliness transitions into a
      permanent and inconsolable state of depression.
