    description: >-
      Sewer Rat Flu – When bitten by a sewer rat, the effect is just like the
      regular flu, but 3 times worse. PC vomits through out most of the day. To
      determine when PC vomits, roll a percentile die every 30 minutes in game,
      If even then vomit, if odd, nothing happens. Vomiting will force the PC to
      stop what ever action they are doing, and breaks concentration. Vomiting
      every 3rd time will also cough up blood. Roll 1d4 to calculate damage. The
      cure is to drink very hard alcohol, and let it dissolve the stomach acid
      poison. Another option is to survive 10 hours. A lesser restoration spell
      automatically cures it. Orcs, Half-orcs, and Drow are immune to this.
    name: ''
