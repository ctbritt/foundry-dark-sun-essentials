    description: >-
      The Turquoise Death – This disease is contracted by contact with a
      creatures bodily fluids, and the disease remains infectious weeks after
      the fluid has evaporated, but only if rehydrated. After the initial 1d3
      day incubation period the infected will start to notice heart
      palpitations, and will note slow recovery rates. The infected creature can
      no longer remove levels of exhaustion, and failed death saving throws
      permanently reduce the number of death saving throws the creature can fail
      in the future before death occurs. Both effects are permanent after the
      creature has gone without treatment for more than a month.
