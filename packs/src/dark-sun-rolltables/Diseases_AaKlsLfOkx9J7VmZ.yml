    description: >-
      Dragon fever – A magical disease contracted by being near Draconic
      influences for far too long. The symptoms start as a simple change in the
      eyes, making them take the look of a dragon, but other than that the
      paitent feels fine. If not treated then the second stage of the sickness
      begins, the patient becomes near obsessed with wealth and money, and will
      do anything to get it even at the expense of others. This may be subtle at
      first but once the third phase begins most people know exactly what has
      happened. The final phase involves a fever that if not treated constantly
      can kill the paitent. However if this last phase is survived, the patient
      finds themselves with some sign of Draconic nature, like horns or a small
      scales on parts of the body.
