    description: >-
      Spectre’s Decay – The victim’s soul and body separate but continue to move
      in unison. Without a soul the body rapidly degenerates and decays over the
      course of a year, however wherever the flesh forms holes or rips the ghost
      of the person continues to stand. This continues until the body has
      completely decomposed and the ghost is left to wander the earth, unable to
      pass into an afterlife. This disease can rarely be contracted through
      contact with undead who have lingering souls.
    name: ''
