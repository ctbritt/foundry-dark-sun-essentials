      surely inflict this disease should any of her sap touch your skin. First,
      blindness and deafness slowly takes you, soon followed by sluggishness and
      fatigue. Then, your body begins to painfully turn, inside out, into the
      hard, coarse bark of an old dying tree. Your body rejects food, so you
