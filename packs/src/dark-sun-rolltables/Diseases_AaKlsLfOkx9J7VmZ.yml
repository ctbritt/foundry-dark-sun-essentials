    description: >-
      Swordbearer’s Bane – The disease is contracted by contact with an infected
      creature’s blood. After the incubation period of 1d4 days, the hands and
      feet of the infected creature begin to swell and become tender. This
      causes the creature to lose 5ft of movement and imposes disadvantage on
      Dexterity (Slight of hand) checks. After another 7-1d4 days, the infection
      causes the hosts extremities to go numb. The infected creature’s movement
      speed is halved and the creature is treated as if it were under the effect
      of a Bane spell until it is cured.
    name: ''
