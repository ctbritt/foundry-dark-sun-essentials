      begin singing for 1d8 rounds.  If the original spell was supposed to be a
      spell of healing, the song is a rousing chorus that washes away fatigue
      and ends any emotional (fear, charm, etc.) effect that is currently
      afflicting any that hear it.  If the original spell was supposed to be an
      attack spell, the song is an irresistible tune that catches up all that
      hear it into singing it with the trees, and all the attitudes of the
      combatants is changed to neutral towards each other when the song ends. 
      If the spell was supposed to be anything else, the song is a soothing song
      that makes the listeners sleepy, making it hard to take reactionary
      attacks until the song ends.
