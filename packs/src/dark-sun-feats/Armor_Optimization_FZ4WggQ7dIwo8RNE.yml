  description:
    value: >-
      <p><em>Prerequisite: 1st level Feat, Dark Sun
      Campaign</em></p><p><em>Repeatable: No</em></p><p>You have conditioned
      yourself in such a way that it allows a you to use your armor to its best
      advantage against a specific opponent that you are fighting during combat.
      You gain a +1 bonus to AC against that opponent. At 8th level, the AC
      bonus increases to +2 and again at 15th level the bonus increases to
      +3.</p><p>You may use this ability a number of times equal to your
      Proficiency Bonus.</p><p>You must be wearing some type of armor or
      employing a shield in order to use armor optimization and must be able to
      see your opponent.</p><p></p>
