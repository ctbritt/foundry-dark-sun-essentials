name: Musician
system:
  description:
    value: >-
      <p>You gain the following benefits.</p><p><strong>Instrument
      Training.</strong> You gain proficiency with three Musical Instruments of
      your choice.</p><p><strong>Encouraging Song.</strong> As you finish a
      Short or Long Rest, you can play a song on a Musical Instrument with which
      you have proficiency and give &amp;Reference[inspiration] to allies who
      hear the song. The number of allies you can affect in this way equals your
      Proficiency Bonus (currently [[lookup @prof]]).</p><section class="secret"
      id="secret-uSBAbHsB2VxFaHwm"><p><strong>Foundry Note</strong></p><p>This
      feature does not automatically grant the proficiencies. You can toggle the
      "Edit" mode in the <strong>"</strong>Details" tab of your sheet and click
      on the cog next to "Tools" underneath your Skills to choose your Musical
      Instrument proficiencies.</p></section>
