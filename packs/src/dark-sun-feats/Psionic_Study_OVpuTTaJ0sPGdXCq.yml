  description:
    value: >-
      <p><em>Prerequisite: 4th level, Dark Sun
      Campaign</em></p><p><em>Repeatable: No</em></p><p>Choose one psionic
      discipline. You can manifest powers from this discipline, though you do
      not gain the ability to use the disciplines psychic focus unless you are a
      psion.</p><p><strong>Psionic Ability.</strong> Your psionic ability is the
      same as that used for your wild talent.</p><p><strong>Psi Points.</strong>
      Your psi point total is equal to 2 times your proficiency bonus,
      (currently [[lookup @prof*2]]). You recover all expended psi points when
      you finish a long rest.</p><p><strong>Psi Limit.</strong> Your psi limit
      is 1 less than that of a psion of the same level (minimum
      1).</p><p><strong>Special:</strong> Psions who select this feat gain the
      selected discipline and add 6 more psi points in addition to those granted
      by their class. This discipline does not count against the number of
      disciplines or orders you know.</p><p></p>
