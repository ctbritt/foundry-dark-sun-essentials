name: Initiate (Arcane )
type: feat
system:
  description:
    value: >-
      <p><em><strong>Prerequisite:</strong> 1st level Feat, Dark Sun
      Campaign</em></p><p><em><strong>Repeatable:</strong> No</em></p><p>You
      have learned the basics of a particular magical tradition. Choose one
      Spell list: Wizard or Cleric. You gain the following benefits related to
      that choice:</p><ul><li><strong>Two Cantrips:</strong> You learn two
      cantrips of your choice from the Spell list.</li><li><strong>1st-Level
      Spell:</strong> Choose one 1st-level Spell from the Spell list. You always
      have that Spell prepared. You can cast it once without a Spell Slot, and
      you regain the ability to cast it in that way when you finish a Long Rest.
      You can also cast the Spell using any Spell Slots you have. Intelligence,
      Wisdom, or Charisma is your spellcasting ability for these Spells (choose
      when you select this Feat). Consult the Player’s Handbook for the rules on
      spellcasting.</li></ul><p>Whenever you gain a new level, you can replace
      one of the Spells you chose for this Feat with a different Spell of the
      same level from the chosen Spell list.</p>
