name: Healer
system:
  description:
    value: >-
      <p>You gain the following benefits.</p><p><strong>Battle Medic.</strong>
      If you have a
      @UUID[Compendium.dnd-players-handbook.equipment.Item.phbagHealersKit0]{Healer’s
      Kit}, you can expend one use of it and tend to a creature within 5 feet of
      yourself as a Utilize action. That creature can expend one of its Hit
      Point Dice, and you then roll that die. The creature regains a number of
      Hit Points equal to the roll plus your Proficiency
      Bonus.</p><p><strong>Healing Rerolls.</strong> Whenever you roll a die to
      determine the number of Hit Points you restore with a spell or with this
      feat’s Battle Medic benefit, you can reroll the die if it rolls a 1, and
      you must use the new roll.</p><section class="secret"
      id="secret-srSK4HzKeG6v6Fzn"><p><strong>Foundry Note</strong></p><p>The
      character expending their Hit Die can reduce it on their sheet and inform
      you of the hit die size. You can then use the <strong>Heal d6, d8, d10, or
      d12</strong> activity to heal them. The activities automatically reroll
      1's.</p></section>
