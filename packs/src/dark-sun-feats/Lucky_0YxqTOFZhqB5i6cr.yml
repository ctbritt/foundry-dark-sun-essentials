name: Lucky
system:
  description:
    value: >-
      <p>You gain the following benefits.</p><p><strong>Luck Points.</strong>
      You have a number of Luck Points equal to your Proficiency Bonus and can
      spend the points on the benefits below. You regain your expended Luck
      Points when you finish a Long Rest.</p><p><strong>Advantage.</strong> When
      you roll a d20 for a D20 Test, you can spend 1 Luck Point to give yourself
      Advantage on the roll.</p><p><strong>Disadvantage.</strong> When a
      creature rolls a d20 for an attack roll against you, you can spend 1 Luck
      Point to impose Disadvantage on that roll.</p><section
      id="secret-6TFD3CUAlQhYUp4d" class="secret"><p><strong>Foundry
      Note</strong></p><p>This feature includes the appropriate number of uses
      and scales as you level up.</p><p>The <strong>Advantage</strong> and
      <strong>Disadvantage</strong> activities expend a use but do not enforce
      the Advantage/Disadvantage.</p></section>
