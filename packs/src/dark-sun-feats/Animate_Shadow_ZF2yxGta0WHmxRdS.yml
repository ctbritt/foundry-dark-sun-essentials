  description:
    value: >-
      <p>As an action, make a target creature's shadow move and animate as you
      desire in an area you can see up to 120' away. It cannot actually affect
      anything in a material way and must remain on a surface large enough to
      display the shadow. You may maintain this for 1 round per level and must
      use a bonus action to make it move and animate.</p>
