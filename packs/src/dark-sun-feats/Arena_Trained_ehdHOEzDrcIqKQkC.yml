  description:
    value: >-
      <p>Repeatable: No</p><p>You have been trained in the brutal arenas of
      Athas, where only the strongest survive. You may apply one of the
      following benefits per turn:</p><p><strong>Ravaging Strike</strong>. When
      you deal damage with a slashing or piercing weapon, you can add your
      proficiency bonus to the damage once per turn.</p><p><strong>Net
      Master</strong>. You gain proficiency with the use of the Net martial
      weapon to restrain your opponents. In addition, you add your proficiency
      bonus to the DC when a creature attempts to escape from
      it.</p><p><strong>Blinding Trick</strong>. Once per round you, as a Bonus
      Action, you may throw sand or loose dirt into a creature's eyes whose size
      is equal to or smaller than you. The creature atacked must make a [[/save
      dex format=long]] or be &amp;Reference[blinded] during the next melee
      attack against it within the same round.</p><p>You can use this feat a
      number of times equal to your proficiency bonus, and you regain all
      expended uses when you finish a long rest.</p>
