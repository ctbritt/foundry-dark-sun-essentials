name: Crafter
system:
  description:
    value: >-
      <p>You gain the following benefits.</p><p><strong>Tool
      Proficiency.</strong> You gain proficiency with three different Artisan’s
      Tools of your choice from the Fast Crafting
      table.</p><p><strong>Discount.</strong> Whenever you buy a nonmagical
      item, you receive a 20 percent discount on it.</p><p><strong>Faster
      Crafting. </strong>When you craft an item using a tool with which you have
      Tool Proficiency, the required crafting time is reduced by 20
      percent.</p><section class="secret"
      id="secret-0xMSDuPkDWUc959m"><p><strong>Foundry Note</strong></p><p>This
      feature does not automatically grant the proficiency. You can toggle the
      "Edit" mode in the <strong>"</strong>Details" tab of your sheet and click
      on the cog next to "Tools" underneath your Skills to choose your tool
      proficiencies.</p></section>
