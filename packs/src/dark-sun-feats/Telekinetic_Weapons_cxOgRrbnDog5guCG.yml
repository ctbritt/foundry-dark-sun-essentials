name: Telekinetic Weapons
type: feat
system:
  description:
    value: >-
      <p><em><strong>Psionic Power</strong></em></p><p><strong>Casting
      Time:</strong> 1 Action<br /><strong>Range:</strong> 30 feet<br
      /><strong>Components:</strong> S<br /><strong>Duration:</strong>
      Instantaneous</p><p>You telekinetically fling a weapon at a creature or
      object. Choose a weapon within 15 feet that isn't being worn or carried,
      or choose a weapon under your control. Make a ranged spell attack. On hit,
      the target takes damage equal to the weapon's damage dice. The range of
      the attack decreases to 15 feet if the weapon has the heavy or special
      property, and increases to 60 feet if the weapon has the light
      property.</p><p>You can use Psionic Mastery points on this power, and this
      power counts as a Discipline Power of the Telekinetics Discipline (for
      example, for the purpose of Empowered
      Psionics).</p><h4><strong>Modifiers:</strong></h4><ul><li><strong>Multiple
      (1+ psi points):</strong> For each additional psi point spent, you can
      fling an additional weapon, making a separate attack and damage roll for
      each weapon flung.</li><li><strong>Whirling (2+ psi points):</strong> You
      can replace throwing a weapon with casting <em>cloud of daggers</em>. It
      is cast at one level higher for each additional point spent after
      2.</li></ul>
