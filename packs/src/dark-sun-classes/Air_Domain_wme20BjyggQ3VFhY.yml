name: Air Domain
type: subclass
system:
  identifier: air-domain
  classIdentifier: cleric
  description:
    value: >-
      <div class="mb-2 ve-flex-col"><div class="rd__b  rd__b--0"><div
      data-source="PHB" class="rd__b  rd__b--1"><p>Clerics who make pacts with
      the Plane of Air are perhaps the most misunderstood of all the elemental
      clerics. They are wanderers, diviners, travelers, and mystics. Like the
      winds, their minds are constantly wandering, and they rarely seem focused
      on a current problem or situation.</p></div><p>Air clerics prize freedom
      over all. They loathe restriction in movement, personalities, beliefs,
      practices, clothing, and any attempt to impose limitations. This makes
      them enemies of bondage and slavery. The growing power of the sun has made
      the air angry, dry and lifeless, unable to power hurricanes and typhoons.
      Air clerics are obligated to protect earth and water in the hopes mighty
      forests might sway again and raging oceans fill the silt basins, bringing
      back unbridled freedom.</p><h5><span
      style="font-family:ScalySansRemake">Air Initiation</span></h5><p><span
      style="font-family:ScalySansRemake">The test of the air cleric is perhaps
      the most terrifying of the elemental initiations. A cleric and her mentor
      meditate for up to two weeks atop the highest mountain they can find. When
      the initiate feels ready, she walks to an overhand and leaps from the
      precipice, throwing off the shackles of the earth and giving herself
      completely to the wind. As she falls, the air spirits may speak with her
      and forge a pact of air, lowering her softly to the ground. If not, she
      likely dies.</span></p><div data-source="PHB" class="rd__b 
      rd__b--1"><div><p></p><h3>Air Domain
      Spells</h3><table><thead><tr><th>Cleric
      Level</th><th>Spells</th></tr></thead><tbody><tr><td>1st</td><td>@UUID[Compendium.shareddata.ddb-spells.kE4g3DB6Y0duTbFi]{Fog
      Cloud},
      @UUID[Compendium.dnd5e.spells.Item.WTbOQBsarsL1LuXJ]{Thunderwave}</td></tr><tr><td>3rd</td><td>@UUID[Compendium.dnd5e.spells.Item.FSMy6VAjDnXY9vWz]{Gust
      of Wind},
      @UUID[Compendium.dnd5e.spells.Item.wJKpSvSTbSkTjqyb]{Shatter}</td></tr><tr><td>5th</td><td>@UUID[Compendium.dnd5e.spells.Item.ehvmg9U9fcMEhE4z]{Call
      Lightning}, @UUID[Compendium.dnd5e.spells.Item.2IWiZAJtOGDoKjiz]{Gaseous
      Form}</td></tr><tr><td>7th</td><td>@UUID[Compendium.shareddata.ddb-spells.SKtxj8wcEPCg7yFu]{Storm
      Sphere}, @UUID[Compendium.shareddata.ddb-spells.z4HNmfz5thgSHBUe]{Summon
      Elemental (Air
      Only)}</td></tr><tr><td>9th</td><td>@UUID[Compendium.shareddata.ddb-spells.aQWQMxO0kR8SRF0N]{Destructive
      Wave}, @UUID[Compendium.shareddata.ddb-spells.EUIH2kc23RUBliCi]{Control
      Winds}</td></tr></tbody></table><h3>Raging Winds</h3><p>At 1st level you
      are imbued with the fury and persistence of the battering winds. This
      grants several benefits:</p><ul><li>You gain proficiency with martial
      weapons.</li><li>You learn the
      @UUID[Compendium.shareddata.ddb-spells.NEoywJIqT8NFpYcL]{Gust} or
      @UUID[Compendium.shareddata.ddb-spells.AKKjFO3RNkPn8quS]{Thunderclap}
      cantrip, your choice. The cantrip you selected counts as a cleric cantrip
      for you and doesn’t count against the number of cleric cantrips you
      know.</li><li>When you use your Turn Undead channel divinity, you can also
      effect non-air elementals.</li></ul><h3>Wrath of the Storm</h3><p>Also at
      1st level, you can thunderously rebuke attackers. When a creature within 5
      feet of you that you can see hits you with an attack, you can use your
      reaction to cause the creature to make a Dexterity saving throw.</p><p>The
      creature takes 2d8 lightning or thunder damage (your choice) on a failed
      saving throw, and half as much damage on a successful
      one.</p></div><div><div><p>You can use this feature a number of times
      equal to your Wisdom modifier (a minimum of once). You regain all expended
      uses when you finish a long rest.</p><h3>Channel Divinity: Destructive
      Wrath</h3><p>Starting at 2nd level, you can use your Channel Divinity to
      wield the power of the storm with unchecked ferocity.</p><p>When you roll
      lightning or thunder damage, you can use your Channel Divinity to deal
      maximum damage, instead of rolling.</p><h3>Thunderbolt Strike</h3><p>At
      6th level, when you deal lightning damage to a Large or smaller creature,
      you can also push it up to 10 feet away from you.</p><h3>Divine
      Strike</h3><p>At 8th level, you gain the ability to infuse your weapon
      strikes with divine energy. Once on each of your turns when you hit a
      creature with a weapon attack, you can cause the attack to deal an extra
      1d8 thunder damage to the target. When you reach 14th level, the extra
      damage increases to 2d8.</p><h3>Stormborn</h3><p>At 17th level, you have a
      flying speed equal to your current walking speed whenever you are not
      underground or indoors.</p></div></div></div></div></div>
