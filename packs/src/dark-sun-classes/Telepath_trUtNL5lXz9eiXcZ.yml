  classIdentifier: psion
  description:
    value: "<div class=\"mb-2 ve-flex-col\"><p><i class=\"ve-muted\">Note: importing a class as an item is provided for display purposes only. If you wish to import a class to a character sheet, please use the importer on the sheet instead.</i></p><div><p><i>Master Tactics in the Landscape of the Mind</i></p></div><div class=\"rd__b  rd__b--0\"><div data-roll-name-ancestor=\"Telepath\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--1\"><h2 class=\"rd__h rd__h--1\" data-title-index=\"4\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p10\">Telepath</span></h2> <p>Telepaths are masters of mind magic. They use their psionic powers for all matters of the mind, whether they bolster the mental defenses of allies or probe the thoughts of others undetected. A telepath can be a bastion of psionic aid or a crafty manipulator.</p><div data-roll-name-ancestor=\"Level 3: Mind Infiltrator\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"5\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p10\">Level 3: Mind Infiltrator</span></h3> <p>When you cast <a href=\"https://5e.tools/spells.html#detect%20thoughts_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"spells.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"detect%20thoughts_xphb\">Detect Thoughts</a>, you can expend one Psionic Energy Die to modify the spell so that the spell doesn't require spell components or <a href=\"https://5e.tools/conditionsdiseases.html#concentration_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"conditionsdiseases.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"concentration_xphb\">Concentration</a>. In addition, when you use the Read Thoughts effect of the spell, the target doesn't know you're probing its mind if it fails the Wisdom saving throw.</p></div><div data-roll-name-ancestor=\"Level 3: Telepath Spells\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"6\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p10\">Level 3: Telepath Spells</span></h3> <p>When you reach a Psion level specified in the <a href=\"https://5e.tools/tables.html#telepath%20spells_xua2025psionupdate\" data-plut-hover=\"true\" data-plut-hover-page=\"tables.html\" data-plut-hover-source=\"XUA2025PsionUpdate\" data-plut-hover-hash=\"telepath%20spells_xua2025psionupdate\">Telepath Spells</a> table, you thereafter always have the listed spells prepared.</p><table class=\"rd__b-special rd__b-data  rd__b-data--stats\">\n\t\t<thead>\n\t\t\t<tr>\n\t\t\t\t<th class=\"rd__data-embed-header ve-text-left\" colspan=\"6\" data-rd-data-embed-header=\"true\">\n\t\t\t\t\t<div class=\"w-100 split-v-center\">\n\t\t\t\t\t\t<div class=\"ve-flex-v-center w-100 min-w-0\">\n\t\t\t\t\t\t\t<span class=\"rd__data-embed-name ve-hidden\">Telepath Spells</span>\n\t\t\t\t\t\t\t<span class=\"rd__data-embed-name-expanded ve-text-right pr-2 w-100 \"></span>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<span class=\"rd__data-embed-toggle\">[–]</span>\n\t\t\t\t\t</div>\n\t\t\t\t</th>\n\t\t\t</tr>\n\t\t</thead><tbody data-rd-embedded-data-render-target=\"true\"><tr>\n\t\t\t<td colspan=\"6\" data-rd-tag=\"table\" data-rd-uid=\"Telepath Spells|XUA2025PsionUpdate\" data-rd-page=\"tables.html\" data-rd-source=\"XUA2025PsionUpdate\" data-rd-hash=\"telepath%20spells_xua2025psionupdate\" data-rd-name=\"Telepath Spells\" data-rd-display-name=\"Telepath Spells\" data-rd-style data-rd-entry-data=\"{}\">\n\t\t\t\t<i>Loading <a href=\"https://5e.tools/tables.html#telepath%20spells_xua2025psionupdate\" data-plut-hover=\"true\" data-plut-hover-page=\"tables.html\" data-plut-hover-source=\"XUA2025PsionUpdate\" data-plut-hover-hash=\"telepath%20spells_xua2025psionupdate\">Telepath Spells</a>...</i>\n\t\t\t\t\n\t\t\t</td>\n\t\t</tr></tbody></table></div><div data-roll-name-ancestor=\"Level 3: Telepathic Distraction\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"7\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p10\">Level 3: Telepathic Distraction</span></h3> <p>When a creature you can see within range of your telepathy hits with an attack roll, you can take a <a href=\"https://5e.tools/variantrules.html#reaction_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"reaction_xphb\">Reaction</a> to roll one Psionic Energy Die and subtract the number rolled from attack roll, potentially causing the attack to miss. The die is expended only if the target misses the attack.</p></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 6: Bulwark Mind\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"8\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p10\">Level 6: Bulwark Mind</span></h3> <p>At the start of your turn, you can expend one Psionic Energy Die to strengthen your mind and enter a fortified state. For the next 10 minutes, you have <a href=\"https://5e.tools/variantrules.html#resistance_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"resistance_xphb\">Resistance</a> to Psychic damage; and whenever you make an Intelligence, Wisdom, or Charisma saving throw, you add a roll of your Psionic Energy Die to the save. Rolling the Psionic Energy Die doesn't expend it. You can't use this benefit if you have the &amp;Reference[condition=Incapacitated] condition.</p></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 6: Potent Thoughts\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"9\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p10\">Level 6: Potent Thoughts</span></h3> <p>You have <a href=\"https://5e.tools/variantrules.html#telepathy_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"telepathy_xphb\">Telepathy</a> with a range of 60 feet. In addition, you add your Intelligence modifier to the damage you deal with any Psion cantrip.</p></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 10: Telepathic Bolstering\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"10\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p10\">Level 10: Telepathic Bolstering</span></h3> <p>When you or a creature you can see within range of your <a href=\"https://5e.tools/variantrules.html#telepathy_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"telepathy_xphb\">Telepathy</a> fails an ability check or misses with an attack roll, you can take a <a href=\"https://5e.tools/variantrules.html#reaction_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"reaction_xphb\">Reaction</a> to expend one Psionic Energy Die. Roll the die and add the number rolled to the d20, potentially turning a failed check into a success or a miss into a hit. The Psionic Energy Die is expended only if the check succeeds or the attack hits.</p></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 14: Scramble Minds\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"11\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p10\">Level 14: Scramble Minds</span></h3> <p>You can cast <a href=\"https://5e.tools/spells.html#confusion_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"spells.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"confusion_xphb\">Confusion</a> without expending a spell slot by instead expending four Psionic Energy Dice. When you cast <a href=\"https://5e.tools/spells.html#confusion_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"spells.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"confusion_xphb\">Confusion</a> without a spell slot using this feature, you can modify the spell so that the radius of the spell's <a href=\"https://5e.tools/variantrules.html#sphere%20%5barea%20of%20effect%5d_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"sphere%20%5barea%20of%20effect%5d_xphb\">Sphere</a> becomes 30 feet and you can choose one creature you can see in the spell's area to automatically succeed on their saving throw against the spell.</p><p>In addition, when a creature under the effect of the spell starts its turn, you choose their behavior from the table for the turn instead of the creature rolling to determine its behavior.</p></div></div></div></div>"
