  description:
    value: >-
      <div class="ddb">

      <p>You have the power to control shadows, which is represented by your
      Shadow Motes. You can have as many Shadow Motes equal to your Rogue level
      and you can expend these motes to enhance or fuel certain Shadow Stalker
      features. You start knowing three such features: Shadow Scout, Shadow
      Swap, and Vexing Shadow, each of which is detailed below. When you expend
      a Shadow Mote, it is unavailable until you finish a Long Rest, at the end
      of which you regain all your expended motes. You also regain 1 expended
      Shadow Mote when you reduce a Hostile creature to 0 Hit Points.</p>

      <p><em><strong>Shadow Scout.</strong></em> As a Magic action, you can
      expend 1 Shadow Mote to project your senses through your Shadowy
      Reflection. For 1 minute, you can see and hear through it as if you were
      located where it is, and you can move it up to 120 feet away from you.
      This effect ends early if you take any damage or if you have the
      Incapacitated condition.</p>

      <p><em><strong>Shadow Swap.</strong></em> When you use your Cunning Action
      feature, as part of that Bonus Action, you can expend 1 Shadow Mote to
      swap places with your Shadowy Reflection. You teleport to its space, and
      it teleports to your space. If you appear in an occupied space, you are
      shunted to the nearest unoccupied space and take Force damage equal to the
      number of feet you are moved.</p>

      <p><em><strong>Vexing Shadow.</strong></em> Immediately after you hit a
      creature with an attack roll using a weapon and your Shadowy Reflection is
      within 5 feet of that creature, you can expend 1 Shadow Mote to gain the
      Invisible condition against that creature until the end of your next
      turn.</p>

      </div>
    chat: >-
      <div class="ddb">

      You gain the power to control shadows represented by your Shadow Motes.
      You can have as + [[@classes.rogue.levels]], and you can expend these
      motes to enhance or fuel the following features.


      As a Magic action, you can expend 1 Shadow Mote to project your senses
      through your Shadowy Reflection. For 1 min, you can see and hear through
      it as if you were located where it is, and you can move it up to 120 ft
      away from you. This effect ends early if you take any damage or if you
      have the Incapacitated condition.


      When you use your Cunning Action feature, as part of that Bonus Action,
      you can expend 1 Shadow Mote to swap places with your Shadowy Reflection.
      You teleport to its space, and it teleports to your space. If you appear
      in an occupied space, you are shunted to the nearest unoccupied space and
      take Force damage equal to the number of feet you are moved.


      Immediately after you hit a creature with an attack roll using a weapon
      and your Shadowy Reflection is within 5 ft of that creature, you can
      expend 1 Shadow Mote to gain the Invisible condition against that creature
      until the end of your next turn.


      You also regain all Shadow Motes after a long rest and regain 1 expended
      Shadow Mote when you reduce a Hostile creature to 0 Hit Points.

      </div>
