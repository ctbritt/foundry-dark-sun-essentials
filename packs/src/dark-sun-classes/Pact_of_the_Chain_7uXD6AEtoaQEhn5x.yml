name: Pact of the Chain
type: feat
system:
  description:
    value: >-
      <p>You learn the @UUID[Compendium.dnd5e.spells.Item.JGT5bNqu9REL7Fuz]{Find
      Familiar} spell and can cast it as a ritual. The spell doesn't count
      against your number of spells known. When you cast the spell, you can
      choose one of the normal forms for your familiar or one of the following
      special forms:
      @UUID[Compendium.dnd5e.monsters.Actor.dLQiESMsfsXijD5c]{Imp},
      pseudodragon,
      @UUID[Compendium.dnd5e.monsters.Actor.bwtkdzavdNHISgp4]{Quasit}, or
      @UUID[Compendium.dnd5e.monsters.Actor.MUpBNDoJEr09bLaO]{Sprite}.</p><p>Additionally,
      when you take the Attack action, you can forgo one of your own attacks to
      allow your familiar to make one attack of its own with its reaction.</p>
