  description:
    value: "<div class=\"ddb\">\n<div class=\"ddb\">\n<p>Starting at 6th level, your psionic power can surge unpredictably during your rage. When you rage, roll a d6. The result determines the psionic effect below. You can use this feature once per rage and cannot change the effect while raging.</p>\n<p><span style=\"font-weight:bold;letter-spacing:0px\">Wild\_Surge Effects</span></p>\n<div class=\"table-overflow-wrapper\">\n<table class=\"compendium-left-aligned-table\">\n<thead>\n<tr>\n<th>d6</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>\n<p>Mind Blast: As an action, unleash a psychic wave in a 15-foot cone. Each creature in that area must make an Intelligence saving throw (DC = 8 + your proficiency bonus + your Constitution modifier) or take 2d8 psychic damage and be stunned until the end of your next turn.</p>\n</td>\n</tr>\n<tr>\n<td>2</td>\n<td>\n<p>Telekinetic Push: As a bonus action, push one creature you can see within 30 feet. The target must succeed on a Strength saving throw (DC = 8 + your proficiency bonus + your Constitution modifier) or be pushed 20 feet away from you.</p>\n</td>\n</tr>\n<tr>\n<td>3</td>\n<td>\n<p>Psychic Armor: As a reaction, give yourself a bonus to AC equal to your Constitution modifier until the start of your next turn.</p>\n</td>\n</tr>\n<tr>\n<td>4</td>\n<td>\n<p>Psychic Reflexes: As a reaction when hit by an attack, halve the attack’s damage against you.</p>\n</td>\n</tr>\n<tr>\n<td>5</td>\n<td>\n<p>Mind Over Matter: As a bonus action, gain temporary hit points equal to 1d10 + your barbarian level.</p>\n</td>\n</tr>\n<tr>\n<td>6</td>\n<td>\n<p>Mind Spike: As a bonus action, choose one creature you can see within 60 feet. That creature takes psychic damage equal to 1d8 + your proficiency bonus and has disadvantage on its next attack roll.</p>\n</td>\n</tr>\n</tbody>\n</table><div id=\"table-link\">@UUID[Compendium.shareddata.ddb-tables.RollTable.yacx7xXN0zW8TihK]{Open RollTable Wild Surge: Wild\_Surge Effects}</div>\n</div>\n</div>\n</div>"
    chat: >-
      <div class="ddb">

      <div class="ddb">

      Starting at 6th level, your psionic power can surge unpredictably during
      your rage. When you rage, roll a d6. The result determines the psionic
      effect below. You can use this feature once per rage and cannot change the
      effect while raging.

      </div>

      </div>
