  - name: 'Ambush Master: Initiative'
    img: icons/magic/nature/stealth-hide-eyes-green.webp
    origin: Compendium.dark-sun-essentials.dark-sun-classes.Item.Q0YOmNJJJfQCvauo
    transfer: false
