      changes:
        - key: system.attributes.init.bonus
          value: 5
          priority: 20
          type: add
    disabled: false
    duration:
      value: null
      units: seconds
      expiry: null
      expired: false
    description: >-
      <p>Starting at 13th level, you excel at leading ambushes. If any of your
      foes are surprised, you can use a bonus action on your turn in the first
      round of the combat to grant each ally who can see you a +5 bonus to
      initiative that lasts until the combat ends. If the initiative bonus would
      increase an ally’s initiative above yours, the ally’s initiative instead
      equals your initiative.</p><p class="p1">Each of the allies also receives
      a 10-foot increase to speed that lasts until the end of the ally’s next
      turn.</p>
