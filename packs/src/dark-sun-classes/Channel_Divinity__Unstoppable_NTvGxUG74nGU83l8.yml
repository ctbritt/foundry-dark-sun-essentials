name: 'Channel Divinity: Unstoppable'
type: feat
system:
  description:
    value: >-
      <p>The cleric may use their Channel Divinity as a reaction when struck by
      any effect that causes them to become
      &amp;Reference[paralyzed]{paralyzed}, &amp;Reference[prone]{prone}, or
      &amp;Reference[restrained]{restrained}, or when affected by any force or
      ability that would move them against their will. The cleric immediately
      shakes off the effect as if it never happened.</p><details><summary>More
      Details</summary><p></p><p><span class="fontstyle0">At 2nd level, the
      cleric may use their Channel Divinity as a reaction when struck by any
      effect that causes them to become &amp;Reference[paralyzed]{paralyzed},
      &amp;Reference[prone]{prone}, or &amp;Reference[restrained]{restrained},
      or when affected by any &amp;Reference[force]{force} or ability that would
      move them against their will. The cleric immediately shakes off the effect
      as if it never happened.</span></p><p></p></details>
