  description:
    value: "<div class=\"ddb\">\n<p class=\"Core-Styles_Core-Body\">Beginning at 13th level, your senses are almost impossible to foil. As an action, you sense the presence of illusions, shapechangers not in their original form, and other magic designed to deceive the senses within 30 feet of you, provided you aren’t blinded\_or\_deafened. You sense that an effect is attempting to trick you, but you gain no insight into what is hidden or into its true nature.</p>\n<p class=\"Core-Styles_Core-Body\">You can use this feature a number of times equal to your Wisdom modifier (minimum of once), and you regain all expended uses of it when you finish a long rest.</p>\n</div>"
    chat: >-
      <div class="ddb">

      As an action, you sense the presence of illusions, shapechangers not in
      their original form, and other magic designed to deceive the senses within
      30 ft. of you, if you aren’t blinded or deafened. You can use this feature
      [[max( + @abilities.wis.mod, 1)]] times per long rest.

      </div>
