  description:
    value: >-
      <div class="ddb"><p>Beginning at 13th level, you start to attract agents
      in every bigger settlement you've made business in. These agents are
      individuals of exceptional ability and can do your business for you and
      will protect your investments. Your agent will usually have a competent
      bodyguard. In addition your agents will provide a secured lodging for you
      and your associates in any of those settlements.</p><p
      class="p1">Additionally, you can sometimes cause another creature to
      suffer an attack meant for you. When you are targeted by an attack while a
      creature within 5 feet of you is granting you cover against that attack,
      you can use your reaction to have the attack target that creature instead
      of you.</p></div>
    chat: >-
      <div class="ddb">

      When you are targeted by an attack while a creature within 5 ft. is
      granting you cover against that attack, you can use your reaction to have
      the attack target that creature instead of you.

      </div>
