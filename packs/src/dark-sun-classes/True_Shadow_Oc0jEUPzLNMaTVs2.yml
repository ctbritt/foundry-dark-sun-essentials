  description:
    value: >-
      <div class="ddb">

      <p>Your Shadowy Reflection gains the ability to become a deadly clone of
      you. As a Bonus Action, your Shadowy Reflection transforms into an exact
      duplicate of you.</p>

      <p>For 1 hour, your Shadowy Reflection becomes substantial, and you can
      have it take the Attack, Hide, or Utilize action by controlling it with
      your Shadowy Reflection feature. Its Attack action uses your game
      statistics, including class features, feats, and weapons. It vanishes when
      reduced to 0 Hit Points.</p>

      <p>When you make an attack roll against a creature within 5 feet of the
      duplicate, the attack roll has Advantage.</p>

      <p>Once you use this feature, you can’t do so again until you finish a
      Long Rest.</p>

      </div>
    chat: >-
      <div class="ddb">

      As a Bonus Action, your Shadowy Reflection transforms into an exact
