name: Barbarian (Athas)
type: class
img: modules/dnd-players-handbook/assets/icons/classes/barbarian.webp
system:
  description:
    value: "<blockquote><p>A Fierce Warrior of Primal Rage</p></blockquote><h3>Core Barbarian Traits</h3><table class=\"core-class-traits\"><tbody><tr><th scope=\"row\"><p>Primary Ability</p></th><td><p>Strength</p></td></tr><tr><th><p><strong>Hit Point Die</strong></p></th><td><p>D12 per Barbarian level</p></td></tr><tr><th><p><strong>Saving Throw Proficiencies</strong></p></th><td><p>Strength and Constitution</p></td></tr><tr><th><p><strong>Skill Proficiencies</strong></p></th><td><p><em>Choose 2:</em> Animal Handling, Athletics, Intimidation, Nature, Perception, or Survival</p></td></tr><tr><th><p><strong>Weapon Proficiencies</strong></p></th><td><p>Simple and Martial\_weapons</p></td></tr><tr><th><p><strong>Armor Training</strong></p></th><td><p>Light and Medium armor and Shields</p></td></tr><tr><th><p></p></th><td><p></p></td></tr></tbody></table><p>Brutality is a way of life in Athas, as much in some of the cities as in the dwindling tribes living out in the wastelands. Cannibal headhunting halflings (who occasionally visit Urik from the Forest Ridge) express shock at the savagery and bloodshed of the folk who call themselves \"civilized\" and live between walls of stone. They would be more horrified if they were to see the skull piles of Draj, experience the Red Moon Hunt in Gulg, or watch a seemingly docile house slave in Raam rage as they finally \"go feral,\" taking out every frustration of their short, cruel life on whoever happens to be closest at hand. Some on Athas have turned their brutality into an art of war. They are known as \"barbarians,\" and they wear the name with pride.</p><h2>PRIMAL PATHS</h2><p>Barbarians in a Dark Sun campaign can choose from the following options: Path of the Berserker, Path of the Totem Warrior. They can also choose the Path of the Pit Fighter or Path of the Wilder, described here.</p><h2>PATH OF THE PIT FIGHTER</h2><p>Pit fighters tend to be some of the strongest, toughest, and most dangerous adversaries in the arena. Battling for survival has been the only constant in their violent lives; they have little to lose or gain except their lives. Usually regarded as property to be bought and sold, these brutal warriors have nothing to fear and always lunge into battle.</p><h3>BRAWLER</h3><p>When you choose this path at 3rd level, you gain several benefits that make you more effective in unarmed combat.</p><ul><li><p>You can roll a d4 in place of the normal damage of your unarmed strike. This die improves as you gain barbarian levels, increasing at 6th level (d6), 12th level (d8), and 18th level (d10).</p></li><li><p>When you use the Attack action to make an unarmed strike or attempt a grapple, you can make one unarmed strike as a bonus action.</p></li></ul><h3>RECKLESS ABANDON</h3><p>Starting at 6th level, when you use Reckless Attack while raging, you also gain temporary hit points equal to your Constitution modifier (minimum of 1). They vanish if any remain when your rage ends.</p><h3>RAGING CHARGE</h3><p>Beginning at 10th level, you can take the Dash action as a bonus action while raging.</p><h3>EYE FOR AN EYE</h3><p>Starting at 14th level, when you take damage from a creature within 5 feet of you, you can use your reaction to make an unarmed attack against that creature. You must have a free hand.</p><h2>PATH OF THE WILDER</h2><p>The Path of the Wilder channels the raw, unrefined power of the mind into physical prowess and fury. Drawing inspiration from ancient psionic traditions, Wilders unleash their inner psychic energy in unpredictable bursts, amplifying their rage with psychic abilities.</p><h3>PSIONIC RAGE</h3><p>Beginning at 3rd level, your rage taps into psionic energy.</p><ul><li><p>You gain resistance to psychic damage and advantage against psionic effects.</p></li><li><p>Once per turn, when you hit a creature with a melee weapon attack, you can deal extra psychic damage equal to your proficiency bonus.</p></li></ul><h3>WILD SURGE</h3><p>Starting at 6th level, your psionic power can surge unpredictably during your rage. When you rage, roll a d6. The result determines the psionic effect below. You can use this feature once per rage and cannot change the effect while raging.</p><table><tbody><tr><th colspan=\"2\" data-colwidth=\"75,0\"><p>Wild Surge Effects</p></th></tr><tr><th data-colwidth=\"75\"><p>Roll</p></th><th><p>Effect</p></th></tr><tr><td data-colwidth=\"75\"><p style=\"text-align:center\"><strong>1</strong></p></td><td><p><strong>Mind Blast:</strong> As an action, unleash a psychic wave in a 15-foot cone. Each creature in that area must make an Intelligence saving throw (DC = 8 + your proficiency bonus + your Constitution modifier) or take 2d8 psychic damage and be stunned until the end of your next turn.</p></td></tr><tr><td data-colwidth=\"75\"><p style=\"text-align:center\"><strong>2</strong></p></td><td><p><strong>Telekinetic Push:</strong> As a bonus action, push one creature you can see within 30 feet. The target must succeed on a Strength saving throw (DC = 8 + your proficiency bonus + your Constitution modifier) or be pushed 20 feet away from you.</p></td></tr><tr><td data-colwidth=\"75\"><p style=\"text-align:center\"><strong>3</strong></p></td><td><p><strong>Psychic Armor:</strong> As a reaction, give yourself a bonus to AC equal to your Constitution modifier until the start of your next turn.</p></td></tr><tr><td data-colwidth=\"75\"><p style=\"text-align:center\"><strong>4</strong></p></td><td><p><strong>Psychic Reflexes:</strong> As a reaction when hit by an attack, halve the attack's damage against you.</p></td></tr><tr><td data-colwidth=\"75\"><p style=\"text-align:center\"><strong>5</strong></p></td><td><p><strong>Mind Over Matter:</strong> As a bonus action, gain temporary hit points equal to 1d10 + your barbarian level.</p></td></tr><tr><td data-colwidth=\"75\"><p style=\"text-align:center\"><strong>6</strong></p></td><td><p><strong>Mind Spike:</strong> As a bonus action, choose one creature you can see within 60 feet. That creature takes psychic damage equal to 1d8 + your proficiency bonus and has disadvantage on its next attack roll.</p></td></tr></tbody></table><h3>FOCUSED RAGE</h3><p>At 10th level, you can focus your psionic energy to maintain control over your wild surges. When you roll for your Wild Surge, you can roll twice and pick either result. Additionally, your psychic damage while raging increases to 1d6 + your proficiency bonus.</p><h3>PSIONIC MASTERY</h3><p>At 14th level, you have mastered your wild psionic powers and physical rage. When you enter a rage, you can choose the effect of your Wild Surge instead of rolling. Additionally, your psychic damage while raging increases to 1d8 + your proficiency bonus.</p><h3>TOTEM WARRIOR SPIRITS ON ATHAS</h3><p>Most of the animals listed as totems in the <em>Player's Handbook</em> and <em>Sword Coast Adventurer's Guide</em> have gone extinct on Athas. Dark Sun barbarians substitute the following creatures:</p><h4><strong>Player's Handbook</strong></h4><ul><li><p><strong>Klar (Bear):</strong> Massive beasts resembling Kodiak bears with chitinous plates covering their backs and claws like curved daggers.</p></li><li><p><strong>Kes'trekel (Eagle):</strong> Carrion eaters, considered harbingers of death by nomads. They resemble large black vultures with vicious hooked beaks.</p></li><li><p><strong>Dagorran (Wolf):</strong> Reptilian predators feared for tracking prey via psychic signatures.</p></li></ul><h4><strong>Sword Coast Adventurer's Guide</strong></h4><ul><li><p><strong>Sygra (Elk):</strong> Nimble herd beasts resembling small horses with curving antlers.</p></li><li><p><strong>Kirre (Tiger):</strong> Eight-legged great cats from the Forest Ridge, equipped with claws, fangs, horns, and spiked tails.</p></li></ul><p class=\"p1\">These totem abilities below are reprinted from the <em>Sword Coast Adventurer’s Guide</em>.</p><ul><li><p class=\"p3\"><strong>Sygra (Elk):</strong> While you’re raging and aren’t wearing heavy armor, your walking speed increases by 15 feet. The spirit of the elk makes you extraordinarily swift.</p></li><li><p class=\"p3\"><strong>Kirre (Tiger):</strong> While raging, you can add 10 feet to your long jump distance and 3 feet to your high jump distance. The spirit of the tiger empowers your leaps.</p></li></ul><h4><strong>ASPECT OF THE BEAST</strong></h4><p class=\"p1\">These options are available to you when you choose a totem animal at 6th level.</p><ul><li><p class=\"p3\"><strong>Sygra (Elk):</strong> Whether mounted or on foot, your travel pace is doubled, as is the travel pace of up to ten companions while they’re within 60 feet of you and you’re not incapacitated (see Chapter 8 in the <em>Player’s Handbook</em> for more information about travel pace). The elk spirit helps you roam far and fast.</p></li><li><p class=\"p3\"><strong>Kirre (Tiger):</strong> You gain proficiency in two skills from the following list: Athletics, Acrobatics, Stealth, and Survival. The cat spirit hones your survival instincts.</p></li></ul><h4><strong>TOTEMIC ATTUNEMENT</strong></h4><p class=\"p1\">These options are available to you when you choose a totem animal at 14th level.</p><ul><li><p class=\"p3\"><strong>Sygra (Elk):</strong> While raging, you can use a bonus action during your move to pass through the space of a large or smaller creature. That creature must succeed on a Strength saving throw (DC 8 + your Strength modifier + your proficiency bonus) or be knocked prone and take bludgeoning damage equal to 1d12 + your Strength modifier.</p></li><li><p class=\"p3\"><strong>Kirre (Tiger):</strong> While you’re raging, if you move at least 20 feet in a straight line toward a large or smaller target right before making a melee weapon attack against it, you can use a bonus action to make an additional melee weapon attack against it.</p></li></ul>"
    chat: ''
