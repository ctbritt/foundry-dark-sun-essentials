name: Stone Ward
type: feat
system:
  description:
    value: >-
      As a reaction when you or a creature you can see within 30 feet of you
      suffers a critical hit, you can turn that hit into a normal hit. Any
      effects triggered by a critical hit are canceled. You can use this feature
      + [[@abilities.wis.mod]] times. You regain all expended uses when you
      finish a long rest.
        <details>
          <summary>
            More Details
          </summary>
          <p>
            </p><p class="Core-Styles_Core-Body">At 6th level, you gain the ability to impart the sturdiness of the earth to those around you. As a reaction when you or a creature you can see within 30 feet of you suffers a critical hit, you can turn that hit into a normal hit. Any effects triggered by a critical hit are canceled.</p>
      <p class="Core-Styles_Core-Body">You can use this feature a number of
      times equal to your &amp;Reference[wis]{Wisdom} modifier (minimum of
      once). You regain all expended uses when you finish a long rest.</p>
          <p></p>
        </details>
