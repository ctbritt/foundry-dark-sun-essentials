  description:
    value: >-
      <div class="ddb">

      <p>Starting at 17th level, your thoughts can’t be read by telepathy or
      other means, unless you allow it. You can present false thoughts by
      succeeding on a Charisma (Deception) check contested by the mind reader’s
      Wisdom (Insight) check.</p>

      <p>Additionally, no matter what you say, magic that would determine if you
      are telling the truth indicates you are being truthful if you so choose,
      and you can’t be compelled to tell the truth by magic.</p>

      </div>
