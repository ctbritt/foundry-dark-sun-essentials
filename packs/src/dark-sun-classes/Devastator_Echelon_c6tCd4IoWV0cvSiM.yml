  description:
    value: >-
      <blockquote><p>Insidious Spellcasters Who Drain
      Life</p></blockquote><p>Devastator templars are insidious spellcasters
      that use destructive magic to drain the life of their enemies. Spells cast
      by a devastator rip apart the mind and body of the target, wracking them
      with pain and dread. Many devastator imprison are also defilers and revel
      in destruction, sanctioned to use these abilities in service of their
      tyrannical leader.</p>
