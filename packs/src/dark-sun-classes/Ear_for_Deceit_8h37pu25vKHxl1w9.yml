  itemacro:
    macro:
      _id: null
      name: Ear for Deceit
      type: script
      author: Tyd5yiqWrRZMvG30
      img: icons/svg/dice-target.svg
      scope: global
      command: >-
        async function wait(ms) { return new Promise(resolve => {
        setTimeout(resolve, ms); }); }

        const lastArg = args[args.length - 1];

        const version = Math.floor(game.version);

        let tactor;

        if (lastArg.tokenId) tactor = canvas.tokens.get(lastArg.tokenId).actor;

        else tactor = game.actors.get(lastArg.actorId);

        const playerSkill = "ins";

        const itemD = lastArg.item;


        if (args[0].tag === "OnUse") {
            let choice = false;
            await new Dialog({
                title: itemD.name,
                content: `${CONFIG.DND5E.skills[playerSkill]} Skill Check`,
                buttons: {
                    advantage: { label: "Advantage", callback: () => choice = "adv" },
                    normal: { label: "Normal", callback: () => choice = "norm" },
                    disadvantage: { label: "Disadvantage", callback: () => choice = "dis" }
                },
                default: "norm",
                close: async (html) => {
                    if (!choice) return;
                    let advChoice = { chatMessage: false, fastForward: true };
                    if (choice === "adv") advChoice["advantage"] = true;
                    else if (choice === "dis") advChoice["disadvantage"] = true;
                    const playerCheck = await MidiQOL.socket().executeAsGM("rollAbility", { request: "skill", targetUuid: tactor.uuid, ability: playerSkill, options: advChoice });
                    await game.dice3d?.showForRoll(playerCheck);
                    await updateChat(playerCheck, choice);
                    return;
                }
            }).render(true);
            async function updateChat(playerCheck, choice) {
                let rollAdv = choice === "adv" ? " advantage" : choice === "dis" ? " disadvantage" : "";
                let playerRoll = playerCheck.terms[0].results.reduce((acc, item) => acc += `<li class="roll die d20${rollAdv}${item.active ? "" : " hidden"}">${item.result}</li>`, ``);
                let rollResults = `<div class="dice-roll"><div class="dice-result"><div class="dice-formula">${playerCheck.formula}</div><div class="dice-tooltip"><section class="tooltip-part"><div class="dice"><span class="part-formula">${playerCheck.formula}</span><span class="part-total">${playerCheck.total}</span></header><ol class="dice-rolls">${playerRoll}</ol></div></section></div><h4 class="dice-total">${Math.max(8, playerCheck.total)}</h4></div></div>`;
                let targetInfo = `<div class="midi-qol-nobox midi-qol-bigger-text">${rollResults}</div>`;
                let chatMessage = await game.messages.get(lastArg.itemCardId);
                let content = await duplicate((version > 9 ? chatMessage.content : chatMessage.data.content));
                let searchString = /<div class="midi-qol-hits-display">[\s\S]*<div class="end-midi-qol-hits-display">/g;
                let replaceString = `<div class="midi-qol-hits-display"><div class="end-midi-qol-hits-display">${targetInfo}`;
                content = await content.replace(searchString, replaceString);
                await chatMessage.update({ content: content });
                await ui.chat.scrollBottom();
            }
        }
