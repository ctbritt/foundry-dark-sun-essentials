  description:
    value: "<div class=\"ddb\"><h1>Description</h1><p>A scoundrel who uses stealth and trickery to overcome obstacles and enemies</p><p><span class=\"characters-statblock\" style=\"font-family:'Roboto Condensed';font-size:14px\"><strong>Hit Die:</strong> d8<br /><strong>Primary Ability:</strong> Dexterity<br /><strong>Saves:</strong>\_Dexterity &amp; Intelligence</span></p><h1>Class Features</h1><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.8h37pu25vKHxl1w9]{Level 3: Ear for Deceit}</strong></p><p>When you choose this archetype at 3rd level, you develop a talent for picking out lies. Whenever you make a Wisdom (Insight) check to determine whether a creature is lying, treat a roll of 7 or lower on the d20 as an 8.</p><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.yiRK26yaTMcojMC9]{Level 3: Eye for Detail}</strong></p><p>Starting at 3rd level, you can use a bonus action to make a Wisdom (Perception) check to spot a hidden creature or object or to make an Intelligence (Investigation) check to uncover or decipher clues.</p><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.5ibA3JZ4R0g8ZMd6]{Level 3: Insightful Fighting}</strong></p><p class=\"Core-Styles_Core-Body\">At 3rd level, you gain the ability to decipher an opponent’s tactics and develop a counter to them. As a bonus action, you can make a Wisdom (Insight) check against a creature you can see that isn’t incapacitated, contested by the target’s Charisma (Deception) check. If you succeed, you can use your Sneak Attack against that target even if you don’t have advantage on the attack roll, but not if you have disadvantage on it.</p><p class=\"Core-Styles_Core-Body\">This benefit lasts for 1 minute or until you successfully use this feature against a different target.</p><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.CfS88BtBy1G5xAM9]{Level 9: Steady Eye}</strong></p><p>Starting at 9th level, you have advantage on any Wisdom (Perception) or Intelligence (Investigation) check if you move no more than half your speed on the same turn.</p><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.zFnjhBVcRUKQ1XnD]{Level 13: Unerring Eye}</strong></p><p class=\"Core-Styles_Core-Body\">Beginning at 13th level, your senses are almost impossible to foil. As an action, you sense the presence of illusions, shapechangers not in their original form, and other magic designed to deceive the senses within 30 feet of you, provided you aren’t blinded\_or\_deafened. You sense that an effect is attempting to trick you, but you gain no insight into what is hidden or into its true nature.</p><p class=\"Core-Styles_Core-Body\">You can use this feature a number of times equal to your Wisdom modifier (minimum of once), and you regain all expended uses of it when you finish a long rest.</p><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.4gGOxHBtK7c33y2B]{Level 17: Eye for Weakness}</strong></p><p>At 17th level, you learn to exploit a creature’s weaknesses by carefully studying its tactics and movement. While your Insightful Fighting feature applies to a creature, your Sneak Attack damage against that creature increases by 3d6.</p></div>"
