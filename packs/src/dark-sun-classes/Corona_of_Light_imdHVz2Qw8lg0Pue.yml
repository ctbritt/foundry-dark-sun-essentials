  description:
    value: >-
      <p>Starting at 17th level, you can use your action to activate an aura of
      sunlight that lasts for 1 minute or until you dismiss it using another
      action. You emit bright light in a 60-foot radius and dim light 30 feet
      beyond that. Your enemies in the Bright Light have Disadvantage on saving
      throws against your Radiance of the Dawn and any spell that deals Fire or
      Radiant damage.</p><p>You can use this feature a number of times equal to
      your Wisdom modifier (minimum of once), and you regain all expended uses
      when you finish a Long Rest.</p>
