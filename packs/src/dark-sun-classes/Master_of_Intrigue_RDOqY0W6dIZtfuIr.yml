  description:
    value: >-
      <div class="ddb"><p class="Core-Styles_Core-Body">When you choose this
      archetype at 3rd level, you gain proficiency with the disguise kit, the
      forgery kit, and one gaming set of your choice. You also You also learn to
      read and write in Cavilish (Merchants script) and two languages of your
      choice.</p><p class="Core-Styles_Core-Body">Additionally, you can
      unerringly mimic the speech patterns and accent of a creature that you
      hear speak for at least 1 minute, enabling you to pass yourself off as a
      native speaker of a particular land, provided that you know the
      language.</p></div>
