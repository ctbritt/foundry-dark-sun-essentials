  classIdentifier: psion
  description:
    value: "<div class=\"mb-2 ve-flex-col\"><p><i class=\"ve-muted\">Note: importing a class as an item is provided for display purposes only. If you wish to import a class to a character sheet, please use the importer on the sheet instead.</i></p><div><p><i>Mold Psionic Force for Creation and Destruction</i></p></div><div class=\"rd__b  rd__b--0\"><div data-roll-name-ancestor=\"Psykinetic\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--1\"><h2 class=\"rd__h rd__h--1\" data-title-index=\"4\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p9\">Psykinetic</span></h2> <p>A Psykinetic controls their psionic powers like a malleable force. They bend their telekinetic energies into sturdy barriers and strike with the force of a battering ram.</p><div data-roll-name-ancestor=\"Level 3: Psykinetic Spells\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"5\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p9\">Level 3: Psykinetic Spells</span></h3> <p>When you reach a Psion level specified in the <a href=\"https://5e.tools/tables.html#psykinetic%20spells_xua2025psionupdate\" data-plut-hover=\"true\" data-plut-hover-page=\"tables.html\" data-plut-hover-source=\"XUA2025PsionUpdate\" data-plut-hover-hash=\"psykinetic%20spells_xua2025psionupdate\">Psykinetic Spells</a> table, you thereafter always have the listed spells prepared.</p><table class=\"rd__b-special rd__b-data  rd__b-data--stats\">\n\t\t<thead>\n\t\t\t<tr>\n\t\t\t\t<th class=\"rd__data-embed-header ve-text-left\" colspan=\"6\" data-rd-data-embed-header=\"true\">\n\t\t\t\t\t<div class=\"w-100 split-v-center\">\n\t\t\t\t\t\t<div class=\"ve-flex-v-center w-100 min-w-0\">\n\t\t\t\t\t\t\t<span class=\"rd__data-embed-name ve-hidden\">Psykinetic Spells</span>\n\t\t\t\t\t\t\t<span class=\"rd__data-embed-name-expanded ve-text-right pr-2 w-100 \"></span>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<span class=\"rd__data-embed-toggle\">[–]</span>\n\t\t\t\t\t</div>\n\t\t\t\t</th>\n\t\t\t</tr>\n\t\t</thead><tbody data-rd-embedded-data-render-target=\"true\"><tr>\n\t\t\t<td colspan=\"6\" data-rd-tag=\"table\" data-rd-uid=\"Psykinetic Spells|XUA2025PsionUpdate\" data-rd-page=\"tables.html\" data-rd-source=\"XUA2025PsionUpdate\" data-rd-hash=\"psykinetic%20spells_xua2025psionupdate\" data-rd-name=\"Psykinetic Spells\" data-rd-display-name=\"Psykinetic Spells\" data-rd-style data-rd-entry-data=\"{}\">\n\t\t\t\t<i>Loading <a href=\"https://5e.tools/tables.html#psykinetic%20spells_xua2025psionupdate\" data-plut-hover=\"true\" data-plut-hover-page=\"tables.html\" data-plut-hover-source=\"XUA2025PsionUpdate\" data-plut-hover-hash=\"psykinetic%20spells_xua2025psionupdate\">Psykinetic Spells</a>...</i>\n\t\t\t\t\n\t\t\t</td>\n\t\t</tr></tbody></table></div><div data-roll-name-ancestor=\"Level 3: Stronger Telekinesis\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"6\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p9\">Level 3: Stronger Telekinesis</span></h3> <p>When you cast <a href=\"https://5e.tools/spells.html#mage%20hand_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"spells.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"mage%20hand_xphb\">Mage Hand</a>, its range increases by 30 feet when you cast it, and the hand can carry up to 20 pounds.</p></div><div data-roll-name-ancestor=\"Level 3: Telekinetic Techniques\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"7\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p9\">Level 3: Telekinetic Techniques</span></h3> <p>When you use <a href=\"https://5e.tools/classes.html#psion_xua2025psionupdate,state:feature=s0-0\" data-plut-hover=\"true\" data-plut-hover-page=\"classfeature\" data-plut-hover-source=\"XUA2025PsionUpdate\" data-plut-hover-hash=\"telekinetic%20propel_psion_xua2025psionupdate_1_xua2025psionupdate\">Telekinetic Propel</a>, you can roll 1d4 and use the number rolled instead of expending a Psionic Energy Die. In addition, when a target fails the saving throw against your Telekinetic Propel, you can impose one of the following effects on that target.</p><ul class=\"rd__list rd__list-no-bullets\"><li class=\"rd__li \"><p class=\"rd__p-list-item\" data-roll-name-ancestor=\"Boost\"><span class=\"bold rd__list-item-name\">Boost.</span> The target's <a href=\"https://5e.tools/variantrules.html#speed_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"speed_xphb\">Speed</a> increases by 10 feet until the start of your next turn.</p></li><li class=\"rd__li \"><p class=\"rd__p-list-item\" data-roll-name-ancestor=\"Disorient\"><span class=\"bold rd__list-item-name\">Disorient.</span> The target can't make <a href=\"https://5e.tools/actions.html#opportunity%20attack_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"actions.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"opportunity%20attack_xphb\">Opportunity Attacks</a> until the start of its next turn.</p></li><li class=\"rd__li \"><p class=\"rd__p-list-item\" data-roll-name-ancestor=\"Telekinetic Bolt\"><span class=\"bold rd__list-item-name\">Telekinetic Bolt.</span> The target takes Force damage equal to the number rolled on the Psionic Energy Die.</p></li></ul></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 6: Destructive Trance\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"8\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p9\">Level 6: Destructive Trance</span></h3> <p>At the start of your turn, you can expend one Psionic Energy Die to enter a destructive state. For the next 10 minutes, you gain a <a href=\"https://5e.tools/variantrules.html#fly%20speed_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"fly%20speed_xphb\">Fly Speed</a> of 20 feet and can hover, and when you cast a Psion spell that expends a spell slot, you can roll your Psionic Energy Die and add the number rolled to one damage roll of that spell. This roll doesn't expend the Psionic Energy Die.</p></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 6: Rebounding Field\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"9\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p9\">Level 6: Rebounding Field</span></h3> <p>When you cast <a href=\"https://5e.tools/spells.html#shield_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"spells.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"shield_xphb\">Shield</a> in response to being hit by an attack roll and cause the triggering attack to miss, you can expend one Psionic Energy Die to launch the force back at the attacker. The attacker makes a Dexterity saving throw. Roll two Psionic Energy Dice. On a failed save, the attacker takes Force damage equal to the amount rolled plus your Intelligence modifier. On a successful save, the attacker takes half as much damage only. Whether the target fails or succeeds on the saving throw, you gain <a href=\"https://5e.tools/variantrules.html#temporary%20hit%20points_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"temporary%20hit%20points_xphb\">Temporary Hit Points</a> equal to the amount of damage dealt.</p></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 10: Enhanced Telekinetic Crush\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"10\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p9\">Level 10: Enhanced Telekinetic Crush</span></h3> <p>When you cast <a href=\"https://5e.tools/spells.html#telekinetic%20crush_xua2025psionupdate\" data-plut-hover=\"true\" data-plut-hover-page=\"spells.html\" data-plut-hover-source=\"XUA2025PsionUpdate\" data-plut-hover-hash=\"telekinetic%20crush_xua2025psionupdate\">Telekinetic Crush</a>, you can expend one Psionic Energy Die to modify the spell so that whether a creature fails or succeeds on the saving throw against the spell, its <a href=\"https://5e.tools/variantrules.html#speed_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"speed_xphb\">Speed</a> is halved until the start of your next turn. In addition, you can roll the expended Psionic Energy Die and add the number rolled to one damage roll of the spell.</p></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 14: Heightened Telekinesis\" data-source=\"XUA2025PsionUpdate\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"11\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: Psion Update, p9\">Level 14: Heightened Telekinesis</span></h3> <p>You can cast <a href=\"https://5e.tools/spells.html#telekinesis_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"spells.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"telekinesis_xphb\">Telekinesis</a> without expending a spell slot by instead expending four Psionic Energy Dice. When you cast <a href=\"https://5e.tools/spells.html#telekinesis_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"spells.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"telekinesis_xphb\">Telekinesis</a> without expending a spell slot using this feature, you can modify the spell so that it doesn't require <a href=\"https://5e.tools/conditionsdiseases.html#concentration_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"conditionsdiseases.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"concentration_xphb\">Concentration</a>. If you do so, the spell's duration becomes 1 minute for that casting, and you can target Gargantuan creatures and objects.</p></div></div></div></div>"
