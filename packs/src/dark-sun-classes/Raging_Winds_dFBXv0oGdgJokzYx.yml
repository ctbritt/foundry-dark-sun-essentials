name: Raging Winds
type: feat
system:
  description:
    value: >-
      <p>At 1st level you are imbued with the fury and persistence of the
      battering winds. This grants several benefits:</p><ul><li>You gain
      proficiency with martial weapons.</li><li>You learn the gust or
      thunderclap cantrip, your choice. The cantrip you selected counts as a
      cleric cantrip for you and doesn’t count against the number of cleric
      cantrips you know.</li><li>When you use your Turn Undead channel divinity,
      you can also effect non-air elementals.</li></ul>
