  classIdentifier: psion
  description:
    value: "<div class=\"mb-2 ve-flex-col\"><p><i class=\"ve-muted\">Note: importing a class as an item is provided for display purposes only. If you wish to import a class to a character sheet, please use the importer on the sheet instead.</i></p><div class=\"rd__b  rd__b--1\"><p>Psi Warpers tune their psionic powers to manipulating the space between objects. Capable of teleporting across the battlefield and creating vacuums in space, a Psi Warper is never in one place for too long.</p><div data-roll-name-ancestor=\"Psi Warper Spells\" data-source=\"XUA2025Psion\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"1\"> <span class=\"entry-title-inner\">Psi Warper Spells</span><span class=\"ve-flex-vh-center\"> <span class=\"rd__title-link \"><span class=\"help-subtle\" title=\"Unearthed Arcana 2025: The Psion\">XUA25P</span> <span title=\"Page 8\">p8</span></span><span class=\"rd__h-toggle ml-2 clickable no-select no-print lst-is-exporting-image__hidden\" data-rd-h-toggle-button=\"true\" title=\"Toggle Visibility (CTRL to Toggle All)\">[–]</span></span></h3> <p>When you reach a Psion level specified in the <a href=\"https://5e.tools/tables.html#psi%20warper%20spells_xua2025psion\" data-vet-page=\"tables.html\" data-vet-source=\"XUA2025Psion\" data-vet-hash=\"psi%20warper%20spells_xua2025psion\">Psi Warper Spells</a> table, you thereafter always have the listed spells prepared.</p><table class=\"rd__b-special rd__b-data  rd__b-data--stats\">\n\t\t<thead>\n\t\t\t<tr>\n\t\t\t\t<th class=\"rd__data-embed-header ve-text-left\" colspan=\"6\" data-rd-data-embed-header=\"true\">\n\t\t\t\t\t<div class=\"w-100 split-v-center\">\n\t\t\t\t\t\t<div class=\"ve-flex-v-center w-100 min-w-0\">\n\t\t\t\t\t\t\t<span class=\"rd__data-embed-name ve-hidden\">Psi Warper Spells</span>\n\t\t\t\t\t\t\t<span class=\"rd__data-embed-name-expanded ve-text-right pr-2 w-100 \"></span>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<span class=\"rd__data-embed-toggle\">[–]</span>\n\t\t\t\t\t</div>\n\t\t\t\t</th>\n\t\t\t</tr>\n\t\t</thead><tbody data-rd-embedded-data-render-target=\"true\"><tr>\n\t\t\t<td colspan=\"6\" data-rd-tag=\"table\" data-rd-uid=\"Psi Warper Spells|XUA2025Psion\" data-rd-page=\"tables.html\" data-rd-source=\"XUA2025Psion\" data-rd-hash=\"psi%20warper%20spells_xua2025psion\" data-rd-name=\"Psi Warper Spells\" data-rd-display-name=\"Psi Warper Spells\" data-rd-style data-rd-entry-data=\"{}\">\n\t\t\t\t<i>Loading <a href=\"https://5e.tools/tables.html#psi%20warper%20spells_xua2025psion\" data-vet-page=\"tables.html\" data-vet-source=\"XUA2025Psion\" data-vet-hash=\"psi%20warper%20spells_xua2025psion\">Psi Warper Spells</a>...</i>\n\t\t\t\t\n\t\t\t</td>\n\t\t</tr></tbody></table></div><div data-roll-name-ancestor=\"Teleportation\" data-source=\"XUA2025Psion\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"2\"> <span class=\"entry-title-inner\">Teleportation</span><span class=\"ve-flex-vh-center\"> <span class=\"rd__title-link \"><span class=\"help-subtle\" title=\"Unearthed Arcana 2025: The Psion\">XUA25P</span> <span title=\"Page 8\">p8</span></span><span class=\"rd__h-toggle ml-2 clickable no-select no-print lst-is-exporting-image__hidden\" data-rd-h-toggle-button=\"true\" title=\"Toggle Visibility (CTRL to Toggle All)\">[–]</span></span></h3> <p>You can cast <a href=\"https://5e.tools/spells.html#misty%20step_xphb\" data-vet-page=\"spells.html\" data-vet-source=\"XPHB\" data-vet-hash=\"misty%20step_xphb\">Misty Step</a> without expending a spell slot, and you must finish a <a href=\"https://5e.tools/variantrules.html#long%20rest_xphb\" data-vet-page=\"variantrules.html\" data-vet-source=\"XPHB\" data-vet-hash=\"long%20rest_xphb\">Long Rest</a> before you can cast it in this way again. You can also restore your use of it by expending one Psionic Energy Die (no action required).</p></div><div data-roll-name-ancestor=\"Warp Propel\" data-source=\"XUA2025Psion\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"3\"> <span class=\"entry-title-inner\">Warp Propel</span><span class=\"ve-flex-vh-center\"> <span class=\"rd__title-link \"><span class=\"help-subtle\" title=\"Unearthed Arcana 2025: The Psion\">XUA25P</span> <span title=\"Page 8\">p8</span></span><span class=\"rd__h-toggle ml-2 clickable no-select no-print lst-is-exporting-image__hidden\" data-rd-h-toggle-button=\"true\" title=\"Toggle Visibility (CTRL to Toggle All)\">[–]</span></span></h3> <p>When a target fails its saving throw against your <a href=\"https://5e.tools/classes.html#psion_xua2025psion,state:feature=s0-0\" data-vet-page=\"classfeature\" data-vet-source=\"XUA2025Psion\" data-vet-hash=\"telekinetic%20propel_psion_xua2025psion_1_xua2025psion\">Telekinetic Propel</a>, instead of pushing it, you can teleport the target to an unoccupied space you can see within 30 feet of you that is horizontal to you.</p></div></div><div class=\"rd__b  rd__b--0\"><div data-roll-name-ancestor=\"Psi Warper\" data-source=\"XUA2025Psion\" class=\"rd__b spicy-sauce rd__b--1\"><h2 class=\"rd__h rd__h--1\" data-title-index=\"4\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: The Psion, p8\">Psi Warper</span></h2> <p>Psi Warpers tune their psionic powers to manipulating the space between objects. Capable of teleporting across the battlefield and creating vacuums in space, a Psi Warper is never in one place for too long.</p><div data-roll-name-ancestor=\"Level 3: Psi Warper Spells\" data-source=\"XUA2025Psion\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"5\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: The Psion, p8\">Level 3: Psi Warper Spells</span></h3> <p>When you reach a Psion level specified in the <a href=\"https://5e.tools/tables.html#psi%20warper%20spells_xua2025psion\" data-plut-hover=\"true\" data-plut-hover-page=\"tables.html\" data-plut-hover-source=\"XUA2025Psion\" data-plut-hover-hash=\"psi%20warper%20spells_xua2025psion\">Psi Warper Spells</a> table, you thereafter always have the listed spells prepared.</p><table class=\"rd__b-special rd__b-data  rd__b-data--stats\">\n\t\t<thead>\n\t\t\t<tr>\n\t\t\t\t<th class=\"rd__data-embed-header ve-text-left\" colspan=\"6\" data-rd-data-embed-header=\"true\">\n\t\t\t\t\t<div class=\"w-100 split-v-center\">\n\t\t\t\t\t\t<div class=\"ve-flex-v-center w-100 min-w-0\">\n\t\t\t\t\t\t\t<span class=\"rd__data-embed-name ve-hidden\">Psi Warper Spells</span>\n\t\t\t\t\t\t\t<span class=\"rd__data-embed-name-expanded ve-text-right pr-2 w-100 \"></span>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<span class=\"rd__data-embed-toggle\">[–]</span>\n\t\t\t\t\t</div>\n\t\t\t\t</th>\n\t\t\t</tr>\n\t\t</thead><tbody data-rd-embedded-data-render-target=\"true\"><tr>\n\t\t\t<td colspan=\"6\" data-rd-tag=\"table\" data-rd-uid=\"Psi Warper Spells|XUA2025Psion\" data-rd-page=\"tables.html\" data-rd-source=\"XUA2025Psion\" data-rd-hash=\"psi%20warper%20spells_xua2025psion\" data-rd-name=\"Psi Warper Spells\" data-rd-display-name=\"Psi Warper Spells\" data-rd-style data-rd-entry-data=\"{}\">\n\t\t\t\t<i>Loading <a href=\"https://5e.tools/tables.html#psi%20warper%20spells_xua2025psion\" data-plut-hover=\"true\" data-plut-hover-page=\"tables.html\" data-plut-hover-source=\"XUA2025Psion\" data-plut-hover-hash=\"psi%20warper%20spells_xua2025psion\">Psi Warper Spells</a>...</i>\n\t\t\t\t\n\t\t\t</td>\n\t\t</tr></tbody></table></div><div data-roll-name-ancestor=\"Level 3: Teleportation\" data-source=\"XUA2025Psion\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"6\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: The Psion, p8\">Level 3: Teleportation</span></h3> <p>You can cast <a href=\"https://5e.tools/spells.html#misty%20step_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"spells.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"misty%20step_xphb\">Misty Step</a> without expending a spell slot, and you must finish a <a href=\"https://5e.tools/variantrules.html#long%20rest_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"long%20rest_xphb\">Long Rest</a> before you can cast it in this way again. You can also restore your use of it by expending one Psionic Energy Die (no action required).</p></div><div data-roll-name-ancestor=\"Level 3: Warp Propel\" data-source=\"XUA2025Psion\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"7\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: The Psion, p8\">Level 3: Warp Propel</span></h3> <p>When a target fails its saving throw against your <a href=\"https://5e.tools/classes.html#psion_xua2025psion,state:feature=s0-0\" data-plut-hover=\"true\" data-plut-hover-page=\"classfeature\" data-plut-hover-source=\"XUA2025Psion\" data-plut-hover-hash=\"telekinetic%20propel_psion_xua2025psion_1_xua2025psion\">Telekinetic Propel</a>, instead of pushing it, you can teleport the target to an unoccupied space you can see within 30 feet of you that is horizontal to you.</p></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 6: Warp Space\" data-source=\"XUA2025Psion\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"8\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: The Psion, p8\">Level 6: Warp Space</span></h3> <p>When you cast <a href=\"https://5e.tools/spells.html#shatter_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"spells.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"shatter_xphb\">Shatter</a>, you can expend one Psionic Energy Die to modify the spell so that the radius of the spell's <a href=\"https://5e.tools/variantrules.html#sphere%20%5barea%20of%20effect%5d_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"sphere%20%5barea%20of%20effect%5d_xphb\">Sphere</a> becomes 20 feet.</p><p>In addition, creatures that fail the saving throw against the spell are pulled straight toward the center of the <a href=\"https://5e.tools/variantrules.html#sphere%20%5barea%20of%20effect%5d_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"sphere%20%5barea%20of%20effect%5d_xphb\">Sphere</a>, ending in an unoccupied space as close to center of the <a href=\"https://5e.tools/variantrules.html#sphere%20%5barea%20of%20effect%5d_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"sphere%20%5barea%20of%20effect%5d_xphb\">Sphere</a> as possible.</p></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 6: Teleporter Combat\" data-source=\"XUA2025Psion\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"9\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: The Psion, p8\">Level 6: Teleporter Combat</span></h3> <p>Immediately after you cast <a href=\"https://5e.tools/spells.html#misty%20step_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"spells.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"misty%20step_xphb\">Misty Step</a>, you can cast one of your Psion cantrips that has a casting time of an action as part of the <a href=\"https://5e.tools/variantrules.html#bonus%20action_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"bonus%20action_xphb\">Bonus Action</a>.</p></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 10: Duplicitous Target\" data-source=\"XUA2025Psion\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"10\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: The Psion, p8\">Level 10: Duplicitous Target</span></h3> <p>When a creature you can see makes an attack roll against you, you can take a <a href=\"https://5e.tools/variantrules.html#reaction_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"variantrules.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"reaction_xphb\">Reaction</a> to expend one Psionic Energy Die and choose a willing creature you can see within 30 feet of yourself that doesn't have the &amp;Reference[condition=Incapacitated] condition. You and the willing creature teleport, swapping places with each other. The creature then becomes the target of the attack roll.</p></div></div><div class=\"rd__b  rd__b--1\"><div data-roll-name-ancestor=\"Level 14: Mass Teleportation\" data-source=\"XUA2025Psion\" class=\"rd__b spicy-sauce rd__b--2\"><h3 class=\"rd__h rd__h--2\" data-title-index=\"11\"> <span class=\"entry-title-inner help-subtle\" title=\"Source: Unearthed Arcana 2025: The Psion, p8\">Level 14: Mass Teleportation</span></h3> <p>As a <a href=\"https://5e.tools/actions.html#magic_xphb\" data-plut-hover=\"true\" data-plut-hover-page=\"actions.html\" data-plut-hover-source=\"XPHB\" data-plut-hover-hash=\"magic_xphb\">Magic</a> action, you expend four Psionic Energy Dice and choose Huge or smaller creatures within 30 feet of yourself, up to a number of creatures equal to your Intelligence modifier (minimum of one creature). Each of the chosen creatures is teleported to an unoccupied space you can see within 150 feet of you. An unwilling creature that succeeds on a Wisdom saving throw against your spell save DC is unaffected.</p></div></div></div></div>"
