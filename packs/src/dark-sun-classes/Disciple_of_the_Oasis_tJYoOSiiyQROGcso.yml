  description:
    value: >-
      <p>Also at 1st level you are imbued with the life giving power of water.
      This grants several benefits:</p><ul><li>You gain a swimming speed equal
      to your walking speed. If you already have a swimming speed, it instead
      increases by 10 feet.</li><li>When you cast a spell that creates water,
      you produce double the amount you normally would.</li><li>Whenever you use
      a spell of 1st level or higher to restore HP, the creature regains
      additional HP equal to 2 + the spell’s level.</li><li>You learn either the
      @UUID[Item.5u9Rm9VM2MbbaeVF]{Shape Water} or
      @UUID[Item.yjXuEuV8ghkAropT]{Ray of Frost} cantrip, your choice. It counts
      as a cleric cantrip for you and does not count towards the number of
      cleric cantrips you know</li><li>When you use your Turn Undead channel
      divinity, you can also effect non-water elementals.</li></ul>
