name: Brawler
type: feat
system:
  description:
    value: >-
      <p>When you choose this path at 3rd level, you gain several benefits that
      make you more effective in unarmed combat.</p><ul><li>You can roll a d4 in
      place of the normal damage of your unarmed strike. This die improves as
      you gain barbarian levels, increasing at 6th level (d6), 12th level (d8),
      and 18th level (d10).</li><li>When you use the Attack action to make an
      unarmed strike or attempt a grapple, you can make one unarmed strike as a
      bonus action.</li></ul>
    chat: >-
      <div class="ddb">

      Increase your STR or CON score by 1. You are proficient with improvised
      weapons. Your unarmed strike uses a d4 for damage. When you hit a creature
      with an unarmed strike or an improvised weapon on your turn, you can use a
      bonus action to attempt to grapple the target.

      </div>
