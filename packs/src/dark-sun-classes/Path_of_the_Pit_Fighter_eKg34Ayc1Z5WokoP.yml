system:
  description:
    value: >-
      <h2>PATH OF THE PIT FIGHTER</h2><p>Pit fighters tend to be some of the
      strongest, toughest, and most dangerous adversaries in the arena. Battling
      for survival has been the only constant in their violent lives; they have
      little to lose or gain except their lives. Usually regarded as property to
      be bought and sold, these brutal warriors have nothing to fear and always
      lunge into battle.</p><h3>BRAWLER</h3><p>When you choose this path at 3rd
      level, you gain several benefits that make you more effective in unarmed
      combat.</p><ul><li>You can roll a d4 in place of the normal damage of your
      unarmed strike. This die improves as you gain barbarian levels, increasing
      at 6th level (d6), 12th level (d8), and 18th level (d10).</li><li>When you
      use the Attack action to make an unarmed strike or attempt a grapple, you
      can make one unarmed strike as a bonus action.</li></ul><h3>RECKLESS
      ABANDON</h3><p>Starting at 6th level, when you use Reckless Attack while
      raging, you also gain temporary hit points equal to your Constitution
      modifier (minimum of 1). They vanish if any remain when your rage
      ends.</p><h3>RAGING CHARGE</h3><p>Beginning at 10th level, you can take
      the Dash action as a bonus action while raging.</p><h3>EYE FOR AN
      EYE</h3><p>Starting at 14th level, when you take damage from a creature
      within 5 feet of you, you can use your reaction to make an unarmed attack
      against that creature. You must have a free hand.</p>
