  description:
    value: "<div class=\"ddb\"><h1>Description</h1><aside class=\"notable\"><p>You are at home amongst raiding tribes of Athas.Hailing from either an escaped slave village or a nomadic elven tribe, you served as their eyes and ears and honed them to a sharpened point. Compared to other rogues, you are skilled at surviving in the wilds.</p></aside><p class=\"p1\"><span class=\"characters-statblock\" style=\"font-family:'Roboto Condensed';font-size:14px\"><strong>Hit Die:</strong> d8<br /><strong>Primary Ability:</strong> Dexterity<br /><strong>Saves:</strong>\_Dexterity &amp; Intelligence</span></p><h1>Class Features</h1><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.TSwd7btT6fOoA9Wf]{Level 3: Skirmisher}</strong></p><p>Starting at 3rd level, you are difficult to pin down during a fight. You can move up to half your speed as a reaction when an enemy ends its turn within 5 feet of you. This movement doesn’t provoke opportunity attacks.</p><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.27YdU24mwVfKdOEd]{Level 3: Survivalist}</strong></p><p>When you choose this archetype at 3rd level, you gain proficiency in the Nature and Survival skills if you don’t already have it. Your proficiency bonus is doubled for any ability check you make that uses either of those proficiencies.</p><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.LYJSSqnDsAzz3pMN]{Level 9: Superior Mobility}</strong></p><p>At 9th level, your walking speed increases by 10 feet. If you have a climbing or swimming speed, this increase applies to that speed as well.</p><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.Q0YOmNJJJfQCvauo]{Level 13: Ambush Master}</strong></p><p>Starting at 13th level, you excel at leading ambushes and acting first in a fight.</p><p>You have advantage on initiative rolls. In addition, the first creature you hit during the first round of a combat becomes easier for you and others to strike; attack rolls against that target have advantage until the start of your next turn.</p><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.Z038ySVILNe9rI98]{Level 17: Sudden Strike}</strong></p><p>Starting at 17th level, you can strike with deadly speed. If you take the Attack action on your turn, you can make one additional attack as a bonus action. This attack can benefit from your Sneak Attack even if you have already used it this turn, but you can’t use your Sneak Attack against the same target more than once in a turn.</p></div>"
