    value: >-
      <div class="ddb">

      <p>Your Shadowy Reflection can create an umbral pathway that you and your
      companions can use. As a Bonus Action while your Shadowy Reflection is
      within 5 feet of you, you can expend 4 Shadow Motes to cast <em>Dimension
      Door</em>. Intelligence is your spellcasting ability for it. Your Shadowy
      Reflection can travel through the spell.</p>

