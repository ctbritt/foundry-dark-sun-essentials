flags:
  ddbimporter:
    id: 9
    data:
      id: 9
      definitionKey: '789467139:9'
      name: Barbarian
      description: "<p>A fierce warrior who can enter a battle rage</p>\r\n<p class=\"characters-statblock\" style=\"font-family: Roboto Condensed; font-size: 14px;\"><strong>Hit Die:</strong> d12<br /><strong>Primary Ability:</strong> Strength<br /><strong>Saves:</strong> Strength &amp; Constitution&nbsp;</p>"
      equipmentDescription: "<p class=\"compendium-hr\">You start with the following equipment, in addition to the equipment granted by your background:</p>\r\n<ul>\r\n<li class=\"Core-Styles_Core-Bulleted\">(<span class=\"Serif-Character-Style_Italic-Serif\">a</span>) a greataxe or (<span class=\"Serif-Character-Style_Italic-Serif\">b</span>) any martial melee weapon</li>\r\n<li class=\"Core-Styles_Core-Bulleted\">(<span class=\"Serif-Character-Style_Italic-Serif\">a</span>) two handaxes or (<span class=\"Serif-Character-Style_Italic-Serif\">b</span>) any simple weapon</li>\r\n<li class=\"Core-Styles_Core-Bulleted\">An explorer’s pack and four javelins</li>\r\n</ul>"
      parentClassId: null
      avatarUrl: >-
        https://www.dndbeyond.com/avatars/6/341/636272680339582512.png?width=350&height=350&fit=bounds&quality=95&auto=webp
      largeAvatarUrl: >-
        https://www.dndbeyond.com/avatars/6/342/636272680339895080.png?width=1000&height=1000&fit=bounds&quality=95&auto=webp
      portraitAvatarUrl: >-
        https://www.dndbeyond.com/avatars/10/0/636336416778392507.jpeg?width=1000&height=1000&fit=bounds&quality=95&auto=webp
      moreDetailsUrl: /characters/classes/9-barbarian
      spellCastingAbilityId: null
      sources:
        - sourceId: 1
          pageNumber: 46
          sourceType: 1
      classFeatures:
        - id: 51
          name: Rage
          prerequisite: null
          description: "<p class=\"compendium-hr\">In battle, you fight with primal ferocity. On your turn, you can enter a rage as a bonus action.</p>\r\n<p class=\"Core-Styles_Core-Body-Last--to-apply-extra-space-\">While raging, you gain the following benefits if you aren’t wearing heavy armor:</p>\r\n<ul>\r\n<li class=\"Core-Styles_Core-Bulleted\">You have advantage on Strength checks and Strength saving throws.</li>\r\n<li class=\"Core-Styles_Core-Bulleted\">When you make a melee weapon attack using Strength, you gain a bonus to the damage roll that increases as you gain levels as a barbarian, as shown in the Rage Damage column of the Barbarian table.</li>\r\n<li class=\"Core-Styles_Core-Bulleted-Last\">You have resistance to bludgeoning, piercing, and slashing damage.</li>\r\n</ul>\r\n<p class=\"Core-Styles_Core-Body\">If you are able to cast spells, you can’t cast them or concentrate on them while raging.</p>\r\n<p class=\"Core-Styles_Core-Body\">Your rage lasts for 1 minute. It ends early if you are knocked unconscious or if your turn ends and you haven’t attacked a hostile creature since your last turn or taken damage since then. You can also end your rage on your turn as a bonus action.</p>\r\n<p class=\"Core-Styles_Core-Body\">Once you have raged the number of times shown for your barbarian level in the Rages column of the Barbarian table, you must finish a long rest before you can rage again.</p>"
          requiredLevel: 1
          displayOrder: 4
        - id: 52
          name: Unarmored Defense
          prerequisite: null
          description: >-
            <p>While you are not wearing any armor, your Armor Class equals 10 +
            your Dexterity modifier + your Constitution modifier. You can use a
            shield and still gain this benefit.</p>
          requiredLevel: 1
          displayOrder: 5
        - id: 459
          name: Proficiencies
          prerequisite: null
          description: >-
            <p><strong><span
            class="Serif-Character-Style_Bold-Serif">Armor:</span></strong>
            Light armor, medium armor, shields<br /><strong><span
            class="Serif-Character-Style_Bold-Serif">Weapons:</span></strong>
            Simple weapons, martial weapons<br /><strong><span
            class="Serif-Character-Style_Bold-Serif">Tools:</span></strong>
            None<br /><strong><span
            class="Serif-Character-Style_Bold-Serif">Saving
            Throws:</span></strong> Strength, Constitution<br /><strong><span
            class="Serif-Character-Style_Bold-Serif">Skills:
            </span></strong>Choose two from Animal Handling, Athletics,
            Intimidation, Nature, Perception, and Survival</p>
          requiredLevel: 1
          displayOrder: 2
        - id: 530
          name: Hit Points
          prerequisite: null
          description: >-
            <p><strong><span class="Serif-Character-Style_Bold-Serif">Hit
            Dice:</span></strong> 1d12 per barbarian level<br /><strong><span
            class="Serif-Character-Style_Bold-Serif">Hit Points at 1st
            Level:</span></strong> 12 + your Constitution modifier<br
            /><strong><span class="Serif-Character-Style_Bold-Serif">Hit Points
            at Higher Levels:</span></strong> 1d12 (or 7) + your Constitution
            modifier per barbarian level after 1st</p>
          requiredLevel: 1
          displayOrder: 1
        - id: 9961341
          name: Equipment
          prerequisite: null
          description: "<p>You start with the following equipment, in addition to the equipment granted by your background:</p>\r\n<ul>\r\n<li>(a) a greataxe or (b) any martial melee weapon</li>\r\n<li>(a) two handaxes or (b) any simple weapon</li>\r\n<li>An explorer’s pack and four javelins</li>\r\n</ul>"
          requiredLevel: 1
          displayOrder: 3
        - id: 53
          name: Reckless Attack
          prerequisite: null
          description: >-
            <p><span style="font-weight: 400;">Starting at 2nd level, you can
            throw aside all concern for defense to attack with fierce
            desperation. When you make your first attack on your turn, you can
            decide to attack recklessly. Doing so gives you advantage on melee
            weapon attack rolls using Strength during this turn, but attack
            rolls against you have advantage until your next turn.</span></p>
          requiredLevel: 2
          displayOrder: 6
        - id: 54
          name: Danger Sense
          prerequisite: null
          description: "<p><span style=\"font-weight: 400;\">At 2nd level, you gain an uncanny sense of when things nearby aren’t as they should be, giving you an edge when you dodge away from danger.</span></p>\r\n<p><span style=\"font-weight: 400;\">You have advantage on Dexterity saving throws against effects that you can see, such as traps and spells. To gain this benefit, you can’t be blinded, deafened, or incapacitated.</span></p>"
          requiredLevel: 2
          displayOrder: 7
        - id: 55
          name: Primal Path
          prerequisite: null
          description: >-
            <p>At 3rd level, you choose a path that shapes the nature of your
            rage. Your choice grants you features at 3rd level and again at 6th,
            10th, and 14th levels.</p>
          requiredLevel: 3
          displayOrder: 8
        - id: 56
          name: Ability Score Improvement
          prerequisite: null
          description: "<p>When you reach 4th level, and again at 8th, 12th, 16th, and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can’t increase an ability score above 20 using this feature.</p>\r\n<p>Using the optional feats rule, you can forgo taking this feature to take a feat of your choice instead.</p>"
          requiredLevel: 4
          displayOrder: 9
        - id: 61
          name: Extra Attack
          prerequisite: null
          description: >-
            <p><span style="font-weight: 400;">Beginning at 5th level, you can
            attack twice, instead of once, whenever you take the Attack action
            on your turn.</span></p>
          requiredLevel: 5
          displayOrder: 10
        - id: 62
          name: Fast Movement
          prerequisite: null
          description: >-
            <p><span style="font-weight: 400;">Starting at 5th level, your speed
            increases by 10 feet while you aren’t wearing heavy
            armor.</span></p>
          requiredLevel: 5
          displayOrder: 11
        - id: 63
          name: Feral Instinct
          prerequisite: null
          description: "<p><span style=\"font-weight: 400;\">By 7th level, your instincts are so honed that you have advantage on initiative rolls.</span></p>\r\n<p><span style=\"font-weight: 400;\">Additionally, if you are surprised at the beginning of combat and aren’t incapacitated, you can act normally on your first turn, but only if you enter your rage before doing anything else on that turn.</span></p>"
          requiredLevel: 7
          displayOrder: 12
        - id: 57
          name: Ability Score Improvement
          prerequisite: null
          description: "<p>When you reach 8th level, and again at 12th, 16th, and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can’t increase an ability score above 20 using this feature.</p>\r\n<p>Using the optional feats rule, you can forgo taking this feature to take a feat of your choice instead.</p>"
          requiredLevel: 8
          displayOrder: 13
        - id: 64
          name: Brutal Critical
          prerequisite: null
          description: "<p><span style=\"font-weight: 400;\">Beginning at 9th level, you can roll one additional weapon damage die when determining the extra damage for a critical hit with a melee attack.</span></p>\r\n<p><span style=\"font-weight: 400;\">This increases to two additional dice at 13th level and three additional dice at 17th level.</span></p>"
          requiredLevel: 9
          displayOrder: 14
        - id: 67
          name: Relentless Rage
          prerequisite: null
          description: "<p><span style=\"font-weight: 400;\">Starting at 11th level, your rage can keep you fighting despite grievous wounds. If you drop to 0 hit points while you’re raging and don’t die outright, you can make a DC 10 Constitution saving throw. If you succeed, you drop to 1 hit point instead.</span></p>\r\n<p><span style=\"font-weight: 400;\">Each time you use this feature after the first, the DC increases by 5. When you finish a short or long rest, the DC resets to 10.</span></p>"
          requiredLevel: 11
          displayOrder: 15
        - id: 58
          name: Ability Score Improvement
          prerequisite: null
          description: "<p>When you reach 12th level, and again at 16th and 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can’t increase an ability score above 20 using this feature.</p>\r\n<p>Using the optional feats rule, you can forgo taking this feature to take a feat of your choice instead.</p>"
          requiredLevel: 12
          displayOrder: 16
        - id: 65
          name: Brutal Critical
          prerequisite: null
          description: "<p>At 13th level, you can roll two additional weapon damage dice when determining the extra damage for a critical hit with a melee attack.</p>\r\n<p>This increases to three additional dice at 17th level.</p>"
          requiredLevel: 13
          displayOrder: 17
        - id: 68
          name: Persistent Rage
          prerequisite: null
          description: >-
            <p><span style="font-weight: 400;">Beginning at 15th level, your
            rage is so fierce that it ends early only if you fall unconscious or
            if you choose to end it.</span></p>
          requiredLevel: 15
          displayOrder: 18
        - id: 59
          name: Ability Score Improvement
          prerequisite: null
          description: "<p>When you reach 16th level, and again at 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can’t increase an ability score above 20 using this feature.</p>\r\n<p>Using the optional feats rule, you can forgo taking this feature to take a feat of your choice instead.</p>"
          requiredLevel: 16
          displayOrder: 19
        - id: 66
          name: Brutal Critical
          prerequisite: null
          description: >-
            <p>At 17th level, you can roll three additional weapon damage dice
            when determining the extra damage for a critical hit with a melee
            attack.</p>
          requiredLevel: 17
          displayOrder: 20
        - id: 69
          name: Indomitable Might
          prerequisite: null
          description: >-
            <p><span style="font-weight: 400;">Beginning at 18th level, if your
            total for a Strength check is less than your Strength score, you can
            use that score in place of the total.</span></p>
          requiredLevel: 18
          displayOrder: 21
        - id: 60
          name: Ability Score Improvement
          prerequisite: null
          description: "<p>When you reach 19th level, you can increase one ability score of your choice by 2, or you can increase two ability scores of your choice by 1. As normal, you can’t increase an ability score above 20 using this feature.</p>\r\n<p>Using the optional feats rule, you can forgo taking this feature to take a feat of your choice instead.</p>"
          requiredLevel: 19
          displayOrder: 22
        - id: 70
          name: Primal Champion
          prerequisite: null
          description: >-
            <p><span style="font-weight: 400;">At 20th level, you embody the
            power of the wilds. Your Strength and Constitution scores increase
            by 4. Your maximum for those scores is now 24.</span></p>
          requiredLevel: 20
          displayOrder: 23
