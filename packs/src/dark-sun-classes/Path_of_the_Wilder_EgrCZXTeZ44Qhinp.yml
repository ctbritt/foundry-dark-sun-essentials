name: Path of the Wilder
type: subclass
system:
  description:
    value: >-
      <div class="ddb"><h3>Path of the Wilder</h3><p>The Path of the Wilder
      channels the raw, unrefined power of the mind into physical prowess and
      fury. Drawing inspiration from ancient psionic traditions, Wilders unleash
      their inner psychic energy in unpredictable bursts, amplifying their rage
      with psychic abilities.</p><p></p><h3>PSIONIC RAGE</h3><p>Beginning at 3rd
      level, your rage taps into psionic energy.</p><ul><li>You gain resistance
      to psychic damage and advantage against psionic effects.</li><li>Once per
      turn, when you hit a creature with a melee weapon attack, you can deal
      extra psychic damage equal to your proficiency bonus.</li></ul><h3>WILD
      SURGE</h3><p>Starting at 6th level, your psionic power can surge
      unpredictably during your rage. When you rage, roll a d6. The result
      determines the psionic effect below. You can use this feature once per
      rage and cannot change the effect while raging.</p><table><tbody><tr><th
      colspan="2" data-colwidth="94,0"><p>Wild Surge
      Effects</p></th></tr><tr><th
      data-colwidth="94"><p>Roll</p></th><th><p>Effect</p></th></tr><tr><td
      data-colwidth="94"><p>1</p></td><td><p><strong>Mind Blast:</strong> As an
      action, unleash a psychic wave in a 15-foot cone. Each creature in that
      area must make an Intelligence saving throw (DC = 8 + your proficiency
      bonus + your Constitution modifier) or take 2d8 psychic damage and be
      stunned until the end of your next turn.</p></td></tr><tr><td
      data-colwidth="94"><p>2</p></td><td><p><strong>Telekinetic Push:</strong>
      As a bonus action, push one creature you can see within 30 feet. The
      target must succeed on a Strength saving throw (DC = 8 + your proficiency
      bonus + your Constitution modifier) or be pushed 20 feet away from
      you.</p></td></tr><tr><td
      data-colwidth="94"><p>3</p></td><td><p><strong>Psychic Armor:</strong> As
      a reaction, give yourself a bonus to AC equal to your Constitution
      modifier until the start of your next turn.</p></td></tr><tr><td
      data-colwidth="94"><p>4</p></td><td><p><strong>Psychic Reflexes:</strong>
      As a reaction when hit by an attack, halve the attack's damage against
      you.</p></td></tr><tr><td
      data-colwidth="94"><p>5</p></td><td><p><strong>Mind Over Matter:</strong>
      As a bonus action, gain temporary hit points equal to 1d10 + your
      barbarian level.</p></td></tr><tr><td
      data-colwidth="94"><p>6</p></td><td><p><strong>Mind Spike:</strong> As a
      bonus action, choose one creature you can see within 60 feet. That
      creature takes psychic damage equal to 1d8 + your proficiency bonus and
      has disadvantage on its next attack
      roll.</p></td></tr></tbody></table><h3>FOCUSED RAGE</h3><p>At 10th level,
      you can focus your psionic energy to maintain control over your wild
      surges. When you roll for your Wild Surge, you can roll twice and pick
      either result. Additionally, your psychic damage while raging increases to
      1d6 + your proficiency bonus.</p><h3>PSIONIC MASTERY</h3><p>At 14th level,
      you have mastered your wild psionic powers and physical rage. When you
      enter a rage, you can choose the effect of your Wild Surge instead of
      rolling. Additionally, your psychic damage while raging increases to 1d8 +
      your proficiency bonus.</p></div>
