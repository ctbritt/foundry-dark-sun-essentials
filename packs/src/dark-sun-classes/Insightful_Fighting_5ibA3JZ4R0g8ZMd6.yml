  description:
    value: >-
      <div class="ddb">

      <p class="Core-Styles_Core-Body">At 3rd level, you gain the ability to
      decipher an opponent’s tactics and develop a counter to them. As a bonus
      action, you can make a Wisdom (Insight) check against a creature you can
      see that isn’t incapacitated, contested by the target’s Charisma
      (Deception) check. If you succeed, you can use your Sneak Attack against
      that target even if you don’t have advantage on the attack roll, but not
      if you have disadvantage on it.</p>

      <p class="Core-Styles_Core-Body">This benefit lasts for 1 minute or until
      you successfully use this feature against a different target.</p>

      </div>
    chat: >-
      <div class="ddb">

      As a bonus action, you can make an Insight check against a creature you
      can see that isn’t incapacitated, contested by the target’s Deception
      check. If you succeed, you can use your Sneak Attack against that target
      even if you don’t have advantage on the attack roll, but not if you have
      disadvantage on it for 1 minute or until you use this feature against a
      different target.

      </div>
