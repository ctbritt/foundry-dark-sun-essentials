folder: xPV7xcWDDRomMFIp
name: Earth Domain
type: subclass
img: icons/magic/earth/barrier-stone-explosion-debris.webp
system:
  description:
    value: >-
      <p>Closely tied to nature, earth priests understand the true nature of the
      cycle of life. When something dies, its organic material is returned to
      the soil to provide life for another, and in another form. Therefore, the
      earth clerics. outlook on life is a utilitarian one. The death of a
      comrade, though tragic, is simply one stage in nature’s endless chain of
      creation and annihilation.</p><p>Because air, fire, and water all depend
      on growing things for their enrichment, and because earth alone must
      sustain itself, it is the earth clerics who must carry on the burden of
      preventing the environmental holocaust looming over Athas, such as
      teaching proper agricultural techniques and slaying defilers who would
      turn usable elements to ash. For, if they do not preserve the land, will
      not the death of Athas weigh upon their
      shoulders?</p><p></p><div><h5><span
      style="font-family:ScalySansRemake">Earth
      Initiation</span></h5><blockquote
      style="border:0px;font:inherit;vertical-align:baseline;margin:0.1cm 0px
      0px;padding:0px;quotes:none;box-sizing:border-box;-webkit-print-color-adjust:exact;z-index:15;break-inside:avoid"><p><span
      style="font-family:ScalySansRemake">When a mentor believes that a disciple
      is ready, after meditation, the initiate is buried alive in a fertile land
      at dawn and must commune with the spirits of the earth to sustain her.
      When the sun goes down, the novice either emerges, unscathed and
      empowered, or likely she dies and feeds the
      earth.</span></p></blockquote><table><caption></caption><tbody><tr></tr></tbody></table></div><h3>Earth
      Domain Spells</h3><table><thead><tr><th>Cleric
      Level</th><th>Spells</th></tr></thead><tbody><tr><td>1st</td><td>@UUID[Compendium.shareddata.ddb-spells.p1FPsYK3wcmUVchQ]{Earth
      Tremor},
      @UUID[Compendium.dnd5e.spells.Item.B0pnIcc52O6G8hi8]{Longstrider}</td></tr><tr><td>3rd</td><td>@UUID[Compendium.shareddata.ddb-spells.tyghOA0NSDqlWTNx]{Earthbind},
      @UUID[Compendium.shareddata.ddb-spells.bTIQ1gzdcWjsgpKx]{Dust
      Devil}</td></tr><tr><td>5th</td><td>@UUID[Compendium.shareddata.ddb-spells.dMdEFOZR49WFAYDR]{Maximilian's
      Earthen Grasp},
      @UUID[Compendium.shareddata.ddb-spells.mclWsnNQKNpehjlu]{Wall of
      Sand}</td></tr><tr><td>7th</td><td>@UUID[Compendium.dnd5e.spells.Item.ReMbjfeOKoSj3O79]{Stoneskin},
      @UUID[Compendium.shareddata.ddb-spells.z4HNmfz5thgSHBUe]{Summon Elemental
      (Earth
      Only)}</td></tr><tr><td>9th</td><td>@UUID[Compendium.shareddata.ddb-spells.msVO4psKnseNOR0D]{Transmute
      Rock}, @UUID[Compendium.dnd5e.spells.Item.NmoRmM1mhuM3pqnY]{Wall of
      Stone}</td></tr></tbody></table><h3>Mountain’s Resilience</h3><p>At 1st
      level you are imbued with the strength and fortitude of the earth. This
      grants several benefits:</p><ul><li>You gain proficiency with martial
      weapons and heavy armor.</li><li>Your hit points maximum increases by 1,
      and it increases by one every time you gain a level.</li><li>You learn the
      @UUID[Compendium.shareddata.ddb-spells.qxfOTSddADcoafV0]{Mold Earth} or
      @UUID[Compendium.shareddata.ddb-spells.TEEMmbq8opGC3tje]{Magic Stone}
      cantrip, your choice. The cantrip you selected counts as a cleric cantrip
      for you and doesn’t count against the number of cleric cantrips you
      know.</li><li>When you use your Turn Undead channel divinity, you can also
      effect non-earth elementals.</li></ul><h3>Channel Divinity:
      Unstoppable</h3><p>At 2nd level, the cleric may use their Channel Divinity
      as a reaction when struck by any effect that causes them to become
      paralyzed, prone, or restrained, or when affected by any force or ability
      that would move them against their will. The cleric immediately shakes off
      the effect as if it never happened.</p><h3>Stone Ward</h3><p>At 6th level,
      you gain the ability to impart the sturdiness of the earth to those around
      you. As a reaction when you or a creature you can see within 30 feet of
      you suffers a critical hit, you can turn that hit into a normal hit. Any
      effects triggered by a critical hit are canceled.</p><p>You can use this
      feature a number of times equal to your Wisdom modifier (minimum of once).
      You regain all expended uses when you finish a long rest.</p><h3>Divine
      Strike</h3><p>At 8th level, you gain the ability to infuse your weapon
      strikes with divine energy. Once on each of your turns when you hit a
      creature with a weapon attack, you can cause the attack to deal an extra
      1d8 damage of the same type dealt by the weapon to the target. When you
      reach 14th level, the extra damage increases to 2d8.</p><h3>Avatar of the
      Earth</h3><p>At 17th level, you gain resistance to bludgeoning, piercing,
      and slashing damage from nonmagical attacks.</p>
