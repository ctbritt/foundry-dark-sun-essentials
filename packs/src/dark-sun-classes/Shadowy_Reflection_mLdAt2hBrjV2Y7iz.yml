  description:
    value: >-
      <div class="ddb">

      <p>As a Magic action, you expel your shadow from your side and command its
      actions. It appears in an unoccupied space within 5 feet of you and is
      your size. The Shadowy Reflection can manipulate an object, open an
      unlocked door or container, stow or retrieve an unattended item, or pour
      out a vial. As a Magic action on your later turns or as part of the Bonus
      Action when you use your Cunning Action feature, you can control your
      shadow again. You can move your shadow up to your Speed. The shadow can’t
      attack, active magic items, or carry more than 10 pounds. Your shadow
      disappears when it takes any damage, is the target of any effect, or if
      you have the Incapacitated condition.</p>

      </div>
    chat: >-
      <div class="ddb">

      As a Magic action, you expel your shadow from your side and it appears in
      an unoccupied space within 5 ft of you and is your size. The Shadowy
      Reflection can manipulate an object, open an unlocked door or container,
      stow or retrieve an unattended item, or pour out a vial. As a Magic action
      on your later turns or as part of the Bonus Action when you use your
      Cunning Action feature, you can control your shadow again and you can move
      it up to your Speed. The shadow can’t attack, active magic items, or carry
      more than 10 pounds. Your shadow disappears when it takes any damage, is
      the target of any effect, or if you have the Incapacitated condition.

      </div>
