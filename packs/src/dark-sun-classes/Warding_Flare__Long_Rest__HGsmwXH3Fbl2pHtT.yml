    rules: '2014'
  description:
    value: >-
      <div class="rd__b  rd__b--1"><p>Also at 1st level, you can interpose
      divine light between yourself and an attacking enemy. When a creature that
      you can see within 30 feet of yourself makes an attack roll, you can take
      a Reaction to impose Disadvantage on the attack roll, causing light to
      flare before it hits or misses. An attacker that can’t be
      @condition[blinded] is immune to this feature.</p><p>You can use this
      feature a number of times equal to your Wisdom modifier (a minimum of
      once). You regain all expended uses when you finish a long rest.</p></div>
