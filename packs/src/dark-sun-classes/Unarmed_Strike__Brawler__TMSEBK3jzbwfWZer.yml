  description:
    value: >-
      <ul><li>You can roll a d4 in place of the normal damage of your unarmed
      strike. This die improves as you gain barbarian levels, increasing at 6th
      level (d6), 12th level (d8), and 18th level (d10).</li><li>When you use
      the Attack action to make an unarmed strike or attempt a grapple, you can
      make one unarmed strike as a bonus action.</li></ul>
