  description:
    value: "<div class=\"ddb\"><blockquote><p>Master Merchants of the Wastelands</p></blockquote><p>Individuals capable of providing basic necessities wield enormous influence in a world where everything is in short supply. Traders specialize in finding the impossible and getting it to market for maximum profit. Because of their ability to provide goods otherwise unattainable, traders are tolerated everywhere—from sorcerer-king cities to slave villages in distant wastes.</p><p>All traders aspire to become masters of major trading houses. They act as negotiators, interpreters, and diplomats, appraising treasure and bargaining for supplies.</p><p>Those adventurers who travel with a young trader often form the core of a new merchant house, get adopted into the trader’s family, or earn spots as senior agents after the trader becomes successful.</p><p><span class=\"characters-statblock\" style=\"font-family:'Roboto Condensed';font-size:14px\"><strong>Hit Die:</strong> d8<br /><strong>Primary Ability:</strong> Dexterity<br /><strong>Saves:</strong>\_Dexterity &amp; Intelligence</span></p><h1>Class Features</h1><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.RDOqY0W6dIZtfuIr]{Level 3: Master of Intrigue}</strong></p><p class=\"Core-Styles_Core-Body\">When you choose this archetype at 3rd level, you gain proficiency with the disguise kit, the forgery kit, and one gaming set of your choice. You also learn two languages of your choice.</p><p class=\"Core-Styles_Core-Body\">Additionally, you can unerringly mimic the speech patterns and accent of a creature that you hear speak for at least 1 minute, enabling you to pass yourself off as a native speaker of a particular land, provided that you know the language.</p><p><strong>@UUID[Item.58bkWXcxZb1YfiON]{Selling point}</strong></p><p>@Embed[Item.58bkWXcxZb1YfiON inline]</p><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.W0Hrwhxa6Wy4cHcf]{Level 9: Insightful Manipulator}</strong></p><p>Starting at 9th level, if you spend at least 1 minute observing or interacting with another creature outside combat, you can learn certain information about its capabilities compared to your own. The DM tells you if the creature is your equal, superior, or inferior in regard to two of the following characteristics of your choice:</p><ul><li>Intelligence score</li><li>Wisdom score</li><li>Charisma score</li><li>Class levels (if any)</li></ul><p>At the DM’s option, you might also realize you know a piece of the creature’s history or one of its personality traits, if it has any.</p><p><strong>@UUID[Item.PTXhEpFkQP53gqNw]{Merchant King}</strong></p><p>@Embed[Item.PTXhEpFkQP53gqNw inline]</p><p></p><p><strong>@UUID[Compendium.shareddata.ddb-classes-2014.Item.WTYqUl1rQsBk2nml]{Level 17: Soul of Deceit}</strong></p><p>Starting at 17th level, your thoughts can’t be read by telepathy or other means, unless you allow it. You can present false thoughts by succeeding on a Charisma (Deception) check contested by the mind reader’s Wisdom (Insight) check.</p><p>Additionally, no matter what you say, magic that would determine if you are telling the truth indicates you are being truthful if you so choose, and you can’t be compelled to tell the truth by magic.</p></div>"
