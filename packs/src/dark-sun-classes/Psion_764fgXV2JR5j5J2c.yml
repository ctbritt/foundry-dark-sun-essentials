name: Psion
type: class
system:
  identifier: psion
  description:
    value: >-
      <div class="mb-2 ve-flex-col"><p><em class="ve-muted">Note: importing a
      class as an item is provided for display purposes only. If you wish to
      import a class to a character sheet, please use the importer on the sheet
      instead.</em></p><div><div class="rd__b  rd__b--0"><p><em>A Master of
      Psionic Power</em></p><p>Psions weave magic and extraordinary powers
      through the power of their minds. They develop their minds as fonts of
      power that manifest spells and grow stronger over the course of their
      adventuring careers. You can find everything you need to play one of these
      psionic powerhouses in the next few sections.</p><div class="rd__b-special
      rd__b-inset" data-roll-name-ancestor="What is a Psion?"><h4 class="rd__h
      rd__h--2-inset" data-title-index="1"><span class="entry-title-inner">What
      is a Psion?</span><span class="ve-flex-vh-center"> </span><span
      title="Page 1">p1</span></h4><p>Psions are spellcasters who use innate
      mental powers to gain extraordinary abilities and unleash the magic of
      their minds. Psions and their magic (sometimes called "psionics") can
      trace their history back to the appendix of the first edition <em>Player's
      Handbook</em>, and a psionics-using class first appeared in <em>The
      Complete Psionics Handbook</em> in 1991. Psionics have taken numerous
      forms in D&amp;D, from alternative magic systems to options that dovetail
      with other D&amp;D rules. In the fifth edition, psychic power is
      synonymous with magic, and the magic of the mind flavors numerous spells,
      monsters, and subclasses—like the <a
      href="https://5e.tools/classes.html#fighter_xphb,state:sub_psi%20warrior_xphb=b1,fltsource:clear,flstmiscellaneous:clear"
      data-plut-hover="true" data-plut-hover-page="classes.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="fighter_xphb,state:sub_psi%20warrior_xphb=b1">Psi
      Warrior Fighter</a> and the <a
      href="https://5e.tools/classes.html#sorcerer_xphb,state:sub_aberrant_xphb=b1,fltsource:clear,flstmiscellaneous:clear"
      data-plut-hover="true" data-plut-hover-page="classes.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="sorcerer_xphb,state:sub_aberrant_xphb=b1">Aberrant
      Sorcery Sorcerer</a> in the <a
      href="https://5e.tools/book.html#xphb">Player's Handbook</a>. In this
      edition, the Psion is a spellcaster who interfaces with magic and
      spellcasting similarly to other classes in the game.</p><p>This UA
      provides the Psion with unique twists to spellcasting using Psionic Energy
      Dice and the <a
      href="https://5e.tools/classes.html#psion_xua2025psionupdate,state:feature=s0-0"
      data-plut-hover="true" data-plut-hover-page="classfeature"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="spellcasting_psion_xua2025psionupdate_1_xua2025psionupdate">Psionic
      Spellcasting</a> feature, carving out a space to make the Psion stand out
      from its spellcasting peers.</p></div></div></div><table class="cls-tbl
