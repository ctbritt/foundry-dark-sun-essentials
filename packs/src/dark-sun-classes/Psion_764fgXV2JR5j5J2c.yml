      class="rd__b  rd__b--0"><div data-roll-name-ancestor="Level 1: Psionic
      Power" data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--1"><h2 class="rd__h rd__h--1" data-title-index="2"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p2">Level 1: Psionic Power</span></h2><p>You harbor a
      wellspring of psionic energy within yourself. This energy is represented
      by your Psionic Energy Dice. Your Psion level determines the die size and
      number of Psionic Energy Dice you have, as shown in the Energy Dice column
      of the Psion Features table.</p><p>Your Psionic Energy Dice are used to
      enhance or fuel certain Psion features. You start with two such features:
      <a
      href="https://5e.tools/classes.html#psion_xua2025psionupdate,state:feature=s0-0"
      data-plut-hover="true" data-plut-hover-page="classfeature"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="telekinetic%20propel_psion_xua2025psionupdate_1_xua2025psionupdate">Telekinetic
      Propel</a> and <a
      href="https://5e.tools/classes.html#psion_xua2025psionupdate,state:feature=s0-0"
      data-plut-hover="true" data-plut-hover-page="classfeature"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="telepathic%20connection_psion_xua2025psionupdate_1_xua2025psionupdate">Telepathic
      Connection</a>, each of which is detailed below. Some of your powers
      expend the Psionic Energy Dice, as specified in a power's description, and
      you can't use a power if it requires you to use a die when all your
      Psionic Energy Dice are expended.</p><p>You regain one expended Psionic
      Energy Die when you finish a <a
      href="https://5e.tools/variantrules.html#short%20rest_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="short%20rest_xphb">Short Rest</a>, and you regain
      all of them when you finish a <a
      href="https://5e.tools/variantrules.html#long%20rest_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="long%20rest_xphb">Long
      Rest</a>.</p><p>Some features that use Psionic Energy Dice require your
      target to make a saving throw. The save DC equals the spell save DC from
      this class's Spellcasting feature.</p><div class="rd__b  rd__b--2"><div
      data-roll-name-ancestor="Telekinetic Propel"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--3"><p><span class="entry-title-inner help-subtle" title="Source:
      Unearthed Arcana 2025: Psion Update, p3">Telekinetic Propel.</span> As a
      <a href="https://5e.tools/variantrules.html#bonus%20action_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="bonus%20action_xphb">Bonus Action</a>, choose one
      Large or smaller creature other than you that you can see within 30 feet
      of yourself. When you do so, the target must succeed on a Strength saving
      throw or be moved 5 feet straight toward you or straight away from you.
      Alternatively, you can roll one Psionic Energy Die when you take this <a
      href="https://5e.tools/variantrules.html#bonus%20action_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="bonus%20action_xphb">Bonus Action</a>, and the
      distance moved is equal to 5 times the number rolled. The die is expended
      only if the target fails the saving throw.</p></div><div
      data-roll-name-ancestor="Telepathic Connection"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--3"><p><span class="entry-title-inner help-subtle" title="Source:
      Unearthed Arcana 2025: Psion Update, p3">Telepathic Connection.</span> You
      have telepathy with a range of 30 feet. As a <a
      href="https://5e.tools/variantrules.html#bonus%20action_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="bonus%20action_xphb">Bonus Action</a>, you can roll
      one Psionic Energy Die. For the next hour, the range of your telepathy
      increases by a number of feet equal to 10 times the number rolled. The
      first time you use this <a
      href="https://5e.tools/variantrules.html#bonus%20action_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="bonus%20action_xphb">Bonus Action</a> after each <a
      href="https://5e.tools/variantrules.html#long%20rest_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="long%20rest_xphb">Long
      Rest</a>, you don't expend the Psionic Energy Die. All other times you use
      this feature, you expend the die.</p></div></div></div><div
      data-roll-name-ancestor="Level 1: Spellcasting"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="5"><span class="entry-title-inner
      help-subtle" title="Source: Unearthed Arcana 2025: Psion Update, p2">Level
      1: Spellcasting</span></h2><p>You have learned how to channel magical
      energy using the power of your mind. See the <a
      href="https://5e.tools/book.html#xphb">Player's Handbook</a> for the rules
      on spellcasting. The information below details how you use those rules
      with Psion spells, which appear in the <a
      href="https://5e.tools/tables.html#psion%20spell%20list_xua2025psionupdate"
      data-plut-hover="true" data-plut-hover-page="tables.html"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="psion%20spell%20list_xua2025psionupdate">Psion spell
      list</a> later in the class's description.</p><div class="rd__b 
      rd__b--2"><div data-roll-name-ancestor="Cantrips" class="rd__b 
      rd__b--3"><p><span class="entry-title-inner">Cantrips.</span> You know two
      Psion cantrips of your choice. <a
      href="https://5e.tools/spells.html#minor%20illusion_xphb"
      data-plut-hover="true" data-plut-hover-page="spells.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="minor%20illusion_xphb">Minor Illusion</a> and <a
      href="https://5e.tools/spells.html#telekinetic%20fling_xua2025psionupdate"
      data-plut-hover="true" data-plut-hover-page="spells.html"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="telekinetic%20fling_xua2025psionupdate">Telekinetic
      Fling</a> are recommended.</p><p>Whenever you gain a Psion level, you can
      replace one of your cantrips from this feature with another Psion cantrip
      of your choice.</p><p>When you reach Psion levels 4 and 10, you learn
      another Psion cantrip of your choice, as shown in the Cantrips column of
      the Psion Features table.</p></div><div data-roll-name-ancestor="Spell
      Slots" class="rd__b  rd__b--3"><p><span class="entry-title-inner">Spell
      Slots.</span> The Psion Features table shows how many spell slots you have
      to cast your level 1+ spells. You regain all expended spell slots when you
      finish a <a href="https://5e.tools/variantrules.html#long%20rest_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="long%20rest_xphb">Long
      Rest</a>.</p></div><div data-roll-name-ancestor="Prepared Spells of Level
      1+" class="rd__b  rd__b--3"><p><span class="entry-title-inner">Prepared
      Spells of Level 1+.</span> You prepare the list of level 1+ spells that
      are available for you to cast with this feature. To start, choose four
      level 1 Psion spells. <a
      href="https://5e.tools/spells.html#charm%20person_xphb"
      data-plut-hover="true" data-plut-hover-page="spells.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="charm%20person_xphb">Charm Person</a>, <a
      href="https://5e.tools/spells.html#command_xphb" data-plut-hover="true"
      data-plut-hover-page="spells.html" data-plut-hover-source="XPHB"
      data-plut-hover-hash="command_xphb">Command</a>, <a
      href="https://5e.tools/spells.html#dissonant%20whispers_xphb"
      data-plut-hover="true" data-plut-hover-page="spells.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="dissonant%20whispers_xphb">Dissonant Whispers</a>,
      and <a href="https://5e.tools/spells.html#mage%20armor_xphb"
      data-plut-hover="true" data-plut-hover-page="spells.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="mage%20armor_xphb">Mage Armor</a> are
      recommended.</p><p>The number of spells on your list increases as you gain
      Psion levels, as shown in the Prepared Spells column of the Psion Features
      table. Whenever that number increases, choose additional Psion spells
      until the number of spells on your list matches the number in the table.
      The chosen spells must be of a level for which you have spell slots. For
      example, if you're a level 3 Psion, your list of prepared spells can
      include six Psion spells of levels 1 and 2 in any combination.</p><p>If
      another Psion feature gives you spells that you always have prepared,
      those don't count against the number of spells you can prepare with this
      feature, but those spells otherwise count as Psion spells for
      you.</p></div><div data-roll-name-ancestor="Changing Your Prepared Spells"
      class="rd__b  rd__b--3"><p><span class="entry-title-inner">Changing Your
      Prepared Spells.</span> Whenever you gain a Psion level, you can replace
      one spell on your list with another Psion spell of an eligible
      level.</p></div><div data-roll-name-ancestor="Spellcasting Ability"
      class="rd__b  rd__b--3"><p><span class="entry-title-inner">Spellcasting
      Ability.</span> Intelligence is your spellcasting ability for your Psion
      spells.</p></div><div data-roll-name-ancestor="Psionic Spellcasting"
      class="rd__b  rd__b--3"><p><span class="entry-title-inner">Psionic
      Spellcasting.</span> When you cast a Psion spell, that spell doesn't
      require a Verbal or Material component, even if the spell includes "V" or
      "M" in its "Components" entry, except Material components that are
      consumed by the spell or have a cost specified in the
      spell.</p></div></div></div><div data-roll-name-ancestor="Level 1: Subtle
      Telekinesis" data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--1"><h2 class="rd__h rd__h--1" data-title-index="12"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p3">Level 1: Subtle Telekinesis</span></h2><p>You know
      the <a href="https://5e.tools/spells.html#mage%20hand_xphb"
      data-plut-hover="true" data-plut-hover-page="spells.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="mage%20hand_xphb">Mage
      Hand</a> cantrip. You can cast it without Somatic components, and you can
      make the spectral hand &amp;Reference[condition=Invisible] when you cast
      it.</p></div><div data-roll-name-ancestor="Level 2: Psionic Discipline"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="13"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p3">Level 2: Psionic Discipline</span></h2><p>You
      learn further psionic techniques that are fueled by your Psionic Energy
      Dice. You gain two disciplines of your choice, such as <a
      href="https://5e.tools/optionalfeatures.html#expanded%20awareness_xua2025psionupdate"
      data-plut-hover="true" data-plut-hover-page="optionalfeatures.html"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="expanded%20awareness_xua2025psionupdate">Expanded
      Awareness</a> and <a
      href="https://5e.tools/optionalfeatures.html#id%20insinuation_xua2025psionupdate"
      data-plut-hover="true" data-plut-hover-page="optionalfeatures.html"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="id%20insinuation_xua2025psionupdate">Id
      Insinuation</a>. Disciplines are described in the "Psionic Discipline
      Options" section later in this class's description.</p><p>You can use only
      one Discipline each turn and only once per turn unless otherwise noted in
      one of those options.</p><p>Whenever you gain a Psion level, you can
      replace one of your Psionic Discipline options with one you don't know.
      You gain one additional option at Psion levels 5, 10, 13, and
      17.</p></div><div data-roll-name-ancestor="Level 2: Psionic Discipline
      Options" data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--1"><h2 class="rd__h rd__h--1" data-title-index="14"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p3">Level 2: Psionic Discipline
      Options</span></h2><p>Psionic Discipline options appear in alphabetical
      order.</p><div class="rd__b  rd__b--2"><div
      data-roll-name-ancestor="Biofeedback" data-source="XUA2025PsionUpdate"
      class="rd__b spicy-sauce rd__b--2"><h3 class="rd__h rd__h--2"
      data-title-index="15"><span class="entry-title-inner help-subtle"
      title="Source: Unearthed Arcana 2025: Psion Update,
      p4">Biofeedback</span></h3><p>When you cast a <a
      href="https://5e.tools/spells.html#blankhash,flstclass:psion%20(xua25p)=1,flstschool:n=1~t=1,flstsource:xua2025psionupdate=1,flopsource:extend">a
      Psion spell from the Necromancy or Transmutation school</a>, you can
      expend a number of Psionic Energy Dice up to your Intelligence modifier,
      roll them, and gain a number of <a
      href="https://5e.tools/variantrules.html#temporary%20hit%20points_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="temporary%20hit%20points_xphb">Temporary Hit
      Points</a> equal to the total number rolled plus your Intelligence
      modifier (minimum of one).</p></div><div
      data-roll-name-ancestor="Bolstering Precognition"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="16"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Bolstering Precognition</span></h3><p>When you
      cast a <a
      href="https://5e.tools/spells.html#blankhash,flstclass:psion%20(xua25p)=1,flstschool:a=1~d=1,flstsource:xua2025psionupdate=1,flopsource:extend">a
      Psion spell from the Abjuration or Divination school</a>, you can expend
      one Psionic Energy Die. Roll the die and choose a creature you can see
      within 60 feet (which can be yourself). Until the end of your next turn,
      the creature gains a bonus to the next <a
      href="https://5e.tools/variantrules.html#d20%20test_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="d20%20test_xphb">D20
      Test</a> it makes equal to the number rolled.</p></div><div
      data-roll-name-ancestor="Destructive Thoughts"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="17"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Destructive Thoughts</span></h3><p>When you cast a
      <a
      href="https://5e.tools/spells.html#blankhash,flstclass:psion%20(xua25p)=1,flstschool:c=1~v=1,flstsource:xua2025psionupdate=1,flopsource:extend">a
      Psion spell from the Conjuration or Evocation school</a> that forces a
      creature you can see to make a saving throw against the spell, you can
      expend a number of Psionic Energy Dice up to your Intelligence modifier,
      and roll them. The creature takes Psychic damage equal to the total number
      rolled plus your Intelligence modifier (minimum of one), regardless of the
      result of the saving throw.</p></div><div
      data-roll-name-ancestor="Devilish Tongue" data-source="XUA2025PsionUpdate"
      class="rd__b spicy-sauce rd__b--2"><h3 class="rd__h rd__h--2"
      data-title-index="18"><span class="entry-title-inner help-subtle"
      title="Source: Unearthed Arcana 2025: Psion Update, p4">Devilish
      Tongue</span></h3><p>When you take the <a
      href="https://5e.tools/actions.html#influence_xphb" data-plut-hover="true"
      data-plut-hover-page="actions.html" data-plut-hover-source="XPHB"
      data-plut-hover-hash="influence_xphb">Influence</a> action, you can roll
      one Psionic Energy Die and add the number rolled to the ability check. If
      this causes you to succeed on the ability check, the die is
      expended.</p></div><div data-roll-name-ancestor="Expanded Awareness"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="19"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Expanded Awareness</span></h3><p>When you take the
      <a href="https://5e.tools/actions.html#search_xphb" data-plut-hover="true"
      data-plut-hover-page="actions.html" data-plut-hover-source="XPHB"
      data-plut-hover-hash="search_xphb">Search</a> action, you can roll one
      Psionic Energy Die and add the number rolled to the ability check. If this
      causes you to succeed on the ability check, the die is
      expended.</p></div><div data-roll-name-ancestor="Id Insinuation"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="20"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Id Insinuation</span></h3><p>When you cast a <a
      href="https://5e.tools/spells.html#blankhash,flstclass:psion%20(xua25p)=1,flstschool:e=1~i=1,flstsaving%20throw:strength=1~dexterity=1~constitution=1~intelligence=1~wisdom=1~charisma=1,flstsource:xua2025psionupdate=1,flopsource:extend">a
      Psion spell from the Enchantment or Illusion school</a> that forces a
      creature to make a saving throw, you can expend one Psionic Energy Dice
      and roll it. One target of the spell you can see subtracts half the number
      rolled (round up) from its saving throw against the spell.</p></div><div
      data-roll-name-ancestor="Inerrant Aim" data-source="XUA2025PsionUpdate"
      class="rd__b spicy-sauce rd__b--2"><h3 class="rd__h rd__h--2"
      data-title-index="21"><span class="entry-title-inner help-subtle"
      title="Source: Unearthed Arcana 2025: Psion Update, p5">Inerrant
      Aim</span></h3><p>When you make an attack roll against a creature and
      miss, you can roll one Psionic Energy Die and add the number rolled to the
      attack roll. If this causes the attack to hit, the die is
      expended.</p></div><div data-roll-name-ancestor="Observant Mind"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="22"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p5">Observant Mind</span></h3><p>When you take the <a
      href="https://5e.tools/actions.html#study_xphb" data-plut-hover="true"
      data-plut-hover-page="actions.html" data-plut-hover-source="XPHB"
      data-plut-hover-hash="study_xphb">Study</a> action, you can roll one
      Psionic Energy Die and add the number rolled to the ability check. If this
      causes you to succeed on the ability check, the die is
      expended.</p></div><div data-roll-name-ancestor="Psionic Backlash"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="23"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p5">Psionic Backlash</span></h3><p>Immediately after a
      creature you can see hits you with an attack roll, you can take a <a
      href="https://5e.tools/variantrules.html#reaction_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="reaction_xphb">Reaction</a> to expend one Psionic
      Energy Die, roll it, and reduce the damage you take from the attack equal
      to two times the number rolled plus your Intelligence modifier (minimum of
      two). In addition, you can force the attacker to make a Wisdom saving
      throw. On a failed save, the target takes Psychic damage equal to the
      amount of damage you reduced.</p></div><div
      data-roll-name-ancestor="Psionic Guards" data-source="XUA2025PsionUpdate"
      class="rd__b spicy-sauce rd__b--2"><h3 class="rd__h rd__h--2"
      data-title-index="24"><span class="entry-title-inner help-subtle"
      title="Source: Unearthed Arcana 2025: Psion Update, p5">Psionic
      Guards</span></h3><p>At the start of your turn, you can expend one Psionic
      Energy Die. Until the start of your next turn, you have <a
      href="https://5e.tools/variantrules.html#immunity_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="immunity_xphb">Immunity</a> to the
      &amp;Reference[condition=Charmed] and &amp;Reference[condition=Frightened]
      conditions and <a href="https://5e.tools/variantrules.html#advantage_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="advantage_xphb">Advantage</a> on Intelligence saving
      throws. If you are &amp;Reference[condition=Charmed] or
      &amp;Reference[condition=Frightened] when you use this discipline, the
      condition ends on you.</p><p>When you use Psionic Guards, you can also use
      a different Psionic Discipline this turn.</p></div><div
      data-roll-name-ancestor="Sharpened Mind" data-source="XUA2025PsionUpdate"
      class="rd__b spicy-sauce rd__b--2"><h3 class="rd__h rd__h--2"
      data-title-index="25"><span class="entry-title-inner help-subtle"
      title="Source: Unearthed Arcana 2025: Psion Update, p5">Sharpened
      Mind</span></h3><p>At the start of your turn, you can expend one Psionic
      Energy Die to hone your destructive psionics. Roll the die and record the
      number rolled. You gain the following benefits for 1 minute or until you
      have the Incapacitated condition.</p><div
      data-roll-name-ancestor="Bypassing Psionics" class="rd__b 
      rd__b--3"><p><span class="entry-title-inner">Bypassing Psionics.</span> <a
      href="https://5e.tools/variantrules.html#damage_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="damage_xphb">Damage</a> from your weapon attacks,
      Psion spells, and Psion features ignores <a
      href="https://5e.tools/variantrules.html#resistance_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="resistance_xphb">Resistance</a> to Psychic
      damage.</p></div><div data-roll-name-ancestor="Attack Mode" class="rd__b 
      rd__b--3"><p><span class="entry-title-inner">Attack Mode.</span> Once per
      turn, when you deal Psychic damage to one or more creatures, you can
      replace the number rolled on one of the damage dice with the number
      recorded when you activated this Psionic Discipline. When you use
      Sharpened Mind, you can also use a different Psionic Discipline this
      turn.</p></div></div></div></div><div data-roll-name-ancestor="Level 3:
      Psion Subclass" data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--1"><h2 class="rd__h rd__h--1" data-title-index="28"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Level 3: Psion Subclass</span></h2><p>You gain a
      Psion subclass of your choice. The <a
      href="https://5e.tools/classes.html#psion_xua2025psionupdate,state:sub_metamorph_xua2025psionupdate=b1,fltsource:clear,flstmiscellaneous:clear"
      data-plut-hover="true" data-plut-hover-page="classes.html"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="psion_xua2025psionupdate,state:sub_metamorph_xua2025psionupdate=b1">Metamorph</a>,
      <a
      href="https://5e.tools/classes.html#psion_xua2025psionupdate,state:sub_psykinetic_xua2025psionupdate=b1,fltsource:clear,flstmiscellaneous:clear"
      data-plut-hover="true" data-plut-hover-page="classes.html"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="psion_xua2025psionupdate,state:sub_psykinetic_xua2025psionupdate=b1">Psykinetic</a>,
      and <a
      href="https://5e.tools/classes.html#psion_xua2025psionupdate,state:sub_telepath_xua2025psionupdate=b1,fltsource:clear,flstmiscellaneous:clear"
      data-plut-hover="true" data-plut-hover-page="classes.html"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="psion_xua2025psionupdate,state:sub_telepath_xua2025psionupdate=b1">Telepath</a>
      subclasses are detailed after this class's description. A subclass is a
      specialization that grants you features at certain Psion levels. For the
      rest of your career, you gain each of your subclass's features that are of
      your Psion level or lower.</p></div><div data-roll-name-ancestor="Level 4:
      Ability Score Improvement" data-source="XUA2025PsionUpdate" class="rd__b
      spicy-sauce rd__b--1"><h2 class="rd__h rd__h--1"
      data-title-index="29"><span class="entry-title-inner help-subtle"
      title="Source: Unearthed Arcana 2025: Psion Update, p4">Level 4: Ability
      Score Improvement</span></h2><p>You gain the <a
      href="https://5e.tools/feats.html#ability%20score%20improvement_xphb"
      data-plut-hover="true" data-plut-hover-page="feats.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="ability%20score%20improvement_xphb">Ability Score
      Improvement</a> feat or another <a
      href="https://5e.tools/feats.html">feat</a> of your choice for which you
      qualify. You gain this feature again at Psion levels 8, 12, and
      16.</p></div><div data-roll-name-ancestor="Level 5: Psionic Restoration"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="30"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Level 5: Psionic Restoration</span></h2><p>You can
      perform a meditation that focuses the mind for 1 minute. At the end of it,
      you regain expended Psionic Energy Dice. Once you use this feature, you
      can't do so again until you finish a <a
      href="https://5e.tools/variantrules.html#long%20rest_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="long%20rest_xphb">Long
      Rest</a>.</p></div><div data-roll-name-ancestor="Level 5: Psionic
      Discipline" data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--1"><h2 class="rd__h rd__h--1" data-title-index="31"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p2">Level 5: Psionic Discipline</span></h2><p>At 5th
      level, you learn an additional Psionic Discipline.</p></div><div
      data-roll-name-ancestor="Level 6: Subclass Feature"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="32"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p2">Level 6: Subclass Feature</span></h2><p>You gain a
      feature from your Psion Subclass.</p></div><div
      data-roll-name-ancestor="Level 7: Psionic Surge"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="33"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Level 7: Psionic Surge</span></h2><p>You can push
      your psionic powers using your life force. After you roll one or more
      Psionic Energy Dice, you can expend one of your Hit Point Dice and treat
      any roll of 1, 2, or 3 on those Psionic Energy Dice as a 4.</p></div><div
      data-roll-name-ancestor="Level 8: Ability Score Improvement"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="34"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Level 8: Ability Score
      Improvement</span></h2><p>You gain the <a
      href="https://5e.tools/feats.html#ability%20score%20improvement_xphb"
      data-plut-hover="true" data-plut-hover-page="feats.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="ability%20score%20improvement_xphb">Ability Score
      Improvement</a> feat or another <a
      href="https://5e.tools/feats.html">feat</a> of your choice for which you
      qualify.</p></div><div data-roll-name-ancestor="Level 10: Psionic
      Discipline" data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--1"><h2 class="rd__h rd__h--1" data-title-index="35"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p2">Level 10: Psionic Discipline</span></h2><p>At 10th
      level, you learn an additional Psionic Discipline.</p></div><div
      data-roll-name-ancestor="Level 10: Subclass Feature"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="36"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p2">Level 10: Subclass Feature</span></h2><p>You gain
      a feature from your Psion Subclass.</p></div><div
      data-roll-name-ancestor="Level 12: Ability Score Improvement"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="37"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Level 12: Ability Score
      Improvement</span></h2><p>You gain the <a
      href="https://5e.tools/feats.html#ability%20score%20improvement_xphb"
      data-plut-hover="true" data-plut-hover-page="feats.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="ability%20score%20improvement_xphb">Ability Score
      Improvement</a> feat or another <a
      href="https://5e.tools/feats.html">feat</a> of your choice for which you
      qualify.</p></div><div data-roll-name-ancestor="Level 13: Psionic
      Discipline" data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--1"><h2 class="rd__h rd__h--1" data-title-index="38"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p2">Level 13: Psionic Discipline</span></h2><p>At 13th
      level, you learn an additional Psionic Discipline.</p></div><div
      data-roll-name-ancestor="Level 14: Subclass Feature"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="39"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p2">Level 14: Subclass Feature</span></h2><p>You gain
      a feature from your Psion Subclass.</p></div><div
      data-roll-name-ancestor="Level 16: Ability Score Improvement"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="40"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Level 16: Ability Score
      Improvement</span></h2><p>You gain the <a
      href="https://5e.tools/feats.html#ability%20score%20improvement_xphb"
      data-plut-hover="true" data-plut-hover-page="feats.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="ability%20score%20improvement_xphb">Ability Score
      Improvement</a> feat or another <a
      href="https://5e.tools/feats.html">feat</a> of your choice for which you
      qualify.</p></div><div data-roll-name-ancestor="Level 17: Psionic
      Discipline" data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--1"><h2 class="rd__h rd__h--1" data-title-index="41"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p2">Level 17: Psionic Discipline</span></h2><p>At 17th
      level, you learn an additional Psionic Discipline.</p></div><div
      data-roll-name-ancestor="Level 18: Psionic Reserves"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="42"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Level 18: Psionic Reserves</span></h2><p>When you
      roll <a href="https://5e.tools/variantrules.html#initiative_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="initiative_xphb">Initiative</a>, you regain expended
      uses of Psionic Energy Dice until you have four if you have fewer than
      that.</p></div><div data-roll-name-ancestor="Level 19: Epic Boon"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="43"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Level 19: Epic Boon</span></h2><p>You gain an <a
      href="https://5e.tools/feats.html#blankhash,flstcategory:eb=1">Epic Boon
      feat</a> or another <a href="https://5e.tools/feats.html">feat</a> of your
      choice for which you qualify. <a
      href="https://5e.tools/feats.html#boon%20of%20energy%20resistance_xphb"
      data-plut-hover="true" data-plut-hover-page="feats.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="boon%20of%20energy%20resistance_xphb">Boon of Energy
      Resistance</a> is recommended.</p></div><div
      data-roll-name-ancestor="Level 20: Enkindled Life Force"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--1"><h2
      class="rd__h rd__h--1" data-title-index="44"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p4">Level 20: Enkindled Life Force</span></h2><p>You
      burn your life force to achieve greater psionics. Once per turn, when you
      roll one or more Psionic Energy Dice for a Psion feature or Psionic
      Discipline, you can expend one or two of your <a
      href="https://5e.tools/variantrules.html#hit%20point%20dice_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="hit%20point%20dice_xphb">Hit Point Dice</a>. For
      each <a href="https://5e.tools/variantrules.html#hit%20points_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="hit%20points_xphb">Hit
      Point</a> Die expended, roll an additional Psionic Energy Die and add the
      numbers rolled to the total. This roll does not expend the Psionic Energy
      Die.</p></div></div></div>
