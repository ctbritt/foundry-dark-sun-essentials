name: Mountain's Resilience
type: feat
system:
  description:
    value: >-
      <p>At 1st level you are imbued with the strength and fortitude of the
      earth. This grants several benefits:</p><ul><li>You gain proficiency with
      martial weapons and heavy armor.</li><li>Your hit points maximum increases
      by 1, and it increases by one every time you gain a level.</li><li>You
      learn the @UUID[Item.M1pXLu9nqV0I3OK2]{Mold Earth} or
      @UUID[Item.CIvEEUZp1AZJt8kk]{Magic Stone} cantrip, your choice. The
      cantrip you selected counts as a cleric cantrip for you and doesn’t count
      against the number of cleric cantrips you know.</li><li>When you use your
      Turn Undead channel divinity, you can also effect non-earth
      elementals.</li></ul><section class="secret"
      id="secret-eIZSkwq5th2jY5fC"><p><strong>Foundry Note</strong></p><p>The HP
      gain from Mountain's Resilience should be configured by adding 1 to the
      "Per Level" bonus in HP configuration on your character sheet (accessible
      using the cog next to your character's hit points).</p></section>
