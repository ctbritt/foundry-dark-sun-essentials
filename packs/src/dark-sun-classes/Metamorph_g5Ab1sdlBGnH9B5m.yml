name: Metamorph
type: subclass
system:
  identifier: metamorph
  classIdentifier: psion
  description:
    value: >-
      <div class="mb-2 ve-flex-col"><p><em class="ve-muted">Note: importing a
      class as an item is provided for display purposes only. If you wish to
      import a class to a character sheet, please use the importer on the sheet
      instead.</em></p><div><p><em>Psychically Sculpt Life and
      Flesh</em></p></div><div class="rd__b  rd__b--0"><div
      data-roll-name-ancestor="Metamorph" data-source="XUA2025PsionUpdate"
      class="rd__b spicy-sauce rd__b--1"><h2 class="rd__h rd__h--1"
      data-title-index="7"><span class="entry-title-inner help-subtle"
      title="Source: Unearthed Arcana 2025: Psion Update,
      p7">Metamorph</span></h2><p>Your mastery of psionic powers turns inward.
      Your own flesh becomes like clay to you, and you mold it into the perfect
      vessel for your psionic powers. Experience in manipulating your life
      energy also enables you to adjust the life force of friends and
      foes.</p><div data-roll-name-ancestor="Level 3: Metamorph Spells"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="8"><span class="entry-title-inner
      help-subtle" title="Source: Unearthed Arcana 2025: Psion Update, p7">Level
      3: Metamorph Spells</span></h3><p>When you reach a Psion level specified
      in the <a
      href="https://5e.tools/tables.html#metamorph%20spells_xua2025psionupdate"
      data-plut-hover="true" data-plut-hover-page="tables.html"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="metamorph%20spells_xua2025psionupdate">Metamorph
      Spells</a> table, you thereafter always have the listed spells
      prepared.</p><table class="rd__b-special rd__b-data 
      rd__b-data--stats"><thead><tr><th class="rd__data-embed-header
      ve-text-left" data-rd-data-embed-header="true" colspan="6"><div
      class="w-100 split-v-center"><div class="ve-flex-v-center w-100
      min-w-0"><p><span class="rd__data-embed-name ve-hidden">Metamorph
      Spells</span></p></div><p><span
      class="rd__data-embed-toggle">[–]</span></p></div></th></tr></thead><tbody
      data-rd-embedded-data-render-target="true"><tr><td data-rd-tag="table"
      data-rd-uid="Metamorph Spells|XUA2025PsionUpdate"
      data-rd-page="tables.html" data-rd-source="XUA2025PsionUpdate"
      data-rd-hash="metamorph%20spells_xua2025psionupdate"
      data-rd-name="Metamorph Spells" data-rd-display-name="Metamorph Spells"
      data-rd-style data-rd-entry-data="{}" colspan="6"><em>Loading </em><a
      href="https://5e.tools/tables.html#metamorph%20spells_xua2025psionupdate"
      data-plut-hover="true" data-plut-hover-page="tables.html"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="metamorph%20spells_xua2025psionupdate"><em>Metamorph
      Spells</em></a><em>...</em></td></tr></tbody></table></div><div
      data-roll-name-ancestor="Level 3: Organic Weapons"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="9"><span class="entry-title-inner
      help-subtle" title="Source: Unearthed Arcana 2025: Psion Update, p8">Level
      3: Organic Weapons</span></h3><p>You can shape your limbs into weapons. As
      a Magic action, you can reform your free hand into one of the following
      organic weapons: Bone Blade, Flesh Maul, or Viscera Launcher. When you
      take the <a href="https://5e.tools/actions.html#attack_xphb"
      data-plut-hover="true" data-plut-hover-page="actions.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="attack_xphb">Attack</a> action, you can use this
      feature before you make the attack roll. Your limb retains the form of the
      organic weapon until you take a <a
      href="https://5e.tools/actions.html#magic_xphb" data-plut-hover="true"
      data-plut-hover-page="actions.html" data-plut-hover-source="XPHB"
      data-plut-hover-hash="magic_xphb">Magic</a> action to change it into
      another organic weapon, you have the Unconscious condition, or you return
      the limb to its previous form (no action required).</p><p>Whenever you
      attack with the weapon, you can use your Intelligence modifier for the
      attack and damage rolls instead of using Strength or Dexterity.</p><div
      class="rd__b  rd__b--3"><p></p><div data-roll-name-ancestor="Bone Blade"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--3"><p><span class="entry-title-inner help-subtle" title="Source:
      Unearthed Arcana 2025: Psion Update, p8">Bone Blade.</span> A blade made
      of bone springs from your forearm or extends from your hand. The blade
      counts as a Simple Melee weapon with <span class="help help--hover"
      data-plut-hover="true" data-plut-hover-page="itemProperty"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="f_xphb">Finesse</span>, and it deals 1d8 damage on a
      hit. You have <a href="https://5e.tools/variantrules.html#advantage_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="advantage_xphb">Advantage</a> on the attack roll you
      make with the blade if at least one of your allies is within 5 feet of the
      target and the ally doesn't have the Incapacitated
      condition.</p></div><div data-roll-name-ancestor="Flesh Maul"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--3"><p><span class="entry-title-inner help-subtle" title="Source:
      Unearthed Arcana 2025: Psion Update, p8">Flesh Maul.</span> Your fist and
      forearm coalesce into a hardened mass of flesh and bone. The maul counts
      as a Simple Melee weapon and deals 1d10 damage on a hit. A creature hit by
      the maul has <a
      href="https://5e.tools/variantrules.html#disadvantage_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="disadvantage_xphb">Disadvantage</a> on the next
      Strength or Constitution saving throw it makes before the start of its
      next turn.</p></div><div data-roll-name-ancestor="Viscera Launcher"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--3"><p><span class="entry-title-inner help-subtle" title="Source:
      Unearthed Arcana 2025: Psion Update, p8">Viscera Launcher.</span> Your
      hand and forearm transform into a crossbow made of muscle and sinew that
      fires bolts of bile. The launcher counts as a Simple Ranged weapon with a
      normal range of 30 feet and a long range of 90 feet, and it deals 1d6
      damage on a hit. Once on each of your turns when you hit a creature with
      an attack roll using the launcher, you can deal an extra 1d6 damage to the
      target.</p></div></div></div><div data-roll-name-ancestor="Level 3:
      Mutable Form" data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--2"><h3 class="rd__h rd__h--2" data-title-index="13"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p7">Level 3: Mutable Form</span></h3><p>As a <a
      href="https://5e.tools/variantrules.html#bonus%20action_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="bonus%20action_xphb">Bonus Action</a>, you can
      expend one Psionic Energy Die to psionically stretch your limbs for 1
      minute. Roll the expended Psionic Energy Die and gain a number of <a
      href="https://5e.tools/variantrules.html#temporary%20hit%20points_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="temporary%20hit%20points_xphb">Temporary Hit
      Points</a> equal to the number rolled plus your Intelligence modifier
      (minimum of 1 <a
      href="https://5e.tools/variantrules.html#temporary%20hit%20points_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="temporary%20hit%20points_xphb">Temporary Hit
      Point</a>). In addition, you gain the following benefits while this
      feature is active.</p><ul class="rd__list rd__list-no-bullets"><li
      class="rd__li "><p class="rd__p-list-item"
      data-roll-name-ancestor="Reach"><span class="bold
      rd__list-item-name">Reach.</span> Your reach increases by 5
      feet.</p></li><li class="rd__li "><p class="rd__p-list-item"
      data-roll-name-ancestor="Speed"><span class="bold
      rd__list-item-name">Speed.</span> Your <a
      href="https://5e.tools/variantrules.html#speed_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="speed_xphb">Speed</a>
      increases by 5 feet.</p></li><li class="rd__li "><p
      class="rd__p-list-item" data-roll-name-ancestor="Touch"><span class="bold
      rd__list-item-name">Touch.</span> When you cast a spell that has a range
      of Touch and a casting time of an action, you can make the spell's range
      10 feet.</p></li></ul></div></div><div class="rd__b  rd__b--1"><div
      data-roll-name-ancestor="Level 6: Extra Attack"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="14"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p8">Level 6: Extra Attack</span></h3><p>You can attack
      twice instead of once whenever you take the <a
      href="https://5e.tools/actions.html#attack_xphb" data-plut-hover="true"
      data-plut-hover-page="actions.html" data-plut-hover-source="XPHB"
      data-plut-hover-hash="attack_xphb">Attack</a> action on your
      turn.</p><p>In addition, you can cast one of your Psion cantrips that has
      a casting time of an action in place of one of those
      attacks.</p></div></div><div class="rd__b  rd__b--1"><div
      data-roll-name-ancestor="Level 6: Flesh Weaver"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="15"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p8">Level 6: Flesh Weaver</span></h3><p>When you use
      Mutable Form, you can expend an additional Psionic Energy Die to gain the
      following benefits while the feature is active.</p><ul class="rd__list
      rd__list-no-bullets"><li class="rd__li "><p class="rd__p-list-item"
      data-roll-name-ancestor="Organic Defense"><span class="bold
      rd__list-item-name">Organic Defense.</span> You gain a +2 bonus to
      AC.</p></li><li class="rd__li "><p class="rd__p-list-item"
      data-roll-name-ancestor="Empowered Healing"><span class="bold
      rd__list-item-name">Empowered Healing.</span> When you cast a spell with a
      spell slot that restores <a
      href="https://5e.tools/variantrules.html#hit%20points_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="hit%20points_xphb">Hit
      Points</a> to one or more creatures, you can expend one Psionic Energy
      Die, roll it, and add the number rolled to the number of <a
      href="https://5e.tools/variantrules.html#hit%20points_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="hit%20points_xphb">Hit
      Points</a> regained.</p></li></ul></div></div><div class="rd__b 
      rd__b--1"><div data-roll-name-ancestor="Level 10: Improved Mutable Form"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="16"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p8">Level 10: Improved Mutable Form</span></h3><p>When
      you use <a
      href="https://5e.tools/classes.html#psion_xua2025psionupdate,state:sub_metamorph_xua2025psionupdate=b1~feature=s2-0"
      data-plut-hover="true" data-plut-hover-page="subclassfeature"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="mutable%20form_psion_xua2025psionupdate_metamorph_xua2025psionupdate_3_xua2025psionupdate">Mutable
      Form</a>, the duration increases to 10 minutes and you gain one of the
      following benefits of your choice, the effects of which last until <a
      href="https://5e.tools/classes.html#psion_xua2025psionupdate,state:sub_metamorph_xua2025psionupdate=b1~feature=s2-0"
      data-plut-hover="true" data-plut-hover-page="subclassfeature"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="mutable%20form_psion_xua2025psionupdate_metamorph_xua2025psionupdate_3_xua2025psionupdate">Mutable
      Form</a> ends.</p><div class="rd__b  rd__b--3"><p></p><div
      data-roll-name-ancestor="Stony Epidermis" data-source="XUA2025PsionUpdate"
      class="rd__b spicy-sauce rd__b--3"><p><span class="entry-title-inner
      help-subtle" title="Source: Unearthed Arcana 2025: Psion Update, p8">Stony
      Epidermis.</span> You have <a
      href="https://5e.tools/variantrules.html#advantage_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="advantage_xphb">Advantage</a> on Constitution saving
      throws to maintain <a
      href="https://5e.tools/conditionsdiseases.html#concentration_xphb"
      data-plut-hover="true" data-plut-hover-page="conditionsdiseases.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="concentration_xphb">Concentration</a>. In addition,
      choose one of the following damage types: Acid, Bludgeoning, Cold, Fire,
      Lightning, Piercing, Poison, Slashing, or Thunder. You gain <a
      href="https://5e.tools/variantrules.html#resistance_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="resistance_xphb">Resistance</a> to the chosen damage
      type.</p></div><div data-roll-name-ancestor="Superior Stride"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--3"><p><span class="entry-title-inner help-subtle" title="Source:
      Unearthed Arcana 2025: Psion Update, p8">Superior Stride.</span> While you
      aren't wearing armor, you can take the <a
      href="https://5e.tools/actions.html#dash_xphb" data-plut-hover="true"
      data-plut-hover-page="actions.html" data-plut-hover-source="XPHB"
      data-plut-hover-hash="dash_xphb">Dash</a> action as a <a
      href="https://5e.tools/variantrules.html#bonus%20action_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="bonus%20action_xphb">Bonus Action</a>, and you have
      a <a href="https://5e.tools/variantrules.html#climb%20speed_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="climb%20speed_xphb">Climb Speed</a> and <a
      href="https://5e.tools/variantrules.html#swim%20speed_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="swim%20speed_xphb">Swim Speed</a> equal to your <a
      href="https://5e.tools/variantrules.html#speed_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="speed_xphb">Speed</a>.
      Unnatural Flexibility. You gain a +1 bonus to AC, and your body—along with
      any equipment you're wearing or carrying—becomes pliable. You can move
      through any space as narrow as 1 inch, and you can spend 5 feet of
      movement to escape from nonmagical restraints or end the Grappled
      condition.</p></div><div data-roll-name-ancestor="Unnatural Flexibility"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce
      rd__b--3"><p><span class="entry-title-inner help-subtle" title="Source:
      Unearthed Arcana 2025: Psion Update, p8">Unnatural Flexibility.</span> You
      gain a +2 bonus to AC, and your body, along with any equipment you're
      wearing or carrying, becomes pliable. You can move through any space as
      narrow as 1 inch, and you can spend 5 feet of movement to escape from
      nonmagical restraints or end the &amp;Reference[condition=Grappled]
      condition.</p></div></div></div></div><div class="rd__b  rd__b--1"><div
      data-roll-name-ancestor="Level 14: Life-Bending Weapons"
      data-source="XUA2025PsionUpdate" class="rd__b spicy-sauce rd__b--2"><h3
      class="rd__h rd__h--2" data-title-index="20"><span
      class="entry-title-inner help-subtle" title="Source: Unearthed Arcana
      2025: Psion Update, p8">Level 14: Life-Bending Weapons</span></h3><p>Your
      weapon becomes wreathed in negative energy, and you radiate life-mending
      psionic energy. When you hit a target with an attack roll using your <a
      href="https://5e.tools/classes.html#psion_xua2025psionupdate,state:sub_metamorph_xua2025psionupdate=b1~feature=s2-0"
      data-plut-hover="true" data-plut-hover-page="subclassfeature"
      data-plut-hover-source="XUA2025PsionUpdate"
      data-plut-hover-hash="organic%20weapons_psion_xua2025psionupdate_metamorph_xua2025psionupdate_3_xua2025psionupdate">Organic
      Weapon</a>, roll one Psionic Energy Die. The target takes extra Necrotic
      damage equal to the number rolled. This roll doesn't expend the
      die.</p><p>Alternatively, when you hit a creature with your Organic
      Weapon, you can instead expend one Psionic Energy Die and roll it. The
      target takes extra Necrotic damage equal to the roll, and each creature of
      your choice in a 30-foot <a
      href="https://5e.tools/variantrules.html#emanation%20%5barea%20of%20effect%5d_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB"
      data-plut-hover-hash="emanation%20%5barea%20of%20effect%5d_xphb">Emanation</a>
      originating from you regains <a
      href="https://5e.tools/variantrules.html#hit%20points_xphb"
      data-plut-hover="true" data-plut-hover-page="variantrules.html"
      data-plut-hover-source="XPHB" data-plut-hover-hash="hit%20points_xphb">Hit
      Points</a> equal the number rolled plus your Intelligence modifier. Once
      you use this feature, you can't do so again until the start of your next
      turn.</p></div></div></div></div>
