name: Wrath of the Storm
type: feat
system:
  description:
    value: >-
      When a creature within 5 ft. that you can see hits you with an attack, you
      can use your reaction to cause the creature to make a DEX saving throw (DC
      [[8 + @abilities.wis.mod + @prof]] or it takes 2d8
      &amp;Reference[lightning]{lightning} or &amp;Reference[thunder]{thunder}
      damage (your choice), half damage on success).
        <details>
          <summary>
            More Details
          </summary>
          <p>
            </p><p>Also at 1st level, you can thunderously rebuke attackers. When a creature within 5 feet of you that you can see hits you with an attack, you can use your reaction to cause the creature to make a &amp;Reference[dex]{Dexterity} saving throw. The creature takes 2d8 &amp;Reference[lightning]{lightning} or &amp;Reference[thunder]{thunder} damage (your choice) on a failed saving throw, and half as much damage on a successful one.</p>
      <p>You can use this feature a number of times equal to your
      &amp;Reference[wis]{Wisdom} modifier (a minimum of once). You regain all
      expended uses when you finish a long rest.</p>
          <p></p>
        </details>
