system:
  description:
    value: >-
      <h3><strong>CIRCLE OF THE LAND</strong></h3><p class="p1">The landscape of
      Athas is much different than that of other worlds so Circle of the Land
      druids have a few new land types and associated bonus spells to choose
      from. The list below should be used in place of the one provided in the
      Player's Handbook.</p><p class="p5"><em>* Spell Source: Elemental Evil
      Player's Guide</em></p><p><strong>SANDY DESERT</strong></p><p
      class="p2">Includes dust basin and sandy waste
      terrains.</p><table><thead><tr><th>Druid
      Level</th><th>Spells</th></tr></thead><tbody><tr><td class="td3"><p
      class="p5">3rd</p></td><td class="td4"><p
      class="p4">@UUID[Compendium.dnd-players-handbook.spells.phbsplBlur000000]{Blur},
      @UUID[Compendium.shareddata.ddb-spells.zqT70gnUn336UVd5]{Dust
      Devil}*</p></td></tr><tr><td class="td1"><p
      class="p5">5th</p></td><td><p>@UUID[Compendium.dnd-players-handbook.spells.phbsplCreateFood]{Create
      Food and Water},
      @UUID[Compendium.shareddata.ddb-spells.wk6iM4812zYcdKny]{Wall of
      Sand}*</p></td></tr><tr><td class="td5"><p class="p5">7th</p></td><td
      class="td6"><p
      class="p4">@UUID[Compendium.dnd-players-handbook.spells.phbsplGiantInsec]{Giant
      Insect},
      @UUID[Compendium.dnd-players-handbook.spells.phbsplHallucinat]{Hallucinatory
      Terrain}</p></td></tr><tr><td class="td1"><p class="p5">9th</p></td><td
      class="td2"><p
      class="p4">@UUID[Compendium.shareddata.ddb-spells.5XLrbo2DMvcOK6AK]{Control
      Winds},
      @UUID[Compendium.dnd-players-handbook.spells.phbsplCommunewit]{Commune
      with Nature}</p></td></tr></tbody></table>
