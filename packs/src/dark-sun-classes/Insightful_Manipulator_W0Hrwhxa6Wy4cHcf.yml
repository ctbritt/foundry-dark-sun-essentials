  description:
    value: >-
      <div class="ddb">

      <p>Starting at 9th level, if you spend at least 1 minute observing or
      interacting with another creature outside combat, you can learn certain
      information about its capabilities compared to your own. The DM tells you
      if the creature is your equal, superior, or inferior in regard to two of
      the following characteristics of your choice:</p>

      <ul>

      <li>Intelligence score</li>

      <li>Wisdom score</li>

      <li>Charisma score</li>

      <li>Class levels (if any)</li>

      </ul>

      <p>At the DM’s option, you might also realize you know a piece of the
      creature’s history or one of its personality traits, if it has any.</p>

      </div>
    chat: >-
      <div class="ddb">

      If you spend at least 1 minute observing or interacting with another
      creature outside combat, you can learn whether it is your equal, superior,
      or inferior in any two of its INT, WIS, CHA scores, or class levels (if
      any).

      </div>
