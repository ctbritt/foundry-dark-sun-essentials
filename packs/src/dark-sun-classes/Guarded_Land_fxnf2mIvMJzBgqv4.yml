  description:
    value: >-
      <p>Every druid must choose one geographic feature to be his guarded lands.
      The geographic features that a druid might make his guarded lands can vary
      widely. For instance, one may watch over a particular stretch of open
      desert, another may protect a belt of scrub grass within it, while still
      another might watch over a small oasis that borders on both. This
      connection to the land provides several abilities, all of which function
      only within the confines of the druid's guarded
      lands.</p><ul><li><p>Starting at 1st level, the druid is under the
      constant effect of a
      @UUID[Compendium.dnd-players-handbook.spells.phbsplPasswithou]{Pass
      without Trace} spell.</p></li><li><p>At 3rd level, the druid can cast
      @UUID[Compendium.dnd-players-handbook.spells.phbsplSpeakwithA]{Speak with
      Animals} at will</p></li><li><p>At 5th level, the druid can cast
      @UUID[Compendium.dnd-players-handbook.spells.phbsplSpeakwithP]{Speak with
      Plants} at will</p></li><li><p>At 7th level, the druid can live without
      water or food indefinitely, drawing nourishment directly from the life
      energy of the land</p></li></ul>
