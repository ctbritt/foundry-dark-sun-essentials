          type: merchant
          deleteWhenEmpty: true
          description: "<p><em><strong>Narissa's Colors and Scents - Cosmetics & Discrete Poisons\_</strong></em></p><p><em><strong>Narissa, Proprietor</strong></em></p><p>Goods include perfumes, body oils, face paints, colorful feathers, and (for favored customers) poisons. Narissa, a beautiful half-elf said to be the illegitimate daughter of an important templar, is the soul of discretion, no matter the purchase.</p><p><strong>Services & Inventory:</strong></p><ul><li><p>Perfumes & Fragrances: Exotic scents from across the Tablelands</p></li><li><p>Body Oils: Moisturizing and aromatic preparations for Athas's harsh climate</p></li><li><p>Face Paints: Cosmetic pigments and theatrical makeup</p></li><li><p>Decorative Feathers: Colorful plumage for fashion and ceremonies</p></li></ul>"
