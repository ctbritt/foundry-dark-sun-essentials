        - name: 'Psychic Scream: Stunned'
          img: icons/weapons/daggers/dagger-twin-curved-black.webp
          origin: >-
            Actor.jzrhEIChYPHu4UIK.Item.cj3qS9zC3KrsaT50.ActiveEffect.jmQJfqbD9cxPbOwD
          transfer: false
          _id: QcLI5dQUF2kcdkwj
          type: base
          system:
            changes: []
          disabled: false
          duration:
            value: 0
            units: seconds
            expiry: turnStart
            expired: false
          description: >-
            <p><em>(Triggered Ability)</em></p><p>When one Pale Sister is
            reduced to 0 hit points or falls unconscious, the surviving sister
            immediately gains the following benefits as her psychic bond
            shatters into pure rage:</p><p><em><strong>Immediate
            Effects:</strong></em></p><ul><li><strong>Trigger:</strong> As a
            reaction when her sister falls, the surviving sister lets out a
            psychic scream. All creatures within 30 feet must make a DC 15
            Wisdom saving throw or be stunned until the end of the sister's next
            turn.</li><li><strong>Temporary Hit Points:</strong> The surviving
            sister gains 30 temporary hit points.</li><li><strong>Speed
            Increase:</strong> Her movement speed increases by 15
            feet.</li></ul><p><em><strong>Ongoing Benefits (Until End of
            Combat):</strong></em></p><ul><li><strong>Attacks:</strong> Gains
            one additional attack when taking the Multiattack
            action.</li><li><strong>Damage Bonus:</strong> All melee attacks
            deal an extra 7 (2d6) psychic
            damage.</li><li><strong>Advantage:</strong> Has advantage on all
            attack rolls and saving throws.</li><li><strong>Psychic
            Aura:</strong> Any creature that starts its turn within 10 feet of
            the raging sister takes 5 (1d10) psychic damage (no
            save).</li><li><strong>Unstoppable:</strong> Immune to being
            charmed, frightened, paralyzed, or stunned.</li><li><strong>Reckless
            Fury:</strong> Attacks against the raging sister have
            advantage.</li></ul><p><em><strong>Death Throes:</strong></em> If
            the raging sister is also reduced to 0 hit points, she releases a
            final psychic death burst. All creatures within 20 feet must make a
            DC 15 Intelligence saving throw, taking 21 (6d6) psychic damage on a
            failed save, or half as much on a successful
            one.</p><hr><h3><strong>Lore Note:</strong></h3><p><em>"The Pale
            Sisters share more than blood—their minds are linked by a psychic
            tether forged through years of Nibenese templar conditioning. This
            connection, meant to make them perfect synchronized bodyguards,
            becomes a terrible weapon when severed by death. The surviving
            sister's grief manifests as raw psychic energy, transforming her
            into a whirlwind of telepathic fury and
            violence."</em></p><hr><h3><strong>Tactical Considerations for
            DM:</strong></h3><ul><li>Players might try to incapacitate both
            sisters simultaneously to avoid triggering this</li><li>The stunning
            scream can change the battlefield dynamics instantly</li><li>The
            raging sister becomes a glass cannon—deadly but easier to
            hit</li><li>Consider having the sisters positioned apart to make
            simultaneous targeting harder</li><li>The psychic damage aura
            punishes melee combatants, encouraging ranged
            attacks</li></ul><p>This feature makes the choice of which sister to
            target first a meaningful tactical decision and ensures the fight
            escalates dramatically when one falls.</p>
