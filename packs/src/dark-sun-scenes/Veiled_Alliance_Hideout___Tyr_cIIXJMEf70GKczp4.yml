          name: Produce Flame
          type: spell
          system:
            source:
              custom: ''
              book: PHB 2024
              page: '308'
              license: ''
              rules: '2024'
              revision: 1
            description:
              value: >-
                <div class="rd__b  rd__b--3"><p>A flickering flame appears in
                your hand and remains there for the duration. While there, the
                flame emits no heat and ignites nothing, and it sheds
                @variantrule[Bright Light|XPHB] in a 20-foot radius and
                @variantrule[Dim Light|XPHB] for an additional 20 feet. The
                spell ends if you cast it again.</p><p>Until the spell ends, you
                can take a @action[Magic|XPHB] action to hurl fire at a creature
                or an object within 60 feet of you. Make a ranged spell attack.
                On a hit, the target takes [[/damage 1d8 type=fire]]
                damage.</p></div><div class="rd__b  rd__b--3"><p></p><div
                data-roll-name-ancestor="Cantrip Upgrade" class="rd__b 
                rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1">
                <span class="entry-title-inner">Cantrip Upgrade.</span></span>
                The damage increases by [[/damage 1d8]] when you reach levels 5
                ([[/damage 2d8]]), 11 ([[/damage 3d8]]), and 17 ([[/damage
                4d8]]).</p></div></div>
