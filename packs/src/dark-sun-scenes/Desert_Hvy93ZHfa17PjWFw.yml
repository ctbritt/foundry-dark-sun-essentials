              macro:
                name: Lantern, Bullseye
                img: icons/sundries/lights/lantern-bullseye-signal-copper.webp
                type: script
                scope: global
                command: >-
                  let lightSource = "lantern";

                  let file =
                  "modules/gambits-premades/assets/images/bullseyeLantern.webp"

                  let lanternStatus = Sequencer.EffectManager.getEffects({ name:
                  `${token.document.id} ${lightSource}` });

                  console.log(args[1])

                  if (args[0] === "off" && args[1]["expiry-reason"] &&
                  (args[1]["expiry-reason"].includes("times-up") ||
                  args[1]["expiry-reason"].includes("effect-deleted"))) {
                      const light = { dim: 0, bright: 0 };
                      await token.document.update({ light });
                      await Sequencer.EffectManager.endEffects({ name: `${token.document.id} ${lightSource}`, object: token });
                  }


                  async function updateLantern() {
                      if (args[0].macroPass === "preApplyDynamicEffects") {
                          if (lanternStatus.length === 0) {
                              await showLanternLightDialog();
                          } else if (lanternStatus.length !== 0) {
                              await showLanternOptionsDialog();
                          }
                      }

                      if (args[0] === "off" && args[1]["expiry-reason"] && (args[1]["expiry-reason"].includes("times-up") || args[1]["expiry-reason"].includes("effect-deleted"))) {
                          const light = { dim: 0, bright: 0 };
                          await token.document.update({ light });
                          await Sequencer.EffectManager.endEffects({ name: `${token.document.id} ${lightSource}`, object: token });
                      }
                  }


                  async function showLanternLightDialog() {
                      return new Promise((resolve) => {
                          new Dialog({
                              title: "Lantern",
                              content: "<p>Would you like to light a lantern?</p>",
                              buttons: {
                                  turnon: {
                                      label: "Light",
                                      callback: async (html) => {
                                          await lightNewLantern();
                                          resolve();
                                      }
                                  }
                              },
                              default: "turnon"
                          }).render(true);
                      });
                  }


                  async function showLanternOptionsDialog() {
                      return new Promise((resolve) => {
                          let buttons = {
                              turnoff: {
                                  label: "Extinguish",
                                  callback: async (html) => {
                                      const light = {dim: 0, bright: 0};
                                      await token.document.update({light});
                                      await Sequencer.EffectManager.endEffects({ name: `${token.document.id} ${lightSource}`, object: token });
                                      const effectName = await actor.effects.find(i => i.name === "Lantern, Bullseye");
                                      if(effectName) await actor.deleteEmbeddedDocuments("ActiveEffect", [effectName.id]);
                                      resolve();
                                  }
                              }
                          };

                          new Dialog({
                              title: "Lantern",
                              content: "<p>What would you like to do with your lantern?</p>",
                              buttons: buttons,
                              default: "turnoff"
                          }).render(true);
                      });
                  }


                  async function lightNewLantern() {
                      new Sequence()

                      .effect()
                      .name(`${token.document.id} ${lightSource}`)
                      .file(file)
                      .atLocation(token)
                      .attachTo(token, {followRotation: true, local: true})
                      .scaleToObject(.7, {considerTokenScale: true})
                      .scaleIn(0, 500, {ease: "easeOutElastic"})
                      .scaleOut(0, 250, {ease: "easeOutCubic"})
                      .spriteOffset({x:0.0*token.document.width, y:0.45*token.document.width}, {gridUnits:true})
                      .animateProperty("sprite", "rotation", { from: 15, to: -15, duration: 300, ease: "easeInOutBack"})
                      .animateProperty("sprite", "rotation", { from: 0, to: 30, duration: 250, delay: 200, ease: "easeOutBack"})
                      .loopProperty("sprite", "rotation", { from: 3, to: -3, duration: 1500, ease: "easeOutQuad", pingPong: true })
                      .persist()
                      .zeroSpriteRotation()
                      .waitUntilFinished(-500)
                      .play()

                      //Define token light options
                      var light = {dim: 120, bright: 60, alpha:0.25, angle:30, luminosity: 0.5, color: "#ffb433", animation: {type: "torch", speed: 4, intensity: 4},attenuation: 0.75, contrast:0.15, shadows:0.2};

                      await token.document.update({light});
                  }


                  updateLantern();
