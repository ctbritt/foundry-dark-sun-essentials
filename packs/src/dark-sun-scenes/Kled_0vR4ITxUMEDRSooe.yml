              <strong>desert herbs</strong> for treating <strong>wounds</strong>
              and <strong>sunburn</strong>.</li></ul></li><li><strong>Special
              Interaction</strong>: Nulak enjoys <strong>stories</strong> and
              <strong>news</strong> from outside the village. He might offer a
