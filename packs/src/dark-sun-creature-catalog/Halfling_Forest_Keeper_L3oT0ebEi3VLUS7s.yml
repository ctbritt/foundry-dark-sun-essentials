  - _id: kpI9LMmbi6vYye7U
    name: Tree Stride
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '335'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You gain the ability to enter a tree
          and move from inside it to inside another tree of the same kind within
          500 feet. Both trees must be living and at least the same size as you.
          You must use 5 feet of movement to enter a tree. You instantly know
          the location of all other trees of the same kind within 500 feet and,
          as part of the move used to enter the tree, can either pass into one
          of those trees or step out of the tree you're in. You appear in a spot
          of your choice within 5 feet of the destination tree, using another 5
          feet of movement. If you have no movement left, you appear within 5
          feet of the tree you entered.</p><p>You can use this transportation
          ability only once on each of your turns. You must end each turn
          outside a tree.</p></div>
