  - _id: 6zH3gImG2Jf4Flje
    name: Call Lightning
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '248'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A storm cloud appears at a point
          within range that you can see above yourself. It takes the shape of a
          @variantrule[Cylinder [Area of Effect]|XPHB|Cylinder] that is 10 feet
          tall with a 60-foot radius.</p><p>When you cast the spell, choose a
          point you can see under the cloud. A lightning bolt shoots from the
          cloud to that point. Each creature within 5 feet of that point makes a
          Dexterity saving throw, taking 3d10 damage on a failed save or half as
          much damage on a successful one.</p><p>Until the spell ends, you can
          take a @action[Magic|XPHB] action to call down lightning in that way
          again, targeting the same point or a different one.</p><p>If you're
          outdoors in a storm when you cast this spell, the spell gives you
          control over that storm instead of creating a new one. Under such
          conditions, the spell's damage increases by 1d10.</p></div><div
          class="rd__b  rd__b--3"><p></p><div data-roll-name-ancestor="Using a
          Higher-Level Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h
          rd__h--3" data-title-index="1"> <span class="entry-title-inner">Using
          a Higher-Level Spell Slot.</span></span> The damage increases by 1d10
          for each spell slot level above 3.</p></div></div>
