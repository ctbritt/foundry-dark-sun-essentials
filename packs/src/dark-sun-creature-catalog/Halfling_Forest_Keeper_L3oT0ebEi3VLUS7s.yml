        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You conjure a vine that sprouts from a
          surface in an unoccupied space that you can see within range. The vine
          lasts for the duration.</p><p>Make a melee spell attack against a
          creature within 30 feet of the vine. On a hit, the target takes 4d8
          damage and is pulled up to 30 feet toward the vine; if the target is
          Huge or smaller, it has the &amp;Reference[condition=Grappled]
          condition (escape DC equal to your spell save DC). The vine can
          grapple only one creature at a time, and you can cause the vine to
          release a &amp;Reference[condition=Grappled] creature (no action
          required).</p><p>As a @variantrule[Bonus Action|XPHB] on your later
          turns, you can repeat the attack against a creature within 30 feet of
          the vine.</p></div><div class="rd__b  rd__b--3"><p></p><div
