  - _id: HiEvKCMyTuufUd4T
    name: Mass Cure Wounds
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '296'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A wave of healing energy washes out
          from a point you can see within range. Choose up to six creatures in a
          30-foot-radius @variantrule[Sphere [Area of Effect]|XPHB|Sphere]
          centered on that point. Each target regains @variantrule[Hit
          Points|XPHB] equal to 5d8 plus your spellcasting ability
          modifier.</p></div><div class="rd__b  rd__b--3"><p></p><div
