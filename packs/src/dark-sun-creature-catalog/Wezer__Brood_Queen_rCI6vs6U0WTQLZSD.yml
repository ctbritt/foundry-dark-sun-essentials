  details:
    biography:
      value: >-
        <p>Wezers are enormous flying insects that make underground hives in the
        desert tablelands. Though of animal intelligence, they are highly social
        creatures, structured into several distinct classes by both social
        function and physical characteristics. Water fetcher, worker, and
        soldier wezers all have wings, multifaceted eyes, and six thin limbs
        extending from their abdomen. Soldier’s are slightly larger than the
        menials, and are colored a shade of yellow brighter than their fellows.
        The brood queen is much larger—she, too, has wings, but they are
        insufficient to lift her into flight. The brood queen has a huge abdomen
        for laying the hive’s eggs.</p>
      public: ''
