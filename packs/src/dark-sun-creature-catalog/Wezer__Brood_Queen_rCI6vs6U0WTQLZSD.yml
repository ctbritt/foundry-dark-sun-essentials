  - _id: wJmfooeInBUCF4G3
    name: Sting
    type: weapon
    system:
      source:
        custom: ''
        book: ENK
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p><i>Melee Weapon Attack:</i> +5 to hit,
          reach 5 ft., one creature. <i>Hit:</i> 9 (2d6 + 3) piercing damage,
          and the target must make a [[/save ability=con dc=13]] saving throw or
          be infected with a disease — a minuscule wezer egg.</p><p>A humanoid
          host can carry only one wezer egg to term at a time. The egg hatches
          into a wezer larvae in 5 days. Each day after it hatches, the host's
          insides are slowly eaten by the larvae, lowering the host's
          Constitution score by 1d4 points. This reduction can't be removed
          until the larvae is removed.</p><p>When the host dies, or after the
          larvae has fed for 10 days, the larvae emerges from the injection
          wound and attempts to continue feeding on the host.</p><p>If the
          disease is cured before the larvae exits the hosts body, the egg and
          the larvae is disintegrated. They can also be surgically removed by a
          DC <span class="rd__dc">15</span> medicine check, dealing 1d10 damage
          to host on every attempt.</p></div>
