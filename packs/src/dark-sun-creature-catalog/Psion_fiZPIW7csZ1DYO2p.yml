  details:
    biography:
      value: >-
        <p>Psionicists or Psions use the forces of their own mind to affect
        their environment. Psionic powers are not magical in nature, that is to
        say, psionic powers do not draw upon magical energy that surrounds all
        things. Rather they are derived from within when the psionicist has
        their entire essence in coordination; their mind, body, and soul in
        perfect harmony. Since psionic powers are not magical, they in no way
        affect the world's ecosystem when they are used.</p><p>Psionicists are
        very common on Athas compared to other magic users. Masters of this
        talent have been known to create constructs or avatars from just their
        mind. These constructs act as extensions of their mind.</p><p>Among the
        average citizen, psions are known as Mindbenders.</p>
