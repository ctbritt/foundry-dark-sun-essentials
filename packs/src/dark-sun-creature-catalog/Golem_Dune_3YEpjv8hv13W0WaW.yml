  - _id: WCzPp9Sr1f9mVlzz
    name: Moving Sands
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The golem select a 20ft radius area
          that it can see within 120ft of him. The area selected must be made of
          sand or earth. When a creature enters the area, it sinks 1d4 + 1 feet
          into the quicksand and becomes &amp;Reference[condition=restrained].
          At the start of each of the creature's turns, it sinks another 1d4
          feet. As long as the creature isn't completely submerged in quicksand,
          it can escape by using its action and succeeding on a Strength check.
          The DC is 10 plus the number of feet the creature has sunk into the
          quicksand. A creature that is completely submerged in quicksand can't
          breathe (see the suffocation rules in the Player's Handbook). A
          creature can pull another creature within its reach out of a quicksand
          pit by using its action and succeeding on a Strength check. The DC is
          5 plus the number of feet the target creature has sunk into the
          quicksand.</p></div>
