  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Unthinking automatons</p><p>energized by potent magic,
        golems can be found in desert ruins or in the treasuries of the
        sorcerer-kings. Powerful defilers craft golems from bone, clay, flesh,
        stone, and more unusual materials. The relative abundance of obsidian,
        salt, and sand on Athas has inspired creators to rely on these
        substances when constructing golems.</p><p>Lore</p><p>Golems abide by
        the instructions of their creators, or anyone their creators order them
        to obey. They are fearless and unflinching, executing their masters'
        commands without concern for their own survival. They plow straight
        ahead in battle, mashing anyone or anything that obstructs their
        progress.</p><p>The creation of a golem requires potent arcane rituals
        and expensive components. Such resources are exceedingly rare On Athas.
        Much of the lore regarding golems comes from ages past, and a great deal
        of it is lost even to sorcerer-kings. The few ritualists who can create
        golems do not necessarily even understand why their rituals
        work.</p><p>Legends tell of golems far more potent than any created
        today. Constructed from substances now rare on Athas, these creatures
        still haunt the depths of forgotten ruins, obeying orders uttered by
        creators thousands of years ago.</p><p>Encounters</p><p>Golems cooperate
        with any creature their master dictates. They are often placed alongside
        other constructs, though they can be found with demons, devils, and
        other long-lived guardians. Golems are frequently stationed to protect a
        specific area, but some creators use them as loyal
        bodyguards.</p><p>Info</p><p>A sudden flurry sweeps the desert as the
        sands rise in a loosely humanoid form. Particles sift and flow as though
        blown by a constant wind, but the creature never loses its substance.
        Gaping pits at the top of the churning sand simulate a mouth and eyes.
        These semisolid animates ambush foes by bursting upward from the ground.
        Once engaged in battle, a dune golem is a straightforward combatant,
        grabbing and engulfing the first available target while pounding on
        others.</p>
      public: ''
