  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Athasian giants dwell in small tribes</p><p>on islands
        throughout the Sea of Silt, which they guard fiercely. They are capable
        of traversing the sea's shallower areas, wading through chest-deep
        terrain to reach their homes.</p><p>Lore</p><p>Many giants on Athas live
        on islands in the shallower areas of the Sea of Silt. Sometimes they can
        be bribed into carrying smaller beings as passengers to their islands or
        to other locations in the sea. Giants are fickle, though, so travelers
        must take care not to offend them.</p><p>Powerful masters of the Way
        created the first beast giants long ago, and the race has persisted,
        though it is mutable in form. These giants supplement their ferocity
        with an inborn psychic power that lets them read the mind of an enemy,
        allowing them to copy a foe's powerful attack.</p><p>Shadow giants are
        remnants of giants killed by the sorcerer-kings in ancient wars. Their
        hate-filled spirits have found a home in the deathly substance of the
        Gray.</p><p>Encounters</p><p>Beast giants associate with others of their
        kind as well as with hill giants, firbolgs, brohgs, and other giant kin.
        Shadow giants are loners, feared by other giants, though on occasion a
        brohg renegade seeks one out to learn secrets of arcane magic. Shadow
        giants might ally with their elementally infused cousins, especially the
        powerful fire and stone giants in the Sea of Silt.</p><p>Info</p><p>Each
        of these hulking humanoids has the head of a beast, though everyone has
        slightly different features. The beasts represented are found throughout
        Athas and include those both living and long extinct. When faced with a
        threat, a beast giant reacts with savage ferocity. It uses its bite to
        start a fight and reacts to a serious injury with psionic retention,
        turning that attack against a foe on its next turn.</p>
