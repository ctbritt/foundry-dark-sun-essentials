  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Braxat is a huge humanoid of mixed stock, mostly a
        combination of mammalian and reptilian; this creature has a thick shell
        that covers its back and a handful of horny protrusions on the top of
        its head.</p><p>The bony protrusions on a braxat's head protect its
        skull as well as being used for attacking its target. Braxats walk
        upright, are able to speak with a clear, human voice, have opposable
        thumbs, and are warm‐blooded.</p><p>Braxat shells can be used to make
        excellent shields and armor, usually crafted to create plate armor
        because of the shell plating braxats have on their backs. Because of
        this braxats are sometimes hunted, but in most cases the braxat is
        usually prepared for such things and the hunted ends up becoming the
        hunter.</p><p>Braxats are hunters, and they fight like them. They use
        psionics to disable their opponents, thereby reducing risks to
        themselves. After attacking with psionics, braxats will move in as close
        as they can while still being able to keep their opponents within their
        reach. Braxats have a breath weapon as well that they can employ, but
        they use it as a last resort since the acid can cause their prey to
        become inedible.</p>
