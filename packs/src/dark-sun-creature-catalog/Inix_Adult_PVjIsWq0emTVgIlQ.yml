  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Broad and low to the ground</p><p>an inix is a reptilian
        behemoth. Used widely as a beast of burden, the inix is capable of
        incredible feats of strength. lt is tough, plodding, and slow to anger,
        but once roused, it is nearly unstoppable.</p><p>Lore</p><p>Inixes eat
        plant matter, carrion, and tiny animals. They prefer to use their claws
        to dig up food rather than to attack. Inixes are strong and tough but
        relatively docile. They become hard to handle only if hungry or
        thirsty.</p><p>Female inixes lay eggs once per year, and they can
        produce viable eggs without a male. As a result, wild inixes have spread
        to remote locations and remain plentiful as
        livestock.</p><p>Encounters</p><p>Inixes travel in small, homogenous
        clutches of a few adults and juveniles. Domestication of the inix is
        widespread. Adult inixes make capable draft animals, and juveniles make
        good pets. Although cantankerous if hungry, an inix attacks only if
        provoked. It uses its tail to knock a foe down and then darts forward to
        bite. If it can fight without harassment from other attackers, an adult
        inix is content to use its powerful jaws to grab a creature.</p>
