  - _id: pmPMfvHvyZ8PudaR
    name: Arcane Defiling
    type: feat
    system:
      source:
        custom: ''
        book: ENK
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>If in non-defiled terrain, the wizard
          can choose to defile the land when casting a spell. When they do this,
          a radius of 5 times the spell's level becomes defiled.</p><p>If they
          defile, they can either give one creature disadvantage on a saving
          throw against that spell or target a second creature if the spell
          would target only one.</p></div>
        chat: ''
      requirements: ''
      uses:
        max: ''
        spent: 0
        recovery: []
      type:
        value: monster
        subtype: ''
      properties: []
      advancement: []
      activities: {}
      identifier: arcane-defiling
      crewed: false
      enchant: {}
      prerequisites:
        level: null
        items: []
        repeatable: false
      cover: null
    ownership:
      default: 0
      jM4h8qpyxwTpfNli: 3
    img: icons/magic/death/skull-energy-light-white.webp
    flags:
      plutonium:
        page: monsterTrait
        source: EnkidusDarkSunBestiary5e
        hash: >-
          arcane%20defiling_elf%20enchanter%20defiler_enkidusdarksunbestiary5e_enkidusdarksunbestiary5e
      dae:
        macro:
          name: Arcane Defiling
          img: icons/magic/death/skull-energy-light-white.webp
          type: script
          scope: global
          command: >-
            // Defiling Wizard Feature Macro for Foundry VTT v12 (D&D 3.3.1)

            const { DialogApp, Crosshairs, Summons, Teleport } = chrisPremades;

            const {
              actorUtils,
              animationUtils,
              combatUtils,
              compendiumUtils,
              constants,
              crosshairUtils,
              dialogUtils,
              effectUtils,
              errors,
              genericUtils,
              itemUtils,
              rollUtils,
              socketUtils,
              templateUtils,
              tokenUtils,
              workflowUtils,
              spellUtils,
            } = chrisPremades.utils;


            let confirmText = genericUtils.format("CHRISPREMADES.Dialog.Use", {
              itemName: "Defile the Land?",
            });

            // Function to check if the terrain is defiled

            if (
              item.type !== "spell" ||
              actor.effects.some((e) => e.name === "Defiled Terrain") ||
              !actor.items.some((i) => i.name === "Arcane Defiling")
            ) {
              return;
            }


            const units = canvas.scene.grid.units;

            const tokenSize = Math.max(token.w, token.h);

            const tokenSizeOffset =
              Math.max(token.w, token.h) * 0.5 * canvas.scene.dimensions.distance;
            const tokenCenterX = token.x + token.w / 2;

            const tokenCenterY = token.y + token.h / 2;

            const gridSize = canvas.scene.grid.size;

            const gridDistance = canvas.scene.grid.distance;

            const topLeftX = tokenCenterX / 2;

            const topLeftY = tokenCenterY / 2;

            let regionRadius =
              (5 * workflow.castData.castLevel * canvas.scene.grid.size) /
                canvas.scene.dimensions.distance +
              tokenSize / 2;


            // Ask if the wizard wants to defile

            let willDefile = await dialogUtils.confirm(item.name, confirmText);

            if (!willDefile) return;

              const regionData = {
                name: "Defiled",
                color: "#7a7b7f",
                shapes: [
                  {
                    type: "circle",
                    x: tokenCenterX,
                    y: tokenCenterY,
                    radius: regionRadius,
                  },
                ],
                elevation: { bottom: null, top: 0 },
                behaviors: [
                  {
                    name: "Set Terrain",
                    type: "terrainmapper.setTerrain",
                    _id: "zGu4EPBkh6nO4xho",
                    system: {
                      terrains: ["Terrain_4RbNaIxLWsaBq2sc"],
                      secret: false,
                    },
                    disabled: false,
                    flags: {},
                  },
                ],
                visibility: 0,
                locked: true,
                flags: {
                  terrainmapper: {
                    elevationAlgorithm: "none",
                    splitPolygons: false,
                  },
                  tagger: {
                    tags: ["defiled"],
                  },
                },
              };

            const createdRegions = await
            canvas.scene.createEmbeddedDocuments("Region", [
              regionData,
            ]);

              new Sequence()
                .effect()
                .name("Frost")
                .file(
                  "modules/jb2a_patreon/Library/Generic/Impact/FrostImpact_01_Regular_White_Thumb.webp"
                )
                .size({ width: regionRadius * 2.5, height: regionRadius * 2.5 })
                .scaleIn(0.1, 3000)
                .timeRange(0, 3000)
                .belowTokens()
                .opacity(0.7)
                .randomRotation()
                .atLocation(token)
                .tint("#555353")
                .persist()

                .effect()
                .name("Cracks")
                .file("jb2a.ground_cracks.01.dark_red")
                .size({ width: regionRadius * 2, height: regionRadius * 2 })
                .randomRotation()
                .randomizeMirrorX()
                .randomizeMirrorY()
                .delay(3000)
                .fadeIn(1000)
                .fadeOut(5000)
                .belowTokens()
                .atLocation(token)
                .opacity(0.75)
                .duration(10000)

                .effect()
                .name("Black Cracks")
                .file("jb2a.impact.ground_crack.still_frame.01")
                .size({ width: regionRadius * 2, height: regionRadius * 2 })
                .delay(7500)
                .fadeIn(1000)
                .belowTokens()
                .atLocation("Cracks")
                .persist()

                .play();
          author: jM4h8qpyxwTpfNli
