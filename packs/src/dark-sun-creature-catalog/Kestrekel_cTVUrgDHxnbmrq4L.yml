  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The scourge of the Tablelands, kes'trekel are vile avian
        creatures that feast upon desert carrion. Although they are weak and
        cowardly in small groups, kes'trekel can become a devastating force in
        larger numbers.</p><p>Kes'trekel are scrawny in appearance, with black
        plumage graying from the constant exposure. The only spot of appreciable
        color is found on the head, where the vivid crimson stands out like the
        blood it resembles. Standing barely a foot tall on short, taloned feet,
        kes'trekel are extremely vulnerable on the ground. In the air however,
        their 3-foot wingspan is more than enough to carry it
        aloft.</p><p>Kes'trekel communicate among themselves through calls and
        guttural squawks. They do not attempt to learn other
        languages.</p><p>Kes'trekel flocks are not migratory, preferring to
        inhabit their particular region for centuries if the elements allow. The
        nests they build in the available crags and trees are temporary, used
        but once per set of offspring.</p><p>When defending their home regions,
        kes'trekel cooperate as a flock, raining a veritable torrent of pecks
        and scratches upon any who dare invade.</p>
