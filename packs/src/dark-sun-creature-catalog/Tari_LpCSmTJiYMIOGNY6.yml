  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>The other denizens of the Tyr region commonly
        refer to the tari as ratmen. They are small, furry humanoid scavengers,
        capable of thriving on food and water too polluted for humans to ingest.
        Bunted freely as pests, the tari are the barbaric descendants of a once
        thriving culture who inhabited lands to the south of the Tyr
        region.</p><p>The lives of the urban and wilderness tari are quite
        different, though their tactics for the kill are universal. Both travel
        in packs, but their approaches to survival are quite
        different.</p><p>The urban tari are denizens of the sewers and garbage
        heaps. The small, furry thieves scour the buildings, scurrying up walls
        and through windows, stealing everything they can. They are not
        particularly good thieves, making a lot of noise, upsetting tables and
        toppling chairs in their clumsy approach. However, not work for
        children, a warrior can earn a good living hunting tari, earning about
        eight ceramic pieces a head.</p><p>The wilderness, however, is not so
        kind. Wasteland tari are nomadic scavengers, scouting miles in all
        directions to find the richest grounds, contending with the desert's
        other creatures for the little food to be had.</p><p>Wilderness tari
        move their few belongings and families in triangular frames of leather
        and wooden poles. These frames are piled with belongings and dragged
        along the ground.</p><p>The tari race once boasted a thriving culture
        far to the south of the Tyr region. Ythri, the legendary capital city,
        is now a ruin lost among the crags. Their education and knowledge was
        much greater than today and their technology allowed them to build stone
        and concrete structures. What happened to their civilization is a
        mystery. The tari of the Tyr region have no written history. What
        remains is a collection of exaggerated myths and legends describing
        wondrous works.</p><p>Two glands set deep in the jaw produce their
        disease-causing venom. Each bite produces a flow of venom that sprays
        from two openings to either side of the main canines. Retrieving the
        glands from fallen tari is a difficult and dangerous task, but the
        deadly properties of their contents makes them valuable to the
        alchemists and bards of the cities. A pair of tari disease glands can
        bring as much as 12 ceramic bits in the larger cities.</p><p>Tari Animal
        Handler</p><p>Occasionally, tari use pack animals, such as inix or
        crodlu. Corralling such a beast can take an entire pack and cost many
        tari lives. Tari animal handlers are very rare, but can become very
        important to the wilderness packs.</p>
