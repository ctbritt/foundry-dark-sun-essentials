  details:
    biography:
      value: >-
        <p>Fire drakes are the most evil and malicious of the drakes. They enjoy
        inflicting pain for the pleasure of watching their victims writhe in
        agony. A fire drakes greatest delight comes from torturing a potential
        meal.</p><p>Fire drakes are large, spiny, reptilian creatures with
        pebblelike skin. Each pebble is actually a scale. They are red-and-black
        mottled, similar in color to the dying embers of a fire, and their skin
        is very glossy. Fire drakes have four legs. The front two are smaller
        with very sharp claws, while the back legs are longer and thicker.</p>
