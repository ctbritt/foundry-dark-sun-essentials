      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The drake summons a 25-foot radius
          sphere of fire from the plane of fire centered on a point it can see
          within 100 feet of it. The sphere persists for 1d6 rounds. Any
          creature that enters the sphere or starts its turn inside it must make
          a DC 15 Dexterity saving throw. On a failed save, they take 36 (8d8)
          fire damage. On a successful save, they take half the fire damage. Any
          flammable items within 10 feet of the sphere are ignited, and any
          metal items within the sphere become super heated. Creatures carrying
          or wearing the items takes 4 (1d8) fire damage for each item and must
          succeed a DC 15 Constitution saving throw or drop the item if they
          can. If it doesn't drop the item, it has disadvantage on attack rolls
          and ability checks until they remove the object or put out the
          flame.</p></div>
