  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>Feral yowlers are the result of extreme
        experiments in defiling magic gone awry. Whether originally spawned from
        displacer beasts, panthers, or concocted from no known beast, the first
        feral yowlers were warped and twisted by massive amounts of magical
        energy. Because of these experiments, they not only developed an
        immunity to defiling magic, they also gained the abilities that make
        them such deadly and efficient killers. Feral yowlers are ruthless
        predators, hunting not only for fun but also for the thrill of the
        kill.</p><p>A feral yowler measures about 7 feet long and weighs roughly
        400 pounds. While they love to yowl, feral yowlers do not actually
        speak, though some learn to recognize a few simple words of tarek and
        Draconic.</p><p>Encounter</p><p>Feral yowlers roam the Labyrinth, a maze
        of canyons and fissures in the Tablelands that scars the landscape
        between the Black Sands and the Dragon's Bowl mountains. They also
        inhabit forlorn ruins and dungeons throughout Athas, occasionally
        striking up alliances with tarek or hejkin warlords in exchange for
        treasure or fresh food.</p><p>Info</p><p>A lone feral yowler always
        tries to ambush its prey. When it does strike, it begins a battle with
        its yowl of fear, hoping to distract and weaken its foes. A feral yowler
        then charges into combat, relying on rapid attacks to bring prey down
        quickly.</p>
