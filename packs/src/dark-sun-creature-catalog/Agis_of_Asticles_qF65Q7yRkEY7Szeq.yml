  details:
    cr: 16
    biography:
      value: >-
        <h1>Innate Psionics</h1>Agis is a 16th‑level psionic manifester (spell
        save DC 20, +12 to hit with psionic attacks). His “powers” count as
        spells for dispel/counter purposes, but he uses no material components.
        He does not suffer from the Defiling vs. Preserving dichotomy—his
        discipline is purely mental.<br />At‑Will (Talents). Mind Thrust
        (psychic 2d10, Int save or disadvantage on next attack), Telekinetic
        Push/Pull (5 ft. move, Str save), Detect Thoughts, Mage Hand
        (invisible), Minor Illusion, Psionic Shield (see Reactive Aegis).<br
        />1/Turn Augment (no slot): He can add +1d10 psychic damage to a psionic
        attack or impose disadvantage on one target’s next saving throw vs. his
        powers (declare on hit or failed save).<br />Power Slots (recharge on
        long rest):<br />1st (4): Psionic Shielding Pulse (as shield), Compel
        Surrender (as command).<br />2nd (3): Mind Spike, Hold Person,
        Levitate.<br />3rd (3): Counterspell, Dispel Magic, Hypnotic Pattern.<br
        />4th (3): Resilient Sphere, Banishment.<br />5th (2): Telekinesis,
        Synaptic Static.<br />6th (1): Mass Suggestion.<br />7th (1):
        Forcecage.<br />8th (1): Mind Blank (always active on himself; slot
        already expended).<h1>Passive Features</h1>Precognitive Insight (3/Day).
        After seeing a d20 roll (before outcome), Agis can add or subtract 1d10
        to that roll (ally or enemy).<br />Psionic Aegis. While Agis isn’t
        incapacitated, he gains a spectral force field. The first time each
        round he takes damage, reduce it by 10 (after resistance). If the attack
        was melee, the attacker takes 5 psychic damage.<br />Dual Concentration.
        Agis can maintain concentration on up to two psionic powers at once.
        Each time he takes damage he makes a separate Constitution save for each
        effect (DC 10 or half damage). If he fails one, he chooses which effect
        ends.<br />Legendary Resistance (3/Day).<br />Magic/Psionic Resistance.
        Advantage on saving throws vs. spells and psionic effects.<h1>Scaling
        Suggestions</h1>Desired CR Adjustments<br />15 Reduce HP to 180; remove
        one use of Precognitive Insight; Telekinetic Crush deals 5d8 and
        restrains only one target.<br />17 Increase HP to 235; Psionic Aegis
        reduction to 12; add an extra 6th-level slot (e.g., Mass Suggestion
        twice).<br />18 Add a 9th-level slot for Psychic Scream (1/day),
        legendary action cost 3.<br />If you’d like, I can format this as a
        Foundry VTT actor JSON next (let me know your preferred system/module
        specifics), or create a matching portrait token. Want that?
      public: ''
