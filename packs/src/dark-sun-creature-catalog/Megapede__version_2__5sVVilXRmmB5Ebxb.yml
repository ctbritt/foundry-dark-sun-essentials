  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Megapedes are colossal centipedes that roam the sandy
        deserts of Athas. Megapedes are very similar to normal centipedes in all
        ways except in size. They have a very long (100 to 150 feet), segmented
        body which sports a pair of legs nearly every two feet. These legs are
        five feet in length and have flexible claws at their ends. The body of a
        megapede is covered with a fur-covered, bulbous skin that serves as a
        pseudo-exoskeleton.</p><p>The megapedes of Athas are, with the
        exceptions of the Dragon and Nightmare Beasts, the most dangerous
        feature of travelling across the deserts of this harsh
        world.</p><p>Because of their sheer size, megapedes cannot normally hide
        their presence. Most, however, live beneath the sands of the desert,
        only surfacing to feed on unfortunate passers-by. Herds of erdlus and
        even kanks are among the favorite foods of megapedes, though they often
        survive on vegetation alone for weeks on end.</p><p>A Megapede's
        Lair</p><p>When a megapede is ready to lay eggs, it will find an
        isolated area, if possible in the rocky barrens of the Tablelands, and
        begin to make a cocoon in which to place its eggs. Up to three eggs can
        be placed within one cocoon, which often reaches near 60 feet in length.
        A cocoon will remain for four to five weeks before bearing young
        megapedes. At birth, a megapede is 20 to 30 feet long, growing to its
        full size within three months after birth. While not especially
        protective of its cocoon, a megapede, which has laid eggs, will fight
        off any creature that threatens them, mostly out of instinct.</p><div
        class="rd__b  rd__b--1"><div data-roll-name-ancestor="Lair Actions"
        class="rd__b  rd__b--2"><h3 class="rd__h rd__h--2" data-title-index="1">
        <span class="entry-title-inner">Lair Actions</span></h3> <p>On
        initiative count 20 (losing initiative ties), the megapede takes a lair
        action to cause one of the following effects; the megapede can't use the
        same effect two rounds in a row:</p><ul class="rd__list"><li
        class="rd__li ">Large web spreads from megapede. Each creature within 60
        feet of the megapede must succeed on a DC 15 Dexterity saving throw or
        be restrained by webbing. As an action, the restrained target can make a
        DC 15 Strength check, bursting the webbing on a success. The webbing can
        also be attacked and destroyed (AC 10; hp 20; vulnerability to fire
        damage; immunity to bludgeoning, poison, and psychic damage).</li><li
        class="rd__li ">A cloud of swarming insects fills a 20-foot-radius
        sphere centered on a point the megapede chooses within 120 feet of it.
        The cloud spreads around corners and remains until the megapede
        dismisses it as an action, uses this lair action again, or dies. The
        cloud is lightly obscured. Any creature in the cloud when it appears
        must make on a DC 15 Constitution saving throw, taking 10 (3d6) piercing
        damage on a failed save, or half as much damage on a successful one. A
        creature that ends its turn in the cloud takes 10 (3d6) piercing
        damage.</li><li class="rd__li ">The megapede chooses a 10-foot-square
        area on the ground that it can see within 120 feet of it. The ground in
        that area turns into 3-foot-deep quicksand. Each creature on the ground
        in that area when the quicksand appears must succeed on a DC 15
        Dexterity saving throw or sink into the quicksand and become restrained.
        A creature can take an action to attempt a DC 15 Strength check, freeing
        itself or another creature within its reach and ending the restrained
        condition on a success. Moving 1 foot in the quicksand costs 2 feet of
        movement. On initiative count 20 on the next round, the quicksand
        hardens, and the Strength DC to work free increases to
        20.</li></ul></div></div><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Regional Effects" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="2"> <span
        class="entry-title-inner">Regional Effects</span></h3> <p>The region
        containing a megapede's lair is constantly shaken by megapede
        underground activity, which creates one or more of the following
        effects:</p><ul class="rd__list"><li class="rd__li ">Earth is much
        softer within 6 miles of the megapede's lair.</li><li class="rd__li
        ">Small earthquakes are common within 1 miles of the megapede's
        lair.</li></ul><p>If the megapede dies, earthquakes fade over the course
        of 1d10 days.</p></div></div>
