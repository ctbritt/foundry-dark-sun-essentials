  details:
    biography:
      value: >-
        <div class="rd__b  rd__b--1"><p>Sygra are cloven-hooved quadrupeds with
        short, hairy coats and sensitive noses. They can be any mixture of
        black, brown, and white. Their heads sport two horns and resemble that
        of a horse with horns. Males have larger horns than females. They have
        beady black eyes set behind and above the nose, which give them good
        peripheral vision.</p></div>
