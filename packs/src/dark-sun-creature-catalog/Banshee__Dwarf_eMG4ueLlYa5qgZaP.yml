  - _id: jcmAe7DVV6Wi1Rc4
    name: Wail
    type: feat
    system:
      source:
        custom: ''
        book: ENK
        page: '9'
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The banshee releases a mournful wail.
          This wail has no effect on constructs and undead. All other creatures
          within 30 ft. of it that can hear it must succeed on a DC 14 Wisdom
          saving throw or become charmed for 1 minute.</p><p>While charmed in
          this way, the charmed creatures lose the ability to distinguish friend
          from foe, regarding all creatures it can see as enemies except for the
          banshee.</p><p>Whenever the affected creatures choose another creature
          as a target, it must choose the target at random from among the
          creatures it can see, except the banshee, within range of the attack,
          spell, or other ability it's using. If an enemy provokes an
          opportunity attack from the affected creature, the creature must make
          that attack if it is able to.</p><p>Each time the charmed creature
          takes damage, it can repeat the saving throw, ending the effect on
          itself on a success.</p></div>
