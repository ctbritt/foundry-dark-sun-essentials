  details:
    biography:
      value: >-
        <p>Dwarves who die before completing a major focus are often condemned
        to live out their afterlives as banshees. In unlife, they haunt their
        unfinished work or quest, unable to bear the fact that someone else may
        complete what they could not. Day or night, the pupils of their eyes
        flicker red as if a flame burns them from within.</p><p>A dwarven
        banshee's appearance changes as soon as the transformation from life to
        undeath begins. The skin rots away, leaving the underlying muscles
        exposed. The muscle turns brown if exposed to sunlight and sand; if
        protected or underground, it becomes gray or moldy in
        color.</p><p>Dwarven banshees only want to protect what was theirs.
        Fables say that the seventh son of a seventh son may lay a dwarven
        banshee to rest by finishing a focus for it. Elders say the flames
        within dwarven banshees' eyes originate from some ancient dwarven forge
        or the elemental plane of fire.</p>
      public: ''
