        book: PHB 2024
        page: '265'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You utter a word imbued with power
          from the Upper Planes. Each creature of your choice in range makes a
          Charisma saving throw. On a failed save, a target that has 50
          @variantrule[Hit Points|XPHB] or fewer suffers an effect based on its
          current @variantrule[Hit Points|XPHB], as shown in the Divine Word
          Effects table. Regardless of its @variantrule[Hit Points|XPHB], a
          Celestial, an Elemental, a Fey, or a Fiend target that fails its save
          is forced back to its plane of origin (if it isn't there already) and
          can't return to the current plane for 24 hours by any means short of a
          @spell[Wish|XPHB] spell.</p><table class="w-100 rd__table 
          stripe-odd-table" data-roll-name-ancestor="Divine Word
          Effects"><caption>Divine Word Effects</caption><thead><tr><th
          class="rd__th ve-col-2 ve-text-center " data-rd-isroller="false">Hit
          Points</th><th class="rd__th ve-col-10 "
          data-rd-isroller="false">Effect</th></tr></thead><tbody><tr><td
          class="rd__th ve-col-2 ve-text-center ">0-20</td><td class="rd__th
          ve-col-10 ">The target dies.</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center ">21-30</td><td class="rd__th ve-col-10 ">The target
          has the &amp;Reference[condition=Blinded],
          &amp;Reference[condition=Deafened], and
          &amp;Reference[condition=Stunned] conditions for 1
          hour.</td></tr><tr><td class="rd__th ve-col-2 ve-text-center
          ">31-40</td><td class="rd__th ve-col-10 ">The target has the
          &amp;Reference[condition=Blinded] and
          &amp;Reference[condition=Deafened] conditions for 10
          minutes.</td></tr><tr><td class="rd__th ve-col-2 ve-text-center
          ">41-50</td><td class="rd__th ve-col-10 ">The target has the
          &amp;Reference[condition=Deafened] condition for 1
          minute.</td></tr></tbody></table></div>
