  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>Weirds are cryptic beings of elemental force
        who are powerful in the art of divination. They are oracles,
        soothsayers, and seers of knowledge past, present, and future. Each
        weird is composed of material from one of the four elements (air, earth,
        fire, or water) and has special knowledge of the particular aspect of
        fate with which its element is associated (see below). These creatures
        dwell in remote or hidden locations on the Material Plane a fact that
        makes travel difficult for those seeking their counsel. The upper body
        of a weird always resembles that of a beautiful female humanoid. The
        lower half may be either humanoid or a serpentine column. A weird rises
        from a pool of the appropriate element, which it can never
        leave.</p><p>A weird can divine information that could change the very
        course of history. It has its finger on the pulse of fate and knows
        exactly where possible courses of action might lead. Like most seers, an
        elemental weird never provides a clear, concise prophecy. Some of the
        message may seem forthright, but some is always confusing or just
        difficult to decipher because the listener does not have enough
        information to understand the weird's meaning. Though its messages can
        be misinterpreted, a weird's warnings and advice are never wrong. Its
        counsel is seldom free, however, so anyone beseeching a weird had best
        bring offerings or be prepared to undertake a quest of vital importance
        to the creature.</p><p>Encounter</p><p>All weirds, regardless of their
        elemental subtypes, are connected to each other in fundamental ways.
        They share a unique, secret bond that is evidenced in their level of
        cooperation. A weird that cannot provide the desired knowledge to a
        supplicant usually guides him or her to another weird for better
        counsel. Weirds of different elements often place their pools close to
        one another to broaden the range of divination services available to
        supplicants in an area. Weirds are strongly linked to the Material
        Plane. They have all chosen to leave their native planes and serve as
        diviners for the humanoid races. Though they are bound to their pools,
        weirds can interact with other races though mortal agents that
        specialize in divination magic.</p><p>Elemental weirds do not fight if
        they can avoid it. If they must fight, they begin by summoning
        elementals to defend them. If any other elementals are present
        (regardless of type), the weird attempts to gain control of them and
        turn them against its foes. Meanwhile, the weird remains in the center
        of its pool, using divination magic to foresee possible consequences of
        the battle and acting accordingly. If forced into melee, a weird uses
        its reach to lash out at nearby foes. If seriously threatened, a weird
        retreats back to its plane of origin.</p><p>Elemental Pool</p><p>Each
        weird dwells within a large pool (at least 20 feet across and 40 feet
        deep) filled with the purest form of its element. The pool is always
        secured to a flat surface (floor, wall, or ceiling; see individual
        entries for possible orientations) such that its depth forms a hollow
        within that surface. The surface must have sufficient depth to
        accommodate the pool. An elemental pool can also exist as a separate
        area inside a larger volume of the same element; for example, a water
        weird's pool might be situated at the bottom of an ocean or lake. The
        base of the pool contains a portal to the weird's native plane.
        Creatures granted access to the pool by the weird must provide their own
        protection from the elemental material, as well as the means to breathe
        and move within that enviroment. Otherwise, they suffer the effects
        given in the individual entry. A weird is physically tied to its pool
        and cannot leave except to return to its native plane through the
        portal. A weird may rise up to a height of 10 feet above the surface of
        its pool, but the lower part of its body must always remain in contact
        with the elemental material. Once a weird exits the pool for its native
        plane, the portal closes, and the pool loses its special effects. Air
        Pool. An air weird's pool is filled with billowing, gusting vapors of
        breathable air and mist. Creatures without the ability to fly cannot
        move through it, except by falling. An air weird's pool may be affixed
        to any vertical or horizontal surface, and it may be right side up or
        upside down (if affixed to a ceiling, for example). Fire Pool. This pool
        contains a torrent of dancing flames that burn and smoke continually.
        Unprotected flammable materials within a fire pool catch on fire
        immediately, and any creature within the pool takes 3d10 fire damage per
        round. Creatures without the ability to fly cannot move through this
        pool, except by falling. A fire weird's pool may be affixed to any
        vertical or horizontal surface, and it may appear only in a right side
        up position (such as on the floor of a cavern). Earth Pool. This pool is
        filled with churning mud, rocks, and earth. Every creature within it
        (except the earth weird and earth elementals) takes 4d8 bludgeonning
        damage per round from the ever-grinding earth. In addition, creatures
        entering the pool suffocate if they do not have a way to breathe and are
        entombed (restrained) if they cannot burrow. An earth weird's pool may
        be affixed only to a horizontal surface, and it may appear only in a
        right side up position (such as in the floor of a cavern). Water Pool.
        This pool is filled with bubbling, swirling water. Any creature within
        it that cannot breathe water immediately begins to drown. Any creature
        without the ability to swim cannot move through a water pool, except by
        falling. A water weird's pool may be affixed only to a horizontal
        surface, and it may appear only in a right side up position (such as on
        the floor of a cavern).</p><p>Info</p><p>Air weirds are elemental
        spirits that offer direction and guidance to those traveling into
        unknown areas. They can point out paths not considered, reveal unknown
        doors into new worlds, and describe what may be needed to survive such
        journeys. An air weird's pool is often found outside, in an open-air
        place such as a windy plain or on a mountaintop. An air weird appears as
        a ghostly, translucent woman composed of flowing vapors. Its eyes are
        deep blue, and its hair appears windblown. The lower half of the
        creature's body is a tendril of mist that trails back into its pool.</p>
