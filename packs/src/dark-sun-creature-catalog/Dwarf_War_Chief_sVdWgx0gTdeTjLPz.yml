  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Sturdy miners, stonecutters, and builders</p><p>inured
        to long hours of toil under the crimson sun, dwarves are common on
        Athas. A dwarf would rather die than admit
        defeat.</p><p>Lore</p><p>Every city-state's population includes hundreds
        or thousands of dwarf artisans and slaves. As well, dwarves can be found
        in great numbers in wilderness villages and mining camps.</p><p>Dwarves
        once ruled great mountain kingdoms, until the wars of the Red Age
        destroyed their holdings. They have fallen far from that ancient glory.
        Although they still speak Dwarven, the secret of reading and writing it
        is long lost; none can decipher the ancient Davek script today. Thus,
        even dwarves who wield magic have only a rudimentary knowledge of
        rituals. Some view their race's illiteracy as a badge of honor, claiming
        that dwarves need no magic to survive the brutal world of
        Athas.</p><p>Encounters</p><p>Dwarves are found in the company of
        humans, muls, elves, and other city-dwellers. They are skilled
        beast-handlers and train war beasts such as jhakars, drakes, cilopses,
        and giant beetles.</p><p>Those who dwell with or near dwarves respect
        the prowess of the war chiefs. These ferocious warriors find work as
        guards, mercenaries, slave-soldiers, or gladiators. In these
        circumstances they fight along· side, or against,
        anyone.</p><p>Info</p><p>Sporting armor crafted from the hide and chitin
        of the desert's monsters, and wielding a maul of giant's bone, a war
        chief is an imposing figure. Despite the title, war chiefs are not
        necessarily commanders-but all are masters of the art of war. War chiefs
        rush headlong into combat yet retain enough tactical acumen to defend
        their more vulnerable compatriots. A war chief focus on the most
        dangerous-looking foe early in combat and stays with it, using brutal
        maul smash attacks to keep it from getting away. If an enemy slays one
        of its allies, the war chief attack that foe to exact vengeance against
        it-ignoring better targets in its wrath.</p>
      public: ''
