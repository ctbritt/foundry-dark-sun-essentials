  details:
    biography:
      value: >-
        <p>The gith are a race of grotesque humanoids that appear to be a
        peculiar mixture of elf and reptile. They are extremely gaunt and lanky,
        with long gangling arms and spindly legs.Their fingers and toes end in
        sharp claws. If one could get a gith to stand up straight, he would
        measure close to 7 feet tall. However, most gith appear to be no more
        than 5 feet tall, for they always stand hunched over at the shoulders,
        in a permanent slouch.</p><p>Although descended from creatures said to
        come from beyond the Gray, Athas's gith are tribal and savage. The slide
        into barbarism did not extinguish their mental abilities, however.
        Combined with the giths' extreme brutality and absolute mercilessness,
        their psionic powers might be even more dangerous than those of their
        forebears.</p>
