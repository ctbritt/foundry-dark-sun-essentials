  details:
    biography:
      value: >-
        <p>An Athasian wraith is a noncorporeal undead capable of moving freely
        between the Gray and the land of the living. It can possess unliving
        objects of all sorts, ranging from weapons to furniture to corpses, as
        well as unintelligent creatures such as scorpions, insects, or slimes.
        Outside its host object, an Athasian wraith is barely visible, appearing
        only as a gray shade or a mass of churning darkness. Its form resembles
        its living body, but it can also assume a mistlike appearance. No matter
        what form a wraith takes, it can always be spotted by its glowing eyes,
        which range from a bright purple to blood red.</p><p>Wraiths who take
        human corpses as hosts fill out the dead flesh with their own misty
        form. When a section of the host is cut away, the same part of the
        wraith becomes visible. For instance, if an Athasian wraith possessed a
        corpse and the host's right arm were chopped off, the wraith's right arm
        would be visible in its place.</p><p>Athasian wraiths are capable of
        communicating verbally with the living and speak the same languages they
        spoke in life or have learned in undeath. They are free to communicate
        as they please outside their hosts, but are limited to the capabilities
        of the hosts they inhabit.</p>
