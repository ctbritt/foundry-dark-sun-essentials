  details:
    biography:
      value: >-
        <p>The water drake is the most elusive of all drakes. This is due mostly
        to the hatred they hold for what humanity has done to Athas.</p><p>Water
        drakes are pale, grey-blue in color, with a blow hole centered in the
        back of their heads. Water drakes are the slimmest of the drake family.
        Their four webbed feet end in sharp, triangular claws. Water drakes
        tails are thinner and flatter than other drakes, and they provide
        excellent propulsion when in water.</p>
