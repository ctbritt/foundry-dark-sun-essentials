  - _id: K6THRiU065dBZDZI
    name: Water Sphere
    type: feat
    system:
      source:
        custom: ''
        book: ENK
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The drake summons a 15-foot radius
          sphere of water from the plane of water centered on a point it can see
          within 100 feet of it. Roll a d10 to decide the form the sphere
          takes:</p><p>1-3: The sphere forms as a solid block of ice. Each
          creature within it must make a DC 16 Dexterity saving throw. On a
          failed save, they take 36 (8d8) cold damage and are trapped within the
          sphere as it solidifies. The sphere will begin to roll if on a
          sufficiently flat surface at a rate 30 feet per round. The sphere will
          naturally melt on its own unless kept cold. Otherwise, the sphere can
          be broken by damage. The sphere has 10 AC, 36 hit points, is
          vulnerable to fire damage and immune to cold, poison, and psychic
          damage. When trapped, the creatures are restrained, can't take any
          actions that require physical movement, and can't breathe (see the
          suffocation rules in the Player's Handbook). On a successful save,
          they take half as much cold damage and move to an empty space 5 feet
          outside the sphere. If there is no empty space available, they
          automatically fail the saving throw.</p><p>4-6: The sphere forms from
          fresh water and explodes outwards. Every creature within 30 feet of
          the sphere must make a DC 16 Dexterity saving throw. On a failed save,
          they take 36 (8d8) bludgeoning damage and are knocked prone. On a
          successful save, they take half the bludgeoning damage and are not
          knocked prone.</p><p>7-9: The sphere forms from boiling water and
          explodes outwards. Every creature within 30 feet of the sphere must
          make a DC 16 Dexterity saving throw. On a failed save, they take 45
          (10d8) fire damage and are knocked prone. On a successful save, they
          take half the fire damage and are not knocked prone. Being underwater
          doesn't grant resistance against this damage.</p><p>10: The sphere
          forms from boiling steam. Every creature within 30 feet of the sphere
          must make a DC 16 Constitution saving throw. On a failed save, they
          take 58 (13d8) fire damage and are knocked prone. On a successful
          save, they take half the fire damage. Being underwater doesn't grant
          resistance against this damage.</p></div>
        chat: ''
      requirements: ''
