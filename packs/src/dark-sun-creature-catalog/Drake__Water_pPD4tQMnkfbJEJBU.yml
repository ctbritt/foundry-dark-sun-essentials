      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>As a bonus action, the drake creates
          an exact copy of itself made of psychic energy. The clone lasts for 1
          hour until it moves more than 60 feet away from the drake or until the
          drake dismisses it as a bonus action. The drake can use its action to
          see and hear out of the clone and can command it to move. While doing
          this, the drake is blinded, deafened, and can not move. The clone is
          immune to all conditions and all damage except psychic damage and any
          condition that would target it through its mind, in this case the
          damage and effect would go to the drake.</p></div>
