  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The spiders of athas have evolved</p><p>as the verdant
        world turned slowly to sand. They have grown to monstrous proportions
        and have learned to make the terrain an ally in their
        hunts.</p><p>Lore</p><p>Natural loners, the spiders of the Tablelands
        haunt shallow caves, deep valleys, and similar locations that offer
        cramped confines and twisting passages. The spiders weave webs across
        these passages. In some instances, they spin their webs over great pits
        or across chasms.</p><p>Encounters</p><p>Athas's spiders regard other
        creatures as food, and they establish lairs in territory through which
        easy prey passes. They prefer areas that see regular travel, steering
        clear of high-traffic routes to avoid unwanted attention. A spider's
        lair usually contains three to five webs stretched across its major
        passages.</p><p>Black Spiders</p><p>Rearing itself up before you is an
        enormous spider the size of a man with disgusting, oily black skin,
        mottled with lurid red and purple streaks. Its features are almost
        humanoid and it regards you with a menacing leer.</p><p>Dark spiders are
        an intelligent species of subterranean arachnid that lives in highly
        organized tribal units. Divided among warriors, defilers and queens,
        they have no natural enemies but often create enemies through their
        predatory behavior when nesting young. Dark spiders stand six feet in
        height and weigh 120 pounds, although their queens reach twice that size
        when mature. The more intelligent among them are able to master humanoid
        tongues, and some have been known to trade silk to merchant houses in
        return for warm-blooded slaves.</p><p>Dark spiders prefer to either
        strike from ambush, using their webbing, or attack with greater numbers
        and overwhelm their foes. Warbands of warrior spiders are often led by
        individual defilers or psions, who use their powers to bolster the melee
        attacks of the warriors. In melee, dark spiders strike with two claws
        and a poisonous bite. The venom of the queen is particularly potent and
        is easily capable of killing an adult human. The poison of the other
        dark spiders is still dangerous but less routinely fatal than that of
        the queens.</p><p>Info</p><p>One in five warriors is born with a
        mutation that slightly hampers the creature's physical development, but
        gives rise to a smattering of psionic abilities as a consequence. These
        psionic dark spiders are viewed with curiosity and some respect by their
        fellows, but are still not afforded the same status as are the
        defilers.</p>
      public: ''
