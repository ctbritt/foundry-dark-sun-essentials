  details:
    biography:
      value: >-
        <p>Giants dominate many of the islands and coastal areas of the Silt
        Sea, wading across it to plunder the communities of smaller races where
        they find them. In some lost millennium, as a bizarre experiment or
        perhaps as some sort of curse, giants were magically crossbred with
        humans. Half-giants are now fairly common, especially to human
        controlled lands at the edge of the sea of dust. A half-giant is an
        enormous individual, and their features are human, but exaggerated.</p>
