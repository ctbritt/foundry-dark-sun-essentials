  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Cilops are relentless hunters who are prized by the
        templars of all the city-states for their unique tracking abilities. The
        creatures look like enormous centipedes that reach lengths exceeding 15
        feet. Their segmented bodies are long and flat and form a hard
        exoskeleton. Their hooked legs allow them to crawl onto virtually any
        surface and to scale walls with ease.</p><p>Cilops seem to require no
        sleep and will track their prey for weeks without stopping. Their unique
        object reading ability allows them to touch an object and then associate
        that object with an individual. While they ordinarily track by scent, if
        they are in danger of losing a trail, they will use an ability similar
        to sensitivity to psychic impressions. This ability allows a cilops to
        detect the psychic residue of its prey and to resume
        tracking.</p><p>Cilops have no lairs or consistent nesting areas, but
        constantly roam in search of food. They will occasionally hunt in small
        packs, but there appears to be no clear structure to the group. The
        cilops can be captured and trained. The creature seems to become
        familiar with its handler and can be used to hunt individuals if it is
        provided a fresh trail or an object that has been handled by the victim.
        Cilops have not been successfully bred in captivity and must be
        captured.</p>
