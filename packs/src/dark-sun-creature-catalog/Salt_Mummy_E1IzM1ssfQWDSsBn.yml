  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>Salt mummies are preserved corpses of ancient
        humanoids who were accidentally buried too close to veins of white,
        brittle salt. Of course, salt alone is not sufficient to suffuse a body
        with undead vigor; often, such a creature has taken a great sin with it
        to its subterranean grave, the horror of which eventually creates a
        linkage to the Gray. A salt mummy is usually encountered by miners
        working a new deposit. It appears at first to be nothing more than an
        old, salt-rimed corpse. If the miners continue to dig it out, eventually
        the mummy becomes animate and waits until it is almost dug free. The
        shuddering crack as a salt mummy breaks away from a salt vein is a
        dreadful thing to hear.</p><p>Encounter</p><p>Defilers sometimes seal
        the corpses of slain assassins, corrupt officials, and criminals in
        caskets packed with salt in hopes of spurring the transformation of
        those corpses into salt mummies. Most salt mummies, however, are found
        underground the remains of evil adventurers and other humanoid creatures
        killed in salt mere and ravaged by the salt
        deposits.</p><p>Info</p><p>Salt mummies haunt the larger salt plains of
        Athas, most notably in the Salt Meres of Bodach near the dwarf ruins of
        Bodach, the salt marsh of the Dragon Horns, and the Dry Marsh.</p>
