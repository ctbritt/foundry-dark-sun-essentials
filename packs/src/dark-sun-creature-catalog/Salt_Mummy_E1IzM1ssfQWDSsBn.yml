    name: Dehydrating Aura
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The very air surrounding the salt
          mummies drains the moisture out of any living creature. Each creature
          that starts its turn within 20 feet of the mummy must succeed on a
          [[/save ability=con dc=10]] saving throw. On a failure the creature
          take 2d6 damage, or half as much damage on a successful one. If the
          saving throw if failed by 5 or more the creature takes one level of
          &amp;Reference[condition=exhaustion] as well and the mummy is healed
          by 10 hit points. Regardless of the result the creature will need to
          drink twice her usual daily water intake to satisfy her
          needs.</p></div>
