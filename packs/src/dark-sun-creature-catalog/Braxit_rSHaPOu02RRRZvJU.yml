  details:
    biography:
      value: >-
        <p>It is difficult to tell whether the braxat are of mammalian or
        reptilian stock. Their backs are covered with thick, articulated shells,
        their heads have a squarish lizard-like shape giving them a reptilian
        appearance, and the crowns of their heads are defended by three to five
        horny protrusions. At the same time, they walk upright on two feet, can
        speak with a human-like voice, have a fully opposable thumb, and are
        warm-blooded.</p><p>Braxats are found throughout Athas, wandering the
        forlorn wastes in search of prey. They are usually solitary creatures,
        but may rarely be found in mated pairs (in this case, the young are
        usually safely hidden away in a remote cavern).</p><p>Braxat are true
        terrors of the desert, usually attacking at night in search of fresh
        meat. Although they will eat caravan mounts on occasion (with the
        exception of kanks), they prefer intelligent races.</p><p>Braxat shells
        make excellent shields and armor plates. Because of this, they are
        sometimes hunted by other creatures living near them. Because of the
        power of the braxat, however, would-be hunters often find the tables
        turned upon them and end up the targets of a deadly ambush.</p>
      public: ''
