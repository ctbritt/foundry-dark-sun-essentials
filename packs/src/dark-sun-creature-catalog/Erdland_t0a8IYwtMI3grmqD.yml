  details:
    biography:
      value: >-
        <p>Erdlands are a large variant of the erdlus and are commonly
        encountered in herds in the Athasian plains. Used as mounts or to pull
        caravans, erdland are a common sight along the trader routes through the
        deserts of Athas.</p><p>Erdlands, like their smaller cousins, are
        flightless, featherless birds which are covered with red to grey scales.
        Erdlands can weigh up to 2,000 pounds and often stand nearly 15 feet
        tall. The legs of an erdland are powerful and strong, sporting large
        four-clawed feet. Unlike erdlus, erdlands are not capable of fast speeds
        and are used more for their endurance than their speed. Aside from the
        difference in size and speed, erdlands very closely resemble the smaller
        and quicker erdlus.</p>
      public: ''
