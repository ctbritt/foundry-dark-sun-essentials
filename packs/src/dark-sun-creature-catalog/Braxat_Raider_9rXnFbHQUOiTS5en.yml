        description: >-
          <div class="rd__b  rd__b--3"><p>The target can't take Bonus Actions or
          Reactions and must roll 1d10 at the start of each of its turns to
          determine its behavior for that turn, consulting the table
          below.</p><table class="w-100 rd__table 
          stripe-odd-table"><thead><tr><th class="rd__th ve-col-2 ve-text-center
          " data-rd-isroller="true"><span class="roller render-roller"
          title="Click to roll. SHIFT/CTRL to roll twice."
          data-packed-dice="{&quot;type&quot;:&quot;dice&quot;,&quot;rollable&quot;:true,&quot;toRoll&quot;:&quot;1d10&quot;,&quot;displayText&quot;:&quot;1d10&quot;}">1d10</span></th><th
          class="rd__th ve-col-10 " data-rd-isroller="false">Behavior for the
          Turn</th></tr></thead><tbody><tr><td class="rd__th ve-col-2
          ve-text-center " data-roll-min="1" data-roll-max="1">1</td><td
          class="rd__th ve-col-10 ">The target doesn't take an action, and it
          uses all its movement to move. Roll <span class="roller render-roller"
          title="Click to roll. SHIFT/CTRL to roll twice."
          data-packed-dice="{&quot;type&quot;:&quot;dice&quot;,&quot;rollable&quot;:true,&quot;toRoll&quot;:&quot;1d4&quot;,&quot;displayText&quot;:&quot;1d4&quot;}">1d4</span>
          for the direction: <b>1</b>, north; <b>2</b>, east; <b>3</b>, south;
          or <b>4</b>, west.</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center " data-roll-min="2" data-roll-max="6">2-6</td><td
          class="rd__th ve-col-10 ">The target doesn't move or take
          actions.</td></tr><tr><td class="rd__th ve-col-2 ve-text-center "
          data-roll-min="7" data-roll-max="8">7-8</td><td class="rd__th
          ve-col-10 ">The target doesn't move, and it takes the <a
          href="https://5e.tools/actions.html#attack_xphb"
          data-vet-page="actions.html" data-vet-source="XPHB"
          data-vet-hash="attack_xphb">Attack</a> action to make one melee attack
          against a random creature within reach. If none are within reach, the
          target takes no action.</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center " data-roll-min="9" data-roll-max="10">9-10</td><td
          class="rd__th ve-col-10 ">The target chooses its
          behavior.</td></tr></tbody></table><p>At the end of each of its turns,
          an affected target repeats the [[/save ability=wis]] save, ending the
          spell on itself on a success.</p></div>
