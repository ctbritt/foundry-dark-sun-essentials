  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Encased in an armored carapace</p><p>this hulking
        reptilian beast strides through the forlorn barrens in search of prey.
        Those who have never encountered a braxat might mistake it for a
        simple-minded brute, realizing too late that the creature is a walking
        arsenal of both physical and mental weapons. Braxats are violent,
        nocturnal hunters that stalk mountainous and desert regions. These
        dangerous, evil humanoids</p><p>prey exclusively on intelligent beings,
        whom they take great pleasure in torturing, killing, and eating. Their
        taste for humanoid flesh can take them deep into civilized lands, where
        prey is plentiful and easy to catch.</p><p>Lore</p><p>Over the
        centuries, life-warping magic in the remote wilderness has spawned many
        perverse creatures, including braxats. They arose from four-legged
        reptilian beasts similar to mekillots, gaining sentience and a malicious
        nature under a grim magical influence. A braxat is a hulking, bipedal,
        lizardlike humanoid that towers over many giants at its full adult
        height of 15 feet. Its features are a combination of those of a
        rhinoceros and a spiny beetle. The top of its head and its back are
        lined with thick, horncovered plates, and a single, massive horn juts up
        from between its nostrils. Creatures smaller and weaker than a braxat
        can expect contempt from it at best and death at worst. Anything as big
        and powerful as a braxat - including other braxats - is a target of its
        hate and competitiveness. When facing stronger foes, braxats sometimes
        overlook their rivalries to band together. They particularly detest
        giants and ally to raid giants' tribes. Braxats also come together in
        mated pairs or in service to more powerful overlords. They mate only
        when food is plentiful and shelter, such as a cavern or a buried ruin,
        is available for the eggs and hatchlings. Even so, one braxat that has a
        desire to mate must subjugate another to this purpose. Similarly, anyone
        who wishes to employ a braxat must first prove stronger than the
        creature or help it gain more food and wealth than it could amass on its
        own. Adult braxats fight to the death rather than submit to an untested
        foe.</p><p>Encounters</p><p>Few creatures have enough power to earn the
        respect of an adult braxat. Strong leaders who promise success in
        hunting and pillaging might win over a braxat by appealing to its
        mercenary streak. Sometimes a braxat agrees to serve as muscle for a
        potent evil being. Only the foulest humanoids can tolerate a braxat's
        cruelty and violence. Braxats respect neither law nor authority, and
        they fear no one. Their awesome strength, psionic abilities, and damage
        reduction make them nearly unstoppable, and it is not uncommon for a
        single band of them to wipe out several humanoid settlements in the
        course of a year. Occasionally a few survivors from braxat raids band
        together and try to hunt the creatures down, but rarely do they succeed
        in exacting vengeance. Experienced adventurers have been known to hunt
        braxats for sport, pitting their experience and cleverness against the
        creatures' raw cunning and psionic abilities. As such hunters have
        discovered to their dismay, braxats are quite proficient at protecting
        themselves with deadly traps and ambushes. Most such hunts end in
        victory for the braxats, but now and then one is successful, yielding a
        few braxat-horn trophies to the hunters. These horns have no value in
        themselves, but artists sometimes carve intricate sculptures on them and
        sell them as art objects.</p><p>An enterprising or lucky braxat might
        become the chieftain of a raiding tribe of savage and callous humanoids.
        Such a band boldly claims a wide swath of territory and turns the
        choicest morsels and treasures over to its brutal chief. Braxats have no
        loyalty, however, and if food grows scarce, they will turn on weaker
        allies, other braxats, and even members of their own families. Braxats
        live in a tribal society in which males and females have equal social
        status and access to leadership positions. Each tribal leader must prove
        his or her worthiness annually in a ritual combat with a single
        challenger who has earned the right of contest through successful
        raiding over the past year. Young braxats are trained to fight from the
        time they can stand. Deadly combat between young braxats over potential
        mates, lairs, or treasure is encouraged to ensure that only the
        strongest and cleverest survive to reproduce.</p><p>Once a young braxat
        is deemed worthy to join a warband, that group becomes his or her second
        family. Switching to a different warband occurs only rarely usually when
        most of a band has been killed in battle. Aggression between bandmates
        is strictly forbidden, since cooperation is vital to a successful hunt.
        Killing a bandmate is punishable by the immediate execution of both the
        offender and his or her family.</p><p>Info</p><p>Protected by its
        articulated carapace, a braxat raider thunders through the desert,
        looking for creatures to kill and eat. It likes to wait along caravan
        routes or near outlying villages, devouring travelers, villagers, and
        livestock.</p>
