  details:
    biography:
      value: >-
        <div class="rd__b  rd__b--1"><p>In the broken crags and tiny caves of
        the barrens lives the timid baazrag. Two feet long or less, it is one of
        the smallest omnivores in the stony barren regions. Its four legs are
        comparatively frail but are adequate for darting from shelter to shelter
        around its rocky home. The tail of the Baazrag is about 5 feet long.
        Newborns are red-brown, green, yellow, or orange, but the color fades
        gradually to a sandy gray at old age.</p><p>Baazrag packs band together
        only for mutual defense of their territory. Otherwise, they have little
        contact with those of other bands. Noble families of Tyr and Balic
        domesticate the baazrag to rid their households of unwanted pests and
        insects. The families also organize teams of the creatures to pull
        wagons. Each baazrag can pull as much as 50 pounds of cargo and
        transport.</p><p>Other baazrags have been specially trained to hunt
        unwanted pests in the sewers. The templars of Tyr have a special squad
        with several dozen swimming baazrags that are used to clean out infested
        areas.</p></div>
