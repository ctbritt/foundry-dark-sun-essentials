  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Hunting cacti are a pale green color. They stand 3 feet
        high and have a number of oval shaped pods attached to the main trunk.
        They have no sensory organs, so they rely on their psionic abilities to
        detect prey.</p><p>Hunting cacti are normally found alone, although they
        are occasionally found in pairs. They build no lair, resting wherever
        they happen to be. They often rest among a group of normal cacti if one
        is available. Hunting cacti prefer meat, but can survive on plants
        indefinitely. Although the cacti regard this as a form of cannibalism,
        they prefer consuming plants to starvation.</p>
