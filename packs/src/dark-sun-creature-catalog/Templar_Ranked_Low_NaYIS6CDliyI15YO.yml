  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Templars</p><p>Templars are the most feared people in
        the city states. Their power to accuse and imprison nearly anyone for
        any reason keeps the city dwellers in terror. Not surprisingly, templars
        tend to abuse the powers they have for their own personal gain which, so
        long as the city is administered and kept in order, does not bother the
        sorcerer-king. Templars perform three vital functions within a given
        city state. Primarily, they comprise the city guards and officers of the
        sorcerer-king's armies. Secondly, they see to it that the city is
        administered, its businesses kept running, and its slaves fed. Finally,
        the templars are responsible for maintaining the illusion that the
        sorcerer-king is a god they have absolute power to enforce worship and
        homage to the sorcerer-kings. Every templar NPC will be actively
        pursuing one of these functions. One final, unwritten function of the
        templars is to advance through their ranks as rapidly as possible. The
        means by which a templar might gain power and position are wide open,
        including bribery, theft, and even assassination of others within their
        ranks. Every templar NPC can be counted on to accept underhanded schemes
        that will help him rise to power among his fellows.</p><p>In the
        administration of the city states, templar NPCs occupy all positions
        from waste removal to the mayorship. Lower-Ranked templars (levels 1-4)
        are given the dirtier jobs tkat require hands-on work, having a few
        guards at their disposal and fewer slave laborers than tkey need to
        perform their tasks effectively. Ranked templars (levels 5-8) gain
        greater responsibilities and may have several lower- ranked templars
        beneath them. High- Ranked templars (levels 9 and higher) move into
        management of the city state such templars are difficult to unseat,
        since they can blame nearly any shortcomings on their
        underlings.</p><p>These are only a sampling of the many levels of
        templar bureaucracy. Advancement through the ranks has little to do with
        ability or experience. Technically, the sorcerer-king is a god within
        his own city and the templars assure him of worship and obedience. In
        actuality, a sorcerer-king is not a god or a demigod, though he is
        generally an extremely powerful wizard and psionicist. However, the
        templars erect temples and subjugate the populations to worship him.
        There isn't a noble, merchant, or peasant in a city state who doesn't at
        least pay lip service to the sorcerer-king or the templars who enforce
        his will.</p><p>The DM must keep two things in mind when dealing with
        any particular templar NPC. First, how will the templar attempt to use
        the player characters to gain advantage? He could accuse or imprison
        them, which always looks good in the eyes of a superior, or he could buy
        their services to perform a task suck as assassination or simply making
        a superior look bad. Second, the DM must consider how the player
        characters might appeal to the templar's wicked ways and greed. In their
        quest for power, they are sometimes easily manipulated. Beware, though
        higher-ranked templars have played these games of treachery before and,
        by their very existence, they've proven pretty good at
        them.</p><p>Duties and Auhtority</p><p>Templar soldiers are the
        enforcement arm of their service to the sorcerer-king. Low-Ranked
        templars (levels 1-4) are common soldiers, guards within the cities
        around the slave areas practiced and drilled in formations around the
        city walls. Ranked templars (levels 5-8) are officers in charge of small
        (10-100 man) units of guards, slave soldiers, or undead soldiers (in
        times of war). High-Ranked templars (levels 9 +) are usually generals or
        administrators, keeping the army equipped and fed.</p><p>Info</p><p>Low
        Ranked Templar (1-4 levels)</p><p>Low ranked Templars have the following
        duties to follow: </p><p>- Removers of Waste, Movers of Grain, Minor
        Construction, Disease Control, Maintenance of Gardens, Maintenance of
        Roads, Maintenance of Walls.</p><p>In exchange of this duties they have
        the following authority:</p><p>- A templar can call upon a slave to do
        whatever he wants. Slaves who do not do as ordered by a templar face
        immediate death.</p><p>- A templar can pass judgement upon a slave at
        any time. In any matter involving disobedience or the actions of a
        slave, a templar may judge, sentence, or pardon a slave as he sees fit,
        regardless of who owns the slave. Penalties can include imprisonment,
        torture, or even death.</p><p>- A templar can legally enter the house of
        a freeman. The freeman has no right to refuse the templar admission,
        under punishment of imprisonment and possible execution.</p><p>- A
        templar can requisition soldiers. He can call upon 1d4 soldiers per
        level. The soldiers will all be Guards templars with one Knight Templar
        centurian. A templar can call upon soldiers any time he wishes, but the
        soldiers cannot be ordered to leave the city without permission from the
        templar's sorcerer-king.</p><p>- A templar can accuse a freeman of
        disloyalty or similar crimes. Regardless of evidence, an accused freeman
        will be locked in the dungeons of the sorcerer-king for as long as the
        accusing templar wishes.</p>
