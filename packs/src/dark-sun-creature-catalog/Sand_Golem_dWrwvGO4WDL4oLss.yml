  details:
    biography:
      value: >-
        <p>Sand golems are humanoid in shape and stand roughly eight feet tall.
        They have indentations where their eye sockets should be, though they
        have no actual eyes. Likewise, they have a mouth, but they are incapable
        of speech, managing only to roar and growl at opponents. When a sand
        golem moves, it leaves a fine trail of sand behind it, making the
        tracking of this creature fairly easy.</p>
      public: ''
