      description:
        value: >-
          <div class="rd__b  rd__b--3"><p><i>Melee Weapon Attack:</i> +7 to hit,
          reach 5 ft., one target. <i>Hit:</i> 11 (2d6+4) bludgeoning damage,
          and if the target is Medium or smaller, it must succeed on a [[/save
          ability=str dc=17]] saving throw or take an additional 5 (1d10)
          bludgeoning and be dragged into the golem. A creature trapped inside
          the golem is &amp;Reference[condition=grappled] (escape DC <span
          class="rd__dc">17</span>) and is
          &amp;Reference[condition=incapacitated] while
          &amp;Reference[condition=grappled] in this way. While trapped, the
          creature can not breathe (see the suffocation rules in the Player's
          Handbook) and takes 5 (1d10) bludgeoning damage at the beginning of
          the golems turn.</p><p>The golem can only have one creature trapped at
          a time.</p></div>
