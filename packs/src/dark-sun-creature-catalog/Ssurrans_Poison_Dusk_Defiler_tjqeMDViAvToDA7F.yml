  - _id: Tn55TefDJ8spg71V
    name: Web
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '340'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You conjure a mass of sticky webbing
          at a point within range. The webs fill a 20-foot @variantrule[Cube
          [Area of Effect]|XPHB|Cube] there for the duration. The webs are
          @variantrule[Difficult Terrain|XPHB], and the area within them is
          @variantrule[Lightly Obscured|XPHB].</p><p>If the webs aren't anchored
          between two solid masses (such as walls or trees) or layered across a
          floor, wall, or ceiling, the web collapses on itself, and the spell
          ends at the start of your next turn. Webs layered over a flat surface
          have a depth of 5 feet.</p><p>The first time a creature enters the
          webs on a turn or starts its turn there, it must succeed on a
          Dexterity saving throw or have the
          &amp;Reference[condition=Restrained] condition while in the webs or
          until it breaks free.</p><p>A creature
          &amp;Reference[condition=Restrained] by the webs can take an action to
          make a Strength (&amp;Reference[skill=Athletics]) check against your
          spell save DC. If it succeeds, it is no longer
          &amp;Reference[condition=Restrained].</p><p>The webs are flammable.
          Any 5-foot @variantrule[Cube [Area of Effect]|XPHB|Cube] of webs
          exposed to fire burns away in 1 round, dealing 2d4 damage to any
          creature that starts its turn in the fire.</p></div>
