  details:
    biography:
      value: >-
        <p>Though somewhat smaller than humanoid giants, beasthead giants are
        actually more dangerous. Beasthead giants are smaller and lighter than
        their humanoid cousins, averaging 15 to 20 feet tall and weighing from
        three to six tons. Beasthead giants, as their name implies, have a
        humanlooking body and the head of a beast.</p><p>Each of these hulking
        humanoids has the head of a beast, though every one has slightly
        different features. The beasts represented are found throughout Athas
        and include those both living and long extinct.</p>
