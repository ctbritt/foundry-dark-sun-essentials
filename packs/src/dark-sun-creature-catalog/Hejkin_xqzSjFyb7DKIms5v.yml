  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Hej-kin are a race of vile-looking humanoids who inhabit
        the natural subterranean caverns and tunnels of Athas.</p><p>Hej-kin
        have round chubby faces which are accented by large noses and small,
        slanted eyes. The ears of hej-kin are pointed, short, and covered with a
        thick fur. The skin color of hej-kin varies greatly, from deep red to a
        dark mossy green. Most hejkin clans will usually be all of the same
        color skin, and most tend to be reddish and orange colored. The skin of
        a hej-kin is thick and very tough, similar in texture to softened
        leather hide.</p><p>The language of the hej-kin is a combination of sign
        and verbal communication. Hej-kin speak in a low-pitched voice that
        resembles human mumbling in sound. Very few aboveground dwellers are
        familiar with the language of the hej-kin, for it is extremely difficult
        to learn.</p><p>Most clans make their homes in caverns adjacent to
        underground streams providing the clan with an adequate supply of water.
        Unlike many other types of subterranean dwellers, hej-kin do not dig
        tunnels or caves, for doing so would disturb the earth, which they
        consider sacred.</p><p>The average hej-kin clan contains four to five
        families, each consisting of three to six members. A family's living
        area is usually a smaller cave connected by tunnel to the cavern
        occupied by the rest of the clan. Hej-kin mark their dwellings by runes
        on the outer cave walls.</p><p>Hej-kin are omnivores, relying on both
        meat and vegetables as sources of food. Most of their food comes from
        subterranean plants and small underground creatures.</p>
