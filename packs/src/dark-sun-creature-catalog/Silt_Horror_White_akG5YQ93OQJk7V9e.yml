        value: >-
          <div class="rd__b  rd__b--3"><p>The silt horror has ten tentacles.
          Whenever the silt horror takes 25 or more damage in a single turn, one
          of its tentacles dies. At the end of its turn, it grows two tentacles
          for each of its tentacles that died since its last turn, unless it has
          taken fire damage since its last turn. The silt horror regains 10 hit
          points for each tentacle regrown in this way.</p></div>
