      description:
        value: >-
          <div class="rd__b  rd__b--3"><p><i>Melee Weapon Attack:</i> +16 to
          hit, reach 10 ft., one target. <i>Hit:</i> 34 (4d12 + 10) damage. If
          the target is a Large or smaller creature, it must succeed on a
          [[/save ability=dex dc=19]] saving throw or be swallowed by the silk
          wyrm. A swallowed creature is &amp;Reference[condition=blinded] and
          &amp;Reference[condition=restrained], it has total cover against
          attacks and other effects outside the worm, and it takes 21 (6d6)
          damage at the start of each of the horror's turns. If the silt horror
          takes 30 damage or more on a single turn from a creature inside it,
          the silt horror must succeed on a [[/save ability=con dc=21]] saving
          throw at the end of that turn or regurgitate all swallowed creatures,
          which fall &amp;Reference[condition=prone] in a space within 10 feet
          of the horror. If the horror dies, a swallowed creature is no longer
          &amp;Reference[condition=restrained] by it and can escape from the
          corpse by using 20 feet of movement, exiting
          &amp;Reference[condition=prone].</p></div>
