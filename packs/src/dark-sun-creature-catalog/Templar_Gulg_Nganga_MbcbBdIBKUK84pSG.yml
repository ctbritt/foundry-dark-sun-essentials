  - _id: RE69bjrjDmC98fYn
    name: Reincarnate
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '311'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You touch a dead Humanoid or a piece
          of one. If the creature has been dead no longer than 10 days, the
          spell forms a new body for it and calls the soul to enter that body.
          Roll 1d10 and consult the table below to determine the body's species,
          or the DM chooses another playable species.</p><table class="w-100
          rd__table  stripe-odd-table"><thead><tr><th class="rd__th ve-col-2
          ve-text-center " data-rd-isroller="true">1d10</th><th class="rd__th
          ve-col-10 "
          data-rd-isroller="false">Species</th></tr></thead><tbody><tr><td
          class="rd__th ve-col-2 ve-text-center " data-roll-min="1"
          data-roll-max="1">1</td><td class="rd__th ve-col-10
          ">@race[Aasimar|XPHB]</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center " data-roll-min="2" data-roll-max="2">2</td><td
          class="rd__th ve-col-10 ">@race[Dragonborn|XPHB]</td></tr><tr><td
          class="rd__th ve-col-2 ve-text-center " data-roll-min="3"
          data-roll-max="3">3</td><td class="rd__th ve-col-10
          ">@race[Dwarf|XPHB]</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center " data-roll-min="4" data-roll-max="4">4</td><td
          class="rd__th ve-col-10 ">@race[Elf|XPHB]</td></tr><tr><td
          class="rd__th ve-col-2 ve-text-center " data-roll-min="5"
          data-roll-max="5">5</td><td class="rd__th ve-col-10
          ">@race[Gnome|XPHB]</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center " data-roll-min="6" data-roll-max="6">6</td><td
          class="rd__th ve-col-10 ">@race[Goliath|XPHB]</td></tr><tr><td
          class="rd__th ve-col-2 ve-text-center " data-roll-min="7"
          data-roll-max="7">7</td><td class="rd__th ve-col-10
          ">@race[Halfling|XPHB]</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center " data-roll-min="8" data-roll-max="8">8</td><td
          class="rd__th ve-col-10 ">@race[Human|XPHB]</td></tr><tr><td
          class="rd__th ve-col-2 ve-text-center " data-roll-min="9"
          data-roll-max="9">9</td><td class="rd__th ve-col-10
          ">@race[Orc|XPHB]</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center " data-roll-min="10" data-roll-max="10">10</td><td
          class="rd__th ve-col-10
          ">@race[Tiefling|XPHB]</td></tr></tbody></table><p>The reincarnated
          creature makes any choices that a species' description offers, and the
          creature recalls its former life. It retains the capabilities it had
          in its original form, except it loses the traits of its previous
          species and gains the traits of its new one.</p></div>
