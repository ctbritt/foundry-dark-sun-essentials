  - _id: LJZLd0urlnRtiXkC
    name: Etherealness
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '269'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You step into the border regions of
          the Ethereal Plane, where it overlaps with your current plane. You
          remain in the Border Ethereal for the duration. During this time, you
          can move in any direction. If you move up or down, every foot of
          movement costs an extra foot. You can perceive the plane you left,
          which looks gray, and you can't see anything there more than 60 feet
          away.</p><p>While on the Ethereal Plane, you can affect and be
          affected only by creatures, objects, and effects on that plane.
          Creatures that aren't on the Ethereal Plane can't perceive or interact
          with you unless a feature gives them the ability to do so.</p><p>When
          the spell ends, you return to the plane you left in the spot that
          corresponds to your space in the Border Ethereal. If you appear in an
          occupied space, you are shunted to the nearest unoccupied space and
          take Force damage equal to twice the number of feet you are
          moved.</p><p>This spell ends instantly if you cast it while you are on
          the Ethereal Plane or a plane that doesn't border it, such as one of
          the Outer Planes.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> You can target up to three
          willing creatures (including yourself) for each spell slot level above
          7. The creatures must be within 10 feet of you when you cast the
          spell.</p></div></div>
