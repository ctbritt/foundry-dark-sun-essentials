  - _id: cztUIZr5WIKjkTVp
    name: Animal Messenger
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '240'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A <a
          href="https://5e.tools/bestiary.html#blankhash,flstsize:t=1,flsttype:beast=1,flstmiscellaneous:swarm=2">Tiny
          Beast</a> of your choice that you can see within range must succeed on
          a Charisma saving throw, or it attempts to deliver a message for you
          (if the target's @variantrule[Challenge Rating|XPHB] isn't 0, it
          automatically succeeds). You specify a location you have visited and a
          recipient who matches a general description, such as "a person dressed
          in the uniform of the town guard" or "a red-haired dwarf wearing a
          pointed hat." You also communicate a message of up to twenty-five
          words. The Beast travels for the duration toward the specified
          location, covering about 25 miles per 24 hours or 50 miles if the
          Beast can fly.</p><p>When the Beast arrives, it delivers your message
          to the creature that you described, mimicking your communication. If
          the Beast doesn't reach its destination before the spell ends, the
          message is lost, and the Beast returns to where you cast the
          spell.</p></div><div class="rd__b  rd__b--3"><p></p><div
