  - _id: xoeDVyvqCXuIrWyj
    name: Conjure Fey
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '255'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You conjure a Medium spirit from the
          Feywild in an unoccupied space you can see within range. The spirit
          lasts for the duration, and it looks like a Fey creature of your
          choice. When the spirit appears, you can make one melee spell attack
          against a creature within 5 feet of it. On a hit, the target takes
          Psychic damage equal to 3d12 plus your spellcasting ability modifier,
          and the target has the &amp;Reference[condition=Frightened] condition
          until the start of your next turn, with both you and the spirit as the
          source of the fear.</p><p>As a @variantrule[Bonus Action|XPHB] on your
          later turns, you can teleport the spirit to an unoccupied space you
          can see within 30 feet of the space it left and make the attack
          against a creature within 5 feet of it.</p></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage increases by 1d12
          for each spell slot level above 6.</p></div></div>
