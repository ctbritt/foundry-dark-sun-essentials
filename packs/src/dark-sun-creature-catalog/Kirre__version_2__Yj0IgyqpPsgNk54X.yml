  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The kirre is one of the more vicious animals of the
        forests and jungles of Athas. Resembling a tiger in many ways, the kirre
        is a beast not to be trifled with.</p><p>At first glance, the kirre
        looks like a great cat, but upon closer examination, the differences
        quickly become clear. The kirre is eight feet in length and has eight
        legs, each ending in paws that sport very sharp claws. The kirre also
        has large horns on either sides of its head and a sharp barbed tail
        spike often used as a weapon. The mouth of the kirre is large and has
        sharp, canine teeth, which are used mostly for tearing food that has
        been killed. The kirre is a fur-covered animal with coloration similar
        to a tiger (both are striped). However, where a tiger are is striped in
        black and orange, the kirre is striped in brown and grey. This
        coloration is consistent all over the kirre's body, with the exception
        of its face, which is all grey.</p><p>Kirres are normally solitary
        creatures, until the approach of their mating season, at which time a
        male and female will join and produce offspring. Kirre litters number
        from three to five young. Kirres are mammals, and females produce milk
        for their young. Young kirres survive on milk for the first five months,
        at which point they begin to eat solid food such as small forest animals
        and other mammals.</p><p>Kirre are a favorite game of many hunting
        tribes of races who live in the forests of Athas. The meat from kirres
        is some of the finest on all of Athas, and many seek after it. Aside
        from a source of food, the kirre also has other uses when killed. The
        creature's horns can be cut off and used as spearheads; in some cases,
        they can be carved into ornate daggers. In addition, the tail of a kirre
        has a sharp, bone spike at its end that can be fashioned into either an
        arrowhead or a dart.</p>
