  details:
    biography:
      value: >-
        <p>The scourge of the Tablelands, kes'trekel are vile avian creatures
        that feast upon desert carrion. Although they are weak and cowardly in
        small groups, kes'trekel can become a devastating force in larger
        numbers.</p><p>Kes'trekel are fairly scrawny in appearance, with black
        plumage graying from the constant exposure. The only spot of appreciable
        color is found on the head, where the vivid crimson stands out like the
        blood it resembles. Standing barely a foot tall on short, taloned feet,
        kes'trekel are extremely vulnerable on the ground. In the air however,
        their 3-foot wing span is more than enough to carry it
        aloft.</p><p>Kes'trekel communicate among themselves through calls and
        guttural squawks. They make no attempt to learn other
        languages.</p><p>Wild kes'trekel are impossible to domesticate. Those
        hatched from stolen eggs make excellent watch birds. In such cases, the
        kes'trekels' cowardly nature loses out to their defensive nature. Many
        merchants rely on the squawked warnings of their avian sentinels. In
        Nibenay, kes'trekel eggs are considered a delicacy, provided the eggs
        are procured and eaten within two weeks of being laid. As expected, such
        versatility makes kes'trekel eggs an expensive
        commodity.</p><p>Kes'trekel detect prey with a dual combination of
        senses. The stench of death carries far across the blistering desert
        winds. Kes'trekel olfactory glands are more than adequate to pick up the
        scent. Once airborne, they depend on keen eyesight to locate their
        decaying meals. Some barbaric customs in the Ringing Mountains involve
        eating the eyes of recently dead kes'trekel to imbue the consumer with
        better vision. Such rituals are ineffective, but sometimes myth and
        tradition are stronger than logic.</p><p>Feral kes'trekel have a life
        span of approximately 15 years. Domestic kes'trekel sometimes live as
        long as 25 years.</p>
