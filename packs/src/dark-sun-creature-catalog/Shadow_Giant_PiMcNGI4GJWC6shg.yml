  details:
    biography:
      value: >-
        <p>Shadow giants, or shadow people as they prefer to call themselves,
        are the descendants of the halflings who served Rajaat the Warbringer
        during the Cleansing Wars.</p><p>They appear either as shadowy,
        two-dimensional, vaguely humanoid-shaped silhouettes with ropy limbs,
        serpentine torsos, and blue embers in place of eyes, or as solid,
        three-dimensional shadows as tall as half-giants. Bright light adds size
        and depth to a shadow giant.</p><p>The brighter the light source, the
        larger the shadow giant appears. In full sunlight a shadow giant can
        grow to 25 feet. The shadow people speak the ancient languages of Ur
        Draxa and the civilized halfling nations, and the common tongue of the
        Tyr region. When a shadow giant speaks, black fumes rise from a blue
        gash that opens where its mouth would normally be.</p>
