  - _id: XD7uUKvankJyvnGe
    name: Incite Madness
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>After a grisgol is killed, anyone
          examining the strips of scroll parchment or tome pages that comprise
          the creature's wrappings invokes a curse that renders the reader
          insane, unless he succeeds on a [[/save ability=wis dc=19]] saving
          throw. The victim of this insanity becomes convinced that the  
          thousands of scraps of parchment contain great and lost arcane
          secrets, and that he must discover these secrets by painstakingly
          fitting every last piece of ripped parchment and torn page back
          together in the right order. He dedicates every waking hour to this
          massive undertaking, barely pausing to eat or rest, in order to finish
          this task as fast as possible. The victim always thinks, and tries to
          convince others, that he is on the brink of a revelation. His personal
          study becomes cluttered with diagrams, charts, and plans extrapolating
          how the pieces might fit together, constantly rearranging them to fit
          current theories or hunches. The victim of the curse loses 1d4 point
          of Intelligence per day. Once it reach 0, the creature dies. The
          Intelligence cannot be restored while the curse is lasting. Only a
          heal spell or similarly powerful magic can relieve a victim of this
          curse, the Intelligence lost is then recovered after the victim finish
          a short or long rest. A victim dying of the curse can only be brought
          back to life with by a true resurrection or a wish spell.</p></div>
