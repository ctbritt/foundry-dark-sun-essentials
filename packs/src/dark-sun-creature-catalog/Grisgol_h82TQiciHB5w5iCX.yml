          @action[Disengage|XPHB], @action[Hide|XPHB], or @action[Utilize|XPHB]
          action.</p><p>When the spell ends, the target is
          &amp;Reference[condition=Incapacitated] and has a
          @variantrule[Speed|XPHB] of 0 until the end of its next turn, as a
          wave of lethargy washes over it.</p></div>
