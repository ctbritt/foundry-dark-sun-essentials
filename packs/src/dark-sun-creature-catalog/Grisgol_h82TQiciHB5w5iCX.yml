        value: >-
          <div class="rd__b  rd__b--3"><p>Choose a willing creature that you can
          see within range. Until the spell ends, the target's
          @variantrule[Speed|XPHB] is doubled, it gains a +2 bonus to
          @variantrule[Armor Class|XPHB], it has @variantrule[Advantage|XPHB] on
