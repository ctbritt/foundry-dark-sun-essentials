  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>A grisgol is a horrifying construct composed
        of broken and worn-out magic items, animated by a powerful spellcaster
        who has harnessed the spirit of a lich. Its skeleton is fabricated from
        old staffs and wands and its skin from expended scrolls wrapped about it
        like a mummy's burial cloth. Woven into this are rings, bracers,
        fragments of leather or chainmail, and the like. Inside the creature are
        scores of half-empty vials of potions, unguents, and oils, vaguely
        resembling sets of internal organs. It typically wears a rune-scribed
        cloak or robe. Pinpoints of red light glare from underneath a hood or
        old helmet. Nestled inside the construct, among miscellaneous junk, is
        the original lich's phylactery. Unless one knows what animates a
        grisgol, the phylactery appears as another piece of spent magic trash
        tossed loosely and randomly into the insides of the construct. From a
        distance, a grisgol appears to be a mummy, even moving with a similar
        stiff gait. When it walks, one can hear the tinkling of glass touching
        glass, the sloshing of half-filled vials and bottles, the squeaking of
        leather, the rubbing of wood and bone against each other, and, most
        prominently, the shuffl ing of paper as if pages of a tome were caught
        in a slight breeze. Thin tendrils of black smoke escape from cracks in
        its body. A grisgol leaves a sooty, oily residue upon whatever it
        touches. A grisgol is in every way a magic construct, possessing all
        traits native to golems in addition to the abilities of the lich that
        powers it. A grisgol's damaging and paralyzing touch attacks are the
        same as a lich and the construct retains a fraction of the original
        lich's spell-casting ability. A grisgol only casts the spells scribed by
        its creator on the scrolls and tome pages that make up its outer
        skin.</p><p>The spells a grisgol can cast are, however, restricted to
        the spell levels, domains, and specializations the lich (a 20th-level
        cleric, sorcerer, or wizard) could have cast. Destroying a grisgol does
        not destroy the lich that powers it. To kill the lich, its phylactery
        must be destroyed after the grisgol is destroyed. Otherwise, the lich is
        free to return in a physical form in 1d10 days. The escaped lich retains
        all the powers and abilities it had previous to its entrapment. The lich
        seeks vengeance upon whoever possesses its phylactery and the wizard,
        sorcerer, or cleric who originally entrapped it in the body of a
        grisgol. A grisgol stands 8 feet tall and weighs about 400 pounds. It
        knows all the languages known by the lich whose phylactery animates
        it.</p><p>Encounters</p><p>Grisgol are rare, even by golem standards.
        They are solitary construct that exist solely to serve the will of their
        master. Once this master has died it continues to fulfil his duty,
        oblivious of the pointless reason behind it. In the region of Raam,
        particularly ancient tombs are rumored to hold mysterious string of
        parchment, driving those reading them to madness and death. Other
        reports from adventurers tell the stories of strange mummies
        invulnerable to most of their known weaknesses.</p><p>Lich sometimes
        create grisgol as punishment for their rivals, hiding their phylactery
        in the construct and sending them to impossible and pointless mission.
        They are reveling in the knowledge that their enemy can do nothing but
        rage silently while his immortality is wasted away.</p>
