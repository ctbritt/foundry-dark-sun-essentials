          <div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Spell-Like Abilities" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Spell-Like Abilities.</span></span> A
          grisgol is created with the ability to use nine different spells as
          spell-like abilities (one each of levels 1 through 9th), each one once
          per day (spell DC <span class="rd__dc">17</span>, +9 to hit with spell
          attacks). These spells can vary based on the creator's whim, and are
          either cleric spells (if the animating lich was a templar) or
          sorcerer/wizard spells (if the animating lich was a sorcerer or
          wizard). Most creators choose simple spells, reasoning that the
          grisgol's lack of intelligence prevents it from using strategy. The
          golem has the following wizard spells prepared:</p><ul class="rd__list
          rd__list-hang-notitle"><li class="rd__li  rd__li-spell"><p>1/day each:
