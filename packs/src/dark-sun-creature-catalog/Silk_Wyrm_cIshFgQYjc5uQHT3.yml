  details:
    biography:
      value: >-
        <p>The silk wyrm is a snake with a hard, chitinous shell that measures
        over 50' in length. They are commonly seen flying through the air during
        the day searching for prey, but rarely attack until dusk, when they
        assume their shadow form and sneak into a camp to attack.</p><p>The silk
        wyrm will drag prey paralyzed by its venom away and encase it in a
        sheath of silk, inside which the unfortunate victim will linger for up
        to two weeks. During this time, the silk wyrm will occasionally stick
        its head into the protective cocoon and bite the victim's neck, draining
        a little bit of blood and further paralyzing him.</p>
      public: ''
