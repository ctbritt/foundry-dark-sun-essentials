          psychic power from your forehead at a creature that you can see within
          range. Alternatively, you can utter a creature's name. If the named
          target is within range, it becomes the spell's target even if you
          can't see it. If the named target isn't within range, the lance
          dissipates without effect.</p><p>The target must make an Intelligence
          saving throw. On a failed save, the target takes 7d6 damage and is
