          see within range. Creatures that have an Intelligence score of 2 or
          lower are unaffected.</p><p>Each target must make an Intelligence
          saving throw. On a failed save, a target takes 14d6 damage and is
          &amp;Reference[condition=stunned]. On a successful save, a target
