  details:
    alignment: Any Evil Alignment
    biography:
      value: >-
        <p>A deceptively frail, diminutive man, Kalak is balding, with wisps of
        gray hair about his temples. He is bitter in demeanor, his face etched
        with lines of hate. Kalak always wears purple robes, and a golden diadem
        around his head. </p><p>Kalak is the embodiment of evil and hatred.
        Wizened by thousands of years of life, he is both brilliant and mad.
        Should anyone be unfortunate enough to meet a displeased Kalak, it most
        likely will be the last meeting they ever have.</p>
