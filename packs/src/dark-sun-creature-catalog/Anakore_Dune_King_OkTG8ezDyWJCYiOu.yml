  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Sweltering Desert Travelers</p><p>who curse the blazing
        sun overhead might breathe a sigh of relief when the crimson orb sets,
        but their solace proves short lived as the shapes sliding beneath the
        dunes reveal themselves. When the sun dies away, the primitive,
        simple-minded anakores burst from the sands, eager to seize the prey
        they have stealthily tracked during the daylight
        hours.</p><p>Lore</p><p>Anakores live beneath loose dunes of dust or
        sand. They can sense vibrations of prey passing on the surface, and some
        anakores can smell blood spilled on the earth above. Only ravenous
        anakores attack prey during the day. Instead, they lurk beneath the
        sands and track promising game until sunset.</p><p>These nomadic
        creatures follow prey from place to place, seldom lairing in one
        location for long. They travel and hunt in small packs, and the most
        successful stalker among them is their leader. Anakores usually bring
        down as many kills as they can before retreating to feast. Each member
        of the pack has a role in the attack. Dune kings burst from the sand
        with great force, leading the attack and unsettling the terrain to
        provide the anakores with an advantage. Renders tear into the quarry
        savagely, weakening them before the kill. Hunters separate individual
        victims from the group, dragging them below the sand one by
        one.</p><p>While on the move, anakores subsist on roots, including
        poisonous specimens that aid in the production of the anakore paralytic.
        A telltale sign of recent anakore movement is an area filled with
        fallen, rootless plants. Occasionally, a particularly cunning dune king
        disposes of the foliage so as not to give away the pack's presence but
        this level of craftiness is rare. Little is known about the origins of
        the anakores. According to an ancient tale, terrors from beyond the sky
        touched the humanoids that were forebears of the creatures. Afterward,
        these ancestors recoiled from the burning sun and burrowed below the
        wastes to find cool, embracing darkness. Beneath the sands, the
        creatures dreamed dark reveries and became nightmares of the desert. No
        discernible characteristics distinguish anakores as male or female. It
        is whispered that the creatures produce no young, instead dragging
        selected victims to weird hollows under the sands. Inside these wombs,
        the captives become new anakores rather than meals. How and why the
        anakores choose particular individuals as their new kin is
        unknown.</p><p>Encounter</p><p>Anakores avoid battle on terrain in which
        they cannot burrow. They appear with others of their kind or with other
        burrowing creatures such as bulettes, hejkins, galeb duhrs and kruthiks.
        Wasteland raiders convince groups of anakores to work for them by paying
        the creatures with food and shiny baubles. Dreams and visions also
        entice anakores to explore ancient ruins where other aberrant creatures
        dwell, some of which are stronger and cleverer than even the dune kings.
        In such places, anakores serve these creatures and join in their
        incomprehensible rites. Anakores burrow under prey before rising to
        attack. Hunters emerge, grab targets, and use drag under to reduce the
        number of enemies they must face. Renders burst from the sands, stay
        among the prey topside, and lay targets low to make them more vulnerable
        to allied attacks. A dune king launches into battle with sand eruption
        and uses its toxic claws to prevent the quarry from escaping. When
        caught in poor tactical situations, anakores flee or deal peacefully
        (but grudgingly) with enemies.</p><p>Info</p><p>A geyser of sand and a
        scream of raw hunger signal an attack by a dune king leading a band of
        its lesser kin. Anakore dune kings are as nimble above the sand as they
        are beneath it.</p>
