  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Tembos are vestiges from the cleansing wars</p><p>The
        Champions created these merciless predators to aid in their genocidal
        struggle. Tembos were designed to sniffout and snatch those most loved
        by their masters' opponents. Tembos survived even after war or old age
        claimed their creators, and they are universally hated across the Tyr
        Region.</p><p>Lore</p><p>Nothing ends a disagreement in a Tyrian
        settlement as quickly as the rumor of a tembo approaching. Everyone,
        regardless of race, culture, or prejudices, despises tembos. A real-life
        bogeyman, the tembo creeps under the blanket of night to steal away the
        beloved-brides and beaus, mothers and brothers. Even animal companions
        have been taken. A tembo kills for food and pleasure. Though intelligent
        and capable of speech, it shows no remorse, and its chilling laughter
        echoes through the soul.</p><p>The tembo is a savage predator that will
        eat anything, but it prefers the children of sentient races. Tembos base
        themselves in a lair or den and hunt in packs throughout the surrounding
        wilderness. They have also been known to inhabit the ruins that lie
        beneath many of the large cities of the Tablelands. In addition to their
        physical speed and Strength, tembos also boast psionic powers and the
        ability to drain the life energy of their victims. Few are those souls
        that can brave and endure a den of tembos.</p><p>Encounters</p><p>Many
        tembos roam the western wastelands, but a few have been sighted as far
        away as Draj and Balic. Sometimes, tembos gather in small packs for days
        at a time. Lacking cohesion and a pecking order, the packs dissolve
        quickly. A tembo prefers to be alone. Only Athas's most vile souls seem
        able to stomach using tembos as servants.</p><p>Info</p><p>Caprice rules
        a tembo. In one village, the dark beast might infiltrate a settlement,
        letting its deadly aura thin the population as it blends into the
        shadows. In another, the same tembo might spring at a passerby in a
        flurry of claws and fangs. It is fierce and quick and nearly impossible
        to catch. Townsfolk swear the creature fades away as soon as fighters
        attack.</p>
      public: ''
