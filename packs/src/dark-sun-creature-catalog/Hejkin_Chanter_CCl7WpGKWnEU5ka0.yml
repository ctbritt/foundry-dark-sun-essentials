  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The rampant misuse of arcane power</p><p>not only
        altered Athas's environs, it also birthed numerous abominations. Among
        these monsters are the burrowing humanoids called hejkins. Hejkins are
        cursed to see beyond the world into a heaving, squirming space filled
        with nightmares. They draw power from this place and from the twisted
        primal spirits of the blasted Athasian land. These diminutive creatures
        might appear to be crazed monsters, but they have a rudimentary culture.
        They revere the earth and its dark spirits as terrifying and callous
        forces that nonetheless supply life. Their connection to the earth gives
        hejkins a hatred of creatures that misuse arcane magic or carve into the
        earth. They murder spellcasters and miners with glee, taking meat,
        supplies, and other spoils to their hidden abodes. No creature is safe
        from the cook fires of hejkins, even other hejkins. The creatures also
        covet treasure. As long as they don't have to scar the earth to acquire
        their spoils, they collect gems and gold.</p><p>Lore</p><p>Hejkins are
        deformed in both body and mind. They gibber and behave erratically,
        occasionally engaging in elaborate alien rites to unnamable spirits.
        They prefer to raid at night and return to their caverns during the day.
        Hejkins make their homes in natural caverns, choosing those with an
        existing water supply. They do not shape earth or stone. The only marks
        the hejkins leave are strange, charged runes on cave walls. These runes
        hold power that can harm the unwary or drive the sane to
        madness.</p><p>Hunger or bloodlust draws hejkins from their caverns.
        Astronomical events, such as a comet's appearance in the sky, can drive
        hejkin tribes into a frenzy. During these times, they are found in
        nearly any kind of environment, murdering and plundering.</p><p>Master
        glyphs</p><p>Hejkin serve unknown entities that drives them insane,
        during a crisis or a particularly intense twisted rite the hejkins
        scribble glyphs on the rock, granting magical powers to the ugly symbol.
        Most of these glyphs merely duplicate the effect of a glyph of warding
        spell. Each glyph is a unique glyph with specific effects. Master glyphs
        affect a creature upon its initial entry into the glyph's range.
        Beneficial glyphs apply their effects immediately. Hostile glyphs
        typically grant a saving throw to negate or reduce their effects; in
        this case, a creature need only make the save upon entering the glyph's
        range. The effect of a glyph ends immediately after a creature leaves
        the glyph's area of effect, but the creature must make a new saving
        throw immediately upon reentering the glyph's range. The effects of
        multiple glyphs do not stack. In a case where more than one glyph would
        have an effect on a specific area, the glyph with the highest spell
        level suppresses the other glyphs. In the case of multiple glyphs of the
        same spell level overlapping, the most recently created glyph suppresses
        the older glyphs.</p><p>Glyph of Enfeeblement: All nonaberration within
        20 feet of this glyph are weakened and debilitated, and deal only half
        damage with weapon attacks that use Strength. The effect of this glyph
        persists for 1 minute after a creature exits the area of effect. A
        successful DC 13 Wisdom saving throw negates the effect
        completely.</p><p>Glyph of Twisted Reality: Squirming, ebony tentacles
        fill a 20-foot square on ground and walls around the glyph. These
        tentacles turn the ground in the area into difficult terrain. When a
        creature enters the affected area for the first time on a turn or starts
        its turn there, the creature must succeed on a DC 14 Dexterity saving
        throw or take 3d6 bludgeoning damage and be restrained by the tentacles.
        A creature that starts its turn in the area and is already restrained by
        the tentacles takes 3d6 bludgeoning damage. A creature restrained by the
        tentacles can use its action to make a Strength or Dexterity check (its
        choice) against a DC 14. On a success, it frees itself.</p><p>Glyph of
        Torment All nonaberration within 30 feet of this glyph become nervous
        and unsure of their abilities. These creatures have disadvantages on
        saving throws. This effect cannot be resisted with a saving
        throw.</p><p>Glyph of Madness: All creatures within 30 feet of this
        glyph hear the raving of mad voices in their mind, all nonaberration
        within range must succeed on a DC 14 Wisdom saving throw or become
        charmed for the duration. While a creature is charmed in this way, a
        madness glows in its eyes. The charmed creature must use its action
        before moving on each of its turns to make a melee attack against a
        creature other than itself. The target can act normally on its turn if
        you choose no creature or if none are within its reach. An affected
        creature can retake the Wisdom saving throw at the end of each of its
        turns. On a success, it's free from the glyph's influence until it
        enters the area of effect again.</p><p>Glyph of the Deep Curse: Within
        30 feet of this glyph, any nonaberration must succeed on a DC 14
        Constitution saving throw or become diseased. The disease has no effect
        for one minute and can be removed by any magic that cures disease. After
        1 minute, the diseased creature's skin becomes grey, slimy, and skin
        lesion start to appear. The creature can't regain hit points unless it
        is underground, and the disease can be removed only by heal or another
        disease-curing spell of 6th level or higher. When the creature is
        outside in the open, it takes 6 (1d12) acid damage every 10
        minutes.</p><p>Encounters</p><p>Hejkin tribes or patrols might be
        encountered in any subterranean setting. At times, they ally with beasts
        and wicked earth creatures, especially those that burrow. They have an
        affinity for insects and similar creatures, such as kruthiks and
        ankhegs. Fell taints and other aberrant creatures sometimes join hejkin
        tribes and are occasionally the subject of their
        worship.</p><p>Info</p><p>The demented eyes of a hejkin chanter pulse in
        time to the creature's babbled songs. Although most of the words are
        unintelligible, a few chilling phrases sometimes break through the
        madness.</p>
