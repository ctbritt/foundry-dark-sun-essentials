          duration, these tentacles turn the ground in that area into
          @variantrule[Difficult Terrain|XPHB].</p><p>Each creature in that area
          makes a Strength saving throw. On a failed save, it takes 3d6 damage,
          and it has the &amp;Reference[condition=Restrained] condition until
          the spell ends. A creature also makes that save if it enters the area
          or ends it turn there. A creature makes that save only once per
          turn.</p><p>A &amp;Reference[condition=Restrained] creature can take
          an action to make a Strength (&amp;Reference[skill=Athletics]) check
          against your spell save DC, ending the condition on itself on a
          success.</p></div>
