  details:
    biography:
      value: >-
        <p>Kanks are large docile insects often used as caravan mounts, as they
        can travel for a full day at their top speed, carrying a
        two-hundred-pound passenger and two-hundred pounds of cargo. They also
        make decent herd animals and are especially valued by elves. Because
        they can digest nearly any sort of organic matter, these hardy beasts
        will thrive in almost any environment. In addition, they require little
        attention, for a kank hive instinctively organizes itself into food
        producers, soldiers, and brood queens.</p><p>The food producers secrete
        melon-sized globules of green honey that they store on their abdomens to
        feed the young and when food is scarce, the rest of the hive. Humans and
        demihumans can live on this nectar alone for periods of up to three
        weeks but must supplement their diets with meat and/or vegetation after
        longer periods. The sweet taste of this nectar makes it very valuable,
        and it is this that has caused the kank to be domesticated. It should be
        noted that wild kanks produce far fewer globules than their carefully
        breed cousins.</p><p>Although predators may attack kanks for the food
        producers' honey globules, only the foulest carrion eaters will eat kank
        flesh. As soon as a kank dies, its meat emits a foul-smelling odor that
        not even a starving man can stomach.</p><div
        data-roll-name-ancestor="Kank, Brood Queen" class="rd__b  rd__b--0"><h1
        class="rd__h rd__h--0" data-title-index="1"> <span
        class="entry-title-inner">Kank, Brood Queen</span></h1> <p>The Kank
        Brood Queens are completely non-violent, they use the same stats as a
        Kank Drone but typically don't attack, even to defend
        themselves.</p></div>
