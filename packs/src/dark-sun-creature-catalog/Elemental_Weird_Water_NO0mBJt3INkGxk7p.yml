          ve-text-center ">5</td><td class="rd__th ve-col-10
          ">Cold</td></tr><tr><td class="rd__th ve-col-2 ve-text-center
          ">6</td><td class="rd__th ve-col-10
          ">Freezing</td></tr></tbody></table><table class="w-100 rd__table 
          stripe-odd-table"
          data-roll-name-ancestor="Wind"><caption>Wind</caption><thead><tr><th
          class="rd__th ve-col-2 ve-text-center "
          data-rd-isroller="false">Stage</th><th class="rd__th ve-col-10 "
          data-rd-isroller="false">Condition</th></tr></thead><tbody><tr><td
          class="rd__th ve-col-2 ve-text-center ">1</td><td class="rd__th
          ve-col-10 ">Calm</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center ">2</td><td class="rd__th ve-col-10 ">Moderate
          wind</td></tr><tr><td class="rd__th ve-col-2 ve-text-center
          ">3</td><td class="rd__th ve-col-10 ">Strong wind</td></tr><tr><td
          class="rd__th ve-col-2 ve-text-center ">4</td><td class="rd__th
