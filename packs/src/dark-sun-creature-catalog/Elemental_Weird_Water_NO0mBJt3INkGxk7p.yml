      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You give a verbal command to a
          creature that you can see within range, ordering it to carry out some
          service or refrain from an action or a course of activity as you
          decide. The target must succeed on a Wisdom saving throw or have the
          &amp;Reference[condition=Charmed] condition for the duration. The
          target automatically succeeds if it can't understand your
          command.</p><p>While &amp;Reference[condition=Charmed], the creature
          takes 5d10 damage if it acts in a manner directly counter to your
          command. It takes this damage no more than once each day.</p><p>You
          can issue any command you choose, short of an activity that would
          result in certain death. Should you issue a suicidal command, the
          spell ends.</p><p>A @spell[Remove Curse|XPHB], @spell[Greater
          Restoration|XPHB], or @spell[Wish|XPHB] spell ends this
          spell.</p></div><div class="rd__b  rd__b--3"><p></p><div
