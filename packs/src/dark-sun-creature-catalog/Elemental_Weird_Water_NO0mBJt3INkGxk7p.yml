        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You do one of the following:</p><ul
          class="rd__list rd__list-hang-notitle"><li class="rd__li "><p
          class="rd__p-list-item" data-roll-name-ancestor="Create Water"><span
          class="bold rd__list-item-name">Create Water.</span> You create up to
          10 gallons of clean water within range in an open container.
          Alternatively, the water falls as rain in a 30-foot @variantrule[Cube
          [Area of Effect]|XPHB|Cube] within range, extinguishing exposed flames
          there.</p></li><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Destroy Water"><span class="bold
          rd__list-item-name">Destroy Water.</span> You destroy up to 10 gallons
          of water in an open container within range. Alternatively, you destroy
          fog in a 30-foot @variantrule[Cube [Area of Effect]|XPHB|Cube] within
          range.</p></li></ul></div><div class="rd__b  rd__b--3"><p></p><div
