    name: Control Weather
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '257'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You take control of the weather within
          5 miles of you for the duration. You must be outdoors to cast this
          spell, and it ends early if you go indoors.</p><p>When you cast the
          spell, you change the current weather conditions, which are determined
          by the DM. You can change precipitation, temperature, and wind. It
          takes 1d4 × 10 minutes for the new conditions to take effect. Once
          they do so, you can change the conditions again. When the spell ends,
          the weather gradually returns to normal.</p><p>When you change the
          weather conditions, find a current condition on the following tables
          and change its stage by one, up or down. When changing the wind, you
          can change its direction.</p><table class="w-100 rd__table 
          stripe-odd-table"
          data-roll-name-ancestor="Precipitation"><caption>Precipitation</caption><thead><tr><th
          class="rd__th ve-col-2 ve-text-center "
          data-rd-isroller="false">Stage</th><th class="rd__th ve-col-10 "
          data-rd-isroller="false">Condition</th></tr></thead><tbody><tr><td
          class="rd__th ve-col-2 ve-text-center ">1</td><td class="rd__th
          ve-col-10 ">Clear</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center ">2</td><td class="rd__th ve-col-10 ">Light
          clouds</td></tr><tr><td class="rd__th ve-col-2 ve-text-center
          ">3</td><td class="rd__th ve-col-10 ">Overcast or ground
          fog</td></tr><tr><td class="rd__th ve-col-2 ve-text-center ">4</td><td
          class="rd__th ve-col-10 ">Rain, hail, or snow</td></tr><tr><td
          class="rd__th ve-col-2 ve-text-center ">5</td><td class="rd__th
          ve-col-10 ">Torrential rain, driving hail, or
          blizzard</td></tr></tbody></table><table class="w-100 rd__table 
          stripe-odd-table"
          data-roll-name-ancestor="Temperature"><caption>Temperature</caption><thead><tr><th
          class="rd__th ve-col-2 ve-text-center "
          data-rd-isroller="false">Stage</th><th class="rd__th ve-col-10 "
