    name: Minor Illusion
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '298'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create a sound or an image of an
          object within range that lasts for the duration. See the descriptions
          below for the effects of each. The illusion ends if you cast this
          spell again.</p><p>If a creature takes a @action[Study|XPHB] action to
          examine the sound or image, the creature can determine that it is an
          illusion with a successful Intelligence
          (&amp;Reference[skill=Investigation]) check against your spell save
          DC. If a creature discerns the illusion for what it is, the illusion
          becomes faint to the creature.</p><div data-roll-name-ancestor="Sound"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span
          class="entry-title-inner">Sound.</span></span> If you create a sound,
          its volume can range from a whisper to a scream. It can be your voice,
          someone else's voice, a lion's roar, a beating of drums, or any other
          sound you choose. The sound continues unabated throughout the
          duration, or you can make discrete sounds at different times before
          the spell ends.</p></div><div data-roll-name-ancestor="Image"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="2"> <span
          class="entry-title-inner">Image.</span></span> If you create an image
          of an object—such as a chair, muddy footprints, or a small chest—it
          must be no larger than a 5-foot @variantrule[Cube [Area of
          Effect]|XPHB|Cube]. The image can't create sound, light, smell, or any
          other sensory effect. Physical interaction with the image reveals it
          to be an illusion, since things can pass through it.</p></div></div>
