  - _id: q16zfgGFIbfUX6pN
    name: Flesh to Stone
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '275'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You attempt to turn one creature that
          you can see within range into stone. The target makes a Constitution
          saving throw. On a failed save, it has the
          &amp;Reference[condition=Restrained] condition for the duration. On a
          successful save, its @variantrule[Speed|XPHB] is 0 until the start of
          your next turn. Constructs automatically succeed on the save.</p><p>A
          &amp;Reference[condition=Restrained] target makes another Constitution
          saving throw at the end of each of its turns. If it successfully saves
          against this spell three times, the spell ends. If it fails its saves
          three times, it is turned to stone and has the
          &amp;Reference[condition=Petrified] condition for the duration. The
          successes and failures needn't be consecutive; keep track of both
          until the target collects three of a kind.</p><p>If you maintain your
          @status[Concentration|XPHB] on this spell for the entire possible
          duration, the target is &amp;Reference[condition=Petrified] until the
          condition is ended by @spell[Greater Restoration|XPHB] or similar
          magic.</p></div>
