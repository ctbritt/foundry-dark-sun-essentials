  - _id: OAH42moyf7nzN4jh
    name: Symbol
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '329'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You inscribe a harmful glyph either on
          a surface (such as a section of floor or wall) or within an object
          that can be closed (such as a book or chest). The glyph can cover an
          area no larger than 10 feet in diameter. If you choose an object, it
          must remain in place; if it is moved more than 10 feet from where you
          cast this spell, the glyph is broken, and the spell ends without being
          triggered.</p><p>The glyph is nearly imperceptible and requires a
          successful Wisdom (&amp;Reference[skill=Perception]) check against
          your spell save DC to notice.</p><p>When you inscribe the glyph, you
          set its trigger and choose which effect the symbol bears: Death,
          Discord, Fear, Pain, Sleep, or Stunning. Each one is explained
          below.</p><div data-roll-name-ancestor="Set the Trigger" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Set the Trigger.</span></span> You decide
          what triggers the glyph when you cast the spell. For glyphs inscribed
          on a surface, common triggers include touching or stepping on the
          glyph, removing another object covering it, or approaching within a
          certain distance of it. For glyphs inscribed within an object, common
          triggers include opening that object or seeing the glyph.</p><p>You
          can refine the trigger so that only creatures of certain types
          activate it (for example, the glyph could be set to affect
          Aberrations). You can also set conditions for creatures that don't
          trigger the glyph, such as those who say a certain
          password.</p><p>Once triggered, the glyph glows, filling a
          60-foot-radius @variantrule[Sphere [Area of Effect]|XPHB|Sphere] with
          @variantrule[Dim Light|XPHB] for 10 minutes, after which time the
          spell ends. Each creature in the @variantrule[Sphere [Area of
          Effect]|XPHB|Sphere] when the glyph activates is targeted by its
          effect, as is a creature that enters the @variantrule[Sphere [Area of
          Effect]|XPHB|Sphere] for the first time on a turn or ends its turn
          there. A creature is targeted only once per turn.</p></div><div
          data-roll-name-ancestor="Death" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="2"> <span
          class="entry-title-inner">Death.</span></span> Each target makes a
          Constitution saving throw, taking 10d10 damage on a failed save or
          half as much damage on a successful save.</p></div><div
          data-roll-name-ancestor="Discord" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="3"> <span
          class="entry-title-inner">Discord.</span></span> Each target makes a
          Wisdom saving throw. On a failed save, a target argues with other
          creatures for 1 minute. During this time, it is incapable of
          meaningful communication and has @variantrule[Disadvantage|XPHB] on
          attack rolls and ability checks.</p></div><div
          data-roll-name-ancestor="Fear" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="4"> <span
          class="entry-title-inner">Fear.</span></span> Each target must succeed
          on a Wisdom saving throw or have the
          &amp;Reference[condition=Frightened] condition for 1 minute. While
          &amp;Reference[condition=Frightened], the target must move at least 30
          feet away from the glyph on each of its turns, if able.</p></div><div
          data-roll-name-ancestor="Pain" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="5"> <span
          class="entry-title-inner">Pain.</span></span> Each target must succeed
          on a Constitution saving throw or have the
          &amp;Reference[condition=Incapacitated] condition for 1
          minute.</p></div><div data-roll-name-ancestor="Sleep" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="6"> <span
          class="entry-title-inner">Sleep.</span></span> Each target must
          succeed on a Wisdom saving throw or have the
          &amp;Reference[condition=Unconscious] condition for 10 minutes. A
          creature awakens if it takes damage or if someone takes an action to
          shake it awake.</p></div><div data-roll-name-ancestor="Stunning"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="7"> <span
          class="entry-title-inner">Stunning.</span></span> Each target must
          succeed on a Wisdom saving throw or have the
          &amp;Reference[condition=Stunned] condition for 1
          minute.</p></div></div>
        chat: ''
      level: 7
      school: abj
