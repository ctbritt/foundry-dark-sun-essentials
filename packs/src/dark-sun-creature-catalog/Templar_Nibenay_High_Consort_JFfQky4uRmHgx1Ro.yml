      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>An immobile, shimmering barrier
          appears in a 10-foot @variantrule[Emanation [Area of
          Effect]|XPHB|Emanation] around you and remains for the
          duration.</p><p>Any spell of level 5 or lower cast from outside the
          barrier can't affect anything within it. Such a spell can target
          creatures and objects within the barrier, but the spell has no effect
          on them. Similarly, the area within the barrier is excluded from areas
          of effect created by such spells.</p></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
