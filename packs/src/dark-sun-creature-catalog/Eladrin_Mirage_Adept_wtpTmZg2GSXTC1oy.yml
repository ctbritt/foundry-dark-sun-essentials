  - _id: ipaM195nwWzOR6ym
    name: Prismatic Spray
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '307'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Eight rays of light flash from you in
          a 60-foot @variantrule[Cone [Area of Effect]|XPHB|Cone]. Each creature
          in the @variantrule[Cone [Area of Effect]|XPHB|Cone] makes a Dexterity
          saving throw. For each target, roll 1d8 to determine which color ray
          affects it, consulting the Prismatic Rays table.</p><table
          class="w-100 rd__table  stripe-odd-table"
          data-roll-name-ancestor="Prismatic Rays"><caption>Prismatic
          Rays</caption><thead><tr><th class="rd__th ve-col-2 ve-text-center "
          data-rd-isroller="true">1d8</th><th class="rd__th ve-col-10 "
          data-rd-isroller="false">Ray</th></tr></thead><tbody><tr><td
          class="rd__th ve-col-2 ve-text-center " data-roll-min="1"
          data-roll-max="1">1</td><td class="rd__th ve-col-10 "><b>Red.</b>
          <i>Failed Save:</i> 12d6 damage. <i>Successful Save:</i> Half as much
          damage.</td></tr><tr><td class="rd__th ve-col-2 ve-text-center "
          data-roll-min="2" data-roll-max="2">2</td><td class="rd__th ve-col-10
          "><b>Orange.</b> <i>Failed Save:</i> 12d6 damage. <i>Successful
          Save:</i> Half as much damage.</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center " data-roll-min="3" data-roll-max="3">3</td><td
          class="rd__th ve-col-10 "><b>Yellow.</b> <i>Failed Save:</i> 12d6
          damage. <i>Successful Save:</i> Half as much damage.</td></tr><tr><td
          class="rd__th ve-col-2 ve-text-center " data-roll-min="4"
          data-roll-max="4">4</td><td class="rd__th ve-col-10 "><b>Green.</b>
          <i>Failed Save:</i> 12d6 damage. <i>Successful Save:</i> Half as much
          damage.</td></tr><tr><td class="rd__th ve-col-2 ve-text-center "
          data-roll-min="5" data-roll-max="5">5</td><td class="rd__th ve-col-10
          "><b>Blue.</b> <i>Failed Save:</i> 12d6 damage. <i>Successful
          Save:</i> Half as much damage.</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center " data-roll-min="6" data-roll-max="6">6</td><td
          class="rd__th ve-col-10 "><b>Indigo.</b> <i>Failed Save:</i> The
          target has the &amp;Reference[condition=Restrained] condition and
          makes a Constitution saving throw at the end of each of its turns. If
          it successfully saves three times, the condition ends. If it fails
          three times, it has the &amp;Reference[condition=Petrified] condition
          until it is freed by an effect like the @spell[Greater
          Restoration|XPHB] spell. The successes and failures needn't be
          consecutive; keep track of both until the target collects three of a
          kind.</td></tr><tr><td class="rd__th ve-col-2 ve-text-center "
          data-roll-min="7" data-roll-max="7">7</td><td class="rd__th ve-col-10
          "><b>Violet.</b> <i>Failed Save:</i> The target has the
          &amp;Reference[condition=Blinded] condition and makes a Wisdom saving
          throw at the start of your next turn. On a successful save, the
          condition ends. On a failed save, the condition ends, and the creature
          teleports to another plane of existence (DM's
          choice).</td></tr><tr><td class="rd__th ve-col-2 ve-text-center "
          data-roll-min="8" data-roll-max="8">8</td><td class="rd__th ve-col-10
          "><b>Special.</b> The target is struck by two rays. Roll twice,
          rerolling any 8.</td></tr></tbody></table></div>
