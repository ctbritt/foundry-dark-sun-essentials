  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>A mysterious, vanishing people</p><p>who now cling to a
        handful of crumbling palaces in the Lands Within the Wind, eladrin are
        rare in the cities and villages of Athas. They guard the few remaining
        passages between the world and their realm, bewitching or slaying
        travelers who wander too close to their ancient
        places.</p><p>Lore</p><p>Great eladrin realms once spanned the Lands
        Within the Wind, but over the centuries the fey otherworld has slowly
        receded, consumed by the defiling magic that ravaged Athas. As their
        world died, the fey kingdoms fell into ruin. The eladrin now inhabit a
        handful of palaces and castles, a small remnant of their former numbers.
        They guard the hidden doors to their diminished realm with illusions and
        mazes of psionic enchantment.</p><p>A rare few eladrin, twisted by the
        slow death of their realm, have become so hate· filled that they
        sacrifice themselves for the opportunity to hunt those they blame for
        their home's destruction. These windwalkers allow their essence to
        slowly bleed into the Lands Within the Wind in exchange for infusion
        with the energy of that plane. They haunt the trade ways near eladrin
        lands, slaying every humanoid they can catch unprotected. During their
        final years of existence, windwalkers fade to ghostlike, semisolid
        embodiments of murderous hatred.</p><p>Encounters</p><p>Eladrin have
        little in common with their elf cousins, but both races recognize their
        old kinship and honor it. Eladrin emissaries might travel with elf
        tribes for a time to spy on the deserts and cities of Athas. More
        vicious eladrin, especially windwalkers, occasionally throw in with
        bandits or other violent humanoids dwelling at the edges of their
        territory.</p><p>Info</p><p>The wavering mirages and blowing winds open
        like a curtain, and the mirage adepts step through behind the veiled
        warriors. Around them, reality ripples and shifts. Mirage adepts are
        powerful psions who use illusion to hide eladrin ruins and outposts from
        the sorcerer-kings' spies. They prefer to fight at a distance,
        retreating to defensible positions behind allies.</p>
      public: ''
