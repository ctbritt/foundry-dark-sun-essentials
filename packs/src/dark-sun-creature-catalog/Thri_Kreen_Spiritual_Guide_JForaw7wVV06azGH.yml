  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The itinerant thri-kheen are fierce warriors</p><p>and
        pragmatic hunters. They form deep bonds to their birth clutch and
        caregivers. Each thri-kreen accepts its place among its clutch mates and
        the greater pack. The primal instinct runs deep, linking the race to its
        ancestral history and the spirit world.</p><p>Lore</p><p>The thri-kreen
        wander the deserts and savannas of the Athas, avoiding all other races.
        Thri-kreen employ a language without words. To show emotion and
        reaction, a thri-kreen clacks its mandibles and waves its antennae,
        giving other thri-kreen a sense of what it is thinking and feeling.
        Other creatures find this manner of communication difficult to interpret
        and impossible to duplicate. When forced to interact with creatures of
        other intelligent species, thri-kreen employ alternative methods of
        communication, such as drawing pictures in sand or making pictures out
        of twigs or blades of grass.</p><p>Thri-kreen experience the full range
        of emotions but aren't as prone to emotional outbursts as humans.
        Thri-kreen with psionic ability often demonstrate a wider range of
        emotions, particularly if they live near or interact with humans or
        other highly emotional creatures.</p><p>Thri-kreen consider all other
        living creatures as potential nourishment, and they love the taste of
        elf flesh in particular. If a creature might be useful for something
        other than food, the thrikreen aren't likely to attack it on sight.
        Thri-kreen kill to survive, never for sport.</p><p>Thri-kreen don't
        require sleep and can rest while remaining alert and performing light
        tasks. Their inability to sleep is thought to be the reason why
        thrikreen have such short lifespans, the average thri-kreen life
        expectancy being only thirty years.</p><p>Thri-kreen bond with their
        clutch mates and greater pack. This cohesion amplifies their hunting and
        fighting prowess. Thri-kreen prefer to hunt nonsentient creatures, but
        they make exceptions in desperate times. They do not fight for
        vengeance; rather, they safeguard their freedom and attack only when
        threatened. Thri-kreen who stray from this norm are often under the
        influence of malevolent creatures or spirits.</p><p>Shamanistic desert
        talkers lead the thri-kreen in rituals to connect with ancestral
        spirits. Each thri-kreen taps into the race's memory. Some ancient
        memories reveal that the thri-kreen once held a powerful empire of their
        own.</p><p>Encounters</p><p>Thri-kreen packs roam the wilds. For
        centuries, slavers have trailed thri-kreen and stolen eggs. Newborn
        thri-kreen fetch a high price because they'll bond with their primary
        caregiver and clutch mates, regardless of race. Generations of
        thri-kreen have been integrated into city-states in this
        way.</p><p>Info</p><p>The thri-kreen religious life is centered on the
        harmony of the clutch with its environment. As such they respect life
        and never hunt or sport or considerer a life worthless. Spirit Guide
        will often lead a tribe of thri-kreen or become the keeper of places
        they consider sacred, such as oasis, mudflat or a portion of the desert.
        As most druid they will send warning sign of their presence to those
        crossing their territory, informing them that this land is under their
        protection and that every abuse will be severely punished. When facing
        danger the spirit guide will use his animal allies to protect his
        brethren and buff himself before changing into the most appropriate
        elemental form.</p>
