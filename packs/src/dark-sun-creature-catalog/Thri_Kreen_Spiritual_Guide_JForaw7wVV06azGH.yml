  - _id: jreHWFoCSnSoJHrT
    name: Druidcraft
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '266'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Whispering to the spirits of nature,
          you create one of the following effects within range.</p><div
          data-roll-name-ancestor="Weather Sensor" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Weather Sensor.</span></span> You create a
          Tiny, harmless sensory effect that predicts what the weather will be
          at your location for the next 24 hours. The effect might manifest as a
          golden orb for clear skies, a cloud for rain, falling snowflakes for
          snow, and so on. This effect persists for 1 round.</p></div><div
          data-roll-name-ancestor="Bloom" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="2"> <span
          class="entry-title-inner">Bloom.</span></span> You instantly make a
          flower blossom, a seed pod open, or a leaf bud bloom.</p></div><div
          data-roll-name-ancestor="Sensory Effect" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="3"> <span
          class="entry-title-inner">Sensory Effect.</span></span> You create a
          harmless sensory effect, such as falling leaves, spectral dancing
          fairies, a gentle breeze, the sound of an animal, or the faint odor of
          skunk. The effect must fit in a 5-foot @variantrule[Cube [Area of
          Effect]|XPHB|Cube].</p></div><div data-roll-name-ancestor="Fire Play"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="4"> <span class="entry-title-inner">Fire
          Play.</span></span> You light or snuff out a candle, a torch, or a
          campfire.</p></div></div>
