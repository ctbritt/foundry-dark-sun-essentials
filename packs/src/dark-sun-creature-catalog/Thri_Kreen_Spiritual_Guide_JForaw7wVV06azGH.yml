      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>One Humanoid you can see within range
          makes a Wisdom saving throw. It does so with
          @variantrule[Advantage|XPHB] if you or your allies are fighting it. On
          a failed save, the target has the &amp;Reference[condition=Charmed]
          condition until the spell ends or until you or your allies damage it.
          The &amp;Reference[condition=Charmed] creature is
          @variantrule[Friendly [Attitude]|XPHB|Friendly] to you. When the spell
          ends, the target knows it was &amp;Reference[condition=Charmed] by
          you.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> You can target one additional
          creature for each spell slot level above 1.</p></div></div>
