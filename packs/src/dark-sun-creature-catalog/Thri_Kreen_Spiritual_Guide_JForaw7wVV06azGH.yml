        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The thri-kreen magically polymorphs
          into an air, earth, fire or water elemental of its choice as a bonus
          action, remaining in that form for up to 7 hours. It can revert to its
          true form as a bonus action. While transformed the attacks of his
          shape count as magical to bypass damage resistances and immunities.
          The druid can expend a spell slot as a bonus action to heal 1d8 hit
          point per spell slot level. The druid cannot cast spell in this shape
          but can maintain his concentration on already active ones. Any
          equipment it is wearing or carrying meld in its shape. It reverts to
          its true form if it dies.</p></div>
