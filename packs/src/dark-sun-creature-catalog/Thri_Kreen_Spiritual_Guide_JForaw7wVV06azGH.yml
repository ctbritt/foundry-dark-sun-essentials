  - _id: VmupRRL4vpQXRTfW
    name: Wall of Thorns
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '339'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create a wall of tangled brush
          bristling with needle-sharp thorns. The wall appears within range on a
          solid surface and lasts for the duration. You choose to make the wall
          up to 60 feet long, 10 feet high, and 5 feet thick or a circle that
          has a 20-foot diameter and is up to 20 feet high and 5 feet thick. The
          wall blocks line of sight.</p><p>When the wall appears, each creature
          in its area makes a Dexterity saving throw, taking 7d8 damage on a
          failed save or half as much damage on a successful one.</p><p>A
          creature can move through the wall, albeit slowly and painfully. For
          every 1 foot a creature moves through the wall, it must spend 4 feet
          of movement. Furthermore, the first time a creature enters a space in
          the wall on a turn or ends its turn there, the creature makes a
          Dexterity saving throw, taking 7d8 damage on a failed save or half as
          much damage on a successful one. A creature makes this save only once
          per turn.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> Both types of damage increase
          by 1d8 for each spell slot level above 6.</p></div></div>
