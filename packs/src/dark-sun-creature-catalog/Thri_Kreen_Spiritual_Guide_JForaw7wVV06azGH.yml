      description:
        value: >-
          <div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Spellcasting" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Spellcasting.</span></span> The thri-kreen
          is a 14th level spellcaster. Its spellcasting ability is Wisdom (spell
          DC <span class="rd__dc">12</span>, +4 to hit with spell attacks). The
          thri-kreen has the following druid spells prepared:</p><ul
