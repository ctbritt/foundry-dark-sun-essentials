  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Tareks are big, musclebound, and hairless bipeds that
        inhabit the hilly and mountainous areas of Athas. They have square,
        big-boned heads with sloping foreheads and massive brow ridges. Their
        flat noses have flared nostrils, and their domed muzzles are full of
        sharp teeth. Their powerful arms are so long that their knuckles drag
        along the ground. Tareks have a distinct musky odor that can be detected
        from as far away as 15 feet.</p><p>Tareks gather in tribes, building
        small communities in the hills and mountains of the Tyr region. These
        communities often sustain themselves by raiding, and visitors are not
        welcome. Unless a group of visitors include an obvious elemental cleric,
        tarek warriors rush out to kill or drive the intruders away In rare
        instances, members of a community will be sent out to trade with
        merchant caravans, but few traders will blindly conduct business with
        these representatives. More often than not, such representatives are
        decoys for an unseen raiding party. More than one caravan has been taken
        by surprise while negotiating a deal with tarek traders.</p>
