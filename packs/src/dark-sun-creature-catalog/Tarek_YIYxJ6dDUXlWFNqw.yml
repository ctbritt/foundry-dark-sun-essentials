  details:
    biography:
      value: >-
        <p>Tareks are big, musclebound, and hairless bipeds that inhabit the
        hilly and mountainous areas of Athas. They have square, big-boned heads
        with sloping foreheads and massive brow ridges. Their flat noses have
        flared nostrils, and their domed muzzles are full of sharp teeth. Their
        powerful arms are so long that their knuckles drag along the
        ground.</p><p>Tareks move with jerky, awkward strides except when
        engaged in combat. Then they exhibit a style and grace usually uncommon
        in creatures of their size and build. To watch them engage in combat is
        to watch fluid motions that are as artistic as dance - unless the viewer
        happens to be on the receiving end of the deadly spectacle.</p>
      public: ''
