  details:
    biography:
      value: >-
        <div class="rd__b  rd__b--1"><p>Carru resemble Brahman cattle because of
        the large humps immediately behind their heads. These humps are fluid
        storage sacs, but don't inflate and deflate. Carru are a drab gray color
        and have a soft hide. Their heads are covered with a tougher hide to
        protect the skull. Carru have two brown eyes set in the front of their
        heads for good forward vision. They have poor peripheral vision and a
        poor sense of smell. On adult males, two horns curve out from the
        forehead and sweep forward to in front of the eyes. Females have much
        shorter horns that project straight forward from the skull.</p></div>
      public: ''
