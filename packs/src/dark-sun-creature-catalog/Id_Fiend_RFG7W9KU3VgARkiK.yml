  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Fear on Athas is embodied in many tangible forms. Just
        as debilitating are the fears the mind conjures the anticipation, the
        dread, and the worry. Unknown, perhaps unknowable, dangers lie in wait
        on all sides: Boulders conceal vicious predators, a gloomy cave harbors
        cruel slave hunters, and forest canopies shadow far more than shrubs.
        The id fiend revels in these doubts, using them against its prey,
        magnifying anxieties until the line between fantasy and reality is
        shattered.</p><h3>Lore</h3><p>Instructors at the House of the Mind in
        Draj pay top coin for living id fiend specimens. They use a number of
        the fiend's organs and fluids in concoctions that awaken latent talent
        in their students. Most mixtures distilled by these seers and alchemists
        are of dubious purpose. Still, the id fiend's cranial fluid is a key
        component of terror ichor.</p><h3>Encounters</h3><p>Despite its
        monstrous appearance, an id fiend is intelligent and not above
        associating with other creatures. Still, such alliances (if they truly
        are alliances) are short-lived. A fiend's mere presence is often enough
        to set the dimmest creature's nerves on edge.</p><p>When an id fiend is
        encountered with other creatures, they might be unwitting servants,
        seeing their fears manifested in the adventurers. If the party destroys
        the id fiend first, the other opponents might stand down, flee, or even
        befriend the heroes for a time.</p><h3>Info</h3><p>Terrors come to life
        when an id fiend is near. Shadows darken and writhe, the ground crawls
        with vermin, and strange sounds echo all around. Against reason, a
        creature's deepest fears skulk nearby, lurking behind rocks or
        whispering from shadows. The id fiend magnifies the sensations until its
        prey can bear these fears no longer. Once gripped with terror, the id
        fiend's target comes to accept its doom.</p>
