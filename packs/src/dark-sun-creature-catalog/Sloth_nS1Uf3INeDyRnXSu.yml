  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The Athasian sloth is fast, cunning, and very
        bloodthirsty. A family of sloths can eat a whole halfling village in one
        night and is usually not afraid to try. The Athasian sloth is a large
        creature with brown fur. It usually has light tan and brown, or light
        grey and green spots making it easy for the sloth to blend in with the
        foliage of the Forest Ridge.</p><p>Athasian sloths make no sounds that
        anyone else can hear. Despite this, they seem to communicate very well
        with each other, making well-coordinated attacks.</p><p>The sloth is a
        territorial animal and defends its territory fiercely. A small forest
        may only have one or two families of Athasian sloths. Athasian sloths
        never attack one another, and if the parents are killed, the young
        sloths are likely to be adopted by the first adult sloths they can find.
        Athasian sloths prefer trees as lairs and as their method of travel.
        They have very good judgement when it comes to selecting branches that
        support their considerable weight. They are very fast both in the trees
        and on the ground.</p>
