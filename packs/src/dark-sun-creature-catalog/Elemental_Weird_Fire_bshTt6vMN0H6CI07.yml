  - _id: 6Vk1YbzhGZShhGPY
    name: Incendiary Cloud
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '288'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A swirling cloud of embers and smoke
          fills a 20-foot-radius @variantrule[Sphere [Area of
          Effect]|XPHB|Sphere] centered on a point within range. The cloud's
          area is @variantrule[Heavily Obscured|XPHB]. It lasts for the duration
          or until a strong wind (like that created by @spell[Gust of
          Wind|XPHB]) disperses it.</p><p>When the cloud appears, each creature
          in it makes a Dexterity saving throw, taking 10d8 damage on a failed
          save or half as much damage on a successful one. A creature must also
          make this save when the @variantrule[Sphere [Area of
          Effect]|XPHB|Sphere] moves into its space and when it enters the
          @variantrule[Sphere [Area of Effect]|XPHB|Sphere] or ends its turn
          there. A creature makes this save only once per turn.</p><p>The cloud
          moves 10 feet away from you in a direction you choose at the start of
          each of your turns.</p></div>
        chat: ''
      level: 8
      school: con
      properties:
        - vocal
        - somatic
