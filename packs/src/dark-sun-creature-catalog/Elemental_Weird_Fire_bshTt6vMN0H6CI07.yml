  - _id: 7dkKHvLHn7AXjshB
    name: Resurrection
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '312'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>With a touch, you revive a dead
          creature that has been dead for no more than a century, didn't die of
          old age, and wasn't Undead when it died.</p><p>The creature returns to
          life with all its @variantrule[Hit Points|XPHB]. This spell also
          neutralizes any poisons that affected the creature at the time of
          death. This spell closes all mortal wounds and restores any missing
          body parts.</p><p>Coming back from the dead is an ordeal. The target
          takes a -4 penalty to @variantrule[D20 Test|XPHB|D20 Tests]. Every
          time the target finishes a @variantrule[Long Rest|XPHB], the penalty
          is reduced by 1 until it becomes 0.</p><p>Casting this spell to revive
          a creature that has been dead for 365 days or longer taxes you. Until
          you finish a @variantrule[Long Rest|XPHB], you can't cast spells
          again, and you have @variantrule[Disadvantage|XPHB] on
          @variantrule[D20 Test|XPHB|D20 Tests].</p></div>
