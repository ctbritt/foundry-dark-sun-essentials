  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Vicious predators of the wastes</p><p>these reptilian
        creatures are feared throughout Athas. They track the unique traces of
        sentient minds, running in packs as they relentlessly hunt down their
        quarry.</p><p>Lore</p><p>Dagorrans are pack predators. A dagorran can
        latch onto a sentient creature's mind, whether through direct contact or
        by stumbling upon that creature's psychic trail. The pack is relentless
        once on the scent of prey, tracking a target for days or weeks before
        closing for the kill. Dagorrans spend nearly all their time hunting, and
        sleep for just a few hours every couple of days. They must stop to rear
        young, but only for a few weeks until the pups can run with the
        pack.</p><p>Encounters</p><p>Wild dagorrans avoid any companions other
        than the pack. Occasionally, templars train young dagorrans as psionic
        hounds to hunt down fugitives or escaped slaves. These tame beasts fight
        alongside their humanoid masters.</p><p>Info</p><p>Once they have
        tracked down their prey, dagorrans use a combination of tactics.
        Ambushers move ahead to lurk in wait or to sneak up on unaware targets.
        Mindhounds charge in packs, seeking to surround and distract their prey.
        Once in combat, the pack leader keeps track of the main target with
        psychic scent while the rest of the pack does the same with other
        foes.</p>
