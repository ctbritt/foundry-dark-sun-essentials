      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The templar is a 3rd-level
          spellcaster. Its spellcasting ability is Charisma (spell save DC <span
          class="rd__dc">13</span>, +5 to hit with spell attacks). It regains
          its expended spell slots when it finishes a short or long rest. It
          knows the following warlock spells:</p><p></p><p>Cantrips (at will):
          @spell[mage hand], @spell[prestidigitation], @spell[true
          strike]</p><p></p><p>At will: @spell[detect
          magic]</p><p></p><p>1st-2nd level (2 2nd-level slots): @spell[armor of
          agathys], @spell[hellish rebuke], @spell[ray of enfeeblement],
          @spell[witch bolt]</p><p></p><p>1/day each: @spell[bane]</p></div>
