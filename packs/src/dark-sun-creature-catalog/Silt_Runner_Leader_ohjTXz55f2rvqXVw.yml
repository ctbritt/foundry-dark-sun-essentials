  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>These small lizard-like men are common on Athas. They
        usually live the life of raiders, although occasionally a lair will be
        found. Silt runners move very quickly and have broad, flat feet. They
        can even run across silt for short stretches. They hate elves with a
        passion; an entire raiding party of silt runners may turn aside from a
        caravan to attack a lone elf.</p><p>Silt runners are tribal in nature,
        living in lairs of up to 200 individuals. These tribes are usually based
        on islands near the shores of the Sea of Silt or in a remote desert
        oasis. Silt runners consider elf a delicacy, and in melee they
        alwaysattack any elves present first. Their natural speed usually makes
        this easy.</p>
