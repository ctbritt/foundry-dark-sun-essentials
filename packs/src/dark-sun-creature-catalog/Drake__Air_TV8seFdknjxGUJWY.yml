  details:
    biography:
      value: >-
        <p>Air drakes are the most flighty and unpredictable of the species,
        making them dangerous adversaries. They spend most of their time soaring
        the Athasian skies.</p><p>Air drakes are the longest and leanest of the
        four drake types. They have folds of loose skin that stretch between
        their front and back legs. This skin unfolds when they extend their legs
        creating a wing membrane. They have a long, lean frame and are light of
        bone, contributing to their speed and agility.</p>
