        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The drake summons a 150 foot radius
          bubble of tornado-like winds from the plane of air centered on itself.
          Every creature, except for the drake, must make a DC 16 Strength
          saving throw. On a failure, they take 30 (6d8+2) bludgeoning damage
          and are flung up 20 feet away in a random direction and knocked prone.
          If a thrown creature strikes an object, such as a wall or floor, the
          target takes 3 (1d6) bludgeoning damage for every 10 feet it was
          thrown. If the target is thrown at another creature, that creature
          must succeed on a DC 16 Dexterity saving throw or take the same damage
          and be knocked prone.</p><p>If the saving throw is successful, the
          target takes half the bludgeoning damage and isn't flung away or
          knocked prone.</p><p>If done in a sandy area, such as a desert, this
          produces a sandstorm. Each creature must succeed a DC 16 constitution
          saving throw or be blinded until the end of their next turn.</p></div>
