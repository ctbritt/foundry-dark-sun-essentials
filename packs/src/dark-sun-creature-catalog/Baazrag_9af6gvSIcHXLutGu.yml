  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>In the broken crags and tiny caves of the
        barrens lives the timid baazrag. Two feet long or less, it is one of the
        smallest omnivores in the stony barren regions. The baazrag's face is
        protected by a bony covering that reaches down on either side of the
        head and across the nose, with holes for the creature's nostrils and
        eyes.</p><p>Solo Hunter</p><p>Baazrags are solitary creatures. Their
        territory extends to a 2-mile radius from their lair. Baazrags usually
        take over deserted baazrag lairs. If there is no water readily
        available, Baazrags will dig until they hit water. Deserted Baazrag
        lairs have been known to save the lives of thirsty travelers because of
        the well that may be found in some of them. If there is no prey
        available, Baazrags can survive on vegetation for as long as three
        months, or can go as long as one month without food at all.</p>
