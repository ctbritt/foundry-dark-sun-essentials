  - _id: MnhBf4IECaJjoGBW
    name: Telekinesis
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '331'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You gain the ability to move or
          manipulate creatures or objects by thought. When you cast the spell
          and as a @action[Magic|XPHB] action on your later turns before the
          spell ends, you can exert your will on one creature or object that you
          can see within range, causing the appropriate effect below. You can
          affect the same target round after round or choose a new one at any
          time. If you switch targets, the prior target is no longer affected by
          the spell.</p><div data-roll-name-ancestor="Creature" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Creature.</span></span> You can try to move
          a Huge or smaller creature. The target must succeed on a Strength
          saving throw, or you move it up to 30 feet in any direction within the
          spell's range. Until the end of your next turn, the creature has the
          &amp;Reference[condition=Restrained] condition, and if you lift it
          into the air, it is suspended there. It falls at the end of your next
          turn unless you use this option on it again and it fails the
          save.</p></div><div data-roll-name-ancestor="Object" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="2"> <span
          class="entry-title-inner">Object.</span></span> You can try to move a
          Huge or smaller object. If the object isn't being worn or carried, you
          automatically move it up to 30 feet in any direction within the
          spell's range.</p><p>If the object is worn or carried by a creature,
          that creature must succeed on a Strength saving throw, or you pull the
          object away and move it up to 30 feet in any direction within the
          spell's range.</p><p>You can exert fine control on objects with your
          telekinetic grip, such as manipulating a simple tool, opening a door
          or a container, stowing or retrieving an item from an open container,
          or pouring the contents from a vial.</p></div></div>
