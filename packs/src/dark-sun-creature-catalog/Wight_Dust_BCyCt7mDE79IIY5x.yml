      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A dust wight is surrounded by a cloud
          of dusty particles. Any living creature that comes within 5 feet of a
          dust wight must succeed on a [[/save ability=con dc=15]] saving throw.
          On a failed save, the creature begins to turn to stone and is
          &amp;Reference[condition=restrained]. It must repeat the saving throw
          at the end of its next turn. On a success, the effect ends. On a
          failure, the creature is &amp;Reference[condition=petrified]. The
          creature is &amp;Reference[condition=petrified] until it's freed by
          the greater restauration spell or a similarly powerful magic. A
          creature who saves successfully against the petrifying cloud can't be
          affected again by that dust wight's petrifying cloud for 24
          hours.</p></div>
