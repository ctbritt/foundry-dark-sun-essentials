      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A dust wight's slam attack, in
          addition to dealing damage, weakens objects crafted of metal or stone.
          Each time a creature is struck by a slam attack from a dust wight, any
          metal or stone armor worn by the target is damaged. The wearer of the
          armor can make a [[/save ability=dex dc=13]] saving throw to prevent
          the effect. If the object touched is either metal armor or a metal
          shield being worn or carried, its takes a permanent and cumulative -1
          penalty to the AC it offers. Armor reduced to an AC of 10 or a shield
          that drops to a +0 bonus is destroyed.</p></div>
