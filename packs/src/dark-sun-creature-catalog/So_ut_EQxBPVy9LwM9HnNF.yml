  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The so-ut, or rampagers, are fierce creatures that live
        only for the sake of destruction. They know no fear and hate the things
        of men, like weapons and buildings. A rampager is a huge, six-legged
        creature with gray scales covering its whole body. These scales are
        unusually thick and almost impossible to cut through. The four rear legs
        are large round pads, while the two front legs have claws as long as
        daggers.</p><p>The face is out of a nightmare, with long, dirty fangs
        and glowing red eyes. Its nose is similar to a vestigial horn, and they
        have small rounded ears. Its hearing is very poor, but its sense of
        smell is acute.</p><p>Rampagers are lone, fortunately very rare,
        creatures. They live only to destroy the works of men. Rampagers
        generally sleep during the heat of the day, and a bold adventurer can
        even walk across one without waking it. During the day a so-ut does have
        the initiative modifier for its great size.</p>
