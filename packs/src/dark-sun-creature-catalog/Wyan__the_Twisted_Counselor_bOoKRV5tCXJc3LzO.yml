          it can make only one attack if it takes the Attack action. If it casts
          a spell with a Somatic component, there is a [[/r 1d100cs&gt;25#Slowed
          spell cast success]]{25 percent} chance the spell fails as a result of
          the target making the spell’s gestures too slowly.</p><p>An affected
          target repeats the [[/save ability=wis]] save at the end of each of
          its turns, ending the spell on itself on a success.</p>
