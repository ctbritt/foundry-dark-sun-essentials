    type:
      value: undead
    biography:
      value: "<h3 data-start=\"5199\" data-end=\"5222\" style=\"caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-style:normal;font-variant-caps:normal;letter-spacing:normal;orphans:auto;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;-webkit-text-stroke-width:0px;text-decoration:none\">Strategy:</h3><ul data-start=\"5224\" data-end=\"5669\" style=\"caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:auto;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;-webkit-text-stroke-width:0px;text-decoration:none\"><li data-start=\"5224\" data-end=\"5406\"><p data-start=\"5226\" data-end=\"5406\"><strong data-start=\"5226\" data-end=\"5236\">Sacha:</strong><span class=\"Apple-converted-space\">\_</span>Remains invisible, using debuff spells and battlefield control (Maddening Darkness, Wall of Force) to isolate and disrupt. Strikes with Psychic Shriek opportunistically.</p></li><li data-start=\"5407\" data-end=\"5562\"><p data-start=\"5409\" data-end=\"5562\"><strong data-start=\"5409\" data-end=\"5418\">Wyan:</strong><span class=\"Apple-converted-space\">\_</span>Aggressively targets the most dangerous spellcasters with Mindbreak and Power Word Stun, and uses Reverse Gravity to disrupt enemy positioning.</p></li><li data-start=\"5563\" data-end=\"5669\"><p data-start=\"5565\" data-end=\"5669\"><strong data-start=\"5565\" data-end=\"5574\">Both:</strong><span class=\"Apple-converted-space\">\_</span>Leverage legendary actions to maintain pressure. Always keep distance and elevation advantage.</p></li></ul><hr data-start=\"5671\" data-end=\"5674\" style=\"font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:auto;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;-webkit-text-stroke-width:0px;text-decoration:none\" /><h3 data-start=\"5676\" data-end=\"5699\" style=\"caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-style:normal;font-variant-caps:normal;letter-spacing:normal;orphans:auto;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;-webkit-text-stroke-width:0px;text-decoration:none\">Recommended Allies:</h3><ul data-start=\"5701\" data-end=\"5795\" style=\"caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:auto;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;-webkit-text-stroke-width:0px;text-decoration:none\"><li data-start=\"5701\" data-end=\"5743\"><p data-start=\"5703\" data-end=\"5743\">Lesser psionic undead (Specters, Allips)</p></li><li data-start=\"5744\" data-end=\"5795\"><p data-start=\"5746\" data-end=\"5795\">Shadowy constructs or magical animated guardians.</p></li></ul>"
