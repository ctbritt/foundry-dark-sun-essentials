  - _id: vV2tBllmQRQxWGhM
    name: Twisted Love
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A scorned maiden can charm with a look
          a creature within 30ft of her. The target creature must succeed on a
          [[/save ability=wis dc=18]] saving throw or become permanently
          &amp;Reference[condition=charmed]. The effect is last until a
          @spell[remove curse], @spell[dispel evil and good], @spell[greater
          restoration] or wish spell is used to free the creature. Spells such
          as @spell[mind blank] or @spell[protection from evil and good] will
          temporarily negate the charm for the spell duration. The death of the
          scorned maiden will not free the creature but instead plunge it into
          raving madness (storyteller is encouraged to make use of the
          @variantrule[Madness] in the psecific the "Indefinite Madness" rule
          (p.260 of the Dungeon Master's Manual).</p></div>
