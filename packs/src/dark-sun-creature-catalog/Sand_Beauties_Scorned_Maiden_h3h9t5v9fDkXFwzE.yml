  - _id: LJVQMJ5t3hbIKQoR
    name: Insect Plague
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '289'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Swarming locusts fill a 20-foot-radius
          @variantrule[Sphere [Area of Effect]|XPHB|Sphere] centered on a point
          you choose within range. The @variantrule[Sphere [Area of
          Effect]|XPHB|Sphere] remains for the duration, and its area is
          @variantrule[Lightly Obscured|XPHB] and @variantrule[Difficult
          Terrain|XPHB].</p><p>When the swarm appears, each creature in it makes
          a Constitution saving throw, taking 4d10 damage on a failed save or
          half as much damage on a successful one. A creature also makes this
          save when it enters the spell's area for the first time on a turn or
          ends its turn there. A creature makes this save only once per
          turn.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage increases by 1d10
          for each spell slot level above 5.</p></div></div>
