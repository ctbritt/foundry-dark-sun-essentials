  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Fey creatures</p><p>said to come from the Lands Within
        the Wind, sand beauties are mysterious creatures coming from another
        plane of existence. Sand Beauties is a general term to refer to nymphs,
        female fey potentially good or malevolent.</p><p>Info</p><p>The vilest
        of the Temptresses are called scorned maiden. This creatures are among
        the most troubling to encounter, they are as beautiful as they are
        deadly, filled with hatred and a twisted concept of love. The love of a
        scorned maiden is a tyrannical magical enslavement, where the betrothed
        creature will sacrifice all that he can to his cruel lover. Scorned
        maiden surround themselves with a court of mesmerized slave that they
        keep as bodyguards, servant, or snacks.</p><p>Strangely enough scorned
        maiden do make their nest in civilized place or close to trade routes,
        assuring them with a constant source of food and servants. Their lair
        are filled with rich and luxurious cloth, perfumes, jewelry and other
        sign of affection from their slaves. An enthralled lover is willing to
        go to great length, even murder, to acquire and item that could please
        his mistress.</p><p>If threatened the scorned maiden will throw her
        legion of slave to die first, sacrificing them without a second of
        hesitation. The maiden prefers to fight from a distance, using her
        deadly magic to get rid of her assailant but will fight fiercely if
        cornered, draining their life to heal herself.</p>
