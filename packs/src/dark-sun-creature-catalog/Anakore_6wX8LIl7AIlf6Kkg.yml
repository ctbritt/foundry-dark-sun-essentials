  details:
    biography:
      value: >-
        <div class="rd__b  rd__b--1"><p>The anakore are a race of dimwitted
        humanoids with bony, wedgelike heads, small ears pressed close to the
        sides of their heads, and sunken, beady eyes covered by clear membranes
        to prevent sand from scratching these delicate tissues. The bright light
        of Athas's sun blinds the anakore during the day, but at night they can
        see as clearly as most beings do during the day. The anakore do not have
        infravision, however; they do not see body heat. In complete darkness,
        they are as blind as any human. But if there is even the tiniest amount
        of light, such as from a star, they see very well.</p></div>
      public: ''
