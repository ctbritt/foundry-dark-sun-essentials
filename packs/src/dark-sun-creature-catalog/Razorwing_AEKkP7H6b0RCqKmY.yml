  details:
    biography:
      value: >-
        <p>The razorwing hides under the silt and bursts out of the sand to
        slash at creatures flying above it. It is a vicious carnivore, and packs
        of razorwings have brought down creatures much larger than
        themselves.</p><p>The razorwing is a small-bodied slate gray creature
        that looks a bit like a small pterrax. It has bone white edges on its
        wings which are very sharp. A razorwing is able to communicate with
        others of its kind. It does not have a language, but uses its power of
        controlled sound to communicate when prey is nearby.</p><p>The
        razorwings live and hunt in packs. They also never attack alone. There
        is a pack leader, usually the biggest female. Razorwing young are born
        alive, high in the air. They immediately learn to glide or they do not
        survive.</p><p>Razorwings are found in the Sea of Silt almost
        exclusively. There are reports of packs being sighted in the inland silt
        basins. The razorwing prefers to eat floaters above all else. By means
        of its life detection power, a razorwing can even differentiate between
        a floater and other kinds of prey.</p>
