  details:
    biography:
      value: >-
        <p>The churning dust storms of the sea of silt sweet up wonders from its
        farthest reaches and deposit them on Tyr's rocky shores. Arriving amid
        the relics and wreckage are the bizarre floating mantles. These
        creatures resemble jellyfish that float on the coastal breezes as they
        feed and commune with one another.</p><p>Floaters make their homes on
        the mudflats located at the edges of the Sea of Silt. They often make
        nests from dead bushes and trees, but occasionally form nests within
        live trees as well. A nest commonly contains from three to five
        floaters, with some larger nests having up to eight members. These
        creatures group in nests for protective purposes, as they are often
        attacked by razorwings.</p><p>Floaters survive largely on the ferns and
        roots that grow in the wetter areas of the mudflats. When a mother
        gathers food for its young, it will often take leaves and roots of
        nearby plants, but will occasionally gather berries and seeds from the
        few fruit-bearing plants that grow on the mudflats.</p><p>Floaters are
        the favorite prey of razorwings, who make their home beneath the Sea of
        Silt. Floaters boast no usable byproducts, though many researchers have
        tried to make use of the gas-producing glands of this creature as a
        source of flammable gas. None have had success.</p>
