          class="entry-title-inner">At Higher Levels.</span></span> <p>When you
          cast this spell using a spell slot of 5th or 6th level, the bonus to
          attack rolls increases to +2 and the extra damage increases to
          [[/damage 2d4]]. When you use a spell slot of 7th level or higher, the
          bonus increases to +3 and the extra damage increases to [[/damage
          3d4]].</p></div></div>
