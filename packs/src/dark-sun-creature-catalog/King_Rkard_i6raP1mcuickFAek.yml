      boss-loot-assets-premium:
        UuxaSBkEtFqQmAMs:
          eventType: After Summon
          macroType: Summon
          primaryAnimation:
            soundEnabled: true
            soundFileName: blfx.sound.spell.cast.burning_hands.2
            waitUntilFinishedSoundEnabled: false
            enabled: true
            fileName: jb2a.magic_signs.circle.02.conjuration.complete.dark_red
            scale: 2
            waitUntilFinishedEnabled: true
            waitUntilFinished: -9000
            belowTokens: false
          secondaryAnimation:
            soundEnabled: true
            soundFileName: blfx.sound.spell.cast.burning_hands.1
            waitUntilFinishedSoundEnabled: false
            enabled: true
            fileName: blfx.spell.range.ray.scorching_ray.impact1.intro.yellow
            waitUntilFinishedEnabled: true
            waitUntilFinished: -1000
          thirdAnimation:
            soundEnabled: true
            soundFileName: blfx.sound.spell.cast.fireball.1
            waitUntilFinishedSoundEnabled: false
            enabled: true
            fileName: jb2a.smoke.puff.centered.dark_black
            scale: 2
            waitUntilFinishedEnabled: true
            waitUntilFinished: -3000
            belowTokens: false
            hiddenTarget: true
            shakeEnabled: false
            shakeDuration: 400
            shakeIntensity: 0.08
          command: >
            /**
             *
             * Summon
             *
             */
            // ------------------------------------------------

            // C U S T O M I Z E    T H E    A N I M A T I O N

            // ------------------------------------------------

            //

            const ANIMATION1 =
            'jb2a.magic_signs.circle.02.conjuration.complete.dark_red';

            const SCALE1 = 2; // Size of the animation. Default value: 2

            const WAIT_UNTIL_FINISHED1 = -9000; // Default value: -700

            const WAIT_UNTIL_FINISHED_ENABLED1 = true;

            const BELOW_TOKENS1 = false;

            const ENABLED1 = true;

            const SOUND_ENABLED1 = true;

            const SOUND1 = 'blfx.sound.spell.cast.burning_hands.2';

            const DELAY_SOUND1 = 0; // Default value: 0

            const START_TIME_SOUND1 = 0; // Default value: 0

            const WAIT_UNTIL_FINISHED_SOUND_ENABLED1 = false;

            const WAIT_UNTIL_FINISHED_SOUND1 = 0;


            const ANIMATION2 =
            'blfx.spell.range.ray.scorching_ray.impact1.intro.yellow';

            const WAIT_UNTIL_FINISHED2 = -1000; // Default value: -100

            const WAIT_UNTIL_FINISHED_ENABLED2 = true;

            const ENABLED2 = true;

            const SOUND_ENABLED2 = true;

            const SOUND2 = 'blfx.sound.spell.cast.burning_hands.1';

            const DELAY_SOUND2 = 0; // Default value: 0

            const START_TIME_SOUND2 = 0; // Default value: 0

            const WAIT_UNTIL_FINISHED_SOUND_ENABLED2 = false;

            const WAIT_UNTIL_FINISHED_SOUND2 = 0;


            const ANIMATION3 = 'jb2a.smoke.puff.centered.dark_black';

            const SCALE3 = 2; // Size of the animation. Default value: 2

            const BELOW_TOKENS3 = false;

            const WAIT_UNTIL_FINISHED3 = -3000; // Default value: -700

            const WAIT_UNTIL_FINISHED_ENABLED3 = true;

            const HIDDEN_TARGET3 = true;

            const ENABLED3 = true;

            const SOUND_ENABLED3 = true;

            const SOUND3 = 'blfx.sound.spell.cast.fireball.1';

            const DELAY_SOUND3 = 0; // Default value: 0

            const START_TIME_SOUND3 = 0; // Default value: 0

            const WAIT_UNTIL_FINISHED_SOUND_ENABLED3 = false;

            const WAIT_UNTIL_FINISHED_SOUND3 = 0;

            const SHAKE_ENABLED3 = false;

            const SHAKE_DURATION3 = 400;

            const SHAKE_INTENSITY3 = 0.08;

            // ------------------------------------------------

            // Ensure targetTokens and controlledToken are defined

            if (typeof targetTokens === "undefined" || targetTokens === null)
            return;


            const controlledToken = sourceToken;

            const sourceElevation = controlledToken.document.elevation;


            for (let targetToken of targetTokens) {
              // FADE OUT TOKEN
              await new Sequence()
                .animation()
                .playIf(HIDDEN_TARGET3)
                .on(targetToken)
                .fadeOut(0)
                .play();
            }
              // ON SOURCE TOKEN
              await new Sequence()
                .sound()
                .playIf(SOUND_ENABLED1)
                .file(SOUND1)
                .delay(DELAY_SOUND1)
                .startTime(START_TIME_SOUND1)
                .preset("conditionalWait", [
                  WAIT_UNTIL_FINISHED_SOUND_ENABLED1,
                  WAIT_UNTIL_FINISHED_SOUND1,
                ])

                .effect()
                .playIf(ENABLED1)
                .file(ANIMATION1)
                .atLocation(controlledToken)
                .scaleToObject(SCALE1)
                .elevation(sourceElevation, { absolute: false })
                .belowTokens(BELOW_TOKENS1)
                .preset("conditionalWait", [
                  WAIT_UNTIL_FINISHED_ENABLED1,
                  WAIT_UNTIL_FINISHED1,
                ])
                .play();


            for (let targetToken of targetTokens) {
              const targetElevation = targetToken.document?.elevation ?? 0;
              const scaleX = targetToken.document?.texture?.scaleX ?? 1;
              const image = targetToken.document.texture.src;

              // FROM SOURCE TO TARGET
              await new Sequence()
                .wait(150)
                .sound()
                .playIf(SOUND_ENABLED2)
                .file(SOUND2)
                .delay(DELAY_SOUND2)
                .startTime(START_TIME_SOUND2)
                .preset("conditionalWait", [
                  WAIT_UNTIL_FINISHED_SOUND_ENABLED2,
                  WAIT_UNTIL_FINISHED_SOUND2,
                ])

                .effect()
                .playIf(ENABLED2)
                .file(ANIMATION2)
                .zIndex(100)
                .elevation(targetElevation)
                .atLocation(controlledToken)
                .stretchTo(targetToken)
                .preset("conditionalWait", [
                  WAIT_UNTIL_FINISHED_ENABLED2,
                  WAIT_UNTIL_FINISHED2,
                ])

                // ON TARGET
                .sound()
                .playIf(SOUND_ENABLED3)
                .file(SOUND3)
                .delay(DELAY_SOUND3)
                .startTime(START_TIME_SOUND3)
                .preset("conditionalWait", [
                  WAIT_UNTIL_FINISHED_SOUND_ENABLED3,
                  WAIT_UNTIL_FINISHED_SOUND3,
                ])

                .effect()
                .playIf(ENABLED3)
                .file(ANIMATION3)
                .zIndex(50)
                .atLocation(targetToken)
                .scaleToObject(1.8)
                .randomRotation()
                .scaleIn(0, 2000, { ease: "easeOutCubic" })
                .repeats(5, 500, 500)

                .effect()
                .file(image)
                .zIndex(50)
                .atLocation(targetToken)
                .scaleToObject(1)
                .fadeIn(500, { ease: "easeInExpo" })
                .fadeOut(1500, { ease: "easeInExpo" })
                .filter("ColorMatrix", { saturate: -1, brightness: 0 })
                .filter("Blur", { blurX: 5, blurY: 5 })
                .scaleIn(0, 2000, { ease: "easeOutSine" })
                .duration(3500)
                .attachTo(targetToken, { bindAlpha: false })
                .waitUntilFinished(-1000)

                .effect()
                .file("jb2a.smoke.puff.centered.dark_black")
                .zIndex(50)
                .atLocation(targetToken)
                .scaleToObject(1.8)
                .randomRotation()
                .fadeOut(2400)
                .scaleOut(0.25, 2400, { ease: "easeOutSine" })

                // FADE IN TOKEN
                .animation()
                .on(targetToken)
                .fadeIn(1000)

                // SHAKE
                .effect()
                .playIf(SHAKE_ENABLED3)
                .copySprite(targetToken)
                .zIndex(0)
                .loopProperty("sprite", "position.x", {
                  from: -SHAKE_INTENSITY3,
                  to: SHAKE_INTENSITY3,
                  duration: 60,
                  pingPong: true,
                  delay: 0,
                  gridUnits: true,
                })
                .loopProperty("sprite", "position.y", {
                  from: -SHAKE_INTENSITY3,
                  to: SHAKE_INTENSITY3,
                  duration: 15,
                  pingPong: true,
                  delay: 0,
                  gridUnits: true,
                })
                .scaleToObject(scaleX)
                .duration(SHAKE_DURATION3)
                .play();
            }
