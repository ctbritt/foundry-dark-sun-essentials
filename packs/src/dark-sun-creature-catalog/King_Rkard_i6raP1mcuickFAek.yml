  - name: Undead Fortitude
    type: feat
    system:
      description:
        value: >-
          <div class="ddb"><section class="secret"
          id="secret-QJxmWbgBdteEpXXq"><p><em><strong>Undead
          Fortitude.</strong></em> If damage reduces [[lookup @name]] to 0 hit
          points, it must make a Constitution saving throw with a DC of 5 + the
          damage taken, unless the damage is radiant or from a critical hit. On
          a success, [[lookup @name]] drops to 1 hit point
          instead.</p></section><p> The [[lookup @name]] uses [[lookup
          @item.name]].</p></div><p><br /></p><section class="secret"
          id="secret-6K9C8f1n2zOAqGdn"><hr /><h5>Automation notes - Chris's
          Premades (CPR):</h5><p>Enable "Undead Fortitude Automation" in the
          module settings for this to work.</p><p>This feature will
          automatically roll with the DC being the DC of this item plus the
          damage dealt.</p><p>Critical hits and radiant damage will not trigger
          this feature.</p><p>Immunity to healing will also not trigger this
          feature.</p><p><em>This feature is safe to rename. Do not rename the
          effect.</em></p></section>
