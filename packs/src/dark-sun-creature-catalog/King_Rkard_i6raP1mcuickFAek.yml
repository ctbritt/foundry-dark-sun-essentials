    name: Elemental Weapon
    type: spell
    system:
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A nonmagical weapon you touch becomes
          a magic weapon. Choose one of the following damage types: acid, cold,
          fire, lightning, or thunder. For the duration, the weapon has a +1
          bonus to attack rolls and deals an extra [[/damage 1d4]] damage of the
          chosen type when it hits.</p></div><div class="rd__b  rd__b--3"><div
          data-roll-name-ancestor="At Higher Levels" class="rd__b 
