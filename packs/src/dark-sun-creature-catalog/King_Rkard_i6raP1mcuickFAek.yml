      dae:
        macro:
          name: Undead Fortitude
          img: icons/magic/death/skull-horned-goat-pentagram-red.webp
          type: script
          scope: global
          command: >-
            const { macroPass, damageItem: { newHP, totalDamage, tokenDamages :
            { combinedDamage } }, isCritical } = workflow || {};


            const test = macroPass == 'isDamaged' && !newHP && !isCritical &&
            !combinedDamage.some(dt => dt.type == 'radiant');


            if (test) {
                    const targetValue = 5 + totalDamage;
                    const undead = macroItem.actor;
                    const fortitudeRoll = (await undead.rollAbilitySave('con', { flavor: 'Undead Fortitude', targetValue: targetValue }))?.total >= targetValue;
                    if (fortitudeRoll) workflow.damageItem.hpDamage -= 1;
            }
