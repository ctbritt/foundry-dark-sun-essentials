  - _id: wZJhwdo9rC5NaHgn
    name: Spellcasting
    type: feat
    system:
      source:
        custom: ''
        book: ENK
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Spellcasting" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Spellcasting.</span></span> The templar is a
          16th-level spellcaster. Its spellcasting ability is Charisma (spell
          save DC <span class="rd__dc">18</span>, +11 to hit with spell
          attacks). It regains its expended spell slots when it finishes a short
          or long rest. It knows the following warlock spells:</p><ul
          class="rd__list rd__list-hang-notitle"><li class="rd__li 
          rd__li-spell"><p>At will: @UUID[.6Y7BkLI9bPBqfeLN],
          @UUID[.KazHmr3QVnJSdEhw], @UUID[.AOfl05FuQ8SLDDdZ]</p></li><li
          class="rd__li  rd__li-spell"><p>1/day: @UUID[.ZiCzvIC4O2QuTkWe],
          @UUID[.Q501B4LHGkG1jsst], @UUID[.qFRFb3ZXLu69rskV]</p></li></ul><ul
          class="rd__list rd__list-hang-notitle"><li class="rd__li 
          rd__li-spell"><p>Cantrips (at will): @UUID[.PLTBwyFIKwUa1r9Y],
          @UUID[.5QHkrDijgpcjT9rQ], @UUID[.a9iY4GLSa0Y8GZW5],
          @UUID[.NB0mC9ig9TJszJ62]</p></li><li class="rd__li 
          rd__li-spell"><p>1st level (4 slots): A selection of <a
          href="https://5e.tools/spells.html#blankhash,flstlevel:1=1,flstclass:warlock=1">1st-level
          warlock spells</a>. Examples include: @UUID[.LeXHS6kv5SooGJB8],
          @UUID[.sVTrIYG8VUWykgBD], @UUID[.jV8NSuhb3fJtlNc0],
          @UUID[.J1LaQaGYhpfqcjxp], and @UUID[.1jrAvwgjtN9unFNc]</p></li><li
          class="rd__li  rd__li-spell"><p>2nd level (3 slots): A selection of <a
          href="https://5e.tools/spells.html#blankhash,flstlevel:2=1,flstclass:warlock=1">2nd-level
          warlock spells</a>. Examples include: @UUID[.6KpremLTLYvupTUB],
