  - _id: rxIJUjDenTzbAfeF
    name: Hunger of Hadar
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '286'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You open a gateway to the Far Realm, a
          region infested with unspeakable horrors. A 20-foot-radius
          @variantrule[Sphere [Area of Effect]|XPHB|Sphere] of
          @variantrule[Darkness|XPHB] appears, centered on a point with range
          and lasting for the duration. The @variantrule[Sphere [Area of
          Effect]|XPHB|Sphere] is @variantrule[Difficult Terrain|XPHB], and it
          is filled with strange whispers and slurping noises, which can be
          heard up to 30 feet away. No light, magical or otherwise, can
          illuminate the area, and creatures fully within it have the
          &amp;Reference[condition=Blinded] condition.</p><p>Any creature that
          starts its turn in the area takes 2d6 damage. Any creature that ends
          its turn there must succeed on a Dexterity saving throw or take 2d6
          damage from otherworldly tentacles.</p></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The Cold or Acid damage (your
          choice) increases by 1d6 for each spell slot level above
          3.</p></div></div>
