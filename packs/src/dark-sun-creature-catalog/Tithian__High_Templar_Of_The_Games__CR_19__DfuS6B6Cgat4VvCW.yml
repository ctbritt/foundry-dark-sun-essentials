  - _id: KaToGEbCuvSEIxyv
    name: Gaseous Form
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '277'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A willing creature you touch
          shape-shifts, along with everything it's wearing and carrying, into a
          misty cloud for the duration. The spell ends on the target if it drops
          to 0 @variantrule[Hit Points|XPHB] or if it takes a
          @action[Magic|XPHB] action to end the spell on itself.</p><p>While in
          this form, the target's only method of movement is a @variantrule[Fly
          Speed|XPHB] of 10 feet, and it can hover. The target can enter and
          occupy the space of another creature. The target has
          @variantrule[Resistance|XPHB] to Bludgeoning, Piercing, and Slashing
          damage; it has @variantrule[Immunity|XPHB] to the
          &amp;Reference[condition=Prone] condition; and it has
          @variantrule[Advantage|XPHB] on Strength, Dexterity, and Constitution
          saving throws. The target can pass through narrow openings, but it
          treats liquids as though they were solid surfaces.</p><p>The target
          can't talk or manipulate objects, and any objects it was carrying or
          holding can't be dropped, used, or otherwise interacted with. Finally,
          the target can't attack or cast spells.</p></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> You can target one additional
          creature for each spell slot level above 3.</p></div></div>
