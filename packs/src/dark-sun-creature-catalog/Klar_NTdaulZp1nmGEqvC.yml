  - _id: w4HuO69xGELb4FRG
    name: Tasha's Hideous Laughter
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '331'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>One creature of your choice that you
          can see within range makes a Wisdom saving throw. On a failed save, it
          has the &amp;Reference[condition=Prone] and
          &amp;Reference[condition=Incapacitated] conditions for the duration.
          During that time, it laughs uncontrollably if it's capable of
          laughter, and it can't end the &amp;Reference[condition=Prone]
          condition on itself.</p><p>At the end of each of its turns and each
          time it takes damage, it makes another Wisdom saving throw. The target
          has <a href="https://5e.tools/variantrules.html#advantage_xphb"
          data-plut-hover="true" data-plut-hover-page="variantrules.html"
          data-plut-hover-source="XPHB"
          data-plut-hover-hash="advantage_xphb">Advantage</a> on the save if the
          save is triggered by damage. On a successful save, the spell
          ends.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> You can target one additional
          creature for each spell slot level above 1.</p></div></div>
        chat: ''
      level: 1
      school: enc
      properties:
        - concentration
        - psionic
