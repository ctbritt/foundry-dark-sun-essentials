  - _id: yV459OgEpjQ5JJ1F
    name: Innate Spellcasting (Psionics)
    type: feat
    system:
      source:
        custom: ''
        book: ENK
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The klar's innate spellcasting ability
          is Wisdom (spell save DC <span class="rd__dc">13</span>, +5 to hit
          with spell attacks). It can innately cast the following spells,
          requiring no components:</p><p>2/day each: @spell[absorb elements],
          @spell[catapult], @spell[tasha's hideous laughter], @spell[warding
          wind]</p><p>1/day each: @spell[dominate person], @spell[tasha's mind
          whip], @spell[telekinesis]</p><p>The target gains unbearable feelings
          of dread and uselessness instead of laughing</p><p>Able to
          telepathically give commands to target</p></div>
