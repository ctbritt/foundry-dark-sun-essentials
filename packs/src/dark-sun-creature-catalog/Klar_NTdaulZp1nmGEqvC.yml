  - _id: lwA30dBiD7b9i22f
    name: Dominate Person
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '266'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>One Humanoid you can see within range
          must succeed on a Wisdom saving throw or have the
          &amp;Reference[condition=Charmed] condition for the duration. The
          target has <a href="https://5e.tools/variantrules.html#advantage_xphb"
          data-plut-hover="true" data-plut-hover-page="variantrules.html"
          data-plut-hover-source="XPHB"
          data-plut-hover-hash="advantage_xphb">Advantage</a> on the save if you
          or your allies are fighting it. Whenever the target takes damage, it
          repeats the save, ending the spell on itself on a success.</p><p>You
          have a telepathic link with the &amp;Reference[condition=Charmed]
          target while the two of you are on the same plane of existence. On
          your turn, you can use this link to issue commands to the target (no
          action required), such as "<a
          href="https://5e.tools/actions.html#attack_xphb"
          data-plut-hover="true" data-plut-hover-page="actions.html"
          data-plut-hover-source="XPHB"
          data-plut-hover-hash="attack_xphb">Attack</a> that creature," "Move
          over there," or "Fetch that object." The target does its best to obey
          on its turn. If it completes an order and doesn't receive further
          direction from you, it acts and moves as it likes, focusing on
          protecting itself.</p><p>You can command the target to take a <a
          href="https://5e.tools/variantrules.html#reaction_xphb"
          data-plut-hover="true" data-plut-hover-page="variantrules.html"
          data-plut-hover-source="XPHB"
          data-plut-hover-hash="reaction_xphb">Reaction</a> but must take your
          own <a href="https://5e.tools/variantrules.html#reaction_xphb"
          data-plut-hover="true" data-plut-hover-page="variantrules.html"
          data-plut-hover-source="XPHB"
          data-plut-hover-hash="reaction_xphb">Reaction</a> to do
          so.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> Your <a
          href="https://5e.tools/conditionsdiseases.html#concentration_xphb"
          data-plut-hover="true" data-plut-hover-page="conditionsdiseases.html"
          data-plut-hover-source="XPHB"
          data-plut-hover-hash="concentration_xphb">Concentration</a> can last
          longer with a spell slot of level 6 (up to 10 minutes), 7 (up to 1
          hour), or 8+ (up to 8 hours).</p></div></div>
