          class="rd__th ve-col-4 ">Woe</td><td class="rd__th ve-col-8
          ">Bad</td></tr><tr><td class="rd__th ve-col-4 ">Weal and woe</td><td
          class="rd__th ve-col-8 ">Good and bad</td></tr><tr><td class="rd__th
          ve-col-4 ">Indifference</td><td class="rd__th ve-col-8 ">Neither good
          nor bad</td></tr></tbody></table><p>The spell doesn't account for
          circumstances, such as other spells, that might change the
          results.</p><p>If you cast the spell more than once before finishing a
