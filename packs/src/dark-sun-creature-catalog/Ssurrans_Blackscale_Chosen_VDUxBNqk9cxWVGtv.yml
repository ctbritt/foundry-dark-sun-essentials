      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You receive an omen from an
          otherworldly entity about the results of a course of action that you
          plan to take within the next 30 minutes. The DM chooses the omen from
          the Omens table.</p><table class="w-100 rd__table  stripe-odd-table"
