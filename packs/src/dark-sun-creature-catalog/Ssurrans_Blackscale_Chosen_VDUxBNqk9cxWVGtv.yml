  - _id: 85cppuQchjCoIFql
    name: Thaumaturgy
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '333'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You manifest a minor wonder within
          range. You create one of the effects below within range. If you cast
          this spell multiple times, you can have up to three of its 1-minute
          effects active at a time.</p><div data-roll-name-ancestor="Altered
          Eyes" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Altered
          Eyes.</span></span> You alter the appearance of your eyes for 1
          minute.</p></div><div data-roll-name-ancestor="Booming Voice"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="2"> <span class="entry-title-inner">Booming
          Voice.</span></span> Your voice booms up to three times as loud as
          normal for 1 minute. For the duration, you have
          @variantrule[Advantage|XPHB] on Charisma
          (&amp;Reference[skill=Intimidation]) checks.</p></div><div
          data-roll-name-ancestor="Fire Play" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="3"> <span
          class="entry-title-inner">Fire Play.</span></span> You cause flames to
          flicker, brighten, dim, or change color for 1 minute.</p></div><div
          data-roll-name-ancestor="Invisible Hand" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="4"> <span
          class="entry-title-inner">Invisible Hand.</span></span> You
          instantaneously cause an unlocked door or window to fly open or slam
          shut.</p></div><div data-roll-name-ancestor="Phantom Sound"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="5"> <span class="entry-title-inner">Phantom
          Sound.</span></span> You create an instantaneous sound that originates
          from a point of your choice within range, such as a rumble of thunder,
          the cry of a raven, or ominous whispers.</p></div><div
          data-roll-name-ancestor="Tremors" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="6"> <span
          class="entry-title-inner">Tremors.</span></span> You cause harmless
          tremors in the ground for 1 minute.</p></div></div>
