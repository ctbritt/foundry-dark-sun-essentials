  details:
    biography:
      value: >-
        <p>The parched travelers finally catch sight of a small, reedy oasis.
        One of their number, versed in nature magic, follows the course of a
        desert hawk. As the group descends the side of a small mesa, a sharp
        screech pierces the air. Their bird guide flaps its wings in panic as it
        is pulled into a patch of what looks like bamboo. It disappears with a
        crunch.</p><p>Veteran desert travelers know to be wary near an oasis.
        These locales can hide disguised predators such as chathrangs. A
        chathrang looks like an outsized tortoise, its back covered with
        reedlike protrusions. These tubes shoot quills covered with a sticky
        toxin. Each quill is attached to the beast by a long, sinewy cord by
        which it pulls its quarry closer. Chathrangs prey on small flying birds
        or insects, but they capture land-dwelling prey if nothing else is
        available.</p>
      public: ''
