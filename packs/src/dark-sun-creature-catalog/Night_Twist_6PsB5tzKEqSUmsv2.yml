  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>Long before luckless travelers in more remote
        and foreboding marshes see the harrowing sight of a lone night twist,
        they hear its haunting and melancholy song. The ghostly moaning sounds
        of its song seem slightly different to every traveler. For some, the
        song of the night twist sounds like a women weeping. To others, it is
        more akin to a wind blowing over a desolate graveyard. Most likely, the
        despair song of a night twist is the most sorrowful sound each traveler
        can conjurer within his or her own mind. Night twists subsist in the
        most inhospitable marshes, mudflats and ruins feeding on the rotting
        carcasses of creatures and travelers attracted by its despair
        song.</p><p>Night Twist grow on cursed ground, defiled lands and
        battlefield, feeding of the lasting negative energies running throught
        the land. They feed on necrotic energies, and as such are often mistaken
        for Trees of Death. This mistake is often the last one
        made.</p><p>Encounter</p><p>Rangers of the tablelands have heard and
        felt the despair song of night twists coming from the Black Sands
        region. These night twists watch over the unplundered tombs, buried deep
        in the land in ancient times. Much older night twists can be found
        throughout the Dry Marsh and the Crescent Forest, taking root in and
        around the cyclopean ruins of fallen giant cities, their songs of
        despair luring explorers to a swift doom.</p><p>A night twist, when
        actively seeking victims, sends out its despair song in order to bring
        prey to it. When those lured by the song are within range, a night twist
        uses its phantasmal killer spell-like ability. A night twist employs its
        powerful slam attack only if opponents first survive the illusion. The
        creature uses its entangle and darkness spell-like abilities to keep
        opponents from escaping. When a night twist feels threatened, it uses
        its wind attack and fear spelllike ability.</p>
