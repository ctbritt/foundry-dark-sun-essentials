        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You tap into the nightmares of a
          creature you can see within range and create an illusion of its
          deepest fears, visible only to that creature. The target makes a
          Wisdom saving throw. On a failed save, the target takes 4d10 damage
          and has @variantrule[Disadvantage|XPHB] on ability checks and attack
          rolls for the duration. On a successful save, the target takes half as
          much damage, and the spell ends.</p><p>For the duration, the target
          makes a Wisdom saving throw at the end of each of its turns. On a
          failed save, it takes the Psychic damage again. On a successful save,
          the spell ends.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
