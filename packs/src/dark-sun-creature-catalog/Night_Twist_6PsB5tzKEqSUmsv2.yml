  - _id: stNPFVMFIeGhsKbA
    name: Death Curse
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Killing a night twist invites a curse
          similar to that bestowed by the dream spell. The creature dealing the
          death blow must make a [[/save ability=wis dc=17]] saving throw to
          avoid being cursed with hideous and unsettling nightmares that
          prevents the creature from gaining any benefit from a short or long
          rest and deal 10 (3d6) damage. The nightmares and resulting damage
          affect the subject every night until the curse is removed or the
          victim dies. If the curse is removed, the victim remains fatigued for
          24 hours thereafter. A heal spell or more powerful magic cast while
          the subject is in the throes of a nightmare is the only way to remove
          a night twist's death curse. If the victim of a night twist victim
          dies and is interred, a new night twist springs from where the corpse
          was laid one month later. While the creature is developing, a night
          twist "sapling" appears at the gravesite; the creature seems to be a
          normal (nonintelligent) plant until it reaches maturity.</p></div>
