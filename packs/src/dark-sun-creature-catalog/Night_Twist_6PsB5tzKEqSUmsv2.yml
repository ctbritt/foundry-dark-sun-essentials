        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A @variantrule[Line [Area of
          Effect]|XPHB|Line] of strong wind 60 feet long and 10 feet wide blasts
          from you in a direction you choose for the duration. Each creature in
          the @variantrule[Line [Area of Effect]|XPHB|Line] must succeed on a
          Strength saving throw or be pushed 15 feet away from you in a
          direction following the @variantrule[Line [Area of Effect]|XPHB|Line].
          A creature that ends its turn in the @variantrule[Line [Area of
          Effect]|XPHB|Line] must make the same save.</p><p>Any creature in the
          @variantrule[Line [Area of Effect]|XPHB|Line] must spend 2 feet of
          movement for every 1 foot it moves when moving closer to
          you.</p><p>The gust disperses gas or vapor, and it extinguishes
          candles and similar unprotected flames in the area. It causes
          protected flames, such as those of lanterns, to dance wildly and has a
          50 percent chance to extinguish them.</p><p>As a @variantrule[Bonus
          Action|XPHB] on your later turns, you can change the direction in
