  - _id: k8kupuTw11PgjmGW
    name: Despair Song
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Every evening, a night twist emits a
          sorrowful sound that inspires melancholy and despair in all creatures
          with an Intelligence score of 6 or higher within a radius of 10
          kilometers. Those who fail a [[/save ability=wis dc=17]] saving throw
          are affected and must seek out the source of their sorrow (the night
          twist) to the neglect of all other tasks or needs, including eating or
          sleeping. If physically &amp;Reference[condition=restrained] and not
          allowed to seek out the night twist, a victim of this despair song
          takes 10 (3d6) damage every evening until it dies or the enchantment
          is removed. Relocating a victim outside the area affected by the night
          twist's song does not end the enchantment. The despair song ceases to
          affect a subject in the round after the night twist makes a slam
          attack against it. To remove the effects of the night twist's despair
          song before it attacks, a heal spell or more powerful magic must be
          employed. Dispel magic or dispel evil spells cannot remove the
          enchantment. The death of the night twist always ends the
          enchantment.</p></div>
