  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Dune stalkers are creatures native to the Elemental
        Plane of Earth</p><p>though they are also frequently found on the Gray
        Waste of Hades. These monsters revel in evil and take their only joy
        from spreading its blight. They despise the Material Plane and avoid it
        as much as possible. Even so, they are sometimes summoned there by evil
        characters to kill targets or carry out other quests.</p><p>Lore</p><p>A
        dune stalker appears humanoid. It stands approximately 7 feet tall, but
        it would be taller if stretched out or forced to stand erect. Its head
        is triangular, and the neck attaches near the top of the head, causing
        its leering, toothy face and pointed chin to hang below its shoulders.
        The dune stalker's gangly body is hairless, and its red, dusty, abrasive
        skin has no pores. The combination of short legs, long arms, and stooped
        posture causes its hands to drag on the ground. Its fingers and toes
        (four on each limb) are long and bony. The creature has massive
        shoulders and an enormous chest, which tapers to a narrow waist and
        hips. A dune stalker that has been assigned a mission by its summoner
        pursues the literal fulfillment of its instructions to the exclusion of
        all else. It resents its time on the Material Plane and wants to make
        its stay there as short as possible. Occasionally, a summoner's
        instructions are phrased in such a way that the dune stalker cannot
        actually carry them out. In this case, it is trapped on the Material
        Plane, where it takes out its frustration by killing all creatures it
        finds. Despite their sonic abilities, dune stalkers do not speak, though
        they understand Common and Terran.</p><p>Encounters</p><p>A dune
        stalker's preferred tactic is to hide in a rocky area and attack from
        ambush. When possible, it tries to gain higher ground on its opponents
        by climbing up on a rock or a structure to conceal itself. It often
        begins an assault by using its shout ability to disorient a group of
        opponents, then leaping into combat to deliver its kiss of death.
        Against foes within its reach, a dune stalker usually prefers to deliver
        a kiss of death against just one target rather than a shout against the
        whole group. The preferred target is the one it seeks to slay, or the
        one that presents the greatest danger, or the one that appears to have
        the strongest good alignment. (Given the dune stalker's demented
        psychology, this last could be just about anyone, but paladins usually
        stand out.)</p>
      public: ''
