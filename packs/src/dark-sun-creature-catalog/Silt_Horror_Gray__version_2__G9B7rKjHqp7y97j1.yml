  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>Silt Horror is the name given a group of
        predators that dwell in the sea of sand. While they vary in size and
        color, all of them are characterized by a large number of tentacles, and
        an unending hunger. Few are the creatures that escape once a silt horror
        has its tentacles around them.</p><p>Info</p><p>The gray horror is
        perhaps the worst of the silt horrors. It is a sickly gray in color, and
        has a multitude of sharp-edged tentacles. It is the most intelligent of
        the horrors, and fears nothing that moves.</p><p>Gray horrors are
        solitary, hungry, aggressive creatures. They only use their air sacs for
        emergencies, preferring to swim through the silt. They range far through
        the silt in search of prey.</p>
