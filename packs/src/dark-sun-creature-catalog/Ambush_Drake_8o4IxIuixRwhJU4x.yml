  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>Most creatures perceive ambush drakes as
        deadly draconic hunters of limited intelligence. However, they are
        social creatures among their own kind. Ambush drakes share the classic
        dragon mentality of hoarding treasure, but a pack doesn't believe in
        individual ownership. While one ambush drake might use an item at any
        given moment, the pack owns the treasure, and tomorrow another ambush
        drake might use it.</p><p>An ambush drake prefers to move about on all
        fours, using terrain for cover until they are close enough to charge
        their prey. An ambush drake typically weighs 200 pounds and has a
        5-foot-long body. Its scales display dark shades of red or brown,
        allowing him to move unseen in the mountains or rocky badlands of Athas.
        Ambush drake live in rocky areas, and like to hide in caves during the
        coldest hours of the night. They are usually hunting during the day,
        leaving with the sunrise and returning in their lair with the
        sunset.</p><p>Ambush drakes can speak Common and Draconic, but rarely
        choose to do so. Instead, they communicate telepathically with their
        kind. Ambush drakes share a communal consciousness, enabling them to
        communicate telepathically with other ambush
        drakes.</p><p>Encounter</p><p>Ambush drakes generally stalk their prey
        as a coordinated pack. They start by using their breath weapons and
        focus attacks on affected creatures, ignoring quicker fleeing prey.</p>
