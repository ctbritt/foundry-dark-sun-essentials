        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p><i>Melee Weapon Attack:</i> +5 to hit,
          reach 5 ft., one target. <i>Hit:</i> 13 (2d10 + 3) damage and the
          target must succeed on a [[/save ability=con dc=13]] saving throw or
          be &amp;Reference[condition=poisoned] for 1 minute. Until this poison
          ends, target's speed is halved, it takes a -2 penalty to AC and
          Dexterity saving throws, and it can't use reactions. On its turn, it
          can use either an action or a bonus action, not both. Regardless of
          the creature's abilities or magic items, it can't make more than one
          melee or ranged attack during its turn. If the creature attempts to
          cast a spell with a casting time of 1 action, roll a 1d20. On an 11 or
          higher, the spell doesn't take effect until the creature's next turn,
          and the creature must use its action on that turn to complete the
          spell. If it can't, the spell is wasted. The target can repeat the
          saving throw at the end of each of its turns, ending the poison on
          itself on a success.</p></div>
