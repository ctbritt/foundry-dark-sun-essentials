  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Pawing silently through emerald shadows</p><p>the
        leonine kirre stalks its prey. Muscles ripple beneath striped fur as
        eight legs tread closer to an unsuspecting victim. The forest quiets,
        and the air grows still-waiting for the mighty predator to claim its
        meal.</p><p>A kirre is one of many breeds (others include the tigone and
        the reptilian lirr) believed to have evolved from antiquity's great
        cats. Kirres infest Athas's rare forests and jungles. Prides can be
        found in small numbers throughout the Crescent Forest or in the Forest
        Ridge, where they trouble halflings.</p><p>Lore</p><p>Kirres are no
        ordinary dumb beasts. They have a strange, feral cunning and patience,
        when not overly hungry. They are able to assess their opponents,
        identifying weapons, gear, and health. They adjust their tactics
        depending on the creature they hunt. They might make noises to unnerve
        their enemies and drive them into foolish actions. They could also be
        silent, keeping to the shadows until it is time to strike. They watch
        and wait or hit and run as circumstances allow, delaying their final
        assault until the heat and sun have taken their
        toll.</p><p>Encounters</p><p>Kirres hunt in packs, stalking creatures
        for several hours, learning their prey's capacities, and wearing them
        down. They refuse to hunt with less intelligent allies, treating them as
        prey instead. The beasts sometimes accept humanoids as pack mates. They
        are found in the company of halflings most often, but wilderness goliath
        and gith tribes also regularly hunt with kirres.</p><p>Info</p><p>A
        kirre is a cautious hunter, watching and tracking its prey for miles
        before engaging. During the hunt, the kirre stays back, growling and
        chirping to rattle the quarry. As the kirre grows hungry and its prey
        grows fatigued, the beast draws closer. The kirre attacks only when the
        quarry is weakened or distracted, or when it appears the prey might
        escape. The kirre leaps at its prey, raking with its claws before
        springing away. When it closes for good, the beast viciously rips its
        victim apart.</p>
