  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Small herds of these vicious omnivores</p><p>roam the
        wastes. They resemble featherless birds with powerful legs and clawed
        forelimbs instead of wings. Some are bred and trained to bear humanoids
        into combat, yet even those are unpredictable and
        aggressive.</p><p>Lore</p><p>Wild crodlus form small herds of about a
        dozen members, each led by a dominant female. In a given herd, females
        outnumber males and are related to one another. The dominant female's
        mate outranks other males but is otherwise part of the herd. Males leave
        their birth herd on reaching adulthood to seek a mate in another herd.
        Once per year, crodlus mate and lay eggs. The young can run and hunt
        within minutes of hatching, though few escape predators and humanoid
        raiders.</p><p>Crodlus are curious-sometimes to a fault-and have been
        observed examining objects and holding such items with their forelimbs.
        In the wild, they use simple tools such as sticks to drive small prey
        out of hiding.</p><p>Encounters</p><p>In the wild, crodlus live and
        travel in herds. They flee from larger predators and treat weaker or
        smaller creatures as prey. Humanoids train crodlus as mounts, despite
        their unpredictable nature. Domesticated crodlus are found among any
        beings capable of handling and feeding the
        beasts.</p><p>Info</p><p>Tougher than regular specimen of their species
        the War Crodlu are bred for war and travels in the armies of
        Sorcerer-Kings, tribe of Raiders, caravans or other factions of the
        wasteland.</p>
