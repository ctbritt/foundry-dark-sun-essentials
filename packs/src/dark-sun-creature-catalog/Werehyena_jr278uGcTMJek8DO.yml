  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>Werehyenas are humanoids, often male humans,
        who can transform themselves into hyena-like forms. Their packs roam the
        plains and deserts of Athas looking for prey. The humanoid form tends to
        be tall and sinewy, with long, shaggy hair usually tied back over their
        neck. In their human forms, werehyenas tend to be gregarious and
        charismatic, many possessing a loud, resounding laugh.</p><p>The canine
        form appears to be a large hyena, over 6 foot long from snout to tail,
        with golden fur on its back and black fur on its belly and feet. It is
        not uncommon for a pack of these creatures to be followed by 2-12 normal
        hyenas. The normal hyenas are attracted to the lycanthropes, although
        not under their direct control.</p><p>Gnoll's of the Dragon Horns have a
        fragile alliance's with the local packs of werehyenas and the two
        species are often known to collaborate against common enemies.
        Werehyenas consider themselves superior to gnolls, treating them as the
        beta of the pack until dominance is asserted by the gnoll. While they do
        not necessarily respect the gnoll on their own, werehyena thread lightly
        when it comes to their demonic lord,
        Yeenoghu.</p><p>Encounters</p><p>Werehyenas travel in close-knit packs
        of up to a dozen creatures, most of whom are males. The pack is run by a
        dominant male, who makes all important decisions, reinforcing them with
        an occasional, savage bite. Newly infected lycanthropes are welcomed
        into a pack only if the newcomer agrees to accept the pack leader's
        orders to the death. If not, a fight for dominance usually ensues, with
        the victor becoming the new pack leader. Among themselves, they can be
        playful and capable of lasting intimacy. They mate for life, but only
        with other members of the pack. From one to four cubs are born with each
        litter; 75% of them are male.</p><p>Werehyena packs scour the desert and
        plains in human form, seeking human settlements to infiltrate. A
        favorite ploy is for a single lycanthrope to enter a town or village and
        use its charm ability to win its way into the hearts of the people. Some
        are even known to shower gifts on a long-forgotten sister or relative.
        The gifts are typically small gems which it gathers for this purpose.
        The lycanthrope then lures the victim out of town to a trap, where the
        rest of the pack lies in wait.</p><p>Info</p><p>Werehyenas are covert
        hunters, preying on gullible humans whenever possible. However, like
        their normal cousins, they are excellent scavengers, capable of eating
        just about anything in order to survive. Although their numbers are
        great, they are too widely scattered to have any profound effect upon
        the ecology of Athas.</p>
