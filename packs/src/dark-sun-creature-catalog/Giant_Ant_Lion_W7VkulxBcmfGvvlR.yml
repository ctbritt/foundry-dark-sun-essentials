          <div class="rd__b  rd__b--3"><p>The giant ant lion can spend an hour
          to dig a pit 20 feet wide and 20 feet deep in the sand and hides at
          the bottom, waiting for prey.</p><p>If the the ant lion is hiding at
          the bottom of the pit, a creature can attempt a [[/save ability=wis
          dc=18]] (perception) check to recognize to see the tips of the ant
          lions mandibles sticking out of the sand.</p><p>A creature that enters
          the pit slides down at a rate of 10 feet at the beginning of their
          turn. They can attempt a [[/save ability=str dc=15]] (athletics) check
          to stop sliding and a [[/save ability=str dc=20]] (athletics) check to
          climb out of the pit.</p><p>While in a pit, the ant lion has access to
          its sand burst attack.</p></div>
