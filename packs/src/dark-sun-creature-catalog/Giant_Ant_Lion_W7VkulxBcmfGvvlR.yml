      description:
        value: >-
          <div class="rd__b  rd__b--3"><p><i>Melee Weapon Attack:</i> +7 to hit,
          reach 5 ft., one target. <i>Hit:</i> 30 (4d12+4) piercing damage, and
          the target must succeed on a [[/save ability=con dc=14]] saving throw
          or be &amp;Reference[condition=poisoned] for 1 minute. The target is
          also &amp;Reference[condition=paralyzed] while
          &amp;Reference[condition=poisoned] in this way. The
          &amp;Reference[condition=poisoned] target can repeat the saving throw
          on each of its turns, ending the effect on itself on a
          success.</p><p>If the target is a Large or smaller creature, it is
          &amp;Reference[condition=grappled] (escape DC <span
          class="rd__dc">15</span>). Until this grapple ends, the ant lion can
          bite only the &amp;Reference[condition=grappled] creature and has
          advantage on attack rolls to do so.</p></div>
