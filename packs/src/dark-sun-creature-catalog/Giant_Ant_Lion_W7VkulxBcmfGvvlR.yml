  details:
    biography:
      value: >-
        <p>A giant ant lion is the larval form of a giant insect that resembles
        a dragonfly. It spends almost its entire life in larval form,
        voraciously consuming giant ants or anything that stumbles into its
        trap.</p><p>Giant ant lions are perfectly adapted to trapping and
        devouring prey. They dig slippery pits in loose sand and hide themselves
        at the bottom, with only their outsized mandibles visible.</p>
