  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>A Thrax is a dreadful creature that exists by draining
        the water from its victims. The thrax is very intelligent and is an
        implacable foe.</p><p>The thrax is humanoid in appearance with a ruddy
        tinge to its skin. It has dark hair and pointed ears, but it will never
        be mistaken for an elf. Its features are gaunt and angular, and the eyes
        of a thrax are a deep blue, like a pool of water. The thrax is a
        muscular creature; it has long thin arms and fingers that end in small
        suckers.</p><p>The thrax is an unfortunate creature that can be found
        anywhere. Since the corpse of a thrax victim is unmistakable, thrax are
        not common in cities or villages, at least not for long. They usually
        leave as soon as they discover their curse, or else they are hunted down
        and wiped out. Outside the villages, they lead solitary anguished lives.
        The thrax remembers what he was like before the change, but he cannot
        help himself. He is driven to try to survive. At first, the new thrax
        may even retain his original alignment, perhaps resolving to feed on
        animals instead of intelligent beings. However, the curse continues to
        work, and after a few months, feeding is the only thing that matters. He
        also begins to hate those who have not suffered his curse, especially
        humans and demi-humans.</p>
