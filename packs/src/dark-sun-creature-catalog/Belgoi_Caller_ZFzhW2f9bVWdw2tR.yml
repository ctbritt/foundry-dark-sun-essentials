  - _id: exGYnW6d6N0CICZx
    name: Hallucinatory Terrain
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '283'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You make natural terrain in a 150-foot
          @variantrule[Cube [Area of Effect]|XPHB|Cube] in range look, sound,
          and smell like another sort of natural terrain. Thus, open fields or a
          road can be made to resemble a swamp, hill, crevasse, or some other
          difficult or impassable terrain. A pond can be made to seem like a
          grassy meadow, a precipice like a gentle slope, or a rock-strewn gully
          like a wide and smooth road. Manufactured structures, equipment, and
          creatures within the area aren't changed.</p><p>The tactile
          characteristics of the terrain are unchanged, so creatures entering
          the area are likely to notice the illusion. If the difference isn't
          obvious by touch, a creature examining the illusion can take the
          @action[Study|XPHB] action to make an Intelligence
          (&amp;Reference[skill=Investigation]) check against your spell save DC
          to disbelieve it. If a creature discerns that the terrain is illusory,
          the creature sees a vague image superimposed on the real
          terrain.</p></div>
