  - _id: UALMBp7XP0pPTGkg
    name: Command of the Bell
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The belgoi rings his bell and each
          humanoid and beast within 60ft of him that can hear the bell must
          succeed on a Wisdom saving throw DC <span class="rd__dc">18</span> or
          being magically &amp;Reference[condition=charmed]. Deafened creatures
          are immune to this capacity. The &amp;Reference[condition=charmed]
          creature regards the belgoi as a frightening master to be heeded and
          obeyed. Although the target isn't under the belgoi's control, it takes
          the belgoi's requests or actions in the most favorable way it can.
          Each time the belgoi or its allies do anything harmful to the target,
          it can repeat the saving throw, ending the effect on itself on a
          success. Otherwise, the effect lasts for 24 hours or until the belgoi
          dies, is on a different plane of existence from the target, or ends
          the effect as a bonus action. If a target's saving throw is
          successful, the target is immune to the belgoi's Command of the Bell
          for the next 24 hours. The belgoi have no limit on the number of
          humanoids and beasts he can have &amp;Reference[condition=charmed] at
          a time.</p></div>
