      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Each creature of your choice in a
          5-foot-radius @variantrule[Sphere [Area of Effect]|XPHB|Sphere]
          centered on a point within range must succeed on a Wisdom saving throw
          or have the &amp;Reference[condition=Incapacitated] condition until
          the end of its next turn, at which point it must repeat the save. If
          the target fails the second save, the target has the
          &amp;Reference[condition=Unconscious] condition for the duration. The
          spell ends on a target if it takes damage or someone within 5 feet of
          it takes an action to shake it out of the spell's
          effect.</p><p>Creatures that don't sleep, such as elves, or that have
          @variantrule[Immunity|XPHB] to the
          &amp;Reference[condition=Exhaustion] condition automatically succeed
          on saves against this spell.</p></div>
