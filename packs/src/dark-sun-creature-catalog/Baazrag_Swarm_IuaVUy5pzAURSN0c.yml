  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>A lone baazrag stalks the desert plains</p><p>hunting a
        large, six-legged beast amid the dunes and rocks. When the prey realizes
        the danger, it attempts to escape, but not before the baazrag's jaws
        shut over a back leg. The quarry whirls and hisses, its jagged mandibles
        clicking furiously. The baazrag pads backward a few paces and looses a
        piercing squeal. Within seconds, further squeaks answer from nearby, and
        a dozen more baazrags bound over the dunes. The fero cious pack closes
        around the beetlelike creature and takes it down, one vicious bite at a
        time.</p><p>Lore</p><p>Anywhere that rough terrain provides cover for
        their burrows, baazrags can be found in large numbers. These wild beasts
        are vermin that eat anything they can find. Each individual sees to its
        own needs, fattening up on weeds and tiny prey, and storing water in a
        sac under its bony back shell. When larger prey is found, the pack works
        together for the promise ofa good meal for all. All baazrags are born
        female. Some members of a pack become male when an egg-laying breeder is
        nearby. These males tend to the breeder, defending her and her eggs as
        well as any hatchlings. Powerful baazrags have a natural psychic
        sensitivity. Large psychic disturbances irritate these creatures and can
        drive them to attack.</p><p>Encounters</p><p>Humanoids of all sorts
        domesticate baazrags, which make good house guards and pest hunters.
        Baazrags are also used to carry small loads or pull small vehicles. If a
        baazrag is born among other types of creatures or becomes accustomed to
        those who offer it food and comfort, it considers such beings to be part
        of its pack. Clever humanoids use this trait to tame baazrags as guard
        beasts. Baazrags tend to ignore creatures they cannot eat, such as
        undead. These inedible creatures, in turn, treat the baazrags similarly
        and ignore them. Thus, explorers might find a lair being shared by the
        two groups. Baazrags gain confidence, focus, and ferocity in numbers.
        Although they hunt singly, each baazrag acts as a scout for the pack.
        When a hunter finds prey, its distinct call brings its mates to swarm
        over the target. The baazrags relentlessly bite this prey and follow the
        creature until it falls or it proves too tough to pull down, forcing the
        baazrags to retreat. A baazrag breeder enters combat by culling a victim
        from the herd with psychiClure. Then it pounces on that individual,
        distinguishing it as a target for at least a few of its
        brood.</p><p>Info</p><p>Clicking and squeaking as they swarm a creature,
        the baazrag hatchlings make a noise that is unforgettable. A single
        baazrag is trouble, though not necessarily deadly. A swarm ofhatchlings,
        however, can easily knock down a foe and bite it to death.</p>
