  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Soldier slaughter an elf tribe</p><p>after a messenger
        fails to bring warning. A poisoned blade cuts down a dwarf before he
        achieves his life's goal. Both die, but their intense yearnings
        resurrect soulless bodies, driving the corpses to endlessly pursue what
        likely can never be accomplished.</p><p>Lore</p><p>As a soul passes into
        the Gray, its deepest unmet desire can splinter off to animate the
        physical form that its soul abandoned. The splinter accesses the
        memories, needs, and desires of the body's former occupant. Those
        passions are married to an overwhelming hunger for life force, and a
        wight is born. A wight's competing pursuits leave it incapable of
        satisfying any craving. The word \"wight\" meant \"person\" in days of
        yore, but the name now refers to evil undead who were once mortals
        driven by dark desire and great vanity.</p><p>Wights bleed frustration,
        anger, grief, and hate. Their emotions creep into nearby
        consciousness's, and quick witted creatures might realize a wight is
        nearby. Those hunting a particular Wight can use knowledge of its former
        life as an emotional weapon to gain an upper hand over the creature.
        Experienced hunters also know that killing a Wight requires its body's
        destruction. Dismemberment followed by fire is the surest way to
        accomplish that. According to legend, an occasional earnest soul
        completes the task that awakened a wight, freeing the miserable
        creature. For most wights, however, the components required to complete
        a task are lost in the ashes of time.</p><p>Wights possess the memories
        and drives of their formerly living selves. They will heed the call of
        whatever dark entity transformed them into undead, swearing oaths to
        appease their new lord while retaining their autonomy. Never tiring, a
        wight can pursue its goals relentlessly and without distraction. Neither
        dead nor alive, a wight exists in a transitional state between one world
        and the next. The bright spark it possessed in life is gone, and in its
        place is a yearning to consume that spark in all living things. When a
        wight attacks, this life essence glows like whitehot embers to its dark
        eyes, and the wight's cold touch can drain the spark through flesh,
        clothing, and armor.</p><p>Undead Nature</p><p>A wight doesn't require
        air, food, drink, or sleep.</p><p>Info</p><p>Wights flee from the world
        by day, away from the light of the sun, which they hate. They retreat to
        barrow mounds, crypts, and tombs where they dwell. Their lairs are
        silent, desolate places, surrounded by dead plants, noticeably
        blackened, and avoided by bird and beast. Humanoids slain by a wight can
        rise as zombies under its control. Motivated by hunger for living souls
        and driven by the same desire for power that awakened them in undeath,
        some wights serve as shock troops for evil leaders, including wraiths.
        As soldiers, they are able to plan but seldom do so, relying on their
        hunger for destruction to overwhelm any creature that stands before
        them. Wights are unscrupulous about allies, although a habit of the
        creature's living existence might influence its associations. Some
        wights work with living allies whose pursuits parallel a wight's dark
        appetites. More commonly, wights abide the presence of predatory
        breasts, which don't see the undead creatures as food.</p>
