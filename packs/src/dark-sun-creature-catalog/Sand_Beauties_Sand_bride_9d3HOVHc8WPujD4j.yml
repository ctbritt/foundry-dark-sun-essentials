  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The sand bride is a negative material plane creature
        trapped on Athas. It uses its powers of illusion to lure victims to a
        cold death. The sand bride usually creates the illusion of an oasis,
        with itself as a beautiful woman (or more rarely, a man). It feeds on
        the life force of intelligent beings. The sand bride is made entirely of
        sand. It has a humanoid shape and two glowing red eyes.</p><p>Sand
        brides are solitary creatures, having no contact with others of their
        kind. They are creatures trapped here, and they suffer as much as their
        victims, if not more. They were trapped here when a defiler opened a
        rift to the negative material plane.</p><p>A sand bride roams a
        considerable territory, its boundaries limited only by the sand. Sand
        brides do not like to cross areas other than sand. They can cross silt,
        but their movement rate is halved. They will not move across other types
        of terrain. A sand bride's lair is usually well hidden in a pocket
        beneath the sand. And though they have no use for them, sand brides lust
        after the possessions of men.</p>
