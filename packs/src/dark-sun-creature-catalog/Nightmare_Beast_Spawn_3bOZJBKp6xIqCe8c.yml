        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Perhaps the nightmare beast's most
          powerful weapon is the one from which its name is derived. Every
          intelligent creature that falls asleep within 3 miles of a nightmare
          beast must succeed at a Wisdom saving throw (DC <span
          class="rd__dc">16</span>) or suffer from horrid, vivid nightmares of
          being stalked and killed by monsters, demons, cruel enemies, or
          whatever else it fears. The effect is otherwise the same as that of a
          @spell[Dream] spell. A remove curse or a successful dispel magic
          negates the effect. Once a creature has either been affected by this
          ability or made a successful save, it cannot be affected by that
          nightmare beast's nightmare power again for 24 hours.</p></div>
