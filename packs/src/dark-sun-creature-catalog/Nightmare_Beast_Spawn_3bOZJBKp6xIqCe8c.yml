        value: >-
          <div class="rd__b  rd__b--3"><p>Each creature within 60 feet of the
          nightmare beast that can see it must succeed on a [[/save ability=cha
          dc=16]] saving throw, suffering from a Short-Term madness (p.259 of
          the Dungeon Master Manual) on a failed save. If the save fails by 5 or
          more, the target also suffers from a Long-Term Madness. If a target's
          saving throw is successful or the effect ends for it, the target is
          immune to this nightmare beast's Horrid Vision for the next 24 hours.
          The short-term and long-term madness can be ended with the
          @spell[greater restoration], @spell[remove curse] and @spell[dispel
          evil and good] spells.</p></div>
