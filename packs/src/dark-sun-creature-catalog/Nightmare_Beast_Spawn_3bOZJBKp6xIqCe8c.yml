  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Some sages say nightmare beasts</p><p>are vestiges of an
        age when war consumed the world and blood flowed in rivers. Other
        scholars speculate that the responsibility for these terrors rests at
        the feet of the sorcerer-kings. Whatever their true origins, no creature
        on Athas, other than the sorcerer-kings and the Dragon, elicits more
        fear than a nightmare beast.</p><p>Lore</p><p>Sages believe the
        nightmare beasts were called from the Gray and bound to Athas through
        powerful defiling magic. These horrors are a cancer on the world, their
        noxious presence poisoning land and contaminating water. Creatures
        indigenous to the haunts of a nightmare beast sicken and die, if they
        aren't devoured first. Killing one of these monsters does little to
        remove its stain. The hulking corpse rapidly rots into bubbling bile
        that renders the area uninhabitable.</p><p>With a disposition as bad as
        its reputation, it's no wonder that a nightmare beast spreads terror
        wherever it goes. This monster has no interest in treasure, nor does it
        often bring any prey back to its lair, unless the kill is so large that
        it cannot be consumed all at once. A nightmare beast often inadvertently
        eats treasures along with their owners, so occasionally items of value
        turn up in the creature's lair at a later time. Nightmare beasts speak
        Abyssal.</p><p>Although little is known of the nightmare beast's life
        cycle, it is assumed that spawn are adolescent forms. How the beasts put
        aside their innate hatred long enough to mate is an open and disturbing
        question.</p><p>Encounters</p><p>A nightmare beast does little to
        conceal its cavernous lair, for its mere presence is enough to cow the
        land and its inhabitants. Just as a defiler robs the soil of its
        nourishing properties, so does a nightmare beast despoil its habitat. A
        nightmare beast's lair lies at the center of a wasted real m, twisted by
        dark magic and poisoned by its malevolent presence. No other creature is
        willing or able to cooperate for any period of time with a fully
        manifested nightmare beast.</p><p>Nightmare beast spawn often hunt in
        packs. On occasion, a spawn joins a pack of whatever sort of predator it
        used to be. The spawn's former link to those creatures keeps its innate
        hatred in check, at least for a time.</p><p>Secrets of the nightmare
        beast</p><p>Few if any people currently living on Athas know the truth
        about nightmare beasts. The commonly held theories of the beasts, their
        origins, and their life cycle are wrong. Each nightmare beast was once
        another, more mundane predator of the wastelands. In rare instances, as
        an animal consumes prey within areas connected to the Gray or imbued
        with substantial defiling magic, the creature slowly begins to change.
        Energy courses through it, causing it to grow and to develop a limitless
        hatred for all living things. Once the tainted creature begins to seek
        and consume sentient beings, it mutates into a nightmare
        beast.</p><p>Nightmare beast spawn aren't progeny - they are a stage of
        mutation that some creatures reach before full metamorphosis is
        achieved.</p><p>This, of course, leads to other questions: Why do these
        creatures all mutate into the same form? Do other, related mutations
        haunt the farthest reaches of the wastes?</p><p>Info</p><p>A foulness
        with a tusk-filled maw burrows through the sandy wastes. Its serpentine
        body is covered with thick scales and sprouts tiny nubs of vestigial
        limbs. Although smaller and less deadly than the adult version, a
        nightmare beast spawn is a fearsome foe. Unlike their "elders," spawn
        have neither the ability nor the inclination to control their
        destructive urges.</p><p>They attack immediately, hoping to feast on
        both flesh and fear. They prefer to remain at a distance, but can be
        vicious melee combatants. Like the grown beast, nightmare beast spawn
        taint the land when they die, rendering everything within 5 squares of a
        corpse defiled terrain.</p>
