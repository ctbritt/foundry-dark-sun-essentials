  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Drakes loom large in the myths of athas</p><p>Though
        tales of them might scare children, few people believe these giant
        monsters exist. Those who find out the truth rarely survive the
        experience-the soft flesh of humanoids is drakes' favorite
        food.</p><p>Lore</p><p>Athasian drakes are enormous, fearsome predators
        having only animal intelligence and strong instincts. Each variety of
        drake is attuned to a specific element and has psionic control over that
        element, making its home in areas dominated by its associated
        element.</p><p>Athasian drakes collect objects in their lairs or expand
        their territory, depending on the individual drake's nature. Although
        some hoards are valuable, drakes also amass trinkets or souvenirs that
        have no worth to anyone else. Air drakes maintain multiple lairs atop
        rocky spires or mesas and divide their few precious belongings among
        these lairs.</p><p>Encounters</p><p>Drakes use terrain to their
        advantage, and the setting for a battle with a drake can be as important
        as the monster. Precarious cliffs are a great setup for air drakes,
        volcanic fissures favor fire drakes, and unstable underground burrows
        make tricky settings for encounters with earth drakes. Water drakes
        might appear anywhere precious reserves of water exist. Any location
        might also have been booby-trapped or fortified before the drake claimed
        it.</p><p>Info</p><p>The prisoner pleads for the halfling shamans to
        release him, yet they insist he is a sacrifice to the god of fire. As if
        answering their call, a creature arises from the crater, magma dripping
        from its thick, rocky scales. With a bestial rumble like a laugh, it
        suddenly slashes, felling and devouring the halflings. Before the victim
        can give thanks, the beast turns its scorching breath and razor-sharp
        claws on him. A fire drake opens with breath of elemental fire to scorch
        as many enemies as possible, moving the fiery zone about the battlefield
        to herd them. It grabs an enemy and uses it to deflect blows, for fun as
        well as defense. Fire drakes thrive on tormenting their victims, using
        blazing pain to amplify suffering.</p><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Lair Actions" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="1"> <span
        class="entry-title-inner">Lair Actions</span></h3> <p>On initiative
        count 20 (losing initiative ties), the dragon takes a lair action to
        cause one of the following effects; the dragon can't use the same effect
        two rounds in a row:</p><ul class="rd__list"><li class="rd__li ">Magma
        erupts from a point on the ground the dragon can see within 120 feet of
        it, creating a 20-foot-high, 5-foot-radius geyser. Each creature in the
        geyser's area must make a DC 15 Dexterity saving throw, taking 21 (6d6)
        fire damage on a failed save, or half as much damage on a successful
        one.</li><li class="rd__li ">A tremor shakes the lair in a 60-foot
        radius around the dragon. Each creature other than the dragon on the
        ground in that area must succeed on a DC 15 Dexterity saving throw or be
        knocked prone.</li><li class="rd__li ">Volcanic gases form a cloud in a
        20-foot-radius sphere centered on a point the dragon can see within 120
        feet of it. The sphere spreads a round corners, and its area is lightly
        obscured. It lasts until initiative count 20 on the next round. Each
        creature that starts its turn in the cloud must succeed on a DC 13
        Constitution saving throw or be poisoned until the end of its turn.
        While poisoned in this way, a creature is
        incapacitated.</li></ul></div></div><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Regional Effects" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="2"> <span
        class="entry-title-inner">Regional Effects</span></h3> <p>The region
        containing a fire drake's lair is warped by the dragon's elemental
        magic, which creates one or more of the following effects:</p><ul
        class="rd__list"><li class="rd__li ">Water sources within 1 mile of the
        lair are supernaturally warm and tainted by sulfur.</li><li
        class="rd__li ">Lava fountains erupt from the ground within 1 mile of
        the drake's lair. Every hour, there is a ten percent chance that
        characters in this area are close enough to an erupting lava fountain to
        be in danger. A lava fountain create a vent 20 feet in diameter, and
        hurls globs of lava up to 200 feet away. Each character within this area
        must succeed on a DC 21 Dexterity saving throw or take 11 (2d10)
        bludgeoning damage plus 17 (5d6) fire damage. A fountains lasts for 2d10
        rounds before subsiding.</li><li class="rd__li ">Rocky fissures within 1
        mile of the drake's lair form portals to the Elemental Plane of Fire,
        allowing creatures of elemental fire into the world to dwell
        nearby.</li><li class="rd__li ">Given days or longer to work, the dragon
        can make cooled magma within its lair as solid as stone, forming
        structures and other basaltic maze were he likes to hunt.</li></ul><p>If
        the drake dies, these effects fade over the course of 1d10
        days.</p></div></div>
