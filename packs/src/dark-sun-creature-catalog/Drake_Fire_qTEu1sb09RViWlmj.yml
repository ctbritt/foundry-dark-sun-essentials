  - _id: 9Zq2rXFlGwhnYCtc
    name: Regional Effects
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The region containing a fire drake's
          lair is warped by the dragon's elemental magic, which creates one or
          more of the following effects:</p><ul class="rd__list"><li
          class="rd__li ">Water sources within 1 mile of the lair are
          supernaturally warm and tainted by sulfur.</li><li class="rd__li
          ">Lava fountains erupt from the ground within 1 mile of the drake's
          lair. Every hour, there is a ten percent chance that characters in
          this area are close enough to an erupting lava fountain to be in
          danger. A lava fountain create a vent 20 feet in diameter, and hurls
          globs of lava up to 200 feet away. Each character within this area
          must succeed on a DC 21 Dexterity saving throw or take 11 (2d10)
          bludgeoning damage plus 17 (5d6) fire damage. A fountains lasts for
          2d10 rounds before subsiding.</li><li class="rd__li ">Rocky fissures
          within 1 mile of the drake's lair form portals to the Elemental Plane
          of Fire, allowing creatures of elemental fire into the world to dwell
          nearby.</li><li class="rd__li ">Given days or longer to work, the
          dragon can make cooled magma within its lair as solid as stone,
          forming structures and other basaltic maze were he likes to
          hunt.</li></ul><p>If the drake dies, these effects fade over the
          course of 1d10 days.</p></div>
