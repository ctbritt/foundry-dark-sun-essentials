  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Gaj are carnivores and require flesh to survive, but
        they also need to consume the mental energy of other sentient creatures
        to live.</p><p>Gaj prefer to live and hunt alone, though they can
        occasionally be found in pairs. They prefer to live in rocky areas where
        their shells serve as camouflage, or in sandy areas where they can hide
        themselves from predators in a shallow burrow, so almost every encounter
        begins with an ambush by the creature.</p><p>A gaj is a predatory
        insectoid creature that feeds by draining the intelligence of other
        creatures. These creatures spend their time hunting such creatures;
        though they can partially subsist on meat for up to a week.</p>
