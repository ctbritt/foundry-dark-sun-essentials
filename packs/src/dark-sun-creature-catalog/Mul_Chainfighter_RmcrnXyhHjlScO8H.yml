  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Bred by sorcerer-kings</p><p>muls combine what many
        consider the best traits of dwarves and humans. They are hardy, strong,
        resourceful, and quick to anger. With extensive and rigorous training,
        they make ideal soldiers.</p><p>Lore</p><p>A mul's performance in combat
        is never in question. But even the best gladiators and slaves are
        intractable and difficult to control. Many kill or maim their handlers.
        Nobles tolerate obstinate mul slaves because they make excellent
        warriors and draw crowds to the arenas. A powerful mul often takes
        command among slave gangs, substituting strength and ferocity for more
        traditional leadership skills. Many muls, unwilling to remain beneath
        the heel of another race, flee the cities to form savage desert tribes
        or stand as figureheads in resistances against the rule of the
        sorcerer-kings.</p><p>Muls mingle with other races, though humans and
        dwarves have little love for the creatures. Free muls become raiders,
        gang enforcers, or mercenaries, lending their superior strength and
        stamina to whatever force they join.</p><p>Info</p><p>The slight is not
        egregious-a sharp word uttered carelessly, perhaps. Even so, the mul
        furrows its bald brow in anger and then looses its cahulaks. Cahulaks
        are favored by mul mercenaries, enforcers, and bodyguards. Muls use
        these weapons to bring foes close before savagely constricting them.</p>
