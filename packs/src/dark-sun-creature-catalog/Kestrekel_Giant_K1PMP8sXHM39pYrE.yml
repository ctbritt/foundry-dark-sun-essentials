  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The horrid croak of akestrekel</p><p>is considered a
        harbinger of death, because these predators gather when a creature is
        about to die. Individually, a kestreke is a nuisance. A flock of these
        birds can be an immediate and dire threat, though. The larger ones are
        cruel creatures that enjoy the suffering of.</p><p>Lore</p><p>Kestrekels
        seek out the sick and injured, their dark eyes watching for any sign of
        weakness. As the prey is sapped, the beasts probe their coming meal by
        darting closer for quick bites. Travelers dogged by these carrion birds
        can lure them close by feigning injuries, but this trick rarely works on
        any but the most eager beasts.</p><p>Encounters</p><p>Death lures
        kestrekels, but they are patient and always watchful. Kestrekels seldom
        attack healthy creatures, but might follow them, especially into areas
        where the land and climate are hard or where other predators or dangers
        might be present. As a traveler moves deeper into these territories,
        other kestrekels join the first few, until a dozen or more have
        gathered. Together, they emit their grating calls, waiting until their
        meal can no longer fend off attack.</p><p>Info</p><p>A giant kestrekel
        has advanced intelligence and a malevolent bent. Unlike its smaller kin,
        it will attack a wounded creature to hasten its end. Giant kestrekel
        have been known to haunt a thirsty, starving creature for days to enjoy
        its suffering.</p>
