          &amp;Reference[condition=grappled], Incapacitated,
          &amp;Reference[condition=paralyzed] or
          &amp;Reference[condition=stunned] target. It inflicts 2d6 + 6 damage,
          and the target is removed from play. The target starts to suffocate
          (p.183 of the Player's Handbook). Every turn the target can attempt a
          Strength saving DC <span class="rd__dc">13</span> throw to resurface.
          The target reappears in the space it last occupied or in the nearest
          unoccupied space of its choice.</p></div>
