  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Natives of the rain-kissed forest ridge</p><p>halflings
        are tribal people who maintain their distance from other humanoid races
        of Athas. They interact little with the Seven Cities or the people of
        the desert and are notorious for eating captured enemies. They're not
        above stealing livestock or ambushing unwary travelers to remedy an
        empty cook pot. Most halflings want nothing to do with outsiders,
        though. They defend their home with poisoned darts and primal
        magic.</p><p>Some halflings roam the desert, although they are a rare
        sight in the Seven Cities. Small bands venture down from the Forest
        Ridge and find employment as guides, trackers, hunters, and occasionally
        slavers. Individual halflings indulge their wanderlust by exploring
        unfamiliar areas of the world. On occasion, bloodthirsty renegade tribes
        aggressively raid villages or waylay caravans in the vast
        wastes.</p><p>Lore</p><p>Halflings are among the oldest of the speaking
        peoples of Athas, and they have a rich oral tradition, a deep
        understanding of nature, and a complex culture. Halfling tribes on Athas
        openly practice cannibalism, though usually as a ritualistic matter.
        Though they rarely deal with outsiders, halflings have been known to
        work with others for mutual gain. However, anyone who breaks an oath to
        a halfling tribe will find himself or herself quickly pursued by a band
        of head hunters. These marauders pose a threat to any traveler who
        wanders into their hunting grounds.</p><p>Encounters</p><p>Halflings
        distrust other intelligent humanoids and are rarely found in their
        company. They do take forest monsters as pets, domesticating drakes,
        griffons, kirres, panthers, and similar beasts.</p><p>Info</p><p>A
        halfling headhunter is a tribal champion who inspires its fellows
        through its grisly deeds. A headhunter acts with stealth and ruthless
        efficiency to dispatch the worst enemies that a halfling tribe might
        encounter. A headhunter skirts a fight, scouting a good opportunity to
        rush an enemy leader or ranged combatant. It isn't afraid to withdraw
        from a fight, provoking opportunity attacks if necessary, to reach a new
        hiding place and prepare another ambush.</p>
