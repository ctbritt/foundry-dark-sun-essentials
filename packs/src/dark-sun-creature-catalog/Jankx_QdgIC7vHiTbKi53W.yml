  details:
    biography:
      value: >-
        <p>These furred mammals live in burrow communities in the desert.
        Although they represent a possible prime source of food or clothing,
        most people think they are too dangerous to bother.</p><p>Standing about
        1' tall on their hind legs, jankx have a small, pointy head and internal
        cheek pouches that allow them to carry food or water when they run.
        Jankx have long, sleek bodies and four short, muscular legs. Golden in
        color, their pelts are highly prized for trade.</p><p>Jankx communicate
        in a series of ultrasonic squeaks and barks that are inaudible to
        humanoid ears.</p><p>Those who consider themselves jankx "herders" are
        more trappers than anything. Jankx are usually snared when they are on
        their nightly forays. A herder hovel is always built either above ground
        or on solid stone to prevent jankx from burrowing underneath the hovel
        and killing the herder. Jankx meat is considered gamey but palatable.
        Due to the difficult position of the poison sacs, caution should be
        taken in preparing jankx meat. A general rule is one jankx for elves and
        humans, more for others. Caution must always be exercised when cooking
        jankx meat. When cooked, the burning flesh emits an odor that sends any
        nearby jankx into a rage. If cooked too close to a jankx community, a
        horde of jankx will invariably find the source of the odor and attack
        the diners.</p>
