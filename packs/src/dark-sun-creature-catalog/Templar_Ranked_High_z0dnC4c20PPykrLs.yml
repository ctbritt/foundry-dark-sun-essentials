  - _id: BJZxwS9fOvq71uU1
    name: Magic Circle
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '293'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create a 10-foot-radius,
          20-foot-tall @variantrule[Cylinder [Area of Effect]|XPHB|Cylinder] of
          magical energy centered on a point on the ground that you can see
          within range. Glowing runes appear wherever the @variantrule[Cylinder
          [Area of Effect]|XPHB|Cylinder] intersects with the floor or other
          surface.</p><p>Choose one or more of the following types of creatures:
          Celestials, Elementals, Fey, Fiends, or Undead. The circle affects a
          creature of the chosen type in the following ways:</p><ul
          class="rd__list"><li class="rd__li ">The creature can't willingly
          enter the @variantrule[Cylinder [Area of Effect]|XPHB|Cylinder] by
          nonmagical means. If the creature tries to use teleportation or
          interplanar travel to do so, it must first succeed on a Charisma
          saving throw.</li><li class="rd__li ">The creature has
          @variantrule[Disadvantage|XPHB] on attack rolls against targets within
          the @variantrule[Cylinder [Area of Effect]|XPHB|Cylinder].</li><li
          class="rd__li ">Targets within the @variantrule[Cylinder [Area of
          Effect]|XPHB|Cylinder] can't be possessed by or gain the
          &amp;Reference[condition=Charmed] or
          &amp;Reference[condition=Frightened] condition from the
          creature.</li></ul><p>Each time you cast this spell, you can cause its
          magic to operate in the reverse direction, preventing a creature of
          the specified type from leaving the @variantrule[Cylinder [Area of
          Effect]|XPHB|Cylinder] and protecting targets outside
          it.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The duration increases by 1
          hour for each spell slot level above 3.</p></div></div>
