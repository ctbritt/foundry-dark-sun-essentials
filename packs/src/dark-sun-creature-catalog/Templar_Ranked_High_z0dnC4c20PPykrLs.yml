  - _id: 9l58p8LmXRn9HQ5X
    name: Hallow
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '283'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You touch a point and infuse an area
          around it with holy or unholy power. The area can have a radius up to
          60 feet, and the spell fails if the radius includes an area already
          under the effect of Hallow. The affected area has the following
          effects.</p><div data-roll-name-ancestor="Hallowed Ward" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Hallowed Ward.</span></span> Choose any of
          these creature types: Aberration, Celestial, Elemental, Fey, Fiend, or
          Undead. Creatures of the chosen types can't willingly enter the area,
          and any creature that is possessed by or that has the
          &amp;Reference[condition=Charmed] or
          &amp;Reference[condition=Frightened] condition from such creatures
          isn't possessed, &amp;Reference[condition=Charmed], or
          &amp;Reference[condition=Frightened] by them while in the
          area.</p></div><div data-roll-name-ancestor="Extra Effect"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="2"> <span class="entry-title-inner">Extra
          Effect.</span></span> You bind an extra effect to the area from the
          list below:</p><ul class="rd__list rd__list-hang-notitle"><li
          class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Courage"><span class="bold
          rd__list-item-name">Courage.</span> Creatures of any types you choose
          can't gain the &amp;Reference[condition=Frightened] condition while in
          the area.</p></li><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Darkness"><span class="bold
          rd__list-item-name">Darkness.</span> @variantrule[Darkness|XPHB] fills
          the area. Normal light, as well as magical light created by spells of
          a level lower than this spell, can't illuminate the area.</p></li><li
          class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Daylight"><span class="bold
          rd__list-item-name">Daylight.</span> Bright light fills the area.
          Magical @variantrule[Darkness|XPHB] created by spells of a level lower
          than this spell can't extinguish the light.</p></li><li class="rd__li
          "><p class="rd__p-list-item" data-roll-name-ancestor="Peaceful
          Rest"><span class="bold rd__list-item-name">Peaceful Rest.</span>
          @variantrule[Dead|XPHB] bodies interred in the area can't be turned
          into Undead.</p></li><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Extradimensional Interference"><span
          class="bold rd__list-item-name">Extradimensional Interference.</span>
          Creatures of any types you choose can't enter or exit the area using
          teleportation or interplanar travel.</p></li><li class="rd__li "><p
          class="rd__p-list-item" data-roll-name-ancestor="Fear"><span
          class="bold rd__list-item-name">Fear.</span> Creatures of any types
          you choose have the &amp;Reference[condition=Frightened] condition
          while in the area.</p></li><li class="rd__li "><p
          class="rd__p-list-item" data-roll-name-ancestor="Resistance"><span
          class="bold rd__list-item-name">Resistance.</span> Creatures of any
          types you choose have @variantrule[Resistance|XPHB] to one damage type
          of your choice while in the area.</p></li><li class="rd__li "><p
          class="rd__p-list-item" data-roll-name-ancestor="Silence"><span
          class="bold rd__list-item-name">Silence.</span> No sound can emanate
          from within the area, and no sound can reach into it.</p></li><li
          class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Tongues"><span class="bold
          rd__list-item-name">Tongues.</span> Creatures of any types you choose
          can communicate with any other creature in the area even if they don't
          share a common language.</p></li><li class="rd__li "><p
          class="rd__p-list-item" data-roll-name-ancestor="Vulnerability"><span
          class="bold rd__list-item-name">Vulnerability.</span> Creatures of any
          types you choose have @variantrule[Vulnerability|XPHB] to one damage
          type of your choice while in the area.</p></li></ul></div></div>
