  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>These multi-armed, humanoid kin to giants are often
        hunted for combat in the gladiatorial arenas of Athas due to their
        strength, size, and special combat abilities.</p><p>B'rohg communicate
        with one another through a series of primitive grunts and hand signals.
        Because of their low intelligence, it is impossible to teach a b'rohg
        contemporary speech. It is possible to learn the grunt and sign language
        of the b'rohg through much study; however, such communication tends to
        be limited to simple concepts. Psionic or magical communication is also
        somewhat limited due to their low intelligence - contact is still
        limited to simple ideas.</p><p>B'rohg are a throwback to simpler times.
        They are nomadic hunters and gatherers who continue to live within a
        primitive, Stone Age culture primarily because of their low
        intelligence. A b'rohg child taken and raised in a human community is
        unable to comprehend anything but primitive concepts; his lack of
        intelligence makes him unable to excel. B'rohg live in small bands
        comprised of 1-4 family units called cliques. Family units consist of
        one male, one or two females, and generally no more than four total
        offspring. Males are dominant within the family structure, but the most
        capable member regardless of gender accomplishes tasks within a band.
        The strongest in the band are primarily hunters, while the older, weaker
        members and the children are gatherers and water bearers. B'rohg have
        yet to master fire, but are not afraid of it; in fact, they are often
        attracted to it if they see the distant glow. B'rohg are scavengers, and
        their clothing often testifies to this fact. When clothed, they combine
        animal skins with "found" or discarded scraps of clothing and armor.</p>
