  details:
    biography:
      value: >-
        <p>Earth drakes are by far the physically strongest of the species. The
        gray, black, and brown reptilian creature is covered with thousands of
        small, spiny scales. The massive forelegs are designed for digging
        through solid stone. The hindlegs are equally as powerful and may also
        be used for digging, but most often serve as anchors.</p><p>Earth drakes
        tails are short but incredibly thick, which forces the monsters to
        swagger when they walk. Earth drakes' heads are wedge-shaped. The scales
        on the top of the head overlap to protect the earholes. The creature's
        eyes are inset and covered by two eyelids, a soft, inner eyelid which is
        airtight, and an outer, protective, scaly eyelid which is highly
        puncture-resistant.</p>
      public: ''
