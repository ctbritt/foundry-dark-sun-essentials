  - _id: YoJsfrVkZM46LXcp
    name: Rockslide
    type: feat
    system:
      source:
        custom: ''
        book: ENK
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The drake summons enough dirt, stones
          and boulders from the plane of earth to fill a 50-foot cube on a flat
          surface centered on a point it can see within 100 feet of it. Every
          creature within that space must make a DC 17 Dexterity saving throw.
          On a failure, they take 36 (8d8) bludgeoning damage and are buried
          under the rubble. While buried, they are prone, restrained, and can't
          breathe (see the suffocation rules in the Player's Handbook).</p><p>If
          the saving throw is successful, the creatures take half the
          bludgeoning damage and move to an empty space outside the cube. If
          there is no empty space available, they automatically fail the saving
          throw.</p><p>A buried creature is under total cover and can attempt a
          DC 17 strength (athletics) check to free themselves at the end of
          their turn. A creature outside the rubble can use their action to
          perform the same check to free the buried creature.</p></div>
