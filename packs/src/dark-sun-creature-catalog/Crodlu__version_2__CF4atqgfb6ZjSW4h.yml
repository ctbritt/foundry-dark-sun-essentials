  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Crodlu are large reptiles that roam the deserts and
        scrub land in herds. Crodlu resemble large ostriches, but their forearms
        end in wicked claws and their tough, scaly hides are yellow to red, with
        other colors along their sides and belly. They have poor eyesight and an
        excellent sense of smell. They can run at high speed for long
        periods.</p><p>Wild crodlus form small herds of about a dozen members,
        each led by a dominant female. In a given herd, females outnumber males
        and are related to one another. The dominant female's mate outranks
        other males but is otherwise part of the herd. Males leave their birth
        herd on reaching adulthood to seek a mate in another herd.</p>
