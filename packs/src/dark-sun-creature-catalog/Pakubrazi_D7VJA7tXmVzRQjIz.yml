  details:
    biography:
      value: >-
        <p>Pakubrazi are insect creatures that feed on the blood of living
        creatures. They look like crosses between giant ticks and giant
        flies.</p><p>A pakubrazi can shapechange any part or all of its body
        into humanoid form. The pakubrazi can pick the race, but not the
        individual features. The humanoid shape for each race is always the
        same, and can be recognized if seen again.</p><p>Pakubrazi are
        parasites, living off of other civilized races. They maintain a charade
        of normal life among these races, and are masterful actors. Frequently
        solitary, they are capable of cooperating in small groups. Each
        Pakubrazi or cooperative group establishes its own hunting territory.
        They defend this territory to the death.</p><p>Pakubrazi are thought to
        be a remnant of the Green Age. On rare occasions, pakubrazi blood has
        been used to intentionally taint an enemy by slipping it into his food.
        It makes a horrific form of revenge.</p>
