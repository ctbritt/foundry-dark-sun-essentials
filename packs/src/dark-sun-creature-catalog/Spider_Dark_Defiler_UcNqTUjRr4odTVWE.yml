  - _id: mxzBN7mk6ZNQG6uu
    name: Enlarge/Reduce
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '268'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>For the duration, the spell enlarges
          or reduces a creature or an object you can see within range (see the
          chosen effect below). A targeted object must be neither worn nor
          carried. If the target is an unwilling creature, it can make a
          Constitution saving throw. On a successful save, the spell has no
          effect.</p><p>Everything that a targeted creature is wearing and
          carrying changes size with it. Any item it drops returns to normal
          size at once. A thrown weapon or piece of ammunition returns to normal
          size immediately after it hits or misses a target.</p><div
          data-roll-name-ancestor="Enlarge" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Enlarge.</span></span> The target's size
          increases by one category—from Medium to Large, for example. The
          target also has @variantrule[Advantage|XPHB] on Strength checks and
          Strength saving throws. The target's attacks with its enlarged weapons
          or Unarmed Strikes deal an extra 1d4 damage on a hit.</p></div><div
          data-roll-name-ancestor="Reduce" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="2"> <span
          class="entry-title-inner">Reduce.</span></span> The target's size
          decreases by one category—from Medium to Small, for example. The
          target also has @variantrule[Disadvantage|XPHB] on Strength checks and
          Strength saving throws. The target's attacks with its reduced weapons
          or Unarmed Strikes deal 1d4 less damage on a hit (this can't reduce
          the damage below 1).</p></div></div>
