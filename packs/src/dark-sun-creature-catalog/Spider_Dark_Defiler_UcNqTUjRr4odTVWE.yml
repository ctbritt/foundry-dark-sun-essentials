  - _id: REUnleFf1WzsngGd
    name: Otiluke's Resilient Sphere
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '303'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A shimmering sphere encloses a Large
          or smaller creature or object within range. An unwilling creature must
          succeed on a Dexterity saving throw or be enclosed for the
          duration.</p><p>Nothing—not physical objects, energy, or other spell
          effects—can pass through the barrier, in or out, though a creature in
          the sphere can breathe there. The sphere is immune to all damage, and
          a creature or object inside can't be damaged by attacks or effects
          originating from outside, nor can a creature inside the sphere damage
          anything outside it.</p><p>The sphere is weightless and just large
          enough to contain the creature or object inside. An enclosed creature
          can take an action to push against the sphere's walls and thus roll
          the sphere at up to half the creature's @variantrule[Speed|XPHB].
          Similarly, the globe can be picked up and moved by other
          creatures.</p><p>A @spell[Disintegrate|XPHB] spell targeting the globe
          destroys it without harming anything inside.</p></div>
