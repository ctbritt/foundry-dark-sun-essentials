  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The magic-torn wastelands</p><p>spawn monsters so
        terrible that not even the merciful can permit them to live. Gaj
        exemplify such horrors, combining a hideous aspect with a malign
        intelligence. They crave the flesh of sentient beings, both for
        sustenance and for the delicious taste of fear.</p><p>Lore</p><p>Gaj
        dwelI in extensive burrows that interconnect to form a community but,
        aside from pain tyrants, they hunt alone or in mated pairs. Each gaj or
        pair has its own tunnels and rarely interacts with its neighbors. The
        community does band together to defend the colony, and to engage in
        group hunts led by pain tyrants. But when the larder runs low, gaj turn
        on one another-including their mates.</p><p>A gaj uses its feathery
        antennae to invade the mind ofits prey, ripping at its victim's thoughts
        and creating paralyzing terror. A gaj telepathically mocks enemies for
        their weakness and goads them to foolish action. Gaj pain tyrants are
        longer and more slender than mind hunters. Their vestigial antennae,
        though useless as limbs, compel obedience through agonizing psychic
        lashes.</p><p>Gaj are prized in arenas across the Tyr Region for their
        cunning and ferocity in battle. Thus they command a high price, and
        monster hunters take great risks to capture live
        specimens.</p><p>Encounters</p><p>Fortunately for Athasian travelers,
        gaj are rare. In the wild, they conceal themselves amid rocks and in
        defiles, luring prey into their clutches by transmitting telepathic
        cries for help.</p><p>Mindhunters are normally encountered alone or as
        arena combatants. Pain tyrants hunt in the company of other gaj or
        surround themselves with humanoid slaves.</p><p>Info</p><p>Not all who
        are hunted by the gaj are fortunate enough to die swiftly. A few end up
        as enslaved warriors defending gaj burrows, as bait for tastier meals,
        or as food stored against lean times. Overseeing these prisoners are
        specialized gaj whose vestigial antennae deliver intense psychic jolts.
        Their slaves, broken by constant psychic torment, know only obedience to
        their horrific masters. Pain tyrants fight from behind allies or slaves,
        since their most destructive powers function at a distance. A pain
        tyrant lashes a foe with Mind Wrench, then rips into the
        &amp;Reference[condition=incapacitated] creature with phrenic probe. It
        moves allies around the battlefield and does not hesitate to sacrifice
        them for any tactical advantage, no matter how minor.</p>
      public: ''
