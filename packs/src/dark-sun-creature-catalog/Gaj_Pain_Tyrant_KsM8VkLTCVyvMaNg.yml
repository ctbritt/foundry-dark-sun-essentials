          <div class="rd__b  rd__b--3"><p>The gaj targets one creature it can
          see within 30 feet of it. The target must succeed on a [[/save
          ability=wis dc=18]] saving throw or be psionically
          &amp;Reference[condition=charmed] by the gaj until the gaj dies or
          until it is on a different plane of existence from the target. The
          &amp;Reference[condition=charmed] target is under the gaj's control
          and can't take reactions, and the gaj and the target can communicate
          telepathically with each other over any distance. Whenever the
          &amp;Reference[condition=charmed] target takes damage, the target can
          repeat the saving throw. On a success, the effect ends. No more than
          once every 24 hours, the target can also repeat the saving throw when
          it is at least 1 mile away from the gaj.</p></div>
