  - _id: zunB35pPb4KN597a
    name: Black Sand
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The templar transforms the ground
          beneath his foe's feet into seething black sand. The Templar can
          change a 20 feet radius solid area located at 60 feet of him into
          black sand. Every creature in the area must succeed a [[/save
          ability=con dc=17]] saving throw or suffer 4d8 necrotic damages, 4d8
          slashing damages and be &amp;Reference[condition=restrained] for one
          minute. On a successful saving throw the creature is only suffering
          half damage and is not &amp;Reference[condition=restrained]. At the
          end of each turn a &amp;Reference[condition=restrained] creature can
          reattempt a [[/save ability=dex dc=17]] saving throw. On a success it
          frees himself. A plant or a magical plant present in the area is
          making the saving throw with disadvantage and takes maximum damages.
          All the plants in the area that are not creatures, like trees or
          cactus, instantly wither and disappear into the black sand. The area
          touched by this spell stays barren for the decades to come, unable to
          sustain life.</p></div>
