      source:
        custom: ''
        book: PHB 2024
        page: '245'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>One creature that you can see within
          range must succeed on a Charisma saving throw or be transported to a
          harmless demiplane for the duration. While there, the target has the
          &amp;Reference[condition=Incapacitated] condition. When the spell
          ends, the target reappears in the space it left or in the nearest
          unoccupied space if that space is occupied.</p><p>If the target is an
          Aberration, a Celestial, an Elemental, a Fey, or a Fiend, the target
          doesn't return if the spell lasts for 1 minute. The target is instead
          transported to a random location on a plane (DM's choice) associated
          with its creature type.</p></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> You can target one additional
          creature for each spell slot level above 4.</p></div></div>
