  - _id: KHTmk1OlhCdPFJVd
    name: Bestow Curse
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '246'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You touch a creature, which must
          succeed on a Wisdom saving throw or become cursed for the duration.
          Until the curse ends, the target suffers one of the following effects
          of your choice:</p><ul class="rd__list"><li class="rd__li ">Choose one
          ability. The target has @variantrule[Disadvantage|XPHB] on ability
          checks and saving throws made with that ability.</li><li class="rd__li
          ">The target has @variantrule[Disadvantage|XPHB] on attack rolls
          against you.</li><li class="rd__li ">In combat, the target must
          succeed on a Wisdom saving throw at the start of each of its turns or
          be forced to take the @action[Dodge|XPHB] action on that turn.</li><li
          class="rd__li ">If you deal damage to the target with an attack roll
          or a spell, the target takes an extra 1d8 damage.</li></ul></div><div
          class="rd__b  rd__b--3"><p></p><div data-roll-name-ancestor="Using a
          Higher-Level Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h
          rd__h--3" data-title-index="1"> <span class="entry-title-inner">Using
          a Higher-Level Spell Slot.</span></span> If you cast this spell using
          a level 4 spell slot, you can maintain @status[Concentration|XPHB] on
          it for up to 10 minutes. If you use a level 5+ spell slot, the spell
          doesn't require @status[Concentration|XPHB], and the duration becomes
          8 hours (level 5-6 slot) or 24 hours (level 7-8 slot). If you use a
          level 9 spell slot, the spell lasts until dispelled.</p></div></div>
