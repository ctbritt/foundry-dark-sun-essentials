  - _id: JHV4JKqMqzVaQp8A
    name: True Polymorph
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '335'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Choose one creature or nonmagical
          object that you can see within range. The creature shape-shifts into a
          different creature or a nonmagical object, or the object shape-shifts
          into a creature (the object must be neither worn nor carried). The
          transformation lasts for the duration or until the target dies or is
          destroyed, but if you maintain @status[Concentration|XPHB] on this
          spell for the full duration, the spell lasts until dispelled.</p><p>An
          unwilling creature can make a Wisdom saving throw, and if it succeeds,
          it isn't affected by this spell.</p><div
          data-roll-name-ancestor="Creature into Creature" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Creature into Creature.</span></span> If you
          turn a creature into another kind of creature, the new form can be any
          kind you choose that has a @variantrule[Challenge Rating|XPHB] equal
          to or less than the target's @variantrule[Challenge Rating|XPHB] or
          level. The target's game statistics are replaced by the stat block of
          the new form, but it retains its @variantrule[Hit Points|XPHB],
          @variantrule[Hit Point Dice|XPHB], alignment, and
          personality.</p><p>The target gains a number of @variantrule[Temporary
          Hit Points|XPHB] equal to the @variantrule[Hit Points|XPHB] of the new
          form. These @variantrule[Temporary Hit Points|XPHB] vanish if any
          remain when the spell ends. The spell ends early on the target if it
          has no @variantrule[Temporary Hit Points|XPHB] left.</p><p>The target
          is limited in the actions it can perform by the anatomy of its new
          form, and it can't speak or cast spells.</p><p>The target's gear melds
          into the new form. The creature can't use or otherwise benefit from
          any of that equipment.</p></div><div data-roll-name-ancestor="Object
          into Creature" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="2"> <span class="entry-title-inner">Object into
          Creature.</span></span> You can turn an object into any kind of
          creature, as long as the creature's size is no larger than the
          object's size and the creature has a @variantrule[Challenge
          Rating|XPHB] of 9 or lower. The creature is @variantrule[Friendly
          [Attitude]|XPHB|Friendly] to you and your allies. In combat, it takes
          its turns immediately after yours, and it obeys your
          commands.</p><p>If the spell lasts more than an hour, you no longer
          control the creature. It might remain @variantrule[Friendly
          [Attitude]|XPHB|Friendly] to you, depending on how you have treated
          it.</p></div><div data-roll-name-ancestor="Creature into Object"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="3"> <span class="entry-title-inner">Creature into
          Object.</span></span> If you turn a creature into an object, it
          transforms along with whatever it is wearing and carrying into that
          form, as long as the object's size is no larger than the creature's
          size. The creature's statistics become those of the object, and the
          creature has no memory of time spent in this form after the spell ends
          and it returns to normal.</p></div></div>
        chat: ''
