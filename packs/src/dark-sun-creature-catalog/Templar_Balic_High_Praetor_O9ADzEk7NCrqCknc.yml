  - _id: QliMEGEOoM6RQCmn
    name: Contact Other Plane
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '255'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You mentally contact a demigod, the
          spirit of a long-dead sage, or some other knowledgeable entity from
          another plane. Contacting this otherworldly intelligence can break
          your mind. When you cast this spell, make a [[/save ability=int
          dc=15]] saving throw. On a successful save, you can ask the entity up
          to five questions. You must ask your questions before the spell ends.
          The DM answers each question with one word, such as "yes," "no,"
          "maybe," "never," "irrelevant," or "unclear" (if the entity doesn't
          know the answer to the question). If a one-word answer would be
          misleading, the DM might instead offer a short phrase as an
          answer.</p><p>On a failed save, you take 6d6 damage and have the
          &amp;Reference[condition=Incapacitated] condition until you finish a
          @variantrule[Long Rest|XPHB]. A @spell[Greater Restoration|XPHB] spell
          cast on you ends this effect.</p></div>
