  - _id: w5sJlBoXXrRK8DYU
    name: Cloudkill
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '251'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create a 20-foot-radius
          @variantrule[Sphere [Area of Effect]|XPHB|Sphere] of yellow-green fog
          centered on a point within range. The fog lasts for the duration or
          until strong wind (such as the one created by @spell[Gust of
          Wind|XPHB]) disperses it, ending the spell. Its area is
          @variantrule[Heavily Obscured|XPHB].</p><p>Each creature in the
          @variantrule[Sphere [Area of Effect]|XPHB|Sphere] makes a Constitution
          saving throw, taking 5d8 damage on a failed save or half as much
          damage on a successful one. A creature must also make this save when
          the @variantrule[Sphere [Area of Effect]|XPHB|Sphere] moves into its
          space and when it enters the @variantrule[Sphere [Area of
          Effect]|XPHB|Sphere] or ends its turn there. A creature makes this
          save only once per turn.</p><p>The @variantrule[Sphere [Area of
          Effect]|XPHB|Sphere] moves 10 feet away from you at the start of each
          of your turns.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage increases by 1d8 for
          each spell slot level above 5.</p></div></div>
