          can hover. The target can enter and occupy the space of another
          creature. The target has Resistance to Bludgeoning, Piercing, and
          Slashing damage; it has Immunity to the &amp;Reference[prone
          apply=false] condition; and it has Advantage on Strength, Dexterity,
          and Constitution saving throws. The target can pass through narrow
          openings, but it treats liquids as though they were solid surfaces.
          The target can't talk or manipulate objects, and any objects it was
          carrying or holding can't be dropped, used, or otherwise interacted
          with. Finally, the target can't attack or cast spells.
