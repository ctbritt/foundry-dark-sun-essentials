  details:
    biography:
      value: >-
        <p>Every being on Athas fears the Dragon of Tyr, from the lowliest
        slaves to the mightiest sorcerer kings. The Dragon swoops in
        periodically to demand tribute, claiming its tithe of slaves and
        treasure and taking them into the desert. It feels neither fear nor
        doubt, and it kills, steals, and destroys what it wants, when it
        wants.</p><p>Fortunately, there is only one dragon in the Tyr Region,
        and perhaps in the entire world of Athas.</p><p>It is tall and thin,
        with a gnarled bone structure and swollen, bulbous joints. Its
        appearance is reptilian in many ways: it has a long, snake-like neck,
        whip-like tail, and scaly hide. Yet it walks on two legs, its hands have
        long, well-developed fingers and thumbs, its bone structure seems
        faintly humanoid, and its head is long and narrow, with a distinctly
        mammalian appearance.</p>
      public: ''
