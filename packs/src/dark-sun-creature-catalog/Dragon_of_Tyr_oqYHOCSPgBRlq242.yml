  - _id: UW0YH4NgUMEDKOPV
    name: Innate Spellcasting (Psionic)
    type: feat
    system:
      source:
        custom: ''
        book: ENK
        page: '20'
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Innate Spellcasting (Psionic)" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Innate Spellcasting (Psionic).</span></span>
          The dragon is a 20th-level psionicist. Its innate spellcasting ability
          is Intelligence (spell save DC <span class="rd__dc">26</span>; +18 to
          hit with spell attacks). It can innately cast the following spells,
          requiring no components:</p><ul class="rd__list
          rd__list-hang-notitle"><li class="rd__li  rd__li-spell"><p>At will:
          @UUID[.v61xUmhWe0nFXUxS], @UUID[.HQ3oGi72VBWeC7BY] (4d6),
          @UUID[.GDTITd9pFpMQ7IY8], @UUID[.D4IPUwajPbWlVZKK],
          @UUID[.AEXCNW6161OhMg1E], @UUID[.JYkUPY0nu5VeoMdF] (4d6),
