      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The dragon stomps one of its feet at a
          point on the ground within 20 feet of it. Any creature in a
          5-foot-radius, 15-foot-high cylinder centered on this point must
          succeed on a [[/save ability=dex dc=28]] saving throw or take 18
          (3d10) bludgeoning damage and fall &amp;Reference[condition=prone].
          Until the dragon uses its Stomp again or moves, the creature is
          &amp;Reference[condition=restrained]. While
          &amp;Reference[condition=restrained] in this way, the creature (or
          another creature within 5 feet of it) can use its action to make a
          [[/save ability=str dc=28]] check. On a success, the creature
          relocates to an unoccupied space of its choice within 5 feet of the
          dragon and is no longer
          &amp;Reference[condition=restrained].</p></div>
