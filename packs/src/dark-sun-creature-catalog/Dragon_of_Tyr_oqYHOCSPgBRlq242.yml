        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The dragon has 20 sorcery points. It
          can spend 1 or more sorcery points as a bonus action to gain one of
          the following benefits when casting a spell from its innate
          spellcasting (psionics) feature:</p><p>Distant Spell (1 point): When
          it casts a spell that has a range of 5 feet or greater, the dragon can
          double the range of the spell. When it casts a spell that has a range
          of touch, the dragon can make the range of the spell 30
          feet.</p><p>Heightened Spell (3 points): When it casts a spell that
          forces a creature to make a saving throw to resist the spell’s
          effects, the dragon gives one target of the spell disadvantage on its
          first saving throw against the spell.</p><p>Subtle Spell (1 point):
          When the dragon casts a spell, it can cast the spell without any
          somatic or verbal components.</p><p>Transmute Spell (1 point): When it
          casts a spell that deals a type of damage from the following list, the
          dragon can change that damage type to one of the other listed types:
          acid, cold, fire, lightning, poison, thunder.</p></div>
