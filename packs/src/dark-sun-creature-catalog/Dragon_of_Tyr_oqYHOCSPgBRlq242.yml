      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create an
          &amp;Reference[condition=Invisible] sensor within range in a location
          familiar to you (a place you have visited or seen before) or in an
          obvious location that is unfamiliar to you (such as behind a door,
          around a corner, or in a grove of trees). The intangible, invulnerable
          sensor remains in place for the duration.</p><p>When you cast the
          spell, choose seeing or hearing. You can use the chosen sense through
          the sensor as if you were in its space. As a @variantrule[Bonus
          Action|XPHB], you can switch between seeing and hearing.</p><p>A
          creature that sees the sensor (such as a creature benefiting from
          @spell[See Invisibility|XPHB] or &amp;Reference[rule=Truesight]) sees
          a luminous orb about the size of your fist.</p></div>
