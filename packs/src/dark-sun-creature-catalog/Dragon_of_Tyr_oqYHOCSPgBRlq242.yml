  - _id: hPjhCggwXd6ejnpS
    name: Enervation
    type: spell
    system:
      source:
        custom: ''
        book: XGE
        page: '155'
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A tendril of inky darkness reaches out
          from you, touching a creature you can see within range to drain life
          from it. The target must make a Dexterity saving throw. On a
          successful save, the target takes 2d8 damage, and the spell ends. On a
          failed save, the target takes 4d8 damage, and until the spell ends,
          you can use your action on each of your turns to automatically deal
          4d8 damage to the target. The spell ends if you use your action to do
          anything else, if the target is ever outside the spell's range, or if
