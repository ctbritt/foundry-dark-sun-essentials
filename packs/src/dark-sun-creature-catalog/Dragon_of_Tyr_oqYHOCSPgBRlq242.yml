  - _id: E8TWgAbwXPqjytKv
    name: Mass Suggestion
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '296'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You suggest a course of
          activity—described in no more than 25 words—to twelve or fewer
          creatures you can see within range that can hear and understand you.
          The suggestion must sound achievable and not involve anything that
          would obviously deal damage to any of the targets or their allies. For
          example, you could say, "Walk to the village down that road, and help
          the villagers there harvest crops until sunset." Or you could say,
          "Now is not the time for violence. Drop your weapons, and dance! Stop
          in an hour."</p><p>Each target must succeed on a Wisdom saving throw
          or have the &amp;Reference[condition=Charmed] condition for the
          duration or until you or your allies deal damage to the target. Each
          &amp;Reference[condition=Charmed] target pursues the suggestion to the
          best of its ability. The suggested activity can continue for the
          entire duration, but if the suggested activity can be completed in a
          shorter time, the spell ends for a target upon completing
          it.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The duration is longer with a
          spell slot of level 7 (10 days), 8 (30 days), or 9 (366
          days).</p></div></div>
