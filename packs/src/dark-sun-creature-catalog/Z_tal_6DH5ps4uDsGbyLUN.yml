  details:
    biography:
      value: >-
        <p>Z'tal are small, upright lizards that hop in shepherded leaps across
        Athas. They are very stupid and are known to stampede when
        panicked.</p><p>Z'tal jump wherever they go on powerful hind legs that
        end in sharp talons. Their small head is rounded in the back with a
        sharp, hard point on the end. Their long, thick tail is used for balance
        when they hop. The vestigial forearms and claws are seldom used. Varying
        in shades of tans and browns, z'tal are covered by sharp, feather-like
        scales.</p><p>Z'tal constantly make a series of chirps, squeaks, and
        squawks. These noises are intended predominantly to keep the herd within
        a single area. When threatened, z'tal scream and run.</p>
      public: ''
