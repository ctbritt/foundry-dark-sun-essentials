    name: Lightning Arrow
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '292'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>As your attack hits or misses the
          target, the weapon or ammunition you're using transforms into a
          lightning bolt. Instead of taking any damage or other effects from the
          attack, the target takes 4d8 damage on a hit or half as much damage on
          a miss. Each creature within 10 feet of the target then makes a
          Dexterity saving throw, taking 2d8 damage on a failed save or half as
          much damage on a successful one.</p><p>The weapon or ammunition then
          returns to its normal form.</p></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage for both effects of
          the spell increases by 1d8 for each spell slot level above
          3.</p></div></div>
