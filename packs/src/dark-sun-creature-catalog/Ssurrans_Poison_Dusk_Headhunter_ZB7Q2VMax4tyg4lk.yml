  - _id: GE0tfj4kgXAYCc1D
    name: Conjure Animals
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '254'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You conjure nature spirits that appear
          as a Large pack of spectral, intangible animals in an unoccupied space
          you can see within range. The pack lasts for the duration, and you
          choose the spirits' animal form, such as wolves, serpents, or
          birds.</p><p>You have @variantrule[Advantage|XPHB] on Strength saving
          throws while you're within 5 feet of the pack, and when you move on
          your turn, you can also move the pack up to 30 feet to an unoccupied
          space you can see.</p><p>Whenever the pack moves within 10 feet of a
          creature you can see and whenever a creature you can see enters a
          space within 10 feet of the pack or ends its turn there, you can force
          that creature to make a Dexterity saving throw. On a failed save, the
          creature takes 3d10 damage. A creature makes this save only once per
          turn.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage increases by 1d10
          for each spell slot level above 3.</p></div></div>
