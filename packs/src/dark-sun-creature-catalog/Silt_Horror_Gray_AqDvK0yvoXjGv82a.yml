  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Beneath the churning dust</p><p>of the Sea of Silt lurk
        the ruins of lost civilizations and the relics of distant ages. The
        creatures that dwelled in these forgotten cities are gone, their bones
        now dust and ash. Yet these ruins are not as empty as many would
        believe. Strange creatures swim in the sea's depths, tentacled horrors
        whose appetites for flesh are matched only by their enormous, grotesque
        forms.</p><p>Lore</p><p>The most common silt horrors are the ones
        lurking closest to shore; these are characterized by their pale white
        tentacles. Explorers who venture out into the Sea of Silt sometimes
        bring reports of larger, more dangerous breeds. Such stories include
        forests of brown or gray tentacles, horrors so large they dwarf the
        city-states, and other tales where the winds and silt turned against the
        traveler, closing off retreat and funneling victims back into the
        tentacles' reach.</p><p>Encounters</p><p>Anyone who braves the Sea of
        Silt risks an encounter with these creatures. Silt horrors react to
        disturbances in the dust and creep along under the sand, undetected
        until they can strike. Giants often fall prey to silt horrors, as do
        passing ships and other vessels. While a flying creature can usually
        pass overhead without attracting a silt horror, any creatures that fly
        too close to the dust might invite an attack.</p><p>Info</p><p>The gray
        horror is a sickly gray in color, and has six sharp-edged tentacles.
        Gray horrors consider anything that they can sense as prey. Of all the
        silt horror they are the craftiest, using their natural psionic ability
        to hunt. The gray horror attempts to lure its victim to it, changing
        winds to direct a prey in the direction of its choosing and creating
        sounds that are similar to whimpering sounds and the sounds of
        water.</p>
