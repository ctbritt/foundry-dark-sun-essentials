  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Fire drakes are the most evil and malicious of the
        drakes. They enjoy inflicting pain for the pleasure of watching their
        victims writhe in agony. A fire drake's greatest delight comes from
        torturing a potential meal.</p><p>Fire drakes are large, spiny,
        reptilian creatures with pebble like skin. Each pebble is actually a
        scale. They are red-and-black mottled, similar in color to the dying
        embers of a fire, and their skin is very glossy. Fire drakes have four
        legs. The front two are smaller with very sharp claws, while the back
        legs are longer and thicker.</p><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Lair Actions" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="1"> <span
        class="entry-title-inner">Lair Actions</span></h3> <p>On initiative
        count 20 (losing initiative ties), the drake takes a lair action to
        cause one of the following effects; the drake can't use the same effect
        two rounds in a row:</p><ul class="rd__list"><li class="rd__li
        ">Volcanic gases form a cloud in a 20-foot-radius sphere centered on a
        point the drake can see within 120 feet of it. The sphere spreads around
        corners, and its area is lightly obscured. It lasts until initiative
        count 20 on the next round. Each creature that starts its turn in the
        cloud must succeed on a DC 13 Constitution saving throw or be poisoned
        until the end of its turn. While poisoned in this way, a creature is
        incapacitated.</li><li class="rd__li ">Magma erupts from a point on the
        ground the drake can see within 120 feet of it, creating a 20-foot-high,
        5-foot-radius geyser. Each creature in the geyser's area must make a DC
        15 Dexterity saving throw, taking 10 (3d6) fire damage on a failed save,
        or half as much damage on a successful one.</li><li class="rd__li ">The
        drake creates a wall of fire on a solid surface within 120 feet of it.
        The wall can be up to 60 feet long, 20 feet high, and 1 foot thick, or a
        ringed wall up to 20 feet in diameter, 20 feet high, and 1 foot thick.
        The wall is opaque and lasts until initiative count 20 on the next
        round. When the wall appears, each creature within its area must make a
        DC 15 Dexterity saving throw. On a failed save, a creature takes 10
        (3d6) fire damage, or half as much damage on a successful save. Wall
        deals 10 (3d6) fire damage to each creature that ends its turn within 5
        feet of wall or inside the wall. A creature takes the same damage when
        it enters the wall for the first time on a turn or ends its turn
        there.</li></ul></div></div><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Regional Effects" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="2"> <span
        class="entry-title-inner">Regional Effects</span></h3> <p>The region
        containing a fire drake's lair is warped by the drake's power, which
        creates one or more of the following effects:</p><ul
        class="rd__list"><li class="rd__li ">Water sources within 1 mile of the
        lair are supernaturally warm and tainted by sulfur.</li><li
        class="rd__li ">Rocky fissures within 1 mile of the drake's lair form
        portals to the Elemental Plane of Fire, allowing creatures of elemental
        fire into the world to dwell nearby.</li></ul><p>If the drake dies,
        these effects fade over the course of 1d10 days.</p></div></div>
