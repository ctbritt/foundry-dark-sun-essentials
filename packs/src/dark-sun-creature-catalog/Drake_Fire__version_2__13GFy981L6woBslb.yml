          lair is warped by the drake's power, which creates one or more of the
          following effects:</p><ul class="rd__list"><li class="rd__li ">Water
          sources within 1 mile of the lair are supernaturally warm and tainted
          by sulfur.</li><li class="rd__li ">Rocky fissures within 1 mile of the
          drake's lair form portals to the Elemental Plane of Fire, allowing
          creatures of elemental fire into the world to dwell
