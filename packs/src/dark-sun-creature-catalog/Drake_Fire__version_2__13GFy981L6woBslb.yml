          lasts until initiative count 20 on the next round. When the wall
          appears, each creature within its area must make a DC 15 Dexterity
          saving throw. On a failed save, a creature takes 10 (3d6) fire damage,
          or half as much damage on a successful save. Wall deals 10 (3d6) fire
          damage to each creature that ends its turn within 5 feet of wall or
