      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Melee or Ranged Weapon Attack: +6 to
          hit, reach 5 ft., or 10 ft if held in one hand only, and range 15/40
          ft., one target. Hit: 10 (2d6+3) piercing damage. If used as a ranged
          weapon against one Large or smaller creature, the cahulak wraps around
          the creature. The target is restrained until it escapes the cahulak.
          Any creature can use its action to make a DC 10 Strength check to free
          itself or another creature wrapped by the cahulak, ending the effect
          on a success. Dealing 5 slashing damage to the cahulak (AC 10)
          destroys the cahulak and frees the target.</p></div>
