  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>Fallen Sphinxes, whether through the
        weariness of the ages, corrupted by the slaughter of innocents, or
        dreams of worship by supplicants that attempt to bargain their way to
        knowledge, protosphinxes broke free of their divine command. Once freed
        of their servitude to the forgotten gods of Athas many sphinxs became
        protosphinx, abandoning their divine mission to become above all else,
        aggressive and animalistic creatures who lives up to the vicious
        reputation of their patron animal, the large and violent
        crocodile.</p><p>However, even if a sphinx's alignment and loyalties
        drift in this way, it never leaves the place it guards or grants its
        secrets to any except creatures it deem's worthy. Despite their feral
        appearances and their obvious cruelty protosphinxes are clever
        manipulators that still obey to old divine laws. They follow the
        tradition of magical tests, expecting the failure of the contestant and
        an easy meal. However, they always make sure that one of them escape
        alive so the tell of their buried treasure keeps spreading and food
        keeps coming.</p><p>In some reagions of the desert they are seen as
        cruel but benevolent patron, protecting a community and helping it
        prosper with its magic in exchange of frequent and bloody
        sacrifices.</p><p>Some protosphinx are plainly mad, vicious creatures
        that do not obey any of their specie's dogma. These sphinxes are the
        ones that have been played by explorers and adventurers, cheated of
        their treasure or secrets in a deceitful way. They succumb to madness
        without the support of their deity and quickly after transform into a
        protosphinx, only driven by vengeance. The only way to appease the
        monster is to retrieve its treasure or to make sure its secret is safe
        once again.</p><p>Encounter</p><p>Protosphinxes can be found all over
        Athas, guarding forgotten temples where no worship has been uttered in
        millenias, watching over treasure rooms in lost cities. The Tablelands
        are famous for the high number of ruins that can be found there, and
        therefor protosphinxes are more common in this region. The south of the
        Great Alluvial Sand Wastes, getween the Giant's Ribs Mountains and the
        Screaming Ravine is known to be the home of at least two of this
        monstrosity, but none has been brave enough to follow the creatures to
        their lair and discover what could have spawn two of them.</p><p>The
        most famous of the protosphinx is certainly Munakhtmou, lurking in the
        ruins of Balshara, at the foot of the Black Spine Mountains. Munakhtmou
        is known to keep no treasure or secret, but instead receive the worship
        of a growing community of escaped slaves, nomads and sheperds. The
        sphinx receives the sacrifices of intelligent humanoid and in exchange
        uses his magic to fertilise the land and defend the community against
        raiders and slavers.</p><p>A sphinx presides over an ancient temple,
        sepulcher, or vault, within which are hidden divine secrets and
        treasures beyond the reach of mortals. On initiative count 20 (losing
        initiative ties), the sphinx can take a lair action to cause one of the
        following magical effects; the sphinx can't use an effect again until it
        finishes a short or long rest:</p><ul class="rd__list"><li class="rd__li
        ">The flow of time is altered such that every creature in the lair must
        reroll initiative. The sphinx can choose not to reroll.</li><li
        class="rd__li ">The effects of time are altered such that every creature
        in the lair must succeed on a DC 15 Constitution saving throw or become
        1d20 years older or younger (the sphinx's choice), but never any younger
        than 1 year old. A greater restoration spell can restore a creature's
        age to normal.</li><li class="rd__li ">The flow of time within the lair
        is altered such that everything within moves up to 10 years forward or
        backward (sphinx's choice). Only the sphinx is immediately aware of the
        time change. A wish spell can return the caster and up to seven other
        creatures designated by the caster to their normal time.</li><li
        class="rd__li ">The sphinx shifts itself and up to seven other creatures
        it can see within in its lair to another plane of existence. Once
        outside its lair, the sphinx can't use lair actions, but it can return
        to its lair as a bonus action on its turn, taking up to seven creatures
        with it.</li></ul>
