  - _id: dUrheck4aUmfa5iE
    name: Antimagic Field
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '241'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>An aura of antimagic surrounds you in
          10-foot @variantrule[Emanation [Area of Effect]|XPHB|Emanation]. No
          one can cast spells, take @action[Magic|XPHB] actions, or create other
          magical effects inside the aura, and those things can't target or
          otherwise affect anything inside it. Magical properties of magic items
          don't work inside the aura or on anything inside it.</p><p>Areas of
          effect created by spells or other magic can't extend into the aura,
          and no one can teleport into or out of it or use planar travel there.
          Portals close temporarily while in the aura.</p><p>Ongoing spells,
          except those cast by an Artifact or a deity, are suppressed in the
          area. While an effect is suppressed, it doesn't function, but the time
          it spends suppressed counts against its duration.</p><p>@spell[Dispel
          Magic|XPHB] has no effect on the aura, and the auras created by
          different @spell[Antimagic Field|XPHB] spells don't nullify each
          other.</p></div>
        chat: ''
      level: 8
      school: abj
