      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You utter a word imbued with power
          from the Upper Planes. Each creature of your choice in range makes a
          Charisma saving throw. On a failed save, a target that has 50
          @variantrule[Hit Points|XPHB] or fewer suffers an effect based on its
          current @variantrule[Hit Points|XPHB], as shown in the Divine Word
          Effects table. Regardless of its @variantrule[Hit Points|XPHB], a
          Celestial, an Elemental, a Fey, or a Fiend target that fails its save
          is forced back to its plane of origin (if it isn't there already) and
          can't return to the current plane for 24 hours by any means short of a
          @spell[Wish|XPHB] spell.</p><table class="w-100 rd__table 
          stripe-odd-table" data-roll-name-ancestor="Divine Word
