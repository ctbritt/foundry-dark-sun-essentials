  - _id: v2gpIibfhWdmhLG8
    name: Speak with Plants
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '319'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You imbue plants in an immobile
          30-foot @variantrule[Emanation [Area of Effect]|XPHB|Emanation] with
          limited sentience and animation, giving them the ability to
          communicate with you and follow your simple commands. You can question
          plants about events in the spell's area within the past day, gaining
          information about creatures that have passed, weather, and other
          circumstances.</p><p>You can also turn @variantrule[Difficult
          Terrain|XPHB] caused by plant growth (such as thickets and
          undergrowth) into ordinary terrain that lasts for the duration. Or you
          can turn ordinary terrain where plants are present into
          @variantrule[Difficult Terrain|XPHB] that lasts for the
          duration.</p><p>The spell doesn't enable plants to uproot themselves
          and move about, but they can move their branches, tendrils, and stalks
          for you.</p><p>If a Plant creature is in the area, you can communicate
          with it as if you shared a common language.</p></div>
