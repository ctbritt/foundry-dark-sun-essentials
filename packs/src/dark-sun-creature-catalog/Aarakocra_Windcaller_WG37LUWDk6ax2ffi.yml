          that can be dispersed by strong wind.</li><li class="rd__li ">The area
          is &amp;Reference[rule=difficultterrain]{difficult terrain} for
          creatures other than you.</li><li class="rd__li ">The attack rolls of
          ranged weapon attacks have disadvantage if the attacks pass in or out
          of the wind.</li></ul></div>
