          <div class="rd__b  rd__b--3"><p>The aarakocra chose a 5ft radius that
          he can see at 60ft of him. Each creature in the area must make a
          [[/save ability=str dc=13]] saving throw. On a failure, a target takes
          15 (3d8 + 2) damage and is flung up 20 feet away from the area in a
          random direction and knocked &amp;Reference[condition=prone]. If a
          thrown target strikes an object, such as a wall or floor, the target
          takes 3 (1d6) damage for every 10 feet it was thrown. If the target is
          thrown at another creature, that creature must succeed on a [[/save
          ability=dex dc=13]] saving throw or take the same damage and be
          knocked &amp;Reference[condition=prone]. If the saving throw is
          successful, the target takes half the bludgeoning damage and isn't
          flung away or knocked &amp;Reference[condition=prone].</p></div>
