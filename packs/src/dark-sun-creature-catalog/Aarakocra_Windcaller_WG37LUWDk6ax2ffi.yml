  - _id: t0LcrtoHjuZalh9i
    name: Freedom of Movement
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '277'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You touch a willing creature. For the
          duration, the target's movement is unaffected by
          @variantrule[Difficult Terrain|XPHB], and spells and other magical
          effects can neither reduce the target's @variantrule[Speed|XPHB] nor
          cause the target to have the &amp;Reference[condition=Paralyzed] or
          &amp;Reference[condition=Restrained] conditions. The target also has a
          @variantrule[Swim Speed|XPHB] equal to its
          @variantrule[Speed|XPHB].</p><p>In addition, the target can spend 5
          feet of movement to automatically escape from nonmagical restraints,
          such as manacles or a creature imposing the
          &amp;Reference[condition=Grappled] condition on it.</p></div><div
          class="rd__b  rd__b--3"><p></p><div data-roll-name-ancestor="Using a
          Higher-Level Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h
          rd__h--3" data-title-index="1"> <span class="entry-title-inner">Using
          a Higher-Level Spell Slot.</span></span> You can target one additional
          creature for each spell slot level above 4.</p></div></div>
