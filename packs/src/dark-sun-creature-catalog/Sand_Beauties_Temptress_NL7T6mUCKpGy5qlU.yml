      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>For the duration, magical
          @variantrule[Darkness|XPHB] spreads from a point within range and
          fills a 15-foot-radius @variantrule[Sphere [Area of
          Effect]|XPHB|Sphere]. &amp;Reference[rule=Darkvision] can't see
          through it, and nonmagical light can't illuminate
          it.</p><p>Alternatively, you cast the spell on an object that isn't
          being worn or carried, causing the @variantrule[Darkness|XPHB] to fill
          a 15-foot @variantrule[Emanation [Area of Effect]|XPHB|Emanation]
          originating from that object. Covering that object with something
          opaque, such as a bowl or helm, blocks the
          @variantrule[Darkness|XPHB].</p><p>If any of this spell's area
          overlaps with an area of @variantrule[Bright Light|XPHB] or
          @variantrule[Dim Light|XPHB] created by a spell of level 2 or lower,
