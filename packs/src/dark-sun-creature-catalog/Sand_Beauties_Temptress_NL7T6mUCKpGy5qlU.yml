  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Fey creatures</p><p>said to come from the Lands Within
        the Wind, sand beauties are mysterious creatures coming from another
        plane of existence. Sand Beauties is a general term to refer to nymphs,
        female fey potentially good or malevolent.</p><p>Info</p><p>Once
        strongly tied to arcane magic, this type of nymph are now corrupted by
        the defilement of Athas. Temptress were once vibrant and benevolent fey
        creatures, but the exile from their slowly disintegrating homeland has
        driven them to madness.</p><p>Temptresses despise intelligent creatures,
        blaming them for their wretched state. Still, they are masters at
        controlling their hatred long enough to lure their prey. Among their own
        kind, they are social creatures. One or more of these fey wander an area
        around their lair, searching for enemies. They target individuals or
        groups that are clearly short on water and suffering the desert's worst
        effects. If the sand brides think they can't take on a large party, one
        among their number might follow for a time to lure any stragglers back
        to the lair.</p><p>Info</p><p>A sand bride fashions lures for its
        victims, seducing travelers, wanderers, and the lost with the promise of
        water or the soothing shade of an unexpected oasis. Once the prey comes
        close, the sand bride appears as a beautiful, inviting being, the
        embodiment of desire and comfort. If the creature responds to the sand
        bride's call, the monster attacks. The twisted fey drains its prey's
        life force and leaves behind a withered husk.</p>
