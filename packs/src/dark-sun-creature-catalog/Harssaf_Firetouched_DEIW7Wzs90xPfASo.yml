        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create six tiny meteors in your
          space. They float in the air and orbit you for the spell's duration.
          When you cast the spell—and as a bonus action on each of your turns
          thereafter—you can expend one or two of the meteors, sending them
          streaking toward a point or points you choose within 120 feet of you.
          Once a meteor reaches its destination or impacts against a solid
          surface, the meteor explodes. Each creature within 5 feet of the point
          where the meteor explodes must make a Dexterity saving throw. A
          creature takes 2d6 damage on a failed save, or half as much damage on
          a successful one.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="At Higher Levels" class="rd__b 
