          its turns, the target repeats the saving throw. It takes 4d6 damage on
          a failed save, and the spell ends on a successful one. These magical
          flames can't be extinguished by nonmagical means.</p><p>If damage from
          this spell kills a target, the target is turned to ash.</p></div>
