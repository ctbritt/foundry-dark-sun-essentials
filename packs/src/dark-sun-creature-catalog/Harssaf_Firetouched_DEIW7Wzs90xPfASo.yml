  - _id: Wwg9JTjHo6CsQEKw
    name: Wall of Fire
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '338'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create a wall of fire on a solid
          surface within range. You can make the wall up to 60 feet long, 20
          feet high, and 1 foot thick, or a ringed wall up to 20 feet in
          diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts
          for the duration.</p><p>When the wall appears, each creature in its
          area makes a Dexterity saving throw, taking 5d8 damage on a failed
          save or half as much damage on a successful one.</p><p>One side of the
          wall, selected by you when you cast this spell, deals 5d8 damage to
          each creature that ends its turn within 10 feet of that side or inside
          the wall. A creature takes the same damage when it enters the wall for
          the first time on a turn or ends its turn there. The other side of the
          wall deals no damage.</p></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage increases by 1d8 for
          each spell slot level above 4.</p></div></div>
