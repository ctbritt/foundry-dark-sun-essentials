  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Aggressive savages</p><p>of Athas's hilly and
        mountainous regions, tareks are the bane of borderland communities.
        Xenophobic, hateful and hostile, tareks frequently find themselves in
        conflict with the other races of the Tablelands. A tarek is so fierce in
        its love of life that it can continue to fight when lesser races would
        have succumbed to their wounds.</p><p>Lore</p><p>According to legend, an
        entity of mad destruction created the tareks. These fierce warriors
        served as its instruments of murder and destruction. The earth shamans
        eventually led the tareks in revolt against their maker.</p><p>Tareks
        are muscle-bound brutes that are known for their great constitution and
        will to live. They look dull-witted, with their squared heads with
        sloping foreheads, and are about as smart as the average half giant.
        Their features lend them a fearsome presence that has earned them a
        well-deserved reputation as dangerous foes. Tareks have a distinct musky
        odor that can be detected from as far away as 30 ft.</p><p>Tareks are
        children of the earth and have been known to wage great wars against the
        gith, with whom they compete for territory and whom they see as defiling
        the earth by their very presence. They also hate elves because of their
        association with magic and its effect upon the earth they hold so
        sacred. Tareks place great value in honor and physical prowess. For a
        tarek, Strength is a fundamental issue. The raw, competitive nature of
        their lives means that a tarek must be aware of his position in the
        tribe at any given time and this position is determined through physical
        contest. When joining a group, it is quite normal to expect the
        uneducated tarek to use physical force to determine his place in things.
        The more cosmopolitan among the species have learned that other races
        sometimes take offence at this behavior.</p><p>The tarek language is
        much like that of the dwarves harsh and guttural, and very fearsome in
        tone. Non-tarek speakers have been known to suffer from throat pains
        after half an hour of speaking the tongue. Tareks are fiercely
        protective of their language and proud of the strength needed to speak
        it. Tareks will teach their language to other races, but the pupil
        normally has to undergo the regular tarek method of assessment first in
        order to determine his worth (i.e.: a
        beating).</p><p>Encounters</p><p>Tarek communities often support
        themselves by raiding, and visitors are not welcome. Unless a group of
        visitors includes an obvious elemental earth cleric, the tareks will
        attempt to drive them away. In rare instances, members of a community
        will be sent out to trade with a merchant caravan, but few traders will
        blindly conduct business with these representatives. More often than
        not, such representatives are a decoy for an unseen raiding
        party.</p><p>Info</p><p>Tareks revere earth shamans for being both sages
        and warriors. Earth shamans sometimes give an enchanted weapon to the
        most virile of the tribe's leaders, signaling a new chief among the
        people.</p>
