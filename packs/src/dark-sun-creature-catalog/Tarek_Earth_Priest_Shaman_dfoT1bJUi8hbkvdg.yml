  - _id: cxBDiKM9iNpBAXFh
    name: Meld into Stone
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '296'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You step into a stone object or
          surface large enough to fully contain your body, merging yourself and
          your equipment with the stone for the duration. You must touch the
          stone to do so. Nothing of your presence remains visible or otherwise
          detectable by nonmagical senses.</p><p>While merged with the stone,
          you can't see what occurs outside it, and any Wisdom
          (&amp;Reference[skill=Perception]) checks you make to hear sounds
          outside it are made with @variantrule[Disadvantage|XPHB]. You remain
          aware of the passage of time and can cast spells on yourself while
          merged in the stone. You can use 5 feet of movement to leave the stone
          where you entered it, which ends the spell. You otherwise can't
          move.</p><p>Minor physical damage to the stone doesn't harm you, but
          its partial destruction or a change in its shape (to the extent that
          you no longer fit within it) expels you and deals 6d6 damage to you.
          The stone's complete destruction (or transmutation into a different
          substance) expels you and deals 50 Force damage to you. If expelled,
          you move into an unoccupied space closest to where you first entered
          and have the &amp;Reference[condition=Prone] condition.</p></div>
