  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Often mistaken for an outcropping of rock, earth drakes
        are by far the physically strongest of the species. The gray, black, and
        brown reptilian creature is covered with thousands of small, spiny
        scales. The massive forelegs are designed for digging through solid
        stone. The hindlegs are equally as powerful and may be used for digging,
        but most often serve as anchors. Earth drakes' tails are short but
        incredibly thick, which forces the monsters to swagger when they
        walk.</p><p>Earth drakes' heads are wedge-shaped. The scales on the top
        of the head overlap to protect the earholes. The creature's eyes are
        inset and covered by two eyelids - a soft, inner eyelid that is
        airtight, and an outer, protective, scaly eyelid that is highly
        puncture-resistant.</p><p>Earth drakes resent the encroachments of
        humanity, and they especially dislike any type of permanent buildings.
        An earth drake thinks nothing of travelling many miles in order to
        destroy man-made settlements.</p><p>Earth drakes enjoy a battle before a
        meal. The more fight a creature puts up, the better the drake will enjoy
        eating it. Earth drakes are known to dig themselves in along trading
        routes for opportunities to do battle and dine on mekillots.</p><p>AN
        EARTH DRAKE'S LAIR</p><p>Whether they dig into the bedrock beneath the
        sands of the Athasian desert or into a hillside, earth drakes always
        cover the front of their habitat with loose dirt. This creates a
        collapsible front entrance which the earth drake uses to defend its
        lair.</p><div class="rd__b  rd__b--1"><div data-roll-name-ancestor="Lair
        Actions" class="rd__b  rd__b--2"><h3 class="rd__h rd__h--2"
        data-title-index="1"> <span class="entry-title-inner">Lair
        Actions</span></h3> <p>On initiative count 20 (losing initiative ties),
        the drake takes a lair action to cause one of the following effects; the
        drake can't use the same effect two rounds in a row:</p><ul
        class="rd__list"><li class="rd__li ">Part of the ceiling collapses above
        one creature that the drake can see within 120 feet of it. The creature
        must succeed on a DC 15 Dexterity saving throw or take 10 (3d6)
        bludgeoning damage and be knocked prone and buried. The buried target is
        restrained and unable to breathe or stand up. A creature can take an
        action to make a DC 10 Strength check, ending the buried state on a
        success.</li><li class="rd__li ">A tremor shakes the lair in a 60-foot
        radius around the drake. Each creature other than the drake on the
        ground in that area must succeed on a DC 15 Dexterity saving throw or be
        knocked prone.</li><li class="rd__li ">The drake creates a wall of dirt,
        stones, and boulders from the elemental plane of earth on a solid
        surface it can see within 120 feet of it. The wall can be up to 30 feet
        long, 30 feet high, and 1 foot thick. When the wall appears, each
        creature within its area is pushed 5 feet out of the wall's space;
        appearing on whichever side of the wall, it wants. Each 10-foot section
        of the wall has AC 13, 20 hit points, resistance to all damage and
        immunity to acid, cold, necrotic, poison, and psychic damage. The wall
        disappears when the drake uses this lair action again or when the drake
        dies.</li></ul></div></div><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Regional Effects" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="2"> <span
        class="entry-title-inner">Regional Effects</span></h3> <p>The region
        containing an earth drake's lair is warped by the drake's power, which
        creates one or more of the following effects:</p><ul
        class="rd__list"><li class="rd__li ">Small earthquakes are common within
        6 miles of the drake's lair.</li><li class="rd__li ">Rocky fissures
        within 1 mile of the drake's lair form portals to the Elemental Plane of
        Earth, allowing creatures of elemental earth into the world to dwell
        nearby.</li></ul><p>If the drake dies, these effects fade over the
        course of 1d10 days.</p></div></div>
