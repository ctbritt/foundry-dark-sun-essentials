  - _id: rCFB27PTNfQKXsvQ
    name: Earthquake
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '267'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Choose a point on the ground that you
          can see within range. For the duration, an intense tremor rips through
          the ground in a 100-foot-radius circle centered on that point. The
          ground there is @variantrule[Difficult Terrain|XPHB].</p><p>When you
          cast this spell and at the end of each of your turns for the duration,
          each creature on the ground in the area makes a Dexterity saving
          throw. On a failed save, a creature has the
          &amp;Reference[condition=Prone] condition, and its
          @status[Concentration|XPHB] is broken.</p><p>You can also cause the
          effects below.</p><div data-roll-name-ancestor="Fissures"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span
          class="entry-title-inner">Fissures.</span></span> A total of 1d6
          fissures open in the spell's area at the end of the turn you cast it.
          You choose the fissures' locations, which can't be under structures.
          Each fissure is 1d10 × 10 feet deep and 10 feet wide, and it extends
          from one edge of the spell's area to another edge. A creature in the
          same space as a fissure must succeed on a Dexterity saving throw or
          fall in. A creature that successfully saves moves with the fissure's
          edge as it opens.</p></div><div data-roll-name-ancestor="Structures"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="2"> <span
          class="entry-title-inner">Structures.</span></span> The tremor deals
          50 Bludgeoning damage to any structure in contact with the ground in
          the area when you cast the spell and at the end of each of your turns
          until the spell ends. If a structure drops to 0 @variantrule[Hit
          Points|XPHB], it collapses.</p><p>A creature within a distance from a
          collapsing structure equal to half the structure's height makes a
          Dexterity saving throw. On a failed save, the creature takes 12d6
          damage, has the &amp;Reference[condition=Prone] condition, and is
          buried in the rubble, requiring a [[/save ability=str dc=20]]
          (&amp;Reference[skill=Athletics]) check as an action to escape. On a
          successful save, the creature takes half as much damage
          only.</p></div></div>
        chat: ''
