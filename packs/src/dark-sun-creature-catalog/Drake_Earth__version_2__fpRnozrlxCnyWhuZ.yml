    name: The drake creates a wall of dirt, stones, and ...
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The drake creates a wall of dirt,
          stones, and boulders from the elemental plane of earth on a solid
          surface it can see within 120 feet of it. The wall can be up to 30
          feet long, 30 feet high, and 1 foot thick. When the wall appears, each
          creature within its area is pushed 5 feet out of the wall's space;
          appearing on whichever side of the wall, it wants. Each 10-foot
          section of the wall has AC 13, 20 hit points, resistance to all damage
          and immunity to acid, cold, necrotic, poison, and psychic damage. The
          wall disappears when the drake uses this lair action again or when the
          drake dies.</p></div>
