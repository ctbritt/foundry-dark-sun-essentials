          following effects:</p><ul class="rd__list"><li class="rd__li ">Small
          earthquakes are common within 6 miles of the drake's lair.</li><li
          class="rd__li ">Rocky fissures within 1 mile of the drake's lair form
          portals to the Elemental Plane of Earth, allowing creatures of
          elemental earth into the world to dwell nearby.</li></ul><p>If the
          drake dies, these effects fade over the course of 1d10 days.</p></div>
