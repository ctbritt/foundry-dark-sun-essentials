  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Athas's cacti are important</p><p>sources of water and
        sustenance, but a few species are mobile, hazardous, or monstrous.
        Although most carnivorous plants are stationary hazards for the unwary,
        some actively hunt prey.</p><p>Lore</p><p>A zombie cactus blooms with
        flowerlike protrusions sprouting four to eight violet berries filled
        with refreshing nectar. It closely resembles the rare flowering oasis
        cactus, whose juicy fruit is salvation for lost and thirsty travelers.
        With this tempting disguise it draws in its prey, then lashes out with
        life-stealing tendrils.</p><p>Sages believe that zombie cacti were
        created as traps by psionics-using slavers, aided by defilers, but their
        creations were ultimately uncontrollable. Those cacti that were not
        destroyed found their way into the desert. Hunter cacti are
        opportunistic hunters that grow and stay where prey is plentiful, moving
        on from poor hunting grounds. They rely on their camouflage as they wait
        for distracted or unobservant creatures to come close. A cactus might
        leave an occasional corpse uneaten, in hopes of attracting scavengers
        that make a better meal. The flesh of a hunter cactus is succulent and
        nourishing, a tasty reward for those who turn the tables on
        it.</p><p>Encounters</p><p>A zombie cactus exists alone or in a small
        patch amid a number of thralls. Sometimes zombie cacti are encountered
        in pairs.  Although simple and self-serving, zombie cacti have a low
        cunning. They might form short-term alliances with creatures that lure
        prey to them. A few are forced into the service of more powerful beings
        and constantly look for a chance to escape.</p><p>Humanoids can train
        hunter cacti to coexist with them by feeding the predatory plants. Such
        cacti learn to attack intruders other than their usual feeders and serve
        as easily overlooked guardians.</p><p>Info</p><p>Not all cacti are drab
        and prickly. The zombie cactus is a beautiful plant, with delicate
        spines and plenty of juicy berries. It attracts thirsty creatures, then
        dominates and desiccates them, creating a small army of undying
        servitors in the process.</p>
      public: ''
