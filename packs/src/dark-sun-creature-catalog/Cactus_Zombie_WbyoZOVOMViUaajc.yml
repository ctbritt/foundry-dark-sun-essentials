          points or fewer, the target cannot save against this power. When a
          creature dominated by the cactus dies, it becomes a zombie thrall at
          the start of the zombie cactus's next turn. The zombie thrall acts
          immediately after the zombie cactus. The slain humanoid cannot be
          raised until the thrall is destroyed. A @spell[Lesser Restoration],
          @spell[Greater Restoration], @spell[Heal] or @spell[Wish] spell can
          end the effect of the dominating spores on a creature.</p></div>
