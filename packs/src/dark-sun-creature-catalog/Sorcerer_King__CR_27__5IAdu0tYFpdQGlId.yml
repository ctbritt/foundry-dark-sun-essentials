  - _id: UBvDHOzGspP571RD
    name: Teleport
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '331'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>This spell instantly transports you
          and up to eight willing creatures that you can see within range, or a
          single object that you can see within range, to a destination you
          select. If you target an object, it must be Large or smaller, and it
          can't be held or carried by an unwilling creature.</p><p>The
          destination you choose must be known to you, and it must be on the
          same plane of existence as you. Your familiarity with the destination
          determines whether you arrive there successfully. The DM rolls 1d100
          and consults the @variantrule[Teleportation|XPHB] Outcome table and
          the explanations after it.</p><table class="w-100 rd__table 
          stripe-odd-table" data-roll-name-ancestor="Teleportation
          Outcome"><caption>Teleportation Outcome</caption><thead><tr><th
          class="rd__th ve-col-4 " data-rd-isroller="false">Familiarity</th><th
          class="rd__th ve-col-2 ve-text-center "
          data-rd-isroller="false">Mishap</th><th class="rd__th ve-col-2
          ve-text-center " data-rd-isroller="false">Similar Area</th><th
          class="rd__th ve-col-2 ve-text-center " data-rd-isroller="false">Off
          Target</th><th class="rd__th ve-col-2 ve-text-center "
          data-rd-isroller="false">On Target</th></tr></thead><tbody><tr><td
          class="rd__th ve-col-4 ">Permanent circle</td><td class="rd__th
          ve-col-2 ve-text-center ">—</td><td class="rd__th ve-col-2
          ve-text-center ">—</td><td class="rd__th ve-col-2 ve-text-center
          ">—</td><td class="rd__th ve-col-2 ve-text-center
          ">01-00</td></tr><tr><td class="rd__th ve-col-4 ">Linked
          object</td><td class="rd__th ve-col-2 ve-text-center ">—</td><td
          class="rd__th ve-col-2 ve-text-center ">—</td><td class="rd__th
          ve-col-2 ve-text-center ">—</td><td class="rd__th ve-col-2
          ve-text-center ">01-00</td></tr><tr><td class="rd__th ve-col-4 ">Very
          familiar</td><td class="rd__th ve-col-2 ve-text-center ">01-05</td><td
          class="rd__th ve-col-2 ve-text-center ">06-13</td><td class="rd__th
          ve-col-2 ve-text-center ">14-24</td><td class="rd__th ve-col-2
          ve-text-center ">25-00</td></tr><tr><td class="rd__th ve-col-4 ">Seen
          casually</td><td class="rd__th ve-col-2 ve-text-center ">01-33</td><td
          class="rd__th ve-col-2 ve-text-center ">34-43</td><td class="rd__th
          ve-col-2 ve-text-center ">44-53</td><td class="rd__th ve-col-2
          ve-text-center ">54-00</td></tr><tr><td class="rd__th ve-col-4
          ">Viewed once or described</td><td class="rd__th ve-col-2
          ve-text-center ">01-43</td><td class="rd__th ve-col-2 ve-text-center
          ">44-53</td><td class="rd__th ve-col-2 ve-text-center ">54-73</td><td
          class="rd__th ve-col-2 ve-text-center ">74-00</td></tr><tr><td
          class="rd__th ve-col-4 ">False destination</td><td class="rd__th
          ve-col-2 ve-text-center ">01-50</td><td class="rd__th ve-col-2
          ve-text-center ">51-00</td><td class="rd__th ve-col-2 ve-text-center
          ">—</td><td class="rd__th ve-col-2 ve-text-center
          ">—</td></tr></tbody></table><div
          data-roll-name-ancestor="Familiarity" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Familiarity.</span></span> Here are the
          meanings of the terms in the table's Familiarity column:</p><ul
          class="rd__list"><li class="rd__li ">"Permanent circle" means a
          permanent teleportation circle whose sigil sequence you know.</li><li
          class="rd__li ">"Linked object" means you possess an object taken from
          the desired destination within the last six months, such as a book
          from a wizard's library.</li><li class="rd__li ">"Very familiar" is a
          place you have visited often, a place you have carefully studied, or a
          place you can see when you cast the spell.</li><li class="rd__li
          ">"Seen casually" is a place you have seen more than once but with
          which you aren't very familiar.</li><li class="rd__li ">"Viewed once
          or described" is a place you have seen once, possibly using magic, or
          a place you know through someone else's description, perhaps from a
          map.</li><li class="rd__li ">"False destination" is a place that
          doesn't exist. Perhaps you tried to scry an enemy's sanctum but
          instead viewed an illusion, or you are attempting to teleport to a
          location that no longer exists.</li></ul></div><div
          data-roll-name-ancestor="Mishap" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="2"> <span
          class="entry-title-inner">Mishap.</span></span> The spell's
          unpredictable magic results in a difficult journey. Each teleporting
          creature (or the target object) takes 3d10 damage, and the DM rerolls
          on the table to see where you wind up (multiple mishaps can occur,
          dealing damage each time).</p></div><div
          data-roll-name-ancestor="Similar Area" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="3"> <span
          class="entry-title-inner">Similar Area.</span></span> You and your
          group (or the target object) appear in a different area that's
          visually or thematically similar to the target area. You appear in the
          closest similar place. If you are heading for your home laboratory,
          for example, you might appear in another person's laboratory in the
          same city.</p></div><div data-roll-name-ancestor="Off Target"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="4"> <span class="entry-title-inner">Off
          Target.</span></span> You and your group (or the target object) appear
          2d12 miles away from the destination in a random direction. Roll 1d8
          for the direction: 1, east; 2, southeast; 3, south; 4, southwest; 5,
          west; 6, northwest; 7, north; or 8, northeast.</p></div><div
          data-roll-name-ancestor="On Target" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="5"> <span
          class="entry-title-inner">On Target.</span></span> You and your group
          (or the target object) appear where you intended.</p></div></div>
