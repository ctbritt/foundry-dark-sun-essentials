  - _id: TBN7ACjJmoYwlnMn
    name: Sorcery Points
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The sorcerer-king/queen has 20 sorcery
          points. It regains all its spent sorcery points when it finishes a
          long rest. It can spend its sorcery points on the following
          options:</p><p>- Distant Spell. When the sorcerer-king/queen casts as
          pell that has a range of 5 feet or greater, it can spend 1 sorcery
          point to double the range of the spell. When the sorcerer-king/queen
          casts a spell that has a range of touch, it can spend 1 sorcery point
          to make the range of the spell 30 feet.</p><p>- Empowered Spell. When
          the sorcerer-king/queen rolls damage for a spell, it can spend 1
          sorcery point to reroll up to 5 damage dice. It must use the new
          rolls. The sorcerer-king/queen can use Empowered spell even if it has
          used a different Metamagic option during the casting of the
          spell.</p><p>- Heightened Spell. When the sorcerer-king/queen casts a
          spell that forces a creature to make a saving throw to resist its
          effects, it can spend 3 sorcery points to give one target of the spell
          disadvantage on its first saving throw made against the spell.</p><p>-
          Subtle Spell. When the sorcerer-king casts a spell, it can spend 1
          sorcery point to cast it without any somatic or verbal
          components.</p></div>
