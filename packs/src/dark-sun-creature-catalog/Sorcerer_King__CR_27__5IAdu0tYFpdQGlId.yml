  - _id: suqSBdcIlf4rDj9M
    name: Polymorph
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '306'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You attempt to transform a creature
          that you can see within range into a Beast. The target must succeed on
          a Wisdom saving throw or shape-shift into Beast form for the duration.
          That form can be any <a
          href="https://5e.tools/bestiary.html#blankhash,flsttype:beast=1,flstmiscellaneous:swarm=2">Beast</a>
          you choose that has a @variantrule[Challenge Rating|XPHB] equal to or
          less than the target's (or the target's level if it doesn't have a
          @variantrule[Challenge Rating|XPHB]). The target's game statistics are
          replaced by the stat block of the chosen Beast, but the target retains
          its alignment, personality, creature type, @variantrule[Hit
          Points|XPHB], and @variantrule[Hit Point Dice|XPHB].</p><p>The target
          gains a number of @variantrule[Temporary Hit Points|XPHB] equal to the
          @variantrule[Hit Points|XPHB] of the Beast form. These
          @variantrule[Temporary Hit Points|XPHB] vanish if any remain when the
          spell ends. The spell ends early on the target if it has no
          @variantrule[Temporary Hit Points|XPHB] left.</p><p>The target is
          limited in the actions it can perform by the anatomy of its new form,
          and it can't speak or cast spells.</p><p>The target's gear melds into
          the new form. The creature can't use or otherwise benefit from any of
          that equipment.</p></div>
