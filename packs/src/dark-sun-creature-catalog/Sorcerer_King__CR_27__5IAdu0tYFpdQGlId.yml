  - _id: IhkStYetYHwdo6bg
    name: Conjure Elemental
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '254'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You conjure a Large, intangible spirit
          from the Elemental Planes that appears in an unoccupied space within
          range. Choose the spirit's element, which determines its damage type:
          air (Lightning), earth (Thunder), fire (Fire), or water (Cold). The
          spirit lasts for the duration.</p><p>Whenever a creature you can see
          enters the spirit's space or starts its turn within 5 feet of the
          spirit, you can force that creature to make a Dexterity saving throw
          if the spirit has no creature &amp;Reference[condition=Restrained]. On
          failed save, the target takes 8d8 damage of the spirit's type, and the
          target has the &amp;Reference[condition=Restrained] condition until
          the spell ends. At the start of each of its turns, the
          &amp;Reference[condition=Restrained] target repeats the save. On a
          failed save, the target takes 4d8 damage of the spirit's type. On a
          successful save, the target isn't &amp;Reference[condition=Restrained]
          by the spirit.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage increases by 1d8 for
          each spell slot level above 5.</p></div></div>
