          within 3 miles of another one, it gets advantage on saving throws
          against being &amp;Reference[condition=charmed] or
          &amp;Reference[condition=frightened]. Other locust can use this
          connection to find a member of their swarm or communicate basic
          information, such as "food", "danger" or "attack".</p></div>
