  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The Sky Darkens</p><p>as the loud buzzing becomes
        unbearable. The sand locust are the plague of the wasteland, razing
        entire community on their passage. A swarm of dune locust is driven by
        an insatiable hunger, endlessly flying the wastes, always looking for a
        new source of food.</p><p>Lore</p><p>Locusts have formed plagues since
        the beginning of the desert age. The city of Raam have them carved on
        their tombs and the insects are mentioned in several parchments from the
        Red age as well. Swarms have devastated crops and been a contributory
        cause of famines and human migrations. More recently, city states have
        changed special group of mercenaries and Templars to hunt nests of the
        beast, in order to protect their agriculture. Locations where swarms
        tend to originate are tracked down by groups of adventurers, very few
        survive that trial, but the ones who do make it back are paid generously
        for their effort.</p><p>In Athasian superstition locust play the role of
        harbinger of change, chaos and doom. The sighting of a plague is one of
        the worst omen that can possibly exist and folks rush to buy protective
        charms and ask for elemental priest blessing against the times to
        come.</p><p>Locust do not necessarily move in swarm and isolated
        individuals can be encountered frequently, but swarming behavior has
        increased in the last century, when suitable climatic conditions occur
        and vigilance lapses, plagues occur. Locust build mounds, where they lay
        eggs and wait for them to sprout. During that time the swarm increase
        its hunting, capturing beasts and humanoid to feed them to the young
        starving locust. Swarm nests in area difficult to reach, usually on
        dangerous to climb cliffs, hidden valley or high plateau.</p><p>The
        swarm have a hierarchy, focused on the need for reproduction, Dune
        Locust Hunter are the more common, feeding on everything they can and
        sometime scouting for food source for the rest of the swarm. Sandhorrors
        are the warrior cast of the Dune Locust, they live exclusively to mate
        with the Queen Locust and protect the swarm against treats. The Queen
        Locust is the only type of locust incapable of flying, and as such is
        much more vulnerable than the rest of her species. A Queen sole purpose
        is to create mounds and lay eggs, waiting the hunters to come back and
        feed her. When the time is right the Queen emits a powerful psychic wave
        to signal the beginning of a plague, this wave can be felt miles around
        by other psychic creatures, which usually leave the surrounding region
        as fast as the possibly can.</p><p>Encounters</p><p>The region of Raam
        is particularly famous for the dangerous nest that abound around, making
        contracts on hive a lucrative job for mercenaries. Outside the time of
        plague, lone locust can easily be encountered. Small group of them are
        common as well, ranging from five to fifteen individuals. When the time
        of a plague has come hundreds of them can be seen, darkening the sky in
        the distance, leaving only bone picked clean and devastated areas in
        their wake.</p><p>Info</p><p>The common Dune Locust are the Dune Locust
        Hunters, scouting the wastelands for food. They are extremely aggressive
        and will attack any creature they can best, leaving the dangerous
        predators alone. In groups, they hunt bigger preys and nothing is safe
        from their hunger. All Dune Locust are poisonous, they prefer to attack
        directly, rushing from the sky and dismembering their prey with their
        mandibles but are not above waiting for their poison to take effect on a
        strong prey, lurking out of reach until their prey is weaken enough.</p>
      public: ''
