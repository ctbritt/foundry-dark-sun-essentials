        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Each creature in a 10-foot-radius
          @variantrule[Sphere [Area of Effect]|XPHB|Sphere] centered on a point
          you choose within range must succeed on a Wisdom saving throw, or that
          target can't take Bonus Actions or Reactions and must roll 1d10 at the
          start of each of its turns to determine its behavior for that turn,
          consulting the table below.</p><table class="w-100 rd__table 
          stripe-odd-table"><thead><tr><th class="rd__th ve-col-2 ve-text-center
          " data-rd-isroller="true">1d10</th><th class="rd__th ve-col-10 "
          data-rd-isroller="false">Behavior for the
          Turn</th></tr></thead><tbody><tr><td class="rd__th ve-col-2
          ve-text-center " data-roll-min="1" data-roll-max="1">1</td><td
          class="rd__th ve-col-10 ">The target doesn't take an action, and it
          uses all its movement to move. Roll 1d4 for the direction: <b>1</b>,
          north; <b>2</b>, east; <b>3</b>, south; or <b>4</b>,
          west.</td></tr><tr><td class="rd__th ve-col-2 ve-text-center "
          data-roll-min="2" data-roll-max="6">2-6</td><td class="rd__th
          ve-col-10 ">The target doesn't move or take actions.</td></tr><tr><td
          class="rd__th ve-col-2 ve-text-center " data-roll-min="7"
          data-roll-max="8">7-8</td><td class="rd__th ve-col-10 ">The target
          doesn't move, and it takes the @action[Attack|XPHB] action to make one
          melee attack against a random creature within reach. If none are
          within reach, the target takes no action.</td></tr><tr><td
          class="rd__th ve-col-2 ve-text-center " data-roll-min="9"
          data-roll-max="10">9-10</td><td class="rd__th ve-col-10 ">The target
          chooses its behavior.</td></tr></tbody></table><p>At the end of each
          of its turns, an affected target repeats the save, ending the spell on
          itself on a success.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
