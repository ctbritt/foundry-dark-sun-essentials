    name: Crown of Madness
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '259'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>One creature that you can see within
          range must succeed on a Wisdom saving throw or have the
          &amp;Reference[condition=Charmed] condition for the duration. The
          creature succeeds automatically if it isn't Humanoid.</p><p>A spectral
          crown appears on the &amp;Reference[condition=Charmed] target's head,
          and it must use its action before moving on each of its turns to make
          a melee attack against a creature other than itself that you mentally
          choose. The target can act normally on its turn if you choose no
          creature or if no creature is within its reach. The target repeats the
          save at the end of each of its turns, ending the spell on itself on a
          success.</p><p>On your later turns, you must take the
          @action[Magic|XPHB] action to maintain control of the target, or the
          spell ends.</p></div>
