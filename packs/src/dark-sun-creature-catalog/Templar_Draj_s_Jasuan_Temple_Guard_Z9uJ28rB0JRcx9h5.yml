        value: >-
          <div class="rd__b  rd__b--3"><p>The templar surround himself with an
          aura of gloom that lasts for 1 minute. The aura reduces any bright
          light in a 30-foot radius around the paladin to dim light. Whenever an
          enemy that is &amp;Reference[condition=frightened] by the paladin
          starts its turn in the aura, it takes 4d10 damage. Additionally, the
          templar and creatures it chooses in the aura are draped in deeper
          shadow. Creatures that rely on sight have disadvantage on attack rolls
          against creatures draped in this shadow. While the aura lasts, the
          paladin can use a bonus action on his or her turn to cause the shadows
          in the aura to attack one creature. The paladin makes a melee spell
