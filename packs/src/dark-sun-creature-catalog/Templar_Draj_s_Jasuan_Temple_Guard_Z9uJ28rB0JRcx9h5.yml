        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Your touch inflicts a magical
          contagion. The target must succeed on a Constitution saving throw or
          take 11d8 damage and have the &amp;Reference[condition=Poisoned]
          condition. Also, choose one ability when you cast the spell. While
          &amp;Reference[condition=Poisoned], the target has
          @variantrule[Disadvantage|XPHB] on saving throws made with the chosen
          ability.</p><p>The target must repeat the saving throw at the end of
          each of its turns until it gets three successes or failures. If the
          target succeeds on three of these saves, the spell ends on the target.
          If the target fails three of the saves, the spell lasts for 7 days on
          it.</p><p>Whenever the &amp;Reference[condition=Poisoned] target
          receives an effect that would end the
          &amp;Reference[condition=Poisoned] condition, the target must succeed
          on a Constitution saving throw, or the
          &amp;Reference[condition=Poisoned] condition doesn't end on
