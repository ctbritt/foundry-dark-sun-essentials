  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The dune freaks, or anakore, are a race of dimwitted
        humanoids with bony, wedgelike heads, small ears pressed close to the
        sides of their heads, and sunken, beady eyes covered by clear membranes
        to prevent sand from scratching these delicate tissues.</p><p>The
        anakore have an unusual dorsal ridge running along their spine. This fin
        is actually a sensitive organ which picks up minute vibrations traveling
        through the sand. With it, they can locate a solitary creature walking
        on the sand from as far away as five miles. Anakore usually attack their
        foes by burrowing underneath them, then striking from beneath the victim
        with their sharp claws.</p><p>The anakore are nomadic burrowers who are
        constantly moving through the sandy wastes of Athas. It is often
        possible to identify an area through which</p>
