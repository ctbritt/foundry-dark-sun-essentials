  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The churning dust storms of the sea of silt</p><p>sweep
        up wonders from its farthest reaches and deposit them on Tyr's rocky
        shores. Arriving amid the relics and wreckage are the bizarre floating
        mantles. These beasts resemble jellyfish that float on the coastal
        breezes as they feed and commune with one
        another.</p><p>Lore</p><p>Floating mantles should not be able to fly:
        Their baglike bodies lack wings or any other method of propulsion.
        Scholars who study captured specimens theorize that special glands
        produce a Iighter-than-air gas that is stored in their flexible bodies
        to provide lift. Valves release it in small jets to propel the creatures
        with amazing maneuverability. The gas is flammable and explodes if
        exposed to fire or lightning.</p><p>A floating mantle's coloration
        reveals its mood. Normally, males tend toward red and females toward
        yellow; their hues are pale but intensify when the creatures are
        angered. When a floating mantle enters its reproductive stage, it bloats
        to half again its original size and takes on a bruise-blue color. Now
        called a bluesting, it can no longer hunt, instead using nutrients
        stored over previous months to feed its developing young. During this
        uncomfortable period, bluestings are irritable and far more aggressive
        than other floating mantles.</p><p>A bluesting gives birth to scores of
        polyps, though few survive long enough to bond with the colony. The
        exertion of combat can cause a bluesting to birth a few young
        prematurely. The ravenously hungry polyps fight alongside their parent,
        only to die minutes after the battle
        ends.</p><p>Encounters</p><p>Floating mantles collect in small colonies
        and share a group consciousness, allowing them to communicate primitive
        ideas and concepts with one another. They have few predators but defend
        themselves and their surviving young with unexpected
        ferocity.</p><p>Info</p><p>Floating mantles hover above coastal
        mudflats, where they graze and make their nests. Quiet and inoffensive,
        floating mantles attack only when they feel threatened. They surround
        enemies, injecting them with slowing toxins from their long tentacles. A
        mantle then draws a creature up to its body and drains its vitality
        using the same appendages. When injured, a floating mantle looses a
        psychic scream, both to drive off its attacker and to warn its
        fellows.</p>
      public: ''
