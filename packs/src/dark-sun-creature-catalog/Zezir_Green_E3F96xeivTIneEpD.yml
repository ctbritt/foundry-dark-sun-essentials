  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>The red zezir is a ruthless desert predator
        that loves the sight of an open, uncontrolled flame. Red zezirs live to
        start and spread fires, reveling in the crackle and play of something,
        anything, as it burns. Red zezir packs have been known to attack
        merchant caravans and set them alight, retreating beyond the range of
        retaliation to cavort in joy as the entire caravan goes up in smoke. The
        creatures feed on ash, and their seeming infatuation with fi re provides
        them with sustenance. However, their love of fire also stems from their
        chaotic nature and an innate love of destruction.</p><p>Male and female
        zezirs participate in hunts equally, and packs share the responsibility
        of raising the young. Red zezirs can communicate by means of a sequence
        of yips, growls, and whines. Zezirs are not reptilian, although they
        have some reptilian traits. They are more closely related to avians. A
        typical zezir stands between 5 and 5-1/2 feet tall and weighs around 150
        pounds.</p><p>Encounters</p><p>Zezirs are fast and agile, but not
        particularly stealthy. A pack typically posts a lookout near the site of
        a possible ambush, while the rest of the creatures lie in wait several
        hundred feet away. Once possible prey is spotted, the zezir scout
        returns to report the size and direction of the target. The pack then
        heads off at a run to intercept. Once they reach their objective, the
        zezirs run through and by their targets. The first zezirs of the pack
        spray their opponents with their sticky flammable spray, and the
        following zezirs use their spark stream attack to set the very air on
        fire. The zezirs often retreat to a safe distance to watch the burning,
        repeating the tactics if necessary.</p><p>Info</p><p>Green zezir are
        small, poisonous, predators living in the few jungles and forest of
        Athas. The green zezir can be easily be found in the Forest Ridge and
        the Crescent Forest. Other specimens have been spotted all around Athas,
        mostly near lush mudflat or oasis. The green zezir is a cowardly
        predator, swarming bigger creature but retreating at the first sign of
        real danger. Still, they can be quite patient and wait in high grass
        where they can easily hide with their chameleon carapace. They try to
        blind they prey first and keep spitting their poison from a safe
        distance until their prey collapse. That's the moment the rest of the
        pack is waiting to swarm the quarry, making short work of it with
        numerous bites. A pack of green zezir range usually between 6 to 12
        individuals, but bigger packs have been reported, reaching up to 24
        creatures.</p>
      public: ''
