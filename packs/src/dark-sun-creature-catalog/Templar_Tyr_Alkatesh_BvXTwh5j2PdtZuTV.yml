      itemacro:
        macro:
          name: Cunning Action
          img: icons/magic/control/hypnosis-mesmerism-watch.webp
          type: script
          scope: global
          command: |-
            const disengage = {
              changes: [],
              description:
                "<p>If you take the Disengage action, your movement doesn’t provoke opportunity attacks for the rest of the turn.</p>",
              disabled: false,
              duration: {
                rounds: null,
                seconds: 6,
                turns: null,
                startTime: null,
                combat: null,
                startRound: null,
                startTurn: null,
              },
              flags: {
                dae: {
                  selfTarget: false,
                  selfTargetAlways: false,
                  dontApply: false,
                  stackable: "noneName",
                  showIcon: true,
                  durationExpression: "",
                  macroRepeat: "none",
                  specialDuration: ["turnStartSource"],
                  disableIncapacitated: false,
                },
              },
              icon: "icons/skills/movement/feet-winged-boots-blue.webp",
              name: "Disengage",
              tint: null,
              transfer: false,
            };

            const dash = {
              icon: "icons/skills/movement/figure-running-gray.webp",
              name: "Dash",
              changes: [],
              description:
                "<p>When you take the Dash action, you gain extra movement for the current turn. The increase equals your speed, after applying any modifiers. With a speed of 30 feet, for example, you can move up to 60 feet on your turn if you dash.</p><p>Any increase or decrease to your speed changes this additional movement by the same amount. If your speed of 30 feet is reduced to 15 feet, for instance, you can move up to 30 feet this turn if you dash.</p>",
              duration: {
                rounds: null,
                seconds: 6,
                turns: null,
                startTime: null,
                combat: null,
                startRound: null,
                startTurn: null,
              },
              flags: {
                dae: {
                  selfTarget: false,
                  selfTargetAlways: false,
                  dontApply: false,
                  stackable: "noneName",
                  showIcon: true,
                  durationExpression: "",
                  macroRepeat: "none",
                  specialDuration: ["turnStartSource"],
                  disableIncapacitated: false,
                },
              },
            };

            const result = new Dialog({
              title: "Cunning Action",
              content: "Choose an action",
              buttons: {
                dash: {
                  icon: "<i class='fas fa-check'></i>",
                  label: "Dash",
                  callback: () => {
                    actor.createEmbeddedDocuments("ActiveEffect", [dash]);
                  },
                },
                disengage: {
                  icon: "<i class='fas fa-times'></i>",
                  label: "Disengage",
                  callback: () => {
                    actor.createEmbeddedDocuments("ActiveEffect", [disengage]);
                  },
                },
                hide: {
                  icon: "<i class='fas fa-times'></i>",
                  label: "Hide",
                  callback: () => {
                    actor.rollSkill("ste", {
                      fastForward: true,
                    });
                  },
                },
              },
            });

            result.render(true);

            // Get the currently controlled token
            const uuid = canvas.tokens.controlled[0].actor.uuid;
            if (!uuid) {
              ui.notifications.warn("No token selected!");
              return;
            }
          author: jM4h8qpyxwTpfNli
          ownership:
            default: 3
