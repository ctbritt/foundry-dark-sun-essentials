  - _id: 6csF2Kw858YOtkWm
    name: Alchemical Bomb
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The alkatesh can throw a bomb within
          20ft, making a ranged attack (+8 to hit) weapon against a creature or
          an area. On a hit the effect is centered on the landing creature or
          area, the alkatesh can choose one of the following effect:
          </p><p>Incendiary Bomb. The fiery explosing inflict 20 (6d6) damage in
          a 15ft radius, a succeeded [[/save ability=dex dc=15]] check reduces
          damage by half. Creatures starting their turn in the area or entering
          the area suffer 2d6 damage. The area burn for one minute and will set
          on fire flammable materials nearby. </p><p>Poison Bomb. A 20 foot
          radius area fills with poisonous gas for one minute. Each creature
          starting its turn in the area or entering it must make a [[/save
          ability=con dc=15]] saving throw, taking 17 (5d6) damage on a failed
          one, or half as much damage on a successful one. A moderate wind (at
          least 10 miles per hour) disperses the poison gas in 4 rounds; a
          strong wind (20 or more miles per hour) disperse it in 1 round.
          </p><p>Smoke Bomb. The bomb emits a cloud of smoke that creates a
          heavily obscured area in a 20ft radius. A moderate wind (at least 10
          miles per hour) disperses the poison gas in 4 rounds; a strong wind
          (20 or more miles per hour) disperse it in 1 round.</p></div>
