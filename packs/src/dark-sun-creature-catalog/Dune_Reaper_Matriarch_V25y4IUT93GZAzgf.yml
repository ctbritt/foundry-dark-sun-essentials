  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>A chorus of wailing howls</p><p>and shrieks and a sickly
        sweet odor on the night breeze warn a traveler that a dune reaper pack
        is on the hunt nearby. By the time luminescent eyes gleam like floating
        lanterns against the darkened dunes, escape is no longer
        possible.</p><p>Lore</p><p>These territorial predators came into
        existence through defiling magic. Dune reapers consume everything they
        find: They devour humanoids and beasts, graze on plants, and even chew
        through wagons and buildings. They sometimes eat stones to aid digestion
        of tougher materials. Reapers that go too long without food resort to
        cannibalism. Familial groups called prides break into packs to hunt the
        wastes. A pride makes its home near a water source, forming a hive that
        becomes the center of the pride's territory. Hives are mounds of sand,
        earth, and rock sealed together with secretions from the drones. Within
        the mounds are tunnels and chambers, which might be connected to
        existing underground spaces or structures, especially those containing
        sources of water. Humanoids can exist close to a hive only if the
        reapers have another plentiful source of food.</p><p>Dune reaper
        warriors are always female and rule over the smaller drones and shrieks,
        all of which are male. Each warrior forms a hunting pack with multiple
        drones and shrieks as mates; the other reapers can become erratic if she
        is slain. A warrior's mates closely match her in power, ensuring that
        only the strongest reapers reproduce. The dominant female in the pride,
        known as the matron, makes all decisions, guides the pride to new
        territory, and directs followers in creating the hive. A matron can be
        unseated only by another female that defeats her in a duel to the
        death.</p><p>Dune reapers are extremely dangerous during their annual
        mating season, when they hunt for prey to feed growing young. The pack's
        matron lays eggs in the bodies of living creatures. When the eggs hatch,
        the young reapers devour the helpless captives. The stronger hatchlings
        then set upon their brood mates, killing and eating the weak ones. Young
        reapers that survive are driven from the hive after about two months and
        must either join another pride or form a new one. These juveniles are as
        deadly as adults.</p><p>Encounters</p><p>Dune reapers hunt in packs,
        which can number from five to more than a dozen. A patient and
        calculating hunter, a dune reaper warrior learns the travel patterns of
        prey and can hold its pack for days in a hidden position.</p><p>A dune
        reaper is extremely aggressive in isolation from its pride or pack,
        making it hard to tame. Nevertheless, Athasians value the beasts as
        arena combatants and as sources of leather, armor plates, and bone
        blades. Rarely, a clutch of reaper young imprints on humanoids present
        at the hatching.</p><p>Info</p><p>Dune reaper matriarch leads the
        hunting packs. These hulking terrors brandish huge arm blades and snap
        at their prey with powerful mandibles. When a matriarch detects a prey,
        it springs forward with its allies to make a quick kill. Its pheromones
        and tactical leadership make other pack members more dangerous in
        battle. When a battle goes badly, the matriarch retreats for
        reinforcements and leaves the shrieks to sacrifice themselves to hinder
        pursuit.</p>
