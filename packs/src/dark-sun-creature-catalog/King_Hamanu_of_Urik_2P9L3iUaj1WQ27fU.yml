  details:
    biography:
      value: >-
        <p>King Hamanu takes a keen interest in every aspect of Urik’s
        governance. He dispenses justice, monitors trade and resource
        production, and trains with his soldiers. Hamanu’s humanity has begun to
        fade. Although he is still a powerful and attractive man, his eyes have
        turned golden, and his teeth are long and sharp. When wounded in battle,
        Hamanu sheds his human form and adopts the shape of a part-human,
        part-draconic lion.</p>
      public: ''
