          can see within range and that fits within a 5-foot cube. You affect it
          in one of the following ways:</p><ul class="rd__list"><li
          class="rd__li ">You instantaneously expand the flame 5 feet in one
          direction, provided that wood or other fuel is present in the new
          location.</li><li class="rd__li ">You instantaneously extinguish the
