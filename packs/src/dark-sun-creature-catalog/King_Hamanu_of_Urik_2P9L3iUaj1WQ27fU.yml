          the area of bright light and dim light cast by the flame, change its
          color, or both. The change lasts for 1 hour.</li><li class="rd__li
          ">You cause simple shapes—such as the vague form of a creature, an
          inanimate object, or a location—to appear within the flames and
          animate as you like. The shapes last for 1 hour.</li></ul><p>If you
