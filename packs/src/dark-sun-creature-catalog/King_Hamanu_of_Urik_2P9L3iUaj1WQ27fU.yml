  - _id: rYg9mOPzdwC9npef
    name: Dominate Monster
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '265'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>One creature you can see within range
          must succeed on a Wisdom saving throw or have the
          &amp;Reference[condition=Charmed] condition for the duration. The
          target has @variantrule[Advantage|XPHB] on the save if you or your
          allies are fighting it. Whenever the target takes damage, it repeats
          the save, ending the spell on itself on a success.</p><p>You have a
          telepathic link with the &amp;Reference[condition=Charmed] target
          while the two of you are on the same plane of existence. On your turn,
          you can use this link to issue commands to the target (no action
          required), such as "@action[Attack|XPHB] that creature," "Move over
          there," or "Fetch that object." The target does its best to obey on
          its turn. If it completes an order and doesn't receive further
          direction from you, it acts and moves as it likes, focusing on
          protecting itself.</p><p>You can command the target to take a
          @variantrule[Reaction|XPHB] but must take your own
          @variantrule[Reaction|XPHB] to do so.</p></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> Your
          @status[Concentration|XPHB] can last longer with a level 9 spell slot
          (up to 8 hours).</p></div></div>
