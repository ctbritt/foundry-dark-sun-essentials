      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You psychically lash out at one
          creature you can see within range. The target must make an
          Intelligence saving throw. On a failed save, the target takes
          [[/damage 3d6 type=psychic]] damage, and it can't take a reaction
