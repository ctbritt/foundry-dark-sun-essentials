  - _id: uu1REEyk7EirXjvZ
    name: Eyebite
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '270'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>For the duration, your eyes become an
          inky void. One creature of your choice within 60 feet of you that you
          can see must succeed on a Wisdom saving throw or be affected by one of
          the following effects of your choice for the duration.</p><p>On each
          of your turns until the spell ends, you can take a @action[Magic|XPHB]
          action to target another creature but can't target a creature again if
          it has succeeded on a save against this casting of the spell.</p><div
          data-roll-name-ancestor="Asleep" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Asleep.</span></span> The target has the
          &amp;Reference[condition=Unconscious] condition. It wakes up if it
          takes any damage or if another creature takes an action to shake it
          awake.</p></div><div data-roll-name-ancestor="Panicked" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="2"> <span
          class="entry-title-inner">Panicked.</span></span> The target has the
          &amp;Reference[condition=Frightened] condition. On each of its turns,
          the &amp;Reference[condition=Frightened] target must take the
          @action[Dash|XPHB] action and move away from you by the safest and
          shortest route available. If the target moves to a space at least 60
