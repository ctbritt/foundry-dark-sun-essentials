  - _id: NqUaxrniam0Lv0bs
    name: Bigby's Hand
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '246'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create a Large hand of shimmering
          magical energy in an unoccupied space that you can see within range.
          The hand lasts for the duration, and it moves at your command,
          mimicking the movements of your own hand.</p><p>The hand is an object
          that has AC 20 and @variantrule[Hit Points|XPHB] equal to your
          @variantrule[Hit Points|XPHB|Hit Point] maximum. If it drops to 0
          @variantrule[Hit Points|XPHB], the spell ends. The hand doesn't occupy
          its space.</p><p>When you cast the spell and as a @variantrule[Bonus
          Action|XPHB] on your later turns, you can move the hand up to 60 feet
          and then cause one of the following effects:</p><ul class="rd__list
          rd__list-hang-notitle"><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Clenched Fist"><span class="bold
          rd__list-item-name">Clenched Fist.</span> The hand strikes a target
          within 5 feet of it. Make a melee spell attack. On a hit, the target
          takes [[/damage 5d8 type=force]] damage.</p></li><li class="rd__li
          "><p class="rd__p-list-item" data-roll-name-ancestor="Forceful
          Hand"><span class="bold rd__list-item-name">Forceful Hand.</span> The
          hand attempts to push a Huge or smaller creature within 5 feet of it.
          The target must succeed on a Strength saving throw, or the hand pushes
          the target up to 5 feet plus a number of feet equal to five times your
          spellcasting ability modifier. The hand moves with the target,
          remaining within 5 feet of it.</p></li><li class="rd__li "><p
          class="rd__p-list-item" data-roll-name-ancestor="Grasping Hand"><span
          class="bold rd__list-item-name">Grasping Hand.</span> The hand
          attempts to grapple a Huge or smaller creature within 5 feet of it.
          The target must succeed on a Dexterity saving throw, or the target has
          the &amp;Reference[condition=Grappled] condition, with an escape DC
          equal to your spell save DC. While the hand grapples the target, you
          can take a @variantrule[Bonus Action|XPHB] to cause the hand to crush
          it, dealing Bludgeoning damage to the target equal to [[/damage 4d6]]
          plus your spellcasting ability modifier.</p></li><li class="rd__li
          "><p class="rd__p-list-item" data-roll-name-ancestor="Interposing
          Hand"><span class="bold rd__list-item-name">Interposing Hand.</span>
          The hand grants you Half @variantrule[Cover|XPHB] against attacks and
          other effects that originate from its space or that pass through it.
          In addition, its space counts as @variantrule[Difficult Terrain|XPHB]
          for your enemies.</p></li></ul></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage of the Clenched Fist
          increases by [[/damage 2d8]] and the damage of the Grasping Hand
          increases by [[/damage 2d6]] for each spell slot level above
          5.</p></div></div>
