          DC. If a creature discerns the illusion for what it is, the illusion
          becomes faint to the creature.</p><div data-roll-name-ancestor="Sound"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span
          class="entry-title-inner">Sound.</span></span> If you create a sound,
          its volume can range from a whisper to a scream. It can be your voice,
          someone else's voice, a lion's roar, a beating of drums, or any other
          sound you choose. The sound continues unabated throughout the
          duration, or you can make discrete sounds at different times before
          the spell ends.</p></div><div data-roll-name-ancestor="Image"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="2"> <span
