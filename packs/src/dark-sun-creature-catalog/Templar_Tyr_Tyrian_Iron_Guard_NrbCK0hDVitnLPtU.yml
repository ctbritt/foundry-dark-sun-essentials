        value: >-
          <div class="rd__b  rd__b--3"><p>A nonmagical weapon you touch becomes
          a magic weapon. Choose one of the following damage types: Acid, Cold,
          Fire, Lightning, or Thunder. For the duration, the weapon has a +1
          bonus to attack rolls and deals an extra 1d4 damage of the chosen type
          when it hits.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> If you use a level 5-6 spell
          slot, the bonus to attack rolls increases to +2, and the extra damage
          increases to 2d4. If you use a level 7+ spell slot, the bonus
          increases to +3, and the extra damage increases to
          3d4.</p></div></div>
