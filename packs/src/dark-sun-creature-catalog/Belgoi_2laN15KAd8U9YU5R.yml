  - _id: 9qr1kQOsjblOXqox
    name: Compelling Bell (Psionics, Recharge 5-6)
    type: feat
    system:
      source:
        custom: ''
        book: ENK
        page: '11'
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The belgoi rings its bell and targets
          one humanoid or beast that it can see within 120 feet of it. Only the
          target can hear it and must succeed a DC 13 Wisdom saving throw. On a
          failed save, the target is magically charmed while the belgoi rings
          the bell. On a successful save, the target is immune  to the effects
          of the belgoi's compelling bell for 24 hours and everyone within 120
          feet of the belgoi can hear the bell ringing.</p><p>While charmed, the
          target is deafened, only hearing the belgoi's bell. On its turn, the
          target must use its movement to take the most direct route to get
          within 5 feet of the belgoi, repeating the saving throw before
          stepping onto hazardous terrain, such as lava or a pit.</p><p>At the
          end of its turn, or when it takes damage, the target can repeat the
          saving throw.</p></div>
