  details:
    biography:
      value: >-
        <p>Terrible sounds are carried across the Athasian plains, but perhaps
        the most insidious is the jingling of small bells—the work of belgoi.
        The dissonant chimes of these gaunt humanoids tug at travelers' minds,
        entrancing victims and luring them out into the wastes, where they
        become easy prey for the hungry belgoi.</p><p>Basically, the belgoi form
        huge raiding tribes and behave as such. They tend to make their homes in
        forlorn parts of the desert, but journey forth in great numbers to
        harass the trading routes, settled villages, and anywhere else they can
        find a plentiful supply of poorly defended people.</p><p>Belgoi hosts
        tend to move in small parties of 1-10 individuals. When they encounter
        likely-looking prey, the scouting party usually attacks, looking to its
        own dinner first. If they have stumbled across a large group, however,
        they will fetch other members of their tribe and return to attack with
        greater numbers.</p><p>Belgoi often leave the land barren and desolate
        behind them, stripped of all animal and vegetable life. They are second
        only to the foulest of defilers in the destruction they cause to the
        world about them.</p>
