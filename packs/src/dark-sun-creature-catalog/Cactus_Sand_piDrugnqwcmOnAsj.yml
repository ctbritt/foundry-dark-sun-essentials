  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Sand Cacti are a vile form of plant life that dwells
        anywhere there is sand. It feeds on the blood of its victims. Sand cacti
        are well protected; the entire plant (except the needles) is hidden
        below the sand. The body is from 5-8 feet across and about 4 feet thick.
        It has many barbed needles attached to it with long, thin, fibrous
        strands. The bulbous body of the plant and the strands are sickly white,
        while the needles very closely resemble the color of the sand in the
        area. The sand cactus is a solitary creature, existing wherever the sand
        blows.</p><p>The sand cactus is a trapper, existing on any food that
        comes along. It is unable to digest kank blood; a cactus releases a
        snagged kank after one round of blood draining. Anything else is fair
        game.</p>
