  - _id: e39ayXXnn1HewlL0
    name: Prismatic Wall
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '308'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A shimmering, multicolored plane of
          light forms a vertical opaque wall—up to 90 feet long, 30 feet high,
          and 1 inch thick—centered on a point within range. Alternatively, you
          shape the wall into a globe up to 30 feet in diameter centered on a
          point within range. The wall lasts for the duration. If you position
          the wall in a space occupied by a creature, the spell ends instantly
          without effect.</p><p>The wall sheds @variantrule[Bright Light|XPHB]
          within 100 feet and @variantrule[Dim Light|XPHB] for an additional 100
          feet. You and creatures you designate when you cast the spell can pass
          through and be near the wall without harm. If another creature that
          can see the wall moves within 20 feet of it or starts its turn there,
          the creature must succeed on a Constitution saving throw or have the
          &amp;Reference[condition=Blinded] condition for 1 minute.</p><p>The
          wall consists of seven layers, each with a different color. When a
          creature reaches into or passes through the wall, it does so one layer
          at a time through all the layers. Each layer forces the creature to
          make a Dexterity saving throw or be affected by that layer's
          properties as described in the Prismatic Layers table.</p><p>The wall,
          which has AC 10, can be destroyed one layer at a time, in order from
          red to violet, by means specific to each layer. If a layer is
          destroyed, it is gone for the duration. @spell[Antimagic Field|XPHB]
          has no effect on the wall, and @spell[Dispel Magic|XPHB] can affect
          only the violet layer.</p><table class="w-100 rd__table 
          stripe-odd-table" data-roll-name-ancestor="Prismatic
          Layers"><caption>Prismatic Layers</caption><thead><tr><th
          class="rd__th ve-col-2 ve-text-center "
          data-rd-isroller="false">Order</th><th class="rd__th ve-col-10 "
          data-rd-isroller="false">Effects</th></tr></thead><tbody><tr><td
          class="rd__th ve-col-2 ve-text-center ">1</td><td class="rd__th
          ve-col-10 "><b>Red.</b> <i>Failed Save:</i> 12d6 damage. <i>Successful
          Save:</i> Half as much damage. <i>Additional Effects</i>: Nonmagical
          ranged attacks can't pass through this layer, which is destroyed if it
          takes at least 25 Cold damage.</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center ">2</td><td class="rd__th ve-col-10 "><b>Orange.</b>
          <i>Failed Save:</i> 12d6 damage. <i>Successful Save:</i> Half as much
          damage. <i>Additional Effects:</i> Magical ranged attacks can't pass
          through this layer, which is destroyed by a strong wind (such as the
          one created by @spell[Gust of Wind|XPHB]).</td></tr><tr><td
          class="rd__th ve-col-2 ve-text-center ">3</td><td class="rd__th
          ve-col-10 "><b>Yellow.</b> <i>Failed Save:</i> 12d6 damage.
          <i>Successful Save:</i> Half as much damage. <i>Additional
          Effects:</i> The layer is destroyed if it takes at least 60 Force
          damage.</td></tr><tr><td class="rd__th ve-col-2 ve-text-center
          ">4</td><td class="rd__th ve-col-10 "><b>Green.</b> <i>Failed
          Save:</i> 12d6 damage. <i>Successful Save:</i> Half as much damage.
          <i>Additional Effects:</i> A @spell[Passwall|XPHB] spell, or another
          spell of equal or greater level that can open a portal on a solid
          surface, destroys this layer.</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center ">5</td><td class="rd__th ve-col-10 "><b>Blue.</b>
          <i>Failed Save:</i> 12d6 damage. <i>Successful Save:</i> Half as much
          damage. <i>Additional Effects:</i> The layer is destroyed if it takes
          at least 25 Fire damage.</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center ">6</td><td class="rd__th ve-col-10 "><b>Indigo.</b>
          <i>Failed Save:</i> The target has the
          &amp;Reference[condition=Restrained] condition and makes a
          Constitution saving throw at the end of each of its turns. If it
          successfully saves three times, the condition ends. If it fails three
          times, it has the &amp;Reference[condition=Petrified] condition until
          it is freed by an effect like the @spell[Greater Restoration|XPHB]
          spell. The successes and failures needn't be consecutive; keep track
          of both until the target collects three of a kind. <i>Additional
          Effects:</i> Spells can't be cast through this layer, which is
          destroyed by @variantrule[Bright Light|XPHB] shed by the
          @spell[Daylight|XPHB] spell.</td></tr><tr><td class="rd__th ve-col-2
          ve-text-center ">7</td><td class="rd__th ve-col-10 "><b>Violet.</b>
          <i>Failed Save:</i> The target has the
          &amp;Reference[condition=Blinded] condition and makes a Wisdom saving
          throw at the start of your next turn. On a successful save, the
          condition ends. On a failed save, the condition ends, and the creature
          teleports to another plane of existence (DM's choice). <i>Additional
          Effects:</i> This layer is destroyed by @spell[Dispel
          Magic|XPHB].</td></tr></tbody></table></div>
        chat: ''
