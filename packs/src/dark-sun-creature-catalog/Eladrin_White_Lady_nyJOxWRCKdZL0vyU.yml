        value: >-
          <div class="rd__b  rd__b--3"><p>You launch a green ray at a target you
          can see within range. The target can be a creature, a nonmagical
          object, or a creation of magical force, such as the wall created by
          @spell[Wall of Force|XPHB].</p><p>A creature targeted by this spell
          makes a Dexterity saving throw. On a failed save, the target takes
          10d6 + 40 damage. If this damage reduces it to 0 @variantrule[Hit
          Points|XPHB], it and everything nonmagical it is wearing and carrying
          are disintegrated into gray dust. The target can be revived only by a
          @spell[True Resurrection|XPHB] or a @spell[Wish|XPHB]
          spell.</p><p>This spell automatically disintegrates a Large or smaller
          nonmagical object or a creation of magical force. If such a target is
          Huge or larger, this spell disintegrates a 10-foot-@variantrule[Cube
          [Area of Effect]|XPHB|Cube] portion of it.</p></div><div class="rd__b 
