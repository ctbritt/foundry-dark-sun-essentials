          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage increases by 1d8 for
          each spell slot level above 1. The orb can leap a maximum number of
          times equal to the level of the slot expended, and a creature can be
          targeted only once by each casting of this spell.</p></div></div>
