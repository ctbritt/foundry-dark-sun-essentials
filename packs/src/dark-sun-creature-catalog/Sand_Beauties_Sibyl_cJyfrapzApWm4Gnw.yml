  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Fey creatures</p><p>said to come from the Lands Within
        the Wind, sand beauties are mysterious creatures coming from another
        plane of existence. Sand Beauties is a general term to refer to nymphs,
        female fey potentially good or malevolent.</p><p>Info</p><p>Sibyls are
        elder nymphs who still hold a strong bound with the Lands Within the
        Wind, as such they receive potent prophetic gifts and are known for
        their foretelling and foresight. However such gifts are coming at a
        price and sibyls are known to be unreliable and ever changing, shifting
        as the wind blows. The vision they experience constantly, are making it
        difficult for them to discern the present from the past and the future.
        Nevertheless their strangeness adds to their already stunning charm and
        elevates them amongst the fairest of the nymphs.</p><p>The Sibyls are in
        constant pain, witnessing endlessly the dying cycle of Athas and
        remembering so clearly the wonders of the green age and the atrocity of
        the red one. They despise with passion all servants of the
        sorcerer-kings and all defilers, but they weep for the corruption of
        their sisters and would give everything to see the nymphs reunited.</p>
