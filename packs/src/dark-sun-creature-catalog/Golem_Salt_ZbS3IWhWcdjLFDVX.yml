        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The golem absorb all the moisture in a
          15-foot cone. Each creature in that area must make a [[/save
          ability=con dc=16]] saving throw, gaining one level of
          &amp;Reference[condition=exhaustion] on a failed save. This attack has
          no effect on undead or constructs. If it target a plant creature or a
          magical plant, it makes the saving throw with disadvantage. If it
          targets a nonmagical plant that isn't a creature, such as a tree or
          shrub, it doesn't make a saving throw; it simply withers and
          dies.</p></div>
        chat: ''
