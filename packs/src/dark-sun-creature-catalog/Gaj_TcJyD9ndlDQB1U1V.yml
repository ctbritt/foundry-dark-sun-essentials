  details:
    biography:
      value: >-
        <p>The magic-torn wastelands spawn monsters so terrible that not even
        the merciful can permit them to live. Gaj exemplify such horrors,
        combining a hideous aspect with a malign intelligence. They crave the
        flesh of sentient beings, both for sustenance and for the delicious
        taste of fear.</p><p>A gaj uses its feathery antennae to invade the mind
        of its prey, ripping at its victim's thoughts and creating paralyzing
        terror. A gaj telepathically mocks enemies for their weakness and goads
        them to foolish action.  Their vestigial antennae, though useless as
        limbs, compel obedience through agonizing psychic lashes.</p><p>Gaj are
        prized in arenas across the Tyr Region for their cunning and ferocity in
        battle. Thus they command a high price, and monster hunters take great
        risks to capture live specimens.</p>
