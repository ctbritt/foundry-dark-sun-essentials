          &amp;Reference[condition=grappled] by it. The target must make a
          [[/save ability=wis dc=13]] saving throw. On a failed save, the target
          takes 16 (3d10) psychic damage, its intelligence score is reduced by
          1d4, and the gaj magically pulls one piece of information from the
          target's mind that the gaj wants to know. On a successful save, the
          target takes half as much damage, its Intelligence score is not
          reduced, and the gaj learns nothing.</p><p>If the targets Intelligence
          score drops to 0, the target is &amp;Reference[condition=stunned]
