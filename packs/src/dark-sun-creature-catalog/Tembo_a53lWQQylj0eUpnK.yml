  details:
    biography:
      value: >-
        <p>The tembo is a despicable, furless, tawny-colored beast covered with
        loose folds of scaly hide. Varying between three and six feet in length,
        they usually stand about as high as a man's thigh. All four of their
        lithe feet end in long sharp claws, and huge canine fangs protrude from
        beneath the flappy lips of their squarish snouts. The tembo has huge,
        squarish ears which it can turn in any direction, independently of each
        other.</p><p>Tembo prowl the desert in small packs that seem to have no
        real social organization or cohesiveness. Each tembo does more or less
        as it pleases, not sharing any prey it downs with the others. The
        tembo's one concession to social life is that if one of them is
        attacked, the entire pack will join to fight the enemy.</p>
      public: ''
