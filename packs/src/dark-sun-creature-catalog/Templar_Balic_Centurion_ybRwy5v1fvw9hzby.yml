        page: '275'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create a 5-foot-diameter sphere of
          fire in an unoccupied space on the ground within range. It lasts for
          the duration. Any creature that ends its turn within 5 feet of the
          sphere makes a Dexterity saving throw, taking 2d6 damage on a failed
          save or half as much damage on a successful one.</p><p>As a
          @variantrule[Bonus Action|XPHB], you can move the sphere up to 30
          feet, rolling it along the ground. If you move the sphere into a
          creature's space, that creature makes the save against the sphere, and
          the sphere stops moving for the turn.</p><p>When you move the sphere,
          you can direct it over barriers up to 5 feet tall and jump it across
          pits up to 10 feet wide. Flammable objects that aren't being worn or
          carried start @hazard[burning|XPHB] if touched by the sphere, and it
          sheds @variantrule[Bright Light|XPHB] in a 20-foot radius and
          @variantrule[Dim Light|XPHB] for an additional 20 feet.</p></div><div
          class="rd__b  rd__b--3"><p></p><div data-roll-name-ancestor="Using a
          Higher-Level Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h
