      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A beam of crackling energy lances
          toward a creature within range, forming a sustained arc of lightning
          between you and the target. Make a ranged spell attack against it. On
          a hit, the target takes 2d12 damage.</p><p>On each of your subsequent
          turns, you can take a @variantrule[Bonus Action|XPHB] to deal 1d12
          damage to the target automatically, even if the first attack
          missed.</p><p>The spell ends if the target is ever outside the spell's
