  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Aberrations of the deep desert</p><p>psurlons are an
        unholy mix of extreme intelligence and a hideous, vaguely wormlike form.
        Powerful both in body and mind, psurlons sometimes take humanoid form to
        spy on nearby tribes and cities. Why psurlons gather such knowledge is
        unknown, though some scholars assert they intend to claim a dominion of
        their own one day.</p><p>Lore</p><p>Psurlons are an old race possessing
        deep lore. They are sometimes sought by masters of the Way,
        spellcasters, or historians to shed new light on old questions. Getting
        answers from a psurlon is fraught with danger, though-the exchange can
        end with the questioner's death if great care is not taken. Psurlons are
        not native to Athas. They found their way through the Gray; some might
        still reside in the blasted graveyard of dead gods. They were drawn to
        Athas like moths to a flame, attracted by the high degree of psionic
        power regularly wielded by life forms on the planet. Centuries ago, the
        psurlons had a world all their own. In an act of hubris, they attempted
        to unite the minds of their race into a single godmind. Disaster struck,
        and the resulting psychic backlash destroyed the psurlon home world.
        Only their minds survived, and they managed that only by taking shelter
        in the Astral Sea and by anchoring themselves in the bodies of mindless
        slugs. Over thousands of worm generations, the psurIons modified their
        host forms until they reached their present aberrant embodiments.
        Although they might once have had forms similar to the humanoids of
        Athas, they have come to prefer their wormlike host
        forms.</p><p>Encounters</p><p>In their lairs, psurlons keep a variety of
        indoctrinated or enslaved allies, including human defilers and beast
        giants. In an urban environment, they might be encountered as lone
        agents hiding in humanoid crowds or as influential power brokers deeply
        embedded in the local society.</p><p>Depending on its current goal or
        mission, a psurlon might retain its changed form and avoid battle. If
        combat is imminent, a psurlon burrows into the most advantageous
        position, using close or melee attacks to position foes or inhibit their
        movement. A psurlon might gather humanoid minions under its influence to
        do its fighting. Warded by these cat's-paws, it dominates weak-willed
        opponents or focuses its damage on the least armored
        enemies.</p><p>Info</p><p>Masters of psyche and fate, mindworms see
        multiple futures at once. In its most limited use, this vision allows
        the psurlons to lower the defenses and cause more damage to enemies from
        whom it draws blood. The broader application of this capacity is more
        insidious. Mindworms sift among potential futures, determining when
        circumstances are right for the psurlons to advance another step toward
        their secret objective.</p>
