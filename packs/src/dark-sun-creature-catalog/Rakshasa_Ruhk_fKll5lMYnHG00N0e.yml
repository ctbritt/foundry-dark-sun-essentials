    name: Innate Spellcasting
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Innate Spellcasting" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Innate Spellcasting.</span></span> The
          rakshasa's innate's spellcasting ability is Charisma (spell save DC
          <span class="rd__dc">13</span>, +5 to hit with spell attacks). The
