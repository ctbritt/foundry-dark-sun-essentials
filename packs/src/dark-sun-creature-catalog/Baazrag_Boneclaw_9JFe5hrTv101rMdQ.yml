  details:
    biography:
      value: >-
        <div class="rd__b  rd__b--1"><p>Once in a very great while, a baazrag
        litter consists of only one young, much larger than normal. This
        creature is a boneclaw. The boneclaw stands more than 8 feet tall. The
        boneclaw's head is protected by a bony covering. The upper body and back
        are covered with a hard shell that deflects all normal missiles smaller
        than a javelin. Its shell has sharp serrated edges everywhere except
        around the mouth and eyes. The boneclaw is a dull brown color, with
        sand-colored claws and red eyes that glow in the dark.</p><p>Boneclaws
        are solitary creatures. Their territory extends to a 2-mile radius from
        their lair. Boneclaws usually take over deserted baazrag lairs. If there
        is no water readily available, boneclaws will dig until they hit water.
        Deserted boneclaw lairs have been known to save the lives of thirsty
        travelers because of the well that may be found in some of them. If
        there is no prey available, boneclaws can survive on vegetation for as
        long as three months, or can go as long as one month without food at
        all.</p></div>
