  details:
    biography:
      value: >-
        <div class="rd__b  rd__b--1"><p>The bard is a member of a bizarre class
        of entertainers and storytellers prized by the aristocratic city
        dwellers. Free citizens all, bards tour through cities in groups or
        individually, then travel on, making a living with their wits and
        talents. It's also widely accepted that many bards lead double lives as
        notorious blackmailers, thieves, spies, and even assassins.</p><p>Among
        the nobility of the cities, bards are tools. They are commonly hired by
        one house of nobles and sent to another as a gift. The bards are sent to
        entertain, and usually to perform some other subtle task (such as
        robbery, assassination, espionage, etc.), as well. It is considered rude
        to turn down the gift of a bard or bard company. However, when presented
        with a troop of bards from one's worst enemy, sometimes they are turned
        away. To get around this, the hiring party sometimes disguises their
        approach by using a third party to send the bards. A Bard can turn into
        a very complicated collage of intrigue.</p></div>
