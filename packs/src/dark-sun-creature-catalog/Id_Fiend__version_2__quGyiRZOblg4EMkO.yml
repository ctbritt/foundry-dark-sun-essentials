  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The id fiend is a psionic predator whose greatest weapon
        is its ability to draw images of its victims' fears from their
        minds.</p><p>The id fiend is very much like a gila monster or large
        lizard in appearance. It has a large, thick, stocky body supported by
        four muscular legs. All of the id fiends' legs end in four clawed
        digits, three pointing forward and one backward. The torso of the id
        fiend usually ranges from 3 to 4 feet in length, ending in a long,
        tapering tail which is often up to four feet long. The head and neck of
        the id fiend measure two feet long, with its jaws making up about one
        foot of that length. The id fiends' skin has a tough leather-like
        texture, varying in color from light brown and tan, found on specimens
        encountered in the desert, to a dark olive green, found on specimens
        encountered in the forests and jungles.</p>
