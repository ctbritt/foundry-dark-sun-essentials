          [[/save ability=wis dc=14]] saving throw. On a failed save, the target
          is &amp;Reference[condition=frightened] for 1 minute. The target can
          repeat the saving throw at the end of each of its turns. Id beast
          rolls a die. If it rolls an odd number, the
