  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Ssurrans are nomadic, humanoid reptiles. Some are
        raiders while others are simple hunters. As lizard men of the desert,
        they have adapted to the heat of the Athasian day and are active even
        during the blazing mid-day heat.</p><p>Ssurrans roam Athas, seeking
        shelter and food. There have been cases when multiple tribes have joined
        together against a common threat. These multitribal groups are led by a
        council of elders formed from the shaman/leaders of each
        tribe.</p><p>Ssurrans are strict carnivores. They prefer the flesh of
        halflings, but prey upon any living thing they find. Ssurrans are
        nomadic creatures and they generally stay in one area for only a few
        weeks before moving on.</p><p>Ssurrans have few natural enemies, but
        many required ones. They prey on human, demihuman and humanoid
        settlements whenever possible. If they capture a large number of these
        creatures, ssurrans hold a great feast and sacrifice the rest to their
        obscure gods Ssurran eggs are inedible, as is their flesh, but their
        skin is sometimes worked as scale armor that is resistant to fire
        damage.</p>
