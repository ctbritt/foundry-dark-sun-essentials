  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The tembo is a savage predator that will eat anything,
        but it prefers the children of sentient races. Tembo base themselves in
        a lair or den and hunt in packs throughout the surrounding wilderness.
        They have also been known to inhabit the ruins that lie beneath many of
        the large cities of the Tablelands.</p><p>In addition to their physical
        speed and strength, tembo also boast psionic powers and the ability to
        drain the life energy of their victims. Few are those souls that can
        brave and endure a den of Tembo.</p><p>Tembo are universally hated and
        despised because of their preference for young humanoids. Tembo are
        famous for sneaking into nomadic camps to drag off Elven children, for
        skulking about Dwarven villages prowling for untended toddlers, even for
        sneaking into populated cities to snatch noble babes from their
        cradles.</p>
