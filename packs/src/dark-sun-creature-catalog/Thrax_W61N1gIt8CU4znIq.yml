  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Potable water is a valuable commodity</p><p>on Athas.
        Only the sorcerer-kings' favored nobles govern outlying sources of fresh
        water, and they employ military forces to keep interlopers at bay. New
        recruits in these patrols laugh behind the backs of grizzled veterans
        who whisper of thraxes-water vampires. The recruits mock the old
        soldiers for bringing plump hogs on lead ropes with them as they make
        their late night rounds. It is only a matter of time, though, before the
        young upstarts awaken one dawn to find a friend's mummified corpse
        curled up outside.</p><p>Lore</p><p>Ruins litter the Tyr Region, each
        speaking to a society lost to calamity, war, or plague. The town of
        Gerot, nestled beneath a mountain range northeast of Raam, met with a
        particularly unpalatable end. According to legend, Gerot's people were
        great warriors, haughty and proud. They impressed Grand Vizier
        Abalach-Re, who offered the mountain community an alliance if its
        fighters would join Raam's legions. In their arrogance, the Gerotians
        declined, and they killed Abalach-Re's envoys. Enraged, the
        sorcerer-queen unleashed a vicious curse against Gerot's populace. The
        townsfolk were struck with an unquenchable thirst. The twisted
        brilliance behind her curse was that life-sustaining, pure water would
        bring death to any Gerotian. Within days, the entire town had died. What
        Abalach-Re hadn't expected was that every cursed Gerotian would rise in
        undeath, becoming the first thraxes.</p><p>Encounters</p><p>Insatiable
        thirst drives a thrax to hunt the living. The water vampire extracts
        fluids from the flesh of its victims. It's said to be an agonizing
        death. The distinctive cadavers are clearly the work of a thrax. Fearing
        retribution, the undead predator flees. A thrax wanders alone in parched
        misery. It loathes the monster it has become, but it cannot stop; its
        thirst is unbearable. Some thraxes seek revenge on Abalach-Re, and they
        haunt Raam and drink the sorcerer-queen's supporters dry. Because the
        corpse of a thrax victim is so easily recognized, few thrax live in
        cities or villages. Instead, they haunt the wastelands, oasis, and trade
        routes.</p><p>Info</p><p>Victims of an ancient curse, thrax are wretched
        creatures that can only survive by draining water from the bodies of
        others, leaving them desiccated corpses. A thrax's appearance is very
        different than what it was before "the change." Its hair darkens and its
        skin takes on a ruddy tinge. Its facial features develop a gaunt,
        angular cast and its eyes become a deep blue. The most striking change
        is in its hands. Each of the thrax's fingers grows a circular "sucker"
        through which it drains water from its victims.</p>
