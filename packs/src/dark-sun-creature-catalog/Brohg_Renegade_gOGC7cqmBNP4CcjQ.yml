  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Left to their own devices</p><p>these four-armed
        giantkin wander the deserts in small nomadic bands, eking out primitive
        existences, guided by primal spirits. Their dull minds encourage their
        simple ways. But the bestial brohgs are rarely left alone - to the
        contrary, other Athasians conscript them to fight as gladiators in the
        arena or as soldiers on the battlefield.</p><p>Lore</p><p>Brohgs are
        simple giantfolk with archaic ways. While wandering in small bands or
        living in sheltered dwellings among cliffs or canyons, they listen to
        the whispers of primal spirits and world-bound elementals. They rarely
        use the primal magic granted by these entities except to find food and
        water. Instead, brohgs lead moderate lives, taking only what they need
        from the land and occasionally meeting with other brohgs to mate and
        swap stories. Despite its dim intellect, the typical brohg is a capable
        survivalist and naturally talented at combat.</p><p>A brohg that focuses
        its attention on the fighting arts, as the elite hunters among free
        brohgs do, becomes a skillful warrior. This talent makes brohgs targets
        for slavers looking for gladiator and soldier slaves. Brohgs that learn
        the value of their abilities flee the slavers and become mercenaries
        instead.</p><p>Every brohg has a natural sense for arcane magic, which
        the four-armed creatures see as a blight brought to Athas by evil
        spirits. They believe that arcanists traffic with foul, unseen beings,
        so brohgs distrust all arcanists and hate all defilers. It is possible
        that some great harm came to brohgs long ago through the misuse of
        arcane power, or that the brohg race was spawned through the
        manipulation of such energy.</p><p>Once in every generation or two, a
        brohg is born with innate arcane power that manifests in adolescence.
        Afraid to kill the accursed one for fear of releasing evil spirits, the
        tribe banishes the renegade into the wastes, where it travels alone and
        lives as a hermit. Few such renegades have the wherewithal to learn
        anything more difficult than defiling sorcery. The use of defiling magic
        eventually taints these brohg renegades, and their belief that they are
        possessed by evil spirits hastens their
        corruption.</p><p>Encounters</p><p>Brohgs keep hardy beasts as pets.
        They also ally with earth creatures such as galeb duhrs, other giants,
        and some humanoids. A brohg might be found as a mercenary or a slave
        soldier among civilized folk or in an arena. Evil creatures join forces
        with malevolent brohg renegades, and in a few cases, such renegades have
        set themselves up as masters of other degenerate
        brohgs.</p><p>Info</p><p>Brohgs dislike spellcasters and are enraged by
        defilers and by those who abuse arcane magic. Such talents are taboo
        among brohg tribes. When a brohg is born capable of using magic, it is
        branded a renegade among its own kind.</p>
