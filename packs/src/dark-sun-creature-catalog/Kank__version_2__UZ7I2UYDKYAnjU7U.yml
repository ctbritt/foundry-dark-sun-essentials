  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Kanks are large docile insects often used as mounts by
        the people of the Tablelands. A black exoskeleton of chitin covers their
        segmented bodies. The three body sections are the head, thorax, and
        abdomen. They weigh as much as 400 pounds, grow to heights of 4 feet at
        the back, and as long as 8 feet from head to abdomen. Around their
        mouths, they have multi-jointed pincers that they can use to carry
        objects, feed themselves, or fight. Six lanky legs descend from their
        thoraxes. Each ends in a single flexible claw that allows them to grip
        the surfaces they walk upon.</p><p>Kanks are often used as caravan
        mounts. They can travel a full day at their top speed, carrying a
        200-pound passenger and 200 pounds of cargo. Kanks make decent herd
        animals, but usually only elves employ them as such. As kanks can digest
        almost any sort of organic matter, they can thrive in most terrain
        types. In addition, these creatures require little special attention. A
        kank hive instinctively organizes itself into food producers, soldiers,
        and brood queens.</p>
