  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Shimmering heat mirages</p><p>are not all that rise from
        the surface of the desert. At times, particularly at dusk, dreaded silk
        wyrms take to the air, slithering swiftly and silently through the
        darkening skies. With their keen eyesight, these beasts
        spy.</p><p>Lore</p><p>Silk wyrms are snakelike monsters armored in
        chitinous shells. Their psionic abilities allow them to fly
        telekinetically, to cloak their bodies in shadow, and to mesmerize their
        victims. Their bite injects potent and quick-acting paralytic
        venom.</p><p>Silk wyrms are sly, persistent predators that shadow
        potential meals for hours or even days. They are fond of slipping into
        camps at night to paralyze sleeping victims. They're cunning enough to
        make a show of flying off in disinterest if spotted at a distance,
        luring potential prey into a false sense of security.</p><p>Once silk
        wyrms have completely incapacitated their prey, they feed until the
        creature is dead. If the silk wyrms debilitate multiple foes at once,
        they might drag some, still living, back to their lairs. There, they
        coat the helpless enemies in silk strands to prevent escape. Bound
        creatures can look forward to several days of slow feeding, until the
        silk wyrms kill them or they die of thirst.</p><p>Encounter</p><p>Silk
        wyrms have humanlike cunning, but do not speak. They regard other
        creatures as threats or prey - not as potential allies. Adult silk wyrms
        are lone hunters, but as they grow older, they put aside their
        instinctive aversion to competing predators. Sometimes they follow bands
        of raiders such as gith or gnolls, or desert predators such as jhakars
        or tembos, feeding on any wounded or dying creatures left behind. By
        offering easy meals, capable psions such as psurlons and braxats can
        sometimes convince silk wyrms to serve as trackers, spies, or
        guards.</p><p>Silk Wyrm Silk</p><p>Silk wyrm silk is valuable, and
        artisans can weave it into clothing that grants an AC of 11 + Dex
        modifier and resistance to fire damage. Such silk outfits cost 300
        gp.</p><p>Info</p><p>Silk wyrms that survive through the years become
        more cunning and develop more powers by eating other psion creature.
        They perfect their stalking technique and are almost impossible to
        detect before they strike. They patiently learn of the years every
        aspect of the region where they hunt, making them expert in setting
        ambushes against group of stronger foes. They are not afraid to fall
        back and harass a group of stronger creature for days until they are too
        weakened to resist the wyrm's final assault.</p>
      public: ''
