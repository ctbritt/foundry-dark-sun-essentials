  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Wherever the gray caresses the natural world</p><p>an
        indelible stain spreads. Darkness bleeds into the land, the sun dims,
        and the dead rise. Much of Athas has shuddered now and again under the
        Gray's touch, and the land sprouts a bountiful harvest of zombies. From
        the underbelly of Tyr to the ruins of Bodach in the Salt Meres to the
        Dead Land south of Balic, undead horrors aren't the villains of
        make-believe; they are the reality of which Athasians warn their
        children.</p><p>Lore</p><p>Athas's climate assaults corpses, and zombies
        do not linger in their rotting forms. Where abrasive winds and high
        temperatures batter the land, bones are quick to shed bloated flesh. But
        in the ever-thirsty mudflats and salt flats, zombies retain dried-out
        flesh as the terrain leeches the moisture from their undead
        bodies.</p><p>Encounters</p><p>Defiling magic and the Gray are Athas's
        primary zombie producers. Whether a templar is raising an undead army
        for personal gain or the Gray randomly spawns a new pack, the result is
        much the same. A band of zombies spread out to consume the vicinity's
        living creatures. All Athasians are familiar with zombies. Most fear
        that one day, they'll see undead eyes in the familiar visage of a lost
        lover, father, or friend.</p><p>Info</p><p>A flat, white plain stretches
        to the horizon. Steaming pits filled with caustic waters break the
        monotonous topography. Death stalks the Salt Meres, and travelers who
        overnight in the flats meet the creatures the bitter landscape has
        claimed. The hard-packed ground splits, spitting plumes of white dust.
        Zombies pour through the dust clouds, nostrils wide as they taste the
        scent of their next meal. Zombies rush warm flesh, claws extended and
        maws wide. Blades and bows do not frighten them; their minds see only
        the feast.</p>
