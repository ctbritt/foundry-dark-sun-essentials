  - _id: jp0XfCQlXbF3SBri
    name: Plant Growth
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '305'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>This spell channels vitality into
          plants. The casting time you use determines whether the spell has the
          Overgrowth or the Enrichment effect below.</p><div
          data-roll-name-ancestor="Overgrowth" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Overgrowth.</span></span> Choose a point
          within range. All normal plants in a 100-foot-radius
          @variantrule[Sphere [Area of Effect]|XPHB|Sphere] centered on that
          point become thick and overgrown. A creature moving through that area
          must spend 4 feet of movement for every 1 foot it moves. You can
          exclude one or more areas of any size within the spell's area from
          being affected.</p></div><div data-roll-name-ancestor="Enrichment"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="2"> <span
          class="entry-title-inner">Enrichment.</span></span> All plants in a
          half-mile radius centered on a point within range become enriched for
          365 days. The plants yield twice the normal amount of food when
          harvested. They can benefit from only one Plant Growth per
          year.</p></div></div>
