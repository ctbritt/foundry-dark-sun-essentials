  - _id: IXGVfIPRlCkv9ztY
    name: Heat Metal
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '284'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Choose a manufactured metal object,
          such as a metal weapon or a suit of Heavy or Medium metal armor, that
          you can see within range. You cause the object to glow red-hot. Any
          creature in physical contact with the object takes 2d8 damage when you
          cast the spell. Until the spell ends, you can take a
          @variantrule[Bonus Action|XPHB] on each of your later turns to deal
          this damage again if the object is within range.</p><p>If a creature
          is holding or wearing the object and takes the damage from it, the
          creature must succeed on a Constitution saving throw or drop the
          object if it can. If it doesn't drop the object, it has
          @variantrule[Disadvantage|XPHB] on attack rolls and ability checks
          until the start of your next turn.</p></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage increases by 1d8 for
          each spell slot level above 2.</p></div></div>
