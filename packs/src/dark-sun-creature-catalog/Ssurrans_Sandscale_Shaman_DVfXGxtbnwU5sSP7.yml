        value: >-
          <div class="rd__b  rd__b--3"><p>You evoke a fiery blade in your free
          hand. The blade is similar in size and shape to a scimitar, and it
          lasts for the duration. If you let go of the blade, it disappears, but
          you can evoke it again as a @variantrule[Bonus Action|XPHB].</p><p>As
          a @action[Magic|XPHB] action, you can make a melee spell attack with
          the fiery blade. On a hit, the target takes Fire damage equal to 3d6
          plus your spellcasting ability modifier.</p><p>The flaming blade sheds
          @variantrule[Bright Light|XPHB] in a 10-foot radius and
          @variantrule[Dim Light|XPHB] for an additional 10 feet.</p></div><div
          class="rd__b  rd__b--3"><p></p><div data-roll-name-ancestor="Using a
          Higher-Level Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h
