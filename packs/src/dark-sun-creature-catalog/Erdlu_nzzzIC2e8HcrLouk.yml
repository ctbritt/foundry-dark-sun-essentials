  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Erdlus are large flightless, featherless birds covered
        with flaky scales that range in color from pale gray to deep red. An
        erdlu can weigh as much as 200 pounds and grow to a height of 7 feet.
        Its massive, round body has a pair of useless wings that fold in at its
        sides. A snakelike neck rises to a small round head with a huge,
        wedge-shaped beak. A pair of powerful, lanky legs extend down from the
        body and end in four-toed, razor-clawed feet.</p><p>Erdlus make ideal
        herd animals because of their temperaments and ability to survive on a
        variety of foods. They can eat many forms of tough vegetation, as well
        as snakes, reptiles, and insects. The eggs that erdlus provide are an
        excellent source of nutrition. A diet of erdlu eggs can keep a human or
        demihuman alive for months at a time, for the eggs are packed with a
        variety of nutrients and essential vitamins. If an erdlu egg is eaten
        raw, it is a substitute for one gallon of water. However, this
        substitution is not perfect and can only be used successfully for no
        more than one week. The meat of an erdlu also makes an excellent
        meal.</p><p>In groups, erdlus instinctively flock together for
        protection. If threatened, these creatures usually flee. For short
        distances of no more than half a mile, erdlus can race along at great
        speeds (50 feet). Their normal walking pace is much slower (30 feet).
        When escape is not possible, the flock turns and fights as a group. They
        strike first with sharp beaks (inflicting 1d6 points of damage) then
        rake with one of their claws (causing 1d4 points of damage).</p><p>The
        hard scales of an erdlu's wings can be fashioned into shields or even
        armor (with an AC of 6), its beak can be used to make fine spearheads,
        and its claws can be crafted into daggers or tools.</p>
