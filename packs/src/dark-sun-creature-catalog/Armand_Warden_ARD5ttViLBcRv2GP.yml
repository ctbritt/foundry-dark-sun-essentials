  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>Armands are nomadic humanoids who wander the
        desert of Athas in search of new experiences. They operate as a
        democratic unit with all adult armands able to voice and vote in
        council. They don't believe in individual ownership and share all
        possessions and resources among other armands. Their philosophy scorns
        wealth because of its transitory nature. Of infinitely greater value are
        experiences, and those armands who have traveled, adventured, and
        returned to the tribe are deemed "wise ones" whose advice carries the
        most weight. Thus, many young adult armands leave their families and
        seek to see more of the world.</p><p>Armands worship through their
        philosophy the ideal of travel, nature, and the sun. They spend long
        moments meditating on the meaning of event but prefer to stray away from
        other races, avoiding conflicts when possible.</p><p>This pacifist
        mentality makes the armands the exception in the unforgiving land of
        Athas. Armand avoid at all cost the city states of the sorcerer-kings,
        despising the tyrannical rule that is law there. They enjoy civil
        relations with the giants of the Sea of Silt and trade with them often.
        They also do business with various aarakocra tribes of mountain chain of
        the Ringing Mountains. A tribe of armands will typically build a
        caravanserai around or near a desert oasis and open its gates to
        traders, adventurers, and other peaceful visitors.</p><p>In the
        south-east armands wandered freely across the deserts, maintaining a
        large monastery and trading post on the slopes of the Estuary of the
        Forked Tongue. However, the Dead Land undead's raids destroyed the
        armand monastery, and the few armand tribes that survived were driven
        north, into the inhospitable Salt Meres of Bodach and armand nomads have
        wandered the desert as free folk ever since.</p><p>Encounter</p><p>An
        armand tribe usually consists of several small, closely knit family
        groups that come together to share resources. When faced with a deadly
        common foe, many tribes will converge on a defensible location to "make
        their stand." Tribes look to the wardens for leadership, and a single
        tribe may have several wardens leading it. The armands rarely build
        permanent dwellings. They live in large communal tents or take advantage
        of ready shelter, such as caves.</p><p>Info</p><p>Armand leaders arise
        from those who have traveled widely and experienced much. It is the duty
        of an armand warden to return to the tribe and lend its wisdom to the
        group. An armand warden fights fiercely to defend itself or any other
        armand.</p>
      public: ''
