  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>Silt Horror is the name given a group of
        predators that dwell in the sea of sand. While they vary in size and
        color, all of them are characterized by a large number of tentacles, and
        an unending hunger. Few are the creatures that escape once a silt horror
        has its tentacles around them.</p><p>Info</p><p>The black silt horror is
        the smallest and most common of the silt horrors. Resembling a black,
        dusty octopus or squid with a writhing mass of eight barbed tentacles,
        the black horror is obviously related to the other horrors. It is much
        smaller than other silt horrors and roams in groups called clutches. The
        black silt horror aggressively hunts anything it can catch. Large
        clutches have attacked white horrors and wading giants.</p><p>Black silt
        horrors are a matriarchal society. The larges; female, the clutch
        leader, develops rudimentary psionic abilities that aid in capturing
        prey. Black silt horrors are found in the Sea of Silt and many smaller
        silt basins.</p><p>Once a year the black silt horrors of the Sea of Silt
        migrate to the same spot they were born. Here, a mating ritual lasting
        two weeks takes place. When the mating season is over, the horrors
        separate into their clutches and return to their home areas.</p>
