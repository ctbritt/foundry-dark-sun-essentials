  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Tribes of elves roam the deserts of athas</p><p>and
        bring their wares to the scattered settlements. Though they are
        considered shifty and untrustworthy, the elves bring unique items to
        their traveling markets that ensure plenty of
        business.</p><p>Lore</p><p>Stories of elves describe swindlers in elven
        bazaars and wandering bands of raiders that strip caravans of goods.
        Entire elf tribes have disappeared from city-states after a single
        member ran afoul of the templars.</p><p>Though considered dangerous by
        most other races, the elven markets of the various city-states are an
        important source of contraband, particularly that of the magical
        variety. However, most people know to be cautious when dealing with
        elves, since being cheated in a deal is the least of what they have been
        known to do. Most elves simply seek to get the most out of any bargain,
        and the more cutthroat members of a tribe might use that motivation as
        an excuse to murder and steal.</p><p>Encounters</p><p>Outcast elves join
        members of other races, frequently in raiding bands. Elves might travel
        with beasts of burden, which are unassuming in appearance but trained
        for battle. Unless it is badly injured, however, no elf ever rides.
        Beasts are for transporting goods or making war- elves define themselves
        by their ability to run.</p><p>Info</p><p>Tribes of elves lope across
        the wastelands. Lithe and hardy, they cover vast distances over
        dangerous terrain every day. Dune striders swoop down on travelers,
        seizing anything of value before retreating. Operating in small groups,
        dune striders try to spread out their attacks to force enemies to
        surrender their possessions. If this tactic doesn't work, they
        retreat.</p>
