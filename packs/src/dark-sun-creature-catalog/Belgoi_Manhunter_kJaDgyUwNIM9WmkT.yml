  - _id: 7VbyJvw0zTODmObz
    name: Bell of Terror
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The belgoi rings his bell and target
          one humanoid or beast that he can see with 30ft of him. If the target
          can hear the bell it must succeed on a Wisdom saving throw DC <span
          class="rd__dc">15</span> or being magically
          &amp;Reference[condition=frightened]. Deafened creatures are immune to
          this capacity. The effect lasts for one minute or until the belgoi
          dies, is on a different plane of existence from the target, or ends
          the effect as a bonus action. A &amp;Reference[condition=frightened]
          target can repeat the saving throw at each of its turns, ending the
          effect on itself on a success. If a target's saving throw is
          successful, the target is immune to the belgoi's Bell of Terror for
          the next 24 hours.</p></div>
