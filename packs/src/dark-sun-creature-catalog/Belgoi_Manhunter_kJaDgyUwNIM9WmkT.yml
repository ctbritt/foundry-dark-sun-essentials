  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Terrible sounds are carried</p><p>across the Athasian
        plains, but perhaps the most insidious is the jingling of small bells-
        the work of belgoi. The dissonant chimes of these gaunt humanoids tug at
        travelers' minds, entrancing victims and luring them out into the
        wastes, where they become easy prey for the hungry
        belgoi.</p><p>Lore</p><p>Once a proud, evil race of fey, the belgoi were
        stranded in the barrens of Athas by the destruction of their homelands.
        They came to hate the desert world and all its residents, and they
        degenerated into a madness that has led them to devour other humanoids
        and despoil all they touch. Life force literally leaks from some of the
        wounds inflicted by belgoi.</p><p>Belgoi gather in small, nomadic tribes
        that are led by the strongest member. They ruin wherever they live,
        consuming everything they can and destroying or polluting the rest.
        While the tribe camps, hunting parties scour the surrounding area for
        game. Belgoi kill and eat whatever they can catch, but they prefer meat
        seasoned with the terror that a sentient creature feels when it faces
        impending death.</p><p>BeJgoi have another reason for devouring
        humanoids-they believe that eating the flesh of a victim grants them the
        fallen one's power. The strongest belgoi have consumed numerous enemies.
        For the sake of gaining and conserving personal power, belgoi also eat
        their own dead. They harbor a special taste for eladrin, whom they blame
        for destroying their home.</p><p>Encounters</p><p>Wicked humanoids such
        as gith might ally with belgoi or take in a few stalkers or hunters that
        lack the numbers to form their own raiding band or tribe. Like other
        humanoids, belgoi catch and tame wild beasts such as baazrags,
        chathrangs, and drakes. In particular, belgoi keep creatures that are
        skilled trackers or that can sniffout wounded prey. These beasts are
        intentionally malnourished by the belgoi, making them vicious and
        forcing them to fend for themselves.</p><p>Info</p><p>Most belgoi devour
        enemies for their strength and believe that each fallen enemy grant them
        strength. The belgoi manhunter have embraced this idea and indulge in
        extreme cannibalism, crafting armors with the bones of their fallen
        foes. This gruesome diet bolsters their psychic abilities to an
        unparalleled level in their race. They like nothing more than devouring
        the flesh of a terrified prey.</p>
      public: ''
