  details:
    biography:
      value: >-
        <p>The jozhal live in small family groups of four to five creatures.
        They are extremely intelligent and cunning, but regard humans or
        demihumans as foolish, dangerous creatures and will rarely tolerate
        them.</p><p>Jozhals are attracted to magic of all sorts, and whenever
        they see humans or demihumans passing they track the party down and
        attempt to cast a detect magic spell on the group. If the spell reveals
        any magical items, they will try to sneak into camp and steal
        them.</p><p>Jozhals forage for food (roots and tubers), and eat almost
        any sort of small reptile, snake, or insect. Their magic is akin to that
        of elemental clerics, and is therefore not destructive to the
        environment around them.</p><p>The jozhal clans intellect is best
        reflected in its relationship to the world around it. They are very
        careful never to destroy the lifegiving world in which they live, always
        making use of every bit of scrap and refuse that they find. They carry
        this to extremes, even practicing cannibalism and using the bones of
        their dead to construct weapons and tools.</p>
