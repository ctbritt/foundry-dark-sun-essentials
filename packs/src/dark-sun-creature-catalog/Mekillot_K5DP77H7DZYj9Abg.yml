  details:
    biography:
      value: >-
        <p>Mekillots are mighty lizards weighing up to six-tons. Their backs and
        heads are covered with a thick shell that serves as both a sunshade and
        protection from attacks by other large creatures. Their undersides are
        covered with much softer scales.</p><p>Despite their vicious
        dispositions, mekillots are often used as caravan beasts. A hitched pair
        can pull a wagon weighing 10-20 tons at a slow, plodding
        pace.</p><p>Mekillots are never truly tame, however; even when they are
        hitched to a wagon, the stubborn creatures have been known to turn off
        the road and go wandering off for days— without any apparent reason.
        They are also noted for making snacks of their handlers. Because of the
        difficulties of controlling these beasts, most caravans rely on
        psionicists with the appropriate powers to drive them.</p>
      public: ''
