  - _id: mZAshRAfOmwwe3Wl
    name: Antipathy/Sympathy
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '242'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>As you cast the spell, choose whether
          it creates antipathy or sympathy, and target one creature or object
          that is Huge or smaller. Then specify a kind of creature, such as red
          dragons, goblins, or vampires. A creature of the chosen kind makes a
          Wisdom saving throw when it comes within 120 feet of the target. Your
          choice of antipathy or sympathy determines what happens to a creature
          when it fails that save:</p><ul class="rd__list
          rd__list-hang-notitle"><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Antipathy"><span class="bold
          rd__list-item-name">Antipathy.</span> The creature has the
          &amp;Reference[condition=Frightened] condition. The
          &amp;Reference[condition=Frightened] creature must use its movement on
          its turns to get as far away as possible from the target, moving by
          the safest route.</p></li><li class="rd__li "><p
          class="rd__p-list-item" data-roll-name-ancestor="Sympathy"><span
          class="bold rd__list-item-name">Sympathy.</span> The creature has the
          &amp;Reference[condition=Charmed] condition. The
          &amp;Reference[condition=Charmed] creature must use its movement on
          its turns to get as close as possible to the target, moving by the
          safest route. If the creature is within 5 feet of the target, the
          creature can't willingly move away. If the target damages the
          &amp;Reference[condition=Charmed] creature, that creature can make a
          Wisdom saving throw to end the effect, as described
          below.</p></li></ul><div data-roll-name-ancestor="Ending the Effect"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Ending the
          Effect.</span></span> If the &amp;Reference[condition=Frightened] or
          &amp;Reference[condition=Charmed] creature ends its turn more than 120
          feet away from the target, the creature makes a Wisdom saving throw.
          On a successful save, the creature is no longer affected by the
          target. A creature that successfully saves against this effect is
          immune to it for 1 minute, after which it can be affected
          again.</p></div></div>
        chat: ''
      level: 8
      school: enc
