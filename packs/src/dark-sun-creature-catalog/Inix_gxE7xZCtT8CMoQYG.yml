        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>An inix is a large lizard that falls between kanks and
        mekillots for sheer size. It weighs about two tons and grows to lengths
        of 16 feet. The inix's back is protected by a thick shell, while
        flexible scales cover its underside.</p>
