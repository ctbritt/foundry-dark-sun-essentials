  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Cilopses prowl sandy wastes</p><p>and deserted streets
        at night, seeking an easy meal. Templars favor cilopses as hunters
        because of their psionic-based tracking talents. Enemies of the
        sorcerer-kings shut their doors and slink away into the shadows when
        they hear the scuttling sound of a cilops
        approach.</p><p>Lore</p><p>Mundane centipedes of Athas infest any area
        where water collects, and these larger predatory versions are found in
        the same environments. Cilopses have tougher shells than their smaller
        kin, as well as psionic abilities that debilitate prey and keep it
        within striking range.</p><p>Encounters</p><p>Captured cilopses can be
        trained as pets or guardians. Some templars train cilops stalkers as
        lone hunters, then turn them loose in the streets of the
        city-states.</p>
