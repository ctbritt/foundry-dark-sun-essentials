  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The caravan drivers look warily down at the deep canyons
        on each side of the narrow path they traverse. A sudden wind whips up,
        and they struggle to keep the inixes on course. Looking back to the
        other wagons, they watch in awe as people and kanks rise into the air,
        suspended by an unseen force, then plummet into the rocky depths. From
        midair bursts a monster amid a flurry of raking claws and buffeting
        winds. Air drakes are ambush predators that prefer to tenderize their
        food by dropping it from a great height. They commonly attack creatures
        traveling along dangerous precipices. A drake sails in surrounded by its
        wind veil and rips at its target, then buffets the victim with a blast
        of wind to force it over the edge. It does not risk counterattacks by
        focusing too long on anyone target.</p><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Lair Actions" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="1"> <span
        class="entry-title-inner">Lair Actions</span></h3> <p>On initiative
        count 20 (losing initiative ties), the dragon takes a lair action to
        cause one of the following effects; the dragon can't use the same effect
        two rounds in a row:</p><ul class="rd__list"><li class="rd__li ">A cloud
        of sand swirls about in a 20-foot-radius sphere centered on a point the
        dragon can see within 120 feet of it. The cloud spreads around corners.
        Each creature in the cloud must succeed on a DC 15 Constitution saving
        throw or be blinded for 1 minute. A creature can repeat the saving throw
        at the end of each of its turns, ending the effect on itself on a
        success.</li><li class="rd__li ">Lightning arcs, forming a 5-foot-wide
        line between two of the lair's solid surfaces that the dragon can see.
        They must be within 120 feet of the dragon and 120 feet of each other.
        Each creature in that line must succeed on a DC 15 Dexterity saving
        throw or take 10 (3d6) lightning damage.</li><li class="rd__li ">A
        strong wind blows around the dragon. Each creature within 60 feet of the
        dragon must succeed on a DC 15 Strength saving throw or be pushed 15
        feet away from the dragon and knocked prone. Gases and vapors are
        dispersed by the wind, and unprotected flames are extinguished.
        Protected flames; such as lanterns, have a 50 percent chance of being
        extinguished.</li></ul></div></div><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Regional Effects" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="2"> <span
        class="entry-title-inner">Regional Effects</span></h3> <p>The region
        containing an air drake's lair is warped by the dragon's elemental
        magic, which creates one or more of the following effects:</p><ul
        class="rd__list"><li class="rd__li ">Thunderstorms and sandstorms rage
        within 6 miles of the lair.</li><li class="rd__li ">Dust devils scour
        the land within 6 miles of the lair. A dust devil has the statistics of
        an air elemental, but it can't fly, has a speed of 50 feet, and has an
        Intelligence and Charisma of 1 (- 5).</li><li class="rd__li ">Within 1
        mile of its lair, the dragon leaves no physical evidence of its passage
        unless it wishes to. Tracking it there is impossible except by magical
        means.</li><li class="rd__li ">Natural caverns and windblown canyons
        within 1 mile of the drake's lair form intermittent portals to the
        Elemental Plane of Air, allowing elemental creatures into the mortal
        world to dwell near those locations.</li></ul><p>If the drake dies,
        these effects fade over the course of 1d10 days.</p></div></div>
