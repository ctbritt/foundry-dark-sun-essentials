  - _id: HBm0NlShmORmJrVx
    name: Regional Effects
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The region containing an air drake's
          lair is warped by the dragon's elemental magic, which creates one or
          more of the following effects:</p><ul class="rd__list"><li
          class="rd__li ">Thunderstorms and sandstorms rage within 6 miles of
          the lair.</li><li class="rd__li ">Dust devils scour the land within 6
          miles of the lair. A dust devil has the statistics of an air
          elemental, but it can't fly, has a speed of 50 feet, and has an
          Intelligence and Charisma of 1 (- 5).</li><li class="rd__li ">Within 1
          mile of its lair, the dragon leaves no physical evidence of its
          passage unless it wishes to. Tracking it there is impossible except by
          magical means.</li><li class="rd__li ">Natural caverns and windblown
          canyons within 1 mile of the drake's lair form intermittent portals to
          the Elemental Plane of Air, allowing elemental creatures into the
          mortal world to dwell near those locations.</li></ul><p>If the drake
          dies, these effects fade over the course of 1d10 days.</p></div>
