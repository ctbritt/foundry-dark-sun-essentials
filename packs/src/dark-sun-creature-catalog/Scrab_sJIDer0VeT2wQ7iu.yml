  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Scrabs are small, three-sectioned, insect-like men who
        live in nests in the desert. They are highly intelligent, and some of
        them are even able to cast spells. No small group of travellers is safe
        in the vicinity of a scrab nest.</p><p>Scrabs live in the sandy wastes,
        or in the sandy areas of the rocky barrens. They need little water,
        perhaps 1/20th of what a human needs. Scrabs also seem to get all of the
        liquid they need from the blood of their victims. A scrab's niche in the
        environment is strictly that of a predator, although scrabs are also
        preyed upon by the larger creatures that inhabit the
        wastes.</p><p>Scrabs live in large nests tunnelled under the sand. They
        produce a spittle that solidifies the sand. Because of the ever-present
        sandstorms, the scrab nest is usually located 15 feet under the surface.
        If available, a rocky outcropping is used to hide and protect the
        entrance. Scrabs are excellent tunnellers, and if the nest collapses on
        them they just dig it out again. A scrab can hold its breath for up to
        an hour under sand and even gets a bit of air from the surrounding sand.
        This is due to the long gills through which scrabs breath. These gills
        are located all along the grooves in their shells.</p>
