  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>With their armored backs</p><p>these enormous,
        temperamental drakes make valuable mounts and formidable enemies. Any
        mekillot rider knows that the line between mount and foe is a thin one.
        Only careful handling or psionic control keeps an angry or a hungry
        mekillot from turning on its trainer.</p><p>Lore</p><p>Wild mekillots
        roam the wastes in small herds, eating plants and animals and laying
        eggs near oases. The animals are tough, aggressive, and headstrong, but
        they can be domesticated if raised from birth. The demand for these
        beasts has resulted in humanoid collectors killing numerous feral
        mekillot adults and stealing their eggs. Defilers who serve
        sorcerer-kings perform intricate rituals on the eggs to create dreadful
        beasts of war.</p><p>Encounters</p><p>Humanoids use mekillots as draft
        animals and war beasts. The largest mekillots carry numerous warriors or
        battle structures in times of war.</p><p>Info</p><p>This colossal
        mekillot are used for war, acting as troupe carrier or platform for
        siege engine. Dirk mekillot are never found in nature, they are bread
        for the purpose of war by the sorcerer-king's defilers. Few things can
        stop this monstrosity in battle, sheltered in their armor and often
        protected by extra layers of protection. Only the most talented psychic
        can control this mekillot.</p>
      public: ''
