  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Air drakes are the most flighty and unpredictable of the
        species, making them dangerous adversaries. They spend most of their
        time soaring the Athasian skies.</p><p>Air drakes are the longest and
        leanest of the four drake types. They have folds of loose skin that
        stretch between their front and back legs. This skin unfolds when they
        extend their legs creating a wing membrane. They have a long, lean frame
        and are light of bone, contributing to their speed and
        agility.</p><p>Air drakes prefer their food thoroughly softened before
        eating it. To accomplish this, a drake will swoop, grab its prey, soar
        into the sky, and then drop it. Air drakes often choose crags or rocky
        outcroppings for "tenderizing their meat". If the prey can fly, it will
        take the victim aloft and dive straight for the ground, releasing its
        prey and pulling up at the last minute.</p><p>AN AIR DRAKE'S
        LAIR</p><p>Air drakes do not keep a single residence. They prefer a
        dozen or so safe areas. Because they move around so much, air drakes
        gather and horde few possessions and treasure. Often if they find an
        object that pleases them, they will store it at a lofty, inaccessible
        location. They will leave it and return to visit only when the mood
        strikes them. Little infuriates an air drake more than having one of
        these precious items stolen.</p><p>If air drake is taken by surprise in
        its lair, it will try to use hurricane winds around its lair to gain
        advantage over invaders with its now magnified aerial
        superiority.</p><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Lair Actions" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="1"> <span
        class="entry-title-inner">Lair Actions</span></h3> <p>On initiative
        count 20 (losing initiative ties), the drake takes a lair action to
        cause one of the following effects; the drake can't use the same effect
        two rounds in a row:</p><ul class="rd__list"><li class="rd__li ">A line
        of strong wind 60 feet long and 10 feet wide blasts from a point drake
        chooses within 60 feet of it. Any creature caught in wind must succeed
        on a DC 15 Dexterity saving throw or take 10 (3d6) bludgeoning damage
        and be pushed 15 feet away from drake in a direction following the
        line.</li><li class="rd__li ">A 120-feet sphere of tornado-like winds
        from the elemental plane of air appears centered on a point the drake
        chooses within 120 feet of it. When the sphere appears, each Large or
        smaller creature within sphere that is currently flying must make a DC
        15 Dexterity saving throw. On a failed save, a creature is knocked prone
        and then if that creature is still in the air it is pushed 60 feet to
        the ground. Gases and vapors are dispersed by the wind, and unprotected
        flames are extinguished. Protected flames; such as lanterns, have a 50
        percent chance of being extinguished.</li><li class="rd__li ">A strong
        wind blows around the drake. Each creature within 60 feet of the drake
        must succeed on a DC 15 Strength saving throw or be pushed 15 feet away
        from the drake and knocked prone. Gases and vapors are dispersed by the
        wind, and unprotected flames are extinguished. Protected flames; such as
        lanterns, have a 50 percent chance of being
        extinguished.</li></ul></div></div><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Regional Effects" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="2"> <span
        class="entry-title-inner">Regional Effects</span></h3> <p>The region
        containing an air drake's lair is warped by the drake's power, which
        creates one or more of the following effects:</p><ul
        class="rd__list"><li class="rd__li ">Strong winds blow within 6 miles of
        the drake's lair.</li><li class="rd__li ">Once per day, the drake can
        alter the weather in a 6-mile radius centered on its lair. The drake
        doesn't need to be outdoors; otherwise the effect is identical to the
        control weather spell.</li><li class="rd__li ">Whenever a creature with
        an Intelligence of 3 or higher flies more than 30 feet in the air within
        1 mile of the drake's lair, the drake becomes aware of the creature's
        presence and location.</li></ul><p>If the drake dies, these effects fade
        over the course of 1d10 days.</p></div></div>
