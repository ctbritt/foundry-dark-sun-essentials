  - _id: tIUoBDiW3UPMdS5m
    name: Storm of Vengeance
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '321'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>A churning storm cloud forms for the
          duration, centered on a point within range and spreading to a radius
          of 300 feet. Each creature under the cloud when it appears must
          succeed on a Constitution saving throw or take 2d6 damage and have the
          &amp;Reference[condition=Deafened] condition for the
          duration.</p><p>At the start of each of your later turns, the storm
          produces different effects, as detailed below.</p><div
          data-roll-name-ancestor="Turn 2" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Turn 2.</span></span> Acidic rain falls.
          Each creature and object under the cloud takes 4d6
          damage.</p></div><div data-roll-name-ancestor="Turn 3" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="2"> <span
          class="entry-title-inner">Turn 3.</span></span> You call six bolts of
          lightning from the cloud to strike six different creatures or objects
          beneath it. Each target makes a Dexterity saving throw, taking 10d6
          damage on a failed save or half as much damage on a successful
          one.</p></div><div data-roll-name-ancestor="Turn 4" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="3"> <span
          class="entry-title-inner">Turn 4.</span></span> Hailstones rain down.
          Each creature under the cloud takes 2d6 damage.</p></div><div
          data-roll-name-ancestor="Turns 5-10" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="4"> <span
          class="entry-title-inner">Turns 5-10.</span></span> Gusts and freezing
          rain assail the area under the cloud. Each creature there takes 1d6
          damage. Until the spell ends, the area is @variantrule[Difficult
          Terrain|XPHB] and @variantrule[Heavily Obscured|XPHB], ranged attacks
          with weapons are impossible there, and strong wind blows through the
          area.</p></div></div>
