  - _id: i2kCDARcNo2DDsza
    name: Regional Effects
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The region containing an air drake's
          lair is warped by the drake's power, which creates one or more of the
          following effects:</p><ul class="rd__list"><li class="rd__li ">Strong
          winds blow within 6 miles of the drake's lair.</li><li class="rd__li
          ">Once per day, the drake can alter the weather in a 6-mile radius
          centered on its lair. The drake doesn't need to be outdoors; otherwise
          the effect is identical to the control weather spell.</li><li
          class="rd__li ">Whenever a creature with an Intelligence of 3 or
          higher flies more than 30 feet in the air within 1 mile of the drake's
          lair, the drake becomes aware of the creature's presence and
          location.</li></ul><p>If the drake dies, these effects fade over the
          course of 1d10 days.</p></div>
