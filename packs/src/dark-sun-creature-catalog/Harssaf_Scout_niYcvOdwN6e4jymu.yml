  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>As harsh and unyielding as their desert
        homes, harssafs don't typically deal congenially with others. Harssafs
        live in and wander the great deserts and barren places of Athas.
        Seemingly composed of the fire and sand of their home terrain, they live
        in nomadic bands and frequently raid settlements within or near their
        homes. Harssafs live mostly insular lives, traveling and raiding
        throughout a massive section of the Tableland, the Great Aluvial Sand
        Wastes and the Endless Sand Dunes. Harssafs have no compunctions about
        killing when necessary, but they take no particular pride in it. Killing
        to the harssafs is a necessary skill to survive the coming sandstorms
        that will carry the great desert to the far reaches of the world. Both
        male and female harssafs stand about 6 feet tall and weigh about 190
        pounds. Harssaf communities dot the great deserts of Sarlona. When
        humans migrated from Sarlona to Khorvaire millennia ago, they brought
        harssaf slaves with them. Their descendants gather in small tribes in
        the heart of the Talenta Plains, where the harssafs maintain a tenuous
        truce with roaming halfling plainsfolk. The halflings of the Talenta
        Plains refer to these harssaf "interlopers" as the
        Flameborn.</p><p>Harssaf clans are incredibly structured, composed of a
        strict caste system of scouts and tenders. Tenders comprise less than
        one-third of a band's total population, and even they are capable
        warriors. Consisting mostly of scouts incapable of fighting due to age
        or infirmity, pregnant females, young children, and the few craftsfolk
        of the clan, tenders are regarded as second-class citizens. Leaders of
        the clans always emerge from the scout caste, which consists of any male
        or female of fighting age. Males and females have an equal opportunity
        to prove themselves worthy of the scout caste. But females who have
        children are relegated to be tenders until their children are old enough
        to be left with others of the caste. Only then can these females return
        to the scout clan. As a result, children are raised by the clan as a
        whole, being alternately schooled by different members of the scout
        caste. These scouts have taken it upon themselves to educate the
        youngsters in various martial and religious mysteries to ensure they are
        prepared to choose their career when they come of
        age.</p><p>Encounter</p><p>Harssaf clans sometimes skirmish over
        resources or territory, but they prefer to avoid fighting other chosen
        desert dwellers and focus their raids on the soft outlanders. A harssaf
        camp is usually composed of several small tents shared by tenders, and a
        few large pavilions where the scouts stay. Due to their natural affinity
        for hot and sandy environments, harssafs have no problem sleeping in the
        open desert. Rumors exist of ancient harssaf structures in the deepest
        deserts, strongholds that all clans visit from time to time. These
        strongholds are said to hold the history of the mysterious harssaf
        people, as well as monasteries that devote themselves to schooling the
        many monks of the harssaf clans.</p><p>Info</p><p>A harssaf prefers to
        ambush its opponents, hiding among the dunes near the desert edge in
        sand form or just beneath the sands and using its blindsense to
        determine when potential targets wander by. Once engaged in melee, a
        harssaf ignites its weapons and closes to melee, wielding its twin
        kukris with deadly efficiency.</p>
