  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Creatures with primeval origins</p><p>cloud rays are as
        rare as they are tremendous in size. They float in from the Sea of Silt
        to feed and rest, and are rarely dangerous unless
        disturbed.</p><p>Lore</p><p>Although cloud rays are big enough to
        consume whole villages, these exotic beasts subsist largely on psychic,
        entropic, and magical energy. Despite their great size, they require a
        tiny amount of physical sustenance-even less as they grow older-so they
        are rarely dangerous.</p><p>Cloud ray elders settle onto the land, cover
        themselves in sand or debris, and fall into deep slumber until material
        hunger or an external disturbance rouses them. Tales tell of travelers
        who camped on a choice piece of high ground that turned out to be a
        sleeping elder and awoke high in the sky or in unfamiliar
        surroundings.</p><p>Sometimes cloud rays disappear during their repose,
        reappearing in a distant place of which they dreamed. Wounded rays can
        tap into this "dream space" briefly, sapping their enemies in the
        process.</p><p>Encounters</p><p>A cloud ray elder is as much a setting
        for combat as it is an opponent, if adventurers inadvertently set foot
        on it. While riding the creature's back, they are sitting ducks for
        other flying predators, including younger cloud rays. Cloud ray pups
        gather around a creature that feeds them (usually an older cloud ray) or
        follow a predator that allows them to scavenge its
        scraps.</p><p>Info</p><p>These 50-foot-long giants of the sky are
        exceedingly rare. They drift lazily through the air or settle for long
        naps on the warm sands. When attacking, the gigantic ray wings among its
        enemies to lash them with thunder or grab them in its crushing jaws.
        Like younger cloud rays, it might drop grabbed prey. But the elder tries
        to ensure that dropped creatures end up close together so that it can
        grab them all up again during its next flyby.</p>
