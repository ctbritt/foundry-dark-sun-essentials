  - _id: o6BpWSqeP5S2AIgE
    name: Spellcasting (Psionics)
    type: feat
    system:
      source:
        custom: ''
        book: ENK
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The mindbender is an 8th-level
          psionicist. Its innate spellcasting ability is Intelligence (spell
          save DC 13; +5 to hit with spell attacks). It can innately cast the
          following sorcerer spells, requiring no components:</p><p>At will:
          @spell[control flames], @spell[infestation] (2d6), @spell[mage hand]
          (hand is invisible), @spell[mind sliver] (2d6), @spell[minor
          illusion]</p><p>1st level (4 slots): @spell[catapult], @spell[charm
          person], @spell[dissonant whispers], @spell[mage armor],
          @spell[shield], @spell[Tasha's hideous laughter]</p><p>2nd level (3
          slots): @spell[detect thoughts], @spell[hold person], @spell[mind
          spike], @spell[suggestion], @spell[Tasha's mind whip]</p><p>3rd level
          (3 slots): @spell[major image], @spell[sending],
          @spell[slow]</p><p>4th level (2 slots): @spell[Evard's black
          tentacles], @spell[dominate beast], @spell[Raulothim's psychic
          lance]</p><p>The target gains unbearable feeling of dread and
          uselessness instead of laughing.</p></div>
