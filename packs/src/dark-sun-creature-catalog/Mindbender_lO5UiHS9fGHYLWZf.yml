      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The mindbender has 8 sorcery points.
          It can spend 1 or more sorcery points as a bonus action to gain one of
          the following benefits:</p><p>Heightened Spell: When it casts a spell
          that forces a creature to make a saving throw to resist the spell's
          effects, the mindbender can spend 3 sorcery points to give one target
          of the spell disadvantage on its first saving throw against the
          spell.</p><p>Subtle Spell: When the mindbender casts a spell, it can
          spend 1 sorcery point to cast the spell without any somatic or verbal
          components.</p></div>
