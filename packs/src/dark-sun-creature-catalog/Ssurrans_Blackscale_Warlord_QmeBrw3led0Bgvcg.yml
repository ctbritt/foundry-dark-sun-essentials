  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Ssurrans are hardy reptilian humanoids</p><p>that live
        and hunt under the blazing sun. Like other Athasians, a ssurran's
        day-to-day goal is survival.</p><p>Lore</p><p>The nomadic ssurrans, also
        called sandscale lizard folk, traverse the blistering desert sands in
        loose tribes. The ssurrans are tribal in nature, roaming in groups of
        related families. At times these groups can dwindle in size,
        particularly after a lean spell, but tribes have also been known to band
        together for common purpose, forming vast hordes that last for as long
        as need or firm leadership binds them. The harsh conditions of life on
        Athas have driven many ssurrans to live the lives of raiders, taking by
        force what they cannot gain by other means. Some groups hunt while
        others raid settlements. They allow inhabitants to flee, and kill only
        those who resist. The ever-practical ssurrans then strip a village of
        its usable goods and move on. The tribe's hunters follow behind,
        clearing away signs of their passage and laying false trails.</p><p>The
        more fortunate and enterprising tribes have turned to trade as a way of
        life, forging more productive relationships with the other peoples of
        their region. Whatever their major pastime, all ssurran tribes are
        natural scavengers and hunter-gatherers. Ssurrans rarely live outside a
        tribe. On rare occasion, a ssurran wanders alone, either as an outcast
        or the last of its tribe. Sometimes, slavers capture young ssurrans to
        sell in city-states as exotic merchandise. Ssurrans are hunted for their
        young by some. Ssurrans raised from the egg can be trained as guards,
        scouts, and gladiators, and are valued in the city-states of the south.
        Ssurrans are strict carnivores, and some of their kind are reported to
        enjoy the flavor of halfling flesh over others (apparently they find it
        soft and sweet, but with a piquant
        after-taste...).</p><p>Encounters</p><p>A typical ssurran is laden down
        under patchwork armor, assorted bric-a-brac and battered trade goods,
        and armed with a bizarre assortment of weaponry from across the
        Tablelands. These reptilian humanoids roam the Tablelands, trading,
        raiding and hunting that which does not hunt them. Standing up to 6 feet
        tall, they are a hardy species that have adapted to deal with Athas'
        unforgiving climate. In the region of the Scorched Plateau, their
        natural resistance to extremes of heat has allowed them to stake their
        claim over the immediate environs of Lava Gorge, where the majority of
        other races simply cannot venture. Ruled over by their priests, ssurrans
        hold ancient beliefs in strange gods and have a reputation for barbarism
        that is perhaps a little undeserved.</p><p>When it comes to battle,
        ssurrans are vicious, disorganized and somewhat cowardly. They prefer to
        maneuver their opponents into positions of disadvantage and will strike
        from ambush whenever possible. Ssurrans would rather attack with
        superior numbers and have been known to flee from battles that they
        might have won simply because they have believed themselves to be
        outnumbered. For the ssurrans, the ideal battle is one where you and a
        large amount of your fellows strike from ambush, surprise the foe and
        over-run him with sheer numbers. Victorious ssurrans have been known to
        strip the corpses of the fallen, scarring or otherwise marking the dead
        as food, for later consumption. Ssurrans strike with dreadfully sharp
        claws and a savage, snapping bite. Those of a more civilized bent arm
        themselves with whatever weapons they can find and deal solid, brutal
        blows with these. Impalers, macahuitl and spears are all popular arms
        with the ssurrans.</p><p>Ssurrans Blackscale</p><p>Like their smaller
        cousins, blackscale ssurran are primitive reptilian humanoids that can
        be very dangerous if provoked. A blackscale lizardfolk is usually 8-1/2
        to 9-1/2 feet tall, and weighs about 600 pounds. Its tail is 4 to 5 feet
        long.</p><p>Blackscale ssurran are proud and fierce fighters, concerned
        with heroic action and personal glory. Left on their own, they will
        fight as disorganized individuals, but their leaders can force them to
        work together for short periods of time. The blackscales have little
        patience for tricks and traps, considering such tools to be the trade of
        lesser ssurran. They are proud and arrogant, and are usually extremely
        hostile toward humans who trespass into the deep deserts where they
        live. While their culture is quite primitive, the black scales have
        access to the vaults and arsenals of ancient cities. High-ranking
        warriors or priests wear glittering bone and primitive ornaments, and
        the weapons of the blackscales are often elaborately carved and
        decorated.</p><p>The blackscales typically live off the "tribute" they
        extract from the other tribes and merchant house offerings made to
        prevent them from raiding trade routes. The war priests hold the
        ultimate authority within society but rarely use this power; in the
        absence of interference from a priest, the most powerful warrior rules
        the tribe. Any of the three species of ssurran can be called to serve as
        a priests; the blackscales consider the priests to be chosen ones, and
        thus see no shame in following their commands.</p><p>Info</p><p>Once in
        a generation a blackscale is born with tremendous strength, ferocity and
        evil in its heart. These fearsome creatures are touched by the demon
        lord Sess'inek's and gifted with demonic might. They soon take control
        of their tribe and quickly conquer other lesser ssurran tribe. Once they
        have gathered enough members they begin a campaign of slaughter and
        terror against other intelligent races. If left uncheck these tribe of
        ssurran can grow in numbers and even pose a threat to the city-states.
        In combat the blackscale warlord is rushing in the melee, killing
        everything that crosses his path.</p>
