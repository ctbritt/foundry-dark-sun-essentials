  - _id: 7Q7gegmgLIYNLz2Y
    name: Compelling Bell
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The belgoi rings his bell and target
          one humanoid or beast that he can see with 30ft of him. If the target
          can hear the bell it must succeed on a Wisdom saving throw DC <span
          class="rd__dc">13</span> or being magically
          &amp;Reference[condition=charmed]. Deafened creatures are immune to
          this capacity. The &amp;Reference[condition=charmed] creature regards
          the belgoi as a frightening master to be heeded and obeyed. Although
          the target isn't under the belgoi's control, it takes the belgoi's
          requests or actions in the most favorable way it can. Each time
          the</p><p>belgoi or its allies do anything harmful to the target, it
          can repeat the saving throw, ending the effect on itself on a success.
          Otherwise, the effect lasts for an hour or until the belgoi dies, is
          on a different plane of existence from the target, or ends the effect
          as a bonus action. If a target's saving throw is successful, the
          target is immune to the belgoi's Compelling Bell for the next 24
          hours. The belgoi can have no more than one humanoid and up to three
          beasts &amp;Reference[condition=charmed] at a time.</p></div>
