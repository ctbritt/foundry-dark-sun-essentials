      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Protective spirits flit around you in
          a 15-foot @variantrule[Emanation [Area of Effect]|XPHB|Emanation] for
          the duration. If you are good or neutral, their spectral form appears
          angelic or fey (your choice). If you are evil, they appear
          fiendish.</p><p>When you cast this spell, you can designate creatures
          to be unaffected by it. Any other creature's @variantrule[Speed|XPHB]
          is halved in the @variantrule[Emanation [Area of
          Effect]|XPHB|Emanation], and whenever the @variantrule[Emanation [Area
          of Effect]|XPHB|Emanation] enters a creature's space and whenever a
          creature enters the @variantrule[Emanation [Area of
          Effect]|XPHB|Emanation] or ends its turn there, the creature must make
          a Wisdom saving throw. On a failed save, the creature takes 3d8 damage
          (if you are good or neutral) or 3d8 damage (if you are evil). On a
          successful save, the creature takes half as much damage. A creature
          makes this save only once per turn.</p></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage increases by 1d8 for
          each spell slot level above 3.</p></div></div>
