  - _id: NJp57aXIHFTo82nR
    name: Scrying
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '313'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You can see and hear a creature you
          choose that is on the same plane of existence as you. The target makes
          a Wisdom saving throw, which is modified (see the tables below) by how
          well you know the target and the sort of physical connection you have
          to it. The target doesn't know what it is making the save against,
          only that it feels uneasy.</p><table class="w-100 rd__table 
          stripe-odd-table"><thead><tr><th class="rd__th ve-col-10 "
          data-rd-isroller="false">Your Knowledge of the Target Is...</th><th
          class="rd__th ve-col-2 ve-text-center " data-rd-isroller="false">Save
          Modifier</th></tr></thead><tbody><tr><td class="rd__th ve-col-10
          ">Secondhand (heard of the target)</td><td class="rd__th ve-col-2
          ve-text-center ">+5</td></tr><tr><td class="rd__th ve-col-10
          ">Firsthand (met the target)</td><td class="rd__th ve-col-2
          ve-text-center ">+0</td></tr><tr><td class="rd__th ve-col-10
          ">Extensive (know the target well)</td><td class="rd__th ve-col-2
          ve-text-center ">-5</td></tr></tbody></table><table class="w-100
          rd__table  stripe-odd-table"><thead><tr><th class="rd__th ve-col-10 "
          data-rd-isroller="false">You Have the Target's...</th><th
          class="rd__th ve-col-2 ve-text-center " data-rd-isroller="false">Save
          Modifier</th></tr></thead><tbody><tr><td class="rd__th ve-col-10
          ">Picture or other likeness</td><td class="rd__th ve-col-2
          ve-text-center ">-2</td></tr><tr><td class="rd__th ve-col-10 ">Garment
          or other possession</td><td class="rd__th ve-col-2 ve-text-center
          ">-4</td></tr><tr><td class="rd__th ve-col-10 ">Body part, lock of
          hair, or bit of nail</td><td class="rd__th ve-col-2 ve-text-center
          ">-10</td></tr></tbody></table><p>On a successful save, the target
          isn't affected, and you can't use this spell on it again for 24
          hours.</p><p>On a failed save, the spell creates an
          &amp;Reference[condition=Invisible], intangible sensor within 10 feet
          of the target. You can see and hear through the sensor as if you were
          there. The sensor moves with the target, remaining within 10 feet of
          it for the duration. If something can see the sensor, it appears as a
          luminous orb about the size of your fist.</p><p>Instead of targeting a
          creature, you can target a location you have seen. When you do so, the
          sensor appears at that location and doesn't move.</p></div>
        chat: ''
      level: 5
      school: div
      properties:
        - vocal
        - somatic
        - material
        - concentration
      ability: wis
      materials:
        value: >-
          a focus worth 1,000+ GP, such as a crystal ball, mirror, or
          water-filled font
