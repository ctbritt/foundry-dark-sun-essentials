  - _id: ObMxRaMwDAcoWhR0
    name: Zone of Truth
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '343'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create a magical zone that guards
          against deception in a 15-foot-radius @variantrule[Sphere [Area of
          Effect]|XPHB|Sphere] centered on a point within range. Until the spell
          ends, a creature that enters the spell's area for the first time on a
          turn or starts its turn there makes a Charisma saving throw. On a
          failed save, a creature can't speak a deliberate lie while in the
          radius. You know whether a creature succeeds or fails on this
          save.</p><p>An affected creature is aware of the spell and can avoid
          answering questions to which it would normally respond with a lie.
          Such a creature can be evasive yet must be truthful.</p></div>
        chat: ''
      level: 2
      school: enc
      properties:
        - vocal
        - somatic
      ability: cha
      materials:
