  - _id: 77r4AkQbMXGA0gU5
    name: Command
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '251'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You speak a one-word command to a
          creature you can see within range. The target must succeed on a Wisdom
          saving throw or follow the command on its next turn. Choose the
          command from these options:</p><ul class="rd__list
          rd__list-hang-notitle"><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Approach"><span class="bold
          rd__list-item-name">Approach.</span> The target moves toward you by
          the shortest and most direct route, ending its turn if it moves within
          5 feet of you.</p></li><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Drop"><span class="bold
          rd__list-item-name">Drop.</span> The target drops whatever it is
          holding and then ends its turn.</p></li><li class="rd__li "><p
          class="rd__p-list-item" data-roll-name-ancestor="Flee"><span
          class="bold rd__list-item-name">Flee.</span> The target spends its
          turn moving away from you by the fastest available means.</p></li><li
          class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Grovel"><span class="bold
          rd__list-item-name">Grovel.</span> The target has the
          &amp;Reference[condition=Prone] condition and then ends its
          turn.</p></li><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Halt"><span class="bold
          rd__list-item-name">Halt.</span> On its turn, the target doesn't move
          and takes no action or @variantrule[Bonus
          Action|XPHB].</p></li></ul></div><div class="rd__b 
          rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level
          Spell Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> You can affect one additional
          creature for each spell slot level above 1.</p></div></div>
