      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You try to compel a creature into a
          duel. One creature that you can see within range makes a Wisdom saving
          throw. On a failed save, the target has
          @variantrule[Disadvantage|XPHB] on attack rolls against creatures
          other than you, and it can't willingly move to a space that is more
          than 30 feet away from you.</p><p>The spell ends if you make an attack
          roll against a creature other than the target, if you cast a spell on
          an enemy other than the target, if an ally of yours damages the
