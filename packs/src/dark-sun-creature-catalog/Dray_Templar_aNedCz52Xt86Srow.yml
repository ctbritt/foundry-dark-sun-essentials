  - _id: qfs5gj7clVjsDOiL
    name: Find Steed
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '272'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You summon an otherworldly being that
          appears as a loyal steed in an unoccupied space of your choice within
          range. This creature uses the @creature[Otherworldly Steed|XPHB] stat
          block. If you already have a steed from this spell, the steed is
          replaced by the new one.</p><p>The steed resembles a Large, rideable
          animal of your choice, such as a horse, a camel, a dire wolf, or an
          elk. Whenever you cast the spell, choose the steed's creature
          type—Celestial, Fey, or Fiend—which determines certain traits in the
          stat block.</p><div data-roll-name-ancestor="Combat" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Combat.</span></span> The steed is an ally
          to you and your allies. In combat, it shares your
          @variantrule[Initiative|XPHB] count, and it functions as a controlled
          mount while you ride it (as defined in the rules on <a
          href="https://5e.tools/book.html#XPHB,1,mounted%20combat,0">mounted
          combat</a>). If you have the &amp;Reference[condition=Incapacitated]
          condition, the steed takes its turn immediately after yours and acts
          independently, focusing on protecting you.</p></div><div
          data-roll-name-ancestor="Disappearance of the Steed" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="2"> <span
          class="entry-title-inner">Disappearance of the Steed.</span></span>
          The steed disappears if it drops to 0 @variantrule[Hit Points|XPHB] or
          if you die. When it disappears, it leaves behind anything it was
          wearing or carrying. If you cast this spell again, you decide whether
          you summon the steed that disappeared or a different
          one.</p></div></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> Use the spell slot's level for
          the spell's level in the stat block.</p></div></div>
        chat: ''
      level: 2
