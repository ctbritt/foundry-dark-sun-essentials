  details:
    biography:
      value: >-
        <p>Pterrax are large pteranodon-like creatures which are capable of
        flight. They occupy the plains and rocky barrens of Athas. Pterrax are
        sometimes encountered near the edges of the Forest Ridge near the
        Ringing Mountains, where they are commonly used by pterrans as flying
        mounts.</p><p>Pterrax are generally six feet long, with a reptilian
        appearance. Their bodies are slender and sport a pair of large wings;
        these provide the creature with fast flight capabilities and excellent
        maneuverability. Pterrax have two pairs of limbs, legs and arms, all of
        which have sharp claws at their ends. The head of a pterrax is similar
        in shape to that of pterran, suggesting that the two species are somehow
        related. Pterrax have long, sharp teeth, which are used by pterrans in
        the creation of the thanak, a weapon employed by many of the pterran
        clans which have migrated from the Hinterlands to the rocky barrens of
        Athas.</p><p>Pterrax are most commonly found in the rocky barrens of the
        Athasian Tablelands. Young pterrax are cared for by the mother for
        another two months before they are cast out on their own. While their
        eggs are incubating, pterrax are very protective of their nest and will
        attack any who threaten it or their eggs.</p><p>As stated above, pterrax
        are often used by pterrans as flying mounts. By the time a pterrax is
        two years old, it is strong enough to be used as a mount. The capture
        and training of a pterrax mount is a part of one of the significant Life
        Path rituals among the pterrans.</p>
