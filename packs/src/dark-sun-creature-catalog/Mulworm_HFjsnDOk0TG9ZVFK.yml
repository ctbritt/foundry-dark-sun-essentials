        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>When the mulworm dies, its poisonous
          blood sprays everywhere. When the mulworm reaches 0 hp because of a
          melee weapon attack, each creature within 5 feet of it must make a DC
          11 Constitution saving throw. Armored creatures have advantage on this
          initial saving throw. On a failed save, the area touched by the
          mulworm poison suffers a severe rash, and the creature takes 3 (1d6)
          damage and has disadvantage on saves against poison and disease. The
          creature must repeat the saving throw every 24 hours, taking 3 (1d6)
          damage on a failed save. After one successful save, the effect
          ends.</p></div>
