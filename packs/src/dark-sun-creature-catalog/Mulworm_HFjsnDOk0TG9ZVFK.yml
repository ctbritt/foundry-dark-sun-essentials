  details:
    biography:
      value: >-
        <div class="rd__b  rd__b--1"><p>The Athasian mulworm is an off-white
        colored caterpillar with no eyes. It has two feelers in the front of its
        head that are used as sensors. Its mouth makes up the rest of its
        bullet-shaped head. The body is segmented, tapering to a point at the
        rear. Adult mulworms are about 8 inches long and as much as 1 inch
        thick.</p></div>
