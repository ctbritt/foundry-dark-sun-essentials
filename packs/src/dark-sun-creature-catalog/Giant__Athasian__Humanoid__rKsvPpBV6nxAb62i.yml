  details:
    biography:
      value: >-
        <p>Athasian giants dwell in small tribes on islands throughout the Sea
        of Silt, which they guard fiercely. They are capable of traversing the
        sea's shallower areas, wading through chest-deep terrain to reach their
        homes.</p><p>The giants of Athas are huge, lumbering creatures who
        commonly inhabit the islands of the Sea of Silt. The most common
        varieties are the desert giants, the plains giants, and the
        psionics-wielding beasthead giants. All the giants of Athas share one
        characteristic, and that is savagery. Though humanoid giants can be
        congenial and friendly when properly approached, they have short tempers
        and are very easily agitated.</p><p>Humanoid Giants can typically be
        found among the deserts and the few plains of Athas. All are typically
        25 feet tall and weight six to eight tons.</p><p>Desert giants have
        exaggerated facial features: huge noses, mouths, or ears. Their skin is
        most often dark red, but some specimens have jet-black skin. The hair of
        desert giants is usually a light brown color and is very coarse and
        sturdy.</p><p>The skin color of Plains giants is usually a deep rust
        color, with some having dark brown skin. Also, plains giants have facial
        features more akin to an elf than a human. They have slender faces and
        slightly pointed ears. The hair of plains giants is light colored, very
        often blond to light brown.</p>
      public: ''
