  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Large, predatory creatures</p><p>that have hundreds of
        legs, tough shells, and intrinsic psionic attributes roam the wastes of
        Athas. Called megapedes, these insect like monsters live beneath the
        sands, burrowing swiftly and silently. They appear without warning to
        attack herd animals and other prey.</p><p>Lore</p><p>Most megapedes lair
        below the sands of Athas, where they lay eggs in cavernous nests. Some
        of these mammoth creatures occupy natural caves or tunnels. Many desert
        wanderers seeking shelter have inadvertently stumbled across megapede
        lairs; few live long enough to regret the
        mistake.</p><p>Encounters</p><p>Megapedes are related to cilopses and
        occasionally share lairs with them. Because both creatures are highly
        aggressive, mega pedes tolerate the presence of only one or two cilopses
        in a lair.</p><p>Info</p><p>A savage fighter, the megapede snaps with
        its clawed legs and poisonous mandibles. The beast activates its
        inherent psionic powers, catching foes off guard. A megapede is
        especially dangerous when its egg clutch is endangered.</p>
