        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Pterrax are large pteradon-like creatures which are
        capable of flight. They occupy the plains and rocky barrens of Athas.
        Pterrax are sometimes encountered near the edges of the Forest Ridge
        near the Ringing Mountains, where they are commonly used by pterrans as
        flying mounts.</p>
