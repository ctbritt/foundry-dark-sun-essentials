  - _id: rtEW4peTV9dk3gVd
    name: Detect Thoughts
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '262'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You activate one of the effects below.
          Until the spell ends, you can activate either effect as a
          @action[Magic|XPHB] action on your later turns.</p><div
          data-roll-name-ancestor="Sense Thoughts" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Sense Thoughts.</span></span> You sense the
          presence of thoughts within 30 feet of yourself that belong to
          creatures that know languages or are telepathic. You don't read the
          thoughts, but you know that a thinking creature is present.</p><p>The
          spell is blocked by 1 foot of stone, dirt, or wood; 1 inch of metal;
          or a thin sheet of lead.</p></div><div data-roll-name-ancestor="Read
          Thoughts" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="2"> <span class="entry-title-inner">Read
          Thoughts.</span></span> Target one creature you can see within 30 feet
          of yourself or one creature within 30 feet of yourself that you
          detected with the Sense Thoughts option. You learn what is most on the
          target's mind right now. If the target doesn't know any languages and
          isn't telepathic, you learn nothing.</p><p>As a @action[Magic|XPHB]
          action on your next turn, you can try to probe deeper into the
          target's mind. If you probe deeper, the target makes a Wisdom saving
          throw. On a failed save, you discern the target's reasoning, emotions,
          and something that looms large in its mind (such as a worry, love, or
          hate). On a successful save, the spell ends. Either way, the target
          knows that you are probing into its mind, and until you shift your
          attention away from the target's mind, the target can take an action
          on its turn to make an Intelligence (&amp;Reference[skill=Arcana])
          check against your spell save DC, ending the spell on a
          success.</p></div></div>
        chat: ''
