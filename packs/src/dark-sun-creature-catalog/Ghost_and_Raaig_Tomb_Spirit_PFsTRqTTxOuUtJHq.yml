    flags:
      ddbimporter:
        dndbeyond: {}
        parentId: K1NEQAOZK84J0TUi
      monsterMunch:
        titleHTML: <em><strong>Incorporeal Movement.</strong></em>
        fullName: Incorporeal Movement.
        actionCopy: false
        type: special
      walledtemplates:
        wallsBlock: globalDefault
        wallRestriction: globalDefault
      dae:
        macro:
          name: Incorporeal Movement
          img: icons/magic/control/debuff-energy-snare-purple-blue.webp
          type: script
          scope: global
          command: >-
            //Last Updated: 10/24/2023

            //Author: EskieMoh#2969


            //Set Color; (options: teal, green, blue, red)

            let color = "teal";

            //Change token light?

            let changeLight = true;


            if (color == "teal"){
                 tintColor = '#6ff087'
            }

            else if (color == "green"){
                 tintColor = '#6cde3b'
            }

            else if (color == "blue"){
                 tintColor = '#74e2cf'
            }

            else if (color == "red"){
                 tintColor = '#e22c47'
            }


            if(Tagger.hasTags(token, "Incorporeal")){


            await Tagger.removeTags(token, "Incorporeal");

            await Sequencer.EffectManager.endEffects({ name: `Incorporeal
            ${token.document.name}`, object: token });


            if(changeLight == true){

            var light = {dim: 0, bright: 0};

            await token.document.update({light});

            }

            new Sequence()


            .animation()

            .on(token)

            .opacity(1)


            .play();


            } else {


            await Tagger.addTags(token, "Incorporeal")


            new Sequence()


            .animation()

            .on(token)

            .opacity(0)


            .thenDo(function(){
                
            if(changeLight == true){

            var light = {dim: 0, bright: 1, alpha:0.25, luminosity: 0.55, color:
            tintColor, animation: {type: "torch", speed: 4, intensity:
            5},attenuation: 0.85, contrast:0, shadows:0};

            token.document.update({light})

            }

            })


            .effect()

            .name(`Incorporeal ${token.document.name}`)

            .file("jb2a.extras.tmfx.outflow.circle.01")

            .attachTo(token, {cacheLocation: true, offset: {y:0},
            gridUnits:true, bindAlpha: false})

            .scaleToObject(1.45, {considerTokenScale:true})

            .randomRotation()

            .belowTokens()

            .opacity(0.45)

            .tint(tintColor)

            .loopProperty("alphaFilter", "alpha", { from: 0.75, to: 1, duration:
            1500, pingPong: true, ease: "easeOutSine"})

            .filter("ColorMatrix", { saturate:-0.2, brightness:1.2 })

            .persist()


            .effect()

            .name(`Incorporeal ${token.document.name}`)

            .from(token)

            .attachTo(token, {bindAlpha: false})

            .scaleToObject(1, {considerTokenScale:true})

            .opacity(0.65)

            .tint(tintColor)

            .loopProperty("alphaFilter", "alpha", { from: 0.75, to: 1, duration:
            1500, pingPong: true, ease: "easeOutSine"})

            .loopProperty("sprite", "position.x", { from: 0.025, to: -0.025,
            duration: 5000, gridUnits:true, pingPong: true, ease:
            "easeOutSine"})

            .loopProperty("sprite", "position.y", {  from:0 ,to:-0.03, duration:
            2500, gridUnits:true, pingPong: true})

            .persist()

            .filter("Glow", { color: tintColor, distance: 5, outerStrength:4,
            innerStrength: 0 })

            .filter("ColorMatrix", { saturate:-0.2, brightness:1.2 })

            .filter("Blur", { blurX: 0, blurY: 0.8 })

            .waitUntilFinished()


            .effect()

            .file("jb2a.smoke.puff.centered.grey")

            .atLocation(token)

            .scaleToObject(2, {considerTokenScale:true})

            .opacity(0.5)

            .filter("ColorMatrix", { saturate:0, brightness:1.5})

            .tint(tintColor)

            .playIf(() => {
                return !Tagger.hasTags(token, "DrainingTouch");
            })


            .thenDo(function(){


            if(!Tagger.hasTags(token, "DrainingTouch")){

            if(!Tagger.hasTags(token, "Possession")){    

            Tagger.removeTags(token, "Incorporeal");


            if(changeLight == true){

            var light = {dim: 0, bright: 0};

            token.document.update({light});

            }


            Sequencer.EffectManager.endEffects({ name: `Incorporeal
            ${token.document.name}`, object: token });


            }    

            }

            })


            .play()

            }
          author: jM4h8qpyxwTpfNli
          ownership:
            default: 3
