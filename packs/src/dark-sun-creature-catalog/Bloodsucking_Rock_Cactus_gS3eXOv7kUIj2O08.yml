  details:
    cr: 0.25
    biography:
      value: >-
        <p>A small cluster of spherical rocklike plants that are found wherever
        water is rare, these cacti are a sandy brown in color and no more than a
        foot across.</p><p>The most common form of rock cactus is a plant that
        survives by attaching itself to other living creatures and draining the
        moisture from them through its spines. It lives in clusters near game or
        caravan trails and attacks when prey draws near. The rock cactus exudes
        pheromones that, while undetectable to most humans and humanoids, are
        compellingly attractive to many rodents and mammals.</p><p>The rock
        cactus is edible if peeled, having a taste and texture like apples, and
        a single plant will yield up to a pound of flesh and 4 pints of fluid.
        The plants can be safely harvested by tricking them into attacking a
        dummy target and then snapping their spines before they have a chance to
        retract them.</p><h3>Bloodsucking Rock Cactus</h3><p>Approximately one
        rock cactus in every 500 is a bloodsucking mutation that feeds not on
        moisture but on the very lifeblood of its prey. Indistinguishable from
        the standard rock cactus, they are somewhat tougher and more precise in
        their attacks, seeming to home in upon blood vessels and major
        organs.</p>
