  - _id: BPjE2QmNaeQQawwK
    name: Swallow
    type: feat
    system:
      source:
        custom: ''
        book: ENK
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The kluzd makes one bite attack
          against a Medium or smaller target it is grappling. If the attack
          hits, the target is swallowed, and the grapple ends. The swallowed
          target is &amp;Reference[condition=blinded] and
          &amp;Reference[condition=restrained], it has total cover against
          attacks and other effects outside the kluzd, and it takes 7 (2d6)
          damage at the start of each of the kluzd's turns. The kluzd can have
          only one target swallowed at a time. If the kluzd takes 15 damage or
          more on a single turn from the swallowed creature, the kluzd must
          succeed on a [[/save ability=con dc=14]] saving throw at the end of
          that turn or regurgitate the creature, which falls
          &amp;Reference[condition=prone] in a space within 5 feet of the kluzd.
          If the kluzd dies, a swallowed creature is no longer
          &amp;Reference[condition=restrained] by it and can escape from the
          corpse using 5 feet of movement, exiting
          &amp;Reference[condition=prone].</p></div>
