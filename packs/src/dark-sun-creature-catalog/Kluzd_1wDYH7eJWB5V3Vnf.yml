  details:
    biography:
      value: >-
        <p>Kluzd are snake-like reptiles that inhabit mudflats and other muddy
        areas. They are about ten feet long and two to three feet in diameter.
        They can swallow a grown man whole, although this results in a strange,
        almost comical, bulge in the center of their bodies.</p><p>Male kluzd
        have a distinctive turquoise and white coloration about their head and
        neck area. Females do not share these bright colors; their bodies are
        sandy brown flecked with black along their entire length. All kluzd have
        a series of elongated, feather-like scales around the back of their
        heads. These flare out to form a large fan when the creature is angered,
        a primitive mechanism to make it appear larger to its animal
        opponents.</p>
      public: ''
