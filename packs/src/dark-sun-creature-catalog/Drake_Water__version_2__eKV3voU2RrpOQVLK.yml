  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The water drake is the most elusive of all drakes. This
        is due mostly to the hatred they hold for what humanity has done to
        Athas. Water drakes are pale, grey-blue in color, with a blow hole
        centered in the back of their heads. Water drakes are the slimmest of
        the drake family. Their four webbed feet end in sharp, triangular claws.
        Water drakes tails are thinner and flatter than other drakes, and they
        provide excellent propulsion when in water. Water drakes are reclusive
        and prefer as little contact with humanity as possible. They will avoid
        intruders, but will kill without hesitation those humanoids who trespass
        upon their lair. Because of the horrors rent upon the planet by
        humanoids, water drakes have absolutely no regard for such life. Their
        four webbed feet help them move large quantities of sand. All four feet
        have sharp, triangular claws designed for digging into and holding onto
        prey, or for raking. </p><p>A Water Drake Lair</p><p>They make their
        home near a deep water source, if possible; many guard passages to
        aquafilters trapped deep below the ground.</p><div class="rd__b 
        rd__b--1"><div data-roll-name-ancestor="Lair Actions" class="rd__b 
        rd__b--2"><h3 class="rd__h rd__h--2" data-title-index="1"> <span
        class="entry-title-inner">Lair Actions</span></h3> <p>On initiative
        count 20 (losing initiative ties), the drake takes a lair action to
        cause one of the following effects; the drake can't use the same effect
        two rounds in a row:</p><ul class="rd__list"><li class="rd__li ">A
        strong current moves through the drake's lair. Each creature within 60
        feet of the drake must succeed on a DC 15 Strength saving throw or be
        pushed up to 30 feet away from the drake. On a success, the creature is
        pushed 10 feet away from the drake.</li><li class="rd__li ">The drake
        conjures poisoned gas or water around it. Each creature within 60 feet
        of the drake must succeed on a DC 15 Constitution saving throw or be
        poisoned for 1 minute. A poisoned target can repeat the saving throw at
        the end of each of its turns, ending the poisoned condition on itself on
        a success.</li><li class="rd__li ">Creatures in the water within 60 feet
        of the drake have vulnerability to psychic damage until initiative count
        20 on the next round.</li></ul></div></div><div class="rd__b 
        rd__b--1"><div data-roll-name-ancestor="Regional Effects" class="rd__b 
        rd__b--2"><h3 class="rd__h rd__h--2" data-title-index="2"> <span
        class="entry-title-inner">Regional Effects</span></h3> <p>The region
        containing a fire drake's lair is warped by the drake's power, which
        creates one or more of the following effects:</p><ul
        class="rd__list"><li class="rd__li ">The drake can alter the weather at
        will in a 6-mile radius centered on its lair. The effect is identical to
        the control weather spell.</li><li class="rd__li ">Rifts within 1 mile
        of the drake's lair form portals to the Elemental Plane of Water,
        allowing creatures of elemental water into the world to dwell
        nearby.</li></ul><p>If the drake dies, these effects fade over the
        course of 1d10 days.</p></div></div>
