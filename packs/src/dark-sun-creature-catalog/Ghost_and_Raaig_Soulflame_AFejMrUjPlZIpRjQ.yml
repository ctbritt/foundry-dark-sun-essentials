  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>In an environment where violent death</p><p>is so
        common, ghosts frequently haunt sites of great significance or terrible
        slaughter. Among them are an array of spirits bound to the service of
        long-forgotten gods. Called raaigs, these ghosts defend ancient shrines,
        temples, relics, and secrets.</p><p>Lore</p><p>In life, raaigs were
        devout priests or holy warriors charged with protecting sacred sites or
        relics. In death they still keep watch, though their charges have
        crumbled into ruin or vanished. They have been twisted by their ancient
        oaths into merciless, hateful apparitions that swiftly slay any living
        intruder. Unlike ghosts or specters, raaigs briefly take solid form to
        attack, then fade into insubstantiality before foes can
        retaliate.</p><p>Raaigs haunt old temples. They attack any who set foot
        in their shrines considering them unbelievers who defile the sacred
        precinct. Few people on Athas know the ancient names or prayers that can
        satisfy a raaig's challenge. A given raaig is bound to a limited area or
        purpose and cannot abandon it to chase intruders even a short distance.
        A few guardians were so favored by their gods in life that they were
        granted a tiny spark of divine essence. Called soulflames, these raaigs
        still embody their gods' will. When a soulflame is badly injured,
        though, that divine spark escapes, leaving behind a spectral vessel
        empty of all but despair.</p><p>Encounters</p><p>Intelligent and
        strong-willed, raaigs assume command over other undead such as mummies,
        ghosts, or skeletons. Those defending evil temples might ally with
        demons or devils that once served them. Soulflames are occasionally
        accompanied by angels that survived the disappearance of Athas's gods by
        drawing upon the spark of divinity within these blessed
        spirits.</p><p>Info</p><p>A blinding light flares from the foreign
        symbols on the altar. Within that radiance a humanoid phantom coalesces.
        Although it looks little different from the other ghosts, vast power
        emanates from it. Soulflames teleport throughout the enemies' ranks,
        rarely staying in the same spot. They focus attacks on enemies that pose
        a greater threat. Once wounded, a soulflame becomes a being of murderous
        rage. It focuses its attacks on the enemy who wounded it, even if others
        are dealing more damage.</p>
      public: ''
