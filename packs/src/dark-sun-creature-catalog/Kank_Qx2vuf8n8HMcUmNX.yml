  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Oversized hive insects</p><p>kanks viciously attack
        strangers. Patient trainers can domesticate these beasts to collect
        their tasty nectar or employ them as guard beasts. Kanks are also valued
        as hardy creatures that can survive in most Athasian
        environments.</p><p>Lore</p><p>Kanks are hive insects that can be tamed
        and trained. Spitters specialize in collecting organic forage and
        producing nectar that nourishes other kanks. Soldiers have vicious
        mandibles that help them defend the tribe.</p><p>Every kank hive has a
        brood queen. This lethargic creature does little besides produce kank
        eggs. A brood queen is unable to defend herself from attack, and she has
        little actual control over the hive. She relies on soldiers to defend
        her and spitters to produce food.</p><p>Encounters</p><p>A hive of kanks
        is easy to domesticate-any creature that feeds the hive regularly can
        tame its kanks. Because kanks can consume any organic matter, they
        require minimal care. They consider creatures that feed them to be part
        of the hive.</p>
