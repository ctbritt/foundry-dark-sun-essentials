          more of the following effects:</p><ul class="rd__list"><li
          class="rd__li ">Hidden sinkholes form in and around the dragon's lair.
          A sinkhole can be spotted from a safe distance with a successful DC 20
          Wisdom (Perception) check. Otherwise, the first creature to step on
          the thin crust covering the sinkhole must succeed on a DC 15 Dexterity
          saving throw or fall 1d6 x 10 feet into the sinkhole.</li><li
          class="rd__li ">Small earthquake are common within 6 miles of the
          dragon's lair.</li><li class="rd__li ">Gems and pearls within 1 mile
          of the dragon's lair sparkle and gleam, shedding dim light in a 5ft
          radius.</li><li class="rd__li ">Natural caves and tunnels within 1
          miles of the drake's lair form intermittent portals to the Elemental
          Plane of Earth, allowing elemental creatures into the mortal world to
          dwell near those points.</li></ul><p>If the drake dies, these effects
          fade over the course of 1d10 days.</p></div>
