  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The explorer sifts through a pile of loose dirt in
        search of precious water. In the blink of an eye, she falls to the
        ground, bowled over by a leaping horror covered in rocky plates. Her
        companions turn to run but, with a resounding boom, a mass of soil and
        stone coalesces around them and engulfs them. These beasts like to play
        with their food and prefer a meal that puts up a fight before the
        kill-they might provoke attacks just for the chance to lash out against
        the attacker. A drake bowls over as many targets as possible with its
        orb of elemental earth, growing to immense size to intimidate and
        torment immobilized prey.</p><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Lair Actions" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="1"> <span
        class="entry-title-inner">Lair Actions</span></h3> <p>On initiative
        count 20 (losing initiative ties), the dragon takes a lair action to
        cause one of the following effects; the dragon can't use the same effect
        two rounds in a row:</p><ul class="rd__list"><li class="rd__li ">Part of
        the ceiling collapses above one creature that the dragon can see within
        120 feet of it. The creature must succeed on a DC 15 Dexterity saving
        throw or take 10 (3d6) bludgeoning damage and be knocked prone and
        buried. The buried target is restrained and unable to breathe or stand
        up. A creature can take an action to make a DC 10 Strength check, ending
        the buried state on a success.</li><li class="rd__li ">The dragon
        chooses a point on the ground that it can see within 120 feet of it.
        Stone spikes sprout from the ground in a 20-foot radius centered on that
        point. The effect is otherwise identical to the spike growth spell and
        lasts until the dragon uses this lair action again or until the dragon
        dies.</li><li class="rd__li ">The dragon chooses a 10-foot-square area
        on the ground that it can see within 120 feet of it. The ground in that
        area turns into 3-foot-deep mud. Each creature on the ground in that
        area when the mud appears must succeed on a DC 15 Dexterity saving throw
        or sink into the mud and become restrained. A creature can take an
        action to attempt a DC 15 Strength check, freeing itself or another
        creature within its reach and ending the restrained condition on a
        success. Moving 1 foot in the mud costs 2 feet of movement. On
        initiative count 20 on the next round, the mud hardens, and the Strength
        DC to work free increases to 20.</li></ul></div></div><div class="rd__b 
        rd__b--1"><div data-roll-name-ancestor="Regional Effects" class="rd__b 
        rd__b--2"><h3 class="rd__h rd__h--2" data-title-index="2"> <span
        class="entry-title-inner">Regional Effects</span></h3> <p>The region
        containing an earth drake's lair is warped by the dragon's elemental
        magic, which creates one or more of the following effects:</p><ul
        class="rd__list"><li class="rd__li ">Hidden sinkholes form in and around
        the dragon's lair. A sinkhole can be spotted from a safe distance with a
        successful DC 20 Wisdom (Perception) check. Otherwise, the first
        creature to step on the thin crust covering the sinkhole must succeed on
        a DC 15 Dexterity saving throw or fall 1d6 x 10 feet into the
        sinkhole.</li><li class="rd__li ">Small earthquake are common within 6
        miles of the dragon's lair.</li><li class="rd__li ">Gems and pearls
        within 1 mile of the dragon's lair sparkle and gleam, shedding dim light
        in a 5ft radius.</li><li class="rd__li ">Natural caves and tunnels
        within 1 miles of the drake's lair form intermittent portals to the
        Elemental Plane of Earth, allowing elemental creatures into the mortal
        world to dwell near those points.</li></ul><p>If the drake dies, these
        effects fade over the course of 1d10 days.</p></div></div>
