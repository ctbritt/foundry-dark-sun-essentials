  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The jhakar is a powerful reptilian predator that
        resembles a bulldog in both appearance and manner. Its fierce nature
        makes it a bane to humanoids and animals alike.</p><p>The wild jhakar
        hunts in packs. Rarely discriminatory about prey, a jhakar hunts man,
        elf or halfling as readily as it hunts wild animals. Once it has caught
        scent of their quarry, its pursuit is relentless. It attacks in one
        bounding rush, emitting a hiss, similar to a steam kettle, when its prey
        is in sight.</p><p>Info</p><p>Jhakars bound across the battlefield,
        eager to sink their prodigious teeth into hot flesh. They dart in and
        deliver a nasty bite before dancing away. Jhakar packs, whether wild or
        domesticated, work together, with one beast drawing the prey's attention
        long enough for the rest to leap in and make the kill.</p>
