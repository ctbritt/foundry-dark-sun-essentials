  details:
    biography:
      value: >-
        <div class="rd__b  rd__b--1"><p>A dagorran is a froglike beast with
        golden-hued skin, green eyes, and a green crystalline growth between its
        shoulders. The skin is valued for its protective qualities by warriors
        as armor, and by wizards as a material component for casting protective
        spells. The green crystalline growth is the source of these creatures'
        psionic and tracking abilities and is valued by defilers and preservers
        for several mind-affecting potions. It has large razor-sharp teeth that
        it uses in hunting and eating its prey.</p><p>Its large, muscular legs
        are used for jumping, running, and walking. The dominant dagorran or
        leader has a larger crystalline growth. communicate in any audible
        manner, but uses its psionic abilities to convey limited thoughts and
        ideas. It occasionally emits a deep, guttural croaking noise but these
        sounds have no meaning to the dagorran.</p><p>Dagorran were once common
        on Athas, but their value as components for potions and spells, their
        leatherlike hide, and that thri-kreen consider dagorran flesh a
        delicacy, have caused them to reach near extinction. They are still
        common in the deserts near Draj and are often used as trackers by
        Drajian guards because of their sensitivity to psionics. They are also
        sought by nobles and the patriarchs and matriarchs of the merchant
        houses to help keep their gardens free of rodents and other small
        animals.</p></div>
