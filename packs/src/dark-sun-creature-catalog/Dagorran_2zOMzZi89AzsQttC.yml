  - _id: QXW7dOPVRZCMIGFs
    name: Swallow
    type: feat
    system:
      source:
        custom: ''
        book: ENK
        page: '18'
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The dagorran makes one bite attack
          against a Small or smaller target it is grappling. If the attack hits,
          the target is swallowed, and the grapple ends. The swallowed target is
          blinded and restrained, it has total cover against attacks and other
          effects outside the dagorran, and it takes 9 (2d8) acid damage at the
          start of each of the frog's turns. The dagorran can have only one
          target swallowed at a time.</p><p>If the dagorran takes 7 damage or
          more on a single turn from the swallowed creature, the dagorran must
          succeed on a DC 14 Constitution saving throw at the end of that turn
          or regurgitate the creature, which falls prone in a space within 5 ft.
          of the dagorran. If the dagorran dies, a swallowed creature is no
          longer restrained by it and can escape from the corpse using 5 ft. of
          movement, exiting prone.</p></div>
