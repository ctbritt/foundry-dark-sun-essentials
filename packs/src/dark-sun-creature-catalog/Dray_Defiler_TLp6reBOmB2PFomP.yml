  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Dray Defiler</p><p>Athasian dragonborn descend from
        humanoids transformed during the reign of an ancient sorcerer-king. They
        call themselves dray, the name bestowed on them by their
        creator.</p><p>Lore</p><p>The dragonborn were born from the mad genius
        of the sorcerer-king Dregoth, ruler of the former city-state of
        GiustenaL He created the race to serve him but deemed the result
        imperfect, so the capricious sorcerer cast the dray out into the sands
        ofAthas in scorn. A few were allowed to stay in Giustenal, but when the
        other sorcerer-kings banded together to slay Dregoth, those dray that
        remained either were killed or barely escaped.</p><p>Dragonborn are now
        extremely rare and band together in small tribes for survival. All that
        most know of their origin is that their creator tossed them aside, and
        none are aware that Dregoth persists in a state of undeath.</p><p>Among
        the few people who know of their existence, dragonborn have a reputation
        as slavers and sorcerers. Though not true ofall their kind, this
        reputation is well deserved. Many dray use the cruelty of their origin
        as a justification for slavery-they once belonged to Dregoth, and now
        they take slaves of their own. Others follow the path of the defiler,
        caring little for the preservation ofAthas in the pursuit ofever more
        power.</p><p>Encounters</p><p>Hostile dragonborn are slavers and
        mercenaries. They can be found alongside anyone who pays them enough.
        Dragonborn respect the strong, and their bands might include other tough
        humanoids and dangerous beasts.</p><p>Info</p><p>These dragonborn are
        notorious sorcerers. They remember their race's ancient glory, when dray
        could walk the streets displaying arcane power openly and dare anyone to
        challenge them. Power is what they desire above all, and defiling offers
        a quicker path to that power. A dragonborn defiler rules through fear
        and raw arcane might, expecting lackeys to put themselves between it and
        its enemies. It readily includes allies within the area of defiling
        breath to extend the duration of its attack and damage bonuses. Although
        its powers can benefit its followers, the defiler uses them only when it
        stands to gain.</p>
      public: ''
