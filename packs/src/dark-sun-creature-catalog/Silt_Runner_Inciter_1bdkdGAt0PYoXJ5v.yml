  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The diminutive silt runner</p><p>proves that even the
        smallest of Athas's creatures are disproportionately deadly. Distantly
        related to ssurrans (Athas's lizardfolk), silt runners combine greed
        with cold-blooded ruthlessness. Their xenophobic hatred of other races
        is renowned. Survivors of attacks by silt runners describe how their
        companions were swarmed over and gradually lacerated to death by
        numerous tiny, razor-edged blades - a particularly unpleasant way to
        perish.</p><p>Lore</p><p>Silt runners live in tribal warrens, temporary
        camps spread between dunes and connected by tunnels. They use these
        bases as staging areas for raiding small communities or slow-moving
        caravans. As their name implies, silt runners move easily across loose
        sand and silt, preferring to hunt where the terrain works to their
        advantage. Silt runners wear the clothes, treasures, and body parts of
        their victims as trophies. The rest of their prey is consumed. For
        reasons lost to history - perhaps nothing more than a quirk of biology -
        these humanoids harbor a particular hatred for fey. They have been known
        to break off attacks against far more numerous or vulnerable foes to
        attack a lone elf or eladrin.</p><p>Encounters</p><p>Battles with silt
        runners occur in the open desert or within communities on the edges of
        the wastes. Unless an attacking force is small, silt runners quickly
        abandon their transitory warrens rather than defend them. The silt
        runners prefer to retaliate later with a surprise attack. Silt runners
        prefer the company of their own kind. On occasion, a tribe cooperates
        with reptilian creatures such as ssurrans or dray. Some tribes tame
        lizards as beasts of war.</p><p>Info</p><p>Although inciters are similar
        to the other child-sized silt runners around them, something about them
        draws the eye - or perhaps the mind. These reptilian warlords direct
        their allies in battle, channeling raw magical powers that blasts foes
        or drives other silt runners to extraordinary feats. Inciters open
        combat with a fireball to impede their foes and cause damage. They lead
        from the front, standing with ragers and others, stirring them to
        greater efforts. As long as an inciter lives, no silt runners flee, even
        from a losing battle.</p>
      public: ''
