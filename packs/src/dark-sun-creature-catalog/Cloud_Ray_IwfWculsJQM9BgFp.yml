  - name: Tail Zip
    type: feat
    system:
      description:
        value: >-
          <p>The cloud ray whips its tail. The cloud ray chooses a point within
          40 feet and creates a massive thunderclap. Each creature in a 20-foot
          radius originating from the point chosen, must make a [[/save
          format=long]]. On a failed save, a creature takes [[/damage average]]
          and is pushed 20 feet away from the ray. On a successful save, the
          creature takes half damage and isn't pushed. In addition, unsecured
          objects that are completely within the area of effect are
          automatically pushed 20 feet away from the ray. The tail zip emits a
          thunderous boom audible out to 1,000 feet.</p><p></p>
