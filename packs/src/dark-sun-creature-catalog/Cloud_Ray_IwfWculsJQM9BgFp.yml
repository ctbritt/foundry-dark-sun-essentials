  - _id: XiyyGsuAJ7WLg99T
    name: Telekinetic Clutch
    type: spell
    system:
      source:
        custom: ''
        book: PsPr
        page: '95'
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p></p><div data-roll-name-ancestor="Psi
          Cost" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Psi
          Cost.</span></span> 3 psi points</p></div><div
          data-roll-name-ancestor="Psychic Components" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="2"> <span
          class="entry-title-inner">Psychic Components.</span></span>
          Audible</p></div><p>You seize a creature you can see within range and
          hold it fast with telekinetic force. The target must succeed on a
          Strength saving throw or be &amp;Reference[condition=grappled] by you
          until your concentration ends or until the target leaves your reach,
          which is 60 feet for this grapple.</p><p>The
          &amp;Reference[condition=grappled] target can escape by succeeding on
          a Strength (Athletics) or Dexterity (Acrobatics) check contested by
          your psionic ability plus your proficiency bonus. When a target
          attempts to escape in this way, you can spend additional psi points to
          gain a +1 bonus per psi point spent on your check.</p><p>While a
          target is &amp;Reference[condition=grappled] in this manner, you can
          create one of the following effects as an action, spending the
          indicated number of additional psi points (obeying your psi limit each
          time you create an effect):</p><div data-roll-name-ancestor="Crush (1
          - 18 psi)" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="3"> <span class="entry-title-inner">Crush (1 - 18
          psi).</span></span> The target takes 1d6 bludgeoning damage per psi
          point spent.</p></div><div data-roll-name-ancestor="Move (1 - 18 psi)"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="4"> <span class="entry-title-inner">Move (1 - 18
          psi).</span></span> You move the target up to 5 feet per psi point
          spent. You can move it in the air and hold it there. It falls if the
          grapple ends.</p></div></div>
