  details:
    cr: 22
    alignment: Unaligned
    type:
      value: monstrosity
    biography:
      value: >-
        <p>Through the skies and clouds of Athas, slowly fly these deadly
        giants. Cloud rays can sometimes be seen crossing the evening sky.
        </p><p>Cloud rays have a broad, flattened body and flap their huge
        pectoral fins to aid their psionic flight powers. They are speckled
        brown on top and drab olive and white underneath.</p><p>Sets of ridges
        protect the creatures’ eyes. They have four jet-black eyes, two mounted
        on each side of the snout and the other two on each side of the cranial
        bulge. Down the back from the bulge runs a spine that becomes a long,
        thin whip-like tail that ends in an appendage known as a zip. The zip is
        comprised of razor-sharp, barbed ridges that grow at the tip of the
        spine. The interior mouth or maw, 20 + feet across, is lined with row
        upon row of razor-sharp cartilage ridges. </p><p>The zip is also used in
        a complex signaling system that is only understood by other cloud rays.
        </p><p>Cloud rays wander aimlessly through the Athasian skies, always
        searching for their next meal. On rare occasions, they land on the
        ground and may be mistaken for an outcropping rock. Those hapless enough
        to be standing on a ray when it decides to become airborne may become
        its next meal. A cloud ray’s preferred diet consists of devouring other
        flying creatures. </p><p>They have a special fondness for rocs, pterrax,
        and flying humanoids. The ray has no true stomach, preferring to swallow
        prey whole and grind the victim to liquid on its interior jaw ridges to
        help aid with digestion. After a good meal, cloud rays will sometimes
        psionically dream travel while their meal digests. Cloud rays have
        territorial respect for others of their species and, with very few
        exceptions, do not intrude into another ray’s airspace. </p><p>They are
        solitary beings except when they seek a mate. Females have a gestation
        period which lasts over 3 years. They bear live young while airborne.
        The male catches and supports the young ray on his back for the first
        year of its life while the female forages. After the young cloud ray
        learns to fly and becomes self-sufficient, the three go their separate
        ways. </p><p>Although innately psionic, cloud rays become infuriated
        when a psionicist contacts them. It drives them into a tremendous rage,
        and they will do anything they can except land to capture and devour the
        offending psionicist. The Dragon is the only creature in the world that
        cloud rays truly fear. </p><p>A single cloud ray could easily provide an
        entire settlement with enough meat and raw materials for 2-3 months. The
        chances of this occurring are slim at best. These creatures are fierce
        and feared for good reasons. Entire villages have been reported
        decimated by a single cloud ray on the hunt. The effect of the creature
        hovering close over buildings and flapping its massive wings has the
        same effect as the deadliest sandstorm. The zip alone can easily destroy
        most buildings in a few swipes.</p><p></p><p></p><p></p><p></p>
