  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Rock cacti are small, spherical plants that can be found
        anywhere water is not plentiful. They are generally brown in color, but
        deepen to black as they increase their fluid storage. During spring and
        summer rock cacti produce a bright yellow flower that lasts only a few
        hours. The rest of the time, rock cacti appear to be roughly spherical
        rocks, about 1 foot in diameter.</p><p>Rock cacti are found near game
        trails in small clumps of as many as 10 plants. They are non-ambulatory
        and so have no territory. They have been successfully transplanted to
        the gardens of Tyr, where they keep the rodent population in check. Rock
        cacti exude a perfume that is undetectable by demihumans but attracts
        small rodents and mammals. Like most plants, rock cacti rely on insects
        to assist them to reproduce.</p>
