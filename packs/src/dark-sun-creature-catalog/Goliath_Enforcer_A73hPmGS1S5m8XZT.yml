  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Known also as half-giants</p><p>within the city-states,
        goliaths are renowned for their physical power and fighting ability.
        They serve as gladiators, sentries, and elite bodyguards. Outside the
        city-states, goliaths are fearsome mountain
        raiders.</p><p>Lore</p><p>Goliaths are not a natural race. Using dark
        magic, sorcerer-kings created them generations ago by combining humans
        and giants. Although most goliaths now live in the city-states, a number
        of them wander the high mountains of Athas. They raid the lowlands for
        slaves and spoils, withdrawing to the high vales when pursued. Given
        enough incentive, whole tribes of barbaric mountain goliaths travel to
        the cities to serve as mercenaries or soldiers for nobles or a
        sorcerer-king.</p><p>Encounters</p><p>In the cities, goliaths are often
        thugs or agents of oppression, acting as hired muscle for templars,
        criminals, and slavers. Anyone who needs a strong warrior and has a few
        coins to spare might hire a goliath to intimidate or kill foes. In the
        Ringing Mountains, goliaths are violent reavers taking what they can
        from others. They have little use for companions that are not pets or
        slaves.</p><p>A few goliaths dwell among the giant tribes of the Sea of
        Silt. Although treated as menial servants, they're permitted to guard
        the islands and join in raiding. For goliaths with barbaric natures,
        this existence is preferable to dwelling among civilized
        peoples.</p><p>Info</p><p>A towering, muscle-bound thug clamps a meaty
        hand on a trespassing human, nearly toppling the diminutive figure.
        Glancing up at the formidable guard, the human realizes he has only two
        options: beg for his life or flee for it. Judging from the bone and
        blood covering the goliath's morningstar, he knows neither has much
        likelihood of success. As thugs, raiders, and mercenaries, goliath
        enforcers gravitate toward brute force and strength in numbers rather
        than skill and finesse. They throw themselves recklessly into the middle
        of the action, heedless of the danger.</p>
      public: ''
