  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>The night explodes with violence</p><p>Buildings erupt,
        showering the area with rubble before dissolving into a stinking paste.
        A roar overwhelms the myriad screams off right, and a lumbering
        monstrosity smashes through the ruins. Its nostrils flare, its black
        eyes roll, and its savagery is evident from the still twitching limbs
        spilling from its jaws. The rampager is destruction
        incarnate.</p><p>Lore</p><p>Structures in various states of ruin litter
        the wastelands, leftovers of war, natural disaster, or neglect. Where
        the destruction is absolute, where only foundations remain, those ruins
        mark the path of a rampager.</p><p>This beast was called "so-ut" in ages
        past, but that obscure name does little to explain the creature's
        destructive nature. It spares no living thing that gets in its way, but
        such killing does not sate its wrath. A rampager is committed to
        demolishing any and every artifice it encounters. The beast has a
        particular hatred for metal objects. Any humanoids wielding such
        treasures grab the monster's attention first.</p><p>Encounters</p><p>The
        rampager is a tormented creature. It is driven to terrible violence by
        vengeful primal spirits twisted to madness during Athas's ruination.
        Creature's unfortunate enough to encounter a rampager might spot
        flitting spirits of fire, sand, stone, or wind assailing the beast,
        filling it with uncontrollable rage. The spirits cannot be attacked
        during the encounter, but further chaos might be averted if a way can be
        found to placate them through offerings or
        restitution.</p><p>Info</p><p>The rampager's only motivation is to
        reduce big things into their smallest components. Hatred for
        civilization drives it from the wilderness to destroy everything in its
        path. It cannot abide metal's stench and focuses its attacks on enemies
        wielding metal weapons or wearing metal armor. Once it dispatches these
        foes, it turns back to structures and rips through walls and buildings
        until nothing remains. It stops only when it is dead or no artificial
        object remains intact.</p>
