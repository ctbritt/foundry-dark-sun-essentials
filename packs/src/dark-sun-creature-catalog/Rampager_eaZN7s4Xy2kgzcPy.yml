  - _id: 1DYcKtB7j29bBdsy
    name: Acid
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The acid that coats a rampager's claws
          not only deals extra damage on successful attacks, it also dissolves
          an opponent's armor and clothing. If the object isn't being worn or
          carried, the touch destroys a 1-foot cube of it. If the object is
          being worn or carried by a creature, the creature can make a [[/save
          ability=dex dc=18]] saving throw to avoid the ravager's touch on its
          equipment (this does not cancel the damage taken). If the object
          touched is either metal armor or a metal shield being worn or carried,
          its takes a permanent and cumulative -1 penalty to the AC it offers.
          Armor reduced to an AC of 10 or a shield that drops to a +0 bonus is
          destroyed. If the object touched is a held weapon, the weapon takes a
          permanent and cumulative -1 penalty to damage rolls. If its penalty
          drops to -5, the weapon is destroyed.</p></div>
