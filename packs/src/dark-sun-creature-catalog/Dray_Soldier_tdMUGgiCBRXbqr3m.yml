  details:
    biography:
      value: >-
        <p>All credits go to <a
        href="https://www.reddit.com/r/UnearthedArcana/comments/9vzwgr/the_dread_lord_dregoth_and_dray_dark_sun/"
        target="_blank" rel="noopener noreferrer">The dread lord dregoth and
        dray dark sun by u/scarlettspider</a> and <a
        href="https://darksun.fandom.com/wiki/Dregoth" target="_blank"
        rel="noopener noreferrer">Dregoth</a></p><p>Dray Soldier</p><p>Athasian
        dragonborn descend from humanoids transformed during the reign of an
        ancient sorcerer-king. They call themselves dray, the name bestowed on
        them by their creator.</p><p>Lore</p><p>The dragonborn were born from
        the mad genius of the sorcerer-king Dregoth, ruler of the former
        city-state of GiustenaL He created the race to serve him but deemed the
        result imperfect, so the capricious sorcerer cast the dray out into the
        sands ofAthas in scorn. A few were allowed to stay in Giustenal, but
        when the other sorcerer-kings banded together to slay Dregoth, those
        dray that remained either were killed or barely
        escaped.</p><p>Dragonborn are now extremely rare and band together in
        small tribes for survival. All that most know of their origin is that
        their creator tossed them aside, and none are aware that Dregoth
        persists in a state of undeath.</p><p>Among the few people who know of
        their existence, dragonborn have a reputation as slavers and sorcerers.
        Though not true ofall their kind, this reputation is well deserved. Many
        dray use the cruelty of their origin as a justification for slavery-they
        once belonged to Dregoth, and now they take slaves of their own. Others
        follow the path of the defiler, caring little for the preservation
        ofAthas in the pursuit ofever more power.</p><p>Encounters</p><p>Hostile
        dragonborn are slavers and mercenaries. They can be found alongside
        anyone who pays them enough. Dragonborn respect the strong, and their
        bands might include other tough humanoids and dangerous
        beasts.</p><p>Info</p><p>A few dray embrace their heritage as a race
        scorned by its creator. They become tribal leaders and strike down
        anyone who challenges them. A scorned champion leads a band of
        dragonborn raiders, risking itself to benefit its fellows in combat. It
        slashes away as it moves into the midst of enemies, then keeps them off
        balance so that its allies can seize the advantage.</p>
      public: ''
