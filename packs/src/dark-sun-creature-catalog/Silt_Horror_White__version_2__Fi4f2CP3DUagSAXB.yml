          damage at the start of each of the horror's turns. If the silt horror
          takes 30 damage or more ona single turn from a creature inside it, the
          silt horror must succeed on a [[/save ability=con dc=21]] saving throw
          at the end of that turn or regurgitate all swallowed creatures, which
          fall &amp;Reference[condition=prone] in a space within 10 feet of the
          horror. If the horror dies, a swallowed creature is no longer
          &amp;Reference[condition=restrained] by it and can escape from the
          corpse by using 20 feet of movement, exiting
          &amp;Reference[condition=prone].</p></div>
