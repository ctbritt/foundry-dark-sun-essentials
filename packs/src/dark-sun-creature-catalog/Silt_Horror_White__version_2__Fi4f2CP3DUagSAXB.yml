  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>Silt Horror is the name given a group of
        predators that dwell in the sea of sand. While they vary in size and
        color, all of them are characterized by a large number of tentacles, and
        an unending hunger. Few are the creatures that escape once a silt horror
        has its tentacles around them.</p><p>Info</p><p>The white horror is the
        most common, and usually the largest, of the silt horrors. Its tentacles
        can grow up to 50 feet long, and it uses them to drag prey below the
        silt.</p><p>The white horror is found anywhere in silt basins and the
        Sea of Silt. They move very slowly, and usually don't make the effort.
        They can sense vibrations in the silt up to 3 miles away, and gradually
        move towards any regular wading path that is used. The white horror does
        not like the sun, and if it must move out of the silt (to crawl over a
        sunken wall, for instance) it prefers to wait for dark.</p><p>The white
        horror eats anything except other horrors. It is always hungry, and
        usually attacks anything that comes in range. It can exist for years on
        one meal, lying dormant underneath the silt. It lives about 40 years,
        usually mating only once in its life.</p><p>If a horror has tentacles
        severed, it can replace them at the rate of one per month.</p>
