  - _id: 6gE43jPlQ5REwSDG
    name: Regional Effects
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The region containing a water drake's
          lair is warped by the dragon's elemental magic, which creates one or
          more of the following effects:</p><ul class="rd__list"><li
          class="rd__li ">Fog lightly obscure the land within 6 miles of the
          lair.</li><li class="rd__li ">Whenever a creature with an Intelligence
          of 3 or higher comes within 30 feet of a water source within 1 mile of
          the dragon's lair, the dragon become aware of the creature's presence
          and location.</li><li class="rd__li ">Once per day, the dragon can
          alter the weather in a 6 miles radius centered on its lair. The dragon
          doesn't need to be outdoor; otherwise the effects is identical to the
          Control Weather spell.</li><li class="rd__li ">Natural springs and
          pools within 1 mile of the lair form intermittent portals to the
          Elemental Plane of Water, allowing elemental creatures into the mortal
          world to dwell near those points.</li></ul><p>If the drake dies, these
          effects fade over the course of 1d10 days.</p></div>
        chat: ''
      requirements: ''
      uses:
        max: ''
        recovery: []
        spent: 0
      type:
        value: monster
