  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Drakes loom large in the myths of athas</p><p>Though
        tales of them might scare children, few people believe these giant
        monsters exist. Those who find out the truth rarely survive the
        experience-the soft flesh of humanoids is drakes' favorite
        food.</p><p>Lore</p><p>Athasian drakes are enormous, fearsome predators
        having only animal intelligence and strong instincts. Each variety of
        drake is attuned to a specific element and has psionic control over that
        element, making its home in areas dominated by its associated
        element.</p><p>Athasian drakes collect objects in their lairs or expand
        their territory, depending on the individual drake's nature. Although
        some hoards are valuable, drakes also amass trinkets or souvenirs that
        have no worth to anyone else. Air drakes maintain multiple lairs atop
        rocky spires or mesas and divide their few precious belongings among
        these lairs.</p><p>Encounters</p><p>Drakes use terrain to their
        advantage, and the setting for a battle with a drake can be as important
        as the monster. Precarious cliffs are a great setup for air drakes,
        volcanic fissures favor fire drakes, and unstable underground burrows
        make tricky settings for encounters with earth drakes. Water drakes
        might appear anywhere precious reserves of water exist. Any location
        might also have been booby-trapped or fortified before the drake claimed
        it.</p><p>Info</p><p>As the guides near the oasis, they listen closely.
        Though the area looks fertile, they see no signs of animals or other
        occupants. Perhaps mundane predators living nearby chased them off but
        if this oasis is home to a water drake, then nothing still lives-and the
        explorers are the next meal. A water drake prefers to remain in or close
        to a body of water, using psionic drone to send out duplicates that
        scout for food or investigate nearby disturbances. In combat, it uses
        these duplicates to help overcome powerful opponents. It can transport a
        small amount of water from the Elemental Chaos to the world as either
        boiling water or elemental ice.</p><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Lair Actions" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="1"> <span
        class="entry-title-inner">Lair Actions</span></h3> <p>On initiative
        count 20 (losing initiative ties), the dragon takes a lair action to
        cause one of the following effects; the dragon can't use the same effect
        two rounds in a row:</p><ul class="rd__list"><li class="rd__li ">Pools
        of water that the dragon can see within 120 feet of it surge outward in
        a grasping tide. Any creature on the ground within 20 feet of such a
        pool must succeed on a [[/save ability=str dc=15]] saving throw or be
        pulled up to 20 feet into the water and knocked
        &amp;Reference[condition=prone].</li><li class="rd__li ">Magical fog
        billows around one creature the dragon can see within 120 feet of it.
        The creature must succeed on a [[/save ability=wis dc=15]] saving throw
        or be &amp;Reference[condition=charmed] by the dragon until initiative
        count 20 on the next round.</li><li class="rd__li ">The dragon chooses a
        10-foot-square area on the ground that it can see within 120 feet of it.
        The ground in that area turns into 3-foot-deep mud. Each creature on the
        ground in that area when the mud appears must succeed on a [[/save
        ability=dex dc=15]] saving throw or sink into the mud and become
        &amp;Reference[condition=restrained]. A creature can take an action to
        attempt a [[/save ability=str dc=15]] check, freeing itself or another
        creature within its reach and ending the
        &amp;Reference[condition=restrained] condition on a success. Moving 1
        foot in the mud costs 2 feet of movement. On initiative count 20 on the
        next round, the mud hardens, and the Strength DC to work free increases
        to 20.</li></ul></div></div><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Regional Effects" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="2"> <span
        class="entry-title-inner">Regional Effects</span></h3> <p>The region
        containing a water drake's lair is warped by the dragon's elemental
        magic, which creates one or more of the following effects:</p><ul
        class="rd__list"><li class="rd__li ">Fog lightly obscure the land within
        6 miles of the lair.</li><li class="rd__li ">Whenever a creature with an
        Intelligence of 3 or higher comes within 30 feet of a water source
        within 1 mile of the dragon's lair, the dragon become aware of the
        creature's presence and location.</li><li class="rd__li ">Once per day,
        the dragon can alter the weather in a 6 miles radius centered on its
        lair. The dragon doesn't need to be outdoor; otherwise the effects is
        identical to the Control Weather spell.</li><li class="rd__li ">Natural
        springs and pools within 1 mile of the lair form intermittent portals to
        the Elemental Plane of Water, allowing elemental creatures into the
        mortal world to dwell near those points.</li></ul><p>If the drake dies,
        these effects fade over the course of 1d10 days.</p></div></div>
