  - _id: Vuzesw9z6eB8VUBs
    name: Prestidigitation
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '307'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create a magical effect within
          range. Choose the effect from the options below. If you cast this
          spell multiple times, you can have up to three of its
          non-instantaneous effects active at a time.</p><div
          data-roll-name-ancestor="Sensory Effect" class="rd__b 
          rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
          class="entry-title-inner">Sensory Effect.</span></span> You create an
          instantaneous, harmless sensory effect, such as a shower of sparks, a
          puff of wind, faint musical notes, or an odd odor.</p></div><div
          data-roll-name-ancestor="Fire Play" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="2"> <span
          class="entry-title-inner">Fire Play.</span></span> You instantaneously
          light or snuff out a candle, a torch, or a small
          campfire.</p></div><div data-roll-name-ancestor="Clean or Soil"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="3"> <span class="entry-title-inner">Clean or
          Soil.</span></span> You instantaneously clean or soil an object no
          larger than 1 cubic foot.</p></div><div data-roll-name-ancestor="Minor
          Sensation" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="4"> <span class="entry-title-inner">Minor
          Sensation.</span></span> You chill, warm, or flavor up to 1 cubic foot
          of nonliving material for 1 hour.</p></div><div
          data-roll-name-ancestor="Magic Mark" class="rd__b  rd__b--3"><p><span
          class="rd__h rd__h--3" data-title-index="5"> <span
          class="entry-title-inner">Magic Mark.</span></span> You make a color,
          a small mark, or a symbol appear on an object or a surface for 1
          hour.</p></div><div data-roll-name-ancestor="Minor Creation"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="6"> <span class="entry-title-inner">Minor
          Creation.</span></span> You create a nonmagical trinket or an illusory
          image that can fit in your hand. It lasts until the end of your next
          turn. A trinket can deal no damage and has no monetary
          worth.</p></div></div>
