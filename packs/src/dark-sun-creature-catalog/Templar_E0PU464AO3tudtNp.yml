  details:
    biography:
      value: >-
        <p>Templars are the greatly feared disciples of the sorcerer-kings.
        Their organization is steeped in ancient tradition and treacherous
        politics, and their work for the sorcerer-kings is governed by endless
        bureaucracy. To city dwellers, the templars are the enforcers of the
        sorcerer-king’s will, allowed to run rampant, enforcing the local edicts
        with painstaking indifference, doling out punishment or even execution
        with the sorcerer-king’s blessing. An organization of wicked men looking
        out for their own wealth and power, the templars are overrun with
        corruption to the highest level—the sorcerer-kings generally turn a
        blind eye to bribery and scandal among the templars, provided terror is
        maintained among their subject populations.</p>
      public: ''
