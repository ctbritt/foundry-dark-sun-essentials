  details:
    biography:
      value: >-
        <p>The Sorcerer-Kings are the immensely powerful tyrants of many of the
        city-states in The Tablelands. This stat block is meant to represent the
        weakest of the Sorcerer Monarchs and should be customized for each
        individual monarch.</p><p>Known Sorcerer Monarchs include:</p><ul
        class="rd__list"><li class="rd__li ">King Kalak of Tyr</li><li
        class="rd__li ">King Tectuktitlay of Draj</li><li class="rd__li ">King
        Dregoth of Giustenal/New Giustenal</li><li class="rd__li ">King Hamanu
        of Urik</li><li class="rd__li ">Queen Abalach-Re of Raam</li><li
        class="rd__li ">King Nibenay of Nibenay</li><li class="rd__li ">King
        Andropinis of Balic</li><li class="rd__li ">Queen Oba Lalali-Puy of
        Gulg</li><li class="rd__li ">King Daskinor of Eldaarich</li><li
        class="rd__li ">Queen Sielba of Yaramuke (destroyed)</li><li
        class="rd__li ">King Oronis of Kurn</li><li class="rd__li ">King
        Kalid-Ma of Kalidnay</li></ul><p>Each Sorcerer Monarch has unique
        abilities, personalities, and histories that set them apart from their
        peers.</p>
