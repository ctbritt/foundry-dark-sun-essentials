  details:
    cr: 25
    biography:
      value: >-
        <p>With a disposition as bad as its reputation, it’s no wonder that a
        nightmare beast spreads terror wherever it goes. A nightmare beast
        stands at least 20 feet tall on its four legs. Each of its digits is
        tipped with a 3-foot-long claw. Its jaws are filled with 1-foot-long
        teeth and flanked by curved tusks the size of cavalry lances. A
        nightmare beast’s thick, rough hide is typically dark gray with dark
        blue, purple, or brown splotches in between patches of bony material.
        Its red eyes, each the size of a man’s head, glow in the dark.</p><h3>A
        Nightmare Beast’s Lair</h3><p>The nightmare beast prefers to lair in a
        remote cave. It spends most of its time in search of food, and it ends
        to hunt in one area until the food supply is exhausted. At that point,
        it usually hibernates for up to one year, then awakens again in a
        ravenous state.</p><p>The monster has no interest in treasure, nor does
        it often bring any prey back to its lair, unless the kill is too large
        that it cannot be consumed all at once. A nightmare beast often
        inadvertently eats treasures along with their owners, so occasionally
        items of value turn up in the creature’s lair at a later time.</p><p>The
        region containing a nightmare beast’s lair is affected by the psionic
        power that gives it its name. Every intelligent creature that falls
        asleep within 10 miles of the nightmare beast’s lair must succeed on a
        DC 15 Wisdom saving throw. On a failed saving throw, the creature takes
        5 (1d10) psychic damage and suffers from horrid, vivid nightmares of
        being stalked and killed by monsters, demons, cruel enemies, or whatever
        else it fears. For the next 24 hours, the creature cannot gain the
        normal benefits of an 8-hour rest and the creature is marked by the
        nightmare beast. While marked by the nightmare beast, the nightmare
        beast deals an extra 1d6 damage to the target whenever it hits with a
        weapon attack, and it has advantage on any Wisdom (Perception) or Wisdom
        (Survival) check made to find the target.</p><p></p>
