              _id: G8NhqPOpsxSleEJT
              system:
                events:
                  - tokenEnter
                source: >-
                  let effectData = event.data.token.actor.appliedEffects.some(e
                  => e.name === "Stinking Cloud");


                  if(!effectData) {

                  effectData = [{
                        "disabled": false,
                        "name": "Stinking Cloud",
                        "img": "icons/commodities/materials/glass-orb-green.webp",
                        "transfer": false
                  }];


                  await MidiQOL.socket().executeAsGM("createEffects", {
                  actorUuid: event.data.token.actor.uuid, effects: effectData
                  });

