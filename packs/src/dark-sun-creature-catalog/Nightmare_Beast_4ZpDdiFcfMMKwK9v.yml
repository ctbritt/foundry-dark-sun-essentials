          ballistic attack (11th level), mind meld,
          @UUID[Compendium.world.psion-primer.FHTSDcEePsrJAyqG]{Mind Thrust}
          (11th level), thought spear (11th level)</p></li><li><p><strong>3/day
          each:</strong>
          @UUID[Compendium.world.psion-primer.VZIk8PmJbHPrSjoF]{Ego Whip} (+5
          psi),
