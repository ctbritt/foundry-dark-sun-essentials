  - _id: UrfWvj2SWms9kwnt
    name: Regional Effects
    type: feat
    system:
      source:
        custom: ''
        book: DarkSunCreatureCatalog
        page: ''
        license: ''
        rules: '2014'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>Dregoth rules the city of New
          Giustenal, which is located far below the ruins of the ancient city of
          Giustenal. Once a great city on the edge of a sparkling sea, today
          Giustenal is nothing more than ruins on the shore of the Silt Sea.
          It's a haunted place, for the death cries of the citizens who died
          when their sorcerer-king was murdered still echo in the sand-covered
          streets and alleys. New Giustenal is an underground city located deep
          beneath the ruins, where Dregoth makes mad plans and plots his revenge
          against the remaining sorcerer-kings.</p><p>When Dregoth isn't
          wandering the planes seeking ways to become a true god, he is locked
          inside his Dread Palace. Here he is well guarded by his sycophantic
          citizens, and has complete dominion over his city. Dregoth keeps
          groves of underground flora and fauna for his own personal defiling
          needs. His city is also built above a naturally occuring volcanic lava
          flow, which provides geothermal warmth for his citizens and also
          protects his city with great moats and lakes of liquid fire.</p><p>The
          region containing Dregoth creating one or more of the following
          effects:</p><ul class="rd__list"><li class="rd__li ">Dregoth's Lair:
          Dregoth is considered in his lair as long as he is within New
          Giustenal. If Dregoth is encountered in his lair he has a challenge
          rating of 26 (90,000 XP).</li></ul><p>If Dregoth's is destroyed, these
          effects fade over the course of [[/r 20d10]] days.</p></div>
        chat: ''
      requirements: ''
