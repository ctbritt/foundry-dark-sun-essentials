  - _id: BWt5t16c3xck0cR4
    name: Disintegrate
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '263'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You launch a green ray at a target you
          can see within range. The target can be a creature, a nonmagical
          object, or a creation of magical force, such as the wall created by
          @spell[Wall of Force|XPHB].</p><p>A creature targeted by this spell
          makes a Dexterity saving throw. On a failed save, the target takes
          [[/damage 10d6 + 40 type=force]] damage. If this damage reduces it to
          0 @variantrule[Hit Points|XPHB], it and everything nonmagical it is
          wearing and carrying are disintegrated into gray dust. The target can
          be revived only by a @spell[True Resurrection|XPHB] or a
          @spell[Wish|XPHB] spell.</p><p>This spell automatically disintegrates
          a Large or smaller nonmagical object or a creation of magical force.
          If such a target is Huge or larger, this spell disintegrates a
          10-foot-@variantrule[Cube [Area of Effect]|XPHB|Cube] portion of
          it.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> The damage increases by
          [[/damage 3d6]] for each spell slot level above 6.</p></div></div>
