  details:
    biography:
      value: >-
        <p>All credits go to <a
        href="https://www.reddit.com/r/UnearthedArcana/comments/9vzwgr/the_dread_lord_dregoth_and_dray_dark_sun/"
        target="_blank" rel="noopener noreferrer">The dread lord dregoth and
        dray dark sun by u/scarlettspider</a> and <a
        href="https://darksun.fandom.com/wiki/Dregoth" target="_blank"
        rel="noopener noreferrer">Dregoth</a></p><p>Dregoth was taken the title
        of Dregoth of Giustenal. Besides he was the 3rd Champion of Rajaat,
        known as the "Ravager of Giants". Although he was ordered into cleansing
        of the Giants, reaged across the lands, since the Cleansing Wars (144th
        King's Age -3.531), it was unsuccessful.</p><p>The long thought dead
        Sorcerer-King of Giustenal. Known as the Dread King. Now he is the
        Undead Lord of New Giustenal.</p><p>History</p><p>For over a millenium
        he had toiled for Rajaat's cause by day while seeking to fullfill his
        own plans in the quiet of the night. During long time he had searched
        through the older sections of Giustenal, sifting through ruins and texts
        from the earliest moments of the Green Age (8th World's Age -14.028) for
        the knowledge he desired.</p><p>Obsession with Godhood</p><p>Dregoth was
        always obsessed with why the deities of Athas seemed to not exist. His
        obsession lead to his dicsovery of how to become one himself. 
        </p><p>Champions turned traitors</p><p>On 164th King's Age (-1.971),
        this obsession lead to his eventual downfall at the hands of
        Sorcerer-Queen Abalach-Re and other Sorcerer-Kings. One of the last
        times the Sorcerer-Kings allied under one cause. It is believed upon his
        transformation into a full Dragon he would turn into a deity. Once he
        was dead the Sorcerer-Kings returned to their city-states.
        </p><p>Acension into Lichhood</p><p>Absalom was once a human of
        Giustenal, until he was transformed into a Dray. After his
        transformation was completed by Dregoth, he was killed and raised as the
        Dread King's new High Priest. It is because of Absalom that Dregoth
        still lives as a Lich-like beast. It is not known what to make of
        Dregoth, after his transformation he is a Lich, but his body looks more
        like Dragon. While not a full Dragon he is still a formidable foe. The
        location of his phylactery is known only by Dregoth and his High Priest
        Absalom.</p><p>New Giustenal</p><p>After his resurrection, Dregoth fled
        beneath the ruins of Giustenal to raise himself another army. This
        underground city is filled with new Dray, created by their Dread King.
        These New Giustenal Dray were bred to seek revenge on those who stopped
        their creator from attaining both Godhood and Dragonhood.</p><div
        class="rd__b  rd__b--1"><div data-roll-name-ancestor="Lair Actions"
        class="rd__b  rd__b--2"><h3 class="rd__h rd__h--2" data-title-index="1">
        <span class="entry-title-inner">Lair Actions</span></h3> <p>On
        initiative count 20 (losing initiative ties), Dregoth takes a lair
        action to cause one of the following effects; Dregoth can't use the same
        effect two rounds in a row:</p><ul class="rd__list"><li class="rd__li
        ">Magma erupts from a point on the ground that Dregoth can see within
        120 feet of him, creating a 20-foot-high, 5-foot-radius geyser. Each
        creature in the geyser's area must make a [[/save ability=dex dc=15]]
        saving throw, taking 21 ([[/damage 6d6 type=fire]]) damage on a failed
        save, or half as much on a successful one.</li><li class="rd__li
        ">Dregoth summons his citizens and soldiers to his side. They act on
        their own initiative as a group. Dregoth can summon either: [[/r 1d10 +
        2]] Dray or [[/r 1d6 + 1]] Dray Soldiers or [[/r 1d2]] Dray Templars or
        Priests</li><li class="rd__li ">Dregoth defiles all living creatures
        near him, draining moisture and vitality from them. Each creature within
        a 10-foot-radius of Dregoth must make a [[/save ability=con dc=20]]
        saving throw. A target takes 27 ([[/damage 4d12 type=necrotic]]) damage
        on a failed save, or half as much damage on a successful one. Dregoth
        regains health points equal to half the damage dealth to all creatures
        in total. Any plant creature or magical plant makes the saving throw
        with disadvantage, and the defilement deals maximum damage to it. If a
        target is a nonmagical plant that isn't a creature, such as a tree or
        shrub, it doesn't make a saving throw; it simply withers and
        dies.</li></ul></div></div><div class="rd__b  rd__b--1"><div
        data-roll-name-ancestor="Regional Effects" class="rd__b  rd__b--2"><h3
        class="rd__h rd__h--2" data-title-index="2"> <span
        class="entry-title-inner">Regional Effects</span></h3> <p>Dregoth rules
        the city of New Giustenal, which is located far below the ruins of the
        ancient city of Giustenal. Once a great city on the edge of a sparkling
        sea, today Giustenal is nothing more than ruins on the shore of the Silt
        Sea. It's a haunted place, for the death cries of the citizens who died
        when their sorcerer-king was murdered still echo in the sand-covered
        streets and alleys. New Giustenal is an underground city located deep
        beneath the ruins, where Dregoth makes mad plans and plots his revenge
        against the remaining sorcerer-kings.</p><p>When Dregoth isn't wandering
        the planes seeking ways to become a true god, he is locked inside his
        Dread Palace. Here he is well guarded by his sycophantic citizens, and
        has complete dominion over his city. Dregoth keeps groves of underground
        flora and fauna for his own personal defiling needs. His city is also
        built above a naturally occuring volcanic lava flow, which provides
        geothermal warmth for his citizens and also protects his city with great
        moats and lakes of liquid fire.</p><p>The region containing Dregoth
        creating one or more of the following effects:</p><ul
        class="rd__list"><li class="rd__li ">Dregoth's Lair: Dregoth is
        considered in his lair as long as he is within New Giustenal. If Dregoth
        is encountered in his lair he has a challenge rating of 26 (90,000
        XP).</li></ul><p>If Dregoth's is destroyed, these effects fade over the
        course of [[/r 20d10]] days.</p></div></div>
