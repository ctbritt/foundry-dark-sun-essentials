  details:
    biography:
      value: >-
        <p>T'lizes are undead defilers whose spirits have outlived their bodies.
        They are extremely powerful undead who seek magical knowledge and power
        above all else and exist as such to continue their study of magic. They
        seldom associate with the living except when mortals provide suitable
        pawns. Because they appear much as they did in life, t'lizes can move
        freely among the living. Their only unusual features are their skin,
        which is extremely pale, and their weight, which often diminishes until
        they become no greater than average in build. T'lizes must anoint
        themselves with numerous oils and substances that prevent their bodies
        from deteriorating. They must also feast upon the life energy of the
        living to sustain their own energies.</p><p>Often, t'lizes have large
        numbers of undead serving them as minions. These minions protect their
        lairs, bring them living victims for their experiments, and provide them
        with the equipment they need for their studies.</p><p>T'lizes hate other
        t'lizes as much, if not more, than they hate the living. Viewing their
        own kind as rivals, they are known to engage in century-long disputes.
        Either out of boredom or to annoy other t'lizes, they often pit their
        undead minions against the undead minions of other
        t'lizes.</p><p>T'lizes are known for their scheming nature. While they
        occasionally have dealings with the living, they do so only to further
        some nefarious plan of their own. They are said to dabble in politics
        and trade, but only if they can make their unseen presence felt as
        hardship upon the living.</p>
      public: ''
