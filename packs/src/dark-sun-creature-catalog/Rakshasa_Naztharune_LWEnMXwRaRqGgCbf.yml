      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>For the duration, magical
          @variantrule[Darkness|XPHB] spreads from a point within range and
          fills a 15-foot-radius @variantrule[Sphere [Area of
          Effect]|XPHB|Sphere]. &amp;Reference[rule=Darkvision] can't see
          through it, and nonmagical light can't illuminate
