          being worn or carried, causing the @variantrule[Darkness|XPHB] to fill
          a 15-foot @variantrule[Emanation [Area of Effect]|XPHB|Emanation]
          originating from that object. Covering that object with something
          opaque, such as a bowl or helm, blocks the
          @variantrule[Darkness|XPHB].</p><p>If any of this spell's area
          overlaps with an area of @variantrule[Bright Light|XPHB] or
