  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Although descended</p><p>from creatures said to come
        from beyond the Gray, Athas's gith are tribal and savage. The slide into
        barbarism did not extinguish their mental abilities, however. Combined
        with the giths' extreme brutality and absolute mercilessness, their
        psionic powers might be even more dangerous than those of their
        forebears.</p><p>Lore</p><p>Githyanki first visited Athas long ago
        aboard a vast, silvery craft that transported them from a place beyond
        the Gray. The githyanki sought a way back to their realm, but they found
        themselves trapped on Athas by the Gray, which serves as a
        nighimpassable planar barrier between the world and their home realm.
        Meanwhile, the visitors proved particularly sensitive to the corrupting
        nature of arcane magic. Today, the descendants of the first githyanki
        survive as shadows of their former selves, decayed in both mind and
        body. They have not forgotten their origins however. A few tribes are
        dedicated to gathering shards of their long-lost ship, hoping to return
        home. Gith tribes wander the mountains and the Tablelands living as
        nomadic hunters. Like thri-kreen tribes, gith grant humanoids no special
        status hunting them as avidly as any other
        prey.</p><p>Encounters</p><p>Gith travel in small packs though sometimes
        an individual can be found with other creatures, working as a mercenary
        or as a slave. Gith also keep pets such as baazrags. Although most gith
        attack foulspawn on Sight a few tribes have begun to collaborate with
        these aberrations toward some shared ambition.</p><p>Info</p><p>These
        bloodthirsty degenerates are always earger to join the hunt. Gith
        savages' lives are nasty, brutish and short.</p>
