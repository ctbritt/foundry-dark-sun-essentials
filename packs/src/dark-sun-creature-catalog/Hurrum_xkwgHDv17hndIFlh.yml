  details:
    biography:
      value: >-
        <div class="rd__b  rd__b--1"><p>These brightly-colored beetles are
        highly prized for the pleasant humming sounds they produce. Better
        trading houses have at least one. Hurrum beat their wings rapidly back
        and forth, gently striking the underside of their carapace which creates
        the vibration and noise for which these creatures are best known. The
        sound is also used as a simple form of communication between hurrum
        beetles.</p></div>
