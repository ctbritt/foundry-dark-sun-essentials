  - name: Web
    type: feat
    system:
      description:
        value: >-
          <p>Crystal spiders weave razor-sharp webs of crystal spanning 20
          square feet. Creatures must make a [[/check prc dc=20 format=long]] to
          notice a web. Creatures that come in contact with the web suffer 7
          ([[/r 2d6]]) slashing damage and are &amp;Reference[Restrained
          apply=false]. As an action, the &amp;Reference[Restrained apply=false]
          target can make a [[/check str dc=16 format=long]], bursting the
          webbing on a success; on a failure they take 3 (1d6) slashing damage.
          The webbing can also be attacked and destroyed (AC 15; hp 12;
          resistance to slashing and piercing; immunity to bludgeoning, poison,
          and psychic damage).</p>
