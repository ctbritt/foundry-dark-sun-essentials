  - name: Control Light & Sound
    type: spell
    img: modules/5e-spellblock-importer/img/spell.png
    system:
      description:
        value: >-
          <p>You manifest a minor wonder, a sign of supernatural power, within
          range. You create one of the following magical effects within
          range:</p><ul><li><p>Your voice booms up to three times as loud as
          normal for 1 minute.</p></li><li><p>You cause flames to flicker,
          brighten, dim, or change color for 1 minute.<br />You create an
          instantaneous sound that originates from a point of your choice within
          range, such as a rumble of thunder, the cry of an eagle, or ominous
          whispers</p></li><li><p>Brighten a light source until it hurts to look
          at it.<br />This gives everyone within 10 feet to the light
          disadvantage on attack rolls.</p></li><li><p>Lighten existing shadows,
          reducing hiding ability by 1d4 for 1 minute.</p></li><li><p>You cause
          shadows to deepen, increasing hiding ability by 1d4 for 1
          minute.</p></li><li><p>You shape and alter existing sounds, making
          them sound like something else for up to 1 minute.</p></li><li><p>You
          shed bright light in a 20-foot radius and dim light for an additional
          20 feet around you for up to 1 hour. The light can be colored as you
          like.</p></li></ul><p>If you manifest this power multiple times, you
          can have up to three of its 1-minute effects active at a time, and you
          can dismiss such an effect as an action.</p>
