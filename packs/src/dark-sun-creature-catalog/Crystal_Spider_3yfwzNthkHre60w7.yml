  details:
    cr: 5
    biography:
      value: >-
        <p>Resembling giant wolf spiders, crystal spiders have bodies composed
        of multifaceted crystal that creates dazzling patterns of refracted
        light. They spin glass webs that are very sharp and can focus a damaging
        beam of light at a potential victim.<br />The crystal spider is a
        beautiful creature. During the day the sunlight refracts through it,
        reflecting a myriad of colors which change as it moves. At night it
        reflects any ambient light, retaining its colors but not as radiant as
        during the day. When the spider has fed, it takes on a reddish tinge but
        this fades over a few days.<br /></p><p>A crystal spider is incapable of
        making sounds but can communicate with others of its kind by means of
        controlled light.<br /></p><p>Crystal spiders get most of their
        nutrients from sunlight but do require liquids to survive, preferring
        humanoid blood. They are hunted for their webs, which make excellent
        weapons, and for the gems which they instinctively weave into these webs
        (although the spiders are themselves unaware of their value).<br
        /></p><p>A typical crystal spider is eight feet long and can live up to
        150 years. Before death, a crystal spider will lay a single huge cluster
        of eggs (as many as 200) in a specially crafted web.</p>
