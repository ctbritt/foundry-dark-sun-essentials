          understand language, or communicate in any intelligible way. The
          creature can, however, identify its friends, follow them, and even
          protect them.</p>

          <p>At the end of every 30 days, the creature can repeat its saving
          throw against this spell. If it succeeds on its saving throw, the
          spell ends.</p>

          <p>The spell can also be ended by <strong>greater
          restoration</strong>, <strong>heal</strong>, or
          <strong>wish</strong>.</p>

          </div>
