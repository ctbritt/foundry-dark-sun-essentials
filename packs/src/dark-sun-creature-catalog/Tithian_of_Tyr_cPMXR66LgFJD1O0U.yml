  details:
    cr: 17
    biography:
      value: >-
        <h1>Encounter Strategy &amp; Tactics </h1><p>Tithian isn't a brute-force
        combatant—he's cunning, manipulative, and tactical. He prefers to stay
        at range, using minions to slow down melee attackers. He opens combat by
        deploying debilitating spells like Psychic Scream or Synaptic Static. He
        saves Legendary Resistances to counter critical crowd-control spells
        like Feeblemind or Banishment attempts. Uses Forcecage strategically to
        isolate key threats (e.g., healers or powerful melee fighters). Tithian
        attempts to neutralize intelligence-based or spellcasting enemies early
        using Feeblemind. Psionic Blast and Mental Assault keep melee threats
        locked down. Uses Psionic Barrier and teleportation (Reposition) to
        maintain tactical advantage and mobility.</p><h1>Suggested
        Minions</h1><p>Gith Psionic Warriors (CR 3-4)<br />Templar Knights
        (Veterans/Knights, CR 3-5)<br />Shadows or Specters summoned via
        necromancy or dark rituals (CR 1-2)</p>
