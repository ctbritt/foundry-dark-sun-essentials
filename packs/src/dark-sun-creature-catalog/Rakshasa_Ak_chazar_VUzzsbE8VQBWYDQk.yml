      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The rakshasa can use its action to
          polymorph into a Small or Medium humanoid, or back into its true form.
          Its statistics, other than its size, are the same in each form and the
          rakshasa loses its claw and bite attacks. Any equipment it is wearing
          or carrying isn't transformed. It reverts to its true form if it dies.
          A change in form cannot be dispelled, but a rakshasa reverts to its
          natural form when killed. A true seeing spell reveals its natural
          form.</p></div>
