        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>An ak'chazar rakshasa can emit an aura
          of negative energy. Every creature within 20 feet of an ak'chazar
          rakshasa when it activates the ability takes 40 necrotic damages
          (10d8) and becomes &amp;Reference[condition=frightened] for one
          minute. Creatures within the area can make a [[/save ability=wis
          dc=18]] saving throws for half damage (and to ignore the
          &amp;Reference[condition=frightened] effect, the target can repeat the
          saving throw at the end of each of its turns, ending the effect on
          itself on a success.). Undead creatures within the area are healed of
          40 (10d8) points of damage instead, and any turning effect they are
          under is broken.</p></div>
