  - _id: 0hXhgh7j2lRhqqur
    name: Imprisonment
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '288'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You create a magical restraint to hold
          a creature that you can see within range. The target must make a
          Wisdom saving throw. On a successful save, the target is unaffected,
          and it is immune to this spell for the next 24 hours. On a failed
          save, the target is imprisoned. While imprisoned, the target doesn't
          need to breathe, eat, or drink, and it doesn't age. Divination spells
          can't locate or perceive the imprisoned target, and the target can't
          teleport.</p><p>Until the spell ends, the target is also affected by
          one of the following effects of your choice:</p><ul class="rd__list
          rd__list-hang-notitle"><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Burial"><span class="bold
          rd__list-item-name">Burial.</span> The target is entombed beneath the
          earth in a hollow globe of magical force that is just large enough to
          contain the target. Nothing can pass into or out of the
          globe.</p></li><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Chaining"><span class="bold
          rd__list-item-name">Chaining.</span> Chains firmly rooted in the
          ground hold the target in place. The target has the
          &amp;Reference[condition=Restrained] condition and can't be moved by
          any means.</p></li><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Hedged Prison"><span class="bold
          rd__list-item-name">Hedged Prison.</span> The target is trapped in a
          demiplane that is warded against teleportation and planar travel. The
          demiplane is your choice of a labyrinth, a cage, a tower, or the
          like.</p></li><li class="rd__li "><p class="rd__p-list-item"
          data-roll-name-ancestor="Minimus Containment"><span class="bold
          rd__list-item-name">Minimus Containment.</span> The target becomes 1
          inch tall and is trapped inside an indestructible gemstone or a
          similar object. Light can pass through the gemstone (allowing the
          target to see out and other creatures to see in), but nothing else can
          pass through by any means.</p></li><li class="rd__li "><p
          class="rd__p-list-item" data-roll-name-ancestor="Slumber"><span
          class="bold rd__list-item-name">Slumber.</span> The target has the
          &amp;Reference[condition=Unconscious] condition and can't be
          awoken.</p></li></ul><div data-roll-name-ancestor="Ending the Spell"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Ending the
          Spell.</span></span> When you cast the spell, specify a trigger that
          will end it. The trigger can be as simple or as elaborate as you
          choose, but the DM must agree that it has a high likelihood of
          happening within the next decade. The trigger must be an observable
          action, such as someone making a particular offering at the temple of
          your god, saving your true love, or defeating a specific
          monster.</p><p>A @spell[Dispel Magic|XPHB] spell can end the spell
          only if it is cast with a level 9 spell slot, targeting either the
          prison or the component used to create it.</p></div></div>
        chat: ''
      level: 9
      school: abj
      properties:
        - vocal
        - somatic
        - material
      ability: cha
