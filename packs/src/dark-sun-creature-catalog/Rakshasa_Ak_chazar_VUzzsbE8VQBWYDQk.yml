  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Lore</p><p>The rakshasa employs delicacy and
        misdirection in its pursuit of dominion over others. Few creatures ever
        see the fiend in its true form, for it can take on any guise it wants,
        although it prefers to masquerade as someone powerful or influential: a
        noble, cardinal, or rich merchant, for example. A rakshasa's true form
        combines the features of a human and a tiger, with one noteworthy
        deformity: its palms are where the backs of the hands would be on a
        human.</p><p>Rakshasas originated long ago in the Nine Hells, when
        powerful devils created a dark ritual to free their essence from their
        fiendish bodies in order to escape the Lower Planes. A rakshasa enters
        the Material Plane to feed its appetite for humanoid flesh and evil
        schemes. It selects its prey with care, taking pains to keep its
        presence in the world a secret.</p><p>For a rakshasa, death on the
        Material Plane means an agonizing and torturous return to the Nine
        Hells, where its essence remains trapped until its body reforms - a
        process that cart take months or years. When the rakshasa is reborn, it
        has all the memories and knowledge of its former life, and it seeks
        retribution against the one who slew it. If the target has somehow
        slipped through its grasp, the rakshasa might punish its killer's
        family, friends, or descendants. Like devils, rakshasas killed in the
        Nine Hells are forever destroyed.</p><p>Encounter</p><p>Mountains of the
        Teeth: A low range of dry, knife-edged peaks, the Mountains of the Teeth
        are home to hostile tribes of tareks and minotaurs. The mountains also
        hide several mysterious, ancient monasteries the strongholds of rakshasa
        princes. Ranging out from these isolated retreats, rakshasa spies roam
        the Tyr Region, secretly plotting to turn the sorcerer-kings against one
        another and enslave the city-states.</p><p>Rising out of the dust like
        the shattered fang of an enormous beast, Roqom appears only at the peak
        of midday on the hottest days of the year. This sharp, jagged spire of
        basalt lies in the wilderness beyond the Beastbarrens, but according to
        legend, it appears wherever its master can work the greatest mischief.
        The master of Roqom is Fajjayad, a great rakshasa prince, and he
        occasionally uses magical sendings tolure silt sailors and travelers to
        his black palace especiallytravelers who have a desperate need of some
        sort. Fajjayad claims to be able to provide for any such needs in
        exchange for services to be rendered within 1,001 days. The rakshasa is
        unfailingly polite and candid. If asked, he freely admits that the task
        he sets is likely to be difficult, even deadly, and that his "clients"
        might die while attempting it. However, Fajjayad assures them that "the
        laws" (a term he does not define) forbid him from setting a task that is
        impossible or whose outcome is certain death. For his magic to work, the
        task must have an element of chance and uncertainty. Still, if any group
        has ever profited from Fajjayad's bargain, its tale is not
        known.</p><p>Info</p><p>Ak'chazar rakshasas wander the planes seeking
        new lands to subjugate and new undead minions to enslave. These
        rakshasas are masters of necromantic magic, although they are powerful
        in the other schools of magic as well. Ak'chazar rakshasas typically
        work behind the scenes, manipulating events to suit their dark whims and
        relying on their web of spies, assassins, and intelligent undead to
        carry out their nefarious plots. Ak'chazar rakshasas do associate with
        other rakshasas, often as leaders or manipulators. Other types of
        rakshasas value an ak'chazar's intelligence even as they fear its
        abilities. It is not uncommon for weaker rakshasas to follow the complex
        plans of an ak'chazar even as they go about their own missions. All
        rakshasas tend toward solitary existences, but communication and
        coordination between the various kinds is not unheard of.</p><p>An
        ak'chazar rakshasa typically establishes a power base at the site of a
        great battle, a city of the dead, or some other place where a large
        number of corpses might be interred. It uses its power over undead to
        create several intelligent undead minions. Thereafter, it might make
        contact with a local underworld organization (almost always through
        intermediaries) or even a corrupt or power-hungry political
        official.</p><p>It will play with these leaders, offering them advice,
        power, or riches as it learns their habits and defining characteristics.
        Then the ak'chazar uses its magic jar spell-like ability to replace one
        of these leaders for a time, using the borrowed body to solidify its
        hold on the region.</p><p>Several of the House Tsalaxa high officials
        are actually ak'chazar rakshasas. They sequester themselves in
        foreboding strongholds or warehouses hidden in the waste, although some
        have made lairs closer to the heart of civilization in the city states.
        At least one ak'chazar rakshasa operates from within Balic, lending his
        services and undead minions in exchange for special favors too terrible
        to ponder.</p>
