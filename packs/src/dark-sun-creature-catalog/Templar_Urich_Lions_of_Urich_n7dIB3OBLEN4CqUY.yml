      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>An aura of authority and majesty
          radiate from the Templar, appearing as a white flamy mane. Each
          creature within 30ft of the Templar that tries to attack it must first
          succeed on a [[/save ability=wis dc=16]] saving throw, if the save a
          failure they cannot attack the Templar or engage in hostile actions
          toward him until the end of the Templar's next turn and her action is
          wasted for this turn. Additionnaly a creature that fails its saving
          throw suffers 13 (3d8) damage. If a creature succeed on the saving
          throw she can act as she wishes and is immune to this lion of urich
          Mane of Power for the next 24 hours. A creature that cannot be
          &amp;Reference[condition=charmed] is immune to this power. The Templar
          can activate or deactivate this power at will with a bonus
          action.</p></div>
