  - _id: yxjeiwUvMlM5eQTo
    name: Spike Growth
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '319'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>The ground in a 20-foot-radius
          @variantrule[Sphere [Area of Effect]|XPHB|Sphere] centered on a point
          within range sprouts hard spikes and thorns. The area becomes
          @variantrule[Difficult Terrain|XPHB] for the duration. When a creature
          moves into or within the area, it takes 2d4 damage for every 5 feet it
          travels.</p><p>The transformation of the ground is camouflaged to look
          natural. Any creature that can't see the area when the spell is cast
          must take a @action[Search|XPHB] action and succeed on a Wisdom
          (&amp;Reference[skill=Perception] or &amp;Reference[skill=Survival])
          check against your spell save DC to recognize the terrain as hazardous
