  - _id: qmwwEtFZ1l3ZuKKe
    name: Giant Insect
    type: spell
    system:
      source:
        custom: ''
        book: PHB 2024
        page: '279'
        license: ''
        rules: '2024'
        revision: 1
      description:
        value: >-
          <div class="rd__b  rd__b--3"><p>You summon a giant centipede, spider,
          or wasp (chosen when you cast the spell). It manifests in an
          unoccupied space you can see within range and uses the @creature[Giant
          Insect|XPHB] stat block. The form you choose determines certain
          details in its stat block. The creature disappears when it drops to 0
          @variantrule[Hit Points|XPHB] or when the spell ends.</p><p>The
          creature is an ally to you and your allies. In combat, the creature
          shares your @variantrule[Initiative|XPHB] count, but it takes its turn
          immediately after yours. It obeys your verbal commands (no action
          required by you). If you don't issue any, it takes the
          @action[Dodge|XPHB] action and uses its movement to avoid
          danger.</p></div><div class="rd__b  rd__b--3"><p></p><div
          data-roll-name-ancestor="Using a Higher-Level Spell Slot"
          class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
          data-title-index="1"> <span class="entry-title-inner">Using a
          Higher-Level Spell Slot.</span></span> Use the spell slot's level for
          the spell's level in the stat block.</p></div></div>
