  details:
    biography:
      value: >-
        <p><a
        href="https://drive.google.com/file/d/1R4dJNW7Gx19N809bB7HAJMMlE72fPsPH/view"
        target="_blank" rel="noopener noreferrer">Monster Manual - Dark Sun 5th
        Edition by Stanislav Zabielin</a> by <a
        href="https://www.reddit.com/r/DarkSun/comments/7ws6kq/monster_manual_dark_sun_5th_edition_by_auquid/"
        target="_blank" rel="noopener noreferrer">auquid</a> and <a
        href="https://www.dropbox.com/s/0mu0yblgq8x53l6/5th%20Edition%20Dark%20Sun%20Creatures.pdf?dl=0"
        target="_blank" rel="noopener noreferrer">Athas Arena Forum by Nathan
        Hasle</a></p><p>Fey creatures</p><p>said to come from the Lands Within
        the Wind, sand beauties are mysterious creatures coming from another
        plane of existence. Sand Beauties is a general term to refer to nymphs,
        female fey potentially good or malevolent.</p><p>Info</p><p>Nymphs are
        nature's embodiment of physical beauty, and the guardians of the sacred
        places of the wild. They are so unbearably lovely that even a glimpse of
        one can blind an onlooker. Nymphs hates any who would defile the wilds
        for any reason and arcane magic under any form.</p><p>A nymphs demeanor
        is wild and mercurial. Like nature itself, she embodies both great
        beauty and fearsome danger. She can be kind and graceful to mortals who
        revere the wild place of the world, but is also quick to strike against
        those who take more than they need or who treat nature thoughtlessly.
        Animals of all types flock to a nymph, ignoring the presence of natural
        enemies, injured beasts know that the nymph will tend their wounds. A
        nymph is about the height and weight of a female elf. Nymphs speak
        Sylvan and Common.</p><p>A nymph usually avoids contact with nonfey, but
        she often has a place to she holds sacred and defends against all
        intrusions an oasis, a mudflat or sometime a dune top or a peak. She
        uses her spells and animal allies to drive intruders away from the spot
        she defends, preferring to use non-lethal attack first and resorting to
        deadly attacks first and resorting to deadly attacks only when faced by
        evil creatures or intruders who reply to her efforts with deadly attacks
        of their own.</p><p>Nymphs are better disposed toward elves, half-elves,
        and druids, individuals they recognize as friends of nature. They are
        likely to offer such people a chance to explain their presence instead
        of driving them away.</p>
