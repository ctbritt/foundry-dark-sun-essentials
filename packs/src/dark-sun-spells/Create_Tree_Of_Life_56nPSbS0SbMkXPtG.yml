name: Create Tree Of Life
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>By means of this spell, a caster can enchant a living sapling to become
      a magical Tree of Life.</p><p>The sapling must have already sprouted from
      the ground, though the caster can transplant such a sapling before casting
      the spell.</p><p>It will grow to its full size in only one week, but has
      its full powers and capabilities immediately after the spell is
      cast.</p><p>Any tree less than one year old will suffice; this spell
      cannot be cast on an older tree.<br />The properties of a Tree of Life are
      described at the end of this chapter.<br /></p>
    chat: ''
  materials:
    value: >-
      a piece of gold wire worth 1,000 cr which is wrapped around the sapling
      that is to be made into the Tree of Life
