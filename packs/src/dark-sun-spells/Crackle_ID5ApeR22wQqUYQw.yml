name: Crackle
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You create three arcs of lightning striking targets in range. You can
      direct them at one target or several.</p><p>Make a ranged spell attack for
      each arc. On a hit, the target takes [[/damage 1d12 type=lightning
      average=true]]. If three or more arcs hit a single target, they must make
      a [[/save con dc=@abilities.spelldc format=long]] or become shocked,
      &amp;Reference[stunned]{stunning} them until the start of their next
      turn.</p><p><em><strong>At Higher Levels.</strong></em> When you cast this
      spell using a spell slot of 3rd level or higher, you create one additional
      arc for each slot level above 2nd.<br /></p>
