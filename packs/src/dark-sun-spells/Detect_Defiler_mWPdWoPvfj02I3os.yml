name: Detect Defiler
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      For the duration, you sense the presence of defilers and where the defiler
      is located.<br />A defiler must have at least 1 point in her defiler aura
      to be detected.<br />You learn the number of permanent defiler aura points
      each defiler has, and you learn whether the defiler has less, more, or the
      same number of Hit Dice as you.<br />This spell can penetrate most
      barriers, but it is blocked by 1 foot of stone, 1 inch of common metal, a
      thin sheet of lead, or 3 feet of wood or dirt.<br />
