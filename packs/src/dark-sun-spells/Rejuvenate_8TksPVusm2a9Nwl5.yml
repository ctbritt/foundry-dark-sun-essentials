  description:
    value: >-
      <div class="ddb">

      <p class="p1">This spell restores deﬁled or otherwise desolate <span
      class="s10">terrain</span> <span class="s10">to</span> <span
      class="s10">where</span> <span class="s10">it</span> <span
      class="s10">can</span> <span class="s10">support</span> <span
      class="s10">life</span> <span class="s10">again.</span> <span
      class="s10">The spell</span> <span class="s10">may</span> <span
      class="s10">be</span> <span class="s10">cast</span> <span
      class="s10">on</span> <span class="s10">any</span> <span
      class="s10">ground</span> <span class="s10">short</span> <span
      class="s10">of</span> <span class="s10">solid </span><span
      class="s14">rock,</span> <span class="s14">including</span> <span
      class="s14">sand,</span> <span class="s14">rocky</span> <span
      class="s14">sand,</span> <span class="s14">soil,</span> <span
      class="s14">or</span> <span class="s14">dust. </span></p>

      <p class="p7">The spell effects the ground in a 50-foot radius <span
      class="s1">centered</span> <span class="s1">on</span> <span
      class="s1">the</span> <span class="s1">caster.</span> <span
      class="s1">Once</span> <span class="s1">cast,</span> <span
      class="s1">the</span> <span class="s1">soil</span> <span class="s1">is
      enriched</span> <span class="s1">and</span> <span
      class="s1">moistened,</span> <span class="s1">and</span> <span
      class="s1">a</span> <span class="s1">layer</span> <span
      class="s1">of</span> <span class="s1">ﬁne grass</span> <span
      class="s1">or</span> <span class="s1">other</span> <span
      class="s1">plant</span> <span class="s1">life</span> <span
      class="s1">appropriate</span> <span class="s1">to</span> <span
      class="s1">the terrain</span> <span class="s1">emerges</span> <span
      class="s1">instantly.</span></p>

      <p class="p8"><span class="s1">Once</span> <span class="s1">cast,</span>
      <span class="s1">the</span> <span class="s1">moist</span> <span
      class="s1">soil</span> <span class="s1">and</span> <span
      class="s1">grass</span> <span class="s1">are</span> <span class="s1">not
      </span><span class="s10">magical</span> <span class="s10">and</span> <span
      class="s10">are</span> <span class="s10">subject</span> <span
      class="s10">to</span> <span class="s10">all</span> <span
      class="s10">natural</span> <span class="s10">forces </span><span
      class="s2">upon</span> <span class="s2">them.</span> <span
      class="s2">They</span> <span class="s2">will,</span> <span
      class="s2">however,</span> <span class="s2">survive a</span> <span
      class="s2">week </span>in even the worst of conditions. Rejuvenate will
      otherwise last until another arcane defilement <span
      class="s10">spell</span> <span class="s10">destroys</span> <span
      class="s10">the</span> <span class="s10">vegetation</span> <span
      class="s10">in</span> <span class="s10">the</span> <span
      class="s10">area.</span></p>

      <p class="p9">Wizards who are Defilers cannot cast this<span class="s1">
      spell.</span></p>

      <p class="p10"><span class="s16"><b>At</b></span> <span
      class="s16"><b>Higher</b></span> <span class="s16"><b>Levels.</b></span>
      <span class="s2">When</span> <span class="s2">you</span> <span
      class="s2">cast</span> <span class="s2">this</span> <span
      class="s2">spell</span> <span class="s2">using </span><span
      class="s1">a</span> <span class="s1">spell</span> <span
      class="s1">slot</span> <span class="s1">of</span> <span
      class="s1">6th</span> <span class="s1">level</span> <span
      class="s1">or</span> <span class="s1">higher,</span> <span
      class="s1">the</span> <span class="s1">area</span> <span class="s1">of
      </span><span class="s2">effect</span> <span class="s2">is</span> <span
      class="s2">increased</span> <span class="s2">by</span> <span class="s2">50
      feet</span> <span class="s2">per spell slot</span> <span class="s2">level
      above 5th.</span></p>

      </div>
