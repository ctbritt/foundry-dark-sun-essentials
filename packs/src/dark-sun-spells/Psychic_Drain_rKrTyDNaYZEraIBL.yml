name: Psychic Drain
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You draw on the psychic energy of another creature to sustain yourself.
      The target must make a Charisma saving throw. On failure, it takes
      [[/damage 3d8 type=psychic average=true]]  psychic damage, and you gain
      temporary hit points equal to half the amount of psychic damage dealt and
      regain one expended psi point.</p><p><strong>At Higher Levels:</strong>
      When you cast this spell using a spell slot of 3rd level or higher, the
      spell deals an additional 1d8 psychic damage.</p>
