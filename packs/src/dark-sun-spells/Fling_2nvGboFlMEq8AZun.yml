name: Fling
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You manipulate gravity around one large or smaller creature. The target
      creature makes a [[/save str dc=@spelldc format=long]] saving throw. On
      failure, you can fling them 40 feet straight up or 20 feet in any
      direction. </p><p>If you fling them straight up, they immediately fall,
      taking [[/damage 4d6 type=bludgeoning average=true]] damage and fall
      &amp;Reference[prone]. If you fling them in any other direction, they take
      2d6 damage and fall prone. If their movement would be stopped early by a
      creature or object, both the target and creature or object take 3d6
      bludgeoning damage.</p>
