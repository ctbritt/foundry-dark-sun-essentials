  description:
    value: "<div class=\"rd__b  rd__b--3\"><p>You call forth the spirit of a psionic entity. It manifests in an unoccupied space that you can see within range and uses the @creature[Psionic Spirit|XUA2025Psion] stat block. When you cast the spell, choose Crystal Entity, Ectoplasmic Entity, or Ghostly Entity. The creature resembles an astral entity of that kind, which determines certain details in its stat block. The creature disappears when it drops to 0 @variantrule[Hit Points|XPHB] or when the spell ends.</p><p>The creature is an ally to you and your allies. In combat, the creature shares your @variantrule[Initiative|XPHB] count, but it takes its turn immediately after yours. It obeys your verbal commands (no action required by you). If you don't issue any, it takes the @action[Dodge|XPHB] action and uses its movement to avoid danger.</p><table class=\"rd__b-special rd__b-data  rd__b-data--stats\">\n\t\t<thead>\n\t\t\t<tr>\n\t\t\t\t<th class=\"rd__data-embed-header ve-text-left\" colspan=\"6\" data-rd-data-embed-header=\"true\">\n\t\t\t\t\t<div class=\"w-100 split-v-center\">\n\t\t\t\t\t\t<div class=\"ve-flex-v-center w-100 min-w-0\">\n\t\t\t\t\t\t\t<span class=\"rd__data-embed-name \">Psionic Spirit</span>\n\t\t\t\t\t\t\t<span class=\"rd__data-embed-name-expanded ve-text-right pr-2 w-100 ve-hidden\"></span>\n\t\t\t\t\t\t</div>\n\t\t\t\t\t\t<span class=\"rd__data-embed-toggle\">[+]</span>\n\t\t\t\t\t</div>\n\t\t\t\t</th>\n\t\t\t</tr>\n\t\t</thead><tbody class=\"ve-hidden\" data-rd-embedded-data-render-target=\"true\"><tr>\n\t\t\t<td colspan=\"6\" data-rd-tag=\"creature\" data-rd-uid=\"Psionic Spirit|XUA2025Psion\" data-rd-page=\"bestiary.html\" data-rd-source=\"XUA2025Psion\" data-rd-hash=\"psionic%20spirit_xua2025psion\" data-rd-name=\"Psionic Spirit\" data-rd-display-name=\"Psionic Spirit\" data-rd-style data-rd-entry-data=\"{}\">\n\t\t\t\t<i>Loading @creature[Psionic Spirit|XUA2025Psion]...</i>\n\t\t\t\t\n\t\t\t</td>\n\t\t</tr></tbody></table></div><div class=\"rd__b  rd__b--3\"><p></p><div data-roll-name-ancestor=\"Using a Higher-Level Spell Slot\" class=\"rd__b  rd__b--3\"><p><span class=\"rd__h rd__h--3\" data-title-index=\"1\"> <span class=\"entry-title-inner\">Using a Higher-Level Spell Slot.</span></span> Use the spell slot's level for the spell's level in the stat block.</p></div></div>"
