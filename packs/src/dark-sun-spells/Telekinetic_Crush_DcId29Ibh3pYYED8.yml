    value: >-
      <div class="rd__b  rd__b--3"><p>You create a field of crushing telekinetic
      force in a 30-foot @variantrule[Cube [Area of Effect]|XPHB|Cube] within
      range. Each creature in the area makes a Strength saving throw. On a
      failed save, a target takes [[/damage 5d6 type=force]] damage and has the
      &amp;Reference[condition=Prone] condition. On a successful save, a target
      takes half as much damage only.</p></div><div class="rd__b 
      rd__b--3"><p></p><div data-roll-name-ancestor="Using a Higher-Level Spell
      Slot" class="rd__b  rd__b--3"><p><span class="rd__h rd__h--3"
      data-title-index="1"> <span class="entry-title-inner">Using a Higher-Level
      Spell Slot.</span></span> The damage increases by [[/r 1d6]] for each
      spell slot level above 3.</p></div></div>
