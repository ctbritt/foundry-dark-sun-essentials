  description:
    value: >-
      <div class="rd__b  rd__b--3"><p>You psychically lash out at one creature
      you can see within range. The target must make an Intelligence saving
      throw. On a failed save, the target takes [[/damage 3d6 type=psychic]]
      damage, and it can't make @action[Opportunity Attack|XPHB|Opportunity
      Attacks] until the end of its next turn. Moreover, on its next turn, it
      can take either an action or a @variantrule[Bonus Action|XPHB], not both.
      On a successful save, the target takes half as much damage
      only.</p></div><div class="rd__b  rd__b--3"><p></p><div
      data-roll-name-ancestor="Using a Higher-Level Spell Slot" class="rd__b 
      rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Using a Higher-Level Spell Slot.</span></span>
      You can target one additional creature for each spell slot level above
      2.</p></div></div>
