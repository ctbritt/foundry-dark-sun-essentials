name: Cold Snap
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>A swirling burst of freezing wind erupts at a point you choose within
      range. Each creature in a 5-foot-radius sphere centered on that point must
      make a [[/save con dc=@abilities.spelldc format=long]]. On a failed save,
      a creature takes [[/damage 3d8 type=cold average=true]] damage and becomes
      stuck in the ice, reducing their movement speed on their next turn by 10
      feet. On a success, the target takes half as much damage and is not stuck
      in ice.</p><p>The ground in the area is covered with slick ice and snow,
      making it &amp;Reference[difficult terrain] until the start of your next
      turn.</p><p><em><strong>At Higher Levels:</strong></em> When you cast this
      spell using a spell slot of 3rd level or higher, the damage increases by
      1d8 for each slot level above 2nd.<br /></p>
