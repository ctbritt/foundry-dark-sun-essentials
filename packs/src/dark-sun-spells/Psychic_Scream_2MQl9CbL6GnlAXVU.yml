  description:
    value: >-
      <div class="rd__b  rd__b--3"><p>You unleash the power of your mind to
      blast the intellect of up to ten creatures of your choice that you can see
      within range. Creatures that have an Intelligence score of 2 or lower are
      unaffected.</p><p>Each target must make an Intelligence saving throw. On a
      failed save, a target takes [[/damage 14d6 type=psychic]] damage and has
      the &amp;Reference[condition=Stunned] condition. On a successful save, a
      target takes half as much damage only. If the target is reduced to 0
      @variantrule[Hit Points|XPHB] by this damage, its head explodes, assuming
      it has one.</p><p>At the end of each of its turns, the
      &amp;Reference[condition=Stunned] target repeats the save, ending the
      condition on itself on a success.</p></div>
