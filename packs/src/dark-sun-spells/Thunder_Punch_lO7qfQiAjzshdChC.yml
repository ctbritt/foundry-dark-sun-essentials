name: Thunder Punch
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You charge your hand (or similar appendage) with thunder power. Make a
      melee spell attack against the target. On a hit, there is a thunderous
      crash audible from up to 300 feet of you and the target takes 3d8 thunder
      damage, and is knocked 10 feet away from you.</p><p><em><strong>At Higher
      Levels.</strong></em> When you cast this spell using a spell slot of 2nd
      level or higher, the damage increases by 1d8 for each slot level above
      1st.<br /></p>
