  description:
    value: >-
      <div class="ddb">

      <p class="p1"><span class="s16">This</span> <span class="s16">spell</span>
      <span class="s16">cloaks</span> <span class="s16">the</span> <span
      class="s16">target</span> <span class="s16">in</span> <span
      class="s16">magical</span> <span class="s16">shade, </span>which provides
      protection against the scorching <span class="s3">sun.</span> <span
      class="s3">Once</span> <span class="s3">cast,</span> <span
      class="s3">the</span> <span class="s3">target</span> <span
      class="s3">gains</span> <span class="s3">advantage</span> <span
      class="s3">on </span>saving throws made to resist exhaustion caused by
      extreme heat.</p>

      <p class="p5"><span class="s16">Their</span> <span
      class="s16">water</span> <span class="s16">requirements</span> <span
      class="s16">are</span> <span class="s16">also</span> <span
      class="s16">halved</span> <span class="s16">for </span><span
      class="s12">the</span> <span class="s12">duration.</span> <span
      class="s12">The</span> <span class="s12">individual</span> <span
      class="s12">so</span> <span class="s12">protected </span><span
      class="s17">appears</span> <span class="s17">normal</span> <span
      class="s17">except</span> <span class="s17">that</span> <span
      class="s17">he</span> <span class="s17">doesn't</span> <span
      class="s17">sweat</span> <span class="s17">as </span><span
      class="s16">much</span> <span class="s16">as expected and his
      coloration</span> <span class="s16">is a bit </span><span
      class="s3">gray.</span></p>

      <p class="p6"><span class="s1"><b>At</b></span> <span
      class="s1"><b>Higher</b></span> <span class="s1"><b>Levels:</b></span>
      <span class="s12">When</span> <span class="s12">you</span> <span
      class="s12">cast</span> <span class="s12">this</span> <span
      class="s12">spell</span> <span class="s12">using </span><span
      class="s17">a</span> <span class="s17">spell</span> <span
      class="s17">slot</span> <span class="s17">of</span> <span
      class="s17">2nd</span> <span class="s17">level</span> <span
      class="s17">or</span> <span class="s17">higher,</span> <span
      class="s17">you</span> <span class="s17">can</span> <span
      class="s17">target </span><span class="s12">one additional target for each
      spell slot level above 1st.</span></p>

      </div>
