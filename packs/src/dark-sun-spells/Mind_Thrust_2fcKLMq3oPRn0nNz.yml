      to target one creature you can see within range, making your eyes flare
      noticeably for an instant. The target must succeed on a Charisma saving
      throw or take 1d10 points of psychic damage. This cantrip's damage
      increases by 1d10 when you reach 5th level 2d10, 11th level 3d10, and 17th
      level 4d10.</p></div>
