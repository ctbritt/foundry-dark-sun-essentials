  description:
    value: >-
      <div class="ddb"><p>This spell is only available to those. with access to
      the sorcerer spell list. Beholders, Slaadi and Star Spawns don’t exist on
      Athas, thus the aberration you summon is a physical manifestation of a
      being you imagine in your mind. Its appearance can be anything within
      reason.</p><p>The creature is an ally to you and your companions. In
      combat, the creature shares your initiative count, but it takes its turn
      immediately after yours. It obeys your verbal commands (no action required
      by you). If you don’t issue any, it takes the Dodge action and uses its
      move to avoid danger.</p><p><em><strong>At Higher Levels.</strong></em>
      When you cast this spell using a spell slot of 5th level or higher, use
      the higher level wherever the spell’s level appears in the stat
      block.</p><div class="Basic-Text-Frame stat-block-finder"><p
      class="Stat-Block-Styles_Stat-Block-Title">@Embed[Compendium.shareddata.ddb-summons.2blmjas3VLj5KGRP
      statblock]{Aberrant Spirit (Slaad)}</p></div></div>
