  description:
    value: >-
      <div class="ddb"><p>You touch a nonmagical weapon. Until the spell ends,
      that weapon becomes a magic weapon with a +1 bonus to attack rolls and
      damage rolls. This spell also makes non-metal weapons count as
      metal</p><p><em><strong>At Higher Levels.</strong></em> When you cast this
      spell using a spell slot of 4th level or higher, the bonus increases to
      +2. When you use a spell slot of 6th level or higher, the bonus increases
      to +3.</p></div>
