name: Spatial Manipulation
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You can swap the position of two creatures you can see within range. An
      unwilling creature can make a Charisma saving throw, preventing the swap
      on success.</p><p><strong>At Higher Levels:</strong> When you cast this
      spell using a spell slot of 6th level or higher, you can swap an
      additional set of creatures for each level above 5th.</p>
