name: Vortex Blast
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You create a sudden violent vortex that blasts outwards in a cone,
      tossing characters and objects within the area. Creatures take 2d6
      bludgeoning damage and must succeed a Strength saving throw or be knocked
      20 feet backward and 40 feet upward.</p><p><strong>At Higher
      Levels:</strong> When you cast this spell using a spell slot of 4th level
      or higher, the damage increases by 1d6 for each slot level above 3rd.</p>
