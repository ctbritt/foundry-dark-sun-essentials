name: Flash Freeze
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>A freezing wind ripples outward. Each creature in a 30-foot cone must
      make a [[/save con dc=@abilities.spelldc format=long]]. On a fail save, a
      creature takes [[/damage 4d8 type=cold average=true]] damage and is
      &amp;Reference[restrained] by ice until the start of your next turn. On a
      successful save, the target takes half as much damage and isn't
      restrained.</p><p><strong>At Higher Levels:</strong> When you cast this
      spell using a spell slot of 4th level or higher, the damage increases by
      1d8 for each slot level above 3rd.<br /></p>
