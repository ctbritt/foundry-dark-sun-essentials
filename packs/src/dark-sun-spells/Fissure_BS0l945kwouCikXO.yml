name: Fissure
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You rend asunder the earth in a 60-foot-long 5-foot-wide line,
      targeting an area of dirt, sand, or rock at least 10 feet
      deep.</p><p>Creatures in that line must make a Dexterity save. On a
      failure, a creature falls into a suddenly opened crevice in the ground,
      falling into it before it snaps shut, crushing them. From the fall and
      crush, creatures that fail the saving throw take 6d10 bludgeoning damage.
      The creature is buried in 10 feet of rubble, and creatures without a
      burrowing speed require 30 feet of movement to extract themselves from the
      loose rubble to return to where they failed the saving throw. If they end
      their turn while buried, they take an additional 1d10 bludgeoning
      damage.<br /></p>
