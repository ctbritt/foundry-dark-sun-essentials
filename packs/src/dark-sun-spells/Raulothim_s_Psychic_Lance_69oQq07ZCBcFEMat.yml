    rules: '2024'
    revision: 1
  description:
    value: >-
      <div class="rd__b  rd__b--3"><p>You unleash a shimmering lance of psychic
      power from your forehead at a creature that you can see within range.
      Alternatively, you can utter a creature's name (a pseudonym, title, or
      nickname doesn't work). If the named target is within range, it becomes
      the spell's target even if you can't see it. If the named target isn't
      within range or you use an invalid name, the lance dissipates without
      effect.</p><p>The target must make an Intelligence saving throw. On a
      failed save, the target takes [[/damage 7d6 type=psychic]] damage and has
      the &amp;Reference[condition=Incapacitated] condition until the start of
      your next turn. On a successful save, the target takes half as much damage
      only.</p></div><div class="rd__b  rd__b--3"><p></p><div
      data-roll-name-ancestor="Using a Higher-Level Spell Slot" class="rd__b 
      rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Using a Higher-Level Spell Slot.</span></span>
      The damage increases by [[/r 1d6]] for each spell slot level above
      4.</p></div></div>
