  description:
    value: >-
      <div class="rd__b  rd__b--3"><p>You instill a vision of terrifying
      hallucinations into the mind of a target you can see. The target must make
      a Wisdom saving throw. On failure, it takes [[/damage 3d6 type=psychic]]
      damage and must immediately use its reaction to move to move it's movement
      speed directly away from you. This movement does not force the creature to
      move into any hazard or take movements that cause it to take damage (such
      as jumping off a cliff or moving into a spell effect). On a successful
      save, the target takes half as much damage and isn't forced to
      move.</p></div><div class="rd__b  rd__b--3"><p></p><div
      data-roll-name-ancestor="At Higher Levels" class="rd__b 
      rd__b--3"><p><span class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">At Higher Levels.</span></span> When you cast
      this spell using a spell slot of 2nd level or higher, the damage increases
      by [[/r 1d6]] for each slot level above 1st.</p></div></div>
