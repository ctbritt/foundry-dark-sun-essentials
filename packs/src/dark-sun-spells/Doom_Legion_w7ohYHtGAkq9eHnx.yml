  description:
    value: "<div class=\"ddb\">\n<p class=\"p1\">This spell creates skeletons or zombies from the <span class=\"s12\">remains</span> <span class=\"s12\">of</span> <span class=\"s12\">an</span> <span class=\"s12\">army</span> <span class=\"s12\">defeated</span> <span class=\"s12\">in</span> <span class=\"s12\">battle.</span> <span class=\"s12\">The</span> <span class=\"s12\">spell </span>must be cast on the site of the conflict, where <span class=\"s12\">the fallen bodies still lie. When cast, only the </span><span class=\"s1\">bodies</span> <span class=\"s1\">or</span> <span class=\"s1\">skeletons</span> <span class=\"s1\">of</span> <span class=\"s1\">the</span> <span class=\"s1\">losing</span> <span class=\"s1\">side</span> <span class=\"s1\">will</span> <span class=\"s1\">be animated.</span></p>\n<p class=\"p6\"><span class=\"s1\">If</span> <span class=\"s1\">the</span> <span class=\"s1\">battle</span> <span class=\"s1\">took</span> <span class=\"s1\">place</span> <span class=\"s1\">less</span> <span class=\"s1\">than</span> <span class=\"s1\">three</span> <span class=\"s1\">months </span><span class=\"s12\">before the casting of the spell, the undead</span> <span class=\"s12\">will be</span> <span class=\"s12\">zombies.</span> <span class=\"s12\">Any</span> <span class=\"s12\">longer</span> <span class=\"s12\">period</span> <span class=\"s12\">of</span> <span class=\"s12\">time</span> <span class=\"s12\">will</span> <span class=\"s12\">yield </span><span class=\"s1\">skeletons</span><span class=\"s14\"> — </span><span class=\"s1\">even</span> <span class=\"s1\">if</span> <span class=\"s1\">the</span> <span class=\"s1\">bones</span> <span class=\"s1\">have</span> <span class=\"s1\">turned</span> <span class=\"s1\">to </span><span class=\"s15\">dust,</span> <span class=\"s15\">they</span> <span class=\"s15\">will</span> <span class=\"s15\">reassemble</span> <span class=\"s15\">when</span> <span class=\"s15\">this</span> <span class=\"s15\">spell</span> <span class=