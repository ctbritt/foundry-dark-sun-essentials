  - name: Aquatic Body
    img: modules/5e-spellblock-importer/img/spell.png
    origin: Item.r9hyyMO5rVpobKp4
    transfer: false
    _id: MXPtPIBzzVqoGmFs
    type: base
    system:
      changes:
        - key: system.attributes.movement.swim
          value: '@attributes.movement.walk'
          priority: 20
          type: upgrade
    disabled: false
    duration:
      value: null
      units: seconds
      expiry: null
      expired: false
    description: >-
      <p>You manipulate the nature of your body with magic, temporarily giving
      it new properties. You can select three of the following
      properties:</p><ul><li><p>Your body becomes malleable and amorphous. You
      have advantage on saves and checks against grapples and the restrained
      condition, you do not suffer disadvantage from squeezing into smaller
      spaces, and you can squeeze through openings two sizes smaller than
      you.</p></li><li><p class="p1">You grow one additional appendage. This
      appendage serves as an arm and a hand, though it can take the shape of an
      arm, tentacle, or similar appendage. You extend the length of your limbs,
      giving you a 10 foot reach on melee attacks, touch spells, and object
      interactions.</p></li><li><p class="p1">Your flesh hardens, your base AC
      becomes 14 + your dexterity modifier if it is not already
      higher.</p></li><li><p class="p1">You grow more resilient, adapting
      against one external threat. You gain advantage on one type of saving
      throw of your choice.</p></li><li><p class="p1">You adapt your body to an
      aquatic environment, sprouting gills and growing webbing between your
      fingers. You can breathe underwater and gain a swimming speed equal to
      your walking speed.</p></li><li><p class="p1">Your body grows ablative
      armor. You gain temporary hit points equal to your spellcasting modifier
      at the start of each of your turns.</p></li><li><p class="p1">You can grow
      one size larger or smaller.</p></li><li><p class="p1">You sprout wings.
      You gain a flying speed of 30 feet.</p></li><li><p class="p1">You grow a
      natural weapon; this weapon can have the statistics of any martial melee
      weapon and takes on a form vaguely reminiscent of it without the thrown
      property. You have proficiency with this weapon, and are considered
      holding it. You can use your spellcasting modifier in place of your
      Strength modifier for attack and damage rolls with this natural weapon.
      The natural weapon is magic and you have a +1 bonus to the attack and
      damage rolls you make using it.</p></li></ul><p class="p1">For the
      duration of the spell, you can use an action to change one or all of the
      properties.</p><p><strong>At Higher Levels:</strong> When you cast this
      spell using a spell slot of 4th level or higher, you can select one
      additional property for each slot level above 3rd.</p>
