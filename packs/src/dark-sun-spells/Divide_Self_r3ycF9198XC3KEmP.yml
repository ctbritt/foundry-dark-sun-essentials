name: Divide Self
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You you create an exact duplicate of yourself in an empty space you can
      see within 30 feet of you.</p><p>When you cast this spell at the start of
      each of your turns for the duration, you can determine which of the
      duplicates is you. It has all of your stats, abilities, and equipment
      (including magic items). It acts on your initiative, and has its own
      actions, though it shares its concentration on this spell, and if either
      of you lose concentration, the spell ends.</p><p>Your current hit points
      are divided between you and the duplicate (you can divide them however you
      want) and shares all other resources and abilities with you (including
      limited use magic items), with any usage by either you or the duplicate
      depleting the resource for both of you. Your duplicate can take any action
      you can take, but it can deal a maximum of 15 damage on its turn (any
      additional damage dealt deals no further damage, when dealing area of
      effect damage, damage is split between all targets equally up to the
      maximum).</p><p>If either you or the duplicate is reduced to zero, the
      spell ends and you become the copy that was not reduced to zero hit
      points. When the spell ends, if both you and the duplicate are still
      present, decide which is you, and the other vanishes. Anything that was
      copied during the spell has the copied version
      vanish.</p><p><em><strong>At Higher Levels:</strong></em> When you cast
      this spell using a spell slot of 6th level or higher, the starting hit
      points of you and the duplicate both increase by 15 (but neither you or
      the duplicate can be given more maximum hit points) and the maximum damage
      the duplicate can do during its turn increases by 10 for each slot level
      above 5th.</p><aside class="notable"><p></p><h3>Split, not
      Copied.</h3><p>When you switch which of the copies you are, no status
      effects or resources are exchanged - you become the duplicate and the old
      you becomes the duplicate for the purposes of the
      spell.)</p><p></p></aside>
