name: Revenge Of The Land
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>The life energy of the earth is channeled in translucent arcs of energy
      that radiate from the seed in the ground at your feet and unerringly seek
      out defilers before returning to the ground. This spell only affects a
      creature with at least one point in defiler aura.<br />A defiler that
      starts its turn within or moves into the spell's radius must make a
      Constitution save. On a failed save, the defiler takes [[/damage 4d8
      type=force average=true]]  force damage. Defilers have a penalty to the
      saving throw equal to their defiler aura points.<br /></p>
