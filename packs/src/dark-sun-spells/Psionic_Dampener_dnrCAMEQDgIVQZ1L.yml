  description:
    value: >-
      <div class="ddb">

      <p class="p1"><span class="s17">This</span> <span class="s17">spell</span>
      <span class="s17">allows</span> <span class="s17">a</span> <span
      class="s17">caster</span> <span class="s17">to</span> <span
      class="s17">nullify</span> <span class="s17">the</span> <span
      class="s17">psionic </span>abilities of one creature it can see within
      range. <span class="s17">The</span> <span class="s17">target</span> <span
      class="s17">must</span> <span class="s17">succeed</span> <span
      class="s17">on</span> <span class="s17">an</span> <span
      class="s17">Intelligence </span>saving throw or be unable to use any of
      the following abilities for the duration of the spell:</p>

      <ul class="ul1">

      <li class="li4"><span class="s17">Psionic</span> <span
      class="s14">talents</span></li>

      <li class="li4"><span class="s14">Psionic</span> <span
      class="s14">disciplines</span></li>

      <li class="li4"><span class="s17">Spellcasting</span> <span
      class="s17">ability</span> <span class="s17">with</span> <span
      class="s17">the</span> <span class="s17">psionics</span> <span
      class="s17">tag</span></li>

      <li class="li4"><span class="s17">Innate</span> <span
      class="s17">Spellcasting</span> <span class="s17">ability</span> <span
      class="s17">with</span> <span class="s17">the</span> <span
      class="s14">psionics</span></li>

      <li class="li4">Any <span class="s17">other</span> <span
      class="s17">abilities</span> <span class="s17">that</span> <span
      class="s17">the DM</span> <span class="s17">rules</span> <span
      class="s17">are psionic</span> <span class="s17">in</span> <span
      class="s17">nature</span></li>

      </ul>

      <p class="p7"><span class="s3">At</span> <span class="s3">the</span> <span
      class="s3">end</span> <span class="s3">of</span> <span
      class="s3">each</span> <span class="s3">of</span> <span
      class="s3">its</span> <span class="s3">turns,</span> <span
      class="s3">the</span> <span class="s3">target</span> <span class="s3">can
      </span>make another Intelligence saving throw. On a success, the spell
      ends on the target.</p>

      </div>
