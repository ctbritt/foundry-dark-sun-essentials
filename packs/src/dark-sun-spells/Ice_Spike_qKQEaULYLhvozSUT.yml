name: Ice Spike
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You create a lance of ice that shoot up from the ground to impale a
      creature within range. The target must make a Dexterity<span class="s1">
      </span>saving<span class="s1"> </span>throw.<span class="s1">
      </span>The<span class="s1"> </span>target<span class="s1">
      </span>takes<span class="s1"> [[/damage 4d8 type=piercing average=true]]
      </span>damage and [[/damage 4d8 type=cold average=true]] damage on a
      failed save. The target takes only the 4d8 cold damage on a successful
      save.</p><p><em><strong>At Higher Levels.</strong></em> When you cast this
      spell using a spell slot of 6th or 7th level, you can create a second
      spike. When you cast this spell using a spell slot of 8th or 9th level,
      you can create a third spike. Additional spikes can target the same or
      different creatures.<br /></p>
