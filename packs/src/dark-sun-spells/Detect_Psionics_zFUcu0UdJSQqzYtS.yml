  description:
    value: "<div class=\"ddb\">\n<p class=\"p1\">For the duration, you sense the presence of psionics within 30 feet of you. If you<span class=\"s11\"> sense\_</span><span class=\"s3\">psionics</span> <span class=\"s3\">in</span> <span class=\"s3\">this</span> <span class=\"s3\">way,</span> <span class=\"s3\">you</span> <span class=\"s3\">can</span> <span class=\"s3\">use</span> <span class=\"s3\">your</span> <span class=\"s3\">action</span> <span class=\"s3\">to </span><span class=\"s11\">see</span> <span class=\"s11\">a</span> <span class=\"s11\">faint</span> <span class=\"s11\">aura</span> <span class=\"s11\">around</span> <span class=\"s11\">any</span> <span class=\"s11\">visible</span> <span class=\"s11\">creature</span> <span class=\"s11\">or </span><span class=\"s1\">object</span> <span class=\"s1\">in</span> <span class=\"s1\">the</span> <span class=\"s1\">area</span> <span class=\"s1\">that</span> <span class=\"s1\">bears</span> <span class=\"s1\">a</span> <span class=\"s1\">psionic</span> <span class=\"s1\">effect, </span>and you learn what discipline the effect belongs to, if any.</p>\n<p class=\"p5\"><span class=\"s2\">This</span> <span class=\"s2\">spell</span> <span class=\"s2\">can</span> <span class=\"s2\">penetrate</span> <span class=\"s2\">most</span> <span class=\"s2\">barriers,</span> <span class=\"s2\">but</span> <span class=\"s2\">it</span> <span class=\"s2\">is blocked</span> <span class=\"s2\">by</span> <span class=\"s2\">1</span> <span class=\"s2\">foot</span> <span class=\"s2\">of</span> <span class=\"s2\">stone,</span> <span class=\"s2\">1</span> <span class=\"s2\">inch</span> <span class=\"s2\">of</span> <span class=\"s2\">common metal,</span> <span class=\"s2\">a thin sheet</span> <span class=\"s2\">of</span> <span class=\"s2\">lead, or</span> <span class=\"s2\">3</span> <span class=\"s2\">feet</span> <span class=\"s2\">of wood</span> <span class=\"s2\">or </span><span class=\"s1\">dirt.</span></p>\n</div>"
