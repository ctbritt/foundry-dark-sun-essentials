name: Glimpse The Future
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You give a creature within range a glimpse of their future. Roll a d4
      for to determine
      outcome.</p><table><thead><tr><th>Result</th><th>Effect</th></tr></thead><tbody><tr><td>1</td><td>The
      target foresees an action to come. Roll a d20 and record the value. Until
      the duration of the spell ends, they can replace one of their attack
      rolls, ability checks, or saving throws with the
      value.</td></tr><tr><td>2</td><td>The target sees their own death. If they
      are reduced to zero hit points as the result of being hit by an attack,
      they can force that attack reroll and subtract a d8, potentially missing.
      If they are reduced to zero hit points as result of failing a saving
      throw, they can reroll the save adding a d8, potentially
      passing.</td></tr><tr><td>3</td><td>They see a future victory, growing
      confident. They gain 10 temporary hit points and are immune to the
      frightened condition for the duration of the
      spell.</td></tr><tr><td>4</td><td>The target sees an ambush or surprise,
      the first time they would be surprised they are not or the first time an
      attack would made against them with advantage, it is instead made with
      disadvantage.</td></tr></tbody></table><p>Once any of the events foreseen
      occur, the spell ends. A target can only be under one of the effects a
      time.</p><p><em><strong>At Higher Levels:</strong></em> When cast using 3
      or more psi points, you can select the effect instead of rolling a
      d4.</p><aside class="notable"><h3>The Unavoidable Death</h3><p>In the case
      of number 2, passing the save would not always be enough to make them not
      be reduced to zero hit points. Sometimes they are reduced to zero by
      something like falling damage that has no save or attack. Sometimes life's
      a bummer that way.</p></aside>
