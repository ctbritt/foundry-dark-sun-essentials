name: Rejuvenate
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>This spell grants the ability to support vegetation to an area of
      ground. In the case of ground made barren by defiler magic, rejuvenate
      dispels the ground’s sterility, making it immediately capable of
      supporting vegetation. The spell may also be cast on any ground short of
      solid rock, including sand, rocky sand or soil, and dust.</p><p>The spell
      affects the ground in a 50 foot radius from the caster. Once cast, the
      soil is enriched and moistened, and a blanket of fine grass emerges
      instantly. Once cast, the moist soil and grass are not magical, and are
      subject to all natural forces upon them. They will, however, survive a
      week in even the worst of conditions. Rejuvenate otherwise lasts until a
      spellcaster uses defiling to destroy the vegetation.</p><p>This spell
      automatically fails if cast by any creature with at least 1 point in a
      defiler aura.<br /></p>
    chat: ''
  materials:
    value: >-
      A seed (of any type) and a drop of water, both of which the spell
      consumes.
