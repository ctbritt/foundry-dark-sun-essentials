  dae:
    macro:
      name: Create Food and Water (Dark Sun)
      img: icons/magic/water/water-hand.webp
      type: script
      scope: global
      command: |-
        // Create Food and Water — Dark Sun
        // MidiQOL Item Macro | After Active Effects
        if (workflow.macroPass !== "postActiveEffects") return;

        const pack = game.packs.get("dnd-players-handbook.equipment");
        const caster = workflow.actor;
        const PINTS_PER_SKIN = 4;
        const TOTAL_PINTS = 16; // 2 gallons

        // Target selection — caster or party
        let target = caster;
        const party = game.settings.get("dnd5e", "primaryParty")?.actor;
        if (party) {
          const buttons = [
            [caster.name, "self", { image: caster.img }],
            [party.name + " (Party)", "party", { image: party.img }]
          ];
          const choice = await chrisPremades.utils.dialogUtils.buttonDialog(
            "Create Food and Water", "Add provisions to:", buttons
          );
          if (choice === false) return;
          if (choice === "party") target = party;
        }

        // ── 3 Rations ──────────────────────────────────
        let [rations] = await pack.getDocuments({ name: "Rations" });
        let rationData = game.items.fromCompendium(rations);
        let existingRations = target.items.getName("Rations");
        if (existingRations) {
          await existingRations.update({ "system.quantity": existingRations.system.quantity + 3 });
        } else {
          rationData.system.quantity = 3;
          await Item.implementation.create(rationData, { parent: target });
        }

        // ── Water (16 pints) ───────────────────────────
        let [waterTemplate] = await pack.getDocuments({ name: "Water (Pint)" });
        let remaining = TOTAL_PINTS;

        // Fill waterskins on a given actor, return leftover pints
        async function fillWaterskins(actor, pints) {
          const skins = actor.items.filter(i => i.name === "Waterskin");
          for (const skin of skins) {
            if (pints <= 0) break;
            // Check how much water is already inside this waterskin
            const waterInside = actor.items.find(
              i => i.name === "Water (Pint)" && i.system.container === skin.id
            );
            const currentPints = waterInside?.system.quantity ?? 0;
            const capacity = PINTS_PER_SKIN - currentPints;
            if (capacity <= 0) continue;
            const toAdd = Math.min(capacity, pints);
            if (waterInside) {
              await waterInside.update({ "system.quantity": currentPints + toAdd });
            } else {
              let waterData = game.items.fromCompendium(waterTemplate);
              waterData.system.quantity = toAdd;
              waterData.system.container = skin.id;
              await Item.implementation.create(waterData, { parent: actor });
            }
            pints -= toAdd;
          }
          return pints;
        }

        // 1. Fill waterskins on the target actor
        remaining = await fillWaterskins(target, remaining);

        // 2. Overflow → fill waterskins on party actor
        if (remaining > 0 && party && target.id !== party.id) {
          remaining = await fillWaterskins(party, remaining);
        }

        // 3. Any leftover pints go loose on the party (or target if no party)
        if (remaining > 0) {
          const overflow = (party && target.id !== party.id) ? party : target;
          let existingLoose = overflow.items.find(
            i => i.name === "Water (Pint)" && !i.system.container
          );
          if (existingLoose) {
            await existingLoose.update({ "system.quantity": existingLoose.system.quantity + remaining });
          } else {
            let waterData = game.items.fromCompendium(waterTemplate);
            waterData.system.quantity = remaining;
            await Item.implementation.create(waterData, { parent: overflow });
          }
          ui.notifications.warn(
            `${remaining} pints of water couldn't fit in waterskins — added loose to ${overflow.name}`
          );
        }
