name: Aether Lance
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You gather raw aether in your hand and expel it in a lance of power
      forming a line 30 foot long and 5 foot wide. Each creature in a line
      takes  [[/damage 8d4 + @mod type=force average=true]] damage.<br
      /><em><strong>At Higher Levels.</strong></em> When you cast this spell
      using a spell slot of 4th level or higher, the damage increases by 1d4 for
      each slot level above 3rd.<br /></p>
