name: Backlash
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>Also known as the preserver’s scourge, this spell makes the ground
      dangerous to defilers. This spell only affects a creature with at least
      one point in defiler aura. Should a defiler try to tap into land that is
      protected by a backlash, she automatically takes [[/damage 1d6 type=force
      average=true]] damage. The defiler must make a [[/save Con
      dc=@abilitiess.speppdc format=long]] or the spell they were casting is
      lost. Defilers have penalty to the saving throw equal to their defiler
      aura points. Once it has inflicted damage, the spell is discharged and the
      ground returns to normal. Only one backlash can be cast on any given plot
      of ground.</p><p><em><strong>At Higher Levels.</strong></em> When you cast
      this spell using a spell slot of 2nd level or higher, the damage dealt
      increases by 1d6 for each spell slot above 1st.</p><p></p>
