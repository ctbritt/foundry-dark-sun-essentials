    rules: '2014'
    revision: 1
  description:
    value: >-
      <div class="rd__b  rd__b--3"><p></p><div data-roll-name-ancestor="Psi
      Cost" class="rd__b  rd__b--3"><p><span class="entry-title-inner">Psi
      Cost.</span> 3 psi points</p></div><div data-roll-name-ancestor="Psychic
      Components" class="rd__b  rd__b--3"><p><span
      class="entry-title-inner">Psychic </span>&amp;Reference[components]<span
      class="entry-title-inner">.</span> Observable</p></div><p>You form your
      thoughts into a briefly perceptible whip of telepathic energy, and strike
      the mind of one creature you can see within &amp;Reference[range],
      forcefully imposing a sudden and intense feeling of self-doubt in it. The
      target must make a [[/save wis format=long]]. On a failed save, the
      creature takes [[/damage 3d8 type=psychic format=long]], and it can only
      take the &amp;Reference[dodge], &amp;Reference[disengage], or
      &amp;Reference[hide] actions on its next turn. On a successful saving
      throw, the target takes half as much damage, and its choice of action is
      not limited by this power.</p></div><div class="rd__b 
      rd__b--3"><p></p><div data-roll-name-ancestor="Intensify" class="rd__b 
      rd__b--3"><p><span
      class="entry-title-inner"><strong>Intensify.</strong></span> When you
      spend extra psi points to manifest this augment, you may target 1
      additional creature you can see within range for every 2 additional psi
      points spent beyond the minimum cost.</p></div></div>
