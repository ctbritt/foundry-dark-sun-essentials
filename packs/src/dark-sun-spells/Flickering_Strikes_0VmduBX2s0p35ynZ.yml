name: Flickering Strikes
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>You flourish a weapon you are proficient with used in the casting and
      then vanish, instantly teleporting to and striking up to 5 targets within
      range. Make a weapon attack against each target. On hit, a target takes
      the weapon damage from the attack + 6d6 force damage. </p><p>You can then
      teleport to an unoccupied space you can see within 5 feet of one of the
      targets you hit or missed.</p>
