name: Lightning Tendril
type: spell
img: modules/5e-spellblock-importer/img/spell.png
system:
  description:
    value: >-
      <p>Crackling beams of blue energy leap from your hands. For the duration
      of the spell, as an action, you can direct them toward a creature within
      range, dealing 1d12 lightning damage to that creature.</p><p><strong>At
      Higher Levels.</strong> When you cast this spell using a 3rd- or 4th-level
      spell slot, the damage increases to 2d12 and the range increases to 30
      feet. When you cast it using a 5th- or 6th-level spell slot, the damage
      increases to 3d12 and the range increases to 60 feet. When you cast it
      using a spell slot of 7th level or higher, the damage increases to 4d12
      and the range increases to 120 feet.<br /></p>
