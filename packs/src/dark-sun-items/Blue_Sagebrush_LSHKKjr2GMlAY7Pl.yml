  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Salt Flats</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Dried and
      ground</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>This small bush is
      one of the few plants that grow along the Salt Flats. It is a 1 foot tall,
      light blue bush with a woody texture to it, and it has no leaves. Its root
      is about 6 feet long allowing the plant to be able to tap into an
      underground water source.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>Since it grows so close
      to the Salt Flats it tends to have a salty taste to it; so it is
      harvested, dried and ground, and used in preserving meat and adding flavor
      to any meal. When harvested it can grow back if at least a 1 inch stub is
      left above ground.</p><div class="rd__spc-inline-post"></div></div></div>
