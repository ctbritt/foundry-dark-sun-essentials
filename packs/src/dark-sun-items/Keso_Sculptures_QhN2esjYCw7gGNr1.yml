  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Nibenay</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Grown and shaped
      by psionicists</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="3">
      <span class="entry-title-inner">Description:</span></span> <p>Keso
      involves the growing of a shrub called Sede into creative shapes, such as
      waves or animal shapes. Some use telekinesis to forcibly grow the shrub
      (Kesoi), while others gently use persuasion (Kesoe).</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>Kesoi plants give off a
      pleasant lemon smell, while Kesoe sculptures give off an apple-type smell.
      Both are used to flavor water. Kesoe sculptures are popular among
      preservers as any life energy leeched off them enables a spell to last a
      little longer than normal (+1 level for spell duration). Conversely, if
      leeched by a defiler, it shortens the spell's duration (-1 level).</p><div
      class="rd__spc-inline-post"></div></div></div>
