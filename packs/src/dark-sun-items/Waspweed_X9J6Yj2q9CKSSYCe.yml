  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Rocky barrens, on
      boulders near canyon walls</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Roots used for
      healing, can be ingested</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>The
      <i>waspweed</i> is primarily found as a scrubby bush in the rocky barrens,
      where it lives on boulders close to canyon walls. It has developed a
      defense mechanism of camouflage, with a light yellow color and dark
      streaks of black running down plant stems and leaves.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>For the Kreen, the
      <i>waspweed</i> aids in the healing of chitin in a significant manner. The
      Kreen cut the roots of the <i>waspweed</i> and tie them onto wounds,
      healing one point of chitin per day (2 points with an experienced healer).
      When ingested, it can help fight chitin diseases or poisons, but also
      causes 3 points of damage to internal organs.</p><div
      class="rd__spc-inline-post"></div></div></div>
