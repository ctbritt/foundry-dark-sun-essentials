    value: >-
      <p>A recipe for crafting the Assassin Bug Poison, an injury poison that
      causes numbness and stiffness in the victim's limbs. This poison is
      derived from the venom glands of male assassin
      bugs.</p><p><strong>Crafting Steps:</strong></p><ol><li>Extract venom from
