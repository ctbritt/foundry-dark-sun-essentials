      class="entry-title-inner">Preparation.</span></span> <p>Berries used
      whole</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>Matchberry plants
      are small green shrubs with little yellow/orange berries that have a
      hardened waxy rind. The fruit has a tendency to be very flammable,
      possibly because of the fermented alcohol within it.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>When a fire-builder
      throws one of these little berries onto a fire, they catch alight almost
      instantaneously, and burn with explosive heat. In large numbers, they
      become volatile. If several are grouped together and begin to heat up,
      there is a small chance (5%) that combustion will occur. If it does, each
      berry does 1-2 points of damage in explosive heat.</p><div
      class="rd__spc-inline-post"></div></div></div>
