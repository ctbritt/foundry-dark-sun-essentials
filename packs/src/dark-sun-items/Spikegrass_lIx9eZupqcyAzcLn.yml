  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Near the Smoking
      Mountains in rocky badlands</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Used as-is in pit
      traps</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>As its name
      implies, this plant is spike-shaped. It is about 3 feet tall, with spikes
      that make it look like a clump of grass. It grows near the Smoking
      mountains in the rocky badlands.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>The only use that has
      ever been found for this plant is at the bottom of pits. It can survive
      long periods of time without moisture and can utilize any type of moisture
      that it is brought into contact with (i.e. at the bottom of pits where it
      can feed off of the blood of its victims). Any spikes that are broken off
      immediately regrow, so this plant requires little maintenance.</p><div
      class="rd__spc-inline-post"></div></div></div>
