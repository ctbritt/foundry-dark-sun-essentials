  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Mountain regions,
      especially Mekillot Mountains</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Berries distilled
      or prepared as purgative</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>A rare plant with
      a green-silver berry found in mountain regions, especially in the Mekillot
      Mountains. The leaves are reddish in color and the branches are orange.
      The plant lives close to salts, giving it a strong salty taste.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>It can be distilled
      into a strong (60-proof) liquor, and if the berries are properly prepared,
      it acts as a purgative, curing 2d6 points of internal damage (not burn,
      frost or acid).</p><div class="rd__spc-inline-post"></div></div></div>
