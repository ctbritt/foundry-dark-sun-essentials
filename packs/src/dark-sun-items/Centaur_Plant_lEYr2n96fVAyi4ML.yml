    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Northern hinterlands,
      north of the Jagged Cliffs</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Various, depending
      on the part used</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="3">
      <span class="entry-title-inner">Description:</span></span> <p>One of the
      more fabled Athasian plants. It is only found in the northern hinterlands,
      upon the ragged edges north of the Jagged Cliffs. A green leafed medium
      sized tree, its existence is usually the stuff of fables, because with it,
      one can live forever. It blooms once a century.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>Its thick pulpy leaves
      provide useable fibers, which the feral halflings use to make ropes as
      strong as giant hair. Its sap at leaf junctures is a valuable insect
      repellent, effective against the kreen. When it blooms the nectar within
      the gourd is an effective Elixir of Youth potion, but the tree only blooms
      once a century, with 2-8 true gourds produced.</p><div
      class="rd__spc-inline-post"></div></div></div>
