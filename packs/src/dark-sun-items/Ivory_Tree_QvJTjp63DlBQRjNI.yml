    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Ivory
      Triangle</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="2">
      <span class="entry-title-inner">Preparation.</span></span> <p>Leaves
      brewed into tea</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="3">
      <span class="entry-title-inner">Description:</span></span> <p>Found mainly
      in the Ivory Triangle, the <i>Ivory Tree</i> is an evergreen with the
      purest white bark. Artisans in Nibenay use the bark and tree limbs for
      intricate woodcarvings of the beasts, which live in the wastes.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>The leaves of the tree
      provide some healing qualities. A quart of tea made from the desert
      evergreen will restore one point of constitution (lost to dehydration) or
      one extra hit point daily if used by a healer.</p><div
      class="rd__spc-inline-post"></div></div></div>
