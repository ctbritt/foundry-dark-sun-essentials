  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Sandy desert</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Leaves woven into
      fabric</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>Across the sandy
      desert rolls the <i>boulderweed</i>, relentlessly driven by the winds. It
      is a small spindly bush with no roots, and it rolls like tumbleweed. When
      it hits water, tendrils quickly form to root the plant to the spot, and
      the plant draws up as much water as it can into its spongy
      interior.</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="4">
      <span class="entry-title-inner">Effect:</span></span> <p>The leaves absorb
      moisture from the air and only release a small amount over time. Some
      elves weave the leaves into armbands, sweatbands, or tunics. The fabric
      absorbs moisture from the air and sweat, which can be squeezed out for
      reuse. Characters using such items only need to drink 1/3 their normal
      water supply.</p><div class="rd__spc-inline-post"></div></div></div>
