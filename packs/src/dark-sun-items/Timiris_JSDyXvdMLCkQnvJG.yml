  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Various</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Thorns used for
      darts, plant used for protection</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>A hedge-like thorn
      plant which lures victims into its reach with a small 'tunnel' leading to
      the water pool at its center. Once halfway inside, hollow thorns reach
      down and puncture the victim, spilling blood and tearing flesh.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>Its strength is feeble,
      but its thorns are numerous. The thorns are rarely used by the folk of
      Gulg in the creation of tiny darts. However, only one in every hundred is
      suitable as such. Some desperate slave tribes will sometimes kill the
      plant to eat any earlier victims, but other tribes deliberately allow the
      plant to grow near their hideaways for extra protection.</p><div
      class="rd__spc-inline-post"></div></div></div>
