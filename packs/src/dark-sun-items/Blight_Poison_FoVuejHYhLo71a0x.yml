  description:
    value: >-
      <p>A recipe for crafting Blight Poison, an injury poison derived from
      undead pixies that causes paralysis by disrupting the central nervous
      system. This sinister concoction leaves its victims fully aware but unable
      to move.</p><p><strong>Crafting Steps:</strong></p><ol><li>Harvest essence
      from an undead pixie</li><li>Mix with powdered nightshade</li><li>Add a
      binding agent</li><li>Distill the mixture in an alembic</li><li>Store in a
      sealed vial</li></ol>
