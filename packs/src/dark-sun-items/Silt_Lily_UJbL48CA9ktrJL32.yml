  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Silt basins</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Distilled for
      perfume</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>A rare plant,
      similar to water lily, which anchors itself deep in silt. It releases
      water into the air from the deep silt, which sometimes is enough to allow
      other plants to survive. It is strong smelling and tastes awful, so silt
      herbivores tend to eat the other plants first.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>It provides beautiful
      perfume, but has never been successfully grown in controlled settings.
      Each different colony of <i>silt lilies</i> produces a different scent
      (similar to wine) and the traders often try to blend a normal scent from
      the different lilies. Eau de <i>Silt Lily</i> can be used to mask the
      taste of other substances.</p><div
      class="rd__spc-inline-post"></div></div></div>
