  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Southern region of
      the Crescent Forest around Gulg</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Flowers dried for
      incense, berries used for paint</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>It is a small bush
      that grows about 2 feet tall. It grows in the southern region of the
      crescent forest around Gulg. Once a year it bears one-inch, red,
      star-shaped flowers about one month before the Red Moon Hunt.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>The dried flowers are
      used to create incense pellets for the Red Moon Hunt preparation. The
      scent has a hallucinogenic effect, believed to help hunters become one
      with the forest. The flowers that are not picked go on to create a red
      berry that is used as body paint during the Red Moon Hunt.</p><div
      class="rd__spc-inline-post"></div></div></div>
