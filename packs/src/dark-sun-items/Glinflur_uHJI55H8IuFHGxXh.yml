  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Rocky badlands,
      canyons, small forests, scrublands</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Fruit hollowed and
      dried for water storage</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p><i>Glinflur</i> is
      a large spindly tree (up to 50 feet tall) found in the rocky badlands,
      canyons, small forests and scrublands. It's roots reach deep underground
      in a frantic search for water. It has a large red flower fully of
      honeysuckle which attract insects, and small mammals.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>Its main importance to
      the nomads of Athas is as a signal/source of water, and gourd used as
      storage vessels. The fruit contains a low-level toxin which causes nausea
      and vomiting. Nomads hollow the fruit out and use it as a water storage
      vessel. The toxin in the skin kills bugs in the water for about a year.
      <i>Glinflur</i> juice is often used as a sweetener in cooking for the
      affluent.</p><div class="rd__spc-inline-post"></div></div></div>
