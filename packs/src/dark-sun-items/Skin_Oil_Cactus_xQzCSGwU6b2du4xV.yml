      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Various desert
      regions</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Inner fluid
      extracted and applied directly</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>A tough,
      barrel-like cactus that produces a liquid with a creamy rubbery texture.
      This liquid can be obtained by tapping into the cactus.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>The inner fluid can be
      smeared onto a creature's skin. It protects the skin from excessive
      burning and dehydration, and lessens the amount of water needed by 1/4 of
      the normal daily needs. One dosage will actually last a given day,
      although strong winds may reduce the time substantially.</p><div
      class="rd__spc-inline-post"></div></div></div>
