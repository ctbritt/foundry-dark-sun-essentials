  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Stony barrens west of
      Tyr and Urik</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="2">
      <span class="entry-title-inner">Preparation.</span></span> <p>Crushed,
      fermented, and strained</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>This lichen is
      found in the stony barrens upon the weathered rocks to the west of Tyr and
      Urik. The lichen is gathered by the local Duar tribes and traded to the
      local merchant houses.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>The traders crush up
      the lichen into a paste, which is then added to water. The mixture is then
      fermented over six months and then strained. When the process is
      completed, the mix provides a potent alcohol, with a sharp taste, and a
      mellow glow. This drink, called Jicheni, is traded over the Tablelands and
      is particularly popular among Pterrans.</p><div
      class="rd__spc-inline-post"></div></div></div>
