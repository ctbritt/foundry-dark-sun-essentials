  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Various deserts in
      the tablelands</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="2">
      <span class="entry-title-inner">Preparation.</span></span> <p>Brewed into
      a concoction</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="3">
      <span class="entry-title-inner">Description:</span></span> <p>A very rare
      bitter, ugly herb which survives in odd corners of every desert in the
      tablelands. Its existence has been known to the Templars of most cities
      since time immemorial, as they seek to control psionics in their
      cities.</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>If someone drinks a
      brewed concoction, all psionic ability is numbed for d6 + 3 days if they
      fail their save against poison. However, it has a very foul taste and
      smell, and most people will not willingly drink it. Mixing it with Eau de
      Silt Lily can alleviate the taste.</p><div
      class="rd__spc-inline-post"></div></div></div>
