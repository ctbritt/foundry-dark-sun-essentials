  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Hinterlands and scrub
      plains</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Used as-is</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>Strangely tainted
      water, which generates hallucinations, and visions, which enhance memory
      recall, and future visions. These pools of water are often found in the
      hinterlands and scrub plains. It usually consists of a small metallic
      smelling pool in which a collection of lichens and fungus grows
      around.</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>One vision per session;
      acts in the following way (d6): 1) Precognition (as per the Psionic
      science) 2) Predestination (as per the Psionic devotion) 3) Sensitivity to
      Psychic Impressions (as per the Psionic science) 4) Danger Sense (as per
      the Psionic devotion) 5) Spirit Lore (as per the Psionic science) 6)
      Vision (as per the spell)</p><div
      class="rd__spc-inline-post"></div></div></div>
