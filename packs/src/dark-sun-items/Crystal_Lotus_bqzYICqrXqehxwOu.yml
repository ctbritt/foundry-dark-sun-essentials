  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Peaks of the Ringing
      Mountains</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="2">
      <span class="entry-title-inner">Preparation.</span></span> <p>Petals
      picked just before withering</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>The <i>crystal
      lotus</i> is extremely rare and may be found only on the peaks of the
      Ringing Mountains above the snow line. The plant in itself is never higher
      than 2-3 inches and has a diameter of one foot, if not damaged has exactly
      5 white leaves. Once a year a single flower blooms in the center of the
      plant.</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>Each petal when
      ingested has several nearly magical effects on the metabolism of the user.
      Upon ingesting a petal make a system shock roll. Success grants immunity
      to natural heat and tolerance to burning coal or oil for a couple of
      rounds, -2 to Str, Dex and Con, +2 to Int and Wis, and reduced damage from
      fire. Failure causes unconsciousness for 24 hours with vivid
      dreams.</p><div class="rd__spc-inline-post"></div></div></div>
