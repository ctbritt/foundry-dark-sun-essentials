  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Forest Ridge, lower
      Ringing Mountains scrublands</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Bark from new
      limbs or shoots</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="3">
      <span class="entry-title-inner">Description:</span></span>
      <p><i>Piyare</i> is a large tree which is relatively common in the Forest
      Ridge, and sometimes found in the lower Ringing Mountains scrublands. The
      part of <i>piyare</i> that is used is a small piece of bark from a new
      tree limb or shoot.</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="4">
      <span class="entry-title-inner">Effect:</span></span> <p>Dependent on the
      amount consumed, one could make themselves completely numb for a period of
      time, and feel no pain. It is used by some gladiators before battles they
      expect to lose. <i>Piyare</i> has no healing qualities, nor any blood
      clotting quality, and additionally slows down the user by reducing their
      dexterity by 2 points.</p><div
      class="rd__spc-inline-post"></div></div></div>
