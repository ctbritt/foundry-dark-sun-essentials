    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Crescent forest,
      shaded areas</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="2">
      <span class="entry-title-inner">Preparation.</span></span> <p>Fruit used
      for body paint</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="3">
      <span class="entry-title-inner">Description:</span></span> <p>These plants
      grow all around in the crescent forest where there is a lot of shade from
      Athas's Sun. This plant grows close to the ground and never gets above 1
      inch tall, but grows about 1 foot in diameter, and bears a small blue
      fruit once a year.</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="4">
      <span class="entry-title-inner">Effect:</span></span> <p>It is nothing
      more than a weed everywhere else, except for Gulg. In Gulg the plant
      happens to bears fruit the same time as the starflower so it is used as
      blue body paint for the nobles-to-be. Those who are already nobles do not
      use this body paint.</p><div
      class="rd__spc-inline-post"></div></div></div>
