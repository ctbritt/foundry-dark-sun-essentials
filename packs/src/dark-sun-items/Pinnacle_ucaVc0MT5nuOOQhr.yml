  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Various</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Grown, dried, and
      filled with poison</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="3">
      <span class="entry-title-inner">Description:</span></span> <p>This plant
      grows about a 1/4 inch tall and consists of 5 small needle-like spikes. It
      has one center spike with 4 spikes surrounding it. It has a tendency, when
      dry, to break off very easily when bumped.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>Bards can sprinkle
      seeds in the path of their intended victim. In 5 days, the spikes are
      fully-grown and still very soft. When dried, they become hollow and can be
      filled with poison. When the victim walks over the plant with no boots or
      thin boots, the spikes will embed themselves into the victim's foot,
      allowing the poison to enter the body.</p><div
      class="rd__spc-inline-post"></div></div></div>
