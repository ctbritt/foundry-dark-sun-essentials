  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Salt flats in the
      Ivory Triangle</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="2">
      <span class="entry-title-inner">Preparation.</span></span> <p>Used as a
      spice</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>A popular spice
      used by the Drajians to flavor an otherwise bland meal, the gray lichen is
      found in the salt flats in the Ivory Triangle.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>It provides a pungent
      earthy flavor (with a hint of sweetness and nuts) to bland meals. It lives
      on salt compounds and small amounts of water, and is very resistant to
      both defiling and water loss. A defiler in the salt flats can try to
      utilize its energy, but the lichen can save vs. spell +4 to avoid giving
      up its energy.</p><div class="rd__spc-inline-post"></div></div></div>
