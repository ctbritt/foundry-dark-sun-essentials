  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Rocky
      badlands</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="2">
      <span class="entry-title-inner">Preparation.</span></span> <p>Leaves
      brewed as tea or powdered</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>A short, bushy
      green plant; found mainly in the rocky badlands. Its leaves are broken off
      and brewed as a tea then the vapour inhaled.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>Ingestion produces
      light-headedness and enhances initiative (+1) and general good feeling.
      Many duar tribes drink this tea socially when meeting men of other tribes,
      because the good feeling usually overcomes some of the mistrust that may
      occur in the wastes. Some bards of Balic use powdered <i>veroc</i> in
      hosts' drinks, as it means that the hosts are more friendly and hopefully
      more generous.</p><div class="rd__spc-inline-post"></div></div></div>
