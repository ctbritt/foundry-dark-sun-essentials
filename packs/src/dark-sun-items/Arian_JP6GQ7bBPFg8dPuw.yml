      avoid choking in the dust. If a user falls into the Silt Sea, they
      actually have an extra couple of rounds to avoid drowning, as <i>Arian</i>
      enhances the nasal passages, and repels dust.</p><div
      class="rd__spc-inline-post"></div></div></div>
