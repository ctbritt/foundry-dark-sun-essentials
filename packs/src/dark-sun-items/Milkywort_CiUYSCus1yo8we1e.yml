  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Verdant belt south of
      Gulg</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Sap extracted and
      dissolved in alcohol</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="3">
      <span class="entry-title-inner">Description:</span></span>
      <p><i>Milkywort</i> is a small low ground-growing succulent, which is
      primarily found in the verdant belt south of Gulg. It is very rare at
      best, and the local farmers who feared to step on its spines used to
      destroy it whenever they could, to avoid milkblindness.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p><i>Milkywort</i> sap is
      a tasteless, gummy liquid which dissolves into alcohol. When the victim
      imbibes it, the poison impedes one's ability to see. The eyes get glazed
      over into a milky white color, which causes temporary blindness. The
      amount of time of blindness is dependent upon the dosage used. If
      sufficient dosages are used, permanent blindness can also be
      inflicted.</p><div class="rd__spc-inline-post"></div></div></div>
