  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Grown by Tari and
      bards of Undertyr</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="2">
      <span class="entry-title-inner">Preparation.</span></span>
      <p>Consumed</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="3">
      <span class="entry-title-inner">Description:</span></span> <p>Also known
      as Blind Wort, <i>Zaganazar</i> is a small, black, bulbous fungus grown by
      the Tari and some of the bards of Undertyr.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>When consumed, it
      causes temporary blindness in its victims. Strangely enough, when the Tari
      fled Ythri, <i>Zaganazar</i> was used to prevent permanent blindness from
      the sun. Because the Tari had spent all their lives beneath the ground,
      the Athasian sun sometimes caused permanent blindness if suddenly the eyes
      were thrust into the light. So <i>Zaganazar</i> was used to help adjust
      the eyes before the retinas burnt out. Of course, the bards of Athas
      quickly discovered other uses.</p><div
      class="rd__spc-inline-post"></div></div></div>
