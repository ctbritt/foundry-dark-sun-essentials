  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Along well-used
      pathways</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="2">
      <span class="entry-title-inner">Preparation.</span></span> <p>Vines
      braided and soaked in water</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p>This plant is a
      vine plant that grows along the ground, and whose vines can reach up to 5
      feet long when fully grown. It likes to grow along pathways that are used
      quite often. Its vines are very strong requiring a 13 strength to break if
      you get tangled up in them.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>Templars braid the
      vines into a 3 foot rope and soak it in water. Like leather, it becomes
      very flexible and can stretch slightly, and when it dries off it becomes
      very tight. Templars use it to bind prisoners, as it dries out quickly in
      Athas's sun and becomes very tight, cutting off circulation after a
      time.</p><div class="rd__spc-inline-post"></div></div></div>
