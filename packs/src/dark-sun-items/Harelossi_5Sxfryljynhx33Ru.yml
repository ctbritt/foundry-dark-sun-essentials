  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Formerly Nibenay, now
      Gulg</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Preparation.</span></span> <p>Flowers boiled in
      wine</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="3"> <span
      class="entry-title-inner">Description:</span></span> <p><i>Harelossi</i>
      is a flowering ground plant, which used to be all the rage amongst the
      nobles of Nibenay. The pale blue flower had a sickly sweet lemony smell,
      which used to attract multi colored butterflies.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>The Bards of the dagada
      have discovered the plant's toxin has a very strange effect, loss of hair.
      They boil the flowers in wine, which creates a sweet tonic. When the toxin
      is first administered the hair stops growing. If this carries on over
      time, eventually the hair starts to fall out. This includes all bodily
      hairs.</p><div class="rd__spc-inline-post"></div></div></div>
