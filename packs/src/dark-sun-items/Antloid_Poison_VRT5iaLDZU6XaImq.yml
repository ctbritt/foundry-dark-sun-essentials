        <p>The poison of the soldier antloid causes the instant rupturing of any
        flesh it contacts, resulting in severe, burn-like wounds that are
        difficult to heal and often leave horrible scars. Despite the difference
        in delivery methods, the poison from the archer and infantry antloid
        soldier are identical; a skilled poison crafter may create either an
        injury or contact poison using the harvested poison glands from either
        type of antloid.</p>
