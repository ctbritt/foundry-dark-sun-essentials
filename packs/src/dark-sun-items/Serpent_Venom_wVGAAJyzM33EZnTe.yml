      folder: Rare Poisons
      instruction: >-
        <p>This poison must be harvested from a dead or
        @toggleEffect[Incapacitated] giant poisonous snake. A creature subjected
        to this poison must succeed on a DC 11 Constitution saving throw, taking
        10 (3d6) poison damage on a failed save, or half as much damage on a
        successful one.</p><p><strong>Injury.</strong> Injury poison can be
        applied to weapons, ammunition, trap components, and other objects that
        deal piercing or slashing damage and remains potent until delivered
        through a wound or washed off. A creature that takes piercing or
        slashing damage from an object coated with the poison is exposed to its
        effects.</p>
