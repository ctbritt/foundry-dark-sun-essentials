      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="3">
      <span class="entry-title-inner">Description:</span></span> <p>This rare
      plant is found in the sandy desert, where it clings to life tenaciously.
      It is a mutant plant that uses photosynthesis to create a silicon life
      form, changing silicon into an organic amber compound. The leaves have a
      crystalline form and orange coloration, and the plant glitters in the
      light.</p><div class="rd__spc-inline-post"></div></div><div class="rd__b 
      rd__b--3"><span class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>Occasionally, lumps of
      amber can be found which some merchants polish into gemstones. The berries
      are like rock candy and are a growing delicacy amongst nobles. The plant's
      only real predator are rasclinn which adore its leaves and
      berries.</p><div class="rd__spc-inline-post"></div></div></div>
