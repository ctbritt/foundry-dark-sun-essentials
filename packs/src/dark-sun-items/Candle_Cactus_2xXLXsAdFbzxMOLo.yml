  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="1"> <span
      class="entry-title-inner">Location.</span></span> <p>Rocky
      badlands</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="2">
      <span class="entry-title-inner">Preparation.</span></span> <p>Needles
      extracted and dried</p><div class="rd__spc-inline-post"></div></div><div
      class="rd__b  rd__b--3"><span class="rd__h rd__h--3" data-title-index="3">
      <span class="entry-title-inner">Description:</span></span> <p>This
      uncommon cactus is primarily found in the rocky badlands. A tall
      yellow-green cactus with many arms, it has long been used by nobles and
      merchants of the Wastes.</p><div
      class="rd__spc-inline-post"></div></div><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="4"> <span
      class="entry-title-inner">Effect:</span></span> <p>Its long, waxy needles
      have a built-in wick (actually a very burnable fiber), which allows it to
      burn long and cleanly. Many nobles use it in lieu of the more fatty tallow
      candles, as it gives off a lemony scent, which sweetens the air as it
      burns. It is also lighter than normal candles, making it the choice of
      travelers everywhere.</p><div
      class="rd__spc-inline-post"></div></div></div>
