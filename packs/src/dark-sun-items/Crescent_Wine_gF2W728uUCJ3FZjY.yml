system:
  description:
    value: >-
      <p>A recipe for crafting the infamous Crescent Wine poison, derived from
      the venom of a small, vermin-eating snake found in the Crescent Forest.
      This alcohol-soluble poison is most commonly mixed into wine, where its
      effects are easily masked.</p><p><strong>Crafting
      Steps:</strong></p><ol><li>Extract venom from the Crescent Forest
      snake</li><li>Prepare a suitable wine base</li><li>Carefully mix the venom
      with the wine in precise ratios</li><li>Add flavorings to mask any
      remaining bitterness</li><li>Store the mixture properly to preserve
      potency</li><li>Test the poison for desired strength and effects</li></ol>
