system:
  description:
    value: >-
      <p>A recipe for crafting the insidious T'chowb ichor, a contact poison
      that drains the victim's Intelligence. This viscous poison is derived from
      the lymph nodes and enlarged sweat glands found in the hands of the
      t'chowb.</p><p><strong>Crafting Steps:</strong></p><ol><li>Extract lymph
      and sweat gland secretions from a t'chowb</li><li>Refine and concentrate
      the extracted fluids</li><li>Mix with a stabilizing
      agent</li><li>Carefully distill the mixture to increase
      potency</li><li>Add a bonding agent to ensure skin absorption</li></ol>
