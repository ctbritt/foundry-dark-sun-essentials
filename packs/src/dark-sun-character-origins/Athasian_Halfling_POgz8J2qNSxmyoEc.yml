name: Athasian Halfling
type: race
system:
  source:
    custom: Dark Sun
    book: Dark Sun
    page: ''
    license: ''
    rules: '2024'
    revision: 1
  description:
    value: >-
      <div class="fvtt narrative"><p>"You have desecrated our sacred place," a
      wispy voice called from behind. Just in front of the stand of trees, there
      stood a halfling, looking wild and primal with his painted body and
      forest-decorated hair, and pointing a crude, bone sword at the party. "The
      ancients cannot forgive you for trespassing, and neither can I!” All of a
      sudden, a rain of arrows exploded out of the trees, landing all around the
      surprised group, while the feral cries of halfling warriors echoed from
      the darkness of the forest.</p></div><p>The halflings found in the forests
      of the Ringing Mountains and those that descend into the Tablelands are
      often seen as feral, savage creatures. They are more willing to eat a
      stranger in their lands than to welcome him. To halflings, all other
      creatures, including sentient species, can be used to provide sustenance
      in the unforgiving lands of Athas.</p><p><strong>SMALL AND
      PRIMITIVE</strong></p><p>Halflings are diminutive in stature, standing
      about 3 feet tall. They are muscled and proportioned like humans, but they
      have the faces of wise and beautiful children that never succumb to the
      rigors of age. They weigh between 50 and 60 pounds and are virtually
      always in peak physical condition. Their skin ranges between pale to tan,
      and their hair is usually a brown or black mane. Many have shades of brown
      or hazel eyes, though blue is rarely found; such halflings are said to
      bear the life of the oceans inside them.</p><p class="p2">The appearances
      of the halflings are considered primitive by most of the other Athasian
      species; while their garments are usually a plain loincloth and
      occasionally a vest or shirt, halflings fancy painting their skins in
      various colors and enjoy adornments with colorful beads and feathers. They
      rarely tend to their hair, instead letting them grow in great lengths, and
      keeping them unkempt and dirty. Halflings sport little to no body
      hair.</p><p class="p5"><strong>SOLITARY AND RITUALISTIC</strong></p><p
      class="p2">In the jungle forests of the Ringing Mountains, halflings
      possess a great deal of cultural unity. Though divided politically into
      separate villages and communes, halflings have great respect for their
      culture. Disputes between members of communes are most often setled
      peaceably, through ritual and custom. These customs are often directed by
      each tribe's shaman, the spiritual leaders who hold positions of honor and
      respect above most other halflings.</p><p class="p2">On a personal level,
      halflings relate very well to one another, well enough to have built a
      considerable culture rich in art, song, and other expressive
      communication. Ritual and custom influence every aspect of halfling life.
      Such is the diversity of their culture that other species find it
      difficult to comprehend. More than a few</p><p class="p2">times, a
      halfling will be frustrated by outsiders</p><p class="p2">who can't seem
      to grasp their abstract thinking and complicated concepts. Fortunately,
      halflings who have travelled widely outside their traditional home have a
      much greater tolerance toward those "lacking" culture.</p><p
      class="p5"><strong>SELF-IMPROVEMENT</strong></p><p class="p2">Halfling
      culture cares for each individual's inner well-being and spiritual unity
      with the environment. They have little concept of conquest or monetary
      wealth, and vices that other societies take for granted - such as greed
      and avarice - are particularly discouraged.</p><p class="p2">Treasure that
      appeals to other characters holds little interest to a halfling. It is
      more concerned with promoting halfling culture, its own knowledge, or its
      inner well-being. A halfling will rarely lie to or betray another halfling
      as it is considered a grave offense in their culture.</p><p
      class="p5"><strong>EXPANDING KNOWLEDGE</strong></p><p class="p2">At first,
      halflings face difficulties in adjusting to other customs and points of
      view, but as a generally open-minded species, they tend to be curious or
      confused by the customs of others, rather than initially combative.
      Halfling travelers will attempt to learn all they can about other
      cultures, but will almost never adopt those cultures as their own. Their
      shamans teach that the customs of others are no threat to their own, so a
      halfling explorer will welcome the chance to learn another point of view,
      rather than instantly try to change it.</p><div><div class="rd__b 
      rd__b--0"><div class="rd__b  rd__b--1"><div class="rd__b-special
      rd__b-inset "><h4><strong>Roleplaying a Halfling</strong></h4><p><span
      class="rd__h-toggle ml-2 clickable no-select"
      data-rd-h-special-toggle-button="true" title="Toggle Visibility (CTRL to
      Toggle All)">[–]</span></p><p>Remember to consistently take your height
      into account. Role–play the halfling culture described above: eating
      opponents, treating fellow halflings with trust and kindness, suspicion of
      big people, and general lack of interest in money. Conquest and plundering
      have no place in your society; rather the most important value is the
      ability of the inner self as it harmonizes with the environment. You
      should be sickened by the landscape of the Tablelands and desperately want
      to avoid any risk that devastation ever spreading to your homelands in the
      Forest Ridge. You will learn about other cultures, but you should firmly
      believe halfling culture to be innately superior to all others. However,
      you don’t try to change other’s cultures, no more than you would try to
      convince a tembo to change its diet.</p><p>While omnivorous, you vastly
      prefer meat, and everything is a source of food. You should presume most
      other races will eat anything, including halflings, if they are hungry
      enough, and this makes it hard to trust
      them.</p></div></div></div></div><p class="p5"><strong>HALFLING
      NAMES</strong></p><p class="p2">Halflings have a given name, provided to
      them by their community. They stick to that name as a mark of their
      heritage, even though they might adopt many different names from the other
      cultures.</p><p class="p2"><span class="s1"><strong>Male Names:
      </strong></span>Basha, Cerk, Derlan, Drassu, Entrok, Kakzim, Lokee, Nok,
      Pauk, Plool, Sala, Tanuka, Ukos, Zol, Cha, Derian, Fullgrin, Lokee, Nok,
      Pauk, Pletaw, Purhas, Urga-zoltapl, Zivlil</p><p class="p2"><span
      class="s1"><strong>Female Names: </strong></span>Alansa, Anezka, Dokala,
      Grelzen, Horga, Jikx, Joura, Nasaha, Vensa,</p><p
      class="p5"><strong>HALFLING TRAITS</strong></p><p class="p2">Athasian
      halflings share a number of traits common to their species. Halflings
      encountered in the tablelands are typically jungle halflings from the
      forest ridge.</p><p class="p2"><span class="s1"><strong>Age.
      </strong></span>A halfling reaches adulthood at the same age as humans and
      generally lives a little longer than a century.</p><p class="p2"><span
      class="s1"><strong>Size. </strong></span>Halflings average about 3 feet
      tall and weigh between 50 and 60 pounds. Your size is Small.</p><p
      class="p1"><strong>Creature Type: </strong><span
      class="s2">Humanoid.</span></p><p class="p2"><span
      class="s1"><strong>Speed. </strong></span>Your base walking speed is 25
      feet.</p><p class="p2"><span class="s1"><strong>Brave. </strong></span>You
      have Advantage on saving throws you make to avoid or end the Frightened
      Condition on yourself.</p><p class="p6"><span class="s1"><strong>Halfling
      Athletics. </strong></span>You can add your Dexterity modifier instead of
      your Strength modifier to all Athletics skill checks.</p><p
      class="p2"><span class="s1"><strong>Halfling Nimbleness.
      </strong></span>You can move through the space of any creature that is of
      a size larger than yours, but you can’t stop there.</p><p class="p6"><span
      class="s1"><strong>Halfling Resilience. </strong></span>You have advantage
      on saving throws against poison, and you have resistance against poison
      damage.</p><p class="p2"><span class="s1"><strong>Naturally Stealthy.
      </strong></span>You have proficiency in the Stealth skill.</p><p
      class="p2"><span class="s1"><strong>Languages. </strong></span>You can
      speak Halfling. The Halfling language isn't secret, but halflings loath to
      share it with others. Since they only have oral traditions, their
      literature is nonexistent.</p>
    chat: ''
