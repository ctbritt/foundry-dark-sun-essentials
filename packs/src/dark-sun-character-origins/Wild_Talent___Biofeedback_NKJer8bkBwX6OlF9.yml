name: Wild Talent - Biofeedback
type: feat
system:
  description:
    value: >-
      <p>As a reaction, you can redirect blood flow to mitigate harm from a
      single source of bludgeoning, piercing, or slashing damage that you can
      see. Reduce the damage by your proficiency bonus. You can use this feature
      a number of times equal to your proficiency bonus. You regain all uses
      when you finish a long rest.</p>
