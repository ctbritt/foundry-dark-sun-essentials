name: Wild Talent - Beacon
type: feat
system:
  description:
    value: >-
      <p>As an action, you cause bright light to radiate from your body in a
      20-foot radius and dim light for an additional 20 feet. The light can be
      colored as you like. The light lasts for up to 1 minute per level. You can
      use this feature a number of times equal to your proficiency bonus. You
      regain all uses when you finish a long rest.</p>
