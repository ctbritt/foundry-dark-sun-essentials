system:
  description:
    value: >-
      <div class="fvtt narrative"><p>They run across the burning sands like
      whirling dust sweeps across the baked dunes and parched steppes of the
      Tablelands. By day, they are untamed winds, blowing hot gusts of chaos
      from one end of the Tablelands to the other. By night, they are switi
      shadows, always in motion, dancing beneath the light of Athas' twin moons.
      They are the elves of Athas, and the twisted path they trace over the
      landscape is fast, furious, and more than a little
      dangerous.</p></div><p>The elves of Athas are long-limbed sprinters who
      lead lives of raiding, trading, and warfare. As members of nomadic tribes
      wandering the sun-scorched lands, elves usually make a living as traders
      and herders and rarely stay in one place for long. Each of the city-states
      hosts an Elven Market — a never-ending bazaar where the elves (and others
      who deal in goods of dubious origin) sell their wares. Elves are looked
      upon by some as swindlers due to the negotiating skills of some of their
      merchants in trade dealings that usually leave the other party at a
      distinct disadvantage.</p><p>Many elf tribes make a living through
      herding, but merchants and raiders also ply the desert roads. An elf can
      be from a wild, tribal background or from a city-state upbringing — there
      are many elves that have settled in the cities as bazaar vendors, and
      still many more that have been dragged there in chains. Elf culture, while
      savage, is also rich and diverse.</p><p>Within a given tribe, all elves
      are brethren, but outsiders— even other elves— are regarded as potential
      enemies. Outsiders can be accepted and perhaps even become friends, but
      trust takes time to develop, and it is otien associated with tests and
      great sacrifice.</p><h1>SAVAGE BEAUTY</h1><p>Elves stand between 6 and 7
      feet tall with slender yet muscular builds. They maintain youthful
      features, even under the baking sun and the scouring sand. They grow no
      facial or body hair, but the locks atop their heads come in all colors—
      from sun-bleached blond to red and brown to darkest black.</p><p>Elves
      prefer to dress in garb designed to protect them from the desert and the
      elements but also to showcase their tribal customs and traditions. Some
      also incorporate plunder from raids to enrich their native dress. Song and
      dance play a major part in the elven life, and the music they produce is
      captivating and seductive to non-elves. They have turned celebrating into
      an art form, and elf song and dance is some of the most beautiful and
      captivating in all of Athas.</p><h1>NATURAL WANDERERS</h1><p>Elves are
      tireless desert rovers forged in the desert— burned dark by the sun,
      toughened by the swirling sand, and given strength and speed by the
      constant wind. Elves crave free, open spaces in which to run, and elven
      slaves tend to wither in captivity if they can't escape, a practice they
      always strive for.</p><p>Only rarely will an elf ride a crocodile or a
      kank as a mount; to do so is dishonorable unless ill or gravely wounded.
      The custom of the elves is to keep up or be leti behind, so those unworthy
      of following the elf run are not considered to be strong and useful to the
      tribe.</p><h1>DUBIOUS REPUTATION</h1><p>Most Athasians consider elves lazy
      and deceitful, but these views are colored by a lack of knowledge of the
      elven mindset. For an elf, the future is a dark, deadly place, where each
      day may be your last. So, elves strive to make every moment as enjoyable
      and full of life as possible as the next day is not
      guaranteed.</p><p>Because of this philosophy, many elves dislike laborious
      work and prefer to live vicariously, avoiding unpleasant tasks and
      drudgery. If work can wait for even another day, then it will.</p><p>While
      elves detest hard labor and will never voluntarily set out to construct
      anything more durable than a tent or small hut, many will spend hours on
      end haggling and negotiating with potential customers. When it's important
      to maintain a valuable trading relationship, elves honor their word and
      barter in good faith. But the moment they perceive an opportunity that is
      too good to pass up, they take advantage of the situation and renegotiate
      previous deals when possible.</p><h1>ELF NAMES</h1><p>Names are very
      important to elves, and they take a great deal of time and care before
      selecting one. Elven names are derived from two sources: the name of their
      tribe and a given name based upon the elven tradition of a child's first
      interesting thing while learning to run.</p><p><strong>Male
      Names:</strong> Abyuuk, Botuu, Coraanu, Dukkoti, Eevuu, Galek, Haaku,
      Ikan,Jaarati, Kathak, Lobuu, Mutarni, Nuuko, Quaar, Radurak, Sorak,
      Traako.</p><p><strong>Female Names</strong>: Alaa, Areela, Celba, Deryssa,
      Ekee, Elas, Enala, Esylk, Grissi, Guuta, Hukaa, ltee,Jeila, Katza,
      Keelorr, Nuuta, Nysia, Tala, Utaa, Yalana.</p><p><strong>Tribe
      Names</strong>: Clearwater, Fire Wind, Moon Child, Ghost Wind, Night
      Runner, Red Moon, Shadow, Silt Stalker, Silver Hand, Sky Singer,
      Sunrunners, Switiwing, Water Hunter, Wind Dancer.</p><h1>ELF
      TRAITS</h1><p>Your elf character has a variety of natural abilities, the
      result of centuries of constant struggle in the Athasian
      wastelands.</p><p><strong>Age</strong>. Although elves reach physical
      maturity at about the same age as humans, they must pass the tribe's rites
      of initiation before they can be considered adults. An elf typically
      claims adulthood around the age of 20 and can live to be 120 years
      old.</p><p><strong>Size</strong>. Elves range from 6 to over 7 feet tall
      and possess slender, muscular builds. Your size is
      Medium.</p><p><strong>Creature Type:</strong>
      Humanoid</p><p><strong>Speed</strong>. Your base walking speed is 40
      feet.</p><p><strong>Darkvision.</strong> You have Darkvision with a range
      of 60 feet.</p><p><strong>Running Trance</strong>. By inducing an
      extraordinary state of grueling endurance, you gain the ability to travel
      long distances, sometimes for days at a time. You add your proficiency
      bonus and have advantage on Constitution checks made to avoid exhaustion
      as part of a forced march.</p><p><strong>Expert</strong>
      <strong>Haggler.</strong> You have advantage on proficiency checks with
      the Deception, Diplomacy, or Persuasion skills that involve
      trading.</p><p><strong>Keen Senses</strong>. You have proficiency in the
      Perception skill.</p><p><strong>Languages</strong>: You can speak, read,
      and write Common and Elvish. Elvish is fluid, with subtle intonations and
      intricate grammar.</p>
