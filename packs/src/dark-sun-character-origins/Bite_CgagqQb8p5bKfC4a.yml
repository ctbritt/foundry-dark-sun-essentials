name: Bite
type: feat
system:
  description:
    value: "<p>Your bite deals [[/damage average]]. At 5th level, when you hit with your bite, the target must make a constitution saving throw (DC + [[8+ @abilities.con.mod+ @prof]] or becomes @Compendium[dnd5e.rules.w7eitkpD7QQTB6j0]{poisoned} for 1 minute, repeating the save at the end of each of it's turns. If they succeed, they are immune to this effect for 24 hours.</p><details><summary>More Details</summary><p></p><p>If you hit with your bite, you deal piercing damage equal to 1d4 + your Strength modifier, instead of the bludgeoning damage normal for an unarmed strike.</p><p>Starting at 5th level,\_any target you hit with your bite must\_make a constitution saving throw.\_The DC for this saving throw equals 8 + your Constitution modifier + your proficiency bonus. A creature\_becomes poisoned\_for 1 minute on a failed save, and doesn't become poisoned\_on a successful one.\_The @Compendium[dnd5e.rules.w7eitkpD7QQTB6j0]{poisoned} target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success. If they succeed, they are immune to this effect for 24 hours.</p><p></p></details>"
