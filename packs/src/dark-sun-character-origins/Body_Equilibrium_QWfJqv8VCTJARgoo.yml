name: Body Equilibrium
type: feat
system:
  description:
    value: >-
      As a bonus action, you ignore difficult terrain when moving over soft or
      brittle terrain, such as dust, silt, mud, snow, or thin ice. This effect
      lasts until the end of your next turn. You can use this feature +
      [[@prof]] times. You regain all uses when you finish a long rest.
        <details>
          <summary>
            More Details
          </summary>
          <p>
            </p><p>As a bonus action, you ignore difficult terrain when moving over soft or brittle terrain, such as dust, silt, mud, snow, or thin ice. This effect lasts until the end of your next turn. You can use this feature a number of times equal to your proficiency bonus. You regain all uses when you finish a long rest.</p>
          <p></p>
        </details>
