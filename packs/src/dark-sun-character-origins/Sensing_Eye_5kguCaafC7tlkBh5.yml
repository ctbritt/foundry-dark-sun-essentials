name: Sensing Eye
type: feat
system:
  description:
    value: >-
      An image forms in your mind, revealing what you would see if you were
      standing some distance away. As a bonus action, you can choose a point you
      can see within 30 feet of you. Until the end of your next turn, you are
      @Compendium[dnd5e.rules.w7eitkpD7QQTB6j0]{blinded} and can see from that
      point as if you were standing there. While seeing through this, you can
      shift your vision around that point as if you were standing there. You can
      use this feature + [[@prof]] times. You regain all uses when you finish a
      long rest.
