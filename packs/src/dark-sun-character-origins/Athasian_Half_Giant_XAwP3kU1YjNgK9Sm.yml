name: Athasian Half-Giant
type: race
system:
  description:
    value: >-
      <aside class="notable"><p><em>"Mind of a child, strength of three grown
      men. I've seen a half-giant tear the walls out of a building because he
      wanted a better look at the tattoos on a mul inside."</em><br />—Daro,
      human trader</p></aside><p>Half-giants are one of the newer races to walk
      upon the burning sands of Athas. The race was created by the magical
      experiments conducted during the first years of the Age of the
      Sorcerer-Kings. At the time, the sorcerer-kings were looking to create
      ultimate warriors to protect their domains. Because of these origins,
      half-giants have no culture of their own to draw upon, no ancient
      traditions and homelands to turn to for inspiration.</p><p>They have human
      features that are exaggerated in some way. Along with the size gained from
      their giant heritage comes low intelligence and great physical strength.
      From the human side, half-giants get an interest in communication and
      cooperation, curiosity, a willingness to learn, and a general tendency
      toward kindness. They don't gather in communities of their own, but
      instead tend to adopt the cultures of those they admire or have access
      to.</p><p>Half-giants can produce offspring by mating with other
      half-giants. All half-giants that exist in modern Athas are the
      descendants of the first magically created half-giants produced in the
      early years of the rule of the sorcerer-kings. There is no natural way for
      giants and humans to mate and create half-giant children.</p><p>In the
      city-states, half-giants serve as soldiers, guards, or laborers. In the
      wilderness, they attach themselves to charismatic leaders or communities
      demonstrating tendencies that they admire. Wherever they are, half-giants
      have to deal with the fact that they are too big for the world around
      them, for things built for the use and convenience of humans don't work
      well in the hands of half-giants.</p><h2>Cultural
      Adaptability</h2><p>Half-giants are a relatively new addition to the races
      of Athas. The union was originally the result of magical experiments
      conducted by the sorcerer-kings. When the sorcerer-kings first took
      control of the cities of the Tyr Region, they used their arcane powers to
      cross humans with giants, striving to create warriors and laborers of
      gigantic proportions. Because of this turbulent beginning, the half-giants
      of today's Athas have no culture of their own to draw upon, no ancient
      traditions to turn to for inspiration.</p><p>From giants, this race
      inherited tremendous size and strength, as well as low intelligence. From
      humans, they received curiosity, an interest in cooperation and
      communication, and a general tendency toward kindness. Although
      half-giants have human features, these tend to be exaggerated in some way.
      All existing half-giants are the descendants of the original magically
      created half-giants. They can only produce offspring by mating with other
      half-giants; they cannot reproduce with either giants or humans. Likewise,
      there's no natural way for giants and humans to mate and produce children
      in today's Athas.</p><p>Like half-elves, half-giants don't gather in
      communities of their own. Instead they live in the human cities or in the
      wilderness tribes, absorbing the culture of those around them. They are
      friendly and eager to please whoever they meet. If they are accepted in
      turn, the half-giants quickly adopt the lifestyles, skills, and values of
      those they've come in contact with. A half-giant character presented with
      a new situation should examine the roles of the people there, determine
      how he best fits in, and then start performing tasks accordingly. For
      example, a half-giant who happens upon a dwarf quarry might watch for a
      time, then start quarrying stone. He won't necessarily work with the
      dwarves, but he'll continue to perform like his neighbors for as long as
      he can make a decent living.</p><p>Half-giants aren't strictly bound to
      perform as those they see around them, nor are they restricted from moving
      on when they see fit. If a situation isn't beneficial, or if a half-giant
      can't perform well in a given environment, he won't imitate the nearby
      culture. In all cases, half-giants simply aren't as emotionally attached
      to objects or work as are other races. Players running half-giant
      characters should be ready to switch goals and lifestyles quickly, usually
      according to charismatic individuals their characters might meet. They
      also need to remember that their characters have great size and strength,
      and so must play accordingly. For the most part, Athas is a human-sized
      world. Half-giants often have trouble with things that other characters
      take for granted, such as doors, chairs, and even buildings.</p><p>A
      half-giant character doubles his Hit Die rolls, no matter what his
      character class is. Add any bonuses for high Constitution scores after
      doubling the roll of the die. For example, a half-giant cleric rolls 1d8
      and multiplies the result by 2 to determine his hit points at each
      level.</p><h2>Half-Giant Traits</h2><p><strong>Age.</strong> Half-giants
      can live to a maximum age of 220 years.</p><p><strong>Alignment.</strong>
      Half-giants switch attitudes very quickly, taking on new values to fit new
      situations. This malleable attitude is handled by a changing alignment. A
      half-giant character selects one aspect of his alignment to remain fixed
      at the time the character is created (either the "lawful/neutral/chaotic"
      side, or the "good/neutral/evil" side). The other aspect is determined at
      the start of each day of game time. The character is bound to that
      alignment combination until he sleeps and wakes again. For example, if a
      half-giant has a fixed "good" side, then each morning he chooses to be
      either lawful good, neutral good, or chaotic good. Half-giant psionicists
      must have a fixed lawful or neutral aspect; they can't be
      chaotic.</p><p>Although this alignment change isn't mandatory, it should
      certainly be invoked in roleplaying situations as a reaction to extreme
      changes in a half-giant's environment. A half-giant's nature is to switch
      his alignment aspect to imitate or otherwise react to a significant change
      around him. Of course, there needs to be a good reason for a half-giant's
      flexible alignment aspect to change, and DMs are free to disallow any
      change that doesn't fit the current storyline. This shifting alignment
      should be a hindrance as often as it serves to help a half-giant
      character. It's up to the DM to make sure both good and bad events occur
      throughout a campaign.</p><p><strong>Size.</strong> Typical half-giants
      stand between 10 and 12 feet tall, weighing about 1,600 pounds. Your size
      is Large.</p><p><strong>Speed.</strong> Your base walking speed is 40
      feet. Your speed is not reduced by wearing heavy
      armor.</p><p><strong>Giant Ancestry.</strong> Due to you giant ancestry,
      you can increase your Strength score up to 22 instead of the normal
      maximum of 20. Additionally, you have advantage when making Strength
      checks to break an object. Your creature type is considered to be a
      giant.</p><p><strong>Giant Among Men.</strong> For the most part, Athas is
      a human-sized world. Half-giants often have trouble with things that other
      characters take for granted, such as doors, chairs, and even buildings. DM
      should impose disadvantage when he sees fit to underline this fact as
      often as situations allows.</p><p><strong>Darkvision.</strong> You can see
      in the dim light within 60 feet of you as if it were bright light, and in
      darkness as if it were dim light. You can't discern color in darkness,
      only shades of gray.</p><p><strong>Natural Athlete.</strong> You have
      proficiency in the Athletics skill.</p><p><strong>Powerful Build.</strong>
      You count as one size larger when determining your carrying capacity and
      the weight you can push, drag or lift.</p><p><strong>Stone's
      Endurance.</strong> You can focus yourself to occasionally shrug off
      injury. When you take damage, you can use your reaction to roll a d12. Add
      your Constitution modifier to the number rolled, and reduce the damage by
      that total. After you use this trait, you can't use it again until you
      finish a short or long rest.</p><p><strong>Large Appetite.</strong> You
      must eat and drink twice as much as a normal human or suffer the
      appropriate penalties.</p><p><strong>Large Weapon &amp; Armor.</strong>
      All personal items, such as clothing, armor, weapons, and food, cost
      double for half-giant characters. Transportation and lodging, when they're
      available at all, are also considerably more expensive. Most things aren't
      built to support the weight of a half-giant, and even in the cities
      half-giants tend to camp outside for their own comfort and to avoid
      causing any damage. Due to the size of your weapon, your weapon damage is
      doubled.</p><p><strong>Languages.</strong> You can speak Common and
      Giant.</p>
