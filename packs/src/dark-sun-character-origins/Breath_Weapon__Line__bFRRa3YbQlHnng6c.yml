name: Breath Weapon (Line)
type: feat
system:
  description:
    value: >-
      <p>When you take the Attack action on your turn, you can replace one
      attack with a breath weapon that is a 15 ft. line. Each creature must make
      a [[/save dex dc=@abilites.con.dc format=long]] taking [[/damage average]]
      on a fail or half as much on a success.</p><details><summary>More
      Details</summary><p></p><p>When you take the Attack action on your turn,
      you can replace one of your attacks with an exhalation of burning energy
      in a 30-foot line that is 5 feet wide. Each creature in that area must
      make a Dexterity saving throw (DC = 8 + your Constitution modifier + your
      proficiency bonus). On a failed save, the creature takes 1d10 fire damage.
      On a successful save, it takes half as much damage. This damage increases
      by 1d10 when you reach 5th level (2d10), 11th level (3d10), and 17th level
      (4d10).</p><p></p></details>
