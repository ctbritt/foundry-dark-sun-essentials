name: Alignment
type: feat
system:
  description:
    value: >-
      <p class="font-claude-response-body break-words whitespace-normal
      leading-[1.7]">Half-giants switch attitudes very quickly, taking on new
      values to fit new situations. This malleable attitude is handled by a
      changing alignment. A half-giant character selects one aspect of his
      alignment to remain fixed at the time the character is created (either the
      "lawful/neutral/chaotic" side, or the "good/neutral/evil" side). The other
      aspect is determined at the start of each day of game time. The character
      is bound to that alignment combination until he sleeps and wakes again.
      For example, if a half-giant has a fixed "good" side, then each morning he
      chooses to be either lawful good, neutral good, or chaotic good.
      Half-giant psionicists must have a fixed lawful or neutral aspect; they
      can't be chaotic.</p><p class="font-claude-response-body break-words
      whitespace-normal leading-[1.7]">Although this alignment change isn't
      mandatory, it should certainly be invoked in roleplaying situations as a
      reaction to extreme changes in a half-giant's environment. A half-giant's
      nature is to switch his alignment aspect to imitate or otherwise react to
      a significant change around him. Of course, there needs to be a good
      reason for a half-giant's flexible alignment aspect to change, and DMs are
      free to disallow any change that doesn't fit the current storyline. This
      shifting alignment should be a hindrance as often as it serves to help a
      half-giant character. It's up to the DM to make sure both good and bad
      events occur throughout a campaign.</p><p class="font-claude-response-body
      break-words whitespace-normal leading-[1.7]"></p>
