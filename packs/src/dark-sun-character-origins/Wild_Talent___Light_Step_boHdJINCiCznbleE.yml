name: Wild Talent - Light Step
type: feat
system:
  description:
    value: >-
      <p>As a bonus action, alter your density to improve your mobility. For the
      rest of your turn, your walking speed increases by 5 feet, and the first
      time you stand up this turn, you do so without expending any of your
      movement if your speed is greater than 0. You can use this feature a
      number of times equal to your proficiency bonus. You regain all uses when
      you finish a long rest.</p>
