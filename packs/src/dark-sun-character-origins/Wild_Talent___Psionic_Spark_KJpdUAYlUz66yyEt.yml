name: Wild Talent - Psionic Spark
type: feat
system:
  description:
    value: "<p>As an action, you conjure a small fiery spark on a single object or creature within 25 feet or you. The target must make a DC 10 Dexterity saving throw or take 1 fire damage. A flammable object ignites if it isn't being worn or carried and a creature can use an action to put out the flames. You can use this feature a number of times equal to your proficiency bonus. You regain all uses when you finish a long rest.</p>\n<p>\_</p>"
