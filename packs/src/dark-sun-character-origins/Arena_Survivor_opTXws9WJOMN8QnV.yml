    value: >-
      <h1>Arena Survivor</h1><p><strong>Ability Scores: </strong><span
      style="font-family:Roboto">Strength, Dexterity,
      Constitution</span></p><p><strong>Skill Proficiencies</strong>: Athletics,
      Intimidation</p><p><strong>Tool Proficiencies:</strong> One type of gaming
      set</p><p><strong>Language:</strong> One of your
      choice</p><p><strong>Feat</strong>:
      @UUID[Compendium.dnd-players-handbook.feats.phbftTough000000]{Tough}</p><p><strong>Equipment</strong>:
      A @UUID[Compendium.dark-sun-essentials.dark-sun-items.YEAYKyFdxpAgMJIz]{A Token
      from a Fellow Combatant} (a tooth, a ring, etc.), a set of
      @UUID[Compendium.shareddata.ddb-items.ski4qdvVUyNWkTX2]{Clothes, Common},
      a gaming set of your choice, and a belt pouch containing 10 ceramic
      pieces.</p><p><strong>Suggested Characteristics:</strong> Arena Survivors
      have a mix of pride and trauma from their time in the fighting pits. They
      are fierce, resilient, and otien bear physical or emotional scars from
      their experiences.</p><p></p>
