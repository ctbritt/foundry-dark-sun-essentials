name: Breath Weapon (Cone)
type: feat
system:
  description:
    value: >-
      <p>When you take the Attack action on your turn, you can replace one of
      your attacks with an exhalation of burning energy in a 15-foot cone. Each
      creature in that area must make a [[/save dex dc=@abilities.con.dc
      format=long]]. On a failed save, the creature takes [[/damage 1d10
      type=fire]]. On a successful save, it takes half as much damage. This
      damage increases by 1d10 when you reach 5th level (2d10), 11th level
      (3d10), and 17th level (4d10).</p><p>You can use your Breath Weapon a
      number of times equal to your proficiency bonus, and you regain all
      expended uses when you finish a long rest.</p>
