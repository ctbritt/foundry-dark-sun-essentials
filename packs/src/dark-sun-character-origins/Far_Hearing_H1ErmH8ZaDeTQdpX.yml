name: Far Hearing
type: feat
system:
  description:
    value: >-
      For a few moments, you can hear even distant whispers. As an action, you
      focus on a spot you can see within 60 feet of you. For the next minute,
      you can hear as if you occupied that square. You can end this effect at
      any time as a bonus action. You can use this feature + [[@prof]] times.
      You regain all uses when you finish a long rest.
