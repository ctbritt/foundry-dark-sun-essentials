      @UUID[Compendium.dnd-players-handbook.equipment.phbagPouch000000]{belt
      pouch} containing 20 ceramic tokens.</p><p><strong>Suggested
      Characteristics</strong>: Dune Traders are shrewd and opportunistic. They
      are always on the lookout for the next profitable venture and are adept at
      reading people and situations.</p><p>Dune traders can be members of the
      elven market, vendors within the city-states or independent trade
      entrepreneurs.</p>
