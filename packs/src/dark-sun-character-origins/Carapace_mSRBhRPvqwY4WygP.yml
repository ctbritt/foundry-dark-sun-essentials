_id: mSRBhRPvqwY4WygP
name: Carapace
type: feat
system:
  description:
    value: >-
      <p>While you aren’t wearing armor, your carapace gives you a base Armor
      Class of 13 + your Dexterity modifier. You can wear armor but it must be
      specially made or altered to fit your frame. Such armor would cost twice
      the amount it normally would.</p><p>As an action, if you are unarmored,
      you can change the color of your carapace to match the color and texture
      of your surroundings, giving you advantage on Dexterity
      (@Compendium[dnd5e.rules.0AGfrwZRzSG0vNKb]{Stealth}) checks made to hide
      in those surroundings.</p><details><summary>More
      Details</summary><p></p><p>As an action, if you are unarmored, you can
      change the color of your carapace to match the color and texture of your
      surroundings, giving you advantage on Dexterity (Stealth) checks made to
      hide in those surroundings.</p><p></p></details>
