  description:
    value: "<div class=\"ddb\">\n<p>You have an uncanny affinity for working with stone or metal. You gain Tool Proficiency with two of the following options of your choice: Jeweler’s Tools, Mason’s Tools, Smith’s Tools, or Tinker’s Tools.</p><section class=\"secret\">\n<p><strong>Jeweler's Tools</strong></p>\n<p>These special tools include the items needed to pursue a craft or trade. Proficiency with a set of artisan's tools lets you add your proficiency bonus to any ability checks you make using the tools in your craft. Each type of artisan's tools requires a separate proficiency.</p>\n<p><strong>Mason's Tools</strong></p>\n<p>These special tools include the items needed to pursue a craft or trade. Proficiency with a set of artisan's tools lets you add your proficiency bonus to any ability checks you make using the tools in your craft. Each type of artisan's tools requires a separate proficiency.</p>\n<p><strong>Mason's Tools</strong></p>\n<p>These special tools include the items needed to pursue a craft or trade. Proficiency with a set of artisan's tools lets you add your proficiency bonus to any ability checks you make using the tools in your craft. Each type of artisan's tools requires a separate proficiency.</p>\n<p><strong>Smith's Tools</strong></p>\n<p></p><div class=\"details-container-content-description\">\n<div class=\"details-container-content-description-text\">\n<p>These special tools include the items needed to pursue a craft or trade. Proficiency with a set of artisan's tools lets you add your proficiency bonus to any ability checks you make using the tools in your craft. Each type of artisan's tools requires a separate proficiency.</p>\n</div>\n</div>\n<div class=\"details-container-content-footer\">\_</div><p></p>\n<p><strong>Smith's Tools</strong></p>\n<p></p><div class=\"details-container-content-description\">\n<div class=\"details-container-content-description-text\">\n<p>These special tools include the items needed to pursue a craft or trade. Proficiency with a set of artisan's tools lets you add your proficiency bonus to any ability checks you make using the tools in your craft. Each type of artisan's tools requires a separate proficiency.</p>\n</div>\n</div>\n<div class=\"details-container-content-footer\">\_</div><p></p>\n<p><strong>Tinker's Tools</strong></p>\n<p>These special tools include the items needed to pursue a craft or trade. Proficiency with a set of artisan's tools lets you add your proficiency bonus to any ability checks you make using the tools in your craft. Each type of artisan's tools requires a separate proficiency.</p></section>\n</div>"
