      @UUID[Compendium.dark-sun-essentials.dark-sun-items.evixdseYrwzuIwKd]{A map of the
      region you were exiled from}, and a belt pouch containing 10 ceramic
      tokens.</p><p><strong>Suggested Characteristics:</strong> Exiles are wary
      and resourceful, often haunted by their past. They are driven by a desire
      to survive and possibly redeem themselves or take revenge on those who
      wronged them. Exiles can be castaways from the wasteland tribes, criminals
      escaping the city-states, or other similar situations.</p><p></p>
