name: Natural Weapons
type: feat
system:
  description:
    value: "Your maw and claws can be used to make unarmed strikes. Your claws deal slashing damage equal to 1d6 + [[@abilities.str.mod]]; Your bite deals piercing damage equal to 1d4 + [[@abilities.str.mod]]. At 5th level, when you hit with your bite, the target must make a constitution saving throw (DC + [[8+ @abilities.con.mod+ @prof]] or becomes @Compendium[dnd5e.rules.w7eitkpD7QQTB6j0]{poisoned} for 1 minute, repeating the save at the end of each of it's turns. If they succeed, they are immune to this effect for 24 hours.\n  <details>\n    <summary>\n      More Details\n    </summary>\n    <p>\n      </p><p>Your maw and claws can be used to\_make unarmed strikes.\_If you hit with one of your claws,\_you deal\_slashing\_damage equal to 1d6 + your Strength modifier, instead of the bludgeoning damage normal for an unarmed strike. If you hit with your bite, you deal piercing damage equal to 1d4 + your Strength modifier, instead of the bludgeoning damage normal for an unarmed strike.</p>\n<p>Starting at 5th level,\_any target you hit with your bite must\_make a constitution saving throw.\_The DC for this saving throw equals 8 + your Constitution modifier + your proficiency bonus. A creature\_becomes @Compendium[dnd5e.rules.w7eitkpD7QQTB6j0]{poisoned} for 1 minute on a failed save, and doesn't become @Compendium[dnd5e.rules.w7eitkpD7QQTB6j0]{poisoned} on a successful one.\_The @Compendium[dnd5e.rules.w7eitkpD7QQTB6j0]{poisoned} target can repeat the saving throw at the end of each of its turns, ending the effect on itself on a success. If they succeed, they are immune to this effect for 24 hours.</p>\n    <p></p>\n  </details>"
