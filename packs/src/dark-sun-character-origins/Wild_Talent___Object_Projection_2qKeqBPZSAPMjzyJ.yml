name: Wild Talent - Object Projection
type: feat
system:
  description:
    value: >-
      <p>Your force of will teleports an object a short distance away. As an
      action, you can teleport a tiny object you are holding in one hand to an
      unoccupied square within 30 feet of you or to a willing creature within 30
      feet of you. You can use this feature a number of times equal to your
      proficiency bonus. You regain all uses when you finish a long rest.</p>
