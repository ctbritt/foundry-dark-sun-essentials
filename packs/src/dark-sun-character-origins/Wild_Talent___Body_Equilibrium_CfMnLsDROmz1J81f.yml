name: Wild Talent - Body Equilibrium
type: feat
system:
  description:
    value: "<p>You\_sense how to shift your weight from step to step, staying atop a tricky surface. You gain proficiency in the @Compendium[dnd5e.rules.0AGfrwZRzSG0vNKb]{acrobatics} skill. If you are already proficient, your bonus is doubled if it is not being doubled by another feature. As a bonus action, you ignore difficult terrain when moving over soft or brittle terrain, such as dust, silt, mud, snow, or thin ice. This effect lasts until the end of your next turn. You can use this feature a number of times equal to your proficiency bonus. You regain all uses when you finish a long rest.</p>"
