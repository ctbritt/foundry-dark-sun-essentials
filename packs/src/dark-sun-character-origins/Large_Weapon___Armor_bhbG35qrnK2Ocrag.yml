  description:
    value: >-
      <p>All personal items, such as clothing, armor, weapons, and food, cost
      double for half-giant characters. Transportation and lodging, when they're
      available at all, are also considerably more expensive. Most things aren't
      built to support the weight of a half-giant, and even in the cities
      half-giants tend to camp outside for their own comfort and to avoid
      causing any damage. Due to the size of your weapon, your weapon damage is
      doubled.</p>
