  description:
    value: >-
      <p>At 5th level, you gain a second breath weapon. When you take the Attack
      action on your turn, you can replace one of your attacks with an
      exhalation in a 15-foot cone. The save DC is [[@abilities.con.dc]].
      Whenever you use this trait, choose one:</p><ul><li><p><strong>Enervating
      Breath.</strong> Each creature in the cone must succeed on a [[/save con
      format=long]] or become &amp;Reference[incapacitated] until the start of
      your next turn.</p></li></ul><ul><li><p><strong>Repulsion Breath.</strong>
      Each creature in the cone must succeed on a [[/save str format=long]] or
      be pushed 20 feet away from you and be knocked
      &amp;Reference[prone].</p></li></ul><p>Once you use your Exalting Breath
      Weapon, you can’t do so again until you finish a long rest.</p>
