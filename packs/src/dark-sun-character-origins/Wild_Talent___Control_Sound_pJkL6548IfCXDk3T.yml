name: Wild Talent - Control Sound
type: feat
system:
  description:
    value: >-
      <p>As an action, create a 5 foot aura of sound dampening around you that
      lasts for a number of rounds equal to your proficiency bonus. Any speech
      into or out of this aura is muffled enough to be incomprehensible, and
      creatures within gain advantage on hearing-based
      @Compendium[dnd5e.rules.0AGfrwZRzSG0vNKb]{Stealth} checks and have
      resistance to thunder damage. You can use this feature a number of times
      equal to your proficiency bonus. You regain all uses when you finish a
      long rest.</p>
