      and a belt
      @UUID[Compendium.dnd-players-handbook.equipment.phbagPouch000000]{Pouch}
      containing 20 ceramic pieces.</p><p><strong>Suggested
      Characteristics:</strong> You have lived hidden away in seclusion and
      contemplation - perhaps by your own choice or perhaps because you were
      outcast from wider society. In your time apart from the clamor of
      civilization, you found quiet and solitude. Whether that isolation has
      resulted in enlightenment or madness is open for debate. As a hermit you
      exist outside of the caste system, how the templars and other civil
      authorities treat you is dependent in part on your behavior and in part on
      your own power.</p>
