system:
  description:
    value: >-
      <div class="fvtt narrative"><p>“Remember the intensity of your focus.
      Breaking or ignoring your focus will be detrimental to both your body and
      mind. There is no greater satisfaction than fulfilling a difficult focus.
      Be serious and sober, always. The only time to be festive is when you have
      recently fulfilled your focus, during the hours or days until you set a
      new focus."</p><p style="text-align:right"><em>-Vows of the
      Focus</em></p></div><p>Dwarves of the tablelands have no city-states of
      their own, and many live alongside the other folk of Athas. In the
      Tablelands, no more than a handful of dwarf settlements are known to
      exist. Of those, Kled and the twin villages of North and South Ledopolus
      are the most prominent. The rest of the dwarven population lives in the
      human-dominated city-states or among the tribes that wander the desert
      wastes.</p><p>Dwarves reside both in cities and the countryside, and many
      tend to be builders and farmers instead of nomads or raiders. Despite the
      absence of their own city-state, dwarves still possess a rich cultural
      history passed down from generation to generation in great sagas and
      secret traditions.</p><h1>STOCKY AND RUGGED</h1><p>Short and powerful,
      dwarves stand between 4 and 5 feet tall and possess frames that are
      extremely massive; the average dwarf weighs in the vicinity of 200 pounds.
      Most dwarves have deep tanned complexions from lives spent toiling in the
      hot sun, with wide, calloused hands and feet. They usually sport little or
      no hair; the flowing beards commonly found in dwarven societies of other
      worlds are not seen on the dwarves of Athas in this era.</p><p>Life in the
      Athasian wastes has given the dwarves a rugged look. They prefer simple
      and practical clothing that is sturdy and unadorned, a set of clothes that
      is durable in their span of toiling in the harsh lands.</p><h1>Laborious
      Folk</h1><p>Typical dwarves embrace work with joy, otien giving themselves
      over to a favorite cause or task. They are a stoic people, to whom
      compromise doesn't come easily. Dwarf soldiers, laborers, and crafters are
      common, though members of this species can be found among all sections of
      society found in the city-states — the templars, nobles, merchants,
      freemen, and slaves.</p><p>Dwarves in general are a tight-knit people, and
      many pass down their industrious skills in crafting. They make excellent
      artisans and merchants, specializing in either the craftsmanship of
      handicrafts, weapons, and armor, or the trade thereof.</p><p>While they
      can serve the city or their tribe as warriors, followers of the Way, or
      healers, their most important contribution to their community is centered
      on that which they decide to focus on.</p><h1>Persistent
      Minds</h1><p>Dwarves are known for their stoicism and devotion to a goal
      they call their focus. They prefer to occupy themselves with meaningful
      tasks and otien approach these tasks with an intensity rarely seen in
      other species.</p><p>Once they fix their minds on the task at hand, be it
      a challenging feat of engineering, an intricate work of craft, a struggle
      for survival, or a quest for revenge, it's impossible to abandon it or
      leave the work half done.</p><p>Dwarves will simply fail to listen to
      reason and will treat any who hinder them as obstacles that must be
      removed. On the other hand, people who help a dwarf accomplish its task or
      share its goals are treated with respect and considered good
      companions.</p><p>The commitment to a single task is called a dwarf's
      focus. A dwarf will work to complete its focus above all else, for the
      compulsion to succeed is part of a dwarf’s nature.</p><p>They literally
      live for their focus; if a dwarf dies without completing its focus, the
      need remains so strong that the dwarf may return as an undead to finish
      the task that drives it.</p><h1>DWARVEN NAMES</h1><p>A dwarf receives its
      common name from a community leader, who usually grants it to them after
      they have completed their first focus, in accordance with their ancient
      traditions. Thus, they jealously strive to honor their names and never
      misuse or bring shame to them.</p><p><strong>Male Names</strong>: Birgaz,
      Bontar, Brui, Caelum, Caro, Daleel, Drog, Ghedran, Gralth, Gundar, Harak,
      Jo'orsh, Jurgan, Kov, Krom, Lian, Lodo, Ltak, Lyanius, Murel, Nati,
      Portek, Rkard, Sa'ram, Sult, Veso.</p><p><strong>Female Names</strong>:
      Ardin, Erda, Ghava, Greshin, Gudak, Fyra, Kesi, Lazra, N'kadir, Palashi,
      Vashara.</p><h1>DWARVEN TRAITS</h1><p>Your dwarf character has an
      assortment of inborn abilities, part and parcel of Athasian dwarven
      nature.</p><p><strong>Age</strong>. Dwarves mature at the same rate as
      humans, but they're considered young until they reach the age of 35. On
      average, they live about 200 years.</p><p><strong>Size</strong>. Dwarves
      stand between 4 and 5 feet tall and average about 200 pounds. Your size is
      Medium.</p><p><strong>Creature Type</strong>:
      Humanoid</p><p><strong>Speed</strong>. Your base walking speed is 25 feet.
      Your speed is not reduced by wearing heavy
      armor.</p><p><strong>Darkvision</strong>. You have Darkvision with a range
      of 60 feet.</p><p><strong>Dwarven Focus</strong>. Whenever you make an
      ability check or a saving throw directly related to your focus, you can
      roll a d4 and add it to the total. You can use this trait a number of
      times equal to your Proficiency Bonus, and you regain all expended uses
      when you finish a Long Rest.</p><p><strong>Dwarven Resilience</strong>.
      You have Resistance to Poison Damage. You also have Advantage on saving
      throws you make to avoid or end the Poisoned Condition on
      yourself.</p><p><strong>Dwarven Toughness</strong>. Your Hit Point Maximum
      increases by 1, and it increases by 1 again whenever you gain a
      level.</p><p><strong>Forge Wise</strong>. You have an uncanny affinity for
      working with stone or metal. You gain Tool Proficiency with two of the
      following options of your choice: Jeweler’s Tools, Mason’s Tools, Smith’s
      Tools, or Tinker’s Tools.</p><p><strong>Languages</strong>. You can speak,
      read, and write Common and Dwarvish. Dwarvish is full of hard consonants
      and guttural sounds, and those characteristics spill over into whatever
      other language a dwarf might speak.</p><h1>DWARVEN FOCUS</h1><p>A dwarf's
      focus is the central point of its existence. Nothing is more rewarding to
      a dwarf than to complete its focus. But no simple job can be such a focus;
      anything taking a few days to complete is too simple a task to be
      considered a focus. While working to complete it, dwarves receive a bonus
      to any task, provided they are directly related to their focus as detailed
      above.</p><p>Work with your DM to come up with a focus that your character
      begins with, and with a new one every time you finish yours. It shouldn't
      be an easy or mundane task, and it should take at least one week to
      complete. It could also be linked to your adventures or be something
      different altogether.</p><p>At your DM's permission, you may be bound to
      earn inspiration whenever you successfully complete your focus.</p>
