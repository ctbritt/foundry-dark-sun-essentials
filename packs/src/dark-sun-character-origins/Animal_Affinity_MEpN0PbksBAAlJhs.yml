  description:
    value: >-
      <p>At 3rd level, you can you can use an Action to attempt to charm a
      medium size or smaller beast with Intelligence 3 or lower. You must be
      able to touch and talk to the beast. If your or your companions are
      fighting the beast, it cannot be charmed. It must pass a Wisdom save or be
      charmed for 24 hours. The saving throw is 8 + your proficiency bonus +
      your Wisdom modifier. If you or your companions do anything harmful to the
      beast, the charm ends. You cannot use this trait again until you complete
      a long rest.</p>
