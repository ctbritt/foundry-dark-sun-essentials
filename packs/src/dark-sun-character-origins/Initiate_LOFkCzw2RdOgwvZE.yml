      <p><strong>Ability Scores</strong>: &amp;Reference[con],
      &amp;Reference[int], &amp;Reference[wis]</p><p><strong>Skill
      Proficiencies:</strong> &amp;Reference[his], plus one from among
      &amp;Reference[arc], &amp;Reference[ins], &amp;Reference[nat], or
      &amp;Reference[rel], as appropriate for your order.</p><p><strong>Tool
      Proficiencies:</strong>
      @UUID[Compendium.dnd-players-handbook.equipment.phbtulCalligraph]{Calligrapher's
      Supplies} or a second language of your
      choice</p><p><strong>Languages:</strong> One of your
      choice</p><p><strong>Feat:</strong>
      @UUID[Compendium.dark-sun-essentials.dark-sun-feats.gso4BrUPEMykqN06]{Initiate
      (Psionic)} or
      @UUID[Compendium.dark-sun-essentials.dark-sun-feats.qYFandmqCBcRGUeV]{Initiate
      (Arcane )}, or
      @UUID[Compendium.dnd-players-handbook.feats.phbftHealer00000]{Healer}
      (select one)</p><p><strong>Equipment:</strong> A
      @UUID[Compendium.shareddata.ddb-items.ZPIhdGStNr72d3oa]{Robes},
      @UUID[Compendium.dnd-players-handbook.equipment.phbagParchment00]{Parchment}
      (10),
      @UUID[Compendium.dnd-players-handbook.equipment.phbtulCalligraph]{Calligrapher's
      Supplies} or
      @UUID[Compendium.dnd-players-handbook.equipment.phbagHealersKit0]{Healer's
      Kit}, a
      @UUID[Compendium.dnd-players-handbook.equipment.rvz6gQc3OcOMgIQz]{Crowbar},
      an elemental symbol, and a belt pouch containing 3 ceramic
      pieces</p><p>Suggested Characteristics: As a member of a cult, temple,
      psionic academy, or arcane cabal you have been initiated into the esoteric
      mysteries of your order. You possess extraordinary insight into these
      mysteries and as such are held in fear or awe by the general populace. The
      nature of your order determines how openly you are able to flaunt your
      affiliation. While psionic orders and temples dedicated to locally
      accepted religions are able to operate openly, members of underground
      cults or sorcerous cabals can face execution if their allegiance is
      uncovered.</p><p></p>
