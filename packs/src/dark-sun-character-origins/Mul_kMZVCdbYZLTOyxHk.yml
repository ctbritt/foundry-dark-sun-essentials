      <div class="fvtt narrative"><p>Who am I? I am Darius, once a slave serving
      a patrician in the city of Balic. The noble raised me to battle in the
      Criterion, to spill the blood of my enemies, revel in the cheers of the
      crowd, and fill the pockets of my master with silver and gold. But now I
      am free of my bonds, outlawed in Balic, and a member of this tribe. I know
      that I have tasted freedom, and it is very sweet. I never want to thirst
      for it again, toiling for a master while my spirit withers beneath the hot
      sun of bondage.</p></div><p class="p2"><span
