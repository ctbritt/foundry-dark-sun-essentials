      class="rd__b  rd__b--0"><div class="rd__b  rd__b--1"><div
      class="rd__b-special rd__b-inset "><p><strong>ROLEPLAYING A
      MUL</strong></p><p>Born to the slave pens, you never knew love or
      affection; the taskmaster’s whip took the place of loving parents. As far
      as you have seen, all of life’s problems that can be solved are solved by
      sheer brute force. You know to bow to force when you see it, especially
      the veiled force of wealth, power and privilege. The noble and templar may
      not look strong, but they can kill a man with a word. You tend towards
      gruffness. In the slave pits, you knew some muls that never sought friends
      or companionship, but lived in bitter, isolated servitude. You knew other
      muls who found friendship in an arena partner or co– worker. You are
      capable of affection, trust and friendship, but camaraderie is easier for
      you to understand and express – warriors slap each other on the shoulder
      after a victory, or give their lives for each other in battle. You don’t
      think of that sort of event as “friendship” – it just happens.</p><p>Muls
      dislike what they fear, and they fear wizards. They resent that a wizard’s
      power comes from without, with no seeming effort on the wizard’s part,
      while the mul’s power is born of pain and labor. You may never have been
      exposed to psionic study or clerical ways, but there is nothing preventing
      you from learning.</p><div><div class="rd__b  rd__b--0"><div class="rd__b 
      rd__b--1"><div class="rd__b  rd__b--2"><p><strong>MUL
      NAMES</strong></p><p><span class="entry-title-inner">Muls are given names,
      and for gladiators, Draji names with harsh tones are favored to strike
      fear. Lacking families, a mul might use a place for a surname, such as
      “Mersten of Nibenay.”</span></p><p><span
      class="entry-title-inner"><strong>Male Names:</strong> Aram, Athalak,
      Borthomar, Bost, Darok, Darus, Durn, Eben, Erekard, Gard, Harask, Marok,
      Morg, Rikard, Sanozar, Tomak, Uskan, Zedath, Zorus.</span></p><p><span
      class="entry-title-inner"><strong>Female Names:</strong> Aisa, Aivel,
      Brithis, Callia, Demosis, Elina, Faivel, Himithis, Laivi, Mersten,
      Narisel, Raina, Reshel, Saditha, Tirshel, Uisel,
      Zerima.</span></p></div></div></div></div></div></div></div></div><p
      class="p4"><strong>MUL</strong><span class="s5"><strong>
