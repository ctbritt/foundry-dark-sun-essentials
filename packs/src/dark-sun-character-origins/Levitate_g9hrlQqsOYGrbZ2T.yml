name: Levitate
type: feat
system:
  description:
    value: >-
      As an action, you can vertically move your body (clothing and equipment
      don't count) plus up to [[10*level]] pounds up to 10 feet in the air. At
      the end of your next turn, you gently float to the ground. Movement while
      aloft is the same as the levitate spell. You can use this feature +
      [[@prof]] times. You regain all uses when you finish a long rest.
