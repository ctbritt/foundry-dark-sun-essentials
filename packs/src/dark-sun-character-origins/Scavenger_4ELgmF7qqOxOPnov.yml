      @UUID[Compendium.dnd-players-handbook.feats.phbftSavageAttac]{Savage
      Attacker}</p><p><strong>Equipment:</strong> A set of
      @UUID[Compendium.shareddata.ddb-items.ski4qdvVUyNWkTX2]{Clothes, Common},
      a small bag of useful odds and ends,
      @UUID[Compendium.dnd-players-handbook.equipment.phbtulThievesToo]{Thieves'
      Tools}, and a belt pouch containing 10 ceramic
      pieces.</p><p><strong>Suggested Characteristics</strong>: Scavengers are
      resourceful and opportunistic, always on the lookout for valuable finds.
      They are adept at making the most out of limited resources and have a keen
      eye for hidden potential. Knowing the scarcity of materials on Athas, they
      allow nothing to go unused and frown upon wasteful practices.</p><p></p>
