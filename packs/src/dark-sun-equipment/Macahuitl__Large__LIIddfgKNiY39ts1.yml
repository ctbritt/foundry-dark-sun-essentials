system:
  description:
    value: >-
      <p>A macahuitl is a sword painstakingly crafted using a core of solid
      wood, with small, sharp shards of obsidian embedded into the wood to form
      an edge on two opposite sides of the weapon. The macahuitl is especially
      popular among the Draji, who seem to be the only ones who can easily
      pronounce this weapon’s Draji name (“ma‐ka‐wheet‐luh”). Non‐Draji simply
      refer to it as the “obsidian sword” or the “Draji sword.</p>
