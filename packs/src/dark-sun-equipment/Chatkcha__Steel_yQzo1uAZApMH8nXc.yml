system:
  description:
    value: >-
      <p>This small 3-bladed crystalline throwing wedge is made exclusively by
      thri-kreen in a secret process carefully guarded by them. In their
      language, it means “rememberer-who-ends-knowledge,” reflecting it ends
      awareness by killing and remembers to return to its thrower.</p>

      <p><strong>Special.</strong> Due to its spin it will return to a
      proficient thrower if it misses.</p>
