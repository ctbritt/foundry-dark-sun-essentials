system:
  description:
    value: "<p>Also known as the “gladiator’s gauntlet,” this is made of stiff leather with metal, chitin, or bone plating on the hand cover and along the forearm. Spikes protrude from the knuckles and along the back of the hand. A sharp blade runs along the thumb and there is a 6 inch spike on the elbow.</p><p>Breakage: 75%</p><p><strong>Versitile Damage.\_</strong>The Talid can deal slashing or bludgeoning\_<span style=\"font-family:var(--font-primary)\">damage instead of piercing damage.</span></p><p><strong>Immune Disarm. </strong>This weapon can't be disarmed from the wielder.</p><p><strong>Special. </strong>Melee attacks with this weapon count as unarmed strikes and deal one damage dice higher then normal (to a maximum of a d12) if Strength is used for the attack.</p>"
