system:
  description:
    value: >-
      <p>Wrist razors consist of a trio of blades that protrude from a heavy arm
      band. The razors project out over the back of the hand, are extremely
      sharp, and can be up to 6 inches long. Wrist razors can be worn on one or
      both forearms.</p><p>Breakage: 50%</p><p><strong>Immune Disarm.
      </strong>This weapon can't be disarmed from the
      wielder.</p><p><strong>Special. </strong>Melee attacks with this weapon
      count as unarmed strikes and deal one damage dice higher then normal (to a
      maximum of a d12) if Strength is used for the attack.</p>
