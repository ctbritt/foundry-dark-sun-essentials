system:
  description:
    value: >-
      <p>A pair of alhulak heads tied to either end of a 10-12-foot rope. As a
      melee weapon, the wielder holds one blade cluster in each hand and swings
      them in unison or succession at the foe.</p>

      <p><strong>Special. </strong>This type of weapon allows you many different
      ways to wield it: Holding each end of the Cahulak counts as having two
      one-handed melee weapons in each hand and counts as having two light
      weapons for two weapon fighting; Holding only one end allows you to make a
      one handed weapon attack with reach like an Alhulak; It can also been
      thrown, tangling around the target like a Net (no effect on Huge or
      larger, DC10 Strength check to free self or another) and causes 1d6 damage
      when the blades strike.</p>
