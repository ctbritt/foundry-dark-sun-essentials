  description:
    value: "<p>Worn on the forearm like a buckler, this weapon consists of a large, double-bladed axe on either end of a bracer with a spike protruding perpendicularly from the upper sheath. This weapon is particularly formidable in close-quarter fighting.</p>\n<p><strong>Versitile Damage.\_</strong>The Forarm Axe can deal piercing damage instead of slashing damage.</p>\n<p><strong>Special.</strong>\_<span style=\"font-family:var(--font-primary);font-size:var(--font-size-14)\">This weapon leaves your hand free enough to wield a tiny object or a weapon with the light property.</span></p>"
