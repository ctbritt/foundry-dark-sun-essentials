system:
  description:
    value: >-
      <p>This exotic weapon looks like a misshapen crossbow, only three feet
      long from bow to stock, but with a horizontal bow nearly five feet wide.
      Rather than bolts, the splashbow fires hinged pelotas, which are filled
      with splash<span class="s1">–</span>globes of acid, alchemical fire, or
      contact poisons. Splash<span class="s1">–</span>globes burst on impact,
      functioning as an acid flask, alchemist’s fire, or contact poison
      depending on the ammunition. The splashbow takes a full round to draw and
      load, assuming that the hinged pelotas have already been prepared.</p>
