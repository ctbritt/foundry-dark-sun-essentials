  description:
    value: >-
      <p>Popular in arenas, this is a 6-foot-long pole with a blade on either
      end.</p>

      <p>Breakage: 50%</p>

      <p><strong>Special.</strong> If you attack with a dragon paw as part of
      the Attack action on your turn, you can use a bonus action immediately
      after to make a melee attack with it. This attack deals 1d4 piercing
      damage on a hit, instead of 1d8.</p>
