system:
  description:
    value: >-
      <p>A bola consists of a length of cord with weights on each end or three
      to six weights tied to a center point. A creature hit by a bola is
      grappled until it is freed. A bola has no effect on creatures that are
      formless, or creatures that are Huge or larger. A creature can use its
      action to make a <span class="roll-link" data-type="check" data-dc="10"
      data-format="long" data-ability="str"><a data-action="roll"><i
      class="fa-solid fa-dice-d20"></i>DC 10 Strength check</a><a
      class="enricher-action" data-action="request"
      data-tooltip="EDITOR.DND5E.Inline.RequestRoll" aria-label="Request
      Roll"><i class="fa-solid fa-comment-dots"></i></a></span>, freeing itself
      or another creature within reach on a success. Dealing 5 slashing damage
      to the bola (AC 10) also frees the creature harmlessly by destroying the
      bola.</p>
