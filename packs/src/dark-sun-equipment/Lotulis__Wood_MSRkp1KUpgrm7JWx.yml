  description:
    value: "<p>Crescent blades with barbed spikes near the points and mounted at either end of a long shaft make this a nasty melee weapon.</p>\n<p>Breakage: 50%</p>\n<p><strong>Versitile Damage.\_</strong>The lotulis can deal slashing damage instead of piercing damage.</p>\n<p><strong>Special.</strong> If you attack with a lotulis as part of the Attack action on your turn, you can use a bonus action immediately after to make a melee attack with it. This attack deals 1d4 slashing damage on a hit, instead of 2d4.</p>"
