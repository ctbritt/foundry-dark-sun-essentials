system:
  description:
    value: >-
      <div class="rd__b  rd__b--2"><div class="rd__b  rd__b--3"><span
      class="rd__h rd__h--3" data-title-index="2"> <span
      class="entry-title-inner">Special.</span></span> <p>A Large or smaller
      creature hit by a net is @condition[restrained] until it is freed. A net
      has no effect on creatures that are formless, or creatures that are Huge
      or larger. A creature can use its action to make a DC 10 Strength check,
      freeing itself or another creature within its reach on a success. Dealing
      5 slashing damage to the net (AC 10) also frees the creature without
      harming it, ending the effect and destroying the net. When you use an
      action, bonus action, or reaction to attack with a net, you can make only
      one attack regardless of the number of attacks you can normally
      make.</p><div class="rd__spc-inline-post"></div></div></div>
