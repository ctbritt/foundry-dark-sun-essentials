pages:
  - name: Shipwright's Guild
    text:
      markdown: >-
        The Shipwrights' Guild is made up of the carpenters, ironworkers,
        fitters and craftsmen who operate the yards and repair docks on the
        Trailing Edge. There are few exceptional individuals in the ranks,
        although a couple of mages do belong to the guild. The Guild is an
        important society because it possesses a great deal of power.
        Merchantmen who do not play by their rules will find that their ships
        never receive the maintenance they require. The Guild is headed by
        **@UUID[JournalEntry.w49KsudJLnPfp1CP]{Irdana Shipwright}**, and
        operates from the Cuttle Tower. The Guild's only purpose is to protect
        the wages and status of the shipfitters of Bral.


        Symbol: Hammer and Angle. Membership: Any shipwright.
      format: 2
      content: >-
        <p>The Shipwrights' Guild is made up of the carpenters, ironworkers,
