        The **Scro** are a major spacefaring race.


        > "My people are impatient - I shall teach them patience. My people are
        cowards - I shall teach them courage.

        >  

        > My people think only of today - I shall teach them to think of
        tomorrow. My people lust for elven blood - this requires no teaching."  

        > - **Early Sayings of Dukagsh**


        ## Overview


        "... \[T\]he admirals of all other fleets now at war with the elves were
        doing what had to be done, following the words and plans of the Almighty
        Dukagsh, the Scro Father. Only by uniting all humanoids into the War of
        Revenge could the elves be driven from wildspace like sparrows in the
        claws of a gale."


        The scro are a highly militaristic and violent goblinoid race that are
        descended from orcish survivors of the first Unhuman War. After decades
        of careful preparation and planning, the scro finally began the opening
        stages of their long awaited War of Revenge, and by the time the Elven
        Imperial Navy took note of their incursion into the Known Spheres, the
        scro had already conquered two crystal spheres, cleansing them both of
        any elven presence, and had begun their invasion of a third.


        In an effort to bolster their forces, the scro actively recruit
        mercenaries and malcontents from all races, especially among the various
        goblinoid races. The scro promise them power and dominion over the Known
        Worlds, and in exchange they must swear fealty and recognise scro
        rulership (and pay their tribute on time). No spacefaring nation or
        organization has officially allied with the scro, though many
        individuals throughout wildspace work for them. In addition, several
        spacefaring nations have agreed to remain neutral should the goblinoids
        and elves go to war.


        ## Description


        > "Thanks."  

        > - **A scro general accepting a surrendering elven commander's sword,
        just before using the same weapon to kill the commander and his
        surviving troops.**


        The scro resemble musclebound orcs, but are larger, stronger, and far
        more intelligent. They average 6-feet in height, with long, sharp teeth.
        Their canine teeth are often filed to a point and inscribed with various
        totemic symbols and inset with tiny gems. Their skin tone varies in
        color from jet black to burnt orange, with various shades of grey, tan,
        and green in between (and, rarely, albino white). Their eyes have a
        phosphorescent glow which can be seen in dim light.


        Scro, like their orcish forbearers, can see up to 60 feet in darkness.
        However, they are less sensitive to daylight than orcs, and function
        normally in bright light. 


        The scro speak an archaic version of orcish, and many are also fluent in
        elvish: this is because their code urges them to learn the tongue of
        their ancient enemy - so that when the time comes to slaughter the elven
        people, the scro can tell their victims, in their own tongue, who is
        doing this to them. Some can also speak the common trade tongue, though
        the language isn't widespread.


        Scro are usually armed to the teeth and fully armored. They typically
        wear well oiled, well maintained studded leather, with each stud filed
        to a sharp point. The leather is always dyed jet black, though the studs
        may be painted different colors. Officers may wear heavier armor,
        particularly chain mail and splint mail, and often complete their
        wardrobe with a night-blue cloak. Scro do not carry standards, but
        individual warriors may wear an insignia identifying their tribe, either
        as a shoulder patch or on the left side of the chest.


        ## Behavior


        > "The hobgoblins won't work with the orcs, the goblins hunt the
        kobolds, and the ogres are too dumb to be trusted! The lot of them are
        only good for catapult loads!"  

        > - **Scro fleet officer with bugbear guard.**


        The scro are a militaristic people, and their entire lives are
        regimented and oriented around the military hierarchy, with larger and
        more powerful scro serving in higher positions. Where other race's may
        choose to serve in the pursuit of glory and fame, the scro seek mayhem,
        destruction, and the devastation of their enemies.


        The scro have an "us against the whole universe" mindset which puts them
        at odds with nearly everyone they encounter, and ensures they have
        plenty of enemies to go around. Due to their careful planning and
        intelligence gathering, the scro know a great deal about other
        spacefaring races, but they strive to ensure that others remain ignorant
        of their own existence, save for a few rumors from unreliable sources.


        The scro recruit lesser goblinoid races to strengthen their numbers,
        often deploying them as shock troops and in other disagreeable roles,
        freeing up highbred scro warriors for more important tasks. Of course
        the various goblinoids do not coexist in harmony, and relationships
        between various groups are often riven by intense feuds, especially
        between the bugbears and hobgoblins, and between the goblins and the
        kobolds. One race that the scro are notably hesitant to recruit are the
        orcs. The scro feel nothing but disdain for their cousins, and many orc
        tribes will have nothing to do with the scro. Certain scro commanders
        even go out of their way to send orcish auxiliaries into ambushes and
        deathtraps, reducing their numbers significantly.


        ## Combat


        Scro live for war, and in their society combat is seen as the highest
        form of expression. They are comfortable fighting in most environments
