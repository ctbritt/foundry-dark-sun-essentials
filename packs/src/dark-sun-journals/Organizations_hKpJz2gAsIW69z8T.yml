        <table style="width:100%;border:none;background:transparent"><tbody><tr
        style="background:transparent"><td
        style="vertical-align:top;width:70%;padding:2rem"><p>The Arcane
        Brotherhood is a wizards' guild that operates out of the Arcane Sanctum
        in Chambon. Little is known about its internal governance other than
        that it is ruled by a council of seven highly powerful wizards, the
        first among whom is Caeldrim Whitney, the effective ruler of the
        Magocracy of Marithel.</p><p>Every year, scores of wizards from across
        Azthir-Terra flock to the Sanctum, hoping to gain admittance into the
        prestigious ranks of the brotherhood. Nearly all candidates are
        dismissed out of hand, without so much as a test. Yet wizards seem
        willing to debase themselves regardless, for admittance to the
        brotherhood grants access to the Hosttower’s incredible libraries of
        magical lore.</p></td><td
        style="vertical-align:top;width:30%;padding:0;margin:0"><img
