        If all else fails, a scro can bite with its powerful jaws. Scro consider
        it especially noteworthy to kill an enemy with just their teeth, and
        will often finish off wounded foes with a savage bite. A scro who kills
        an opponent with its teeth may attach a bauble or inset a small gem in
        one of its oversized canines. They will then take a tooth from their
        deceased opponent and place it on a necklace called a _toregkh_. This
