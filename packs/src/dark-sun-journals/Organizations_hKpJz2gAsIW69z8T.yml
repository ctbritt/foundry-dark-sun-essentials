  - name: Yakuza
    text:
      markdown: >-
        The Yakuza are a well-organized guild under the leadership of
        @UUID[JournalEntry.wv854SLrjw1rEuBV]{Ozamata Murawa}, one of the city's
        Underbarons. They are the undisputed masters of Shou-Town and most of
        the Low City and prefer to operate through extortion and racketeering,
        rather than burglary or territorial wars. The Yakuza of Bral number
        about 40, and Ozamata, as an Underbaron, can easily muster 50 to 60
        thugs and fighters should things get ugly. No Shou will willingly betray
        the Yakuza. (Use the Thug stat block)


        **Symbol:** Tattoos.  

        **Membership:** Bralian-born Shou. 

        **Agenda:** Maintain status quo.
      format: 2
      content: >-
