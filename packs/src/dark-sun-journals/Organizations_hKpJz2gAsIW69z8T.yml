  - sort: 2000
    name: Sco Empire
    type: text
    _id: igLdRVanhOjUiqeC
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 2
      content: >-
        <p>The <strong>Scro</strong> are a major spacefaring
        race.</p><blockquote><p>“My people are impatient - I shall teach them
        patience.</p><p>My people are cowards - I shall teach them
        courage.</p><p>My people think only of today - I shall teach them to
        think of tomorrow.</p><p>My people lust for elven blood - this requires
        no teaching.”</p><ul><li><p><strong>Early Sayings of
        Dukagsh</strong></p></li></ul></blockquote><h2>Overview</h2><p>"… [T]he
        admirals of all other fleets now at war with the elves were doing what
        had to be done, following the words and plans of the Almighty Dukagsh,
        the Scro Father. Only by uniting all humanoids into the War of Revenge
        could the elves be driven from wildspace like sparrows in the claws of a
        gale."</p><p>The scro are a highly militaristic and violent goblinoid
        race that are descended from orcish survivors of the first Unhuman War.
        After decades of careful preparation and planning, the scro finally
        began the opening stages of their long awaited War of Revenge, and by
        the time the Elven Imperial Navy took note of their incursion into the
        Known Spheres, the scro had already conquered two crystal spheres,
        cleansing them both of any elven presence, and had begun their invasion
        of a third.</p><p>In an effort to bolster their forces, the scro
        actively recruit mercenaries and malcontents from all races, especially
        among the various goblinoid races. The scro promise them power and
        dominion over the Known Worlds, and in exchange they must swear fealty
        and recognise scro rulership (and pay their tribute on time). No
        spacefaring nation or organization has officially allied with the scro,
        though many individuals throughout wildspace work for them. In addition,
        several spacefaring nations have agreed to remain neutral should the
        goblinoids and elves go to
        war.</p><h2>Description</h2><blockquote><p>"Thanks."</p><ul><li><strong>A
        scro general accepting a surrendering elven commander's sword, just
        before using the same weapon to kill the commander and his surviving
        troops.</strong></li></ul></blockquote><p>The scro resemble musclebound
        orcs, but are larger, stronger, and far more intelligent. They average
        6-feet in height, with long, sharp teeth. Their canine teeth are often
        filed to a point and inscribed with various totemic symbols and inset
        with tiny gems. Their skin tone varies in color from jet black to burnt
        orange, with various shades of grey, tan, and green in between (and,
        rarely, albino white). Their eyes have a phosphorescent glow which can
        be seen in dim light.</p><img
        src="s3/tokens/drakthar_bloodfist.Avatar.webp"
        style="width:50%;-webkit-mask-size:100%
        100%;-webkit-mask-image:url('modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;float:left"
        /><p>Scro, like their orcish forbearers, can see up to 60 feet in
        darkness. However, they are less sensitive to daylight than orcs, and
        function normally in bright light.</p><p>The scro speak an archaic
        version of orcish, and many are also fluent in elvish: this is because
        their code urges them to learn the tongue of their ancient enemy - so
        that when the time comes to slaughter the elven people, the scro can
        tell their victims, in their own tongue, who is doing this to them. Some
        can also speak the common trade tongue, though the language isn't
        widespread.</p><p>Scro are usually armed to the teeth and fully armored.
        They typically wear well oiled, well maintained studded leather, with
        each stud filed to a sharp point. The leather is always dyed jet black,
        though the studs may be painted different colors. Officers may wear
        heavier armor, particularly chain mail and splint mail, and often
        complete their wardrobe with a night-blue cloak. Scro do not carry
        standards, but individual warriors may wear an insignia identifying
        their tribe, either as a shoulder patch or on the left side of the
        chest.</p><h2>Behavior</h2><blockquote><p>"The hobgoblins won't work
        with the orcs, the goblins hunt the kobolds, and the ogres are too dumb
        to be trusted! The lot of them are only good for catapult
        loads!"</p><ul><li><strong>Scro fleet officer with bugbear
        guard.</strong></li></ul></blockquote><p>The scro are a militaristic
        people, and their entire lives are regimented and oriented around the
        military hierarchy, with larger and more powerful scro serving in higher
        positions. Where other race's may choose to serve in the pursuit of
        glory and fame, the scro seek mayhem, destruction, and the devastation
        of their enemies.</p><p>The scro have an "us against the whole universe"
