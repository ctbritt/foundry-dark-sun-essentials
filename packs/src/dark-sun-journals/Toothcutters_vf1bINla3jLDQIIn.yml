        wgCeShTrqHJFBbDr:
          notes: >-
            <p>Role in Adventures: The Toothcutters represent organized crime's
            stranglehold on Tyr's poorest district. Their connection to Council
            member @UUID[JournalEntry.8iJuMRTRr9o7j5ut]{Shivrin} creates
            potential for political corruption scandals or opportunities to
            leverage legitimate political power for criminal ends. They can
            serve as antagonists for parties trying to clean up the Warrens,
            sources of information about criminal activities, or reluctant
            allies if properly motivated. Their protection racket means they
            have extensive knowledge of local businesses and residents.</p>
