    text:
      format: 1
      content: "<p>Elven Protection Racket - Dominant Gang, the Warrens</p>\n<p>This pack of murderous elves controls the largest swath of the Warrens. Many shops within (and outside) the Warrens pay protection money to the Toothcutters. The influential half-elf Shivrin has a secret association with this gang.</p>\n<p>\_</p>"
