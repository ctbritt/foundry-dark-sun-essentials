    text:
      format: 1
      content: >-
        <p>The client villages may participate in the city market, but</p>

        <p>records are kept of the amount of trade goods that each client</p>

        <p>village brings through the city gates. If a client village
        appears</p>

        <p>to be generating more than the templars have estimated it to be</p>

        <p>capable of, it is reassessed with heavier taxes. Each client
        village</p>

        <p>is authorized to bring only certain types of grain or livestock</p>

        <p>into the city market.</p>

        <p>Client villagers may trade directly with merchants who</p>

        <p>travel through their village. The restrictions on the goods that</p>

        <p>can be brought to Gulg by a given client village, however,
        prevents</p>

        <p>them from reselling goods purchased from merchants.</p>
