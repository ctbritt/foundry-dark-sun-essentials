    text:
      format: 1
      content: >-
        <p>Lord Agis represents the idealistic hope of what Tyr could become—a
        nobleman who genuinely believes in balanced governance and cooperation
        between former slaves and traditional power structures. A master
        psionicist trained in the Way of the Unseen alongside his childhood
        friend Tithian, Agis spent years traveling Athas learning from masters
        like the thri-kreen druid Durwadala, gaining agricultural knowledge that
        made his estates the most fertile in the Tyr valley. He was instrumental
        in Kalak's assassination, literally driving the magical heartwood spear
        through the sorcerer-king's brain, and helped establish the Council of
        Advisers that now governs in Tithian's absence.</p><p>Recent events have
        taken a dark turn, however, as Agis's investigations into Tithian's
        suspicious activities—missing persons, diverted templar funds, strange
        emanations from the Golden Tower—have led to his own disappearance. His
        fate serves as a compelling mystery that could rally opposition to
        Tithian's conspiracy. If rescued, Agis would prove an invaluable ally
        with his combination of political legitimacy, psionic power, and moral
        authority. His personal stake in Tyr's future and principled stance
        against corruption make him a natural leader for those who hope to see
        the city evolve into something better than just another oppressive
        city-state.</p>
