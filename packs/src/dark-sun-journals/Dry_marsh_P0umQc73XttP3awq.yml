    text:
      format: 1
      content: "<p>The city-state of Draj rises out of the southwest portion of a region of salt marshes, scrub plains, dust\_sinks, and mudflats known as the Dry Marsh. Great\_stands of saw-edged grasses and dryreeds sighing in\_the wind dot the dusty marsh bed, forming a natural\_labyrinth known as the\_ Maze of Draj. Skilled Draji\_workers venture deep into the maze, sometimes on\_stilts, to cut huge bundles of reeds that can be fashioned into floor mats and light walls by the city’s\_weavers. In addition, Draji hunters and trappers take\_an assortment of small game here. Escaped slaves\_hide\_ in the Dry Marsh, eking out a precarious living\_and avoiding the hungry monsters in the area.</p>"
