      content: "<p>WALlS</p>\n<p>Site of the only gold mine known to exist on Athas,\_Walis is a tiny village atop a high spire of rock within\_a canyon in the foothills of the Ringing Mountains.\_A massive cargo bucket let up and down by slaves in\_a crankhouse tower controls access to the community.\_</p>\n<p>Walls is a client village under the control of\_the city-state of Balic and administered by House Tomblador. In addition to Tomblador’s outpost in\_Walis, two templars of the sorcerer-king Andropinis\_and a small detachment of\_ legionaries keep an eye\_on the village. The Balican templars allow Tomblador\_agents to do as they wish.\_</p>\n<p>The gold mine lies at the canyon’s throat. Each day\_a working party of village slaves is let down from the\_crankhouse and escorted to the mine under the sharp\_eyes of overseers. The miners produce only a pittance\_of gold,\_ but it’s enough to sustain the operation.\_Suspicion greets the few visitors who come to\_Walis. Those whose stories check out can stay in the\_Yellow House, a hostelry and stable maintained at the\_spire’s foot.</p>"
