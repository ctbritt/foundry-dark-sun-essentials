      content: "<p>Murter Dyan</p>\n<p>Holds partial interest in Tyr's iron mines and secretly belongs to \"the True\"—a group of holdouts still hoping for Kalak's return. This makes him a potential traitor within the government structure and a useful character for introducing plots involving loyalists to the old regime or those who would prefer any strong ruler to the current democratic chaos.</p>\n<p>\_</p>"
