      content: "<section id=\"h.3ecd82f9be0efde6_24\" class=\"yaqOZd\" style=\"display:table;box-sizing:border-box;background-size:cover;position:relative;table-layout:fixed;width:1661px;padding-bottom:1.5rem;padding-top:1.5rem;font-family:sans-serif;font-size:16px\">\n<div class=\"mYVXT\" style=\"box-sizing:border-box;display:table-cell;vertical-align:middle;width:1661px\">\n<div class=\"LS81yb VICjCf\" style=\"box-sizing:border-box;width:1280px;margin:0px auto;max-width:1280px;padding-left:48px;padding-right:48px;outline:0px\" tabindex=\"-1\">\n<div class=\"hJDwNd-AhqUyc-uQSCkd purZT-AhqUyc-II5mzb pSzOP-AhqUyc-qWD73c JNdkSc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1184px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\n<div class=\"oKdM2c Kzv0Me\" style=\"box-sizing:border-box;width:1154.41px;margin-top:0px;margin-bottom:0px;max-width:1280px\">\n<div id=\"h.3ecd82f9be0efde6_21\" class=\"hJDwNd-AhqUyc-uQSCkd jXK9ad D2fZ2 OjCsFc wHaque GNzUNc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1154.41px;white-space:pre-wrap;overflow-wrap:break-word\">\n<div class=\"jXK9ad-SmKAyb\" style=\"box-sizing:border-box;width:1154.41px\">\n<div class=\"tyJCtd mGzaTb baZpAe\" style=\"box-sizing:border-box;position:relative;width:1154.41px;padding:8px\">\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;padding-bottom:0px\">The Veiled Alliance: The Veiled Alliance remains active in the wake of this new age of wizardly openness. Matthias Morthen (male human/18th-level preserver/LG) continues to lead a small number of preservers who feel that secrecy must be maintained until all of Kalak’s defilers have been eradicated and the citizens of Tyr learn to deal with the responsibilities of freedom, Besides, Morthen doesn’t like or trust Sadira, whom he believes has often approached the moral line between defiling and preserving magic (if not actually crossed over it) in the course of defending Tyr. He believes that the veiled Alliance must continue, if only to serve as a balance for a wizard whose powers and motivations he doesn’t fully understand.</p>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<section id=\"h.3ecd82f9be0efde6_40\" class=\"yaqOZd\" style=\"display:table;box-sizing:border-box;background-size:cover;position:relative;table-layout:fixed;width:1661px;padding-bottom:1.5rem;padding-top:1.5rem;font-family:sans-serif;font-size:16px\">\n<div class=\"IFuOkc\" style=\"box-sizing:border-box;background-size:cover;display:table-cell;table-layout:fixed;height:20236.8px;left:0px;pointer-events:none;position:absolute;top:0px;width:1661px\">\_</div>\n<div class=\"mYVXT\" style=\"box-sizing:border-box;display:table-cell;vertical-align:middle;width:1661px\">\n<div class=\"LS81yb VICjCf\" style=\"box-sizing:border-box;width:1280px;margin:0px auto;max-width:1280px;padding-left:48px;padding-right:48px;outline:0px\" tabindex=\"-1\">\n<div class=\"hJDwNd-AhqUyc-uQSCkd purZT-AhqUyc-II5mzb pSzOP-AhqUyc-qWD73c JNdkSc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1184px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\n<div class=\"oKdM2c Kzv0Me\" style=\"box-sizing:border-box;width:1154.41px;margin-top:0px;margin-bottom:0px;max-width:1280px\">\n<div id=\"h.3ecd82f9be0efde6_37\" class=\"hJDwNd-AhqUyc-uQSCkd jXK9ad D2fZ2 OjCsFc wHaque GNzUNc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1154.41px;white-space:pre-wrap;overflow-wrap:break-word\">\n<div class=\"jXK9ad-SmKAyb\" style=\"box-sizing:border-box;width:1154.41px\">\n<div class=\"tyJCtd mGzaTb baZpAe\" style=\"box-sizing:border-box;position:relative;width:1154.41px;padding:8px\">\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Overview</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Campaign style: Undefined.</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">With King Kalak dead, Tyr's members hotly de- bate a central issue: Divulgence. Those who argue for immediate revelation include several Myrmeleons. Others favor continued secrecy. On each side a few members argue for a middle course of gradual revelation. In this turbulent time, the player characters can exercise decisive influence. If they support Divulgence, they face the long-term challenge of revealing the Alliance to the public without invoking a mob attack. </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Culture: For months after Kalak's failed attempt to attain dragon form by killing the city's entire population in the gladiatorial arena, citizens refused to return there. They still followed the blood sports fanatically, but only in informal bouts in the marketplace or other meeting places about the city. </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Now a group of enterprising gladiators and veterans have reopened the arena with official approval, charging an admission of 2 ceramic pieces (half price for children) for an afternoon's gory entertainment.</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">In times past Tyrians also sought diversion in singing (dissonant yet strangely moving melodies) and dancing (a vigorous, rhythmic stomping). The visual arts found their highest expression in elaborate and colorful skin tattoos. In these unsettled times, though, few can afford to indulge their vanity or appetite for </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">leisure.</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\">\_</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">History</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Tyr's Alliance, now some 400 to 500 years old, has endured longer than all </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\"> Alliance chapters. In the king's ages since, the Alliance here struggled against </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\"> Kalak's particularly vigorous persecution.</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Simple survival has become its most notable suc- cess.</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">The society owes much of that success to its long- time leader, a transmuter named </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Acritus. For three centuries, or so legend says, Acritus diligently fol- lowed the Five </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Aims and the principle of requital, permitting no controversy on that sensitive </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">point. He owed his success to a keen understanding of Ka- lak's mentality. Legend </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">claims Acritus gained this understanding as a boy, when he studied </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">psionic disciplines with Kalak himself, but few believe this legend today.</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Much given to shapeshifting magic, he evaded certain doom on at least two </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">occasions by its use. Acritus polyymorphed a volunteer or prisoner (ac- counts </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">disagree on this point) into a copy of Acri- tus's own form, then had the </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">subject slain in public (or apparently slain, again accounts disagree). In both cases, </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\"> though the victim's death dispelled the shapeshift, too little remained of the </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">body to allow identification.</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\">\_</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">The aforementioned uncertainty of historical ac- counts suffuse almost all </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">matters involving Acritus. His greatly extended lifespan, triple the human norm, </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">has led to much speculation that the original Acritus died after a normal </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">lifespan, and a dynasty of wizards impersonated him in the following centu- ries. </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Other rumors say that the wizard shapeshifted into a large brown stone and still </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">lives, if such a state can be called \"living,\" somewhere out in the desert. </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Probably no one will ever learn the truth, for no one has seen the wizard </span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-