      content: "<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"><span style=\"color:#212121;font-family:Lato\"><span style=\"font-size:14.6667px;white-space:pre-wrap\">In the southern Tablelands stand the shadowwrapped ruins of Kalidnay, a formerly great city. From an immense palace surrounded by the man sions of his nobles and templars, the sorcerer-king Kalid-Ma ruled over a city-state as large as Tyr and as wealthy as Balic. No one knows how Kalidnay’s end came, for it was not destroyed by a rival city or laid waste by the Dragon. All that is known for certain is that disaster struck on the eve of a celebra tion proclaimed by Kalid-Ma in honor of his queen Thanok-An. A few days later, a caravan arrived in Kalidnay and found the city deserted. The only sign of disaster was a tremendous crack that split open a pyramid in the necropolis a mile outside the city walls—a grand tomb for Kalid-Ma that had been under construction for decades. Some tales say that the sorcerer-king sacrificed his citizens in a terrible defiling rite. Other stories claim that Thanok-An slew her husband in a bid to steal his powers and lost control of the dreadful magic she had gained. Whatever happened, the city was never reoc cupied because perilous shadows still haunt the ruins. Those who know the secret ofwalking in other planes report that Kalidnay now exists mostly in the shadowy otherworld of the Gray; every night, strange mists roll through the streets. Any creature caught in the cloy ing fog is destroyed or drawn away to an unknown fate—perhaps just as the people of Kalidnay were. Usually, creatures that take shelter in the jumble of ruins the city has become are safe from the creep ing mists. As a result, bold raiding tribes, vicious monsters, and strange shadow creatures lair in the crumbling structures.</span></span></span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\">\_</p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">large as Tyr and as wealthy as Balic The sorcerer king who ruled it lived in an immense palace in the heart of the city, surrounded by the mansions of his nobles and templars. Judging from all of the abandoned trading emporiums, it must have been a wealthy city indeed. In the center of the city, there was even a huge ziggurat. Now, the streets are littered with skeletons, the palaces have fallen into ruin, and the ziggurat has been cracked open like an immense earthen egg. No one knows what disaster caused the downfall of Kalidnay, but there can be no doubt that it came rapidly and unexpectedly.</span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-weight:bold;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">Kalidnay</span><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"> is a domain taken from Athas (Dark Sun setting). It is ruled by the </span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Spiritual_Leader\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">High Priestess</span></a><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"> </span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Thakok-An\"><span style=\"font-size:11pt;font-family:Lato;color:#006580;font-variant-numeric:normal;font-variant-east-asian:normal;text-decoration-line:underline;text-decoration-skip-ink:none;vertical-align:baseline;white-space:pre-wrap\">Thakok-An</span></a><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Kalidnay#cite_note-DoDp.90-1\"><span style=\"font-size:11pt;font-family:Lato;color:#006580;font-variant-numeric:normal;font-variant-east-asian:normal;text-decoration-line:underline;text-decoration-skip-ink:none;vertical-align:baseline;white-space:pre-wrap\">[1]</span></a><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">, whose defining crime was the sacrifice of her family in order to transform her Sorcerer King, Kalid-Ma, into a </span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Dragon\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">dragon</span></a><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">. Instead of transforming, the King was put into a deep sleep, and half of the city's population was killed. As soon as this happened, Kalidnay was added to Ravenloft as an </span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Island_of_Terror\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">Island of Terror</span></a><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">. Thakok's curse is having her beloved master at her side, as she wanted, but in a sleeping state, thus never having his favor. Worse, dissonance eats at her </span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Soul\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">soul</span></a><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">, for she is in conflict over whether keeping him to herself is greater than having his favor.</span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Kalidnay#cite_note-DoDp.91-2\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">[2]</span></a><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"> And in the meantime, she must eternally walk a tightrope keeping the magical ecology that keeps Kalidnay together from falling apart.</span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Kalidnay#cite_note-DoDp.92-3\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">[3]</span></a></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">In 4th Edition, Kalidnay exists in ruined form on Athas, and in a populated form in The Grey (Athas's Shadowfell).</span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Kalidnay#cite_note-4\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">[4]</span></a></p>\n<h2 dir=\"ltr\" style=\"line-height:1.4000000000000001;margin-top:15pt;margin-bottom:0pt\"><span style=\"font-size:19pt;font-family:Lato;color:#226e93;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">Discrepancies</span></h2>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">Thakok-An and Kalid-Ma's gender are up for debate as they are two versions of this dark domain's origin. When Kalidnay first appeared in the Forbidden Lore supplement, Thakok-An was a high priest and Kalid-Ma was his Sorceress-Queen. The </span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Ravenloft_Monstrous_Compendium_I_%26_II\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">Ravenloft Monstrous Compendium I &amp; II</span></a><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">supplement follows this view</span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Kalidnay#cite_note-5\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">[5]</span></a><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">. In the Domains of the Dread corebook their genders were swapped: Kalid became a King while Thakok was transformed into a female priestess. The reasons for this change seem to be due to the fact that Dark Sun products refer to Kalid-Ma as a male.</span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Kalidnay#cite_note-6\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">[6]</span></a></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">Since Kalidnay strongly depended on the Dark Sun setting, and 3rd edition Ravenloft was published by Arthaus/White Wolf, this domain was left aside and unused by the new publisher, possibly because using it would have required them to pay the rights to Wizards of the Coast as Arthaus/WW would need to cite Dark Suns and Athas' names, as they could not unbind it from its home scenario (as they did to all the other domains), and possibly because the non-core domains were never explored very much before the end of the line.</span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">In the 4th Edition version </span><a style=\"text-decoration-line:none\" href=\"http://www.fraternityofshadows.com/wiki/Kalidnay#cite_note-7\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">[7]</span></a><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">, Kalid-Ma remains male and Thakok-An remains female.</span></p>"
