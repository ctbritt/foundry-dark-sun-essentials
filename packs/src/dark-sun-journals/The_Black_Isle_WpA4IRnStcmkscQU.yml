    text:
      format: 1
      content: |-
        <p>A forbidding place with sheer cliffs of black basalt,</p>
        <p>the Black Isle is known to only a few travelers of</p>
        <p>the deep silt. It rises almost vertically from the surrounding</p>
        <p>dust, ringed by unbroken cliffs 500-1,000'</p>
        <p>high. The upper surface of this remote and desolate</p>
        <p>island is covered by a thick, impenetrable jungle.</p>
        <p>The forest is not visible from the surface of the silt</p>
        <p>below.</p>
        <p>The jungle is filled with deadly plants of all kinds.</p>
        <p>Strangling vines, poisonweed, blossomkillers, and</p>
        <p>dew fronds are found here in unnatural numbers.</p>
        <p>The prevalence of carnivorous plants has kept the</p>
        <p>animal population down to a few varieties of insects</p>
        <p>and birds.</p>
        <p>The center of the Black Isle holds a deep, still lake</p>
        <p>of dark water. Nearly half a mile across, the lake</p>
        <p>seems to be fed by some deep, hidden spring. A few</p>
        <p>quiet streams wind away through the jungle to trickle</p>
        <p>over the cliffs. The water possesses a dark and</p>
        <p>powerful enchantment: once a person has drunk</p>
        <p>from the lake, any other water becomes deadly poison</p>
        <p>(save vs. poison or suffer 5d6 points of damage).</p>
        <p>Along the shores of the lake stands a rambling</p>
        <p>palace of pristine bone and ivory. Silent obsidian golems</p>
        <p>eternally guard the palace. This island was</p>
        <p>once the retreat of either a powerful wizard or</p>
        <p>psionicist who died in another land and never returned</p>
        <p>to his secret fortress. The Dragon has investigated</p>
        <p>the island at length and discovered the</p>
        <p>properties of its lake and jungle. The Dragon lets it</p>
        <p>remain unspoiled as a lure for careless travelers of</p>
        <p>the deep silt.</p>
