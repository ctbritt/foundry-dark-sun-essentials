    text:
      format: 1
      content: "<p>Between the eastern borders of the Endless Sand\_Dunes and the Sea of Silt lies a salt flat even larger\_than the Great Ivory Plain. This region, known as the\_Great Salt Flat, is a waterless expanse hundreds of\_miles across that offers no shelter ofany kind. In many\_places, chest-high ridges of salty encrustation form\_natural mazes, blocking all but the most nimble pack\_beasts and forcing travelers to scramble across the tops\_of the ridges. The flat is a nearly impassable obstacle\_between the islets ofthe Silt Archipelago and the more\_settled regions near the Estuary ofthe Forked Tongue.</p>"
