    text:
      format: 1
      content: "<p>Decades ago, a human named Mulmehr discovered a\_particularly old series of tunnels through the mountains and claimed them for himself.</p>\n<p>Mulmehr, a scion\_of the Shahram noble family in Tyr, spent years and\_much of his resources modifying the tunnels to\_ use\_them in a psionic ritual. He completed his preparations, attempted the ritual, and apparently failed.\_</p>\n<p>Many of the tunnels collapsed, and Mulmehr was\_never seen in Tyr again.\_</p>\n<p>Whatever the nature of the ritual, the tunnels have since gained a reputation as an evil place that drains\_all sound from visitors—as well as their willpower and\_volition. No one can say what lies at the heart of the\_Echoless Caverns, where Mulmehr scribed\_ the ritual\_circle, because no one has reached that area and\_returned to tell the story.</p>"
