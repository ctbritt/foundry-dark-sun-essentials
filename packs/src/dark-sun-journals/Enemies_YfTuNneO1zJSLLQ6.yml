      content: "<p>Setup. The next short scenes reinforce the deplorable conditions of slavery and provide</p>\n<p>the PCs some potential enemies. Played correctly, these scenes should intensify</p>\n<p>the PCs\x92 longing for freedom. Begin by playing a typical day in the slave pens,</p>\n<p>highlighting the cruelty and drudgery of the work. Allow the players to explore the</p>\n<p>limits of their prison and plan for escape. Whenever the action lags, introduce one of</p>\n<p>the following scenes.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Cruel Overseer. During a particularly hot afternoon, one of</p>\n<p>the PCs errs. (As the PCs perform their various tasks, require</p>\n<p>ability checks of them; when one fails, describe the failure</p>\n<p>and introduce this scene.) The PC breaks a tool, almost</p>\n<p>spills a load of bricks, mixes too much water into the mud, or</p>\n<p>whatever. His crime draws the rage of the crew\x92s overseer, a</p>\n<p>short and sweaty mul. The mul whips the PC unmercifully for</p>\n<p>2d6 rounds or until the character lies unconscious. If the PC</p>\n<p>(or anyone) fights back, the guards do not respond for 2 rounds. If the PC fights</p>\n<p>back, he is hauled off and thrown into the Pit\x97a dried-out well used for punishment.</p>\n<p>If the PC is unconscious, his friends can drag him to the shade then go back</p>\n<p>to work. Thereafter, bad blood exists between the overseer and the PC.</p>\n<p>Mul Overseer: AL NE; AC 8 (Dexterity); MV 6; HD 4; hp 23; THAC0 17; #AT</p>\n<p>1; Dmg 1-2 (whip); SZ M; ML 10; Str 17; Dex 14; Con 14; Int 10; Wis 10; Cha</p>\n<p>1 1 .</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Extra Work. After a particularly hot and exhausting day, the</p>\n<p>crew finishes its work, fulfilling the production quota. A</p>\n<p>narrow-cheeked templar and two half-giant guards happen by</p>\n<p>and examine the work. After approving of the product, the</p>\n<p>templar turns to the overseer and says, \x93King Kalak demands</p>\n<p>more from his laborers. From today on, your work</p>\n<p>quota is doubled.\x94 The dinner gong sounds. \x93No meal,</p>\n<p>tonight\x97work until the quota is met.\x94 With that the templar</p>\n<p>leaves, his head cast back in self-satisfaction. If the PCs look around or ask other</p>\n<p>slaves, they discover that no other work crew must meet this new quota. Each PC</p>\n<p>suffers a 1d4 Con loss from the added exertion.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Traitor. This scene involves the PCs or NPC companions. It</p>\n<p>happens only after escape plans have been made. In the evening,</p>\n<p>when the conspiring group gathers around a small fire</p>\n<p>to ward off the cold Athasian night, a commotion arises.</p>\n<p>S l a v e s s c a t t e r f r o m t h e p a t h o f a g u a r d p a t r o l l e d b y</p>\n<p>Liurgand, a mul slave. The PCs recognize Liurgand\x97a slave</p>\n<p>who has listened in on all the escape plans. The patrol heads</p>\n<p>straight to the conspirators and surrounds them. After hailing</p>\n<p>them with the usual imprecations, the guards seize the conspirators angrily and</p>\n<p>drag them to the center of the compound, where a templar awaits. The slaves are</p>\n<p>stripped and whipped for ten lashes (the whip hits automatically, producing 1d2</p>\n<p>points of damage per blow). \x93Better make out a will before you plan your next</p>\n<p>escape!\x92\x92 trumpets the templar as the prisoners are hauled off. As a reward for his</p>\n<p>informing, the mul becomes overseer of the PCs\x92 crew.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Theft. During the day, a PCs goes to take a drink from his</p>\n<p>waterskin only to discover it missing. Later, other PCs\x92 waterskins</p>\n<p>disappear. Allow the victim a 20% chance per incident</p>\n<p>to discover the thief\x97an elf named Ramachil\x97in the</p>\n<p>process of stealing another water bottle. If the PCs attempt to</p>\n<p>stop the thief, a brawl will begin. The overseer breaks up the</p>\n<p>fight and forces all back to work. If Ramachil is confronted at</p>\n<p>night, 3d6 elf mates come to his defense. If a fight breaks out,</p>\n<p>use the standard elf statistics on the inside flap of the cover. Ramachil should be too</p>\n<p>tough for the PCs to defeat.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Bully Boys. Shortly after dinner, a PC (the weakest of the</p>\n<p>party) is accosted by a heavily tattooed mul. The man demands</p>\n<p>the PC\x92s food, water, and blanket. Five human thugs</p>\n<p>gang of six bullied more than a few weaklings for their</p>\n<p>at his back add punch (literally) to this request. Clearly this</p>\n<p>goods. If the PC refuses, the thugs beat him senseless (at 5-to-</p>\n<p>1 there is little point running the fight). If the other PCs defend</p>\n<p>the character, a full-scale brawl erupts. Others slaves</p>\n<p>gather to yell and make bets. Allow everyone to get and give a few good licks before</p>\n<p>the guards storm in and break up the fight. The thugs retreat for the night, threatening</p>\n<p>to \x93teach you guys a lesson.\x94</p>\n<p>M u l G a n g L e a d e r : A L C E ; A C 9 ; M V 1 2 ; H D 5 ; h p 2 9 ; T H A C 0 1 3 ; # A T 1 ;</p>\n<p>Dmg Punch/wrestle + 7; ML 14; Str 19; Dex 15; Con 12; Int 11; Wis 9; Cha 10.</p>\n<p>Thugs: AL NE; AC 10; MV 12; HD 2; hp 13 each; THAC0 19; #AT 1; Dmg</p>\n<p>Punch/wrestle; ML 10.</p>"
