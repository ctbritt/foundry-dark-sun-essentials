      content: >-
        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px"><span
        style="color:#212121;font-family:Lato, sans-serif"><span
        style="font-size:14.6667px;font-variant-ligatures:none;white-space:pre-wrap">Most
        islands in the Sea of Silt are little more than jumbled boulders that
        fight a losing battle against the abrasive winds. Larger, more protected
        islands can withstand erosion and might sustain life. Lake Island is
        among the bigger landmasses in the sea. A mountainous spine forms a wall
        that shields against the storms blowing out of the deep silt; the
        largest peak is a dormant volcano. A large, clear lake lies within the
        caldera, and steam curls up from its pristine waters, warmed by the
        volcano’s fiery spirits.</span></span><span
        style="color:#212121;font-family:Lato,
        sans-serif;font-size:14.6667px;font-variant-ligatures:none;white-space:pre-wrap">
        A plume of bluish steam rises from this lake and hangs over the mountain
        s crown at all times. Some psionicists claim that breathing these vapors
        while perched on the edge of the crater in a state of trance helps them
        achieve a deeper understanding of their inner powers. The giants on the
        island think it is great fun to see if they can sneak upon these
        individuals and push them into the scalding waters of the
        lake.</span></p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px"><span
        style="color:#212121;font-family:Lato, sans-serif"><span
        style="font-size:14.6667px;font-variant-ligatures:none;white-space:pre-wrap">Trickling
        streams from the caldera nourish the thriving flora that blankets Lake
        Island’s western slopes. In the lowlands, a traveler can find wild
        kanks, erdlus, and other herd animals. In addition, small settlements
        cluster around oases; Lake Island is home to warring giant clans,
        thri-kreen, dwarves, and others. Minotaur traders help sustain the few
        outposts, and gith raiders emerge from below the mountains to drag
        prisoners to an unknown fate in stinking subterranean
        grottos.</span></span></p>
