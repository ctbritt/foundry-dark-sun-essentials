      content: "<p>Dagada Property</p>\n<p>Property of the dagada includes all communal goods within</p>\n<p>the confines of the neighborhood, such as the wells and granaries.</p>\n<p>The huts in which individuals live are also property of</p>\n<p>the dagada. While a person is living in a hut their ownership is</p>\n<p>not challenged, but if that person leaves the dagada the hut is</p>\n<p>given to someone else at the discretion of the community</p>\n<p>A dagada also has claim to a certain amount of their members</p>\n<p>\x92 output in order to pay taxes and to meet the needs of the</p>\n<p>other community members. A young man training part of the</p>\n<p>day in a weaving dagada is expected to leave his work behind</p>\n<p>for the benefit of the craft community. When he returns home,</p>\n<p>however, he is expected to weave goods for the dagada which</p>\n<p>can be used by members or sold to raise tax money at market.</p>\n<p>The ambo of the dagada has discretion over the distribution</p>\n<p>of grain which is provided to each community by the templars.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p><img src=\"data:image/png;base64,\" width=\"627\" height=\"699\" /></p>"
