    text:
      format: 1
      content: "<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:0pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">These two dwarven villages are located on opposite sides of the Big Fork of the Forked Tongue Estuary.\_</span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">The inhabitants of North Ledopolus are trying to build a stone pathway to Ledo Island from their north shore of the estuary, and the inhabitants of South Ledopolus are trying to do\_ the same from the south shore of the estuary. Their intention is to bridge the entire estuary, opening a shorter caravan route from Gulg and Nibenay to Balic and other cities south of the Tyr Region.\_</span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"><span class=\"Apple-tab-span\" style=\"white-space:pre\"> </span></span><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">Occasionally, the giants living on Ledo Island wade out to tear down some of what the dwarves have built. This usually occasions a fierce battle between the two contingents.</span></p>"
