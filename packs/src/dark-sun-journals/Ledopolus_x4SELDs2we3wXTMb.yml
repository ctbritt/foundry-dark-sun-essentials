    notes: >-
      <p>LEDOPOLUS</p>

      <p>The twin towns of North Ledopolus (population&nbsp;1,000) and South
      Ledopolus (population 2,000)&nbsp;sit on the shores opposite the island of
      Ledo. Many&nbsp;dwarves live in these towns, and they are engaged
      in&nbsp;a great project&mdash;the construction of bridges to span&nbsp;the
      northern fork of the estuary and replace the silt&nbsp;skimmer ferry. The
      dwarf Bruthambar, chief of the&nbsp;Rockcutter clan, is the head builder
      and master of&nbsp;the towns. He is a pugnacious ex-mercenary
      whose&nbsp;bluff good cheer is wearing thin after years of set&nbsp;backs
      and obstacles. The hill giants that inhabit&nbsp;Ledo, a key
      stepping-stone for any bridge across the&nbsp;estuary, have already torn
      down two previous bridging attempts. The giants believe that the bridge is
      a&nbsp;scheme to gain access to their island&rsquo;s valuable
      flint&nbsp;deposits. Attempts to bribe them into allowing
      the&nbsp;construction have proved fruitless. Competing merchant houses
      make the situation even more difficult.&nbsp;The Wavir and Inika trade
      posts in Ledopolus favor&nbsp;the bridge, but the head of the Tomblador
      outpost&nbsp;secretly fans the giants&rsquo; fears.</p>
