      content: "<p>And Ter-omak said, “Back coarse beast,\_back to your foul and blackened grotto.\_This village, my people, are ever lost to you,\_or you will face my angry wrath anew!”</p>\n<p>—Stanza 758 of Ter-omak, a rhul-thaun epic\_</p>\n<hr />\n<p>The Ter-omak was named for a great warrior, whose name meant day hunter. When an\_earthquake weakened the ledges where two halfling villages were located, threatening\_to destroy them both, Ter-omak led the people to a site he had found while hunting—a\_place for a new village. He coordinated the mass exodus while the har-etuils of the concerned\_clans were still debating what should be done. So great was the gratitude of the\_people that they named the new consolidated community after him. His popularity convinced\_the har-etuil to appoint him the community’s administrator, a position the hunter\_was ill-prepared for, but one he held until his death decades later.</p>\n<p>Today Ter-omak is a community of 1,500 residents. Nicely placed at the center of the\_settled portion of the Jagged Cliffs, this village is a hub of climber and windrider traffic.\_Several safehomes indulge the needs of travelers.\_</p>\n<p>The current administrator of Ter-omak is Vit-obaer (ham/F5/LG), a man with his hands\_full of problems. There are essentially only two clans in Ter-omak (each formerly\_belonged to one of the two tiny villages that were united by Ter-omak), the Flahd and\_the Bein. The clans are currently in a state of feud, and occasionally the fuss turns violent.\_The reasons for the conflict are diverse and number in the hundreds, including\_property rights, lovers’ quarrels, lies, counter lies, false dealings, and a myriad of personal\_affronts.</p>\n<p>The two factions keep the lawkeepers constantly employed, dealing with everything\_from small acts of vandalism and terrorism to the violence that sometime erupts\_throughout the village.</p>\n<hr />\n<p>PIaces of Note</p>\n<p>Bein Clanhouse: Unlike other clanhouses of the rhul-thaun (many of which are no longer\_in use), the Bein Clanhouse is a virtual fortress. The Bein believe that the only way to eliminate\_their enemies is through open warfare, to force the Flahd to submit. Therefore, war in\_the streets is inevitable. In order to prepare themselves, they are stockpiling weapons of all\_sorts, food, and other supplies. Though the clan is obviously far too large to ever be able to\_bring everyone inside and protect them, it is fortified against attack and can keep up to 100\_clansmen safe and supplied for a limited time. Their self-appointed military leader, Finaheon\_(haf/F9/N), constantly upgrades their defenses and military plans.</p>\n<p>\_</p>\n<p>Flahd Clanhouse: The Flahd clanhouse is as fortified and well-stocked as that of the\_Bein. Reth-olus (ham/F8/T8/LN) is a har-etuil for the Flahd clan who also serves as its\_commander in time of conflict.</p>\n<p>\_</p>\n<p>The safehomes: Six establishments purvey food, drink, and lodging to the large\_amount traffic that passes through the village. Unfortunately, casualties of the feud\_between the clans are not just local clan members. Simply staying the night at a safehome\_run by one clan automatically makes one an enemy of the other. Each controls\_three safehomes, and prices are low in all of them. A night’s stay is 2 ghav-egoths, and a\_meal is only 1 ge.</p>\n<hr />\n<p>Important NPCs</p>\n<p>Tkaun-osir (ham/FG): AC 1 (shell armor and shield); MV 6; hp 47; THAC0 15 (13</p>\n<p>with Strength bonus); #AT 1; Dmg 1d8 (hurling titan); SZ S (2’ 8”); ML steady (12); AL</p>\n<p>NG; XP 975.</p>\n<p>S 18, D 12, C 15, I 10, W 6, Ch 10.</p>\n<p>Personality: Well intentioned, unintentionally foolish.</p>\n<p>Special Equipment: glowing graft, sleep spore pod, shell armor, organic shield, hurling\_titan.</p>\n<p>Thaun-osir is also known as the Peacemaker. He is doing whatever he can to stop the\_conflict between the two feuding clans. He has a large heart, but very little idea what\_he is doing. When news of a battle or potential confrontation between the clans reaches\_him, he races off to try to stop it. Usually, his unwise and ineffective endeavors only\_exacerbate the situation.</p>\n<p>Though short, even for a halfling, Thaun-osir’s strength and battle prowess is great—\_unfortunately, he loathes violence. His long brown hair is often falling into his face, getting\_in his eyes.</p>"
