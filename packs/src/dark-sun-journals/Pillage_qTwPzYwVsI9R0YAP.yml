      content: |-
        <p>The village of Pillage surrounds an oasis located north</p>
        <p>of the Troll Grave Chasm, in the portion of the Barrier</p>
        <p>Wastes known as the Scorpion Plains. While most raiding</p>
        <p>tribes contain members from a variety of races, the people</p>
        <p>of Pillage are mostly humanoids, with only a few humans</p>
        <p>and demihumans thrown in the mix. Chilod leads this</p>
        <p>Bandit State, commanding a community of tareks, ssurran,</p>
        <p>thri-kreen, nikaal, silt runners, some humans and dwarves,</p>
        <p>a couple of braxat, and a few b'rohgs. All classes except</p>
        <p>wizards are welcome among Chilod's ranks, as the tarek</p>
        <p>has no tolerance for defilers or preservers.</p>
        <p>Only Chilod's intimidating presence holds Pillage</p>
        <p>together. The mixture of races makes a volatile brew,</p>
        <p>but Chilod turns his followers' angry flames outward</p>
        <p>instead of allowing them to explode within the village.</p>
        <p>To accomplish this, the leader has declared war on the</p>
        <p>nearby village of Plunder, making it a target for his tribe's</p>
        <p>natural aggressive tendencies.</p>
        <p>The raiders from Pillage make periodic excursions into</p>
        <p>the Scorched Plateau. There, they seek out ssurran trade</p>
        <p>caravans to attack. The ssurran traders have gone so far</p>
        <p>as to make a practice of leaving a small caravan behind</p>
        <p>for the raiders while their primary caravan continues on</p>
        <p>its appointed route.</p>
