    text:
      format: 1
      content: "<p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">When walking across open ground, a party of characters can move at a normal, fast, or slow pace, which determines how far they can travel per day as well as how well equipped they are to spot potential threats.</span></p><figure class=\"wp-block-table\" style=\"box-sizing:inherit;margin:0px 0px 1.5em;padding:0px;border:0px;overflow-x:auto;color:#0a0a0a;font-family:roboto;font-size:21px\"><table style=\"box-sizing:inherit;border-width:1px 0px 0px 1px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;border-spacing:0px;margin-top:0px;margin-bottom:1.5em;width:827.062px\"><tbody style=\"box-sizing:inherit\"><tr style=\"box-sizing:inherit\"><td style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Pace</strong></span></span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Distance per Minute</strong></span></span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Distance per Hour</strong></span></span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Distance per Day</strong></span></span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Effect</strong></span></span></td></tr><tr style=\"box-sizing:inherit\"><td style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px\"><span style=\"font-family:roboto\">Fast</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">400 feet</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">4 miles</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">30 miles</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">-5 penalty to passive Wisdom (<a style=\"box-sizing:inherit;transition:color 0.1s ease-in-out 0s, background-color 0.1s ease-in-out 0s;text-decoration-line:none;color:#1b78e2\" href=\"https://www.dndbeyond.com/compendium/rules/basic-rules/using-ability-scores#Perception\" target=\"_blank\" rel=\"external noopener noreferrer\" data-wpel-link=\"external\">Perception</a>) scores</span></td></tr><tr style=\"box-sizing:inherit\"><td style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px\"><span style=\"font-family:roboto\">Normal</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">300 feet</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">3 miles</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">24 miles</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">–</span></td></tr><tr style=\"box-sizing:inherit\"><td style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px\"><span style=\"font-family:roboto\">Slow</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">200 feet</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">2 miles</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">18 miles</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Able to use stealth</span></td></tr></tbody></table></figure><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Adventurers can travel for up to eight hours per day; anything longer than that and you run the risk of\_<a style=\"box-sizing:inherit;transition:color 0.1s ease-in-out 0s, background-color 0.1s ease-in-out 0s;text-decoration-line:none;color:#1b78e2\" href=\"https://blackcitadelrpg.com/exhaustion-5e/\" target=\"_blank\" rel=\"noreferrer noopener\" data-wpel-link=\"internal\">accumulating levels of exhaustion</a>. Deciding to continue for longer than eight hours is called a\_</span><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Forced March.</strong></span></span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">For each additional hour of travel beyond eight hours, the characters cover the distance shown in the Hour column for their pace.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">However, at the end of each hour of travel beyond eight, each character must make a Constitution saving throw. The DC is 10 + 1 for each hour past eight hours. On a failed saving throw, a character suffers one level of\_<a style=\"box-sizing:inherit;transition:color 0.1s ease-in-out 0s, background-color 0.1s ease-in-out 0s;text-decoration-line:none;color:#1b78e2\" href=\"https://www.dndbeyond.com/compendium/rules/basic-rules/appendix-a-conditions#Exhaustion\" target=\"_blank\" rel=\"noreferrer noopener external\" data-wpel-link=\"external\">exhaustion</a>.</span></p><h3 style=\"box-sizing:inherit;margin-bottom:20px;border-width:0px 0px 2px;border-image:initial;font-family:'Playfair Display', serif;font-size:25px;font-weight:bold;line-height:1.2em;color:#9b312d;border-color:initial initial #c9ad6a initial;border-style:initial initial solid initial\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Marching Order</strong></span></span></h3><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Whether you’re moving through cramped dungeon corridors or tracking a party of orcs across open plains, the DM may call on you to describe your party’s marching order.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">This means you choose who walks in front; who’s second, third, etc.; and which character is bringing up the rear.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">A party’s marching order usually determines who gets to make perception checks to notice things ahead of or behind the party.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">The character (or characters, if there’s enough room for multiple adventurers to travel abreast) in the front rank usually makes Survival checks to navigate, detect approaching monsters, and spot hazards or traps.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">If the party is being followed (or hunted), the character at the back is usually the one who makes the Perception check to notice.</span></p><h3 style=\"box-sizing:inherit;margin-bottom:20px;border-width:0px 0px 2px;border-image:initial;font-family:'Playfair Display', serif;font-size:25px;font-weight:bold;line-height:1.2em;color:#9b312d;border-color:initial initial #c9ad6a initial;border-style:initial initial solid initial\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Getting Lost</strong></span></span></h3><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">A party moving slowly is also less likely to become lost.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Whenever the DM decides that the party – because they were too cheap to hire a guide, neglected to buy a map, or are just somewhere that no one has ever been before – is running the risk of becoming lost, they can call on the party’s navigator (usually the character at the front of the marching order) to make a Survival check.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">The DC is determined by the terrain through which the party is traveling.</span></p><figure class=\"wp-block-table\" style=\"box-sizing:inherit;margin:0px 0px 1.5em;padding:0px;border:0px;overflow-x:auto;color:#0a0a0a;font-family:roboto;font-size:21px\"><table style=\"box-sizing:inherit;border-width:1px 0px 0px 1px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;border-spacing:0px;margin-top:0px;margin-bottom:1.5em;width:827.062px\"><tbody style=\"box-sizing:inherit\"><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Terrain</strong></span></span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>DC</strong></span></span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Forest, jungle, swamp, mountains, or open sea with overcast skies and no land in sight</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">15</span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Arctic, desert, hills, or open sea with clear skies and no land in sight</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">10</span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Grassland, meadow, farmland</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">5</span></td></tr></tbody></table></figure><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">The check made by the party’s navigator is modified by the characters’ Travel Pace. A slow-moving party gets a +5 bonus to their Survival check, and a fast-moving party gets a -5 penalty.</span></p><div class=\"wp-container-1 wp-block-group\" style=\"box-sizing:border-box;position:relative;padding:10px 16px;background-color:#fffefb;border:2px solid #afa186;margin-bottom:1.5em;color:#0a0a0a;font-family:roboto;font-size:21px\"><div class=\"wp-block-group__inner-container\" style=\"box-sizing:inherit;max-width:1200px;margin-left:auto;margin-right:auto;padding:6px 10px;position:relative;z-index:1\"><p class=\"has-medium-font-size\" style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;font-size:var(--wp--preset--font-size--medium) !important\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Rangers: Natural Explorers in Their Favored Terrain</strong></span></span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px\"><span style=\"font-family:roboto\">One of the best ways to mitigate the dangers of traveling through the wilderness is to make sure you have a ranger in your party – either by having one as a player character or hiring one as a retainer.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px\"><span style=\"font-family:roboto\">All rangers are familiar with one (or more) type of natural environment and gain a host of bonuses when traveling and surviving in that environment.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px\"><span style=\"font-family:roboto\">Rangers can choose a terrain from arctic, coast, desert, forest, grassland, mountain, swamp, or the Underdark.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px\"><span style=\"font-family:roboto\">While traveling in their favored terrain, rangers get\_<a style=\"box-sizing:inherit;transition:color 0.1s ease-in-out 0s, background-color 0.1s ease-in-out 0s;text-decoration-line:none;color:#1b78e2\" href=\"https://blackcitadelrpg.com/proficiency-bonus-expertise-5e/\" target=\"_blank\" rel=\"noreferrer noopener\" data-wpel-link=\"internal\">expertise</a>\_(doubling their proficiency bonus) when making Wisdom and Intelligence checks related to that environment as well as the following benefits:</span></p><ul style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;margin-left:1.4em;padding-left:1.5rem;border:0px;list-style-position:initial;list-style-image:initial\"><li style=\"box-sizing:inherit;margin:0px;padding:0px;border:0px\"><span style=\"font-family:roboto\">Difficult terrain doesn’t slow your group’s travel.</span></li><li style=\"box-sizing:inherit;margin:0px;padding:0px;border:0px\"><span style=\"font-family:roboto\">Your group can’t become lost except by magical means.</span></li><li style=\"box-sizing:inherit;margin:0px;padding:0px;border:0px\"><span style=\"font-family:roboto\">Even when you are engaged in another activity while traveling (such as foraging, navigating, or tracking), you remain alert to danger.</span></li><li style=\"box-sizing:inherit;margin:0px;padding:0px;border:0px\"><span style=\"font-family:roboto\">If you are traveling alone, you can move stealthily at a normal pace.</span></li><li style=\"box-sizing:inherit;margin:0px;padding:0px;border:0px\"><span style=\"font-family:roboto\">When you forage, you find twice as much food as you normally would.</span></li><li style=\"box-sizing:inherit;margin:0px;padding:0px;border:0px\"><span style=\"font-family:roboto\">While tracking other creatures, you also learn their exact number, their sizes, and how long ago they passed through the area.</span></li></ul></div></div><h3 style=\"box-sizing:inherit;margin-bottom:20px;border-width:0px 0px 2px;border-image:initial;font-family:'Playfair Display', serif;font-size:25px;font-weight:bold;line-height:1.2em;color:#9b312d;border-color:initial initial #c9ad6a initial;border-style:initial initial solid initial\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Traveling Over Difficult Terrain</strong></span></span></h3><div class=\"wp-block-image\" style=\"box-sizing:inherit;margin:0px 0px 1.5em;color:#0a0a0a;font-family:roboto;font-size:21px\"><figure class=\"aligncenter size-large is-resized\" style=\"box-sizing:inherit;margin:0px auto;padding:0px;border:0px;clear:both;display:table;max-width:100%;height:auto\"><img class=\"wp-image-4835\" style=\"box-sizing:inherit;height:auto;vertical-align:bottom;border-radius:inherit\" src=\"https://blackcitadelrpg.com/wp-content/uploads/2021/12/Mountain-1024x536.jpg\" sizes=\"(max-width: 1024px) 100vw, 1024px\" srcset=\"https://blackcitadelrpg.com/wp-content/uploads/2021/12/Mountain-1024x536.jpg 1024w, https://blackcitadelrpg.com/wp-content/uploads/2021/12/Mountain-300x157.jpg 300w, https://blackcitadelrpg.com/wp-content/uploads/2021/12/Mountain-768x402.jpg 768w, https://blackcitadelrpg.com/wp-content/uploads/2021/12/Mountain.jpg 1200w\" width=\"400\" /><figcaption style=\"box-sizing:inherit;margin-bottom:1em;font-size:13px;display:table-caption;caption-side:bottom\"><span style=\"font-family:roboto\">© Wizards of the Coast by Daria Khlebnikova</span></figcaption></figure></div><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">The travel speeds listed above assume the characters are traveling over relatively unobstructed terrain like paved or dirt roads, rolling plains, or light forest.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">However, traveling through difficult terrain, like swamps, thick forest, mountainous areas, or anywhere else where the going gets tough, halves your party’s movement speed in the same way that moving across difficult terrain during combat costs 2 feet of movement for every 1foot traveled.</span></p><h3 style=\"box-sizing:inherit;margin-bottom:20px;border-width:0px 0px 2px;border-image:initial;font-family:'Playfair Display', serif;font-size:25px;font-weight:bold;line-height:1.2em;color:#9b312d;border-color:initial initial #c9ad6a initial;border-style:initial initial solid initial\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Mounts and Vehicles</strong></span></span></h3><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Mounts, like horses, camels, giant goats, or anything else your party’s +8 Animal Handling ranger can stick a saddle on, can travel at double walking speed for about an hour.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Anything beyond that and the mount needs to start making saving throws to avoid exhaustion.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Some mounts are specially adapted to their environments and, I would rule, negate any difficult terrain penalties imposed by their specific terrain.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">A giant mountain goat mount, for example, would allow an adventurer to move through rocky, vertical terrain as though it were flat land. Need to get through a fetid swamp in a hurry? Did someone say riding alligators?</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Animals can also be used to pull vehicles over land (and sometimes water –\_<em style=\"box-sizing:inherit\">did someone say Alligator Water Chariot?</em>).</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">While this is no quicker than walking, the benefit here is how much even a simple horse and cart can increase your carrying capacity.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">An animal pulling a carriage, cart, chariot, sled, or wagon can move weight up to five times its base carrying capacity, including the weight of the vehicle.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">If multiple animals pull the same vehicle, they can add their carrying capacity together.</span></p><h3 style=\"box-sizing:inherit;margin-bottom:20px;border-width:0px 0px 2px;border-image:initial;font-family:'Playfair Display', serif;font-size:25px;font-weight:bold;line-height:1.2em;color:#9b312d;border-color:initial initial #c9ad6a initial;border-style:initial initial solid initial\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Resting in the Wilderness</strong></span></span></h3><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Apart from some edge cases like the\_<a style=\"box-sizing:inherit;transition:color 0.1s ease-in-out 0s, background-color 0.1s ease-in-out 0s;text-decoration-line:none;color:#1b78e2\" href=\"https://blackcitadelrpg.com/warforged-race-guide-5e/\" target=\"_blank\" rel=\"noreferrer noopener\" data-wpel-link=\"internal\">warforged</a>, all characters need to periodically take a rest, no matter if they’re topped up on hit points and spell slots.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">During travel, it’s assumed that a party will need to take a short rest (one hour) every four hours, and a long rest (eight hours) at the end of eight hours of travel.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">A party taking a long rest will also need to make camp as well as consume food and water in order to gain its benefits. In the wilderness, this can be easier said than done.</span></p><h3 style=\"box-sizing:inherit;margin-bottom:20px;border-width:0px 0px 2px;border-image:initial;font-family:'Playfair Display', serif;font-size:25px;font-weight:bold;line-height:1.2em;color:#9b312d;border-color:initial initial #c9ad6a initial;border-style:initial initial solid initial\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Foraging and Other Actions While Traveling</strong></span></span></h3><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">There are plenty of things your characters can (and probably should) do while traveling, including navigating, forage for food and water, map the surrounding area, and track creatures.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Usually, a party traveling slowly will do better at these activities, and a fast-moving party will act at a serious disadvantage.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Navigating\_</strong></span></span><span style=\"font-family:roboto\">not only helps you find your way to the journey’s destination, but also helps avoid environmental hazards, like quicksand, thin ice, or desecrated ground crawling with the undead, by making a Survival check.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Foraging\_</strong></span></span><span style=\"font-family:roboto\">allows you to find the food and water necessary for survival once your party’s rations run out.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">A character who forages for food keeps their eyes peeled for vegetation, water sources, and game that can be hunted by making a Survival check. The DC of this check is set by the abundance of available food in the region.</span></p><figure class=\"wp-block-table\" style=\"box-sizing:inherit;margin:0px 0px 1.5em;padding:0px;border:0px;overflow-x:auto;color:#0a0a0a;font-family:roboto;font-size:21px\"><table style=\"box-sizing:inherit;border-width:1px 0px 0px 1px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;border-spacing:0px;margin-top:0px;margin-bottom:1.5em;width:827.062px\"><tbody style=\"box-sizing:inherit\"><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Food and Water Availability</strong></span></span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>DC</strong></span></span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Abundant food and water sources</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">10</span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Limited food and water sources</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">15</span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Very little, if any, food and water sources</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">20</span></td></tr></tbody></table></figure><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Lush farmland and forests might yield an abundant supply of wild mushrooms, berries, fresh water, and rabbits to hunt.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">By contrast, players trying to make their way through arctic tundra or scorching desert could end up going for days at a time without glimpsing the slightest trace of food or water.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Mapping\_</strong></span></span><span style=\"font-family:roboto\">the surrounding area involves a character taking the time to survey the surrounding landscape, noting down landmarks and geological features.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">If the party later becomes lost (or travels through the same location later) a map can be a huge help in getting back on track.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Tracking\_</strong></span></span><span style=\"font-family:roboto\">quarry across the wilderness – whether the pursuit is the whole point of the journey or just a momentary diversion in search of food – relies on a player making one or more successful Survival checks.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">The DM could set any number of DCs for the roll and require the player to roll multiple checks.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">The difficulty of a check and the frequency with which the player has to roll could depend on any number of things, from the size of the quarry and the local terrain (tracking a giant’s progress through the forest requires little more than checking for huge footprints and broken branches and may not require a roll at all; following a\_<a style=\"box-sizing:inherit;transition:color 0.1s ease-in-out 0s, background-color 0.1s ease-in-out 0s;text-decoration-line:none;color:#1b78e2\" href=\"https://blackcitadelrpg.com/displacer-beast-5e/\" data-wpel-link=\"internal\">displacer beast</a>\_through its native jungle is a task so challenging that it verges on folly) to whether or not the party’s prey is aware of its pursuers.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">A monster that’s just going about its business might only prompt a roll once per day, whereas a creature that’s actively trying to avoid detection could prompt a new roll each hour.</span></p><div class=\"wp-block-image\" style=\"box-sizing:inherit;margin:0px 0px 1.5em;color:#0a0a0a;font-family:roboto;font-size:21px\"><figure class=\"aligncenter size-large is-resized\" style=\"box-sizing:inherit;margin:0px auto;padding:0px;border:0px;clear:both;display:table;max-width:100%;height:auto\"><img class=\"wp-image-4836\" style=\"box-sizing:inherit;height:auto;vertical-align:bottom;border-radius:inherit\" src=\"https://blackcitadelrpg.com/wp-content/uploads/2021/12/Mountain-2-1024x536.jpg\" sizes=\"(max-width: 1024px) 100vw, 1024px\" srcset=\"https://blackcitadelrpg.com/wp-content/uploads/2021/12/Mountain-2-1024x536.jpg 1024w, https://blackcitadelrpg.com/wp-content/uploads/2021/12/Mountain-2-300x157.jpg 300w, https://blackcitadelrpg.com/wp-content/uploads/2021/12/Mountain-2-768x402.jpg 768w, https://blackcitadelrpg.com/wp-content/uploads/2021/12/Mountain-2.jpg 1200w\" width=\"400\" /><figcaption style=\"box-sizing:inherit;margin-bottom:1em;font-size:13px;display:table-caption;caption-side:bottom\"><span style=\"font-family:roboto\">© Wizards of the Coast by Sarah Finnigan</span></figcaption></figure></div><h3 style=\"box-sizing:inherit;margin-bottom:20px;border-width:0px 0px 2px;border-image:initial;font-family:'Playfair Display', serif;font-size:25px;font-weight:bold;line-height:1.2em;color:#9b312d;border-color:initial initial #c9ad6a initial;border-style:initial initial solid initial\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Weather</strong></span></span></h3><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">The weather is a vital consideration when moving through the wilderness. Climbing a mountain on a balmy summer afternoon is a very different prospect from attempting the same climb in the midst of a raging snowstorm.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">The DM can either choose the weather to suit the environment and their campaign (trekking across cursed marshlands? It’s now raining frogs, which I guess eliminates the need for a foraging roll for the day) or roll on the table below.</span></p><figure class=\"wp-block-table\" style=\"box-sizing:inherit;margin:0px 0px 1.5em;padding:0px;border:0px;overflow-x:auto;color:#0a0a0a;font-family:roboto;font-size:21px\"><table style=\"box-sizing:inherit;border-width:1px 0px 0px 1px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;border-spacing:0px;margin-top:0px;margin-bottom:1.5em;width:827.062px\"><tbody style=\"box-sizing:inherit\"><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>d20</strong></span></span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Temperature</strong></span></span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">1–14</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Normal for the season</span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">15–17</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">1d4 × 10 degrees Fahrenheit colder than normal</span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">18–20</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">1d4 × 10 degrees Fahrenheit hotter than normal</span></td></tr></tbody></table></figure><figure class=\"wp-block-table\" style=\"box-sizing:inherit;margin:0px 0px 1.5em;padding:0px;border:0px;overflow-x:auto;color:#0a0a0a;font-family:roboto;font-size:21px\"><table style=\"box-sizing:inherit;border-width:1px 0px 0px 1px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;border-spacing:0px;margin-top:0px;margin-bottom:1.5em;width:827.062px\"><tbody style=\"box-sizing:inherit\"><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>d20</strong></span></span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Wind</strong></span></span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">1–12</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">None</span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">13–17</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Light</span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">18–20</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Strong</span></td></tr></tbody></table></figure><figure class=\"wp-block-table\" style=\"box-sizing:inherit;margin:0px 0px 1.5em;padding:0px;border:0px;overflow-x:auto;color:#0a0a0a;font-family:roboto;font-size:21px\"><table style=\"box-sizing:inherit;border-width:1px 0px 0px 1px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;border-spacing:0px;margin-top:0px;margin-bottom:1.5em;width:827.062px\"><tbody style=\"box-sizing:inherit\"><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>d20</strong></span></span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Precipitation</strong></span></span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">1–12</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">None</span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">13–17</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Light rain or light snowfall</span></td></tr><tr style=\"box-sizing:inherit\"><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">18–20</span></td><td class=\"has-text-align-center\" style=\"box-sizing:inherit;border-width:0px 1px 1px 0px;border-style:solid;border-color:rgba(0, 0, 0, 0.1);border-image:initial;padding:8px;text-align:center\" data-align=\"center\"><span style=\"font-family:roboto\">Heavy rain or heavy snowfall</span></td></tr></tbody></table></figure><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Some DMs like to roll for weather changes as frequently as every hour, whereas some will just roll at the start of the day and let the result ride.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">It’s also worth noting that some spells and character abilities, like Druidcraft, can allow characters to predict the weather as much as a day in advance.</span></p><div class=\"wp-container-2 wp-block-group\" style=\"box-sizing:border-box;position:relative;padding:10px 16px;background-color:#fffefb;border:2px solid #afa186;margin-bottom:1.5em;color:#0a0a0a;font-family:roboto;font-size:21px\"><div class=\"wp-block-group__inner-container\" style=\"box-sizing:inherit;max-width:1200px;margin-left:auto;margin-right:auto;padding:6px 10px;position:relative;z-index:1\"><p class=\"has-medium-font-size\" style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;font-size:var(--wp--preset--font-size--medium) !important\"><span style=\"box-sizing:inherit;font-weight:bold\"><span style=\"font-family:roboto\"><strong>Homebrewing the Wilderness</strong></span></span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px\"><span style=\"font-family:roboto\">Plenty of DMs find the basic rules for weather (and wilderness travel in general) to be a little sparse. Thankfully, there are a ton of great options out there from the\_<em style=\"box-sizing:inherit\">D&amp;D\_</em>community.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px\"><span style=\"font-family:roboto\">Try\_<a style=\"box-sizing:inherit;transition:color 0.1s ease-in-out 0s, background-color 0.1s ease-in-out 0s;text-decoration-line:none;color:#1b78e2\" href=\"https://www.gmbinder.com/share/-M6xAC_2zw4BzpByxO-c\" target=\"_blank\" rel=\"noreferrer noopener external\" data-wpel-link=\"external\">this free ruleset by KibblesTasty</a>\_for a more in-depth set of options.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px\"><span style=\"font-family:roboto\">You should also check out\_<a style=\"box-sizing:inherit;transition:color 0.1s ease-in-out 0s, background-color 0.1s ease-in-out 0s;text-decoration-line:none;color:#1b78e2\" href=\"https://www.drivethrurpg.com/product/274922/Into-the-Wyrd-and-Wild-Revised-Edition\" target=\"_blank\" rel=\"noreferrer noopener external\" data-wpel-link=\"external\"><em style=\"box-sizing:inherit\">Into the Wyrd and Wild</em></a><em style=\"box-sizing:inherit\">\_</em>by Wet Ink Games, which is absolutely overflowing with house rules for wilderness survival.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px\"><span style=\"font-family:roboto\">For the DM looking to make the wilderness into a truly scary place with lots of rich, rewarding gameplay, it’s got rules for weather, moon cycles, hunting and butchering monsters, and a whole bunch of super creepy monsters, spells, items and wilderness locations.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px\"><span style=\"font-family:roboto\">Definitely recommended.</span></p><div class=\"wp-block-image\" style=\"box-sizing:inherit;margin:0px;padding-bottom:0px\"><figure class=\"aligncenter size-large is-resized\" style=\"box-sizing:inherit;margin:0px auto;padding:0px;border:0px;clear:both;display:table;max-width:100%;height:auto\"><img style=\"box-sizing:inherit;height:auto;vertical-align:bottom;border-radius:inherit\" src=\"https://d1vzi28wh99zvq.cloudfront.net/images/9148/274922.jpg\" width=\"300\" /><figcaption style=\"box-sizing:inherit;margin-bottom:1em;font-size:13px;display:table-caption;caption-side:bottom\"><span style=\"font-family:roboto\">Source:\_<em style=\"box-sizing:inherit\">Into the Wyrd and Wild (Revised Edition),\_</em>Wet Ink Games</span></figcaption></figure></div></div></div><h2 style=\"box-sizing:inherit;margin-bottom:20px;border:0px;font-family:'Playfair Display', serif;font-size:30px;font-weight:600;line-height:1.2em;font-variant-numeric:normal;font-variant-east-asian:normal;font-variant-caps:small-caps;color:#9b312d;letter-spacing:0.5px\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Montages vs. Detailed Travel – Which One To Use and When</strong></span></span></h2><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">When running a journey through the wilderness, whether that means a week-long trek through a dark forest, scaling a mountain, or journeying through a vast cavern complex, the dungeon master has to decide whether they want to handwave the entire process, run a punishing test of survival over multiple sessions, or pick something somewhere in between.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">The\_<em style=\"box-sizing:inherit\">Dungeon Master’s Guide\_</em>offers two suggestions for running wilderness and overland travel: the montage and the hour-by-hour approach.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Using a montage – like in film and TV – allows you to effectively gloss over large chunks of time while still reminding your players that their characters are undergoing a much more grueling time than sitting around the gaming table with a bag of chips and some Code Red Mountain Dew.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">In a few sentences, you can describe sweeping vistas, moody forests, and the day-to-day experiences of the adventurers.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Just remember that no matter how much you’d rather be down in the dungeon throwing waves of goblins at your players, nailing a few key details of your montage can do a lot to help make your world feel real and evocative to your players.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">While saying “you walk for three uneventful days” is perfectly serviceable, I guarantee that a few well-chosen sensory details are going to do a lot to help reinforce the fiction for your players.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Instead, try…</span></p><blockquote class=\"wp-block-quote\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:1.5em;margin-left:0px;padding-top:20px;padding-right:20px;padding-bottom:20px;border-width:0px 2px;border-image:initial;font-size:21px;position:relative;line-height:1.7;background-color:rgba(212, 204, 152, 0.1);overflow-wrap:break-word;color:#0a0a0a;font-family:roboto;border-color:initial #9b312d initial #9b312d;border-style:initial solid initial solid\"><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px\"><span style=\"font-family:roboto\"><em style=\"box-sizing:inherit;font-style:italic\">“You trudge for three days through driving rain and bitter cold, your breath rising in plumes before your faces. Your nights are spent huddled beneath what sparse cover you can find in these accursed hills, watching the darkness for signs of goblins – or worse.</em></span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:0px;padding:0px;border:0px\"><span style=\"font-family:roboto\"><em style=\"box-sizing:inherit;font-style:italic\">The way is hard, rising again and again in a series of switchbacks and sharp doglegs as you venture deeper into the mountains. On the evening of the third day, tired, hungry, soaking wet, you arrive at your destination.”</em></span></p></blockquote><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Sure, it takes maybe 60 seconds longer, but your players are much more likely to feel immersed in the events. The wilderness feels more real to them now, and they’re more likely to play their characters accordingly.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">If you (and your players) like wilderness travel, then using the rules in the previous sections to run the game hour-by-hour is a great way to go.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">If you don’t want to get quite so nitty-gritty with it, you can always run each day in four-hour chunks, called “watches.”</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Just like a montage, however, make sure that you hit a few sensory descriptors with each change in weather, terrain, and time of day.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">These help orient your players and mitigate the risk that travel can start to feel a little too much like a board game – which, interestingly enough, it was in 1st edition\_<em style=\"box-sizing:inherit\">D&amp;D</em>.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">You actually had to buy a totally unrelated board game (which you can\_<a style=\"box-sizing:inherit;transition:color 0.1s ease-in-out 0s, background-color 0.1s ease-in-out 0s;text-decoration-line:none;color:#1b78e2\" href=\"https://www.amazon.com/dp/B001AOAB9A?tag=blackcitadel-20\" target=\"_blank\" rel=\"nofollow noopener\" data-wpel-link=\"external\">still find online</a>\_if you’re into that sort of thing) that wasn’t even made by TSR, which you played instead of\_<em style=\"box-sizing:inherit\">D&amp;D\_</em>until your characters reached the dungeon.</span></p><h2 style=\"box-sizing:inherit;margin-bottom:20px;border:0px;font-family:'Playfair Display', serif;font-size:30px;font-weight:600;line-height:1.2em;font-variant-numeric:normal;font-variant-east-asian:normal;font-variant-caps:small-caps;color:#9b312d;letter-spacing:0.5px\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Random Encounters</strong></span></span></h2><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">We’ll go into random encounters in detail in a future article, but in essence, as you travel through the wilderness, random encounters simulate the chances of bumping into its various occupants.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">The DM sets an increment of time (some use every hour, some use four, and some just roll once or twice per day) and rolls a d20 whenever their chosen duration is up.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">If the result is\_<a style=\"box-sizing:inherit;transition:color 0.1s ease-in-out 0s, background-color 0.1s ease-in-out 0s;text-decoration-line:none;color:#1b78e2\" href=\"https://blackcitadelrpg.com/random-encounters-5e/\" data-wpel-link=\"internal\">a 19 or 20, then the players have a random encounter.</a></span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Random encounters can range from randomly determined monsters going about their business to friendly NPCs or even hooks to new adventures, depending on what the DM chooses to generate.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Adventurers moving at a fast pace are more likely to be surprised by a random encounter, and a slow-moving party will usually have a chance to stealth around it or lay an ambush if they choose.</span></p><h2 style=\"box-sizing:inherit;margin-bottom:20px;border:0px;font-family:'Playfair Display', serif;font-size:30px;font-weight:600;line-height:1.2em;font-variant-numeric:normal;font-variant-east-asian:normal;font-variant-caps:small-caps;color:#9b312d;letter-spacing:0.5px\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Mapping the Wilderness</strong></span></span></h2><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Lastly, we’re going to take a look at some of the ways to map the wilderness.</span></p><div class=\"wp-block-image\" style=\"box-sizing:inherit;margin:0px 0px 1.5em;color:#0a0a0a;font-family:roboto;font-size:21px\"><figure class=\"aligncenter size-large is-resized\" style=\"box-sizing:inherit;margin:0px auto;padding:0px;border:0px;clear:both;display:table;max-width:100%;height:auto\"><img class=\"wp-image-4837\" style=\"box-sizing:inherit;height:auto;vertical-align:bottom;border-radius:inherit\" src=\"https://blackcitadelrpg.com/wp-content/uploads/2021/12/Expedition-Map-1024x536.jpg\" sizes=\"(max-width: 1024px) 100vw, 1024px\" srcset=\"https://blackcitadelrpg.com/wp-content/uploads/2021/12/Expedition-Map-1024x536.jpg 1024w, https://blackcitadelrpg.com/wp-content/uploads/2021/12/Expedition-Map-300x157.jpg 300w, https://blackcitadelrpg.com/wp-content/uploads/2021/12/Expedition-Map-768x402.jpg 768w, https://blackcitadelrpg.com/wp-content/uploads/2021/12/Expedition-Map.jpg 1200w\" width=\"400\" /><figcaption style=\"box-sizing:inherit;margin-bottom:1em;font-size:13px;display:table-caption;caption-side:bottom\"><span style=\"font-family:roboto\">© Wizards of the Coast by Scott Murphy</span></figcaption></figure></div><h3 style=\"box-sizing:inherit;margin-bottom:20px;border-width:0px 0px 2px;border-image:initial;font-family:'Playfair Display', serif;font-size:25px;font-weight:bold;line-height:1.2em;color:#9b312d;border-color:initial initial #c9ad6a initial;border-style:initial initial solid initial\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>“Freestyle” Travel</strong></span></span></h3><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">This is probably the simplest option for dungeon masters who want to gloss over wilderness travel – especially when the players’ destination and the intervening lands are well known to them.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Freestyle mapping involves looking at the party’s location on your world or area map, plotting how far it is away from their intended destination in miles, and using their travel pace to figure out how many hours, days, or weeks the journey will take.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Maybe make note of the points at which they’ll pass by any other landmarks so you can describe them, and you’re good to go.</span></p><h3 style=\"box-sizing:inherit;margin-bottom:20px;border-width:0px 0px 2px;border-image:initial;font-family:'Playfair Display', serif;font-size:25px;font-weight:bold;line-height:1.2em;color:#9b312d;border-color:initial initial #c9ad6a initial;border-style:initial initial solid initial\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Hex Crawls</strong></span></span></h3><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">The “classic” flavor of\_<em style=\"box-sizing:inherit\">D&amp;D\_</em>map, and ideal for games that focus on exploration and a more involved approach to wilderness travel.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">A hex-map breaks up the world into six-sided spaces, which tend to be either 1 mile, 6 miles (the classic scale for a hex crawl), or larger for world maps.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Some hexes contain pre-written content, and entering an empty hex usually prompts a roll for a random encounter. Players then have the option of taking an action to explore, forage, or map their current hex or move on.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">My favorite thing about hex crawls is that when the players get lost, you can roll a d6 and count round their current hex to determine the direction in which they move.</span></p><div class=\"wp-block-image\" style=\"box-sizing:inherit;margin:0px 0px 1.5em;color:#0a0a0a;font-family:roboto;font-size:21px\"><figure class=\"aligncenter size-large is-resized\" style=\"box-sizing:inherit;margin:0px auto;padding:0px;border:0px;clear:both;display:table;max-width:100%;height:auto\"><img style=\"box-sizing:inherit;height:auto;vertical-align:bottom;border-radius:inherit\" src=\"https://media.wizards.com/images/dnd/products/Starter_Ex_MapTH.jpg\" width=\"300\" /></figure></div><h3 style=\"box-sizing:inherit;margin-bottom:20px;border-width:0px 0px 2px;border-image:initial;font-family:'Playfair Display', serif;font-size:25px;font-weight:bold;line-height:1.2em;color:#9b312d;border-color:initial initial #c9ad6a initial;border-style:initial initial solid initial\"><span style=\"box-sizing:inherit\"><span style=\"font-family:'Playfair Display', serif\"><strong>Point Crawls</strong></span></span></h3><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">This is a slightly more abstracted version of a hex crawl that has found favor with DMs looking to emphasize more liminal or unmappable environments.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">Point Crawls contain several “points” of interest, which could be\_<a style=\"box-sizing:inherit;transition:color 0.1s ease-in-out 0s, background-color 0.1s ease-in-out 0s;text-decoration-line:none;color:#1b78e2\" href=\"https://blackcitadelrpg.com/dnd-towns-5e/\" data-wpel-link=\"internal\">towns</a>, dungeons, or other landmarks, with lines drawn between them marking out the distance and time required to make that journey.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:1.5em;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">When the party travels between two points, they could elect to travel any way they like – road, off-piste, or by flying golden barge, and the method of travel is then used to modify their expected travel time.</span></p><p style=\"box-sizing:inherit;margin-top:0px;margin-bottom:0px;padding:0px;border:0px;color:#0a0a0a;font-family:roboto;font-size:21px\"><span style=\"font-family:roboto\">If you like the idea of including wilderness travel in your game but don’t want to muck about poring over maps to figure out if that tiny drawing of a hill would count as difficult terrain, the mixture of abstraction and mechanical crunch that point crawls provide might be for you.</span></p>"
