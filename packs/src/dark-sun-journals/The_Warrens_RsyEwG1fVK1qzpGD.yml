      content: >-
        <p>This sprawling slum scars Tyr's northern quarter—a sea of dilapidated
        structures housing the desperate, the poor, and the unlucky. Freed
        slaves swarmed into the Warrens following Kalak's overthrow, seeking
        places to call their own. Some found work on the very plantations
        outside the city that had once enslaved them, while others, less
        fortunate or ambitious, turned to crime for survival.</p>

        <p>Visitors are strongly advised to remain on the neighborhood's
        periphery. Monsters make their lairs in the deepest sections of the
        Warrens, where countless structures have stood empty and crumbling for
        decades.</p>

        <p>Beyond a handful of impoverished craftspeople and grim wine shops,
        the Warrens offer few permanent establishments of note.</p>

        <p><strong>Elven Bridge</strong>: The ancient Elven Bridge hangs over a
        dust-filled streambed that has been dry for as long as anyone can
        remember. This secluded spot is a site for clandestine exchanges and
        ambushes against innocents lured into the Warrens.</p>

        <p><strong>House on Sand Street</strong>: One place even the brutal
        gangs of the Warrens avoid is the winding, gutted alleyway called Sand
        Street. This road dead-ends at a structure that is not decrepit like
        those all around it. Rumors say that within the building dwells a
        worm-like creature known as a psurlon.</p>

        <p><strong>Elven Market</strong>: Destitute as the Warrens are, many
        people visit the area to shop at the Elven Market. Stalls and tables
        clutter the dark alleyways, and elf peddlers beset anyone who seems
        likely to have a coin or two to rub together. Most elven goods are
        worthless baubles, but some tribes offer exotic items and curiosities
        that are not available anywhere else in Tyr. The Nightwinds tribe deals
        in silk rope, fleece, and soaps; the Vinian tribe sells exotic pets such
        as hurrums and lizards; and the Greenstone elves specialize in candles,
        sunrods, and everburning torches.</p>

        <p><strong>Screaming Cellar</strong>: Just off the Elven Market is an
        abandoned winehouse whose cellar contains a secret entrance into
        Under-Tyr. When a crew of Toothcutters raided the winehouse one night
        and killed the proprietors, the conflict woke some kind of evil, which
        manifests as a screaming spirit of rage. No one who has seen it has
        survived, and those who hear the screams that issue up through the
        ground have troubled dreams.</p>
