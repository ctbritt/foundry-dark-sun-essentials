      content: |-
        <p>To the east of the Somber Woods, Lava Gorge is a deep</p>
        <p>depression with sheer cliffs that drop almost 1,500 feet</p>
        <p>to a lake of molten lava. The heat rising from the gorge</p>
        <p>keeps most creatures away from its jagged edges, but those</p>
        <p>who stray too close often find themselves riding crumbling</p>
        <p>stone into the boiling rock below. Travelers need to avoid</p>
        <p>getting too close to the gorge. Temperatures within a half</p>
        <p>mile of the lava lake are as much as 30 degrees to 100</p>
        <p>degrees higher than the normal temperature of the day.</p>
        <p>This increase in temperature isn't always gradual, and</p>
        <p>an errant breeze can feel like a blast furnace if it blows</p>
        <p>across the burning lake of rock. The intense heat can</p>
        <p>blister exposed flesh, burn the lungs, and cause even the</p>
        <p>strongest half-giant to be knocked unconscious.</p>
        <p>Luckily, the red glow of the bubbling lava can be seen</p>
        <p>from a great distance as one travels the stony barrens</p>
        <p>surrounding it. During the day, the air over the gorge</p>
        <p>shimmers with rising heat and the sky above takes on a</p>
        <p>slight reddish glow. At night, the lava lights up the sky</p>
        <p>and sets fire to the horizon for miles around, making it</p>
        <p>impossible to miss. When travelers spot the gorge, they</p>
        <p>should turn toward the east or west to go around it. To</p>
        <p>continue toward it is to risk an extremely painful death.</p>
