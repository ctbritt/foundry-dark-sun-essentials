      content: "<h2>King Tithian of Tyr - The False Liberator</h2>\n<ul>\n<li><strong>Cur,rent Status</strong>: Self-appointed King of Tyr, precarious ruler</li>\n<li><strong>Former Role</strong>: High Templar under Sorcerer-King Kalak</li>\n<li><strong>Background</strong>: Coup participant who helped overthrow Kalak ~18 months ago</li>\n</ul>\n<h3>Personality &amp; Motivations</h3>\n<p>Tithian is <strong>ambitious, manipulative, and ruthlessly pragmatic</strong>. Outwardly confident and urbane, he presents himself as the \"Liberator King\" who freed @UUID[Compendium.dark-sun-essentials.dark-sun-journals.V1NqXyJJtt5x4TMl]{Free City of Tyr} from tyranny. This is largely false—heroes like @UUID[Compendium.dark-sun-essentials.dark-sun-journals.FLIKOaceVCB5eazI]{Rikus}, @UUID[Compendium.dark-sun-essentials.dark-sun-journals.BnwkYeDBMXmzMK0C]{Agis of Asticles}, and @UUID[Compendium.dark-sun-essentials.dark-sun-journals.9oveKYg27foKqiXq]{Sadira} did most of the actual liberation work, but Tithian seized the opportunity to claim power when @UUID[Compendium.dark-sun-essentials.dark-sun-creature-catalog.UmV1Rck6pxDmWESX]{King Kalak of Tyr} fell.</p>\n<p><strong>His true obsession</strong>: Tithian desperately craves the power of a genuine sorcerer-king. He lacks the magical authority that commands absolute obedience, and he \"deeply resents\" having to answer to other power groups or seek approval for his decrees.</p>\n<h3>Secret Dark Alliance</h3>\n<p>Unknown to almost everyone, <strong>Tithian has secretly allied with two undead servants of Rajaat</strong>—@UUID[Compendium.dark-sun-essentials.dark-sun-creature-catalog.9tq7XwhpRY1ipNuw]{Sacha, the Unseen Counselor} and @UUID[Compendium.dark-sun-essentials.dark-sun-creature-catalog.bOoKRV5tCXJc3LzO]{Wyan, the Twisted Counselor} (disembodied defiler heads from the ancient Cleansing Wars). They meet with him in Kalak's sealed ziggurat throne room at night, promising him the key to sorcerer-kinghood if he helps them free their master, Rajaat the First Sorcerer.</p>\n<p>Tithian believes he's using them as much as they're using him, agreeing to help destroy the Dragon Borys and break Rajaat's prison in exchange for immortality as a true Champion of Rajaat.</p>\n<h3>Political Challenges</h3>\n<p>Tithian's rule is <strong>extremely precarious</strong>. He must constantly balance competing factions:</p>\n<ul>\n<li><strong>Freed slaves</strong> demanding justice and rights</li>\n<li><strong>Traditional nobles</strong> wanting their property and status restored</li>\n<li><strong>Former templars</strong> hoping he'll restore their influence</li>\n<li><strong>Merchant houses</strong> seeking favorable trade arrangements</li>\n<li><strong>The @UUID[Compendium.dark-sun-essentials.dark-sun-journals.4ngSM92FQMeMm4we]{Veiled Alliance}</strong>\_watching for any sign of tyranny</li>\n</ul>\n<p>He lacks the magical fear that kept Kalak's subjects in line, so every decree requires tacit approval from these power groups.</p>\n<h3>Current Activities &amp; Relationship with Korala</h3>\n<p>As established in today's session, Tithian conducts afternoon consultations with Korala. Given his desperate search for magical power and his secret alliances, these meetings likely involve:</p>\n<ul>\n<li>Seeking magical knowledge or artifacts from Nibeney</li>\n<li>Political maneuvering regarding trade relationships</li>\n<li>Possibly coordinating activities that serve his hidden agenda</li>\n</ul>\n<p>The Veiled Alliance is deeply concerned about what Tithian and Korala might be planning together.</p>\n<h3>Daily Routine &amp; Obsessions</h3>\n<p>Tithian spends long hours in <strong>Kalak's former palace and ziggurat</strong>, scouring the dead tyrant's libraries and vaults for hidden sorcery. Ancient tomes whisper to him of tremendous powers—the Dark Lens, the Pristine Tower, Rajaat himself. This obsession drives many of his seemingly erratic policy decisions.</p>\n<h3>Abilities &amp; Threats</h3>\n<ul>\n<li><strong>Skilled psionicist</strong>: Like many templars, he's a formidable mindbender</li>\n<li><strong>Political manipulator</strong>: Will lie, flatter, or betray as needed</li>\n<li><strong>Hidden resources</strong>: Diverts templar funds into secret expeditions and excavations</li>\n<li><strong>Growing power</strong>: His authoritarian tendencies are increasing as he consolidates control</li>\n</ul>\n<h3>Dark Secrets</h3>\n<p>Rumors suggest Tithian may be <strong>secretly maintaining Tyr's tribute to the Dragon Borys</strong> by kidnapping citizens as slaves, despite slavery being officially outlawed. If this \"secret shame\" were exposed, it would likely trigger rebellion.</p>\n<h3>The Veiled Alliance's Perspective</h3>\n<p>Sadira and the Veiled Alliance watch Tithian with deep suspicion. They've noted his obsession with Kalak's artifacts and his secretive meetings, though they haven't yet discovered his alliance with Sacha and Wyan. They're prepared to act if he openly moves to restore tyrannical magic or becomes a true sorcerer-king.</p>\n<p>Tithian represents the classic Dark Sun dilemma: a man trying to \"hold two lions by the tail\"—the volatile city of Tyr on one side, and the ancient powers of Athas on the other. His agenda will either save Tyr from the Dragon or doom it by unleashing something far worse.</p>"
