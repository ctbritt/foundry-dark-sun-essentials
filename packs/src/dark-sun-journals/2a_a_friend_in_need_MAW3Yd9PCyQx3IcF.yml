      content: "<p>Setup. Right now, players should turn to Players\x92 Book p. 15\x97Ziggurat of Tyr. If</p>\n<p>later they befriend Urrgos, ask them then to turn to p. 41\x97Urrgos.</p>\n<p>Start. This encounter begins one morning as the PCs assemble into work crews.</p>\n<p>Read the following aloud:</p>\n<p>An odd din rises over the caterwauling of the overseers and you raise your sunscorched</p>\n<p>brow toward the disturbance. A crowd of slaves quickly clusters around</p>\n<p>the source of the sound, packed in elbow-to-elbow. As you crane your neck to</p>\n<p>watch, a stinging hail of grit assails the clustered slaves, who scramble for safety.</p>\n<p>At the center of the ring, a slouching half-giant whirls about, swiping massive</p>\n<p>hands at the nimble elves who are tormenting him.</p>\n<p>Encounter. Six elves tease a clumsy half-giant, using speed and agility to slip his</p>\n<p>grasp. The elves shout cruel taunts while the half-giant swipes at them or slings huge</p>\n<p>fistfuls of sand in their direction.</p>\n<p>Role-Playing. The elves\x92 taunts are bitingly sarcastic. They lampoon the giant\x92s</p>\n<p>ugliness, slowness, witlessness, and imitative personality. The giant cannot match</p>\n<p>their verbal insults. Frustrated, he lashes out with fists, throws sand, and bellows.</p>\n<p>Dialogue</p>\n<p>\x93Hey Urrgos\x97you can pretend to be me!\x94 [Chorus of \x93no, me\x97no me\x94 from</p>\n<p>the other elves.]</p>\n<p>\x93I get it! You\x92re impersonating a kank, right?\x94</p>\n<p>\x93He\x92s a rock! No\x97rocks move faster than him.\x94</p>\n<p>\x93You go away! You just leave alone!\x94</p>\n<p>\x93Urrgos not want be like you, little bug.\x94</p>\n<p>Statistics. Urrgos, half-giant: AL N?; AC 10; MV 15; HD 4; hp 44; THAC0 14;</p>\n<p>#AT 1; Dmg Punch/wrestle + 8; SZ L (11\x92); ML 10; Str 20; Dex 12; Con 15; Int</p>\n<p>10; Wis 7; Cha 9.</p>\n<p>Elves: AL CE; AC 8; MV 12; HD 3; hp 6 each; THAC0 19; #AT 1; Dmg 1d4</p>\n<p>(bone daggers); ML 10; Str 12; Dex 16; Con 11; Int 15; Wis 10; Cha 14.</p>\n<p>Outcome. The spectacle wears on until the overseers arrive with whips to break it up.</p>\n<p>Unless prevented, the elves return to torment Urrgos over the coming days. Repeat</p>\n<p>similar encounters at morning, mealtime, and breaktime. With each, Urrgos grows</p>\n<p>more frustrated. Make it clear the half-giant lacks a good role-model to imitate.</p>\n<p>After three days, Urrgos erupts in a murderous rage, slaughtering anyone nearby</p>\n<p>until the guards finally cut him down.</p>\n<p>A strong show of force by the PCs keeps the elves at bay. Any character with a</p>\n<p>Charisma of 16 or more automatically becomes Urrgos\x92s role model. Otherwise the</p>\n<p>PC with the highest Charisma below 16 can become the role model with a successful</p>\n<p>Cha roll. Urrgos tries to model himself after the character and to become his best</p>\n<p>friend. The elves make any possible jab at Urrgos and his friend.</p>\n<p>Next. From this encounter, play Part Three, Encounter A\x97Bodyguard, or continue</p>\n<p>with other storylines of Part Two.</p>"
