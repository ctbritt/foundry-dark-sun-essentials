      content: >-
        <p>The King's Gardens include three lushly wooded and overgrown plots of
        land. Walking amid these green canopies is like stepping into the
        fertile past of Athas. Lavish amounts of water from the Golden City's
        wells and a small army of attentive gardeners keep these areas alive
        with growth despite the killing climate; Kalak ordered this done so that
        he would have a ready source of life for his defiling magic. With Kalak
        gone, the same gardeners—under the leadership of the Master of the
        Gardens, a half-elf templar named Dafna—continue to tend the botanical
        reserve because the gardens contain many rare trees, including a few
        said to be magical.</p>
