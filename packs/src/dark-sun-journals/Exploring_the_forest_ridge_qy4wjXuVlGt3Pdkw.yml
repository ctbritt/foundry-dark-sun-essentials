    text:
      format: 1
      content: "<p>The Forest Ridge is more properly described as a great plateau or highland. Most of the region lies at an elevation\_ approaching 10,000 feet, and the air is 30 to 40 degrees cooler than in the lowlands of the Tyr Region. The Ringing\_ Mountains intercept the prevailing westerly winds and the little moisture they carry. As a traveler climbs from the\_ Tablelands through the passes of the mountain range, walls of clouds bunch up behind the peaks ahead, and the rumble of thunder echoes in the distance. Farther west, the ridge\_steadily descends thousands of feet to meet the\_ scrub\_plains of the Western Hinterlands, and the climate\_grows progressively hotter and drier until the trees\_finally\_ give out.</p>"
