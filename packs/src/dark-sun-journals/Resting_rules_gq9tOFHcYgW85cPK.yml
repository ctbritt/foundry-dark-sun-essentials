      content: "<h1>Resting</h1>\n<p>\_</p>\n<div id=\"pagecontent\" data-pageid=\"6743\">Heroic though they might be,\_<a href=\"https://roll20.net/compendium/dnd5e/The%20Land%20of%20the%20Mists#h-Adventurers\">Adventurers</a>\_can’t spend every hour of the day in the thick of\_<a href=\"https://roll20.net/compendium/dnd5e/Exploration#h-Exploration\">Exploration</a>,\_<a href=\"https://roll20.net/compendium/dnd5e/Social%20Interaction#h-Social%20Interaction\">Social Interaction</a>, and\_<a href=\"https://roll20.net/compendium/dnd5e/Combat#h-Combat\">Combat</a>. They need rest—time to sleep and eat, tend their wounds, refresh their minds and spirits for\_<a href=\"https://roll20.net/compendium/dnd5e/Spellcasting#h-Spellcasting\">Spellcasting</a>, and brace themselves for further adventure.<br /><br /><a href=\"https://roll20.net/compendium/dnd5e/The%20Land%20of%20the%20Mists#h-Adventurers\">Adventurers</a>\_can take\_<a href=\"https://roll20.net/compendium/dnd5e/Creating%20Encounters#h-Short%20Rests\">Short Rests</a>\_in the midst of an\_<a href=\"https://roll20.net/compendium/dnd5e/Adventuring#h-Adventuring\">Adventuring</a>\_day and a\_<a href=\"https://roll20.net/compendium/dnd5e/Social%20Interaction#h-Long%20Rest\">Long Rest</a>\_to end the day.<br /><br /><a name=\"h-Short%20Rest\"></a><a name=\"toc_1\"></a>\n<h2><a href=\"https://roll20.net/compendium/dnd5e/Social%20Interaction#h-Short%20Rest\">Short Rest</a></h2>\nA\_<a href=\"https://roll20.net/compendium/dnd5e/Social%20Interaction#h-Short%20Rest\">Short Rest</a>\_is a period of\_<a href=\"https://roll20.net/compendium/dnd5e/Downtime#h-Downtime\">Downtime</a>, at least 1 hour long, during which a character does nothing more strenuous than eating, drinking, reading, and tending to wounds.<br /><br />A character can spend one or more Hit\_<a href=\"https://roll20.net/compendium/dnd5e/Dice#h-Dice\">Dice</a>\_at the end of a\_<a href=\"https://roll20.net/compendium/dnd5e/Social%20Interaction#h-Short%20Rest\">Short Rest</a>, up to the character’s maximum number of Hit\_<a href=\"https://roll20.net/compendium/dnd5e/Dice#h-Dice\">Dice</a>, which is equal to the character’s level. For each Hit Die spent in this way, the player rolls the die and adds the character’s\_<a href=\"https://roll20.net/compendium/dnd5e/Ability%20Scores#h-Constitution\">Constitution</a>\_modifier to it. The character regains\_<a href=\"https://roll20.net/compendium/dnd5e/Monsters#h-Hit%20Points\">Hit Points</a>\_equal to the total. The player can decide to spend an additional Hit Die after each roll. A character regains some spent Hit\_<a href=\"https://roll20.net/compendium/dnd5e/Dice#h-Dice\">Dice</a>\_upon finishing a\_<a href=\"https://roll20.net/compendium/dnd5e/Social%20Interaction#h-Long%20Rest\">Long Rest</a>, as explained below.<br /><br /><a name=\"h-Long%20Rest\"></a><a name=\"toc_2\"></a>\n<h2><a href=\"https://roll20.net/compendium/dnd5e/Social%20Interaction#h-Long%20Rest\">Long Rest</a></h2>\nA\_<a href=\"https://roll20.net/compendium/dnd5e/Social%20Interaction#h-Long%20Rest\">Long Rest</a>\_is a period of extended\_<a href=\"https://roll20.net/compendium/dnd5e/Downtime#h-Downtime\">Downtime</a>, at least 8 hours long, during which a character sleeps or performs light activity: reading, talking, eating, or standing watch for no more than 2 hours. If the rest is interrupted by a period of strenuous activity—at least 1 hour of walking,\_<a href=\"https://roll20.net/compendium/dnd5e/Know%20Your%20Players#h-Fighting\">Fighting</a>, casting\_<a href=\"https://roll20.net/compendium/dnd5e/Spells#h-Spells\">Spells</a>, or similar\_<a href=\"https://roll20.net/compendium/dnd5e/Adventuring#h-Adventuring\">Adventuring</a>\_activity—the\_<a href=\"https://roll20.net/compendium/dnd5e/The%20Wild%20Beyond%20the%20Witchlight#h-Characters\">Characters</a>\_must begin the rest again to gain any benefit from it.<br /><br />At the end of a\_<a href=\"https://roll20.net/compendium/dnd5e/Social%20Interaction#h-Long%20Rest\">Long Rest</a>, a character regains all lost\_<a href=\"https://roll20.net/compendium/dnd5e/Monsters#h-Hit%20Points\">Hit Points</a>. The character also regains spent Hit\_<a href=\"https://roll20.net/compendium/dnd5e/Dice#h-Dice\">Dice</a>, up to a number of dice equal to half of the character’s total number of them (minimum of one die). For example, if a character has eight Hit\_<a href=\"https://roll20.net/compendium/dnd5e/Dice#h-Dice\">Dice</a>, he or she can regain four spent Hit\_<a href=\"https://roll20.net/compendium/dnd5e/Dice#h-Dice\">Dice</a>\_upon finishing a\_<a href=\"https://roll20.net/compendium/dnd5e/Social%20Interaction#h-Long%20Rest\">Long Rest</a>.<br /><br />A character can’t benefit from more than one\_<a href=\"https://roll20.net/compendium/dnd5e/Social%20Interaction#h-Long%20Rest\">Long Rest</a>\_in a 24-hour period, and a character must have at least 1 hit point at the start of the rest to gain its benefits.</div>"
