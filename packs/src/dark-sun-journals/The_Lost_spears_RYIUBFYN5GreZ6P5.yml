    text:
      format: 1
      content: "<p>For years, Gulg’s sorcerer-queen Lalali-Puy has sought to build a force of halfling slave-soldiers to serve as scouts and assassins against Nibenese soldiers in the Crescent Forest. Halflings are woodwise beyond all but the most skilled judaga\_\_hunters. However, haiflings do not take to slavery well, and some of the Oba’s slaves have vanished into the forest. The Lostspears are a small tribe of about fifty escaped halflings who wander the forest’s central region, a threat to Gulgans and Nibenese both.</p>"
