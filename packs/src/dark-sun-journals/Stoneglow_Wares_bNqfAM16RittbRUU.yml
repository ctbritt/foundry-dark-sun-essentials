              dae:
                macro:
                  name: Torch
                  img: icons/sundries/lights/torch-white.webp
                  type: script
                  scope: global
                  command: >-
                    let lightSource = "torch";

                    let file =
                    "modules/gambits-premades/assets/images/torch.webp";

                    let torchStatus = Sequencer.EffectManager.getEffects({ name:
                    `${token.document.id} ${lightSource}` });


                    async function updateTorch() {
                        if (args[0].macroPass === "preApplyDynamicEffects") {
                            if (torchStatus.length === 0 && (macroItem.system.uses.value !== 0 || macroItem.system.quantity !== 1)) {
                                await showTorchLightDialog();
                            } else if (torchStatus.length !== 0) {
                                await showTorchOptionsDialog();
                            }
                            else {
                                ui.notifications.warn("You do not have any torches remaining.")
                                workflow.aborted = true;
                            }
                        }

                        if (args[0] === "off" && args[1]["expiry-reason"] && (args[1]["expiry-reason"].includes("times-up") || args[1]["expiry-reason"].includes("effect-deleted")) && args[1]?.existing !== "effect-stacking") {
                            const light = { dim: 0, bright: 0 };
                            await token.document.update({ light });
                            await Sequencer.EffectManager.endEffects({ name: `${token.document.id} ${lightSource}`, object: token });
                        }
                    }


                    async function showTorchLightDialog() {
                        await foundry.applications.api.DialogV2.wait({
                        window: { title: 'Torch' },
                        content: `
                            <div class="gps-dialog-container">
                                <div class="gps-dialog-section">
                                    <div class="gps-dialog-content">
                                        <div>
                                            <div class="gps-dialog-flex">
                                                <p class="gps-dialog-paragraph">Would you like to light a torch?</p>
                                                <div id="image-container" class="gps-dialog-image-container">
                                                    <img src="${macroItem.img}" class="gps-dialog-image">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `,
                        buttons: [{
                            action: "Light",
                            label: "Light",
                            callback: async (event, button, dialog) => {
                                await lightNewTorch();
                            }
                        }],
                        close: async (event, dialog) => {
                            return;
                        }, rejectClose:false
                        });
                    }


                    async function showTorchOptionsDialog() {
                        await foundry.applications.api.DialogV2.wait({
                        window: { title: 'Torch' },
                        content: `
                            <div class="gps-dialog-container">
                                <div class="gps-dialog-section">
                                    <div class="gps-dialog-content">
                                        <div>
                                            <div class="gps-dialog-flex">
                                                <p class="gps-dialog-paragraph">What would you like to do with your torch?</p>
                                                <div id="image-container" class="gps-dialog-image-container">
                                                    <img src="${macroItem.img}" class="gps-dialog-image">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `,
                        buttons: [{
                            action: "Light New",
                            label: "Light New",
                            callback: async (event, button, dialog) => {
                                await Sequencer.EffectManager.endEffects({ name: `${token.document.id} ${lightSource}`, object: token });
                                if((macroItem.system.uses.value === 0 && macroItem.system.quantity === 1)) {
                                    const light = {dim: 0, bright: 0};
                                    await token.document.update({light});
                                    await Sequencer.EffectManager.endEffects({ name: `${token.document.id} ${lightSource}`, object: token });
                                    const effectName = await actor.effects.find(i => i.name === "Torch");
                                    if(effectName) await actor.deleteEmbeddedDocuments("ActiveEffect", [effectName.id]);
                                    ui.notifications.warn("You do not have any torches remaining.")
                                    return;
                                }
                                else {
                                    await lightNewTorch();
                                }
                            }
                        },
                        {
                            action: "Extinguish",
                            label: "Extinguish",
                            callback: async (event, button, dialog) => {
                                const light = {dim: 0, bright: 0};
                                await token.document.update({light});
                                await Sequencer.EffectManager.endEffects({ name: `${token.document.id} ${lightSource}`, object: token });
                                const effectName = await actor.effects.find(i => i.name === "Torch");
                                if(effectName) await actor.deleteEmbeddedDocuments("ActiveEffect", [effectName.id]);
                            }
                        }],
                        close: async (event, dialog) => {
                            return;
                        }, rejectClose:false
                        });
                    }


                    async function lightNewTorch() {
                     new Sequence()

                            .effect()
                            .delay(150)
                            .name(`${token.document.id} ${lightSource}`)
                            .file(game.modules.get("jb2a_patreon")?.active ? "jb2a.impact.002.orange" : "") //Add fallback effect path here in the empty quotes if there's another you'd like to use due to no patreon jb2a
                            .atLocation(token)
                            .attachTo(token, {bindRotation: true, local: true})
                            .scaleToObject(0.9, {considerTokenScale: true})
                            .spriteOffset({x:0.525*token.document.width, y:-0.05*token.document.width}, {gridUnits:true})
                            .spriteRotation(45)
                            .zIndex(0.1)

                            .effect()
                            .name(`${token.document.id} ${lightSource}`)
                            .file(file)
                            .atLocation(token)
                            .attachTo(token, {bindRotation: true, local: true})
                            .scaleToObject(1.2, {considerTokenScale: true})
                            .scaleIn(0, 500, {ease: "easeOutElastic"})
                            .scaleOut(0, 250, {ease: "easeOutCubic"})
                            .spriteOffset({x:0.35*token.document.width, y:0.1*token.document.width}, {gridUnits:true})
                            .animateProperty("sprite", "rotation", { from: 60, to: -60, duration: 300, ease: "easeInOutBack"})
                            .animateProperty("sprite", "rotation", { from: 0, to: 30, duration: 250, delay: 200, ease: "easeOutBack"})
                            .persist()
                            .zeroSpriteRotation()

                            .effect()
                            .delay(250)
                            .name(`${token.document.id} ${lightSource}`)
                            .file("jb2a.flames.01.orange")
                            .atLocation(token)
                            .attachTo(token, {bindRotation: true, local: true})
                            .scaleToObject(1, {considerTokenScale: true})
                            .spriteOffset({x:0.5*token.document.width, y:-0.05*token.document.width}, {gridUnits:true})
                            .persist()
                            .spriteRotation(45)
                            .zIndex(0.1)
                            .waitUntilFinished(-500)

                            .play()
                        const light = { dim: game.gps.convertFromFeet({ range: 40 }), bright: game.gps.convertFromFeet({ range: 20 }), alpha: 0.25, angle:360, luminosity: 0.5, color: "#ffb433", animation: { type: "lantern", speed: 4, intensity: 4 }, attenuation: 0.75, contrast: 0.15, shadows: 0.2 };
                        await token.document.update({ light });
                        if (macroItem.system.quantity > 1) {
                            await macroItem.update({ "system.quantity": macroItem.system.quantity - 1 });
                        } else {
                            //await actor.deleteEmbeddedDocuments("Item", [macroItem.id]);
                            await macroItem.update({ "system.uses.value": 0 });
                        }
                    }


                    updateTorch();
