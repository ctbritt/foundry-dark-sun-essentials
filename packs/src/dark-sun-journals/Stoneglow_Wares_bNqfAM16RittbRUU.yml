        jM4h8qpyxwTpfNli:
          notes: >-
            <h3><strong>Stoneglow Wares (General Store)</strong></h3>

            <ul>

            <li><strong>Proprietor</strong>: <strong>Fara</strong>, a meticulous
            and no-nonsense dwarf woman who deals in <strong>trade
            goods</strong> and <strong>rare finds</strong>.</li>

            <li><strong>Services/Items</strong>:

            <ul>

            <li><strong>Basic Adventuring Supplies</strong>, such as
            <strong>torches</strong>, <strong>rope</strong>,
            <strong>pitons</strong>, and <strong>simple climbing
            gear</strong>.</li>

            <li><strong>Desert Camouflage Cloaks</strong> made from <strong>kank
            hides</strong>, offering <strong>advantage</strong> on
            <strong>Stealth checks</strong> in sandy terrain.</li>

            <li><strong>Old Maps</strong> of the <strong>surrounding
            desert</strong> and <strong>Kemalok&rsquo;s ruins</strong> (though
            they may be <strong>incomplete</strong> or
            <strong>unreliable</strong>).</li>

            </ul>

            </li>

            <li><strong>Special Interaction</strong>: Fara has a <strong>keen
            eye for treasure</strong> and is interested in <strong>rare
            objects</strong>. If the party finds <strong>strange relics</strong>
            or <strong>unusual artifacts</strong> in the desert, she may offer a
            <strong>reward</strong> or <strong>trade</strong>. She is also a
            good source of <strong>local rumors</strong> about <strong>strange
            occurrences</strong> in the desert.</li>

            </ul>

            <h3>&nbsp;</h3>
