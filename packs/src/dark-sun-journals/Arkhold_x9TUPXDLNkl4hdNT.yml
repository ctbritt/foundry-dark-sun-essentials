    text:
      format: 1
      content: "<p>A ruined seaport buried in the sands by the shores\_of the Sea of Silt, Arkhold is so remote that few\_treasure-hunters have picked it over. The timeworn\_fortress of a forgotten order of knights sits atop the\_highest point of the settlement, overlooking the\_dry harbor. Drifting sand covers much of Arkhold\_and shifts from place to place over time, exposing\_long-buried portions of the area while hiding others\_beneath new dunes.</p>"
