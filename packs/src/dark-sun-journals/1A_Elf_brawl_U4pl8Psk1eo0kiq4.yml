      content: "<p><strong>Setup</strong>. This encounter takes place in the elven quarter. Tell the players to turn to Players' Book p. 47-Hlven Plass Map.</p>\n<p><strong> Start</strong>. Read the following stond:</p>\n<p>The day he reached its hottest comer, when only the most desperate merchants\_keep their shops open. The streets lie deserted but for a few poor beggers who\_have no other place to stay. Have each player indicate his location on the Elven Plaza Map, After all PCs are\_placed, begin the encounter.</p>\n<p><strong>Encounter</strong>. A pair of raffish looking elves enter the plaza at point A on the map and head toward point B. They are tall and slender, their skin a crinkly brown from the sun. Their somber but finely-cut clothes denote high status within their tribe.</p>\n<p>At point C a half-elf huddles in the shade of a wine shop. His clothes are dirty and tattered. As the elves pass, he at tempts to beg some bits from them. The pair stop and one hisses, \"Shut up, race defiler! Inix toenail filth!\" The beggar spits in reply and the elves attack with vicious kicks. They plan to beat the beggar to a pulp.</p>\n<p>\_</p>\n<p><strong>Role-Playing.</strong> Play the elves with contempt and arrogance. Describe how they continue to kick the half-elf, even though he lays curled up in a helpless ball. Each kick\_carries with it a sneering insult and a cruel laugh. Attacking beggars is what these\_two do for fun. They continue until the characters do something or the half-elf dies</p>\n<p>\_</p>\n<p><strong>Dialogue</strong></p>\n<p>\"Cur of a human woman!\"</p>\n<p>\"Elven ears on a human body-we ought to cut them off!\" \"And that's for staining my clothes with blood, vermin.\"</p>\n<p>\_</p>\n<p><strong>Reactions</strong>. If the PCs intervene, the elves happily broaden the fight. They make only</p>\n<p>Punching and Wrestling attacks unless the characters draw weapons. Then, each elf pulls a dagger from his clothing.</p>\n<p>\_</p>\n<p><strong>Statistics</strong>. Prithen and Nandlex (elves): AL CE; AC 7 (leather armor); MV 12; HD 2; hp 7, 12: THACO 19; #AT 1; Dmg 144 1 (bone daggers); MR Nil; SZ M; ML 12 (Steady); XP 420; Str 13; Dex 15; Con 12: Int 13; Wis 11, Cha 14.</p>\n<p>\_</p>\n<p><strong>Outcome</strong>. If the elves win, a templar patrol hauls off the PCs left there. If the PCs are winning, a mob of elves gathers, siding with Prithen and Nandles. Before any thing more can happen, a patrol of two templars and four half-giant fighters charges in. Any PCs caught by the templar patrol go to work on Kalak's Ziggurat Next. If all the PCs are slaves, continue with Part Two. Otherwise, choose from</p>\n<p>\_</p>\n<p>encounters 1B, 1C, 1D, or 1E.</p>"
