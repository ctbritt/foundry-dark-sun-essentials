      content: >-
        <p>Recently the victim of an assassination attempt, Minthur represents
        the vulnerability of Tyr's new political class. His survival has made
        him both more cautious and more determined to see Tyr's experiment
        succeed. The attack on him serves as a stark reminder that the city's
        enemies are willing to use violence to destabilize the government,
        making him a useful source of information about threats to the
        Council.</p><p></p>
