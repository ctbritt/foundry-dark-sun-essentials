      content: "<section id=\"h.1465820674871621_244\">\n<div>\n<div tabindex=\"-1\">\n<div>\n<div>\n<div>\n<div>\n<div id=\"h.1465820674871621_241\">\n<div>\n<div>\n<p dir=\"ltr\">Celik is an ancient city that was one of the jewels in the crown of Green Age domains. Now mostly a jumble of ruins, it nevertheless continues to function as a city thanks to those who live there. The citizens of Celik are a mixture of retired adventurers, outcasts from other societies, ex-slaves, and humanoids from the wastes who have gathered in the city for the protection, resources, and wealth the location promises.</p>\n<p dir=\"ltr\">Korsun (male human/16th-level trader/LN), the patriarch of the merchant house of Mareneth, controls the city. All of its assets and citizens belong to him. Mareneth was the primary merchant house of the city-state of Kalidnay. When that city was destroyed, the members of the house who were away at the time decided to set up their own community in order to survive. After a little bit of searching, the house’s agents found the ruins of Celik. The call went out for brave warriors to help clear out all vermin and dangerous creatures, and within a year a small portion of the ruins were made habitable. Today, almost 60 percent of the city is occupied by the merchant house and its retainers. The rest of the ruins remain wild and dangerous, sealed behind walls and fences thrown up to keep whatever resides there from emerging into the living city.</p>\n<p dir=\"ltr\">In Celik, the merchant house holds the same position as the sorcerer-kings of the cities to the north. Patriarch Korsun rules like a king, with his family, agents, and caravan troops serving as the city’s nobility. Everyone else in the city is considered to be free citizens, though they’re actually indentured servants who must earn their freedom by laboring for the house. Any intelligent, healthy being is welcome in Celik, provided he or she agrees to the terms of servitude. As long as the terms are being met, the citizens receive food, water, a place to live, and small amounts of spending money to use in the taverns and gaming halls run by the elf tribes who occupy a district within the living city.</p>\n<p dir=\"ltr\">The city is divided into two portions: the living city and the ruins.</p>\n<p dir=\"ltr\">The living city is where all of the merchants and citizens live. Like other cities, this portion has markets and other amenities. The ruins remain untamed. Foul humanoids and even undead creatures roam within the ruins, though every year Korsun’s troops absorb more of the ruins into the living city. Adventurers can make good money taking on hunting contracts for the merchant house, provided they can survive what waits within the ruins. Of course, they have to be careful about the terms of their employment. Many adventurers wind up as indentured servants of House Mareneth.</p>\n<p dir=\"ltr\">House Mareneth’s traders deal with the communities living in the southern reaches of the Tyr Region, as well as with a few of the smaller elf tribes. Caravans flying the house’s colors make regular trips to the seven cities of the north, though they mainly trade with Balic and North and South Ledopolus. In general, the traders try to keep a low profile, as Korsun prefers that his city remain mostly a mystery to the people of the north.</p>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<section id=\"h.7b1822b33a66d04d_151\">\n<div>\_</div>\n<div>\n<div tabindex=\"-1\">\n<div>\n<div>\n<div>\n<div>\n<div id=\"h.7b1822b33a66d04d_148\">\n<div>\n<div>\n<p dir=\"ltr\">Type: City</p>\n<p dir=\"ltr\">Population: 7500</p>\n<p dir=\"ltr\">Celik is an ancient city that was once a jewel of the Green Age. Now it is mostly a jumble of ruins, but a mixture of outcasts from all across the wastes have reclaimed much of it as their home. A human named Korsun, the patriarch of House Mareneth, is the leader of the city. The merchant houses of Celik control the city as nobility, and all other denizens are considered free citizens. In reality, citizens are bound in servitude to the merchant houses or expelled from the city. As long as the terms of the merchant houses are met, the citizens receive food, water, and a place to live.</p>\n<p dir=\"ltr\">The city is divided into two portions: the living city and the ruins. The living city is home to the merchant houses and all citizens, whereas the ruins remain dangerous and untamed. Korsun and his troops have been slowly expanding the living city for years, and adventurers are often a welcome addition to his forces. Good money can be earned working for the merchant houses, but one must be careful to not enter into contracts that can result in indentured servitude to House Mareneth.</p>\n<p dir=\"ltr\">Celik trades mostly with the southern areas of the Tyr region, and even then traders from the city attempt to keep a low profile. Korsum has no interest in attracting the eyes of the city states, and prefers to remain a mystery to most of those in the north.</p>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>"
