      content: "<p>The Natural Arena at Raam</p><p>The climb is hard up the narrow pathways that lead to the</p><p>arena at Raam. Cresting the final hillock, the natural</p><p>amphitheater lies wedged between the vertical rust-colored</p><p>rocks below. Spectators to the gladiatorial games</p><p>descend to the seating area below.</p><p>The arena of Raam is a natural amphitheater, carved</p><p>by time from the sandstone and bedrock of the hillside.</p><p>The spectator portion of the arena rises in a gradual slope</p><p>from the arena floor. The fierce winds of the Raam region</p><p>have carved layers in the hillside forming natural seating</p><p>areas. The sides of the spectator section have overhanging</p><p>outcroppings where the templar guards stand, watching</p><p>the crowd. At the bottom of the natural amphitheater is</p><p>the oval-shaped arena known for its reddish sandy floor.</p><p>A great natural fissure called \x93The Maw of Raam\x94 separates</p><p>the seating area from the arena. This ravine acts as a</p><p>natural barrier, protecting the spectators from the combatants</p><p>(and vice versa). The Maw is several hundred feet</p><p>long, 37 feet across, and 173 feet deep. Woe to any combatant</p><p>who is pushed into the yawning abyss of the Maw,</p><p>for it is filled with jagged rocks and wild brambleweed that</p><p>act as thousands of rapier-tipped teeth, ripping the skin of</p><p>the falling gladiators. Their screams echo through the</p><p>arena as they fall. No one is known to have ever reached</p><p>the bottom alive. Reports persist that the Maw is also</p><p>haunted by dwarven banshees, cursed to remain there for</p><p>all time due to the unfulfillment of their focus.</p><p>The natural curvature of the amphitheater amplifies</p><p>the acoustics so the screams, grunts, and groans of the</p><p>combatants can be clearly heard, even in the last row of</p><p>seats. This is a real crowd pleaser and inflames the bloodthirsty</p><p>throngs.</p><p>At the back of the arena, a granite wall rises, curving to</p><p>100 feet in height. This natural granite wall, carved by the</p><p>same forces that created the arena, extends back for a distance</p><p>of 400 feet, gradually descending to the desert floor.</p><p>The granite encircles the back of the arena and is shot</p><p>through with semi-precious stones, amethyst, and garnet.</p><p>Attempting to remove any rough gems from the arena is</p><p>punishable by death.</p><p>The back wall of the arena is riddled with myriad tunnels</p><p>and secret passages. The passages lead to hundreds of</p><p>small observation slits cut into the rock. Each narrow fenestration</p><p>is covered with a thin piece of black gauzy fabric.</p><p>Due to the paranoia rampant in the city-state of Raam,</p><p>it is from these areas that the sorcerer-queen Abalach-Re</p><p>and her templars view the gladiatorial games. So great is</p><p>their fear of regicide and reprisal that they hide away deep</p><p>within the rock. The gauze prevents anyone from seeing</p><p>who is behind a viewing station at any given time. It is said</p><p>that the templars shift to different viewing areas during</p><p>each tournament, lest someone discover their individual</p><p>hiding places. The queen has her own special set of catacombs</p><p>that allegedly connect her temple to the rock viewing</p><p>areas, although this has never been proven. Because</p><p>the queen and her templars stay hidden for the entire</p><p>day\x92s match, no appeals of mercy are heard in the gladiatorial</p><p>arena of Raam, as there is no one in the hierarchy who</p><p>will step forward to save a mere gladiator\x92s life. All</p><p>matches are fought to the death.</p><p>Because the erosion process that built this natural</p><p>amphitheater is ongoing, the arena caretakers fight a daily</p><p>battle to keep sand from filling the arena and the</p><p>amphitheater. Twenty slaves spend the day in the hot</p><p>Athasian sun brushing and shoveling sand from the</p><p>arena. It is thought that at one time, the Maw of Raam was</p><p>several hundred feet deep, but over time, has filled with</p><p>sand and brambleweed.</p><p>The gladiatorial games of Raam offer an interesting</p><p>dilemma for its fighters. Not only must they pay attention</p><p>to the attacks of their foes, but they must constantly be</p><p>aware of their physical proximity to the Maw of Raam.</p><p>Untrained gladiatorial slaves will occasionally choose the</p><p>depth of the crevasse over the blade of an onrushing gladiator.</p><p>Many a gladiator has fallen to his death when</p><p>pushed or driven to the edge.</p>"
