      content: |-
        <p>The village of Wrath, led by Lady Cesti, features a mix</p>
        <p>of humans and demihumans living in a fantasy of their</p>
        <p>leader's construction. Cesti, an ex-gladiator from Urik,</p>
        <p>grew up enamored of the nobles who owned her. Even in</p>
        <p>the slave pens of Urik, she withdrew into dreams of being</p>
        <p>a noble to escape the tribulations of the arena. When she</p>
        <p>gained her freedom and established Wrath, she did so</p>
        <p>with the illusion that she was of noble birth.</p>
        <p>The village is set up along the lines of a noble houseor</p>
        <p>at least Cesti's version of one. All of her advisers and</p>
        <p>raiding captains have noble titles, and the parties that</p>
        <p>follow a successful raid look more like a noble festival than</p>
        <p>a slave tribe celebration. Most of Cesti's followers enjoy</p>
        <p>the illusion that the ex-gladiator has created, though a few</p>
        <p>sometimes wonder about her sanity. Lady Cesti (as she</p>
        <p>prefers to be addressed) can often be heard talking about</p>
        <p>returning to Urik to participate in one noble function or</p>
        <p>another, and she appears to believe that Hamanu himself</p>
        <p>will grant her an audience if she so desires.</p>
