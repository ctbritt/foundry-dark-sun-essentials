      content: >-
        <p>Despite the poverty that plagues the Warrens, many visitors flock to
        the area's bustling Elven Market. Stalls and tables line the shadowy
        alleyways, where elven peddlers eagerly approach anyone who appears to
        have coin to spend. While most elven wares are little more than
        worthless trinkets, certain tribes offer exotic items and rare
        curiosities unavailable elsewhere in Tyr.</p><p>The Nightwinds tribe
        specializes in silk rope, fine fleece, and handcrafted soaps. The Vinian
        tribe trades in exotic pets, including hurrums and various lizard
        species. The Greenstone elves focus on illumination goods—candles,
        sunrods, and everburning torches.</p><p></p>
