      content: "<p>\_</p>\n<p>“The winds blow kindly on Pareth.”</p>\n<p>—old windrider proverb</p>\n<p>The second largest community of halflings is much smaller than Thamasku, and nearly as</p>\n<p>old. In the rhulisti tongue, its name means “hidden,” which is a fine descriptor for the</p>\n<p>secluded village. It is recessed back from a ledge that lies between two large, vertical</p>\n<p>outcroppings of rock and built even further to the rear, into a wide but shallow cave.</p>\n<p>The community is huge by rhul-thaun standards, with a population of 3,500, but still</p>\n<p>called a village. Its administrator, Bal-olech (ham/9/LG), is a retired windrider yearning</p>\n<p>for the old days. He wants to be young and spry so that he can ride the winds again.</p>\n<p>Since this cannot be, he lives vicariously through other windriders. Because of his feelings,</p>\n<p>Pareth has become particularly attractive to windriders. Bal-olech’s administrations</p>\n<p>have given merchants, safehome keepers, and others, encouragement to offer special</p>\n<p>incentives and services to windriders. Since this attracts new commerce, the har-etuil of</p>\n<p>the local clans does not oppose his mandates.</p>\n<p>Places of Note</p>\n<p>Ger-orif’s: This is the safehome favored by windriders throughout the Jagged Cliffs.</p>\n<p>Although it is quite expensive, the riders receive discounts based on how much time</p>\n<p>they have been in the profession.</p>\n<p>The five-story tavern offers food, drink and entertainment of high quality. There is a</p>\n<p>huge fountain and even a pool where guests can swim—a rare opportunity on Athas.</p>\n<p>The 35 opulent rooms above and around the pool offer relaxation and comfort</p>\n<p>unknown in most other places on Athas. Water flows freely throughout the structure,</p>\n<p>and servants are ready to cater to any whim.</p>\n<p>Prices</p>\n<p>Entry Fee (paid at the door): 3 ghav-egoths</p>\n<p>Room (per night): 10 ghav-egoths</p>\n<p>Meal (light): 1 ghav-egoth</p>\n<p>Meal (sumptuous): 3 ghav-egoths</p>\n<p>Drink: 2 ghav-egoths</p>\n<p>Discount: 30% discount for windriders, plus 1% per year of experience, to a maximum</p>\n<p>of 50%.</p>\n<p>Sahr-enor Plaza: This large plaza is located near the center of the village. Windriders</p>\n<p>use the open area to ground their mounts. The flyers are then turned over to tenders in the</p>\n<p>employ of the city who care for them. For a fee of 1 ghav-egoth, a tender will oversee the</p>\n<p>needs of any size windrider flyer for one night. The plaza is also used for public gatherings,</p>\n<p>large entertainments (sponsored by the city to attract windriders), and other affairs.</p>\n<p>Sanctuary of Pareth: This sanctuary is another major shaper stronghold, a complex</p>\n<p>56</p>\n<p>built into the side of the cliff. Using long-forgotten organic digging methods, the ancient</p>\n<p>life-shapers created a series of rooms and corridors within the cliff. Rumor has it that the</p>\n<p>shapers only use a small portion of this underground domain. The vast majority of its</p>\n<p>rooms and galleries are unused—and for the most part, unexplored. Other rumors assert</p>\n<p>that ancient tunnels honeycomb the entire cliff, and may be filled with knowledge and</p>\n<p>artifacts from the distant past. Regardless, the sanctuary of Pareth is the only existing</p>\n<p>rhul-thaun subterranean structure.</p>\n<p>The leader of the sanctuary is Mag-aven (haf/F8/NE), a twisted soul in a twisted body.</p>\n<p>An accident during a life-shaping experiment disfigured her long ago and drove her partially</p>\n<p>mad. Though she has supposedly recovered from the insanity, she has since developed</p>\n<p>a penchant for pain and the macabre.</p>\n<p>The Wind’s Song: This small shrine dedicated to elemental air is built high atop a tall</p>\n<p>tower. The builders designed this organic structure as a unique wind organ. When the</p>\n<p>wind blows through the various holes and tubes carved into its walls and floors, it creates</p>\n<p>an ever changing melody of varying pitches.</p>\n<p>There is a single cleric caring for this temple. Her name is Fen-adan (haf/P10/CG), and</p>\n<p>she mostly keeps to herself and to her temple. Fen-adan’s self-imposed duties are to maintain</p>\n<p>the temple and to keep the tubes and orifices of the wind organ clear and clean.</p>\n<p>Important NPCs</p>\n<p>Las-aren (haf/F7): AC 4 (hidden sheath armor and shield); MV 6; hp 43; THAC0 14;</p>\n<p>#AT 3/2; Dmg 1d6 or 1d10 (flashlance); SZ S (2’ 11” tall); ML Champion (16); AL CE;</p>\n<p>XP 975.</p>\n<p>S 16, D 15, C 15, 19, W 14, Ch 12.</p>\n<p>Personality: cruel, backbiting</p>\n<p>Special Equipment: climbers’ shield, climbing boots, flashlance, grasping hook, hidden</p>\n<p>sheath armor, sleep spore pod.</p>\n<p>Las-aren is a professional climber who lives in Pareth. She is completely evil and thoroughly</p>\n<p>untrustworthy, but still manages to get enough work to make ends meet.</p>\n<p>Occasionally, she lures prospective employers into secluded areas in order to kill them</p>\n<p>and strip the valuables from their pockets.</p>\n<p>Las-aren has long black hair—unusual for a rhul-thaun female. Her features are</p>\n<p>deceptively delicate, for she is strong and capable. She prefers drab clothing and tries to</p>\n<p>project a plain, homely appearance.</p>\n<p>The PCs may encounter her as a hired climber, a guide, or even a rival adventurer.</p>\n<p>She may even be a long-term rival or enemy. Las-aren is not a foe whose first response</p>\n<p>is combat with the PCs—unless she is sure she can win. She is more likely to use subterfuge</p>\n<p>or deceit to defeat opponents.</p>\n<p>Flar-onib (ham/C10 [earth]): AC 1 (shell armor and shield); MV 6; hp 47; THAC0 14</p>\n<p>(12 with Str); #AT 1; Dmg 1d6+1 (mace); SA gate 4 cubic feet of earth; SZ S (3’ 1”</p>\n<p>tall); ML Fanatic (17); AL CG; XP 2,000.</p>\n<p>S 18, D 10, C 12, I 10, W 16, Ch 14.</p>\n<p>Personality: kind, quiet</p>\n<p>Special Equipment: lens grafts, shell armor</p>\n<p>Spells (6/6/3/3/2): 1st; bless, cure light wounds, elemental bonding, magical stone, pass</p>\n<p>without trace, sanctuary; 2nd; dust devil, draw upon holy might, enthrall, hold person</p>\n<p>(x2), silence 15’r 3rd; locate object, meld into stone, stone shape; 4th; cure serious</p>\n<p>wounds, divination, return to the earth; 5th; anti-plant shell, transmute rock to mud.</p>\n<p>Flar-onib is a wandering priest. He has no temple to support him, but instead travels</p>\n<p>about helping the downtrodden and poor in the name of elemental earth. He frequents</p>\n<p>the village of Pareth more than most, having a special affection for its people. Fen-adan,</p>\n<p>the priestess of air in the city, dislikes him and it is rumored that they were once lovers.</p>\n<p>This holy man has long, unkempt brown hair and a scraggly appearance overall. He</p>\n<p>chooses to use a simple, life-shaped mace rather than more sophisticated weapons.</p>\n<p>The PCs may encounter him as a benefactor or he may himself serve as the basis of an</p>\n<p>adventure, requiring the aid of the PCs to accomplish some good task he has undertaken.</p>"
