      content: >-
        <p><span style="color:#191813">Smaller and more mountainous than
        Dhuurghaz, Avegdaar is home to nomadic bands of desert giants. The clans
        of Avegdaar raid out of necessity, since their island cannot support
        even the meager herds raised by the giants of Dhuurghaz. Avegdaar is
        also home to a large population of fire drakes. These creatures attack
        the raiding clans, but only when their own hunting is particularly
        bad—even fire drakes can’t stand up to a dozen angry giants.</span></p>
