  - sort: 1520000
    name: The Last Page
    type: text
    _id: ai2kYN9aibBzO39L
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <div class="fvtt narrative"><p>Buried beneath the scattered ledgers, you
        find a single sheet of parchment, strangely unmarred by time. It is
        heavy, thick stock—meant to last centuries.</p><p>The ink has faded to a
        soft brown, but the penmanship remains firm and deliberate, except at
        the very end where the strokes tremble, as if the writer’s strength
        failed mid-word.</p><p>A faint dusting of white stone powder coats the
        page—crumbling from the ceiling above—and you realize with a chill that
        it has preserved the parchment perfectly, like ash preserving the memory
        of a fire long gone.</p></div><p class="parchment-note-1"><span
        class="polyglot-journal" data-tooltip="Dwarvish"
        data-tooltip-direction="UP" data-language="dwarvish"><span
        style="font-family:Packard Antique Bold">The ink fades as the last of
        the light dims.<br /><br />By my hand and oath, I record the names of
        those who stood. Not for glory, nor reward, but because it was right.<br
        /><br />The hammer falls, and the stone holds. The names endure. We
        endure.<br /><br />“Let it be known, when none remain to…”<br /><br
        /></span></span></p>
