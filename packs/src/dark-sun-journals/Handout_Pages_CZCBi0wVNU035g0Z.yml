    image: {}
    text:
      format: 1
      content: >-
        <p><span class="font-size-20 polyglot-journal" title="Common"
        data-language="common">Ambassador,</span></p>

        <p><span class="font-size-20 polyglot-journal" title="Common"
        data-language="common">As the shadows deepen, the fruits of our labor
        grow sweeter. The recent change in Elven leadership has created ripples,
        offering opportunities for the diligent.</span></p>

        <p><span class="font-size-20 polyglot-journal" title="Common"
        data-language="common">A shipment of arcane strength journeys to a
        distant outpost. I trust you will find this revelation valuable, should
        it fall into the right hands.</span></p>

        <p><span class="font-size-20 polyglot-journal" title="Common"
        data-language="common">Alas, not all is smooth sailing. Our mutual
        adversary has taken notice of the darkness I walk. Your wise counsel on
        this matter would be greatly appreciated.</span></p>

        <p><span class="font-size-20 polyglot-journal" title="Common"
        data-language="common">I await your guidance on these matters, as the
        shadows grow ever deeper.</span></p>

        <p><span class="font-size-20 polyglot-journal" title="Common"
        data-language="common">Evershadow</span></p>
