  - sort: 100000
    name: Cornelius' Journals Vol 1.
    type: text
    _id: yhkAsYyWPzWRJFVR
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <h4>Day 1</h4>

        <p><em>"Today marks the beginning of a new chapter in my scientific
        career. We have finally arrived at the god's body and begun setting up
        our research facility. The possibilities are endless, and I can hardly
        contain my excitement."</em></p>

        <h4>Day 4</h4>

        <p><em>"The team is hard at work, unpacking equipment and setting up our
        lab. The god's body is an enigma, and I can't wait to begin studying it.
        I have a feeling that this expedition will yield discoveries beyond our
        wildest dreams."</em></p>

        <h4>Day 8</h4>

        <p><em>"I've spent the day exploring the god's body, and I am in awe of
        its scale and complexity. I can't help but wonder what secrets it holds
        and what mysteries it can reveal to us. We have only just begun, but I
        can already sense that this will be the most significant scientific
        endeavor of my career."</em></p>

        <h4>Day 12</h4>

        <p><em>"The team is settling in well, and we have already begun to
        gather data and samples from the god's body. The initial findings are
        promising, and I am confident that we will make groundbreaking
        discoveries. This is an exciting time, and I am honored to be a part of
        this expedition."</em></p>
      markdown: ''
