  - sort: 800000
    name: Letter from Murwawa
    type: text
    _id: H45GUWKBUAd5sQbS
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p data-pm-slice=\"0 0 []\"><span class=\"font-size-20\">Esteemed Ambassador Vorr,</span></p>\n<p><span class=\"font-size-20\">I trust this letter finds you in good health and high spirits. I wish to inform you of recent developments concerning the adventurers who have caused so much excitement among the court.</span></p>\n<p><span class=\"font-size-20\">It seems that their ultimate goal is to locate a powerful artifact known as the Mythallar. Their intentions regarding this artifact are unclear, but its power and significance should not be underestimated.\_</span></p>\n<p><span class=\"font-size-20\">These adventurers have already proven to be a thorn in my side, and their continued pursuit of the Mythallar could pose a significant threat to our joint long-term plans for mutual trade and an alliance. I advise you to keep a watchful eye on their activities, and if necessary, take steps to hinder or redirect their efforts. In the meantime, I will continue to gather information and report my findings to you.</span></p>\n<p><span class=\"font-size-20\">As always, I remain your friend and partner,</span></p>\n<p><span class=\"font-size-20\">Ozamata Murawa</span></p>"
