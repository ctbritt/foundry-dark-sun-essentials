    image: {}
    text:
      format: 1
      content: "<p><em>\"Today I tried a new recipe for apple pie. The crust was a bit too crunchy, but the filling was delicious. I must remember to use more cinnamon next time.\"</em> (followed by a few lines of recipe)</p>\n<p>…</p>\n<p><em>\"I've been making a list of the team's supplies and equipment. We're running low on food and pickaxes, I'll have to make sure to order more before our next trip.\"</em> (followed by a list of supplies)</p>\n<p>…</p>\n<p><em>The Scro, they come in ships so grand,<br />From far beyond our starry land.<br />Their eyes aglow with strange, green fire,<br />Their purpose, a mystery, a dire.</em></p>\n<p><em>They speak in tongues we cannot hear,<br />Their magicks, beyond our understanding dear.<br />But still, we welcome them with glee,<br />For knowledge, they may bring to thee.</em></p>\n<p><em>They roam the god's body with ease,<br />In search of secrets to appease.<br />But what they seek, we cannot know,<br />Their ways, so strange, so far from our own.</em></p>\n<p><em>They work in silence, day and night,<br />Their goals, an enigma, out of sight.<br />But still, we trust, we wait and see,<br />For in the Scro, there may be a key.</em></p>\n<p><em>The Scro, they come, they go,<br />Their ways, a mystery, and so,<br />We'll keep an open mind and heart,<br />For in the Scro, there may be a start.<br />...<br />\"all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre all work and no play makes jack a dull ogre …\"<br /></em></p>\n<p>\_</p>\n<p>\_</p>"
