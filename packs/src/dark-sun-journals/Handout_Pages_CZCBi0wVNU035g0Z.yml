  - sort: 100000
    name: Cornelius's Journals Vol. 3 (Revealed)
    type: text
    _id: CYWhmgDmq7dTbgDI
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>…</p>

        <p><em>"I have begun to suspect that the cerebral fluid is not just a
        substance, but a living entity. It seems to have a will of its own, and
        I can sense a powerful energy emanating from it. I must tread carefully,
        for I fear that I may be playing with forces beyond my
        understanding."</em></p>

        <p>…</p>

        <p><em>"I have been visited by Garrashq. He is becoming increasingly
        demanding and insistent that we accelerate our experiments. He is not
        interested in learning about the god's body, he is only interested in
        exploiting its power for his own gain."</em></p>

        <p>…</p>

        <p><em>"I have made a grave mistake. The cerebral fluid is not a
        substance to be trifled with. It is a force of nature, and I fear that
        these experiments have unleashed something terrible upon the
        world."</em></p>

        <p>…</p>

        <p><em>"I have beheld things that I wish to unsee. The Scro's
        experiments on the creatures they've taken from the god's body are
        beyond monstrous. They are creating abominations, and they will not stop
        until they've unleashed them upon the world."</em></p>

        <p>…</p>

        <p><em>"What have we done? The god's body is not a dead thing, it's
        alive in ways we cannot comprehend. The Scro's experiments are tearing
        it apart."</em></p>

        <p>…</p>

        <p><em>"I have been shown the true nature of Garrashq's plans, and I am
        horrified. He wants to harness the god's powers to create an army of
        living weapons, and he is willing to do whatever it takes to achieve his
        goal. These experiments are not only unethical, but also highly
        dangerous. I cannot allow myself to be a part of this, but I am afraid
        of what will happen if I refuse. I am torn between my duty to the team
        and my own sanity."</em></p>

        <p>…</p>

        <p><em>"I must find a way to stop them."</em></p>

        <p>…</p>

        <p><em>"It is time. I can no longer stand idly by as they continue their
        twisted experimentation. Most of my team is gone, so I have made the
        decision to end the Scro's plans, once and for all. I can only hope that
        my actions will be enough to stop the Scro and protect the innocent.
        Farewell, dear friends. Pray what happens next will never be
        revealed."</em></p>
      markdown: ''
