  - sort: 100000
    name: Cornelius's Journals Vol. 2
    type: text
    _id: vL5CQlIFw8qOn4fc
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<h4>Day 250</h4>\n<p><em>\"I have made a most extraordinary discovery. The cerebral fluid of the god's body is unlike anything I have ever encountered. It has properties that defy explanation, and I believe that it holds the key to unlocking the secrets of the god's body.\"</em></p>\n<h4>Day 277</h4>\n<p><em>\"I have been experimenting with the cerebral fluid, and the results have been nothing short of astounding. It has the ability to heal wounds, regenerate tissue, and even bring dead cells back to life. I can hardly believe what I am seeing with my own eyes.\"</em></p>\n<h4>Approximately 10 weeks ago…</h4>\n<p><em>\"A ship has appeared in A'Lantean space. We don't know who it belongs to or whether they mean us harm or not. They are not currently responding to our sendings. We have few people who can put up a fight if they are hostile, so all we can do is hope. How I wish that the last ship from Bral had come sooner, with a fresh set of supplies and maybe guards, but alas. I guess it's time to meet our new visitors and pray to whatever gods have domain here they're friendly.\"</em></p>\n<p>…</p>\n<p><em>\"The ship has landed on the god's body. We have no weapons or defenses, so we have no choice but to welcome our new guests. I have ordered the team to stand down and not to provoke them in any way. We will have to rely on diplomacy to get us through this.\"</em></p>\n<p>…</p>\n<p><em>\"The ship is from a people calling themselves the Scro, but to my astonishment, they're orcs! but of the most noble demanor. The Commander, War Chief Garrashq, promises us no harm, as the Scro are a more civilized form of Orc civilization. He says after the Unhuman war, his people retreated to their own hidden system, and have been working to make themselves presentable the rest of the knowne spheres.</em></p>\n<p><em>Garrashq says they're on an exploratory mission and mean us no harm. Garrashq, however, seems very interested in the Godbody. For all their civility, I can't shake the feeling that there's more to their story than they're letting on.\"</em></p>\n<p>…</p>\n<p><em>\"The Scro have requested to study the god's body, and given their superior strength, I have reluctantly agreed to allow them to do so. They have promised to share their knowledge with us, and perhaps they are genuine in their desire for a new homeword. I hope we can work together in peace, but I will keep my guard up.\"</em></p>\n<p>\_</p>"
      markdown: ''
