      content: "<p>\_</p>\n<p>“Glerran, jewel of the cliffs,</p>\n<p>guard my love’s restless sleep</p>\n<p>until I return to lie by her side.”</p>\n<p>—unknown rhul-thaun poet</p>\n<p>The village of Glerran was one of the oldest established communities of rhul-thaun still</p>\n<p>in existence today. Glerran is even older than Pareth, but it is not as large a community.</p>\n<p>Its name, in the language of the ancient rhulisti, simply means “green.” In the village’s</p>\n<p>heyday, the name had meaning—it was literally surrounded by a vertical forest. The forest</p>\n<p>is long gone, but the community still thrives as a climber’s haven.</p>\n<p>Numerous pathways, trails, and branches of the climbers lead to Glerran. One leads</p>\n<p>to the spot where a vertical bridge once provided a walkway around the great waterfall</p>\n<p>issuing from Ghavin Lake above. The organic bridge has long since collapsed and no</p>\n<p>attempt has been made to repair it. Only the most talented of climbers can cross the</p>\n<p>barrier of the falls, and it is this fact that caused the windriders to petition a number of</p>\n<p>har-etuil to argue against rebuilding the bridge in the Conclave. The windriders do not</p>\n<p>want increased competition.</p>\n<p>Glerran is a village of 2,500 inhabitants. Most of the population makes its livelihood</p>\n<p>as merchants and tenders, but Glerran has a greater than average number of climbers</p>\n<p>who are employed to maintain communication with Sol-fehn.</p>\n<p>The village administration is actually performed by two people, Kal-odot</p>\n<p>(ham/Ps12/NE) and Fren-anan (haf/Ps15/CE). These twins, brother and sister, are psionicists</p>\n<p>with mysterious and hidden talents. The twins can switch personalities, exchanging</p>\n<p>minds with each other so that each may occupy the other’s body by an agreement of</p>\n<p>wills, across virtually any distance. They can also communicate telepathically at all</p>\n<p>times without barriers. These special abilities have allowed them to coordinate their</p>\n<p>58</p>\n<p>actions and rise to a position of power. It is actually only Kal-odot who holds the position</p>\n<p>of administrator. His sister is seen merely as a popular socialite who often opposes</p>\n<p>her brother’s decisions. (Fren-anan does this to play the gadfly, infiltrating organizations</p>\n<p>of opposition, deluding enemies, and confusing competitors.) The twins are the only</p>\n<p>functional psionicists in rhul-thaun society. They are self-taught, and use their abilities to</p>\n<p>further their ends.</p>\n<p>Places of Note</p>\n<p>Bid-unos: This is the largest temple of elemental earth in rhul-thaun society. Its name</p>\n<p>means “earthdance,” and in an annual display of clerical power, the priests of the</p>\n<p>temple animate a great mass of rock outside the temple. The Festival of Great Earth creates</p>\n<p>a tremendous amount of thunderous clamor, which is annoying and frightening to</p>\n<p>many villagers, most of whom do not associate with the temple or its religion.</p>\n<p>There are five priests who manage this temple. Concealed from virtually everyone outside</p>\n<p>the priesthood, the high priest of Bid-unos (ham/P12/CG) is in possession of a</p>\n<p>magic item. Untold generations ago, at the dawn of the Age of Magic, a group of outsiders</p>\n<p>came to the Jagged Cliffs. A lowly cleric whom the temple of elemental air had</p>\n<p>punished met them. He rejected the faith of air and began to worship the power of</p>\n<p>earth. And so they exiled him for heresy.</p>\n<p>The tribe of outlanders was an evil band out to exploit unexplored territory. They captured</p>\n<p>the halfling cleric and were beginning to torture him with hot coals on his tongue,</p>\n<p>seeking information. A pyreen who witnessed these events attacked the group and killed</p>\n<p>them all, saving the life of the cleric.</p>\n<p>The halfling cleric was terrified, but when he regained his composure, he seized the</p>\n<p>odd equipment that had belonged to the strangers. There were certainly other magical</p>\n<p>devices found that day. (Artifices that were lost, inadvertently destroyed, or stolen—</p>\n<p>these may yet be encountered somewhere among the rhul-thaun.) The cleric’s attention</p>\n<p>was drawn to a single enchanted article: a device called an earth wand. This wand had</p>\n<p>the power to cause stone to move and act as commanded by the wielder (like the 7thlevel</p>\n<p>priest spell, animate rock). Believing he had been given a sign and a gift from the</p>\n<p>greater element of earth, the cleric made his way to Glerran, founded the temple, and</p>\n<p>began a tradition of animating stone every 10 years to display the power of his personal</p>\n<p>element. In the years since, the wand has always been in the possession of the high</p>\n<p>priest, and in recent times the traditional celebration of the wand’s power has been</p>\n<p>changed to an annual festival. The clerics of the temple, however, are unaware that the</p>\n<p>wand only has two charges left.</p>\n<p>Because of that ancient cleric’s encounter with the pyreen, the temple preaches a</p>\n<p>doctrine of the reality of amazingly powerful beings of nature at the top of the cliffs,</p>\n<p>who guard the rhul-thaun and all earth worshipers from harm.</p>\n<p>Sanctuary of Glerran: This large structure houses over 100 life-shapers who live and</p>\n<p>work here, growing and nurturing their creations. The life-shapers of Glerran are a freewilled</p>\n<p>and independent group which resents the sinister edicts that come from the leadership</p>\n<p>in Thamasku. Under their local superior, Dehm-acov (haf/F8/CG), the Glerran</p>\n<p>shapers are about to make their independence known to Thamasku. They expect the</p>\n<p>inevitability of actual conflict, but they also believe they can overcome any force Gilogres</p>\n<p>sends to force the sanctuary into submission.</p>\n<p>Teblish: This place is not actually as old as its name, which means “thorny” in the</p>\n<p>tongue of the rhulisti. This large, organic safehome was grown within the confines of its</p>\n<p>predecessor’s decaying and rotting walls. For reasons lost to time, the previous structure</p>\n<p>on this spot was grown so that the walls sprouted long, dangerous thorns. The old, shriveled</p>\n<p>thorns are still visible on the outside walls of the building, along with the remnants</p>\n<p>of the former establishment. Inside, however, Teblish is a new and obviously thriving</p>\n<p>enterprise.</p>\n<p>The safehome also doubles as a theater and drama, music, and tale-telling are all performed</p>\n<p>here. Meals and drinks are served to everyone in the theater. The second and</p>\n<p>third floors hold rooms for paying guests to spend the night. The entertainment is free,</p>\n<p>and draws a large crowd each night. Rooms cost only 3 ghav-egoths and meals run</p>\n<p>about 1 ge.</p>\n<p>59</p>\n<p>Important NPCs</p>\n<p>Seth-opal (ham/T8): AC 5 (hide armor and Dexterity bonus); MV 6; hp 29; THAC0</p>\n<p>17; #AT 1; Dmg 1d6 (armspike); SA x3 backstab; SZ S (3’ 1 inch tall); ML Steady</p>\n<p>(12); AL NE; XP 1,400.</p>\n<p>S 12, D 15, C 10, I 17, W 14, Ch 11.</p>\n<p>Personality: aloof, uncaring</p>\n<p>Special Equipment: armspike, hide armor, deathspray, lockpick, stealthboots</p>\n<p>Thief Abilities: PP 45, OL 30, F/RT 35, MS 90, HS 70, DN 45, CW 60, RL 0.</p>\n<p>Seth-opal is a cruel and heartless killer who secretly operates out of the Teblish safehome,</p>\n<p>posing as a merchant named Ren-odar. While he won’t do anything to jeopardize</p>\n<p>his cover at the Teblish, he can be hired to work as an assassin or thief. Most of the</p>\n<p>time, however, he works on his own, for himself, killing wealthy merchants for their</p>\n<p>money and goods, breaking into homes, and committing other nefarious deeds. This evil</p>\n<p>character will always be an opponent of the player characters, who may encounter him</p>\n<p>as he attempts to rob one of them.</p>\n<p>Completely average in appearance, Seth-opal is a master of disguise. He keeps his</p>\n<p>thick, black hair close-cropped to enable him to wear wigs and other disguises. His</p>\n<p>eyes are brown, and he rarely wears the same style of clothing or makeup paint twice</p>\n<p>unless he is posing as Ren-odar, in which case he wears long, bulky clothing to make</p>\n<p>himself appear heavier.</p>\n<p>Sahn-abish (haf/F9): AC 4 (half shell and shield); MV 6; hp 64; THAC0 12; #AT 3/2;</p>\n<p>Dmg 1d6 (short sword); SZ S (2’ 9” tall); ML Elite (13); AL N; XP 2,000.</p>\n<p>S 16, D 14, C 17, I 10, W 9, Ch 12.</p>\n<p>Personality: self-serving, inquisitive</p>\n<p>Special Equipment: coolcloak, climbing boots, spineshield</p>\n<p>60</p>\n<p>Sahn-abish is virtually unique in rhul-thaun society—she is a rogue life-shaper. She left the</p>\n<p>sanctuary of Thamasku nine years ago, and has been on the run from the shapers and</p>\n<p>their assassins ever since. She was (and is) a talented crafter, but she disapproved of the</p>\n<p>shapers’ methods and plans. She came to Glerran because she heard that the sanctuary in</p>\n<p>this village was discontented with the way of things coming from Thamasku. She has</p>\n<p>made secret contacts with Dem-acov, voicing her support for a schism within the shapers.</p>\n<p>At this point, however, she chooses to keep her presence concealed.</p>\n<p>Sahn-abish has long red hair that she keeps tucked up inside a leather cap when she</p>\n<p>is traveling incognito. Her clothing too is simple, in order to avoid attracting attention.</p>"
