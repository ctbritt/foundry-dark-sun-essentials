      content: |-
        <p>Ravage is the wealthiest of the Bandit States. It</p>
        <p>resembles a large trade village more than a struggling exslave</p>
        <p>community. Its leader, Talid the bandit lord, has a</p>
        <p>vision that keeps Ravage on a path of growth and could</p>
        <p>mean big things for all of the Bandit States. However, few</p>
        <p>of his fellow bandit lords are willing to cooperate at the</p>
        <p>level necessary for Talid's plans to succeed.</p>
        <p>Talid wants to unite the Bandit States into one nation</p>
        <p>that stretches across the entire Barrier Wastes. Of course,</p>
        <p>the ex-gladiator from Raam sees himself as the head of</p>
        <p>this nation of outlaws, a vision that causes the other</p>
        <p>bandit lords lots of trouble. They don't trust Talid or</p>
        <p>his grand promises of wealth and power. When the mul</p>
        <p>calls for a conclave of bandit lords (which he does on</p>
        <p>a regular basis), most of the tribal leaders answer. These</p>
        <p>meetings routinely break down as each leader tries to get</p>
        <p>the best deal for his or her own tribe. Talid is never able</p>
        <p>to get them to understand the value of cooperation or the</p>
        <p>strength a united front will give all of the tribes.</p>
        <p>Though they all distrust Ravage in the extreme and</p>
        <p>are jealous of its wealth, none of the competing tribes are</p>
        <p>willing to attack the village directly. As it's extremely well</p>
        <p>fortified, direct attacks against the village often end in</p>
        <p>victory for the defenders and lose of life for the attackers.</p>
        <p>The other tribes have no qualms about occasionally</p>
        <p>striking at returning raiding parties, however. Such a</p>
        <p>strike isn't easy either, but it stands a better chance of</p>
        <p>succeeding than a suicide raid against the main village.</p>
