        <p>The Last Sea</p>

        <p>The Last Sea is the final surviving remnant of the</p>

        <p>Green Age, a time long since past. The lands around it</p>

        <p>recall happier days, before the coming of the monstrous</p>

        <p>evil of Rajaat and his genocidal Champions. It is a place</p>

        <p>unspoiled by magic, and its caretakers – Mind Lords and</p>

        <p>mortal residents alike-take great pains to ensure that it</p>

        <p>remains that way.</p>

        <p>To most denizens of Athas, the Last Sea is the most</p>

        <p>amazing sight that they will ever behold. Nowhere else on</p>

        <p>the planet is there a body of water to be found anywhere</p>

        <p>near as large. In fact, on a world in which an entire town</p>

        <p>can be founded upon the existence of a single murky well,</p>

        <p>it seems that something as huge as the Last Sea would</p>

        <p>support a metropolis of staggering size, or even an entire</p>

        <p>nation composed of such cities.</p>

        <p>240</p>

        <p>Beyond the Tyr Region</p>

        <p>Nothing could be further from the truth. Marnita is</p>

        <p>surrounded mostly by small fishing villages inhabited by</p>

        <p>people who manage to eke out a living from the sea.</p>

        <p>(Of course, the very idea of having enough water to put</p>

        <p>a boat on is astonishing to most Athasians. Sure, such</p>

        <p>craft work on the Silt Sea, but that's dirt – tiny pieces</p>

        <p>of solid stuff. How could something like water hold up</p>

        <p>something as heavy as a boat? Upon first hearing the</p>

        <p>idea, most Athasians think that such a contraption would</p>

        <p>sink like a pebble dropped into a glass of foamy ale.)</p>

        <p>There are three reasons why the Last Sea isn't the site</p>

        <p>of the densest population center on the face of Athas.</p>

        <p>First, the Last Sea is salt water. Most Athasians have</p>

        <p>run across a pool of foul water before, something so</p>

        <p>brackish as to be undrinkable. To a newcomer, the Last</p>

        <p>Sea must seem like the cruelest joke ever: to have enough</p>

        <p>water to actually swim in, but not to be able to drink</p>

        <p>a drop of it. The waters of the Last Sea are clear and</p>

        <p>a deep blue-green. They are full of interesting creatures</p>

        <p>that most Athasians outside of the valley have never</p>

        <p>seen-things such as fish, seaweed, and even sharks and</p>

        <p>dolphins. Sailing ships crisscross the Last Sea's surface</p>

        <p>like elves skating across the dunes that cover the rest of</p>

        <p>the planet.</p>

        <p>Second, it's not easy for outsiders to get to the Last</p>

        <p>Sea. It is a long way from Tyr, a place from which so</p>

        <p>few people have been to the Last Sea that they nearly</p>

        <p>all consider Saragar to be something out of legend. As</p>

        <p>explained earlier, there are many physical barriers in the</p>

        <p>intervening distance, any one of which can be deadly</p>

        <p>Third, the Mind Lords like things the way they are</p>

        <p>within their valley. They have set up elaborate security</p>

        <p>measures (known as the Border of Guardians) to keep</p>

        <p>outsiders out and insiders in. For this reason, not even the</p>

        <p>ssurran traders that make occasional trips to rendezvous</p>

        <p>with envoys from Saragar have managed to settle on the</p>

        <p>shores of Marnita. They simply aren't allowed.</p>

        <p>The people of the Last Sea live relatively easy lives</p>

        <p>when compared with those of most of the other people on</p>

        <p>Athas. One thing that visitors might note about the Last</p>

        <p>Sea is that the only races represented here are humans,</p>

        <p>elves, and dwarves. There are no others to be found.</p>

        <p>Occasionally a mul or half-elf might be born to a</p>

        <p>couple within the region, but this is extremely uncommon.</p>

        <p>There is very little crime in the valley of the Last Sea</p>

        <p>(due almost entirely to the efforts of the Mind Lords and</p>

        <p>the lawkeepers of Saragar) and unwanted advances are</p>

        <p>nearly unheard of. This means that the parents of such a</p>

        <p>child would have conceived the baby willingly, and since</p>

        <p>the races of the region tend to stick with their own kind,</p>

        <p>few children of mixed blood are ever born.</p>

        <p>Those mixed-breeds who do exist are assimilated into</p>

        <p>the society without any problems. Unlike in the rest of</p>

        <p>Athas, where the races each have their own separate and</p>

        <p>distinct culture, in the city of Saragar, the peoples have</p>

        <p>banded together into a homogenous society tolerant of all.</p>

        <p>Muls and half-elves can truly be accepted here for who</p>

        <p>instead of what they are.</p>

        <p>Of course, outsiders are outsiders. A mul coming to</p>

        <p>Saragar looking for acceptance will encounter just as</p>

        <p>many problems as a human, elf, or dwarf of pure blood –</p>

        <p>no more, but no less either.</p>

        <p>In general, most people of the Last Sea region are</p>

        <p>suspicious of outsiders and many actually fear them. After</p>

        <p>all, outsiders are rare, and the people of the Last Sea have</p>

        <p>heard many legends of the descendants of those peoples</p>

        <p>not lucky enough to be protected by the Mind Lords</p>

        <p>from the ravages that ended the Green Age. The nearer</p>

        <p>to Saragar one goes, the more reactionary people become</p>

        <p>to the presence of outsiders. Within Saragar itself, if the</p>

        <p>city's lawkeepers get wind of the fact that someone has</p>

        <p>entered the city without authorization, there will likely be</p>

        <p>trouble for everyone involved.</p>

        <p>Among themselves, however, the people of Marnita tend</p>

        <p>to be relaxed and friendly. Most of the villages around</p>

        <p>241</p>

        <p>Beyond the Tyr Region</p>

        <p>the sea have basically a beach culture in which there is</p>

        <p>little that can't be put off until tomorrow. “Tomorrow,”</p>

        <p>the saying goes, “is the busiest day of the week, because</p>

        <p>that's when everything gets done.”</p>

        <p>Cuarsen</p>

        <p>This sleepy little fishing village is located in the middle</p>

        <p>of Marnita's southeastern shore, far from the influences of</p>

        <p>Saragar. Altogether, Cuarsen consists of approximately 50</p>

        <p>people, but this number fluctuates to a great deal higher</p>

        <p>from time to time as the many druids that live on the</p>

        <p>shores of Marnita favor this tiny place with most of their</p>

        <p>attention.</p>

        <p>For the most part, the druids of the valley of the Last</p>

        <p>Sea are genuinely different from those found in other parts</p>

        <p>of Athas. They live together in tiny beach communities of</p>

        <p>10 people or less, spending their days surfing on the waves</p>

        <p>of the Last Sea, constantly searching for the perfect ride.</p>

        <p>The hunt for the ultimate wave is a never-ending one,</p>

        <p>and it is the focus of these druids' days. Since a wave is</p>

        <p>an ephemeral thing by its very nature, these people are</p>

        <p>destined to never find permanent contentment. This is</p>

        <p>fine by them, though, as they enjoy the searching almost</p>

        <p>as much as they love the ride itself.</p>

        <p>To these nature priests, surfing is a means of communing</p>

        <p>with the water that they have come to love so much. To</p>

        <p>learn to surf and then to practice the lessons of surfing</p>

        <p>is to come to know the sea and to show not only your</p>

        <p>undying respect for it as a force of nature, but also the joy</p>

        <p>you can feel when you are totally in tune with that force.</p>

        <p>This is represented by riding smoothly, almost poetically</p>

        <p>atop a wave, knowing that it will end at any second and</p>

        <p>enjoying it all the same for as long as is possible.</p>

        <p>Most of the time, these druids live off of seafood they</p>

        <p>catch and fruits that they forage for along the shore.</p>

        <p>Eventually, though, this diet palls, even to such ascetics,</p>

        <p>and they come to Cuarsen for a drink and a meal. In</p>

        <p>exchange for these things, they trade ropes, mats, and hats</p>

        <p>they have woven from the grasses that grow just beyond</p>

        <p>the beaches.</p>

        <p>On any given day in Cuarsen, there are usually one</p>

        <p>or two bands of druids in town for some good grub.</p>

        <p>They are typically dressed only in shorts, the women</p>

        <p>wearing sleeveless half-shirts as well. Each and every one</p>

        <p>of the druids is burnished a deep bronze from long hours</p>

        <p>of exposure to the sun. Long-time druids are wrinkled</p>

        <p>beyond their years, but they don't care.</p>

        <p>Very little can get a druid inside any kind of shelter</p>

        <p>for longer than a few hours. The people like to sleep</p>

        <p>with the sand on their backs, sometimes even with their</p>

        <p>feet in the water. More than one druid has had a rude</p>

        <p>awakening when the rising tide has washed him out to</p>

        <p>sea, but they generally just see it as the sea calling out to</p>

        <p>them, promising a chance at some excellent body surfing.</p>

        <p>It is rare to see a beach druid far from his board.</p>

        <p>Each makes his own board by hand, lovingly crafting and</p>

        <p>polishing it until it's ready to glide across the waves. It can</p>

        <p>take up to two weeks for a druid to make another board,</p>

        <p>and although druids do make boards for sale, they refuse</p>

        <p>to part with their personal boards except under the direst</p>

        <p>circumstances.</p>

        <p>The people of Cuarsen are mostly friendly, and the</p>

        <p>merchants there are happy to get business of any kind.</p>

        <p>The same cannot be said for the druids, though. They</p>

        <p>are a closed group. Even amongst themselves, their bands</p>

        <p>are extremely insular.</p>

        <p>While in the Sea Wax, Cuarsen's only tavern, druids</p>

        <p>are often friendly, open, and even talkative with people</p>

        <p>that they know. It will take them at least several days to</p>

        <p>feel comfortable enough to speak their mind in front of</p>

        <p>an outlander, though, if indeed they ever do. Bee, the</p>

        <p>Sea Wax's shaggy haired elven proprietor and bartender,</p>

        <p>makes sure to sit newcomers as far from the druids as</p>

        <p>possible, but it rarely works. Once the druids are not in</p>

        <p>complete control of the bar, they most times get up and</p>

        <p>leave as soon as they can finish their drinks.</p>

        <p>Cubarto</p>

        <p>Cubarto is the second largest mixed-race settlement on</p>

        <p>the shores of Marnita, following distantly behind Saragar</p>

        <p>with just over 1,500 people. Cubarto is located on the</p>

        <p>side of Marnita directly opposite Saragar. This position</p>

        <p>gives its citizens trading access to both Kharzden and</p>

        <p>Sylvandretta, an advantage the barge drivers of Cubarto</p>

        <p>exploit ruthlessly.</p>

        <p>The people of Cubarto are loud and lusty. None of</p>

        <p>them would last 15 minutes in Saragar before being</p>

        <p>hauled before a harmonizer to be brought into tune with</p>

        <p>242</p>

        <p>Beyond the Tyr Region</p>

        <p>the Mind Lords' song. Just about everyone in Cubarto</p>

        <p>supports the Underground, although there are few who do</p>

        <p>so openly. Marnita is only so large, and the reach of the</p>

        <p>lawkeepers more than sufficiently covers it.</p>

        <p>This is a port town and a fishing village. Boats of all</p>

        <p>shapes, sizes and descriptions pour through the port every</p>

        <p>day. Those citizens who don't support themselves in the</p>

        <p>shipping business make their living harvesting the fruit of</p>

        <p>the sea, hooking and netting the many delicious varieties</p>

        <p>of fish that call Marnita home.</p>

        <p>Just as with elsewhere on the Last Sea, however, the</p>

        <p>fishers of Cubarto are careful not to overly fish any</p>

        <p>particular region of the sea. To do so is to invite a</p>

        <p>mass harmonization of nearly every fisher in town, and</p>

        <p>that's something that nobody in Cubarto wants. It has</p>

        <p>been over a thousand years since the entire village of</p>

        <p>Waishiki was harmonized in one fell swoop for their</p>

        <p>repeated violations of the fishing guidelines set forth for</p>

        <p>them by the Mind Lords. No one in Cubarto personally</p>

        <p>remembers it happening, but a visit to Waishiki will</p>

        <p>convince any skeptic of the veracity of this claim.</p>

        <p>Cubarto is governed by a mayor elected by the people.</p>

        <p>He has very little real power, and the post is mostly an</p>

        <p>honorary one. The only thing he can do that no other</p>

        <p>citizen can is call in the lawkeepers when he feels that</p>

        <p>they are needed. If his judgment proves flawed, however, it</p>

        <p>can end up being he that is harmonized instead.</p>

        <p>The current mayor is a well-tanned young man named</p>

        <p>Sentigo, with dark brown eyes and straight black hair</p>

        <p>he wears shaved close to his head. Sentigo believes in</p>

        <p>running a tight ship, and in his case, that means collecting</p>

        <p>taxes from each ship that uses Cubarto's port. He usually</p>

        <p>charges a measly two percent of any cargo carried, but he</p>

        <p>can go as high as 10 if his takes a disliking to the people</p>

        <p>he's dealing with. In any case, Sentigo is a popular man,</p>

        <p>and any attempts to get out of paying him his taxes will</p>

        <p>be met with stiff resistance from just about everybody</p>

        <p>else in town. At the end of the year, Cubarto always</p>

        <p>has a surplus of taxes, and instead of hoarding the cash,</p>

        <p>Sentigo uses it to throw a great festival. People from all</p>

        <p>around the Last Sea show up for the party, especially for</p>

        <p>the fantastic spread of food and drink that the village</p>

        <p>provides for free. Even an occasional lizard man, as well</p>

        <p>as a ghost elf or two from Sylvandretta (see below) has</p>

        <p>been known to show up for Cubarto's infamous New</p>

        <p>Year's Eve celebration.</p>

        <p>The people of Cubarto are open and warm. They like</p>

        <p>to drink and swim (not necessarily at the same time).</p>

        <p>They are suspicious of strangers, but openly so. Visitors</p>

        <p>may find this refreshing after having to deal with the</p>

        <p>implicit distrust found in many of the other villages on</p>

        <p>the shore. This mistrusting is only natural, of course. After</p>

        <p>all, anyone new in the village could be a spy for the Mind</p>

        <p>Lords, so until the newcomers are proven to be who they</p>

        <p>say they are, they can expect to encounter stubbornness</p>

        <p>bordering on open hostility from the Cubartan people.</p>

        <p>The easiest way to earn a Cubartan's trust is to publicly</p>

        <p>curse the Mind Lords. No one from Saragar could do</p>

        <p>such a thing because of their real fear that they could be</p>

        <p>struck down for such a thing. (Of course, who's to say the</p>

        <p>outlanders won't be?) Not even a native Cubartan would</p>

        <p>be so bold.</p>

        <p>Huddleston</p>

        <p>Huddleston is a small farming community nestled into</p>

        <p>the nook north of Marnita, right between the last of the</p>

        <p>Thunder Mountains and the edge of the Burning Plains.</p>

        <p>This extremely fertile land sees a great deal of rain, and</p>

        <p>this, combined with the valley's long growing season, make</p>

        <p>the fields around Huddleston the most productive on the</p>

        <p>planet.</p>

        <p>243</p>

        <p>Beyond the Tyr Region</p>

        <p>Visitors from afar will be astonished at the size of</p>

        <p>these farms, the row after row of luscious plants and trees</p>

        <p>bearing vegetables and fruits of all kinds. Perhaps the</p>

        <p>most famous farm in the area is the old Jenkins Vineyard,</p>

        <p>a place which has been producing the sweetest grapes and</p>

        <p>making the finest wines on Athas for millennia.</p>

        <p>The vineyard is run these days by a man named Clay</p>

        <p>and his young wife Sherril. They happily care for the</p>

        <p>vineyard and watch over all of their workers, and each</p>

        <p>year they supply the drink for the New Year's Eve festival</p>

        <p>in Cubarto. There is always plenty of good, inexpensive</p>

        <p>wine to go around, and the Jenkins consider the yearend</p>

        <p>party to be the best advertising for their product they</p>

        <p>could ever find.</p>

        <p>Never in the entire history of Huddleston has anyone</p>

        <p>ever had to be harmonized. They're simply all too</p>

        <p>well adjusted to ever even consider causing someone</p>

        <p>unhappiness. True, occasionally even a Huddlestonian</p>

        <p>gets down, but whenever that happens, another one is</p>

        <p>right there to help pick him right back up again. The</p>

        <p>villagers are determined that no one is going to spoil their</p>

        <p>perfect record.</p>

        <p>The Huddlestonians (basically anyone who lives within</p>

        <p>10 miles of the village) generally live solitary lives, each</p>

        <p>family working hard on its farm all week long. Come</p>

        <p>the weekend, though, the villagers head into their tiny</p>

        <p>burg for a couple days of song and celebration. These</p>

        <p>communal moments are what bring these people together</p>

        <p>and give them a sense of unity with one another. They</p>

        <p>cherish their friendships above all else. Once you've got</p>

        <p>a Huddlestonian for a friend, you've got a friend for life.</p>

        <p>The Huddlestonians are extremely friendly to outlanders</p>

        <p>and will extend such travelers every courtesy. Long ago,</p>

        <p>they simply called the lawkeepers every time someone</p>

        <p>made it through the Border of Guardians, but when the</p>

        <p>lawkeepers seemed to stop caring so much about it, the</p>

        <p>Huddlestonians did too. Today they call the outlanders</p>

        <p>into their homes and treat them like royalty, eager to</p>

        <p>learn everything they can about the world outside their</p>

        <p>little valley</p>

        <p>Huddleston is governed by a direct democracy. As</p>

        <p>there are less than 250 people in the entire community,</p>

        <p>they see no reason to elect any single person to carry</p>

        <p>out all of their wishes. The honor of dealing with any</p>

        <p>particular matter changes from matter to matter, generally</p>

        <p>falling to the person best suited to taking care of that</p>

        <p>particular task.</p>

        <p>At the end of every weekend, the people meet</p>

        <p>(traditionally at the Jenkins Vineyard, although other</p>

        <p>places have been used) to discuss the issues of the week.</p>

        <p>Votes are brought up after everyone who wants to has had</p>

        <p>a chance to say his piece. A simple majority rules, and</p>

        <p>any resolutions are acted upon instantly.</p>

        <p>No Huddlestonians ever willingly shirk a duty placed</p>

        <p>upon them by their fellows. It's rare that assignment of</p>

        <p>a duty even has to happen, though, as most people will</p>

        <p>simply volunteer their services to lend a hand in solving</p>

        <p>any problem that might arise. Consequently, Huddleston</p>

        <p>is an extremely competent community, and no one is</p>

        <p>ever left dangling in the delightfully cool sea breezes that</p>

        <p>sweep over these fields of plenty</p>

        <p>Kharzden</p>

        <p>The dwarven colony of Kharzden is far and away the</p>

        <p>largest settlement in the valley, outside of mighty Saragar</p>

        <p>itself. It holds almost 2,000 dwarves scattered throughout</p>

        <p>the ancient mining shafts riddling the northern part</p>

        <p>of the Thunder Mountains. These dwarves live mostly</p>

        <p>underground like their ancient counterparts once did,</p>

        <p>although they have long since lost any special abilities to</p>

        <p>mine and forge metals.</p>

        <p>Most of the veins of ore in the Thunder Mountains</p>

        <p>were mined out long ago. A few new ones have been</p>

        <p>discovered recently by hobbyist miners, and some new</p>

        <p>metals have been extracted and made into new items like</p>

        <p>mining tools and even axes. Most of the metal things that</p>

        <p>the dwarves have, though, are as ancient and worn as the</p>

        <p>bits that circulate throughout the rest of the valley.</p>

        <p>The miners wear bandanas tied around their faces to</p>

        <p>keep them from inhaling too much of the subterranean</p>

        <p>dust. The people of Saragar have taken to jokingly</p>

        <p>calling them the only bearded dwarves on all of Athas.</p>

        <p>Traditionally these bandannas used to always be brown,</p>

        <p>but today they come in all sorts of different colors and</p>

        <p>patterns.</p>

        <p>The dwarves' government is a matriarchal monarchy,</p>

        <p>and the current queen is an aged woman by the name</p>

        <p>of Elakta. In the dwarves' home under the mountains,</p>

        <p>Queen Elakta's word is law, and it is obeyed by all.</p>

        <p>244</p>

        <p>Beyond the Tyr Region</p>

        <p>Elakta is as proud and stubborn as her people, and she</p>

        <p>refuses to have much to do with the lawkeepers of Saragar.</p>

        <p>She suffers their presence when they require it, but not</p>

        <p>willingly, and she has yet to break the long tradition the</p>

        <p>dwarves have had of refusing to call upon the lawkeepers</p>

        <p>for help. If she has her way (and she usually does), her</p>

        <p>people never will.</p>

        <p>The dwarves live off of subterranean crops grown in</p>

        <p>massive chambers buried deep beneath the mountains,</p>

        <p>far from the burning rays of the sun. Their ancestors were</p>

        <p>as distrusting of the efficacy of the Mind Lords' ability to</p>

        <p>defend them from the sorcerer-kings as these dwarves are</p>

        <p>today. The ancient dwarves built an underground world</p>

        <p>for themselves that was almost entirely self-sufficient. In</p>

        <p>this way, they hoped to hide from the wizards and their</p>

        <p>power for as long as possible.</p>

        <p>Since those days, the dwarves have become somewhat</p>

        <p>lax in their vigilance. The doors to Kharzden stand wide,</p>

        <p>their hinges long since rusted open. The colony has</p>

        <p>expanded since those old times, and the village now spills</p>

        <p>out onto the clearing on the edge of the mountainside.</p>

        <p>The dwarves of Kharzden are stolidly against magic of</p>

        <p>any kind, or even the use of psionics. They have a few</p>

        <p>wild talents in their group, but none of them has any</p>

        <p>training in the Way. The use of any kind of unusual</p>

        <p>ability within the halls of Kharzden is frowned upon and</p>

        <p>is grounds for immediate ejection for a time. If the offense</p>

        <p>is repeated, the offender is beaten unconscious before</p>

        <p>being cast out. The penalty for the third time is execution.</p>

        <p>Other than this, the dwarves are extremely friendly to</p>

        <p>outlanders. They see them as a potential source of revenue</p>

        <p>and information. The dwarves' metals are extremely</p>

        <p>valuable outside of the valley, and they are more than</p>

        <p>willing to trade small amounts for important information</p>

        <p>from distant lands. Queen Elakta strongly believes that</p>

        <p>the day will come when the Mind Lords' efforts will</p>

        <p>finally fail, and she will do everything she can to make</p>

        <p>sure that her people are prepared for that eventuality</p>

        <p>The dwarves also trade for all sorts of different things.</p>

        <p>They are especially fond of gourmet foods and intricate</p>

        <p>toys. They delight in these things above all else, although</p>

        <p>the queen makes sure that these “vices” do not overshadow</p>

        <p>the dwarves' more important work.</p>

        <p>Rivertown</p>

        <p>Rivertown is a tiny town that sits on the banks of the</p>

        <p>Big River, which flows out of the northwestern Thunder</p>

        <p>Mountains and into the sea. The town rests high in the</p>

        <p>foothills of this range, at a point at which the river runs</p>

        <p>wide and fast.</p>

        <p>The Big River can actually be crossed by foot at this</p>

        <p>point, but it is 50 yards wide, and each round of time</p>

        <p>spent working across it requires a Dexterity check at -3.</p>

        <p>Those who fail their checks lose their footing, take 1d6</p>

        <p>points of damage and are swept down the river at a</p>

        <p>movement rate of 30. They must then make a Dexterity</p>

        <p>check at -6 to regain their footing or grab onto a solid</p>

        <p>rock or branch as they pass by it. Each turn that the</p>

        <p>victims fail to save themselves, they take an additional</p>

        <p>1d6 points of damage. If they are still being swept along</p>

        <p>after the tenth turn, they are swept over the edge of the</p>

        <p>Big Falls, a 100-foot waterfall that crashes down into a</p>

        <p>wide pool of water before continuing on toward the sea.</p>

        <p>Victims must save versus death to avoid being fatally</p>

        <p>crushed on the rocks below. Those who succeed manage</p>

        <p>to avoid the rocks, but they had better know how to swim,</p>

        <p>as they are in 20 feet of water.</p>

        <p>Less adventurous souls can do what most of the villagers</p>

        <p>do: walk across the suspension bridge that wavers a mere</p>

        <p>six feet above the river's frothing surface. Still, some of the</p>

        <p>young men in the village like to challenge outlanders to</p>

        <p>a crossing of the river the old-fashioned way, and about</p>

        <p>once a year someone is swept down the falls.</p>

        <p>The people of Rivertown support themselves by hunting</p>

        <p>and fishing. A large variety of woodland critters that are</p>

        <p>good eating make their homes in the mountains and these</p>

        <p>hills, and a lot of them come down to the river to bathe</p>

        <p>and drink. Also, a substantial population of fresh-water</p>

        <p>fish swim up and down the river, including a number of</p>

        <p>different types of trout</p>

        <p>When the salmon swim up the river to spawn (even</p>

        <p>managing to climb the falls), the Rivertown fishers haul in</p>

        <p>a load of these tasty fish. They then smoke them and store</p>

        <p>them so that they can eat them all year round. Smoked</p>

        <p>salmon is considered a fine delicacy around the entire</p>

        <p>valley, and it is Rivertown's number one export.</p>

        <p>Rivertown is governed by a mayor elected from its</p>

        <p>populace of just over 600 people (including those who</p>

        <p>245</p>

        <p>Beyond the Tyr Region</p>

        <p>live in the outlying areas surrounding the small town). No</p>

        <p>one runs for the office. Votes are simply tallied every four</p>

        <p>years, and the winner becomes mayor. The only restriction</p>

        <p>is that once you've been mayor, you can never hold that</p>

        <p>office again.</p>

        <p>This suits the people of Rivertown just fine, since no</p>

        <p>one really wants the job anyway. The mayor has to oversee</p>

        <p>matters in the town and act as arbitrator to settle any</p>

        <p>disputes. While this is all well and good, it gets in the</p>

        <p>way of more important things like being in the woods.</p>

        <p>The current mayor is a young woman named Karpinnen.</p>

        <p>Tall, blond, and beautiful, with startling blue eyes, she</p>

        <p>is inexperienced with the vagaries of politics, having only</p>

        <p>held the office for a few weeks. Before this, her only claim</p>

        <p>to fame was that she had been horsing around on the</p>

        <p>bridge and fell into the river. She was eventually swept</p>

        <p>over the falls but miraculously survived. People around</p>

        <p>these parts apparently figured that anyone so darn lucky</p>

        <p>should take a turn at running things in Rivertown. Also,</p>

        <p>her parents actually campaigned privately for her, hoping</p>

        <p>that a little responsibility would help her mature quickly</p>

        <p>before she got killed in another one of her foolish stunts.</p>

        <p>The Rivertownies are generally stand-offish with strangers.</p>

        <p>They don't trust anyone they don't know, fearing that</p>

        <p>strangers might be spies from the lawkeepers. Still, they</p>

        <p>enjoy playing pranks on outlanders just come through</p>

        <p>the mountains (like telling them that rubbing rash ivy on</p>

        <p>their skin will help keep away the mosquitoes found up in</p>

        <p>the forest). This is easy, as they know that the valley seems</p>

        <p>like another world to those from the desert lands. The</p>

        <p>pranks are generally harmless in the long run, though.</p>

        <p>The Rivertownies don't want to permanently hurt anyone;</p>

        <p>they just like a good laugh at outsiders' expense.</p>

        <p>Saragar</p>

        <p>The city of Saragar on the edge of the Last Sea is the</p>

        <p>largest settlement in the area and the home of the Mind</p>

        <p>Lords. More details are found in the City-states book.</p>

        <p>Shallat</p>

        <p>Shallat is a small town on the northern side of Marnita,</p>

        <p>sheltered from even a view of Saragar by the intervening</p>

        <p>Lonely Butte. The people of this village are mostly</p>

        <p>fishermen, but a number of farms range from Shallat's</p>

        <p>borders to the edge of the Thunder Mountains, ensuring</p>

        <p>that the less than 300 people who live here have plenty of</p>

        <p>food without having to trade much with the other towns.</p>

        <p>Shallat's main attraction is its healing facilities. The</p>

        <p>town is governed by a hereditary monarchy, each member</p>

        <p>of which is a physician of incredible skill. Most members</p>

        <p>of the ruling family are water clerics as well, people who</p>

        <p>have dedicated their lives to using the fertility of Marnita</p>

        <p>246</p>

        <p>Beyond the Tyr Region</p>

        <p>to aid in their healing ways.</p>

        <p>The head of the ruling family is titled duke or duchess.</p>

        <p>The current Duke Jaan Shallat rules side-by-side with his</p>

        <p>lovely bride, the Duchess Shelistone. Both are impressively</p>

        <p>skilled physicians and 10th-level water clerics. They are</p>

        <p>admired and well-liked by their people. No one resents</p>

        <p>the pair their titles, as they are in fact mostly honorary.</p>

        <p>Additionally, the responsibility of being in charge of the</p>

        <p>village is something that no one really wants to volunteer</p>

        <p>for. Most people are happy to let someone else take care</p>

        <p>of the political stuff so that they can get on with their</p>

        <p>daily lives. Jaan and Shelistone, however, shoulder this</p>

        <p>burden gladly, happy to be able to help their fellows in</p>

        <p>any way that they can.</p>

        <p>The Shallatians are a peace-loving people, and they are</p>

        <p>generally treated well by everyone living in and around</p>

        <p>Marnita, even by the brigands and pirates who live on</p>

        <p>the Lonely Butte. After all, potentially anyone might</p>

        <p>eventually find themselves in need of the village's services,</p>

        <p>and when they do, they want to make sure that the</p>

        <p>Shallatian healers will attend them with all due haste and</p>

        <p>without a single reservation.</p>

        <p>Of course, the Shallatian healers would help anyone in</p>

        <p>need no matter how horrible a person he was. They have</p>

        <p>sworn a sacred oath to aid anyone in need, no matter</p>

        <p>what the circumstances may be. In all cases, they try</p>

        <p>traditional means of healing first, but if that fails, they will</p>

        <p>not hesitate to fall back on their priestly abilities.</p>

        <p>The Shallatians charge reasonable rates for their services,</p>

        <p>and they are extremely understanding in cases of financial</p>

        <p>hardship. They will happily accept goods and services in</p>

        <p>barter for their assistance. Otherwise, they gladly extend</p>

        <p>generous terms of credit.</p>

        <p>The Shallatians are so well-respected, though, that if</p>

        <p>it is discovered that someone owes them something, the</p>

        <p>people of the Last Sea will treat that person harshly</p>

        <p>until he makes good on the debt. Innkeepers will only</p>

        <p>put him in their worst rooms and sell him their cheapest</p>

        <p>fare, hoping to force him to save enough to be able to</p>

        <p>compensate the healers. Merchants around the sea will</p>

        <p>do the same.</p>

        <p>If a person simply refuses to pay up a debt, someone</p>

        <p>(not a Shallatian, but a friend of theirs) will turn the</p>

        <p>delinquent over to the lawkeepers for harmonization. After</p>

        <p>all, this person's actions are causing no small amount of</p>

        <p>concern in the community, and it's up to the lawkeepers</p>

        <p>to keep the happiness.</p>

        <p>Sylvandretta</p>

        <p>Whereas the dwarves of Kharzden are friendly and</p>

        <p>open with strangers, the over 500 elves of Sylvandretta</p>

        <p>are cold and aloof. They believe that the purity of their</p>

        <p>bloodline needs to be preserved, and they hold this above</p>

        <p>all other concerns. Unlike most other elves on Athas,</p>

        <p>these creatures are fair skinned with light blond hair and</p>

        <p>pale blue eyes. Down the millennia, their line has grown</p>

        <p>even fairer than ever before, and they are now called</p>

        <p>“ghost elves” by the people of Saragar – even the elves</p>

        <p>of that fair city.</p>

        <p>Sylvandretta is governed by a high council of seven</p>

        <p>elders elected from the ghost elves' general population.</p>

        <p>These wise people rule over their people for 21-year terms.</p>

        <p>An election is held every three years, and a new elf is</p>

        <p>elected to the open position. No one is permitted to hold</p>

        <p>office for two consecutive terms, so they must take off at</p>

        <p>least three years between terms.</p>

        <p>Sylvandretta is located in the Spirit Forest, a massive</p>

        <p>stand of ancient trees nestled between the two arms of the</p>

        <p>Thunder Mountains, in the southwest section of the valley</p>

        <p>of the Last Sea. Here, as far from Saragar as one can get</p>

        <p>and still be under the Mind Lords' purview, the ghost</p>

        <p>elves live in harmony with their natural surroundings,</p>

        <p>sheltered as they are from the horrors the defilers and</p>

        <p>their ilk have visited upon the rest of the planet.</p>

        <p>Sylvandretta is based upon a circle of twelve tremendous</p>

        <p>trees of life. These towering trees, each standing nearly</p>

        <p>two hundred feet tall, support a network of handworked</p>

        <p>tree houses in which live the twelve great families of the</p>

        <p>ghost elves. The network of rope bridges that crisscross</p>

        <p>between the trees, high above the ground, is nearly as</p>

        <p>complicated as the web of relationships that connect these</p>

        <p>twelve families.</p>

        <p>Millennia of inbreeding among these creatures has</p>

        <p>caused their life spans to be cut to half of the traditional</p>

        <p>elven length. This has spawned a great debate among</p>

        <p>the twelve families and the members of the council. One</p>

        <p>side believes that the time has come to invite new blood</p>

        <p>into their breeding stock. The other staunchly holds that</p>

        <p>any such action would be tantamount to forever tainting</p>

        <p>247</p>

        <p>Beyond the Tyr Region</p>

        <p>their vaunted bloodlines in a manner that could never</p>

        <p>be repaired.</p>

        <p>As such, while most ghost elves will steadfastly refuse</p>

        <p>to talk to or even allow themselves to be seen by a</p>

        <p>stranger (anyone from outside of Sylvandretta), a sizable</p>

        <p>minority are at least willing to converse with outsiders,</p>

        <p>even those from beyond the Border of Guardians. In</p>

        <p>either case, both factions group the lawkeepers in along</p>

        <p>with any other outsiders, except for a small force of ghost</p>

        <p>elf lawkeepers specially commissioned by the Mind Lords</p>

        <p>over five millennia ago as a concession to the elves'</p>

        <p>extreme xenophobia.</p>

        <p>These lawkeeper ghost elves are legendary even among</p>

        <p>their counterparts from Saragar. They are rarely seen</p>

        <p>outside of Sylvandretta, but when they are, they usually</p>

        <p>are out looking to capture a breaker of their laws. They</p>

        <p>don't believe in harmonization – the best that such a</p>

        <p>hapless fugitive can hope for is a quick death.</p>

        <p>Waishiki</p>

        <p>Waishiki is a small fishing community situated at the</p>

        <p>rearmost point of the southern bay below the Saragan</p>

        <p>peninsula. The people there are extremely friendly and</p>

        <p>happy all the time. Strangely, this is because of the town's</p>

        <p>tragic past.</p>

        <p>Just over a millennia ago, the people of Waishiki were</p>

        <p>having a problem. Actually, they were causing it. The</p>

        <p>mayor of the town and the rest of the village elders had</p>

        <p>come out condemning the Mind Lords and their horrific</p>

        <p>practice of harmonization, a process (the elders claimed)</p>

        <p>that robbed people of their right to free will. By living</p>

        <p>under such a totalitarian regime, the people were being</p>

        <p>forced to give up that exact same right, and it was up to</p>

        <p>someone to finally stand up and speak the truth.</p>

        <p>The Waishikans were supported morally by many</p>

        <p>homelanders, but few of these people behind the scenes</p>

        <p>were actually nervy enough to speak out loudly in</p>

        <p>unconditional support. In the end, they turned out to</p>

        <p>have been wise.</p>

        <p>The protests were allowed to continue for as long as</p>

        <p>Barani was in one of her manic moods. She was the</p>

        <p>protector of the meek then, seriously considering any issue</p>

        <p>that her subjects cared to bring to her attention. To her</p>

        <p>fellow Mind Lords, she defended the right of the people</p>

        <p>to differ with them in their opinions. It was only by</p>

        <p>her efforts that Thesik's hand was stayed from dealing</p>

        <p>punishment upon the village.</p>

        <p>Then, as inevitably happened, Barani slipped into a</p>

        <p>state of depression. This spelled immediate disaster for the</p>

        <p>dissidents of Waishiki. Without even consulting Thesik</p>

        <p>or Kosveret, Barani contacted the chief lawmaker and</p>

        <p>ordered him to take every last one of his lawkeepers</p>

        <p>into Waishiki and harmonize the entire town in one</p>

        <p>fell swoop. It would take too long to root out the real</p>

        <p>troublemakers, she said, and in the meantime, it was best</p>

        <p>to make the entire village obey the Mind Lords' wishes</p>

        <p>right away instead of waiting until a “better” time. The</p>

        <p>goddess's orders were carried out to the letter, and every</p>

        <p>man, woman, and child in the entire city was remade into</p>

        <p>the Mind Lords' image. In one fell swoop, the town was</p>

        <p>entirely loyal to the Mind Lords again.</p>

        <p>Since then, things in Waishiki have pretty much</p>

        <p>remained the same. The faces have changed, but the</p>

        <p>attitude has not. They are each and every one model</p>

        <p>citizens. The lawkeepers are welcomed freely here, as the</p>

        <p>people have nothing to hide. Outlanders are not treated</p>

        <p>well by the Waishikans for the same reason. Although</p>

        <p>these new people don't have direct, immediate contact</p>

        <p>with the Mind Lords, they are devout worshippers of the</p>

        <p>Mind Lords, and if the lawkeeper who preaches to them</p>

        <p>had something against people from beyond the Border of</p>

        <p>Guardians, then so too do they.</p>

        <p>One other thing that makes Waishiki stand out from</p>

        <p>the other towns is the monastery of water clerics that</p>

        <p>248</p>

        <p>Beyond the Tyr Region</p>

        <p>stands in the center of town, just as it has been for the</p>

        <p>past five thousand years. These water clerics (or at least</p>

        <p>their ancestors) were caught in the great cleansing of</p>

        <p>the town, their minds wiped clear of the very thoughts</p>

        <p>that they were passing on and the instigation rumors of</p>

        <p>rebellion that they had started.</p>

        <p>The water clerics may live in Waishiki, but their sacred</p>

        <p>place is Marnita itself. These priests can often be seen</p>

        <p>riding sailboards around the coast and even across the</p>

        <p>sea, preaching their faith to each community in turn, their</p>

        <p>tiny crafts' puddingfish sails flapping in the wind. They</p>

        <p>are welcomed with open arms into each community that</p>

        <p>they travel to, but never as close friends. The people of</p>

        <p>the Last Sea know that these priests are really puppets of</p>

        <p>the Mind Lords, and they regard them as spies, so they</p>

        <p>are always careful to keep their wits about them whenever</p>

        <p>a water cleric is around.</p>

        <p>These water clerics occasionally make pilgrimages into</p>

        <p>the forests or even the mountains searching for a clear</p>

        <p>spring of running water fresh from the highest peaks. For</p>

        <p>this reason, these priests may often be the first people that</p>

        <p>an outlander runs into on his way into the valley.</p>

        <p>Water clerics do not inherently despise outlanders, and</p>

        <p>they will actually instruct them in the proper ways of</p>

        <p>handling both the water and themselves in the Mind</p>

        <p>Lords' vision of how a city should be. In this, they see</p>

        <p>themselves acting as a kind of harmonizer, although they</p>

        <p>work verbally and with reason instead of with brute-force</p>

        <p>telepathy.</p>

        <p>As spell casters, though, the water priests are not</p>

        <p>permitted in Saragar without an escort of at least</p>

        <p>one lawkeeper. Most people don't bother to make the</p>

        <p>distinction between the different types of spell casters. To</p>

        <p>them, all cut from the same cloth – unless, of course, the</p>

        <p>Mind Lords say differently in a particular case.</p>

        <p>The Lonely Butte</p>

        <p>The Lonely Butte is a geographic wonder, a savage</p>

        <p>land that thrusts directly out of the water, surrounded on</p>

        <p>all sides by sheer bluffs falling over 200 feet to the sea</p>

        <p>below. The plateau atop the continuous cliff is covered</p>

        <p>with a lush jungle which all sorts of dangerous creatures</p>

        <p>call home. Fortunately for the rest of the Last Sea, the</p>

        <p>only way on or off of the butte, unless you can climb like</p>

        <p>a spider or fly, is through Blufftown.</p>

        <p>Far behind Ordean's and Sitko's, (see below) there</p>

        <p>is another infernal contraption of a basket and pulleys</p>

        <p>designed to haul people occupants up a tall, narrow</p>

        <p>chimney to the top of the Lonely Butte. The elevator</p>

        <p>shares the binding space with a raging waterfall which</p>

        <p>occasionally wanders uncomfortably close to the swinging</p>

        <p>basket. This water rushes through an iron grating at the</p>

        <p>top and lands in a crystal pool far below, the source</p>

        <p>of all of Blufftown's water. A small gate in the grate</p>

        <p>opens automatically as the basket nears its journey's end,</p>

        <p>powered like the elevator itself by an unseen obsidian orb.</p>

        <p>The plateau of the Lonely Butte is like a land that</p>

        <p>time forgot. Creatures and plants living here date back to</p>

        <p>even the Blue Age itself. Lizards of all shapes and sizes</p>

        <p>slither through the undergrowth, far below this tropical</p>

        <p>rainforest's canopy. Playful monkeys swing from tree to</p>

        <p>tree, and shy gorillas fade away from intruders, into the</p>

        <p>mist.</p>

        <p>The main attraction of the Lonely Butte is that the</p>

        <p>lawkeepers generally refuse to go there unless specifically</p>

        <p>ordered to by the Mind Lords themselves. This is a</p>

        <p>land full of danger, a fact particularly true for those who</p>

        <p>support the Mind Lords. But there are many creatures</p>

        <p>on this island that care not for politics and will kill</p>

        <p>indiscriminately to fill their bellies.</p>

        <p>249</p>

        <p>Beyond the Tyr Region</p>

        <p>Blufftown</p>

        <p>This is a small settlement in the side of a bluff on the</p>

        <p>east edge of the Lonely Butte. It's a rough and tumble</p>

        <p>town where even the lawkeepers fear to tread, and for</p>

        <p>this reason, it's a haven for members of the valley's</p>

        <p>Underground (a clandestine group of people who actively</p>

        <p>– though secretly – oppose the Mind Lords' perpetual</p>

        <p>rule) and other fugitives from the Mind Lords' justice.</p>

        <p>Blufftown is little more than a couple of inns sitting in</p>

        <p>a good-sized cave the winds and waters have carved out</p>

        <p>of the east side of the Lonely Butte. These inns sit inside</p>

        <p>this cave some fifty feet above the waves that crash against</p>

        <p>the base of butte, and the only way in or out of the</p>

        <p>area is by being hauled up in a precarious contraption</p>

        <p>consisting of a larger wicker basket and a series of ropes</p>

        <p>and pulleys.</p>

        <p>The engine for this device is an obsidian orb stolen</p>

        <p>from the Mind Lords long ago by Ordean, the greatest</p>

        <p>pirate the Last Sea has ever seen. Over the years, it has</p>

        <p>gotten a bit finicky about who it hauls up into Blufftown,</p>

        <p>and there is only a 75% chance that it is working any</p>

        <p>given hour of the day.</p>

        <p>The operators of the two competing inns are Ordean (a</p>

        <p>weasely man who claims to be descended from the dread</p>

        <p>pirate of legend) and Sitko, a relative newcomer to the</p>

        <p>business of catering to criminals. A prominent member</p>

        <p>of the Underground, Sitko won the inn from its previous</p>

        <p>owner in a poker match a little less than a year ago.</p>

        <p>Ordean's is, simply put, a dive. The walls of this</p>

        <p>ancient place are rotting from long exposure to the sea</p>

        <p>air without even a passing nod at general maintenance.</p>

        <p>Wind whistles through the slats, and even through the</p>

        <p>floorboards (which are raised about three feet above the</p>

        <p>uneven rock). Rain, when it can manage to be blown</p>

        <p>under the cave's sheltering roof, leaks through dozens of</p>

        <p>holes in the roof. The floors are nearly as dirty as the</p>

        <p>sheets on the beds, and the ale is watery and pale.</p>

        <p>Still, if your money's good, Ordean is only too happy to</p>

        <p>serve you. The prices are outrageous – nearly double what</p>

        <p>they are in Saragar – but Ordean figures he's got a captive</p>

        <p>customer base, so he'll get out of them whatever he can.</p>

        <p>Ordean is a bit of a bigot when it comes to races other</p>

        <p>than his own (he claims to be human), but no matter who</p>

        <p>the customer is, as long as he's got money, he's fine in</p>

        <p>Ordean's eyes. Ordean treats everyone equally. The dustyhaired</p>

        <p>little man with the weedy mustache will rip you</p>

        <p>off no matter who you are – if you give him the chance.</p>

        <p>Things have changed recently for Ordean, though. He</p>

        <p>had an arrangement with the previous owner of Sitko's.</p>

        <p>The two proprietors fixed prices in Blufftown ensuring a</p>

        <p>hefty profit for them both. Sitko, on the other hand, has</p>

        <p>balked at making the same kind of agreement. He's a</p>

        <p>revolutionary, not a capitalist. He refuses to lower himself</p>

        <p>to profiteering at the expense of his fellow Undergrounders.</p>

        <p>Competition between the two inns has heated up a</p>

        <p>great deal since Sitko acquired his inn. Ordean's ire at</p>

        <p>the newcomer has been ameliorated a bit by the fact that</p>

        <p>most of his old patrons have stuck with him just because</p>

        <p>he's lowered his prices on ale to match Sitko's. Besides</p>

        <p>which, the rough and tumble sorts who like to hang out</p>

        <p>at Ordean's don't much care for the more intellectual</p>

        <p>Underground crowd that Sitko's draws in.</p>

        <p>The Lonely Giants</p>

        <p>By far the most notable occupants of the Lonely Butte</p>

        <p>are the small family of humanoid “crag” giants who live</p>

        <p>on the southwestern edge of the butte in an abandoned</p>

        <p>city dating back to the Blue Age. Portions of the city</p>

        <p>seem to have almost grown directly from the rocks on</p>

        <p>which the buildings sit, but much of it has crumbled, and</p>

        <p>many walls and ceilings have been torn out by the giants</p>

        <p>to make room for themselves in buildings meant for a</p>

        <p>people just over a tenth of their size.</p>

        <p>The city, the name of which has long since been lost,</p>

        <p>hosts about 30 giants (25 adults and 5 children). The</p>

        <p>inbreeding problems which have plagued the ghost elves</p>

        <p>are even more prominent here, and the crag giants are at</p>

        <p>their wits' end trying to determine what it is they should</p>

        <p>do to keep their clan alive.</p>

        <p>Their fate has made the crag giants exceedingly crabby,</p>

        <p>and they tend to kill first and inspect the corpse later.</p>

        <p>Outlanders who manage to survive the initial onslaught</p>

        <p>long enough for the giants to calm down will find them</p>

        <p>friendly enough. They are interested to glean information</p>

        <p>about what is happening outside their butte.</p>

        <p>The crag giants wait impatiently for the day that the</p>

        <p>Mind Lords become weak enough for them to finally</p>

        <p>wreak their revenge. To this end, they have made friends</p>

        <p>250</p>

        <p>Beyond the Tyr Region</p>

        <p>with certain members of the Underground, including</p>

        <p>Sitko. Sometimes they even offer shelter to such people.</p>

        <p>Anything that could cause the Mind Lords harm seems</p>

        <p>like a good idea to these sad creatures as it becomes more</p>

        <p>and more apparent that they are headed for extinction.</p>

        <p>Criker's Pirates</p>

        <p>The Last Sea has known several semi-successful bands</p>

        <p>of pirates over the years. They sail the waves on the hunt</p>

        <p>for booty to loot from cargo-laden craft scudding along</p>

        <p>the shipping lanes. Eventually, most make a fatal mistake</p>

        <p>and are brought down by the lawkeepers and hauled in</p>

        <p>for harmonization, but sooner or later another band of</p>

        <p>freebooters always crops up.</p>

        <p>The latest and greatest group of thieves on the open</p>

        <p>sea is probably the most successful one ever. This is</p>

        <p>likely due to the fact that these pirates rob for principle</p>

        <p>instead of profit, most of the crew being members of the</p>

        <p>Underground. They sail under the command of a robust</p>

        <p>mul named Criker in a blazingly fast corsair called the</p>

        <p>Marion.</p>

        <p>As the son of a mostly forgotten sailor on another ship</p>

        <p>of bandits, Criker has been a pirate his entire life. But</p>

        <p>only in the last few years has he found a cause he feels</p>

        <p>really worth fighting for: bringing the Mind Lords down</p>

        <p>once and for all. The lawkeepers finally caught Criker's</p>

        <p>father five years back and took him in for harmonization.</p>

        <p>The man hung himself rather than have his mind violated.</p>

        <p>Criker fights the good fight for his father and all people</p>

        <p>like him-those too proud to ever allow their will to be bent</p>

        <p>to another's mind.</p>

        <p>A few other pirate bands sail the Last Sea, but</p>

        <p>they ar mostly part-timers, opportunistic robbers in it only</p>

        <p>for the profit. Due to centuries of careful socialization in</p>

        <p>the valley, however, even pirate raids on the Last Sea are</p>

        <p>comparatively orderly things. People are not killed for the</p>

        <p>sheer sport of it, and property is not destroyed without a</p>

        <p>reason.</p>

        <p>Criker's people have had a long and successful run for</p>

        <p>one reason: they're part of the Underground. As such,</p>

        <p>they have the support of many people. Perhaps most</p>

        <p>importantly, they have earned the friendship of the crag</p>

        <p>giants on the Lonely Butte, and it is in the shadows of the</p>

        <p>giant village that Criker's pirates make their home, safe</p>

        <p>from intrusion by the lawkeepers, if not from the jungle's</p>

        <p>other denizens.</p>

        <p>Undertown</p>

        <p>Undertown is the name that the people of Saragar have</p>

        <p>for the lizard man settlement deep beneath the surface of</p>

        <p>the Last Sea, though the amphibious people have a name</p>

        <p>for it that translates as Nesthaven. Few surface dwellers</p>

        <p>have ever been to this watery village, but an occasional</p>

        <p>water cleric has been there and back, and the tales told</p>

        <p>of the briny society are amazing.</p>

        <p>The town itself contains three separate tribes of lizard</p>

        <p>men, each with its own loyalties and agendas. Any lizard</p>

        <p>man can instantly tell the tribe of another lizard man,</p>

        <p>but the differences are far too subtle for an air-breathing</p>

        <p>humanoid to discern without spending many long hours</p>

        <p>studying the creatures.</p>

        <p>The three tribes occasionally have their differences, but</p>

        <p>they all are entirely loyal (at least on the surface) to their</p>

        <p>king, a hale and hearty reptilian named Nelyrox. The</p>

        <p>lizard king's position is inherited by the oldest living</p>

        <p>male in the family's line, and this family stands outside</p>

        <p>of the tribal structure, thus implying that there will be no</p>

        <p>favoritism shown to any one tribe</p>

        <p>In fact, the king is a person like any other, able to be</p>

        <p>influenced by those he calls friends. His wife Malani is of</p>

        <p>251</p>

        <p>Beyond the Tyr Region</p>

        <p>the tribe of Kittos, and so she is able to curry favors for</p>

        <p>her people. Nelyrox's high advisor is a psionicist named</p>

        <p>Mobji. As the co-leader of his own tribe (along with a</p>

        <p>creature called Jhoban), the mindbender obviously favors</p>

        <p>his own people, and his advice to his king unabashedly</p>

        <p>displays much of that.</p>

        <p>The people of Xhenrid, the last tribal leader, are</p>

        <p>actually more loyal to her than to the king. If she were</p>

        <p>to call for a revolt against Nelyrox, it is certain that her</p>

        <p>tribe would rally to her side against all odds. Xhenrid</p>

        <p>has actually considered committing such an atrocious act,</p>

        <p>knowing full well that it would split her people and cause</p>

        <p>untold deaths. Still, the only thing keeping her ambition</p>

        <p>for the throne in check is that fact that her people are</p>

        <p>outnumbered almost two to one.</p>

        <p>Despite her warriors' skill, it is certain that Xhenrid</p>

        <p>would be on the losing side of a civil war amongst the</p>

        <p>lizard men. Until such time as she can convince one or</p>

        <p>both of the other tribes to join her – or she manages to</p>

        <p>find help from some other quarter – she holds herself in</p>

        <p>check. She is only willing to begin a blood bath if she is</p>

        <p>sure the spilling of the red fluid into the frothing sea will</p>

        <p>be to her ultimate benefit.</p>

        <p>To this end, Xhenrid has struck up an alliance with</p>

        <p>the Underground. The leadership of the Underground is</p>

        <p>wary about working with such an obviously bloodthirsty</p>

        <p>ally, but it is hard enough to choose your enemies in war,</p>

        <p>much less your friends. King Nelyrox is staunchly on the</p>

        <p>side of the Mind Lords, just as every lizard king has been</p>

        <p>since the trio saved the amphibians from Keltis. And so</p>

        <p>the Underground is in bed with Xhenrid, like it or not.</p>

        <p>Undertown is an ancient and beautiful city, long</p>

        <p>untouched by the ravages of war. The lizard men have</p>

        <p>become a peaceful people over the millennia, even going</p>

        <p>so far as to set up their own Psionics Academy aimed</p>

        <p>at exploring the boundaries of their reptilian minds. The</p>

        <p>lizard men live off of kreel (cattle like creatures that dwell</p>

        <p>in the depths with them) and kelp farmed from great beds</p>

        <p>of it which dot the sea. They supplement their diet with</p>

        <p>an occasional fish or even a wild mammal that wanders</p>

        <p>too close to the shores of the Last Sea.</p>

        <p>The greatest threat to the lizard men's way of life is</p>

        <p>the squark, a giant half-squid, half-shark creature which</p>

        <p>roams Marnita's murky depths. Every so many years,</p>

        <p>the creature attacks Undertown unprovoked, wreaking</p>

        <p>massive destruction on the hapless city, despite the</p>

        <p>many fortifications the lizard men have built up over the</p>

        <p>centuries.</p>

        <p>Many expeditions have been formed to hunt the squark</p>

        <p>over the years. Few of them have had any luck with</p>

        <p>finding the behemoth, and those which have certainly</p>

        <p>didn't survive the experience. Still, the lizard men hold</p>

        <p>out hope that they will someday be able to rid themselves</p>

        <p>of this seemingly immortal menace.</p>

        <p>The Seaways</p>

        <p>Long ago, the psionic masters who ruled the Green</p>

        <p>Age built a series of underground corridors of stone that</p>

        <p>stretched for miles into the water-filled ocean that is now</p>

        <p>the Sea of Silt. Standing upon ivory platforms, these</p>

        <p>people were able to travel nearly instantaneously from one</p>

        <p>end of the passageway to the other.</p>

        <p>After the Mind Lords took control of Saragar, they</p>

        <p>began to build just such a series of tunnels for their</p>

        <p>own use. It was a massive project, but one that they felt</p>

        <p>was necessary for the continued defense of the valley of</p>

        <p>Marnita. After all, if it took their lawkeepers hours or</p>

        <p>even days to get from one end of the valley to another,</p>

        <p>they would find it impossible to respond to any threat</p>

        <p>that managed to breach the Border of Guardians.</p>

        <p>The corridors, which became known as the seaways,</p>

        <p>linked up all of the places shown on the map on this</p>

        <p>page, providing the lawkeepers with easy access to each</p>

        <p>of the passes through the Thunder Mountains, as well</p>

        <p>as with each large settlement in the valley. The very</p>

        <p>existence of the corridors was kept secret, as the Mind</p>

        <p>Lords were afraid that, if a powerful psionicist were to</p>

        <p>discover the transit system, it could be used against them.</p>

        <p>A special underwater access point even allowed the</p>

        <p>travelers to reach Undertown. In fact, it was inside the</p>

        <p>corridor from Saragar to Undertown that the lizard men's</p>

        <p>time-frozen bodies were hidden when Keltis came through</p>

        <p>the area on his final hunt to exterminate the creatures.</p>

        <p>The tunnels were operated by obsidian orbs that moved</p>

        <p>the ivory platforms along at unheard-of speeds. Today,</p>

        <p>most of these orbs have malfunctioned, and only a few of</p>

        <p>the routes are entirely operational. These marked with a</p>

        <p>solid line on the map (as opposed to the disabled routes,</p>

        <p>which are marked with a dotted line).</p>

        <p>252</p>

        <p>Beyond the Tyr Region</p>

        <p>The only line used today with any regularity is the one</p>

        <p>that runs from Saragar to the South Pass. This way, the</p>

        <p>large purchases made from the outside twice every year</p>

        <p>can be brought from the gate to the city without fear</p>

        <p>of attacks by bandits. Other than that, the passages are</p>

        <p>considered unsafe</p>

        <p>Travelers can try to walk down the passages if they</p>

        <p>like, but they are unlit and can sometimes house strange</p>

        <p>creatures unseen elsewhere in Athas. It's rumored that the</p>

        <p>seaways were long kept clean by gelatinous cubes, and<img
        src="data:image/png;base64,"
        /></p>

        <p>if these creatures haven't all starved to death for lack of</p>

        <p>something to eat, they could still be down there. Perhaps</p>

        <p>they have managed to survive on the rats that they were</p>

        <p>summoned to get rid of.</p>

        <p>Unbeknownst to the Mind Lords, Xhenrid of the lizard</p>

        <p>folk has reestablished the line between Undertown and</p>

        <p>Saragar. She hopes to use it to somehow give aid to her</p>

        <p>new friends in the Underground.</p>
