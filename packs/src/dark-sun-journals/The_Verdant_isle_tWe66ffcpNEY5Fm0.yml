    text:
      format: 1
      content: "<p>Stories shared in taverns from Tyr to Cromlin tell of a\_lush island in the middle of the Sea of Silt. According\_to the tales, the island is home to a secret city-state\_ruled by a benevolent monarch and ringed by wide\_lakes of cool, pristine water. Supposedly, this city is a</p>\n<p>paradise, and if a traveler is lucky enough (or has the\_right map, which many hucksters just happen to have\_for sale), he or she can find the Verdant Isle and live\_in idle luxury. Sages speculate that the rumor might\_refer to the island of Ebe, a wealthy and prosperous</p>\n<p>kingdom during the Green Age. Others dismiss the\_Verdant Isle as a mirage that lures the foolhardy\_far out into the sea, where they drown in silt. The\_wildest tales maintain that the city, a mighty citadel\_concealed in a valley of dust and fire, is the hidden\_retreat of the Dragon.</p>"
