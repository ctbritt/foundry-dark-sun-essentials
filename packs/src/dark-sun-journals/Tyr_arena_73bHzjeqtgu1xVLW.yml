      content: "<p>The Tyr Gladiatorial Stadium</p><p>Before the construction of Kalak\x92s ziggurat, the gladiatorial</p><p>stadium was the single largest structure within the</p><p>walled city of Tyr. At one end of the stadium is the</p><p>golden tower and high bureaus. This walled city within</p><p>the walled city houses the king\x92s templars, private gardens,</p><p>and the king\x92s personal residence, the golden</p><p>tower. A special viewing box for the templars and the</p><p>king connects the high bureaus to one of the anterior</p><p>ends of the stadium.</p><p>The far side of the arena stands at the foot of the</p><p>exquisite and immense multi-colored tiled ziggurat of</p><p>Kalak. The enormous ziggurat dwarfs the stadium as it</p><p>rises hundreds of feet into the air above the city. A stair</p><p>rises from the gladiatorial floor to the very top of the ziggurat.</p><p>Areas to each side of the stair are adorned with</p><p>beautiful mosaics depicting Kalak as a great warrior god.</p><p>It is impossible for gladiators to ascend the stair, as it is</p><p>protected by magical spells.</p><p>The stadium was built with a rectangular combat</p><p>field, 300 feet long and 80 feet wide. To distance spectators</p><p>from combatants, there is a 15-foot tall barrier that</p><p>rises from the floor of the arena to the first level of stadium</p><p>seating.</p><p>The floor of the arena itself is hard-packed sand. The</p><p>color of the sand holds an auburn, almost reddish hue. It</p><p>is said that the color is a result of the blood of thousands</p><p>who have fallen there.</p><p>The stadium has the only multilevel seating configuration</p><p>in the Tablelands. On the two long opposing sides</p><p>of the stadium, there is an upper and lower seating section.</p><p>The sections themselves are 300 feet long, with</p><p>stairs that rise to the back every 50 feet. Long stone</p><p>benches supported by squat ionic columns allow respite</p><p>for attendees to the gladiatorial matches. They are seldom</p><p>used, as the crowd at Tyr generally remains on its</p><p>feet during the entire match.</p><p>The stadium is configured with four identical sections,</p><p>two upper and two lower. The upper sections,</p><p>identical in size to the lower, are supported by doric</p><p>columns. Traditionally, nobles, senators, and members</p><p>of powerful trading houses sit in the lower sections. This</p><p>is because the upper sections grant shade to the lower,</p><p>protecting patrons from the blistering Athasian sun.</p><p>The king and templars have a reserved section at the end</p><p>of the arena.</p><p>The two upper sections of the stadium are called \x93the</p><p>sun seats.\x94 The sun seats are open to the general populace</p><p>of the city. This section generally attracts rowdy rabble</p><p>rousers and slaves who have been allowed (and can</p><p>afford) to attend the games. On more than one occasion</p><p>following an argument or disagreement, these rowdy</p><p>(and occasionally inebriated) fans have picked up an</p><p>opposing gladiatorial fan and thrown him down to the</p><p>arena floor (for more information, see the \x93Life in the</p><p>Stands\x94 section, later in this chapter).</p><p></p>"
