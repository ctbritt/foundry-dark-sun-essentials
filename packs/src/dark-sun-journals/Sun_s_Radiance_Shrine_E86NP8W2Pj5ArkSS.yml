        jM4h8qpyxwTpfNli:
          notes: >-
            <h3><strong>Sun's Radiance Shrine</strong></h3>

            <ul>

            <li><strong>Proprietor</strong>:&nbsp;<strong>Caelum</strong>,
            the&nbsp;<strong>Sun Cleric</strong>&nbsp;of Kled.</li>

            <li><strong>Services/Items</strong>:

            <ul>

            <li><strong>Blessings and Rituals</strong>: Caelum can
            perform&nbsp;<strong>sun blessings</strong>&nbsp;that
            grant&nbsp;<strong>temporary resistance to
            fire</strong>&nbsp;or&nbsp;<strong>boosted morale</strong>&nbsp;for
            a day&rsquo;s travel, useful for facing the desert&rsquo;s
            heat.</li>

            <li><strong>Healing</strong>: Caelum can offer&nbsp;<strong>magical
            healing</strong>&nbsp;or help to&nbsp;<strong>treat
            injuries</strong>&nbsp;for a&nbsp;<strong>donation</strong>&nbsp;or
            as a&nbsp;<strong>favor</strong>&nbsp;for aiding the village.</li>

            <li><strong>Divination</strong>: For the right price
            or&nbsp;<strong>service</strong>, Caelum may
            use&nbsp;<strong>rituals</strong>&nbsp;to&nbsp;<strong>interpret
            visions</strong>&nbsp;or offer&nbsp;<strong>cryptic
            guidance</strong>&nbsp;about the party&rsquo;s quest.</li>

            </ul>

            </li>

            <li><strong>Special Interaction</strong>: Caelum is willing
            to&nbsp;<strong>share knowledge</strong>&nbsp;about
            the&nbsp;<strong>Sundering</strong>,&nbsp;<strong>Kemalok</strong>,
            or&nbsp;<strong>spiritual matters</strong>, but only if the party
            proves themselves&nbsp;<strong>worthy</strong>&nbsp;of Kled&rsquo;s
            trust or demonstrates a&nbsp;<strong>respect for the
            sun</strong>.</li>

            </ul>
