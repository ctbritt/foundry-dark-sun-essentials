      content: "<p>Isle of Bones</p>\n<p>A cluster of several closely grouped stark crags</p>\n<p>rising from the deep silt, the Isle of Bones is a barren</p>\n<p>and forbidding place. Each crag rises 400-800\x92</p>\n<p>above the silt and is 100-1,000 yards from its nearest</p>\n<p>neighbor. The silt between the crags is several hundred</p>\n<p>feet deep. There are 11 crags, and four are</p>\n<p>large enough to support vegetation on their crowns.</p>\n<p>The Isle of Bones gains its name from the broken</p>\n<p>skeletons littering the steep shoulders of the crags.</p>\n<p>These are the remains of the prey of the isle\x92s chief</p>\n<p>predators, a large tribe of aarakocra. The bird-men</p>\n<p>are exceptionally fierce and strong and range for</p>\n<p>miles over the silt in search of food. Many of the</p>\n<p>skeletons of the Isle of Bones are human or elf.</p>\n<p>The aarakocra tribe numbers 80 and inhabits the</p>\n<p>four largest peaks. The natural caves and vegetation</p>\n<p>of the crags make for excellent lairs. An exceptionally</p>\n<p>savage and degenerate tribe, the aarakocra prey</p>\n<p>on any travelers who come within their clutches.</p>\n<p>They are frequently encountered as far as 30 miles</p>\n<p>away and prefer to hunt in parties of 6 to 12.</p>\n<p>The aarakocra of the Isle of Bones prefer to attack</p>\n<p>with swooping volleys of javelins, but occasionally try</p>\n<p>to capture human or demihuman victims for torture</p>\n<p>back at their lair. For this the bird-men drop weighted</p>\n<p>nets over fleeing prey. Four aarakocra can carry a</p>\n<p>netted human by the trailing ropes of the net. The</p>\n<p>hapless victim endures vicious abuse before being</p>\n<p>thrown from the top of the crag.</p>\n<p>The isle is also home to many carnivorous bats of</p>\n<p>the large and giant varieties. The aarakocra are diurnal</p>\n<p>creatures and the bats rarely trouble them.</p>\n<p>Aarakocra: AL NE; AC 7; MV 6, Fl 36 (C);</p>\n<p>HD 1 + 2; THAC0 18; #AT 2; Dmg 1d3/1d3 or</p>\n<p>2d4 (weapon); SA dive with javelins at +4 to hit</p>\n<p>and double damage; ML 13.</p>\n<p>Bats, Large (Giant): AL N; AC 8; MV 3, Fl 18</p>\n<p>(C); HD 1-4hp (1); THAC0 20 (13); #AT 1; Dmg</p>\n<p>1d2 (1d4); ML 7.</p>"
