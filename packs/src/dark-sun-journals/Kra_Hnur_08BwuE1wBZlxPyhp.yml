    text:
      format: 1
      content: "<p>Home to an aggressive tribe of half-giant raiders,\_the hold of Kra-Hnur lies in a hanging valley about\_halfway between Tyr and Walis. Crude stone fortifications barricade the path leading up from the valley\_to the stronghold. The goliaths keep large\_ flocks of\_goats and erdlus in the high pastures behind their\_walls, along with several hundred thralls of other\_races—captives taken in raids on the lowlands.</p>\n<p>The leader of the tribe, a huge, one-eyed half giant\_war chief known as the Great Kra, is far more clever\_than his brutish appearance would suggest. The\_Great Kra spent his youth serving in the royal guard\_of King Kalak of Tyr, and when he returned\_ home, he\_seized control of his tribe. He despises humans, elves,\_and other “weaklings,” and he personally leads his\_warriors on raids. The Kra-Hnurdha tribe primarily\_strikes at caravans on the Trade Road and isolated villages and outposts in the\_ Tablelands. However, with\_the recent chaos in Tyr, the Great Kra has turned his\_eye on the client villages clustering within the city’s\_verdant belt.</p>"
