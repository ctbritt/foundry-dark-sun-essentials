      content: "<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;white-space:pre-wrap\">(This is the original text from the wanderers guide)<span class=\" Apple-tab-span\" style=\"box-sizing:border-box;white-space:pre\"> </span> <span class=\" Apple-tab-span\" style=\"box-sizing:border-box;white-space:pre\"> </span></p>\n<div id=\"h.bq1hzujs8b8k\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;font-family:sans-serif;font-size:16px;white-space:pre-wrap\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.bq1hzujs8b8k_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nTyr</div>\n<h2 id=\"h.bq1hzujs8b8k_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Tyr is ruled by the sorcerer-king Kalak, who calls himself simply King Kalak or, as he sometimes prefers to be addressed, the Tyrant of TYR A pragmatic and ruthless man, Kalak is perhaps the most honest of all sorcerer-kings. He rules by the might of his magic and tremendous psionic powers, placing his own security and the stability of Tyr above all other considerations.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span class=\" Apple-tab-span\" style=\"box-sizing:border-box;white-space:pre\"> </span>If Kalak's attitude seems unjust or inequitable, it is at least predictable. The residents of his city understand that the best way to insure their own survival is to do what benefits Kalak. The surest way to find themselves working in the slave pits is to oppose Kalak's will. As a consequence, Tyrian society has functioned very efficiently for the thousand years that Kalak has ruled the city.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span class=\" Apple-tab-span\" style=\"box-sizing:border-box;white-space:pre\"> </span>The Tyrant of Tyr has always made his home in a magnificent palace adjacent to the gladiatorial stadium. The eastern wall of this palace overlooks the arena itself. During the games, Kalak himself can often be seen sitting on one of the hundred balconies that overlook the arena, accompanied by a handful of templars and other favorites.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span class=\" Apple-tab-span\" style=\"box-sizing:border-box;white-space:pre\"> </span>Of late, old King Kalak seems to have become senile. For the past twenty years, he has diverted much of the city's slave labor to building a mighty ziggurat (directly across the arena from his palace), claiming that it will protect Tyr from attacks by the dragon. At first, the nobles were tolerant of his folly, for the burden it placed on them was not great. Over the last year, however, Kalak has grown frantic to finish the massive structure, appropriating so many slaves that there is almost nobody left to work the fields.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span class=\" Apple-tab-span\" style=\"box-sizing:border-box;white-space:pre\"> </span>Kalak has also taken the slaves out of the mines, completely shutting down iron production. This has caused the city's economy to crash, leaving merchant and noble alike destitute. The slaves are starving, and even free craftsmen receive only meager grain rations in return for their services - and then only if their work contributes directly to the construction of the ziggurat.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">To make matters worse, other cities that depend upon imports of Tyr's raw iron to supplement their economies are up in arms. Many of them, most notably Urik and Raam, have sent emissaries to King Kalak with grave warnings concerning the consequences of failing to resume iron production. <span class=\" Apple-tab-span\" style=\"box-sizing:border-box;white-space:pre\"> </span>Can it be any wonder that in their private gatherings, nobles are whispering plans of rebellion and that merchants are fleeing the city in droves? Surely, even the iron grip of the templars cannot keep the city from erupting into a violent inferno for much longer.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px;white-space:pre-wrap;padding-left:0px\"><span class=\" Apple-tab-span\" style=\"box-sizing:border-box;white-space:pre\"> </span>When the final battle comes, it will be a terrible thing. The Royal Guard consists of two thousand mercenaries led by five hundred half-giants and Kalak's loyal templars. In fact, the latter are all armed with steel swords. Against them will be arrayed the varied armies of the nobles - who are far superior in number, if not armament. Considering the advantages of Kalak's magic, the contest will be a close one. Ironically, it may well be decided by the lowliest of all Tyr's citizens. the slaves.</p>"
