    text:
      format: 1
      content: >-
        <p>“These aren’t just stories for your amusement, you know—there is
        danger down there.”</p>

        <p>—Sahl-oren, a halfling swamp explorer</p>

        <p>The village of Yihn-tol gained the name Climber’s Home in times past
        when it was the</p>

        <p>center for the climbing profession. While that role has diminished,
        Yihn-tol is still a successful</p>

        <p>village of 1,800 inhabitants. It is also situated further down the
        cliff side than any</p>

        <p>other halfling settlement on the Jagged Cliffs. This presents two
        unusual challenges for</p>

        <p>the community.</p>

        <p>The first problem is Rajaat’s Curse. Being the village closest to the
        swamp means that</p>

        <p>terrifying effects emanating from it present a greater risk to those
        who live here. The</p>

        <p>mysterious incidents caused by the swamp’s energies sometimes result
        in disaster. Fire,</p>

        <p>sickness, blight, and mysterious disappearances are all traced to
        Rajaat’s Curse. The</p>

        <p>curse alters people, warping the bodies and even the minds of the
        inhabitants, particularly</p>

        <p>the newborn.</p>

        <p>The second trial is yet another threat from the swamp, this time from
        the monsters down</p>

        <p>below that seek a purchase a little higher on the cliffs. All manner
        of horrors breed within</p>

        <p>the swamp and some of them leave to ascend the bluffs. Most are
        clumsy climbers, illused</p>

        <p>to the bright and open ridges, and the city’s defenders easily ward
        them off.</p>

        <p>Yet far worse are the reggelids, who live at the base of the cliffs
        and wield strange</p>

        <p>powers. Thankfully, they rarely seek to come as high as Yihn-tol.
        Finally, and worst of</p>

        <p>all, are the rare but dangerous assaults of the thri-kreen. When the
        mantis warriors seek</p>

        <p>to find a way up the cliffs, they often choose to attack Yihn-tol
        first.</p>

        <p>Because of these threats, Yihn-tol is the only truly fortified
        halfling community. Walls</p>

        <p>of stone and other defenses protect the village. A large, well-armed
        garrison of vher-elus</p>

        <p>stands vigilant and ready to repel any attack. Unique among the
        vher-elus, however,</p>

        <p>their attention is directed outside the settlement rather than within
        it.</p>

        <p>There is no life-shaper sanctuary in Yihn-tol. The shapers refuse to
        risk either themselves</p>

        <p>or their growth chambers to the tender mercies of Rajaat’s Curse and
        swamp-born</p>

        <p>monsters. All of the shaped constructs required by the community must
        be shipped in</p>

        <p>from other villages. Life-shapers are flown in when a new building is
        to be created, and</p>

        <p>leave immediately upon completion. Because of this, The people of
        Yihn-tol have taken</p>

        <p>steps to reduce their needs for organic tools, products, and even
        structures.</p>

        <p>(The DM should add 50% to the prices of all life-shaped goods.)</p>

        <p>Places of Note</p>

        <p>Brewefam: Housing producers of wonderful leather goods, this place is
        named for its</p>

        <p>odd appearance. Apparently, a flaw during its growth caused the
        building to “sweat.”</p>

        <p>The walls of Bren-efam draw moisture from the air and the earth and
        secrete it out of</p>

        <p>the tiny pores in its surface. The seepage is a thick, syrupy ooze
        that is strangely sweet</p>

        <p>to the taste and quite harmless.</p>

        <p>Ter-ogon’s: This safehome caters to adventurers. Daring halflings
        occasionally decide</p>

        <p>to brave the dangers of the swamp or the kreen-infested savanna to
        learn what secrets</p>

        <p>and treasures they hold. When they do, they come to Yihn-tol first,
        and always end up</p>

        <p>at Ter-ogon’s.</p>

        <p>Ter-ogon’s is also a hideout for Chahn terrorists and other, even
        more disreputable,</p>

        <p>types. The comforts it offers are few, but pickings in Yihn-tol are
        slim. A night’s stay costs</p>

        <p>2 ghav-egoths, and a meal costs 1 ge.</p>

        <p>Important NPCs</p>

        <p>Pev-ovas (ham/F10/T10): AC 3 (hide armor and Dexterity bonus); MV 6;
        hp 53;</p>

        <p>THAC0 11; #AT 3/2; Dmg 1d8 (armblade); SA x4 backstab; SZ S (3’
        tall); ML Elite</p>

        <p>(14); AL CE; XP 3,000.</p>

        <p>S 17, D 17, C 14, I 12, W 9, Ch 8.</p>

        <p>Personality: brutish, cold</p>

        <p>Special Equipment: armblade, chameleon cloak, 100’ clingrope, hide
        armor, lightvisor</p>

        <p>graft.</p>

        <p>Thief Abilities: PP 70, OL 65, F/RT 45, MS 70, HS 65, DN 75, CW 65,
        RL 0.</p>

        <p>Pev-ovas is chief of the Chahn in Yihn-tol. He is a homicidal,
        megalomaniacal lunatic.</p>

        <p>He cares little for the feelings of others or for the cause he
        “supports.” He uses the</p>

        <p>Chahn as a vehicle for personal power and as an outlet for his
        destructive aggression.</p>

        <p>He has a number of subordinates, some of whom delude themselves into
        thinking that</p>

        <p>Pev-ovas is fighting for the cause of right. The rest are as
        dangerously evil as he.</p>
