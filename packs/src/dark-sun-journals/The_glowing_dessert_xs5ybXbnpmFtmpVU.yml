    text:
      format: 1
      content: "<p>Moving from south to north, the first portion of the\_Barrier Wastes travelers encounter is the sandy wastes of\_the Glowing Desert. This huge, open desert covers the\_largest portion of the Barrier Wastes. Except for its size\_and the low dunes shaped by the constant wind, this\_region of sandy wastes is much the same as the areas to\_the south. Surprisingly, sand storms aren't as prevalent\_here because of the strong wind from the west. Near the\_southeastern edge of the desert, where the west wind meets\_breezes blowing in from the south, the cross-current forms\_billowing walls of sand as thick as those produced by\_the Silt Sea. The Glowing Desert gets its name from a\_strange property of the yellow sand found here. At night,\_the sand glows with a ghostly luminescence as bright as\_starlight and as cold as the night air.</p>"
