    text:
      format: 1
      content: "<p>In the center of the large isle of Waverly is an\_ancient city of the same name that fell during the cleansing wars. The battles depopulated the\_city, but its high stone walls and gates remain stout\_and whole after thousands of years. The central\_plaza features a\_ grand fountain of marble fashioned\_in the likeness of a creature that has the body of a\_female human and a snakelike tail; the fountain\_still sprays water into the air in a shimmering arc.\_Old waterways crisscross Waverly, feeding a fertile\_scrub plain. Dozens of\_ sailing ships lie half buried in\_a harbor at the shore of the silt; their wooden hulls\_and decks became petrified long ago.\_Except for flocks of wild erdlus and hives of wild\_kanks, the island appears deserted. But according to\_legend, a staggering hoard of\_ silver lies buried in a\_treasure vault somewhere beneath the city.</p>"
