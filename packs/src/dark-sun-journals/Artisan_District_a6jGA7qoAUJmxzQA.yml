    text:
      format: 1
      content: "<p>This area is Tyr's secondary trade district. Artisan Way begins at the foot of the Ziggurat of Kalak and wends north to the city-state's wall, skirting the Warrens to the east.</p>\n<p>Permanent shops front the road, selling all manner of goods and services, including clothing, household items, fresh and dried foodstuffs, ale, footwear and shoe repair, weaving, and more. Other vendors and street performers work Artisan Way, but such people do not swarm the thoroughfare like locusts, as sometimes happens on Caravan Way.</p>\n<p>The businesses in this part of Tyr serve local needs rather than the needs of visitors. Many freed slaves who have parlayed their skills into useful crafts or services make their homes in the Artisan District.</p>\n<p>\_</p>"
