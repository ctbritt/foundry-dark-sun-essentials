    text:
      format: 1
      content: "<p>Professional Thieves</p>\n<p>Pickpocket Guild, Operating City-Wide</p>\n<p>Made up of thieves and cutpurses, the Iron Rats spend most of their day in richer districts, taking coins and valuables from the unwary and dodging the Tyrian Guard. Gavan Sul in the Smiths' District fences stolen goods for the gang.</p>\n<p>\_</p>"
