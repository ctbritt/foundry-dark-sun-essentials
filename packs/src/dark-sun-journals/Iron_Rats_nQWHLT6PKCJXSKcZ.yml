        wgCeShTrqHJFBbDr:
          notes: >-
            <p>The Iron Rats offer classic urban criminal
            encounters—pickpocketing attempts, information gathering through
            theft, or recruitment opportunities for roguish party members. Their
            city-wide operations mean they have eyes and ears throughout Tyr,
            making them valuable informants. Their connection to Gavan Sul
            provides a clear fence for stolen goods and potential plot hooks
            involving their criminal network.</p><p></p>
    _id: 2QG6YQMERtgHYH71
