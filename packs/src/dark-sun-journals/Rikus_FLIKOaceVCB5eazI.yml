    text:
      format: 1
      content: >-
        <p>Rikus embodies the raw determination and fighting spirit that drove
        Tyr's revolution. This mul (half-dwarf, half-human) former gladiator not
        only survived the arena but became its greatest champion before helping
        slay Kalak and transitioning into the unlikely role of military
        commander. He now leads the Crimson Legion, an army of former slaves and
        volunteers that successfully defended Tyr against King Hamanu's invasion
        from Urik—a shocking military upset that made him a legend among
        commoners and a threat in the eyes of neighboring sorcerer-kings. Blunt,
        courageous, and fiercely protective of Tyr's freedom, Rikus speaks
        plainly and lets his anger at injustice drive his actions, often
        clashing with nobles and the Council due to his straightforward military
        demands.</p>

        <p>What makes Rikus particularly dangerous to Tithian is his knowledge
        of the king's darkest secret: during the Urik war, Tithian secretly
        resumed sending slaves as tribute to the Dragon, even kidnapping Tyrian
        citizens to meet the quota. Rikus discovered these "secret slave raids"
        and was outraged, but the press of battle delayed a confrontation. Now
        he watches Tithian carefully, waiting for the right moment to either
        accuse the king publicly or act on this damning information. His lack of
        political sophistication is both a weakness and a strength—while he may
        be outmaneuvered by cleverer opponents, his moral clarity and military
        reputation make him a powerful potential ally for those seeking to
        expose Tithian's conspiracy.</p>
