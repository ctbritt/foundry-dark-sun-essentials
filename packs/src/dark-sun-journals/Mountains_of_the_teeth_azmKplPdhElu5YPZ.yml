      content: "<p>A low range of dry, knife-edged peaks, the Mountains\_of the Teeth are home to hostile tribes of tareks and\_minotaurs. The mountains also hide several mysterious, ancient monasteries—the strongholds of rakshasa\_princes. Ranging out from these isolated retreats,\_rakshasa spies roam the Tyr Region, secretly plotting\_to turn the sorcerer-kings against one another and\_enslave the city-states.</p>"
