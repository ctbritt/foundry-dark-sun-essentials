      content: "<p>Setup. This encounter takes place at night when the PCs dine at a quiet inn. Even so, PCs are unwise to let down their guard. Have the players turn to Players' Book p. 9-Inn of the Bleached Inix.</p>\n<p>\_</p>\n<p>Start. The encounter begins while the characters take their meal. Read the following aloud:</p>\n<p>\_</p>\n<p>As you enjoy your spicy bowls of stewed lizard and kank honey, a slave bearing a</p>\n<p>\_</p>\n<p>pot of stew crashes into a thri-kreen customer. Hot broth sprays everything, soak</p>\n<p>\_</p>\n<p>ing your clothes in stinging heat. The soaked thri-kreen clacks in irritation. Encounter. Seeing the accident, the innkeeper blusters over and berates his slave. He orders free drinks as recompense for the PCs and invites the party to name the slave's punishment.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Role-Playing. The innkeeper, Timrol, fawns nervously. The</p>\n<p>\_</p>\n<p>thri-kreen becomes less irritated and more amused as it</p>\n<p>\_</p>\n<p>watches the innkeeper. The slave cowers, watching the PCS fearfully. Dialogue</p>\n<p>\_</p>\n<p>\"Clumsy oaf! I curse the day I bought you! My greatest apologies for this slave's graceless behavior. Name his punishment-whatever amuses you!\" \"Perhaps [click-click] I could eat you [click].\" [Thri-kreen to slave.]</p>\n<p>\_</p>\n<p>Reaction. The slave retums with a tray of fresh drinks. If the characters show mercy to the slave, he whispers to one as sets out the mugs, \"Do not drink the wine. My master has poisoned it.\" The spiced wine is loaded with a sleeping drug. Five min utes after tasting the wine, each PC must make a saving throw vs. poison (-3). Those who fail fall into a deep slumber. Those who make the save are still groggy, suffering a +4 to initiative and a -4 to THACO roll, and becoming incapable of psionics and spell-casting. If all players fall unconscious, go to Outcome. If some remain conscious, the innkeeper and three dwarf slaves (use NPCs from Back ground Book) wrestle them into a back room and tie them up. Go to Outcome. If the group does not drink and challenges the innkeeper, he denies everything and threat ens to call the templars. If the characters allow him to, the templars arrest the PCs. (They have an arrangement with the innkeeper.)</p>\n<p>\_</p>\n<p>Outcome. The characters awake in jolting, rattling darkness, and are bound hand and foot. (They are in the back of a wagon.) The NPC thri-kreen is with them. After several minutes, the wagon stops and the tarp is pulled back. The PCs see Timrol taking money from a templar. The group is taken to the slave pens to work on the ziggurat.</p>\n<p>\_</p>\n<p>Next. If all PCs are captives, go to Part Two. Otherwise continue with Encounter 1A, 18, 1C, or 1D.</p>\n<p>\_</p>"
