      content: "<p>One of the largest bodies of water in the Tyr Region,\_Vanishing Lake is a vast mudflat south and east of the Estuary of the Forked Tongue. It stretches more\_than twenty miles in length and five in width. The\_precise size is difficult to judge, for the silty muck that</p>\n<p>surrounds the lake is easily mistaken for more of the\_mudflat. Extended periods of drought cause the lake\_to evaporate, which means that during the months of\_High Sun there is less water and more mud. Eventually the open water disappears entirely, and the lake</p>\n<p>seems to vanish, leaving behind a thin, watery mire.</p>\n<p>When the sun beats less fiercely during the months\_of Sun Descending, the water’s source wells up once\_more, and the lake becomes obvious to the eye again.\_Old silt sailors claim that the periods of open water\_grow shorter and farther apart as the years pass.</p>\n<p>Someday the lake might disappear and never return.\_Vanishing Lake is home to one or more aggressive water drakes, and silt runners, floating mantles,\_chathrangs, and other dangerous creatures live in\_tjie surrounding mudflat. The area is protected by a</p>\n<p>powerful, ancient druid known as the Old One. Most\_folk never encounter him, although occasionally a\_lost traveler, half dead from thirst and sun sickness,\_claims to have been set on the right path and given a\_waterskin by a mysterious old druid who disappeared</p>\n<p>into the silt.</p>\n<p>\_</p>\n<p>\_</p>\n<p>The Vanishing Lake</p>\n<p>At times the largest body of water known in the</p>\n<p>Tyr region, the Vanishing Lake is more than 20</p>\n<p>miles long and 5 wide. Its dimensions are subject to</p>\n<p>debate, for the open water is surrounded by silty</p>\n<p>mire that is mostly water, but appears as a mud flat.</p>\n<p>The lake\x92s mire border is just as deadly as silt or</p>\n<p>water to the fool who sets foot in it.</p>\n<p>Extended periods of extremely hot weather dry out</p>\n<p>the lake, advancing the mire border closer and closer</p>\n<p>to the lake\x92s center. Eventually the open water disa</p>\n<p>p p e a r s e n t i r e l y , a n d t h e l a k e a p p e a r s t o</p>\n<p>vanish-even though miles of watery mire still exist</p>\n<p>in the middle of the mud flat. Old travelers claim</p>\n<p>that the periods of open water are growing shorter</p>\n<p>and further apart as the years pass. Someday the</p>\n<p>lake may vanish and never return.</p>\n<p>The mud flat surrounding the Vanishing Lake is</p>\n<p>one of the largest and the most fertile known. Some</p>\n<p>parts are strong enough to support villages and extensive</p>\n<p>crop fields on their hardened crusts. Dangerous</p>\n<p>predators not normally found on mud flats</p>\n<p>inhabit the Vanishing Lake, including gaj, id fiends,</p>\n<p>and cha\x92thrang. Natives of the Vanishing Lake are</p>\n<p>familiar with the dangerous properties of the mire</p>\n<p>and avoid the inviting glimpse of open water.</p>\n<p>Some travelers claim that the Vanishing Lake is</p>\n<p>the region\x92s only remaining habitat for water</p>\n<p>drakes. If the monstrous creatures can survive in its</p>\n<p>silty waters, they must hibernate for months when</p>\n<p>the open water vanishes. Because a journey to the</p>\n<p>edge of the open water is nearly impossible, the water</p>\n<p>drakes\x92 existence remains unproven.</p>\n<p>The Vanishing Lake is under the protection of the</p>\n<p>druid known as the Old One. Defilers who come</p>\n<p>here meet him whether they want to or not.</p>\n<p>Human Druid</p>\n<p>18th Level</p>\n<p>Neutral (Good)</p>\n<p>Str 3</p>\n<p>Dex 17</p>\n<p>Con 15</p>\n<p>hp: 83</p>\n<p>Int 13</p>\n<p>Wis 20</p>\n<p>Cha 15</p>\n<p>AC: 1 (+3 ring of protection)</p>\n<p>#AT: 1</p>\n<p>T H A C 0 1 0</p>\n<p>Dmg: 1d8+2 (wooden longsword +4)</p>\n<p>Movement 12</p>\n<p>The Old One is among the most powerful druids</p>\n<p>in the Tyr region. Born nearly 100 years ago as a</p>\n<p>peasant villager in a distant city-state, he left the civilized</p>\n<p>world and took up the study of nature. In time</p>\n<p>he came to the Silt Archipelago and inherited the</p>\n<p>guarded lands from the ancient druid who preceded</p>\n<p>him. For more than 70 years he has guarded the</p>\n<p>fragile Archipelago against the careless abuses of</p>\n<p>intelligent creatures and the ruin of defilers. The</p>\n<p>time is coming when the Old One will lay down his</p>\n<p>guardianship and select another to carry on the</p>\n<p>never-ending fight.</p>\n<p>The Old One knows of the Valley of Dust and</p>\n<p>Fire, having traveled there once on his journeys. He</p>\n<p>counsels against visiting it, especially the Dragon\x92s</p>\n<p>sanctum in the center of the city. But he may impart</p>\n<p>his knowledge to a party that helps him. He may ask</p>\n<p>them to defeat a band of renegade giants who are</p>\n<p>25</p>\n<p>destroying a village or to simply help a farming family</p>\n<p>put in their crops.</p>\n<p>If the party fulfills its end of the bargain, the Old</p>\n<p>One tells of the Great Ash Storm, the Ring of Fire,</p>\n<p>and the Gate of Doom, described in Chapters Two</p>\n<p>and Three. He may give them a memento that</p>\n<p>serves as a token of safe passage among the Outlander</p>\n<p>clansmen led by the warrior Aristes (see the</p>\n<p>end of Chapter Two).</p>\n<p><img src=\"data:image/png;base64,\" /></p>"
