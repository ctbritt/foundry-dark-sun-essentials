      format: 1
      content: "<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;white-space:pre-wrap;padding-left:0px\">This sprawl of slums scars Tyr’s northern quarter with a sea of dilapidated structures inhabited by the desperate, the poor, and the unlucky. Freed slaves swarmed into the Warrens following Kalak’s overthrow, looking for places to call their own. Some found jobs on the plantations outside the city that once enslaved them. Others, less fortunate and less ambitious, turned to crime to survive. Visitors are advised to stick to the edges of the neighborhood. Monsters lair in some of the deepest portions of the Warrens, where many structures have remained empty and ruined for decades.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Other than a number of poor craftsfolk and dismal wine shops, the Warrens have few permanent stores of note. Sites in the Warrens include the following.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Elven Bridge</span></span>: The ancient Elven Bridge hangs over a dust-filled streambed that has been dry for as long as anyone can remember. This secluded spot is a site for clandestine exchanges and ambushes against innocents lured into the Warrens.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">House on Sand Street</span></span>: One place even the brutal gangs of the Warrens avoid is the winding, gutted alleyway called Sand Street. This road dead-ends at a structure that is not decrepit like those all around it. Rumors say that within the building dwells a wormlike creature known as a psurlon.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Elven Market:</span></span> Destitute as the Warrens are, many people visit the area to shop at the Elven Market. Stalls and tables clutter the dark alleyways, and elf peddlers beset anyone who seems likely to have a coin or two to rub together. Most elven goods are worthless baubles, but some tribes offer exotic items and curiosities that are not available anywhere else in Tyr.<br style=\"box-sizing:border-box\" />The Nightwinds tribe deals in silk rope, fleece, and soaps; the Vinian tribe sells exotic pets such as hurrums and lizards; and the Greenstone elves specialize in candles, sunrods, and everburning torches.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Screaming Cellar</span></span>: Just off the Elven Market is an abandoned winehouse whose cellar contains a secret entrance into Under-Tyr. When a crew of Toothcutters raided the winehouse one night and killed the proprietors, the conflict woke some kind of evil, which manifests as a screaming spirit of rage. No one who has seen it has survived, and those who hear the screams that issue up through the ground have troubled dreams.</p>\n<div id=\"h.vqmh6yz3c0r5\" class=\"GV3q8e aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;font-family:sans-serif;font-size:16px;white-space:pre-wrap\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:25px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);opacity:0;top:12.5px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.vqmh6yz3c0r5_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nGangs</div>\n<h3 id=\"h.vqmh6yz3c0r5_l\" class=\"CDt4Ke zfr3Q OmQG5e\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:16px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:15pt;font-family:Lato, sans-serif;line-height:1.25;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h3>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Many gangs roam the Warrens. Robberies have risen dramatically since Kalak’s death, and the Tyrian Guard finds bodies in the street daily. Sometimes the violence spills over into the trade districts or the Noble District. Not even appearances by strong templar patrols helps. The mobs scatter when they see the guards coming, vanishing like rats in a sewer. Gangs in the Warrens include the following.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Toothcutters</span></span>: This pack of murderous elves controls the largest swath of the Warrens. Many shops within (and outside) the Warrens pay protection money to the Toothcutters. The influential half-elf Shivrin has a secret association with this gang.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Iron Rats:</span></span> Made up of thieves and cutpurses, the Iron Rats spend most of their day in richer districts, taking coins and valuables from the unwary and dodging the Tyrian Guard. Gavan Sul in the Smiths’ District fences stolen goods for the gang.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Ruincreepers:</span></span> This group of displaced halflings lives like feral animals in the deepest part of the Warrens. Word is that they have tamed an escaped braxat that lairs among the dilapidated structures.</p>"
