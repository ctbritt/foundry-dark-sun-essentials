      content: "<p>To Eth, at the Templar's Shade Tavern,</p>\n<p>Sad news from Bixul: Upon entering the village, an inix bolted</p>\n<p>and caused considerable injury to the village guard, and to some</p>\n<p>of our merchants. The locals are little amused and their refusal to</p>\n<p>cooperate means this missive reached you only with difficulty. I cannot</p>\n<p>say when I can write you again.</p>\n<p>I hope you and your family are well and your business prospers.</p>\n<p>Sadly, this latest set-back may have ruined our expedition—we have</p>\n<p>missed much of the season. The market will soon close. We have had</p>\n<p>little time to offer our goods or even secure a place in the stalls. As</p>\n<p>of now, I have but two main contacts, and I must bank our whole shipment</p>\n<p>upon them. You may wish to shift your investments quickly to more profitable</p>\n<p>markets.</p>\n<p>As ever,</p>\n<p>Your servant, F.</p>\n<p>Find it in your heart to offer these messengers a drink—they have</p>\n<p>traveled a long and dusty road.</p>\n<p>___________________________________ Danish translation_______________________________</p>\n<p>Til Eth, på Templar's Shade Tavern,</p>\n<p>\_</p>\n<p>Triste nyheder fra Bixul: Da den kom ind i landsbyen, stak en inix af og forårsagede betydelig skade på landsbyvagten og på nogle af vores købmænd. De lokale er ikke glade og deres afslag på at samarbejde betød, at denne besked kun nåede dig med besvær. Jeg kan ikke sige, hvornår jeg kan skrive dig igen.</p>\n<p>\_</p>\n<p>Jeg håber, at du og din familie har det godt, og at din forretning går godt. Desværre kan dette seneste tilbageslag have ødelagt vores ekspedition-vi har mistet meget af sæsonen. Markedet lukker snart. Vi har haft kort tid til at tilbyde vores varer eller endda sikre os en plads i boderne. Lige nu har jeg kun to hovedkontakter, og jeg må betro hele vores forsendelse på dem. Du vil måske hurtigt flytte dine investeringer til mere rentable markeder.</p>\n<p>\_</p>\n<p>Som altid,</p>\n<p>\_</p>\n<p>Din tjener, F.</p>\n<p>\_</p>\n<p>Find det i dit hjerte at tilbyde disse budbringere en drink, de har tilbagelagt en lang og støvet vej ..</p>\n<p>\_</p>\n<p>\_</p>\n<p>\_</p>"
