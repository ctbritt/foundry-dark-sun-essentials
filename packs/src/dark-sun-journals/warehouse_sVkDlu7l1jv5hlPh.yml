      content: "<p>Setup. The warehouse is at location 11I on the map of Yaramuke. Have the players turn</p>\n<p>to the Player\x92s Book, page 1\x97Warehouse.</p>\n<p>Start. The warehouse is the only building in the ruins that is more than half-visible above</p>\n<p>the shifting sands. The upper 10 feet of the building can be seen for quite some distance.</p>\n<p>Characters can easily enter through a window. The only window large enough to accommodate</p>\n<p>half-giants and thri-kreen is in the center of the eastern wall. Once at a window,</p>\n<p>characters must climb 25 feet down to the floor of the building. If the characters enter</p>\n<p>through a window at the southeast corner, they may easily climb down the rubble pile</p>\n<p>there. This is a simple task requiring a roll vs. Dexterity. If the character fails, he or she</p>\n<p>takes 1d4 damage from the tumbled own the sharp, irregular surface.</p>\n<p>Encounter. The building is mostly vacant. A few chests are piled along the north wall and</p>\n<p>some barrels and crates fill the northwest corner. However, the containers are in bad</p>\n<p>repair and whatever they once held has on since decayed. Should the characters examine</p>\n<p>the crates or barrels, they will fall prey to a dangerous pit trap. All squares adjacent to</p>\n<p>the crates and barrels are part of the trap, and once more than 100 pounds is placed on</p>\n<p>any part of the trap, it springs. The barrels, crates, and surrounding area collapses in a</p>\n<p>cloud of dust, dumping anyone in the trap\x92s area of effect into a 10-foot-deep hole. Characters</p>\n<p>take 1d6 points of damage from the fall and 1d4 points from the wreckage that falls</p>\n<p>down on top of them. A successful save vs. paralyzation reduces damage by half. Before</p>\n<p>the trap is sprung, a thief has half his or her normal chance to discover the trap, which</p>\n<p>cannot be disarmed, only avoided. The pit is the work of the t\x92chowb S\x92kin\x92di (see S\x92kin\x92di</p>\n<p>the T\x92chowb in this flipbook and the Story Book for more information).</p>\n<p>Through his psionics and some magical items from Abalach-Re, S\x92kin\x92di has transformed</p>\n<p>the walls of the pit to obsidian. Climbing this glassy rock is impossible for any</p>\n<p>character but a thief, and even thieves\x92 chances to climb out are reduced by 15%. Should</p>\n<p>characters attempt to extricate themselves from the pit using grappling hooks and rope,</p>\n<p>there is a 25% chance that the glassy edge of the pit will give way. Shards of obsidian rain</p>\n<p>down upon the PCs. These shards are THAC0 17 and each PC may be injured by 1d4</p>\n<p>shards. Half-giant characters may attempt to pull themselves out of the pit by their hands,</p>\n<p>but must protect themselves first. Unprotected hands suffer 1d4 points of damage each.</p>\n<p>There is a 30% chance of the edge of the pit crumbling while a half-giant climbs out.</p>\n<p>Next. The characters may proceed with their investigation of Yaramuke.</p>"
