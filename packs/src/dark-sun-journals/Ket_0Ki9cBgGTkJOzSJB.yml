      content: "<p>Seventy miles northeast of Bitter Well sits the large\_village of Ket, known to dune traders as the last out\_post of\_ civilization in this corner of the Tyr Region.\_</p>\n<p>The half-legendary cities of Kurn and Eldaarich are\_many days’ travel to the north, and trade with those\_distant realms\_ is infrequent. Ket lies in a large mudflat\_covered in tall grasses, trees, and brush. A silt\_basin surrounds the flat, and a\_ mile-long wooden\_causeway spans the dust, linking Ket to the Road\_of Kings. Ket is a client village of Draj, and Draji\_warriors stationed here protect the settlement from\_attacks by giants.</p>\n<p>\_</p>\n<p>The most remote of the villages of the Tyr region,\_Ket is a client village of the city-state of Draj. Like\_its parent city, Ket sits upon a mud flat, surrounded\_entirely by the dust basin. A narrow causeway a\_mile long spans the silt around the small town and\_provides the only access to the village. Ket\x92s population is about 500.</p>\n<p>Several merchant houses of Draj, including the\_Dedys Consortium, maintain outposts in the village.\_The people of Ket are surrounded by a fertile\_mud flat, and they grow more food than they can\_use. Merchants buy the surplus and transport it to\_less fortunate areas.</p>\n<p>Several volcanic peaks of the Ringing Mountains\_are only four or five days\x92 journey away, so the merchants\_sometimes organize obsidian-quarrying expeditions.\_</p>\n<p>On rare occasions, one does not return;\_no one has discovered the fate of the expeditions\_that do not come back. A garrison of 200 soldiers\_protects the village against giant attacks.</p>"
