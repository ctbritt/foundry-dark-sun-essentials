      content: "<p>Setup. Choose a neutral-or evil-aligned PC for this encounter. Psionicists work best,</p>\n<p>but any class will work. Arrange a place to speak privately with that player.</p>\n<p>Start. This encounter begins the day after the chosen PC has demonstrated his</p>\n<p>powers or abilities. Read the following aloud to all players:</p>\n<p>Today, the overseers work you particularly hard. As you struggle beneath heavy</p>\n<p>loads, one shifts as if with vengeful purpose and crashes to the ground. Swearing,</p>\n<p>your overseer lays in with the lash.</p>\n<p>The overseer whips one of the larger PC (not the chosen one) for 2d2 points of</p>\n<p>damage. While this happens, two half-giant guards seize the chosen PC. Separate</p>\n<p>that player from the others and read him the following:</p>\n<p>Without a word of explanation, the half-giants march you to an overseer\x92s hut</p>\n<p>and shove you inside. In a gloomy corner stands a black-robed templar, his face</p>\n<p>hidden in darkness. Without a word of introduction, he begins, \x93I could have</p>\n<p>you whipped, even killed, for your clumsiness ! Your death might teach the others</p>\n<p>a lesson! Perhaps you know a reason I should not kill you.\x94 The templar pauses,</p>\n<p>obviously awaiting a response.</p>\n<p>Encounter. Though the templar will not volunteer the information, he wants the PC</p>\n<p>to become an informer. If the PC picks up the insinuation and agrees, the templar</p>\n<p>instructs him to report any escape plans or Veiled Alliance activity to the half-giant</p>\n<p>guards. In exchange, the templar discreetly increases the PC\x92s water ration (no Con</p>\n<p>loss) and spares him future punishment. (Overseers and guards blame others, not</p>\n<p>the PC.) These benefits come with the warning that if the PC neglects his duties or</p>\n<p>double-crosses the templar, the templar will frame him as an informer. Once discovered,</p>\n<p>informers often die within the day. If the PC refuses to inform, the templar</p>\n<p>orders his punishment\x97to be bound to a frame, lashed (1d10 + 10 points damage),</p>\n<p>and exposed to the sun for a full day (1d6 Con loss). Explain these consequences to</p>\n<p>the player.</p>\n<p>Role-Playing. The templar alternates between kindness and cruelty. He offers extra</p>\n<p>water and good treatment but in the same breath speaks of the PC\x92s death. He</p>\n<p>avoids directly stating his wants or expectations, instead letting the PC make the</p>\n<p>offers and suggestions: he hopes thereby to increase the character\x92s commitment.</p>\n<p>Dialogue</p>\n<p>\x93Remember the slave whipped to death yesterday? Amazing what one rude remark</p>\n<p>can do.\x94</p>\n<p>\x93The pens hold certain groups that want disciplining.\x94</p>\n<p>Outcome. The PC leaves the meeting either strapped to a frame or with treachery</p>\n<p>upon his heart.</p>\n<p>Next. Continue play with another encounter or scene from Part Two. After Part</p>\n<p>Two encounters conclude, go to Part Three, Encounter C\x97Management Potential.</p>"
