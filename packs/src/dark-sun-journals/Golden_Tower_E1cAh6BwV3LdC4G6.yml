      content: >-
        <p>This magnificent edifice is constructed of rare golden granite that
        gleams like yellow iron under the crimson sun of Athas. A high, arching
        bridge connects the smaller observation tower with the larger main keep.
        The defiling magic of King Kalak bound ancient elementals to the Golden
        Tower, and these creatures show themselves if invaders threaten the
        structure.</p><p>The third level of the tower (to which the bridge from
        the observation spire connects) contains the Advisors' Chamber, formerly
        the Royal Receiving Room, whose seats are luxurious pillows and
        cushions. The former centerpiece of the chamber, Kalak's opulent iron
        throne, has been removed and forged into blades to arm heroes of the
        revolt against Kalak. A council of Tithian's highest-ranking templars
        meets in this room, and leaders of other power groups in Tyr are called
        to the Golden Tower when the king or the templars need to sell them on a
        certain course of action.</p><p>Onyx staircases lead to the chamber
        above, which was Kalak's library. King Tithian's chamberlains guard the
        collection; sages and scholars who have been granted access report that
        the library holds many secrets of the long history of Athas.</p>
