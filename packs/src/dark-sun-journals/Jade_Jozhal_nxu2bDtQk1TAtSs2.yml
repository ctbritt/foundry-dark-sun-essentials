pages:
  - type: text
    name: Jade Jozhal
    flags:
      monks-enhanced-journal:
        type: shop
        shoptype: Jewlery Shop
        location: Noble District
        state: closed
        autoopen: true
        purchasing: locked
        selling: locked
        appendix: false
        _lasttab: items
        wgCeShTrqHJFBbDr:
          notes: >-
            <p><strong>Proprietor Details:</strong></p><ul><li><strong>Kaorik
            Marrish</strong>(Dwarf Artisan): Master jeweler and
            craftsman</li><li><strong>Personal Craftsmanship</strong>: Creates
            all pieces himself with meticulous attention to
            detail</li><li><strong>Material Expertise</strong>: Skilled in
            working with diverse Athasian materials</li><li><strong>Dwarven
            Focus</strong>: Likely has a lifelong dedication to perfecting his
            jewelry craft</li></ul><p><strong>Special
            Services:</strong></p><ul><li>Material Identification: Kaorik can
            identify unknown gems, metals, or organic materials (100-300
            ct)</li><li>Appraisal Services: Professional valuation of jewelry
            and precious items (50-200 ct)</li><li>Rush Orders: Expedited custom
            work (50% surcharge)</li><li>Discretion Guarantee: No questions
            asked about material sources (No extra charge, but
            expected)</li></ul><p><strong>Shopping
            Notes:</strong></p><ul><li>All custom work requires 50%
            deposit</li><li>Completion time varies from days (simple) to months
            (complex pieces)</li><li>Kaorik's dwarven focus ensures exceptional
            quality but can make him obsessive about details</li><li>Ixixt's
            presence ensures no theft attempts succeed</li><li>Bulk discounts
            available for multiple pieces</li><li>Trade accepted: rare
            materials, unusual gems, exotic creature
            parts</li></ul><p><strong>Shop
            Guardian:</strong></p><ul><li><strong>Ixixt</strong>(Thri-kreen):
            Silent protector who remains perfectly
            motionless</li><li><strong>Living Sculpture</strong>: Customers
            often mistake him for an elaborate display
            piece</li><li><strong>Security Deterrent</strong>: His presence
            discourages theft and protects valuable
            inventory</li><li><strong>Sudden Animation</strong>: Likely springs
            into action when threats are detected</li></ul><p><strong>Shop
            Atmosphere:</strong></p><ul><li><strong>Artisan Workshop</strong>:
            Working space where customers can watch jewelry being
            crafted</li><li><strong>Display Cases</strong>: Carefully arranged
            showcases highlighting finished pieces</li><li><strong>Material
            Storage</strong>: Organized supplies of rare bones, horns, and
            gems</li><li><strong>Quiet Environment</strong>: Peaceful setting
            conducive to detailed craftwork</li></ul><p><strong>Role in
            Adventures</strong>: Jade Jozhal serves as both a source of
            high-quality jewelry and a potential hub for information about rare
            materials. Kaorik's expertise makes him valuable for identifying
            mysterious artifacts or gemstones. His need for exotic materials
            could send parties on gathering expeditions to dangerous locations.
            Ixixt's presence adds an element of surprise—his sudden movement
            after long periods of stillness could startle newcomers or prove
            crucial during shop incidents. The custom jewelry services allow
            players to create personalized items or convert found materials into
            wearable wealth.</p>
        lastrolltable: RollTable.wg9Exulf29SvcLDG
