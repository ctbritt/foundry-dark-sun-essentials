    text:
      format: 1
      content: >-
        <p><strong>Jade Jozhal - Exotic Jewelry &amp;
        Ornaments</strong><em>Kaorik Marrish, Proprietor</em></p><p>Items
        include exotic jewelry fashioned from bone, horn, wood, metal, and gems.
        Kaorik Marrish, the dwarf proprietor, fashions the jewelry himself. The
        shop's guardian is a thri-kreen named Ixixt, whose motionless stance
        leads many customers to think that he is a particularly lifelike
        sculpture.</p><p><strong>Services &amp;
        Inventory:</strong></p><ul><li><strong>Custom Jewelry</strong>:
        Handcrafted pieces made to customer
        specifications</li><li><strong>Exotic Materials</strong>: Ornaments
        fashioned from bone, horn, wood, metal, and gems</li><li><strong>Repair
        Services</strong>: Restoration and modification of existing
        jewelry</li><li><strong>Appraisal</strong>: Expert evaluation of
        precious items and materials</li></ul>
