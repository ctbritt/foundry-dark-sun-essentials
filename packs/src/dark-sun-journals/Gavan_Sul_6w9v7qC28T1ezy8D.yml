        wgCeShTrqHJFBbDr:
          notes: >-
            <p>Sul serves as a fence for the Iron Rats, a gang that prowls the
            Warrens. Every so often, a member of the Rats gets the idea to rob
            the tiefling's shop, but such thieves are never seen again. Sul is
            also secretly involved with the Ianto Traders, members of House
            Ianto who aren't ready to quit the slave trade just yet. The
            tiefling sometimes abducts patrons of his shop to supply Ianto's
            illicit operation.</p><p>**Role in Adventures**: Sul provides a
            morally ambiguous contact in the Warrens who can fence stolen goods,
            provide information about criminal activities, or serve as a source
            of black market items. His involvement in illegal slave trading
            makes him a potential target for investigation or a dangerous ally
            for parties willing to compromise their ethics for information and
            resources.</p>
