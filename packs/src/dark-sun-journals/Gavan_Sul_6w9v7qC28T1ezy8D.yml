    text:
      format: 1
      content: >-
        <p>Despite the fierce nomadic reputation of elves, Gavan Sul is the very
        soul of urbanity, so much so that he comes off as slightly insincere
        when he flatters customers about how well a particular piece of jewelry
        or clothing would look on them. That's because Sul is insincere; he
        cares only for profit and would sell the eyes of his own mother for
        enough coin.</p>
