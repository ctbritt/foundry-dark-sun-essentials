      content: >-
        <section class="mcp-journal">
              

              <div class="wrap">
                <h1>Background: Free-Wanderer</h1>
                <hr class="orn" />

                <p class="lead">A custom Dark Sun background for elf rogues driven by wanderlust to explore the Tyr region. Includes skill proficiencies, equipment, feature, and suggested characteristics.</p><div class="grid-2"><div><h3>Quest Details</h3><ul><li><strong>Type:</strong> Side Quest</li></ul></div><div><h3>Rewards &amp; Status</h3><ul><li><strong>Status:</strong> Active</li><li><strong>Created:</strong> 12/16/2025</li></ul></div></div><h2 class="spaced">Adventure Hook</h2><div class="readaloud"><p><strong>Read-Aloud:</strong> Disturbing rumors begin circulating in the area. Multiple witnesses describe strange and threatening events that demand immediate investigation. The situation clearly demands investigation before it worsens.</p></div><div class="gmnote"><p><strong>GM Notes:</strong> This quest is designed as a side quest. Adjust encounters, NPCs, and obstacles to match your party's level and campaign tone. Consider appropriate rewards based on the quest's difficulty and your party's level.</p></div><h2 class="spaced">Quest Objectives</h2><ul><li>Complete the main objective: A custom Dark Sun background for elf rogues driven by wanderlust to explore the Tyr...</li><li>Report the outcome to the appropriate authorities</li></ul><h2 class="spaced">Progress Notes</h2><div class="gmnote"><p><strong>GM Note:</strong> Use this section to track quest progress, player decisions, and any modifications made during gameplay.</p></div>
              <h2 class="spaced">Prerequisite</h2>
        <p><strong>Elf only</strong></p>


        <h2 class="spaced">Description</h2>

        <div class="readaloud"><p>At some point in an elf's life, the wanderlust
        comes upon them. They must run as far and as fast as their swift legs
        will take them. They must see what lies beyond the horizon, and find as
        many ways to enjoy the now as they possibly can. Free-wanderers survive
        by their wits, their quickness, and their thieving skills. They see
        every guarded purse and locked box as a challenge they must
        accept.</p></div>


        <h2 class="spaced">Proficiencies</h2>

        <p><strong>Skills:</strong> Choose one from Survival or Stealth, and one
        from Sleight of Hand or Perception</p>

        <p><strong>Tools:</strong> Thieves' tools</p>

        <p><strong>Languages:</strong> One of your choice</p>


        <h2 class="spaced">Equipment</h2>

        <ul>

        <li>A set of traveler's clothes</li>

        <li>Thieves' tools</li>

        <li>A small token from your tribe</li>

        <li>A belt pouch containing 10 cp</li>

        </ul>


        <h2 class="spaced">Feature: Wanderer's Welcome</h2>

        <div class="readaloud"><p>Free-wanderers are among the friendliest and
        most outgoing of elves. You have advantage on Charisma checks made to
        join or be accepted by a traveling group, caravan, or adventuring party.
        Additionally, you can always find fellow elves or travelers willing to
        share rumors, directions, or a place to rest for the night in exchange
        for stories of your wanderings.</p></div>


        <h2 class="spaced">Suggested Characteristics</h2>

        <h3>Personality Traits (d8)</h3>

        <ol>

        <li>I treat every new experience as a gift to be savored.</li>

        <li>I cannot stay in one place for more than a few days before the
        wanderlust takes hold.</li>

        <li>I find walls and roofs oppressive and prefer to sleep under the
        stars.</li>

        <li>I speak quickly and move faster, always eager for the next
        adventure.</li>

        <li>I collect small mementos from every place I visit.</li>

        <li>I am always watching, always planning my next move.</li>

        <li>I laugh easily and find joy in the simplest pleasures.</li>

        <li>I instinctively case every room I enter, noting exits and
        valuables.</li>

        </ol>


        <h3>Ideals (d6)</h3>

        <ol>

        <li><strong>Freedom.</strong> The open road is my home. No walls can
        hold me. (Chaotic)</li>

        <li><strong>Experience.</strong> I want to see everything before I die.
        (Any)</li>

        <li><strong>Elven Pride.</strong> What outsiders have was always meant
        for elves. (Neutral)</li>

        <li><strong>Skill.</strong> Every lock is a puzzle. I live to test
        myself. (Any)</li>

        <li><strong>Kinship.</strong> Everything I learn will benefit my people.
        (Good)</li>

        <li><strong>Survival.</strong> I take what I need to survive.
        (Neutral)</li>

        </ol>


        <h3>Bonds (d6)</h3>

        <ol>

        <li>I will return to my tribe one day with enough stories and wealth to
        earn a place of honor.</li>

        <li>I carry a token from someone in my tribe who waits for my
        return.</li>

        <li>I am searching for a legendary treasure that will change my tribe's
        fortunes.</li>

        <li>I owe my life to a non-elf who helped me during my wanderings.</li>

        <li>I am gathering information about a threat to all elf tribes.</li>

        <li>I left my tribe after a personal tragedy and cannot return until I
        have proven myself.</li>

        </ol>


        <h3>Flaws (d6)</h3>

        <ol>

        <li>I cannot resist a challenge, even when the odds are against me.</li>

        <li>I have difficulty trusting non-elves, even those who have proven
        themselves.</li>

        <li>I am easily distracted by shiny objects and unguarded
        valuables.</li>

        <li>I grow restless and irritable if I stay in one place too long.</li>

        <li>I am overconfident in my abilities and underestimate my
        enemies.</li>

        <li>I have stolen from someone I shouldn't have, and they are still
        looking for me.</li>

        </ol>


        <div class="gmnote"><p><strong>Tribal Affiliation:</strong>
        Free-wanderers come from all elf tribes, though they often discard
        identifying features of their native dress during their periods of
        travel and adventure.</p>

        <p><strong>Suggested Classes:</strong> Rogue (Thief, Scout,
        Swashbuckler)</p></div></div>
            </section>
