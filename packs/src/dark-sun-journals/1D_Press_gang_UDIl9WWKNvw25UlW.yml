      content: "<p><strong>Setup</strong>. This encounter can occur on any street. Have the players turn to Players Book p. 14-Street Map. Page 33-Street Scene also contains some colorful details.</p>\n<p>\_</p>\n<p><strong>Start</strong>. Introduce this encounter anytime the characters are in the street.</p>\n<p>\_</p>\n<p><strong>Encounter</strong>. As the characters strolling along, a squad of the sorcerer king's guards seals off all streets and alleys as noted on the Street Map</p>\n<p>Shutters and doors slam, shutting off businesses and homes. The soldiers begin to move down the street, accosting everyone in their path. They order the homeless and indigent to assemble along one wall. Only merchants and</p>\n<p>nobles are allowed through the cordon</p>\n<p><strong>Role playing</strong>. Little opportunity exists for roleplaying. The patrol is filling a quota and for once resists bribes The half giant commander will let one character free for every 1,000 cp he receives now.</p>\n<p>\_</p>\n<p><strong>Statistics</strong>, Torban, half-giant commander: AL. LE AC 5 (kank armor): MV 15; HD 6; hp 75, THACO 11: #AT 3/2; Dmg 1d6 10 (copper club); ML 13; Str 20; Dexi 13; Con 16: Int 13; Win 13. Cha 15. Wild Talent: Flesh armor; PS Con 3 Cost 8/4 rd; PSP Asst. Templars (2): AL NET; AC 8 (leather corselet); MV</p>\n<p>\_</p>\n<p>12, HD 3, 2, hp 16. 8. THACO 22; #AT 1; Dmg 1d4 1</p>\n<p>\_</p>\n<p>(obsidian dagger): ML 14: Str 10; Dex 11: Con 12; 1nt 12, Wis 13; Cha 9. Spells: cure light wounds, silence 15 Half Giant Soldiers (4): Al. N: AC 5 (kank armor); MV 15; HD 4: hp 60, 60 40, 30: THACO 15; #AT 1: Dmg (obsidian word). ML 10: Str 17, Dex 15. Can 16, Init 11: Wus 8 Cha</p>\n<p>\_</p>\n<p><strong>Reactions</strong>. The press gang solves any problems with force, not hesitating to injure or kill. If the PC fight, one man already taken springs to their defense.</p>\n<p>\_</p>\n<p>Bramas AL NG: AC A finix leather); MV 12: HD 3; hp: 18: THACH 1o: AT: Dmg 1d6+4 (bone wrist razor); ML. 10, Str 18/13: Dex 13; Can 15; Int 14: Wis 7. Cha &amp;</p>\n<p>\_</p>\n<p>. It the PCs escape, they become wanted, with a 70% chance of being recognized and attacked in the future if subdued, they (and Framas) go to work on the zigguart. Next. If all the PC am captive, go to Part Two. Otherwise continue with Encounter</p>\n<p><img src=\"street%20scene.png\" width=\"486\" height=\"338\" /></p>"
