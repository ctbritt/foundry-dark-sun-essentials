      content: "<p>Setup. Have the players turn to Players\x92 Book p. 29\x97Duel in the Sand.</p>\n<p>Start. This encounter starts at mealtime, after the PCs have received their meager</p>\n<p>bowls of food. Read the following aloud:</p>\n<p>With your fingers you scrape up the last of your greasy, muddy-looking gruel.</p>\n<p>Suddenly, a spray of slop blankets you, punctuated by a searing epithet. Almost</p>\n<p>immediately, a pair of bodies crash through your small group.</p>\n<p>Encounter. The two bodies belong to Lissan and Kanla, gladiators sent to the slave</p>\n<p>pens for punishment. As they crash through the PCs, Kanla\x92s deadly intent should</p>\n<p>be obvious to the PCs. Lissan blocks with her quarterstaff as Kanla whirls a bola.</p>\n<p>After several feints and parries, Kanla knocks her opponent to the ground and</p>\n<p>springs astride her back. Wrapping several loops of the cord around Lissan\x92s neck,</p>\n<p>she begins choking the life from her fellow gladiator. The guards do not intervene,</p>\n<p>placing bets on the outcome.</p>\n<p>Role-Playing. From their shouts, the PCs know that Kanla and Lissan fight over a</p>\n<p>man named Tachandral. Kanla hates Lissan because she was chosen to be Tachandral</p>\n<p>\x92s fighting partner. On several occasions Lissan attempts explanation, passing</p>\n<p>up opportunities to cause serious harm. Kanla, on the other hand, thirsts for Lissan</p>\n<p>\x92s blood. She flies into an unthinking rage, screaming out insults and hatred.</p>\n<p>Dialogue</p>\n<p>\x93I\x92m stronger, faster, and tougher than you! I should have been his partner.\x94</p>\n<p>\x93When you are dead, I will fight at Tachandral\x92s side.\x94</p>\n<p>\x93The trainer chose me because our skills complement each other.\x94 [Gurgle]</p>\n<p>Statistics.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>K a n l a : AL NE; AC 8; MV 12; HD 6; hp 51; THAC0</p>\n<p>14; #AT 1; Dmg 1d6+3 (bola); ML 17; Str 18(22); Dex</p>\n<p>18; Con 17; Int 11; Wis 9; Cha 10.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Lissan: AL N; AC 9; MV 12; HD 6; hp 57; THAC0 15;</p>\n<p>#AT 1; Dmg 1d6 (quarterstaff); ML 18; Str 15; Dex 15;</p>\n<p>Con 16; Int 15; Wis 16; Cha 16.</p>\n<p>Outcome. Kanla will kill Lissan unless prevented. If the PCs</p>\n<p>intervene, Kanla fights them with all her skill. After 2d8 combat</p>\n<p>rounds, 10 guards, angry that their bets have been ruined,</p>\n<p>wade into the battle. If a PC slays any guard, the</p>\n<p>remaining guards capture and execute him (if possible). Any</p>\n<p>other slaves involved in the fight are thrown into the Pits\x97</p>\n<p>tiny, dark shafts dug deep into the ground\x97and left there for</p>\n<p>d a y s .</p>\n<p>Next. From this encounter you can play Part Three, Encounter</p>\n<p>B\x97To the Arena, or switch to other storylines of Part Two. Characters in</p>\n<p>the pit cannot take part in further encounters until \x93To the Arena\x94 is played.</p>"
