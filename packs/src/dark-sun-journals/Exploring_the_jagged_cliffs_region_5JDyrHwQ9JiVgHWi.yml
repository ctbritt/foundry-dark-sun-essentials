      content: "<p>JAGGED CLIFFS</p>\n<p>The Empty Plains come to an end at the Jagged Cliffs, a confusing maze of gradually steepening escarp ments and winding canyons following the shore of a long-vanished sea. Over the course of thirty or forty miles, the land descends to the rolling plains of the Crimson Savanna, which lie two miles lower than the Empty Plains to the east. In their middle elevations, the cliffs are almost vertical, posing a nearly impassable barrier to travel from east to west. In the gentler and more well-watered canyons and hanging valleys in the northward stretch of the cliffs, strange vertical forests cling to the sheer slopes and narrow ledges. Tribes of halflings inhabit some of these forests, building their villages directly from the cliff faces. Their technology is more prithitive than that of the city-states, but the halfling culture of the lagged Cliffs is rich, vibrant, and old. Like their kin</p>\n<p>in the Forest Ridge, these halflings are a proud and\_isolationist people who do not appreciate outsiders\_wandering through their lands.</p>\n<p>\_</p>\n<p>Thamasku: Far to the north, the halfling settlement ofThamasku lies in a large, fertile hanging\_valley along the lagged Cliffs. The settlement has\_stone buildings, paved roads, and a population rivaling that of a small city-state. Thamasku is a center of\_trade among the halfling tribes of the cliffs, and its\_bustling markets draw merchants from up and down\_the region. Occasionally, more exotic traders, including representatives of the merchant houses of the Tyr\_Region and thri kreen from the Crimson Savanna,\_can be found selling their wares.</p>\n<p>\_</p>\n<p>The Forbidden City: Within the jungles south of Thamasku, an ancient city half overgrown by withered vines and stunted trees crumbles into ruin. The nomadic halflings of the surrounding tribes whisper fearful tales of Tham Nusul—the Forbidden City. They tell of serpentfolk that come in the night, silent as shadows, and steal children from their cribs. They tell of plants that seek the blood of the living, and of a devil in the cisterns below the city that ensnares its victims with illusions and turns them into mindless servants. The yuan-ti that dwell in the Forbidden City raid the local tribes for food and slaves, and sometimes they grow bold enough to waylay large war parties of halflings or thri-kreen that venture too close.</p>"
