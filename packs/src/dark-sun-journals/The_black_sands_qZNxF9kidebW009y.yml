      content: "<p>East of the Silver Spring Oasis lies a sprawling area of\_coarse black sand. Most travelers give it a wide berth,\_for in broy rooms and caravanserais across the Tablelands,\_people speak in hushed tones of the evils of the\_Black Sands.</p>\n<p>According to rumors, the Black Sands region was created by defiling magic that predated the rise of the\_city-states and their rulers. Supposedly, an ancient\_ruined city, haunted by hateful ghosts of a past age,\_lies at the center of the Sands, and any who enter its\_crumbled walls are doomed to join the undead spirits. Actually, a ravaged city does sit at the heart of the\_Black Sands, although it does not predate the sorcererkings.\_</p>\n<p>In addition, the legendary Black Sands Raiders\_are far more dangerous than any undead that might\_haunt the devastated city. These bloodthirsty maraud\_ers camp in the shadow of the ruins, riding out in all\_directions to plunder villages and raid caravans.</p>\n<p>\_</p>\n<p>ZEBURON, THE IRON RIDER</p>\n<p>Chief of the Black Sands Raiders, Zeburon leads the\_group’s attacks. He is a bloodthirsty marauder known\_for torturing any victims who fall into his hands; his savagery is legendary in a land where savagery is the norm.</p>\n<p>Zeburon conceals his face by wearing a full iron helm,\_etched with strange runes that mark it as the product\_of another age. Iron gauntlets cover his arms almost to\_the elbow, but apart from a breechcloth, cloak, and sandals, he wears no other adornments. Zeburon presents\_himself as an elemental force of slaughter—grim, terrible,\_and silent.</p>"
