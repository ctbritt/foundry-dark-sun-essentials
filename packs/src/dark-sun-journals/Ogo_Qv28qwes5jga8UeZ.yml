    text:
      format: 1
      content: "<p>The town of Ogo is home to a prosperous tribe of\_about four thousand halflings. At its heart stands a\_massive, ruined step-pyramid that has stood for as\_long as the town lorekeepers have recorded. A shrine\_at the base of the structure houses the Spirit Oracle,\_a female halfling druid\_ of unknown abilities who\_spends much of her time in deep communion with\_primal powers. Such is her reputation that even individuals from beyond the Forest Ridge seek out her\_far-seeing advice.\_The remainder of Ogo is composed of a scattering\_of stone and wooden buildings amid open-air plazas.</p>\n<p>The halflings here sometimes deal with outsiders\_and are less likely than other clans to grab visitors\_and tie them up for dinner. Every year, King Urga\_Zoltapl sends a levy of two hundred halfling warriors to King Hamanu in Urik in exchange for a shipment\_of obsidian weapons and\_ tools. The warriors who\_choose to return to Ogo after their stint in Urik have\_a more cosmopolitan view of the world, and since this\_arrangement has been ongoing for the past few years,\_hundreds of halflings in Ogo share this experience.</p>"
