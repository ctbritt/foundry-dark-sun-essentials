    text:
      format: 1
      content: "<p>One particular group of malcontents gather at the sacred site called Kazin's Chak'sas (Kazin's Heads).Located on a northern rise, this site features a series of stone edifices shaped like giant kreen heads. The zik-chil have ordered this location off limits to the general public and has created an elite guard force from to'ksa gladiators to protect it. This hasn't stopped the dissidents, who call themselves Kazin'tek (Kazin's pack). The Kazin'tek believe that the way of the empire has corrupted the\_kreen. It's time to return to a simpler way of life, like the\_one embraced by the nomadic thri-kreen.</p>"
