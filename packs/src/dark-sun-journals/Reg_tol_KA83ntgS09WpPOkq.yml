      content: "<p>\_</p>\n<p>“And High Lord Rhan did take shelter in Lordshome, meditating on his great journey.\_Only the contemplative solitude of the cliffs could aid him now.”</p>\n<p>—fragment of an ancient text</p>\n<hr />\n<p>The small village of Reg-tol, known as Lordshome, was once a community of the\_wealthy—a retreat where the rich and powerful could escape the rigors of life in\_Thamasku. Before that, it was the traditional dwelling place of the rhul-thaun high\_lord—a position not held for thousands of years. Since its founding, however, it has\_grown into a lively but respectable village. Eight hundred people live in Reg-tol, making\_it the smallest inhabited community of the cliffs, but it is still larger than the tiny camps\_that dot the cliff face.</p>\n<hr />\n<p>Important NPCs</p>\n<p>Dhar-ahan (haf/F4/T4): AC 8 (climber’s shield and Dex bonus); MV 6; hp 24; THAC0</p>\n<p>17; #AT 1; Dmg 1d6 (clawgrafts); SA x2 backstab; SZ S (3’); ML steady (12); AL NE;</p>\n<p>XP 420.</p>\n<p>S 12, D 15, C 13, I 16, W 12, Ch 11.</p>\n<p>Personality: devious, selfish</p>\n<p>Special Equipment: clawgrafts (5), climber’s shield, poison nodule, stealthboots.</p>\n<p>Thief Abilities: PP 75, OL 55, F/RT 10, MS 50, HS 65, DN 20, CW 70, RL 0.</p>\n<p>Dhar-ahan is a professional pickpocket, cutpurse, and burglar. If that were all, she\_would be just one of the many who tread on the dark side, and nothing more would\_need to be said. Dhar-ahan is different, however, for not long ago she uncovered a thri-kreen plot to use psionics to infiltrate and destroy the rhul-thaun. Worse, she agreed to\_help them in exchange for her life.\_</p>\n<p>Dhar-ahan has medium-length black hair, and dark, bloodshot eyes. She wears wildly\_flamboyant body paint, particularly on her face.</p>"
