    text:
      format: 1
      content: "<p>Frequency and Chance of Wilderness Encounters*</p>\n<p>\_</p>\n<p><img src=\"https://assets.forge-vtt.com/5eac9efca33919f9a1f3cea9/dragupload/uploaded/tiles/PXL_20221008_135346140.jpg\" width=\"604\" height=\"271\" /></p>\n<p>*This table should be used instead of Table 56 from the DUNGEON MASTERTM Guide (DMG). The instructions described there for use of Table 56 can be applied to the use of this table.</p>\n<p>\_</p>\n<p>MC: This refers to the terrain cost for overland movement in a given terrain. The movement costs should be used as described in the Time and Movement section of the DMG. These numbers are provided so that you may have the information at your finger tips.</p>\n<p>\_</p>\n<p>At Least 1: This is the percentage chance that at least one encounter will occur during a day spent in a specific terrain type. It is not meant to be used in play, but rather as a reference when designing your own terrain types.</p>\n<p>\_</p>\n<p>Encounter Chance: This lists the number or less that must be rolled on 1d10 for an encounter to occur.</p>\n<p>\_</p>\n<p>Note: Inland dust basins should be treated as silt for determining encounters. Creatures that cannot cross land, such as silt horrors, will not be found in the inland basins. The forest statistics should be applied to all wooded terrain in the Tablelands, including the Crescent Forest. The Forest Ridge stats should be used in that area and in any junglelike terrain only.</p>\n<p>\_</p>\n<p>Time of Day: If an x appears under a specific time of day, an encounter check should be made. This does not ensure an encounter, only that a check be made.</p>"
