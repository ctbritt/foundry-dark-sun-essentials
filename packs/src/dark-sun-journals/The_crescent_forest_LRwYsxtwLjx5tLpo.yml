      content: "<p>The Crescent Forest lies along the southern curve\_of the Stormclaw Mountains. This thickly forested\_expanse is the most fertile and well-watered area\_in the Ivory Triangle and perhaps in the entire Tyr\_Region (aside from the Forest Ridge). During the\_months of Sun Descending, rain in the Stormclaw\_Mountains waters the forest with runoff. During the\_dry season, deep springs scattered throughout the\_easterly foothills sustain the area. The forest is thickest in the south and center; it thins considerably in\_the north because of logging from Nibenay and the\_dry winds blowing through Bremil Pass.\_</p>\n<p>At one time, the Crescent Forest might have\_extended the entire length of the verdant belt, but no\_one can say for sure. The recent history of the forest\_has been shaped by the centuries-old rivalry between\_Nibenay and Gulg; the hunters of Gulg skirmish\_ frequently against Nibenay’s foresters. For now, the\_judagas of Gulg keep Nibenay’s lumber camps limited\_to the northern end of the forest, but the increasing\_scarcity ofwood in the Tyr Region—and the corresponding value of large logs—lures the woodcutters\_deeper into the forest.</p>\n<p>\_</p>\n<p>DRUIDS OF\_THE CRESCENT FOREST</p>\n<p>A loose organization of druids watches over the Crescent\_Forest, protecting the woods from logging, overhunting,\_and defiling. The Crescent Circle is made up of a dozen\_or so hermits, escaped slaves, and Gulgan outlaws. Most\_keep to themselves in the\_ deep recesses of the forest,\_but others spy on judaga hunting parties or try to drive\_Nibenese loggers back to their own city. The druids are\_allied with the handful of treants who guard the forest’s\_most sacred sites.</p>\n<p>The chief of the druids, a stern, gray-bearded Gulgan named Barazin, was once a nganga (templar) in the service of LaIali-Puy. In his younger years, Barazin enslaved and tormented primal spirits with his arcane magic, but he came to see through the Oba’s\_ lies about the forest spirits and abandoned GuIg to serve them instead.</p>"
