      content: "<p>The Forest Arena of Gulg</p><p>Located deep within the Crescent Forest, the arena at Gulg</p><p>is breathtaking to first-time spectators. Since Athasian</p><p>forests are so rare, the living, growing arenas are beyond the</p><p>imagination of most outsiders. To get to the arena, one must</p><p>travel for almost an hour deep into the forest. The structure</p><p>seems to rise from the forest floor of its own volition. The</p><p>arena structure is intertwined with trees and vines which</p><p>give it the appearance of harmony with its surroundings.</p><p>On gladiatorial days, visitors arrive at the arena via</p><p>\x93Lalali-Puy\x92s Opulent Ascension.\x94 The immaculate</p><p>grassy byway has been cut painstakingly through the forest,</p><p>and links the city to the forest arena. The walkway is</p><p>trimmed and accentuated with the most rare and exotic</p><p>flora and fauna to be found anywhere in the Crescent Forest.</p><p>The soft grass path leads to a great natural archway.</p><p>The archway is the only opening in the extensively cultivated</p><p>brambleweed fence that surrounds the arena.</p><p>The archway opens into the arena, which is partially</p><p>inset in the ground and surrounded by viewing stands rising</p><p>into the sky. Great deciduous trees and hardy vines</p><p>intertangle and interweave to support the structure. It is</p><p>truly a forest masterpiece.</p><p>Along the sides of the arena, four entrances are visible</p><p>amid the trees and vines. The doorways are framed by</p><p>massive wooden planks. Beyond the doors is a large corridor</p><p>20 feet high and 20 feet wide, extending almost completely</p><p>around the building. Spectators are free to sit</p><p>anywhere in the arena, save the templar and sorcerer</p><p>queen\x92s viewing space.</p><p>The Forest Arena of Gulg is unique. It is a long, narrow,</p><p>grassy oval 300 feet long and 80 feet wide. Over 40 rows of</p><p>wooden benches parallel the long, narrow sides of the arena.</p><p>The stadium floor itself lies in a pit 20 feet deep. The</p><p>arena\x92s grassy floor is studded with large trees throughout</p><p>the playing field. The random placement of the trees</p><p>allows gladiators to improvise when stalking opponents.</p><p>No tree or tree limb, however, is within 20 feet of the wall,</p><p>leaving no opportunity for a gladiator to escape from the</p><p>physical arena.</p><p>Vines and mosses grow throughout the trees, enabling</p><p>combatants to climb the trees, swing from tree to tree, or</p><p>use the natural materials to their advantage. Not all of the</p><p>trees are \x93friendly\x94\x97 one is an ancient bramble tree covered</p><p>in myriad sharp thorns. In one legendary combat, an</p><p>incredibly strong arena champion actually removed a</p><p>limb of the tree and used it to his advantage in combat.</p><p>Some of the trees in the arena bear red leaves year</p><p>round. Legend says the blood of the slain gladiators waters</p><p>the trees in arena, yielding the red leaves.</p><p>Malicious destruction of the grass or trees through physical</p><p>combat or defiler magic draws immediate boos and</p><p>hisses from the crowd. If a gladiator who uses such tactics</p><p>survives, he is beaten or tortured before being allowed to</p><p>return to the arena. On a subsequent trip to the arena, such</p><p>offenders are a most certainly pitted against a superior</p><p>opponent. This is punishment for the purposeful destruction</p><p>of the arena during previous gladiatorial combat.</p><p>Arena combat begins when two gladiators or gladiatorial</p><p>teams enter from opposite ends of the arena. Some</p><p>gladiators or teams quickly rush their opponents, while</p><p>others take a defensive posture in the rich foliage. Wilier</p><p>combatants prefer a hide-and-seek approach, using the</p><p>terrain to advantage. They involve the crowd by taunting</p><p>the opponent or a show of bravado, lest the crowd think</p><p>the combatants are cowards and turn against them. The</p><p>crowd in Gulg hates cowardly gladiators who attempt to</p><p>hide in the greenery of the arena.</p><p>The arena grounds are maintained by over 50 slaves</p><p>who toil daily to keep the arena ready for the next games.</p><p>Failure to do one\x92s best is rewarded by appointment as</p><p>quarry for the Red Hunt.</p><p>Alush, green place that thousands may visit is a very rare</p><p>occurrence on the world of Athas. The people of Gulg love</p><p>things that grow, and the Sorcerer-queen tacitly endorses it.</p><p>The more that people work to help the forest around Gulg</p><p>grow, the greater her base for raw power becomes.</p>"
