      content: |-
        <p>The Bandit States</p>
        <p>A particularly rugged type of raider has developed in</p>
        <p>the harsh environment of the Barrier Wastes, though some</p>
        <p>attribute this ruggedness to the fact that the constant wind</p>
        <p>that blows across the region drives them insane. Seven</p>
        <p>separate raiding tribes control five permanent oases in the</p>
        <p>Glowing Desert and two in the Scorpion Plains. A village</p>
        <p>has grown up around each oasis, and these have become</p>
        <p>the basis for the seven Bandit States.</p>
        <p>Each of these seven communities is an independent</p>
        <p>entity, though they've come to be known collectively as</p>
        <p>the Bandit States. The large villages are populated by</p>
        <p>outlaws, ex-slaves, and other outcasts who've found a place</p>
        <p>with the charismatic and powerful men and women who</p>
        <p>lead each tribe. These tribes exist in a near-constant state</p>
        <p>of war, fighting each other for territory, to gain prestige, or</p>
        <p>just for the thrill of battle.</p>
        <p>When not fighting each other, the Bandit States engage</p>
        <p>in raids against caravans plying the nearby trade routes</p>
        <p>or the settlements scattered throughout the region. Using</p>
        <p>fast riding beasts and unique sail carts, the tribes sweep</p>
        <p>down out of the wastes to strike quickly, plunder what</p>
        <p>they can, and escape back the way they came. It doesn't</p>
        <p>matter which tribe travelers encounter, as each has a</p>
        <p>similar approach to the business of raiding – strike like</p>
        <p>the wind, take what you want by force and fear, intimidate</p>
        <p>every victim so that the next time will be easier, commit</p>
        <p>as much violence as it takes to accomplish the raid, and</p>
        <p>satisfy the blood lust that courses through every raider's</p>
        <p>veins.</p>
        <p>There are seven villages that each serve as the capital</p>
        <p>of a different Bandit State. These villages are Pillage,</p>
        <p>Plunder, Ravish, Ravage, Kel's Lot, Wrath, and Spoil.</p>
