name: The City of Tyr
_id: qQNVfKzrnO8DfKxr
pages:
  - sort: 100000
    name: A Traveller's Guide to Tyr
    type: text
    _id: FuW4Nir12Q55SWKx
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p><em><img src=\"https://s3.us-east-1.amazonaws.com/rime-of-the-frostmaiden/images/dark-sun/tyr-sketch.png\" alt=\"\" width=\"823\" height=\"547\" /></em></p>\n<p><em>As it stands one year after the death of Sorcerer-King Kalak</em></p>\n<h2>Approaching the City</h2>\n<p>Travellers approaching Tyr pass through verdant plantation-lands where crops receive more water than the unnumbered slaves who tend them. These fortress plantations belong to the city's nobles and garner great wealth by providing nearly all of Tyr's food. Standing armies fiercely guard each plot of land and will greet trespassers with force more often than not. Strangers are not advised to approach the estates of Tyrian nobles uninvited.</p>\n<p>Outside Tyr's Caravan Gate, there is usually an impromptu market (sometimes elven) and a cluster of makeshift shrines (usually to elemental fire). The Stadium Gate rarely enjoys any such activity, and the Golden Gate is closed to normal traffic.</p>\n<h2>The City Gates</h2>\n<p>Tyr has three gates. Its busiest gate is the Caravan Gate, leading onto Caravan Way. This gate receives the majority of Tyr's traffic and is made from enormous slabs of agafari wood, bound with iron. Manned by half-giant guards and templar overseers, the gate's traffic is heavily scrutinized, leading to frequent queues and a host of attendant businesses. Food vendors, shrines, and stalls cluster around the approach to the Caravan Gate, making an entrance to Tyr an experience in itself.</p>\n<p>The Stadium Gate is for merchants with the correct permits who do business with traders in the nearby Artisan's District. Its main use, however, is to move creatures and gladiators to and from Tyr's arena with a minimum of fuss. It is also used by those seeking a discreet entry or exit to the city—assuming they have the ceramics to ease the passage.</p>\n<p>The Golden Gate leads directly to Tyr's Golden City and is closed to normal traffic. A stone block bearing the visage of a fearsome beast is normally dragged across the gate by half-giants, sealing it shut.</p>\n<h2>Where to Stay</h2>\n<p>Tyr's inns and boarding houses vary wildly in quality and price. Some may be able to find lodging with allied noble families or merchant houses. Others may lodge with members of their race. For those with no other option, there are always the Warrens and the hope that an abandoned ruin can be found—and kept.</p>\n<p><strong>The Golden Inix Inn</strong>\_on Caravan Way offers good accommodation and food at reasonable prices. The proprietor, Mila Risani, is a powerful psionicist and keeps her customers in line with her mastery of the Way.</p>\n<p>For those who want the finest, and can afford it, there is the\_ <strong>Sweetwater Inn</strong>. Located in the Nobles' District, the inn caters to visiting nobles and senior traders with gold in their pockets.</p>\n<p>At the other end of the spectrum is the\_<strong>Drunken Giant</strong>\_on Shadow Square. A wineshop and inn, the Drunken Giant is rumored to have ties with Tyr's Veiled Alliance.</p>\n<h2>Where to Board Your Mount</h2>\n<p>Some inns have stabling facilities, but it is not unusual for large beasts to be refused entry to the city entirely. For those who gain access, Tyr's most famous stable is the\_<strong>Messenger's Mount</strong>, just inside Caravan Gate.</p>\n<h2>Where to Find Something to Eat</h2>\n<p>Tyr has a broad range of eateries, from the stalls on Caravan Way to high-class venues offering some of the finest dining experiences in the Tablelands. Meat is the staple of the Tyrian diet—baazrag, erdlu, kip, and z'tal skewers served with unleavened bread is daily fare. Shadow Square and Artisan's Way offer low-cost food, while the well-patrolled streets of the Nobles' Districts to either side of Caravan Way sport more refined offerings.</p>\n<h2>Where to Shop</h2>\n<p>The main trade hub in Tyr is\_<strong>Iron Square</strong>, where Caravan Way meets the base of the ziggurat. Here the great merchant houses have their fortified emporiums.\_<strong>Artisan's Way</strong>, near the Stadium Gate, also has an excellent selection of shops and businesses. The\_ <strong>elven market</strong>, located near Tyr's Elven Bridge, caters to shadier customers, and the legendary\_<strong>Night Trader's Way</strong>\_in UnderTyr is purported to offer goods unknown to even the sorcerer-kings.</p>\n<h2>Where to Buy Spell Components</h2>\n<p>At the northern edge of the Warrens, where the slum is bordered by the city's dried Elven River, lies the city's\_<strong>elven market</strong>. The river bed, bridge, and surrounding streets are home to a sprawling market manned by whichever elven tribe is visiting Tyr at the time. Here, careful buyers can find most of what they need for the arcane arts. For rare or dangerous components,\_<strong>Night Trader's Way</strong>\_in UnderTyr is a better place to look.</p>\n<h2>Where to Buy Poisons</h2>\n<p>South of the elven market, just behind Shadow Square, is Tyr's\_ <strong>bards' quarter</strong>. Establishments such as the\_ <strong>House of Fingers</strong>\_or the\_<strong>Hungry, Hungry Halfling</strong>\_offer discretion and danger in equal amounts. Tyr has several powerful bard cliques, all of which are happy to offer their services to the discerning buyer.</p>\n<h2>Where to Find Work</h2>\n<p>As in most other cities in the Tablelands, merchant and noble houses are frequent employers of mercenaries and those happy to get their hands dirty—or bloody. With Kalak's recent death, work opportunities have become both more plentiful and more dangerous. The abandoned ziggurat construction has left many skilled workers unemployed, while the political upheaval has created demand for guards, spies, and enforcers. The city's remaining templars sometimes seek assistance with various schemes to maintain their relevance. And there are always those looking for adventurers willing to brave the perils of UnderTyr in return for sizeable rewards... or a horrific fate in the dark below the streets.</p>\n<h2>Where to Find Healing</h2>\n<p>Tyr's few shrines all offer healing services to travellers, and favored noble families can sometimes call on the assistance of the city's templars. Others with the right connections (or coin) seek psionic healing at the\_ <strong>School of Thought</strong>, while the less well-off are forced to pay for poultices and bandages at the markets or one of the city's poorly stocked apothecaries.</p>\n<h2>Where to Train</h2>\n<p>For warriors, the best source of training remains the gladiatorial stables of the noble families. Tyr's arena is particularly active and there are frequent games staged there. Merchant houses also offer training, often in return for a season of service instead of payment in coin.</p>\n<p>Clerics and druids will find it harder to locate training. For clerics, there are a few elemental shrines that may be amenable, but druids would be better served by visiting the foothills of the\_<strong>Ringing Mountains</strong>, where others of their kind watch over the passes that lead to the\_ <strong>Forest Ridge</strong>.</p>\n<p>Wizards find it no easier in Tyr than anywhere else in the Tablelands to find teachers, though some say this may be changing. The\_<strong>Veiled Alliance</strong>\_is rumored to have become more active since Kalak's death, with whispers that they may even have a base deep in the Warrens. However, they remain extremely secretive and are said to kill any who go looking for them uninvited.</p>\n<p>Psionicists seeking instruction are best served at the city's famous\_ <strong>School of Thought</strong>. This psionic academy lies in the\_ <strong>Golden City</strong>, so prospective students need the right contacts to attend.</p>\n<h2>UnderTyr</h2>\n<p>Tyr is ancient, and has been razed and rebuilt many times. Each generation has added fresh layers to the debris, so that now Tyr sits atop a labyrinth of forgotten vaults, sunken cellars, buried amphitheatres, dried rivers, petrified forests, and more. Much wealth is said to lie waiting beneath Tyr.</p>\n<p><strong>UnderTyr</strong>\_sprawls beneath the city like a lethal honeycomb. There are even stories of hidden access routes to the\_ <strong>Golden City</strong>\_and the former ruler's inner sanctum, rumors that have taken on new urgency since Kalak's death. With the city's attention focused on political upheaval above ground, some say UnderTyr has become more active—and more dangerous. Entrances to UnderTyr are scattered across the city, some better known than others. But not a year goes by without someone discovering a sub-basement beneath their home or business with hatches and tunnels that lead into the labyrinth below.</p>\n<h2>Dealing with Officials</h2>\n<p>Tyr's templars are in complete disarray just one year after Kalak's shocking death. Cut off from their divine source of power and struggling to maintain legitimacy, the former priest-bureaucrats fight desperately among themselves for what scraps of authority remain. Some have reinvented themselves as secular administrators, others have fled the city entirely, and a few cling to the hope that another sorcerer-king might emerge to restore their status. The careful visitor can exploit this chaos, but should be extremely wary—desperate templars are unpredictable and often more dangerous than confident ones.</p>\n<p>Tyr's nobles are moving aggressively to seize control of the power vacuum, but their ascendancy is far from secure. Different noble houses scheme against each other while simultaneously trying to establish legitimacy with the common people who remember their role in Kalak's oppression. The political situation changes almost daily, and today's ally could be tomorrow's enemy. Currying favor with a noble family can provide significant advantages, but visitors should be prepared for sudden reversals of fortune as the new order is still very much in flux.</p>"
