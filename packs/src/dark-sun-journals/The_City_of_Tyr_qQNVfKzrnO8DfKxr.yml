  - sort: 200000
    name: Tyr, The Free City
    type: text
    _id: 3xt1ZGCh04nUakel
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <div class="fvtt narrative"><p>“Is it true? Kalak dead? Slaves freed?
        Magic wild in the streets? Doubtful, but we’ll know soon enough.”</p><p
        style="text-align:right">—Shahin, wandering hermit</p></div><p>As far as
        most Athasians are concerned, <strong>Tyr has always existed</strong>.
        Certainly it has endured through the entire Desert Age, and even with
        the fall of its sorcerer-king, it seems likely to endure for centuries
        to come. And throughout all the long years of its existence, it was a
        city-state enslaved.</p><p>That has all changed.</p><p>In the courts of
        the other city-states, rumors of King Kalak’s overthrow are only
        whispered, but in Tyr, the repercussions howl through the streets. Many
        scheme to succeed Kalak, and the templars and other power groups vying
        for control struggle to keep the city-state from disintegrating into
        anarchy at the hands of people eager to enjoy their freedom. Nobles and
        merchants clamor for influence, and commoners and freed slaves openly
        celebrate, challenging civic authority and social boundaries at every
        turn.</p><h2>Tyr’s Power Structure</h2><p>Tithian, the former high
        templar, is now recognized as King of Tyr. However, his throne is far
        from secure. King Tithian holds his crown at the sufferance of the other
        templars and the heads of powerful groups who wield great influence but
        are not yet strong enough to overthrow him.</p><h3>The Power
        Groups</h3><p>In Tyr, a number of groups fight for power in the wake of
        Kalak’s death. Fortunately for Tithian and the other templars, no single
        group has managed to consolidate its influence enough to challenge the
        new king’s rule. Members of these factions meet frequently, sometimes in
        large gatherings, to make decisions and forge treaties that affect the
        balance of power in the city-state. Factions that have great influence
        in Tyr include:</p><ul><li><p><strong>Deposers of Kalak:</strong> The
        rebels who challenged and defeated Kalak are highly regarded by most
        citizens. In addition to Tithian, the deposers include Rikus (a mul
        ex-gladiator who leads the Crimson Legion), Sadira (a half-elf ex-slave
        and secret Veiled Alliance member), Agis of Asticles (a high-ranking
        noble and practitioner of the Way), and Neeva (another
        ex-gladiator).</p></li><li><p><strong>The Freed:</strong> Former slaves
        make up a large portion of Tyr’s population. Although they are poor and
        largely uneducated, their sheer numbers give them considerable power.
        Their leaders include Shivrin (a half-elf from the Warrens, rumored to
        have ties to the Toothcutters gang) and Non (a mul from the fields known
        as an eloquent speaker and former favored
        gladiator).</p></li><li><p><strong>Commoners:</strong> Many
        revolutionaries were common folk of Tyr. Influential commoners include
        Rowan (a half-elf innkeeper) and Xalos (a mul stonecutter who secretly
        spies for Urik).</p></li><li><p><strong>House Merchants:</strong>
        Merchant house representatives wield power and influence. Dominant
        merchants include Davith Vordon of House Vordon (major interests: iron
        mines, slave trade beyond Tyr) and Belana Wavir of House Wavir (based in
        Balic).</p></li><li><p><strong>Templars:</strong> Tehosian, the Minister
        of Laws, is responsible for a new system of justice. Mashastra, the
        Minister of Defense, organizes the army and
        defenses.</p></li><li><p><strong>Nobles:</strong> Shoshana Beryl,
        matriarch of Beryl Manor, pushes for government run by a senate of
        nobles. Murter Dyan, part owner of Tyr’s iron mines, secretly belongs to
        the True—a group hoping for Kalak’s return.</p></li></ul><hr /><h2>Tyr
        at a Glance</h2><ul><li><p><strong>Population:</strong> Roughly 15,000
        within city walls, and about as many in noble estates and villages of
        Tyr Valley. Humans are the majority (two-thirds), with dwarves, elves,
        goliaths, and muls making up most of the
        rest.</p></li><li><p><strong>Water:</strong> Seventeen public wells tap
        one of the deepest aquifers on Athas, protected by Tyrian Guard
        detachments. Each citizen is entitled to one hand-carried container of
        water daily by law.</p></li><li><p><strong>Supplies:</strong> Available
        in the Caravan and Merchant Districts, and the Elven Market in the
        Warrens. A bazaar often springs up near the Stadium of
        Tyr.</p></li><li><p><strong>Defense:</strong> Most of the army disbanded
        after Kalak fell. Templars are rebuilding it as the Tyrian Guard—an
        uneasy mix of former Kalak soldiers, noble house contingents,
        revolutionaries, freed gladiators, and slaves, totaling about 5,000
        warriors. Marshal Zalcor, a mul ex-mercenary, leads them. Noble and
        merchant houses maintain private soldiers.</p></li><li><p><strong>Inns
        and Taverns:</strong> More than 30 inns and equal taverns in Caravan and
        Merchant Districts. The Warrens offer poorer, squalid spaces including
        squatters’ buildings.</p></li></ul><hr /><h2>Exploring Tyr</h2><p>Tyr
        hunkers within high walls in the fertile Tyr Valley, foothills of the
        Ringing Mountains. Massive spires of the Golden Tower and the brick
        Ziggurat of Kalak soar above city walls. City walls are sandstone,
        smoothed and repaired over centuries.</p><ul><li><p><strong>Caravan
        Gate:</strong> Massive marble gates banded in iron lead to Caravan
        Way—the main trade route through Caravan District toward Merchant
        District and Noble Districts.</p></li><li><p><strong>The
        Warrens:</strong> Poor slums north of Ziggurat. Home to freed slaves,
        criminals, and dangerous monsters.</p></li><li><p><strong>Artisan
        District:</strong> North of Ziggurat, next to Warrens, home to freed
        slaves turned craftsfolk and artisans.</p></li><li><p><strong>Smiths’
        District:</strong> Trade district focused on heavy industry and
        workshops.</p></li><li><p><strong>Merchant District:</strong> Heart of
        trade, lined with emporiums of powerful merchant houses such as House
        Vordon and House Wavir.</p></li><li><p><strong>Noble District:</strong>
        Lavish stone residences of nobles, merchants, and templars. Includes
        King’s Gardens and the Templar District.</p></li><li><p><strong>Golden
        City:</strong> Reserved for King Kalak and top administrators. Houses
        Golden Tower and the King’s
        Gardens.</p></li><li><p><strong>Under-Tyr:</strong> Ancient catacombs
        and ruins beneath the city, home to traps, undead, criminals, and
        secrets.</p></li></ul><hr /><h2>Notable Locations in Tyr</h2><h3>Caravan
        District (Primary trade and visitor
        district)</h3><ul><li><strong>Devyn’s Desertwear:</strong> Gear for
        desert survival; Devyn is a Veiled Alliance
        contact.</li><li><strong>Grik’s Weaponry:</strong> Erdlu-claw daggers,
        obsidian javelins, limited iron weapons.</li><li><strong>Golden
        Mix:</strong> Inn and tavern with meals and drinks; Rowan the half-elf
        proprietor.</li><li><strong>Ezar’s Storehouse:</strong> Haunted
        warehouse with secret passages into Under-Tyr.</li></ul><h3>Artisan
        District (Home to freed slaves as artisans)</h3><ul><li><strong>Karlen’s
        Eye:</strong> Collectibles from Under-Tyr.</li><li><strong>Wayward
        Trader:</strong> Quiet tavern.</li><li><strong>Stone and
        Mortar:</strong> Stone supply business owned by Xalos, a mul and secret
        spy.</li><li><strong>Sculptors’ Square:</strong> Art studios in
        renovated manors.</li><li><strong>Door of Drakes:</strong> Mysterious
        sealed tomb that swallows explorers.</li></ul><h3>Smiths’ District
        (Heavy industry zone)</h3><ul><li><strong>Brickyards:</strong> Former
        slave labor site, now paid laborers; site of
        protests.</li><li><strong>Slave Pits:</strong> Repurposed training
        grounds for gladiators.</li><li><strong>Rarvin’s Wagonworks:</strong>
        Wagon and chariot manufacture.</li><li><strong>Tarnished Cup:</strong>
        Shop selling used goods and poisons; owner Gavan Sul is a tiefling fence
        for Iron Rats gang.</li><li><strong>Brick Barrow:</strong> Burial site
        of dead slaves under Brickyards, rumored to echo haunting
        cries.</li></ul><h3>Merchant District (Houses emporiums of major
        merchant houses)</h3><ul><li><strong>House Vordon:</strong> Iron trade,
        weapons, art, textiles.</li><li><strong>House Wavir:</strong> Grain,
        ceramics, precious metals.</li><li><strong>House Shorn:</strong>
        Obsidian, water, weapons.</li><li><strong>House Tsalaxa:</strong>
        Blackmail and espionage specialists.</li><li><strong>House
        Stel:</strong> Militaristic, slave traders outside
        Tyr.</li><li><strong>House M’ke:</strong> Protects trade
        routes.</li><li><strong>House Ianto:</strong> Former slave traders, now
        speculating in goods.</li></ul><h3>Noble District (Divided north and
        south by Caravan District)</h3><ul><li>Lavish homes, shops with
        perfumes, music, and enchanted goods.</li><li><strong>King’s
        Gardens:</strong> Rare trees and lush greenery maintained by
        gardeners.</li><li><strong>Templar District:</strong> Mansions of
        high-ranking templars and warehouses with grain, iron, water,
        weapons.</li><li><strong>Golden Tower:</strong> Golden granite edifice
        housing King’s council and ancient elementals bound by defiling
        magic.</li></ul><h3>The Warrens (Slum area home to freed slaves and
        gangs)</h3><ul><li><p>Gangs
        include:</p><ul><li><strong>Toothcutters:</strong> Elven gang
        controlling much of Warrens.</li><li><strong>Iron Rats:</strong> Thieves
        and cutpurses.</li><li><strong>Ruincreepers:</strong> Displaced
        halflings living ferally.</li></ul></li></ul><h3>Stadium of
        Tyr</h3><ul><li>Between Golden City and Kalak’s
        Ziggurat.</li><li>Gladiatorial arena with cells, mazes
        below.</li><li>Games held 10 days per month, death fights less common
        now but still held.</li><li>On non-game days, serves as a chaotic market
        for ex-slaves and traders.</li></ul><h3>Ziggurat of
        Kalak</h3><ul><li>Multicolored brick pyramid built by Kalak to siphon
        life energy.</li><li>Sealed by King Tithian’s stone
        block.</li><li>Guarded by Tyrian Guard.</li><li>Interior is a maze with
        arcane glyphs and defiling apparatus.</li><li>A Veiled Alliance strike
        force once penetrated but did not disturb artifacts.</li><li>Some
        factions want to explore and discover Kalak’s fate.</li><li>The True, a
        secret society, wishes to return Kalak or heir.</li></ul><hr /><h2>Tyr’s
        Code of Justice</h2><ul><li>Under Kalak, justice was arbitrary and
        cruel.</li><li>King Tithian charges templar Tehosian to create a new
        legal system.</li><li>Presumes innocence until proven guilty by a jury
        of unbiased judges.</li><li>So far, judgments rely mostly on templars,
        nobles, and Tyrian Guard.</li><li>Minor crimes fined, serious crimes
        punished by exile or slavery.</li><li>Heinous crimes result in execution
        in the Stadium of Tyr.</li></ul><hr /><h2>Meeting with the
        Templars</h2><ul><li>Citizens do not usually meet the king or templar
        council directly.</li><li>Individuals can be invited as guests if they
        have proven useful.</li><li><p>Possible templar missions for player
        characters:</p><ul><li>Spying on ruins, trade outposts, or
        city-states.</li><li>Infiltrating secret societies.</li><li>Mapping
        Under-Tyr.</li><li>Eradicating the True.</li><li>Exposing rogue Veiled
        Alliance factions.</li><li>Investigating illicit
        slaving.</li><li>Accompanying an embassy to the Forest
        Ridge.</li></ul></li></ul><hr /><h2>Under-Tyr</h2><ul><li>Ancient
        subterranean ruins beneath Tyr.</li><li>Layers of old streets,
        catacombs, shrines, and traps.</li><li>Home to undead, criminals, and
        dangerous magic.</li><li><p>Major regions
        include:</p><ul><li><strong>The Sorrows:</strong> Rubble-filled maze
        with haunted structures.</li><li><strong>Elven River:</strong> Network
        of tunnels inhabited by id fiends.</li><li><strong>Belly of the
        Noble:</strong> Dangerous vaults beneath Noble
        District.</li><li><strong>Tembo’s Teeth:</strong> Cavern complex with
        stalagmites and yuan-ti presence.</li><li><strong>The Crawl:</strong>
        Crushed remains of old trade districts.</li><li><strong>Road of
        Crypts:</strong> Catacombs of nobles, with traps and
        undead.</li><li><strong>Night Dragon Way:</strong> Collapsed tunnel with
        dragon carvings and statue ruins.</li></ul></li></ul><hr /><h2>Fountain
        of Leaves (Under-Tyr)</h2><ul><li>Dry fountain with a split statue of
        Kalak.</li><li>Magic vines and luminescent leaves grow
        here.</li><li>Produces a red fruit that temporarily boosts psionic
        ability.</li><li>The fruit causes prophetic nightmares as a side
        effect.</li></ul>
