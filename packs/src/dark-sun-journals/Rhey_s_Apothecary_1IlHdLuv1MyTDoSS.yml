        <p>Rhey Khal, Proprietor</p><p>Items for sale include medicinal herbs,
        water pipes, scented candles and oils, incense, and musical instruments.
        Rhey Khal, a middle-aged male human, is rumored to dabble in magic and
        deal with enchanted items. He responds to most inquiries about such
        interests with self-deprecating humor.</p><p><strong>Services &amp;
        Inventory:</strong></p><ul><li><p>Medicinal Herbs: Healing plants and
        therapeutic remedies</p></li><li><p>Smoking Supplies: Water pipes and
        exotic tobacco blends</p></li><li><p>Aromatherapy Items: Scented
        candles, essential oils, and incense</p></li><li><p>Musical Instruments:
        Small percussion and wind instruments</p></li></ul>
