        wgCeShTrqHJFBbDr:
          notes: "<div class=\"font-claude-message  relative  leading-[1.65rem]  [&_pre>div]:bg-bg-000/50  [&_pre>div]:border-0.5  [&_pre>div]:border-border-400  [&_.ignore-pre-bg>div]:bg-transparent  [&>div>div>:is(p,blockquote,h1,h2,h3,h4,h5,h6)]:pl-2  [&>div>div>:is(p,blockquote,ul,ol,h1,h2,h3,h4,h5,h6)]:pr-8\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0); font-style: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: auto; text-align: start; text-indent: 0px; text-transform: none; white-space: normal; widows: auto; word-spacing: 0px; -webkit-text-stroke-width: 0px; text-decoration: none;\"><div><div class=\"grid-cols-1 grid gap-2.5 [&_>_*]:min-w-0\"><p class=\"whitespace-normal break-words\"><strong>Proprietor Details:</strong></p><ul class=\"[&:not(:last-child)_ul]:pb-1 [&:not(:last-child)_ol]:pb-1 list-disc space-y-1.5 pl-7\"><li class=\"whitespace-normal break-words\"><strong>Rhey Khal</strong><span class=\"Apple-converted-space\">\_</span>(Middle-aged Human Male): Friendly but cautious about magical dealings</li><li class=\"whitespace-normal break-words\"><strong>Magical Knowledge</strong>: Rumored to practice minor enchantments and potion-making</li><li class=\"whitespace-normal break-words\"><strong>Deflection Tactics</strong>: Uses self-deprecating humor to avoid direct questions about magic</li><li class=\"whitespace-normal break-words\"><strong>Discrete Service</strong>: Will discuss enchanted items only with established customers</li></ul><p class=\"whitespace-normal break-words\"><strong>Shop Atmosphere:</strong></p><ul class=\"[&:not(:last-child)_ul]:pb-1 [&:not(:last-child)_ol]:pb-1 list-disc space-y-1.5 pl-7\"><li class=\"whitespace-normal break-words\"><strong>Aromatic Interior</strong>: Pleasant mix of herbs, oils, and incense</li><li class=\"whitespace-normal break-words\"><strong>Organized Shelves</strong>: Well-maintained inventory with clear labeling</li><li class=\"whitespace-normal break-words\"><strong>Relaxed Ambiance</strong>: Comfortable environment encouraging browsing</li></ul><p class=\"whitespace-normal break-words\"><strong>Role in Adventures</strong>: Rhey's Apothecary serves as a legitimate front for minor magical services in Tyr. Characters seeking healing supplies, alchemical components, or discreet enchanted items can find what they need here. Rhey's cautious approach to magic makes him a safer contact than more obvious spellcasters, though his humor-based deflection means earning his trust takes time. The shop's respectable facade makes it an ideal meeting place for those who prefer to avoid shadier establishments.</p></div></div></div>"
        lastrolltable: RollTable.FsW3RjVlJd4wi4NY
