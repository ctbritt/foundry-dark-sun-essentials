    text:
      format: 1
      content: "<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;padding-left:0px\">“The great Ziggurat towered above the squalor of the sunbaked city. Each level of the terraced pyramid was finished in glazed brick of a different color: gleaming violet at the base, then indigo, azure, green, yellow, fiery orange, and finally, scarlet.”<br style=\"box-sizing:border-box\" />A chronicler of Athas</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">Kalak built his ziggurat to siphon the life force of the people of Tyr and use it to transform himself into a being as mighty as the Dragon. He failed, but the ziggurat remains as a prominent reminder of the evils of defiling and the folly of placing ultimate power in a sorcerer-king.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">The only obvious entrance is located atop the great stair, which opens into a small antechamber lined with obsidian as black as Kalak’s heart. A massive block of stone scribed with the emblem of King Tithian now seals the entrance into the body of the ziggurat. In addition, a squad of the Tyrian Guard is always on duty here, making certain that no one tries to gain entry without permission of the templars. What lies inside the ziggurat? At the very least, the structure contains the defiling apparatus that Kalak created to drain the life force of Tyr’s citizens. According to the only group that managed to penetrate the ziggurat and come out alive—a strike force sponsored by the Veiled Alliance—the interior is a maze of stairs, tunnels, and obsidian brick-lined chambers on which arcane glyphs pulse. Artifacts, relics, and tomes were noted but left in place for fear of disturbing further evil. The strike force hunted for Kalak, who had fled into the ziggurat after receiving a seemingly mortal wound from the gladiator Rikus in the stadium. It was widely reported that the strike force recovered his corpse, but in truth, Kalak’s body was never found.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">Recently, the noble Murter Dyan has argued that another group should enter the ziggurat to learn more of Kalak’s secrets and discover what became of his body. However, most of the city-state’s leaders believe that the place is better left undisturbed. A few of the factions vying for power in Tyr want to break the seals on the ziggurat and explore the place from tip to cellar. No group is so eager as the True, a secret society that wishes to return Kalak or an heir to the throne. If King Tithian decides to send another team into the ziggurat, the True’s agent among the nobility— Murter Dyan—intends to accompany the group so he can spy on what is discovered and advance the True’s schemes.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">\_</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px\">\_</p>"
