    text:
      format: 1
      content: "<p>At the eastern end of the Great Ivory Plain lies a\_bleak region known to nearby nomads as the Beastbarrens.\_Few\_ people have reason to come this way,\_and those who do rarely linger long before retreating, for the Beastbarrens is a cursed land. Here, an\_unknown, baleful power warps desert predators\_into freakish monstrosities; they sprout extra limbs,\_their hands\_ or paws grow into daggerlike claws, scaly\_armor covers their skin, and worse. New terrors\_wander out of the Beastbarrens every few days or\_weeks to fall on caravans and outposts in\_ the eastern\_reaches of the Ivory Triangle.</p>"
