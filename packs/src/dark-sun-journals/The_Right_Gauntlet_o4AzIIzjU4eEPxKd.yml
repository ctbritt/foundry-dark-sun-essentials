      content: "<p>The steep southern mountains of the Right Gaunt\_let have proved hardier, forming a barrier against the\_Sea of Silt and\_ preventing its encroachment inland.</p>\n<p>Many old gypsum quarries that provided alabaster for the statues and facades of Raam dot their lower slopes. Tribes of\_ hejkins and troglodytes have all but driven out Raam’s stonecutters.</p>"
