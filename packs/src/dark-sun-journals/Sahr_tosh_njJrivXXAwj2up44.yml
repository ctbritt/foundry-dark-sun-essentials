      content: "<p>\_</p>\n<p>“You can go to Sahr-tosh, if the wind will take you there.”</p>\n<p>—a line from the play Stormriders</p>\n<p>Known as the city of storms, bitter winds and inclement weather often besiege this village.</p>\n<p>The reason for the savagery of the storms here is simply that this is the most exposed ledge</p>\n<p>settlement of the rhul-thaun. Nevertheless, storms are more frequent in this part of the cliffs,</p>\n<p>and Sahr-tosh was built in an unfortunate location. The population remains steadfast despite</p>\n<p>the danger, however, and approximately 2,000 halflings make their homes in Sahr-tosh.</p>\n<p>Because of an odd effect of Rajaat’s Curse from the swamp below, the mist near Sahrtosh</p>\n<p>often takes on a rainbow cast. Colors cascade, pulsing and scintillating for hours at</p>\n<p>a time, day or night, in patternless, random intervals.</p>\n<p>Rel-anir (haf/F10/LE) is the city’s administrator and chief life-shaper. In Sahr-tosh more</p>\n<p>than anywhere else, the shapers are in complete control. With Rel-anir as their superior,</p>\n<p>they wield absolute economic and political power.</p>\n<p>Sahr-tosh is a rough and rugged community, with few places of luxury or comfort.</p>\n<p>Most of the people are common folk, working hard to make a life for themselves on this</p>\n<p>61</p>\n<p>ledge. Many of the inhabitants are tenders, caring for the creations of the many lifeshapers</p>\n<p>who work in this village.</p>\n<p>Pterrans dwell dangerously close to Sahr-tosh, and villagers require protection as do</p>\n<p>windriders, climbers, and travelers. Therefore, many of its citizens follow the warrior</p>\n<p>trade. Mercenaries are easy to find here, as well as other, less savory freelancers—many</p>\n<p>of them seeking less than reputable employment.</p>\n<p>The pterrans have never assaulted the village itself, and most likely will not. They</p>\n<p>occasionally attempt to isolate climbers and attack them or swoop down on windriders,</p>\n<p>striking from the backs of their pterrax mounts. In similar fashion, patrols of climbing</p>\n<p>and windriding rhul-thaun warriors—vher-elus under the command of the life-shapers—</p>\n<p>hunt pterrax that stray near the village.</p>\n<p>The life-shapers, as a group, harbor a particular hatred for other intelligent races.</p>\n<p>While this is an inherent contradiction of the philosophy that “all life is sacred,” raising</p>\n<p>this question in Sahr-tosh is unwise. Expressing anti-shaper sentiments is not a crime, as</p>\n<p>such, but those who do are usually punished nonetheless.</p>\n<p>Places of Note</p>\n<p>Sanctuary of Sahr-tosh: This sanctuary is disproportionately large for the community in</p>\n<p>which it finds itself. Because they are in total political control of the village, the Sahrtosh</p>\n<p>shapers are rarely taken to task for the excesses of their actions.</p>\n<p>Furthermore, since they are practically immune from prosecution, they use their sanctuary</p>\n<p>to carry out extremely dangerous experiments and to hide their failures and deepest</p>\n<p>secrets. It is here, too, that they keep their prohibited servants, the ghav-nosh, the</p>\n<p>takers of life. The ghav-nosh are the shapers’ personal assassins. They use unique, and</p>\n<p>particularly deadly shaped weapons to eliminate their masters’ enemies. They are, ironically,</p>\n<p>killers in the employ of the masters of life.</p>\n<p>Stormtower: This is the highest tower in the village, and functions as a prison of sorts.</p>\n<p>Long ago, 14 different, powerfully shaped creations of the rhulisti were sealed into</p>\n<p>cocoon-like pods. No one remembers how they can be safely opened, nor exactly what</p>\n<p>lies within the pods. Semi-transparent nodules on the pods reveal cloudy, uncertain</p>\n<p>shapes, and certainly some of them are intelligent creatures. Rather than destroy them,</p>\n<p>the life-shapers have chosen to keep them here, locked away and well guarded, until</p>\n<p>such time as someone can determine what they are and what they can do. All that the</p>\n<p>people of the village know about Stormtower is that something dangerous and forbidden</p>\n<p>is kept under guard in the top of the tower.</p>\n<p>Important NPCs</p>\n<p>Typical ghav-nosh assassin (ham &amp; haf/T5): AC 10 (none); MV 6; hp 20; THAC0 18.</p>\n<p>#AT 1; Dmg 1d6 (quickstrike); SA x3 backstab; SZ S (3’ tall); ML Champion (15); Int</p>\n<p>Average (8-10); AL NE; XP 420.</p>\n<p>Special Equipment: grasping hook and 100 feet of rope, poison nodule, quickstrike.</p>\n<p>Thief Abilities: PP 40, OL 45, F/RT 20, MS 70, HS 70, DN 50, CW 70, RL 0.</p>\n<p>The assassins are very loyal, and have few qualms about killing or committing any loathsome</p>\n<p>actions their masters call upon them to perform. Ghav-nosh usually wear black</p>\n<p>cloaks and red face masks. Some ghav-nosh are warriors wearing hidden sheath armor.</p>\n<p>Wem-osun (ham/F11): AC 0 (sheath, shield, and Dexterity bonus); MV 6; hp 73;</p>\n<p>THAC0 10; #AT 3/2; Dmg 1d6 (shockstick); SA shockstick inflicts additional 1d6</p>\n<p>electrical damage every 6 rounds; SZ S (2’ 10”); ML Fearless (20); AL CG; XP 4,000.</p>\n<p>S 14, D 17, C 16, I 17, W 16, Ch 15.</p>\n<p>Personality: noble, self-sacrificing</p>\n<p>Special Equipment: directional sensor, sheath armor, shockstick</p>\n<p>Psionic Summary: Dis 2/Sci 1/Dev 4; PSPs 54; Att EW, PB; Def MB</p>\n<p>Player’s Option: #AT 1; MTHAC0 14; MAC 7</p>\n<p>Telepathy: Sciences—psionic blast; Devotions—ego whip, mind blank</p>\n<p>Psychometabolism: Devotions—chameleon power, heightened senses</p>\n<p>62</p>\n<p>Wem-osun is the life-shaper’s main enemy in Sahr-tosh. He leads a small underground</p>\n<p>movement to strike at them and the ghav-nosh. He is an ally of the shapers in Glerran,</p>\n<p>who secretly send him supplies and assistance when they can. He makes full use of his</p>\n<p>psionic abilities to aid him in his fight.</p>\n<p>A handsome rebel, despite the fact that he is getting on in years (even for a halfling),</p>\n<p>he is a robust man and a formidable foe. Though he won’t tell, some say that he is over</p>\n<p>100 years old. His medium-length black hair is greying.</p>\n<p>Player characters may encounter Wem-osun in Sahr-tosh if they are friends of the</p>\n<p>Glerran shapers. They might also meet him as he attempts to convert them to his cause.</p>\n<p>He will speak to them for a few minutes, telling them that the shapers are actually an</p>\n<p>insidious organization, seeking to control the lives and livelihoods of citizens, and then</p>\n<p>disappear into the alleyways before the vher-elus show up to apprehend him.</p>"
