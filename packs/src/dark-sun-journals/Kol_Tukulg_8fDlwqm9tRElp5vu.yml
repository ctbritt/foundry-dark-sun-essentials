    text:
      format: 1
      content: "<p>A plume of ash swirls over Kol-Tukulg, a dramatic\_volcano in the Forest Ridge. At most times, the\_mountain is quiet, but now and then, the cloud of ash\_and smoke pouring from its apex swells alarmingly.\_When this occurs, nearby halfling tribes mount an\_expedition to the summit and throw several living\_sacrifices into the caldera. They believe that this\_method is the only way to quiet Kol-Tukulg of the\_Fiery Tread, a terrible elemental creature that lairs in\_the fiery caverns of the\_ volcano that bears its name.\_Ancient wards of primal magic trap the mighty being\_in the mountain, but the defenses have weakened\_over the centuries, and the elemental grows restive.</p>"
