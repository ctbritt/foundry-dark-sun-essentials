    text:
      format: 1
      content: "<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Marked by a free standing “gate” made of weathered,carved rock, this small settlement is based around a small oasis, nestled in the sand dunes of the deep desert. About three dozen trees mark the area of the oasis.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Origins/ History</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">A human trader known as Menka found Menka’s Gate approximately 25 years ago. He stumbled upon the oasis after losing his mount to a predator, and barely escaping himself. He crawled into the oasis that was nestled in amongst the dunes and drank his fill of water. Shortly after, stretched out in the shade of several of the large trees, he looked up with blurry eyes and beheld a freestanding stone arch. It looked to him like a gate. He approached it and could see that at one time, the rocks that formed the archway had been carved with imagery, but time and weather had ground them down to mere hints of shapes and pictures. Perhaps it was the effects of the sun that had unbalanced his mind, or his sudden arrival at a shaded oasis after baking in the desert, but Menka immediately decided that this was some gateway to a paradise.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">The oasis was a little known place slightly off the trade routes between Raam and Urik, so unless caravans were low on water and knew of the place, they would usually not go off the beaten path to find it. However, as years passed, occasional caravans did come and go from Menka's Gate. As they came, Menka would tell them of the paradise he had envisioned beyond, and explained how one day this gateway would open up and let them journey through. Of course this is all fancy or insanity on his part, but it seems dreams of paradise are infectious, for over the years, caravans have carried his words far and now a gathering of some 32 people live at the small oasis awaiting the day that the portal to paradise will open...</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Location</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">The oasis is located 5 miles off the main trade route between Raam and Urik, about 1/3 of the way from Urik. The only real structure at Menka's Gate is the archway itself. Made from solid granite, the gateway has withstood thousands of years, though its intricate carvings have been washed away by time. The oasis is marked, however by a considerable complex of tents that are spread about the oasis like a maze. The area ten feet around the gate is always kept clear of tents and items, though people are permitted to walk up and touch the archway as long as they show the proper reverence. Children are not allowed to play near the arch.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">The oasis survives primarily with food from small gardens about the village. Their diet is supplemented by trade with passing caravans. Also, the tents have surrounded the archway, so they charge small amounts for visitors to pass through and view the archway. Menka refuses to charge for water at the oasis, since he thinks desperate people may cause a fight, but he does ask for donations if people seek protection at the oasis.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Organization</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">The closest thing to a leader of the community is Menka, though he is more like a preacher. He constantly preaches about preparedness for paradise and patience until the day that the portal opens. Other than that, the village looks out for its own but has no strict leaders.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">The other 32 people are all dreamers from other villages or cities that heard of Menka's Gate to Paradise and came looking. They are weak-willed enough to have been convinced to stay after hearing Menka's speeches. After several years of this, they have become quite loyal to Menka and would do nearly anything he asked. They have assorted craftsman skills, but are mostly farmers. There are two rangers here that lead hunts into the desert and help protect the village. A couple ex-gladiators are also here and act as guardians.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">The people here spend at least three hours listening to Menka's preaching, every other day or so. He preaches about how people must remain humble, be good, and continue to believe in Paradise. The paradise he describes is of lush cool land with large areas of water, where no predators dwell. He often cites the fact that this oasis has no predatory plants, and this is “Proof” of the Paradise awaiting beyond the gate.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Outside Relations</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">It is often visited by curious caravans passing by, and caravans have been known to charge slightly more to go “out of their way” to drop by Menka's Gate. The life here is very calm and sedate. People work hard to protect the oasis and grow food, but otherwise it is quiet, and peaceful. The odd caravan that has stayed that has gotten rowdy has been asked nicely to be quieter. Aside from fiercely protecting Menka's gate and their food, the people are shy and non-provoking. They are very peaceful, though they keep to themselves and will defend what they have viciously. They are kind to visitors, though tend to treat them as if they were children who had not yet <span style=\"font-size:11pt;text-decoration-line:inherit\">been enlightened. All in all, most visitors consider it a creepy </span>encounter.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Important Residents</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Menka</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Male Human Trader, Lawful Neutral</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">AC 8 (leather armor) Str 12</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Movement 12 Dex 13</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Level 9 Con 16</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Hit Points 47 Int 17</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">THAC0 16 Wis 12</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">No. of Attacks 1 Cha 18</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Damage/ Attack: 1d6-1 (bone short sword)</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Items: Ring of Empathic Link - empathic link is a hybrid of the empathy psionic, but the users gets a link with the target and actually makes the target feel what the person wearing the ring feels. This often results in sympathetic feelings towards the wearer.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Thief Skills: PP 25, OL 20, FRT 5, MS 10, HS 5, DN 25,</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">CW 60, RL 40, FD 50, BO 45, EB 20;</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Psionic Summary: PSP 44, Wild Talent- empathy</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Power Score—12</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Attack/ Defense Modes: none / TS, MB, IF.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">PLAYER’S OPTION: MTHACO 15; MAC 9</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">(mental armor class proficiency).</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Menka is pretty crazy, but he's also quite charismatic. He doesn't refute anyone who speaks out against his belief in the gate, but rather gives them pitying looks and tells them that he will wish he could have convinced them when he is in Paradise. Menka has the wild psionic talent of empathy that he unknowingly uses to manipulate people to accept his beliefs. Since he can feel the empathy towards them, he can better manipulate them.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">\_</p>"
