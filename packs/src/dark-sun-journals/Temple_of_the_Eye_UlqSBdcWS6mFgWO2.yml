    text:
      format: 1
      content: "<p>Beyond the bounds of Nibenay’s farthest logging camps sits a crumbling, vine-choked ruin, a former temple of a forgotten dark god. The image of an enormous, hideous eye is carved into the wall above the black stone altar. Nibenese templars tend the temple day and night, slaying anyone who happens upon the site, but they never enter the unexplored catacombs below ground. Well guarded\_\_slave laborers spend their days chiseling stone carvings from the temple’s ancient walls, and teams of bearers ferry the carvings back to the Naggaramakam, the dominion of the Shadow King. To what purpose Nibenay puts these carvings, none can say.\_</p>"
