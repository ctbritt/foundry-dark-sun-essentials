      content: "<p>A particularly lush oasis in the scrub plains east of\_the Thamasku Ledge goes by the name of Pyreen Grove.</p>\n<p>Here, amid a sparkling blue lake and clumps of longleafed\_crying trees, legends claim that the pyreen gather to\_discuss the plight of the world. If these mysterious beings\_can truly call a single location in all of Athas “home,”\_then this oasis is that place.</p>\n<p>Animals of all types live within the grove, though no\_intelligent or malignant beings shelter here for long. Some\_unseen force drives them out, keeping the oasis pure and\_pristine. Visitors who do make a brief stop at the grove\_are encouraged to treat every living thing there with the</p>\n<p>utmost respect. After all, it's said that pyreen can take\_any form.</p>\n<p>The pyreen, or the peace-bringers, are an ancient race\_with ties to the Age of Rebirth that preceded the Green\_Age. These psionicist/druids travel the world in an effort\_to restore the vitality of Athas. In their natural form,\_they have physical characteristics of all the demihuman\_races, though they almost never appear that way. Instead,\_they wander in the form of animals or as humans or\_demihumans. They are solitary, noble beings with a high\_purpose: to protect and restore the land.</p>\n<p>While no visitors are likely to meet (or realize they're\_meeting) pyreen in the grove, their presence can be felt\_just the same. Just the fact that the oasis exists at all\_should be enough to convince even the most skeptical\_mul that something powerful watches over it. If a visitor\_attempts to harm the oasis, the grove itself is said to rise\_up and attack. The other amazing thing about the grove\_is that no defiler is ever permitted to step within its\_bounds. The land twists, heaves, and even cracks open to\_prevent a defiler from getting closer. If that fails, powerful\_creatures emerge from the grove to drive the offending\_wizard off. Travelers' tales claim that everything from a lirr\_to a jhakar has been seen defending the grove.\_At least one pyreen regularly visits the grove. From this\_vantage point, the peace-bringer can travel to the\_ nearby\_city of the cliff-dwellers to check on the progress of the\_halflings who live there. The pyreen have definite ties to\_the ancient halflings, and as the halflings of the Jagged\_Cliffs are the closest to those of the Blue Age, it makes\_sense that the pyreen would watch over them.</p>"
