    text:
      format: 1
      content: >-
        <p>An aging but ambitious merchant lord who sees crisis as opportunity.
        During council meetings, he positions himself as the solution to Tyr's
        security problems, offering his private guards and resources to
        supplement the overstretched city watch. His house kept citizens fed
        during the chaotic period after Kalak's death, earning popular support
        that he's not afraid to leverage for political gain. His willingness to
        deploy "security forces" throughout the city under the guise of public
        safety makes him potentially dangerous to Tyr's democratic
        experiment.</p>
