      format: 1
      content: "<div class=\"topic-meta-data\" style=\"display:flex;align-items:center;padding:0px 11px 0.25em;color:#222222;font-family:Arial, sans-serif;font-size:15.008px\" aria-level=\"2\">\n<div class=\"names trigger-user-card\" style=\"flex:1 1 auto;overflow:hidden;margin-right:auto;display:flex;align-items:center\"><span class=\"first username\" style=\"font-size:var(--font-0);margin-right:8px;display:flex;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;vertical-align:middle;align-items:baseline;font-weight:bold\"><a style=\"text-decoration-line:none\" href=\"https://arena.athas.org/u/Grummore\" data-user-card=\"Grummore\">Grummore</a></span><span class=\"second full-name\" style=\"font-size:var(--font-0);margin-right:8px;display:inline-block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;vertical-align:middle\"><a style=\"text-decoration-line:none\" href=\"https://arena.athas.org/u/Grummore\" data-user-card=\"Grummore\">Sébastien Gamache</a></span></div>\n<div class=\"post-infos\" style=\"display:flex;flex:0 0 auto;align-items:center\">\n<div class=\"post-info edits\" style=\"flex:0 0 auto;margin-right:0.5em\"><button class=\"widget-button btn-flat no-text btn-icon\" style=\"font-family:inherit;font-size:var(--font-0);line-height:var(--line-height-small);margin:0px;overflow:visible;appearance:button;cursor:pointer;font-weight:normal;background-image:initial;background-position:initial;background-size:initial;background-repeat:initial;background-attachment:initial;background-origin:initial;background-clip:initial;transition:color 0.25s ease 0s, background 0.25s ease 0s;display:flex;align-items:center;border:0px initial initial\" title=\"post last edited on May 22, 2019 3:24 am\"><span class=\"d-button-label\" style=\"order:0;padding-right:0.25em;color:var(--primary-med-or-secondary-med);transition:color 0.25s ease 0s\">1</span></button></div>\n<div class=\"post-info post-date\" style=\"flex:0 0 auto;margin-right:0px\"><a class=\"widget-link post-date\" style=\"text-decoration-line:none\" title=\"Post date\" href=\"https://arena.athas.org/t/the-forgotten-north/1514/15\"><span class=\"relative-date\" style=\"white-space:nowrap\" title=\"May 22, 2019 3:20 am\" data-time=\"1558488053675\" data-format=\"tiny\">May '19</span></a></div>\n<div class=\"read-state read\" style=\"position:absolute;align-self:center;color:var(--tertiary-medium);right:0px;font-size:0.571em;visibility:hidden;opacity:0;transition:visibility 1s ease 0s, opacity 1s ease-out 0s\" title=\"Post is unread\">\_</div>\n</div>\n</div>\n<div class=\"regular contents\" style=\"position:relative;color:#222222;font-family:Arial, sans-serif;font-size:15.008px\">\n<div class=\"cooked\" style=\"overflow-wrap:break-word;line-height:var(--line-height-large);overflow:hidden;padding:1em 11px 0.25em\">\n<p style=\"margin-top:0px\">Ok here, I’ve started a campaign and a reading of what’s been done about the Trembling Plains.</p>\n<p>In Azeth’s Rest, the pictures numbers doesn’t match the map keys. I’m trying to put the good number to the best place.</p>\n<p>How about a little help? Thanks!</p>\n<p>Here is the text and I will attach the two pictures:</p>\n<blockquote style=\"border-left:5px solid var(--primary-low);clear:both;margin-left:0px;padding:12px\">\n<ol style=\"margin-bottom:1em;margin-left:1.25em;padding-left:1.25em;clear:both;margin-top:0px !important\">\n<li>Gate. The gate is located between two towers that rise five feet above the walls. A heavy wooden portcullis studded with varnished thorns and barbs secures the gate. In times of attack, a heavy canvas is spread over the interior surface of the portcullis and splashed with a quick-hardening resin, to provide a solid gate. Three fixed crossbows are mounted atop the gate. The posts are always manned, and a makeshift bamboo awning provides shade for the guards. If the PCs display an Azeth trust token, then everyone that the person carrying the token vouches for can enter Azeth’s Rest; however, that PC is then held responsible if any person that she vouches for harms anyone or otherwise violates House Azeth’s hospitality. The guards will also tell the PC displaying the token that the coin entitles him and his friends a free meal at the Drik’s Belly inn, and one free stop at the watering hole.</li>\n</ol>\n<p>Without the trust token, each person must pay a silver piece in order to enter Azeth’s Rest. If the PCs seem hesitant to pay, the guards will consider other exchanges, particularly if the PCs have and are willing to part with trained kanks.</p>\n<ol style=\"margin-top:1em;margin-bottom:1em;margin-left:1.25em;padding-left:1.25em;clear:both\" start=\"2\">\n<li>\n<p>Walls. The 40-foot tall outer walls has the exact same color as the brownish yellow sand beneath, five ballistae are set atop the corners of the irregular walls. The walls appear to be made from one single seamless piece of stone, 6 feet thick, but sloped slightly inward. Fixed crossbows are mounted at intervals about the walls.</p>\n</li>\n<li>\n<p>Perimeter Path. Inside the gate, a well-worn path 25 feet wide runs north and south. The road moves more or less parallel to the walls, and runs the perimeter of the fort.</p>\n</li>\n<li>\n<p>Azeth Slave Quarters. A windowless two-story adobe building stands across the path on the left as one enters the gate. Despite the grim outward appearance, the slave quarters are surprisingly roomy and clean, and there is an open courtyard at the center of the building. Many of the slaves have families and children. Like herders and Kurnans, House Azeth actually accords slaves greater status than seasonal hirelings. More than fifty slaves and their families live in this building; the thirty most trusted slaves have their quarters in the lower tier of the Azeth family compound.</p>\n</li>\n<li>\n<p>Drinking Hole. Zaal trees and some spindly bushes grow around the drinking hole, and a number of green-leafed mo’onis trees grow in the thin shade alongside the traders’ buildings. Stones and resin form a two-foot wall around the hole, and the water level raises above the ground. If the PCs display an Azeth trust token, this entitles them to one free use of the watering hole for up to eleven persons and their mounts. Without the trust token, water costs 3 sp per tun (250 gallons)</p>\n</li>\n<li>\n<p>Oasis. The area north and west of the drinking hole is thick with trees, and the ground looks damp. The tree thicket is off-limits to guests and strangers except for those accompanies by Azeth family members or friends of Azeth. Azeth Baazrags make their nests in the thicket, and vigilantly enforce the rule against unwelcomed persons who stray into the thicket. Khraazgudh, (Baazrag baazrag Druid druid 7/ Grove grove Master master 1), watches over this grove.</p>\n</li>\n<li>\n<p>Huzbug Azeth’s Quarters. While most of the Azeth family members have their quarters in the southeast corner of Azeth’s Rest, Huzbug Azeth keeps his quarters and offices right next to the drinking hole. He spends long hours here negotiating with herder chiefs, and trade house representatives, and has guest quarters for them. Like other Azeth buildings, the mansion is considerably nicer on the inside than on the outside; a natural spring bubbles up right inside the courtyard.</p>\n</li>\n<li>\n<p>Azeth Pens. House Azeth keeps its livestock in these pens. The pens are often empty since Azeth purchases its lifestock from the herders, and either slaughters them locally for food, or transports the livestock to Ket or Draj in their trade caravans.</p>\n</li>\n<li>\n<p>Shrine of the Desert Breeze, administrated by Beraan Biraan Azeth (female human cleric (Air) 7).</p>\n</li>\n</ol>\n<p>This open-air place of worship is open to any visitor. A set of stairs leads to stone platform and altar at the level of the tree-tops. At the bottom of the staircase, a large wicker cage stands, containing about 25 songbirds. For 2 cp, Beraan Biraan will sell any person a songbird for “sacrifice.” To BeraanBiraan, it goes without saying that one “sacrifices” a songbird by standing at the altar and setting it free. The birds are actually trained to fly away from Azeth’s Rest, and then to return to their nesting place from which Beraan Biraan recovers them to sell to other strangers. This is not impiety on Beraan’s Biraan’s part: setting the birds free is a ritual that honors the elements, the details are not important. As far as Beraan Biraan is concerned, all persons have reason to be grateful to the winds, particularly if they travel through the trembling plains; she does not care if they have other beliefs or spiritual allegiances.</p>\n<p>Beraan Biraan will look more kindly on persons who show the winds proper respect, by offering a sacrifice for one’s safe arrival in Azeth’s Rest, before trying to strike any other conversation with BeraanBiraan, or trying to negotiate for her services. She will give such persons a 10% discount on any of her priestly services, unless they otherwise show themselves unworthy of her favor. For others, she sells spellcasting services at the normal rate, but she does not keep any confidences secret from her House Azeth brethren.</p>\n<ol style=\"margin-top:1em;margin-bottom:1em;margin-left:1.25em;padding-left:1.25em;clear:both\" start=\"10\">\n<li>\n<p>Azeth Loading Pens. The mekillot pillars allow Azeth to keep the mekillots under control as slaves load and freight to be taken into the warehouse.</p>\n</li>\n<li>\n<p>Azeth Warehouse.</p>\n</li>\n<li>\n<p>Azeth Compound, Lower Tier.</p>\n</li>\n<li>\n<p>Azeth Compound, Higher Tier. Higher on the hill dwell Azeth’s senior agents and their families.14. Tree of Life. Planted by Meraan Azeth, two thousand years ago.</p>\n</li>\n<li>\n<p>Chapel of the Ancient Seas The most ancient building in Azeth’s Rest. A false adobe mud front covers the ancient stone structure. The dome is translucent, and contains the ancient, but still-living body of Meraan Azeth. House Azeth does not tell the name of this temple to strangers.</p>\n</li>\n<li>\n<p>Mekillot Handling Area. Pillars for chaining mekillots or driks, and drinking troughs, which Azeth slaves will fill for a price.</p>\n</li>\n<li>\n<p>Crodlu Stables.</p>\n</li>\n</ol>\n<p>18 Inix Pens.</p>\n<ol style=\"margin-top:1em;margin-bottom:1em;margin-left:1.25em;padding-left:1.25em;clear:both\" start=\"19\">\n<li>The Drik’s Belly Inn.</li>\n</ol>\n<p>20 The Drik’s Market. Azeth sells its goods here, but when there is room, it allows others to put their stalls here as well.</p>\n<ol style=\"margin-top:1em;margin-bottom:1em;margin-left:1.25em;padding-left:1.25em;clear:both\" start=\"21\">\n<li>\n<p>Tower. Kaidan Azeth (male half elf wizard (preserver) 7) and Leisahn Azeth (male half elf wizard (preserver) 9) work and occasionally sleep in this tower, but they have quarters in the higher tier of the Azeth compound with their children and grandchildren. This husband and wife are House Azeth’s most powerful preservers, other than mercenaries. They often accompany House Azeth caravans to Draj and back, but rarely together.</p>\n</li>\n<li>\n<p>Tower. AusarMakerand his wife GelnaMakerlive here. Ausar is considered a friend of Azeth, and personally helped to make the walls of Azeth’s Rest. The previous walls were made of adobe mud like most of the rest of the village, and there were casualties every year from the Trin Raids. Since the walls’ construction, not a single person within the walls has died. Ausar is considered something of a local hero.</p>\n</li>\n<li>\n<p>Mercenary Barracks.</p>\n</li>\n<li>\n<p>Azeth Kiln. Azeth family members own this Kiln and, and they occasionally operate it to create trust tokens and to mint House Azeth ceramic pieces that are often used in Kurn as well as in Azeth’s Rest. Most of the time, various potters operate the kiln, paying the owners for its use.</p>\n</li>\n</ol>\n<p>25 Potter’s Corner. A few apartments of separate potter families live and sell their wares from these rented apartments. They have dug clay pits within walking distance of Azeth’s Rest.</p>\n<p>26 Armorer. Horak, a Kurnan expatriate (Human Expert 4) fashions quality armor here. He imports his leather from Azeth’s Rest (+20% to cost), but sells reasonable quality armor made from trin chitin for only 75% of the normal cost. He is competent but overworked, and rarely produces masterwork armor. He will do custom work armor for typical prices, but will not rush his work or push his other work behind, taking an entire quinth(75 days) to deliver. Horak has no last name since he left the armorer’s clave over a disagreement that he does not wish to speak about. He has great respect for Oronis but as a Kurnan without a clave, he feels alienated in his own land.</p>\n<ol style=\"margin-top:1em;margin-bottom:1em;margin-left:1.25em;padding-left:1.25em;clear:both\" start=\"27\">\n<li>\n<p>West Wind Market. For five bits a day, anyone may set up a 5x5 foot stall to sell goods here. Those who have permission to stay in Azeth’s Rest during the night, may continue their sales during the night, so long as they do so reasonably quietly. Most nights see no business here and most days feature no more than a dozen motley stalls, but during the trade fairs, this area is crowded with stalls selling a wide variety of goods.</p>\n</li>\n<li>\n<p>Shops and apartments. Negotiating through the manager of the Drik’s Belly Inn, Azeth leases out these buildings from season to season. Leasing space within Azeth’s Rest does not give one the right to spend the night there, as House Tsalaxa rudely discovered. Azeth does not believe that competition constitutes a breach of trust; it allows the Dedys Consortium to sell its goods from the larger southernmost building in this area. However, if Azeth feels that the renter’s sales are cutting into Azeth’s own profits, it will raise the price of the next season’s lease appropriately. It is not at all uncommon for two persons renting identical buildings to discover that one of them is paying ten times the rent that the other is paying. If Azeth wants someone to stay in town, they will lease them space for practically nothing.</p>\n</li>\n<li>\n<p>Tent Area. For a silver piece, anyone allowed to enter Azeth’s Rest receives a token allowing them to pitch a tent up to 20 foot square in any of Azeth Rest’s outer perimeter areas, so long as they are more than five feet away from a building, and stay out of the animal areas such as areas 8, 16, 18, and 30. The token is good for the rest of the season. During Flamesky season, the price rises to five silver pieces. Azeth usually gets paid in cattle rather than silver, and the house is willing to contemplate other profitable exchanges. Many of the tents in this area double as quarters and vendor booths. Almost every herder has something to sell, cattle, if nothing else. Cattle prices are considerably lower during Flamesky season.</p>\n</li>\n<li>\n<p>Cattle Pens. These pen areas are for cattle. Anyone can leave their animals here. The fee is modest during most of the year, but rises considerably during Flamesky season.</p>\n</li>\n</ol>\n<p style=\"margin-bottom:0px !important\">House Azeth maintains a barracks of 70 troops at Azeth’s Rest, to defend the property and the 90 slaves who handle the cargo and the animals. A dozen or more traders from House Azeth, led by HuzbugAzeth(elven male, Bard 8/Dune Trader 2, LG), manage the fort for most of the year. Most of the slaves are from the Tablelands, as are some of the troops. When the Great Caravan is in Azeth’s rest the number of defenders rises considerably. Just before Flamesky season begins, CorikAzeth(Bard 5 /Dune Trader 5, LN) arrives with the Great Caravan and assumes command of Azeth’s Rest’s defenses, bringing a hundred Kurnan mercenaries to help protect Azeth’s Rest from kreen. Huzbug continues to administrate routine community matters from his small palace, while Corik takes his own place on the hill.</p>\n</blockquote>\n</div>\n</div>"
