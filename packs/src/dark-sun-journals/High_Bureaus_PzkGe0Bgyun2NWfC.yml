      content: >-
        <p>Just inside the Grand Gate lies a cluster of buildings in which
        administrators and templars see to the day-to-day functions of the
        city-state. Although everyone associated with the new government in Tyr
        describes it as "a brand new day for all," bribes remain the quickest
        way to gain an audience with the ranking templar of a given bureau.</p>
