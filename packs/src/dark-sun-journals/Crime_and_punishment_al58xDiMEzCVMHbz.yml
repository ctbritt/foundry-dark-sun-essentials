      format: 1
      content: "<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato;font-size:11pt;vertical-align:baseline\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Crime, Punishment, Trade and Commerce</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato;font-size:11pt;vertical-align:baseline\">In these days of lawlessness, disgruntled ex-slaves and gladiators roam the streets in mobs and gangs. Thieves and cut-throats are on the look out for easy targets. The templars still run the justice system, and are known for their corruption. They still act as the main law enforcement of the streets, but tougher beats and jobs are often handed to the Tyrian Guard. Punisments range from fines, to forced labor in the Iron Mines of Tyr. Tyr exports silks, wines, and many other trade items. However its main profit comes from the iron mines, which are the larges source of metal on Athas. The iron trade is strictly regulated by the Ministry of the Mines, but other city-states pay for the vaulable metal, bringing great profits to the economy of Tyr. The iron mines are located at the foot of the ringing mountains 2 days ride from the gates of Tyr.</span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Tyr's code of justice</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">Under King Kalak, “justice” was synonymous with the whims of the powerful, and no one expected (or received) fair treatment under the law. Today, the commoner-led factions in Tyr seek to address that problem. Bending to pressure from commoners threatening to rebel, King Tithian has charged the templar Tehosian with creating a system of law that presumes innocence unless a jury of three unbiased judges determines otherwise. So far, however, Tehosian has relied on the judgments of templars, nobles, and Tyrian Guard patrols. Those deemed guilty of minor crimes are fined; those found guilty of serious crimes are exiled from Tyr and sold into slavery. Truly heinous criminals are executed in special ceremonies in the Stadium of Tyr.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">\_</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px\">\_</p>"
