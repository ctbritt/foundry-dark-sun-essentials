      content: >-
        <p>The dwarven settlement of KIed controls an obsidian mine in the
        foothills of the Ringing Mountains. The village is built on the location
        of a Green Age dwarven citadel called Kemlok. The dwarves of Kled
        believe they are descended directly from the kings of Kemolak, although
        they keep this claim from outside ears, lest they anger a sorcerer-king
        in their presumption. From time to time, miners unearth portions of the
        ruins of the “city of dwarf kings.” Most of the finds are enigmatic wall
        remnants or bits of flagged flooring heavily inscribed with angular
        runes. However, every so often the workers recover a crumbling relic of
        ancient Kemalok. Of late, Kled has been troubled by a series of raids
        targeting trade caravans bound for Tyr. A number of dwarves have been
        killed by mysterious attackers.</p>
