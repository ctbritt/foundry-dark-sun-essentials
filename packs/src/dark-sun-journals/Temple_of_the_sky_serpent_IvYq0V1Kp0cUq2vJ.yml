      content: "<p>The top five or six “steps” of a great pyramid rise out\_of the jungle here; most of the structure remains\_buried beneath the forest floor. The pyramid is usually sealed tight, but persistent explorers occasionally\_bypass its magic wards and gain entry. Invariably,\_they report a maze of stone tunnels that seems to go\_on forever, opening onto empty chamber after empty\_chamber. But when the two moons\_ \_ of Athas align in\_a certain way above the pyramid’s apex, the sealed\_entrances gape wide, issuing forth green light and\_hypnotic music. At such times, yuan-ti priests emerge\_from the Temple of the Sky\_ Serpent to practice abominable rites atop their shrine, and yuan-ti war parties\_range far into the surrounding jungle.</p>"
