      content: "<section id=\"h.6a14bd521ffb03fc_8\">\n<div>\n<div tabindex=\"-1\">\n<div>\n<div>\n<div>\n<div>\n<div id=\"h.6a14bd521ffb03fc_16\">\n<div>\n<div>\n<p dir=\"ltr\">Draj is called the City of the Moon and is ruled by the <a href=\"https://www.google.com/url?q=https%3A%2F%2Fdarksun.fandom.com%2Fwiki%2FSorcerer-Kings&amp;sa=D&amp;sntz=1&amp;usg=AFQjCNH3AMG_JcQhfyBCAd-OkbzkgDNIxw\" target=\"_blank\" rel=\"noopener\">Sorcerer-King</a> <a href=\"https://www.google.com/url?q=https%3A%2F%2Fdarksun.fandom.com%2Fwiki%2FTectuktitlay&amp;sa=D&amp;sntz=1&amp;usg=AFQjCNEdr_JpJlMiBcx9AOM8CGmggjyfbg\" target=\"_blank\" rel=\"noopener\">Tectuktitlay</a>.</p>\n<p dir=\"ltr\">Draj is located in the northeast corner of the <a href=\"https://www.google.com/url?q=https%3A%2F%2Fdarksun.fandom.com%2Fwiki%2FCategory%3ATablelands&amp;sa=D&amp;sntz=1&amp;usg=AFQjCNHwxcx3Xl2p508Q3--lBXYo5dnoFQ\" target=\"_blank\" rel=\"noopener\">Tablelands</a> far east of the Ringing Mountains and of <a href=\"https://www.google.com/url?q=https%3A%2F%2Fdarksun.fandom.com%2Fwiki%2FTyr&amp;sa=D&amp;sntz=1&amp;usg=AFQjCNFMVH5AeVQHWCcDjZObCxWcOiegag\" target=\"_blank\" rel=\"noopener\">Tyr</a>. A number of villages formed by escaped slaves, thrive on the outer edges of Draj's territory. These villages include Cedrilte, <a href=\"https://www.google.com/url?q=https%3A%2F%2Fdarksun.fandom.com%2Fwiki%2FGedron&amp;sa=D&amp;sntz=1&amp;usg=AFQjCNFHzHdscO-UuQY5J5ifSxTS8o94aA\" target=\"_blank\" rel=\"noopener\">Gedron</a>, and Teaquetzl.</p>\n<p dir=\"ltr\">From the Wanderer's journal:</p>\n<p dir=\"ltr\">\"The <a href=\"https://www.google.com/url?q=https%3A%2F%2Fdarksun.fandom.com%2Fwiki%2FSorcerer-Kings&amp;sa=D&amp;sntz=1&amp;usg=AFQjCNH3AMG_JcQhfyBCAd-OkbzkgDNIxw\" target=\"_blank\" rel=\"noopener\">Sorcerer-King</a> of Draj calls himself 'The Mighty and Omnipotent Tectuktitlay, Father of Life and Master of the Two Moons'.</p>\n<p dir=\"ltr\">As you might guess from his appellation, Tectuktitlay claims to be a god.</p>\n<p dir=\"ltr\">Lest you take him seriously, I'll point out that in my opinion, Tectuktitlay is not even one of the more powerful Sorcerer-Kings.</p>\n<p dir=\"ltr\">Be that as it may, Tectuktitlay rules Draj from a great walled compound in the center of the city. This compound contains several one-story buildings that serve as the barracks for his personal guard, templar quarters, a school for the children of the nobles, and a psionics academy that he personally supervises. In the center of this compound is a large gladiatorial arena. It is surrounded by tiers of stone seats, except where a steep stone pyramid. Tectuktitlay's home rises two hundred feet over it.</p>\n<p dir=\"ltr\">No one seems to know how long Tectuktitlay has ruled Draj, probably because he has forbidden this knowledge to be passed on from generation to generation in order to make himself seem completely immortal. His templars, called Moon Priests, claim that he raised the city from the dust and made the surrounding lands fertile.</p>\n<p dir=\"ltr\">This last claim no doubt arises from the fact that Draj sits on a huge mudflat located on the western edge of a large inland silt basin</p>\n<p dir=\"ltr\">If I had to guess, and I have to, I would say that what really happened is this: A relatively young and weak defiler, Tectuktitlay, led a small band of followers to this island and founded his city. Given the natural fertility of mudflats, Draj prospered and Tectuktitlay eventually became a Sorcerer-King.</p>\n<p dir=\"ltr\">Because Draj and the surrounding lands are located on a mudflat, defending it is fairly simple. Any army that attempts to leave the road to it inevitably bogs down in a quagmire of thick mud. If the army stays on the stone paved road leading through Tectuktitlay's lands, all he needs do is send his warriors out to defend the narrow passage, then drive the enemy into the mud.</p>\n<p dir=\"ltr\">Nevertheless, Draj is almost constantly at war, sending its armies far and wide in search of captives. The warriors, which you will encounter nearly anywhere, are armed with obsidian-edged swords and short barbed spears attached to long ropes. They are trained to throw their harpoons into a target's thigh or seat and then drag him back to where they are standing.</p>\n<p dir=\"ltr\">Captives are returned to Draj itself, where they are forced to climb the great pyramid so that Tectuktitlay himself can tear out their hearts. The bodies are sent tumbling down the pyramid into the great arena below.</p>\n<p dir=\"ltr\">On a day following a particularly large number of sacrifices, the bodies are removed from the arena so that the Tectuktitlay's favorites -- the Moon Priests, the nobles, and weapon-makers -- can enjoy an afternoon of gladiatorial games.</p>\n<p dir=\"ltr\">Despite its warlike nature, Draj enjoys heavy commerce with the other cities of the Tyr Region (and some cities to the north, whose names I do not know). This is because Draj's fertile soil makes it rich in two essential resources: hemp, which is good for making both clothes and rope, and grain, which most other cities desperately need in order to feed their starving populations.\"</p>\n<div id=\"h.dtu08ebs37kl\"></div>\n<h2 id=\"h.dtu08ebs37kl\" dir=\"ltr\"></h2>\n<p dir=\"ltr\">\_</p>\n<ul>\n<li dir=\"ltr\">\_</li>\n</ul>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<section id=\"h.1465820674871621_314\">\n<div>\n<div tabindex=\"-1\">\n<div>\n<div>\n<div>\n<div>\n<div id=\"h.1465820674871621_311\">\n<div>\n<div>\n<p dir=\"ltr\">\_</p>\n<div>Draj</div>\n<h2 id=\"h.z2xw29rbxy52\" dir=\"ltr\" tabindex=\"-1\"></h2>\n<p dir=\"ltr\">The sorcerer-king of Draj calls himself \"The Mighty and Omnipotent Tectuktitlay, Father of Life and Master of the Two Moons.\" As you might guess from his appellation, Tectuktitlay claims to be a god. Lest you take him seriously, I'll point out that in my opinion, Tectuktitlay is not even one of the more powerful sorcererkings.</p>\n<p dir=\"ltr\">Be that as it may, Tectuktitlay rules Draj from a great walled compound in the center of the city. This compound contains several one-story buildings that serve as the barracks for his personal guard, templar quarters, a school for the children of the nobles, and a psionics academy that he personally supervises. In the center of this compound is a large gladiatorial arena. It is surrounded by tiers of stone seats, except where a steep stone pyramid - Tectuktitlay's home - rises two hundred feet over it.</p>\n<p dir=\"ltr\">No one seems to know how long Tectuktitlay has ruled Draj, probably because he has forbidden this knowledge to be passed on from generation to generation in order to make himself seem completely immortal. His templars, called \"Moon Priests,\" claim that he raised the city from the dust and made the surrounding lands fertile.</p>\n<p dir=\"ltr\">This last claim no doubt arises from the fact that Draj sits on a huge mudflat located on the western edge of a large inland silt basin (see Geography of the Sea of Silt in Chapter Three: Athasian Geography for an explanation of mudflats).</p>\n<p dir=\"ltr\">If I had to guess, and I have to, I would say that what really happened is this: A relatively young and weak Defiler, Tectuktitlay, led a small band of followers to this island and founded his city. Given the natural fertility of mudflats, Draj prospered and Tectuktitlay eventually became a sorcerer king. Because Draj and the surrounding lands are located on a mudflat, defending it is fairly simple. Any army that attempts to leave the road to it inevitably bogs down in a quagmire of thick mud. If the army stays on the stone paved road leading through Tectuktitlay's lands, all he needs do is send his warriors out to defend the narrow passage, then drive the enemy into the mud.</p>\n<p dir=\"ltr\">Nevertheless, Draj is almost constantly at war, sending its armies far and wide in search of captives. The warriors, which you will encounter nearly anywhere, are armed with obsidian-edged swords and short barbed spears attached to long ropes. They are trained to throw their harpoons into a target's</p>\n<p dir=\"ltr\">thigh or seat and then drag him back to where they are standing.</p>\n<p dir=\"ltr\">Captives are returned to Draj itself, where they are forced to climb the great pyramid so that</p>\n<p dir=\"ltr\">Tectuktitlay himself can tear out their hearts. The bodies are sent tumbling down the pyramid into the great arena below.</p>\n<p dir=\"ltr\">On a day following a particularly large number of sacrifices, the bodies are removed from the arena so that the Tectuktitlay's favorites - the Priests of the Moons, the nobles, and weapon-makers - can enjoy an afternoon of gladiatorial games.</p>\n<p dir=\"ltr\">Despite its warlike nature, Draj enjoys heavy commerce with the other cities of the Tyr Region (and some cities to the north, whose names I do not know). This is because Draj's fertile soil makes it rich in two essential resources hemp, which is good for making both clothes and rope, and grain, which most other cities desperately need in order to feed their starving populations.</p>\n<div id=\"h.hzt40cwk28fb\"></div>\n<div>\n<div>\n<div aria-describedby=\"h.hzt40cwk28fb\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div>\_</div>\n</div>\n</div>\nDraj in details</div>\n<h3 id=\"h.hzt40cwk28fb\" dir=\"ltr\" tabindex=\"-1\"></h3>\n<p dir=\"ltr\">History</p>\n<p dir=\"ltr\">Draj was founded near the height of the Green Age. The area on which Draj sits has been desert since the rebirth, and thus was a natural choice for the city’s odd founders. Draj was created by many rebellious people of the Green Age who did not wish to live in the glamour of psionic and magically created paradises. The harsh desert which surrounded the small area was a natural choice for these rugged \"Naturalists\", and on the grounds they founded a city more primitive than Athas had seen for endless cycles of Ral and Guthay.</p>\n<p dir=\"ltr\">The Drajians lived by strength, ferocity and a merciless mentality, surviving only if their hunters were strong enough to bring down the mighty desert beasts and best the desert itself, and thus the quality which made a great hunter were soon expected of all within the society, and even the society itself.</p>\n<p dir=\"ltr\">The people built their houses out of mud and occasional bits of stone and wood, making them into large pueblo constructs. They were made to be defensible in case the agents of the new world came brandishing spells and psionics in an attempt to \"Make the savages into civilized and happy people\". Despite this they also built a pyramid-palace that was more of a castle construct for the citizens to hide in case of desert creature invasions than a home for loyalty, which Draj truly had none of at that time. This seemingly primitive way of life disgusted the others of society in Green Age cultures, but they had more to worry about than turning the \"Savages\" into images of themselves, for the Drajians’ respect of strength and ferocity in battle had been cemented, and they were growing war-like.</p>\n<p dir=\"ltr\">After centuries of rule without any royalty they began to respect their military leaders much like Kings and Queens, believing them to be great agents from a mighty god of war. In their primitive paintings this god had the head of an eagle with an eagle’s hide draping down his back and shoulders, but the frame of a human so strong as to be of steely skin and unburnable body. They believed this ultimate warrior to be their leader, and that he spoke to them through the cycles of the moons and the Messenger Comet (hence the structure of their calendar).</p>\n<p dir=\"ltr\">By the end of the Green Age the Draj had grown strong from generations of hunters and warriors and had begun to regularly raid other civilized cultures around their desert valley in attempts to appease their war god with sacrifices. They strictly believed that all captured in their wars were to be put to death, a quick, honorable death for the warriors before the homage of their god, and a slow death, of being worked to the end for the others (whom Drajians noticeably had no respect for, all people were either warriors or not, with warriors being considered to be a ‘superior race’). Their desert home and barbaric fighting force fortified them from destruction until the end of the Green Age, a fact most impressive considering the hatred all civilizations but their own felt towards them.</p>\n<p dir=\"ltr\">As the Cleansing Wars were coming to pass and the first wave of attacks had begun, Rajaat lacked an army willing to serve Tectuktitlay, who was reknowed for his barbarism and war-like nature. All men knew to serve him was suicide, as he would waste his men on mindlessly direct attacks in even the direst situation. Rajaat, seeing the similarity of Tect and the Drajians, sent him to bring them into the war under the agreement that the civilization, by that time numbering roughly 40,000, would be his invincible army to face the wemics who had so plagued the human armies.</p>\n<p dir=\"ltr\">As so it became that King Tect was to convince them that he was indeed their god, and through psionics and sorcerery he proved that his skin could not burn, and that he was truly like precious steel. Complex illusions even gave him the eagle head and astrological knowledge common in that era allowed him to convince the primitive culture that he was able to control the moon and stars. He explained to them that the time for the ultimate war and gratification to him, their patron god, was upon them. He explained that the time to bring his glory to the world had come, and he would personally lead them.</p>\n<p dir=\"ltr\">Led by their \"god\" the Drajian army was like a surging super force, they were confident, overly so, almost always making a direct and tacticless invasion. Magic and the death of their comrades only served to spur them on, and it would turn that this mighty force would last the entire war and accomplish the goal set forth for Tect. But soon Tect realized the full power he had, and did not stop there.</p>\n<p dir=\"ltr\">The mighty king realized that they would eliminate humans, Elves, Dwarves and any race he chose from existence, just because their love of the war and their god. It was not long before his mighty army was picking up the slack for other Champions, and it is common knowledge among the Champions that his elite force made the elimination of several races possible within the duration of the war. In the events that transpired leading to the creation of the Dead Lands, however, Tect lost much of his elite army to the catastrophe, and there a force of no less than 1,000 of these strange undead remain. They rise at night and sweep into the Tyr Region, leaving destruction in their wake until sunrise. The next night they all reappear, even those destroyed, and retrace their path again and again, cursed to forever remember their path of destruction and to replay their atrocious acts until the end of time.</p>\n<p dir=\"ltr\">When the God’s War (As the Draj called it, as they thought every Champion to be a god) ended the remaining Drajians, about 9,000, returned to their home. Every last one had left, and over time much of it had been eroded and lost to the desert which was now all around it. The Drajians did not truly understand why the war had ended, but now had the idea that their king and god were as one cemented into their minds, and did not argue. Tect realized quickly that this natural desert was far more fertile than the endless plains of defiler ash outside it, but by the time this was discovered the other Champions had already given it to him, seeing it as the worst of the remaining cities. Tect soon began to change this small ghost city.</p>\n<p dir=\"ltr\">First he found what land was fertile and built a great wall around it a huge wall, marking the territory as part of his city-state. Second he had all his warriors go out and rebuild their homes (Knowing only of the simple architecture of pueblos that is what they built) and plant endless fields of hemp and grains. The second act displeased the barbarians, for they were starting to lose faith in their god of war. Ever shrewd Tect saw this, and ordered a full-scale invasion on nearby Raam that lasted for many of the first centuries of his rule. In the end Raam did not retaliate, as Abalach-re was preoccupied with Dregoth the Ravager by the end. From the war the barbarians did capture numerous people, though.</p>\n<p dir=\"ltr\">Tect found the ancient rituals by which they worked the captured masses to death fitting, but saw beyond that. He knew his men would not leave a life of farmers, and ordered that the slaves be kept, that they continue for all their natural lives to work for the prosperity of his \"Chosen\". The people did not argue, especially not when their god-king sacrificed all the templars to himself. He took the warriors captured, though, claiming that they could join the chosen, and gave them the option of becoming part of his massive army, forcing those who accepted to drink the blood of their former templars to cement the deal. By this time Raam had flourished, growing to more than 20,000 in number.</p>\n<p dir=\"ltr\">King Tect next struck out at far-off Nibenay. Strategically this mistake cost even his famous army, because in reaching their target he often lost twice as much as he gained in the end. The war came to a bitter end after he had captured 3,000 slaves and lost 10,000 warriors. Nibenay’s armed force up to then had been weak, and suffered considerable losses of roughly 2,000 (Of course at this time Draj was a culture rife with warriors, for Nibenay this meant most of their army.) The many templars sacrificed to Tectuktitlay covered the old palace in blood.</p>\n<p dir=\"ltr\">These new slaves had a grander purpose than the old: They were to dig out the great moat and build much of the inner city. Having found his palace terribly inadequate when compared to those of his rivals, and thus what was deserving of a god-king, Tect ordered that the size of the old palace be nearly doubled, so even though most of the space within would not be used his palace would be equally impressive. Along this time the society had changed in many ways.</p>\n<p dir=\"ltr\">The society was still the most war-like, even more so than nearby Urik, but no longer was the only task fit for one of the \"Chosen\" a warrior. Although they are and were treated as second-class citizens, anyone could choose to become an artisan or worker or even store owner (By this time the concepts of trade and commerce had developed and the huge stores of hemp had began to turn out a huge profit for the city, attracting House Tsalaxa to its doorstep). It was also about this time that Tectuktitlay began to fully use his ability to create templars, as before he had chosen only his most trusted warriors to entrust with such power.</p>\n<p dir=\"ltr\">Despite the division of templar power through the masses he still retained the image of a god, in fact it helped boost it. Able to bestow spells of life, these cruel and bloodthirsty men slowly gave those under Tect the impression that he was a god of life, and he basked in it. He soon proclaimed to be The Father of Life and Master of the Twin Moons, while shedding his war-god illusion and slowly filling the role. The people of his city never noticed, soon accepting his Moon Priest Templars and the king himself as what they said they were- a god and his avatars. The king proclaimed to them that he \"Took the death head mud flats, blown off the lifeless sea, and crushed under his might the desert, so home for his chosen there would be\". Generations had passed and this was the truth to those serving under him, and so great temples to the king’s might were soon erected and \"Divine Tectuktitlay\" became not only A god in his people’s eyes, but THE god.</p>\n<p dir=\"ltr\">At this time Tect had grown rather lax in his watch for wizards, which his people so despised, and the cowering mages and fearful rogues that today are more pronounced moved in, forcing upon him to make his templars, who had previously only been in charge of his numerous lavish rituals, into law-keepers, with one judgment to pass for any law- death. Only the highest of nobles were exempt from this iron law, and even they were exiled, their every possession forfeited to the state. This incredible law-keeping meant that criminals and rogue mages could never move in in any considerable force, and were forever viewed as they were within the city- a harmless nothing.</p>\n<p dir=\"ltr\">Two other features of this time were the erecting of a Psionic Academy, The House of the Mind, because of a sudden and intense interest taken by Tect in psionics. Because of this Psionics soon not only became separated from sorcerery but became known as divine, for the king himself was known to teach ALL of the advanced classes. It was never discovered what the true purpose of this great lust for psionic understanding was for, but it is believed that much like Dregoth Tectuktitlay sought true godhood, and looked to the Astral for his an answer he, as far is known, never received...</p>\n<p dir=\"ltr\">The second addition in this era was the great stadium. The stadium was built with high, bladed top walls to keep prisoners of war from escaping, as using them in the games had become a popular act. They featured not only bloodsport but a strange game of skill that required two teams attempt to knock a ball through a sideways hoop without using their hands. This strange game was especially brutal for two reasons: First the teams were given weapons and not restricted in their usage, and second for the fact that the losing team was always sacrificed. The bloodsport games held by Tect were epics, truly marvelous spectacles that seem to be beyond even his barbaric and war-like nature.</p>\n<p dir=\"ltr\">For many years after Tect led his army in short campaigns against enemies to gain extra slaves, mainly because his own would have been taxed too greatly by the Dragon’s Levy. His civilization leveled out at about 15,000 at any time, though constant warring and captures made would make it fluctuate greatly at times. Over this spread of time the great fields of hemp became a valuable trade item, and the city-state soon lured the other city-states to its products despite the bad blood, allowing Tsalaxa to gain greatly in power. This period of general prosperity continued up until Free Year 10.</p>\n<p dir=\"ltr\">Killed by a mighty blow from Rajaat, the self proclaimed god-king Tectuktitlay left the world without an heir, and only his templars, who suddenly made telepathic links to the king asking for spells and got no reply fully realized what had happened. They knew their king was going to fight some titanic battle, but not where to squarely place the blame. There would be plenty of time to point the finger, they observed, for what time they lacked was in making things stable once more.</p>\n<p dir=\"ltr\">The Moon Priests feared that without a king Draj would fall into a state similar to nearby Raam. While Raam’s condition was caused mainly by the chaos and rebellion lurking within, Draj remained the one state whose citizens were all but totally loyal, although such a tragedy as the loss of a god helped justify their wild concerns. They knew without their powers they could do nothing, but soon fell back on a role they’d developed over the centuries- the beuracrats.</p>\n<p dir=\"ltr\">They gathered Ixtabai the Blind and the rest of the House of the Mind, who, without their teacher, would soon learn the truth. They sought an arrangement, one to keep the city together and flourishing and increase the political strength of both sides in the process. Ixtabai’s council was wise, he suggested that the only way to fill the loss that losing a god would bring would be to have another god fill it, and thus they mad plan began...</p>\n<p dir=\"ltr\">They sought to place a normal teenager on the throne and claim him to be the son of Tectuktitlay, and therefore the new god of his father’s place. They took the steps, bringing the rumors to pass to the people, making a delicate illusion to hide the boy’s nature, altering his mind and those of the other young who knew him, and finally placing him upon the throne of Two Moon City’s pyramid. Strangely enough their plan worked with, what at first, seemed to be no negative ramifications. In fact they had control and power over the city like never before, but only time will tell if this illusion can truly keep Draj together, for recent problems have cut the illusion to the quick.</p>\n<p dir=\"ltr\">POLITICS up</p>\n<p dir=\"ltr\">Draj is supposedly ruled by Atzutek (Male Human/6th Level Psionicist NG), but he is usually no more than a puppet, being manipulated to bring about what Supreme Moon Priest Galthir (Male Human/13th Level Templar LE), or more often what Ixtabai the Blind (Male Human/12th Level Psionicist LN) want. It should not be mistaken that the boy retains no free will, however, only that Ixtabai can easily take control and parade him about, literally puppeteering him before the masses. When his control is not exerted, however, the boy shows a fiery will, the will of the god he truly thinks he is, this has caused several problems.</p>\n<p dir=\"ltr\">On many occasions he has spoken out to the city-state, demanding retribution for his father’s death. The people, already having been convinced to make sacrifices to help appease Tect’s spirit and stop the fearful Tyr-Storms, are willing to do anything he asks to accomplish this. Atzetuk has proclaimed (Wrongly) that Hamanu, coined by many to also be a god of war, ambushed their former king so that he could rein supreme as the only god of war. The populace is in outrage because of this, and is more than ready to lead an all-out attack with aims of completely obliterating Urik. The city’s true rulers are trying desperately to reverse this without destroying their work to control Atzetuk, as they want no war with the Lion King of Urik. They have been constantly trying to dissuade the king from this and point him to nearby, and defenseless, Raam, but he has not listened. This has created a mixed blessing, while it saves Raam from further destruction it may bring about a clash of Urik and Draj, a war that would be outdone only by the great Cleansing Wars in sheer magnitude.</p>\n<p dir=\"ltr\">Generally speaking the populace is owned by its leaders. The people are far more obedient, even to their new king, than could be hoped for. This is mostly due to the rituals and beliefs, as well as the strict warrior’s code intact in the city for all time.</p>\n<p dir=\"ltr\">Other than the king and his \"Friends\", the only other ruling body is the nobles. They meet in the Tecpans regularly to make decisions for the city deemed unworthy of the god-king’s council. They are held fast by their loyalties to the king, and the great council of warriors will, like the whole city, blindly follow him into anything.</p>\n<p dir=\"ltr\">ARMED FORCES up</p>\n<p dir=\"ltr\">Assorted Race Infantry- 5,000</p>\n<p dir=\"ltr\">Assorted Race Cavalries- 1,000</p>\n<p dir=\"ltr\">War Chariots, Light- 200</p>\n<p dir=\"ltr\">War Chariots, Heavy- 200</p>\n<p dir=\"ltr\">Various Mekillot Driven War Engines- 50</p>\n<p dir=\"ltr\">Psionicists- 250</p>\n<p dir=\"ltr\">Thri-Kreen Mercenary Clans- 10 Clans</p>\n<p dir=\"ltr\">Above is the standing army of Draj. The Draji maintain this army at all times, stored within their city’s walls. The kreen are an exception to this, and generally hunt outside the city in times of peace. In addition to this force House Tsalaxa has been known to support their militant endeavors in recent years with several thousand soldiers in order to gain better status with the king, who is otherwise often displeased by them. Although it is Drajian tradition to allow Tect’s Chosen alone to feel the glory of the victory, any battles met in the desert will often find the Draji alongside Belgoi, Thri-Kreen, Braxat and worse. If a war is going particularly badly they will also take a large portion of the city’s slaves into battle, though they are used mainly as fodder.</p>\n<p dir=\"ltr\">The current commander of the army is Chilocotec (Male Mul/13th Level Fighter LE), with his three generals in order of rank: Leader of the Guard, Cilocely (Female Human/11th/6th Level Dual-Classed Fighter/Psionicist LN), General of the War Engines, Tececult (Male Dwarf/12th Level Fighter LN) and former High Templar, Maxlixoco (Male Human/15th Level Templar LE).</p>\n<p dir=\"ltr\">The Drajian army uses reckless tactics at best, charging forward en masse and hoping to crush opponents underfoot. The things the army has not lost over time are its ferocity, savagery and mercilessness. These traits of the army will be stronger than ever do to their thirst for blood to avenge their mighty god’s unfair death. The army once made powerful raids, taking those items they needed and many slaves but leaving the city intact, but it is unlikely in this time of troubles that their victims will be so lucky. They plan to sacrifice every last citizen of Urik to Tectuktitlay’s spirit, a task that may bring about a devastating war.</p>\n<p dir=\"ltr\">Almost every citizen is a warrior, and those that aren’t are artisans who can usually be used in making the weapons, armor and war machines needed. Their fearful lead of Mekillots has become legendary for its power, and often they run with the Mekillots keeping most of the troops and the chariots and cavalries moving alongside to insure the weak bottom is safe. The Psionicists work to control the powerful beasts and to make attacks from their protection. 90% of the Psionicists are Telekinetics with 5% Metabolists, 3% Telepaths and small numbers of Clairsentients and Pyschoportives.</p>\n<p dir=\"ltr\">Thanks to the huge Tlacochcalco armory the troops of Atzetuk are notoriously well armed. The number of steel weapons and armor pieces used by the army and stored in the army actually constitutes much of the treasury. It is rare, but they may sell a bit of this well-polished steel that is of noticeably greater quality than the average on Athas to pay off an enormous debt or to pay for some grand building. The number of troops armed with these weapons fluctuates as to how many are distributed for the attack. No one knows how many weapons are in the Tlacochcalco, but they estimate over 5,000. This huge bank of weapons is rarely opened, but some speculate troops so well armed may be the decisive factor should the two great armies clash.</p>\n<p dir=\"ltr\">PEOPLE up</p>\n<p dir=\"ltr\">Population- 15,000</p>\n<p dir=\"ltr\">Slaves- 8,000</p>\n<p dir=\"ltr\">Warriors (25% of which don’t spend ALL their time training, the rest are strictly militant)- 6,000</p>\n<p dir=\"ltr\">Freeman- 1,000</p>\n<p dir=\"ltr\">Racial Percentiles- 70% Human, 7% Dwarf, 7% Mul, 6% Elf, 5% Half-Elf, 4% Half-Giant and fractions of Thri-Kreen and Halflings.</p>\n<p dir=\"ltr\">The people of Draj are fanatically loyal, save for the few living rogues, mages and those that were not born to the city. The problem is only the Veiled Alliance has managed to stand as an organization for long amid the hard-law city, and even it has failed to truly accomplish anything. Tect ruled supreme, and no one questioned him, and Atzetuk is no different. Rebellion is even harder to speak about in this city-state than others, not because the great king denies any hope of success, but because the people simply don’t see the need to break from their ruling system, they LIKE things how they are, save for the lack of war, which their new, and steadily more popular king, has promised will soon change.</p>\n<p dir=\"ltr\">Most all Draj have coppery skin, coal black hair, deep black eyes and completely shaven faces. Facial hair is rarely seen because those in the city simply don’t like it, it’s basically \"Out of style\". Most Draji have broad faces, thin lips and a well-pronounced chin. Slaves are forced to wear breechcloths of white hemp to signify their status, everyone else favors loose, brightly-colored shirts and skirts. All citizens except the juvenile are expected to present themselves in headdresses of some sort, although only warriors are entitled to the right to wear more than one feather. While headdresses are widely varied, usually more extravagant and ostentatious per the wealth of the wearer, the most common kind worn by warriors have an animal appearance. Often the wearer’s head appears to be that of a chosen animal, most commonly the jaguar and the eagle. The few commoners prefer less ferocious looking headgear, and often similarities can be found among those of a particular occupation or financial class.</p>\n<p dir=\"ltr\">The Draji live in huge clans with long extended histories, the eldest member of which rules without question. The eldest are almost always nobles, although sometimes several of the older members will be. Members of the same clan often wear very similar headdress to help others of the clan recognize them. It is most common that any given set of pueblos belongs to a single clan, though poorer clans may share one and in the poorest pueblos there is very little clan distinction. Clans rarely war with each other, but in with the growing tension over the prospective war with Urik many clans have begun to hone their skills on each other.</p>\n<p dir=\"ltr\">The Draji frown on art forms of almost all kinds, and there are very few if any who practice them within the city. The exceptions to this are painting and sculpting, which commands a small amount of respect, but only when the pictures depict war or the great god-king. The Draj also have special prayer-like chants that beseech the spirit of Tect to turn his fury upon their enemies so that they may have the first bolt of war thrown from his spirit’s hand and not a crossbow. They occasionally also pray to Atzetuk, though his popularity is great he does not demand the fear of Tect, and therefore is not as widely prayed to.</p>\n<p dir=\"ltr\">In Draj culture brutality, barbaric and cruelty are a part of life. Everyone respects the traits, and they are not considered to be evil or terrible things. Warriors are expected to show no mercy, to do so is to dishonor themselves. All members of the society respect strength, those without it must take on a profession of weakness and live an honorless life. Warriors reign in Draj, and rogues are at the direct bottom. Those rogues that are not slain by the templars are often killed by complete strangers for the simple fact they are weak.</p>\n<p dir=\"ltr\">The Draj have many rituals and ceremonies, all involving war but the last and newest. Of note are the Flowery Wars, or training wars, that take place twice a year. The warriors prepare with real armor and weapons, stone clubs, for the event. The winners gain glory while the losers are exiled. The other ancient ceremony of note is Guthay’s Hunt, in which the entire city goes back mainly to their ancient roots. All the warriors and most of the citizens don weapon and armor and hunt the nearby desert for any small slave tribes or escaped slave cities, ransacking them and bringing the slaves back into slavery. The new ceremony involving the sacrifice of one-thousand templars of a living sorcerer-king is supposed to appease Tect’s spirit, while smaller and less flagrant ceremonial sacrifices take place throughout the year.</p>\n<p dir=\"ltr\">TRADE AND COMMERCE up</p>\n<p dir=\"ltr\">Major Exports- Hemp, Rice, Wheat and other grains. They export more annually than most any other city-state.</p>\n<p dir=\"ltr\">Major Imports- Obsidian, Iron, Copper, Gold, Livestock and a small number of Slaves.</p>\n<p dir=\"ltr\">Food Sources- Small Livestock and Grains are grown and raised within the city, Crodlu and some kinds of rice are imported.</p>\n<p dir=\"ltr\">Major Merchant Houses- Tsalaxa.</p>\n<p dir=\"ltr\">Small Houses- The Dedys Consortium (Terg, Voyan and Shakktur).</p>\n<p dir=\"ltr\">Major Trade Roads- To Raam and to Eldaarich and Kurn.</p>\n<p dir=\"ltr\">Minor Trade Routes- To Fort Firstwatch and along to Breakshore and across the Silt Sea to Cromlin, linking to Nibenay.</p>\n<p dir=\"ltr\">While the amazingly large amount of foodstuffs produced by Draj has made it a great trading prosepect despite its warlike nature times have grown tougher. The chaos in Raam has effectively cut Draj off from any major trade routes to the Tablelands, despite their efforts to make the Cromlin/Breashore silt shole connection profitable it cannot ferry enough merchandise and is plagued by giants and pirates, as well as the creatures of the Silt Sea. The only bright point in their trading is having utter dominion over the only trade road to the Lost City-States, though both Kurn and Eldaarich are notorious seperationists, making trade there slow at best. The main problem with the Cromlin route is that House Shom has not shown intrest in fully capitalizing on it, making Cromlin and the route both dangerously unstable. With the mercanary bent taken on by Raam’s separate legions simply passing by has become impossible, they raid every outgoing caravan with surprising force. Deals with House M’ke are few and far between, are the house is too intrested in the situation in Raam and has pulled back all true mercantile activities, making trade to them all but non-existent. To summarize the situation Draj is barely turning out what was once a huge profit, and the price of food throughout the Tablelands has soared due to the lack of the once plentiful grains from Draj.</p>\n<p dir=\"ltr\">House Tsalaxa, the violently active house stationed in Draj, has been going through quite a few problems. In adition to the loss of Tablelands trade they have lost Ydris, their leader, and the new leader Yarsha Tsalaxa (Female Human/15th Level Trader LN) hasn’t even finished cementing her position. She has major suspicions about Atzetuk’s true self, but is keeping quiet until she can get solid evidence to back up her boasts. Should the mindbenders become aware of her suspicions it will likely be her end, and another major blow to House Tsalaxa.</p>\n<p dir=\"ltr\">The Dedys Consortium, who delt almost entirely in silk from Kurn shipped back through Breakshore’s sparce route, has been little affected by the loss of Raam. In fact they’ve moved in on a crucial industry, seizing what microscopic amounts of lumber are actaully cut down and exported from Kurn. They deliver the timber to Breakshore for the creation of more Skimmers. Dedys has met with great amounts of success and has all but taken over both Breakshore and Cromlin through slow action. Should they succeed and make a solid route there they will no doubt replace Tsalaxa as the major house of Draj. Right now Dedys’ three joint leaders, Neres Terg (Female Human/9th Level Trader LG), Ambromin Voyan (Male Elf/11th Level Trader LN) and Seluktuka Shakktur (Female Half-Elf/11th/10th Level Trader/Psionicist LN) are biding their time. They are bringing scores of randomly chosen agents into their fold in attempts to keep one step ahead of Tsalaxa House and its assassins.</p>\n<p dir=\"ltr\">THE CITY up</p>\n<p dir=\"ltr\">Emblem- Smoking Mirror, Jaguar, Feathered Serpent and a few other ferocious creatures.</p>\n<p dir=\"ltr\">Unusual Sites- Two Moon City, the walled inner-city containing all administrative compounds, the palace and the House of the Mind. Temple of the Son, the former Father and Master Temple. The palace has been built up to a considerably larger size and re-painted and sculpted with images of the new king. The Temples of Ral and Guthay, the two lavish shrines to Divine Tectuktitlay. The Beastland, the Royal Menagerie. The Royal Jaguar Breeding Pens. The Hempworks. The Golden Moon Gate. The Flower War Field. Structures built since the crowning of Atzetuk include: The Temple of the Silver Cycles, an extravangent new temple built to house the Moon Priests in an even more luxurious setting and the greatly expanded House of the Mind.</p>\n<p dir=\"ltr\">Layout- Draj is almost as big as its nearby neighboor Raam, but most of that space is filled by plots of carefully segregated fields of hemp and grain. These fields extend the entire area of the Mud Flats, from their start at the front gates to their end in the town’s middle section. A large road travels directly between the two sides of this area, which both house nothing but fields and an occasional slave pen. Beyond these the town widens out at the even end to an area twice as wide but half as long filled with the city’s various pueblos. These surround the wall and mud moat that form the barrier between Two Moon City and the rest of Draj. Two Moon City’s front is halfway between the end of the large hemp road and the back wall, and the back of it is against the back wall with each side halfway extended to the side walls. The overall effect of this is that an overhead view of the city-state takes on a distinctly hammer-like shape. Especially since the \"handle\" is filled with the endless fields of green and brown.</p>\n<p dir=\"ltr\">The city-state of Draj is not filled with comfortable homes, even the rich and nobles live in pueblos, albeit bigger ones, with little if any comforts of luxurious life around them. This does not bother them, however, for the Draji take pleasure in only a few things that all the city’s people seem to share. The gladiator games, which are some of, if not the most entertaining around. The fine cuisine of Draj, where slaves eat better than the freeman of most cities simply because the worst food is better than most cities’ foods. The rich and middle classes eat like kings, and nobles and famous warriors eat easily better than them. It is said there is no meal finer than the one set before the leaders of the city-state each night.</p>\n<p dir=\"ltr\">The Draji also have their own calender, one based mostly on cycles of the sun and intrevals of the Messenger Comet. They divide years into sets of 90, a sacred number throughout the city. This is largely due to the Comet’s appearance every 45 years, so they believe that the Comet matches its two to the dual moons on that year. The Draji believe the Comet’s coming to be a time of great joy, for it is a sign from their god, and when it did not appear in the last scheduled time, many predicted (Correctly) that it signalled the death of their god-king (Those that displayed this belief openly were killed, however). In normal cycles the Draji calender has nine decades, each of which holds a name from Drajian Mythology- White Jaguar, Moon, Prince, Red Jaguar, Blood, War, Black Jaguar, Serpent and Mirror. Each set would be counted off like this- Free Year 1 correspondes to White Jaguar 84, the Messenger failed to arrive in Moon 1. The events surrounding the Curelean Storm transpired in Moon 4 and the information herein is most up to date at Moon 5 and beyond. The Comet arives on every 45 and every 1 of the nine-decade count.</p>\n<p dir=\"ltr\">IMPORTANT NPCS up</p>\n<p dir=\"ltr\">Kectkilayt (Male Human/9th Level Fighter NE) is the leader of a special task force known as the 3rd Legion. He is notable for being one of the only Drajians in history to leave the customs, for Kectkilayt is secretly working for a powerful 21st level Dragon and his followers taking up residence in the wastes outside Draj. Because Kect’s unit was often deployed to find a lost temple that only Tect knew existed (The Temple in which the Dragon takes residence, using the powerful spells on it to avoid detection by the other kings).</p>\n<p dir=\"ltr\">Dratoor (Male Elf/7th Level Theif NG) was once a great theif taking up residence in Breakshore. When he went to investigate the ruins of Guistenal Dregoth captured him and replaced his mind with one of a loyal Dray. This Dray is considered LE and is a spy sent by Dregoth to gather information on the changes that have affected the world since he was killed. The Dray has studied Draj and has plans to continue on to Eldaarich and Kurn (Which Dregoth remembers the existence of), but first must find some way of reporting to Dregoth and New Guistenal.</p>\n<p dir=\"ltr\">Selixia of Raam (Female Elf/15th Level Psionicist NG) is a psionicist who fled from the dying city-state of Raam. When she arrived in Draj she learned that studying psionics is illegal except in the House of the Mind, and started her own movement to teach rebels to use psionics in secret, hoping to bring some power to the struggling and tiny side of the rebels.</p>\n<p dir=\"ltr\">Morath Desliz (Male Half-Elf/10th Level Trader CE) is a long time pirate and subsequent trader from the Cromlin area. He has observed the condition of mercantile activities in Draj and has noticed the conflict between Dedys and Tsalaxa, and has used the opportunity to create a small house specializing in contraband, espionage (against government and non-house targets) assassination and other things so strictly forbidden in Draj as to be formerly un capitalized. His house is growing steadily in power despite the utter lack of caravans and routes, mainly because of skillful exploitation of the Tsalaxa/Dedys conflict.</p>\n<p dir=\"ltr\">Fireye (Male Human Defiler/16th Level LE) is one of the few defilers able to stay active in the city-state of Draj. He spends most of his time hunting for the ellusive Veiled Alliance, though he is doomed never to find it as he can’t risk approaching the palace. His reasons for personally hunting the alliance is unknown, but he shows a great amount of zeal in his task.</p>\n<p dir=\"ltr\">Goreg Basputo (Male Half-Giant/12th Level Gladiator N?) is a spy sent by Hamanu (Although Hamanu expected no results from him, it was more of a punishment for a ridiculous blunder) to learn about the state of affairs in Draj. Unfortunately his badly made fake name (His true name is unknown except perhaps by the House of the Mind’s interrogaters) allerted a templar to him, and he was sentenced to death in the gladiator pits. Much to everyone’s surprise he was a skilled fighter and bested one of the city’s most popular fighters, and still there remains. Having forgotten all about his mission because of wild stories told to him he now seeks a chance to visit the \"Land of the Little People\". The lore he has heard of the Jagged Cliffs is surprisingly accurate and he could make a decent guide to them.</p>\n<p dir=\"ltr\">Chimali Zaachila (Female Human/5th Level Preserver LG) is the current leader of the Veiled Alliance, despite recent pressures. In truth Chimali is a master of faking greater magic, in fact she knew no magic when she first came to the Alliance and has since faked being of great power. She knows more about magic than most anyone else there, though her experience with it would lead one away from the fact. She took over the Alliance on the death of its founder, though she is likely to retire soon herself.</p>\n<p dir=\"ltr\">Zagarin Wyax (Male Human/8th Level Defiler NE) is an agent sent by House Wavir to infiltrate and destroy the Veiled Alliance, which has been troubling the Dedys Consortium. He pretends, with incredible effiency, to be a 17th Level Preserver. He is attempted to get himself voted or forced into rulership of the Alliance and Chimali out, and it has turned into an all-out pretender’s battle because of it. The already disorganized Alliance is now split completely in two, and it is suspected that soon these sides will come to open battle.</p>\n<p dir=\"ltr\">ADVENTURE HOOKS up</p>\n<p dir=\"ltr\">The PCs discover the truth behind Atzetuk, but must find the Alliance to inform them. This becomes an increasingly dangerous task, especially when the Moon Priests learn of the PCs and mark them for death.</p>\n<p dir=\"ltr\">The PCs have to stop the two sides of the Alliance from coming to all-out war by exposing Zagarin for what he truly is.</p>\n<p dir=\"ltr\">Fireye finally locates the Alliance by means of ancient tunnels not even the Veil is aware of and spies on them, learning both of the Alliance and the PCs plan to expose Atzetuk. He informs the Moon Priests, and the PCs try to escape the same way Fireye got in, making their way through an ancient underground crypt full of the remains of ancient Drajian Warriors from the Green Age.</p>\n<p dir=\"ltr\">The time has come to parade about the Black Guards, the four obsidian golems that protect the palaces lower layers. In an attempt to deal a real blow to Atzetuk the Alliance makes a plan to destroy the four golems during their deactivation, before they can be recharged. Unfortunately the plot is revealed by an informant in the Alliance, and the day of celibration becomes a battle for survival.</p>\n<p dir=\"ltr\">The PCs are hired to help better establish the shoals between Breakshore and Cromlin, unfortunately Tsalaxa plans on countering this wiht a mixture of sabotague agents, pirate mercaneries and a direct assault at Breakshore.</p>\n<p dir=\"ltr\">Dedys hires the PCs to deliver a message to Tsalaxa under the pretense that it is a request for peace. When the family member of Tsalaxa opens it he finds it is magically enchanted and explodes, killing him, and all that remains is a auditory recording stating that the PCs were behind it all! The players have to avoid both merchant houses and the Moon Priests who are after them for murder.</p>\n<p dir=\"ltr\">Dedys needs a new shipment of lumber from Kurn and they send the PCs on a team to recover it after picking up the shipment they learn they’ve been duped into picking up a shipment that was cut without permission, and Oronis blames them. They have to pleed their case before the Avangion in New Kurn, but after they’re cleared a horrible revalation comes- They’re never going to be allowed to leave! The PCs must do their best to escape the lost paradise of New Kurn without confronting the mighty Avangion Oronis.</p>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>"
