      content: >-
        <p>An eloquent speaker with a gift for cutting to the heart of matters,
        he represents the agricultural workers who were once field slaves. His
        background as a favored gladiator gives him credibility with both the
        arena crowd and rural workers. His speaking ability and practical
        experience make him a natural leader among the freed slaves, though his
        mul heritage also makes him understand the complexity of identity in
        Tyr's new social order.</p>
