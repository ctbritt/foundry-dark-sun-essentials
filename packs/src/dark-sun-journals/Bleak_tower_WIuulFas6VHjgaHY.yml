    text:
      format: 1
      content: "<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">This circular, marble tower rises more than a hundred feet above the surrounding plain. Once, a wooden stairway ascended the interior, but it has long since rotted away.\_</span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">Other than the stairway, the tower remains exactly as it has stood for at least a thousand years. Not a stone has fallen from its walls. From its crown, a magical lantern still casts a macabre green light out over the Sea of Silt.</span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">When the wind stirs up a good dust storm, a loud, painful bellow sounds from the tower at regular intervals. The local natives attribute the roar to the ghost of the tower's lady who, they say, lost her betrothed on such a night long ago, when the Sea of Silt was filled with water.</span></p>"
