        wgCeShTrqHJFBbDr:
          notes: >-
            <p>The Tarnished Cup serves as a hub for Tyr's underground economy.
            Characters can fence stolen goods, purchase hard-to-find items, or
            gather information about criminal activities. Sul's connections to
            both the Iron Rats and illegal slave trading make him a valuable but
            dangerous contact. The devil grass trade adds a poisonous
            element—literally—to any dealings with the shop. His tendency to
            abduct customers for the slave trade makes every visit a potential
            threat.</p>
        lastrolltable: RollTable.FsW3RjVlJd4wi4NY
