      content: "<p>A mountain road wending between high peaks leads\_from the gates of Tyr to a fortified mining camp a\_day’s travel from the walls of that city-state. Three\_guard outposts monitor the road at half-mile intervals. The camp occupies a plateau shelfbeneath a\_sheer cliff that contains the mine face. The plateau is\_crowded with guards, worker barracks, tools, a smelting compound, and heavy equipment.\_The mines snake into the mountain following</p>\n<p>narrow red veins of raw ore. Aside from arsenic poisoning, bad air, and collapses, the workers also face\_hejkin raids from deeper in the tunnels.</p>\n<p>\_</p>\n<p>The Iron Mines of Tyr</p>\n<p>The iron mines of Tyr are the largest of their type in the\_Tablelands. The presence of the ore was one of the\_principal reasons Tyr was established only two days\x92\_travel from the mine. Death has always been associated\_with the mines. Miners die from unexpected cave-ins\_and the natural hazards of the mines. Still others die\_from the \x93hej-kin\x92s curse.\x94\_</p>\n<p>The \x93curse\x94 takes one to three men a month. A\_worker who felt fine the day before may suddenly feel\_weakened. Some days or weeks later, he might suddenly\_keel over dead, a victim of the alleged curse.\_Miners believe ancient hej-kins cursed the caverns,\_but the truth lies locked within the stone itself.</p>\n<p>Unknown to the workers, the ore is of an arsenide\_type. The narrow eighth-of-an-inch red vein is surrounded\_by strata of poisonous arsenic deposits. The\_arsenic penetrates through all the workers\x92 cuts caused\_by working with rock and stone. Undetectable, arsenic\_builds up in the body until achieving lethal dosage. A\_mineworker must make a successful saving throw vs.\_poison once per month or feel the poison\x92s effects. If\_ the saving throw is failed, the victim loses a hit point\_per turn until death occurs. A slow poison spell delays\_the effect, while neutralize poison negates the poison.\_</p>\n<p>A select few of the templars have guessed the ore\x92s\_peril, but keep it a secret under penalty of death. Hiring\_priests to cure the afflicted men would prove much\_too costly, and would reveal the problem to all. Life is\_cheap on Athas, iron is not. Regardless of the danger,\_the red ore represents Tyr\x92s lifeblood as the city\x92s most\_important trading commodity.</p>\n<p>Recently, Urik sought to take advantage of the\_chaos following Kalak\x92s death and seize the mines,\_but Urik\x92s armies were repelled by the gladiator hero,\_Rikus, and his warriors. Although closed for a brief\_time, the mines have reopened and are functioning\_normally again. The temporary closure of this important\_Tyrian asset nearly bankrupted the already-troubled\_city.</p>\n<p>Hej-kin raids have plagued the mines. The subterranean race dwells throughout the natural catacombs\_that riddle the foothills and nearby mountains. The\_hej-kin consider the ground sacred and mount sporadic\_attack against those who defile their homelands.\_Some speculate the opening of the mine was once a\_hej-kin cavern home, although this remains largely\_unproven.\_The mine gouges the foothills of the Ringing Mountains\_north and west of Tyr like an open wound. A single\_narrow mountain road accesses the fortified site.</p>\n<p>Three guard outposts border the road at half-mile intervals\_ from the mines. Each outpost consists of a small\_pair of buildings: One set against the mountainside,\_the other perilously close to the exposed drop. Brambleweed\_walls surround each outpost while the trunk of a\_stout brambletree blocks the road at waist height. The\_trunk lies in an L-shaped slot fitted into each of the two buildings. A combined strength of at least 40 is needed to lift the massive tree trunk from its resting place. As\_one approaches the mines, each guard post contains\_twice as many guards as the last. The smaller, first station\_maintains 10 guards and two \x93runners.\x94 All the\_guards are armed with metal weapons.</p>\n<p>Passing the third gate reveals the mining compound.\_The camp occupies a plateau shelf 550 feet\_wide by 1,000 feet long. The mountainside rises 500\_feet above the plateau, providing a natural barrier\_against attack. Opposite the mountainside loom sharp\_precipices, dropping thousands of feet to the valley\_floor below. The mines\x92 gaping mouth faces the compound\x92s gates. The entrance rises 30 feet high, spans\_65 feet at the base, and is cut in the shape of a dark\_hemisphere against the vertical rock face.\_To the right of the opening is a series of large cages,\_designed to hold erdlu, kank, and heavy crodlu. Erdlu\_occasionally pull small carts, but serve primarily as a\_food source. Kanks are teamed in twos and fours to\_pull ore carts. They are used extensively in the mines,\_especially in areas where the tunnel height slopes to\_under five feet. The honey globules produced by the\_kanks provide additional foodstuffs for the compound.\_</p>\n<p>Heavy crodlu pull the large ore carts.\_Beside the animal pens are a series of bunkhouses,\_originally designed to hold slaves, now modified to\_house paid workers. A row of covered pits, closest to\_the road on the right, were once used as holding cells\_for disobedient slaves. They now confine the more\_dangerous criminals who are sent to the mines as punishment.\_</p>\n<p>To the immediate left of the camp\x92s entrance\_stands the opulent, two-story residence of the templars\_who still oversee the daily operations of the mines.\_Each templar is assigned 25 guards, and remains\_responsible for their actions. The guards share compartmentalized\_sleeping quarters on the ground floor,\_while the templars reside in the lavish apartments\_located on the second story.\_A large building to the left is used for the storage and preparation of food. Positioned between this\_building and the precipice are a huge firepit and cooking\_kilns. Cooks prepare meals for the entire camp,\_templars and workers alike. The orehouse stands closer\_to the center of the compound. This massive, thickwalled,\_square building stores smelted bars of iron\_until they are transported to the city. It is constantly\_guarded on all sides, especially the roof. The smelter\_stands to its left, towards the mines. Fires burn in the\_smelter day and night, separating the iron ore from the\_red rock. Spent tailings (useless rock) are then discarded\_down the mountainside, creating an immense\_rubble field that sprawls 1,000 feet down the steep\_slope. Deep rutted paths connect the ore smelter to the\_mines\x92 entrance. Carts holding raw ore rest in these\_ruts as they await the smelter. There are two sizes of\_carts: The large carts carry a half ton of ore and the\_small carts hold 500 pounds of rock.\_The templars who run the mine hire four types of\_workers: guards, haulers, carriers, and miners. The\_guards\x92 duties are straightforward\x97 they keep tempers\_\_from flaring between workers, monitor all who come\_and go in the complex, and protect the templars. Their\_chief duty, however, is safeguarding the mines and the\_ore. There are never fewer than 200 guards at the\_mines at any time. This is a well paying but difficult\_job, as no amount of bribery can secure a position as\_guard; they are strictly hand-picked by Borger, Minister\_of Mines.\_</p>\n<p>Haulers work with the various beasts, bringing cartload\_after cartload of raw ore from deep within the\_mountains. It is their job to work the creatures tirelessly\_and maintain a steady flow of raw materials to the\_smelters. Because of the expertise needed for the job\_(nonweapon proficiency: beast handler) a hauler can\_expect to receive up to a silver a week for his work.\_</p>\n<p>Carriers have the backbreaking task of bringing the\_ore-bearing rocks to the carts of the haulers. They collect\_loose ore into coarse, woven bags of giants\x92 hair to\_be carried or dragged to the ore carts. This job is often\_assigned to criminals serving out sentences in the\_mines. The pay for noncriminals is two ceramic bits a\_day plus room and board.\_</p>\n<p>Miners perform the dangerous job of loosening the\_ore from the reddish rocks. Few of the veins are large or\_easy to mine. Most appear as eighth-of-an-inch narrow\_bands in the rock. Newer excavations are always the\_most dangerous. As the miners delve deeper into the\_ore vein, the composition of the overhanging rock can\_change. Problems occur when the rock above the ore is\_softer than the surrounding stone. This formation will\_not support its own weight, and frequently collapses,\_causing cave-ins. Miners receive extra compensation\_for working in the newer digs. Tyrian miners prefer\_picks, hammers, or large two-person gouges for their\_work. Miners who work the new digs receive up to five\_ceramic bits a day, while other miners receive one to\_three bits per day.</p>\n<p>When sufficient ore has been smelted, the mining\_templars send word to Tyr, and a heavily armed Royal\_Caravan travels to the mines to retrieve the ingots. No\_one has ever successfully raided a Royal Caravan\_transporting iron. Fear of Kalak\x92s retribution helped\_prevent raids in the past. At the present time, under\_the reign of Tithian, the caravan\x92s guard will be even\_more formidable due to the Tyrian king\x92s lack of spellcasting\_abilities.</p>\n<p>Role-playing Note: Care must be taken if a group of player characters decides to attempt an assault on the Royal Iron Caravan. Not only will the caravan be heavily guarded by warriors, but psionicists and a hired priest or two will be along as well. Should the player characters be successful, great care should be taken in\_consideration and explanation of the social, political,\_and economic ramifications the theft would cause.\_The loss of the precious shipment would almost certainly\_push Tyr closer to economic collapse. An influx of large amounts of raw iron could easily cause the collapse\_of any smaller local economy. King Tithian and\_the Council of Advisers would have no alternative but\_to send Tyr\x92s militia after the thieves. In addition, none\_of the member groups in Tyr would attempt or approve\_such a theft due to the backlash against their organizations.\_If the PCs attempt to sell the iron in another\_city-state, the reigning sorcerer-king or queen would\_confiscate the material and put the thieves to death to\_insure that Tyr would not assume conspiracy and withhold\_future shipments to the city-state.\_</p>\n<p>The mines offer ample opportunities for characters\_to meet an early end. Each day there is a 1 in 20\_chance of an unusual event happening at the mine. If\_an event occurs, roll on the table below:</p>\n<p>Iron Mine Random Accident Table</p>\n<p>Roll</p>\n<p>1d10\_ \_Result</p>\n<p>1-2\_ \_ \_Cave-in: PCs are trapped. 4d10 damage falling rock, halved if Dexterity check is made.\_</p>\n<p>3\_ \_ \_ \_ \_Cast out: PCs are thrown out of the mines for an\_indiscretion, and face crossing the desert without\_food or water. Tyr, the nearest city is over two days\_away. See the DARK SUN® boxed set for rules on\_dehydration.</p>\n<p>4\_ \_ \_ \_ \_Mad kank: Creature goes berserk for unknown reason and attacks PCs (1d6 damage per attack).</p>\n<p>5\_ \_ \_ \_ \_Fight: Tempers flare within the mine. The fight escalates\_to include PCs and 3d4 NPC combatants, 1st-3rd level warriors.</p>\n<p>6-7\_ \_ \_Accident: An ore cart may break away from its harness,\_a bag of ore might fall on a character, loose rock\_might fall, etc.</p>\n<p>8\_ \_ \_ \_ \_Natural cavern discovered: Miners strike a natural cavern and the PCs are sent in to explore.</p>\n<p>9\_ \_ \_ \_Spy discovered</p>\n<p>10\_ \_ \_Spy discovered: An agent for one of the other citystates\_is attempting to map the iron mines for possible\_attack or sabotage. The spy may attempt to trick or\_coerce the characters into assisting him or her in some\_way.</p>\n<p>\_</p>\n<p>BATTLESYSTEM\x99 Units</p>\n<p>The Royal Iron Caravan never travels with the same\_defensive configuration twice. This is to keep raiders\_ off balance. The caravan will always contain the followingplus additional troops:</p>\n<p>(1) Templar Overseer, (1) Templar Centurion, (4)\_Heavy Charioteers, (6) Light Charioteers, (1-2) Clerics\_of 9-12th level, (1-3) Psionicists of 8-12th level,\_Medium Kank or Crodlu Cavalry, Templar Heavy\_Infantry, and Templar Archer Brigade.\_</p>\n<p>Additional water wagons are always taken as part of\_the baggage supply train. A week before traveling to\_the mines, the troops begin preparation for the trip\_with additional drills and attack formation practice.\_(Additional information on individual units may be\_</p>\n<p>found in the Dragon Kings supplement.)</p>\n<p>\_</p>\n<p><img src=\"data:image/png;base64,\" width=\"1103\" height=\"1223\" /></p>"
