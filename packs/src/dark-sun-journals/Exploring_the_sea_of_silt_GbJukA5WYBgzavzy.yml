      content: "<p>“The slightest breeze stirs up a silvery pall of dust that\_clings to the surface like afog. It becomes impossible to tell\_where the silt-laden air ends and the dustbed begins. When\_the wind blows more strongly, as it often does, the Sea of\_Silt becomes a boiling cloud ofdust, the edges tinged with\_crimson sunlight. On such a day, a traveler near the sea\_cannot see more than a few feet in any direction. The dust\_coats his clothes, his face, the inside of his nose, and even\_his lungs. He cannot see the ground or the sky, and when\_he walks, his feet drag through inches of thick silt. He grows\_disoriented, and it becomes an easy matter for him to\_wander into the sea and disappear forever.”</p>\n<p>—The Wanderer’s Journal</p>\n<hr />\n<p>The Sea of Silt is a great dust sink that extends for\_hundreds, perhaps thousands, of miles eastward from\_the shores of the Tyr Region. Long ago it was a great\_sea of water, vast and deep, but now the shore slopes\_down to meet what looks like an endless plain of gray\_dust. On a calm day, it seems that one could walk out\_onto the plain as if it were fine sand, but the silt is\_too light to support a human’s weight and too deep to\_wade for any distance. The Sea of Silt is an impossible\_barrier to travel, passable only along its margins by\_silt skimmers or waders that remain in shallow dust.\_</p>\n<p>In addition to natural hazards, those who brave\_the sea must contend with the monstrous creatures\_that dwell in and around the silt. Tentacled silt horrors prowl the deeps, and giants roam the shallows,\_walking on secret roads only they know. Even the\_islands in the Sea of Silt offer as much peril as safe\_haven. Their isolated locations make them ideal\_hideouts for unscrupulous types who don’t want their\_activities to be observed, and the austerity of life on\_the islands turns many inhabitants to savagery.\_Like the Ringing Mountains to the west and the\_Southern Wastes to the south, the Sea of Silt forms\_one of the borders of the Tyr Region. For most people,\_the sea effectively marks the end of the world; no traveler has crossed its emptiness and returned to tell the\_tale. Attempts to circumnavigate the silt are likewise\_perilous—far to the north, a traveler faces impassable\_fjords and chains of active volcanoes that bar the\_way. To the south, the traveler ventures into desolate\_regions of salt flats and sandy wastes, bereft of life or\_shelter. In that direction, the sea appears to continue\_for thousands of miles without narrowing or coming\_to an end. It is a daunting barrier, to say the least.</p>\n<p>\_</p>\n<p>THE NATURE OF THE SILT</p>\n<p>The Sea of Silt is a curious phenomenon. Once an ocean, it\_is now filled with fine gray powder as dry as sun-parched\_bone. No one can explain why the silt persists instead of\_blowing away or slowly compacting into a firm gray plain—it’s not natural for dust to behave in such a manner. Many\_Athasians assume that some dreadful magic transformed\_the seas to dust long ago, and they’re not far from the\_mark. The Sea of Silt is a vast elemental intrusion into\_Athas, a region in which a great elemental power has\_subtly altered natural law, balancing air, earth, and water\_in a deviant fashion. In the Sea of Silt, dust coalesces and\_refuses to compact under its own weight. It remains light\_enough to rise in a wind-whipped haze that can cover\_nearby lands with fine gray grit, yet it trickles back down in\_time to rejoin the larger sea. Even if the silt blows into dust\_sinks many miles away, it retains these strange properties.</p>\n<p>\_</p>\n<p>EXPLORING THE\_SEA OF SILT</p>\n<p>Much oft he Sea of Silt remains unexplored and unknown due to its sheer inaccessibility. Except for a few well-charted shoals, the largest silt skimmer can venture only a mile or two from shore. (Anyone who wants to venture farther out needs a means of flying or levitating.) Worse yet, long voyages up or down the coast offer little profit. Most ofthe reachable islands and mudflats are largely barren, and as far as anyone knows nothing but blasted wasteland, possibly teeming with flesh-eating monsters, awaits the bolder travelers.</p>\n<p>Experienced silt travelers know that the greatest\_danger of the sea is not monsters, raiders, or drowning it is the insidious “disease” known as the Gray\_Death. When the hot, dry sirocco rises, it kicks up\_the top layer of fine gray powder and holds it aloft in\_a vast cloud. As creatures breathe this airborne dust,\_the moisture in their lungs and throat causes the silt\_to clump; a human can suffocate in a matter of hours.</p>\n<p>The surest protection against the Gray Death is to\_cover one’s mouth and nose with a wet piece of silk or\_similar fine cloth.</p>"
