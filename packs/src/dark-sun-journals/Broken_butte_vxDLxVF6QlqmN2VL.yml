    text:
      format: 1
      content: "<p>The Broken Butte: A mazelike system of canyons\_and ravines gouges the flanks of this great hill of\_black stone on the edge of the Beastbarrens. Broken\_Butte is home to a large tribe of minotaurs known to\_have an appetite for raw flesh. The savage minotaurs\_seek to drive travelers into the canyons, then harry\_the victims until they are thoroughly lost—at which\_point the beasts descend upon the victims and devour\_them.\_ The tribe sends its fiercest warriors into the\_wastes to undergo physical transformations, viewing\_the changes suffered by the champions as the marks\_of a mad god’s favor.</p>"
