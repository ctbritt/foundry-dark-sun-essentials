    text:
      format: 1
      content: >-
        <p>Banther embodies the contradiction of Tyr's new order—a templar who
        genuinely embraces the city's transformation while maintaining his love
        for combat. Unlike most templars who prefer verbal sparring to physical
        confrontation, Banther secretly participates in arena matches under a
        mask to avoid recognition. He allied himself with Tithian early and sees
        his appointment as arena manager as the pinnacle of his career so far.
        His enthusiasm for the games and understanding of gladiatorial culture
        makes him an invaluable contact for understanding Tyr's most popular
        entertainment. He genuinely believes the arena can evolve from a place
        of death into one of skill and honor, making him more progressive than
        many of his templar colleagues while still maintaining the spectacle
        that keeps the populace satisfied.</p>
