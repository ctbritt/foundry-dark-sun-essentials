      content: >-
        <p>The main trade hub in Tyr is Iron Square, where Caravan Way meets the
        base of the ziggurat. Here the great merchant houses have their
        fortified emporiums.</p>

        <p>Emporiums fronting Iron Square include the following.</p>

        <p><strong>House Vordon</strong>: Headquartered in Tyr, House Vordon is
        the region's primary iron trader. Trade Goods: iron, weapons, artwork,
        textiles, and salves (outside Tyr). Emblem: a black diamond.</p>

        <p><strong>House Wavir</strong>: Based in Balic, this house has good
        relations with the reigning government of Tyr. Trade Goods: grain,
        ceramics, precious metals, hardwood, gems, and exotic animals. Emblem: a
        silver crodlu.</p>

        <p><strong>House Shorn</strong>: Based in Nibenay, Shorn suffers from
        decadence and corruption. Trade Goods: obsidian, water, wood, art, and
        weapons. Emblem: three white dragonflies.</p>

        <p><strong>House Tsalaxa</strong>: Based in Draj, House Tsalaxa is known
        for blackmail, espionage, and assassination. Trade Goods: rope, grain,
        and "recovered" stolen cargo. Emblem: two glaring, bestial eyes.</p>

        <p><strong>House Stel</strong>: Based in Urik, Stel is openly
        militaristic and hostile to lesser houses that it targets for
        acquisition. Trade Goods: slaves (outside Tyr), weapons, hardwood,
        feathers, and hostages for ransom. Emblem: crossed black scimitars.</p>

        <p><strong>House M'ke</strong>: Based in Raam, House M'ke fights to
        protect its trade routes and outposts from attacks and runs of "bad
        luck" orchestrated by Tsalaxa or Stel. Trade Goods: nuts, spices, and
        glassware. Emblem: a silver quill pen.</p>

        <p><strong>House Ianto</strong>: A small Tyrian house formerly engaged
        exclusively in the slave trade, Ianto is attempting to relaunch its
        business through speculative cargos. Trade Goods: none right now.
        Emblem: a green mix</p>
