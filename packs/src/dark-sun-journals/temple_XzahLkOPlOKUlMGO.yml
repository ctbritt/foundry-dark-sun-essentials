      content: "<p>Setup. The temple is at locanon Text on the map of the Ruins of</p>\n<p>Yaramuke. Have the players turn to the Player\x92s Book, page 48\x97</p>\n<p>Temple, after they discover the entrance to the temple\x92s basement.</p>\n<p>\x93Though little remains of this place save crumbled masonry</p>\n<p>and shards of fired clay bricks, a sense of pleasant warmth seems to</p>\n<p>rise from the ruins. If there was ever a hope of better times for the people of Athas, its</p>\n<p>secrets once rested here. Perhaps some still do.\x94</p>\n<p>Encounter. This pile of rubble and wreckage was once the foremost Temple of Earth in</p>\n<p>the Tyr region. All that remains of the place now is its cramped basement quarters. Characters</p>\n<p>must spend a good deal of time digging through the masonry rubble and crumbled</p>\n<p>clay to discover the entrance. If they start at the south end of the ruins, it takes one hour to</p>\n<p>clear away the basement entrance; otherwise the job requires four hours. Half-giants</p>\n<p>reduce this time by 20 minutes per half-giant. Areas numbered on the map of the temple</p>\n<p>are described below.</p>\n<p>Room 1\x97Fountain: This room protects a simple stone fountain that is, amazingly, still</p>\n<p>filled with stale water. Though not fresh, the water is safe to drink.</p>\n<p>Room 2\x97Cloak Room: Hanging on pegs here are three robes, each old and moldy</p>\n<p>and inscribed with the symbol of earth (a flat line with a blue orb above). The robes have</p>\n<p>no magical properties and are covered with a thick layer of dust.</p>\n<p>Room 3\x97Workroom: Priests and preservers once exchanged ideas and information</p>\n<p>here, benefiting from one another\x92s knowledge. All that remains now are six corpses clad</p>\n<p>in robes like those found in the cloak room. Searching the corpses reveals a single bronze</p>\n<p>key as well as several pendants inscribed with the earth symbol. The key opens the door to</p>\n<p>the Chamber of the Eye.</p>\n<p>Room 4\x97Chamber of the Eye: The Earth\x92s Eye (see 2H\x97 Eye and Orb) rests atop the</p>\n<p>simple altar here. Unfortunately, guarding the Eye is a dwarf banshee. The Eye looks like</p>\n<p>an eyeball, complete with iris and pupil, although the white of the eye is inlaid with pictograms</p>\n<p>of mountains, gorges, and other earthen wonders. In life, this dwarf\x92s focus was to</p>\n<p>place the Eye in its socket</p>\n<p>\x97a chamber in the now-fallen tower oft his temple \x97in a yearly</p>\n<p>ceremony.The dwarf was denied this mission by Hamanu.</p>\n<div class=\"section-left\" style=\"box-sizing:border-box;color:#212529;font-family:'Noto Sans', 'Myriad Pro', Calibri, Helvetica, Arial, sans-serif;font-size:12.5px\">\n<div class=\"creature-heading\" style=\"box-sizing:border-box;margin:0px 0px 10px\">\n<h1 id=\"monster-name\" style=\"box-sizing:border-box;margin-top:10px;margin-bottom:0px;font-weight:bold;line-height:1.2em;font-size:21px;font-family:'Libre Baskerville', Lora, 'Calisto MT', 'Bookman Old Style', Bookman, 'Goudy Old Style', Garamond, 'Hoefler Text', 'Bitstream Charter', Georgia, serif;color:#922610;letter-spacing:1px;font-variant-numeric:normal;font-variant-east-asian:normal;font-variant-caps:small-caps\">Banshee, Dwarven</h1>\n<h2 id=\"monster-type\" style=\"box-sizing:border-box;margin-bottom:0px;line-height:1.2em;font-size:12px;font-style:italic\">Medium humanoid (Undead), Lawful evil</h2>\n</div>\n<div class=\"top-stats\" style=\"box-sizing:border-box;margin:0px 0px 10px\">\n<div class=\"property-line first\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em;margin:8px 0px 0px\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Armor Class</h4>\n\_\n<p id=\"armor-class\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">19 (natural armor)</p>\n</div>\n<div class=\"property-line\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Hit Points</h4>\n\_\n<p id=\"hit-points\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">26 (4d8 + 8)</p>\n</div>\n<div class=\"property-line last\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em;margin:0px 0px 10px\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Speed</h4>\n\_\n<p id=\"speed\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">25 ft.</p>\n</div>\n<div class=\"scores\" style=\"box-sizing:border-box;text-align:center;color:#922610\">\n<div class=\"scores-strength\" style=\"box-sizing:border-box;display:inline-block;vertical-align:middle;width:58.8958px;min-width:40px;font-size:12px;line-height:1em\">\n<h4 style=\"box-sizing:border-box;margin-top:10px;margin-bottom:2px;font-weight:bold;line-height:1.2em;font-size:14px;text-transform:uppercase;color:#7a200d\">STR</h4>\n<p id=\"strpts\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:10px;line-height:1.2em\">30 (+10)</p>\n</div>\n\_\n<div class=\"scores-dexterity\" style=\"box-sizing:border-box;display:inline-block;vertical-align:middle;width:58.8958px;min-width:40px;font-size:12px;line-height:1em\">\n<h4 style=\"box-sizing:border-box;margin-top:10px;margin-bottom:2px;font-weight:bold;line-height:1.2em;font-size:14px;text-transform:uppercase;color:#7a200d\">DEX</h4>\n<p id=\"dexpts\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:10px;line-height:1.2em\">10 (+0)</p>\n</div>\n\_\n<div class=\"scores-constitution\" style=\"box-sizing:border-box;display:inline-block;vertical-align:middle;width:58.8958px;min-width:40px;font-size:12px;line-height:1em\">\n<h4 style=\"box-sizing:border-box;margin-top:10px;margin-bottom:2px;font-weight:bold;line-height:1.2em;font-size:14px;text-transform:uppercase;color:#7a200d\">CON</h4>\n<p id=\"conpts\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:10px;line-height:1.2em\">14 (+2)</p>\n</div>\n\_\n<div class=\"scores-intelligence\" style=\"box-sizing:border-box;display:inline-block;vertical-align:middle;width:58.8958px;min-width:40px;font-size:12px;line-height:1em\">\n<h4 style=\"box-sizing:border-box;margin-top:10px;margin-bottom:2px;font-weight:bold;line-height:1.2em;font-size:14px;text-transform:uppercase;color:#7a200d\">INT</h4>\n<p id=\"intpts\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:10px;line-height:1.2em\">10 (+0)</p>\n</div>\n\_\n<div class=\"scores-wisdom\" style=\"box-sizing:border-box;display:inline-block;vertical-align:middle;width:58.8958px;min-width:40px;font-size:12px;line-height:1em\">\n<h4 style=\"box-sizing:border-box;margin-top:10px;margin-bottom:2px;font-weight:bold;line-height:1.2em;font-size:14px;text-transform:uppercase;color:#7a200d\">WIS</h4>\n<p id=\"wispts\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:10px;line-height:1.2em\">10 (+0)</p>\n</div>\n\_\n<div class=\"scores-charisma\" style=\"box-sizing:border-box;display:inline-block;vertical-align:middle;width:58.8958px;min-width:40px;font-size:12px;line-height:1em\">\n<h4 style=\"box-sizing:border-box;margin-top:10px;margin-bottom:2px;font-weight:bold;line-height:1.2em;font-size:14px;text-transform:uppercase;color:#7a200d\">CHA</h4>\n<p id=\"chapts\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:10px;line-height:1.2em\">10 (+0)</p>\n</div>\n</div>\n<div id=\"properties-list\" style=\"box-sizing:border-box\">\n<div class=\"property-line first\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em;margin:8px 0px 0px\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Damage Resistances</h4>\n\_\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">\_</p>\n</div>\n</div>\n<div class=\"property-line\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Condition Immunities</h4>\n\_\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">charmed, exhaustion, frightened, poisoned, unconscious</p>\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">\_</p>\n</div>\n</div>\n<div class=\"property-line\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Senses</h4>\n\_\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">darkvision 20 ft., passive Perception 10</p>\n</div>\n</div>\n<div class=\"property-line\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Languages</h4>\n\_\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">Dwarvish</p>\n</div>\n</div>\n</div>\n<div id=\"challenge-rating-line\" class=\"property-line last\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em;margin:0px 0px 10px\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Challenge</h4>\n\_\n<p id=\"challenge-rating\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">4 (1,100 XP)</p>\n</div>\n</div>\n<div class=\"actions\" style=\"box-sizing:border-box;margin:0px\">\n<div id=\"traits-list-left\" style=\"box-sizing:border-box\"></div>\n</div>\n</div>\n<div class=\"section-right\" style=\"box-sizing:border-box;color:#212529;font-family:'Noto Sans', 'Myriad Pro', Calibri, Helvetica, Arial, sans-serif;font-size:12.5px\">\n<div class=\"actions\" style=\"box-sizing:border-box;margin:0px\">\n<div id=\"traits-list-right\" style=\"box-sizing:border-box\">\n<h3 style=\"box-sizing:border-box;margin-top:20px;margin-bottom:0px;line-height:1.2;font-size:21px;border-bottom:2px solid #7a200d;color:#7a200d;font-variant-numeric:normal;font-variant-east-asian:normal;font-variant-caps:small-caps;letter-spacing:1px;padding-bottom:10px;text-indent:5px\">Actions</h3>\n<div class=\"property-block\" style=\"box-sizing:border-box;padding:10px 2px 0px\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;font-style:italic\">Punch.</h4>\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;line-height:1.2em;display:inline\"><em style=\"box-sizing:border-box\">\_+12 to hit, reach 5 ft., one target.\_</em>Hit:+10 [10] Bludgeoning damage.</p>\n</div>\n</div>\n<div class=\"property-block\" style=\"box-sizing:border-box;padding:10px 2px 0px\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;font-style:italic\">Weapon.</h4>\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;line-height:1.2em;display:inline\">\_<em style=\"box-sizing:border-box\">Obsidian Mace:</em>\_+10 to hit, reach 5 ft., one target.\_<em style=\"box-sizing:border-box\">Hit:</em>1d6+10 damage.</p>\n</div>\n</div>\n</div>\n</div>\n</div>\n<p>\_</p>\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;font-size:12.5px;line-height:1.2em;font-family:'Noto Sans', 'Myriad Pro', Calibri, Helvetica, Arial, sans-serif;text-indent:-12.5px;background-color:#fdf1dc\">\_</p>\n<div class=\"section-left\" style=\"box-sizing:border-box;color:#212529;font-family:'Noto Sans', 'Myriad Pro', Calibri, Helvetica, Arial, sans-serif;font-size:12.5px\">\n<div class=\"creature-heading\" style=\"box-sizing:border-box;margin:0px 0px 10px\">\n<h1 id=\"monster-name\" style=\"box-sizing:border-box;margin-top:10px;margin-bottom:0px;font-weight:bold;line-height:1.2em;font-size:21px;font-family:'Libre Baskerville', Lora, 'Calisto MT', 'Bookman Old Style', Bookman, 'Goudy Old Style', Garamond, 'Hoefler Text', 'Bitstream Charter', Georgia, serif;color:#922610;letter-spacing:1px;font-variant-numeric:normal;font-variant-east-asian:normal;font-variant-caps:small-caps\">Banshee, Dwarven</h1>\n<h2 id=\"monster-type\" style=\"box-sizing:border-box;margin-bottom:0px;line-height:1.2em;font-size:12px;font-style:italic\">Medium humanoid (Undead), Lawful evil</h2>\n</div>\n<div class=\"top-stats\" style=\"box-sizing:border-box;margin:0px 0px 10px\">\n<div class=\"property-line first\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em;margin:8px 0px 0px\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Armor Class</h4>\n\_\n<p id=\"armor-class\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">19 (natural armor)</p>\n</div>\n<div class=\"property-line\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Hit 