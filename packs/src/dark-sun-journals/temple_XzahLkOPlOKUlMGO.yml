order-box;margin-top:0px;margin-bottom:10px;line-height:1.2em\">14 (+2)</p>\n</div>\n\_\n<div class=\"scores-intelligence\" style=\"box-sizing:border-box;display:inline-block;vertical-align:middle;width:58.8958px;min-width:40px;font-size:12px;line-height:1em\">\n<h4 style=\"box-sizing:border-box;margin-top:10px;margin-bottom:2px;font-weight:bold;line-height:1.2em;font-size:14px;text-transform:uppercase;color:#7a200d\">INT</h4>\n<p id=\"intpts\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:10px;line-height:1.2em\">10 (+0)</p>\n</div>\n\_\n<div class=\"scores-wisdom\" style=\"box-sizing:border-box;display:inline-block;vertical-align:middle;width:58.8958px;min-width:40px;font-size:12px;line-height:1em\">\n<h4 style=\"box-sizing:border-box;margin-top:10px;margin-bottom:2px;font-weight:bold;line-height:1.2em;font-size:14px;text-transform:uppercase;color:#7a200d\">WIS</h4>\n<p id=\"wispts\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:10px;line-height:1.2em\">10 (+0)</p>\n</div>\n\_\n<div class=\"scores-charisma\" style=\"box-sizing:border-box;display:inline-block;vertical-align:middle;width:58.8958px;min-width:40px;font-size:12px;line-height:1em\">\n<h4 style=\"box-sizing:border-box;margin-top:10px;margin-bottom:2px;font-weight:bold;line-height:1.2em;font-size:14px;text-transform:uppercase;color:#7a200d\">CHA</h4>\n<p id=\"chapts\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:10px;line-height:1.2em\">10 (+0)</p>\n</div>\n</div>\n<div id=\"properties-list\" style=\"box-sizing:border-box\">\n<div class=\"property-line first\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em;margin:8px 0px 0px\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Damage Vulnerabilities</h4>\n\_\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">Earth based spells</p>\n</div>\n</div>\n<div class=\"property-line\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Damage Resistances</h4>\n\_<span style=\"color:#922610;text-indent:-1em\">Water, air and fire based spells; bludgeoning, piercing, and slashing from nonmagical attacks</span></div>\n</div>\n<div class=\"property-line\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Condition Immunities</h4>\n\_\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">charmed, exhaustion, frightened, poisoned</p>\n</div>\n</div>\n<div class=\"property-line\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Senses</h4>\n\_\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">darkvision 20 ft., passive Perception 10</p>\n</div>\n</div>\n<div class=\"property-line\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Languages</h4>\n\_\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">Dwarvish</p>\n</div>\n</div>\n</div>\n<div id=\"challenge-rating-line\" class=\"property-line last\" style=\"box-sizing:border-box;text-indent:-1em;padding-left:1.1em;line-height:1.4em;margin:0px 0px 10px\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;color:#7a200d\">Challenge</h4>\n\_\n<p id=\"challenge-rating\" style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;display:inline;color:#922610;line-height:1.2em\">4 (1,100 XP)</p>\n</div>\n</div>\n<div class=\"actions\" style=\"box-sizing:border-box;margin:0px\">\n<div id=\"traits-list-left\" style=\"box-sizing:border-box\"></div>\n</div>\n</div>\n<div class=\"section-right\" style=\"box-sizing:border-box;color:#212529;font-family:'Noto Sans', 'Myriad Pro', Calibri, Helvetica, Arial, sans-serif;font-size:12.5px\">\n<div class=\"actions\" style=\"box-sizing:border-box;margin:0px\">\n<div id=\"traits-list-right\" style=\"box-sizing:border-box\">\n<h3 style=\"box-sizing:border-box;margin-top:20px;margin-bottom:0px;line-height:1.2;font-size:21px;border-bottom:2px solid #7a200d;color:#7a200d;font-variant-numeric:normal;font-variant-east-asian:normal;font-variant-caps:small-caps;letter-spacing:1px;padding-bottom:10px;text-indent:5px\">Actions</h3>\n<div class=\"property-block\" style=\"box-sizing:border-box;padding:10px 2px 0px\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;font-style:italic\">Punch.</h4>\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;line-height:1.2em;display:inline\">\_<em style=\"box-sizing:border-box\">Melee Weapon Attack:Punch +12 to hit, reach 5 ft., one target.\_</em>Hit:+10 [10] Bludgeoning damage.</p>\n</div>\n</div>\n<div class=\"property-block\" style=\"box-sizing:border-box;padding:10px 2px 0px\">\n<div style=\"box-sizing:border-box\">\n<h4 style=\"box-sizing:border-box;margin-bottom:0px;font-weight:bold;line-height:1.2em;display:inline;font-style:italic\">Weapon.</h4>\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;line-height:1.2em;display:inline\">\_<em style=\"box-sizing:border-box\">Melee Weapon Attack:</em>\_+10 to hit, reach 5 ft., one target.\_<em style=\"box-sizing:border-box\">Hit:</em>1d6+10 damage.</p>\n<p style=\"box-sizing:border-box;margin-top:0px;margin-bottom:0px;line-height:1.2em;display:inline\"><span style=\"color:#000000;font-family:Signika, sans-serif;font-size:14px\">SA gaze, malediction;</span></p>\n</div>\n<p style=\"color:#000000;font-family:Signika, sans-serif;font-size:14px\">SD steel or +1 or better weapon to hit</p>\n</div>\n</div>\n</div>\n</div>\n<p id=\"h.p_ID_116\" class=\"CDt4Ke zfr3Q\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">The dwarven banshee also gains the ability to <em style=\"box-sizing:border-box\">curse</em> its victim(s). During the day, a dwarven banshee combines its cursed gaze attack with a physical one. If eye contact is made, the victim must make a widom save or fly into a berserker rage (+2 attack and damage bonus, may not leave the fight) for 2d6 rounds. Under rage effects, victims will only attack other party members and never the banshee, regardless if it attacks them or not. If no one else is in the area, a victim of this gaze attack will run for one minute in search of someone to fight before the effect ends. the victim can attampt a new save at the end of each turn to end the effect.</p>\n<p class=\"CDt4Ke zfr3Q\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Once per night, the dwarven banshee also gains the ability to wail a cursed battle cry or malediction. All within earshot must make a widom save DC: 14 or fall into the berserker rage. Each character must make a separate saving throw for each wail or gaze from each dwarven banshee in a given area.</p>\n<p id=\"h.p_ID_118\" class=\"CDt4Ke zfr3Q\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><em style=\"box-sizing:border-box\">Minor restoration</em> negates the effect of the berserker rage on one individual per casting.</p>\n<p>PSI like abilities:</p>\n<p>Turn to shadow for up to 5 rounds</p>\n<p>Double pain: Constitution Save DC: 12 or take 2d6 extra damage from all physical attacks</p>\n<p>\_</p>\n<p>If the PCs do not have any steel or magical weapons and are without a strong psionicist</p>\n<p>and/or mage, do not use this encounter.)</p>\n<p>Next. Characters may continue to explore the ruins. If the characters have found both the</p>\n<p>Eye and the Orb to place them\x82 continue with Encounter 2H\x97 Eye and Orb.</p>"
