      content: >-
        <p>The Chaksa: This ancient shrine sacred to the kreen of the Tyr Region
        lies near the southernmost edge of the Dragon’s Crown. Once, the Chaksa
        resembled a perfectly sculpted thri-kreen head, replete with enormous,
        multifaceted jewels for eyes. Time and vandals have left their marks on
        the shrine. Recently, thri-kreen of one of the Crimson Savanna khanates
        have taken an interest in the old shrine, driving off anyone who comes
        near.</p>
