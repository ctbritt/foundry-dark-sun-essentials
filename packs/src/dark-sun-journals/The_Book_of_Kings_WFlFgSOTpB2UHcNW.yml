    text:
      format: 1
      content: >-
        <img
        src="https://s3.us-east-1.amazonaws.com/rime-of-the-frostmaiden/artwork/dark-sun/book-of-kings.webp"
        /><h2><span style="font-family:Packard Antique Bold">The Rise of
        Defilement</span></h2><p class="initial"><span
        style="font-family:Packard Antique Bold">In the days after the great
        Sundering, when Athas awoke beneath a crimson sky, darkness crept forth
        from the heart of the world.</span></p><p><span
        style="font-family:Packard Antique Bold">In that time arose those who
        would be called Champions, mighty in the ways of magic and
        warfare.</span></p><p><span style="font-family:Packard Antique
        Bold">Chief among them was Rajaat, first among sorcerers, the
        War-Bringer, who had mastered secrets that should have remained
        hidden.</span></p><p><span style="font-family:Packard Antique
        Bold">Ancient beyond reckoning was he, and his knowledge of the arcane
        surpassed all others who had come before.</span></p><p><span
        style="font-family:Packard Antique Bold">He gathered around him a court
        of 12 disciples, and with their fell magics, stripped power from the
        land itself. Where once life clung, now only ash.</span></p><p><span
        style="font-family:Packard Antique Bold">These Champions called
        themselves kings, their hearts hardened by greed, their spirits enslaved
        by the whispering voice of ruin. And thus they would have ruled forever,
        but Rajaat had other plans for them.</span></p><img
        src="https://s3.us-east-1.amazonaws.com/rime-of-the-frostmaiden/artwork/dark-sun/the-court-of-ruin.webp"
        /><h2><span style="font-family:Packard Antique Bold">The Court of
        Ruin</span></h2><p><span style="font-family:Packard Antique Bold">Let us
        remember these disciples, who should be remembered with dread, their
        names etched in suffering:</span></p><ul><li><span
        style="font-family:Packard Antique Bold">Borys, who is called Butcher of
        Dwarves</span></li><li><span style="font-family:Packard Antique
        Bold">Kalak, who is called Ogre Doom</span></li><li><span
        style="font-family:Packard Antique Bold">Tectuktitlay, who is called
        Wemic Annihilator</span></li><li><span style="font-family:Packard
        Antique Bold">Dregoth, who is called Ravager of
        Giants</span></li><li><span style="font-family:Packard Antique
        Bold">Hamanu, who is called Troll Scorcher</span></li><li><span
        style="font-family:Packard Antique Bold">Abalach-Re, who is called Orc
        Plague</span></li><li><span style="font-family:Packard Antique
        Bold">Nibenay, who is called Bane of Gnomes</span></li><li><span
        style="font-family:Packard Antique Bold">Andropinis, who is called
        Slayer of Elves</span></li><li><span style="font-family:Packard Antique
        Bold">Lalali-Puy, who is called Aarakocra Scourge</span></li><li><span
        style="font-family:Packard Antique Bold">Daskinor, who is called Goblin
        Death</span></li><li><span style="font-family:Packard Antique
        Bold">Wayan, who is called Pixie Blight</span></li><li><span
        style="font-family:Packard Antique Bold">Sacha of Arala, who is called
        Curse of Kobolds</span></li></ul><p><span style="font-family:Packard
        Antique Bold">Rajaat saw the many races of Athas and pronounced judgment
        upon them. In his twisted wisdom, he decreed that the younger races had
        corrupted the world that once belonged solely to
        humans.</span></p><p><span style="font-family:Packard Antique Bold">To
        each Champion, Rajaat gave purpose – the eradication of a race deemed
        "impure" by his reckoning. Thus began the Time of Cleansing, known now
        in the blood-stained annals of history as the Cleansing
        Wars.</span></p><h2><span style="font-family:Packard Antique Bold">The
        Cleansing Wars</span></h2><p class="initial"><span
        style="font-family:Packard Antique Bold">The world trembled as armies
        marched across its face. The Champions, wielding magic most terrible,
        led their legions against the races of Athas. Each Champion bore the
        awful purpose of their master, and the land ran red with the blood of
        the condemned. Dregoth the Ravager turned his gaze upon the giants.
        Andropinis hunted the elves through forest and plain. And Borys of Ebe
        marshaled forces against the dwarves.</span></p><p><span
        style="font-family:Packard Antique Bold">One by one, the races of Athas
        were snuffed out like a pinched flame. The gnomes, clever and
        industrious, were the first to fall, hunted by Nibenay the Bane of
        Gnomes until not a single voice remained to speak their language. The
        orcs, though fierce and numerous, fell beneath the sorcery of
        Abalach-Re. The peaceful wemics and centaurs, the proud giants, the
        reclusive pterrans – all were swept away in the tide of the Champions'
        wrath.</span></p><img
        src="https://s3.us-east-1.amazonaws.com/rime-of-the-frostmaiden/artwork/dark-sun/the-cleansing-wars.webp"
        /><p><span style="font-family:Packard Antique Bold">The halflings
        retreated to their fire remaining forest strongholds, their ancient
        magic holding back the Champions for a time. But even their primal
        powers could not endure forever against such focused malevolence. Their
        numbers dwindled until they became but legends in the deep forests. The
        elves, swift as the wind, survived through flight and cunning, scattered
        to the corners of Athas, becoming nomads without home or hearth. No
        longer were they the proud forest lords of old, but hunted prey, their
        ancient culture reduced to fragments carried by wandering
        tribes.</span></p><p><span style="font-family:Packard Antique Bold">And
        our people, the children of stone and forge, stood against the tide of
        destruction. The High King Rkard called forth every clan from every
        mountain hold, and the armies of the dwarven nations marched to war as
        one. Such was the might of our ancestors that even the Champions
        hesitated before their axes and resolve.</span></p><h2><span
        style="font-family:Packard Antique Bold">Borys' Betrayal</span></h2><p
        class="initial"><span style="font-family:Packard Antique Bold">As the
        races of Athas faced extinction, a great betrayal was wrought. The
        Champions, having tasted power beyond measure, turned against their
        master. Led by Borys of Ebe, the Champions, save for Sacha and Wayan,
        who remained loyal, struck down Rajaat and imprisoned him in a place
        between worlds, a void of their own making. But this betrayal carried a
        terrible price.</span></p><p><span style="font-family:Packard Antique
        Bold">To maintain Rajaat's prison required power unimaginable. Thus did
        the Champions transform themselves yet again, becoming the
        Sorcerer-Kings, drawing life itself from the land to fuel their
        immortality and maintain their betrayer's bonds.</span></p><p><span
        style="font-family:Packard Antique Bold">The world withered beneath
        their hunger. What remained was taken. The mountains crumbled to dust.
        What little was left of the seas was finally boiled away. Athas, already
        rent by the Sundering, was wounded beyond measure and became a wasteland
        of dust and despair. Thus dawned the Age of the Scorched
        Earth.</span></p><p><span style="font-family:Packard Antique Bold">His
        master imprisoned, Borys came for the dwarves. And for nine-and-ninety
        years did the dwarves hold back the forces of Borys, defending mountain
        pass and valley with lives and blood. The grand halls of Kemalok became
        a fortress unassailable, and thrice did the Champion's armies break
        against its gates like waves upon stone.</span></p><p><span
        style="font-family:Packard Antique Bold">But even the endurance of the
        mountains fails in time. At the end, for seven days and seven nights did
        the earth shake with Borys’ fury at the gates of Kemolak. So great was
        the clash of arms that the mountains themselves split asunder, and
        rivers changed their course to avoid the fields of the
        dead.</span></p><img
        src="https://s3.us-east-1.amazonaws.com/rime-of-the-frostmaiden/artwork/dark-sun/fall-of-rkard.webp"
        /><h2><span style="font-family:Packard Antique Bold">The Fall of King
        Rkard</span></h2><p class="initial"><span style="font-family:Packard
        Antique Bold">In that darkest hour arose King Rkard, greatest among
        dwarven rulers, whose heart burned brighter than forge-fire. He wielded
        the sacred Scourge, a blade bound with ancestral oaths and ancient
        crystals. Before Kemalok's shattered gates, Rkard faced Borys in single
        combat, their battle shaking mountains and skies.</span></p><p><span
        style="font-family:Packard Antique Bold">Though courage fueled his arm,
        Rkard was betrayed by cruel fate. Mortally wounded, he drove his blade
        deep into Borys, gravely injuring the Butcher who fled, his mission
        undone. With his dying breath, Rkard commanded his people to seal
        Kemalok, hiding its treasures and secrets deep beneath Athas’s
        sands.</span></p><h2><span style="font-family:Packard Antique Bold">The
        Sealing of Kemolak</span></h2><p class="initial"><span
        style="font-family:Packard Antique Bold">In sorrow and honor, dwarven
        sages and warriors sealed the city, burying King Rkard's remains and the
        Scourge deep within the Vault of Echoes. Their final rune-etched words
        speak through ages:</span></p><p><span style="font-family:Packard
        Antique Bold">"Here lies Rkard, who defied the darkness. Though Kemalok
        falls, dwarven strength endures. Athas remembers."</span></p><p><span
        style="font-family:Packard Antique Bold">May those who find these
        tablets learn from the folly of power unleashed and ambition unchecked.
        May they rebuild what was lost, if rebuilding can be done. May they
        remember that even in a world of dust and bone, the endurance of the
        dwarven spirit remains undiminished.</span></p><p><span
        style="font-family:Packard Antique Bold">So ends this
        Chronicle.</span></p>
