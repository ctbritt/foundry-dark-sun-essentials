    text:
      format: 1
      content: "<p>This lumbering half-giant has become a nearly inseparable partner of your group</p>\n<p>He exhibits the traits common to his people: gullibility, good-heartedness, and slowness</p>\n<p>to anger. You sense that he doesn\x92t soon forgive an offense, but neither does he</p>\n<p>soon forget a favor. Judging from his size and bulk, you will want to keep yourself on</p>\n<p>the favored list.</p>\n<p>Urrgos says he grew up in a village on the shore of the Silt Sea: he tells many</p>\n<p>fascinating tales of the dust ocean. As best you can understand, your half-giant</p>\n<p>companion simply woke up one morning with the urge to leave the village. No one</p>\n<p>tried to dissuade him, not even his parents. Apparently, this volatile wanderlust</p>\n<p>often infects his kind. Even so, Urrgos seems oddly undisturbed by his current captivity</p>\n<p>in the slave pens. Half-giant minds,\x97for they do have minds, \x97are among</p>\n<p>Athas\x92s greatest mysteries.</p>"
