    text:
      format: 1
      content: >-
        <p>A ruthless, 30-year-old human trader, Haneth uses his position as
        House Tsalaxa's representative in Tyr to amass as much personal wealth
        as possible. He is an expert at blackmail, double dealing, and
        extortion. When residents of the Merchant District see Haneth on their
        doorstep, they know they are in for an unpleasant interaction.
        Ironically, it's when Haneth hasn't been seen for a while that people
        worry most—the house agent is adept at espionage and assassination.</p>
