        wgCeShTrqHJFBbDr:
          notes: >-
            <p>The oddest characteristic about Haneth is a secret that he keeps
            at all costs, even from members of his own house: He has a natural
            ability to change his shape, which serves him well in his dirty
            dealings. Born (apparently) of human parents, Haneth doesn't know
            where his ability comes from, but he guesses that it might be
            psionic in nature.</p><p>Haneth serves as a dangerous wild card in
            Tyr's merchant politics. His shapeshifting abilities make him
            perfect for infiltration plots, false identity schemes, or as a
            recurring antagonist who can appear as different people throughout a
            campaign. His expertise in blackmail and extortion means he likely
            has dirt on many prominent citizens, making him either a valuable
            informant or a threat to be neutralized. The mystery of his
            shapeshifting origins could tie into larger plots involving
            psionics, ancient bloodlines, or magical experimentation.</p>
    _id: t4o66UPNOhVAjYms
