      content: |-
        <p>Spoil, the oasis village located in the southernmost</p>
        <p>corner of the Glowing Desert, is another community of</p>
        <p>ex-slaves who use the village as a base from which to</p>
        <p>launch raids on nearby trade routes. A powerful defiler</p>
        <p>named Densis leads the tribe. He's protected by the</p>
        <p>Gorzu and Urtke, halfgiants devoted to the defiler.</p>
        <p>Densis hates Talid of Ravage with a passion. If anyone</p>
        <p>is going to rule a united bandit nation, the defiler believes,</p>
        <p>it should be him and not some muscle-bound half-breed.</p>
        <p>Densis doesn't dare send his smaller and weaker tribe</p>
        <p>against Talid's, but someday he plans to destroy the mul</p>
        <p>and take command of wealthy Ravage.</p>
        <p>While his tribe conducts raids or ambushes</p>
        <p>membes of the other Bandit States, Densis travels north</p>
        <p>to the ruins of the Buried City. He has been exploring</p>
        <p>the site for almost three years, and each time he returns</p>
        <p>to Spoil he has a bit more power at his command.</p>
        <p>Few of his followers will accompany him to the ruins,</p>
        <p>for they believe that the place is haunted by terrible</p>
        <p>spirits and undead creatures. The fact that Densis</p>
        <p>regularly communes with these beings makes him more</p>
        <p>important in their eyes-and that much more frightening.</p>
