  - name: Ozamata Murawa
    text:
      markdown: >-
        **Ozamata Ku Murawa** is an Underbaron who is the head of the powerful
        trading family of Murawa. He is a Shou who came to Bral during the first
        explorations of Wildspace by that people and elected to stay. Ozamata
        started two great enterprises: a trading house, and a brotherhood of
        @UUID[JournalEntry.nCbVqvTB3uHAqr6w]{Yakuza}. In time he fought his way
        to prominence on the Council of Captains and as one of the city's
        Underbarons. Ozamata is a harsh man of 50, short and potbellied, who
        still wears his hair in the traditional Shou style. Many of the Shou
        regard him as the leader of their community. In any event, Ozamata is
        the most powerful and wealthy Shou in Bral.
      format: 2
      content: >-
        <p><strong>Ozamata Ku Murawa</strong> is an Underbaron who is the head
        of the powerful trading family of Murawa. He is a Shou who came to Bral
        during the first explorations of Wildspace by that people and elected to
        stay. Ozamata started two great enterprises: a trading house, and a
        brotherhood of
        @UUID[JournalEntry.hKpJz2gAsIW69z8T.JournalEntryPage.lX4g2UCeV36PZVlR]{Yakuza}.
        In time he fought his way to prominence on the Council of Captains and
        as one of the city's Underbarons. Ozamata is a harsh man of 50, short
        and potbellied, who still wears his hair in the traditional Shou style.
        Many of the Shou regard him as the leader of their community. In any
        event, Ozamata is the most powerful and wealthy Shou in Bral.</p>
