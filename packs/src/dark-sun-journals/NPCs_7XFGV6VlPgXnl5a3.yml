  - name: Elmandar
    text:
      markdown: "[Elmandar](https://forgottenrealms.fandom.com/wiki/Elmandar) is a half-elf mage and noted astronomer in the city of Bral on the Rock of Bral.\n\nServicing the strong demand from spelljammer navigators for highly accurate star charts, Elmandar drew and sold charts of guaranteed accuracy that fetched prices of 300–800 gp each. Furthermore, Elmander had a small staff of his own navigators and cartographers who would join the crews of tradesmen spelljammers in order to check and update charts during flights. Moreover, Elmandar charts could be brought back at any time to be updated, free of charge.\n\nElmandar's Star Charts was found in the Middle City of Bral on Cuttle Street overlooking the edge of the Rock, near the Wallis Tannery.\n\n### Notes\nA former student and employee of Elmandar's was\_Teledir Sunstrider, who established the rival business\_Nautical Charts of Bral.\n\nA former adventurer, and the helmsman aboard a spelljammer galleon called the Eclipse, Elmandar retired from that life and started a more rewarding career in surveying and charting.\n\nElmandar kept a model of the Eclipse in his observatory. He also had a cat."
      format: 2
      content: "<p><a href=\"https://forgottenrealms.fandom.com/wiki/Elmandar\">Elmandar</a> is a half-elf mage and noted astronomer in the city of Bral on the Rock of Bral.</p>\n<p>Servicing the strong demand from spelljammer navigators for highly accurate star charts, Elmandar drew and sold charts of guaranteed accuracy that fetched prices of 300–800 gp each. Furthermore, Elmander had a small staff of his own navigators and cartographers who would join the crews of tradesmen spelljammers in order to check and update charts during flights. Moreover, Elmandar charts could be brought back at any time to be updated, free of charge.</p>\n<p>Elmandar's Star Charts was found in the Middle City of Bral on Cuttle Street overlooking the edge of the Rock, near the Wallis Tannery.</p>\n<h3>Notes</h3>\n<p>A former student and employee of Elmandar's was\_Teledir Sunstrider, who established the rival business\_Nautical Charts of Bral.</p>\n<p>A former adventurer, and the helmsman aboard a spelljammer galleon called the Eclipse, Elmandar retired from that life and started a more rewarding career in surveying and charting.</p>\n<p>Elmandar kept a model of the Eclipse in his observatory. He also had a cat.</p>"
