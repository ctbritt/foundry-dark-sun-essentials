      content: >-
        <img src="s3/images/spelljammer/korbis%20vorr.webp"
        style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('../modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:100%"
        /><p>Korbis Vorr, the Scro Ambassador to the Rock of Bral, was a cunning
        strategist, renowned for his keen intellect and ability to navigate the
        treacherous world of interstellar politics. As the representative of the
        Scro people on the Rock of Bral, Korbis Vorr worked tirelessly to
        advance his people's interests and expand their influence, even as he
        navigated the tensions and animosities that arose from the embassy's
        controversial location.</p><p>He was assassinated by
        @UUID[.q82AS3xYiIqHqumE]{Drakthar Bloodfist} on 30 Ches, 862
        CE.</p><p>Vorr was an imposing figure, almost eight feet tall and stood
        taller than most other Scro, with a muscular build that spoke to his
        past as a warrior. He had deep-set, piercing eyes and a well-groomed
        beard, which gave him a regal and dignified appearance. His attire was a
        mix of traditional Scro military uniforms and the more formal clothing
        befitting a diplomat, adorned with medals and badges that signified his
        various accomplishments and honors.</p><p>A shrewd and calculating
        individual, Vorr able to maintain a calm and composed demeanor even in
        the most trying of circumstances. He was a skilled negotiator, adept at
        navigating the complex web of alliances and rivalries that defined the
        politics of the Rock of Bral. Despite his diplomatic role, Korbis was a
        proud Scro and remained fiercely loyal to his people, always putting
        their interests first and foremost in his dealings.</p><p>Before
        becoming a diplomat, Korbis Vorr had been a decorated warrior in the
        Scro military, where he earned a reputation for his tactical acumen and
        relentless determination. Recognizing his potential as a diplomat, the
        Scro leadership had selected Korbis for specialized training in
        diplomacy and statecraft, eventually appointing him as the Ambassador to
        the Rock of Bral. In this role, Korbis had proven to be a formidable
        advocate for his people, working tirelessly to strengthen the Scro's
        position and undermine their rivals.</p>
