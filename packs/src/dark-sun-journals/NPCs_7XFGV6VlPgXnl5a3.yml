    image: {}
    text:
      format: 1
      content: >-
        <table style="border-spacing:0
        0.5rem;border-collapse:separate;width:100%;border:none;background:#ffffff0d;border-top:1px
        solid;border-bottom:1px solid"><tbody><tr
        style="background:transparent"><td
        style="width:50%;padding:0;margin:0"><img style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:90%;margin-left:5%;aspect-ratio:1/1"
        src="s3/artwork/spelljammer/Darkspace/callbritton_full_body_portrait_of_vampire_lord_in_plate_armor_339fa528-cc42-4a8f-a2f8-05497f81dabb_2.webp"
        /></td><td style="padding:1rem"><p>T'Laan was defeated by the party in
        Darkspace and reclaimed by a spectral hand of a dark lord of a dread
        realm. Will he
        return?</p><p>@UUID[JournalEntry.7XFGV6VlPgXnl5a3]{T'Laan's} journal is
        an eclectic collection of aged writings, comprising old notebooks and
        scrolls that span centuries. These time-worn pages, filled with his
        thoughts and experiences, vary in condition, reflecting the passage of
        time. The earliest entries are in delicate notebooks, their pages
        yellowed and fragile. As time progresses, the writings shift to scrolls,
        some meticulously maintained, others tattered and barely
        legible.</p></td></tr></tbody></table><h2>Entry 1</h2><p
        class="parchment-book-1"><span style="font-size:2.5vw"><span
        style="font-family:Allison">"Today, under the gentle sun of Aglarond, I
        feel the weight of my duties lighten. As Dorin, I counsel King Brindor,
        striving for peace in our young nation. The talks at Ingdal’s Arm loom,
        a chance to end strife. In my heart, a song of hope resonates, a dream
        for a future bright as the sun above. My elven mother's grace and
        father's determination guide me. Little do I know, as I walk these
        familiar gardens, how swiftly fate will
        turn."</span></span></p><h2>Entry 2</h2><p
        class="parchment-book-2"><span style="font-size:2.5vw"><span
        style="font-family:Allison">"In my darkest hour, beneath a blood-red
        moon, I made my pact with Death. My heart, once full of love, now burns
        with an unquenchable rage. The loss of my beloved, at the hands of
        Thayan cowards, has transformed me. In my vengeance, I drank the blood
        of my enemies, sealing my fate. This power, dark and consuming, is my
        new essence. Dorin is dead; in his place, a creature of hatred and
        revenge rises. The path ahead is one of darkness and death, a journey I
        embrace with a vengeful heart."</span></span></p><h2>Entry 3</h2><div
        style="position:relative"><img style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:90%;margin-left:5%;aspect-ratio:1/1"
        src="s3/artwork/spelljammer/Darkspace/tlaan-entry-3.webp" /><div
        style="position:absolute;top:5%;left:55%;right:10%;bottom:10%;overflow-y:scroll;padding:20px;text-align:left;color:black;font-family:Allison"><p
        style="font-size:1.5vw"><span style="font-family:Allison">The
        transformation is complete. I stand alone amidst the ruins of my former
        life, a creature reborn in darkness. As T'Laan, I no longer feel the
        warmth of the sun; instead, I relish the cold embrace of the night. My
        first hunt was exhilarating, the fear in my prey's eyes intoxicating.
        This power, this eternal life, it's a curse yet a tool for my revenge.
        The world of mortals is now my hunting ground, and I will show no mercy.
        Dorin's dreams are dead; T'Laan's reign of terror
        begins.</span></p></div></div><h2>Entry 4</h2><img
        style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('modules/simple-quest/assets/mask/mask3.webp');object-fit:cover;border:none;border-radius:5px;width:100%"
        src="s3/artwork/spelljammer/Darkspace/0_3.webp" /><h2>Entry 5</h2><p
        class="parchment-note-1"><span style="font-size:2.5vw"><span
        style="font-family:Allison">"As years turned to decades, my bloodthirst
        on Verin bred unforeseen consequences. The dead rose, mirroring my
        curse. Vampires, my unwitting creation, began to infest the planet.
        Initially, it was a macabre delight, watching my progeny thrive. But
        soon, the humans, resilient and cunning, organized. They fought back,
        initiating a war that would mark the beginning of the end. The Time of
        Death they called it, a fitting name. I watched as my empire of shadows
        crumbled, victims of their own insatiable
        hunger."</span></span></p><p></p><h2>Entry 6</h2><div
        style="position:relative"><img style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:90%;margin-left:5%;aspect-ratio:1/1"
        src="s3/artwork/spelljammer/Darkspace/dall%C2%B7e-2024-02-24-10.55.01-imagine-a-scene-on-old%2C-textured-paper-that-captures-the-aftermath-of-a-catastrophic-event-described-by-t%27laan.-the-world-of-verin-is-depicted-as-a-de.webp"
        /><div
        style="position:absolute;top:5%;left:20%;right:35%;bottom:10%;overflow-y:scroll;padding:20px;text-align:left;color:black;font-family:Allison"><p
        style="font-size:2vw"><span style="font-family:Allison">The Time of
        Death left no survivors. Humans and vampires alike perished. The once
        thriving Verin is now a wasteland. My children, starved of life, turned
        on one another and the Age of Blood ended with me as the sole survivor.
        Alone, amidst the ruins, I face the consequences of my eternal
        curse.</span></p></div></div><p></p><h2>Entry 7</h2><p
        class="parchment-note-3"><span style="font-size:2.5vw"><span
        style="font-family:Allison">"A profound change has occurred. The sun,
        once a blazing enemy, now a darkened husk. Its death mirrored my soul's
        descent. I, T'Laan, once fearing the sun's rays, now mourn its loss. The
        darkness of Darkspace became complete, a symbol of my ultimate conquest,
        yet a reminder of my eternal isolation. Here, in the endless night, I am
        both king and prisoner, ruling over an empire of shadows and
        despair."</span></span></p><p></p><h2>Entry 8</h2><p
        class="parchment-note-4"><span style="font-size:2.5vw"><span
        style="font-family:Allison">"In the midst of darkness, I stumbled upon a
        marvel - sunseeds, remnants of the once vibrant sun. These seeds,
        brimming with potential to reignite the sun, lay in my grasp. Yet, I
        find myself in turmoil. To use them would be to bring back the light,
        the very anathema of my existence. But in them, I see a vestige of the
        past, a reminder of the world that was. My heart, though long turned
        cold, clings to these seeds, symbols of a life and warmth I once
        knew."</span></span></p><p></p><h2>Entry 9</h2><p></p><div
        style="position:relative"><img style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:90%;margin-left:5%;aspect-ratio:1/1"
        src="s3/artwork/spelljammer/Darkspace/callbritton_a_pencil_and_paper_sketch_of_sunseeds_magical_pebbl_6d1936b6-1a17-49ad-a511-08e9f81eca4c.webp"
        /><div
        style="position:absolute;top:65%;left:20%;right:10%;bottom:10%;overflow-y:scroll;padding:20px;text-align:left;color:black;font-family:Allison"><p
        style="font-size:1.5vw"><span style="font-family:Allison">Each day, the
        sunseeds' presence grows heavier, a constant reminder of what I have
        lost and what I could restore. Their light, faint yet persistent, haunts
        me in this eternal darkness. To reignite the sun is to end my reign, a
        sacrifice I am not yet ready to make. And so, they remain with me, a
        paradox - my last connection to a world of light and life, and yet a
        symbol of my deepest fall from grace.</span></p></div></div><p></p><div
        style="position:relative"><div style="position:relative"><div
        style="position:absolute;top:65%;left:20%;right:10%;bottom:10%;overflow-y:scroll;padding:20px;text-align:left;color:black;font-family:Allison"><p
        style="font-size:1.5vw"></p></div></div><div
        style="position:absolute;top:65%;left:20%;right:10%;bottom:10%;overflow-y:scroll;padding:20px;text-align:left;color:black;font-family:Allison"><p
        style="font-size:1.5vw"></p></div><h2>Entry 10</h2><p
        class="parchment-note-3"><span style="font-size:2.5vw"><span
        style="font-family:Allison">"I have crafted a plan to ensure my survival
        - a captive breeding stock of humanoids. For generations, they have
        sustained me, a necessary resource in this barren realm. They live,
        multiply, unaware of their fate as mere cattle for my sustenance. It's a
        meticulous balance, ensuring their survival while catering to my needs.
        But Bruin, an unexpected anomaly, managed to escape. His departure may
        prove troublesome, a crack in the carefully constructed facade of my
        dominion."</span></span></p><p></p><h2>Entry 11</h2><p
        class="parchment-scroll-1"><span style="font-size:2.5vw"><span
        style="font-family:Allison">"In the cold silence of Darkspace, I sustain
        myself with a herd of humanoids, my living cattle. Generations have
        passed under my watchful eye, each individual known to me by name. They
        exist solely for my sustenance, a balance of life and death within my
        domain. This controlled existence, a testament to my power, ensures my
        survival in this desolate sphere. They are oblivious to their fate, a
        mere resource in my eternal night. Their lives, though insignificant,
        are crucial to my existence."</span></span></p></div><h2>Entry 12</h2><p
        class="parchment-scroll-1"><span style="font-size:2.5vw"><span
        style="font-family:Allison">"The stark truth dawns upon me – Darkspace,
        my dark dominion, is dying. The breeding stock dwindles, and with them,
        my sustenance. My existence, once thought eternal, now hangs by a
        thread. I must venture forth, seek fresh prey beyond this dying sphere.
        The spelljammer, my vessel to new worlds, awaits. My reign here may
        wane, but T'Laan's thirst for life will not be quenched. The stars
        beyond call to me, a promise of survival in the endless void. Darkspace,
        my empire of shadows, shall soon be behind
        me.</span></span></p><h2>Entry 13</h2><p
        class="parchment-scroll-1"><span style="font-size:2.5vw"><span
        style="font-family:Allison">As the echo of Darkspace's death knell grows
        louder, I am faced with a dire truth. My once-mighty spelljammer lies in
        ruins, a husk of its former glory, grounding me to this dying sphere.
        The captive stock, my lifeline, wanes. I must devise a new plan, a means
        to venture beyond, to quench my undying thirst.</span></span></p>
      markdown: ''
