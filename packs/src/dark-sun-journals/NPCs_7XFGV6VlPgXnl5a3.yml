        jM4h8qpyxwTpfNli:
          notes: >-
            Korbis Vorr, the Scro Ambassador to the Rock of Bral, has a secret
            agenda that goes far beyond his diplomatic role. He is quietly
            working behind the scenes to drive a wedge between Prince Andru and
            the Elvish Imperial Navy, with the ultimate goal of bringing the
            Rock of Bral under Scro protection. If successful, this move would
            not only weaken the Elves' influence in the region but also provide
            the Scro with a strategic foothold from which to launch the 2nd
            Unhuman War and exact their long-awaited revenge.


            To achieve this goal, Korbis Vorr has implemented a multi-layered
            strategy:


            1. Sowing Discord: Korbis and his agents are working to spread
            rumors, misinformation, and propaganda throughout the Rock of Bral,
            seeking to discredit the Elvish Imperial Navy and stir up doubts
            about their trustworthiness and reliability as allies.

            2. Building Alliances: Korbis is actively courting the support of
            influential figures within the Rock of Bral's political and economic
            landscape. By offering lucrative trade deals, military support, or
            other incentives, he hopes to build a coalition of powerful
            individuals who will back Prince Andru's decision to break ties with
            the Elves and accept Scro protection.

            3. Exploiting Weaknesses: Korbis and his spies are constantly on the
            lookout for any signs of weakness or vulnerability within the Elvish
            Imperial Navy or their alliance with Prince Andru. They will seize
            upon any opportunity to exacerbate these issues and drive a further
            wedge between the two factions.

            4. Personal Manipulation: Korbis will attempt to personally
            manipulate Prince Andru, using his considerable charm and diplomatic
            skills to convince the Prince that the Scro are the better allies
            and that the Elves cannot be trusted to protect the Rock of Bral.


            If Korbis Vorr's initial plan to subvert Prince Andru fails, he will
            turn his attention to Prince Aric, Andru's nephew, who harbors a
            deep-seated resentment towards his uncle. Convinced that Andru was
            responsible for the death of his father, Aric is vulnerable to the
            Scro's manipulations and enticements.


            To enlist Prince Aric's aid in overthrowing Andru, Korbis will
            employ several tactics:


            1. Fueling Suspicion: Korbis and his agents will work to reinforce
            Aric's belief that Andru was behind his father's death, providing
            him with false evidence and feeding his desire for vengeance. This
            will help to ensure that Aric is motivated to act against his uncle
            and seize power.

            2. Offering Support: Korbis will promise Prince Aric the full
            support of the Scro military and financial resources in his bid to
            overthrow Andru. This will not only provide Aric with the means to
            carry out his plans but also further bind him to the Scro's agenda.

            3. Cultivating Loyalty: Korbis will work to build a personal rapport
            with Prince Aric, positioning himself as a trusted advisor and
            confidant. This will allow him to exert a greater influence over
            Aric's decisions and ensure that the young prince remains committed
            to the Scro's cause.

            4. Building a Power Base: Korbis will assist Prince Aric in securing
            the loyalty of key factions within the Rock of Bral's political and
            military establishments. By cultivating alliances and undermining
            Andru's support, Korbis hopes to create a groundswell of backing for
            Aric's coup.


            Upon learning about the party's involvement in the Godsbody incident
            and their quest to find Rickvon's homeworld and the source of the
            magical engine, the mythallar, Korbis Vorr quickly realizes the
            potential value of this information. He understands that gaining
            control over the mythallar could give the Scro an immense strategic
            advantage in their upcoming conflict with the Elves and further
            their plans for revenge.


            Korbis Vorr's new objectives include:


            1. Gathering Information: Korbis will direct his spies and
            informants to gather as much information as possible about the
            Godsbody incident, Rickvon's homeworld, and the mythallar. He will
            seek to learn about the party's progress, the potential dangers they
            face, and any clues they have uncovered about the mythallar's
            location and capabilities.

            2. Co-opting or Sabotaging the Party: Depending on the party's
            allegiances and actions, Korbis may try to co-opt them by offering
            them support, resources, or false leads in their quest. This would
            allow him to manipulate the party into unwittingly aiding the Scro's
            plans for conquest. Alternatively, if the party appears to be a
            threat to the Scro's interests, Korbis may instead attempt to
            sabotage their efforts, using his agents to create obstacles, plant
            misinformation, or even attack the party directly.

            3. Acquiring the Mythallar: Korbis Vorr's ultimate goal is to
            acquire the mythallar and harness its power for the Scro's benefit.
            He may pursue this objective by attempting to steal the mythallar
            once the party locates it, or by capturing and interrogating the
            party members to learn its whereabouts. If Korbis believes that the
            mythallar is too dangerous to be left in the hands of the Elves or
            any other faction, he may even seek to destroy it.


            Korbis Vorr, recognizing the immense potential of the mythallar and
            the strategic advantage it could provide the Scro in their conflict
            with the Elves, becomes determined to find Rickvon's homeworld
            himself. Driven by ambition and a desire for revenge, Korbis decides
            to pursue the party across the known spheres, leading to a thrilling
            and dangerous chase through the cosmos.


            1. Gathering Resources: Korbis will begin by assembling a team of
            skilled operatives, including Scro warriors, spies, and navigators,
            who will accompany him on his pursuit. He will also secure a fast
            and well-armed Spelljammer ship to ensure he can keep up with the
            party and engage them in combat if necessary.

            2. Following the Party's Trail: Korbis and his crew will follow the
            party's trail, using their network of informants, spies, and other
            contacts to track the party's movements across the known spheres.
            They will analyze any clues or leads the party has uncovered, hoping
            to decipher the location of Rickvon's homeworld before the party
            does.

            3. Confrontations and Encounters: As Korbis pursues the party, there
            will be numerous opportunities for tense encounters, skirmishes, and
            even full-scale battles between the two groups. Korbis may attempt
            to ambush the party at key moments, steal valuable information or
            artifacts they have discovered, or force them into dangerous
            situations to delay their progress.

            4. Race to Rickvon's Homeworld: The pursuit will ultimately
            culminate in a high-stakes race to locate and reach Rickvon's
            homeworld before the other. Both the party and Korbis' team will
            face numerous obstacles and challenges along the way, testing their
            resolve, resourcefulness, and determination. The first group to
            reach the homeworld and claim the mythallar will hold the key to the
            future of the known spheres and the balance of power within them.
