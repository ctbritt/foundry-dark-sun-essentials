  - name: Crew of the Deep Smudge
    text:
      markdown: >-
        # Captain Kolth Virion

        Kolth is a Hadozee captain of the *Deep Smudge,* an aging Squidship he
        nonetheless says is the fastest ship this side of the [The
        Weird](https://spelljammer.fandom.com/wiki/The_Weird). 


        He is charming, devious, and out for himself and his crew. That doesn't
        mean he can't be depended on in a pinch, and his inherent goodness often
        exasperates even himself. 


        # First Mate Nelle 'Snake' Zaine

        Nelle is the Smudge's first mate, a job she does well, if not always
        seriously. She is simultaneously beloved and dreaded by the crew for her
        habit of pulling pranks. But when it comes to time to giving orders, she
        snaps to — and so does the crew. 


        She is not-so-secretly in love with [[#Captain Kolth Virion|Kolth]], but
        he has so far pretended not to notice.


        # Bosun  Jexdelgor

        Jexdelgor (or just "Jex") is the ships Bosun and keeps everthing
        shipshape. Which is a joke since he has no shape of his own. 


        # Doleus

        A doleful, quiet human wizard, Doleus keeps his cards close to his chest
        and rightly so. He is sure to betray the crew if he found the right
        opportunity. He is cunning, shrewd, deceitful, and a coward.
      format: 2
      content: >-
        <h2>Captain Kolth Virion</h2><img
        src="/s3/tokens/kolth_virion.Avatar.webp" style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('../modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:10%;float:left"
        /><p>Kolth is a Hadozee captain of the <em>Deep Smudge,</em> an aging
        Squidship he nonetheless says is the fastest ship this side of the <a
        href="https://spelljammer.fandom.com/wiki/The_Weird">The
        Weird</a>.</p><p>He is charming, devious, and out for himself and his
        crew. That doesn't mean he can't be depended on in a pinch, and his
        inherent goodness often exasperates even himself.</p><h2>First Mate
        Nelle 'Snake' Zaine</h2><img
        src="s3/tokens/nelle_snake_zaine.Avatar.webp"
        style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('../modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:12%;float:right"
        /><p>Nelle is the Smudge's first mate, a job she does well, if not
        always seriously. She is simultaneously beloved and dreaded by the crew
        for her habit of pulling pranks. But when it comes to time to giving
        orders, she snaps to — and so does the crew.</p><p>She is
        not-so-secretly in love with Kolth, but he has so far pretended not to
        notice.</p><h2>Bosun Jexdelgor</h2><p>Jexdelgor (or just "Jex") is the
        ships Bosun and keeps everthing shipshape. Which is a joke since he has
        no shape of his own.</p><h2>Doleus</h2><p>A doleful, quiet human wizard,
        Doleus keeps his cards close to his chest and rightly so. He is sure to
        betray the crew if he found the right opportunity. He is cunning,
        shrewd, deceitful, and a coward.</p>
