  - name: Fauna Whisperwind
    _id: pmb27BT4dxpNGl5L
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <table style="border-spacing:0
        0.5rem;border-collapse:separate;width:100%;border:none;background:#ffffff0d;border-top:1px
        solid;border-bottom:1px solid"><tbody><tr
        style="background:transparent"><td style="padding:1rem"><p>Fauna is a
        serene wood elf with a deep connection to the natural world. She
        specializes in the care and training of exotic creatures from across the
        spheres, offering a variety of services including animal handling, beast
        taming, and even magical bonding rituals. Fauna's menagerie -
        <strong>Whisperwind's Wild Emporium</strong> - is a sight to behold,
        filled with curious and wondrous creatures from the mundane to the
        magical.</p><section id="secret-TsHBM2ktCcDyZRQl" class="secret"><p>If
        Miabella finds her, she will express polite interest until the ranger
        produces Nugget. Then she will appear intrigued, and finally alarmed.
        With a successful [[/check Cha dc 17]], she will take Miabella into her
        confidence and tell her her concerns about the
        Furries.</p></section></td><td style="width:20%;padding:0;margin:0"><img
        style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:90%;margin-left:5%;aspect-ratio:1/1"
        src="s3/tokens/spelljammer/fauna.webp" /></td></tr></tbody></table>
