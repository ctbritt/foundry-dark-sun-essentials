  - name: Pontifex Cymric Bales IX
    text:
      markdown: >-
        ![Cymric Bales
        IX|profile+medium|locr](https://www.worldanvil.com/uploads/images/60d2638c03f5325a9c9ff9e47a1d88e5.png)Cymric
        Bales IX, born as Gare Coenwyn, to a to commoner mother, is the
        undisputed leader and ruler of the Faith Militant and its holy lands,
        the Sacred Demesne of the Faith Militant. he took to the religious life
        early, impressing local clerics with his devotion and disturbing them
        with his fervor. For it was Cymric who almost single-handedly turned the
        Faith of Valês into the Faith Militant it is today. 


        Afflicted with a burning ambition to see Valês' will be done, Cymric
        joined the clergy as soon as he was old enough to do so. From there he
        rose quickly in Pintarro Monastery to the rectorship, and thence to the
        Holy Conclave. Through shrewd political maneuverings, he found enough
        allies to install him as Pontifex in 849 CE (244 Faith Reckoning),
        making him the youngest Pontifex in the short life of the Faith
        Militant. After further consolidating power, purging his enemies from
        the priesthood, and through radical (and popular) programs of social
        welfare for the common folks and the military, he announced [The
        Cleanse](https://www.worldanvil.com/w/azthir-terra-ctbritt/a/the-cleanse-militaryConflict)
        on 11th Eleint, 853 CE (11 Cronesmonth, 248 FR). 


        In the seven years since he launched this war of conquest, he shows no
        signs of stopping.



        > [!infobox|left]

        > # About

        > | Alignment |  Lawful Evil |

        > | ---- | ---- |

        > | Current location | [Valês
        Rise](https://www.worldanvil.com/w/azthir-terra-ctbritt/a/vales-rise-settlement)
        |

        > | Species | Human |

        > | Year of Birth | 814 CE, 47 years old |

        > | Current Residence | Valês Rise |

        > |Belief/Deity | Valês |

        > | Aligned Organization | [The Faith
        Militant](https://www.worldanvil.com/w/azthir-terra-ctbritt/a/the-faith-militant-organization)
        |

        > | Other Affiliations | [Sacred Demesne of the Faith
        Militant](https://www.worldanvil.com/w/azthir-terra-ctbritt/a/sacred-demense-of-the-faith-militant-organization)
        |
      format: 2
      content: >-
        <img
        src="https://www.worldanvil.com/uploads/images/60d2638c03f5325a9c9ff9e47a1d88e5.png"
        alt="Cymric Bales IX|profile+medium|locr" style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('../modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:100%"
        /><p>Cymric Bales IX, born as Gare Coenwyn, to a to commoner mother, is
        the undisputed leader and ruler of the Faith Militant and its holy
        lands, the Sacred Demesne of the Faith Militant. he took to the
        religious life early, impressing local clerics with his devotion and
        disturbing them with his fervor. For it was Cymric who almost
        single-handedly turned the Faith of Valês into the Faith Militant it is
        today.</p><p>Afflicted with a burning ambition to see Valês' will be
        done, Cymric joined the clergy as soon as he was old enough to do so.
        From there he rose quickly in Pintarro Monastery to the rectorship, and
        thence to the Holy Conclave. Through shrewd political maneuverings, he
        found enough allies to install him as Pontifex in 849 CE (244 Faith
        Reckoning), making him the youngest Pontifex in the short life of the
        Faith Militant. After further consolidating power, purging his enemies
        from the priesthood, and through radical (and popular) programs of
        social welfare for the common folks and the military, he announced <a
        href="https://www.worldanvil.com/w/azthir-terra-ctbritt/a/the-cleanse-militaryConflict">The
        Cleanse</a> on 11th Eleint, 853 CE (11 Cronesmonth, 248 FR).</p><p>In
        the seven years since he launched this war of conquest, he shows no
        signs of stopping.</p><table><thead><tr><th
        id="alignment">Alignment</th><th id="lawful_evil">Lawful
        Evil</th></tr></thead><tbody><tr><td>Current location</td><td><a
        href="https://www.worldanvil.com/w/azthir-terra-ctbritt/a/vales-rise-settlement">Valês
        Rise</a></td></tr><tr><td>Species</td><td>Human</td></tr><tr><td>Year of
        Birth</td><td>814 CE, 47 years old</td></tr><tr><td>Current
        Residence</td><td>Valês
        Rise</td></tr><tr><td>Belief/Deity</td><td>Valês</td></tr><tr><td>Aligned
        Organization</td><td><a
        href="https://www.worldanvil.com/w/azthir-terra-ctbritt/a/the-faith-militant-organization">The
        Faith Militant</a></td></tr><tr><td>Other Affiliations</td><td><a
        href="https://www.worldanvil.com/w/azthir-terra-ctbritt/a/sacred-demense-of-the-faith-militant-organization">Sacred
        Demesne of the Faith Militant</a></td></tr></tbody></table>
