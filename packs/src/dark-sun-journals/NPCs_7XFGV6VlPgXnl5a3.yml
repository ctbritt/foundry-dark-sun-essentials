  - name: Irdana Shipwright
    text:
      markdown: >-
        Irdana is one of the most skilled shipbuilders in all wildspace. She is
        a human woman of about 60, tall with grey hair and an air of calm
        nobility about her. The Yards are her kingdom, and no one who builds or
        repairs ships in Bral would think to disregard her advice. She is a
        skilled naval architect as well, and personally designed and built the
        first of the Battle Dolphins.
