    text:
      format: 1
      content: "<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Templar District</span></span></div>\n<h2 id=\"h.5701l3j3p2y9_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Large warehouses stand at the far end of the quarters. These buildings house the city's precious reserves of grain, iron, and weaponry, and two barracks for the templar's half-giant guards. Transportation of these commodities to the warehouses is achieved by using cunningly crafted tunnels that extend from the High Bureaus of Mines and Fields. The warehouses and the tunnels leading to them are permanently guarded through magic and psionics.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">With few exceptions, the templars apartments are used primarily by low- and median-level templars. Higher ranking officials commonly live in the noble quarters or on their own plantations outside of the city. Size and furnishings of the templars quarters vary by individual. Those in positions of relative power and wealth have luxurious accommodations while junior templars must be content with more spartan quarters.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">\_</p>"
