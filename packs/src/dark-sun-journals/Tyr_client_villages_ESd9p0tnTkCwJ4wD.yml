      content: >-
        <article id="article_5baae123-762d-4014-beb0-26d720dca740"
        class="article" style="box-sizing:border-box;color:rgb(33, 37,
        41);font-family:'Helvetica Neue', Helvetica, Arial,
        sans-serif;font-size:16px;font-style:normal;font-variant-ligatures:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-stroke-width:0px;background-color:rgb(250,
        250,
        250);text-decoration-thickness:initial;text-decoration-style:initial;text-decoration-color:initial"><header
        style="box-sizing:border-box"><h1
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2.5rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.1em"><span style="font-family:'Packard Antique', serif"><a
        href="https://athas.org/articles/client-villages-of-tyr"
        style="box-sizing:border-box;color:rgb(156, 0,
        0);text-decoration:none"><strong>Client Villages of
        Tyr</strong></a></span></h1><div class="byline"
        style="box-sizing:border-box"><div
        style="box-sizing:border-box"><p>Written by Logarium, and first
        published on 2022-08-25</p></div></div></header><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem"><span
        style="font-family:'Helvetica Neue', Helvetica, Arial, sans-serif">Lynne
        Abbey introduced the concept of client villages for the city-state of
        Urik.This article brings us details of Tyr's client
        villages.</span></p><footer style="box-sizing:border-box"><nav
        class="tags d-flex" style="box-sizing:border-box;display:flex
        !important"><ul class="list-inline"
        style="box-sizing:border-box;padding-left:0px;margin-top:0px;margin-bottom:1rem;list-style:none"><li
        class="list-inline-item pe-1"
        style="box-sizing:border-box;display:inline-block;padding-right:0.25rem
        !important"><span style="font-family:'Helvetica Neue', Helvetica, Arial,
        sans-serif"><a href="https://athas.org/articles?tag=Tyr"
        style="box-sizing:border-box;color:rgb(156, 0,
        0);text-decoration:none">Tyr</a></span></li></ul></nav></footer></article><section
        class="body" style="box-sizing:border-box;color:rgb(33, 37,
        41);font-family:'Helvetica Neue', Helvetica, Arial,
        sans-serif;font-size:16px;font-style:normal;font-variant-ligatures:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:2;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;-webkit-text-stroke-width:0px;background-color:rgb(250,
        250,
        250);text-decoration-thickness:initial;text-decoration-style:initial;text-decoration-color:initial"><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem"></p><figure
        class="illustration right tall" style="box-sizing:border-box;margin:0px
        0px 1rem 1rem;float:right;width:401.266px"><a
        href="https://athas.org/illustrations/ba45c588-a189-4799-ae12-dd7e888948b1"
        style="box-sizing:border-box;color:rgb(156, 0,
        0);text-decoration:none"><img
        src="https://athas.org/illustrations/ba45c588-a189-4799-ae12-dd7e888948b1"
        /></a><figcaption style="box-sizing:border-box"><span
        style="font-family:'Packard Antique', serif"><em>Tyr Client Villages By
        Mark Hope</em></span> by Logarium</figcaption></figure><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem"></p><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem"><span
        style="font-family:'Helvetica Neue', Helvetica, Arial,
        sans-serif">Scale, it’s 15 miles between West Wall and
        Greybridge.</span></p><h2 id="crackbone-hollow"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique',
        serif"><strong>CRACKBONE HOLLOW</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">A
        dried-out elliptical lake-bed filled with bones. Fish, amphibians and
        other aquatic life are plentiful but close examination reveals the bones
        of humanoids among them. The lake-bed is under the effect of a permanent
        antimagic shell due to an ancient catastrophe. Only psionic enchantments
        will work here.</p><h2 id="dragon-horns"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique',
        serif"><strong>DRAGON HORNS</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">A pair
        of ominous crags that rise over the rocky badlands south of the Tyr
        Valley. They are home to a band of gith calling themselves the Dragon
        Horde, led by a wily old war-chief called Tuarg Broken-Fang. See DS4e
        Campaign Setting.</p><h2 id="forlin"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique',
        serif"><strong>FORLIN</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">A
        sizeable ishi moth plantation on the valley’s southern edge, Forlin is
        owned by Mandalis of The Order (see City-State of Tyr). He runs it as a
        successful business with the assistance of the extended Forlas family,
        many of whom he has tutored in The Way.</p><h2 id="fort-ianto"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique', serif"><strong>FORT
        IANTO</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">A
        fortress established by House Ianto during the economic crisis caused by
        Kalak. It is well guarded because some members of the House still trade
        in slaves from here.</p><h2 id="greybridge"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique',
        serif"><strong>GREYBRIDGE</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">The
        outermost bastion of Tyr, this fort is manned by guards and templars and
        watches over the Iron Road. The actual bridge for which it is named is
        in ruins now, its broken foundations standing either side of where the
        eoad runs through a long-dry river bed.</p><h2 id="haargraav"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique',
        serif"><strong>HAARGRAAV</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">The
        estate of one of Tyr’s oldest noble families. They refused to move
        closer to the city as Tyr’s verdant belt shrank and are now isolated
        upon the scrub plains that remain.</p><h2 id="iron-mine"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique', serif"><strong>IRON
        MINE</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">Tyr’s
        iron mine, source of much of its wealth. The final approaches to the
        mine are well guarded and the length of the road is frequently
        patrolled. See City-State of Tyr.</p><h2 id="rostaar"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique',
        serif"><strong>ROSTAAR</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">A small
        village in the northern reaches of the valley, set around a small oasis,
        the trees of which are home to large colonies of bats. Three druids
        watch over this area, venturing into the valley to deal with issues as
        needed.</p><h2 id="taricles"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique',
        serif"><strong>TARICLES</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">An ishi
        moth plantation run by House Taricles. Disinterested in city politics
        and with their holdings growing, the family moved their operations to
        this new location.</p><h2 id="torwald"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique',
        serif"><strong>TORWALD</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">Set on a
        small mesa, the village of Torwald is home to several families of erdlu
        and z’tal herders. They allow their flocks to graze on the scrub plains
        by day and corral them on the mesa by night. A track leading to
        Gunginwald is just north of the village.</p><h2 id="vanthur"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique',
        serif"><strong>VANTHUR</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">Just on
        the edge of Tyr’s verdant belt, Vanthur has long been home to
        generations of kip farmers. Immense herds are fenced in here and the
        place is well guarded as a result.</p><h2 id="west-wall"
        style="box-sizing:border-box;margin-top:0px;margin-bottom:0.5rem;font-weight:700;line-height:1.2;font-size:2rem;font-family:'Packard
        Antique', serif;color:rgb(156, 0, 0);text-shadow:rgb(0, 0, 0) 2px 2px
        0.25em"><span style="font-family:'Packard Antique', serif"><strong>WEST
        WALL</strong></span></h2><p
        style="box-sizing:border-box;margin-top:0px;margin-bottom:1rem">A
        crumbling old fort, home to wandering tribes of erdlu herders, West Wall
        stands empty most of the time but is occupied by tribesfolk as needed. A
        road runs west into the Ringing Mountains but is soon lost among the
        trackless peaks.</p></section>
