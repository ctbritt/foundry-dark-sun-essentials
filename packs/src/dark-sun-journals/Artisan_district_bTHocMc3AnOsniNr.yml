      content: "<section><div><div><div><div><div><div><div><div><div><p>Artisan District Personality</p><p>Although he is rarely seen inside his shop, Stone and Mortar, the mul stonecutter Xalos is a regular fixture in the district. He wanders the neighborhood and keeps up friendly acquaintances with its residents. He is specially fond of seeing sculptures made from custom stones that were delivered from his quarry. As part of his commitment to work behind the scenes to further liberate the people of Tyr, Xalos sits in on clandestine meetings between factions that seek power in the city-state. This habit serves him well in his other role—that</p><p>of a secret spy for Urik. The mul deludes himself, choosing to believe that he never gives up information that is too damaging to Tyr. He continues to take a stipend from his Urikite minder each time they meet in an empty room in Sculptors’ Square.</p></div></div></div></div></div></div></div></div></div></section><section><div><p>\_</p></div><div><div><div><div><div><div><div><div><div><p>This area is Tyr’s secondary trade district. Artisan Way begins at the foot of the Ziggurat of Kalak and wends north to the city-state’s wall, skirting the Warrens to the east. Permanent shops front the road, selling all manner of goods and services, including clothing, household items, fresh and dried foodstuffs, ale, footwear and shoe repair, weaving, and more. Other vendors and street performers work Artisan Way, but such people do not swarm the thoroughfare like locusts, as sometimes happens on Caravan Way.</p><p>The businesses in this part of Tyr serve local needs rather than the needs of visitors. Many freed slaves who have parlayed their skills into useful crafts or services make their homes in the Artisan District. The following shops and familiar sights lie in the district.</p><p>Karlen’s Eye: This shop sells collectibles and oddities gleaned from Under-Tyr and places beyond the city. Its owner, Karlen, is a talkative half-giant and retired adventurer who sees the potential for value in nearly any item plucked from obscurity. He also haggles over every sale.</p><p>Wayward Trader: This quiet tavern for locals serves kip sausage and biscuits, ales, and broy.</p><p>Stone and Mortar: In this store, customers order stone in bulk or to custom specification from a quarry outside the walls of Tyr. Xalos, the mul owner, is often absent, sitting in on secret meetings with other powerful citizens (and spying for Urik in the bargain).</p><p>Sculptors’ Square: Manors in the architectural style of the two Noble Districts stand here, remnants of a time when Tyr’s districts adhered to different borders. Although the buildings are dilapidated, they gained a new lease on life following Kalak’s fall. Freed slaves kept for their artistry have renovated portions of the crumbling manors for use as art studios. Many craft styles are represented in the square, but the most popular by far is marble and sandstone sculpture. Anyone can visit the studios to see the latest projects in progress, although donations are expected; each studio puts out a basin to collect spare coins. It’s easy to find an empty chamber in Sculptors’ Square suitable for renovation and, if inspiration strikes, the pursuit of an artistic dream.</p><p>Door of Drakes: Before they disappeared a hundred years ago, the members of the Dethersan noble family commissioned a structure that resembled a sepulcher adorned with drakes and flames in relief. When the building was finished, the family members entered it, locked it from the inside, and disappeared.<br />Over the years since, few people have managed to enter the Door of Drakes, and those who succeeded were swallowed without a trace. Today, locals leave the site alone.</p></div></div></div></div></div></div></div></div></div></section>"
