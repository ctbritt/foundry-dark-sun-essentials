    text:
      format: 1
      content: "<p>The ruins of Godshold lie near the Somber Woods, on\_the western side of the Lava Gorge. The ancient temple\_and its surrounding buildings date back to the middle\_Green Age. Forgotten gods were gathered into a pantheon\_by the domains of the lawmakers, and one northern\_domain was dedicated to preserving this\_ pantheon. All\_that remains of this domain is the jumbled ruins of\_Godshold.\_The main temple is mostly intact, with gold-covered\_walls and ornately carved icons that almost glow with the\_beliefs of a long-dead society. A powerful raaig guards the\_temple, keeping its secrets from all but the most stubborn\_and able\_ adventurers. It's said that the mysteries of the\_Green Age and the ancient gods lie in the temple's depths,\_waiting to be discovered. To retrieve them, adventurers\_must get past the spirit who guards the site – and past\_whatever other traps and defense wait within.\_The surrounding buildings aren't in wonderful\_ condition.\_</p>\n<p>These have been looted and explored mercilessly over the\_centuries, and natural disasters have added to the damage\_and decay. Little of worth remains in these structures, but\_who knows what small treasure might be hidden beneath\_a pile of rubble or on the other side of a secret door?</p>"
