  - sort: 200000
    name: Desert Travel
    type: text
    _id: cdQzaLAX3hVZqsmY
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Traveling in a <strong>desert</strong> in D&amp;D 5e can be grueling
        and dangerous due to extreme heat, lack of water, and harsh terrain.
        While the official rules for travel in a desert aren't laid out in a
        single place, we can reference the core rules in the <strong>Dungeon
        Master's Guide</strong> (DMG) and <strong>Player's Handbook</strong>
        (PHB) to piece together the necessary mechanics. Here’s how to handle
        travel in a desert environment in 5e:</p><hr /><h3><strong>1. Exhaustion
        from Extreme Heat</strong></h3><p>Deserts are characterized by their
        intense heat, particularly during the day. The rules for extreme heat
        are found in the <strong>Dungeon Master's Guide</strong>, p.
        110.</p><h4><strong>Extreme Heat
        Rules</strong>:</h4><ul><li><p><strong>Temperatures of 100°F (38°C) or
        higher</strong>: Any creature exposed to extreme heat without adequate
        protection (such as appropriate clothing or magic) must make a
        <strong>[[/save con dc=15 format=long]]</strong> at the end of each hour
        of exposure.</p><ul><li><strong>Failure</strong>: A failed save causes
        the creature to gain one level of <strong>exhaustion</strong> (PHB, p.
        291).</li><li><strong>Water Consumption</strong>: If the creature has
        access to <strong>at least 1 gallon of water</strong> per day, they gain
        <strong>advantage</strong> on this saving
        throw.</li></ul></li></ul><h4><strong>Effects of
        Exhaustion</strong>:</h4><p>While you have the Exhaustion condition, you
        experience the following effects.</p><p><strong>Exhaustion
        Levels.</strong> This condition is cumulative. Each time you receive it,
        you gain 1 Exhaustion level. You die if your Exhaustion level is
        6.</p><p><strong>D20 Tests Affected.</strong> When you make a D20 Test,
        the roll is reduced by 2 times your Exhaustion
        level.</p><p><strong>Speed Reduced.</strong> Your Speed is reduced by a
        number of feet equal to 5 times your Exhaustion
        level.</p><p><strong>Removing Exhaustion Levels.</strong> Finishing a
        Long Rest removes 1 of your Exhaustion levels. When your Exhaustion
        level reaches 0, the condition ends.This means that even a few hours of
        exposure to desert heat can severely weaken the party, especially if
        they lack sufficient water.</p><hr /><h3><strong>2. Water Consumption
        and Dehydration</strong></h3><p>In a desert, <strong>access to
        water</strong> is critical. Characters need a certain amount of water
        per day to stay hydrated, especially in hot
        environments.</p><h4><strong>Water
        Needs</strong>:</h4><ul><li><strong>Standard Requirement</strong>: A
        creature needs to drink <strong>1 gallon of water per day</strong> to
        avoid dehydration (DMG, p. 111).</li><li><strong>Hot Climates</strong>:
        In <strong>extreme heat</strong>, this requirement doubles to <strong>2
        gallons per day</strong>.</li></ul><h4><strong>Lack of
        Water</strong>:</h4><ul><li>A creature that drinks only
        <strong>half</strong> its required amount of water in a day must make a
        <strong>DC 15 Constitution saving throw</strong> at the end of that day.
        If the creature fails, it suffers one level of
        <strong>exhaustion</strong>.</li><li>A creature with <strong>no
        water</strong> automatically suffers one level of
        <strong>exhaustion</strong> at the end of the
        day.</li></ul><h4><strong>Magical
        Solutions</strong>:</h4><ul><li><strong>Create or Destroy
        Water</strong>: A 1st-level spell that can create up to <strong>10
        gallons of clean water</strong> within a range of 30 feet. This spell is
        essential for desert survival if mundane sources of water are
        unavailable.</li></ul><hr /><h3><strong>3. Movement in Desert
        Terrain</strong></h3><p>Traveling through a desert presents several
        difficulties, including <strong>uneven ground</strong>, <strong>sand
        dunes</strong>, and <strong>rocky outcroppings</strong>. This affects
        the party’s movement speed and ability to
        navigate.</p><h4><strong>Difficult Terrain</strong>:</h4><ul><li>In a
        desert, areas with <strong>loose sand</strong> or <strong>dunes</strong>
        count as <strong>difficult terrain</strong>, which <strong>halves
        movement speed</strong> (PHB, p. 182). This can significantly slow down
        the party's progress.</li></ul><h4><strong>Navigation and Getting
        Lost</strong>:</h4><ul><li><p>Due to the <strong>monotonous
        landscape</strong> and shifting dunes, characters can easily become
        disoriented and lost.</p><ul><li><strong>Survival checks</strong> (DC 15
        or higher) can be used to avoid getting lost or to help the party find
        water, shade, or shelter.</li><li><strong>Getting Lost</strong> (DMG, p.
        111): If the party fails its <strong>Survival check</strong>, they may
        become lost, forcing them to backtrack and lose precious time and
        resources.</li></ul></li></ul><h4><strong>Pace of
        Travel</strong>:</h4><ul><li>At a <strong>normal pace</strong>, the
        party can travel about <strong>24 miles per day</strong> (8 hours of
        travel) over flat terrain, but in the desert, difficult terrain can slow
        this to <strong>12 miles per day</strong> or less.</li><li>Traveling at
        a <strong>fast pace</strong> can increase this distance, but imposes
        <strong>disadvantage</strong> on <strong>Perception checks</strong>
        (making it easier to overlook dangers or water sources). At a
        <strong>slow pace</strong>, the party can move cautiously, gaining the
        ability to <strong>use Stealth</strong> while traveling and more easily
        spot threats and resources.</li></ul><hr /><h3><strong>4. Rest and
        Shelter in the Desert</strong></h3><p>Finding shelter is crucial in the
        desert, especially to <strong>rest</strong> and recover from
        exhaustion.</p><ul><li><strong>Long Rests</strong>: In extreme heat,
        characters cannot regain exhaustion levels from a <strong>long
        rest</strong> unless they find adequate <strong>shelter</strong> from
        the heat. This could mean finding shade, creating magical protection, or
        traveling at night.</li><li><p><strong>Magical
        Shelters</strong>:</p><ul><li><strong>Leomund’s Tiny Hut</strong>: This
        spell creates a dome of magical force that can provide shelter from the
        elements, allowing the party to rest and recover in
        safety.</li><li><strong>Mordenkainen’s Magnificent Mansion</strong>: A
        higher-level spell, this creates an extra-dimensional dwelling that
        could serve as a safe place to rest in the
        desert.</li></ul></li></ul><hr /><h3><strong>5. Navigating at
        Night</strong></h3><p>One option to avoid the worst of the desert heat
        is to travel at night. However, this comes with its own set of
        challenges:</p><ul><li><strong>Reduced Visibility</strong>: Without a
        light source, the party must navigate using <strong>darkvision</strong>
        (if applicable) or rely on the <strong>Survival skill</strong> to stay
        on course.</li><li><strong>Predators</strong>: Many desert predators are
        nocturnal, meaning that traveling at night can lead to encounters with
        creatures that use the darkness to their advantage.</li></ul><hr
        /><h3>Summary of Key Rules for Desert
        Travel:</h3><ol><li><strong>Exhaustion from Heat</strong>: DC 15
        Constitution saving throw every hour in temperatures above 100°F, with a
        failure leading to exhaustion.</li><li><strong>Water
        Requirements</strong>: 2 gallons per day in hot climates; lack of water
        results in exhaustion.</li><li><strong>Difficult Terrain</strong>: Loose
        sand and dunes slow movement, reducing travel
        speed.</li><li><strong>Hazards</strong>: Sandstorms, quicksand, and
        heatwaves add to the danger of desert travel.</li><li><strong>Rest and
        Shelter</strong>: Characters need proper shelter to recover from
        exhaustion during long rests.</li></ol><p>By using these rules, you can
        create an intense survival experience for desert travel in your D&amp;D
        5e game, especially in the unforgiving world of
        <strong>Athas</strong>.</p>
      markdown: ''
