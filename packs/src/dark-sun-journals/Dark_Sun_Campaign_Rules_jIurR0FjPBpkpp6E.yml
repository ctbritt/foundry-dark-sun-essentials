  - sort: 100000
    name: Resurrection
    type: text
    _id: BrLuakHAVQJta52l
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p>Resurrection on Athas is more difficult owing to its isolation from higher powers. This increases the emotional stakes of bringing a beloved friend back from the dead. It also adds the ever-increasing threat of losing a friend permanently to the game, even with the aid of miraculous magic.</p><p>If magic is used to bring a character back from the dead (except for the revivify spell; see below), everyone present becomes part of a resurrection ritual. Up to three characters present for the ritual—typically members of the deceased’s adventuring party—can contribute to the ritual by attempting to call their ally’s spirit back. This could involve delivering a stirring speech, playing a song from their shared childhood, goading a rival back with a display of sword skills, confessing undying love for them, or anything else that the players or the GM consider emotionally stirring.</p><p><strong>Participating in the Ritual.</strong> Each of the participating characters makes an ability check. A player can tell the GM what kind of check they want to make, but ultimately the GM decides what check is appropriate based on the character’s contribution to the ritual. The baseline DC of this check is 15, but the GM can raise or lower the DC (typically anywhere between 10 and 20) if the contribution seems particularly appropriate or particularly insincere.</p><p>For example, praying to a fallen paladin’s god for mercy might require a participant to make a [[/check religion dc=10 format=long]], whereas shouting at a dead friend’s corpse to get back up and stop lazing around might require a [[/check intimidation dc=20 format=long]]. If the contribution is roleplayed in a particularly touching way, the GM can grant advantage on the check—even if the check’s DC remains high.</p><p><strong>Resurrection Check.</strong> After all the characters’ contributions are completed, the GM rolls a single, final resurrection check with no modifier. The base DC of this check is 10, but it is modified in three ways:</p><ul><li>The DC is increased by 1 for every time the character has returned to life before, as the soul’s connection to this world is slowly eroded by repeatedly dying and returning.</li><li>The DC is reduced by 3 for each successful contribution from the other participants in this ritual.</li><li>The DC is increased by 1 for each failed contribution to the ritual.</li></ul><p>If the resurrection check is successful, the character’s soul is returned to their body (if the soul is willing, as usual). If the check fails, the soul does not return—and the character is permanently unable to be raised from the dead.</p><p><strong>True Miracles.</strong> If a character is brought back from the dead by the @UUID[Compendium.shareddata.ddb-spells.VRokCPPitrzUhOy1]{Resurrection} or the @UUID[Compendium.shareddata.ddb-spells.5nrxQGbHJ4JQWe9F]{Wish} spell, they instantly return to life without the need for a resurrection ritual. Additionally, if a character has been permanently lost due to a failed resurrection ritual, the GM can allow a casting of <em>true resurrection</em> or <em>wish</em> to begin a last-chance resurrection ritual—one that can’t be repeated if failed.</p><p><strong>Revivify. </strong>If a spell with a casting time of 1 action is used to restore life to a creature (including the @UUID[Compendium.shareddata.ddb-spells.c7ESC2kYdbvc3ouA]{Revivify} spell), no one but the caster can participate in the resurrection ritual. The caster makes a quick resurrection check by rolling [[/r 1d20]] and adding their spellcasting ability modifier, against a DC equal to 10 + 1 for every time the character has returned to life before. On a failure, the character’s soul is not lost, but the resurrection fails and increases the DC of any future resurrection checks by 1. Further attempts to bring the character back to life must involve a spell with a casting time longer than 1 action (including raise dead or resurrection).</p><p><strong>Taxing Return.\_</strong>In a campaign that uses this house rule, whenever a character is restored to life, the process corrodes a fraction of their vitality, slowly consuming the body until it can no longer sustain life. Each time a character is brought back to life by a spell other than <em>true resurrection</em>, that character’s Constitution score is permanently reduced by 1. This loss can’t be restored except by use of a wish spell. A character whose Constitution score is reduced to 0 in this way dies permanently and can’t be returned to life by any means.</p>"
