  - sort: 250000
    name: Desert Hazards
    type: text
    _id: hb5YfA86qVtIpJNd
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Deserts are filled with natural hazards, from
        <strong>sandstorms</strong> to dangerous <strong>predators</strong>.
        Here are some common hazards characters might
        face:</p><h4><strong>Sandstorms</strong>:</h4><ul><li><strong>Effect</strong>:
        Vision is heavily obscured (causing <strong>disadvantage</strong> on
        Perception checks) and ranged weapon attacks are nearly impossible due
        to the blowing sand. A sandstorm can also batter the characters,
        requiring them to make <strong>Constitution saving throws</strong> (DC
        10–15) to avoid taking <strong>bludgeoning damage</strong> and potential
        exhaustion.</li></ul><h4><strong>Quicksand</strong>:</h4><ul><li><strong>Effect</strong>:
        Characters who step into quicksand can become trapped, requiring a
        <strong>DC 10 Strength check</strong> to escape. Creatures in quicksand
        sink 1d4 feet per round unless they
        escape.</li></ul><h4><strong>Heatwaves</strong>:</h4><ul><li><strong>Effect</strong>:
        During a heatwave, the <strong>DC for Constitution saving
        throws</strong> to avoid exhaustion due to heat increases to 20. Water
        evaporates more quickly, and creatures without shelter suffer
        <strong>disadvantage</strong> on all saving
        throws.</li></ul><h4><strong>Predators</strong>:</h4><ul><li>Deserts are
        home to creatures adapted to the environment, such as
        <strong>bulette</strong>, <strong>gaj</strong>, or
        <strong>thri-kreen</strong>. These creatures often hunt weakened or
        dehydrated travelers.</li></ul><h4>Brambleweed</h4><p>Brambleweed is a
        thick, thorny, vine-like plant that grows with incredible speed. Only
        the leading edge of a brambleweed mass actually grows; the rest is an
        almost impassable wall of thorns.</p><p>When a creature moving into a
        brambleweed patch for the first time on a turn or starting its turn
        there takes [[/damage 6d10 type=piercing average]] from the
        brambleweed's thorns. In addition, the creature must succeed on a
        [[/save dex dc=12 format=long]] or become restrained by the thorns. A
        restrained creature can use its action to try to escape, doing so with a
        successful [[/check ath dc=12 format=long]] or [[/check acr
        format=long]].</p><p>Each 10-foot cube of bramble weed has AC 11, 15 hit
        points, vulnerability to fire, and immunity to bludgeoning, piercing,
        and psychic damage. If a creature makes a melee weapon attack against
        brambleweed and misses by 5 or more takes [[/damage 1d10 type=piercing
        average]] from the thorns.</p><h4>Burnflowers</h4><p>This hearty plant
        has highly shiny leaves that reflect sunlight into deadly beams of
        energy.</p><p>Burnflowers appear as a patch of grey-green vines with
        closed bulb-shaped flowers. If the flowers are opened, they are found to
        be coated with a clear, sticky sap. The sap has a nasty, bitter flavor
        and is neither edible nor poisonous.</p><p>When a creature comes within
        150 feet of a 10-by-10-foot patch of burnflowers, the burnflowers are
        triggered. The patch fires a beam of fire at the creature. The creature
        must make a [[/save dex dc=10 format=long]], taking [[/damage 4d10
        type=fire average]] on a failed saving throw or half as much on a
        successful one.</p><p>Each 10-by-10-foot patch of burnflowers have an AC
        9, 15 hit points, and immunity to bludgeoning, piercing, and psychic
        damage.</p><h4>Dune Trappers</h4><p>A sparkling oasis in the middle of
        the desert, the dune trapper appears to be the salvation of many lost
        travelers. Unfortunately for most, apparent salvation often turns into
        death.</p><p>The dune trapper is often mistaken for a solitary oasis in
        the desert. The trapper has the appearance of almost an acre of
        vegetation surrounding a small pool of water.</p><p>A creature that
        comes to drink at or is near the pool must make a DC 19 Strength or
        [[/save dex format=long]] (target's choice). On a failed save, the dune
        trapper's waters grab the creature and it is restrained. If it is still
        restrained at the end of its next turn, the creature must make a [[/save
        str dc=19 format=long]]. On a failure, the creature is pulled into the
        water. While in the water the creature is restrained, drowning, and
        takes [[/damage 7d6 type=acid average]] at the start of each of the dune
        trapper's turns. As long as the creature isn't completely submerged by
        the dune trapper's waters, it can escape by using its action to make a
        successful [[/check str dc=19 format=long]]. A creature can pull the
        creature out of the dune trapper by using its action to make a
        successful [[/check str dc=19 format=long]]. If a creature fails its
        [[/check str format=long]] to rescue the other creature by 5 or more, it
        too is grabbed by the dune trapper's waters and must make its own series
        of saving throws to prevent being pulled in.</p><h4>Esper
        Weed</h4><p>Esperweed is a plant that grows in the few remaining
        tropical areas of Athas, as well as on some of the mudflats surrounding
        the Sea of Silt. A fairly rare plant by nature, esperweed is sought
        after by many for its psionic boosting powers.</p><p>Esperweed does not
        look like a weed of any kind but instead is a flowering plant that grows
        up to three feet in height. The esperweed stalk is brownish-green in
        color near the ground but becomes bright green as it nears its leaves
        and flowers. The leaves are roughly oval-shaped and anywhere from three
        to four inches in length. The esperweed flowers are perhaps the most
        unusual characteristic of the plant. They are large and sport six
        petals, each nearly six inches in length. In the center of the petals is
        a small circular stamen colored bright red. The petals are of this same
        color at their base but fade to a reddish-orange at the petal's outer
        edge.</p><p>Natives of Athas have discovered that, when eaten, the roots
        of esperweed can boost psionic powers to very high levels. This boost is
        fairly short-lived, lasting for only 1 round. When the esperweed is
        eaten, any creature that makes a saving throw against the consumer's
        psionic powers does so with disadvantage.</p><p><strong>Repeated Use of
        Esperweed.</strong> While esperweed is very useful to psionic creatures
        and characters, repeated use can also be detrimental. Creatures can eat
        esperweed and enjoy its psionic boosting capabilities a number of times
        equal to their Hit Dice (or current experience level) without any ill
        effects in a 7-day period. For each use beyond that, however, the
        creature's psionic ability fades. The creature's maximum PSPs are
        reduced by 1d6. The reduction lasts until cured with a lesser
        restoration spell or similar magic.</p><h4>Sand Cacti</h4><p>Sand Cacti
        are a vile form of plant life that dwells anywhere there is sand. It
        feeds on the blood of its victims. Sand cacti are well protected; the
        entire plant (except the needles) is hidden below the sand.</p><p>The
        body is from 5-8 feet across and about 4 feet thick. It has many barbed
        needles attached to it with long, thin, fibrous strands. The bulbous
        body of the plant and the strands are sickly white, while the needles
        very closely resemble the color of the sand in the area.</p><p>A
        creature that walks into an area with sand cacti without first noticing
        it with a [[/check prc dc=15 format=long]] steps on a needle. The
        creature takes [[/damage 1d6 type=piercing average]] and it is grappled
        (escape DC 10). While grappled, the target's movement is 0 and it loses
        3 (1d6) hit points due to the blood loss at the start of each of the
        sand cacti's turns. The target can use its action to pull the
        needle-free from its foot but takes [[/damage 1d6 average]] from the
        needle's barbs.</p><p>A creature can cross through a sand cacti's barb
        field without taking damage by making a successful [[/save dex dc=10
        format=long]]. A creature moving through the area at half speed doesn't
        need to make the save.</p>
