      content: "<p>The Gladiatorial Coliseum</p><p>of Nibenay</p><p>This ancient structure predates all visible buildings</p><p>within the city. The coliseum remains as the last surviving</p><p>structure from the original city.</p><p>Located in a rundown part of town, the exterior edges</p><p>of the coliseum dwarf the small ramshackle homes and</p><p>huts of the transients who live there. Born of an ancient</p><p>time, the intricate construction in no way resembles the</p><p>current architecture of the city. Ornate drawings and</p><p>illustrations are etched into every facet of the coliseum\x92s</p><p>stonework. Colorful gilded mosaics, worn and tired from</p><p>time, are found alongside rugged weathered carvings.</p><p>The coliseum itself is of monstrous proportions.</p><p>Seated on four city blocks, the coliseum surely dominated</p><p>its surroundings when all of the structure was visible.</p><p>No one, save the Shadow King, is sure when the</p><p>coliseum was constructed or by whom.</p><p>The coliseum was originally designed to ascend from</p><p>ground level to a stunning height, towering above the</p><p>surrounding area. Hundreds and hundreds of years</p><p>later, the constant wear of blown sand, coupled with generation</p><p>after generation of buildings erected atop the</p><p>ruined foundations of their predecessors has given the</p><p>coliseum its sunken appearance.</p><p>Traveling from the city, visitors walk the Great Way on</p><p>their trip to the arena. The Great Way is a huge pedestrian</p><p>mall, 80 feet wide and 4,000 yards long. Its edges</p><p>are lit by ever-burning lights. Vendors and barkers line</p><p>its expanse, offering cool dips of water or exotic refreshments</p><p>to those traveling to or from the arena. The Great</p><p>Way is guarded by the Shadow King\x92s templars. It is the</p><p>only (relatively) safe place to walk at any time, day or</p><p>night, in the city.</p><p>From a distance, the coliseum is a sight to behold.</p><p>Only up close, however, can its true size be realized.</p><p>Viewed from close to any corner, the building appears</p><p>to run on infinitely. Although the building stands only</p><p>six stories high from the exterior ground level, it still</p><p>commands a feeling of greatness and veneration. Its</p><p>true enormity cannot be grasped until one enters the</p><p>structure.</p><p>New spectators entering from the current ground</p><p>level of the city draw an involuntary breath, for the coliseum</p><p>is the largest known structure in the Tablelands.</p><p>A l most a quarter of a mile across, the stadium is an</p><p>inverted ziggurat. Seven separate levels rise above the</p><p>playing field. Many of the arenas of the Tablelands</p><p>could be placed within the gladiatorial playing field.</p><p>Although the stadium is built of an excellent hard</p><p>stone that has endured the weathering of many generations,</p><p>the seats themselves are carved from a softer sandstone.</p><p>Every individual seat of the arena is carved with a</p><p>small oval depression for comfort. Each seat is etched in</p><p>exquisite detail. No known structure rivals this arena for</p><p>its beauty and meticulous stonework. Not even a square</p><p>foot of stone is without some sort of decoration.</p><p>Many of the entrances and exits of the coliseum that</p><p>extend below the level of the city are filled with rubble</p><p>and debris. A few of the areas in the lower part of the</p><p>arena have been reclaimed. These areas include animal</p><p>pens, barracks, and gladiator training facilities. A</p><p>peculiar set of rooms connects to the gladiatorial</p><p>rooms. These contain myriad basins and troughs. It is</p><p>believed these rooms were once part of an ancient set</p><p>of baths, but this is merely speculation by some local</p><p>scholars.</p><p>The current dilemma facing the arena is that with the</p><p>depth of the combat field, it is difficult to introduce</p><p>creatures into the arena. Captured beasts must be</p><p>brought in and lowered down ramps to the coliseum</p><p>floor. More than one creature and several handlers have</p><p>died during this dangerous transport. Slave gladiators</p><p>are known to call the Coliseum \x93the thousand steps to</p><p>death,\x94 for it takes a thousand steps to descend from</p><p>ground level to the gladiatorial floor. The majority of</p><p>those who make the trip never walk out.</p>"
