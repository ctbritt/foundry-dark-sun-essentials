    text:
      format: 1
      content: "<p>Near the middle of the Maze of Draj is a low mesa\_whose edges are studded with nearly a hundred stone\_obelisks, each decorated with skulls. The skulls have\_been filled with mortar and drilled such that winds\_blowing through the menhirs produce an awful\_moaning. Draji hunters and reed-gatherers avoid the\_mesa because a large and fierce tribe of belgoi long\_ago claimed these lands from whoever raised the obelisks. Some believe that the ruin of an ancient city lies\_somewhere nearby, and that the belgoi protect the\_fabulous treasure it must contain.</p>"
