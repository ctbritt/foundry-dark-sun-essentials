    text:
      format: 1
      content: "<p>House Inika</p>\n<p>House Inika is the largest of the dynastic merchant houses to</p>\n<p>base its operations in Gulg. It is, however, small by the standards</p>\n<p>of the other major houses of the Tyr region. Taking its</p>\n<p>style from House Riben of Gulg, Inika keeps its caravans small</p>\n<p>and its profits high. Inika was established only 300 years ago</p>\n<p>when a trusted agent of House Riben left to start his own</p>\n<p>enterprise. After a rocky start, the small house established</p>\n<p>itself as a shrewd competitor with an efficient, streamlined</p>\n<p>operation. It may have been the oba\x92s intolerance for the opulent</p>\n<p>display and bellicose rivalries of the foreign houses that</p>\n<p>helped Inika establish itself. Its success soon eclipsed House</p>\n<p>Riben, whose fortunes dwindled over the centuries.</p>\n<p>House Riben eventually neared financial collapse and, in</p>\n<p>an uncharacteristic manner, turned to the oba for financial</p>\n<p>assistance. The queen bought the facilities of the house and</p>\n<p>continues to use them today as her own trade storehouses. The</p>\n<p>family withdrew from mercantile endeavors, but a templar</p>\n<p>from the Riben family still heads the oba\x92s trade operations.</p>\n<p>House Inika has a unique advantage over foreign competitors</p>\n<p>in Gulg. It is the only trading house that has a thorough</p>\n<p>understanding of Gulg culture. Because of the expertise of its</p>\n<p>native employees, Inika is generally able to negotiate better</p>\n<p>terms with the templars for export goods than are its rivals. (See</p>\n<p>the Dune Trader accessory for more about House Inika.)</p>"
