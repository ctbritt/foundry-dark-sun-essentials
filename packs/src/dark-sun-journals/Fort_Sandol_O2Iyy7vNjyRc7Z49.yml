      content: >-
        <div><h1>Fort
        Sandol</h1><div><p></p></div></div><div><div><div><div><div><div><p>Outpost
        and trading post in the Tablelands, approximately 50 miles north of
        Gulg. This distant, lonely outpost occasionally services caravans, but
        its primary function is as a trading post for the various nomads who
        travel throughout the Tablelands. Nomads of all races may be found here,
        selling artwork, weapons, or slaves taken in raids. Currently, Tara Stel
        Commands the post personally in hopes to improve relations with the elf
        tribes in the area, she is a strong negotiator but there is much bad
        blood between the elves and House
        Stel.</p></div><div><h3>Defences</h3><div><p>High Walls, 4
        Ballistae,</p></div></div><div><h3>Assets</h3><div><p>Stables</p></div></div></div><div><div><div><div><div><div><p>Type</p></div><div><p>Military,
        Base</p></div></div><div><div><p>Population</p></div><div><p>20
        employees, 50 slaves</p></div></div><div><div><p>Location
        under</p></div><div><p>TABLELANDS</p></div></div><div><div><p>Owner/Ruler</p></div><div><p>Tara
        Stel</p></div></div><div><div><p>Owning
        Organization</p></div><div><p>MILITANT
        TRADERS</p></div></div><div><div><p>Characters in
        Location</p></div><div><ul><li>Tara
        Stel</li></ul></div></div></div></div></div></div></div></div></div></div>
