hy/the-tyr-region/city-state-of-tyr/exploring-tyr/caravan-district?authuser=0#h.40mk0gpo7476\">The Draqoman Station:</a></div>\n<div class=\"zfr3Q pBmh1 SV3pxb\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\" data-id=\"h.bec6ho8npanb\"><a class=\"mTgrD aw5Odc mD9Vkc\" style=\"box-sizing:border-box;color:#006580;margin-top:0px;margin-bottom:0px;display:inline;overflow-wrap:break-word;overflow:hidden;margin-left:8px;text-decoration:underline\" href=\"https://sites.google.com/view/darksunforgms/geography/the-tyr-region/city-state-of-tyr/exploring-tyr/caravan-district?authuser=0#h.bec6ho8npanb\">Grik's Weaponry</a></div>\n<div class=\"zfr3Q pBmh1 SV3pxb\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px\" data-id=\"h.ei485x8loqqa\"><a class=\"mTgrD aw5Odc mD9Vkc\" style=\"box-sizing:border-box;color:#006580;margin-top:0px;margin-bottom:0px;display:inline;overflow-wrap:break-word;overflow:hidden;margin-left:8px;text-decoration:underline\" href=\"https://sites.google.com/view/darksunforgms/geography/the-tyr-region/city-state-of-tyr/exploring-tyr/caravan-district?authuser=0#h.ei485x8loqqa\">Shining Sands</a></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<section id=\"h.6f57064c2432ee82_80\" class=\"yaqOZd\" style=\"display:table;box-sizing:border-box;background-size:cover;position:relative;table-layout:fixed;width:1661px;padding-bottom:1.5rem;padding-top:1.5rem\">\n<div class=\"IFuOkc\" style=\"box-sizing:border-box;background-size:cover;display:table-cell;table-layout:fixed;height:4968.06px;left:0px;pointer-events:none;position:absolute;top:0px;width:1661px\">\_</div>\n<div class=\"mYVXT\" style=\"box-sizing:border-box;display:table-cell;vertical-align:middle;width:1661px\">\n<div class=\"LS81yb VICjCf\" style=\"box-sizing:border-box;width:1280px;margin:0px auto;max-width:1280px;padding-left:48px;padding-right:48px;outline:0px\" tabindex=\"-1\">\n<div class=\"hJDwNd-AhqUyc-uQSCkd purZT-AhqUyc-II5mzb pSzOP-AhqUyc-qWD73c JNdkSc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1184px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\n<div class=\"oKdM2c Kzv0Me\" style=\"box-sizing:border-box;width:1154.41px;margin-top:0px;margin-bottom:0px;max-width:1280px\">\n<div id=\"h.6f57064c2432ee82_77\" class=\"hJDwNd-AhqUyc-uQSCkd jXK9ad D2fZ2 OjCsFc wHaque GNzUNc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1154.41px;white-space:pre-wrap;overflow-wrap:break-word\">\n<div class=\"jXK9ad-SmKAyb\" style=\"box-sizing:border-box;width:1154.41px\">\n<div class=\"tyJCtd mGzaTb baZpAe\" style=\"box-sizing:border-box;position:relative;width:1154.41px;padding:8px\">\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px\">The Caravan District is the primary trade and visitor’s district in Tyr.</p>\n<div id=\"h.qytrfa7ynnxe\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;display:block\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);font-size:0px;opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.qytrfa7ynnxe_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nThe Caravan Gate</div>\n<h2 id=\"h.qytrfa7ynnxe_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:20px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#226e93;font-size:19pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\">Trading caravans enter the city of Tyr through this ancient portal. Loading and unloading is done in an area of hard-packed dirt to the right of the gate. Other merchants wait on the opposite side of the road to load or unload. The enormous gate may accommodate fully loaded wagons or carts (smaller than argosies) that generally pass directly into the city before unloading at a trading emporium or one of the city's markets. The massive gate consists of two large doors, each 10 feet high and nearly as wide. Constructed of roughcut agafari timbers, banded together with weathered mekillot hide and rusted studs and hinges of iron, the gates open onto a tunnel that passes through the city wall. Just inside the wall to the left of the road rests a monstrous block of stone. In times of war, the gate is barred and a templar or defiler levitates the stone using arcane magics while half-giant guards pull it into position to seal the tunnel. There it remains until the war ends.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\">The gate is always manned by a 1st- to 4th-level templar and two half -giant warriors of similar levels. The templar records the names of merchants of foreigners entering the city, asks their reason for visiting Tyr, and collects a tariff that varies depending on the size of the caravan. The templar will sometimes inflate this amount by 25-100% to line his own pockets. The tariff rate is five ceramics for each erdlu or crodlu, 1 cp for each inix or kank, and 5 cp for each mekillot in a given caravan. Small wagons (1000- or 2500-pound capacity) or other transports receive a toll of five ceramics, while the tax on larger wagons runs 1 cp. (How much the templar attempts to extort depends on his estimate of what the trader can afford, as well as his general disposition toward the individual(s) involved. Adventurers may attempt to bargain, use psionics or suggestion spells to influence the gate templar. Discovery of deception means a stiff fine or incarceration, though.)</p>\n<div id=\"h.qjyz6whtfh6l\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;display:block\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);font-size:0px;opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.qjyz6whtfh6l_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nCaravan Way</div>\n<h2 id=\"h.qjyz6whtfh6l_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:20px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#226e93;font-size:19pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\">Caravan Way is the main thoroughfare through the trade districts. The broad avenue grants mounted riders the room necessary to maneuver through scattered clusters of pedestrians and street vendors hawking their wares. Caravan Way meanders through the main tradesmen's district into the <span class=\" aw5Odc\" style=\"box-sizing:border-box;color:#006580;text-decoration:underline\"><a class=\"XqQF9c\" style=\"box-sizing:border-box;color:inherit;text-decoration:none;pointer-events:all\" href=\"https://sites.google.com/view/darksunforgms/geography/the-tyr-region/city-state-of-tyr/exploring-tyr/merchant-district?authuser=0\">merchants district</a></span> where it circles Iron Square.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\">The shops bordering Caravan Way cater to merchants and visitors to Tyr. They possess the widest variety of merchandise available in the city One shop may offer leather goods,waterskins, harnesses, cargo covers and such, while another displays suits of chitin armor and barding, and so on.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px;text-align:left;text-indent:0px\">Past the press of caravans and new arrivals near the gate, Caravan Way meanders west through the heart of the main trade district. By day, the road is dotted with clusters of pedestrians and street vendors hawking their wares. Permanent shops throng Caravan Way, selling myriad goods, including clothing, caravan supplies, feed for mounts, rations, spirits, collectibles, arms, and armor. Practically any mundane item can be found in this district, although prices are generally higher here (10-20%) than in the rest of the city.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px;text-align:left;text-indent:0px\">Travelers passing this way may see any manner of businesses including the following:</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px;text-align:left;text-indent:0px\">\_</p>\n<div id=\"h.ddwz8pthr36y\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;display:block\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);font-size:0px;opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.ddwz8pthr36y_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nDevyn’s Desertwear</div>\n<h2 id=\"h.ddwz8pthr36y_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:20px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#226e93;font-size:19pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px;text-align:left;text-indent:0px\">Items for sale include broad-brimmed sun hats, sweat-wicking kanduras, sun goggles, fingerless gauntlets, horn-heeled boots, scarves, and more. Devyn, a forty-year-old female human, is also a Veiled Alliance contact.</p>\n<div id=\"h.kukbe4tbotb4\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;display:block\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);font-size:0px;opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.kukbe4tbotb4_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nEzar’s Storehouse</div>\n<h2 id=\"h.kukbe4tbotb4_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:20px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#226e93;font-size:19pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px;text-align:left;text-indent:0px\">In the past year, this warehouse has gone through several owners. Each one died under strange circumstances. Now, no one dares take ownership, and stories say the warehouse is haunted. A secret passage below the building leads into a particularly dangerous portion of Under-Tyr. (Id-fiends lair?)</p>\n<div id=\"h.40mk0gpo7476\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;display:block\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);font-size:0px;opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.40mk0gpo7476_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nThe Draqoman Station:</div>\n<h2 id=\"h.40mk0gpo7476_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:20px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#226e93;font-size:19pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\">A placard with a stylized eyeball, ear, and lips impaled on a spike hangs as a standard just inside the Caravan Gate. This is the rendezvous point for draqomen. A draqoman acts as a guide/interpreter/agent for visitors and businessmen newly come to Tyr.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\">\_</p>\n<div id=\"h.bec6ho8npanb\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;display:block\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);font-size:0px;opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.bec6ho8npanb_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nGrik's Weaponry</div>\n<h2 id=\"h.bec6ho8npanb_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:20px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#226e93;font-size:19pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\">Grik's weapons shop lies a few doors down from the caravan gate. Those who know weapons often seek out the gap-toothed mul to fill their needs. An ex-gladiator, Grik sells finely crafted weapons at only a slight markup (10%). Erdlu-claw daggers, obsidian-tipped javelins, bramble-tree clubs, as well as metal weaponry of all sorts can be found within the cluttered, two-story shop during daylight hours. The walls of the building's first story are constructed of uneven blocks of sandstone, the second floor being composed of sun-baked bricks. A massive stone door seals the entrance after hours. There are no windows. A stairway behind the counter at the back of the shop leads to Grik's living quarters upstairs.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\">Grik is assisted by a grizzled dwarf named Murd, his former arena partner. Murd's mind was largely destroyed in a gladiatorial match, reducing him to little more than a feral animal. Now he spends most of the day sitting in Grik's shop sharpening blades, leaving only occasionally to roam the town. When in the store, he glares at customers, growling the entire time they remain in the shop. His manic fascination with blades provides some benefit to Grik. Not only does Murd discourage thieves, but he has a knack for honing edges to an uncanny sharpness. In game terms, any edged weapon purchased from Grik will have a +1 damage bonus for the first five successful strikes made with it, thereafter the weapon reverts to doing normal damage.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><strong style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Grik 7th-level Male Mul Gladiator, Lawful NeutralStr 19 Dex 14 Con 18 Int 12 Wis 15 Cha 11AC 3 (braxat hide)Movement 12 hp 68 Dmg: 1d8+7 (steel long sword) weapon improvisation, bargain, blind-fighting.Psionics Summary: PSPs 48; Wild Talent Adrenalin Control</strong></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><strong style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Grik conducts business in a brisk, no-nonsense fashion. He's a hard bargainer and if anyone calls into question the quality of his wares or the fairness of his prices, he will politely refer them to Flin's arms shop just inside the Stadium Gate or the Elven Market where they may find weapons more in keeping with their pocketbook. \"But ye'll get what ye pay fer,\" he'll call after them. When asked about Murd, he tells customers to leave him alone. Grik will sometimes buy weapons of quality in good shape, but he will only go 30 to 50% of the retail rate. For magical or metal weapons, however, he'll pay up to 75% of their value (he then turns around and marks them up 25% over retail). Adorning Grik's hand is a dull iron band that is actually a ring of jumping.</strong></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font