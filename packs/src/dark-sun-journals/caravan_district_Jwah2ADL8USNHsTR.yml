t the rate of 5 bits a night (meals not included). </strong></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><strong style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Mila Risani owns the Golden Inix and does a good business. There is rarely any trouble at the inix for Mila is an accomplished psionicist, able to dispatch unruly customers without lifting a finger. She prefers not to exhibit her powers, though, unless it's absolutely necessary. Jaryx, the half-giant, takes care of most troublemakers. </strong></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><strong style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">She has three scullery maids/cooks and the half-giant on her staff to assist her. </strong></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><strong style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Mila Risani</strong></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;positi