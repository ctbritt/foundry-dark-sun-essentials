der:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);font-size:0px;opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.ei485x8loqqa_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nShining Sands</div>\n<h2 id=\"h.ei485x8loqqa_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:20px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#226e93;font-size:19pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\">The Shining Sands is a dry-sand laundry located on the edge of the Tradesmen's District near the Nobles Quarter. I'toc and his wife Nesa run the establishment. The pair collect only the finest pure white sand from the nearby desert. When clothes become too dirty, smelly, or impregnated with body fluids, garments are brought to the Shining Sands. The proprietors use the extra fine sand to scrub the dirt and excess oils from the garments. Dirty or soiled sand is always discarded, and clean sand is continually applied until the garment becomes sand-clean. This method of cleaning does not work on some blood stains, but will remove 85% of all dirt and stains. I'toc and Nesa charge one ceramic bit for a dozen garments. For a like amount, the couple will scent the garments with sweet smelling cactus-flower water. The couple also provides a small discreet lounge in back if an individual wishes to have the clothing they are wearing cleaned.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><strong style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">I'toc</strong></span> 37-year-old human male merchant; broad shouldered, closely cropped dirt brown hair; AL N; AC 10; HD 2; hp 12; To hit+ 3; #AT 1; Dmg: 1d6 (club); SZ M; ML 10; Str 15; Dex 9; Con 13; Int 10; Wis 12; Cha 11.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667\"><span style=\"box-sizing:border-box;font-family:Lato\"><strong style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Nesa</strong></span> 41-year-old mul female; powerful, charismatic, serene (non-warrior); AL N; AC 12; HD 3; hp 21; To hit +3; #AT 1; Dmg: 1d6 (club); Str 15; Dex 14; Con 16; Int 9; Wis 11; Cha 8.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px;padding-left:0px;text-align:left;text-indent:0px\">\_</p>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<section id=\"h.6f57064c2432ee82_93\" class=\"yaqOZd\" style=\"display:table;box-sizing:border-box;background-size:cover;position:relative;table-layout:fixed;width:1661px;padding-bottom:1.5rem;padding-top:1.5rem\">\n<div class=\"IFuOkc\" style=\"box-sizing:border-box;background-size:cover;display:table-cell;table-layout:fixed;height:234.719px;left:0px;pointer-events:none;position:absolute;top:0px;width:1661px\">\_</div>\n<div class=\"mYVXT\" style=\"box-sizing:border-box;display:table-cell;vertical-align:middle;width:1661px\">\n<div class=\"LS81yb VICjCf\" style=\"box-sizing:border-box;width:1280px;margin:0px auto;max-width:1280px;padding-left:48px;padding-right:48px;outline:0px\" tabindex=\"-1\">\n<div class=\"hJDwNd-AhqUyc-uQSCkd purZT-AhqUyc-II5mzb pSzOP-AhqUyc-qWD73c JNdkSc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1184px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\n<div class=\"oKdM2c Kzv0Me\" style=\"box-sizing:border-box;width:1154.41px;margin-top:0px;margin-bottom:0px;max-width:1280px\">\n<div id=\"h.6f57064c2432ee82_90\" class=\"hJDwNd-AhqUyc-uQSCkd jXK9ad D2fZ2 OjCsFc wHaque GNzUNc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1154.41px;white-space:pre-wrap;overflow-wrap:break-word\">\n<div class=\"jXK9ad-SmKAyb\" style=\"box-sizing:border-box;width:1154.41px\">\n<div class=\"tyJCtd mGzaTb baZpAe\" style=\"box-sizing:border-box;position:relative;width:1154.41px;padding:8px\">\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;padding-left:0px;text-align:left;text-indent:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><strong style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Caravan District Personality</strong></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px;text-align:left;text-indent:0px\">Jossi is an elf street performer seen all over the Caravan District, demonstrating impressive juggling skills for coin.Her performance involves singing, selecting volunteers from the crowd to participate in her stunts, and other tricks designed to delight. Jossi is actually a thief who supplements her income by serving as a messenger (and sometimes an assassin) for Tyr’s Eyes—a network of beggars, thieves, and other street people. She also works for various criminal elements in the city, including the Toothcutters gang in the Warrens.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin:12px 0px 0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-weight:400;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px;padding-left:0px;text-align:left;text-indent:0px\">Jossi sizes up visitors to Tyr, making a note of the inn or tavern where they take lodging. She never knows when information about rich or unusual travelers from the desert might be worth something.</p>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<section id=\"h.15e3b2dac61a40f_3\" class=\"yaqOZd\" style=\"display:table;box-sizing:border-box;background-size:cover;position:relative;table-layout:fixed;width:1661px;padding-bottom:1.5rem;padding-top:1.5rem\">\n<div class=\"IFuOkc\" style=\"box-sizing:border-box;background-size:cover;display:table-cell;table-layout:fixed;height:553.234px;left:0px;pointer-events:none;position:absolute;top:0px;width:1661px\">\_</div>\n<div class=\"mYVXT\" style=\"box-sizing:border-box;display:table-cell;vertical-align:middle;width:1661px\">\n<div class=\"LS81yb VICjCf\" style=\"box-sizing:border-box;width:1280px;margin:0px auto;max-width:1280px;padding-left:48px;padding-right:48px;outline:0px\" tabindex=\"-1\">\n<div class=\"hJDwNd-AhqUyc-II5mzb purZT-AhqUyc-II5mzb pSzOP-AhqUyc-II5mzb JNdkSc yYI8W \" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:394.656px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\n<div class=\"oKdM2c Kzv0Me\" style=\"box-sizing:border-box;width:365.062px;margin-top:0px;margin-bottom:0px;max-width:1280px\">\n<div id=\"h.15e3b2dac61a40f_0\" class=\"hJDwNd-AhqUyc-II5mzb pSzOP-AhqUyc-II5mzb jXK9ad D2fZ2 OjCsFc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:365.062px\">\n<div class=\"jXK9ad-SmKAyb\" style=\"box-sizing:border-box;width:365.062px\">\n<div class=\"tyJCtd baZpAe\" style=\"box-sizing:border-box;position:relative;width:365.062px\">\n<div class=\"t3iYD\" style=\"box-sizing:border-box;overflow:hidden\"><img class=\"CENy8b\" style=\"border:0px;box-sizing:border-box;display:block;width:365.062px;margin:0px\" src=\"https: