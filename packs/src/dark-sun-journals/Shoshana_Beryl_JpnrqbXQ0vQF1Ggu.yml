    text:
      format: 1
      content: >-
        <p>A traditionalist who believes only nobles have the education and
        means to properly administer the city-state. She actively pushes for a
        return to a senate of nobles, representing the conservative faction that
        views the current Council as a dangerous experiment. Her wealth and
        influence make her a power broker among those who long for the
        "stability" of the old order, though without the brutal excesses of
        Kalak's reign.</p><p></p>
