    text:
      format: 1
      content: "<p>Far to the north of Raam, the Ringing Mountains\_begin to draw away to the west, slowly marching\_off into a faint\_ brown smudge flickering in the heat\_mirages. The landscape gives way to rocky badlands,\_littered with sharp stones and pebbles, whose broken\_escarpments and\_ low peaks are hewn into odd shapes\_by the relentless dust storms that blow across the\_region. All manner of terrible creatures infest the\_twisting canyons and blind defiles of this jagged,\_unforgiving area. No villages or trade posts lie in the\_savage wilderness; the Broken\_ Lands mark the northern bounds of the Tyr Region.</p>"
