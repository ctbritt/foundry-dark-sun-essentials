    text:
      format: 1
      content: "<p>A natural cave mouth in the southern range of the\_Ringing Mountains opens onto a shaft that leads\_down into a series of mine tunnels and small chambers. A ravine of uncharted depth bisects many of\_the crumbling tunnels and chambers. Bloodcurdling\_screams occasionally echo up from the dark.</p>\n<p>A narrow switchback path leads down one wall\_of the ravine toward its nadir. Since the chasm has\_not been explored in full, no one knows what lies at\_the bottom.</p>"
