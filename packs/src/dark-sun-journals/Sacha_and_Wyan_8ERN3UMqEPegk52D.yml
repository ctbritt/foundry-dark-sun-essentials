    text:
      format: 1
      content: >-
        <p></p><p>These two withered, disembodied heads represent one of Athas's
        most terrifying threats—ancient Champions of Rajaat who were decapitated
        over 2,000 years ago during the Cleansing Wars as punishment for their
        eventual betrayal of the First Sorcerer. Cursed with eternal
        consciousness and trapped in iron cages within Kalak's sealed ziggurat,
        they serve as Tithian's secret advisors while pursuing their own
        catastrophic agenda: freeing their master Rajaat by eliminating Borys
        the Dragon. They possess immense knowledge of Athasian history, magic,
        and the true nature of the sorcerer-kings, which they've used to
        manipulate Tithian into believing he can achieve immortal Champion
        status by helping them.</p><p>The undead pair are utterly patient and
        ruthless, speaking in eerily calm, archaic tones while concealing their
        full power to keep Tithian feeling in control. They can communicate
        telepathically, cast spells through their cages, and sense events
        throughout Tyr from afar. Their greatest weapon is the ancient lore they
        carry—they know exactly where Rajaat's prison lies, understand the
        Dragon's tribute system, and possess secrets of the Cleansing Wars lost
        to modern scholars. What makes them truly dangerous is their willingness
        to let Tyr burn if it serves their ends; they see Tithian as merely
        another pawn in their millennia-long game, and they would happily
        recruit or manipulate the party in the same way if it advances their
        goal of unleashing the First Sorcerer upon Athas once more.</p>
