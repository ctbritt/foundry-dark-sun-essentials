      content: >-
        <h3><strong>The Cistern's Bounty (Water and Provisions)</strong></h3>

        <ul>

        <li><strong>Proprietor</strong>: <strong>Nulak</strong>, an older dwarf
        with a soft spot for storytelling, often found sitting by the
        <strong>cistern</strong> near the center of Kled.</li>

        <li><strong>Services/Items</strong>:

        <ul>

        <li><strong>Water Rations</strong> and <strong>Desert-Proofed Water
        Skins</strong>, capable of preserving water for longer journeys.</li>

        <li><strong>Dried Kank Meat</strong> and <strong>Preserved Cactus
        Fruits</strong>—nutrient-rich and essential for long treks across the
        wastes.</li>

        <li><strong>Healing Poultices</strong> made from <strong>desert
        herbs</strong> for treating <strong>wounds</strong> and
        <strong>sunburn</strong>.</li>

        </ul>

        </li>

        <li><strong>Special Interaction</strong>: Nulak enjoys
        <strong>stories</strong> and <strong>news</strong> from outside the
        village. He might offer a <strong>discount</strong> or throw in extra
        provisions if the party shares <strong>interesting tales</strong> of
        their travels or news from <strong>Tyr</strong> or other distant
        places.</li>

        </ul>
