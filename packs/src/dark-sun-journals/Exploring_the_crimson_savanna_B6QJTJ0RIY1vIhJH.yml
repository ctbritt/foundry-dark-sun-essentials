    text:
      format: 1
      content: "<p>THE CRIMSON SAVANNA</p>\n<p>At the foot of the Jagged Cliffs begins an immense grassland that no explorers (other than the thri kreen) have charted to its end. Some sages believe that before the despoliation of Athas, this region was the bed of a great inland sea, and that the red dust that gives the savanna its name is windborne silt slowly encroaching from the eastern reaches. There are stories of ancient sailing ships still lying half buried in the grassland. In any event, the Crimson Savanna now belongs to the thri-kreen khanates and fierce monsters.\_</p>\n<p>Thri-kreen cities that were established centuries ago dot the dusty sward, but the mantisfolk have fallen into savagery. They abandoned their civilization, leaving their cities to crumble on the plains.</p>"
