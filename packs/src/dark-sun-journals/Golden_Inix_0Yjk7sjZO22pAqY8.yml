      content: >-
        <p>This inn and tavern has a common room serving meals, broy (fermented
        kank nectar), Tyrian brown ale, and Asticles wines. Lodging in the
        Golden mix includes eight typical rooms (2 sp per night) and two luxury
        rooms (2 gp per night). @UUID[JournalEntry.sV0wFAX2xCwM4khP]{Rowan}, the
        male half-elf proprietor, is a member of a consortium of innkeepers that
        is one of the groups vying for power in Tyr.</p>
