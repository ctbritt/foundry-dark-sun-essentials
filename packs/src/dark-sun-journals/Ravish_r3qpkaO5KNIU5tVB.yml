      content: |-
        <p>Ravish is one of five oasis village located south of Troll</p>
        <p>Grave Chasm, in the section of the Barrier Wastes called</p>
        <p>the Glowing Desert. The community based in the village</p>
        <p>is a typical tribe of raiders-all ex-slaves from Draj. The</p>
        <p>tribe is ruled by Akive, a powerful mul with no leadership</p>
        <p>skills beyond great strength, excellent combat prowess,</p>
        <p>and the ability to intimidate and bully her subordinates.</p>
        <p>This village is the poorest, least organized of the Bandit</p>
        <p>States, and its raiders blunder their attacks as often as</p>
        <p>they successfully gain plunder. The targets they strike at</p>
        <p>with most frequency are the halfling villages of the White</p>
        <p>Mountain forests and Kurn's client villages.</p>
