      content: "<section id=\"h.6f57064c2432ee82_205\" class=\"yaqOZd\" style=\"display:table;box-sizing:border-box;background-size:cover;position:relative;table-layout:fixed;width:1661px;padding-bottom:1.5rem;padding-top:1.5rem;font-family:sans-serif;font-size:16px\">\n<div class=\"mYVXT\" style=\"box-sizing:border-box;display:table-cell;vertical-align:middle;width:1661px\">\n<div class=\"LS81yb VICjCf\" style=\"box-sizing:border-box;width:1280px;margin:0px auto;max-width:1280px;padding-left:48px;padding-right:48px;outline:0px\" tabindex=\"-1\">\n<div class=\"hJDwNd-AhqUyc-OiUrBf purZT-AhqUyc-II5mzb pSzOP-AhqUyc-qWD73c JNdkSc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:789.328px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\n<div class=\"oKdM2c Kzv0Me\" style=\"box-sizing:border-box;width:759.734px;margin-top:0px;margin-bottom:0px;max-width:1280px\">\n<div id=\"h.6f57064c2432ee82_202\" class=\"hJDwNd-AhqUyc-OiUrBf jXK9ad D2fZ2 OjCsFc wHaque\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:759.734px\">\n<div class=\"jXK9ad-SmKAyb\" style=\"box-sizing:border-box;width:759.734px\">\n<div class=\"tyJCtd baZpAe\" style=\"box-sizing:border-box;position:relative;width:759.734px\">\n<div class=\"t3iYD\" style=\"box-sizing:border-box;overflow:hidden\"><img class=\"CENy8b\" style=\"border:0px;display:block;width:759.734px;margin:0px\" src=\"https://lh4.googleusercontent.com/yV1JD-8G1cDOHaOonWYFZ3tndHmZZkLFMehaMeRSL68RzPNaWERufNilRWLJ-SZ0uhvtQHKX8nJy13iil3y6H9rh3YHtnUz1atH0kzdbNi8x3OWT4aX2jLC17CUOdgCVPg=w1280\" /></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<div class=\"hJDwNd-AhqUyc-II5mzb JNdkSc L6cTce-purZT L6cTce-pSzOP\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:394.656px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\_</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<section id=\"h.6f57064c2432ee82_26\" class=\"yaqOZd\" style=\"display:table;box-sizing:border-box;background-size:cover;position:relative;table-layout:fixed;width:1661px;padding-bottom:1.5rem;padding-top:1.5rem;font-family:sans-serif;font-size:16px\">\n<div class=\"IFuOkc\" style=\"box-sizing:border-box;background-size:cover;display:table-cell;table-layout:fixed;height:893.594px;left:0px;pointer-events:none;position:absolute;top:0px;width:1661px\">\_</div>\n<div class=\"mYVXT\" style=\"box-sizing:border-box;display:table-cell;vertical-align:middle;width:1661px\">\n<div class=\"LS81yb VICjCf\" style=\"box-sizing:border-box;width:1280px;margin:0px auto;max-width:1280px;padding-left:48px;padding-right:48px;outline:0px\" tabindex=\"-1\">\n<div class=\"hJDwNd-AhqUyc-uQSCkd purZT-AhqUyc-II5mzb pSzOP-AhqUyc-qWD73c JNdkSc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1184px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\n<div class=\"oKdM2c Kzv0Me\" style=\"box-sizing:border-box;width:1154.41px;margin-top:0px;margin-bottom:0px;max-width:1280px\">\n<div id=\"h.6f57064c2432ee82_23\" class=\"hJDwNd-AhqUyc-uQSCkd jXK9ad D2fZ2 OjCsFc wHaque GNzUNc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1154.41px;white-space:pre-wrap;overflow-wrap:break-word\">\n<div class=\"jXK9ad-SmKAyb\" style=\"box-sizing:border-box;width:1154.41px\">\n<div class=\"tyJCtd mGzaTb baZpAe\" style=\"box-sizing:border-box;position:relative;width:1154.41px;padding:8px\">\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;padding-left:0px\">Over the centuries, Tyr has been racked by conflagration, famine, sandstorm, pestilence, war, and the wrath of the Dragon. Each time the city-state suffered a tragedy, Kalak ordered it rebuilt. More than two thousand years of such activity means that several layers of ancient ruins lie beneath Tyr, with entrances to Under-Tyr scattered throughout the city. The Warrens contain many entrances, about half of which are sealed, but hidden passages exist in nearly every district. Those who own a shop or structure that has an entrance to Under-Tyr might allow explorers to use the route for a fee and a pledge of silence. As explorers follow one of the tunnels beneath Tyr, they cross interconnected sunken streets, ancient sewers, lightless courtyards, dizzying stairs, fallen towers, lost catacombs, and echoing cellars. Halfcrumbled businesses, residences, and shrines to forgotten gods abound. Within this subterranean realm lurk creatures that have adapted to the darkness, undead, latent magic wards, and criminal elements using shortcuts and lairs that are unlikely to be discovered by the Tyrian Guard. <br style=\"box-sizing:border-box\" />King Tithian has declared Under-Tyr off limits to citizens—not to protect would-be explorers, but to avoid arousing unknown magic, traps, or monsters that lie slumbering.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">Under-Tyr consists of hundreds of distinct pockets beneath the present-day city-state, some of which are not connected to one another. The major routes include a myriad of intersections and smaller passages that lead to mazes of dark corridors, echoing chambers, and dank cavities. The largest interconnected regions beneath Tyr are the Sorrows, the Elven River, the Belly of the Noble, Tembo’s Teeth, the Crawl, the Road of Crypts, and Night Dragon Way.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">The Sorrows</span></span>: The Sorrows is a rubble-filled maze of confusing chambers. A great courtyard in the center of the area contains a chasm of unplumbed depths, along with an immense building made of granite blocks and what appears to be intact colored glass. The sealed structure is said to be haunted by vengeful ghosts of those slaughtered long ago by Kalak.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Elven River</span></span>: This so-called river contains no water and is merely a network of smooth tunnels that reach deep into subterranean Athas. A colony of id fiends lairs in the tunnels nearest to the surface, and a small group of the creatures emerges into Tyr each night to search for fresh victims.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Belly of the Noble</span></span>: This complex of interconnected cellars and broken vaults lies beneath the Noble District. It is widely considered to be one of the most dangerous parts of Under-Tyr, riddled with both modern and ancient traps meant to safeguard treasures of the ages. Regardless, thieves occasionally try the Belly, to their regret.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Tembo’s Teeth</span></span>: This area of Under-Tyr is a natural subterranean cavern and associated cave complex. The many stalagmites and stalactites decorating the caves give the area its name. A century ago, Kalak sent a group of dwarves and half-giants to seal off the Teeth after yuan-ti were sighted in the deeper tunnels. When Kalak was overthrown, some of the works of his defiling magic failed. Those who have the gift of psionic foresight believe that passageways to an ancient yuan-ti temple might soon gape wide beneath the streets of Tyr.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">The Crawl</span></span>: The crushed remains of trade districts of earlier eras create a barely supported network of low-ceilinged chambers; in many places, the roof is only 3 to 5 feet high. In Tyr, explorers can obtain fragments of maps that hint at an old armory in the Crawl stocked with iron weapons, but so far, these maps have not provided enough information for anyone to find the storehouse. Explorers who return from their failed attempts describe the Crawl as a torturous death trap replete with rockfalls and hordes of zombies that seep out of the nearby Road of Crypts.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Road of Crypts</span></span>: Tombs of long-dead nobles fill this multileveled, branching catacomb. Many crypts stand empty, having been looted long ago; others are guarded by deadly traps, defiling magic wards, and undead that do not wish to be disturbed.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Night Dragon Way</span></span>: This mysterious road once plunged to deeper places, but the far end collapsed in a rockfall centuries ago. Dim red light spills from the mouths of crudely carved dragons that appear every hundred feet on the side walls. A colossal statue of a dragon—perhaps the Dragon—lies in broken fragments off a chamber midway down the tunnel. No one knows the statue’s history or purpose.</p>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>"
