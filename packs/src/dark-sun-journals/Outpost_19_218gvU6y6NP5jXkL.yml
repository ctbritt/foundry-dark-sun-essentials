      content: "<img src=\"data:image/png;base64,\" width=\"698\" height=\"410\" /><p>Outpost\_ 19 Map</p><p>1) Caravan Trail. This\_ narrow\_ trail\_ leads\_ to\_ the\_ open\_ Ivory\_ Plain and\_ is\_ carefully\_\_</p><p>marked\_ and\_ kept\_ clear\_ of\_ debris\_ by\_ the outpost garrison. The trail is hard-packed earth,\_\_</p><p>and\_ is\_ wide enough for one mekillot\_ wagon\_ to\_ pass\_ through.\_ The\_ trail ends in a\_ large\_ open\_</p><p>\_area\_ outside\_ the\_ wall,\_ where\_ visiting\_ \_caravans\_ camp.</p><p>2)\_ Canyon\_ Walls.\_ These\_ high\_ cliff\_ walls\_ protect\_ Outpost\_ 19 from the winds and sandstorms\_</p><p>of the desert.\_ The\_ canyon entrance twists and\_ turns\_ before\_ reaching\_ the\_ open\_ salt\_ flats,\_\_</p><p>further\_ protecting\_ \_the\_ \_outpost.</p><p>The canyon walls rise\_ some\_ 200\_ feet\_ above\_ the\_ outpost\_ and are beautifully colored with bands\_</p><p>of various shades\_ running horizontally along\_ the\_ canyon.\_ The\_ lower\_ reaches\_ are scalable, but\_</p><p>much\_ of\_ the\_ cliff\_ face\_ is\_ very\_ steep,\_ and\_ thus far no one has successfully climbed up to\_\_</p><p>the\_ top\_ (or\_ down from above). The terrain at the top of the cliffs is unknown; no one has\_ ever\_\_</p><p>managed\_ to\_ approach\_ the\_ outpost\_ from\_ any\_ direction\_ other\_ than\_ the\_ caravan trail.</p><p>3)\_ Wall.\_ This\_ low\_ stone\_ wall\_ represents\_ the\_ primary\_ \_line</p><p>of defense for the outpost. While the wall is high enough to discourage\_ jumping\_ over\_ it\_ on\_\_</p><p>crodlu-back,\_ it\_ is\_ low\_ enough\_ \_to see over and can easily be scaled by a normal human.\_</p><p>(Thri-kreen can leap over this\_ wall\_ with\_ ease.)\_ Notches\_ have\_ been\_ set into the top of the\_</p><p>wall\_ to allow\_ arrows\_ to be fired\_ at\_ any attackers.</p><p>4) Aarakocra Aerie. The\_ top\_ portion\_ of\_ the\_ cliff\_ wall\_ in\_ this section is strung with\_ a\_\_</p><p>complex\_ structure\_ made\_ of\_ netting. This netting is home to a tribe of\_ aarakocra\_ that\_\_</p><p>hunts\_ across a wide range in the Mekillot Mountains. The aarakocra have been here since Outpost 17\_</p><p>was reconstructed, but all attempts to contact and\_ ally\_ with\_ the\_ birdmen have failed. The\_</p><p>aarakocra occasionally steal an\_ erdlu\_ when times are hard, but otherwise avoid\_ all\_ contact\_\_</p><p>with\_ their\_ neighbors below.</p><p>5) Housing. This\_ building\_ contains\_ the\_ living\_ quarters\_ of the\_ traders\_ and\_ garrison\_ of\_\_</p><p>the\_ outpost.\_ It\_ is\_ partitioned\_ into\_ \_ a number of smaller rooms; Ragstol,\_ Astemba,\_ and\_\_</p><p>Mersten\_ Vell have rooms of their own, while the remaining staff are distributed\_ three\_ to\_ a\_\_</p><p>chamber.\_ A\_ common\_ chamber\_ acts\_ as\_ a\_ dining\_ hall\_ and\_ \_workroom.</p><p>6) Trading Warehouse. This wooden building, the largest in the compound, contains the trade goods\_</p><p>which Ragstol\_ and\_ the\_ other\_ traders\_ buy\_ and\_ sell.\_ More\_ often\_ than not, the\_ building\_ is\_\_</p><p>more\_ than\_ half\_ empty,\_ as\_ the\_ warehouse\_ was built in expectation of\_ a\_ much\_ higher\_ volume\_\_</p><p>of\_ trade.\_ Now and then, however,\_ large\_ caravan\_ drops\_ are\_ made\_ by House\_ Wavir,\_ which\_\_</p><p>ships\_ the\_ goods\_ from\_ South\_ Ledopolus or\_ Altaruk\_ to\_ Outpost\_ 13.\_ These\_ are\_ \_then\_ doled\_ \_</p><p>out\_ \_to\_ visiting\_ caravans\_ over\_ a\_ period\_ of\_ \_months.</p><p>7)\_ Well.\_ \_This\_ small\_ well\_ is\_ a\_ wide\_ shaft\_ that\_ drops some</p><p>30 feet to the water below.\_ The\_ water\_ is\_ tangy\_ with\_ minerals,\_ but is safe to\_ drink.\_ Water\_\_</p><p>is\_ drawn\_ up\_ by\_ throwing\_ waterskins into\_ the\_ well,\_ then\_ hauling\_ the\_ skins\_ up\_ by\_\_</p><p>ropes.\_ Lift-\_ ing the water is hard work,\_ especially\_ since\_ water\_ must\_ be\_ lifted for the\_</p><p>erdlu and crodlu as well as for all the humans.\_ Mersten Vell\_ often\_ assigns\_ drawing\_ up\_ water\_\_</p><p>as\_ a\_ punishment\_ \_for\_ \_unruly behavior.</p><p>This well is the only supply of\_ water\_ in\_ Outpost\_ 19.\_ As\_ a\_ result, it is not practical for\_</p><p>caravans\_ to\_ remain\_ here\_ more\_ than a day or\_ two.\_ The\_ demand\_ placed\_ on\_ the\_ well\_ by\_\_</p><p>watering the\_ animals\_ and\_ staff\_ of\_ a\_ typical\_ caravan\_ in\_ addition\_ to\_ the permanent\_</p><p>outpost garrison will quickly deplete it.\_ Caravans\_ knowledgeable\_ of\_ the\_ region\_ are\_ aware\_\_</p><p>of\_ this\_ \_and bring the minimum number of\_ animals\_ up\_ the\_ canyon\_ to\_ the\_ outpost.\_ New\_\_</p><p>caravan\_ masters\_ are\_ quickly\_ informed\_ of the\_ situation\_ by\_ Ragstol\_ on\_ their\_ first\_ \_visit.</p><p>8)\_ Animal\_ Pens.\_ These\_ pens\_ contain\_ the\_ outpost's\_ \_herd</p><p>of 40-60 erdlu and crodlu.\_ These\_ flocks\_ are\_ used\_ as\_ mounts\_ for the occasional expedition,\_</p><p>trade goods\_ for\_ the\_ caravans,\_ and food bribes for raiding\_ thri-kreen,\_ so\_ the\_ number\_ of\_\_</p><p>animals in the fortress\_ varies\_ wildly.\_ These\_ animals\_ are\_ replenished by caravans\_ and\_\_</p><p>by\_ the\_ slaves\_ of\_ Salt\_ View,\_ for\_ which\_ they\_ are\_ almost\_ the\_ only\_ \_export.</p><p>9) Cave. This low chamber is used as\_ a\_ secondary\_ storeroom or as\_ a\_ living\_ chamber\_ when\_\_</p><p>visitors\_ exceed\_ the\_ capacity of the outpost's small buildings. It is 20 feet deep, roughly\_</p><p>circular, and has a 15-foot ceiling. At the rear\_ is\_ a\_ narrow tunnel, 4 feet in diameter, which\_\_</p><p>leads\_ off\_ into\_ darkness. The small tunnel\_ was\_ sealed\_ off\_ when\_ the\_ outpost\_ was\_ built\_\_</p><p>to\_ avoid\_ a\_ visit\_ from\_ some hibernating\_ \_ \_creature.</p><hr /><p>Outpost\_ \_ 19</p><p>Esreva's Journal</p><p>I will never forget my first view of\_ Outpost\_ 19.\_ The\_ salt- storm in the year of the Wind's Fury\_</p><p>had\_ wreaked\_ devas- tation across the Ivory Triangle, and in the\_ wake\_ of\_ the storm, my master\_</p><p>was tasked with determining\_ the\_ con- dition of the eastern\_ villages.\_ My\_ master\_ had\_ planned\_\_</p><p>to\_ stop at Outpost 19\_ and\_ demand\_ shelter\_ in\_ the\_ name\_ of\_ the oba\_ Lalali-Puy.\_ What\_ he\_\_</p><p>found\_ instead\_ was\_ a\_ sight for\_ which\_ I curse\_ my\_ memory.\_</p><p>When we arrived at the region\_ where\_ the\_ outpost\_ had\_ been, we\_ were,\_ at\_ first,\_ unable\_ to\_\_</p><p>find\_ it.\_ The\_ huge\_ drifts\_ of salt-encrusted sand which had accumulated on the slopes of the\_</p><p>Mekillot Mountains changed the very nature of the terrain, so that landmarks were no longer\_</p><p>recognizable, or were buried altogether. Dust from the\_ inland silt basins had been stirred up and\_</p><p>lay in thick blankets at the base of the\_ dunes.\_ Eventually,\_ my\_ master\_ made\_ his\_ way\_ up\_ a\_ \_</p><p>particularly\_ steep\_ dune,\_ looked\_beyond,\_ and\_ signaled\_ for\_ me\_ to\_ follow.\_</p><p>On the far side of the slope, the\_ remains\_ of\_ Outpost\_ 19 poked up through the sand,\_ salt,\_ and\_\_</p><p>silt.\_ Its\_ few\_ buildings had collapsed under the blasting winds and the weight of accumulated\_</p><p>sand.\_ Worse,\_ it\_ appeared\_ at\_ the\_ end that the outpost staff had tried\_ to\_ flee.\_ The\_\_</p><p>abrasive\_ sand, carried on the wind, had\_ stripped\_ the\_ flesh\_ from\_ their bones. What remained\_</p><p>had been left for the\_ scavengers to gnaw. My master turned and made\_ his\_ way\_ back down the\_</p><p>slope.\_ Neither\_ he\_ nor\_ I\_ thought\_ the\_ outpost\_ would\_ ever\_ stand\_ again.\_</p><p>To our surprise it did. Moved\_ to\_ a\_ location\_ less\_ exposed to the winds of the Great Ivory\_</p><p>Plain,\_ the\_ outpost\_ opened anew. My master was often called upon to check cargoes here, as the\_</p><p>caravans of\_ House\_ Wavir\_ traded with the oba often. My master told me that\_ House Wavir's traders\_</p><p>were as slippery as\_ elves;\_ each\_ time\_ I\_ met them\_ I\_ at\_ least\_ found\_ them\_ to\_ be courteous.\_</p><p>A curiosity of the outpost (and of all House Wavir facilities) is that they keep no slaves. The\_</p><p>outpost master explained\_ to\_ my\_ master\_ that\_ a\_ \_man\_ has\_ greater\_ \_incentive\_</p><p>to\_ do\_ a\_ good\_ job\_ when\_ he\_ is\_ paid\_ for\_ his\_ work.\_ My master\_</p><p>replied that when a man's life is at stake he has plenty of incentive\_ to\_ work\_ hard.\_ I\_ agreed\_\_</p><p>with\_ my master.\_</p><hr /><p>Outpost\_ 19\_ is\_ a\_ small\_ trading\_ outpost\_ in\_ a\_ stony\_ canyon\_ \_at the northeastern end of the\_\_</p><p>Mekillot\_ Mountains. Established by House Wavir primarily for caravans traveling between Nibenay\_</p><p>and North\_ Ledopolus,\_ Outpost\_ 19\_ now also conducts a significant amount of business with\_ Fort\_\_</p><p>Fyra.</p><hr /><p>History</p><p>Outpost 19 was established decades ago, during an\_ expan-\_ sionist period of the history of House\_\_</p><p>Wavir.\_ During\_ the\_ early years\_ of\_ the\_ leadership\_ of\_ the\_ patriarch\_ Tabaros\_ Wavir,\_ the\_</p><p>dwarven towns of North and South Ledopolus were just beginning their efforts to bridge the Estuary\_</p><p>of the Forked Tongue. Tabaros, seeing an opportunity to build\_ a\_ trade\_ route\_ to\_ Nibenay,\_\_</p><p>established\_ Outpost\_ 19\_ in\_ \_the\_ shelter\_ of\_ the\_ nearby\_ Mekillot\_ Mountains.</p><p>The\_ dwarven\_ effort\_ at\_ Ledopolus\_ has\_ been\_ unsuccessful, but Outpost 19\_ has\_ served\_ House\_\_</p><p>Wavir\_ well.\_ While\_ not\_ the most active of merchant forts, its convenience to south- bound\_</p><p>caravans from Nibenay makes it a favored stopover. Caravans visiting the villages of the\_</p><p>southeastern Tyr region\_ restock here often, as they are welcomed by master trader\_ Ragstol Wavir,\_</p><p>regardless of house affiliation (for the\_ most\_ part).</p><p>The outpost began as a small building nestled in\_ a\_ pro-\_ tected valley in the eastern Mekillot\_</p><p>Mountains. As the\_ outpost grew, it gained some of the characteristics and defenses of a real\_</p><p>merchant fort.\_ Still,\_ it\_ is\_ much\_ less\_ insular\_ than\_ Fort\_ Harbeth\_ or\_ Fort\_ 1nix.</p><p>1n the early years, merchant forces from more established houses (primarily House Tsaxala) tried to\_</p><p>drive House Wavir from the region. The outpost was burned to the ground several times by\_</p><p>\"mysterious raiders,\" although\_ all involved knew who was behind the attacks. Eventually,\_ the\_</p><p>House made an\_ alliance\_ with\_ the\_ Swiftwing\_ elves,\_ and\_ the\_ next group of raiders found\_</p><p>themselves facing 200 elven warriors.\_ \_After\_ \_this\_ \_bloody\_ \_massacre,\_ \_the\_ \_raids stopped.</p><p>Another attacker was far more deadly and unforgiving. Thirty-two years ago, a fierce salt storm\_</p><p>from the\_ Great\_ 1vory\_ Plain\_ collided\_ with\_ a\_ westward\_ blowing\_ silt\_ storm\_ and\_ \_ \_car-</p><p>\_</p><p>ried\_ a\_ \_huge\_ volume\_ \_of\_ \_choking\_ dust\_ \_and\_ \_scouring\_ \_sand\_ \_to</p><p>the eastern slopes of the Mekillot Mountains. This storm buried Outpost\_ 19;\_ everyone\_ there\_\_</p><p>drowned\_ in\_ the\_ dust, and when the storm\_ was\_ over,\_ there\_ was\_ no\_ sign\_ of\_ the\_ out-\_ post\_</p><p>at all. When\_ House\_ Wavir\_ heard\_ of\_ the\_ disaster,\_ they\_ sent a new staff to reestablish the\_</p><p>outpost. This time it was nestled in a box canyon, protected\_ on\_ three\_ sides\_ by\_ moun-\_ tain\_</p><p>slopes, with the mouth of the canyon pointing\_ inward\_ toward the mountain range. Although the site\_</p><p>\_was\_ different,\_ House Wavir retained the original name in honor of the\_ traders\_ who\_ died\_ in\_\_</p><p>the\_ original\_ \_ outpost.</p><p>Outpost 19 still entrusts much of its\_ defense\_ to\_ good\_ rela-\_ tions with its\_ neighbors rather\_\_</p><p>than\_ high\_ stone\_ walls.\_ This lack of physical defense has caused Outpost 19 to suffer occasional\_</p><p>raids, but\_ the\_ trading\_ practices\_ of\_ House\_ Wavir have made many allies, and few will\_ risk\_\_</p><p>the\_ revenge\_ that\_ would come from the\_ destruction\_ of\_ the\_ outpost.\_ The\_ out-\_ post is also\_</p><p>defended by Astemba\_ Wavir,\_ a\_ powerful\_ pre-\_ server, and his powers are sufficient to ward off\_\_</p><p>smaller\_ bands\_ \_of\_ \_traveling raiders.</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>The Fort Today</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>The fort\_ has\_ recently\_ become\_ a\_ major\_ trading\_ partner\_ with the slave village\_ of\_ Salt\_\_</p><p>View,\_ through\_ the\_ trading\_ house\_ at\_ Fort Fyra. House\_ Wavir\_ has\_ long\_ opposed\_ slavery,\_ and\_</p><p>\_Out-\_ post 19 has contributed to the\_ prosperity\_ and\_ stability\_ of Salt View. Ragstol\_ has\_\_</p><p>encouraged\_ the\_ artisans\_ of\_ Salt\_ View\_ by\_ purchasing\_ their\_ wares.\_ He\_ allows\_ the\_\_</p><p>performing\_ \_troupes\_ to entertain\_ caravans\_ as\_ long\_ as\_ the\_ tribe\_ does\_ not\_ follow\_ up\_ the\_</p><p>performance with a raid, and he always\_ purchases\_ any\_ surplus\_ salt\_ that\_ Fort\_ Fyra\_ makes\_ \_\_</p><p>available.</p><p>True to his merchant ethic, Ragstol has tried to discourage raiding by refusing to open his gates\_\_</p><p>to\_ the\_ ex-slaves\_ any\_ time they show up with\_ anything\_ other\_ than\_ goods\_ he\_ is\_ certain\_\_</p><p>that they have produced. The house wants to see Salt View established as a permanent trading\_</p><p>partner, and\_ has\_ autho-\_ rized Ragastol to make temporary loans to ensure Salt View's survival.\_</p><p>Ragstol has encouraged the\_ slaves\_ of\_ Salt\_ View\_ to\_ stop raiding and\_ to\_ increase\_ salt\_\_</p><p>mining\_ as\_ well\_ as\_ the\_ amount of goods produced\_ by\_ its\_ artisans.\_ One\_ day,\_ he\_ tells\_ the\_\_</p><p>traders of Fort Fyra,\_ the ex-slaves\_ of Salt View\_ will\_ be a welcome\_ sight\_ \_on\_ the\_ caravan\_\_</p><p>trail.\_ So\_ far,\_ this\_ has\_ not\_ happened.</p><p>Nevertheless, trade with Salt View\_ and\_ Fort\_ Fyra\_ has\_ been\_ brisk.\_ The\_ people\_ of\_ the\_ slave\_</p><p>\_village\_ prefer\_ to\_ deal\_ \_with</p><p>House Wavir, due to Ragstol's congenial manner and the absence of slaving in the outpost. House\_\_</p><p>Wavir's\_ ties\_ to\_ Gulg and Nibenay are loose enough that its support\_ of\_ Salt View causes it\_</p><p>little trouble in those city-states,\_ and\_ the other sorcerer-kings could\_ care\_ less\_ what\_\_</p><p>happens\_ in\_ places so\_ far\_ from\_ their\_ own lands.</p><p>The outpost has also kept its contacts with the elven nomads. Several wandering elven\_ tribes\_\_</p><p>visit the\_ fortress. Some\_ travelers\_ claim\_ that\_ Wavir\_ uses\_ this\_ remote\_ outpost\_ \_as\_ \_a\_</p><p>contact\_ point\_ for\_ their\_ connections\_ in\_ the\_ Shadows.\_ There\_ is a fair amount of festivity\_</p><p>when an elf tribe makes camp outside the outpost. During\_ these\_ visits,\_ it\_ is\_ usually\_ possi-\_</p><p>ble to buy spell components from the elves. A few elves have occasionally joined here as\_</p><p>mercenaries, protecting the small group of traders\_ from\_ the\_ depredations\_ of\_ those\_ who\_ do\_\_</p><p>not\_ know\_ better.</p><p>The thri-kreen also trade\_ here,\_ although\_ there\_ is\_ little\_ in\_ the fortress to interest\_ them.\_\_</p><p>Ragstol\_ maintains\_ a\_ good-sized\_ herd of crodlu and erdlu to use as trade goods in case the\_</p><p>thri-kreen\_ do\_ come.\_ The\_ thri-kreen\_ have\_ learned\_ that\_ there\_ \_is often good food here, but\_</p><p>the prospect\_ of\_ dinner\_ without\_ a hunt\_ makes\_ their\_ visits\_ rather\_ rare.</p><p>Outpost 19 is more\_ isolated\_ than\_ most\_ of\_ the\_ merchant\_ forts in the 1vory Triangle. House\_</p><p>Wavir, while large, is\_ not\_ always able to keep regular contact with all of its far-flung\_</p><p>outposts. This leaves Ragstol considerable\_ discretion as\_ to\_ how he manages the fortress.\_ He\_\_</p><p>sends\_ regular\_ dispatches\_ back to Balic, but receives\_ formal\_ direction\_ from\_ his\_ superi- ors\_\_</p><p>in\_ the\_ house\_ perhaps\_ twice\_ each\_ year.</p><p>\_</p><p>The Garrison</p><p>There are four merchants posted to Outpost 19, including Ragstol Wavir and his son Astemba.\_ The\_\_</p><p>other\_ two\_ are\_ often absent, supervising a regular trade caravan\_ to\_ or\_ from\_ North\_ Ledopolus.</p><p>Outpost\_ 19\_ has\_ a\_ small\_ garrison\_ consisting\_ of\_ 15\_ warriors\_ of 4th to 7th level. There are\_</p><p>a few elves\_ and\_ muls\_ in\_ the\_ force, but the majority are human.\_ The\_ troops\_ are\_ armed and\_</p><p>armored in a variety\_ of\_ equipment,\_ with\_ no\_ man\_ wear- ing any less than hide armor (AC 6).\_</p><p>This motley force is surprisingly effective, particularly\_ \_since\_ they\_ are\_ \_dedicated to\_ their\_\_</p><p>cause\_ and\_ are\_ well\_ treated\_ by\_ \_Ragstol.</p><p>As mentioned above, the outpost is not well fortified. There\_ is\_ a\_ low\_ wall,\_ but\_ this\_ is\_\_</p><p>mostly\_ to\_ slow\_ any\_ \_ attackers</p><p>rather\_ than\_ \_to\_ \_stop\_ \_them.\_ \_There\_ have\_ \_been\_ a\_ \_few\_ \_raids,\_ but</p><p>allies of the fortress (either from\_ Salt\_ View\_ or\_ from\_ the\_ elven\_ tribes) have made raiders\_</p><p>wish they had picked a less\_ well-\_ connected\_ \_ target.</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Personalities</p><p>Ragstol Wavir</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Male\_ \_Human\_ \_Trader,\_ \_Neutral Good</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Armor Class 8 (leather armor) Movement\_ 12\_</p><p>Level\_ 10</p><p>Hit\_ \_Points\_ \_27</p><p>THAC0\_ 16\_</p><p>No.\_ \_of\_ \_Attacks 1</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Str 11</p><p>Dex\_ 15\_</p><p>Con\_ 7</p><p>Int 17</p><p>Wis\_ 15</p><p>Cha\_ 15</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Damage/Attack: 1d4 (bronze dagger), 1d4+1\_ (heavy cross- bow)</p><p>\_</p><p>Psionic\_ Summary:\_ PSP's\_ 37;\_ Wild\_ \_Talent-poison\_ \_sense (PS\_ 15:\_ cost:\_ 1)</p><p>\_</p><p>Ragstol Wavir is the\_ 42-year-old\_ leader\_ of\_ Outpost\_ 13. He is tall, topping\_ 62'\_ in\_ height,\_\_</p><p>with\_ curly,\_ light-brown\_ hair\_ and\_ a\_ long,\_ almost\_ sad\_ face.\_ His\_ limbs\_ are\_ long\_ and\_ \_</p><p>thin,\_ \_and\_ his\_ skin\_ is\_ burned\_ a\_ deep\_ brown.</p><p>Ragstol was a caravan master for many years,\_ until\_ his\_ car- avan became lost\_ in\_ a\_ siltstorm\_\_</p><p>in\_ the\_ trackless\_ wastes\_ south\_ of Balic. He was knocked unconscious\_ by\_ a\_ panicking crodlu as\_</p><p>he attempted to wrap its\_ head\_ with\_ a\_ wet\_ cloth.\_ He was nearly buried in\_ silt\_ before\_ one\_\_</p><p>of\_ his\_ staff\_ wandered near.</p><p>Unfortunately, the\_ long\_ exposure to\_ the\_ silt has\_ \_ruined\_ his\_ health.\_ He\_ is\_ prone\_ to\_\_</p><p>coughing\_ fits,\_ and\_ has\_ lost\_ much\_ \_of\_ the\_ vigor\_ that\_ characterized\_ his\_ early\_ years.</p><p>Although he is physically not what\_ he\_ once\_ was,\_ his\_ mind\_ and his trading skills are as sharp\_</p><p>as ever.\_ He\_ has\_ spent\_ much of his time counseling Fyra and trying to convince the ex-slaves\_ of\_</p><p>\_Salt\_ View\_ to\_ give\_ up\_ raiding.\_ He\_ believes\_ that\_ he\_ is making progress\_ with the group and\_</p><p>does not want to leave until\_ he\_ feels\_ the\_ area\_ is\_ secure\_ for\_ free trade.</p><p>Thus, Ragstol has turned down several offers by\_ House\_ Wavir\_ to\_ return\_ him\_ to\_ Balic.\_ Despite\_</p><p>\_his\_ age,\_ he\_ insists\_ \_ on</p><p>remaining\_ in\_ the\_ field.\_ aiding\_ Salt\_ View\_ and\_ improving\_ \_ \_ \_Out-</p><p>post 19. His talents are valued highly enough that his eccentric\_ insistence on\_ being\_ allowed\_\_</p><p>his\_ own\_ way\_ is\_ \_toler- ated\_ by\_ the\_ merchants\_ at\_ the\_ house,\_ but\_ none\_ can\_ \_say\_ \_how\_</p><p>long\_ \_the\_ \_sickly\_ \_man\_ \_can\_ \_continue\_ \_this\_ \_ pace.</p><p>If Ragstol has a flaw, it is that he is\_ too\_ trusting\_ and unwilling\_ to\_ take\_ charge\_ in\_ a\_ \_</p><p>situation.\_ \_In\_ \_a\_ \_bargaining\_ \_situa- tion\_ he\_ is\_ second\_ to\_ none,\_ but\_ \_in\_ \_the\_ \_</p><p>day-to-day\_ \_administra- tion of the outpost, he leaves much to his son and\_ his garrison\_</p><p>commander. Some of his subordinates enjoy the autonomy\_ and\_ work\_ all\_ the\_ \_harder,\_ \_others\_ \_</p><p>take\_ \_advantage\_ \_of\_ the opportunity to shirk their responsibilities. Some wonder whether this is\_</p><p>Ragstol's management style or simply lack of management.\_ Thus\_ far,\_ his\_ trust\_ has\_ \_been\_ \_well\_</p><p>\_ placed\_ \_in\_ \_his son,\_ and\_ at\_ least\_ not\_ a\_ \_disaster\_ \_in\_ \_his\_ \_garrison\_ \_commander, but\_</p><p>many worry that it is only a matter of\_ time\_ before\_ a\_ crisis\_ arises. At\_ that\_ time,\_ all\_ will\_</p><p>\_know\_ whether\_ Ragstol's\_ com- mand\_ \_abilities\_ \_have\_ \_weakened\_ \_with\_ \_ age.</p><p>\_</p><p>Mersten\_ Vell</p><p>Female\_ \_Mul\_ \_Gladiator,\_ \_Chaotic Neutral</p><p>\_</p><p>Armor\_ \_Class\_ \_5\_ \_(kank\_ scale\_ \_mail)\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Str 17</p><p>Movement\_ 12\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Dex\_ 13\_</p><p>Level\_ \_8\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_\_</p><p>Con 18\_</p><p>Hit\_ \_Points\_ \_77\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Int\_ 10</p><p>THAC0\_ 7\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ Wis\_ \_12</p><p>No.\_ \_of\_ \_Attacks\_ \_2\_ \_(sword),\_ \_3/2\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ Cha 13\_</p><p>\_</p><p>Damage/Attack: 2d4+9 (bronze bastard sword), 1d8+7 (long\_ bow)</p><p>\_</p><p>Weapon Specializations: bastard sword, bow, cestus,\_ javelin,\_ net,\_ trident</p><p>\_</p><p>Psionic\_ \_Summary:\_ \_PSPs\_ \_60;\_ \_Wild\_ \_Talent-radial\_ \_naviga- tion\_ (PS\_ 7;\_ \_Cost:\_ 4+7/hour)</p><p>\_</p><p>Mersten Vell is an ex-slave, ex-gladiator,\_ and\_ an\_ ex-inhab-\_ itant of\_ Salt\_ View.\_ A\_ simple\_\_</p><p>woman\_ with\_ a\_ warrior's\_ view\_ of the world, she found the transition to a life of art and\_</p><p>perfor- mance by the slaves of Salt\_ View\_ too\_ confusing.\_ While\_ she\_ finds it difficult to live\_</p><p>among\_ the\_ artists\_ of\_ Salt\_ View,\_ she\_ still\_ believes\_ that\_ the\_ people\_ of\_ Salt\_ View\_\_</p><p>should\_ not\_ \_be</p><p>\_</p><p>forced to\_ return\_ to\_ a\_ life\_ of\_ slavery\_ any\_ more\_ than\_ she\_ should.\_ She\_ convinced\_ Fyra\_\_</p><p>to\_ allow\_ her\_ to\_ travel\_ to\_ Outpost\_ \_I9\_ \_in order\_ to\_ study\_ its\_ operations.\_ \_Fyra\_ \_</p><p>consented\_ \_without\_ \_seek- ing approval\_ from\_ Xaynon,\_ Salt\_ View's\_ leader.\_ Mersten offered her\_</p><p>services to Ragstol\_ Wavir\_ and\_ the\_ master\_ trader gladly\_ \_ accepted.</p><p>Mersten is\_ a\_ typical mul. She\_ \_respects\_ Ragstol,\_ \_but\_ \_has not spent much time contemplating\_</p><p>his thoughts about trade and the importance\_ of\_ an\_ individual's\_ right\_ to\_ prop-\_ erty. Although\_</p><p>she is no longer a gladiator in the games of Nibenay (her one-time home), she still thinks in the\_\_</p><p>con- crete, straight line\_ fashion\_ that\_ led\_ her\_ to\_ so\_ many\_ victories in\_ the\_ arena.</p><p>Her status as the best warrior in\_ the\_ outpost\_ makes\_ her\_ a\_ natural\_ candidate\_ for\_ garrison\_\_</p><p>leader.\_ In\_ a\_ fight,\_ Mersten\_ \_is likely\_ to\_ set\_ out\_ on\_ her\_ own,\_ regardless\_ of\_ the\_\_</p><p>odds,\_ expecting\_ her\_ comrades\_ to\_ follow\_ and\_ to\_ \_acquit\_ \_themselves\_ \_as\_ \_warriors. She\_\_</p><p>spends\_ little\_ time\_ \_on\_ \_strategic\_ \_planning,\_ \_and\_ \_is\_ \_unfamil-\_ \_iar with the\_ use\_ of\_</p><p>scouts\_ or sophisticated\_ plans.\_ Many friends\_ of Ragstol\_ have\_ urged\_ him\_ to take\_ a\_ more\_ \_</p><p>active hand in the outpost's\_ defense,\_ as\_ they\_ see\_ Mersten's\_ inflexi-\_ bility as a strategist\_</p><p>as the primary cause of\_ the\_ outpost's defensive\_ \_ weakness.</p><p>Moreover,\_ Mersten\_ is not\_ an even-tempered\_ mul.\_ \_She\_ tries\_ to\_ \_control\_ \_her\_ \_temper,\_ \_but\_</p><p>\_ she\_ \_is\_ \_not\_ \_always\_ \_successful. If challenged or under pressure, she has a tendency\_ to\_\_</p><p>react violently. Thus far,\_ Ragstol\_ has\_ been\_ able\_ to control\_ the\_ mul's temper, but if Mersten\_</p><p>cannot\_ change\_ her\_ ways,\_ Ragstol\_ \_is\_ afraid\_ he\_ may\_ have\_ to\_ send\_ her\_ back\_ to\_ Salt\_ \_ \_\_</p><p>\_View.</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Astemba Wavir</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Male\_ Human\_ Preserver,\_ Neutral\_ \_Good</p><p>\_</p><p>Armor\_ \_ Class\_ \_ 10\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Str\_ 16</p><p>Movement\_ 12\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ Dex\_ 12\_</p><p>Level\_ \_5\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_\_</p><p>Con\_ 17\_</p><p>Hit\_ \_Points\_ \_24\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Int\_ 17</p><p>THAC0\_ 18\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Wis\_ 15</p><p>No.\_ of\_ Attacks\_ 1\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ Cha\_ 14\_</p><p>\_</p><p>Damage/Attack:\_ \_ 1d4+2\_ \_ (bronze\_ \_ dagger),\_ \_ 1d3+2\_ \_ (dart)</p><p>\_</p><p>Psionic\_ \_Summary:\_ \_PSPs\_ \_60;\_ \_Wild\_ \_Talent-radial\_ \_naviga- tion\_ (PS\_ 7;\_ \_Cost:\_ 4+7/hour)</p><p>\_</p><p>Spells:\_ (1st)\_ comprehend languages, magic\_ missile\_ (x3),\_</p><p>(2nd)\_ alter\_ self\_ knock,\_ feign\_ death</p><p>\_</p><p>Astemba Wavir is the\_ son\_ of\_ Ragstol\_ Wavir,\_ and\_ appears\_ to be a skilled trader in his own\_</p><p>right. He has less skill in negoti-\_ \_ating, but he can appraise an\_ item's\_ value\_ more\_ quickly\_\_</p><p>and\_ more accurately than his father.\_ Garbed\_ as\_ a\_ trader\_ and\_ bear-\_ ing a bronze dagger which\_</p><p>is\_ the\_ image\_ of\_ his\_ father,\_ Astemba can\_ look\_ forward\_ to\_ a\_ long\_ career\_ in\_ House Wavir.</p><p>Few know, however, that Astemba is secretly a preserver. Astemba takes great care to conceal his\_</p><p>abilities, and only\_ his\_ father knows of his illicit studies. Astemba generally selects\_ spells\_</p><p>with no material components, or with\_ material\_ compo-\_ nents\_ that\_ are\_ easily\_ obtained.\_ He\_ \_</p><p>uses\_ his\_ comprehend\_ \_ lan-</p><p>guages\_ spell\_ to\_ demonstrate\_ understanding\_ in\_ languages\_ \_ like</p><p>that of a normal trader, and indeed has become adept at a few nonhuman\_ languages\_ without\_ magical\_</p><p>\_ assistance.</p><p>Astemba's\_ magic\_ is\_ Ragstol's\_ secret\_ weapon.\_ He\_ will\_ not use the\_ magic\_ against\_ an\_\_</p><p>opponent\_ in\_ a\_ business\_ negotia-\_ tion\_ (you\_ get\_ no\_ repeat\_ business\_ by\_ cheating\_ a\_\_</p><p>charmed\_</p><p>opponent),\_ but\_ more\_ than\_ once,\_ Astemba's\_ magic\_ \_missiles</p><p>have\_ made\_ the\_ difference between\_ loss\_ of\_ \_the\_ outpost\_ and the\_ \_complete\_ \_rout\_ \_of\_</p><p>attackers.</p><p>Unfortunately, since Astemba has developed\_ his\_ abili-\_ ties secretly, he\_ has\_ a\_ limited\_\_</p><p>selection\_ of\_ spells.\_ There\_ is\_ only a 10% chance that he has access to a spell not on his\_\_</p><p>\"normal\"\_ \_spell\_ list.\_ He\_ is\_ a\_ voracious\_ \_student\_ of\_ magic,\_ \_and\_ \_is\_ filling\_ out\_ a\_\_</p><p>reasonable\_ spellbook\_ as\_ fast\_ as\_ he\_ \_ can.</p><p>Astemba is developing a close relationship with the Swiftwing elves, using his position to\_ gain\_\_</p><p>their\_ trust\_ and respect.\_ The\_ Swiftwings\_ will\_ probably\_ not\_ completely\_ trust\_ the son for a\_</p><p>number of years, but Astemba is hoping that eventually he will be able\_ to\_ turn\_ to\_ the\_ elven\_\_</p><p>tribes\_ for\_ fur-\_ ther\_ magical\_ training.</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Perian Evenstar</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Female\_ \_Elven\_ \_Fighter/Thief,\_ \_Neutral</p><p>\_</p><p>Armor Class 3 (kank studded leather+Dex) Str 10 Movement\_ 12\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_\_</p><p>\_ \_ \_ \_ \_ \_ \_ \_Dex\_ 18\_</p><p>Level\_ G/7\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ Con 10\_</p><p>Hit\_ Points\_ 35\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Int\_ 14</p><p>THAC0\_ 15\_ (13\_ with\_ bow,\_ 11\_ backstab)\_ \_ \_ \_ \_ Wis\_ \_10\_</p><p>No.\_ of\_ Attacks\_ 1\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ Cha\_ 15\_</p><p>\_</p><p>Damage/Attack: 1d8\_ (bronze\_ long\_ sword\_ or\_ long\_ bow), 1d4x3\_ \_ (bronze\_ \_ dagger\_ \_backstab)</p><p>\_</p><p>Thief\_ Abilities\_ (in\_ armor):\_ PP\_ 30\_ (0),\_ OL\_ 20\_ (10),\_ F/RT\_ \_ 30</p><p>(20), MS\_ 105 (85), HS\_ 105 (85), DN\_ 60 (50), CW\_ \_80\_</p><p>(50), RL\_ 0 (0)</p><p>\_</p><p>Perian Evenstar is a member of\_ the\_ garrison\_ under\_ Mer-\_ sten Vell.\_ A wandering\_ elven\_ warrior\_</p><p>\_of\_ \_the\_ Shadows\_ tribe, she was hired on at Outpost 19 a few years\_ ago\_ to\_ learn\_ more about\_ \_</p><p>human\_ ways.</p><p>Only Ragstol knows that Perian is his contact with the Shadows. Perian handles the spell components\_</p><p>and other illegal trade that Ragstol\_ cannot\_ handle\_ himself,\_ and\_ is\_ the\_ one to contact the\_</p><p>Swiftwing\_ tribe\_ when\_ Outpost\_ 19\_ needs\_ help.</p><p>While\_ the\_ Swiftwings\_ are\_ a\_ \_fiercely\_ \_independent\_ \_group, the Shadows are one tribe whose\_</p><p>call they\_ will\_ respond\_ to.\_ Many tribes that deal with contraband never encounter the Shadows,\_</p><p>but if they do, they are wise to\_ heed\_ them.\_ 1n\_ return for Perian's assistance, Ragstol collects\_</p><p>no tariff on Perian's trade, and the trader will occasionally allow other Shadow\_ members\_ to\_ be\_\_</p><p>concealed\_ at\_ the\_ \_ outpost.</p><p>Perian is, in fact, one of the reasons that Ragstol has refused to return to Balic. While House\_</p><p>Wavir is not opposed to dealing with the Shadows, such dealings are generally\_ private\_ matters\_\_</p><p>between\_ the\_ \_Shadows\_ \_and\_ \_individ- ual traders. His son is\_ not\_ quite\_ ready\_ to\_ take\_ over,\_</p><p>\_and\_ he\_ can trust no other trader, even in\_ his\_ own\_ house,\_ with\_ Per-\_ ian's\_ true\_ identity.\_\_</p><p>Moreover,\_ he\_ fears\_ \_that\_ \_if\_ he\_ leaves,\_ \_and the\_ connection\_ with\_ the\_ Shadows\_ is\_\_</p><p>broken,\_ the\_ outpost\_ will\_ not\_ have\_ an\_ adequate\_ defense.</p><p>The\_ rest\_ of\_ the\_ garrison\_ does\_ not\_ understand\_ why\_ Ragstol\_ \_ is so fond\_ of\_ Perian.\_ The\_\_</p><p>elf\_ is\_ haughty\_ and\_ prone\_ to\_ testing\_ the\_ garrison\_ of\_ the\_ outpost,\_ and\_ this\_ tendency\_\_</p><p>has\_ earned\_ \_her the general dislike of\_ the\_ garrison.\_ Mersten\_ Vell\_ was\_ ini-\_ tially very\_</p><p>hard\_ on\_ her\_ for\_ her\_ attitude,\_ as\_ her\_ taunts\_ and tests of friendship were incomprehensible\_</p><p>to her. Ragstol asked her to restrain herself, and\_ it\_ is\_ an\_ open\_ secret\_ in\_ the\_ camp that\_</p><p>Ragstol and\_ Perian\_ have\_ a\_ relationship\_ of\_ some\_ sort. Perian has taken to staying with\_</p><p>Ragstol\_ on\_ occasion,\_ to\_ keep people from suspecting the true nature of their arrangement.</p><p>\_</p>"
