    text:
      format: 1
      content: >-
        <p>“Climbing to Vir-rath,</p>

        <p>where the brew is stout</p>

        <p>and the food is warm</p>

        <p>all the day long.”</p>

        <p>—Rhul-thaun drinking song</p>

        <p>This village is named for the odd shape of the ledge on which it is
        built. In fact, it really</p>

        <p>isn’t built upon a ledge at all, but rather at the top of a pinnacle
        of rock that thrusts</p>

        <p>upward from a cliff slope. The pinnacle top consists of three
        separate levels and the village</p>

        <p>is built on these.</p>

        <p>One of the greatest demands on the villagers of Vir-rath face is the
        inaccessibility of</p>

        <p>water. Windriders and climbers are needed to haul water up from
        nearby pools and</p>

        <p>waterfalls. Thousands of years ago, life-shaped engines pumped water
        up to the top of</p>

        <p>the peak in huge, organic pipes. Now, however, the pool has long
        since dried-up and</p>

        <p>the engines have fallen into disrepair. No living shaper remembers
        how to repair them</p>

        <p>and new ones are just too expensive.</p>

        <p>The population of this village is around 1,300. Most of the people
        are employed as</p>

        <p>tenders, though there are many fine craftsmen here as well, working
        in stone, leather,</p>

        <p>cloth, and other materials. Finally, Vir-rath is known for its
        painters and sculptors.</p>

        <p>Nowhere else in rhul-thaun society are class distinctions as apparent
        as in Vir-rath.</p>

        <p>The three levels of the village are inhabited by the poor, the middle
        class, and the</p>

        <p>wealthy in ascending order.</p>

        <p>Places of Note</p>

        <p>The Crook of Her Arm: This safehome is the favored establishment of
        painters because</p>

        <p>of its wide, open views of the surrounding community. Prices are
        inexpensive—a night’s</p>

        <p>stay costs 1 ghav-egoth, and a meal is usually less than 1 ge.</p>

        <p>Pinnacle: This is another safehome, but it is located at the top
        level of the village and is</p>

        <p>the highest point of the settlement. It is an expensive place to stay
        and eat, although the</p>

        <p>prices seem quite arbitrary, based on the whim of the owner. Res-ohin
        (ham/F12/T12/CN),</p>

        <p>is a fat halfling whom most of his patrons believe is insane. A room
        for one night here can</p>

        <p>range from 2 to 20 ghav-egoths, and a meal can cost from 1 to 10
        ge.</p>

        <p>Important NPCs</p>

        <p>Zohr-otosh the Water Keeper (ham/P9 [water]): AC 4 (half shell armor
        and Dex</p>

        <p>bonus); MV 6; hp 35; THAC0 16; #AT 1; Dmg 1d6 (lifeleech); SA Gate 3
        cubic feet</p>

        <p>of water, lifeleech drains 1d12 hp when first used against a
        particular foe; SZ S (3’</p>

        <p>1”); ML Average (10); AL N, XP 1,000.</p>

        <p>S 10, D 15, C 9, I 12, W 16, Ch 17.</p>

        <p>Personality: cautious, meticulous</p>

        <p>Special Equipment: clingbag, grappler, half shell armor,
        lifeleech</p>

        <p>Spells (6/6/3/2/1): 1st— command, create water, cure light wounds,
        detect poison,</p>

        <p>protection from evil, purify food and drink: 2nd— clear water,
        goodberry, hold person,</p>

        <p>know alignment; silence, withdraw; 3rd— create food and water, water
        breathing,</p>

        <p>water walk; 4th— lower water, neutralize poison; 5th— cure critical
        wounds.</p>

        <p>The city administrator appointed Zohr-otosh water master. His duties
        are to watch over</p>

        <p>water supplies and make sure the city’s reserves are maintained and
        safe. This makes</p>

        <p>him a powerful individual, since the price of water is so high in
        this village. The cleric</p>

        <p>takes his job very seriously, and has hired a number of trustworthy
        guards to help him</p>

        <p>watch over the city’s reservoir.</p>

        <p>In appearance, Zohr-otosh is unremarkable. His brown hair matches his
        brown eyes</p>

        <p>that match the brown clothing he wears under shell armor. He keeps
        his armor and</p>

        <p>weapons ready at all times—just to be safe.</p>
