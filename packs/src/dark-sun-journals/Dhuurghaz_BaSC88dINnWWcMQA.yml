      content: >-
        <p style="box-sizing:border-box;user-select:text;color:#191813">The
        largest island in the Road of Fire, Dhuurghaz is a broad plateau of
        volcanic rock that is mostly flat except for a range of steep, rocky
        cliffs along the southern shore. The center of the island is a deep pit,
        from which emanates the hellish red glow of magma far below. This
        volcano connects to the Elemental plane of fire, and elemental beings
        emerge from the depths, seeking to burn anything they can find.</p>

        <p style="box-sizing:border-box;user-select:text;color:#191813">Beast
        giants of the Khal-Ish-Thaas tribe dwell in the southern highlands of
        Dhuurghaz, traveling a slow, nomadic circuit up and down the coast.</p>
