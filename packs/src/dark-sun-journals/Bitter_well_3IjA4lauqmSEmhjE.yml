  - name: Bitter well
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: "<p dir=\"ltr\">Who controls water, controls life. The few oases scattered across the wastes were discovered long ago and remain in the hands of those strong enough to keep them. Prospectors mount forays into the wilderness, scouring the land for new water sources, for any such find can make a prince of a pauper. For a long time, travelers approaching the Narrows east of Draj had heard running water, but no one could track down the source—not until three years ago, when dwarf prospectors set themselves the task of finding it. They uncovered a small spring of cold, clean water emerg ing from under the rock mantle.The dwarves constructed a makeshift encamp ment and set out to improve their well, believing they could sell the water to caravans bound for Draj or Eldaarich in the far north. It didn’t take long for the dwarves to discover that the water was in short supply, and that a single caravan could drink it down to a trickle that would take a week or more to recover. In fact, the water isn’t even enough to support the community that has grown up around it—hence the name Bitter Well.</p>\n<p dir=\"ltr\">I would advise against relying upon watering at this well when making your travel plans; there is at least a 50% chance that the caravan ahead of you has already depleted the well. When this happens, it often takes up to six days before enough water flows back into the well to fill a typical caravan's waterskins.</p>\n<p dir=\"ltr\">\_</p>"
