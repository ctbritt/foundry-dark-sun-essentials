    text:
      format: 1
      content: >-
        <p>Twenty-foot-high walls with guard towers on each corner isolate an
        area once used to house slaves working on the Ziggurat of Kalak. Stories
        of awful practices committed within the walls still wag on the tongues
        of those who survived the experience. When slavery was outlawed in Tyr,
        the Slave Pits remained empty for only a short time before being
        repurposed as a training ground for aspiring gladiators. What started as
        an impromptu introduction to arms for newly freed slaves has become more
        organized. Those who wish to compete in the stadium can come here and
        train to hone their skills.</p><p></p>
