    text:
      format: 1
      content: "<section class=\"readaloud\">\n<p>The heart of Kled is marked by a low, square building constructed from ancient, weathered stone, its walls carved with faded dwarven runes and sun symbols. This is Baranus’ hall, the center of leadership in the village and the place where decisions are made. As you approach, you notice that the structure, though simple in design, exudes a sense of weight and permanence—like it has been there for centuries, enduring the scouring winds and sandstorms of the desert.</p>\n</section>\n<p>\_</p>"
