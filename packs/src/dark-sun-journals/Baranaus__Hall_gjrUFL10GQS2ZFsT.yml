        jM4h8qpyxwTpfNli:
          notes: >-
            <p>The entrance is framed by two <strong>stone columns</strong>
            etched with images of <strong>dwarven heroes</strong> and
            <strong>fierce beasts</strong>, their features smoothed by time. The
            doorway itself is wide, reinforced with bands of <strong>scavenged
            metal</strong> hammered into the stone, and flanked by
            <strong>braziers</strong> that burn with a steady, smokeless flame,
            casting <strong>flickering shadows</strong> across the stone
            floor.</p>

            <p>Inside, the air is cool compared to the heat outside, and the
            stone walls absorb the light, giving the hall a <strong>dim, muted
            atmosphere</strong>. A <strong>long wooden table</strong>, scarred
            and pitted with use, stretches across the center of the room,
            surrounded by <strong>sturdy chairs</strong> carved from
            <strong>darkwood</strong> and reinforced with bone and brass. At the
            far end of the table sits a <strong>throne-like seat</strong> made
            from a <strong>single piece of basalt</strong>, worn smooth by
            generations of dwarven leaders. <strong>Baranus Stonehand</strong>
            is often found there, presiding over the village&rsquo;s affairs
            with a stern, watchful eye.</p>

            <p>Along the walls, <strong>tapestries</strong> hang, faded by time
            but still depicting scenes from the <strong>legendary battles of
            Kemalok</strong>, showing dwarves standing against
            <strong>defilers</strong>, <strong>dragons</strong>, and the
            <strong>merciless sun</strong>. <strong>Sun motifs</strong> and
            <strong>dwarven runes</strong> are woven into the fabric, reminders
            of Kled&rsquo;s enduring reverence for the ancient dwarven kingdom
            that once stood here.</p>

            <p>At the far end of the room, behind Baranus&rsquo; seat, a
            <strong>large stone relief</strong> is embedded into the wall,
            portraying a <strong>mountain crowned by a radiant
            sun</strong>&mdash;the symbol of <strong>Kemalok&rsquo;s
            kings</strong>. Below it, a <strong>small altar</strong> holds
            offerings of <strong>polished stones</strong>,
            <strong>crystals</strong>, and <strong>dried herbs</strong>, placed
            there as a mark of respect for the <strong>ancestors</strong> and
            the <strong>memory of the fallen city</strong>.</p>

            <p>The hall is cool and <strong>austere</strong>, with little in the
            way of decoration beyond the <strong>tapestries</strong> and the
            <strong>stone relief</strong>. Yet, the dwarves of Kled have a habit
            of <strong>gathering here</strong> in the evenings, sharing stories
            and <strong>news from the desert</strong> over cups of <strong>kank
            mead</strong> and <strong>cactus ale</strong>. The room seems to
            carry their voices, making even the softest murmur echo softly
            against the stone walls. It is a place where
            <strong>tradition</strong> and <strong>pragmatism</strong> meet, and
            where the weight of the <strong>past</strong> is felt in every
            shadowed corner.*</p>
