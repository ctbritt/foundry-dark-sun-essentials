    text:
      format: 1
      content: "<p>Many giants inhabit the isles of the estuary. Some are\_friendly, but most giants regard smaller folk as easy pickings\_ and waylay travelers at every chance. Desert giants, and beastheaded giants get along well enough if a strong leader is present,but they fall to bickering and feuding otherwise.</p>\n<p>Giant holds might be cave complexes, ruined towns,\_or clusters of large, crude mud huts, and they are usually\_surrounded by thorny brush walls that form palisades. A\_typical hold is home to three to twelve giants; monstrous\_vassals such as brohgs, or giant beasts kept as pets; and a handful of miserable thralls\_(usually dwarves, elves, or humans). Chiefs of giant holds\_take titles such as “king” or “lord” and levy tribute from\_nearby tribes or\_ settlements of lesser races.</p>"
