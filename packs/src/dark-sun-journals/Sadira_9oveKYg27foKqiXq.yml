    text:
      format: 1
      content: >-
        <p>Sadira is perhaps Tyr's most complex and powerful figure after
        @UUID[JournalEntry.9GCkOL9AyrASxkHj]{King Tithian} himself. Born into
        slavery, she rose to become one of Kalak's slayers and has since evolved
        into a legendary preserver-witch with unprecedented magical abilities.
        Her transformation at the Pristine Tower granted her unique "sun
        wizardry" that allows her to cast spells with defiler-level power during
        daylight without destroying life around her. Driven by deep hatred of
        tyranny and defiling magic, Sadira operates primarily through the
        @UUID[JournalEntry.4ngSM92FQMeMm4we]{Veiled Alliance} network, keeping
        careful watch on Tithian's increasingly authoritarian tendencies while
        protecting budding preservers from templar persecution.</p><p>Her
        greatest strength and weakness is her willingness to walk dangerous
        moral lines to protect Tyr's freedom. While she envisions Tyr as a
        beacon of hope where magic serves life rather than destroying it, her
        experiences have taught her that sometimes ethically gray choices are
        necessary for the greater good. She's intensely curious about
        otherworldly beings and would be particularly interested in party
        members who don't match typical Athasian norms. If the party opposes
        defilers and tyrants, she could become their most powerful ally; if they
        side with Tithian or employ defiling magic, she will move decisively
        against them.</p>
