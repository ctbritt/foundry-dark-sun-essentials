        style="background:transparent"><td
        style="padding-right:1rem;vertical-align:top"
        data-colwidth="286"><h3>Backstory</h3><p>Born in a brothel to a human
        mother, and orcish father. Itilda never knew her father, and could never
        serve under employment at the brothel. For no one wanted to be served an
        orc, not that she would want to. At a young age, Itilda shaved her fangs
        to better to fit in with her human peers. Itilda has returned to the
        tavern/brothel home after serving in her military service, which she
        does not speak of. Itilda felt her first rage in a famous battle, where
        it is known only a few survived. Itilda was named mutilator of manhood
        during her service on how she choose to kill her enemies. It is rumored
        in the war, that she would cut off gentlemen's member and eat the flesh
        to become stronger.</p></td><td
        style="vertical-align:top"><h3>Personality</h3><p>Itilda is a tempest of
        defiance and authenticity, a beacon of freedom fighting against the
        chains of oppression. Her heart beats with a chaotic rhythm, challenging
        tyranny wherever it lurks, yet she is grounded by a deep sincerity.
        Itilda does not hide who she is; her loyalty, fiercely reserved for her
        chosen few, reveals a profound commitment to her friends, her homeland,
        and those too weak to defend themselves.</p><p>Haunted by a past failure
        that cost a dear one's life, Itilda is driven by a vow of protection,
        ensuring such a tragedy never repeats. She values the lives of her
        comrades above all, willing to sacrifice everything for those who fight
        by her side.</p><p>Yet, Itilda battles her own demons. The city's vices,
        especially hard drink, offer a temporary respite from the war's haunting
        memories, which cling to her like shadows. Quick to anger and prideful
        to a fault, she sees denial as a challenge to be met head-on. Her
        physical strength is a source of pride, yet it belies the inner turmoil
        stirred by her battlefield experiences.</p><p>Despite her flaws, Itilda
        is a compelling figure of strength and vulnerability. Her life is a
        testament to the pursuit of freedom, the importance of loyalty, and the
        relentless battle against one's inner
        demons.</p></td></tr></tbody></table>
