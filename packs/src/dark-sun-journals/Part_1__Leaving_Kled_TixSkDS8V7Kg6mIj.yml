        <h1><strong>Part 1: Departure from Kled</strong></h1>

        <p><em>A Dark Sun Adventure for 4-6 characters of levels 15-16</em></p>

        <hr />

        <h2><strong>Opening: The Dwarven Farewell</strong></h2>

        <p>As dawn breaks over the dwarven village of Kled, the heroes prepare
        to depart for Tyr. The settlement buzzes with quiet activity as the
        dwarves gather to see off their unlikely allies.</p>

        <p><strong>Read aloud to the players:</strong></p>

        <div class="fvtt narrative"><p><em>The last rays of the crimson sun
        paint Kled's stone buildings in shades of amber and rust. Baranus
        approaches, his weathered hands carrying a leather satchel and his
        expression a mix of gratitude, shame and concern. Behind him, Caelum and
        a small crowd of village dwarves has assembled.</em></p><p><em>"You've
        done more for Kled than we had any right to ask," he says, his voice
        carrying the weight of genuine respect. "Now you journey to Tyr. We
        cannot protect you there, but we can give you what aid we
        may."</em></p></div>

        <h3><strong>Gifts from Kled</strong></h3>

        <p>Baranus presents the party with the following:</p>

        <h4><strong>Letter of Introduction</strong></h4>

        <p>A scroll written in Common and marked with Kled's seal, addressed to
        "Friends in the Free City." The letter reads:</p>

        <blockquote>
          <p><em>"To those who serve Tyr's cause of freedom: The bearers of this letter have proven themselves friends to Kled and enemies of tyranny. They have [insert specific heroic deeds from previous adventures]. Grant them the trust they have earned and the aid they may require. May their iron never dull. — Baranus of Kled"</em></p>
        </blockquote>

        <p><strong>DM Note:</strong> This letter provides advantage on Charisma
        checks with Rikus and the Crimson Legion, and neutral starting
        reputation with the Freed Slaves faction.</p>

        <h4><strong>Iron Tokens of Kled</strong></h4>

        <p>Small pieces of masterwork iron crafted into the shape of hammers,
        one for each party member. These tokens mark the bearers as allies of
        Kled.</p>

        <p><strong>Mechanical Benefit:</strong> Grants advantage on Charisma
        checks with dwarves and anyone who recognizes Kled's craftsmanship (DC
        15 History or Investigation).</p>

        <h4><strong>Desert Survival Kit</strong></h4>

        <ul>

        <li>10 extra days of water per party member</li>

        <li>7 days of iron rations per party member</li>

        <li>2 <em>Potions of Endurance</em> (Dark Sun equivalent)</li>

        <li>Maps of the safe routes to Tyr</li>

        </ul>


        <h3>** Baranus's Warning**</h3>

        <blockquote>
          <p><strong>Read aloud:</strong></p>
          <ul>
          <li>Baranus's expression grows grave as he grips your shoulder. "Tyr burns with more than the sun these days, friends. The city freed itself from one tyrant, but power makes men hungry for more. Watch your words, watch your backs, and remember—sometimes the greatest enemy wears the face of a liberator."*</li>
          </ul>
          <p><em>He pauses, looking toward the southern horizon. "The iron mines that connect our peoples are bleeding wealth, and desperate people do desperate things. If you find yourselves in need of true allies, seek out Rikus of the Crimson Legion. He's the mul who killed the tyrant Kalak—as honest a warrior as ever lived."</em></p>
        </blockquote>

        <p><strong>DM Note:</strong> This establishes Rikus as a potential ally
        and foreshadows the economic tensions around the iron mines.</p>

        <hr />

        <h2><strong>The Journey South</strong></h2>

        <p>The journey from Kled to Tyr covers approximately 75 miles of rocky
        badlands and stony barrens before the can meet the road and journey into
        the city's verdant belt, typically taking <strong>3 days of
        travel</strong> for a well-supplied party.</p>

        <h3><strong>Day 1: The Rocky Badlands</strong></h3>

        <blockquote>
          <p><strong>Read aloud:</strong></p>
          <p><em>The trade road stretches before you like a dusty ribbon across the Tablelands. Ancient stone markers, carved with dwarven runes and sun-bleached from centuries of exposure, guide your path southward. The road is well-traveled here—you pass small caravans of traders, messenger riders, and groups of pilgrims heading to and from the Free City.</em></p>
        </blockquote>

        <p><strong>Encounters:</strong> The first day passes without incident.
        Use this time for:</p>

        <ul>

        <li>Character development conversations</li>

        <li>Planning for arrival in Tyr</li>

        <li>Establishing party dynamics with the new setting</li>

        </ul>


        <p><strong>Random Encounters (optional):</strong> Roll 1d6. On a 1,
        encounter a small merchant caravan willing to share news from Tyr (see
        "Rumors on the Road" sidebar).</p>

        <h3><strong>Day 2: Abandoned Lands</strong></h3>

        <blockquote>
          <p><strong>Read aloud:</strong></p>
          <p><em>As you travel deeper into the Tyr region, the landscape tells a story of upheaval. Crumbling estate walls stretch across fallow fields, their gates hanging open like broken jaws. What were once thriving plantation complexes now stand partially abandoned, weeds growing through courtyard stones. Occasionally you spot small groups of people—former slaves, perhaps—living in makeshift shelters among the ruins.</em></p>
        </blockquote>

        <p><strong>Investigation Opportunity:</strong> Characters who
        investigate the abandoned estates can make a DC 12 Investigation check
        to notice:</p>

        <ul>

        <li>Evidence of hasty departure by wealthy owners</li>

        <li>Signs that many slaves simply walked away rather than being formally
        freed</li>

        <li>Hidden caches of supplies or small treasures (50-100 cp worth of
        trade goods)</li>

        </ul>


        <h3><strong>Day 3: The Approach to Tyr</strong></h3>

        <blockquote>
          <p><strong>Read aloud:</strong></p>
          <p><em>The road becomes busier as you near Tyr's sphere of influence. Active plantations appear alongside the abandoned ones—but even these show signs of change. Armed guards patrol estate perimeters with obvious nervousness, and you notice workers laboring under much closer supervision than seems natural. The very air seems charged with tension.</em></p>
        </blockquote>

        <hr />

        <h2><strong>Encounter: The Plantation Patrol</strong></h2>

        <p><strong>Encounter Level:</strong> 14 (3,500 XP)</p>

        <p>As the party passes one of the active plantation estates, they are
        confronted by an armed patrol enforcing the estate's security.</p>

        <h3><strong>Setup</strong></h3>

        <blockquote>
          <p><strong>Read aloud:</strong></p>
          <p><em>Ahead, the road passes between two stone pillars marking the boundary of a large estate. Fields of erdlu grain stretch away on both sides, where small groups of workers labor under the watchful eyes of overseers. A wooden sign, freshly painted, reads "House Beryl Estate—Authorized Personnel Only."</em></p>
          <p><em>As you approach the boundary markers, six armed figures emerge from a guardhouse built into the estate wall. Their leader, a stern-faced woman in nobleman's garb, raises her hand in a gesture that's clearly a command to halt.</em></p>
        </blockquote>

        <p><strong>Read when the party comes within 30 feet:</strong></p>

        <blockquote>
          <p><em>"Hold there!" the woman calls out. "State your business on House Beryl lands! These roads aren't safe for wanderers anymore—too many runaway slaves and brigands about since the… changes… in the city."</em></p>
        </blockquote>

        <h3><strong>The Opposition</strong></h3>

        <h4><strong>Lady Kyra Beryl</strong> <em>(Cousin to Matriarch Shoshana
        Beryl)</em></h4>

        <p><em>Medium humanoid (human), lawful evil</em></p>

        <p><strong>Armor Class</strong> 18 (Plate)<br /></p>

        <p><strong>Hit Points</strong> 52 (8d8 + 16)<br /></p>

        <p><strong>Speed</strong> 30 ft.</p>

        <p><strong>STR</strong> 16 (+3) <strong>DEX</strong> 11 (+0)
        <strong>CON</strong> 14 (+2) <strong>INT</strong> 11 (+0)
        <strong>WIS</strong> 11 (+0) <strong>CHA</strong> 15 (+2)</p>

        <p><strong>Saving Throws</strong> Con +4, Wis +2<br /></p>

        <p><strong>Skills</strong> History +2, Persuasion +4<br /></p>

        <p><strong>Senses</strong> passive Perception 10<br /></p>

        <p><strong>Languages</strong> Common, Draconic<br /></p>

        <p><strong>Challenge</strong> 3 (700 XP)</p>

        <p><strong>Brave.</strong> Lady Kyra has advantage on saving throws
        against being frightened.</p>

        <p><strong><em>Actions</em></strong> <strong>Multiattack.</strong> Lady
        Kyra makes two melee attacks. <strong>Longsword.</strong> <em>Melee
        Weapon Attack:</em> +5 to hit, reach 5 ft., one target. <em>Hit:</em> 7
        (1d8 + 3) slashing damage, or 8 (1d10 + 3) slashing damage if used with
        two hands. <strong>Heavy Crossbow.</strong> <em>Ranged Weapon
        Attack:</em> +2 to hit, range 100/400 ft., one target. <em>Hit:</em> 5
        (1d10) piercing damage.</p>

        <p><strong><em>Reactions</em></strong> <strong>Parry.</strong> Lady Kyra
        adds 2 to her AC against one melee attack that would hit her.</p>

        <h4><strong>Plantation Guards (4)</strong></h4>

        <p><em>Medium humanoid (human), lawful neutral</em></p>

        <p><strong>Armor Class</strong> 16 (Chain shirt, shield)<br /></p>

        <p><strong>Hit Points</strong> 11 (2d8 + 2)<br /></p>

        <p><strong>Speed</strong> 30 ft.</p>

        <p><strong>STR</strong> 13 (+1) <strong>DEX</strong> 12 (+1)
        <strong>CON</strong> 12 (+1) <strong>INT</strong> 10 (+0)
        <strong>WIS</strong> 11 (+0) <strong>CHA</strong> 10 (+0)</p>

        <p><strong>Skills</strong> Perception +2<br /></p>

        <p><strong>Senses</strong> passive Perception 12<br /></p>

        <p><strong>Languages</strong> Common<br /></p>

        <p><strong>Challenge</strong> 1/8 (25 XP)</p>

        <p><strong><em>Actions</em></strong> <strong>Spear.</strong> <em>Melee
        or Ranged Weapon Attack:</em> +3 to hit, reach 5 ft. or range 20/60 ft.,
        one target. <em>Hit:</em> 4 (1d6 + 1) piercing damage, or 5 (1d8 + 1)
        piercing damage if used with two hands to make a melee attack.</p>

        <h4><strong>Half-Giant Enforcers (2)</strong></h4>

        <p><em>Large humanoid (giant), chaotic neutral</em></p>

        <p><strong>Armor Class</strong> 12 (Hide Armor)<br /></p>

        <p><strong>Hit Points</strong> 30 (4d10 + 8)<br /></p>

        <p><strong>Speed</strong> 30 ft.</p>

        <p><strong>STR</strong> 17 (+3) <strong>DEX</strong> 10 (+0)
        <strong>CON</strong> 14 (+2) <strong>INT</strong> 7 (-2)
        <strong>WIS</strong> 10 (+0) <strong>CHA</strong> 9 (-1)</p>

        <p><strong>Senses</strong> passive Perception 10<br /></p>

        <p><strong>Languages</strong> Common, Giant<br /></p>

        <p><strong>Challenge</strong> 1 (200 XP)</p>

        <p><strong><em>Actions</em></strong> <strong>Greatclub.</strong>
        <em>Melee Weapon Attack:</em> +5 to hit, reach 5 ft., one target.
        <em>Hit:</em> 12 (2d8 + 3) bludgeoning damage.</p>

        <h3><strong>Lady Kyra's Motivations</strong></h3>

        <p>Lady Kyra represents the noble faction's fears and resentments about
        Tyr's new order:</p>

        <ul>

        <li><strong>Suspicious of Outsiders:</strong> Assumes well-armed
        travelers might be escaped slaves, bandits, or political agitators</li>

        <li><strong>Economic Pressure:</strong> The estate is struggling with
        labor shortages and reduced profits</li>

        <li><strong>Political Resentment:</strong> Bitter about the loss of
        noble privileges and the chaos of the new order</li>

        <li><strong>Family Honor:</strong> Trying to prove herself worthy to
        Matriarch Shoshana Beryl</li>

        </ul>


        <h3><strong>Tactical Considerations</strong></h3>

        <ul>

        <li><strong>Terrain:</strong> The encounter takes place on the open road
        with 10 feet of space on each side before estate walls begin</li>

        <li><strong>Positioning:</strong> Guards spread out to flank the party;
        half-giants position themselves to block retreat</li>

        <li><strong>Morale:</strong> Guards fight until half their number are
        down, then attempt to retreat. Lady Kyra fights until reduced to 10 hit
        points unless outmatched.</li>

        </ul>


        <h3><strong>Resolution Options</strong></h3>

        <h4><strong>Diplomatic Resolution</strong> <em>(Recommended)</em></h4>

        <p><strong>Skill Challenge:</strong> 3 successes before 2 failures, DC
        varies by approach</p>

        <p><strong>Possible Approaches:</strong></p>

        <p><strong>Persuasion (DC 15):</strong></p>

        <ul>

        <li>Present the letter from Kled (+2 to roll)</li>

        <li>Explain legitimate business in Tyr</li>

        <li>Show respect for noble authority</li>

        <li>Success: Lady Kyra allows passage and offers information about
        Tyr</li>

        </ul>


        <p><strong>Intimidation (DC 13):</strong></p>

        <ul>

        <li>Display powerful magic or weapons</li>

        <li>Reference important connections</li>

        <li>Success: Lady Kyra backs down but reports the party to city
        authorities</li>

        </ul>


        <p><strong>Deception (DC 12):</strong></p>

        <ul>

        <li>Claim to be merchants or skilled workers</li>

        <li>Pretend to seek employment with House Beryl</li>

        <li>Success: Lady Kyra directs party to House Beryl's city offices</li>

        </ul>


        <p><strong>History or Insight (DC 14):</strong></p>

        <ul>

        <li>Recognize House Beryl's importance in Tyr</li>

        <li>Understand the economic pressures nobles face</li>

        <li>Success: Gain advantage on subsequent Persuasion checks</li>

        </ul>


        <h4><strong>Combat Resolution</strong></h4>

        <p>If combat breaks out:</p>

        <p><strong>Round 1:</strong> Lady Kyra attempts to intimidate with a
        show of force: "Surrender now and we'll merely confiscate your
        weapons!"</p>

        <p><strong>Round 3:</strong> If guards are clearly outmatched, Lady Kyra
        calls for surrender</p>

        <p><strong>Victory Consequences:</strong></p>

        <ul>

        <li>Word spreads to Tyr about dangerous travelers</li>

        <li>-1 reputation with Noble faction</li>

        <li>+1 reputation with Freed Slaves faction (if they learn about
        it)</li>

        </ul>


        <h3><strong>Information Gained</strong></h3>

        <p>Regardless of resolution method, successful interaction with Lady
        Kyra can reveal:</p>

        <p><strong>About Tyr's Current Situation:</strong></p>

        <ul>

        <li>"The city's in chaos—former slaves thinking they can demand wages
        like free men!"</li>

        <li>"King Tithian talks about freedom, but he doesn't understand the
        natural order"</li>

        <li>"Trade has suffered terribly since the… disruption… of proper labor
        relationships"</li>

        </ul>


        <p><strong>About the Economic Crisis:</strong></p>

        <ul>

        <li>"The iron mines produce half what they used to—no one wants to do
        the dangerous work"</li>

        <li>"House Vordon grows desperate, making deals with unsavory
        partners"</li>

        <li>"Some say Tithian is planning something drastic to solve the tribute
        problem"</li>

        </ul>


        <p><strong>About Political Tensions:</strong></p>

        <ul>

        <li>"The Council of Advisors meets in secret these days—something has
        them worried"</li>

        <li>"There are rumors about important people disappearing"</li>

        <li>"The templars seem nervous, asking questions about strangers in the
        city"</li>

        </ul>


        <h3><strong>Aftermath and Consequences</strong></h3>

        <h4><strong>Friendly Resolution</strong></h4>

        <ul>

        <li>Lady Kyra provides directions to the best route into Tyr</li>

        <li>Warns party about tensions at the city gates</li>

        <li>Offers letter of introduction to House Beryl (opens future
        opportunities)</li>

        </ul>


        <h4><strong>Hostile Resolution</strong></h4>

        <ul>

        <li>Lady Kyra sends a messenger to Tyr warning about dangerous
        travelers</li>

        <li>Party may face additional scrutiny at city gates</li>

        <li>Future encounters with nobles begin with suspicion</li>

        </ul>


        <hr />

        <h2><strong>Transition to Part 2</strong></h2>

        <blockquote>
          <p><strong>Read aloud:</strong></p>
          <p><em>As you continue southward, the road becomes increasingly busy with travelers of all kinds. Merchant caravans, pilgrims, job-seekers, and refugees create a steady stream of humanity flowing toward the Free City. In the distance, you can see the first signs of Tyr itself—columns of smoke rising from cooking fires and workshops, and the glint of sunlight off the city's famous Golden Tower.</em></p>
          <p><em>The time for preparation is over. Whatever awaits you in the Free City of Tyr, you'll face it soon enough.</em></p>
        </blockquote>

        <hr />

        <h2><strong>Sidebar: Rumors on the Road</strong></h2>

        <p>If the party encounters travelers or shows interest in gathering
        information, they might hear the following rumors (roll 1d6):</p>

        <ol>

        <li><strong>"King Tithian's been acting strange lately—spending all his
        time in the old tyrant's tower."</strong></li>

        <li><strong>"They say the iron mines are cursed—workers keep
        disappearing in the deep tunnels."</strong></li>

        <li><strong>"House Vordon's hiring mercenaries, but not for caravan
        protection…"</strong></li>

        <li><strong>"The freed slaves are planning something big—a general
        strike, maybe."</strong></li>

        <li><strong>"Templars have been asking questions about strangers with
        magical abilities."</strong></li>

        <li><strong>"Someone important in the Council has gone missing—they're
        keeping it quiet."</strong></li>

        </ol>


        <hr />

        <h2><strong>DM Notes</strong></h2>

        <h3><strong>Pacing</strong></h3>

        <p>This section should take approximately 30 minutes of play time,
        focusing on:</p>

        <ul>

        <li>Establishing the transition from Kled to Tyr</li>

        <li>Introducing the political tensions through the plantation
        encounter</li>

        <li>Providing the party with resources and connections for the next
        phase</li>

        </ul>


        <h3><strong>Scaling the Encounter</strong></h3>

        <ul>

        <li><strong>For Weaker Parties:</strong> Remove one half-giant or reduce
        Lady Kyra's hit points</li>

        <li><strong>For Stronger Parties:</strong> Add 2 more guards or give
        Lady Kyra a <em>Potion of Healing</em></li>

        <li><strong>For Diplomatic Parties:</strong> Emphasize the skill
        challenge and reduce combat as a backup option</li>

        </ul>


        <h3><strong>Setting the Tone</strong></h3>

        <p>This encounter establishes several key themes:</p>

        <ul>

        <li>The tension between old and new orders in Tyr</li>

        <li>The economic disruption caused by abolition</li>

        <li>The suspicion and fear affecting all social classes</li>

        <li>The party's need to navigate complex political situations</li>

        </ul>


        <p>The encounter should feel tense but not hopeless, challenging but not
        overwhelming. Success here builds confidence for the larger challenges
        awaiting in Tyr itself.</p>
