        **Senses** passive Perception 10<br>


        **Languages** Common, Draconic<br>


        **Challenge** 3 (700 XP)


        **Brave.** Lady Kyra has advantage on saving throws against being
        frightened.


        ***Actions*** **Multiattack.** Lady Kyra makes two melee attacks.
        **Longsword.** *Melee Weapon Attack:* \+5 to hit, reach 5 ft., one
        target. *Hit:* 7 (1d8 + 3) slashing damage, or 8 (1d10 + 3) slashing
        damage if used with two hands. **Heavy Crossbow.** *Ranged Weapon
        Attack:* \+2 to hit, range 100/400 ft., one target. *Hit:* 5 (1d10)
        piercing damage.


        ***Reactions*** **Parry.** Lady Kyra adds 2 to her AC against one melee
        attack that would hit her.


        #### **Plantation Guards (4)**


        *Medium humanoid (human), lawful neutral*


        **Armor Class** 16 (Chain shirt, shield)<br>


        **Hit Points** 11 (2d8 + 2)<br>


        **Speed** 30 ft.


        **STR** 13 (+1) **DEX** 12 (+1) **CON** 12 (+1) **INT** 10 (+0) **WIS**
        11 (+0) **CHA** 10 (+0)


        **Skills** Perception +2<br>


        **Senses** passive Perception 12<br>


        **Languages** Common<br>


        **Challenge** 1/8 (25 XP)


        ***Actions*** **Spear.** *Melee or Ranged Weapon Attack:* \+3 to hit,
        reach 5 ft. or range 20/60 ft., one target. *Hit:* 4 (1d6 + 1) piercing
        damage, or 5 (1d8 + 1) piercing damage if used with two hands to make a
        melee attack.


        #### **Half-Giant Enforcers (2)**


        *Large humanoid (giant), chaotic neutral*


        **Armor Class** 12 (Hide Armor)<br>


        **Hit Points** 30 (4d10 + 8)<br>


        **Speed** 30 ft.


        **STR** 17 (+3) **DEX** 10 (+0) **CON** 14 (+2) **INT** 7 (-2) **WIS**
        10 (+0) **CHA** 9 (-1)


        **Senses** passive Perception 10<br>


        **Languages** Common, Giant<br>


        **Challenge** 1 (200 XP)


        ***Actions*** **Greatclub.** *Melee Weapon Attack:* \+5 to hit, reach 5
        ft., one target. *Hit:* 12 (2d8 + 3) bludgeoning damage.


        ### **Lady Kyra's Motivations**


        Lady Kyra represents the noble faction's fears and resentments about
        Tyr's new order:


        - **Suspicious of Outsiders:** Assumes well-armed travelers might be
        escaped slaves, bandits, or political agitators

        - **Economic Pressure:** The estate is struggling with labor shortages
        and reduced profits

        - **Political Resentment:** Bitter about the loss of noble privileges
        and the chaos of the new order

        - **Family Honor:** Trying to prove herself worthy to Matriarch Shoshana
        Beryl


        <!-- -->


        ### **Tactical Considerations**


        - **Terrain:** The encounter takes place on the open road with 10 feet
        of space on each side before estate walls begin

        - **Positioning:** Guards spread out to flank the party; half-giants
        position themselves to block retreat

        - **Morale:** Guards fight until half their number are down, then
        attempt to retreat. Lady Kyra fights until reduced to 10 hit points
        unless outmatched.


        <!-- -->


        ### **Resolution Options**


        #### **Diplomatic Resolution** *(Recommended)*


        **Skill Challenge:** 3 successes before 2 failures, DC varies by
        approach


        **Possible Approaches:**


        **Persuasion (DC 15):**


        - Present the letter from Kled (+2 to roll)

        - Explain legitimate business in Tyr

        - Show respect for noble authority

        - Success: Lady Kyra allows passage and offers information about Tyr


        <!-- -->


        **Intimidation (DC 13):**


        - Display powerful magic or weapons

        - Reference important connections

        - Success: Lady Kyra backs down but reports the party to city
        authorities


        <!-- -->


        **Deception (DC 12):**


        - Claim to be merchants or skilled workers

        - Pretend to seek employment with House Beryl

        - Success: Lady Kyra directs party to House Beryl's city offices


        <!-- -->


        **History or Insight (DC 14):**


        - Recognize House Beryl's importance in Tyr

        - Understand the economic pressures nobles face

        - Success: Gain advantage on subsequent Persuasion checks


        <!-- -->


        #### **Combat Resolution**


        If combat breaks out:


        **Round 1:** Lady Kyra attempts to intimidate with a show of force:
        "Surrender now and we'll merely confiscate your weapons!"


        **Round 3:** If guards are clearly outmatched, Lady Kyra calls for
        surrender


        **Victory Consequences:**


        - Word spreads to Tyr about dangerous travelers

        - \-1 reputation with Noble faction

        - \+1 reputation with Freed Slaves faction (if they learn about it)


        <!-- -->


        ### **Information Gained**


        Regardless of resolution method, successful interaction with Lady Kyra
        can reveal:


        **About Tyr's Current Situation:**


        - "The city's in chaos—former slaves thinking they can demand wages like
        free men!"

        - "King Tithian talks about freedom, but he doesn't understand the
        natural order"

        - "Trade has suffered terribly since the… disruption… of proper labor
        relationships"


        <!-- -->


        **About the Economic Crisis:**


        - "The iron mines produce half what they used to—no one wants to do the
        dangerous work"

        - "House Vordon grows desperate, making deals with unsavory partners"

        - "Some say Tithian is planning something drastic to solve the tribute
        problem"


        <!-- -->


        **About Political Tensions:**


        - "The Council of Advisors meets in secret these days—something has them
        worried"

        - "There are rumors about important people disappearing"

        - "The templars seem nervous, asking questions about strangers in the
        city"


        <!-- -->


        ### **Aftermath and Consequences**


        #### **Friendly Resolution**


        - Lady Kyra provides directions to the best route into Tyr

        - Warns party about tensions at the city gates

        - Offers letter of introduction to House Beryl (opens future
        opportunities)


        <!-- -->


        #### **Hostile Resolution**


        - Lady Kyra sends a messenger to Tyr warning about dangerous travelers

        - Party may face additional scrutiny at city gates

        - Future encounters with nobles begin with suspicion


        <!-- -->


        ---


        ## **Transition to Part 2**


        > **Read aloud:**

        > 

        > *As you continue southward, the road becomes increasingly busy with
        travelers of all kinds. Merchant caravans, pilgrims, job-seekers, and
        refugees create a steady stream of humanity flowing toward the Free
        City. In the distance, you can see the first signs of Tyr itself—columns
        of smoke rising from cooking fires and workshops, and the glint of
        sunlight off the city's famous Golden Tower.*

        > 

        > *The time for preparation is over. Whatever awaits you in the Free
        City of Tyr, you'll face it soon enough.*


        ---


        ## **Sidebar: Rumors on the Road**


        If the party encounters travelers or shows interest in gathering
        information, they might hear the following rumors (roll 1d6):


        1. **"King Tithian's been acting strange lately—spending all his time in
        the old tyrant's tower."**

        2. **"They say the iron mines are cursed—workers keep disappearing in
        the deep tunnels."**

        3. **"House Vordon's hiring mercenaries, but not for caravan
        protection…"**

        4. **"The freed slaves are planning something big—a general strike,
        maybe."**

        5. **"Templars have been asking questions about strangers with magical
        abilities."**

        6. **"Someone important in the Council has gone missing—they're keeping
        it quiet."**


        <!-- -->


        ---


        ## **DM Notes**


        ### **Pacing**


        This section should take approximately 30 minutes of play time, focusing
        on:


        - Establishing the transition from Kled to Tyr

        - Introducing the political tensions through the plantation encounter

        - Providing the party with resources and connections for the next phase


        <!-- -->


        ### **Scaling the Encounter**


        - **For Weaker Parties:** Remove one half-giant or reduce Lady Kyra's
        hit points

        - **For Stronger Parties:** Add 2 more guards or give Lady Kyra a
        *Potion of Healing*

        - **For Diplomatic Parties:** Emphasize the skill challenge and reduce
        combat as a backup option


        <!-- -->


        ### **Setting the Tone**


        This encounter establishes several key themes:


        - The tension between old and new orders in Tyr

        - The economic disruption caused by abolition

        - The suspicion and fear affecting all social classes

        - The party's need to navigate complex political situations


        <!-- -->


        The encounter should feel tense but not hopeless, challenging but not
        overwhelming. Success here builds confidence for the larger challenges
        awaiting in Tyr itself.
