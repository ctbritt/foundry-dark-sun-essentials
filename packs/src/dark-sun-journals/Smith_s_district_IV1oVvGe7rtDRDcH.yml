      content: "<section><div><div><div><div><div><div><div><div><div><p>Smiths district</p></div></div></div></div></div></div></div></div></div></section><section><div><p>\_</p></div><div><div><div><div><div><div><div><div><div><p>This district also engages in trade, although few people make their homes here. Unlike in the Artisan District, the labor performed in the Smiths’ District is big and loud, and it requires a lot of space.</p><p>Brickyards: The construction of the brick Ziggurat of Kalak was a monumental effort that hurried hundreds of slaves to their deaths. Today, the Brickyards continue to produce bricks, although production has been diverted to the many civil projects that languished so long while the ziggurat was being built. The Brickyards no longer use slaves, instead paying laborers for a day’s service. Ironically, many laborers are ex-slaves who once worked under the threat of the lash. The site remains under the authority of the city (that is, King Tithian and the templars), but workers have begun demanding control. Almost daily, protests and demonstrations begin in the Brickyards and march through other districts. Each parade includes workers loudly chanting “Brickyards for the Brickers!” and similar slogans. So far, only minor scuffles have resulted from brushes with the Tyrian guard.</p><p>Slave Pits: Twenty-foot-high walls with guard towers on each corner isolate an area once used to house slaves working on the Ziggurat of Kalak. Stories of awful practices committed within the walls still wag on the tongues of those who survived the experience. When slavery was outlawed in Tyr, the Slave Pits remained empty for only a short time before being repurposed as a training ground for aspiring gladiators. What started as an impromptu introduction to arms for newly freed slaves has become more organized. Those who wish to compete in the stadium can come here and train to hone their skills.</p><p>Rarvin’s Wagonworks: This large workshop specializes in the repair and manufacture of wagons, armored argosies, chariots, howdahs, and more.</p><p>Tarnished Cup: This shop offers previously owned goods, including jewelry, musical instruments, and more exotic items that were likely fenced. The proprietor, a Half-elf named Gavan Sul, is rumored to deal in devil grass, a pernicious scrub weed that is the basis for a potent poison.</p><p>The Brick Barrow: Over the years, many slaves have died in the Brickyards, and their bodies were dropped down a shaft that opened into a cavity be neath the district. This dumping ground is referred to as the Brick Barrow. Now and then, haunting cries still echo up the shaft, audible even through the stone plug that Tithian ordered to seal it.</p></div></div></div></div></div></div></div></div></div></section><section><div><p>\_</p></div><div><div><div><div><div><div><div><div><div><p>Smiths’ District Personality</p><p>Gavan Sul is the very soul of urbanity, so much so that he comes off as slightly insincere when he flatters customers about how well a particular piece of jewelry or clothing would look on them. That’s because Sul is insincere; he cares only for profit and would sell the eyes of his own mother for enough coin. Sul is a fence for the Iron Rats, a gang that prowls the Warrens. Every so often, a member of the Rats gets the idea to rob the shop, but such thieves are never seen again. Sul is also secretly involved with the Ianto Traders, members of House Ianto who aren’t ready to quit the slave trade just yet. He sometimes abducts patrons of his shop to supply Ianto’s illicit operation.</p></div></div></div></div></div></div></div></div></div></section><section><div><p>\_</p></div><div><div><div><div><div><div><div><div><div><div><img src=\"https://lh4.googleusercontent.com/K0Esm5VlM8o-5kJeHU8XWbUAtJoHwR_7N5AgnrQ-yLQNRoBeuSGMh6WIQY-YHfxaYVpuQ2tTYsMzJ19HTTGFS6ykJ-gsKe40DE_hjcAUg9lYrCtgVC7Pjcg2hPps5yByKA=w1280\" /></div></div></div></div></div></div></div></div></div></div></section>"
