        /></td><td style="padding:2rem;font-size:1.5rem"><p><strong>Name:
        </strong>Rickvon Stonebarrel</p><p><strong>Race:
        </strong>@UUID[Actor.2LM86XNS2fTXSelV.Item.32AtLOGkoPnCGDOp]{Stout
        Halfling}</p><p><strong>Age: </strong>31</p><p><strong>Background:
        @UUID[Actor.2LM86XNS2fTXSelV.Item.Iyrdil0iFzUFzSxb]{Sage}</strong></p></td></tr><tr
        style="background:transparent"><td
        style="padding-right:1rem;vertical-align:top"><h3>Backstory</h3><p>Rick
        was born in a small farming village. Most of his childhood was spent
        tending crops with his family. As many of his kind are, Rick was very
        curious. Occasionally he would hear stories from travelers and traders
        on their way to larger cities. He learned of the greater world around
        him, and wanted to go with them! During one of these visits, a traveling
        wizard noticed Rick mimicking his movements when casting cantrips to
        entertain the locals. Both were equally surprised when he managed to
        manifest a magic hand. Even this small power was amazing to Rick. He
        wanted to see more, to learn more, to do more! Over the next few years
        the wizard would teach Rick as his route took him through the village in
        exchange for a discount on their party's purchases. Only the basics,
        nothing dangerous. Just enough to show a school that he was worth taking
        in. Once he saved up a decent sum, Rick decided to join one of the
        caravans in search of a proper college of magic. He did odd jobs here
        and there to earn his keep as the caravan traveled until he was able to
        find somewhere to learn. A proper education in magic was both expensive
        and slow. The money he earned was enough to buy entry into a school, but
        he would have to take shifts in the kitchen, along with guard and
        cleaning duty in order to stay. Even still, he was excited. He was
        learning new things about magic every day! He learned more about the
        world, how to channel his energies, and how to protect those around him.
        But, it was slow. He knew the world held many more secrets, and that he
        could best learn in the field. He had heard rumors of an ancient
        civilization that would prove interesting.</p></td><td
        style="vertical-align:top"><h3>Personality</h3><p>Rickvon, a halfling
        wizard, embodies the boundless curiosity and unquenchable thirst for
        knowledge that drives the most devoted of scholars. With a life
        dedicated to the pursuit of self-improvement through study, he sees the
        mastery of magic not just as a personal quest, but as a path to a
        greater good. For Rickvon, the intricate tapestries of magic hold the
        key to unlocking a future where knowledge and power are accessible to
        all, envisioning an era where the arcane arts serve as the great
        equalizer among the diverse peoples of the world.</p><p>This vision is
        guided by a philosophy that rejects any limitations on the potential
        inherent in existence. Rickvon believes in the infinite possibilities
        that magic can offer, viewing the world and its arcane mysteries as a
        puzzle to be solved, a vast and intricate challenge that beckons to his
        inquisitive spirit. His dedication to understanding the very fabric of
        magic drives him to explore the most arcane and hidden aspects of the
        magical world, always believing that the next discovery could be the key
        to unlocking his dream of universal empowerment through
        magic.</p><p>Rickvon's quest for knowledge, however, is not without its
        pitfalls. He is easily swayed by the lure of new information, often
        finding himself sidetracked by intriguing tidbits of lore or unsolved
        mysteries that cross his path. This penchant for distraction, though, is
        balanced by a genuine love for unraveling the unknown. There's nothing
        he delights in more than a good mystery, seeing each as an opportunity
        to expand his understanding and edge closer to his ultimate
        goal.</p><p>Despite his lofty ambitions and occasional
        absent-mindedness, Rickvon remains grounded through his interactions
        with those less versed in the arcane. He is generous with his knowledge,
        taking the time to explain complex concepts with patience and clarity.
        This willingness to teach and guide others reflects his belief in the
        transformative power of education and understanding, hoping to inspire a
        love for learning and discovery in everyone he meets.</p><p>In Rickvon,
        we find a character whose life is a testament to the power of knowledge
        and the potential for magic to bring about a world of equality and
        enlightenment. His journey is one of constant learning, teaching, and an
        unwavering belief in the boundless possibilities that await those who
        dare to dream.</p></td></tr></tbody></table>
