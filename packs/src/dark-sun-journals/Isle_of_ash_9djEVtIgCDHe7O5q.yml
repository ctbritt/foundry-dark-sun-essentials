    text:
      format: 1
      content: "<p>This volcanic isle smokes and smolders constantly.\_Although it rarely erupts in lava flows, the volcano\_produces enormous amounts of ash, which coat\_its cinder cone several feet deep. The island usually\_lies beneath a pall of airborne ash, and this may\_cover surrounding regions downwind in Moderate\_or greater wind conditions.\_</p>\n<p>The column of hot ash and smoke rising from the\_cone is visible 40-50 miles away, if the wind permits.\_Ashfall can occur as far as Draj. There is no water\_and no life on the Isle of Ash.</p>\n<p>On rare occasions, the volcano produces a superheated\_mass of volcanic gases, ash, and dust. This\_lethal mixture blankets the island, requiring any\_breathing creature to make a CON save or take 10d6 damage (save for half damage). This kind of eruption\_is preceded by many warning signs for days beforehand,\_so an alert and fast-moving party can\_escape the area.</p>"
