      content: "<p>The Palace of</p><p>Gladiatorial Combat in Draj</p><p>When he conquered the city of Draj, the great warrior</p><p>Tectuktitlay was amazed at the absence of a gladiatorial</p><p>arena into which he could send the captured troops to</p><p>fight. Tectuktitlay ordered the creation of a combat</p><p>arena so magnificent that its sheer beauty would rival</p><p>any structure known to the tablelands. Armed with a</p><p>quill rather than a sword, he designed an arena that</p><p>would one day be known far and wide as the \x93Palace.\x94</p><p>The new ruler, now known as \x93The Mighty and</p><p>Omnipotent Tectuktitlay,\x94 quickly began construction</p><p>of the fighting arena and a lavish surrounding palace.</p><p>He pledged the arena would be built before the first</p><p>years of his reign in Draj passed, regardless of how many</p><p>slaves died.</p><p>The Palace of Gladiatorial Combat in Draj is not an</p><p>arena, but rather a modified amphitheater. The arena</p><p>floor is round, with spectator stands rising around twothirds</p><p>of the circle. Across from the spectator seating</p><p>stands the great observation hall of the king. This opulent</p><p>building rises eight stories and dwarfs the surrounding</p><p>spectator grandstands. The structure is covered in</p><p>bas-relief depicting The Mighty and Omnipotent Tectuktitlay</p><p>standing victorious on different fields of battle,</p><p>always flanked by two mighty jaguars. The king, his templars,</p><p>and nobles in good favor watch combat from the</p><p>great hall. Directly behind the hall stands the renowned</p><p>Great Pyramid of the King.</p><p>An expansive red brick esplanade runs from the</p><p>Golden Moon Gate to the Palace of Gladiatorial Combat</p><p>and the Great Pyramid of the King. On gladiatorial</p><p>days, any captured slaves destined for the arena are displayed</p><p>in small wooden pens along the esplanade. This</p><p>is not only to allow the populace to humiliate the captured,</p><p>but also to allow them to view any \x93worthy\x94 fighters</p><p>before betting in the arena.</p><p>King Tectuktitlay personally enjoys cruelty and violence;</p><p>hence, the entire culture is based on warfare and</p><p>conflict. He uses his slave soldiers and gladiators to raid</p><p>nearby regions in order to obtain more slaves for his</p><p>arena games. It is said that the gladiatorial slaves of Draj</p><p>are feared in the arena because they are like their</p><p>master-ruthless. The cruelty and aggressiveness of the</p><p>gladiatorial fighters attract a few gladiatorial arena</p><p>champions from elsewhere, hoping to prove themselves</p><p>against the \x93Jaguar Warriors.\x94</p><p>The citizens of Draj disdain dance and drama, therefore,</p><p>very few jazst troupes ever travel to the city. Combat</p><p>is the preferred form of entertainment.</p>"
