      content: |-
        <p>The ssurrans maintain a common village called Trade</p>
        <p>Nest, that's governed by the ancient OverChief of all</p>
        <p>ssurran tribes. The OverChief Ssuss'ess is as proud of</p>
        <p>his traders as any merchant house patriarch, though</p>
        <p>he takes great offense to anyone who calls his people</p>
        <p>"primitive". If travelers don't mind being bombarded</p>
        <p>by hagglers and deal-makers, then Trade Nest can be</p>
        <p>a welcome respite from the harshness of the Scorch</p>
        <p>Plateau. For a price, supplies, information, and even</p>
        <p>guides can be acquired in this ramshackle village.</p>
        <p>Ssurran guides make excellent companions for travelers</p>
        <p>crossing the Scorched Plateau, and ssurran caravans can</p>
        <p>be life-savers when all other options have been exhausted.</p>
        <p>They can appear at any time, emerging from a canyon or</p>
        <p>walking out of sandstorm with a load of wares. The quality</p>
        <p>might not be what those from the Tyr</p>
        <p>Region are used to, but the water and food</p>
        <p>they carry can sustain thirsty and hungry</p>
        <p>travelers until they reach their destination.</p>
