  - type: text
    name: 'Skill Challenge: Survive the Desert'
    _id: NfjTKOyffELZMLxE
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Challenge Level</strong>: Equal to the party's average level
        (rewards XP equal to the value of <strong>three medium-difficulty
        encounters</strong> for the party's
        level).</p><p><strong>Complexity</strong>: <strong>3</strong> (Requires
        <strong>8 successes</strong> before <strong>3
        failures</strong>).</p><p><strong>Primary Skills</strong>:
        <strong>Athletics</strong>, <strong>Constitution (Endurance)</strong>,
        <strong>Medicine</strong>, <strong>Nature</strong>.</p><hr
        /><h3><strong>Primary Skill
        Checks</strong></h3><ol><li><p><strong>Athletics</strong> (Moderate DC
        by level)</p><ul><li><strong>Description</strong>: The character climbs
        <strong>rocky ledges</strong>, leaps across <strong>sand-filled
        crevices</strong>, or trudges through the <strong>shifting
        silt</strong>, helping the party <strong>bypass rough
        terrain</strong>.</li><li><strong>Outcome</strong>: Success indicates
        that the party <strong>avoids dangerous terrain</strong> and makes good
        time. Failure means the party <strong>slows down</strong>, risking more
        exposure to <strong>heat</strong> and
        <strong>sun</strong>.</li><li><strong>Limit</strong>: This skill can
        provide a <strong>maximum of 2 successes</strong> in this
        challenge.</li></ul></li><li><p><strong>Constitution
        (Endurance)</strong> (Hard DC by
        level)</p><ul><li><strong>Description</strong>: The character
        <strong>endures the unrelenting sun</strong>, the <strong>dry
        air</strong>, and the <strong>exhaustion</strong> that comes with
        <strong>traveling through the desert</strong>. They push through fatigue
        and help keep the party moving.</li><li><strong>Outcome</strong>:
        Success means the character shakes off <strong>exhaustion</strong> and
        maintains <strong>focus</strong>. Failure means that the character gains
        <strong>1 level of exhaustion</strong>.</li><li><strong>Limit</strong>:
        This skill can provide a <strong>maximum of 4 successes</strong> in this
        challenge.</li></ul></li><li><p><strong>Medicine</strong> (Moderate DC
        by level)</p><ul><li><strong>Description</strong>: Using the
        <strong>meager resources</strong> the party has, the character treats
        <strong>abrasions</strong> and <strong>injuries</strong> caused by the
        <strong>grit</strong> and <strong>heat</strong>. They use
        <strong>herbs</strong> or <strong>bandages</strong> to prevent
        <strong>heatstroke</strong> and
        <strong>sunburn</strong>.</li><li><strong>Outcome</strong>: Success
        means the party suffers <strong>less from the heat</strong>, regaining
        some <strong>vitality</strong>. Failure results in <strong>lost hit
        points</strong> as the <strong>harsh conditions</strong> take a
        toll.</li><li><strong>Limit</strong>: This skill can provide a
        <strong>maximum of 2 successes</strong> in this
        challenge.</li></ul></li><li><p><strong>Nature</strong> (Moderate DC by
        level)</p><ul><li><strong>Description</strong>: The character finds the
        <strong>best path</strong> through the desert, <strong>identifies
        hazards</strong> like <strong>silt sinks</strong> and <strong>hidden
        scorpions</strong>, hunts down a <strong>creature for food</strong>, or
        discovers a small <strong>water
        source</strong>.</li><li><strong>Outcome</strong>: Success indicates the
        party makes progress without <strong>wasting energy</strong> or
        <strong>supplies</strong>. Failure means the character finds
        <strong>nothing</strong>, and the party suffers from <strong>prolonged
        exposure</strong>.</li><li><strong>Limit</strong>: This skill can
        provide a <strong>maximum of 4 successes</strong> in this
        challenge.</li></ul></li></ol><hr /><h3><strong>Secondary Skill
        Check</strong></h3><ol><li><p><strong>Perception</strong> (Moderate DC
        by level)</p><ul><li><strong>Description</strong>: The character keeps a
        <strong>sharp lookout</strong> for <strong>landmarks</strong>,
        <strong>dangers</strong>, or <strong>hazardous terrain</strong> that
        might hinder the party's progress.</li><li><strong>Outcome</strong>:
        Success grants the <strong>next Nature check</strong> made in this
        challenge a <strong>+2 bonus</strong>. Failure means that the character
        misses a <strong>significant hazard</strong>, resulting in no immediate
        penalty but leaving the party vulnerable to
        <strong>complications</strong>.</li></ul></li></ol><hr
        /><h3><strong>Desert Complications (Setbacks)</strong></h3><p>After
        every <strong>2-4 skill checks</strong> (choose an appropriate interval
        based on the party’s progress and roleplay), the environment presents a
        new <strong>challenge</strong>. Use one of the following setbacks to
        represent the <strong>perilous nature</strong> of
        <strong>Athas</strong>:</p><ol><li><p><strong>Extreme
        Heat</strong></p><ul><li><strong>Group Endurance Check</strong>
        (Moderate DC by level).</li><li><strong>Outcome</strong>: If more than
        half the party succeeds, they gain <strong>1 success</strong> in the
        challenge. If they fail, each character <strong>loses 1 hit die</strong>
        until they take an <strong>extended rest</strong> and receive
        <strong>food and water</strong>. Until the next setback, each character
        <strong>regains half the normal hit points</strong> when using
        <strong>hit
        dice</strong>.</li></ul></li><li><p><strong>Mirage</strong></p><ul><li><strong>Group
        Perception Check</strong> (Moderate DC by
        level).</li><li><strong>Outcome</strong>: Success means the party
        <strong>sees through the illusion</strong> and gains <strong>1
        success</strong> in the challenge. If they fail, each character takes a
        <strong>-2 penalty</strong> to their next <strong>Nature check</strong>
        as they waste time following the <strong>illusory
        image</strong>.</li></ul></li><li><p><strong>Silt
        Storm</strong></p><ul><li><strong>Group Endurance Check</strong> (Hard
        DC by level).</li><li><strong>Outcome</strong>: Success means they
        <strong>endure the storm</strong> and gain <strong>1 success</strong> in
        the challenge. If they fail, each character <strong>gains 1 level of
        exhaustion</strong>, and until the next setback, each character takes a
        <strong>-2 penalty</strong> on <strong>Perception checks</strong> due to
        the <strong>grit</strong> and <strong>sand</strong> in their
        eyes.</li></ul></li><li><p><strong>Treacherous
        Terrain</strong></p><ul><li><strong>Group Dexterity (Acrobatics)
        Check</strong> (Easy DC by level).</li><li><strong>Outcome</strong>:
        Success means the party <strong>navigates the terrain</strong> and gains
        <strong>1 success</strong> in the challenge. If they fail, each
        character <strong>loses 1 hit die</strong> as the rough ground saps
        their energy. Until the next setback, each character takes a <strong>-2
        penalty</strong> on <strong>Endurance checks</strong> due to the
        <strong>physical strain</strong>.</li></ul></li></ol><hr
        /><h3><strong>Success and Failure
        Outcomes</strong></h3><ul><li><p><strong>Success</strong>: If the
        characters achieve <strong>8 successes</strong> before <strong>3
        failures</strong>, they survive the day and reach a <strong>safe
        location</strong> to rest. If they manage to succeed without any
        failures, they find <strong>scavenged supplies</strong>, gaining
        <strong>1 day’s worth of water</strong> for each party
        member.</p></li><li><p><strong>Failure</strong>: If the characters reach
        <strong>3 failures</strong>, they suffer from the <strong>harsh desert
        conditions</strong>. Each adventurer gains <strong>1 level of
        exhaustion</strong>, and they cannot regain <strong>lost hit
        dice</strong> or <strong>exhaustion levels</strong> until they find
        proper <strong>supplies</strong> or reach <strong>shelter</strong> in
        <strong>Kled</strong>.</p></li></ul>
