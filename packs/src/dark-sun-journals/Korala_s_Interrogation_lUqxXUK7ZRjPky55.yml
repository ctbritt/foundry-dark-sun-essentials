  - sort: 100000
    name: Testimony of Jarek of the Warrens
    type: text
    _id: Q6jmBf6mTN8KYzRX
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: "<img src=\"https://s3.us-east-1.amazonaws.com/rime-of-the-frostmaiden/artwork/dark-sun/testimony.png\" /><p><span style=\"font-family:'Packard Antique Bold'\">TESTIMONY OF JAREK OF THE WARRENS\_</span></p><p><span style=\"font-family:'Packard Antique Bold'\">8th of Wind</span></p><hr /><p><span style=\"font-family:'Packard Antique Bold'\">Former house slave (House Vordon), freed under Liberation Edict\_Current Status:\_Day laborer, Caravan District\_Witnessed:\_2nd of Haze</span></p><p><span style=\"font-family:'Packard Antique Bold'\">Note: Witness was agitated. Spoke rapidly. Transcribed faithfully.</span></p><hr /><p><span style=\"font-family:'Packard Antique Bold'\">They came at night. Three templars, the ones with the black sashes—not the regular city watch. They had a list. Names. They read names and people just... went with them. Didn’t even fight. What could they do?</span></p><p><span style=\"font-family:'Packard Antique Bold'\">I hid under a cart, behind the tanner’s stall. Watched them load maybe sixty people into three wagons. Covered wagons, no markings. The templars told them they were being \"relocated\" to new work assignments in the verdant belt.</span></p><p><span style=\"font-family:'Packard Antique Bold'\">But the wagons went east.\_EAST.\_Toward the desert. Not north to the farms.</span></p><p><span style=\"font-family:'Packard Antique Bold'\">I followed. I don’t know why. I had to know. Two days into the wastes, I saw where they stopped. A place called \"The Furnace\" by the templars. An old ruin. They... they LEFT the people there. Just left them in chains, with water for maybe a day. Then the templars rode back toward Tyr.</span></p><p><span style=\"font-family:'Packard Antique Bold'\">I stayed hidden in the rocks. Watched for another day. Then... then something came. From the east.</span></p><p><span style=\"font-family:'Packard Antique Bold'\">I didn’t see it clearly. Just a shadow against the sun, bigger than anything should be. And fire.\_So much fire.\_The screaming stopped fast.</span></p><p><span style=\"font-family:'Packard Antique Bold'\">I ran. Ran all the way back to Tyr. Told no one. Who would believe me? Who could I tell that wouldn’t hand me over to the same templars? But I remember the names on that list. I remember them all.</span></p><hr /><p><span style=\"font-family:'Packard Antique Bold'\">Agent’s Assessment:\_Witness appears credible. Physical condition consistent with desert exposure. Provided list of 14 names he remembered—cross-referenced with templar arrest records. 11 matches confirmed. These individuals are listed as \"relocated\" or \"deceased—natural causes.\" Witness is in protective custody. — K</span></p>"
