    text:
      format: 1
      content: >-
        <img style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('../modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:100%"
        src="https://s3.us-east-1.amazonaws.com/rime-of-the-frostmaiden/artwork/dark-sun/the_interrogation_1.webp"
        /><h1>🌑 Interrogation Scene: “The Smoke of Truth”</h1><h4>Location:
        Veiled Alliance Safehouse, Warrens, Tyr Time: ~30 minutes after Korala’s
        kidnapping &amp; Tiuk’s death</h4><div class="fvtt narrative"><p>The
        safehouse is a cramped clay-walled room lit by two oil lanterns. Dust,
        incense, and damp stone fill the air. A low stone table sits nearby with
        bindings, a water jug, and cloths used for interrogations.</p><p>Korala
        is tied to a heavy chair—wrists bound, ankles lashed, gag still in
        place. Her robes are torn and dusted from the flight through the
        Warrens. She is battered, frightened, and furious.</p></div><p>When she
        awakens, the tension in the room becomes immediate and explosive: Korala
        knows she is now held by people who can kill her—and that her knowledge
        is fatal if spoken to the wrong ears.</p><hr /><h2>PHASE 1: Waking the
        Snake</h2><p>Korala stirs slowly, then jolts violently as she feels the
        restraints. She tries to hide her terror behind diplomatic
        arrogance.</p><h3>Korala (awakening):</h3><section><div class="fvtt
        narrative"><p>“Where—… who dares… You fools have no idea who you’ve
        taken.”</p></div></section><p>She scans the room, searching for templars
        or familiar agents.</p><h3>If Veiled Alliance members are
        present:</h3><p>Her eyes narrow with cold hatred.</p><section><div
        class="fvtt narrative"><p>“Preserver filth. This is an act of
        war.”</p></div></section><h3>If only the party is present:</h3><p>Her
        voice cracks—real fear showing.</p><section><div class="fvtt
        narrative"><p>“Take off these bindings. Now. Before you doom
        yourselves.”</p></div></section><p>She assumes the party may hand her to
        Tithian. That terrifies her more than anything. She does not suspect
        they know about the slave tithe.</p><hr /><h2>PHASE 2: Initial
        Questions</h2><p>At this stage, Korala refuses to reveal anything
        meaningful. She stonewalls with absolute discipline.</p><h3>Why were you
        hunting preservers?</h3><section><div class="fvtt narrative"><p>“Because
        it is my duty. Chaos must be contained.”</p></div></section><h3>Why were
        you sheltering escaped slaves?</h3><section><div class="fvtt
        narrative"><p>“To stabilize Tyr’s transition. Someone must maintain
        order—your king won’t.”</p></div></section><h3>What do you
        know?</h3><div class="fvtt narrative"><p>Her eyes go
        cold.</p><section><p>“Nothing worth killing
        over.”</p></section></div><p>She is terrified of speaking openly. Saying
        the truth equals death.</p><hr /><h2>PHASE 3: Emotional
        Triggers</h2><p>These triggers “open cracks” in her defenses. Use
        whichever happens first.</p><h3>&gt;Trigger A — Mention Jaxon Cromley’s
        death</h3><div class="fvtt narrative"><p>Korala’s breath
        catches.</p><section><p>“Jaxon…? That mountain of a man… he died for
        me?”</p></section><p>Her composure cracks for a
        moment.</p></div><h3>&gt;Trigger B — Threat of turning her over to
        Tithian</h3><p>Genuine panic.</p><section><div class="fvtt
        narrative"><p>“No. NO. You don’t understand—he’ll kill me before I take
        a breath.”</p></div></section><p>Her terror is
        unmistakable.</p><h3>&gt;Trigger C — Threat of torture</h3><section><div
        class="fvtt narrative"><p>“If I speak, I die. If I stay silent, I die.
        Choose what outcome you want.”</p></div></section><h3>&gt;Trigger D —
        Genuine kindness</h3><p>If a PC shows sympathy:</p><section><div
        class="fvtt narrative"><p>“Why would you help me? After all
        this?”</p></div></section><p>This can open her up more gently.</p><hr
        /><h2>PHASE 4: First Crack in the Armor</h2><p>Once any trigger lands,
        she gives a controlled half-truth:</p><h3>Korala:</h3><section><div
        class="fvtt narrative"><p>“I know things your king wants buried. That is
        all.”</p></div></section><p>If the party presses:</p><section><div
        class="fvtt narrative"><p>“I tracked movements. Wagons with no ledgers.
        Disappearances. Slaves vanishing when Tyr claims they’re free. Tithian
        is lying to you.”</p></div></section><p>She remains terrified of naming
        the “slave tithe.” She will not speak it without being forced.</p><hr
        /><h2>PHASE 5: Name It and She Breaks</h2><p>If any PC asks directly or
        indirectly about the tithe:</p><ul><li>“Is Tithian reinstating the slave
        tithe?”</li><li>“Are slaves being sent to Borys?”</li><li>“Why are
        slaves disappearing?”</li><li>“What tithe?”</li></ul><div class="fvtt
        narrative"><p>Korala freezes. Her face drains of blood.</p><p>Then a
        whisper:</p><section><p>“…Who told you that?”</p></section></div><p>If
        pressed:</p><div class="fvtt narrative"><section><p>“Yes. Yes— damn you.
        He restarted it. Quietly. Secretly. And if he learns I know, he’ll have
        me gutted and left in the sand.”</p></section><p>Her composure fully
        collapses.</p></div><p>She pleads:</p><section><div class="fvtt
        narrative"><p>“Don’t make me speak more. He has eyes everywhere. Voices
        that float. I am not safe. YOU are not safe.”</p></div></section><hr
        /><h2>PHASE 6: The Full Confession</h2><p>Korala reveals everything only
        if:</p><ul><li>The party ensures privacy</li><li>They remove the
        gag</li><li>They give food/water</li><li>They reassure her they won’t
        deliver her to Tithian</li><li>Or they convincingly threaten to hand her
        over</li></ul><h3>Korala:</h3><div class="fvtt narrative"><p>“He is
        feeding people to Borys again. Secret caravans. Hidden lists. Templars
        sworn to silence.</p><p>I traced the ledgers. The movements. The
        witnesses.</p><p>If Tyr knew its ‘freedom’ was paid in slaves, the city
        would erupt.”</p></div><p>Then she outlines Nibenay’s
        plan:</p><section><div class="fvtt narrative"><p>“I came to assess
        Tithian. I found him rotting. If he bends the knee to Nibenay, he
        survives.</p><p>If he refuses… chaos will take him. And Nibenay will
        help your city… find order.”</p></div></section><p>Meaning: Nibenay
        wants Tyr as a puppet city-state.</p><hr /><h2>PHASE 7: Negotiation
        Options</h2><p>Korala tailors her angle to the PCs’ values.</p><h3>If
        they want to bring down Tithian:</h3><div class="fvtt narrative"><p>“I
        can give you names. Dates. Ledgers. Witnesses. Enough to rip the crown
        from his skull.”</p></div><h3>If they want to save
        Tyr:</h3><section><div class="fvtt narrative"><p>“Use me. I can
        destabilize him… carefully.”</p></div></section><h3>If they want to kill
        her:</h3><div class="fvtt narrative"><p>“Do it. But with me dies the
        only truth that can unseat him.”</p></div><h3>If they consider giving
        her to Nibenay:</h3><div class="fvtt narrative"><p>“You will be
        rewarded. And Tyr will be… corrected.”</p></div><h3>If they talk about
        turning her over to Tithian:</h3><p>She begs, terrified:</p><div
        class="fvtt narrative"><p>“No. Not him. Not his voices. Not his
        knives.”</p></div><p>Her terror hints at Sacha &amp; Wyan without naming
        them.</p><hr /><h2>PHASE 8: Outcome Seeds</h2><p>Her capture and
        interrogation set several immediate consequences in motion.</p><h3>1.
        Tithian will know she’s missing within the hour.</h3><p>He
        dispatches:</p><ul><li>6 elite templars</li><li>2 psionic
        trackers</li><li>covert watchers in the Warrens</li></ul><h3>2. Nibenay
        will consider Korala compromised</h3><p>He may:</p><ul><li>send new
        agents</li><li>apply diplomatic pressure</li><li>demand her
        return</li><li>attempt to eliminate her</li><li>or begin covert
        operations in Tyr</li></ul><h3>3. The Veiled Alliance will demand her
        evidence</h3><p>Her ledger knowledge is worth more than gold.</p><h3>4.
        The slaves she protected become targets</h3><p>Tithian must eliminate
        anyone who knows the truth.</p><h3>5. The PCs now control Tyr’s most
        explosive political secret</h3><p>They can topple or manipulate the
        king. They decide Tyr’s fate.</p><hr /><h2>Post-Interrogation Branch
        Options</h2><p>If desired, explore:</p><ul><li>A) Escape-from-safehouse
        chase as Tithian’s forces close in</li><li>B) Sacha &amp; Wyan’s
        off-screen counter-moves</li><li>C) Political upheaval roadmap for
        Tyr</li><li>D) In-world handouts of Korala’s ledgers and witness
        accounts</li></ul>
