      content: "<p>The Environs of Tyr </p><p>      Carrie Slavin</p><p>      sarcasm@bellsouth.net</p><p> ----------------------------</p><p> Guard Tower ( GP ) -   These are 20 feet tall mud-brick round Towers.  Manned by </p><p>4 1st level Templars and one 2nd level Centurion, armed with crossbows, from the </p><p>Bureau of the Fields.</p><p>A;  Miguel's  </p><p>\tKnown only as Miguel's this dive houses people too wild, too seedy to live </p><p>for very long inside the walls of a city.  The owner, Miguel, has a knack for bribing </p><p>Templars.  An extensive black market runs through this joint, and numerous Templars </p><p>profit off of bribes and skimming, so this establishment is allowed to exist.</p><p>B;  Half-Giant Registry Building</p><p>\tAll the half-giants in Tyr have to register with the Bureau of Security.  </p><p>This is simply because of the huge amount of destructive potential half-giants to </p><p>buildings and citizens.  There are 8 1st level Templars, 2 centurions and 1 5th </p><p>level Templar from the Bureau of Security.</p><p>C;  Crabby's</p><p>\tHere is a ramshackle hut made of mummified mekillot hide.  An extremely </p><p>old, old dwarf lives here.  Everyone just calls him Crabby, no one knows what his </p><p>real name is. He eats at The Last Chance and he pays with janitorial work.  It is </p><p>a tradition before a gladiatorial game to ask Crabby if a certain gladiator will </p><p>win the races before entering for the game.  If Crabby doesn't yell \"PISS OFF !\" </p><p>your gladiator is a sure winner.  Since his record is actually rather good and </p><p>several nobles have won several bets because of him, he is allowed to stay.</p><p>D; The Faro Blossom</p><p>\tA cat house of good reputation.  Exclusive and expensive, nobles and high </p><p>templars frequent this establishment for all kind of carnal delights.</p><p>E; An Abandoned Caravan</p><p>\tAn abandoned caravan from House Stel.  Since the war with Urik, Stel has </p><p>had minimal business with Tyr.  Stel is simply arriving at the Caravan Gate, </p><p>purchasing iron from House Vordon and leaving immediately.  No one in Tyr will </p><p>remove it so as to not provoke Urik into any worse relations.  The Council has </p><p>declared it officially Urikian property and is not to be moved.      A lot of </p><p>squatters live within the caravan.</p><p>F; Statue of Kalak</p><p>\tHorribly defiled and vandalized.  The council is voting to remove it.  </p><p>The Templars are resisting.</p><p>G; A sparse tree</p><p>\tNOT a tree of life.  A rare breed of desert tree.  It is fenced and </p><p>maintained by the Bureau of Gardens.  (If anyone has a good story about the </p><p>legend of such a tree, let me know. )</p><p>&gt; Contributed by Teos Abadia: </p><p>&gt; The sparse tree: I would suggest having one story that is the popular</p><p>&gt; myth, such as \"the tree was a favorite of the templar Keldrig, a templar</p><p>&gt; that often defended the poor of the area.  Keldrig's power and influence</p><p>&gt; was sufficient that the tree and its immediate surroundings were a safe</p><p>&gt; haven for those looking for a quiet place to rest or unwind. Keldrig was</p><p>&gt; said to visit the tree often, and when he died he was buried next to it.</p><p>&gt; To this day the people of Tyr, including templars, favor peace while in</p><p>&gt; the vicinity of the tree\".  Then, there could also be a second true</p><p>&gt; story.  Perhaps Keldrig was actually an Earth cleric, working as a spy</p><p>&gt; within the Templar's ranks. Kalak found out about the imposter, and had</p><p>&gt; him quietly poisoned, but not before Keldrig secreted something under the</p><p>&gt; tree...</p><p>&gt;</p><p>I really dig that story and I will implement it in my campaign right</p><p>away. - Carrie.</p><p>H; A Park</p><p>\tMaintained by the Bureau of Gardens,  with the leave of The Bureau </p><p>of Fields.  Provided as a picnic spot for Councilors and High Templars.  </p><p>Guarded by 1 centurion,   4 1st level Templars, and a pair of Half Giants </p><p>around the clock.</p><p>I;  The Last Chance</p><p>\tA reasonable tavern with a false sense of danger.  Popular with Romantic </p><p>Nobles gathering to talk over lunch/ dinner,  write poetry, and try to get laid.  </p><p>Owned by a merchant with Inika named Kelmeth, human.</p><p>J; Half-Giant Registry</p><p>L; Storage Shed</p><p>\tStorage for used and spare animal harnesses, plows and picks and hoes.  </p><p>Usually used and run-down tools, but kept for an emergency.</p><p>M; Outlook Tower</p><p>\tA tall wooden structure to spot the Iron Caravan as soon it is near by </p><p>so they can ready the Grand Gate.</p><p>N; Extra Guard Tower</p><p>\t8-1st level templars and 1 Centurion.</p><p>O; Abandoned Building</p><p>\tFormerly a slave pen.</p><p>P; A Walled Well</p><p>\tUsed for irrigating the fields.  Muls and half-giants crank out water </p><p>night and day.</p><p>Q; An Old Ruin</p><p>\tFormerly a slave pen.  Currently home to 20 squatters who call it Brig's </p><p>place.  It is named after the leader.</p><p>R; Ruin</p><p>\tThis an abandoned siege tower about 200 years old.  Half of the tower was </p><p>turned to stone during the battle and it toppled over. the rest of it has rotted </p><p>away. </p><p>S; The super-duper, super-secret, ultra-hideout, of the Rag Tags</p><p>\tIt is a small cave created by a buried mekillot shell.  Inside are straw </p><p>cots and pillows for the Rag Tags to sleep on.  Also used by the Veiled Alliance </p><p>as part of an underground railroad to smuggle mages and material components in </p><p>and out of Tyr.</p><p>T; Shack</p><p>\tOccupied by a raging old man driven insane by the howling banshee.  He </p><p>lives off his small herd of Baazrags that live nearby his home.</p><p>U; Obilisk</p><p>\tAn old, extremely weather-worn obelisk of ancient design sticking diagonally </p><p>up from the ground.</p><p>V; Ethyl's</p><p>\tA newly opened tavern in an old slave pen. Ethyl is a former slave that spent </p><p>alot of time in these pens and she is following a dream she had while a slave.  All </p><p>her employees are also slaves that were her cubicle mates in slavery that share her </p><p>dream of making a living at an Inn.</p><p>W; A Small Home</p><p>\tHome of the Dentirs.  The Dentirs are the parents of a Mid-level Templar in </p><p>Fields. The family is allowed to stay there because they saved enough money to not </p><p>have to farm anymore.</p><p>X; A Small Home</p><p>\tHousing for a small group of Mid-Level Templars from the Bureau of Fields.</p><p>Y; The First Stop</p><p>\tA dwarven merchant establishment attempting to create a tourist interest in </p><p>Tyr.  Korell, the owner,  allows elves to sell their wares on his property as </p><p>artifacts from Ancient Tyr.  He actually makes most of his money being a general </p><p>store to the farmers and noble servants who don't wish to go all the way onto town.</p><p>Z; Half-Giant Registry</p><p>1; The Imperial</p><p>\tA large hotel/ spa/ whorehouse/ restaurant where visiting nobles can pay out </p><p>of their noses to stay in, or nobles from Tyr can pretend they have slaves again. </p><p>The employees are paid every well and they live in shacks behind the building out of </p><p>view.</p><p>2; Noril's friends</p><p>\tA half buried mekillot shell is home to a human family. Councilor Noril is </p><p>friends with this family and he supports their existence in Council by the </p><p>countless other examples of folk living similarly all along the roads all over the </p><p>Tyr Valley.  Noril argues for the creation of official Tyr suburbs and abolishing </p><p>the law against structures within 250 feet outside the city walls.</p><p>3; Warehouse</p><p>\tFor the Bureau of Fields, currently empty.</p><p>4; Training Headquarters</p><p>\tHere is where the Bureau of Defense trains soldiers for the army and basic </p><p>training of all templar applicants.  Recruits train in weapon proficiency and </p><p>maneuvers.</p><p>5; Rock</p><p>\tA large flat rock concealing an entrance to UnderTyr.  Marklet the Half-Elf </p><p>lives in the entrance way posing as a squatter.  A large curtain behind him conceals </p><p>the way down.</p><p>&gt; Question by Teos: </p><p>&gt; 5; Rock: I'm not sure I follow.  Adventurers would see only a flat rock,</p><p>&gt; or a flat rock with a cave under it? Just wondering if passers-by can see</p><p>&gt; the curtain or not, because that would look very suspicious, and I have</p><p>&gt; to believe a templar would have figured out that the curtain was worth</p><p>&gt; checking.</p><p>&gt;</p><p>Let me describe it this way</p><p>                  TTTTTTTTTTTTTTTTTTTTTTTTT\\    &lt;-- the rock</p><p>  _____________    \\AAAAAAAAAAAAAAAAAAAAAAAA\\____________________</p><p>               \\        \\ ________________</p><p>                \\           curtain --&gt; |  \\</p><p>                  \\                     |   \\</p><p>                   \\   squatter's home  |     \\</p><p>                    ---------------------        \\</p><p>                                         \\        \\</p><p>                       To Under Tyr ---&gt;    \\       \\                </p><p>6; Ranch house</p><p>\tRanch house and stable for government animals.</p><p>7 + 8; Ranch</p><p>\tThe family of Jaeklam have been rasing crodlu for five generations.  </p><p>Their crodlu sell at top price to nobles all over the Tyr Region.  They have </p><p>enough money to bribe templars so they can keep their land.</p><p>\t\t\t\t\t\t\t7 The Stable</p><p>\t\t\t\t\t\t\t8 Ardval Jaeklam's Home</p><p>9; Government Erdlu Fields</p><p>10; A Long Abandoned Fence</p><p>\tThis fence has not been in use for 40 years.  A Banshee maintains this </p><p>fence during the night.  The strange noises coming from this area keep most </p><p>people away.</p>"
