      content: "<p>The Forest Arena of Gulg</p>\n<p>Located deep within the Crescent Forest, the arena at Gulg</p>\n<p>is breathtaking to first-time spectators. Since Athasian</p>\n<p>forests are so rare, the living, growing arenas are beyond the</p>\n<p>imagination of most outsiders. To get to the arena, one must</p>\n<p>travel for almost an hour deep into the forest. The structure</p>\n<p>seems to rise from the forest floor of its own volition. The</p>\n<p>arena structure is intertwined with trees and vines which</p>\n<p>give it the appearance of harmony with its surroundings.</p>\n<p>On gladiatorial days, visitors arrive at the arena via</p>\n<p>\x93Lalali-Puy\x92s Opulent Ascension.\x94 The immaculate</p>\n<p>grassy byway has been cut painstakingly through the forest,</p>\n<p>and links the city to the forest arena. The walkway is</p>\n<p>trimmed and accentuated with the most rare and exotic</p>\n<p>flora and fauna to be found anywhere in the Crescent Forest.</p>\n<p>The soft grass path leads to a great natural archway.</p>\n<p>The archway is the only opening in the extensively cultivated</p>\n<p>brambleweed fence that surrounds the arena.</p>\n<p>The archway opens into the arena, which is partially</p>\n<p>inset in the ground and surrounded by viewing stands rising</p>\n<p>into the sky. Great deciduous trees and hardy vines</p>\n<p>intertangle and interweave to support the structure. It is</p>\n<p>truly a forest masterpiece.</p>\n<p>Along the sides of the arena, four entrances are visible</p>\n<p>amid the trees and vines. The doorways are framed by</p>\n<p>massive wooden planks. Beyond the doors is a large corridor</p>\n<p>20 feet high and 20 feet wide, extending almost completely</p>\n<p>around the building. Spectators are free to sit</p>\n<p>anywhere in the arena, save the templar and sorcerer</p>\n<p>queen\x92s viewing space.</p>\n<p>The Forest Arena of Gulg is unique. It is a long, narrow,</p>\n<p>grassy oval 300 feet long and 80 feet wide. Over 40 rows of</p>\n<p>wooden benches parallel the long, narrow sides of the arena.</p>\n<p>The stadium floor itself lies in a pit 20 feet deep. The</p>\n<p>arena\x92s grassy floor is studded with large trees throughout</p>\n<p>the playing field. The random placement of the trees</p>\n<p>allows gladiators to improvise when stalking opponents.</p>\n<p>No tree or tree limb, however, is within 20 feet of the wall,</p>\n<p>leaving no opportunity for a gladiator to escape from the</p>\n<p>physical arena.</p>\n<p>Vines and mosses grow throughout the trees, enabling</p>\n<p>combatants to climb the trees, swing from tree to tree, or</p>\n<p>use the natural materials to their advantage. Not all of the</p>\n<p>trees are \x93friendly\x94\x97 one is an ancient bramble tree covered</p>\n<p>in myriad sharp thorns. In one legendary combat, an</p>\n<p>incredibly strong arena champion actually removed a</p>\n<p>limb of the tree and used it to his advantage in combat.</p>\n<p>Some of the trees in the arena bear red leaves year</p>\n<p>round. Legend says the blood of the slain gladiators waters</p>\n<p>the trees in arena, yielding the red leaves.</p>\n<p>Malicious destruction of the grass or trees through physical</p>\n<p>combat or defiler magic draws immediate boos and</p>\n<p>hisses from the crowd. If a gladiator who uses such tactics</p>\n<p>survives, he is beaten or tortured before being allowed to</p>\n<p>return to the arena. On a subsequent trip to the arena, such</p>\n<p>offenders are a most certainly pitted against a superior</p>\n<p>opponent. This is punishment for the purposeful destruction</p>\n<p>of the arena during previous gladiatorial combat.</p>\n<p>Arena combat begins when two gladiators or gladiatorial</p>\n<p>teams enter from opposite ends of the arena. Some</p>\n<p>gladiators or teams quickly rush their opponents, while</p>\n<p>others take a defensive posture in the rich foliage. Wilier</p>\n<p>combatants prefer a hide-and-seek approach, using the</p>\n<p>terrain to advantage. They involve the crowd by taunting</p>\n<p>the opponent or a show of bravado, lest the crowd think</p>\n<p>the combatants are cowards and turn against them. The</p>\n<p>crowd in Gulg hates cowardly gladiators who attempt to</p>\n<p>hide in the greenery of the arena.</p>\n<p>The arena grounds are maintained by over 50 slaves</p>\n<p>who toil daily to keep the arena ready for the next games.</p>\n<p>Failure to do one\x92s best is rewarded by appointment as</p>\n<p>quarry for the Red Hunt.</p>\n<p>A lush, green place that thousands may visit is a very rare</p>\n<p>occurrence on the world of Athas. The people of Gulg love</p>\n<p>things that grow, and the Sorcerer-queen tacitly endorses it.</p>\n<p>The more that people work to help the forest around Gulg</p>\n<p>grow, the greater her base for raw power becomes.</p>\n<hr />\n<p>An arboreal game is the favorite in this arena.</p>\n<p>All the action takes place through the trees. Gladiators</p>\n<p>may not touch the ground, on pain of death at the hands</p>\n<p>of the crowd. There are some bramble trees that injure</p>\n<p>and interfere with movement. Winning strategies</p>\n<p>include luring enemies into a copse of</p>\n<hr />\n<p>Famous Gladiator\_</p>\n<ul>\n<li>Beautiful Vanous Veiled, beast trainer Mistress of\_Gulg.</li>\n<li>Nightmare, Blindfighter, Wears a great helm in the shape of the beast. Occasionally attacks with the horns. (Special Notes: Blind-fighting styles and conditions vary in many of the Tablelands\x92 arenas. In Gulg, crowds fall silent to give these gladiators the optimal advantage. Roars and cheers erupt from the crowd as each blow is struck; then they fall silent again.)</li>\n<li>Pauk, Spiderslayer Male halfling gladiator.</li>\n</ul>\n<hr />\n<p><img src=\"data:image/png;base64,\" /></p>"
