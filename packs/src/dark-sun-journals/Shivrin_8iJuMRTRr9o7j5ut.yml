    text:
      format: 1
      content: >-
        <p>Represents the freed slaves on the Council but carries the burden of
        her neighborhood's reputation. Rumored to have ties to the Toothcutters
        criminal gang, she walks the line between legitimate political
        representation and the underground economy that many freed slaves depend
        on for survival. Her position makes her a crucial contact for
        understanding both the political aspirations and practical needs of
        Tyr's largest population group.</p>
