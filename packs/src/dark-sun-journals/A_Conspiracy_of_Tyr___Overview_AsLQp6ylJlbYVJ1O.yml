      content: >-
        <h1>Session Overview</h1><p>Get the party from Kled to Tyr, introduce
        them to the Free City's volatile politics through immediate encounters,
        and provide their first taste of urban intrigue and factional
        tensions.</p><hr /><h2>Part 1: Departure from Kled (30
        minutes)</h2><h3>The Dwarven Send-Off</h3><p>The dwarves of Kled, having
        heard of the heroes' deeds, provide them with:</p><ul><li><strong>Letter
        of Introduction</strong>: From Elder Jorik to "friends in the Free City"
        (actually connects to Rikus)</li><li><strong>Iron Tokens</strong>: Small
        pieces of Kled-forged iron that mark them as
        allies</li><li><strong>Survival Supplies</strong>: Extra water and
        provisions for the 3-day journey</li><li><strong>Warning</strong>: "Tyr
        burns with more than the sun these days. Watch your words, watch your
        backs."</li></ul><h3>The Road South</h3><p><strong>Journey
        Synopsis</strong>: letter-spacing: normal; orphans: auto; text-indent:
        0px; text-transform: none; white-space: normal; widows: auto;
        word-spacing: 0px; -webkit-tap-highlight-color: rgba(26, 26, 26, 0.3);
        -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px;
        text-decoration: none; text-align: start; " &gt; Get the party from Kled
        to Tyr, introduce them to the Free City's volatile politics through
        immediate encounters, and provide their first taste of urban intrigue
        and factional tensions.</p><hr /><h2>Part 2: Encounter with the
        Plantation Patrol (20 minutes)</h2><h3>The Plantation
        Patrol</h3><p><strong>Setup</strong>: As heroes pass a fortified
        plantation, armed guards challenge them.</p><p>text-indent: 0px;
        text-transform: none; white-space: normal; widows: auto; word-spacing:
        0px; -webkit-tap-highlight-color: rgba(26, 26, 26, 0.3);
        -webkit-text-size-adjust: auto; -webkit-text-stroke-width: 0px;
        text-decoration: none; " /&gt;</p><h2><strong>Part 1: Departure from
        Kled (30 minutes)</strong></h2><h3><strong>The Dwarven
        Send-Off</strong></h3><p>The dwarves of Kled, having heard of the
        heroes' deeds, provide them with:</p><ul><li><strong>Letter of
        Introduction</strong>: From Elder Jorik to "friends in the Free City"
        (actually connects to Rikus)</li><li><strong>Iron Tokens</strong>: Small
        pieces of Kled-forged iron that mark them as
        allies</li><li><strong>Survival Supplies</strong>: Extra water and
        provisions for the 3-day journey</li><li><strong>Warning</strong>: "Tyr
        burns with more than the sun these days. Watch your words, watch your
        backs."</li></ul><h3><strong>The Road
        South</strong></h3><p><strong>Journey
        Synopsis</strong>:</p><ul><li><strong>Day 1</strong>: Relatively safe
        travel on established trade routes</li><li><strong>Day 2</strong>: Pass
        abandoned plantation estates, evidence of post-liberation
        disruption</li><li><strong>Day 3</strong>: Final approach to Tyr through
        active plantation-lands</li></ul><h3><strong>Encounter: The Plantation
        Patrol</strong> <em>(EL 14)</em></h3><p><strong>Setup</strong>: As
        heroes pass a fortified plantation, armed guards challenge
        them.</p><blockquote><p><em>"You there! State your business on House
        Beryl lands! These roads aren't safe for wanderers anymore—too many
        runaway slaves and brigands about."</em></p></blockquote><p><strong>The
        Guards</strong>:</p><ul><li>1 Human Noble (using Knight stats)</li><li>4
        Human Guards</li><li>2 Half-Giant
        enforcers</li></ul><p><strong>Political
        Complexity</strong>:</p><ul><li>Guards assume party might be escaped
        slaves</li><li>Mention increased "banditry" since abolition</li><li>Drop
        hints about nobles' resentment: <em>"Things were better when everyone
        knew their place"</em></li></ul><p><strong>Resolution
        Options</strong>:</p><ul><li><strong>Diplomacy</strong>: Iron tokens
        from Kled + successful persuasion gets safe
        passage</li><li><strong>Intimidation</strong>: Show of force makes
        guards reconsider</li><li><strong>Deception</strong>: Claim to be
        merchants seeking work</li><li><strong>Combat</strong>: If initiated,
        creates negative reputation in Tyr</li></ul><hr /><h2><strong>Part 2:
        Approaching the Free City (45 minutes)</strong></h2><h3><strong>First
        Sight of Tyr</strong></h3><blockquote><p><em>The city rises from the
        desert like a tiered mountain of stone and brick. The Golden Tower
        gleams at its heart, while the massive ziggurat looms nearby like a
        sleeping giant. But what strikes you most is the activity—streams of
        people moving along multiple roads, the sound of shouting and
        celebration carrying on the wind, and columns of smoke rising from what
        appears to be... festival fires?</em></p></blockquote><h3><strong>The
        Plantation Periphery</strong></h3><p><strong>Abandoned Estates</strong>:
        Half the plantations show signs of disruption—untended fields, broken
        walls, makeshift camps of squatters.</p><p><strong>Active
        Estates</strong>: Others buzz with activity—hired laborers working under
        armed supervision, evidence of the new "debt-peonage"
        system.</p><p><strong>Encounter: The Refugee Camp</strong>
        <strong>Setup</strong>: A cluster of freed slaves has set up temporary
        shelters near an abandoned plantation.</p><p><strong>Key NPC:
        Thela</strong> <em>(Female Human, former house
        slave)</em></p><ul><li>Eager to share news:&lt; <em>"You haven't heard?
        There's going to be a big rally today! Shivrin's speaking at the stadium
        about workers' rights!"</em></li><li>Warns about templars:&lt; <em>"They
        say they support the free workers, but they've been asking a lot of
        questions about 'troublemakers'"</em></li><li>Information about the
        city:&lt; <em>"Stay away from the Noble District if you look like
        working folk. Head to the Caravan Gate—that's where everyone
        gathers."</em></li></ul><hr /><h2><strong>Part 3: Entering Tyr (60
        minutes)</strong></h2><h3><strong>The Caravan Gate
        Approach</strong></h3><blockquote><p><em>The Caravan Gate bustles with
        controlled chaos. A line of travelers waits for inspection by half-giant
        guards and templar overseers. Vendors hawk everything from water to
        crude weapons. Elven traders spread carpets displaying exotic goods. A
        shrine to elemental fire crackles nearby, tended by a wild-eyed priest
        who proclaims the "cleansing flames of
        freedom!"</em></p></blockquote><h3><strong>Gate Inspection</strong>
        <em>(Social Encounter)</em></h3><p><strong>Templar Overseer
        Jorik</strong> <em>(Male Human, conflicted
        templar)</em></p><ul><li><strong>Attitude</strong>: Tired, overworked,
        trying to balance security with King Tithian's "welcoming"
        policies</li><li><strong>Questions</strong>: Purpose in Tyr? Profession?
        Carrying weapons or magic items?</li><li><strong>Complication</strong>:
        Recognizes the iron tokens from Kled—this could go well or poorly
        depending on party's approach</li></ul><p><strong>Half-Giant
        Guards</strong>: Stoic but alert, more concerned with obvious threats
        than paperwork</p><p><strong>Skill Challenge</strong> <em>(DC
        12-15)</em>:</p><ul><li><strong>Diplomacy</strong>: Mention connections
        to Kled and desire to contribute to the Free
        City</li><li><strong>Deception</strong>: Claim to be merchants or
        craftsmen seeking opportunity</li><li><strong>Intimidation</strong>:
        Display power (risky—might trigger
        combat)</li><li><strong>Insight</strong>: Read the templar's mood—he's
        sympathetic to genuine supporters of
        freedom</li></ul><h3><strong>Immediate City
        Impressions</strong></h3><p>Once through the gate, the party enters&lt;
        <strong>Caravan Way</strong>:</p><blockquote><p><em>The street thrums
        with energy unlike anything you've experienced. Former slaves walk
        proudly upright beside nervous-looking merchants. Newly painted signs
        declare "Free Workers Welcome!" and "Fair Wages Paid Here!" But you also
        notice the shadows—hooded figures watching the crowds, templars with
        hands on sword hilts, and whispered conversations that stop when
        strangers approach.</em></p></blockquote><h3><strong>The Rally</strong>
        <em>(Major Social Encounter)</em></h3><p><strong>Setup</strong>: A crowd
        gathers near the converted arena where <strong>Shivrin</strong>
        <em>(half-elf freed slave leader)</em> speaks about workers'
        rights.</p><p><strong>Shivrin's Speech</strong>
        <em>(excerpt)</em>:</p><blockquote><p><em>"Brothers and sisters of Tyr!
        Ten years ago we broke our chains, but are we truly free? When a noble
        can bind you with debt as surely as iron, are you free? When a templar
        questions your right to walk the streets your labor built, are you
        free?"</em></p></blockquote><p><strong>The Crowd</strong>: Mix of freed
        slaves, sympathetic citizens, and agitators. Energy builds toward...
        something.</p><p><strong>Complication: The Templar Response</strong>
        <strong>Templar Captain Morik</strong> <em>(stern,
        old-school)</em>:</p><ul><li>Arrives with 6 guards to "monitor" the
        gathering</li><li>Tensions escalate when someone in crowd shouts about
        "secret slave raids"</li><li>Situation poised to turn
        violent</li></ul><p><strong>Party
        Choices</strong>:</p><ol><li><strong>Support the Rally</strong>: Join
        the crowd, potentially earning freed slave faction
        support</li><li><strong>Mediate</strong>: Try to calm both sides
        (difficult but rewarding)</li><li><strong>Support Order</strong>: Side
        with templars (gains templar approval, loses crowd
        support)</li><li><strong>Stay Neutral</strong>: Observe and gather
        information without commitment</li></ol><h3><strong>The
        Incident</strong></h3><p><strong>Trigger</strong>: Regardless of party
        choice, a <strong>young provocateur</strong> <em>(actually an agent
        working to destabilize Tyr)</em> throws a stone at the
        templars.</p><p><strong>Escalation</strong>:</p><ul><li>Templars draw
        weapons</li><li>Crowd surges forward</li><li><p><strong>Opportunity for
        party to act</strong>:</p><ul><li>Subdue the provocateur (reveals hidden
        weapons, suspicious items)</li><li>Protect civilians from templar
        overreaction</li><li>Use magic to prevent violence (risky—reveals
        magical abilities)</li></ul></li></ul><p><strong>Resolution</strong>:
        How party acts establishes their reputation with different
        factions.</p><hr /><h2><strong>Part 4: First Night in the Free City (45
        minutes)</strong></h2><h3><strong>Finding Lodging</strong></h3><p>Based
        on party's actions and resources:</p><p><strong>The Golden Inix
        Inn</strong> <em>(Mid-range, Caravan
        Way)</em></p><ul><li><strong>Proprietor</strong>: Mila Risani
        <em>(female human psionicist)</em></li><li>Safe, central
        location</li><li>Good for overhearing rumors and making
        contacts</li><li><em>Mila immediately scans the party with
        psionics—detects any concealed magic or unusual mental
        patterns</em></li></ul><p><strong>The Drunken Giant</strong>
        <em>(Lower-end, Shadow Square)</em></p><ul><li>Rumored Veiled Alliance
        connections</li><li>Cheaper but more dangerous</li><li>Better access to
        underground information</li></ul><h3><strong>Evening Encounters</strong>
        <em>(Choose 1-2)</em></h3><h4><strong>Option A: The Merchant's
        Offer</strong></h4><p><strong>Davith Vordon</strong> <em>(or his
        agent)</em> approaches party about "security work"</p><ul><li>Vague but
        well-paying job</li><li>Chance to learn about iron mine
        situation</li><li>Introduction to merchant house
        politics</li></ul><h4><strong>Option B: Veiled Alliance
        Contact</strong></h4><p><strong>Mysterious Figure</strong> approaches
        party member who used magic</p><ul><li>Warning about templars who "hunt
        spellcasters like hounds"</li><li>Cryptic offer of "protection and
        guidance"</li><li>Sets up future Alliance
        involvement</li></ul><h4><strong>Option C: Noble House
        Invitation</strong></h4><p><strong>House Representative</strong> invites
        heroes to meet with a noble about "opportunities for skilled
        individuals"</p><ul><li>Chance to see noble
        district</li><li>Introduction to aristocratic
        perspective</li><li>Potential involvement in noble factional
        disputes</li></ul><h3><strong>Session Ending: The Late Night
        Revelation</strong></h3><p><strong>Setup</strong>: While party rests,
        they're awakened by commotion in the street.</p><p><strong>The
        Scene</strong>:</p><ul><li>Tyrian Guard units moving through
        streets</li><li>Hushed conversations about "someone important is
        missing"</li><li>Rumors spread:&lt; <em>"They say Agis of Asticles
        hasn't been seen in days"</em></li><li><em>"The Council met in emergency
        session tonight"</em></li><li><em>"Something's happening at the Golden
        Tower"</em></li></ul><p><strong>The Hook</strong>: Tomorrow, the party
        will have choices to make about which faction to support and what role
        to play in Tyr's unfolding crisis.</p><hr /><h2><strong>Faction
        Reputation Tracking</strong></h2><p>Based on session choices, track
        party standing with:</p><h3><strong>Freed
        Slaves/Revolutionaries</strong></h3><ul><li>+1 for supporting
        rally</li><li>+1 for protecting civilians</li><li>-1 for siding with
        templars</li></ul><h3><strong>Templars/Tithian's
        Regime</strong></h3><ul><li>+1 for helping maintain order</li><li>+1 for
        showing respect at gate</li><li>-1 for encouraging
        unrest</li></ul><h3><strong>Nobles</strong></h3><ul><li>+1 for
        respecting property rights at plantation</li><li>+1 for displaying
        wealth/status</li><li>-1 for supporting
        "rabble"</li></ul><h3><strong>Merchants</strong></h3><ul><li>+1 for
        expressing business interests</li><li>+1 for practical
        problem-solving</li><li>No penalty for factional
        choices</li></ul><h3><strong>Veiled Alliance</strong></h3><ul><li>+1 for
        using magic helpfully</li><li>+1 for showing opposition to
        tyranny</li><li>-1 for cooperating with templars</li></ul><hr
        /><h2><strong>Information Gathered</strong></h2><p>By session end, party
        should know:</p><ul><li>Tyr is politically unstable with multiple
        competing factions</li><li>King Tithian rules but his authority is
        challenged</li><li>Slavery's abolition created economic and social
        upheaval</li><li>Something is happening with important political figures
        disappearing</li><li>Magic users face particular scrutiny and
        danger</li><li>The city offers both opportunities and significant
        risks</li></ul><h2><strong>Next Session
        Hooks</strong></h2><ul><li>Missing Agis investigation</li><li>Faction
        recruitment offers</li><li>Merchant house job
        opportunities</li><li>Underground contacts</li><li>Noble house
        intrigue</li><li>Templar suspicions about party's
        abilities</li></ul><p>This session establishes Tyr's volatile political
        landscape while giving heroes agency in how they want to engage with the
        Free City's complex factional struggles.</p>
