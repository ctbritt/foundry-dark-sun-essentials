        style="font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap">Salt
        View is a slave tribe village located on the eastern face of the
        Mekillot Mountains. Like most slave villages, it is a boisterous, unruly
        place filled with ex-slaves of all races, yet it is also known for its
        fine theater. The former slaves of Salt View have recently begun to
        supplement their normal means of making a living (raiding caravans bound
        for Gulg or Nibenay) by sending out acting troupes to put on shows for
        wealthy merchants (they will have nothing to do with nobles). Salt
        View's leader is an exgladiator mul named Xaynon.</span></p>
