    text:
      format: 1
      content: "<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;white-space:pre-wrap;padding-left:0px\">Although the citizens of Tyr now have greater influence in government matters than they did under Kalak, they do not have the right to stand before the king or the council of templars. Usually, citizens who have concerns attempt to meet with a templar out of chambers and convince him or her to take up the issue with the full body of advisors.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Individuals can be invited to a meeting as guests of the templars, especially if a person or a group has been instrumental in solving a problem in the city-state. The templars might invite a group of proven player characters to a meeting and ask them to perform a service that will aid Tyr, such as:</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">✦ Spying on a nearby ruin, trade outpost, or city-state.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">✦ Infiltrating a Tyrian secret society.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">✦ Mapping a newly uncovered portion of Under-Tyr.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">✦ Eradicating the True.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">✦ Exposing the headquarters of a rogue Veiled Alliance faction.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">✦ Investigating illicit slaving in the area.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px;white-space:pre-wrap;padding-left:0px\">✦ Accompanying an embassy to the Forest Ridge.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px;white-space:pre-wrap;padding-left:0px\">\_</p>"
