      content: "<p>At the foot of the\_Smoking Crown lies a strange wonderland of odd\_rock formations, boiling pools, and bubbling mud,\_eventually giving way to a steaming lake several miles\_wide. The Lake of Golden Dreams is the most visited\_location in this area, for the vapors rising from the\_scalding water are said to grant visions. Mystics, seers,\_and lunatics make their homes along the lake’s shore,\_rotting their minds by sampling the unhealthy mists.</p>\n<p>In addition, the lake might conceal a submerged\_city. Where the blistering water is not too deep or\_cloudy, one can see remnants of old walls on the\_bottom, with dark cave mouths leading deeper into\_the earth.</p>\n<p>\_</p>\n<p>GOLDEN DREAMS</p>\n<p>Those who inhale the steam of the Lake of Golden\_Dreams experience visions. Many are meaningless hallucinations, but enough true visions are had to lend\_credence to the tales about the lake. Any living character\_who spends an hour on the shores can spend two Hit dice to take in the vapors. The character then makes\_a DC 20 Arcana check or History check. A successful\_check grants the character a piece of information about\_the past. Alternatively, at the Dungeon Master’s discretion, the character can glimpse a future event\_instead—perhaps a person who will cross paths with the\_party, a location the adventurers will one day explore,\_or some other portent. A character can receive only one\_vision per day, and consecutive uses on subsequent days\_cost one additional Hit Dice.\_</p>\n<p>Hit dice spent at\_the Lake of Golden Dreams to experience visions do not\_return until the character takes a long rest at least four miles away from the lake.</p>"
