      content: >-
        <div class="CjVfdc"
        style="box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative"><span
        style="box-sizing:border-box;font-family:Lato"><span
        style="font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box">High
        Bureaus</span></span>:</div>

        <h2 id="h.1daf0zntbvrz_l" class="CDt4Ke zfr3Q JYVBee" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato,
        sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap"
        tabindex="-1"></h2>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Each
        of these buildings houses one of Tyr's governmental bureaus. Templars
        staff the offices from dawn until sundown to conduct government
        business. The High Bureaus include the bureaus of: Mines, Trade, Fields,
        Security, Defense, the Arena, the Gardens, Administration, State,
        Finance, and Water.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Regardless
        of the function involved, the process for dealing with the templars of
        any bureau is much the same. The first officials encountered are on the
        ground floor of the building. These lower-level templars (1st to
        4th-level) attend to routine duties, screen inquiries, and determine to
        whom a petitioner should be referred to for resolution of his request.
        Often, a bribe to one of the junior templars can expedite one's
        processing greatly. Otherwise, it can sometimes take days or weeks to
        gain an audience with one of the more highly placed templars. A bureau
        guard, usually a half-giant, stands by ready to assist the templars if
        necessary. This scene repeats itself as you ascend floors in the
        building and levels of authority among the templar functionaries. To
        gain an appointment with the ranking templar of a given bureau may
        require a character to run a gantlet of lesser officials and outlay
        increasingly costly bribes. As such, most citizens avoid the High
        Bureaus unless it is absolutely necessary.</p>
