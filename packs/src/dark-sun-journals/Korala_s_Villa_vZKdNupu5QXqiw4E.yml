pages:
  - sort: 0
    name: Korala's Study
    type: text
    _id: NzMetAIMKYtB5a0r
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <div class="fvtt narrative"><p>Spread across the polished obsidian desk
        is a large vellum map, its edges weighted down with small jade
        paperweights. The yellowed parchment shows Tyr and the surrounding
        tablelands in meticulous detail - each village, each well, each known
        road carefully inked in fading brown lines.</p><p>What catches your eye
        immediately are the red dots - perhaps two dozen of them - scattered
        across various locations both within Tyr's walls and at settlements
        throughout the surrounding areas. Each crimson mark is annotated with a
        date: "3rd of Silt" near the Artisan Quarter, "17th of Bloom" at a
        village called Breakstone, "9th of Morrow" by the abandoned
        mines.</p><p>Beside each red dot, someone has written numbers in a
        precise hand: "12" at one location, "8" at another, "15," "6," "20" -
        they vary, but most fall between 5 and 30.</p></div><hr /><p>The map
        appears to be a caravan master's working document - you can see the
        major trade routes marked clearly, and the red dots align with known
        stops along these paths. The numbers could easily be guard requirements
        or expected merchant tallies.</p><p>Yet as you trace the routes with
        your finger, something feels... incomplete. The paths are marked heading
        out from each red dot toward the deep desert, but there are no return
        routes drawn. No merchant would send caravans one way. The ink simply...
        stops, as if the caravans vanish into the wasteland.</p><p><strong>[If
        someone specifically examines the dates - </strong>[[/check int dc=12
        format=long]]<strong>]:</strong> <em>"The dates follow a pattern -
        they're spaced exactly 77 days apart at each location, rotating through
        different districts and villages."</em></p><p><strong>[If someone asks
        about the direction of the routes - </strong>[[/check sur dc=15
        format=long]]<strong>]:</strong> <em>"All the incomplete routes head in
        the same general direction - toward the Screaming Ravine, though they
        stop long before reaching it."</em></p>
