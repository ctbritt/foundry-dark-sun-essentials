  - sort: 200000
    name: Bedchamber
    type: text
    _id: ZaKXCNuhZTFXkZ6o
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <div class="fvtt narrative"><p>The templar-wife's private chambers
        assault your senses with calculated opulence. Heavy silks in deep
        purples and midnight blues drape from the ceiling, creating a tent-like
        canopy that transforms the stone room into an intimate desert pavilion.
        The air hangs thick with incense - black lotus and devil's claw -
        expensive scents that mask something underneath, perhaps the acrid tang
        of defiling magic.</p><p class="whitespace-normal break-words">The bed
        dominates the eastern wall, a massive construction of polished giant's
        bone and black ironwood, its posts carved with serpents that seem to
        writhe in the flickering lamplight. Silk pillows in jewel tones are
        piled decadently high, and the coverlet appears to be made from the
        iridescent scales of some enormous desert creature.</p><p
        class="whitespace-normal break-words">A vanity of volcanic glass
        reflects the room in dark, distorted fragments. Its surface holds an
        array of crystal vials, each containing oils and perfumes worth more
        than a commoner's yearly earnings. A silver-backed hairbrush lies beside
        a hand mirror, both bearing Nibenay's shadow sigil worked into their
        design.</p><p class="whitespace-normal break-words">Against the west
        wall stands a massive wardrobe of dark agafari wood, its doors slightly
        ajar to reveal robes of state in rich crimsons and blacks. Beside it, a
        smaller chest bound in iron squats like a guardian beast.</p><p
        class="whitespace-normal break-words">What draws your attention, though,
        is the western wall - it's covered entirely by a massive tapestry
        depicting the Dragon accepting tribute from kneeling city-states. The
        weaving is exquisite, disturbing in its detail. The Dragon's eyes seem
        to follow you, and in the tribute line, you can make out tiny figures
        being herded forward among the traditional offerings of metal and
        gems.</p></div><hr /><h2><strong>The Ledger's Hiding
        Place</strong></h2><p><strong>Behind the Tapestry - FALSE</strong> The
        tapestry seems like an obvious hiding spot, but pulling it aside reveals
        only blank wall. However...</p><p><strong>The TRUE Location - The
        Vanity's Secret:</strong></p><p><em>The vanity's glass surface isn't
        just a mirror - it's a clever magical concealment. When someone
        approaches it normally, they see their reflection.
        But:</em></p><p><strong>Discovery Method (requires one of the
        following):</strong></p><ul><li><strong>DC 16 Investigation
        check</strong> while examining the vanity closely</li><li><strong>Detect
        Magic</strong> reveals illusion magic on the
        mirror</li><li><strong>Accidentally placing something on the
        mirror</strong> - objects don't rest on top but sink slightly into the
        "glass"</li><li><strong>The hairbrush is the key</strong> - pressing the
        shadow sigil on its back while it's placed on a specific
        spot</li></ul><p><strong>When discovered:</strong> <em>The mirror's
        surface ripples like water, then becomes transparent, revealing a
        shallow compartment beneath what you thought was solid glass. Inside,
        wrapped in black silk to prevent any telltale rectangular outline, lies
        the ledger. Also in the compartment: a vial of what looks like poison, a
        small bag of gems (emergency funds), and a sealed letter addressed to
        "My Shadow Lord" - presumably Nibenay
        himself.</em></p><p><strong>Additional
        Security:</strong></p><ul><li><strong>Magical Trap</strong>: Opening the
        compartment without speaking the command word ("Shadow's Truth" in
        Nibenese) triggers a <em>Magic Mouth</em> that screams an
        alarm</li><li><strong>Physical Tell</strong>: Fine powder dusted on the
        ledger will reveal if it's been
        disturbed</li><li><strong>Decoy</strong>: A false ledger in the iron
        chest by the wardrobe contains household accounts</li></ul>
