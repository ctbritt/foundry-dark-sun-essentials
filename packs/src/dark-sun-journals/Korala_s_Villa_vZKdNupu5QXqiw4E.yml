        Dragon's portion" or "the levy"</li><li class="whitespace-normal
        break-words"><strong>Names and dates</strong> of 42 missing
        persons</li><li class="whitespace-normal break-words"><strong>Blood
        thumbprints</strong> as signatures (illiterate witnesses)</li><li
        class="whitespace-normal break-words">Korala's magical authentication
        seal on each</li></ul><h3 class="text-lg font-bold text-text-100 mt-1
        -mb-1.5"></h3>
