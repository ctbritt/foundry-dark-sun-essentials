      content: >-
        <div class="CjVfdc"
        style="box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative">The
        Tower Bridge</div>

        <h2 id="h.u4fdhaoalo5k_l" class="CDt4Ke zfr3Q JYVBee" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato,
        sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap"
        tabindex="-1"></h2>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap">Spanning the King's
        Garden, the Tower Bridge extends 75 feet to the Golden Tower. The bridge
        is 10 feet in width, and the sides are protected by a waist high
        railing. Four lesser air elementals (6HD each) are bound to the bridge
        by ancient magics. The elementals were commanded to let only those in
        the raiment of templars and people accompanying them to pass freely. All
        others are attacked. The elementals combine their attacks to hurl
        intruders off the bridge.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;padding-bottom:0px;white-space:pre-wrap">The
        elementals will pair up against intruders making a shove attack with
        advantage (Athletics +5) Characters falling from the bridge will sustain
        7d6 points of damage.</p>
