      content: "<p>While his tribe conducts raids or ambushes membes of the other Bandit States, The leader of Spoil, Densis travels north\_to the ruins of the Buried City. He has been exploring\_the site for almost three years, and each time he returns\_to\_ Spoil he has a bit more power at his command.\_</p>\n<p>Few of his followers will accompany him to the ruins, for they believe that the place is haunted by terrible spirits and undead creatures. The fact that Densis\_regularly communes with these beings makes him more\_important in their eyes-and that much more frightening.</p>"
