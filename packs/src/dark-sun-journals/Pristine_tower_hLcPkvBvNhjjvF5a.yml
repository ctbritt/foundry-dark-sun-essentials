    text:
      format: 1
      content: "<p>Pristine Tower: Standing alone in the heart of\_the Beastbarrens, the Pristine Tower is an astonish\_ingly old relic of ages past. Only the sorcerer-kings\_and precious few other Athasians realize its true\_history. Most people know only that the tower is a\_structure of pure alabaster stone rising out of the\_desert that\_ has somehow resisted being swallowed by\_the sand. Sages and experienced travelers also know\_not to approach the Pristine Tower, for it is guarded\_still, and a gruesome fate befalls those who come\_too close. Worse yet, creatures that sustain physical\_wounds within a few miles of the tower fall prey to\_the\_ transformative plague that fills the Beastbarrens\_with loathsome monstrosities.</p>"
