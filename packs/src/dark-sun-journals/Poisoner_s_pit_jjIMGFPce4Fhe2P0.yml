      content: "<p>Esreva's Journal</p>\n<p>\_</p>\n<p>The single most frightening experience that I endured while in the service of my master had to be our journey to the poisoner Wheelock. My master had been assigned the mission of retrieving an antidote for a poison that had begun to appear on weapons of mercenaries from Nibenay. If the Shadow King was playing with poison, our oba planned to be prepared. While she gives many of the templars the power to make a poisoned man well again, it is helpful if the young hunters do not have to fear such attacks.</p>\n<p>When the other slaves heard that I was to travel with my master in search of the poisoner Wheelock, many shook their heads and said goodbye to me as if it were our last farewell. Some of the slaves claimed that Wheelock was a man so riddled with poison that he walked on the threshold between life and death. They claimed that he was an undead ghoul of extraordinary cunning who always got the better end of any bargain, and that those who conducted business with him often wound up dead.</p>\n<p>Our journey took us across the most remote reaches of the southern end of the Great Ivory Plain. We found an earthen mound with a tall pole rising from it. Crowning the pole we saw a human skull with the jaw knotted shut with leather thongs. Climbing the mound allowed us to see another such pole at the limits of our vision. We fol lowed this trail to a small stone portal next to brackish pond. The doorway led down beneath the earth into the darkness.</p>\n<p>\_</p>\n<p>I wis there that we met Wheelock, While I cannot say whether the man is living or dead, the stories are true that he seems to tread the border between the two. He wore a thick black robe that seemed to swallow his diminutive frame. The skin of his bald head and arms were wrapped with leather thongs-a few of which were knotted to tiny bells. They created a decorative lattice of Thin lines across his skull. His complexion was chalky white and his lips had a bluish tint. His eyes were dull and milky and seemed unable to focus on anything. He sat with his head tilted to one side, almost as if he were listening to something, even when no one was talking.</p>\n<p>\_</p>\n<p>He rarely responded to my master directly, but waited instead for his young assistant to repeat the question to him. He would then answer slowly in a weak and gentle voice. When my master showed him one of the poisoned daggers which he had brought with him, the decrepit creature ran the blade along his lizardlike tongue. He paused a moment as if listening again, and then identi fred all of the components of the poison. It was, he told us, extremely lethal.</p>\n<p>\_</p>\n<p>Wheelock's young assistant provided my master with a small box containing a powder, that when adminis tered properly would negate the effects of the poison. He then extended an invitation for us to spend the night in the shelter of their home. My master paid the young man for the package, thanked him, and we left. I believe that he was as glad as I to quit that place</p>\n<p>\_</p>\n<p>Wheelock is, perhaps, the greatest poisoner of the Table lands. He makes his home at the oasis 35 miles northeast of North Ledopolus, on the edge of the Great Ivory Plain. He usually remains at home, but he does make occasional excursions to collect new strains of poisonous plants. Whenever he travels abroad, he always makes the journey in a brightly colored wagon drawn by six muls. The wagon has small curtained windows and an sloping roof.</p>\n<p>\_</p>\n<p>When at home, audiences are received by his assistant Toth, who is a cleric of the earth. Toth is a simple and polite young man who conducts Wheelock's business affairs and determines who will gain access to the poisoner. True to the chilling neutrality of Athasian bard, Wheelock does not discriminate among his clientele in terms the merit of their various causes. He does evaluate clients in terms of urgency and sheer desperation. He may at times end up selling one man a poison and his intended victim the antidote,</p>\n<p>\_</p>\n<p>He has little use for gold, but he will charge exorbitant fees just to measure the desperation of an individual. Other times he will require a service be completed before provid ing a poison. He usually demands whatever the client has less of, whether it be time or money Sometimes, if he takes a fancy to a person or dilemma, he will provide his services for free or for a small gift</p>\n<p>\_</p>\n<p>Wheelock always interprets people's requests literally this sometimes ends up killing them.</p>\n<p>\_</p>\n<p>Wheelock</p>\n<p>Male Human Bard, Neutral</p>\n<p>Armor Class 8 Cheavy robe)</p>\n<p>Movement</p>\n<p>Level 16</p>\n<p>Hit Points 92</p>\n<p>THACO 13</p>\n<p>No. of Attacks 1</p>\n<p>Str 17\_Dex 12 Con 20\_Int 19\_Wis 12\_Cha 15</p>\n<p>Damage/Attack: 1d6+1 (wrist razor with Type E poison,\_save at-4)</p>\n<p>Psionic Summary: Wheelock can no longer use his wild talent. (See below for psionic immunities.)</p>\n<p>Wheelock has over the years, consumed so much poison that he is now completely immune to its effect. He can identify any poison by taste. There is an 70% chance that he can recreate any poison in his laboratory and an equal chance that he can create an antidote. In circumstances where he does not have the materials for such a task, he will be able to identify the components he requires. If the materials he requests are brought to him, he will be able to produce the desired poison or antidote. This can some times involve extraordinary journeys to find the unusual items that he requires.</p>\n<p>Due to the deterioration of his nervous system, Wheelock only takes half damage from any physical attack. A Neutralise poison or slow poison spell will put him into a system shock and leave him unconscious for 2d12 davs. Another peculiar side effect of his neurological damage</p>\n<p>is his complete immunity to telepathy Wheelock can neither be contacted nor attacked telepathically This protects the poisoner from adversaries, but it also requires friends to actually travel to see him if they need to communicate.</p>\n<p>It is not clear how old Wheelock is, but the poison coursing through his veins seem to be contributed to his longevity</p>\n<p>Wheelock has a number of odd idiosyncrasies. He will not, for example, directly respond to questions. He will instead wait until Toth, his companion, repeats the question to him. This is because Wheelock hears voices. It is not dear whether this is some sort of psionic residue, voices from the lower planes, or simply the result of his deteriorating nervous system. He has, however, become so used to the constant whispering, that he ignores anyone who speaks to him. He makes an exception to the habit in the case of females. Wheelock seems to have a gentle fondness for women, although he does not always seem to be able to distinguish between them. He will often seem to become lucid and begin to pepper a woman with questions just to listen to her voice. It seems to remind him of someone\_</p>\n<p>The poisoner has an insatiable appetite for riddles. His lair is often protected by riddles and he enjoys playing mental games. He has been known to forgo payment for his services when a client petitions him with a challenging riddle. He has also wived fees when particularly impressed with an individual's ability to solve puzzle.</p>\n<p>\_</p>\n<p>Toth</p>\n<p>Male Human Cleric of Farth, Neutral Good</p>\n<p>Armor Class 6 Chide armor)</p>\n<p>Movement 12</p>\n<p>Level 8 Hit Points 31</p>\n<p>THACO 16 No. of Attacks</p>\n<p>Str 14 Dex 12\_Con 13 Int 14\_Wis 17\_Cha 12</p>\n<p>Damage AttackIds I obsidion bastard sword)</p>\n<p>Psionic Summary PSP. 40: Wild Talent-dimensional door (PS Con- Corn 4+2/round)</p>\n<p>Spells: Create water, detect poison, purify food and drink Cnd) charm person, hold person, know alien man (Srd) call light meld into one prayer (11) non Spelly above Srd level must be from the sphere of enr There are no Ath level spells from the sphen</p>\n<p>\_</p>\n<p>Toth in Wheelock's personal assistant He is deeply devoto to the personer and har taken care of him as the year of direct exposure to poison have reduced Wheelock Bile to take care of himal To his land marted und nenju mental by nature. He has a gentle demeanor He is scrupu lously honest in business and extremely protective of Wheelock. He enjoys comparty, but he is not a very talkative young man</p>\n<p>Toth grew up in the village of Haddres, at the nearby osis. His father was ari herbalist and farmer who gre variety of odd plants for Wheelock. The boy met the poor sorer one day while running an errand for his father. He had dropped off small bundles outside the poisonous lait many times and had never caught sight of its inhabitant</p>\n<p>This day, the sun a frail figure collapsed on the ground, bleeding. The young boy drew upon the power of the auth to mend the man's wound and carried him inside to recovice Wheelock had actually inflicted the wound himself in an effort to measure the extent of his worsening neurological demage. The boy found the poisoner's quartets in disarmy He straightened up the rooms as he used the strange man back to health. While he went through the poisoner's effects, he uncovered some information that shed light on his patient's bizarre condition. Whatever he discovered there, together with his conversations with the hallucid</p>\n<p>man, led him to feel that Wheelock needed him. After the poisoner recovered. Toth continued to visit him whenever he had the chance. He spent long after moon pie</p>\n<p>ding over one of the bard's riddles for listening to fascinat ing stories about the peculiar weapons that hung on the wall</p>\n<p>Toth eventually moved to North Ledopolus to continue his clerical studies. It was there that he met and married his wife Janelle, a barmaid. The marriage wus difficult for Tech as his wife had a tendency to take an interest in travelers who passed through the inn where the worked. Several Years</p>\n<p>bofere Totk's father died and he returned home tu ate of the arrangements. He stooped to visit When k and found the poisoner's condition had worsened The yeung cleric resolved to stay with his old friend and sent entro is wife in North Ledopolus. Toth now sounds money to the dwarven villote where Junelle still loves, emoji: mg the company of the</p>\n<p>\_</p>\n<p>The Poisoner's Pit Map.</p>\n<p>1) Entrance. This entryway it all Ofpot square room sur rounded by 5fbor thick stone walls. Oubide the etitinnceis small pond tainted with slow acting poison (trent u Type e d, 2-19 hours Strength 20/10) The absence of nlpae and the boner of animals on the floor of the pool - deter travelers from drinking from it. The entryway in lly blocked with an enormous stone slab. Wheelock sometimes has the door warded with a riddle</p>\n<p>2) Stairway. This stairway descends 40 feet below the turface of the salt flats. The walls are marked by small noola very 5 feet on either side of the stairs. Resting in each is humanoid tell what har had the cdff e. noel Thesalle e old ih lampil tha film\_nte the air</p>\n<p>3) The Wyvern'. Gate. The wer d e ich hren hallthatapens into dis chmher In he ficking firelight, witere can dance and insubstantial kar li ents te tak hs form of a lange lmnl vita long neck bat wings, and mon's tail Thi pte he by Teeth with a wet watch vpell leveled</p>\n<p>4) The Receving Room. An emate woderceak with prout and jevelencruted pobletam in the em. Witten on the wall in the commen tesdelengug iaieg \"Pleese drink from the barrel Or cocaine lowing per on. The antidote will be monded upon the componen of business. Unfortunately be reading and writing illegal in the city sTates, usually only formplas, merchant and bands pet paT this down. The will not open ireland visiter drinks</p>\n<p>5) Sitting Room. This is a large room with decorative tapestries hung in the doors and proud acion the looe A bench lines the walls, and marợ large pillows ar strewn about in a manner of a wealthy nomad merchwnt's tent. There are several name boards with stones in the room as well as ia dizzying array of omamental wonpon on the walls. There are also a variety of stringed instruments fashioned out of gourds.</p>\n<p>6) Wheelock's Chair This is holl thick with smoke from incense, At the end of the corridor two thick black curtains are drown to the side, Kporinig a heavy wooden chair that sits ona dais Wheolock receives his visitors in this chair. Toth must often bind the poisoner upright in the seat, to spare his master from losing his balance in a seizure.</p>\n<p>7) The Laboratory. This room is full of small pottery jars containing various powders and ointments. A lante brazier in the center of the room burns constantly. A chimney rises from the ceiling to the surface, where it looks like a gigantic ant hill\_Visitors are not permitted in this room. There is a 70% chance that someone sneaking in this room will acciden tally touch something conted with contact poison. There is a well in this room which Toth created by locating an under ground spring. The spring feeds the small pool by the entrance to the compound. It carries the waste from White lock's work up to the surface.</p>\n<p>8) Kitchen. This room is where Toth prepares meals. There is a small vent lending into the chimney from the lab oratory. There is a well in this room that draws clean water from the same spring that foods the well in Wheelock's lab oratory. There is also a large wooden cask that Toth uses for\_bathing.</p>\n<p>9) Storeroom. This room contains various dry goods and\_miscellaneous supplies.</p>\n<p>10) Wheelock's Chamber. The poisoner sleeps on n\_largo bed with a delicately wrought canopy draped from the\_ceiling</p>\n<p>11) Library. The walls of this room are lined with small cubbyholes carved in the stone. Paper and leather serolls are tucked in each compartment. A large ble in the center of the room is covered with clay tablets that have various\_inscriptions on them.</p>\n<p>12) Toth's Chumber, Toth's toom has a simple bed and\_an oil lamp.</p>\n<p>13) Temple of the Earth. This small chamber is simply ari alcove of exposed earth that Toth uses for votive cete monies.</p>\n<p>\_</p>\n<p><img src=\"data:image/png;base64,\" /></p>"
