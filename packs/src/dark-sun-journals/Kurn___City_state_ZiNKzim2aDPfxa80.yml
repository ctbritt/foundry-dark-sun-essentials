      content: "<p>Kurn is actually two city-states: an ancient, public metropolis, and a utopian city\_hidden from the rest of the world.</p>\n<p>\_</p>\n<p>Old Kurn sits in a lush meadow on the eastern\_side of the White Mountains. The trade road running north out of Draj connects\_Kurn to the Tyr Region, and the city welcomes merchants from the south.</p>\n<p>\_</p>\n<p>New\_Kurn lies in a fertile valley hidden among the White Mountains themselves. A\_secluded road protected by a towering fortress keeps the valley safe from\_unwanted visitors-and New Kurn doesn’t want any visitors.</p>\n<p>\_</p>\n<p>Old Kurn was a prosperous but relatively small city from the Green Age that\_suffered great devastation in the early days of the Cleansing Wars. Once situated in\_a vast forest that has long since faded from the landscape, the elf city of Kurn was\_destroyed by the Champion called Albeorn, Slayer of Elves. When the Champions\_finally turned against Rajaat and became the dragon kings, the one named Keltis\_decided to build his city-state on the ruins of Old Kurn. He changed his name to\_Oronis, but decided to retain the name of the city he was building over.</p>\n<p>The ruins weren’t in as bad a shape as Oronis originally thought. He was able\_to build upon many of the foundations, and a few whole structures were still fit for\_use. Within a decade, Oronis’s Kurn was established. Within five decades, it was\_thriving. For five hundred years, Kurn followed the same course as the other sorcerer-king domains. Throughout that time, Oronis was troubled by something few\_of his peers possessed-his conscience.\_When he was Keltis, Lizard Man Executioner, he succeeded at the task Rajaat\_handed to him. He eliminated the entire race from the face of Athas. As the years\_passed and Keltis the Champion became Oronis the sorcerer-king, images of the\_atrocities he committed started to haunt him. After Oronis advanced to a secondstage\_dragon king, his problems intensified. Now he had the deaths of his subjects\_on his head, for he had to use a specified amount of life force to power his transformation.</p>\n<p>He decided that none of this was what Rajaat originally promised him.\_Where was the restoration of the world? Athas hadn’t gotten better because of the\_Cleansing Wars. It had gotten worse. What’s more, the sorcerer-kings were continuing\_the downward spiral, slowly killing the world by their actions. Oronis refused\_to be a part of that trend any longer. He renounced his defiling skills and his status\_as a dragon king and sought a different path.</p>\n<p>\_</p>\n<p>That was when Kurn broke off relations with the other city-states. Mercantile\_activities continued, of course, but at a reduced rate. After a time, Kurn became one\_of the forgotten cities—just as Oronis had hoped. In the meantime, he set the next\_part of his plan for redemption in motion. Oronis wanted to make amends for the\_horrors of his past.</p>\n<p>\_</p>\n<p>The first step was to change the rules of society in Kurn. Though the city had to\_maintain an illusion of normalcy to keep the other sorcerer-kings from detecting\_treachery or weakness, Oronis secretly freed all slaves and instituted fair and just\_practices at all levels of society. He swore his citizens to secrecy, for if word got out he was sure his one-time peers would flock to Kurn like gith to a dying braxat. The\_second step was to begin construction on the utopia he envisioned. Like all ex-\_Champions, Oronis originally wanted to return Athas to the glory of the Blue Age.\_He decided to once more strive for that goal. In a hidden valley among the peaks of\_the White Mountains, the foundation stones of New Kurn were laid.\_</p>\n<p>As his templars and citizens worked to build New Kurn, Oronis went in search\_of a better path to power. Using the techniques and practices of preserving magic,\_Oronis looked for a way to combine magic with psionics in a more positive way\_than through dragon magic. It took nearly 1,000 years of study and experimentation\_for Oronis to develop the preserver metamorphosis spell. With it, the reformed sorcerer-king could become an advanced being aligned to goodness instead of another\_force for evil.</p>\n<p>Today, the twin cities of Kurn continue along their parallel courses. Old Kurn displays\_a typical sorcerer-king’s domain to the other inhabitants of the region, at least\_on the surface, while New Kurn works to complete Oronis’s experiment in regressing\_a small portion of Athas back through time. Between the two cities, Kurn has a total\_population of 18,000 people. The majority live in the new city, as each year more\_citizens are moved from the old city to the new. Old Kurn has such a small number\_of residents that it appears to be almost a ghost town, and one day Oronis plans to\_completely abandon it in favor of his secluded valley.</p>\n<p>\_</p>\n<p>Government: Oronis the Avangion (male human/24th-level avangion/LG) guides the\_paths of the twin cities. Oronis spent centuries redeeming himself, going so far as to\_change his very nature from evil to good, though he still feels he has a long way to\_go to make up for his acts as a Champion of Rajaat and a sorcerer-king. For this reason,\_he has dedicated himself and his citizens to working toward the eventual\_restoration of all Athas.</p>\n<p>While in Old Kurn, Oronis wears the guise of a normal human. In this psionically and magically induced disguise, he appears as a tall, lanky, middle-aged man\_with short golden hair, pale-blue eyes, and a close-cropped blond beard. He covers\_himself in the trappings of a sorcerer-king, wearing a golden circlet on the crown of\_his head and carrying an obsidian-topped walking staff. In New Kurn, however, such\_disguises aren’t called for. There he openly displays his true avangion form—a tall,\_thin, hairless humanoid with golden skin, silver eyes, and gossamer wings.</p>\n<p>Though Old Kurn appears to run like any other city-state, Oronis long ago abandoned\_a monarchical form of government. He allows his subjects to govern themselves\_via a democratic system he developed. In this system, nobles and all citizens\_except templars may hold public office. Elections are held at regular intervals and\_term limits are set. The highest elected official is called the Presider, who sits at the\_head of a body called the Tribunal. Members of the Tribunal are referred to as\_Tribunes. Together, the Presider and the Tribunes draft the laws that keep the citystate\_running smoothly.</p>\n<p>The current Presider is Ulali of Prusicles (female half-elf 4thlevel preserver/LG), now in the second year of a five-year term.\_</p>\n<p>Oronis refuses to hold an official position, though he does pretend to be sorcererking\_in the old city. He acts as an adviser when the Presider or Tribunal requests his\_presence, but otherwise, he’s more concerned with advancing as an avangion and\_keeping the valley restoration project on track. Oronis’s templars don’t serve as\_administrators in Kurn, either. Instead, they are the keepers and dispensers of knowledge,\_serving as teachers and advisers to local officials and businesses. It’s also their\_job to oversee and handle the restoration process, under Oronis’s supervision.</p>\n<p>\_</p>\n<p>Trade and Commerce: Old Kurn has a limited but active mercantile exchange that\_ regularly welcomes aarakocra traders from Winter Nest and elf merchant tribes from both the north and south. Occasionally, ssurran traders wander down from the\_Scorched Plateau to make deals and gather goods to take back to their usual clients.\_</p>\n<p>House Tsalaxa of Draj makes regular trips to the north to conduct business with Kurn\_and Eldaarich. This is the extent of the major mercantile activities going on in Old\_Kurn, though scores of dune traders pass through the walls of the city every week.\_</p>\n<p>Kurn has its own merchant house, House Azeth. By the standards set by the merchant\_dynasties of the Tyr Region, Azeth is small. By the standards of the northern\_region, its wealth is beyond compare. Led by Corik Azeth (male human/9th-level\_trader/LN), the house has holdings in the White Mountains, maintains villages near\_Eldaarich and along the trade road to the south, and keeps an emporium in far-off Draj.\_Though Corik suspects that some sort of deception is being played out in Kurn, business\_is too good for him to want to dig so deeply as to disturb the status quo. The merchant\_lord also has his suspicions about what’s going on past the walls of Fort Protector, but\_he’s sure that satisfying his curiosity will only ruin the position he commands.\_</p>\n<p>Azeth’s two client villages, Azeth’s Rest and Silt Side, serve important roles in the\_daily business of the house.</p>\n<p>Azeth’s Rest, built around a lush oasis along the trade road that connects the north to the south, provides a stop-over point for caravans\_going to and coming from the Tyr Region. This walled village features a sizable\_legion of mercenaries to guard against the frequent raids from the west. Raiders from\_the Bandit States of the Barrier Wastes often target caravans traveling on the road and\_sometimes even strike at the village when their need is particularly great. Azeth’s\_Rest, by the way, welcomes all traders-provided they can pay the fees for using its\_services.</p>\n<p>Silt Side, meanwhile, is an open village on the coast of the Silt Sea. Few\_raiders enter the area due to the frequent patrols sent out by Fort Protector, so the villagers\_don’t worry about attacks from the west. Giants from the silt aren’t even a\_problem, as nearby Fort Holz keeps them at bay. Silt Side handles trade with\_Eldaarich, which doesn’t have any merchant house of its own. In fact, this village is\_the only connection with the outside world that Eldaarich maintains. Otherwise, the\_city-state is secluded from the rest of Athas.</p>\n<p>\_</p>\n<p>Conditions in the City: The state of life in Kurn depends on which of the twin cities\_is being considered. Old Kurn, on the surface, appears to be much like any city in\_the Tyr Region still ruled by a sorcerer-king. Surface appearances, however, can be\_deceiving. Travelers who stay for any length of time might notice a few oddities. For\_example, the slaves seem to have a sparkle in their eyes and a bounce in their step\_that isn’t seen in the other city-states, and templars aren’t given as wide a berth as\_their counterparts in Urik or Nibenay. Additionally, while the merchant and tradesmen\_districts are always crowded, the rest of the city is as empty and desolate as the\_ruins of Giustenal.</p>\n<p>Old Kurn maintains its illusion of business-as-usual through the cooperation of\_its citizens and the advanced powers of its sorcerer-king. If visitors notice that the\_noble and templar quarters of the city are practically deserted, they usually\_attribute it to the rumors that Kurn is slowly dying. Dying or not, the city is far\_from defenseless. More than one raiding tribe has attempted to take advantage of\_the “dying” city only to discover that its defenders were more than capable of driving\_them off.\_Through the efforts of House Azeth and the commerce provided by other traders,\_Kurn maintains a modest economy. While most of the inhabitants of the Tyr Region\_have forgotten that this northern city exists, Kurn interacts with its closest neighbors on\_a regular basis. It has good relations with the aarakocra of Winter Nest, the merchants\_of Draj’s House Tsalaxa, and the elves of a few of the local tribes. Except for the contact\_between House Azeth and the trade templars of Eldaarich, Kurn has little interaction\_with its neighboring city-state. On the other hand, Kurn sometimes has trouble\_with raiders from the Bandit States. The raiders don’t come to the gates of the city (at\_least not very often), but they do attack travelers on the trade road and even plunder\_the client villages on rare occasions.\_</p>\n<p>\_</p>\n<p>New Kurn is a different matter. The high, sturdy walls of Fort Protector block the\_eastern entrance to the hidden valley, while the tall, steep peaks of the White\_Mountains make the other directions inaccessible. The only approach that might be\_open is by air, though flying creatures loyal to Oronis nest in the vertical peaks.\_Within the valley, Oronis’s restoration project is in full swing. He has turned the valley\_into a place from the past, recreating the conditions of the Green Age in its sheltered\_space. A thick forest surrounds a lush clearing where the city of New Kurn has\_been built beside a small, clean lake. Oronis hopes to eventually regress the valley\_to conditions as they were in the Blue Age, but that’s still many years away.\_The new city resembles Oronis’s vision of utopia. Airy buildings with tall, elegant\_spires grace wide, open streets paved with white stone. Here, the people govern\_themselves through a system of fair laws and majority rule. Everyone has a say in the\_workings of the city, from the poorest laborer to the highest elected official. And if\_someone doesn’t like the way things are going, they’re free to run for a position\_when the current terms of office expire.</p>\n<p>Thanks to the fertile valley and the lush forest, no one goes hungry or thirsty in\_New Kurn. No creatures are hunted out of existence and no plants are plucked completely\_from a given area. The templars monitor the forest on a daily basis to make\_sure the delicate balance is maintained. For this reason, no defilers are permitted\_within the ranks of the templars or anywhere in the twin cities. It is strictly against\_the laws of Kurn to practice defiling magic.\_Oronis continues to advance as an avangion, and he tries to instill the same\_serene, peaceful, life-giving properties of his new form in the city and people who</p>\n<p>follow him. Where once there was a man of evil, now Oronis is a force for good in\_the world. His templars work to promote his plans and prepare to someday strike out\_from the valley with the knowledge of how to restore all of Athas. Until then, they’ll\_work to finish the restoration of the valley and to perfect the society that Oronis has\_inspired.</p>\n<p>\_</p>\n<p>The Veiled Alliance: Kurn has no Veiled Alliance. Preservers are a welcome and significant\_part of the society, so there’s no reason for them to hide behind a veil of\_secrecy. In fact, preservers from other Alliance factions sometimes come to Kurn to\_study with Oronis. One preserver, Korgunard of Urik, even\_ learned the steps to\_become an avangion and followed the path forged by Oronis. It’s conceivable that\_more avangions will appear in the future, though when and how many is hard to say.\_</p>\n<p>Like dragons, avangions are exceedingly rare. Only the best, most powerful preserver/\_psionicists can even hope to take the first steps as an avangion, let alone\_achieve the level of advancement that Oronis has thus far attained.\_While preservers are accepted and integral to Kurn society, defilers are considered\_enemies of everything Oronis stands for. The avangion is reluctant to allow his\_followers to make defiling magic punishable by death, as he himself was once a\_defiler of the highest order. However, he knows that in most cases defilers can’t\_make the mental and spiritual changes necessary to reject that path, so he has\_agreed that known defilers must be banished from the society.</p>"
