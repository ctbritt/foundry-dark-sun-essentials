      content: >-
        <h3><strong>Act 1: The Megapede of the
        Wastes</strong></h3><p><strong>Adventure Setup</strong>:<br />The party,
        along with a handful of Hadozee crewmembers, has crash-landed in the
        <strong>Great Alluvial Sand Wastes</strong>—a desolate, sun-scorched
        desert. They have limited supplies, little water, and are surrounded by
        a dangerous and unfamiliar world. The oppressive heat of Athas weighs
        heavily on them, and their magic, once reliable, now behaves strangely
        under Athas’ defiled sun.</p><hr
        /><h3><strong>Introduction:</strong></h3><aside class="fvtt
        narrative"><p>The desert stretches before you, endless dunes of burning
        white sand shimmering beneath the merciless red sun. The heat presses
        down on you like a great invisible hand, stealing your breath and
        sapping your strength. Your supplies are dwindling—only enough water for
        another day at most—and the Hadozee crewmembers who survived the crash
        are looking to you for guidance. Your powerful magic feels distorted
        here, every spell cast with an unfamiliar drain, as though the life
        around you is being devoured with every word of power you
        utter.</p></aside><p>The Great Alluvial Sand Wastes are as inhospitable
        as they are vast, with no landmarks in sight to guide your journey. The
        faint wind blowing over the dunes does little to offer relief; instead,
        it carries with it the smell of something foul, of something…
        <strong>hunting</strong>.</p><hr /><h3><strong>Setting the
        Scene:</strong></h3><ul><li><strong>Time of Day</strong>: High noon on
        Athas. The sun is a blazing crimson disc in the sky, casting harsh light
        over the barren dunes.</li><li><strong>Environment Effects</strong>:
        Every hour spent under the sun requires a <strong>DC 13 Constitution
        saving throw</strong> to avoid gaining a level of
        <strong>exhaustion</strong> due to the extreme heat. The party may
        consume water to gain advantage on these checks, but their water supply
        is limited. The Hadozee crew is particularly vulnerable, and if they
        gain too much exhaustion, they may collapse from the heat.</li></ul><hr
        /><h3><strong>Part 1: The Endless
        Sands</strong></h3><h4><strong>Survival in the
        Wastes</strong></h4><p>The party must decide on a direction, likely
        heading west toward the vague direction of civilization. However, the
        journey through the dunes is not easy. The ground beneath their feet
        shifts constantly, making movement difficult, and the burning heat
        leaves them fatigued.</p><ul><li><p><strong>Skill
        Challenge</strong>:</p><ul><li>The players must navigate the desert
        using <strong>Survival (DC 15)</strong> to find a suitable path through
        the dunes. Each failure brings the risk of the party becoming
        <strong>disoriented</strong> (forcing them to spend an extra hour in the
        desert, risking further exhaustion).</li><li><strong>Perception (DC
        12)</strong> may reveal distant mirages or shifting sands, but with a
        successful roll, a player will notice subtle <strong>vibrations</strong>
        beneath their feet, a warning of the danger to
        come.</li></ul></li><li><p><strong>Resources</strong>: If the party
        doesn’t manage their water supply, dehydration will quickly become an
        issue. Track how much water each character and crew member has left.
        Each character needs at least a half ration of water per day to avoid
        dehydration.</p></li></ul><hr /><h3><strong>Part 2: The Tremors
        Beneath</strong></h3><p>As the party makes their way across the shifting
        sands, have them feel a slight tremor below their feet. At first, it’s
        subtle, like the faint rumble of an earthquake in the distance. Then, a
        larger <strong>shockwave</strong> ripples through the sand, as though
        something massive is moving beneath the surface. The Hadozee crew begins
        to panic, looking to the sky and then to the ground.</p><aside
        class="fvtt narrative"><p><strong>Hadozee Crew Member</strong>:
        "Something’s… <strong>down there</strong>! We need to
        move—<strong>now</strong>!"</p></aside><p>Before the party can react,
        the ground erupts in a spray of sand as a <strong>Megapede</strong>
        bursts from beneath the dunes, towering over them. The creature's
        segmented body, as long as a wagon train, writhes through the air, its
        mandibles clacking, dripping with venom. The <strong>Megapede</strong>
        rears back, preparing to strike.</p><hr /><h3><strong>Encounter: The
        Megapede</strong></h3><img style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:100%"
        src="s3/artwork/dark-sun/megapede_by_willobrien_ddocb9n-414w-2x.webp"
        alt="" width="828" height="1044"
        /><p>@UUID[Actor.aDSLd6UmFaa10tXj]{Megapede}</p><hr
        /><h4><strong>Complications</strong>:</h4><ul><li><strong>Hadozee Crew
        in Danger</strong>: During the fight, the Megapede may target the
        <strong>weaker Hadozee crew</strong>, particularly if they fail to stay
        quiet or attempt to flee. If any Hadozee are grabbed by the Megapede,
        the party must act quickly to save them or risk losing valuable crew
        members.</li></ul><hr /><h3><strong>Aftermath of the
        Encounter</strong></h3><p>Once the <strong>Megapede</strong> is defeated
        (or escapes), the party is left to gather their bearings and take stock
        of their dwindling resources. The <strong>desert heat</strong> continues
        to sap their strength, and the fight has likely taken a toll on their
        supplies. Some of the Hadozee crew may be <strong>injured or
        exhausted</strong>, and their panic grows as the dangers of Athas become
        more apparent.</p><p>As the party prepares to move on, the
        <strong>survivor’s desperation</strong> becomes palpable. They must
        continue west, toward <strong>Kled</strong>—the only place that offers
        any hope of survival.</p><hr /><h3><strong>Act 1
        Conclusion</strong>:</h3><p>The party has encountered the first of
        Athas' many deadly threats: the massive Megapede. Now, with limited
        resources, they must push further into the desert, hoping to find
        shelter, water, and answers before the unforgiving sands claim them. The
        strange behavior of their magic lingers in their minds, but for now,
        survival is all that matters.</p><p><strong>Next Act</strong>: <em>The
        Oasis Battle</em></p>
