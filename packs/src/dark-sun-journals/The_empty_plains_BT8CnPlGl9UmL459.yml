    text:
      format: 1
      content: "<p>THE EMPTY PLAINS</p>\n<p>When most people in the Tyr Region speak of “the\_hinterlands,” they are referring to the Empty Plains:\_a hundred-mile-wide shelf of largely uninhabited\_barrens and scrubland that runs from the thinning forests and foothills of the Ringing Mountains\_western slopes to the top of the Jagged Cliffs. The\_yellow-green scrubland, broken by the occasional out\_cropping of weathered rock, is home to herds of wild\_erdlus and mekillots, kank armies, and hungry desert\_predators. Ruins lie scattered through the plains, but\_apparently, the region was lightly populated even in\_ancient times, the remnants here are small in size\_and few in number.</p>\n<p>A few primitive tribes of hunters—mostly elves, humans, and half-giants—follow the herds, along with thri-kreen packs and bands of ravenous gnolls. However, vast stretches of these plains are deserted, and travelers might go months without meeting anyone.</p>"
