    text:
      format: 1
      content: "<p>The dwarven settlement of KIed controls an obsidian mine in the foothills of the Ringing Mountains.\_The village is built on the location of a Green Age\_dwarven citadel called Kemolak. The dwarves of Kled\_believe they are descended directly from the kings of\_Kemolak, although they keep this claim from outside\_ears lest they anger a sorcerer-king in their presumption. From time to time, miners unearth portions of\_the ruins of the “city of dwarf kings.” Most of the finds\_are enigmatic wall remnants or bits of flagged flooring heavily inscribed with angular runes. However,\_every so often the workers recover a crumbling relic\_of ancient Kemalok.\_Of late, Kled has been troubled by a series of raids\_targeting trade caravans bound for Tyr. A number of\_dwarves have been killed by mysterious attackers.</p>"
