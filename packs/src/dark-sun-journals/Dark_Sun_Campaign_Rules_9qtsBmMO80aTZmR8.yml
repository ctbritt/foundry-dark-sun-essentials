      content: >-
        <p>The world of Athas is a harsh and unforgiving one. The following
        rules will be applied:</p><h2>Hard Mode</h2><ul><li>All magic items are
        adjusted one level of rarity upward: common becomes uncommon, uncommon
        becomes rare, etc. In addition, the cost for magic items is still in gp,
        not cp.</li><li>The optional <a
        href="https://www.dndbeyond.com/sources/dnd/dmg-2014/dungeon-masters-workshop#HealersKitDependency">Healer's
        Kit Dependency</a> rule will be used and characters have <a
        href="https://www.dndbeyond.com/sources/dnd/dmg-2014/dungeon-masters-workshop#SlowNaturalHealing">Slow
        Natural Healing</a>.</li><li>Characters can get <a
        href="https://www.dndbeyond.com/sources/dnd/dmg-2014/dungeon-masters-workshop#Injuries">Lingering
        Injuries</a> on critical hits when dropped to 0 hit points, or if he or
        she fails his or her death saving throw by 5 or more.</li><li>Creatures
        can experience <a
        href="https://www.dndbeyond.com/sources/dnd/dmg-2014/dungeon-masters-workshop#MassiveDamage">massive
        damage</a>.</li><li>Successful foraging rolls produce half the amount of
        water they normally would.</li></ul><h2>Defilement</h2><p>When a
        sorcerer or warlock casts a defiling spell, they use all the same
        verbal, somatic, and material components. The range, duration, casting
        time, area of effect, and saving throws remain unchanged. However, all
        vegetation in a sphere around the defiler dies. The radius of that
        sphere depends upon two things: the abundance of vegetation in the area,
        and the level of the spell cast.</p><p>For Stony Barrens, Sandy Wastes,
        Rocky Badlands, Salt Flats, Boulder Fields, Silt Sea and Mountains, the
        radius of the sphere is a base of 15 feet plus 15 feet per level. For
        example, a warlock that casts a 5th-level spell in the rocky badlands
        destroys all vegetation in a 90-foot radius sphere centered on
        it.</p><p>For Scrub Plains and Verdant Belts, the radius of the sphere
        is a base of 5 feet plus 5 feet per the spell's level. So, a sorcerer
        that casts a 3rd-level spell in the scrub plains destroys all vegetation
        in a 20-foot radius sphere centered on it.</p><p>For Forests and
        Jungles, the range is a 5-foot radius for spell levels 1st through 7th,
        and 10 feet for 8th- and 9th-level spells.</p><p>A defiler cannot cast
        spells in a Salt Flat or region of Black Sand.</p><p>Cantrips do not
        cause defilement.</p><h3>Casting Multiple Spells from the Same
        Location</h3><p>If a defiler casts more than one spell from the same
        location, the radius of destroyed vegetation expands around it. For
        example, the defiler Grifyan casts a lightning bolt, a 3rd-level spell,
        while in the scrub plains. The area of ash around him will be 20 feet.
        In the next round, he casts a magical missile spell, expanding the
        radius of ash by another 10 feet. In the third round, Grifyan decides to
        unleash a cone of cold cast as a 5th-level spell. The sphere's radius
        expands again by 30 feet.</p><h3>Plant Creatures and Magical
        Plants</h3><p>Plant creatures and magical plants are allowed a
        Constitution saving throw with a DC of 10 + the spell's level. If the
        creature fails its saving throw, it takes an amount of necrotic damage
        equal to 1d8 + 1d8 per spell level and it takes half as much damage on a
        successful saving throw. If the creature or plant's hit points are
        reduced to 0, it withers, dies, and turns to ash (see
        below).</p><h3>Effects on Living Creatures</h3><p>Though only plants are
        destroyed within the radius, living creatures are caused great pain. Any
        creature in the radius of a defiler's magic must make a Constitution
        check with a saving throw of 10 + the spell's level.</p><p>A creature
        that fails its Constitution saving throw is wracked with great pain;
        until the end of the creature's next turn, it has disadvantage on its
        ability checks and attack rolls.</p><h3>Ash</h3><p>The ash created by
        defiler magic is black and grey, completely devoid of life or
        life-giving elements. Nothing will grow in an area of ash for one year.
        The ash itself is very light and usually blows away, leaving behind a
        lifeless, circular scar on the ground. Even with the ash gone, though,
        the defiler's magic has leeched all life-giving nutrients from the soil,
        so that an area defiled may take many years to recover life if it ever
        does.</p><h3>You're New Here, Aren't You?</h3><p>The players are new to
        the way magic works on Athas. They can cast spells without defiling, but
        they must make a [[/save con]] with a DC of 10 plus the spell's level or
        suffer a level of exhaustion. This represents them drawing on their own
        life force to cast the spells. Until they can learn to tap into the
        remaining magic of Athas (an adventure in its own right!), they will
        suffer this effect.</p>
