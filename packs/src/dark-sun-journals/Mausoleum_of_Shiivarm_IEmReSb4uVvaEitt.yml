    text:
      format: 1
      content: "<p>In the middle of a deep cleft in the mountains north\_of Tyr stands the ruin of a white palace surrounded\_by golden-brown savanna. Its towers are carved with\_the images of strange beasts that no longer exist on\_Athas—great, long-nosed creatures with tusks\_ and\_flaplike ears—and its central dome gleams with polished copper. The word “Shiivarm” is written across\_the palace gates in the ancient Barazhad script of the\_elemental powers, but no one alive today knows who\_or what Shiivarm was, or whether the\_ structure is\_truly a mausoleum. Demons haunt the vicinity, falling\_upon travelers whose curiosity draws them too close.</p>"
