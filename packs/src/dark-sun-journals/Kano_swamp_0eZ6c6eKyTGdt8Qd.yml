    text:
      format: 1
      content: "<p>A mighty river cascades\_out of a western mountain range toward the Jagged Cliffs.\_On its way, it pools in a depression that has become the\_Kano Swamp. The kreen of the area avoid this swamp, for\_its excessive wetness can cause a variety of illnesses in the\_insectoids, not the least of which is chitin rot.</p>\n<p>Swamps contain mud, water, plants of all descriptions,\_and a multitude of creatures. Kano Swamp, for example,houses a vast collection of reptiles not found anywhere\_else in the savanna. Travelers can escape some of the\_insectoid terrors of the grasslands by plunging into Kano\_Swamp. However, the predators in its dark interior are as\_deadly – or deadlier – than most of the predators stalking through the tall grass outside.</p>"
