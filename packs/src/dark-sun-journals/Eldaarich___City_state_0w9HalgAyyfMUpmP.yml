      content: "<p>Eldaarich occupies a small island in the Sea of Silt, just off the mainland. Here,\_isolated and protected from the rest of Athas, the city-state’s 21,000 citizens huddle\_in the paranoid delusions of their mad sorcerer-king. Daskinor, ruler of\_Eldaarich, believes that unknowable forces in the world are trying to destroy him.</p>\n<p>Every few years he puts a new name to these forces—the Order, the Veiled\_Alliance, Rajaat, pyreen, a merchant house, a lowly slave, or some other identifiable\_target becomes the imagined source of his fears for a time. Daskinor does his\_best to destroy these imagined enemies, and anyone who has even a passing</p>\n<p>resemblance to the target is persecuted until the next delusion grips him.\_Daskinor was never a stable ruler. From the beginning of his reign as sorcererking\_of Eldaarich, he was tormented by unfounded fears and nameless terrors that\_preyed upon his mind. For the first few centuries of his reign, he was able to function\_more or less normally despite his growing paranoia. As time passed, genuine bouts\_of panic began to intrude upon his psyche. These bouts lasted longer and longer,\_paralyzing Daskinor for hours, days, sometimes even months at a time.\_</p>\n<p>Eldaarich was constructed to protect Daskinor from his fears. Fortified walls, a\_strong military, devoted templars, retractable bridges, a series of keeps and fortsthe\_entire city-state and surrounding area was secured against outsiders. Over\_time, it became less of a fort and more of a prison, locking king and citizens alike\_behind sturdy gates and high walls. Seven centuries ago, the sorcerer-king’s paranoia\_became acute. He completely sealed his city, cutting off all ties to the other\_city-states. That was the way things remained until about 10 years ago, when limited\_trade was resumed with House Azeth of Kurn.</p>\n<p>Today, Eldaarich remains an isolated prison of a city. Daskinor’s fears have\_become the fears of his citizenry, making everyone who lives under his rule as\_paranoid as he is. No one ever leaves Eldaarich, and no one ever enters its massive\_gates. It’s a closed society—figuratively and literally.</p>\n<p>\_</p>\n<p>Government: The same model of government evident in the other city-states exists\_in Eldaarich. The sorcerer-king Daskinor (male human/22nd-level dragon/CE)\_stands atop the societal hierarchy, his troubled delusions coloring every aspect of\_life in the city-state. His chaotic tendencies and often overwhelming paranoia\_infuses everyone he comes in contact with, making the city almost as wild and\_frenzied as Raam. The only thing that allows the city to function is that the citizens\_are a subdued lot, living in quiet fear instead of in rambunctious anarchy. Daskinor\_constantly watches over his shoulder for assassins that don’t exist, and so do his\_templars and nobles. No one trusts anyone else in Eldaarich. This works out for the\_best, as the troubled atmosphere has fostered a society where the fear of murder\_and betrayal has encouraged the periodic use of such techniques by those who\_prefer to strike first.</p>\n<p>\_</p>\n<p>Templars and nobles regularly kill each other to keep the same from happening\_to them, or to gain power or position, or just because the tension of living behind\_heavy locks and being constantly on guard eventually drives even the most peaceful\_beings to violence. In Eldaarich, fear permeates everything—fear of the sorcerer-king,\_fear of outsiders, fear of each other, and fear of the unknown. Because the society is\_closed off to the rest of the world, everything on the other side of its walls and\_locked gates is, by definition, unknown.\_If Eldaarich is a prison, Daskinor is its most prominent prisoner. The sorcerer-king</p>\n<p>lives in a walled sub-city and rarely ventures into other parts of his realm. His constant\_paranoia sometimes intensifies to such a fevered pitch that he ceases to function.\_In such a state, which may last as long as months at a time, Daskinor is cared\_for by his senior templars. At other times, his paranoia drives him to give a name to\_his fear. When this occurs, the entire city mobilizes to combat this supposed threat to\_the realm. Currently, the use of psionic abilities has been outlawed, as Daskinor\_believes that the Order has initiated a campaign against his rule. Even low-powered\_psionicists and wild talents who openly display their abilities are subject to imprisonment\_or death because of the current edict. Only Daskinor, a psionicist of the highest\_caliber, is exempt from the terms of the edict.\_Daskinor’s templars serve as administrators to the city, and also act as the sorcerer-\_king’s eyes and ears in all corners of the domain. They are charged with watching\_for signs of treachery among the masses-and with dealing with such treachery\_before it gets out of hand. The templars are as paranoid and delusional as Daskinor,\_giving in to their fear whenever it overwhelms them. For this reason, Eldaarich has\_become a police state, and the templars are the police. They command the military.\_They oversee all records and the distribution of goods and services. They hold the\_power of life and death for the rest of the citizenry in their terrified hands.\_Trade and Commerce: After centuries of total isolation, Eldaarich has finally resumed\_contact (albeit limited contact) with the outside world. The High Templar Kerrilis\_(female human/14th-level templar/LE) has allowed House Azeth of Kurn to set up the\_small village of Silt Side for the express purpose of conducting trade with Eldaarich.</p>\n<p>Daskinor’s trade templars only interact with agents of House Azeth, and that interaction\_only takes place in Silt Side. No outsiders are permitted into Eldaarich or any of\_its holdings.\_</p>\n<p>All other merchants must go through House Azeth if they want to acquire\_Eldaarish goods or get their own wares into the closed city. Azeth makes a healthy\_profit as the middleman, but the house doesn’t unduly hike prices to fill its own coffers.\_The course of performing the normal functions of business pays well enough to\_satisfy the merchant house. The relationship has benefited both Azeth and Eldaarich,\_and a level of trust that few in Daskinor’s domain possess has begun to develop\_between Kerrilis and Corik Azeth. Where this trust will lead has yet to be determined,\_and it’s possible that Daskinor might still order his troops to destroy Silt Side\_when the next delusion overtakes him.</p>\n<p>Eldaarich grows the majority of its food in the protected village of South\_Guard, and in the farms set up in the fertile fields around the city-state. It acquires\_additional food stores from the traders, but has a more pressing need for iron,\_obsidian, textiles, and other staples of Athasian life. Its most sought after export is\_gold and silver, which it culls with great difficulty from nearby mountains rising\_out of the Silt Sea.</p>\n<p>\_</p>\n<p>Conditions in the City: Every outsider wants to destroy their city-state and their sorcerer-king, and everyone who lives within the walls waits for an opportunity to\_betray you. That’s what the people of Eldaarich believe, for that’s what their leaders\_believe. No where else in all of Athas is there such an underlying current of genuine,\_unattributable fear. It filters down from Daskinor himself, making citizen and slave\_alike tremble with uncontrollable paranoia.</p>\n<p>The citizenry is a subdued, cowering lot, given to unexpected bursts of violence\_once the fear inside them becomes too much to contain. In many cases, the ever-crushing weight of terror and oppression keeps the masses down, but sometimes a\_delusional artisan will strike out at a templar or noble, causing the level of paranoia\_to rise even higher.</p>\n<p>The quality of life isn’t good in Eldaarich. Because Daskinor doesn’t trust anyone,\_he allows his templars to dispense only the barest essentials to the free citizens\_and slaves. With just enough food and water to sustain them and few personal possessions,\_the people of the city are a sad, pathetic lot. They have no hope of a better\_life and no concept that a better life exists outside the walls of Eldaarich. If anyone\_even suggests such a notion, the ingrained fear of the unknown kicks in and makes\_everyone else dismiss the idea.\_</p>\n<p>While the class structure of noble, free citizen, and slave exists in Eldaarich, the\_truth is that everyone beneath the templars is a slave to Daskinor’s all-pervasive fear.\_The sorcerer-king sees threats to his rule on every face and in every dark shadow. For\_this reason, he permits no freedoms of any sort, not even the token rights given to\_the citizens of other cities. Freedom, Daskinor believes, is just an opportunity to\_betray his trust. So he orders his templars to oppress the people of his city, to make\_their lives so miserable they don’t have time or strength to contemplate treachery.</p>\n<p>The templars don’t have it much better. They’re kept in line by the high templars\_who, in turn, are subject to Daskinor’s brutal whims.\_The majority of the population consists of humans, though there are also\_dwarves, half-giants, and muls in significant numbers. There are also a few aarakocra\_wasting away in the slave pens. Daskinor has a particular hatred of the winged people\_and gives his templars special compensations for capturing aarakocra from the\_nearby White Mountains.</p>\n<p>If travelers were to find themselves in Eldaarich or one of its holdings (which\_isn’t very likely), they’d feel the weight of oppression and smell the stench of mental\_illness that hangs in the hot, stifling air. The citizens are a cowed, quiet lot, though\_an occasional individual will be gripped by a fever of madness and strike out at anyone\_within reach. Every year the darkness in Daskinor’s soul grows deeper, his paranoia\_more acute. This mental deterioration is reflected in the city itself, as though\_each citizen were a part of the sorcerer-king’s diseased mind.</p>\n<p>\_</p>\n<p>The Veiled Alliance: Eldaarich has no Veiled Alliance. Daskinor rooted out the\_Alliance and destroyed it 400 years ago when the group of preservers became his\_imagined enemy of the moment. Some preservers still live in the city, but they\_remain hidden and are relatively weak due to a lack of adequate training.</p>\n<p>Preservers from Kurn sometimes sneak into the closed city to provide training and\_to see what the conditions are, but they don’t do this very often. If they get\_caught, they’re put to death, and if their city of origin is discovered, it could mean\_war between the two cities. No one, especially Oronis the Avangion of Kurn,\_wants a war to break out. He does, however, feel the pain that both Daskinor and\_his citizens project, and often contemplates finding a solution to Eldaarich’s\_problems.<br /><br /><br /><br /><br />The City of Night\_(formerly the City of Fear) Eldaarich is made up of seven walled-off sections, with the gates between guarded at times by either Daskinor's Templars, a noble merchant's mercenaries, or in exactly one case, seemingly no one at all.\_The sections of the city are...\_The Markets\_- The common area of Eldaarich where most trade happens, just inside the city gates. There are smaller markets in most every section of the city, but this is the primary marketplace. Despite the chance of getting robbed, the Markets is typically the safest place in all of Eldaarich to be.\_The Hold\_- The slums of Eldaarich, where any non-nobles or outsiders live. Death and disappearances, as well as plague and hunger, are common here, and living conditions are poor. The city's aura of paranoia seems especially noticeable here.\_The Grey Watch\_- On the outside edge of the city facing the Sea of Silt, this nobles' quarter is lorded over by a trade alliance dealing largely in metals and obsidian. They have a substantial mercenary force of glaives and largely keep to themselves.\_The Sun Quarter\_- In one of the few portions of the city to rarely fall into the shadow of Daskinor's temple, this nobles' quarter is a home to Daskinor's most outwardly loyal petitioners who deal in extravagant goods and often claim to have been empowered by Daskinor as his \"chosen few.\"\_The Moon Quarter\_- Opposite the Sun Quarter, the Moon Quarter is a noble district often in the temple's shadow, and was once home to the city's psionics academy before Daskinor ordered it burned to the ground. The Moon Quarter's nobles are a curious lot, leaving the gates to their district unguarded, yet anyone passing through them will feel closely watched. They have also been known to extend aid to the Hold in times of great distress, but whenever they do, disappearances in the Hold experience a spike soon after.\_The Templar Quarter\_- The barracks, armory and training grounds for Daskinor's templars, which used to reside in the temple itself until Daskinor no longer trusted his templars not to rise up against him. They watch the city from a high post and these days must spend almost as much effort guarding their own stockpiles as they do the temple.\_The Temple of Daskinor\_- Looming high in the center of the city, the Temple is less opulent than its southern counterparts, forgoing style in favor of security. The high walls guard a series of tall, white spires sitting atop a broad pyramid base. Rarely is anyone but the captain of the templars and their personal security detail seen going into or coming out of the temple itself. Around the city, worship centers for the few scattered faithful have been set up in each district (especially in the Sun Quarter) to commune with their paranoid god-king as they will.\_</p>\n<ul>\n<li>Update with the five fingers/towers of vecna and the blood halls.</li>\n</ul>\n<p>\_Law and Legality<br />Daskinor's paranoia has led to any number of things being on the list of unlawful things in the city of Eldaarich over the years, and enforcement against these vague threats has tapered somewhat over time as the templars suss out for themselves which are and are not legitimate threats to the sorcerer-king's power.\_A few things remain consistently illegal, however:</p>\n<ul>\n<li>The practice of or trade of materials concerning arcane magic (both varieties)</li>\n</ul>\n<ul>\n<li>The practice of overt psionics</li>\n</ul>\n<ul>\n<li>Elves congregating in groups of more than two of their kind</li>\n</ul>\n<ul>\n<li>Possession, sale or trade of obsidian</li>\n</ul>\n<ul>\n<li>Worship of any deity or sorcerer-king other than Daskinor</li>\n</ul>\n<ul>\n<li>Having a standing army more than a third the size of the templar forces</li>\n</ul>\n<ul>\n<li>Hoarding food or water</li>\n</ul>\n<p>Many of these laws are enforced disproportionately heavily against the denizens of the Hold versus those in the noble districts, who can afford to bribe certain templars or otherwise find more creative ways to mask their illegal activity.</p>"
