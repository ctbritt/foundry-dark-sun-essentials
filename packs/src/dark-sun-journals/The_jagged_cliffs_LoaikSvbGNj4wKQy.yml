    text:
      format: 1
      content: "<p>The Empty Plains come to an end at the Jagged Cliffs,\_a confusing maze of gradually steepening escarpments and\_winding canyons following the shore of a long-vanished\_sea. Over the course of thirty or forty miles, the land\_descends to the rolling plains of the Crimson Savanna,\_which lie two miles lower than the Empty\_ Plains to\_the east. In their middle elevations, the cliffs are almost\_vertical, posing a nearly impassable barrier to travel from\_east to west. In the gentler and more well-watered canyons\_and hanging valleys in the northward stretch of the cliffs,\_strange vertical forests cling to the sheer slopes and narrow\_ledges. Tribes of halflings inhabit some of these forests,\_building their villages directly from the cliff faces. Their\_technology is more primitive than that of the city-states,\_but the halfling culture of the lagged Cliffs is rich, vibrant,\_and old. Like their kin in the Forest Ridge, these halflings\_are a proud and isolationist people who do not appreciate\_outsiders wandering through their lands.</p>"
