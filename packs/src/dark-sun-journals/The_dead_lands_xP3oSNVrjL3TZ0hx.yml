    text:
      format: 1
      content: "<p>Many days south of Balic, a great plain of broken,\_\_black obsidian interrupts the monotony of the Endless Sand Dunes. The obsidian differs throughout\_the plain—it can be smooth and glassy, low and\_razor-edged, or shattered into jagged chunks 20 or</p>\n<p>30 feet tall. Here and there, bare hillocks rise above\_the obsidian waves, crowned by a clump of hardy\_bushes or a small tree, or half buried remnants of city\_walls jut out of the glistening glass like the bones of a\_creature that died in a tar pit. During the Cleansing\_Wars, a terrible battle was fought on this plain, and\_a defiler of awesome power broke the world’s skin,\_flooding the area with molten black glass to destroy\_whole armies with one dreadful ritual.</p>\n<p>With no food, little water, and no shelter to speak\_of, the Dead Land is one of the worst regions on\_Athas. By day, the sun’s heat on the black ground can\_kill a traveler within hours; at night, the armies slain\_here rise as hateful undead, driven to reenact the</p>\n<p>last battles of their lives. Near the center of the plain\_stands an obsidian citadel, built from rock cut from\_the ground by hordes of skeletons and zombies under\_the direction of a mighty undead lord.</p>"
