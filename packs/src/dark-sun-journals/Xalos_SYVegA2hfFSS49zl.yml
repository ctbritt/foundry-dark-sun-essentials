      content: >-
        <p>On the surface, Xalos appears to be exactly what Tyr's revolution
        promised—a skilled craftsman elevated to represent his district on the
        Council. Although he is rarely seen inside his shop,
        @UUID[JournalEntry.azZCv5ZwxdX3RAiY]{Stone and Mortar}, the mul
        stonecutter Xalos is a regular fixture in the district. He wanders the
        neighborhood and keeps up friendly acquaintances with its residents. He
        is especially fond of seeing sculptures made from custom stones that
        were delivered from his quarry.</p><p>As part of his commitment to work
        behind the scenes to further liberate the people of Tyr, Xalos sits in
        on clandestine meetings between factions that seek power in the
        city-state. This habit serves him well in his other role—that of a
        secret spy for Urik. The mul deludes himself, choosing to believe that
        he never gives up information that is too damaging to Tyr. He continues
        to take a stipend from his Urikite minder each time they meet in an
        empty room in Sculptors! Square.</p><p>He is extremely useful for
        introducing espionage elements, testing party loyalties, or providing
        information that may or may not be trustworthy. His position gives him
        access to both construction projects (useful for learning about
        fortifications or secret building) and political discussions.</p><p></p>
