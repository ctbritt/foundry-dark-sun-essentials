    text:
      format: 1
      content: >-
        <p>The Barrier Wastes is a term given to a desolate area</p>

        <p>that cuts across a massive portion of the Jagged Cliffs</p>

        <p>Region. Starting in the west just miles from the cliffs, the</p>

        <p>Barrier Wastes stretches east to the White Mountains,</p>

        <p>north to the Lava Gorge, and south toward the Tyr</p>

        <p>Region. Two distinct terrain types make up this area,</p>

        <p>and each has its own name. The larger of the two is an</p>

        <p>expanse of sandy wastes known as the Glowing Desert.</p>

        <p>The smaller is a wide belt of salt flats called the Scorpion</p>

        <p>Plains.</p>

        <p>Generally dry and bleak, the Barrier Wastes are marked</p>

        <p>by constant wind and extreme temperatures. During the</p>

        <p>day, the sun turns the land into a skillet, making the sand</p>

        <p>so hot that it burns unprotected skin. At night, the heat</p>

        <p>of the day quickly dissipates and the temperature drops</p>

        <p>below the freezing point.</p>

        <p>A near-constant wind howls out of the west, sweeping</p>

        <p>the land relatively flat. This makes the salt flats as sleek as</p>

        <p>glass, while the desert's sand dunes are brushed smooth.</p>

        <p>The dunes have gradual inclines and less severe dips than</p>

        <p>the sand heaps in the southern wastes.</p>

        <p>Life exists in the Barrier Wastes, but not in very great</p>

        <p>quantities. The largest concentration can be found in</p>

        <p>Troll Grave Chasm, a crater whose scrub-plains floor</p>

        <p>surrounds a huge mud flat. In the wastes themselves,</p>

        <p>the villages of the Bandit States possess most of the</p>

        <p>permanent oases, though a tribe of feral halflings controls</p>

        <p>the northernmost stretch of desert.</p>

        <p>The worst aspects of the Barrier Wastes are the lack</p>

        <p>of water, the terrible heat, the bitter cold, and the
        nearconstant</p>

        <p>wind. Oases appear from time to time, but</p>

        <p>travelers shouldn't count on them being in the same</p>

        <p>location from one trip to the next. The few relatively</p>

        <p>permanent springs that exist are under the control of</p>

        <p>either a Bandit State or some other hostile and territorial</p>

        <p>creature.</p>

        <p>While the sun blazes overhead, the land burns.</p>

        <p>Shimmering waves of heat rise off the sand and salt</p>

        <p>flats, making it hot enough to roast travelers who don't</p>

        <p>take precautions like finding shelter from the sizzling</p>

        <p>open spaces. At night, the heat of the day quickly gives</p>

        <p>way to bone-numbing cold, for there's nothing to retain</p>

        <p>warmth in the wastes. As soon as the sun drops below the</p>

        <p>horizon, the temperatures begin to fall. By the time the</p>

        <p>twin moons have reached the highest point in the night</p>

        <p>sky, extreme cold grips the land. Travelers prepared for</p>

        <p>the high temperatures that accompany the daylight hours</p>

        <p>sometimes freeze to death at night, forgetting to carry</p>

        <p>garments to protect them from the cold.</p>

        <p>If the extreme temperatures or the lack of food and water</p>

        <p>don't kill travelers, then the wind is sure to drive them</p>

        <p>mad. It blows out of the west at a regular, steady pace,</p>

        <p>but occasionally powerful gusts roar across the wastes.</p>

        <p>The noise never ends, for in the Barrier Wastes the wind</p>

        <p>is an ever-present, unwelcome companion. Sometimes it</p>

        <p>screams like a thousand dwarf banshees or rumbles with</p>

        <p>the thunder of a hundred rampaging mekillots. On days</p>

        <p>like that, no one can yell above the relentless sound, and</p>

        <p>some say that even the internal voice of a thinker's mind</p>

        <p>can't be heard through the din. The steady wind produces</p>

        <p>a whistle that surrounds travelers. It becomes background</p>

        <p>noise, a persistent song from which there's no escape.</p>

        <p>In addition to the noise, the wind has other aspects</p>

        <p>that make life intolerable. It carries hot, stinging sand on</p>

        <p>its currents that can blind, burn, or even cut unprotected</p>

        <p>travelers. The constant pressure that the wind induces</p>

        <p>on whatever is in its way can be as maddening as the</p>

        <p>noise, and sometimes more dangerous. It rips and tears at</p>

        <p>clothing and equipment, seeking to whisk such items into</p>

        <p>the air stream that blows ever to the east. When the gusts</p>

        <p>become roars, they can lift humans and medium-sized</p>

        <p>animals off the ground and send them tumbling down</p>

        <p>dunes or into a hidden sinkhole. These are called Angry</p>

        <p>Winds, for it's believed that the elementals send them out</p>

        <p>of the west when something displeases them.</p>

        <p>It's a rare moment when no wind breaks the stillness</p>

        <p>of the area. In some respects, this is more frightening</p>

        <p>than the Angry Winds because the sudden silence is so</p>

        <p>jarring. After days or weeks of driving sound, the absence</p>

        <p>of noise can be just as maddening to travelers who aren't</p>

        <p>expecting it. The locals call these periods of quiet Still</p>

        <p>Winds, and they believe that they are omens of bad</p>

        <p>things to come.</p>

        <p>Methods of Travel</p>

        <p>As with most other terrain types, the common ways to</p>

        <p>227</p>

        <p>Beyond the Tyr Region</p>

        <p>get around in the Barrier Wastes boil down to walking</p>

        <p>and riding. See the notes in the Tyr Region for general</p>

        <p>comments. Below are some specific things to watch for in</p>

        <p>the Barrier Wastes.</p>

        <p>The same advice about walking in the Tablelands</p>

        <p>applies here, with some added considerations. Water and</p>

        <p>food are even more scarce in the Barrier Wastes, and the</p>

        <p>distances that might be covered are considerably greater.</p>

        <p>It's imperative that travelers carry more than enough of</p>

        <p>both or they'll never finish their trip. They must also carry</p>

        <p>two types of clothing: one to protect them from the heat,</p>

        <p>sun, and stinging wind of the day; and another to keep</p>

        <p>them warm when the cold of night blankets the land.</p>

        <p>Travelers must be on guard against wind madness, for the</p>

        <p>noise and intrusive brush of air can drive even peaceful</p>

        <p>beings into a killing rage. More than one group has fallen</p>

        <p>to bloody fights inspired by the wind's song.</p>

        <p>Riding is definitely the way to cross the Barrier</p>

        <p>Wastes, but not all mounts handle the wind as well</p>

        <p>as others. Crodlus seem immune to the relentless noise,</p>

        <p>though care must be taken to protect their eyes from</p>

        <p>blowing sand. Kanks react badly to Angry Winds, but</p>

        <p>otherwise are dependable. Mekillots, however, become</p>

        <p>nervous the moment they enter the Barrier Wastes and</p>

        <p>feel the western wind blow across their armored hides.</p>

        <p>Such beasts may make the trip without incident, but</p>

        <p>usually the wind drives them into a deadly rampage that</p>

        <p>often results in their deaths and the deaths of those</p>

        <p>traveling with them. Travelers must remember to carry</p>

        <p>enough supplies for themselves and their mounts.</p>

        <p>The people of the Bandit States employ unique riding</p>

        <p>vehicles for crossing the wastes. Called sail carts, these</p>

        <p>small, wheeled vehicles are made of light materials like</p>

        <p>bone and animal carapaces and carry two human-sized</p>

        <p>passengers. Sails rise above the carts to capture the wind</p>

        <p>and propel the vehicles across the smooth terrain.</p>

        <p>Features of the Barrier Wastes</p>

        <p>Four distinct terrain types make up the Barrier Wastes:</p>

        <p>sandy wastes, salt flats, scrub plains, and mud flats. Each</p>

        <p>is separate and widespread, not intruding on each other's</p>

        <p>territory as in the Tablelands.</p>

        <p>Glowing Desert</p>

        <p>Moving from south to north, the first portion of the</p>

        <p>Barrier Wastes travelers encounter is the sandy wastes of</p>

        <p>the Glowing Desert. This huge, open desert covers the</p>

        <p>largest portion of the Barrier Wastes. Except for its size</p>

        <p>and the low dunes shaped by the constant wind, this</p>

        <p>region of sandy wastes is much the same as the areas to</p>

        <p>the south. Surprisingly, sand storms aren't as prevalent</p>

        <p>here because of the strong wind from the west. Near the</p>

        <p>southeastern edge of the desert, where the west wind meets</p>

        <p>breezes blowing in from the south, the cross-current forms</p>

        <p>billowing walls of sand as thick as those produced by</p>

        <p>the Silt Sea. The Glowing Desert gets its name from a</p>

        <p>strange property of the yellow sand found here. At night,</p>

        <p>the sand glows with a ghostly luminescence as bright as</p>

        <p>starlight and as cold as the night air.</p>

        <p>Salt Flats</p>

        <p>Salt flats make up the northern portion of the Barrier</p>

        <p>Wastes. This area, called the Scorpion Plains, is baked to</p>

        <p>ceramic hardness. Travel here is easy, though great cracks</p>

        <p>occasional block the way. While mostly identical to the</p>

        <p>salt flats of the southern region, the Scorpion Plains have</p>

        <p>two significant differences. First, the area isn't lifeless.</p>

        <p>Insects and small animals are plentiful, living in the</p>

        <p>many cracks that open above mud flats. Here, travelers</p>

        <p>can find a variety of plants that can provide nourishment</p>

        <p>in a pinch. They can also find the creatures that give the</p>

        <p>area its name. A variety of scorpions live here, including</p>

        <p>barbed, gold, and purple scorpions. Second, an occasional</p>

        <p>oasis springs from a crack in the salt plains. Often under</p>

        <p>the control of a Bandit State or a terrible monster, these</p>

        <p>rare pools of fresh water bubbling up from the ground can</p>

        <p>mean the difference between life and death for a thirsty</p>

        <p>traveler.</p>

        <p>Scrub Plains</p>

        <p>Scrub plains can only be found in one place in the</p>

        <p>Barrier Wastes. A great depression has been gouged from</p>

        <p>the center of the Wastes, its sheer cliffs dropping 500 feet</p>

        <p>to a lush bed of scrub plains thriving with a concentration</p>

        <p>of life unlike anywhere else in the area. Called Troll</p>

        <p>Grave Chasm, the depression features beasts both benign</p>

        <p>and malignant, a relative abundance of water, and a</p>

        <p>reputation that gives even the toughest Bandit Lords</p>

        <p>228</p>

        <p>Beyond the Tyr Region</p>

        <p>pause. Otherwise, these scrub plains are identical to those</p>

        <p>that dot the Tyr Region.</p>

        <p>Mud Flat</p>

        <p>Finally, an extensive mud flat fills the very center of</p>

        <p>Troll Grave Chasm. This swamp is even more mysterious</p>

        <p>and legendary than the scrub plains around them. Tales</p>

        <p>proclaim that not all of the terrible creatures called trolls</p>

        <p>were killed during the Cleansing Wars, and some of them</p>

        <p>still live within its dark, moist confines.</p>

        <p>Encounters in the Barrier Wastes</p>

        <p>Any creatures native to the terrain types that make</p>

        <p>up the Barrier Wastes can be encountered within its</p>

        <p>expansive territory. For the most part, though, encounters</p>

        <p>with living things are few and far between. In the southeast</p>

        <p>portion of the Wastes, travelers must contend with raiders</p>

        <p>from the Bandit States. In the northeast, feral desert</p>

        <p>halflings are the worst threat. In the west, the environment</p>

        <p>itself poses the greatest danger, for food, water, and shelter</p>

        <p>become exceedingly scarce the closer one travels to the</p>

        <p>Jagged Cliffs.</p>
