    text:
      format: 1
      content: "<p style=\"margin-bottom:0cm\">Ring, uncommon (requires atunement)</p>\n<p style=\"margin-bottom:0cm\">\_</p>\n<p style=\"margin-bottom:0cm\">The ring has 3 charges and regains all charges after a long rest. While wearing the ring, you can use the charges to:</p>\n<ul>\n<li>\n<p style=\"margin-bottom:0cm\">Spend 1 charge to allow yourself or a creature touched, to use a Hit Dice as if you had a short rest.</p>\n</li>\n<li>\n<p style=\"margin-bottom:0cm\">Spend 1 additional charge to target a creature within 60 feet instead of touch range</p>\n</li>\n<li>\n<p style=\"margin-bottom:0cm\">Spend 1 additional charge to use the ring as a Bonus action instead of a standard action.</p>\n</li>\n</ul>\n<p style=\"margin-bottom:0cm\">\_</p>\n<p style=\"margin-bottom:0cm\">At level 5 the ring becomes more powerful along with the wearer, and gain3 extra charges</p>\n<p style=\"margin-bottom:0cm\">At level 10 the gains power again, and allows you to spend 2 Hit Dice per use.</p>"
