      content: "<p>To the north, the Dragon’s Bowl slopes down toward a verdant belt surrounding a pristine lake. Lake Pit, one ofthe largest bodies ofwater in the Tyr Region, teems with fish and wildlife. The lake’s isolation contributes to its unspoiled character, but the area also lies under the protection of a powerful druid, the aged mul Enola. He allies with wrathful elemen tals that tolerate no trespass in these guarded lands.</p>\n<p>\_</p>\n<p>Lost Samarthia: Legends speak of a lost city somewhere in the Dragon’s Bowl—a fantastic hidden place known as Samarthia. According to varying stories, Samarthia is a buried ancient citadel filled with the sorcerous science that prevailed in the civilizations of those ancient days, or a city of geniekind or rakshasas concealed by mirage. Many treasure-seekers searching for Lost Samarthia have disappeared in the area, never to be heard from again.</p>"
