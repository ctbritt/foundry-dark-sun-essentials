      content: >-
        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">In
        the wastelands east of the Mekillot Mountains blooms a desert rose. The
        village of Alador was founded by a templar who in a rare moment of
        insight discovered compassion for those who toiled under him. Those
        slaves he freed have created a new life for themselves in Alador.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Origin/History</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Alador
        is a slave village founded about eight years before the downfall of
        Kalak. The founder, a formerly ruthless Tyr templar named Micayon, was
        charged with the task of transporting a caravan of slaves from Balic to
        Tyr for the construction of Kalak’s great ziggurat. Leading a routine
        reconnaissance patrol, Micayon stumbled across a half-dozen ruined
        merchant wagons. Investigating further, Micayon discovered an unusually
        large band of belgoi responsible for the attack. They were holding the
        survivors as prisoners. Thinking to add the prisoners to his slave
        caravan, Micayon ambushed the belgoi while they were preoccupied,
        arguing over how to divide a small human baby for the evening meal. The
        battle was fought over the child’s hoarse, pathetic cries.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">The
        belgoi defeated, Micayon picked up the infant and its crying stopped.
        The baby fixed its eyes on the templar and suddenly Micayon’s wild
        talent, Empathy, awakened. He felt a flood of emotion from the infant.
        Intense love…for him. Micayon’s mind reeled from the impact. When he
        returned to the caravan, he was assaulted by the misery and hatred of
        the slaves. He wanted this torrent of emotion to stop. One way he knew
        how to stop it was to end their suffering, by freeing the slaves.
        Micayon led a slave revolt against the other templars and guards of the
        caravan and diverted his caravan far from Tyr. The templar settled the
        slaves at the base of a tall, isolated plateau where he discovered an
        oasis that was nearly invisible from a distance. The village has grown
        from the original 168 slaves to a current population numbering over 300
        individuals. Almost half of these are under the age of 20 and are
        children of the original slaves.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Location</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">The
        major part of the village is positioned in the shade of an enormous and
        jagged outcrop of stone that juts out of the desert sands. This outcrop
        of stone is located roughly 30 miles east of Gulg where the stony
        barrens meets the rocky badlands, about 10 miles away from the main road
        from Altaruk to Gulg.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">The
        top of the outcropping is level and can easily hold several hundred
        people. From a bird’s eye view, this “plateau” is bean-shaped. It
        slightly hugs around the oasis. Due to this position, Alador receives
        only half the usual amount of sunlight during the day. In addition, the
        environment is always cool and the wind calm since the outcrop shields
        the village from winds and sandstorms.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">The
        oasis can comfortably support a population of about 800-900 people. As
        the population increases, the villagers construct buildings of adobe
        that scale the side of the plateau, and that are accessible through a
        system of ladders.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Among
        the places of interest are the Desert Rose, which serves as the inn and
        general store. Loralune’s Medicines Charms &amp; Trinkets is run by the
        chief midwife and medicine woman. The Ten Blades is the village’s finest
        weapons and armor store. ‘Zana’s Livestock raises erdlu, pack animals,
        mounts, and war mounts. Finally, at the top of the plateau, the village
        maintains a sentry post where the sun priest, Sol Hokat, keeps his
        shrine.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Organization</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">A
        council of former slaves headed by Micayon governs Alador. Meetings are
        chaotic affairs and usually degenerate into loud arguments. All meetings
        are conducted in the village tavern, the Desert Rose. All villagers are
        free to attend and participate. When Alador is attacked, the villagers
        defend themselves at the walls built around the oasis. If that fails,
        they will gather all the supplies possible and ascend the plateau to
        make a stand.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Outside
        Relations</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">The
        village is somewhat isolated. It doesn’t hide its existence, but neither
        does it encourage visitors. Outsiders are allowed to pass through and
        stay for a short while, but they are never allowed to settle
        permanently, not even escaped slaves. Only in special cases, such as
        marriage, are outsiders allowed to remain. The village may also invite
        outsiders with special needed skills to live there.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Woods
        and skins are imported from Gulg, obsidian from Urik, small amounts of
        iron from Tyr, and diverse foodstuffs from several locations, mostly
        Altaruk. The main exports include clay bricks, surplus food, sculpted
        figurines, fetishes, and most importantly, weapons fashioned from the
        imported materials. Over the past five years, Alador has become a
        clandestine weapons market. Outlaw groups that may not be able to openly
        purchase large quantities of weapons in the citystates can purchase them
        here; no questions asked. These include raiders, slaves, thri-kreen,
        numerous elven tribes, gith, and sometimes the Veiled Alliance. They
        also cater to legitimate concerns (such as merchant houses) that do not
        wish to draw attention to the fact that they are stockpiling
        weapons.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">A
        third of the population is trained in weaponsmithing and armoring. At
        any given time, several agents or personalities (sometimes in disguise)
        from various groups and city-states may be in Alador with their
        bodyguards. Templars and warriors who are in the market for quality
        weapons may also be here. The floating population typically numbers
        around 40-50 people. Woe to any defiler who sneaks inside. If caught,
        defilers (and preservers) are executed.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Having
        suffered from lightning fast raids in the past, the village requires all
        able-bodied adults to carry weapons and train regularly in the militia.
        Primary dangers to Alador are ironically potential customers: raiders.
        Humans, gith, elves, thri-kreen and giants have all attacked the village
        in its weaker,early history. Alador immediately ceases trade with any
        groups that attack it. Raiders will discover that their rivals receive
        excellent weapon deals. Consequently, the number of raids is steadily
        declining.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Important
