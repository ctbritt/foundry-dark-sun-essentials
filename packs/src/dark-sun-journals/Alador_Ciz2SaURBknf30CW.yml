        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Zamora
        is a middle-aged woman about 44 years old. She stands 5’9” tall with
        black hair and violet eyes. She is the innkeeper of the Desert Rose, a
        rather large tavern and inn (often the whole village will congregate
        there). She maintains a general store off to the side of the Rose and
        serves on the village council. A former slave, she had been arrested for
        being a witch, and was sold to Micayon to be used as slave labor on the
        Tyrean Ziggurat. Despite her good standing, if the village folk ever
        discovered she was a mage, she could be chased out by a mob. Some
        villagers suspect her, such as Loralune. Micayon keeps her secret and
        quietly discourages the idea of her being a mage if it ever comes up.
        She has no contacts with any Veiled Alliance. She enjoys singing for the
        villagers, telling stories, and giving sweets to children; especially
        since this wins goodwill in the village and on the council. Weekly
        dances are held at her tavern. Zamora offers traveling minstrels free
        room and board <span
        style="font-size:11pt;text-decoration-line:inherit">plus tips for every
        night they perform at her venue. She often </span>sits with them at the
        dinner table and exchanges stories. She recently convinced the villagers
        to hire a mindbender (a psionicist) to act as healer, diviner, advisor,
        and to help train the militia wild talents. If the villagers find
        someone suitable they will offer room, board, and a small income.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
