        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">This
        is the infant that Micayon rescued from the belgoi. He is a strong youth
        about 19 years old, brown hair, black eyes. Mikastor is eager to leave
        the village and intends to hire himself out to any good employer. He is
        militia trained, but wishes to complete his training as one of the
        legendary warriors of the waste (a ranger). So far, he has met no one
        qualified to teach him. Despite his youth, Mikastor is quite competent.
        He can read, write, and perform mathematical calculations. He can
        survive in the desert and locate water. He is quite capable of serving
        as a weapons-bearer, or he can serve as a shield-bearer to protect
        spellcasters and psionicists. If equipped with a polearm, he can take
        occasional pokes at the enemy from behind the melee line. Also, he can
        serve as a lookout, spotting new approaching dangers whenever his
        companions are caught up in an intense battle.</p>

