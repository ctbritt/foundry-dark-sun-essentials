        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">PLAYER’S
        OPTION: MTHACO 17, MAC 8</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Lamorion
        is a middle-aged dwarf with a sharp tongue. He stands 5’ tall and is
        quite dusky with coal black eyes. He runs the Ten Blades for the
        village, manned by at least 30 men and women aides. Lamorion has created
        a comfortable life for his family here. He is the chief weaponsmith,
        armorer, and bowyer/fletcher. He has trained about a third of the
        villagers to help fulfill the contracts that Micayon negotiates. This
        dwarf was one of the most valuable slaves that Micayon was carrying in
        the slave caravan to Tyr. Lamorion hails from a long line of dwarven
        weaponsmith slaves. His focus and passion is to develop new weapons. He
        can be hired to create almost any unusual and uncommon weapons and armor
        (such as from the Gladiator’s Handbook) all at premium prices and only
        if the necessary materials are available. Such is his skill that 1-2
        weapons of quality can be found in his store at any given time; usually
        made of bone, wood, or obsidian. These weapons grant a +1 to hit OR to
        damage, but not both. They sell for 2-5 times the normal price. Lamorion
        can finish any weapon or armor project (but not a weapon of quality) in
        half the time it takes anyone else. In short, he is profoundly focused
        and is a master of his craft.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Lamorion
        is also extremely rude. He will miss no opportunities to ridicule other
        people over their weapons and armaments (“I’ve never seen such a piece
        of crap!”) unless he crafted them personally, no matter what their
        actual quality, even if they’re steel or magical. Lamorion is polite
        only when he wants something. What does he want? Lamorion loves to ask
        warriors to “try out” his new weapons. (“Those monsters will never know
        what hit ‘em!”) Micayon has (wisely) declined all of the dwarf’s offers
        to outfit the village militia with his “modern” weapons and this
        frustrates Lamorion to no end. During council meetings, Lamorion’s
        contribution when discussing any threat to the village is always
        inevitably the same (“We need new weapons!”).</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Almost
        without fail, he will approach visiting warriors. Unfortunately, 90% of
        his new weapons tend to be impractical and/or malfunction. Some are so
        bizarre that even gladiators sometimes cannot figure out how to use
        them. In particular, Lamorion wants to perfect his spring loaded spears
        tips and sword blades that shoot off at the hilt guard. If only he can
        find some warriors to try them out…</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Lamorion
        is occasionally hired by psionicists and templars who wish to empower
        weapons and armor. His skill is more than adequate to help them.
        However, it depresses him if he is asked to use his skills to make
        anything “normal” (“Hohum… another sword and spear.”). He constantly
        pressures his clients to apply their power to something “innovative.”
        Unless he is under strict supervision, Lamorion occasionally takes
        liberties with the projects of minor clients and builds “improvements”
        into them without telling them. Contracts for Lamorion’s personal work
        is constantly back- ordered. He demands payment up front (for materials)
        and some clients have to wait up to two years. Steel weapons of quality
        can go up to 20 times the normal cost. It is rumored that House Wavir
        wants him back badly.</p>

