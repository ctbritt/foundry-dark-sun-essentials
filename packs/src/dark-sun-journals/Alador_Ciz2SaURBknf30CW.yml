        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Attack/
        Defense Modes: none / MB, IF, TW</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">PLAYER’S
        OPTION: MTHACO 16, MAC 5</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Micayon
        is 54 years old. He stands 6’3” tall with graying black hair, and
        steel-gray eyes. His beard and mustache are always well groomed and he
        affords the best clothing his income allows. Micayon looks back on his
        templar years with nostalgia. He is very much a man of creature comforts
        with a taste for wielding power. He keeps his Tyr templar uniform and
        armor in good repair. Micayon struggles with a habit of assuming
        authority and is uncomfortable in the freewheeling governmental style of
        Alador. The other villagers view him with amusement; a bureaucrat forced
        to be a commoner. He is highly arrogant, but principled and cultured.
        Being the one of the handful of villagers who can read and write , he is
        the primary negotiator for the village. He also performs the same
        functions for Alador that he performed in Tyr: an administrator and an
        accountant.</p>

