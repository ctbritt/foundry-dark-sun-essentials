        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Granted
        Powers: Minor resistance to sun light, enhanced saving throws (+2 vs.
        sun, heat, or fire), ignore sunlight (11 rounds), gate in a beam of
        sunlight. * For those without access to Earth, Air, Fire, and Water
        accessory, substitute the fire sphere.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Sol
        Hokat is an old man, long driven crazy by his devotions to the sun
        lords. Living at the top of the plateau (his <span
        style="font-size:11pt;text-decoration-line:inherit">shrine), he often
        stares down angrily upon the villagers </span>(“Heretics, all of
        them!”). Being a sun priest, he believes that living in the shade is
        blasphemy. He is constantly scheming how to give the villagers more sun
        exposure, so they can receive its “blessings” (“I’ll blow up the
        mountain someday!”). The village regularly sends sentries to the top of
        the plateau to watch the horizons for approaching danger. These
        unfortunate soldiers are forced to listen to endless hours of sermons.
        Villagers see Sol Hokat as harmless. Ultimately though, they may be
        wrong.</p>
