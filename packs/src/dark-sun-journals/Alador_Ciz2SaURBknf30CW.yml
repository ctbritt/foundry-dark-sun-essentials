        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">PLAYER’S
        OPTION: MAC 9</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Nyneva
        is a barmaid at the Desert Rose. The Dragon destroyed Nyneva’s elf tribe
        two decades ago and she was orphaned. Later, she was mysteriously found
        on Zamora’s doorstep. The good-hearted half-elf woman adopted her.
        Nyneva is now a beautiful maiden, who stands 5’10” with amber hair and
        silver eyes. Now 20 years old, her elven blood sings to her to wander
        the world and, like Mikastor, she is getting desperate to leave the
        village.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="margin-top:12px;margin-bottom:0px;box-sizing:border-box;font-variant-ligatures:none;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Nyneva
        is Zamora’s secret apprentice, both in sorcery and the thieving arts. In
        addition, her militia training has given her excellent fighting skills.
        The time is fast approaching when she will become a full-fledged
        fighter/ preserver/ thief. When that time arrives, she will leave
        Alador. She feels intimidated by elven tribes and is extremely insecure
        as to how they might view her; an elf raised by humans. She tends to go
        too far in trying to win their approval, particularly elven males. She
        has yet to learn that most elves simply don’t care about her or anyone
        else outside their tribe. Only Zamora’s watchful eye prevents her from
        being taken advantage of. The inn mistress deeply wishes that Nyneva
        would display better judgement, but she realizes that for some people
        the best teacher is the “school of hard knocks.”</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
