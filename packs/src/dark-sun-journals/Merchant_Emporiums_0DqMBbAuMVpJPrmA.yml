      content: "<p>The Dynastic Merchant Houses</p>\n<p>The oba determines the outside influence of foreign cities and</p>\n<p>cultures on her people by completely controlling all trade with</p>\n<p>outside merchants. The dynastic merchant houses negotiate</p>\n<p>all trade directly with the oba\x92s templars. The templars trade</p>\n<p>cloth, spices and livestock collected as taxes from the citizens</p>\n<p>and client villages, as well as surplus production from the city\x92s</p>\n<p>slaves. They primarily seek gold, silver and iron for the oba,</p>\n<p>who uses these goods to equip her army.</p>\n<p>The merchant houses may not trade directly with the public.</p>\n<p>Their emporiums exist solely to negotiate deals with the</p>\n<p>templars. The emporiums are smaller than those in other citystates</p>\n<p>and are not built to lavishly display goods. They are used</p>\n<p>to administer house operations and make presentations to the</p>\n<p>templars. The city keeps huge thatch storehouses where house</p>\n<p>agents may purchase goods from the oba.</p>\n<p>Every individual or caravan passing through the city gates</p>\n<p>must declare every carried item. Consequently, most merchant</p>\n<p>houses bring only a few samples into the city, and negotiate a</p>\n<p>deal with the templars before bothering to unload a caravan.</p>\n<p>The merchant houses have all established camps outside the</p>\n<p>city where they can conduct business freely with travelers.</p>\n<p>House Inika</p>\n<p>House Inika is the largest of the dynastic merchant houses to</p>\n<p>base its operations in Gulg. It is, however, small by the standards</p>\n<p>of the other major houses of the Tyr region. Taking its</p>\n<p>style from House Riben of Gulg, Inika keeps its caravans small</p>\n<p>and its profits high. Inika was established only 300 years ago</p>\n<p>when a trusted agent of House Riben left to start his own</p>\n<p>enterprise. After a rocky start, the small house established</p>\n<p>itself as a shrewd competitor with an efficient, streamlined</p>\n<p>operation. It may have been the oba\x92s intolerance for the opulent</p>\n<p>display and bellicose rivalries of the foreign houses that</p>\n<p>helped Inika establish itself. Its success soon eclipsed House</p>\n<p>Riben, whose fortunes dwindled over the centuries.</p>\n<p>House Riben eventually neared financial collapse and, in</p>\n<p>an uncharacteristic manner, turned to the oba for financial</p>\n<p>assistance. The queen bought the facilities of the house and</p>\n<p>continues to use them today as her own trade storehouses. The</p>\n<p>family withdrew from mercantile endeavors, but a templar</p>\n<p>from the Riben family still heads the oba\x92s trade operations.</p>\n<p>House Inika has a unique advantage over foreign competitors</p>\n<p>in Gulg. It is the only trading house that has a thorough</p>\n<p>understanding of Gulg culture. Because of the expertise of its</p>\n<p>native employees, Inika is generally able to negotiate better</p>\n<p>terms with the templars for export goods than are its rivals. (See</p>\n<p>the Dune Trader accessory for more about House Inika.)</p>"
