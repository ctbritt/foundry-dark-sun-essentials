      content: >-
        <div class="CjVfdc"
        style="box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative"><span
        style="box-sizing:border-box;font-family:Lato"><span
        style="font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box">King’s
        Gardens:</span></span></div>

        <h2 id="h.ggp39hl2ebsk_l" class="CDt4Ke zfr3Q JYVBee" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato,
        sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap"
        tabindex="-1"></h2>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">The
        King's Gardens consist of three lush, wooded sections of land. One
        garden lies on each side of the High Bureaus. The third encircles the
        Golden Tower like a small park, the rows of trees and bushes maintained
        in precise circles about the tower. In the past, these gardens served as
        a fuel reserve to power Kalak's defiling magics. Now, they grow
        undisturbed by spellcasters. The templars still service the arboreums
        while the Council debates future uses for the gardens. Access to the
        gardens can be gained through doors in the barbican tower adjoining the
        central garden or through heavily locked and trapped doors on the
        interior walls of the complex adjacent to the perimeter gardens.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Only
        the garden templars under the leadership of the Master of the Gardens, a
        half-elf templar named Dafna, Senior Templar Timor, and the King possess
        keys to the doors. Anyone else caught in the gardens without express
        permission of one of the parties above faces a sentence of hard labor in
        the iron mine. Rumors persist that someone has planted one or more
        magical fruit trees in the gardens. This may well be the case, for the
        gardens contain many wondrous plants, including several trees of
        life.</p>
