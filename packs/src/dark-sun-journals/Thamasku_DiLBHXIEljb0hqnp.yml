      content: "<p>The streets bustle with harried shoppers, merchants, and lawkeepers. A long-legged</p>\n<p>dhev-sahr carries two males wearing life-shaper grafts through the crowd, its normally</p>\n<p>rapid pace hindered by the thick swarm of people. The shapers should have known not</p>\n<p>to try to cross the city at midday.</p>\n<p>A heady odor of life fills the city, despite the most sophisticated waste disposal system</p>\n<p>of all rhul-thaun settlements (and probably all of Athas). Certain areas of the city</p>\n<p>are overcrowded, and the life-shapers are constantly occupied growing new buildings</p>\n<p>and elevating existing ones, raising the wealthier upper classes higher above the noise</p>\n<p>and smell of the lower city.</p>\n<p>Spires and towers reach up to the hazy sky, and the summit of the tallest of them</p>\n<p>allows one to see all the way across Ghavin Lake. Even the smaller towers give a clear</p>\n<p>view of the caravans going in and out of the forest that surrounds the city and the lake.</p>\n<p>A Windrider’s Chronicle</p>\n<p>Thamasku is the single exception to many rhul-thaun rules. While most halfling communities</p>\n<p>are villages on the ledges and in the crevices along the cliff side, Thamasku is</p>\n<p>a bustling city of 12,000 inhabitants, on a lake in the middle of a forest.</p>\n<p>The city was built in the center of a large ledge, carved out of the side of the cliffs by</p>\n<p>tidal waters when the world was young. This shelf stretches back 80 miles from the</p>\n<p>edge of the cliff, and most of it is covered with large, hardwood trees and thick foliage.</p>\n<p>Runoff from the tablelands to the east collects in Ghavin Lake, a body of clear, fresh</p>\n<p>water almost 20 miles across. A wide river runs from the lake to the cliff’s edge, then</p>\n<p>crashes over the side, creating what the largest and most dramatic waterfall on Athas.</p>\n<p>The waterfall empties into the swamp at the bottom of the cliffs, contributing to the rising</p>\n<p>wall of mist.</p>\n<p>Thamasku is extremely ancient, built before the rhul-thaun existed as a separate</p>\n<p>group—when the rhulisti ruled the world. The name Thamasku is an ancient rhulisti</p>\n<p>word. Indeed, so archaic is that name that its actual meaning is lost. Scholars are fairly</p>\n<p>sure it has something to do with great altitude. Since those long-lost days, halflings</p>\n<p>who have taken advantage both of the lake and the surrounding forest have occupied</p>\n<p>the city.</p>\n<p>Thamasku actually has a few buildings made of stone and wood, in addition to the</p>\n<p>organically grown towers that fill most of its streets. The halflings ply the waters of</p>\n<p>Ghavin Lake with boats made of wood, since the ability to create life-shaped water</p>\n<p>craft is now a lost art. They catch fish in organic trap-nets, providing a delicacy virtually</p>\n<p>unknown to the rest of the halflings of the Jagged Cliffs.</p>\n<p>The city is also unusual in its horizontal nature. The effects of living on cliff ledges</p>\n<p>that influence other rhul-thaun are not in evidence here. Climbers are few, though</p>\n<p>there are many of them in Sol-fehn at the top of the falls. There are a few in Thamasku,</p>\n<p>however, who scale the cliffs up to the edge of the Tablelands.</p>\n<p>The city’s life-shapers use their skills to make running creatures called dhev-sahr and</p>\n<p>the halflings use them as mounts to travel through the forest and the green. Dhev-sahr</p>\n<p>are of little use anywhere else in the Jagged Cliffs.</p>\n<p>Thamasku is more spread out and more horizontal in its orientation than any of the</p>\n<p>other halfling communities. The towers and spires common to all settlements are there,</p>\n<p>but so are single-story buildings, long and wide, primarily used as store houses on the</p>\n<p>edge of the city. Given the proportions of normal halfling communities, Thamasku</p>\n<p>should cover only half of the land it does and stand over twice as high. Given the limitations</p>\n<p>of even the amazing life-shaped building materials, this would be a physical</p>\n<p>impossibility—one that will always prevent the villages of the ledges from getting substantially</p>\n<p>larger than they are at present.</p>\n<p>Leadership and Political Organization</p>\n<p>The position of city administrator of Thamasku is one of the most politically powerful</p>\n<p>appointments anyone can possibly hope to hold. Currently, Vher-asach (haf/T10/LN),</p>\n<p>the young but capable daughter of the former administrator holds the office. The har-</p>\n<p>etuil actually nominated her to the position only as a tribute to her dead mother, who</p>\n<p>served the city well. They expected that she would remain only a short while, and then</p>\n<p>a more experienced person would be chosen to replace her. However, Vher-asach is</p>\n<p>more than competent in the job, and it appears that she will continue as administrator</p>\n<p>for the foreseeable future.</p>\n<p>Nowhere in the Jagged Cliffs is clan affiliation as significant as it is in this city. There</p>\n<p>are 28 different clans in Thamasku, and 37 har-etuil who serve and govern them. This</p>\n<p>is far more than in any other rhul-thaun community, but overall, the numbers do not</p>\n<p>present problems. Occasionally there are periods of clan strife, when one clan is</p>\n<p>offended or somehow challenged by another, but these are usually settled peacefully.</p>\n<p>The life-shapers, who are called life-masters here, wield a great deal of political</p>\n<p>power and influence in Thamasku. Despite the fact that woodsmen bring in timber to</p>\n<p>use as an alternate building material, and hunters and gatherers use the nearby forests</p>\n<p>to provide more food and herbs than in other rhul-thaun communities, the life-shapers</p>\n<p>are kept busy meeting the needs of the city’s huge population. Vher-asach learned from</p>\n<p>her mother long ago of the importance of the shapers, and almost always bows to their</p>\n<p>wishes. In return, however, her shrewd dealings with the wealthy life-masters have garnered</p>\n<p>enough money and life-shaped creations to provide the city with conveniences</p>\n<p>and necessities the government otherwise might not have been able to grant.</p>\n<p>A secret guild of thieves and assassins, known as the ban-ghesh (dark wisdom), also</p>\n<p>has some political clout in Thamasku. Their wealth allows them to pay off the authorities,</p>\n<p>giving them virtually total control over some of the lower parts of the city. In</p>\n<p>Thamasku, wealth speaks with power and influence.</p>\n<p>Sol-fehn, at the top of the waterfall created by the river flowing from Ghavin Lake, is</p>\n<p>virtually an outlying quarter of Thamasku. It is a small village, with a population of less</p>\n<p>than 300 people, all of whom make their living in the transport of cargo, people, or</p>\n<p>information to and from Thamasku. Sol-fehn serves as a connection to the rest of the</p>\n<p>rhul-thaunian society. Its administrator, Rath-omak (ham/F5/LN), answers directly to</p>\n<p>Vher-asach. He does whatever the administrator of Thamasku tells him to do.</p>\n<p>Moreover, the village is primarily populated by members of two clans that chiefly</p>\n<p>reside in the larger city, so this village does not even have its own har-etuil.</p>\n<p>Economics</p>\n<p>Because wealth is more important than anything else in this city of commerce, everyone</p>\n<p>is deeply involved in economics and trade. Because of the city’s unique location,</p>\n<p>products such as fish and woodcrafted articles are among some of the items available</p>\n<p>here that cannot be purchased in other communities. At the same time, however, there</p>\n<p>is little call for these items elsewhere, so there are virtually no exports to the other</p>\n<p>communities of the cliffs.</p>\n<p>The exception to this is the village Sol-fehn, to which Thamasku sends food, lifeshaped</p>\n<p>creations, and various goods that the smaller community does not produce.</p>\n<p>Sol-fehn is almost solely involved in transportation and related occupations, making it</p>\n<p>the hub of travel and transport between Thamasku and other locales.</p>\n<p>Within Thamasku itself, there are three marketplaces where various merchants sell</p>\n<p>their wares. Although created as a convenience, so that everyone in the city would be</p>\n<p>close to a market, each of the three has taken on a distinctive flavor and style. The</p>\n<p>southern market, also known as the fish market, primarily sells fresh fish and other</p>\n<p>foodstuffs. Though the other two marketplaces do sell provisions, the freshest, best</p>\n<p>quality items are found here. The western market is controlled almost completely by</p>\n<p>life-masters. The merchants here sell life-shaped creations of every description to all</p>\n<p>who need them. The eastern market is a craft faire. Artwork, woodcrafts, stonework,</p>\n<p>pottery, and other crafted items and supplies are found in great numbers. No finer merchandise</p>\n<p>of this kind can be found anywhere on the cliffs.</p>\n<p>The whole eastern district of Sol-fehn is called the Art Quarter, and it is filled with</p>\n<p>galleries, studios, theaters, and related businesses. There are few centers of culture in</p>\n<p>all of Athas that can rival the talents found here.</p>\n<p>Many of the halflings who travel to the city eventually end up deciding to live here,</p>\n<p>prompting the saying that you can take the villager out of the heart of Thamasku, but</p>\n<p>you can’t take Thamasku out of the heart of the villager.</p>\n<p>Most of those who come to the city seek recreation, dining, and living opportunities</p>\n<p>that exist nowhere else. Others, however, have a very different reaction. They believe</p>\n<p>that “stout and hearty” folk live only on the ledges. The lives of “true rhul-thaun” should</p>\n<p>be spent in the cloying mists and blustering winds of the ledges, clinging to the cliff</p>\n<p>faces that they call home, carving out their lives with bare hands. They view their city</p>\n<p>cousins with great disdain, sometimes calling them “shaped rhul-thaun.”</p>\n<p>And some who come to Thamasku from the villages find the city too exposed, too spacious.</p>\n<p>The villagers are used to the secluded, protected ledges of the cliffs. The fact that the</p>\n<p>city is in the center of a green, flat expanse of land is disorienting and frightening to them.</p>\n<p>\_</p>\n<p><img src=\"data:image/png;base64,\" width=\"687\" height=\"1282\" /></p>\n<p>The People</p>\n<p>Thamasku is the center of rhul-thaun society. The wealthiest rhul-thaun live in this city,</p>\n<p>although there are plenty of common and poor folk within its confines as well.</p>\n<p>The people of Thamasku find themselves spending less time struggling to survive than</p>\n<p>most other rhul-thaun, less in fact than most of Athas’s inhabitants. The city’s size reduces</p>\n<p>the risk of monster attacks, provides a vast range of conveniences and services, and generally</p>\n<p>means that citizens have better access to health care and finer food. Life-shaped</p>\n<p>engines pump water from the lake into the city, bringing it indoors to every home and</p>\n<p>building. The life-masters have also set up an incredible waste disposal system with underground</p>\n<p>conduits, regulated by organic water-pumping engines, and life-shaped disposal</p>\n<p>units that consume trash and all manner of wastes. The city’s systems of water delivery and</p>\n<p>garbage elimination makes Thamasku a clean and comfortable place in which to live.</p>\n<p>Because the people of Thamasku have a great deal of leisure time, theater and the arts</p>\n<p>are more prevalent here than in other communities. Music and the artistic expression</p>\n<p>are important to all rhul-thaun, but here in Thamasku they are taken to new heights.</p>\n<p>Fantastic galleries, theaters, and music halls line the Art Quarter. Dancing, music, visual</p>\n<p>arts, theater, tale-telling, and other performance arts are all practiced here. Young and</p>\n<p>old, rich and poor, life-master and city laborers find entertainments and amusements to</p>\n<p>suit their tastes. Poets, songwriters, composers, artists, and performers can make their</p>\n<p>livelihood creating art and diversions for the people of the city. In Thamasku, the arts are</p>\n<p>not idle pastimes, but rather big businesses.</p>\n<p>Places of Note</p>\n<p>The Air Temple: The largest of the rare temples of the rhul-thaun, the air temple is in the</p>\n<p>lofty reaches of the city’s sprawling towers. This temple is the home and base of operations</p>\n<p>of over a dozen priests (13 ham &amp; haf/P1-6/NG). Thim-obec leads the temple</p>\n<p>(ham/P12/NG). The few devout followers in the city come here to pay their respects, but</p>\n<p>this priest’s real duty is to the windriders.</p>\n<p>The air temple serves as a place where windriders can find berths for their mounts to</p>\n<p>roost and be cared for as well as free food and lodging for their flyers and themselves.</p>\n<p>The priests feel that windriding is the best technique of truly communing with the great</p>\n<p>power of elemental air, and therefore windriders are holy men to be respected. Ironically,</p>\n<p>none of the priests are windriders themselves—they see their own role as caretakers.</p>\n<p>Air priests have little interaction with the rest of the community. The temple takes no</p>\n<p>official interest in politics, community action, or any of the events that develop within</p>\n<p>the city.</p>\n<p>The Aviary: This tall tower is home to the hundreds of birds that fly about the city, and</p>\n<p>of the strange individual known only as the Birdmaster. The tower is designed so that</p>\n<p>there is room for even large flying creatures to land and roost. For this reason, it is occasionally</p>\n<p>used by windriders who come to the city. The Birdmaster (ham/D16/N) favors</p>\n<p>windriders, charging them no fees to use his roosts.</p>\n<p>The Birdmaster is a druid of great power who, unlike others of his profession, concerns</p>\n<p>himself with the activities of a city. He watches over events in Thamasku, communicating</p>\n<p>with his birds psionically. They are his eyes and ears, and no one in all of</p>\n<p>Thamasku knows more about the comings and goings of the city’s populace or of the</p>\n<p>things they do in secret.</p>\n<p>Cal-adek’s Safehome: This tavern is well-known throughout the city as the meeting</p>\n<p>place for warriors, mercenaries, and adventurers. It is also a place where spies, thieves,</p>\n<p>and even killers can be hired to perform less-than-legal assignments. Cal-adek</p>\n<p>(haf/F8/N) asks no questions of her customers, she simply demands that everyone “keep</p>\n<p>a peaceful head about them while they stay here.” Wise customers heed this simple</p>\n<p>request, for Cal-adek has a fair amount of hired muscle herself (8 ham/F5/N).</p>\n<p>Whispers say that Cal-adek is involved in the criminal underworld of Thamasku.</p>\n<p>Others claim that she harbors members of the Chahn. Neither of these rumors is true,</p>\n<p>although at times she can be convinced to finance potentially profitable operations—the</p>\n<p>legal status of these endeavors is irrelevant to her.</p>\n<p>The Conclave: This grand structure is the meeting place of the har-etuil when they</p>\n<p>gather to make laws and pass judgement on matters concerning all rhul-thaun. Although</p>\n<p>vacant more often than it is used, a small contingent of professional warriors (20 ham &amp;</p>\n<p>haf/F4/LG) are permanently stationed here to guard the structure, preserve its appearance,</p>\n<p>and maintain it.</p>\n<p>The Mirrored Host: This tavern is an upscale safehome for those wishing a luxurious</p>\n<p>night’s stay or an elegant meal. Mirrors, which are uncommon among these halflings,</p>\n<p>cover many of the interior walls, giving this place its name.</p>\n<p>The cost of a night’s stay is 25 ghav-egoths, meals are 5 ge.</p>\n<p>Nuhl-ameth Storehouse: This is one of many storehouses on the outskirts of the city. It</p>\n<p>is also the secret headquarters of the Chahn, the terrorist organization that wants to</p>\n<p>overthrow and transform rhul-thaun society.</p>\n<p>A secret entrance in the main storage area leads to an underground labyrinthine, the</p>\n<p>lair of these desperate terrorists. From here they launch attacks upon the vher-elus, the</p>\n<p>Conclave, and even life-shapers traveling in the city. Their strikes are swift and of limited</p>\n<p>effect—they want to make a statement rather than inflict actual damage. The Chahn are</p>\n<p>careful not to allow themselves to be followed back to their base, and have successfully</p>\n<p>used it as their headquarters for more than a year.</p>\n<p>At least 50 members use this secret stronghold, including the Chahn’s leader, Col-olin</p>\n<p>(ham/T12/CN). Col-olin is a small, angry halfling crossed too many times by the authorities.</p>\n<p>He seeks destruction on a large scale, though he possesses a conscience that sometimes</p>\n<p>gets in the way of his passionate, devastating plots.</p>\n<p>Poets’ Rest: This safehome, located in the Art Quarter, is frequented by artists and performers</p>\n<p>of all kinds. The place is inexpensive and the food is of poor quality, but its</p>\n<p>patrons keep coming back for the atmosphere of the place.</p>\n<p>Sanctuary of Thamasku: Besides its status as the largest life-shaper sanctuary, this structure’s</p>\n<p>unique feature is its location. It is underwater, submerged in Ghaven Lake, with</p>\n<p>secret entrances and exits throughout the city, connected by tunnels under the earth.</p>\n<p>The sanctuary lies at a depth of about 300 feet. Shaped like a mushroom, the sanctuary’s</p>\n<p>domed main structure narrows beneath it to form a base that is set into the lake’s</p>\n<p>floor. The structure is alive, of course, and its gill system exchanges and filters oxygen</p>\n<p>and hydrogen out of the water, converting the elements to a gas that provides a livable</p>\n<p>atmosphere for those who live and work inside. Over 150 life-masters work here, producing</p>\n<p>organic creations at a feverish pace to try to keep up with the city’s needs.</p>\n<p>Loi Far-oneth (ham/F12/LG), the master of all life-shapers, lives and works here. He is</p>\n<p>a man consumed with the past, its preservation, and its effects on the present and</p>\n<p>future. His chief adjutant is a Gil-ogres (ham/T12/LE), who is subtly manipulating events</p>\n<p>to gain personal power. When the har-etuil convenes in Conclave, it is not Loi whose</p>\n<p>name is spoken in fearful whispers—it is Gil-ogres. Loi seems unaware of his lieutenant’s</p>\n<p>secret control of the organization, so preoccupied is he in scholarly pursuits.</p>\n<p>In Thamasku, Gil-ogres’s plans are simple. The life-shapers’ dominion over the buildings,</p>\n<p>tools and other shaped articles gives them nearly complete economic control of</p>\n<p>the city. The only area where they do not have actual mastery is the city’s entertainment</p>\n<p>business. To this end, Gil-ogres is sending agents into the Ban-ghesh Guild. He wants to</p>\n<p>infiltrate the organization and take it over from the inside, thus adding their resources to</p>\n<p>his own. The guild has the strongest hold upon the entertainment district.</p>\n<p>The sanctuary is also the keeping place of the Dal-arat, the oldest rhulisti artifact in</p>\n<p>existence. This life-shaped device is actually a recorder (now impossible to recreate) that</p>\n<p>replays an ancient account of the beliefs and creeds of the rhulisti.</p>\n<p>“The fundamental forces of life, being what they are, have left us with no other</p>\n<p>option . . . . We are both the masters of the world and its passionate servants. Let that</p>\n<p>forever be our creed and our vow.”</p>\n<p>Vher-elus Garrison: This small fortress has a garrison of more than 150 lawkeepers</p>\n<p>(ham &amp; haf/F4/LG). From here, they patrol the city and respond to reports of trouble. In</p>\n<p>times of great need, they can call upon an organized, voluntary militia of over 200</p>\n<p>additional able-bodied men and women.</p>\n<p>Vin-ered Woodworks: Unique in rhul-thaun society, this huge emporium exclusively</p>\n<p>displays and sells items fashioned of wood. The cost of their goods is moderately high,</p>\n<p>but Vin-ered quality is exceptional.</p>\n<p>The Water Temple: The second largest halfling temple, the Water Temple is found on</p>\n<p>the lake’s edge. The buildings of this complex are designed to appear like long, snaky</p>\n<p>fish, swimming through the winding course of the temple grounds.</p>\n<p>Under the guidance of high priestess Hiv-anad (haf/P12/N) the priests of this temple</p>\n<p>maintain close relations with the life-masters of Thamasku. In fact, the water priests</p>\n<p>operate in the city as spies for the shapers, and are well paid for their services.</p>\n<p>The Dark Side</p>\n<p>The Ban-ghesh Guild, consisting of thieves, assassins, and muscles-for-hire, is the driving</p>\n<p>force of the less-reputable, darker side of Thamasku, which is usually considered to</p>\n<p>be the lower sector of the central part of the city. The slimy hands of this criminal organization</p>\n<p>are involved in many aspects of life in the city, including the extortion of merchants,</p>\n<p>entertainers, and tenders. They own merchants willing to sell illegal goods,</p>\n<p>crooked lawkeepers on-the-take, and administrative officials devoid of ethics. The guild</p>\n<p>operates and invests in theaters, casinos, safehomes, storage facilities, and virtually</p>\n<p>every money making business opportunity or venture they can acquire. In fact, when</p>\n<p>businessmen first start ventures they often approach the guild, offering them a percentage</p>\n<p>of their profits in exchange for a guild investment. The guild is also available for</p>\n<p>loans (at exorbitant interest rates).</p>\n<p>One could argue that the Ban-ghesh could make a decent profit in purely legal activities</p>\n<p>(investments, loans, legitimate enterprises). Nevertheless, a great deal of its substantial</p>\n<p>treasury comes from extortion, murder, and theft.</p>\n<p>In the lower northern quarter of Thamasku lies a secret, forbidden Fire Temple, offering</p>\n<p>its evil followers a place to revere the element of death and destruction. This temple</p>\n<p>maintains a contingent of Ban-ghesh armed guards for defense, in case of discovery.</p>\n<p>Rumors abound that the high priest, who many very well be insane, plans a massive</p>\n<p>showing of the power of elemental fire that will inflict tremendous damage upon the</p>\n<p>city and the people who have turned their backs on the proscribed element.</p>\n<p>Important NPCs</p>\n<p>Vahv-ostes (ham/F11): AC 4 (sheath armor); MV 6; hp 61; THAC0 10 (9 with</p>\n<p>Strength); #AT 3/2; Dmg 1d8+1 (warstaff); SZ S (3’4” tall); ML Champion (15); AL</p>\n<p>NG; XP 3,000.</p>\n<p>S 17, roll 5d4 for attributes other than Strength.</p>\n<p>Personality: gruff, surly</p>\n<p>Special Equipment: sheath armor, warstaff, vher-elus badge graft</p>\n<p>Vahv-ostes is the commander of the vher-elus in Thamasku. He also hires himself out as</p>\n<p>a mercenary occasionally, along with a few of his compatriots who can be spared from</p>\n<p>their official duties for a week or two.</p>\n<p>Like most males, Vahv-ostes keeps his black hair long, but prefers it pulled straight back</p>\n<p>and tied, to keep it out of his eyes. His face and body show a number of scars, and when</p>\n<p>he seeks to impress others he uses body paint to highlight and draw attention to them.</p>\n<p>Jhen-athin (haf/T9): AC 7 (Dexterity bonus); MV 6; hp 32; THAC0 16; #AT 1; Dmg</p>\n<p>1d6 (quickstrike); SA x4 backstab; SZ S (3’ tall); ML Elite (13); AL N; XP 2,000.</p>\n<p>D 17, Ch 18, roll 5d4 for other attributes.</p>\n<p>Personality: seductive, crafty.</p>\n<p>Special Equipment: clingbag, 50 feet of clingrope, shaper lockpick, thieves’ tools,</p>\n<p>quickstrike.</p>\n<p>Thief Abilities: PP 60, OL 80, F/RT 50, MS 95, HS 80, DN 50, CW 95, RL 10.</p>\n<p>Jhen-athin is a member of the Ban-ghesh, and is considered to be one of the best infiltrators</p>\n<p>in the business. Her specialties are her charm, wit, and pleasant demeanor. She</p>\n<p>uses these as tools to slip past guards and deceive the vher-elus.</p>\n<p>She keeps her brown hair short (as is the fashion), and often wears a painted blue</p>\n<p>stripe down the right side of her face. Her charm truly comes from her gentle behavior,</p>\n<p>not from her average appearance.</p>\n<p>PCs could encounter Jhen-athin when she is on a job (perhaps attempting to infiltrate</p>\n<p>the same organization the PCs are investigating). In that situation, she ignores the player</p>\n<p>characters unless they have something that she needs or they can assist her in some</p>\n<p>way. If the latter, she attempts to charm her way into getting what she wants.</p>\n<p>Pareth</p>\n<p>“The winds blow kindly on Pareth.”</p>\n<p>—old windrider proverb</p>\n<p>The second largest community of halflings is much smaller than Thamasku, and nearly as</p>\n<p>old. In the rhulisti tongue, its name means “hidden,” which is a fine descriptor for the</p>\n<p>secluded village. It is recessed back from a ledge that lies between two large, vertical</p>\n<p>outcroppings of rock and built even further to the rear, into a wide but shallow cave.</p>\n<p>The community is huge by rhul-thaun standards, with a population of 3,500, but still</p>\n<p>called a village. Its administrator, Bal-olech (ham/9/LG), is a retired windrider yearning</p>\n<p>for the old days. He wants to be young and spry so that he can ride the winds again.</p>\n<p>Since this cannot be, he lives vicariously through other windriders. Because of his feelings,</p>\n<p>Pareth has become particularly attractive to windriders. Bal-olech’s administrations</p>\n<p>have given merchants, safehome keepers, and others, encouragement to offer special</p>\n<p>incentives and services to windriders. Since this attracts new commerce, the har-etuil of</p>\n<p>the local clans does not oppose his mandates.</p>\n<p>Places of Note</p>\n<p>Ger-orif’s: This is the safehome favored by windriders throughout the Jagged Cliffs.</p>\n<p>Although it is quite expensive, the riders receive discounts based on how much time</p>\n<p>they have been in the profession.</p>\n<p>The five-story tavern offers food, drink and entertainment of high quality. There is a</p>\n<p>huge fountain and even a pool where guests can swim—a rare opportunity on Athas.</p>\n<p>The 35 opulent rooms above and around the pool offer relaxation and comfort</p>\n<p>unknown in most other places on Athas. Water flows freely throughout the structure,</p>\n<p>and servants are ready to cater to any whim.</p>\n<p>Prices</p>\n<p>Entry Fee (paid at the door): 3 ghav-egoths</p>\n<p>Room (per night): 10 ghav-egoths</p>\n<p>Meal (light): 1 ghav-egoth</p>\n<p>Meal (sumptuous): 3 ghav-egoths</p>\n<p>Drink: 2 ghav-egoths</p>\n<p>Discount: 30% discount for windriders, plus 1% per year of experience, to a maximum</p>\n<p>of 50%.</p>\n<p>Sahr-enor Plaza: This large plaza is located near the center of the village. Windriders</p>\n<p>use the open area to ground their mounts. The flyers are then turned over to tenders in the</p>\n<p>employ of the city who care for them. For a fee of 1 ghav-egoth, a tender will oversee the</p>\n<p>needs of any size windrider flyer for one night. The plaza is also used for public gatherings,</p>\n<p>large entertainments (sponsored by the city to attract windriders), and other affairs.</p>\n<p>Sanctuary of Pareth: This sanctuary is another major shaper stronghold, a complex</p>\n<p>56</p>\n<p>built into the side of the cliff. Using long-forgotten organic digging methods, the ancient</p>\n<p>life-shapers created a series of rooms and corridors within the cliff. Rumor has it that the</p>\n<p>shapers only use a small portion of this underground domain. The vast majority of its</p>\n<p>rooms and galleries are unused—and for the most part, unexplored. Other rumors assert</p>\n<p>that ancient tunnels honeycomb the entire cliff, and may be filled with knowledge and</p>\n<p>artifacts from the distant past. Regardless, the sanctuary of Pareth is the only existing</p>\n<p>rhul-thaun subterranean structure.</p>\n<p>The leader of the sanctuary is Mag-aven (haf/F8/NE), a twisted soul in a twisted body.</p>\n<p>An accident during a life-shaping experiment disfigured her long ago and drove her partially</p>\n<p>mad. Though she has supposedly recovered from the insanity, she has since developed</p>\n<p>a penchant for pain and the macabre.</p>\n<p>The Wind’s Song: This small shrine dedicated to elemental air is built high atop a tall</p>\n<p>tower. The builders designed this organic structure as a unique wind organ. When the</p>\n<p>wind blows through the various holes and tubes carved into its walls and floors, it creates</p>\n<p>an ever changing melody of varying pitches.</p>\n<p>There is a single cleric caring for this temple. Her name is Fen-adan (haf/P10/CG), and</p>\n<p>she mostly keeps to herself and to her temple. Fen-adan’s self-imposed duties are to maintain</p>\n<p>the temple and to keep the tubes and orifices of the wind organ clear and clean.</p>\n<p>Important NPCs</p>\n<p>Las-aren (haf/F7): AC 4 (hidden sheath armor and shield); MV 6; hp 43; THAC0 14;</p>\n<p>#AT 3/2; Dmg 1d6 or 1d10 (flashlance); SZ S (2’ 11” tall); ML Champion (16); AL CE;</p>\n<p>XP 975.</p>\n<p>S 16, D 15, C 15, 19, W 14, Ch 12.</p>\n<p>Personality: cruel, backbiting</p>\n<p>Special Equipment: climbers’ shield, climbing boots, flashlance, grasping hook, hidden</p>\n<p>sheath armor, sleep spore pod.</p>\n<p>Las-aren is a professional climber who lives in Pareth. She is completely evil and thoroughly</p>\n<p>untrustworthy, but still manages to get enough work to make ends meet.</p>\n<p>Occasionally, she lures prospective employers into secluded areas in order to kill them</p>\n<p>and strip the valuables from their pockets.</p>\n<p>Las-aren has long black hair—unusual for a rhul-thaun female. Her features are</p>\n<p>deceptively delicate, for she is strong and capable. She prefers drab clothing and tries to</p>\n<p>project a plain, homely appearance.</p>\n<p>The PCs may encounter her as a hired climber, a guide, or even a rival adventurer.</p>\n<p>She may even be a long-term rival or enemy. Las-aren is not a foe whose first response</p>\n<p>is combat with the PCs—unless she is sure she can win. She is more likely to use subterfuge</p>\n<p>or deceit to defeat opponents.</p>\n<p>Flar-onib (ham/C10 [earth]): AC 1 (shell armor and shield); MV 6; hp 47; THAC0 14</p>\n<p>(12 with Str); #AT 1; Dmg 1d6+1 (mace); SA gate 4 cubic feet of earth; SZ S (3’ 1”</p>\n<p>tall); ML Fanatic (17); AL CG; XP 2,000.</p>\n<p>S 18, D 10, C 12, I 10, W 16, Ch 14.</p>\n<p>Personality: kind, quiet</p>\n<p>Special Equipment: lens grafts, shell armor</p>\n<p>Spells (6/6/3/3/2): 1st; bless, cure light wounds, elemental bonding, magical stone, pass</p>\n<p>without trace, sanctuary; 2nd; dust devil, draw upon holy might, enthrall, hold person</p>\n<p>(x2), silence 15’r 3rd; locate object, meld into stone, stone shape; 4th; cure serious</p>\n<p>wounds, divination, return to the earth; 5th; anti-plant shell, transmute rock to mud.</p>\n<p>Flar-onib is a wandering priest. He has no temple to support him, but instead travels</p>\n<p>about helping the downtrodden and poor in the name of elemental earth. He frequents</p>\n<p>the village of Pareth more than most, having a special affection for its people. Fen-adan,</p>\n<p>the priestess of air in the city, dislikes him and it is rumored that they were once lovers.</p>\n<p>This holy man has long, unkempt brown hair and a scraggly appearance overall. He</p>\n<p>chooses to use a simple, life-shaped mace rather than more sophisticated weapons.</p>\n<p>The PCs may encounter him as a benefactor or he may himself serve as the basis of an</p>\n<p>adventure, requiring the aid of the PCs to accomplish some good task he has undertaken.</p>"
