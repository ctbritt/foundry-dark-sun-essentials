      content: "<p>“The high places are not for the weak. Already you gasp for\_breath, and your head swims with dizziness—and it appears\_that the Kra-Hnurdha have picked up your trail. Perhaps\_this would be a good time to return to the lowlands.”\_</p>\n<p>—Mikus, Ringing Mountains anchorite</p>\n<hr />\n<p>The mighty Ringing Mountains, the greatest mountains known on Athas, form the western border\_of the Tyr Region. The highest peaks in the range\_reach more than 20,000 feet in elevation, and even\_the lowest passes are a good 12,000 feet above the\_lowlands. Despite\_ the brutal heat and aridity of the deserts below, a glimmer of snow and ice clings to\_the highest spires, visible from a hundred miles away.</p>\n<p>The high vales are home to reclusive monasteries,\_isolated clans of mountain herders, tribes of fierce\_goliath and tarek raiders, and a wide variety of dangerous predators such as rocs, kirres, and braxats. No\_sorcerer-kings have tried to conquer the rich Forest</p>\n<p>Ridge that crowns the mountains, and for good\_reason. The cold and the thin air are brutal on soldiers, the passes are impossible for heavy wagons and\_lowland draft beasts, and the forest is protected from\_defiling by the ancient primal wards of the haiflings.</p>\n<p>Despite these daunting obstacles to invaders, the\_Ringing Mountains are thinly settled. Haiflings, and\_those who trade with them, use secret roads and\_hidden passes to reach the lowlands. Vicious raiding\_tribes of goliaths and other warlike races lurk in the\_wild fastnesses of the peaks. And, as in most ofAthas,\_monster-haunted ruins lie scattered through the\_mountains, tempting explorers to try their luck.</p>\n<p>\_</p>\n<p>EXPLORiNG THE\_RINGING MOUNTAINS</p>\n<p>The Ringing Mountains are much steeper on their\_eastern face. On the western side, the great plateau of\_the Forest Ridge climbs slowly to its lofty height, but\_to the east, the peaks rise almost vertically from the\_Tablelands, fronted by a narrow and precipitous range\_of foothills a few miles in width. The mountains confront travelers with great walls of riven rock, tortuous\_footpaths, and sheer cliffs that prevent passage.</p>\n<p>\_</p>\n<p>RUINS OF THE RINGING MOUNTAINS</p>\n<p>Crumbling towers, abandoned keeps, and forgotten\_castles dot the ridges, foothills, and clifftops of the Ringing\_ Mountains. Many ruins are in strategic locations, such\_as on a knoll overlooking a canyon entrance. Some are\_empty, and others host monster or\_ raider tribes.\_Aside from these visible ruins, ancient mines and\_subterranean tunnels spiral through the mountains and\_foothills. These underground passages are prone to caveins,\_noxious gas, and dark creatures that make their homes\_away from the crimson sun.\_ Some of the mines date back\_to the Green Age or earlier. The oldest excavations have\_smooth, brightly colored walls, and sometimes they lead\_to underground ruins of peculiar, domelike cities.\_All the ruins of the Ringing Mountains hold out the\_possibility of\_ treasure, perhaps still recoverable after hundreds or thousands of years of neglect. The riches include\_bits of metal, psionic artifacts, and tomes imbued with\_arcane resiliency.</p>"
