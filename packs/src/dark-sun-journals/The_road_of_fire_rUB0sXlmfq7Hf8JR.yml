      content: "<p>The place’s name is a misnomer, since no actual roads\_span this chain of volcanic islands in the Sea of Silt.\_Some sages believe the Road of Fire to be a mighty\_arm of the Ringing Mountains flung out into the sea,\_but others think the volcanic isles are a new range,\_rising slowly out of the silt. Although several dozen\_smaller peaks are counted among the Road of Fire,\_the bulk of the archipelago consists of three islands:\_Dhuurghaz, Avegdaar, and Morghaz.</p>\n<p>\_</p>\n<p>Dhuurghaz: The largest island in the Road of Fire,\_Dhuurghaz is a broad plateau of volcanic rock that\_is mostly flat except for a range of steep, rocky cliffs\_along the southern shore. The center of the island is\_a deep pit, from which emanates the hellish red glow\_of magma far below. This volcano connects to the Elemental plane of fire, and elemental beings emerge from the depths, seeking to burn anything\_they can find.</p>\n<p>Beast giants of the Khal-Ish-Thaas tribe\_dwell in the southern highlands of Dhuurghaz, traveling a slow, nomadic circuit up and down the coast.</p>\n<p>\_</p>\n<p>Avegdaar: Smaller and more mountainous than\_Dhuurghaz, Avegdaar is home to nomadic bands of\_desert giants. The clans of Avegdaar raid out of necessity, since their island cannot support even the meager herds raised by the giants of\_Dhuurghaz. Avegdaar is also home to a large population of fire drakes. These creatures attack the raiding\_clans, but only when their own hunting is particularly bad—even fire drakes can’t stand up to a dozen\_angry giants.</p>\n<p>\_</p>\n<p>Morghaz: Unlike its sister islands, Morghaz has\_no active volcanoes and is surprisingly verdant.\_Scrub brush covers much of the land, and here and\_there stand small copses of forest. A small tribe could\_live here easily, yet the island is uninhabited. The</p>\n<p>Khal-Ish-Thaas tribe and the clans of Avegdaar avoid\_Morghaz, believing it to be haunted, and they are correct. A shattered keep on the southeastern tip of the\_island was the home of an ancient order of preservers. The former leader of the order, a powerful ghost\_named Haakar, still lingers in the ruins.</p>\n<p>\_</p>\n<p>The Road of Fire</p>\n<p>Stretching more than 200 miles into the Silt Sea,\_the Road of Fire is a chain of volcanic islands.\_Many map-makers believe the Road of Fire represents\_the dying remnants of the Ringing Mountains\_as they fade into the dust of the silt basin. Others\_claim that the archipelago is new and is still growing</p>\n<p>as it emerges slowly from the silt. Only time will tell.</p>\n<p>There are three major islands of the Road of Fire\_and many smaller peaks and crags surrounding the\_large land masses. The islands are known by the giants\_as Dhuurghaz, Avegdaar, and Morghaz\x97\_Furyfire, Hellglow, and Dawnfire in the common\_tongue. All three are almost completely desolate\_and lifeless, covered with choking ash and black,\_smoking lava plains.</p>\n<p>Despite this, a few hardy souls inhabit the isles of\_the Road of Fire. A small clan of beasthead giants\_inhabits Furyfire, keeping flocks on the south side of\_the broken hills of the island. Several small clans of\_desert giants inhabit Hellglow. Dawnfire is not\_known to be inhabited, but there are rumors of an</p>\n<p>ancient ruin hidden in its bleak hills.</p>\n<p>Furyfire and Hellglow actually contain cauldrons\_of seething lava of considerable size. The islands are\_home to several fire drakes. Occasionally a fire\_drake begins preying on a giant village, and the giants\_send out a call for help. A war party of 20 or 30\_assembles and sets out after the beast. Despite the</p>\n<p>incredible ferocity and power of the fire drakes,\_there are few things on Athas that can stand up to\_20 angry giants.</p>\n<p>Few people know of the existence of the volcanic\_archipelago. Giants of the northern portions of the\_Silt Sea (Lake Island and farther north) have heard\_of it, and the people of Ket know of the islands as\_well. In Draj, the volcanic isles are only a distant\_rumor. Violent eruptions along the Road of Fire\_sometimes cause ashfalls in the city.</p>\n<p>Furyfire, the first island in the chain, is inhabited\_by several small clans of beasthead giants with short\_tempers and foul dispositions. It is also home to\_many creatures of elemental fire and earth who are\_likely to view visitors as prey. Hellglow is much the\_same, but the desert giants of that island are so\_starved for trade with the outside world that they\_often welcome guests of any race, invited or not.\_</p>\n<p>Dawnfire is an uninhabited island that the giants\_of the Road of Fire believe to be haunted. They\_refuse to set foot on it. The island is actually the\_most fertile of the bleak archipelago, as its volcanoes\_have been dormant for some time. A few hidden\_valleys in its steep shoulders contain dense scrub\_and\_ forest. Unfortunately, the giants are correct\_about the island; it is the home of a powerful undead\_preserver. The very southern point of the island rises to a towering cliff; the shattered ruins of\_an ancient mages\x92 fortress overlook the Silt Sea from this vantage.</p>\n<p>Haakar</p>\n<p>Human Preserver (undead)</p>\n<p>17th Level</p>\n<p>Neutral Good</p>\n<p>Str 17</p>\n<p>Dex 11</p>\n<p>Con 20</p>\n<p>Int 20</p>\n<p>Wis 12</p>\n<p>Cha 13</p>\n<p>hp: 73</p>\n<p>A C : 3</p>\n<p>#AT: 1</p>\n<p>THAC0 11</p>\n<p>\_</p>\n<p>Dmg: 1d8 + drains 2 points Constitution</p>\n<p>Movement 24 (Fly)</p>\n<p>P s i o n i c s S u m m a r y : P S P 1 0 8 ; D i s c i p l i n e s \x97</p>\n<p>telepathy, clairsentience; Sciences\x97mindlink, election,\_clairvoyance; Devotions-contact, aversion,\_awe, id insinuation, mind thrust, combat mind,\_danger sense; Defense Modes-all.\_Haakar is a free-willed undead spirit, similar to a\_spectre but far more powerful. He is largely insubstantial\_and can only be struck by +2 or better\_weapons. He maintains the spellcasting abilities he\_possessed in life and relies on them in combat.</p>\n<p>Haakar is bound to the island of Dawnfire and cannot\_leave. There are several hundred desiccated\_skeletons in the courtyards and rubble of the ruins;\_Haakar can animate six per turn and command\_them to assist him.\_Haakar is an ancient wizard, the master of the\_mage society whose fortress this was. He and his\_brothers fought against the rise of the defilers, but\_were destroyed in the terrible wars that swept Athas in the ancient days. Haakar\x92s strength of will survived\_the death of his body, and he guards the ancient\_fortress to this day. Powerful magic and\_dangerous knowledge are still hidden within the ruins, and Haakar ensures that word of the ruins\x92 existence\_never leaves the island of Dawnfire.</p>\n<p>Good-aligned PCs may be able to convince\_Haakar to aid them, or at least refrain from destroying\_them. Haakar knows of the Valley of Dust and\_Fire and knows that it is the Dragon\x92s home. He\_warns the party against direct confrontation with the\_Dragon.</p>"
