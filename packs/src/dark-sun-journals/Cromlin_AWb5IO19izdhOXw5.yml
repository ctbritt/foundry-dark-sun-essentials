    text:
      format: 1
      content: "<p>Originally a trading post created by House Shorn, the\_village of Cromlin has prospered despite the decline\_in its founder’s fortunes. The silt sailors of Cromlin\_have charted hidden paths through the treacherous\_dust of the Bay of Maray, giving them easy access to\_the villages on the bay’s northern shores. Light cargoes bound for Raam or Draj (or heading southward\_to Nibenay) can go by silt skimmer, shaving weeks of\_time from the normal journey.\_Although House Shom still runs Cromlin, at least\_nominally, the\_ village’s unique position means that\_Shorn’s leaders overlook most infractions that do\_not affect the house’s profits. Stealing from Shorn’s\_emporiums brings harsh punishment, as does raiding\_a caravan heading to or from the village, but it’s fair\_game to rob\_ unaffiliated travelers or attack caravans\_that pass through the Black Spine Mountains. These\_lax laws make Cromlin a haven for smugglers, slavers,\_pirates, and elves—rogues and scoundrels of all sorts\_call the place home.\_The principal source of entertainment\_ in Cromlin\_is the inn known as the Dirty Lizard. Jaksot Han, a\_thickset mul of middle years, owns the place. Han is\_a former silt pirate, and his common room attracts\_a similar clientele. Bar brawls occur daily at the\_Lizard, and according to commonly held\_ wisdom,\_a patron isn’t considered a regular until he’s been\_through a fracas.</p>"
