      content: |-
        <p>Travelers moving through the rocky badlands that wind</p>
        <p>around the northeastern portion of the Glowing Desert</p>
        <p>must contend with feral halflings from the Small Water</p>
        <p>Oasis. These rare, desert-dwelling halflings leave the sandy</p>
        <p>wastes to hunt in the labyrinthine canyons of the badlands</p>
        <p>where game is more plentiful. They're as deadly and</p>
        <p>dangerous as the halflings of the Forest Ridge, actively</p>
        <p>stalking even intelligent creatures for food and plunder.</p>
        <p>These raiders deserve the same levels of fear and respect</p>
        <p>that travelers in the south give the Black Sand Raiders</p>
        <p>and the Silt Stalkers, for they revel in mayhem and</p>
        <p>bloodshed. It doesn't pay to try to reason with the Small</p>
        <p>Water halflings. They would have the same reaction as a</p>
        <p>merchant lord would if his erdlu egg breakfast suddenly</p>
        <p>begged for mercy – they'd eat you anyway.</p>
