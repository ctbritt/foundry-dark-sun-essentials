      content: "<p>For decades Tyr’s slaves whispered about a hidden\_village called Freedom that welcomed anyone who\_escaped from bondage. Unlike many slave tales, this\_one is true—Freedom exists, hidden in a remote crater\_in the foothills between Tyr and Urik. The village’s\_former slaves raid to support themselves; however,\_with Kalak’s fall and the liberation of Tyr’s slaves, the\_village elders are pursuing a new path: trade, or at\_least trade with Tyr.\_</p>\n<p>From their hidden refuge, the ex-slaves have sent\_trade delegations to Tyr, presenting themselves as\_House Lirr, a new minor merchant house. The delegations are led by Bartras, a male human who once\_worked as a slave for House Vordon. Bartras rose as\_high in the house as a slave could before he fled with\_a purse of stolen gold, and he fears he would be recognized in Tyr. Therefore, Bartras travels in disguise,\_wearing the long black robes and hood of a desert\_ascetic. He usually lets his assistant Fathalia speak for\_the so-called House Lirr.\_In addition to raiders trying to turn over a new</p>\n<p>leaf, Freedom is home to ex-slaves who hold grudges\_against their former masters. A group calling itself\_the Winds ofVengeance secretly hires bounty\_hunters and assassins to eliminate the slavers. Unfortunately for travelers in the region, the hired killers\_(who travel in small groups disguised as dune traders) do not discriminate when it comes to lopping off\_slaver heads. If they can save themselves a bit of work\_by killing a stranger who can pass for their intended\_target, they will.</p>"
