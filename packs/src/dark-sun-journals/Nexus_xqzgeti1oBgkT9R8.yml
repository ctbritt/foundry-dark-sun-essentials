      content: |-
        <p>Nexus is an academy of the Way located high within a</p>
        <p>small range of mountains northeast of Kurn. The hidden</p>
        <p>site is hard to reach and well-protected by a group of</p>
        <p>powerful psionicists and their students. A dwarf, Gulem</p>
        <p>the Gray, runs the academy. It's said that he constantly</p>
        <p>scans the reaches of Athas for psionicists worthy to study</p>
        <p>at Nexus, and that these hopefuls receive mental summons</p>
        <p>to come to the hidden facility.</p>
        <p>Built within the mountain peaks themselves, Nexus</p>
        <p>appears as a gray monolith beneath the crimson sun. Due</p>
        <p>to the safeguards put in place by the psionicists who serve</p>
        <p>the academy, no one can find the actual location if they</p>
        <p>aren't permitted to. In fact, making it up the mountain to</p>
        <p>Nexus itself is one of the first tests used to determine the</p>
        <p>worth of a particular perspective student.</p>
        <p>The most powerful users of the Way can circumvent</p>
        <p>the safeguards if they really want to reach the academy,</p>
        <p>but doing so alerts Gulem and his teachers. In this way,</p>
        <p>Gulem may not be able to prevent a member of the</p>
        <p>Order from visiting, but at least he'll be aware of that</p>
        <p>visitor's approach.</p>
        <p>Everyone who comes to Nexus is sworn to absolute</p>
        <p>secrecy concerning its location and true function. While</p>
        <p>studying with Gulem and the other psionic masters, the</p>
        <p>neophytes must immerse themselves in the principles of</p>
        <p>the Will and the Way. Body, mind, and spirit must</p>
        <p>be forged into a single unit at Nexus, and the only</p>
        <p>neophytes to finish the grueling training are those destined</p>
        <p>for great things. Many are returned to apply their talents</p>
        <p>for the good of their communities. Others are sent into</p>
        <p>the wilderness to accomplish specific tasks. A select few</p>
        <p>are charged with teaching others in the use of the Will</p>
        <p>and the Way.</p>
        <p>There are rumors that Nexus has binding ties to the</p>
        <p>mysterious Order. In fact, Gulem is an entrant of the</p>
        <p>Order, but his agenda is his own. He had no part in the</p>
        <p>recent plot involving the psionatrix, and he has cautioned</p>
        <p>his colleagues to keep a low profile in the wake of those</p>
        <p>events. It appears that Gulem remains an influential</p>
        <p>member of the Order despite his low status thanks to his</p>
        <p>words of wisdom and his prudent actions.</p>
