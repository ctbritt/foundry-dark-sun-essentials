      content: "<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">The Grand Gate</div>\n<h2 id=\"h.mh1hhq1lawlj_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">The Grand Gate enters into the section of the city that houses the High Bureaus of the templars, the governmental offices of Tyr. As such, the templars restrict the traffic that passes through the gate. Only iron shipments from the mine and those having government business may use the Grand Gate. A median-level (5-8th level) templar is stationed at this gate at all times with four half-giant guards, a psionicist (7-10th level) and a beast handler for support.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">The gate opens onto a tunnel that extends 30 feet through the city wall. Two great agafari doors, arching to a height of 25 feet with a combined width of 15 feet, seal the passage from the city\x92s side of the wall. Outside the wall, a huge block of granite, graven in a terrifying image of the dragon, rests on log rollers to the side of the entrance. In time of war, the block can be pushed into place by three half-giants to seal the tunnel. A great iron ring is set into the block with two stout gianthair ropes that can be fed through a shaft in a stationary block on the opposite side of the tunnel. The ropes, in turn, can be tied to harnessed mekillots to assist the half-giants. The log rollers are held in place by stone ridges set between them. This allows the block to roll over the logs until it falls into place without the rollers moving with it, thus foiling enemy attempts to roll the block back out of the way.</p>"
