    text:
      format: 1
      content: "<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;white-space:pre-wrap\"><span style=\"color:#212121;font-family:Lato, sans-serif\"><span style=\"font-size:14.6667px;font-variant-ligatures:none;white-space:pre-wrap\"><strong>A traveler's guide to Nibenay</strong></span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;white-space:pre-wrap\">\_</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;white-space:pre-wrap\"><strong>APPROACHING THE CITY</strong></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">When approaching Nibenay, avoid camping in the fields off the main roads. Within 10 to 15 miles of the city, virtually every inch of ground lies under someone's claim. To avoid being imprisoned (or worse) for trespassing, you are better off finding a room at an inn, a caravansary, or at one of the client villages of the noble houses. The nobles abide by traditional customs of courtesy toward strangers and will often give travelers shelter in the slave barracks for a small charge.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Nibenay is a city of incredible opportunities, but be advised that it is unwise for foreigners to travel the streets alone. There are many dangerous characters, and some of the city's laws don't extend protection to visitors.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">THE CITY GATES</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">One of the many delights of the city of Nibenay is its \"dancing gates.\" Each of the city's elaborately carved gates has a stone balcony hanging across it, with Nibenese musicians continually playing hypnotic melodies. The music has the power to compel people to walk in rhythm to the performer's music. Animals respond in a like manner and seem to become calm as they approach the city. The sight of huge caravans and lines of porters all swaying to the songs of the minstrels has earned these gates their moniker.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Of the city's four gates, only the Reservoir Gate is restricted to use by the templars and the army of Nibenay. The mekillot Gate is wide enough to accommodate a huge argosy; it leads to the merchant emporiums of Sage's Square. The South Gate should be avoided because of its proximity to the thieves of the dangerous Hill District. The West Gate is smaller and opens into the shops of the freemen merchants and tradespeople.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Entry into the city is a fairly straightforward matter of paying a toll. Only the most suspicious characters are detained by the templars here.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">WHERE TO STAY</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">There are a large number of inns and boarding houses throughout Nibenay that will meet a wide variety of tastes. If you are conducting business in the city, it is not unusual to be invited to stay at the home of the person with whom you are dealing. This may not always be in your best interest, however. Druids may find themselves welcomed at the house of a noble if they are willing to survey the noble's property and tend to any problems that might be developing in the fields or hot springs. Clerics can find temporary shelter in the temple of their votive element. If you are neither druid nor cleric, however, and have absolutely no money, quite a few vagrants simply sleep in the tunnel-like alleyways beneath the shelter of the stone-vaulted roofs. <span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">The Open Door</span></span> is a popular inn near Sage's Square. The proprietor, Baylee Baran, caters to merchants and traders. <span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">The Borderstone</span></span> is a cheap place near the elven market run by a half-elf named Pottooth. He has a reputation for minding his own business.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">WHERE TO BOARD YOUR MOUNT</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Most inns have facilities to board kanks and crodlu. Inixes and other larger animals must usually be taken to a livery stable.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">WHERE TO FIND SOMETHING TO EAT</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">The mazelike streets of Nibenay are often cluttered with vendor stalls and small shops of freemen huddled against the carved walls of the city. Rice is the staple of the Nibenese diet and can be purchased throughout the city. Exotic foods of all kinds can be found in the all-night marketplaces. Be wary of drinking too much in unfamiliar establishments. Many slavers troll the streets late at night in search of wayward travelers to add to their \"stock.\"</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">WHERE TO SHOP</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Many of the market districts in Nibenay conduct business at all hours. The center of trade in the city is Sage's Square, a large plaza of gray ash surrounded by the largest and most opulent emporiums of the dynastic merchant houses. Virtually anything that people are willing to pay for-from the Ringing Mountains to the Sea of Silt-can be found in the markets of Nibenay at any time of the day or night.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">WHERE TO BUY MAGIC COMPONENTS</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">On the east side of the city an ancient and deserted walled palace called the Hill has been taken over by the predator classes of the city. The elven market in the outer ward of the Hill District is a source for virtually any easily transported material component of spells. Naturally, the buyer should excercise the caution appropriate to conducting business with elves.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">WHERE TO BUY POISONS</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Deep within the crumbling inner courtyard of the Hill, the bards of Nibenay have built a squalid nest of mud-brick shacks. Virtually any poison can be purchased for the right price if you are adept at negotiating with these dangerous people.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">WHERE TO FIND WORK</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">There always seem to be opportunities for the enterprising in Nibenay. Merchant and noble houses frequently require mercenaries and specialists. The woodcutters in the Crescent Forest will gladly hire groups to protect them from predators and headhunters from Gulg. Tradespeople will often take on apprentices or hire people to deliver orders to remote areas. The templars at the Temple of Trade can help enterprising newcomers establish businesses of their own. The king's templars also occasionally hire outsiders for work, particularly when such work involves a mission to a foreign city.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">WHERE TO GET HEALED</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">The elemental temples all offer healing services to travelers. The temple of elemental water sits on a small island surrounded by a water-filled moat near the south wall of the city. This temple administers almost exclusively to the noble houses. The temple of earth, built deep within the cliffwall overlooking the city's north side, is also supported primarily through the contributions of the noble families. These relationships stem from the nobles' traditional ties to the land and the hot springs. The temples of elemental fire and air administer to the free citizen class of the Nibenay region. Their priests are often called out to the tenant farms to mitigate the effects of a windstorm or drought. In general, the Nibenese freemen are very pragmatic about the elemental cults and look to them strictly for material well-being.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">WHERE TO TRAIN</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">It is not difficult to find people willing to train you in Nibenay. Warriors can find a number of public combat halls in the city as well as in the gladiatorial stables of the noble and merchant houses. The merchant houses are particularly happy to allow a visitor to train with their gladiators if the subject is willing to pay. Like warriors, rogues can often find a master who will train themthough often it is in exchange for an unusually dangerous service. Clerics can turn to the elemental temples for additional training. Druids, on the other hand, may have some difficulty locating a mentor. There is a chance, however, for the persistent seeker to find a master in the Crescent Forest. Occasionally, a druid can be found in residence at a noble house, but these priests are less likely to have any interest in teaching initiates.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Wizards will face all the difficulties that they face elsewhere on Athas. Persuading a mentor to train you in spellcasting requires a long period of finding a wizard, let alone establishing his or her trust. The Veiled Alliance is rumored to be active in the city, but they are very distrustful of strangers. There is also talk of another organization that is said to offer a safe haven to even defilers.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">BRIBERY IN THE CITY</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Nibenay is a city that thrives on trade. Bribery is a common part of everyday life in the city. You can often bribe freeman merchants and guards. Agents of the dynastic merchant houses are generally loyal, however, and will not compromise the interests of their house. Low-level templars will accept monetary bribes, but they will not break the law or jeopardize the security of the state. Higher level templars will occasionally show favor to those who send them thoughtful gifts.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">LYING TO CITY OFFICIALS</span></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;color:#212121;font-size:11pt;text-decoration-line:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px;white-space:pre-wrap\">Templars of the king are used to the distorted claims of merchants and consider the testimony of any freeman somewhat questionable. They are, however, quite adept at torture and psionic interrogation when it is important to extract the truth from someone. If you are caught lying to a templar in regard to an important matter, you may find yourself tossed into the arena dungeons of the Naggaramakam.</p>"
