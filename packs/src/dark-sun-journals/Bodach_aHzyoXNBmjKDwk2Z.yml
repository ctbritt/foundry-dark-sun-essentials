    text:
      format: 1
      content: "<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:0pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">Bodach, lying at the tip of peninsula projecting into one of the great inland silt basins was undoubtedly one of the mightiest cities of the ancients. lts ruins cover many square miles of the peninsula. When you stand at the edge of the silt basin, you can see its towers rising above the silt for many miles beyond.\_</span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"><span class=\"Apple-tab-span\" style=\"white-space:pre\"> </span></span><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">Unfortunately, Bodach and the surrounding territories are not good places to linger. As the crimson sun goes down, thousands of undead zombies and skeletons crawl out of the cellars, sewers and hidden dungeons, then begin scouring the city and the surrounding countryside. If you're here after dark, you will spend the entire night fighting one long, pitched battle.\_</span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"><span class=\"Apple-tab-span\" style=\"white-space:pre\"> </span></span><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">l have talked to those who say that the undead are controlled by a powerful Defiler who is using them to keep treasure hunters away from the city while he systematically loots it.\_</span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">Others claim that the undead are the original inhabitants of the city, and they cannot rest because there is some terrible secret buried in the heart of ancient city that they do not want discovered. In either case, if you go to Bodach, be prepared for an intense battle against this gruesome army. </span></p>"
