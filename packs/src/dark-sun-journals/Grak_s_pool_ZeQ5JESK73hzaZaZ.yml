      content: "<p>Midway between Altaruk and Ledopolus stands a mud-brick fortress built over a natural,spring. Because surface water is rare anywhere on Athas, Grak’s Pool is a welcome stop for travelers. Grak, a half-elf warrior of some renown, commands a band of mercenaries based here. He allows visitors to set up camp around the outskirts of his fortress, but his water is not free. He charges travelers 2 ceramics to use the watersource</p>\n<p>Below the fortress and the spring, a foundation of\_older ruins extends beneath the stony barrens of the\_surrounding landscape. Grak and his mercenaries\_have explored only a portion of these tangled, echoing tunnels. Spine-chilling roars sometimes echo\_up from the deep passages below Grak’s Pool. Their\_awful resonance has been sufficient to keep the mercenaries from venturing too far beneath the fortress.</p>\n<p>\_</p>\n<p>SEER NAFOUN</p>\n<p>Grak’s Pool Personality</p>\n<p>Mafoun is a badly scarred dray who camps per\_petually outside the fortress of Grak’s Pool. He offers\_prophecies and readings for the cost of a drink in the fortress. Mafoun belongs to a secret cult called the Children\_of the Dragon. The Children believe that the Dragon of\_Tyr will redeem Athas if it receives enough sacrifices. The world’s failure is that, so far, too few lives have been given\_to the Dragon for it to achieve its ultimate end.</p>\n<p>\_</p>\n<p>Grak's Pool</p>\n<p>\_</p>\n<p>Grak the half-elf employs many mercenaries, in cluding one preserver- his own brother, Regg. The two stick by each other in a world that mistrusts them both.</p>\n<p>\_</p>\n<p>Regg, a 7th-level diviner, spends most of his days studying magic, sometimes via psionic communica tion with Alliance wizards in distant cities. In this way he learned the Alliance recognition signals. Out of boredom, rather than treachery, Regg passes reports of interesting or suspicious travellers to any Council member who asks. He enjoys talking with visitors and would gladly reveal his abilities to</p>\n<p>\_</p>\n<p>another preserver.</p>\n<p>\_</p>\n<p>Grak (7th-level fighter): AL LN; AC7; MV 6; HD 7; hp 24, THACO 14 (+2 to hit from strength bo nus); #AT 5/2 rounds: Dmg 1d6+4 (metal morningstar); SZ M; ML 10; Str 14; Dex 15; Con 15; Int 17; Wis 12; Cha 10.</p>\n<p>\_</p>\n<p>Regg (7th-level diviner): AL LN; AC10; MV 6; HD 7; hp 20; THACO 18; #AT 1; Dmg by spell; SZ M; ML 10; Str 14; Dex 15; Con 15; Int 17; Wis 12; Cha 10.</p>"
