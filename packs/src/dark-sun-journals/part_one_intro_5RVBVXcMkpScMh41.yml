      content: "<p>The first section of Freedom contains five possible encounters: 1A\x97Elf Brawl;</p>\n<p>1B\x97Serious Offense; 1C\x97Preservers!; 1D\x97Press Gang; and 1E\x97Shanghaied.</p>\n<p>The PCs will experience one or more of these encounters before progressing to Part</p>\n<p>Two.</p>\n<p>The purpose of the Part One encounters is to capture the player characters: the</p>\n<p>later stages of Freedom take place in the slave pens of Tyr, and thus the players must</p>\n<p>be captured in Part One. The five encounters in Part One each provide a different</p>\n<p>method to capture the PCs. Only after all the PCs are slaves working on Kalak\x92s</p>\n<p>infamous ziggurat can the adventure continue.</p>\n<p>Because the PCs must be captured, the Part One encounters are unfair. One or</p>\n<p>more PCs will be prisoners after each encounter. No player actions short of the</p>\n<p>miraculous will save the PCs from eventual capture, arrest, or enslavement. But who</p>\n<p>ever said Athas was fair?</p>\n<p>Recognizing this unfairness, though, you may allow the PCs to take in some of the</p>\n<p>sights and sounds of Tyr before running one of the captures. (Players\x92 Book pp. 3,</p>\n<p>13, 18, 35, 47 contain excellent flavor illustrations.) Of course, to allow the PCs to</p>\n<p>wander, they would have to already be amalgamated into an adventuring party. The</p>\n<p>beauty of this approach is that the PCs might get captured on their own.</p>\n<p>General Role-Playing. In addition to capturing the PCs, each encounter in Part</p>\n<p>One lets characters gain allies and enemies who will prove important in later events.</p>\n<p>Enemies come automatically; allies come when PCs offer aid or show kindness. As</p>\n<p>you play, record which encounters you use and what actions the characters\x92 take.</p>\n<p>This information will determine future events of the adventure.</p>\n<p>To begin play, choose one of the five encounters to use first. A short description of</p>\n<p>each follows.</p>\n<p>Elf Brawl. While in the elven district, a pair of feisty elves draw the PCs into a</p>\n<p>fight and thereby rob them or lead to their arrest. This encounter works best if any</p>\n<p>PCs are thieves or half-elves. \x93Elf Brawl\x94 works poorly for elf characters.</p>\n<p>Serious Offense. The PCs accidentally insult a powerful noble who orders the</p>\n<p>group\x92s arrest. The same noble will lead a powerful faction in later adventures\x97a</p>\n<p>faction the PCs must deal with. This encounter works well for any group, particularly</p>\n<p>PCs who imagine themselves powerful and important.</p>\n<p>Preservers! A Preserver asks the PCs for shelter from the eyes of the templars. If</p>\n<p>they protect the Preserver, the characters will gain a powerful ally. This encounter</p>\n<p>suits a party that includes Preservers or Defilers. It may wreak havoc, however, if the</p>\n<p>PCs are likely to betray each other.</p>\n<p>Press Gang. A group of soldiers sweep through an area of Tyr, arresting every</p>\n<p>vagrant and foreigner they find. The PCs conveniently fit this description. This</p>\n<p>encounter lets foolhardy characters have an out-and-out fight.</p>\n<p>Shanghaied. A tavern owner, secretly in league with the templars, drugs the characters</p>\n<p>and delivers them into slavery. This encounter can capture players who are too</p>\n<p>tough (or lucky) to be taken otherwise.</p>\n<p>Next. Choose an encounter (1A, 1B, 1C, 1D, or 1E) to start Freedom</p>"
