        jM4h8qpyxwTpfNli:
          notes: >-
            <h3><strong>The Glimmering Shard (Stonecarver and
            Jeweler)</strong></h3>

            <ul>

            <li><strong>Proprietor</strong>:&nbsp;<strong>Zaleth</strong>, a
            quiet and meticulous dwarf who
            carves&nbsp;<strong>stones</strong>,&nbsp;<strong>crystals</strong>,
            and&nbsp;<strong>bone jewelry</strong>.</li>

            <li><strong>Services/Items</strong>:

            <ul>

            <li><strong>Bone and Chitin
            Jewelry</strong>&nbsp;featuring&nbsp;<strong>sun
            motifs</strong>&nbsp;and&nbsp;<strong>dwarven runes</strong>,
            valuable as&nbsp;<strong>trade items</strong>.</li>

            <li><strong>Stone Sigils</strong>&nbsp;carved
            with&nbsp;<strong>protective runes</strong>&mdash;small amulets that
            offer&nbsp;<strong>minor magical effects</strong>, such
            as&nbsp;<strong>resistance to
            heat</strong>&nbsp;or&nbsp;<strong>better focus for psionic
            abilities</strong>.</li>

            <li><strong>Psionic Crystals</strong>: On rare occasions, Zaleth
            acquires&nbsp;<strong>psionic-infused crystals</strong>&nbsp;from
            the wastes, which can be used to&nbsp;<strong>enhance psionic
            abilities</strong>&nbsp;or as a&nbsp;<strong>focus</strong>&nbsp;for
            certain spells.</li>

            </ul>

            </li>

            <li><strong>Special Interaction</strong>: Zaleth is interested
            in&nbsp;<strong>strange crystals</strong>&nbsp;or&nbsp;<strong>bone
            materials</strong>&nbsp;that might come from&nbsp;<strong>rare
            creatures</strong>. If the party brings
            him&nbsp;<strong>material</strong>&nbsp;from a&nbsp;<strong>defeated
            beast</strong>&nbsp;(like a&nbsp;<strong>Cistern
            Fiend</strong>&nbsp;or&nbsp;<strong>Earth Drake</strong>), he might
            craft a&nbsp;<strong>custom piece</strong> as a reward.</li>

            </ul>
