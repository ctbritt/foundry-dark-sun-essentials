    text:
      format: 1
      content: "<p>Rising out of the dust like the shattered fang of an\_enormous beast, Roqom appears only at the peak of\_midday on the hottest days of the year. This sharp,\_jagged spire of basalt lies in the wilderness beyond\_the Beastbarrens, but according to legend, it appears\_wherever its master can work the greatest mischief.</p>\n<p>The master of Roqom is Fajjayad, a great rakshasa\_prince, and he occasionally uses magical sendings to\_lure silt sailors and travelers to his black palace—especially travelers who have a desperate need of some\_sort. Fajjayad claims to be able to provide for any such\_needs in exchange for services to be rendered within\_1,001 days.</p>\n<p>The rakshasa is unfailingly polite and candid. If\_asked, he freely admits that the task he sets is likely to\_be difficult, even deadly, and that his “clients” might\_die while attempting it. However, Fajjayad assures\_them that “the laws” (a term he does not define)\_forbid him from setting a task that is impossible or\_whose outcome is certain death. For his magic to\_work, the task must have an element of chance and\_uncertainty. Still, if any group has ever profited from\_Fajjayad’s bargain, its tale is not known.</p>"
