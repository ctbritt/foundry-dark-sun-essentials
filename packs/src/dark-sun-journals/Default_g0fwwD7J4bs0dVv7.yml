        @UUID[Actor.qsSH6WQOfTwTn8Zk.Item.qvoOe5DMF42bNOh9]{Human}</strong></p><p><strong>Age:
        </strong>25</p><p><strong>Background: …</strong></p></td></tr><tr
        style="background:transparent"><td
        style="padding-right:1rem;vertical-align:top"><h3>Backstory</h3><p>Mother,
        Aislin, is a druid living in the town near where the Great Oak(Kuldahar)
        is dying and the male progenitor was an unknown barbarian from the Bear
        clan (mom was kidnapped as a young woman but escaped-I was born nine
        months later on midwinter day) She owns a small shop there called "All
        in a Nutshell" selling poultices, teas, ointments, elixirs, and balms
        and our living quarters are upstairs from the shop. I had a good view of
        the dying Great Oak from my bedroom and grew up near the Ten-Towns as an
        only child and a little on my own (mom didn't want to be a mother and
        did the best she could to raise/teach me but would rather work with
        plants). Even though I have a good foundation in herb lore and the
        makings of poultices and elixirs, I would rather be outside exploring
        than working inside. Instead of following in mom's footsteps, I became a
        guide for travelers, delivering product for my mom to customers or
        delivering messages for the locals (anything to be out and about and
        moving). On my travels I sometimes come across injured animals which I
        either humanely euthanize or try to save. I currently have a young
        ermine that cannot survive on its own (visually impaired) named Lumi
        that goes with me on my travels (since Mom is not keen to care for him
        in my absence).</p></td><td
        style="vertical-align:top"><h3>Personality</h3><p>Miabella is the
        embodiment of the wild, a ranger whose soul is intertwined with the
        rhythm of nature itself. She stands as a guardian of the wilderness, a
        silent protector who watches over forests and creatures with a vigilant
        eye. Her commitment to nature is unwavering, an oath that guides her
        every action and step through the untamed lands she calls home.</p><p>To
        Miabella, the wilderness is not just a place, but a living, breathing
        entity deserving of respect and protection. She moves through it with a
        grace that speaks of her deep connection to the land, understanding its
        languages and secrets in a way few others can. This connection to nature
        has made her wary of those who tread carelessly upon the earth, leading
        her to be slow in offering her trust. Her experiences have taught her
        that not all intentions are pure, and she guards her loyalty as fiercely
        as she guards the wild.</p><p>Miabella finds solace in the company of
        animals, with whom she shares an unspoken bond. She is more at ease in
        the presence of wildlife than with her own kind, finding their
        straightforward existence and instinctual trust a contrast to the
        complexities of human relationships. Her companionship with animals goes
        beyond mere preference; it is a reflection of her belief in living in
        harmony with the natural world.</p><p>Her path is a solitary one, chosen
        out of necessity and devotion. Miabella walks the boundary between the
        realms of man and nature, ensuring that the balance is maintained. She
        is a bridge, a mediator between two worlds, and her life is dedicated to
        the preservation of the wild spaces that remain untouched and
        free.</p></td></tr></tbody></table>
