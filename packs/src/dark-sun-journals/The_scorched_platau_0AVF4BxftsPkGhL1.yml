        <p>The Scorched Plateau</p>
        <p>Where the Barrier Wastes end, the Scorched Plateau</p>
        <p>begins. This relatively flat plateau extends to the Thunder</p>
        <p>Mountains and Burning Plains in the north, to the</p>
        <p>Jagged Cliffs in the west, and to the Sea of Silt in the</p>
        <p>east. No cities or other seats of civilization can be found</p>
        <p>in this desolate region, though scattered nomadic tribes</p>
        <p>and primitive communities do struggle to survive here.</p>
        <p>Like most of the highlands, the Scorched Plateau is</p>
        <p>a hot, dry region made up of the same terrain types</p>
        <p>prevalent along the rest of the Silt Sea's coast. Rocky</p>
        <p>badlands make up the majority of the terrain. The hills</p>
        <p>and twisting canyons of the badlands give rise to a small</p>
        <p>number of mountain ranges, though none of these can</p>
        <p>compare to the Ringing Mountains in the south, the</p>
        <p>White Mountains in the east, or the Thunder Mountains</p>
        <p>in the north. Therefore, the methods of travel used in</p>
        <p>places like the Tablelands work just as well here.</p>
        <p>Nestled amongst with Thunder Mountains lies the</p>
        <p>valley of the Last Sea and the variety of communities</p>
        <p>around it, under the control of the Mind Lords.</p>
        <p>The Scorched Plateau has two other features that</p>
        <p>need to be discussed. These are the Somber Woods</p>
        <p>and Lava Gorge. The forest, located near the mysterious</p>
        <p>ruins of Godshold, is the only one on the plateau. The</p>
        <p>gorge, meanwhile, is a huge, molten filled inferno slashing</p>
        <p>through the middle of this blazing land.</p>
        <p>Encounters in the Scorched Plateau</p>
        <p>Creatures that exist in regions with similar terrain types</p>
        <p>can be found in this area, so they won't be repeated</p>
        <p>here. Instead, this section details creatures unique to the</p>
        <p>Scorched Plateau.</p>
        <p>Among the many small tribes of nomads and primitive</p>
        <p>settlers living throughout the Scorched Plateau are a</p>
        <p>number of elf tribes. Like the elf tribes to the south,</p>
        <p>these elves are wanderers who disdain walls, houses, and</p>
        <p>other permanent structures. Some of these tribes operate</p>
        <p>as raiders, some as herders, and at least one engages in</p>
        <p>limited mercantile endeavors. Travelers should approach</p>
        <p>the northern elf tribes with the same caution they use with</p>
        <p>the tribes in the south-keeping one hand on their purse</p>
        <p>strings and one on their swords.</p>
        <p>The largest of these tribes is the Moon Runners. Led</p>
        <p>by Jesiv Moonsong, the Moon Runners engage in two</p>
        <p>major activities: They hunt and they raise kanks. All of</p>
        <p>the inhabitants of the area know the Moon Runners, and</p>
        <p>most respect them as neighbors who never try to take</p>
        <p>advantage of a situation. Some might consider this to</p>
        <p>be peculiarly non-elflike behavior, but it fits with Jesiv's</p>
        <p>philosophy. He only cares that his hunters have prey to</p>
        <p>stalk and his herders have grazing land and water. Beyond</p>
        <p>that, his tribe is more interested in festivals and fun than</p>
        <p>in raiding or stealing.</p>
        <p>The tribe does have one possession it considers sacred.</p>
        <p>An oasis near the coast of the Silt Sea called Moon</p>
        <p>Runner's Rest is held as a holy place by the tribe. The</p>
        <p>elves make regular pilgrimages to the site to stock up on</p>
        <p>water and relax. As long as the oasis isn't harmed or</p>
        <p>abused, anyone may use it while the Moon Runners are</p>
        <p>away. When they return, anyone found at the lush site is</p>
        <p>attacked and driven off or killed. This custom relates to</p>
        <p>the legend of the tribe's founder. When Moon Runner</p>
        <p>finished his race across the desert, this oasis was waiting</p>
        <p>for him. It was a gift of the water elementals, promised to</p>
        <p>him when his thirst became so great he almost gave up</p>
        <p>running.</p>
        <p>When he arrived, a herder and his animals were</p>
        <p>watering at the site. Furious that his gift had been used</p>
        <p>before he had a chance to slake his thirst, Moon Dancer</p>
        <p>killed them all. To this day, the Moon Dancers continue</p>
        <p>this tradition, though most of those familiar with the area</p>
        <p>know enough to leave the oasis before the tribe returns.</p>
        <p>Ssurran traders operate in the region, dealing with</p>
        <p>everyone from the largest nomadic tribes wandering the</p>
        <p>scrub plains to the smallest clans hiding in the rocky</p>
        <p>badlands. These northern ssurrans aren't as wild and</p>
        <p>savage as their southern counterparts. For example,</p>
        <p>the desert-dwelling lizard men of the southern regions</p>
        <p>are raiders who enjoy the flesh of halflings and other</p>
        <p>humanoid creatures. The ssurrans of the Scorched Plateau,</p>
        <p>however, don't eat intelligent creatures and rarely resort to</p>
        <p>raiding. Instead, the individual tribes have formed a loose</p>
        <p>confederation of trading houses, though on a less formal</p>
        <p>and more primitive scale than the dynastic houses of the</p>
        <p>Tyr Region.</p>
        <p>As adapted to the heat of Athas as other ssurrans,</p>
        <p>those of the Scorched Plateau are friendly pack rats</p>
        <p>235</p>
        <p>Beyond the Tyr Region</p>
        <p>who love making deals. They collect anything, behaving</p>
        <p>more like glorified junk men than dignified agents of a</p>
        <p>merchant house. Still, they provide a key component to</p>
        <p>survival on the Scorched Plateau by bringing news and</p>
        <p>much-needed goods and supplies from one settlement to</p>
        <p>the next. Because the heat doesn't bother ssurrans, their</p>
        <p>caravans travel near the Lava Gorge. They take advantage</p>
        <p>of the protection the gorge affords, as the intense heat</p>
        <p>it gives off keeps most predators away. A typical ssurran</p>
        <p>caravan consists of everything the individual lizard men</p>
        <p>can carry, a few carts (either pulled or drawn by kwilits,</p>
        <p>large insects as adapted to the heat as their masters), and</p>
        <p>sometimes even a massive fortress beetle. Fortress beetles</p>
        <p>grow to a length of 25 feet, carrying sturdy, 15-foot-tall</p>
        <p>protective shells atop their backs. Much of the upper</p>
        <p>portion of these shells is hollow, with intricate and</p>
        <p>beautiful chambers formed during the growing process.</p>
        <p>Ssurran use these docile insects as beasts of burden,</p>
        <p>filling their hollow shells with their most precious trade</p>
        <p>goods.</p>
