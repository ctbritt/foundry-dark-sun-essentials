    text:
      format: 1
      content: "<p>The trees and plants in this section of the Forest Ridge\_were transmuted to translucent mineral centuries ago\_as a side effect of a battle between an arcane defiler\_and a druid. In the years since, many of the tallest\_trees have fallen and shattered, creating a field of\_razor-sharp crystal spikes across the\_ few square miles\_of this lifeless zone. Creatures made of conglomerate\_mineral shards stalk the Crystal Forest and some\_times venture beyond its edge, searching for prey.\_At the center of the region stands an obsidian plateau that hosts a ruined cliff dwelling. Ghost winds\_and spirits howl about the\_ plateau, and ancient magic\_wards yet burn. Those who stand atop the plateau\_find their flesh slowly hardening to lifeless mineral\_and must flee before the change becomes complete.</p>"
