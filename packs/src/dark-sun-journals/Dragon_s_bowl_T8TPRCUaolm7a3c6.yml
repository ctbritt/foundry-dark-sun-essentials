      content: "<p dir=\"ltr\">A rumpled range of low mountains and highlands in the stony plains between Raam and Urik conceals a natural marvel: the Dragon’s Bowl, a great cliff-walled crater more than seventy miles wide. The view from its rim is awe-inspiring, and nothing else in the Tyr Region matches its size and scope. The Dragon’s Bowl is an obstacle akin to the Ringing Mountains; sheer cliffs between 1,000 and 2,000 feet in height isolate its floor from the world outside. Only a handful of precarious trails descend the cliffs. The site takes its name from legends describing how the Dragon tore free from the world and left behind the deep crater to mark its birth. The Dragon’s Bowl has a strange stillness, as if the world holds its breath, awaiting the creature’s return. The feeling intensifies at the bottom, where one finds a mix of rocky debris and hills covering the middle to southern reaches. Large herds ofgame animals and predators thrive in the Bowl, untroubled by the presence of people.</p><p dir=\"ltr\">\_</p><p dir=\"ltr\">ENOLA,\_GUARDiAN OF THE LAKE</p><p dir=\"ltr\">A vigilant guardian druid named Enola protects lake Pit.\_Eighty years old, the mul is vigorous and hale. Some who</p><p dir=\"ltr\">have met him believe he was once a gladiator slave, and\_his scorn for the city-states supports this theory Enola\_is\_ served by powerful elemental spirits, and he tries to\_drive off or kill intruders who come to plunder or settle\_the\_ Dragon’s Bowl. The druid usually spares innocent\_travelers, but he keeps a close eye on them, and he asks\_trespassers to leave only once.</p><p dir=\"ltr\">\_</p><p dir=\"ltr\">\_</p>"
