    text:
      format: 1
      content: "<p>In a deserted corner of the Tyr Region, the Mud Palace stands in the middle of a vast mudflat. It is a\_mysterious citadel of white marble that appears to\_have no windows or doors in its lower floors. From\_its towers pour continuous torrents of cold, fresh\_water that have irrigated the mudflat for years, perhaps centuries. Nomads who pass nearby say that\_the palace was the home of a powerful sorcerer who\_commanded genies or demons to build it for him. As\_the story goes, he reneged on his payment, and his otherworldly allies entombed him in the structure. It\_seems likely that a gate or a portal provides the Mud\_Palace with its bottomless fountains, but few people\_try to collect water here—the surrounding mudflat\_teems with horrid monsters.</p>"
