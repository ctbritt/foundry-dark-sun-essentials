    text:
      format: 1
      content: "<p>The City Gates</p>\n<p>One of the most remarkable features of Gulg is the enormous</p>\n<p>Mopti Wall that surrounds the city. The wall is made up of</p>\n<p>miles of carefully cultivated brambleweed. The 20 feet thick</p>\n<p>and 20 feet high brambleweed is so dense that virtually nothing</p>\n<p>can pass between its thorns. The exterior of the wall is heavily</p>\n<p>patrolled, and scaffolding placed at regular intervals allows</p>\n<p>guards to keep watch from inside.\_</p>\n<p>Templar guards and psionicists work each gate. These servants</p>\n<p>of the queen can quickly determine the veracity of any</p>\n<p>entrant\x92s claims.</p>\n<p>There are four gates into the city:</p>\n<p>\_</p>\n<p><strong>The\_Queen\x92s Gate</strong> is the largest entry, and is sometimes referred to\_as the Caravan Gate. All visitors and travelers carrying trade\_goods must enter the city here.</p>\n<p>\_</p>\n<p><strong>The Hunter\x92s Gate</strong> is only used\_by the army and the hunter nobles of the city.</p>\n<p>\_</p>\n<p><strong>The People\x92s\_</strong>Gate serves the common citizens.</p>\n<p>\_</p>\n<p><strong>The Exile\x92s Gate</strong> marks the\_location where outcasts are driven from the city. Anyone may</p>\n<p>use this gate as an exit, but no one may enter through it.</p>"
