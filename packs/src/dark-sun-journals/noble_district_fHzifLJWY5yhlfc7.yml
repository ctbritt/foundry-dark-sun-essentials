      content: "<section><div><div><div><div><div><div><div><div><div><p>Tyr’s Noble District is divided in two by the Caravan District. The stylish, spacious stone residences of the Noble District serve as a reminder of what most commoners will never possess—a family name associated with a history of wealth and influence. Merchant princes, templars, ranking administrators, and nobles who maintain villas inside the city-state enjoy various degrees of lavish quarters. Their residences are tall and airy, usually three stories or more in height. Most homes have quarters for servants, private courtyards, and gardens.</p><p>The district’s shops are more sophisticated than those found elsewhere in Tyr. Herbalist shops spice up their offerings of medicinal herbs and exotic oils with flute and sitar music. Vendors of colorful silks, glassblowers, and perfumeries display their wares in fancy arrangements outside their storefronts, enticing passersby to linger. Essentially, these shops exist to separate nobles from their excess coin. The following sites lie in the Noble District.</p><p>Rhey’s Apothecary: Items for sale include medicinal herbs, water pipes, scented candles and oils, incense, and musical instruments. Rhey Khal, a middle-aged male human, is rumored to dabble in magic and deal with enchanted items. He responds to most inquiries about such interests with self-deprecating humor.</p><p>Narissa’s Colors and Scents: Goods include perfumes, body oils, face paints, colorful feathers, and (for favored customers) poisons. Narissa, a beautiful half-elf said to be the illegitimate daughter of an important templar, is the soul of discretion, no matter the purchase.</p><p>Jade Jozhal: Items include exotic jewelry fashioned from bone, horn, wood, metal, and gems. Kaorik Marrish, the dwarf proprietor, fashions the jewelry himself. The shop’s guardian is a thri-kreen namedIxixt, whose motionless stance leads many customers to think that he is a particularly lifelike sculpture.</p><p>Athas Revealed: Wares include maps (of citystates, areas, ruins, and more), navigation charts, explorer’s journals, and (to those who know the secret) routes and access points into Under-Tyr.</p><p>Sweetwater Inn: This inn provides luxury accommodations and services for visiting nobles, senior house merchants, and others with an excessof wealth.</p><p>Blacksun Villa: The Shahram noble family turned a portion of its manor into a private ballroom, where it hosts fabulous parties to which few other noble families are invited. The holder of an invitation is the envy of Tyr’s aristocrats, but the plain papyrus cards stamped with a black circle and date are rare commodities.<br />The templars believe that the villa is the front for a cult, and that its parties are dark ceremonies. However, the nobles who attend the parties have great political influence, and the templars lack hard evidence that would substantiate the rumors. Thus, they have taken no action to investigate what might hide behind Blacksun Villa’s facade.</p></div></div></div></div></div></div></div></div></div></section><section><div><p>\_</p></div><div><div><div><div><div><div><div><div><div><p>Noble District Street Watch</p><p>The Tyrian Guard doesn’t venture into the Noble District. Instead, the major noble families provide a small private army of watch officers. Called the Scarlet Helms after their distinctive red-dyed headwear of inix scales, this force maintains order in the streets and escorts nonresidents out of the district by nightfall. It keeps special watch on the borders where trade districts adjoin noble neighborhoods. A Scarlet Helms squad consists of a leader (usually a human or mul gladiator) and several half-giant guards. A number of ex-gladiators have hired on with the Scarlet Helms in the weeks since Kalak died and the slaves were freed.</p></div></div></div></div></div></div></div></div></div></section>"
