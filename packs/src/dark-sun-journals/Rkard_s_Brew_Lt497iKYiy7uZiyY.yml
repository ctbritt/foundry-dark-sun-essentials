        jM4h8qpyxwTpfNli:
          notes: >-
            <h3><strong>Rkard&rsquo;s Brew (Tavern)</strong></h3>

            <ul>

            <li><strong>Proprietor</strong>:&nbsp;<strong>Brunn</strong>, a
            stout, jolly dwarf with a booming laugh, who prides himself on
            making the best&nbsp;<strong>cactus
            ale</strong>&nbsp;and&nbsp;<strong>kank mead</strong>&nbsp;in
            Kled.</li>

            <li><strong>Services/Items</strong>:

            <ul>

            <li><strong>Cactus Ale</strong>&nbsp;and&nbsp;<strong>Kank
            Mead</strong>, a strong drink that has been known
            to&nbsp;<strong>ward off the chill of desert
            nights</strong>&nbsp;and&nbsp;<strong>boost
            morale</strong>&nbsp;(grants&nbsp;<strong>advantage</strong>&nbsp;on&nbsp;<strong>Charisma
            checks</strong>&nbsp;for an hour, but
            imposes&nbsp;<strong>disadvantage</strong>&nbsp;on&nbsp;<strong>Dexterity
            checks</strong>&nbsp;due to intoxication).</li>

            <li><strong>Common Room</strong>&nbsp;where travelers can rest for a
            few hours, though the accommodations
            are&nbsp;<strong>sparse</strong>.</li>

            <li><strong>Information Exchange</strong>: Brunn hears all
            the&nbsp;<strong>gossip</strong>&nbsp;and&nbsp;<strong>rumors</strong>&nbsp;that
            pass through Kled. He might share&nbsp;<strong>stories of ancient
            dwarven spirits</strong>&nbsp;or&nbsp;<strong>legends of
            Kemalok</strong>&nbsp;over a drink.</li>

            </ul>

            </li>

            <li><strong>Special Interaction</strong>: Brunn is eager to
            hear&nbsp;<strong>songs</strong>&nbsp;and&nbsp;<strong>stories</strong>&nbsp;from
            travelers. He may offer a&nbsp;<strong>free
            drink</strong>&nbsp;or&nbsp;<strong>room</strong>&nbsp;if the party
            entertains the locals with a tale, song, or&nbsp;<strong>display of
            skill</strong>.</li>

            </ul>
