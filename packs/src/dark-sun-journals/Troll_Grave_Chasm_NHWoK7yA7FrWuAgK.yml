    text:
      format: 1
      content: "<p>A great depression has been gouged from\_the center of the Wastes, its sheer cliffs dropping 500 feet\_to a lush bed of scrub plains thriving with a concentration\_of life unlike anywhere else in the area. Called Troll\_Grave Chasm, the depression features beasts both benign\_and malignant, a relative abundance of water, and a\_reputation that gives even the toughest Bandit Lords pause.</p>\n<p>An extensive mud flat fills the very center of Troll Grave Chasm. This swamp is even more mysterious and legendary than the scrub plains around them. Tales proclaim that not all of the terrible creatures called trolls were killed during\_ the Cleansing Wars, and some of them still live within its dark, moist confines.</p>"
