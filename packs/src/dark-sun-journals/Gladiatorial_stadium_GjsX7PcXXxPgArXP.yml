      content: "<section><div><div><div><div><div><div><div><div><div><p>Tyr’s gladiatorial stadium sits between the walls of the Golden City and Kalak’s Ziggurat. A special viewing balcony, once reserved for the king and highranking templars, is set halfway up the Golden City’s walls. On the opposite side of the stadium, a great stairway climbs from the gladiatorial floor to the top of the ziggurat. Mosaics depicting Kalak as a warrior god adorn each step facing the stadium. The spaces below the spectators’ seats are a maze of cells and passageways that hold prisoners and monsters destined for the arena. A wide avenue leads from the stadium’s north side to the nearby Stadium Gate in the city walls. This gate is carved to resemble the gaping jaws of the Dragon, and it is used to transport monsters captured in the mountains or the desert to holding cells until they are brought out for combat in the arena.</p><p>The Master of Games, a high-ranking templar, stages games on ten days out of each month and during festivals. Anyone can enter the games, although in practice, most entrants are professionals who win purses to support themselves or gladiators sponsored by a noble family or merchant house. Slaves are no longer conscripted to compete in the stadium. Deaths are far less common than they were under Kalak’s reign; most contests now end when one gladiator yields or is too badly wounded to continue.</p><p>Any gladiator who performs a coup de grace on a downed opponent is exiled from Tyr. However, battles against desert monsters or savage foes are always to the death.</p><p>On days when no games are held, the stadium serves as an impromptu market of jumbled stalls, hide tents, and blankets where vendors offer goods and services. The sellers who display their wares need not pay any fee for the space they occupy as long as it is no more than two wagons wide. King Tithian was pressured by the freed slaves into making this decree to give ex-slaves a place to offer their services without going into debt.</p><p>\_</p><p>Player characters can fight in the gladiatorial stadium if they wish to enter the competition and pay a fee of 25 gp per game. They can take part as individuals or as a team and could be involved in a fight, a race, or an obstacle course. Create a stadium game just as you would create a regular encounter, setting the level of the creatures and threats in the encounter to within 4 levels of the party’s level. The purse for winning a competition should be a treasure parcel that is 2 levels lower than the parcel normally awarded for overcoming the encounter.</p></div></div></div></div><div><div><div><div><div><img src=\"https://lh5.googleusercontent.com/P5J7UvthOohaxTzKH5LCLUj_7ZcL2XxECs_uNQxQ6U5QaGqM9Z8ijXlWFAxmw3d9Ro0gDEZJWs6xARb52Uj-t2DI5UeuwRl-b_gcfuhzcvlwhVxE=w1280\" /></div></div></div></div></div></div></div></div></div></div></section><section><div><p>\_</p></div><div><div><div><div><div><div><div><div><div><p>The Tyr Gladiatorial Stadium</p><p>Before the construction of Kalak's ziggurat, the gladiatorial stadium was the single largest structure within the walled city of Tyr. At one end of the stadium is the golden tower and high bureaus. This walled city within the walled city houses the king's templars, private gardens, and the king's personal residence, the golden tower. A special viewing box for the templars and the king connects the high bureaus to one of the anterior ends of the stadium.</p><p>The far side of the arena stands at the foot of the exquisite and immense multi-colored tiled ziggurat of Kalak. The enormous ziggurat dwarfs the stadium as it rises hundreds of feet into the air above the city. A stair rises from the gladiatorial floor to the very top of the ziggurat.</p><p>Areas to each side of the stair are adorned with beautiful mosaics depicting Kalak as a great warrior god. It is impossible for gladiators to ascend the stair, as it is protected by magical spells.</p><p>The stadium was built with a rectangular combat field, 300 feet long and 80 feet wide. To distance spectators from combatants, there is a 15-foot tall barrier that rises from the floor of the arena to the first level of stadium seating.</p><p>The floor of the arena itself is hard-packed sand. The color of the sand holds an auburn, almost reddish hue. It is said that the color is a result of the blood of thousands who have fallen there.</p><p>The stadium has the only multilevel seating configuration in the Tablelands. On the two long opposing sides of the stadium, there is an upper and lower seating section. The sections themselves are 300 feet long, with stairs that rise to the back every 50 feet. Long stone benches supported by squat ionic columns allow respite for attendees to the gladiatorial matches. They are seldom used, as the crowd at Tyr generally remains on its feet during the entire match.</p><p>The stadium is configured with four identical sections, two upper and two lower. The upper sections, identical in size to the lower, are supported by doric columns. Traditionally, nobles, senators, and members of powerful trading houses sit in the lower sections. This is because the upper sections grant shade to the lower, protecting patrons from the blistering Athasian sun.</p><p>The king and templars have a reserved section at the end of the arena.</p><p>The two upper sections of the stadium are called \"the sun seats.\" The sun seats are open to the general populace of the city. This section generally attracts rowdy rabble rousers and slaves who have been allowed (and can afford) to attend the games. On more than one occasion following an argument or disagreement, these rowdy (and occasionally inebriated) fans have picked up an opposing gladiatorial fan and thrown him down to the arena floor</p></div></div></div></div></div></div></div></div></div></section>"
