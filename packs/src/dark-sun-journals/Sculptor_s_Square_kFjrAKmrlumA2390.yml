      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Manors in the architectural style of the two Noble Districts stand
        here, remnants of a time when Tyr's districts adhered to different
        borders. Although the buildings are dilapidated, they gained a new lease
        on life following Kalak's fall. Freed slaves kept for their artistry
        have renovated portions of the crumbling manors for use as art
        studios.</p><p>Many craft styles are represented in the square, but the
        most popular by far is marble and sandstone sculpture. Anyone can visit
        the studios to see the latest projects in progress, although donations
        are expected—each studio puts out a basin to collect spare coins. It's
        easy to find an empty chamber in Sculptors' Square suitable for
        renovation and, if inspiration strikes, the pursuit of an artistic
        dream.</p><p><strong>Notable Features:</strong></p><ul><li><p>Renovated
        Noble Manors: Converted into artist studios and
        workshops</p></li><li><p>Open Studios: Visitors welcome to observe
        artists at work</p></li><li><p>Donation System: Coin basins support the
        artists' livelihoods</p></li><li><p>Available Spaces: Empty chambers
        ready for new artists to claim</p></li></ul><p></p>
