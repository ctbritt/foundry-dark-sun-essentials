        wgCeShTrqHJFBbDr:
          notes: >-
            <p>Role in Adventures: Sculptors' Square serves as a cultural hub
            where party members can commission artwork, meet artistic contacts,
            or even establish their own creative enterprises. The former slaves
            turned artists represent Tyr's transformation and could provide
            unique perspectives on the city's political changes. The donation
            system and available spaces make it an excellent location for
            parties looking to establish a base of operations or invest in the
            community.</p>
        scrollPos: '{".tab.description .tab-inner":0}'
    _id: BUgNtcXtnFY8gDyO
