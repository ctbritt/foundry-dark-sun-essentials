    text:
      format: 1
      content: "<p>Echoing Mine: Nestled in a valley in the Mekillot Mountains, this ancient silver mine might hold untapped riches. Many\_ expeditions have sought to reopen the Echoing Mine, but all have discovered to their cost how the place earned\_ its name. Hook horrors, grimlocks, and other light-hating subterranean monsters infest the tunnel system. The mysterious\_clicks that echo through the mine are the rapid, highpitched\_sounds these creatures use to navigate and\_communicate.</p>"
