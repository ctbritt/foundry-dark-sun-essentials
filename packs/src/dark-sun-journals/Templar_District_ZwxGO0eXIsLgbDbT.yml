    text:
      format: 1
      content: >-
        <p>Many templars keep mansions in the Noble District, but the
        highest-ranking templars and their families live in a special section of
        the Golden City. Large warehouses at the western end of this area house
        precious reserves of grain, iron, water, and weaponry. No obvious
        entrances present themselves; instead, well-guarded tunnels in Under-Tyr
        connect each warehouse to an entrance building in the High Bureaus.</p>
