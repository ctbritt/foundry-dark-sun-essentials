    text:
      format: 1
      content: "<p>Setup. This encounter can occur on any</p>\n<p>street. Have the players turn to Players\x92 Book</p>\n<p>p. 14\x97Street Map. Page 33\x97Street Scene</p>\n<p>also contains some colorful details.</p>\n<p>\_</p>\n<p>Start. Introduce this encounter anytime the</p>\n<p>characters are in the street.</p>\n<p>\_</p>\n<p>Encounter. As the characters stroll along, a</p>\n<p>squad of the sorcerer king\x92s guards seals off all</p>\n<p>streets and alleys as noted on the Street Map.</p>\n<p>Shutters and doors slam, shutting off businesses</p>\n<p>and homes. The soldiers begin to move</p>\n<p>down the street, accosting everyone in their</p>\n<p>path. They order the homeless and indigent to</p>\n<p>assemble along one wall. Only merchants and</p>\n<p>nobles are allowed through the cordon.</p>\n<p>\_</p>\n<p>Role-playing. Little opportunity exists for role-playing. The patrol is filling a quota</p>\n<p>and for once resists bribes. The half-giant commander will let one character free for</p>\n<p>every 1,000 cp he receives now.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Statistics. Torban, half-giant commander: AL LE;</p>\n<p>A C 5 ( k a n k a r m o r ) ; M V 1 5 ; H D 6 ; h p 7 5 ; T H A C 0 1 1 ;</p>\n<p>#AT 3/2; Dmg 1d6 + 10 (copper club); ML 13; Str 20; Dex</p>\n<p>13; Con 16; Int 13; Wis 13; Cha 15. Wild Talent: Flesh</p>\n<p>armor; PS Con -3; Cost 8/4 rd; PSP 44.</p>\n<p>Asst. Templars (2): AL NE; AC 8 (leather corselet); MV</p>\n<p>12; HD 3, 2; hp 16, 8; THAC0 22; #AT 1; Dmg 1d4 - 1</p>\n<p>(obsidian dagger); ML 14; Str 10; Dex 11; Con 12; Int 12;</p>\n<p>Wis 13; Cha 9. Spells: cure light wounds, silence 15'</p>\n<p>Half Giant Soldiers (4): AL N; AC 5 (kank armor); MV 15; HD 4; hp 60, 60</p>\n<p>4 0 , 3 0 ; T H A C 0 1 5 ; # A T 1 ; D m g ( o b s i d i a n s w o r d ) ; M L 1 0 ; S t r 1 7 ; D e x</p>\n<p>14; Con 16; Int 11; Wis 9; Cha 9.</p>\n<p>Reactions. The press gang solves any problems with force, not</p>\n<p>hesitating to injure or kill. If the PCs fight, one man already</p>\n<p>taken springs to their defense.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Eramas: AL NG; AC 8 (inix leather); MV 12; HD 3; hp</p>\n<p>18; THAC0 16; #AT 1; Dmg 1d6+4 (bone wrist razor);</p>\n<p>ML 10; Str 18/13; Dex 13; Con 15; Int 14; Wis 7; Cha 8.</p>\n<p>Outcome. If the PCs escape, they become wanted, with a</p>\n<p>70% chance of being recognized and attacked in the future. If</p>\n<p>subdued, they (and Eramas) go to work on the zigguart.</p>\n<p>Next. If all the PC are captives, go to Part Two. Otherwise continue with Encounter</p>\n<p>1 A , 1 B , 1 C , o r 1 E .</p>"
