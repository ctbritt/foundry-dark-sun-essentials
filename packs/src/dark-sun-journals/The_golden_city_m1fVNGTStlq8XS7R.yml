    text:
      format: 1
      content: "<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;white-space:pre-wrap;padding-left:0px\">Once reserved for King Kalak and his top administrators and templars, the Golden City retains many of its restrictions on visitation, despite the growing clamor of ordinary Tyrians.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">On one day every week, commoners are allowed to tour the King’s Gardens and the Golden Tower. Only about a hundred citizens are let in on any given day, despite the fact that far more wish to see the fabled gardens with their own eyes. Resentment is brewing, even though the templars have tried to explain that if the gardens were opened freely to all citizens of Tyr, the place would suffer irreparable damage. Sites of interest in the Golden City include the following.</p>\n<div id=\"h.mh1hhq1lawlj\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;font-family:sans-serif;font-size:16px;white-space:pre-wrap\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.mh1hhq1lawlj_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nThe Grand Gate</div>\n<h2 id=\"h.mh1hhq1lawlj_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">The Grand Gate enters into the section of the city that houses the High Bureaus of the templars, the governmental offices of Tyr. As such, the templars restrict the traffic that passes through the gate. Only iron shipments from the mine and those having government business may use the Grand Gate. A median-level (5-8th level) templar is stationed at this gate at all times with four half-giant guards, a psionicist (7-10th level) and a beast handler for support.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">The gate opens onto a tunnel that extends 30 feet through the city wall. Two great agafari doors, arching to a height of 25 feet with a combined width of 15 feet, seal the passage from the city\x92s side of the wall. Outside the wall, a huge block of granite, graven in a terrifying image of the dragon, rests on log rollers to the side of the entrance. In time of war, the block can be pushed into place by three half-giants to seal the tunnel. A great iron ring is set into the block with two stout gianthair ropes that can be fed through a shaft in a stationary block on the opposite side of the tunnel. The ropes, in turn, can be tied to harnessed mekillots to assist the half-giants. The log rollers are held in place by stone ridges set between them. This allows the block to roll over the logs until it falls into place without the rollers moving with it, thus foiling enemy attempts to roll the block back out of the way.</p>\n<div id=\"h.1daf0zntbvrz\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;font-family:sans-serif;font-size:16px;white-space:pre-wrap\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.1daf0zntbvrz_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\n<span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">High Bureaus</span></span>:</div>\n<h2 id=\"h.1daf0zntbvrz_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Each of these buildings houses one of Tyr's governmental bureaus. Templars staff the offices from dawn until sundown to conduct government business. The High Bureaus include the bureaus of: Mines, Trade, Fields, Security, Defense, the Arena, the Gardens, Administration, State, Finance, and Water.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Regardless of the function involved, the process for dealing with the templars of any bureau is much the same. The first officials encountered are on the ground floor of the building. These lower-level templars (1st to 4th-level) attend to routine duties, screen inquiries, and determine to whom a petitioner should be referred to for resolution of his request. Often, a bribe to one of the junior templars can expedite one's processing greatly. Otherwise, it can sometimes take days or weeks to gain an audience with one of the more highly placed templars. A bureau guard, usually a half-giant, stands by ready to assist the templars if necessary. This scene repeats itself as you ascend floors in the building and levels of authority among the templar functionaries. To gain an appointment with the ranking templar of a given bureau may require a character to run a gantlet of lesser officials and outlay increasingly costly bribes. As such, most citizens avoid the High Bureaus unless it is absolutely necessary.</p>\n<div id=\"h.ggp39hl2ebsk\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;font-family:sans-serif;font-size:16px;white-space:pre-wrap\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.ggp39hl2ebsk_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\n<span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">King’s Gardens:</span></span></div>\n<h2 id=\"h.ggp39hl2ebsk_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">The King's Gardens consist of three lush, wooded sections of land. One garden lies on each side of the High Bureaus. The third encircles the Golden Tower like a small park, the rows of trees and bushes maintained in precise circles about the tower. In the past, these gardens served as a fuel reserve to power Kalak's defiling magics. Now, they grow undisturbed by spellcasters. The templars still service the arboreums while the Council debates future uses for the gardens. Access to the gardens can be gained through doors in the barbican tower adjoining the central garden or through heavily locked and trapped doors on the interior walls of the complex adjacent to the perimeter gardens.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">Only the garden templars under the leadership of the Master of the Gardens, a half-elf templar named Dafna, Senior Templar Timor, and the King possess keys to the doors. Anyone else caught in the gardens without express permission of one of the parties above faces a sentence of hard labor in the iron mine. Rumors persist that someone has planted one or more magical fruit trees in the gardens. This may well be the case, for the gardens contain many wondrous plants, including several trees of life.</p>\n<div id=\"h.5701l3j3p2y9\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;font-family:sans-serif;font-size:16px;white-space:pre-wrap\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.5701l3j3p2y9_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\n<span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Templar District</span></span></div>\n<h2 id=\"h.5701l3j3p2y9_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Large warehouses stand at the far end of the quarters. These buildings house the city's precious reserves of grain, iron, and weaponry, and two barracks for the templar's half-giant guards. Transportation of these commodities to the warehouses is achieved by using cunningly crafted tunnels that extend from the High Bureaus of Mines and Fields. The warehouses and the tunnels leading to them are permanently guarded through magic and psionics.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">With few exceptions, the templars apartments are used primarily by low- and median-level templars. Higher ranking officials commonly live in the noble quarters or on their own plantations outside of the city. Size and furnishings of the templars quarters vary by individual. Those in positions of relative power and wealth have luxurious accommodations while junior templars must be content with more spartan quarters.</p>\n<div id=\"h.fgs3vaik8kvc\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;font-family:sans-serif;font-size:16px;white-space:pre-wrap\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.fgs3vaik8kvc_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nThe Observation Tower</div>\n<h2 id=\"h.fgs3vaik8kvc_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">To gain admission to the Observation Tower or the Golden Tower, one must first petition for admittance. This bureaucratic paperwork limits which templars or imperial guests gain access to which particular ingress. A special department is staffed at the High Bureaus to process all requests. Having gained written permission for right of access, a templar travels to one of the Observation Tower entrances for a preliminary interview with the Senior Templar. Located outside the walls of the King's Garden, the Observation Tower appears as a smaller version of the Golden Tower. The most impressive feature is the 75- foot stone bridge that connects the Observation Tower to the Golden Tower. The Senior Templar maintains his offices here. Very important individuals on errands of imperial business are escorted from the High Bureaus to the Observation Tower.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">A pair of thick agafari doors reinforced with steel secure the entrance to the tower. The room is bare save for a single padded settee that dominates the center of the room.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">This first level serves as an waiting room for visitors wishing an audience. Two stairwells ascend on either side of the room. The staircase to the right ends on the third floor, while the left stairwell climbs to the fourth story.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">The meetings between the Senior Templar and members of his staff and visitors take place on the second floor of the Tower, which contains a large table and chairs, and boasts a long, semi-circular bookcase. The right-hand staircase continues its climb to the third level.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">The third level contains the Templars Library. Bookcases line the outer walls, and two curved bookcases stand at the center of the floor. The staircase continues to the fourth level of the tower.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">The fourth level is spartan, containing only a ladder leading to trap door to the roof. Three narrow windows look out upon the Golden City. A pair of doors, identical to those of the first level, open onto the causeway between the two towers.</p>\n<div id=\"h.u4fdhaoalo5k\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;font-family:sans-serif;font-size:16px;white-space:pre-wrap\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.u4fdhaoalo5k_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nThe Tower Bridge</div>\n<h2 id=\"h.u4fdhaoalo5k_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">Spanning the King's Garden, the Tower Bridge extends 75 feet to the Golden Tower. The bridge is 10 feet in width, and the sides are protected by a waist high railing. Four lesser air elementals (6HD each) are bound to the bridge by ancient magics. The elementals were commanded to let only those in the raiment of templars and people accompanying them to pass freely. All others are attacked. The elementals combine their attacks to hurl intruders off the bridge.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px;white-space:pre-wrap\">The elementals will pair up against intruders making a shove attack with advantage (Athletics +5) Characters falling from the bridge will sustain 7d6 points of damage.</p>"
