    text:
      format: 1
      content: >-
        <p>Tyr's Noble District is divided in two by the Caravan District. The
        stylish, spacious stone residences of the Noble District serve as a
        reminder of what most commoners will never possess a family name
        associated with a history of wealth and influence. Merchant princes,
        templars, ranking administrators, and nobles who maintain villas inside
        the city-state enjoy various degrees of lavish quarters. Their
        residences are tall and airy, usually three stories or more in height.
        Most homes have quarters for servants, private courtyards, and
        gardens.</p>

        <p>The district's shops are more sophisticated than those found
        elsewhere in Tyr. Herbalist shops spice up their offerings of medicinal
        herbs and exotic oils with flute and sitar music. Vendors of colorful
        silks, glassblowers, and perfumeries display their wares in fancy
        arrangements outside their storefronts, enticing passersby to linger.
        Essentially, these shops exist to separate nobles from their excess
        coin.</p>
