    text:
      format: 1
      content: "<p>The Mekillot Mountains are an old, low-lying range\_in the center of the Great Ivory Plain. A series of long,\_domed\_ monoliths of spectacular orange, they resem\_ble nothing so much as a line of titanic mekillots. The\_northern cluster,\_ known as the Greater Mekillots,\_is higher, and the southern cluster (unsurprisingly\_called the Lesser Mekillots) is more broken and jumbled. A narrow ring of badlands and stony barrens\_separates the rounded mountains from the surrounding salt plain. Old mines and the odd Green Age ruin\_can be found here, along with fierce tribes of escaped\_slaves, hungry monsters, and bands of cruel, twoheaded\_giants that raid the surrounding outposts for\_food\_ and captives.\_</p>"
