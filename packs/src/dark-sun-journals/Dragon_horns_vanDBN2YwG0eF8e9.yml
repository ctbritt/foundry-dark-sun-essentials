    text:
      format: 1
      content: "<p>An ominous pair of crags rising above the rocky\_badlands south of Tyr, the Dragon Horns serve as the\_lair of a vicious gnoll tribe that calls itself the Dragon\_Horde. The tribe has no connection with the Dragon,\_but its appropriation of the terrifying creature’s name enhances its gruesome reputation. The leader\_of the Horde is a wily old war chiefnamed Tuarg\_Broken-Fang.</p>\n<p>Tuarg and the gnolls have taken swift advantage of\_the confusion following the fall of Tyr’s sorcerer-king. Their raids have grown bolder and bolder as the city\_fails to respond to their forays. Tyr grapples with too\_much internal turmoil to police its outlying plantations and mines. Scenting opportunity, Tuarg has sent\_runners to other gnoll tribes, summoning them to join\_the Dragon Horde. When next the gnolls strike, they\_mean to scour clean everything outside the city walls.</p>"
