      content: "<p>Daro was a client village of Raam. It now serves as a\_stronghold for one of Raam's former templars.\_</p>\n<p>\_</p>\n<p>Origins/History</p>\n<p>Daro was founded over a millennium ago to handle\_trade filtering in through Break Shore. Over the centuries,\_Daro’s focus has shifted from trade to agricultural\_administration, helping to oversee the mass of slaves working\_Raam’s fields.\_With Abalach-Re's death in Free Year 10, Raam,\_never truly a safe place for a templar, became even less so.</p>\n<p>Slaves, freemen, and nobles alike turned on each other, but a</p>\n<p>templar or other civil servant was still considered a common</p>\n<p>enemy by all. A few managed to take control of a portion of the</p>\n<p>city by rallying Raam's civil guard, but most simply fled.</p>\n<p>One such templar was Avish Thira. Gathering a</p>\n<p>small group of servants and underlings, he arrived in Daro</p>\n<p>before word of Abalach-Re's death and the subsequent riots.</p>\n<p>He immediately seized command of the small garrison and</p>\n<p>instituted martial law, cutting the village off from the outside.</p>\n<p>By his swift action he managed to keep most of the chaos</p>\n<p>surrounding Abalach-Re's death outside the walls of his new</p>\n<p>home. Of course, such news couldn't be kept out forever, but</p>\n<p>by the time it arrived, Avish had Daro firmly under his heel.</p>\n<p>The first threat to Avish’s rule arrived at Daro's gates</p>\n<p>less than a week after Abalach-Re's death on the Great Ivory</p>\n<p>Plains. One of Raam's aga (commanders), holding a force of</p>\n<p>heavy crodlu in reserve, managed to retreat in good order.</p>\n<p>Unfortunately the same speed that saw them safely back to</p>\n<p>Raam separated them from the army's baggage train. Aga</p>\n<p>Nebka and his force of 60 arrived on Raam's outskirts dirty,</p>\n<p>tired, hungry, and most importantly, thirsty. Scouts informed</p>\n<p>him of the riots in Raam so he decided to detour to one of</p>\n<p>Raam's client villages for easier foraging.</p>\n<p>Five days after Avish took control of Daro, Nebka</p>\n<p>arrived at his doorstep demanding the gates be opened. With</p>\n<p>Abalach-Re dead not only was Nebka not bound to obey</p>\n<p>Avish, Avish also lacked the magical might to force Nebka to</p>\n<p>obey, so Avish demanded that Nebka swear an oath of loyalty</p>\n<p>to him as vizier of Daro before Nebka would be allowed inside.</p>\n<p>Nebka agreed, not willing to try to take Daro with cavalry or</p>\n<p>return to the road and risk finding a less hospitable reception</p>\n<p>elsewhere. Aside from keeping Nebka's men separate from his</p>\n<p>own, Avish has treated the aga with respect, frequently</p>\n<p>consulting him on matters of governance.</p>\n<p>Location</p>\n<p>Daro is an hour's walk southeast of Raam. It lies on</p>\n<p>the fringe of the fields surrounding the city along a road that</p>\n<p>follows a pass through the mountains to the village of Break</p>\n<p>Shore, on the coast of the Silt Sea. The village is surrounded by</p>\n<p>adobe walls 18' high and nearly 10' thick at their base. Two</p>\n<p>gates of mekillot ribs lashed together with giant hair rope allow</p>\n<p>passage at the north and south ends of the village. The gates</p>\n<p>hang in stone gatehouses each of which has a pair of light</p>\n<p>ballistae mounted on top.</p>\n<p>Some of the original warehouses had been converted</p>\n<p>into barracks for the town's garrison. Raam originally supplied</p>\n<p>the garrison's equipment, including weapons and armor, with</p>\n<p>only facilities to make repairs in Daro. Avish is in great need of</p>\n<p>an armorer and weaponsmith, especially with the arrival of</p>\n<p>Nebka and his men. Should a suitable craftsman be captured</p>\n<p>on a caravan raid he can be guaranteed excellent treatment.</p>\n<p>Daro also has approximately 90 civilians consisting</p>\n<p>primarily of packers, haulers, wheelwrights, carpenters, coopers,</p>\n<p>joiners, stablers, animal handlers, and the usual assortment of</p>\n<p>service professions seen in any well-traveled way stop. The</p>\n<p>crafts practiced by Daro’s freemen are dictated by the needs of</p>\n<p>the trade caravans that pass through. Two professions notably</p>\n<p>absent are brick maker and stonemason; until recently work</p>\n<p>crews from Raam maintained the walls and buildings of Daro.</p>\n<p>This only adds to Avish’s list of professionals to kidnap.</p>\n<p>The Sated Fael is the only inn in town. Above its</p>\n<p>door hangs a sign depicting that undead of mythic appetite</p>\n<p>reclining with its belt loosened and an exhausted look on its</p>\n<p>face. The Fael (as it is more commonly called) is a large, twostory</p>\n<p>building near the southeast corner of Daro's walls. As with</p>\n<p>all businesses and residences in Daro under Avish's rule, the</p>\n<p>Fael is closed from dusk till dawn. The food is only fair and the</p>\n<p>drinks are heavily watered, but prices are still high. The Fael</p>\n<p>can sleep 20 comfortably in second floor rooms plus another 30</p>\n<p>or so in the common room.</p>\n<p>There are no stores in Daro where visitors can buy</p>\n<p>supplies. Goods are so scarce that everything entering Daro is</p>\n<p>considered property of the town and as such gets redistributed</p>\n<p>by Avish. His first priority is to keep his troops well supplied.</p>\n<p>Villages of the Wastes: The North</p>\n<p>7</p>\n<p>Next are his own needs and the needs of his household, followed</p>\n<p>by the town's freemen, and then the former farm slaves.</p>\n<p>Over time Daro had become primarily a farming</p>\n<p>community with a small bureaucracy overseeing the 200 or so</p>\n<p>slaves who worked the fields around Daro. But in the current</p>\n<p>climate of unrest, Avish sees no way to defend the fields</p>\n<p>through an entire growing season. As a result these slaves have</p>\n<p>all been either reassigned or freed (i.e. cast out). Most of those</p>\n<p>that were freed left immediately, but some stuck stubbornly to</p>\n<p>the land they had worked all their lives. Avish offers them no</p>\n<p>protection, but should they manage to grow anything he'll</p>\n<p>certainly take it.</p>\n<p>Organization</p>\n<p>Daro is ruled by Avish Thira, formerly a templar of</p>\n<p>Abalach-Re. He has 150 well-disciplined troops from the</p>\n<p>original garrison at his command. He keeps them loyal and their</p>\n<p>morale high with excellent bonuses, but without his magical</p>\n<p>powers his command would be in jeopardy.</p>\n<p>Avish managed to keep things together for a few</p>\n<p>weeks after Abalach-Re's death through bluff and</p>\n<p>showmanship. When he received a cloaked visitor one night he</p>\n<p>was receptive to the message: acceptance by a new sorcererking.</p>\n<p>Avish was quick to accept the offer. With his</p>\n<p>spellcasting abilities restored, Avish is his old self again: a lying,</p>\n<p>manipulative, violence-prone despot. His conferences with</p>\n<p>Nebka have become less frequent and more trivial.</p>\n<p>Avish has yet to make his new patron’s identity</p>\n<p>public knowledge or even acknowledge the fact that he was</p>\n<p>without spells for a period of time. Whether he is waiting for</p>\n<p>some signal to break his masquerade or simply wishes to keep his</p>\n<p>citizenry in anxious ignorance is likewise a mystery.</p>\n<p>Of primary concern to Avish is money. He managed</p>\n<p>to slip out of Raam with a small fortune in gems and gold but</p>\n<p>that is quickly disappearing into the pockets of his guard. Since</p>\n<p>the village doesn't produce a surplus of any trade good, Avish is</p>\n<p>forced to send out raiding parties to acquire the necessities of</p>\n<p>life.</p>\n<p>His main source of income is in sponsoring raids into</p>\n<p>Raam. Using his knowledge of the location of templar caches of</p>\n<p>arms, coinage, and other valuables, Avish can direct parties of</p>\n<p>adventurers to the goods for a portion of the take. Granted,</p>\n<p>Avish is more likely than not to kill them afterwards and keep</p>\n<p>everything. Sometimes the cache has already been raided, but</p>\n<p>there are always takers for a treasure hunt. Alternately Avish</p>\n<p>might simply sell the location of a cache he knows to be empty</p>\n<p>or contain worthless goods.</p>\n<p>Outside Relations</p>\n<p>Once an administrative center and waypoint for</p>\n<p>travelers, Daro now has little contact with outsiders. Generally</p>\n<p>this contact consists of a raiding party sacking a nearby caravan</p>\n<p>or accosting a group of travelers. Occasionally though some</p>\n<p>trade still finds its way up from Break Shore.</p>\n<p>Travelers who make it to the gates unmolested will</p>\n<p>find them closed. They'll open readily for a caravan with goods</p>\n<p>to sell, but small parties of individuals will have a harder time</p>\n<p>gaining entrance. Those with a useful skill to sell (smith,</p>\n<p>warrior, treasure hunter, mindbender, defiler, etc.) will be</p>\n<p>brought to Avish's attention. Most others will be turned away.</p>\n<p>Avish's guards are not immune to bribes, though; they're just a</p>\n<p>bit more resistant thanks to his excellent pay and vengeful</p>\n<p>nature.</p>\n<p>Travelers who get in can stay at the Fael for the short</p>\n<p>term. More permanent additions to Daro's population will be</p>\n<p>given living quarters in one of the abandoned homes scattered</p>\n<p>around town.</p>\n<p>The other main type of interaction Daro has with</p>\n<p>outsiders is in repulsing raids. This duty falls to Daro's garrison.</p>\n<p>Nebka's troops rarely enter such frays except at the end to</p>\n<p>harass routed foes. So far Daro's guard has fought off two honest</p>\n<p>attempts on its walls and numerous minor attacks, mainly by</p>\n<p>disorganized bands of ex-slaves.</p>\n<p>Important Residents</p>\n<p>Avish Thira</p>\n<p>Male Human Templar, Chaotic Evil</p>\n<p>AC 6 (bone ring of protection +2, Dex) Str 12</p>\n<p>Movement 12 Dex 16</p>\n<p>Level 10 Con 11</p>\n<p>Hit Points 43 Int 18</p>\n<p>THAC0 13 Wis 11</p>\n<p>No. of Attacks 1 Cha 17</p>\n<p>Damage/ Attack: 1d4+1 (boneiron dagger +1)</p>\n<p>Psionics Summary:</p>\n<p>PLAYER’S OPTION: MAC 8</p>\n<p>Villages of the Wastes: The North</p>\n<p>8</p>\n<p>Special Equipment: periapt of proof against poison, silver signet</p>\n<p>ring.</p>\n<p>Spells (3/3/3/2): 1st—command, cure light wounds, detect</p>\n<p>magic; 2nd—aid, hold person, silence, 15' radius; 3rd—dispel</p>\n<p>magic, magical vestment, protection from fire; 4th—produce fire,</p>\n<p>free action.</p>\n<p>Avish Thira is the son of a silk merchant and his</p>\n<p>pampered wife. Whether or not either is still alive in the</p>\n<p>aftermath of Abalach-Re's death Avish neither knows nor</p>\n<p>cares. He left his family to join Raam's government almost 30</p>\n<p>years ago and has had little contact with his family since.</p>\n<p>Avish rode his scheming intellect and glib tongue up</p>\n<p>the templarate ranks quickly. But poor luck caused his rise to</p>\n<p>stall along the dead-end path of Supply. For almost a dozen</p>\n<p>years, Avish had languished as a glorified chamberlain. His</p>\n<p>duties consisted mainly of signing off on requisition forms,</p>\n<p>negotiating prices with traders, and maintaining supplies in the</p>\n<p>palace at siege-ready levels. Avish did not long mourn</p>\n<p>Abalach-Re. Commanding his own little Raam is a dream</p>\n<p>come true!</p>\n<p>Aga Nebka</p>\n<p>Male Human Fighter, Lawful Evil</p>\n<p>AC 2 (scale mail, medium shield, Dex) Str 13</p>\n<p>Movement 12 Dex 17</p>\n<p>Level 9 Con 15</p>\n<p>Hit Points 77 Int 11</p>\n<p>THAC0 12 Wis 13</p>\n<p>No. of Attacks 3/2 Cha 15</p>\n<p>Damage/ Attack: 1d8 (steel long sword)</p>\n<p>Special Equipment: heavy lance, dagger, heavy crodlu with</p>\n<p>forearm blades.</p>\n<p>Psionics Summary: PSPs 51; Wild Talent: control light</p>\n<p>Attack/ Defense Modes: none/ MB, MBk, TW.</p>\n<p>Power Score – 11</p>\n<p>PLAYER’S OPTION: MTHAC0 16; MAC 10;</p>\n<p>Taken into Raam's military at an early age, Nebka's</p>\n<p>agility saved him from the short life of a foot soldier, and his</p>\n<p>forceful personality set him above his peers. A combination of</p>\n<p>luck and skill saw him rise steadily through the ranks and kept</p>\n<p>him alive through the infrequent military campaigns Raam</p>\n<p>participated in. Though he has nowhere near the seasoning of</p>\n<p>one of Urik's war leaders, neither is Nebka green.</p>\n<p>Nebka chafes at Avish's leash. He and his troops are</p>\n<p>ill suited for the sedentary life of garrison duty, and Avish</p>\n<p>allows them few opportunities to exercise their abilities. Morale</p>\n<p>is poor and soon he may have to choose between his command</p>\n<p>and his oath to Avish, which he still feels bound by despite the</p>\n<p>way it was extorted.</p>\n<p>Ninocris</p>\n<p>Female Human Templar, Lawful Neutral</p>\n<p>AC 10 Str 13</p>\n<p>Movement 12 Dex 13</p>\n<p>Level 7 Con 15</p>\n<p>Hit Points 41 Int 15</p>\n<p>THAC0 16 Wis 13</p>\n<p>No. of Attacks 1 Cha 16</p>\n<p>Damage/ Attack: by weapon</p>\n<p>Special Equipment: over-large robes.</p>\n<p>Psionics Summary:</p>\n<p>PLAYER’S OPTION: MAC 10</p>\n<p>Spells (3/2/2): 1st—cure light wounds (x3), light; 2nd—charm</p>\n<p>person or mammal, speak with animals; 3rd—dispel magic, speak</p>\n<p>with dead.</p>\n<p>Ninocris is the cloaked stranger who returned the</p>\n<p>grace of a sorcerer-monarch to Avish. Who that monarch is</p>\n<p>remains unclear. Many rumors state that most likely Ninocris</p>\n<p>serves either Hamanu or Nibenay. But there are some who say</p>\n<p>that Ninocris is not even human. Perhaps the rumors of</p>\n<p>stirrings beneath ruined Giustenal are more than just rumors . .</p>\n<p>.</p>\n<p>Whatever her true allegiance, Ninocris's agenda is</p>\n<p>fairly clear. In addition to indoctrinating Avish into his new</p>\n<p>patron’s service, she uses her magic to maintain a modest circle</p>\n<p>of informants within Daro—both living and dead. Ninocris</p>\n<p>spends most of her time in Avish's spacious quarters, but when</p>\n<p>she does venture out into public she is always concealed in</p>\n<p>heavy, figure-smothering robes. Numerous rumors regarding</p>\n<p>Avish's mysterious guest have sprung up. The most common is</p>\n<p>that she is a powerful psionicist teaching Avish to use the Way</p>\n<p>in case his priestly powers fail him again.</p>\n<p>Villages of the Wastes: The North</p>\n<p>9</p>\n<p>Bala</p>\n<p>Male Half-Elf Fighter/ Thief, Neutral Evil</p>\n<p>AC 7 (leather armor, Dex) Str 16</p>\n<p>Movement 12 Dex 15</p>\n<p>Level 5/6 Con 10</p>\n<p>Hit Points 24 Int 14</p>\n<p>THAC0 17 Wis 12</p>\n<p>No. of Attacks 1 Cha 15</p>\n<p>Damage/ Attack: 1d6 (bone short sword)</p>\n<p>Special Equipment: lockpicks, short bow, 12 bone-tipped flight</p>\n<p>arrows.</p>\n<p>Psionics Summary:</p>\n<p>PLAYER’S OPTION: MAC 10</p>\n<p>Thieving Abilities: PP 45, OL 55, F/RT 25, MS 60, HS 65,</p>\n<p>DN 25, CW 70, RL 0, FD 10, BO -5, EB 10.</p>\n<p>Bala is just one of many spies Avish keeps on his</p>\n<p>payroll. Most lurk in the camps of other Raamin despots, but</p>\n<p>some, like Bala, work at home. Bala spends most of his time in</p>\n<p>the Sated Fael pretending to be more drunk than he really is.</p>\n<p>He tries to pass himself off as a guide to adventuring parties</p>\n<p>Avish has hired to search out a cache in Raam. He does have a</p>\n<p>fairly impressive knowledge of the streets and people of Raam,</p>\n<p>having spent all of his life there up until now and can be a</p>\n<p>valuable asset during a trip into the city. His responsibilities in</p>\n<p>such a case are to aid the hired adventurers then inform Avish</p>\n<p>of what was taken, where it might have been hidden, how good a</p>\n<p>fight they might put up, etc. when the group returns to Daro to</p>\n<p>collect the rest of their pay.</p>"
