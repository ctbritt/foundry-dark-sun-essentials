      content: "<p>They sweep across the Tablelands like nightmare</p><p>wraiths, engaging in an unending spree of murder</p><p>and plunder. They are the Black Sand Raiders, and</p><p>those unfortunate enough to encounter them leave</p><p>only broken, bloody bodies to tell the tale. I decided</p><p>not to include this tribe of ex-slaves on my list of</p><p>stops, but I did want to write about them in this</p><p>chronicle. What follows has been pieced together</p><p>from stories told to me by those who claimed to have</p><p>survived a meeting with the raiders, or those who</p><p>knew someone who had. The most reliable material</p><p>came from a dwarf who had been a member of the</p><p>tribe. He was willing to answer my questions, as</p><p>long as I never asked him his name. I never asked</p><p>him why he left the tribe, either.</p><p>Organization</p><p>All tales told about the Black Sand Raiders are</p><p>told in whispers, as if speaking too loudly about</p><p>these terrible marauders will attract their foul attention.</p><p>They have become creatures of legend, much</p><p>as the Free have. But unlike the tales of the Free, the</p><p>legends concerning the Black Sand tribe are dark</p><p>and evil.</p><p>Most tales center around the tribe\x92s leader, Zeburon,</p><p>who wears an iron helm, iron gloves, and a</p><p>breechcloth over otherwise bare flesh. The man\x97if</p><p>man he is\x97is capable of the same atrocities attributed</p><p>to the sorcerer-kings, though on a smaller</p><p>scale. His cruelty, ruthlessness, and greed set the</p><p>agenda for his followers as he leads them on increasingly</p><p>violent raids from the Siren\x92s Song to the</p><p>Dragon\x92s Bowl. In even quieter voices, people speak</p><p>of Zeburon\x92s wizard. This powerful defiler apparently</p><p>communes with undead creatures, further</p><p>tainting the Black Sand Raiders\x92 already stained</p><p>souls.</p><p>Zeburon rides at the head of a tribe 100 strong.</p><p>Rumors say that the number of raiders never</p><p>changes, neither increasing nor decreasing. When a</p><p>tribe member dies, he is immediately replaced with</p><p>another escaped slave. Despite the claim that there</p><p>are 100 raiders in the tribe, no report has ever</p><p>placed more than 30 of them in a single raiding party.</p><p>The Black Sand Raiders are the epitome of evil</p><p>for those living outside the walls of the city-states.</p><p>These raiders stop at nothing to take what they</p><p>want, and they seem to revel in death and destruction.</p><p>Their chaotic evil tendencies are barely contained</p><p>by Zeburon and his defiler wizard, but they</p><p>are given plenty of opportunities to indulge those</p><p>tendencies during raiding.</p><p>Zeburon rules the Black Sand Raiders, quite literally,</p><p>with an iron fist. He rules through power and</p><p>fear, easily putting down any challengers to his rule.</p><p>For the most part, as long as he continues to lead</p><p>the slaves on successful raids, Zeburon will continue</p><p>to command them. He claims the title of warlord,</p><p>though most of his conquests seem to be over the</p><p>weak and poorly defended. He has yet to take on</p><p>any well-protected caravans or operate near a city-</p>"
