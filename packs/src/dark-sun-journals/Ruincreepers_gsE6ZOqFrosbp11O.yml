        wgCeShTrqHJFBbDr:
          notes: >-
            <p>The Ruincreepers represent the most desperate and dangerous
            element of Tyr's underworld. Their feral nature and tamed braxat
            make them perfect for horror-themed encounters in the city's depths.
            They could guard ancient secrets hidden in the deep ruins, serve as
            unwitting pawns for larger conspiracies, or provide a stark example
            of how far some have fallen since Tyr's liberation. Their halfling
            nature might also create interesting connections for party members
            with halfling backgrounds or knowledge of that race's history on
            Athas.</p>
