    text:
      format: 1
      content: "<p>Feral Halfling Pack</p>\n<p>Savage Gang, Deep Warrens</p>\n<p>This group of displaced halflings lives like feral animals in the deepest part of the Warrens. Word is that they have tamed an escaped braxat that lairs among the dilapidated structures.</p>\n<p>\_</p>"
