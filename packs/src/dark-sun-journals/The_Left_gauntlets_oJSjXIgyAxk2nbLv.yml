    text:
      format: 1
      content: "<p>Left Gauntlet, as one looks eastward from\_Raam—is considerably older and more\_ eathered</p>\n<p>than the southerly range. Sandstorms have reduced\_the Left Gauntlet to rounded domes, split and\_cracked by great fissures. Raam mined these peaks\_for generations, extracting silver and gemstones\_before the mines played out. Now the abandoned\_shafts house tarek tribes that prey on small caravans\_bound for Draj, along with a slave tribe known as\_Krikik’s Pack.</p>"
