      content: "<p>The Criterion at Balic</p><p>The Criterion at Balic is situated beneath the stony, fortified</p><p>bluff that is the palace home of the dictator Andropinis,</p><p>the powerful sorcerer-king. The criterion is made of</p><p>pure white marble and is one of the most beautiful of the</p><p>known arenas. In truth. The Criterion is the name</p><p>bestowed upon the structure and the surrounding area of</p><p>the arena. The name means \x93place of judgment.\x94</p><p>Located at the edge of the nobles\x92 quarters, The Criterion</p><p>is known for its stunning architecture. Great architectural</p><p>sails rise 120 feet from the arena walls toward the</p><p>reddish green Athasian sky. From anywhere in the city,</p><p>the great sails can be seen. It is said the designer based</p><p>the concept of the architecture on ancient drawings discovered</p><p>near the Sea of Silt, but the true object of inspiration</p><p>remains unknown to this day.</p><p>A slate plaza surrounds The Criterion for one city</p><p>block in all directions. The plaza grants an unobstructed</p><p>view of the structure to all arena visitors.</p><p>Just outside The Criterion, a short stair leads to the</p><p>only entrance. As visitors enter, they stand beneath the</p><p>enormous vaulted arena seating. The air here is cooler</p><p>early in the day as the seats shade this lower area from the</p><p>sun. Some fans linger here before trying to find a seat in</p><p>the hot sun. Visitors enter the vast arena via vaulted</p><p>arches that lead to the front of the stands. From there,</p><p>they climb the many rows of steps to find the best seat</p><p>possible.</p><p>The Criterion and enclosed arena are rectangular in</p><p>shape, in contrast to the more common circular arenas.</p><p>The playing area of the arena is 120 feet by 160 feet. The</p><p>floor is composed of hexagonal marble slabs that are 10</p><p>feet across. This unique arena floor is always uneven,</p><p>since no two adjoining slabs are the same height. The</p><p>slabs pitch like the Athasian desert and, at times, there</p><p>can be as much as 10 feet height difference between</p><p>adjoining slabs. A rule of construct for the arena floor</p><p>mandates that every slab must have at least one adjoining</p><p>slab with no more than a 1 -foot height differential. This</p><p>creates ramps, pyramids, and other strikingly unusual</p><p>arena formations.</p><p>The columns that make up the floor are 10 feet wide</p><p>and 30 feet tall, and they stand on a deep sand foundation.</p><p>The columns are shifted periodically to give the rise</p><p>and fall of the floor a new configuration. As a result, this</p><p>arena tends to favor smaller, quicker opponents rather</p><p>than larger brutish ones. On very rare occasions, when a</p><p>truly prized monster is procured for the arena, the slabs</p><p>may be more gently sloped or even perfectly flat if this</p><p>configuration grants the creature more advantage in the</p><p>arena.</p><p>In the back of the arena, near the bluff, is a great outbuilding:</p><p>the slave and creature quarters for the arena at</p><p>Balic. The building is specially constructed from the</p><p>same type of stone as the bluff. The design of the building</p><p>and the materials used were chosen so that the building</p><p>would blend in with the rock of the bluff, so as not to</p><p>detract from the beauty of the great marble Criterion.</p><p>One of the area\x92s finest gladiator schools is also</p><p>located here. The House Jarko of Balic is known for the</p><p>training of gladiatorial slaves. It is said that they receive</p><p>excellent training and pampered treatment. Most do very</p><p>well in the arena.</p>"
