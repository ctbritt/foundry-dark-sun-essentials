      content: "<p>The real center of power in Gulg lies in the Paper Nest. This\_secret society of the queen\x92s most trusted advisers is comprised\_of the highest ranking templars, a few favored nobles, and one or Gulg\x92s reach. The templars are the priests, inquisitors and\_two elders from the Seer\x92s Dagada. Membership in the group\_has varied between eight and 20 individuals over the centuries.\_</p>\n<p>\_</p>\n<p>The Paper Nest takes its name from the nests built by the paper wasps. Its members are called in secrecy to leave the city under the protection of the queen\x92s magic to carry out the\_group\x92s primary function. They meet in a grove outside the\_brambleweed wall where they collect branches for the making\_of paper. With the branches in hand, they return to a chamber\_in the trunk of the obata\x97the Paper Nest. There, they make\_paper for the use of the queen and her templars.</p>\n<p>During this process the members may speak freely with the\_queen without fear of reprisal. In this odd sanctuary the queen\_seeks advice from her most trusted servants. Once the paper\_has been made, the group disbands until the supply dwindles.\_</p>\n<p>Then they are again called to the Paper Nest. (See the Veiled\_Alliance accessory for more on the Paper Nest.)</p>\n<p>\_</p>\n<p>\_</p>\n<p>Gulg hosts another secret society besides the Veiled</p>\n<p>Alliance, this one sponsored by Lalali-Puy. A</p>\n<p>small membership, comprised of the most favored</p>\n<p>nobles, carries out one sacred task: making paper.</p>\n<p>In Gulg as elsewhere on Athas, few cultures make</p>\n<p>paper in large quantities, and some know nothing of</p>\n<p>the process. Paper serves as an emblem of office and</p>\n<p>only the queen and nobility may use it.</p>\n<p>The Paper Nest, named for the paper wasp nests</p>\n<p>that cling beneath agafari trees in the forest, includes</p>\n<p>between one and two dozen members at any</p>\n<p>given time. Lalali-Puy heads the society herself. As</p>\n<p>paper supplies dwindle, she alerts her chief templar,</p>\n<p>Mogadisho, to gather the Nest. In the dark of</p>\n<p>night, cloaked by the queen\x92s spells, they enter the</p>\n<p>orest and walk to a baobab grove no other citizen</p>\n<p>may enter. There they harvest mulberry branches</p>\n<p>from its many bushes. Back at Sunlight Home, they</p>\n<p>begin the paper-making process in a taboo chamber,</p>\n<p>in the trunk of the Sunlight Home\x92s tree. The</p>\n<p>nobles vow renewed loyalty to Lalali-Puy, and they</p>\n<p>leave at dawn.</p>\n<p>The Paper Nest\x92s importance lies not in its ceremonial</p>\n<p>duties, but in its secret power-sharing. Only</p>\n<p>here does the queen, otherwise autocratically</p>\n<p>careless of counsel, seek advice from her underlings</p>\n<p>on issues of the day. They confer with each other as</p>\n<p>well, setting the direction the city-state will take until</p>\n<p>the next time the queen decides she needs paper.</p>\n<p>The Noble Speech: By the queen\x92s decree, nobles</p>\n<p>in Gulg use a consciously archaic form of common</p>\n<p>speech, taught them when they achieved noble</p>\n<p>status. This \x93high speech\x94 uses formal, flowery</p>\n<p>diction and obsolete words. No one has asked the</p>\n<p>queen why she requires this, or at least no one has</p>\n<p>survived the question. Evidently she maintains the</p>\n<p>speech patterns of her early court, now 10,000 years</p>\n<p>in the past.</p>\n<p>In the campaign, have Gulg nobles speak with</p>\n<p>\x93thee\x94 and \x93thou,\x94 and use stilted speech: \x93In</p>\n<p>truth, I bring grave news from our valiant warriors.\x94</p>\n<p>When not around the queen or her templars, a noble</p>\n<p>may relax into ordinary dialogue.</p>"
