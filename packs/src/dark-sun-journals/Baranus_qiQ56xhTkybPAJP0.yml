    text:
      format: 1
      content: >-
        <section class="readaloud">

        <p>As you step into the shadow of the ancient stone buildings of Kled,
        you’re met by a dwarf with skin as weathered as the rocky hills
        themselves. His head is bare, not a single hair on his scalp, yet his
        skin is deeply tanned and creased from countless years spent under the
        merciless sun of Athas. He wears armor crafted from layers of chitin and
        reinforced with scavenged metal plates, each piece marked with careful
        carvings that speak to an age-old dwarven tradition. A large, bronze
        medallion hangs heavily from his neck, engraved with a symbol that
        resembles a sunburst encircling a mountain.</p>

        <p>His gaze is stern, a pair of dark eyes that carry the weight of
        centuries of struggle. Deep lines cut across his face, mapping out a
        lifetime of hardship and resilience, yet there's a sharpness in his eyes
        that suggests a mind as tough as the stone beneath his feet. He leans
        heavily on a staff carved from the bones of a giant lizard, the knotted
        grip worn smooth from decades of use. Despite his age, there’s strength
        in his stance—a determination that mirrors the unyielding spirit of the
        mountains behind him.</p>

        </section>
