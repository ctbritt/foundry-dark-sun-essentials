        jM4h8qpyxwTpfNli:
          notes: >-
            <ul>

            <li><strong>Role</strong>: <strong>Leader of Kled</strong>,
            overseeing the village&rsquo;s daily affairs and serving as a
            guardian of <strong>Kemalok&rsquo;s secrets</strong>.</li>

            <li><strong>Appearance</strong>: A hairless, weathered dwarf with
            <strong>sunbaked skin</strong>, deep lines across his face, and
            <strong>muscular arms</strong> from years of manual labor. He wears
            <strong>chitin armor</strong> adorned with <strong>stone
            carvings</strong> and a <strong>bronze medallion</strong> that bears
            the sigil of <strong>Kemalok&rsquo;s fallen kings</strong>.</li>

            <li><strong>Personality</strong>: <strong>Pragmatic, cautious, and
            stern</strong>, Baranus is deeply loyal to Kled&rsquo;s traditions
            and <strong>protective of the village&rsquo;s independence</strong>.
            He is highly suspicious of <strong>outsiders</strong>, especially
            given the <strong>village&rsquo;s resources</strong> and their
            proximity to the <strong>ancient ruins</strong>. However, he values
            <strong>honor</strong> and respects those who prove their
            <strong>integrity</strong>.</li>

            <li><strong>Motivations</strong>:

            <ul>

            <li>Maintain Kled&rsquo;s <strong>secrecy</strong> and
            <strong>security</strong>.</li>

            <li>Ensure that <strong>Kemalok&rsquo;s history</strong> remains in
            the hands of <strong>dwarves</strong> and not
            <strong>outsiders</strong>.</li>

            <li>Protect the <strong>Book of the Kemalok Kings</strong>, a
            dwarven relic with ancient wisdom.</li>

            </ul>

            </li>

            <li><strong>Interaction with the Party</strong>: Baranus will be the
            <strong>first major hurdle</strong> for the party. He&rsquo;ll need
            to be <strong>convinced</strong> that the party&rsquo;s intentions
            are sincere before granting them access to <strong>Kemalok&rsquo;s
            ruins</strong> or any secrets. If the party helps <strong>solve a
            problem</strong> for Kled (like defeating the <strong>Earth
            Drake</strong> or restoring the <strong>oasis</strong>), he will
            warm up to them.</li>

            </ul>
