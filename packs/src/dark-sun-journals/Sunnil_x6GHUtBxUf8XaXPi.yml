      content: >-
        <p>“And you’ll find yourself on Sunnil’s shelf,</p>

        <p>and then where will you be?”</p>

        <p>—Popular dance-hall song</p>

        <p>As one might gather from the construction of its name, Sunnil’s roots
        are ancient. The</p>

        <p>city has declined since its founding, and now finds itself one of the
        least of the ledge</p>

        <p>communities. Sunnil is a village of 1,000 residents, known for its
        breweries.</p>

        <p>Sunnil’s administrator, Mak-amoar (haf/F5/N), is extremely ill—a
        victim of the debilitating</p>

        <p>effects of Rajaat’s Curse. The har-etuil are loath to have to find a
        replacement for</p>

        <p>this popular official, but there may be little choice. She is
        bedridden and barely able to</p>

        <p>keep up her duties even through assistants.</p>

        <p>Places of Note</p>

        <p>Clon-sin Bridge: This stone bridge connects the two ledges on which
        Sunnil is built. It is</p>

        <p>the longest bridge ever erected by the rhul-thaun that is still in
        existence, stretching</p>

        <p>nearly 500 yards. The bridge is wide enough for 20 halflings to walk
        abreast. Organic</p>

        <p>buildings grow along the sides of the bridge to utilize precious
        space. Most of these</p>

        <p>buildings house lower-class homes.</p>

        <p>Hast-ulon Temple: This temple of elemental water is maintained by two
        clerics, Thavadern</p>

        <p>(haf/P11/NG) and Lus-okuhv (ham/P10/LG), a married couple who have a
        great</p>

        <p>deal of political influence in this small village. They are consulted
        by the local har-etuil</p>

        <p>on matters of importance, and even those who pay no heed to the faith
        of water respect</p>

        <p>these two.</p>

        <p>Important NPCs</p>

        <p>Ther-adar (haf/F9): AC 6 (Dex bonus); MV 6; hp 51; THAC0 12; #AT 3/2;
        Dmg 1d10</p>

        <p>(flashlance); SZ S (2’ 11”); ML Elite (14); AL N; XP 1,000.</p>

        <p>S 14, D 18, C 10, I 11, W 16, Ch 10.</p>

        <p>Personality: preoccupied, distant.</p>

        <p>Special Equipment: flashlance, shield swarm, spinethrower,
        yihn-eflan.</p>

        <p>This windrider makes her home in Sunnil. She is the daughter of the
        current administrator,</p>

        <p>but she has no desire to take her place. Her home is in the skies,
        and no one can</p>

        <p>make her believe otherwise. Nevertheless, she feels guilty about
        letting her mother</p>

        <p>down.</p>

        <p>Ther-adar is rugged and tough. Her black hair is cut very short, and
        she is rarely seen</p>

        <p>in anything but sturdy work clothes.</p>
