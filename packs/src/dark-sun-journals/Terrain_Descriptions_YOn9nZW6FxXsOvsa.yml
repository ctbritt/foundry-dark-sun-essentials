    name: Terrain Descriptions
    _id: SW6Euqae1Z2ENcjW
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Mountains</strong></p>

        <ol>

        <li>

        <p>Upland covered in thin, dusty soil with waist high grass and brightly
        colored flowers.</p>

        </li>

        <li>

        <p>Small, scattered stands of thorny cacti clustered in narrow crevasses
        in the stony slopes.</p>

        </li>

        <li>

        <p>The steeply carved channels of seasonal waterways, filled with
        jumbled stone and gravel.</p>

        </li>

        <li>

        <p>Tenacious trees, their trunks twisted into corkscrew patterns by the
        brutal winds.</p>

        </li>

        <li>

        <p>Crumbling stone rising from the earth, surrounded by patches of stone
        and gravel.</p>

        </li>

        <li>

        <p>Landscape of worn, round stone, with thickets of brush and cacti
        growing from cracks and depressions.</p>

        </li>

        <li>

        <p>Steep, stony slopes rising from the trail below, the crests topped
        with densely packed brush.</p>

        </li>

        <li>

        <p>Large, broken boulders tumbled around the landscape.</p>

        </li>

        <li>

        <p>Sloping landscape of broken stone and gravel, providing treacherous
        footing.</p>

        </li>

        <li>

        <p>A landscape of sharp, buckled ridges, shattered arches, and twisted
        spires.</p>

        </li>

        </ol>

        <p><strong>Rocky Badlands</strong></p>

        <ol>

        <li>

        <p>A rolling landscape of crumbling stone and gravel, spilling into
        sudden gorges and cliff faces.</p>

        </li>

        <li>

        <p>Steep slopes and crags of worn stone, their faces gouged with narrow
        fissures and clefts.</p>

        </li>

        <li>

        <p>Expanses of smoothly worn stone, colored in bright bands of
        sedimentary deposit.</p>

        </li>

        <li>

        <p>A maze of narrow, stony canyons and cliffs, the ancient stone carved
        by wind and water.</p>

        </li>

        <li>

        <p>Tufts of verdant green grasses and shrubs growing from isolated
        fissures and clefts hidden amidst the stony landscape.</p>

        </li>

        <li>

        <p>A flat and sandy canyon bottom, a refuge from the torturous landscape
        around it.</p>

        </li>

        <li>

        <p>Broken, jagged boulders jumbled at the base of cliffs, sheared away
        from the weary stone by wind and time.</p>

        </li>

        <li>

        <p>Dense thickets of thorny scrub and cacti growing from the recesses of
        narrow fissures carved in the landscape.</p>

        </li>

        <li>

        <p>A rolling expanse of smooth stone, resembling stony waves forever
        frozen in time.</p>

        </li>

        <li>

        <p>A massive boulder, standing in brooding isolation amidst the broken
        terrain around it.</p>

        </li>

        </ol>

        <p><strong>Salt Flats</strong></p>

        <ol>

        <li>

        <p>A flat expanse of sunbaked salt, the surface carved into small,
        geometric shapes by small cracks.</p>

        </li>

        <li>

        <p>Low, irregular formations of salt, shaped like molten glass, rising
        from the salt-crusted surface.</p>

        </li>

        <li>

        <p>Shallow, incredibly briny water an inch or two deep, its surface
        gleaming like a mirror under the relentless sun.</p>

        </li>

        <li>

        <p>Isolated tufts of incredibly hardy, wiry scrub, the vegetation
        mottled white with windblown salt.</p>

        </li>

        <li>

        <p>Jumbled boulders that break the monotony of the flat, their rounded
        surfaces seemingly braced against the constant wind.</p>

        </li>

        <li>

        <p>Foul, shallow puddles of water laden with toxic salts, capable of
        burning any exposed flesh unlucky enough to touch it.</p>

        </li>

        <li>

        <p>Wind-blown patches of hard-packed soil, the brown earth etched with
        white salt in its recesses.</p>

        </li>

        <li>

        <p>Low ridges that form islands amidst the sea of salt around it, their
        stony surfaces crowded with a panoply of cacti and shrubs.</p>

        </li>

        <li>

        <p>Broken rocks and boulders studding the otherwise flat landscape,
        their surfaces worn smooth by time.</p>

        </li>

        <li>

        <p>A great monolith of stone standing dozens of feet above the flat
        plain, it’s steep cliffs stained white with salt, it’s isolate summit
        crowded with shrubs and twisted trees.</p>

        </li>

        </ol>

        <p><strong>Sandy Wastes</strong></p>

        <ol>

        <li>

        <p>Long, undulating ridges of sand, creased by steep, narrow
        defiles.</p>

        </li>

        <li>

        <p>Errant ‘sand devils’ that rise and fall without warning, plumes of
        loose sand whipped into the atmosphere by stray gusts of wind.</p>

        </li>

        <li>

        <p>Low, eroded outcroppings of rock rising from the shifting sands like
        the backs of half-buried beasts.</p>

        </li>

        <li>

        <p>Flat, desolate expanses of loose sand, the surface dappled with
        widely scattered stones and gravel.</p>

        </li>

        <li>

        <p>A rolling sandscape of low, rippling dunes, creating a rumpled carpet
        of gentle, shifting slopes.</p>

        </li>

        <li>

        <p>Tufts of brittle, wiry grass and cacti loosely clumped together, the
        tallest thickets rising waist high.</p>

        </li>

        <li>

        <p>The short, squat trunks of dormant trees, their stubby branches
        rising skywards. Clad in thick, rock-like bark, the trees sleep for
        decades between rains.</p>

        </li>

        <li>

        <p>Remnants of ancient buildings, reduced to little more than broken
        bits of foundation and toppled columns, peeking from the slowly
        suffocating sand.</p>

        </li>

        <li>

        <p>Broken stone rising from the sands in great outcroppings, the wind
        having carved the stone into fantastic arches and spires.</p>

        </li>

        <li>

        <p>Yellowed salt grass clinging to the bases of steeply sloping sand
        dunes in tenacious little clusters.</p>

        </li>

        </ol>

        <p><strong>Scrub Plains</strong></p>

        <ol>

        <li>

        <p>Strange, stubby trees sparsely spread over an expanse of low-laying
        scrub growing from a sandy soil.</p>

        </li>

        <li>

        <p>A gently undulating landscape, studded with crumbling rock outcrops
        and tenacious, knee-high plants clinging to the soil.</p>

        </li>

        <li>

        <p>A variegated landscape of scrub, with the local flora contributing a
        palette of colors from old bone to olive-green.</p>

        </li>

        <li>

        <p>Clusters of greener, leafier plants rising from the dry, yellowed
        brush dominating the landscape.</p>

        </li>

        <li>

        <p>Groups of bulbous, brightly flowered cacti sitting like over-ripe
        blisters amidst a background of broken, browned vegetation.</p>

        </li>

        <li>

        <p>Thickets of green vegetation erupting from the dusty brush, harboring
        small stunted trees and bizarre cacti.</p>

        </li>

        <li>

        <p>Thousands of tiny, white and yellow flowers peeking from the
        low-lying brown scrub, dotting the landscape with mottled color.</p>

        </li>

        <li>

        <p>Ancient streambeds cutting deep gouges into the worn stone.</p>

        </li>

        <li>

        <p>Low growing, widely spread trees spreading their wiry branches
        towards the omnipresent sun on a baked plain.</p>

        </li>

        <li>

        <p>Endless flat expanses of sand and worn stone, with nothing to break
        the monotony than scrubby, patches of brush rising less than a few
        inches from the soil.</p>

        </li>

        </ol>

        <p><strong>Stony Barrens</strong></p>

        <ol>

        <li>

        <p>Loose, jumbled stones and boulders laying haphazardly across the
        landscape.</p>

        </li>

        <li>

        <p>Thickets of wiry scrub and small cacti sprouting from the bases of
        crumbling, rocky outcrops.</p>

        </li>

        <li>

        <p>Great, broken slabs of broken stone riven by sharp, narrow fissures
        and the courses of ancient waterways.</p>

        </li>

        <li>

        <p>A flat, empty expanse with small, jagged stones strewn amidst clumps
        of low, huddled shrubs.</p>

        </li>

        <li>

        <p>Flat, sandy soil dotted with tufts of waist-high weeds and stunted,
        wind-twisted trees.</p>

        </li>

        <li>

        <p>Rolling, heaving landscape of gravel- and boulder-strewn slopes, with
        dense tangles of shrubs and cacti growing in the grottos between
        peaks.</p>

        </li>

        <li>

        <p>Tall, sentinel cacti erupting from the broken stone and sands, with
        tangled clumps of smaller shrubs and cacti around them.</p>

        </li>

        <li>

        <p>Massive, eroded stone formations rising from the surrounding
        landscape, their steep faces creased by erosion.</p>

        </li>

        <li>

        <p>A torturous expanse of wind-sheared stone, forming a treacherous
        terrain of sharp spires and deep, hidden fissures.</p>

        </li>

        <li>

        <p>Solitary, rounded boulders standing isolated amongst a broken
        plain.</p>

        </li>

        </ol>
