      content: >-
        <p dir="ltr"
        style="line-height:1.6667;margin-top:0pt;margin-bottom:0pt"><span
        style="font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap">Makla
        is a client village of Urik, located on the shore of the Lake of Golden
        Dreams.</span></p>

        <p dir="ltr"
        style="line-height:1.6667;margin-top:9pt;margin-bottom:0pt"><span
        style="font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap">It
        is a rugged town serving as a supply center and base camp for the slave
        gangs quarrying obsidian from the Smoking Crown. Makla is rarely
        harassed by raiders, for 500 Urik soldiers armed with obsidian-edged
        swords and spears are stationed here. They are supplemented by 50
        half-giants armed with lances and clubs and a force of 25 halfling
        hunters assigned to track down escaped slaves.</span></p>
