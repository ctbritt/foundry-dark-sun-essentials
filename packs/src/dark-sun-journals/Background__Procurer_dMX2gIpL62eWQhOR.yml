        <section class="mcp-journal">
              

              <div class="wrap">
                <h1>Background: Procurer</h1>
                <hr class="orn" />

                <p class="lead">A custom Dark Sun background for elf trader-thieves who conduct legitimate mercantile activities as cover for their true profession. Includes skill proficiencies, equipment, feature, and suggested characteristics.</p><div class="grid-2"><div><h3>Quest Details</h3><ul><li><strong>Type:</strong> Side Quest</li></ul></div><div><h3>Rewards &amp; Status</h3><ul><li><strong>Status:</strong> Active</li><li><strong>Created:</strong> 12/16/2025</li></ul></div></div><h2 class="spaced">Adventure Hook</h2><div class="readaloud"><p><strong>Read-Aloud:</strong> Disturbing rumors begin circulating in the area. Multiple witnesses describe strange and threatening events that demand immediate investigation. The situation clearly demands investigation before it worsens.</p></div><div class="gmnote"><p><strong>GM Notes:</strong> This quest is designed as a side quest. Adjust encounters, NPCs, and obstacles to match your party's level and campaign tone. Consider appropriate rewards based on the quest's difficulty and your party's level.</p></div><h2 class="spaced">Quest Objectives</h2><ul><li>Complete the main objective: A custom Dark Sun background for elf trader-thieves who conduct legitimate mercantile activities as cover...</li><li>Report the outcome to the appropriate authorities</li></ul><h2 class="spaced">Progress Notes</h2><div class="gmnote"><p><strong>GM Note:</strong> Use this section to track quest progress, player decisions, and any modifications made during gameplay.</p></div>
              <h2 class="spaced">Prerequisite</h2>
        <p><strong>Elf only</strong></p>


        <h2 class="spaced">Description</h2>

        <div class="readaloud"><p>Procurers are elf trader-thieves who conduct
        legitimate mercantile activities with one hand while stealing with the
        other. To all outward appearances, procurers seem to be everyday elf
        traders. They conduct their thefts in secret, using normal trading
        practices to cover their filching activities. These elves usually work
        for elven merchant houses, filling market stalls with goods stolen from
        merchants, nobles, free citizens, templars, and even the
        sorcerer-kings.</p></div>


        <p>No matter what a procurer appears to be doing, they are always
        observing the people around them. They know how to spot those who can
        help or hinder their job, and are always aware of their surroundings.
        The procurer considers simple theft to be beneath their station. They
        need to make the big score.</p>


        <h2 class="spaced">Proficiencies</h2>

        <p><strong>Skills:</strong> Deception, plus one from Insight,
        Persuasion, or Sleight of Hand</p>

        <p><strong>Tools:</strong> Thieves' tools, plus forgery kit or disguise
        kit</p>

        <p><strong>Languages:</strong> One of your choice</p>


        <h2 class="spaced">Equipment</h2>

        <ul>

        <li>A set of fine clothes suitable for trading</li>

        <li>Thieves' tools</li>

        <li>A merchant's scale</li>

        <li>A small sample of trade goods (worth 5 cp)</li>

        <li>A concealed belt pouch containing 15 cp</li>

        </ul>


        <h2 class="spaced">Feature: Legitimate Cover</h2>

        <div class="readaloud"><p>You maintain a convincing cover identity as a
        legitimate trader. You know the trade routes, market days, and
        mercantile customs of the Tablelands. You can establish a trading
        presence in any marketplace, which provides you with a plausible reason
        to be almost anywhere and speak with almost anyone. While maintaining
        your trader cover, you have advantage on Charisma (Deception) checks to
        avoid suspicion when conducting covert activities. Additionally, you
        have contacts within elven merchant networks who can fence stolen goods,
        provide information about valuable targets, or warn you of templar
        investigations.</p></div>


        <h2 class="spaced">Suggested Characteristics</h2>

        <h3>Personality Traits (d8)</h3>

        <ol>

        <li>I am always watching, always calculating the value of everything
        around me.</li>

        <li>I can talk my way into or out of almost any situation.</li>

        <li>I maintain a cheerful, friendly demeanor that hides my true
        intentions.</li>

        <li>I speak in terms of profit, loss, and opportunity.</li>

        <li>I have an eye for quality and can spot a fake from across a
        market.</li>

        <li>I never reveal my true feelings about a deal until the transaction
        is complete.</li>

        <li>I treat every interaction as a negotiation, even casual
        conversations.</li>

        <li>I am patient—the best scores require careful planning and perfect
        timing.</li>

        </ol>


        <h3>Ideals (d6)</h3>

        <ol>

        <li><strong>Profit.</strong> Every exchange should benefit my tribe. If
        it benefits me, even better. (Neutral)</li>

        <li><strong>Excellence.</strong> I am an artist. The theft itself is the
        masterpiece. (Any)</li>

        <li><strong>Loyalty.</strong> My tribe and my merchant house come first.
        Always. (Lawful)</li>

        <li><strong>Opportunity.</strong> In chaos, there is opportunity.
        (Chaotic)</li>

        <li><strong>Justice.</strong> I steal from those who have too much to
        give to those who have too little. (Good)</li>

        <li><strong>Power.</strong> Wealth is power. The more I acquire, the
        stronger we become. (Evil)</li>

        </ol>


        <h3>Bonds (d6)</h3>

        <ol>

        <li>I work for an elven merchant house and will do anything to advance
        its interests.</li>

        <li>I am planning the score of a lifetime—one that will make me a legend
        among procurers.</li>

        <li>I maintain contacts throughout the Tablelands who depend on me for
        goods and information.</li>

        <li>I wronged another procurer once, and they haven't forgotten.</li>

        <li>My tribe invested everything in my training. I must prove their
        faith was not misplaced.</li>

        <li>I have a rival procurer from another tribe, and we compete to see
        who can make the biggest scores.</li>

        </ol>


        <h3>Flaws (d6)</h3>

        <ol>

        <li>I cannot resist the opportunity for a big score, even when the risk
        is too high.</li>

        <li>I trust my own assessment of people too much and have been fooled
        before.</li>

        <li>I look down on "simple" thieves who lack my sophistication.</li>

        <li>I have difficulty letting go of grudges against those who have
        cheated me.</li>

        <li>I sometimes forget which identity I am supposed to be using.</li>

        <li>I have sticky fingers—I take small items without thinking, even when
        I don't need to.</li>

        </ol>


        <div class="gmnote"><p><strong>Tribal Affiliation:</strong> Procurers
        can be found among the elf tribes that conduct mercantile activities,
        especially the Clearwater, Swiftwings, Shadows, Sky Singers, Silver
        Hands, and Night Runners tribes.</p>

        <p><strong>Suggested Classes:</strong> Rogue (Thief, Mastermind,
        Trader)</p>

        <p><strong>Adventuring Notes:</strong> Procurers have no qualms about
        joining adventuring groups. They offer added protection, an obvious
        cover story, and able bodies when a job is difficult. A procurer will
        disappear from their group from time to time to pass along goods or
        information to their tribe.</p></div></div>
            </section>
