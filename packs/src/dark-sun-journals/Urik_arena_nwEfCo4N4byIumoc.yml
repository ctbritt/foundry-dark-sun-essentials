      content: "<p>Urik\x92s Pit of Black Death</p><p>Urik is home to the Pit of Black Death, the great obsidian</p><p>arena. Formerly the city\x92s first obsidian mine, it was</p><p>abandoned when higher grade obsidian was found not</p><p>far from the burgeoning town. The excavation was soon</p><p>turned into the gladiatorial arena of Urik, and given the</p><p>name \x93Pit of Black Death.\x94</p><p>The pit is the only irregularly-shaped combat field in</p><p>the Tablelands. The pit remains in the same distorted</p><p>oval shape as when it was abandoned from quarrying.</p><p>Stepped excavation has added viewing tiers along the</p><p>outside of the pit. Wooden rails have been placed near</p><p>the edge of these tiers for standing spectators. Stairways</p><p>are located only on the corners, which makes getting to</p><p>the preferred viewing areas of the arena difficult.</p><p>The upper standing platforms are larger than usual to</p><p>accommodate half-giants who attend the games. There</p><p>is no seating at the arena. Urik is unique in this type of</p><p>arrangement.</p><p>The arena itself is almost as deadly as the gladiators.</p><p>The black obsidian heats in the midday sun, causing</p><p>temperatures in the pit to rise to over 170 degrees.</p><p>Gladiators loathe fighting in Urik\x92s arena for still</p><p>another reason. The bright Athasian sun can reflect off</p><p>the mirrorlike obsidian surface and temporarily blind a</p><p>fighter, giving the opposing combatant the chance to</p><p>strike a killing blow.</p><p>To make matters worse, the walls are covered with</p><p>thousands of razor-sharp ridges. The fractured obsidian</p><p>sticks out from the pit\x92s walls, each point a potential</p><p>instrument of death. Scattered indiscriminately</p><p>throughout the arena are the \x93Staves of Hamanu.\x94 The</p><p>staves are, in reality, large black pillars with thousands</p><p>and thousands of sharp obsidian points chipped from</p><p>the stone, named for the sorcerer-king of Urik. The</p><p>staves are moved periodically to new positions within the</p><p>arena. They are removed if damaged, or, in some cases,</p><p>to be sharpened.</p><p>The number of staves varies on each gladiatorial combat</p><p>day. Some days, there may be twenty or thirty smaller</p><p>rock outcroppings that create a dangerous gauntlet in</p><p>which the gladiators fight. Other times, one or two huge</p><p>monoliths of sharpened ebony stone dominate the</p><p>arena. It is said that the number and placement of the</p><p>staves is at the whim of the king. Others say it is the work</p><p>of the templars, creating a favorable fighting environment</p><p>for their gladiators to battle.</p><p>Because of the intense temperature in the pit during</p><p>the midday sun, games begin at dawn. Fans make their</p><p>way under cover of darkness to the stadium. The stadium</p><p>and aisles are lit by torches and vessels of burning</p><p>oil. As the first light heralds the dawn of a new day, the</p><p>first match begins. As the sun rises, so does the heat in</p><p>the arena. Match games and executions are held early,</p><p>before the arena heats to its maximum intensity.</p><p>Special matches called \x93Dragon Matches\x94 are held</p><p>at the very end of the gladiatorial card. The dragon</p><p>matches are often held at high noon, when the arena is</p><p>at peak temperature. This not only taxes the combatants</p><p>\x92 fighting ability, but the endurance and stamina of</p><p>the crowd as well. Fighting under these conditions, a</p><p>combatant loses twice as much water than normal in</p><p>combat. In addition, the obsidian walls are so hot that</p><p>when a combatant\x92s bare skin brushes up against the</p><p>walls, he suffers 1d4 points of burn damage.</p><p>Urik is one of the few stadiums that once held night</p><p>games in the cool of the evening. Great oil burning</p><p>lamps, 12 feet in height, were brought in and mounted</p><p>on pedestals at the upper portions of the arena. Great</p><p>magical glass lenses were placed in front of the lamps to</p><p>make the light brighter. The pit was always packed for</p><p>the night games. They were known as \x93rogue\x94 games,</p><p>because the stands were thick with thieves, out to filch</p><p>purses in the dark of the night.</p>"
