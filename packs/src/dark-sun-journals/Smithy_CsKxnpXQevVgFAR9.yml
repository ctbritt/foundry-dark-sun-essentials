        jM4h8qpyxwTpfNli:
          notes: >-
            <ul>

            <li><strong>Proprietor</strong>:&nbsp;<strong>Tharn</strong>, a
            gruff but skilled dwarf who once worked the forges
            in&nbsp;<strong>Urik</strong>&nbsp;before returning to his ancestral
            home.</li>

            <li><strong>Services/Items</strong>:

            <ul>

            <li><strong>Chitin Armor
            Repair</strong>&nbsp;and&nbsp;<strong>Weapon
            Sharpening</strong>&nbsp;(useful for maintaining gear in the harsh
            environment).</li>

            <li>A small stock of&nbsp;<strong>bronze and bone weapons</strong>.
            Though he rarely sells metal items, he might have&nbsp;<strong>one
            or two ancient dwarven tools</strong>&nbsp;for a hefty price or if
            the party can earn his trust.</li>

            <li><strong>Custom Tool-Making</strong>, such as climbing spikes or
            picks for exploring ruins.</li>

            </ul>

            </li>

            </ul>

            <p><strong>Special Interaction</strong>: Tharn is known to
            <strong>barter</strong> instead of simply selling for coin,
            preferring <strong>items of practical value</strong> like
            <strong>food</strong>, <strong>water</strong>, or
            <strong>knowledge</strong> about <strong>ancient dwarven
            artifacts</strong>. He might be convinced to part with a
            <strong>family heirloom</strong> if the party proves their
            <strong>worth</strong> in battle or helps with <strong>village
            security</strong>.</p>
