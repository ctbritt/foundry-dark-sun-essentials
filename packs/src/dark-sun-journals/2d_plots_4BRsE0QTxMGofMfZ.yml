      content: "<p>Setup. Choose a PC (not the one from Encounter 2C) for this encounter. Arrange a</p>\n<p>place to speak privately.</p>\n<p>Start. This encounter occurs at night. Read the following to the PC:</p>\n<p>The night winds promise near-freezing temperatures. Slaves huddle in batches or</p>\n<p>wrap tightly in thread-bare blankets. Beyond your cluster of slaves, you spot a</p>\n<p>shadowy shape that, instead of huddling for warmth, furtively picks its way</p>\n<p>among the sleeping forms. Do you follow it?</p>\n<p>If the PC answers no, the encounter ends. Otherwise, continue.</p>\n<p>Encounter. The shadowy NPC is Cruerex, an informer, who moves through the</p>\n<p>darkness to a guard post. To enter earshot of the discussion, the PC must make a</p>\n<p>50% roll (thieves add MS percents). If the roll fails, the informer flees. Success</p>\n<p>means the PC hears:</p>\n<p>\x93I told you, I don\x92t know their plan. Just tell Theindar the slaves have some big</p>\n<p>plan\x97maybe with gladiators\x92 help. If he wants me to finger the leaders, let me</p>\n<p>know.\x92\x92</p>\n<p>The informer then indicates that he must go. To avoid the informant\x92s notice, the</p>\n<p>PC must instantly move to cover (same percent chance). If discovered or if the PC</p>\n<p>confronts the NPC, the informer offers a deal: in exchange for silence, the PC</p>\n<p>receives easy work detail, better food, and adequate water. If the PC refuses or</p>\n<p>threatens the NPC, he runs for the guard. Tell the player the consequences of being</p>\n<p>fingered by the informer\x97before the next sunset, four guards will murder the PC.</p>\n<p>If the PC goes undetected and does not confront the NPC, he can follow him to</p>\n<p>learn the NPC\x92s identity. The next day, the PC spots the informer with a group of</p>\n<p>slaves. If the PC confronts the informer, the NPC offers the same deal, with the</p>\n<p>same consequences. If the PC approaches the slaves and tells them of the informer,</p>\n<p>the leader of their group, Granj, pretends ignorance. But next morning the informer</p>\n<p>is dead. Thereafter, Granj views the PC most favorably. If the PC neither confronts</p>\n<p>nor turns in the informer, two days later the guards seize and execute the plotters.</p>\n<p>Role-Playing. The informer is cool and cold-blooded: if he cannot make a deal, he</p>\n<p>removes the problem. Granj acts wary and suspicious but can be convinced of the</p>\n<p>PC\x92s sincerity. He verbally prods the PC to test his reactions.</p>\n<p>Dialogue</p>\n<p>\x93Keep your mouth shut and things\x92ll get lots better for you.\x94</p>\n<p>\x93If tomorrow you got the chance to escape\x97what would you do?\x94 [Granj]</p>\n<p>S t a t i s t i c s . Informer (Cruerex): AL NE; AC 10; MV 12; HD 3; hp 10; THAC0</p>\n<p>19; #AT 1; Dmg 1-2 (punch/wrestle); ML 10.</p>\n<p>Outcome. If the PC eliminates the informer, the guards become suspicious and</p>\n<p>handle the PC roughly. Word of this treatment spreads and eventually Granj visits</p>\n<p>the PC and express his thanks.</p>\n<p>Next. From this encounter, play Part Three, Encounter D\x97Champion of the</p>\n<p>Cause, or go to other storylines of Part Two.</p>"
