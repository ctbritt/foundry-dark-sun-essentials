  - name: Water
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: |-
        <h2>Water</h2>
        <h3>Daily Need</h3>
        <table>
        <thead>
        <tr><th>Creature</th><th>Water per day</th></tr>
        </thead>
        <tbody>
        <tr><td>Small</td><td>½ gallon</td></tr>
        <tr><td>Medium</td><td>1 gallon</td></tr>
        <tr><td>Large</td><td>4 gallons</td></tr>
        <tr><td>Thri-kreen (any size)</td><td><strong>1 gallon per week</strong></td></tr>
        </tbody>
        </table>
        <p>This is the base rate for an active creature. Apply every modifier below that fits the day, multiplying them together and rounding up to the nearest quarter gallon.</p>
        <table>
        <thead>
        <tr><th>Condition</th><th>Water need</th></tr>
        </thead>
        <tbody>
        <tr><td>Travelled 1+ hour in heat above 100 °F</td><td>×2</td></tr>
        <tr><td>Travelled 1+ hour in extreme heat above 130 °F</td><td>×4</td></tr>
        <tr><td>Travelled by night instead of by day</td><td>×½</td></tr>
        <tr><td>Under shade or shelter the whole day</td><td>×½</td></tr>
        <tr><td>Inactive all day — resting, holed up</td><td>×½</td></tr>
        <tr><td>Wearing metal armor without shade</td><td>×2</td></tr>
        </tbody>
        </table>
        <p>A thri-kreen ignores the heat multipliers entirely.</p>
        <blockquote><p><strong>Worked example.</strong> A human marching a full day in 110 °F heat needs 2 gallons. The same human crossing the same ground at night needs 1. Doing it at night with a sun cloak rigged over the day camp needs ½.</p></blockquote>
        <h3>Dehydration</h3>
        <p>At the end of any day a creature drank less than it needed:</p>
        <table>
        <thead>
        <tr><th>Water drunk</th><th>Effect</th></tr>
        </thead>
        <tbody>
        <tr><td>Half or more of the requirement</td><td>DC 15 Constitution save or 1 exhaustion level</td></tr>
        <tr><td>Less than half</td><td>1 exhaustion level, no save — 2 if it already had any exhaustion</td></tr>
        <tr><td>None at all</td><td>2 exhaustion levels</td></tr>
        </tbody>
        </table>
        <h3>Carrying Water</h3>
        <p>A waterskin holds <strong>½ gallon</strong> and weighs 4 lb full.</p>
        <p>A Medium creature can carry <strong>12 waterskins at most — 6 gallons.</strong> A Small creature carries 6. This is a limit of bulk, not of weight: no amount of Strength lets you strap on more.</p>
        <p>Six gallons is three days of daytime marching, or six of night marching. Anything longer than that needs casks on a pack beast, a wagon, or a known water source on the route. <strong>Parties do not cross open desert on foot.</strong></p>
    _id: dseSrvWater003A0
