  - name: Travel Pace
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: |-
        <h2>Travel Pace</h2>
        <p>A normal travel day is <strong>8 hours</strong>.</p>
        <p>Each hour beyond the eighth requires a Constitution saving throw at the end of that hour. The DC is <strong>10, +1 for each hour past the eighth</strong>. On a failure, gain 1 exhaustion level.</p>
        <p><strong>A creature suffering from dehydration cannot force march at all.</strong> The party loses the ability to make up lost time exactly when it most needs it.</p>
        <h3>Travelling by Night</h3>
        <p>Night marching halves water requirements, and is the single most effective thing a party can do to extend its range.</p>
        <ul>
        <li>Creatures without darkvision need a light source, or the party treats the route as difficult terrain.</li>
        <li>No foraging while marching at night.</li>
        <li>Navigation is made with disadvantage without darkvision or clear skies.</li>
        </ul>
    _id: dseSrvTravel06A0
