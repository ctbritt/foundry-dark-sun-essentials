  - name: Heat and the Sun
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: |-
        <h2>Heat and the Sun</h2>
        <p>Athasian daylight climbs past 100 °F by midmorning and can reach 130 °F or worse by late afternoon. Night falls hard the other way — near freezing in open desert, below it in the mountains.</p>
        <p>Heat is not damage. Heat is a multiplier on how fast you drink, and dehydration is what kills you. See <strong>Water</strong>.</p>
        <p>The practical consequence: a party that travels at night and shelters through the worst of the day spends half the water of one that marches at noon. Over a week-long crossing that difference is the crossing.</p>
    _id: dseSrvHeatSun02A
