  - name: The Exhaustion Track
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: |-
        <p><em>Athas 5e — 2024 Player's Handbook baseline</em></p>
        <p>On Athas the desert is an opponent. It does not roll initiative, but it spends your resources every hour you are exposed to it, and it wins by attrition against parties that treat crossing distance as travel time rather than as a problem to be solved.</p>
        <p>Everything below runs on one track: <strong>exhaustion</strong>. Thirst, hunger, heat, and pushing too hard all feed the same ladder, and nothing in these rules asks you to track a second one.</p>
        <h2>The Exhaustion Track</h2>
        <p>Athasian survival uses the standard 2024 exhaustion rules without modification. Every source of attrition in this document adds levels to this one track.</p>
        <table>
        <thead>
        <tr><th>Levels</th><th>Effect</th></tr>
        </thead>
        <tbody>
        <tr><td>1–5</td><td>−2 to all D20 Tests per level, and −5 feet of Speed per level</td></tr>
        <tr><td>6</td><td>Death</td></tr>
        </tbody>
        </table>
        <p>A long rest removes 1 level, subject to the conditions under <strong>Resting</strong> below — which on Athas are not automatic.</p>
        <p>There is no separate thirst meter, heat meter, or Constitution damage. If a rule here would hurt you, it does so by moving you down this ladder.</p>
    _id: dseSrvExhaust01A
