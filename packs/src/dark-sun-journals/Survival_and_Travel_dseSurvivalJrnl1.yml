  - name: Resting
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: |-
        <h2>Resting</h2>
        <h3>Removing Exhaustion</h3>
        <p>A long rest removes 1 exhaustion level <strong>only if</strong> the creature both:</p>
        <ul>
        <li>consumed at least half its food and half its water that day, <strong>and</strong></li>
        <li>had shade or shelter for the rest.</li>
        </ul>
        <p>Without shelter, a long rest removes no exhaustion. This is why an oasis, a ruin, or a cave is worth going out of your way to reach.</p>
        <h3>Healing Without Shelter</h3>
        <p>A creature that takes a long rest without shade or shelter regains hit points only by spending Hit Dice. It does not regain all its hit points at the end of the rest.</p>
        <p>With shelter, recovery follows the standard rules.</p>
    _id: dseSrvResting10A
