  - name: Navigation
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: |-
        <h2>Navigation</h2>
        <p>Roll Wisdom (Survival) when travelling without a road, path, or landmark to follow. The Dungeon Master sets the DC from terrain.</p>
        <p>Modifiers that always apply:</p>
        <table>
        <thead>
        <tr><th>Condition</th><th>Effect</th></tr>
        </thead>
        <tbody>
        <tr><td>Overcast or heavy cloud</td><td>+2 DC</td></tr>
        <tr><td>Fog, dust, or sandstorm</td><td>+5 DC</td></tr>
        <tr><td>Night, without darkvision</td><td>Disadvantage</td></tr>
        <tr><td>Character has a relevant background or ranger training</td><td>Advantage</td></tr>
        </tbody>
        </table>
        <p>On a failure the party veers off course or loses time — the Dungeon Master determines which, and the party does not automatically know it has happened.</p>
    _id: dseSrvNavig007A0
