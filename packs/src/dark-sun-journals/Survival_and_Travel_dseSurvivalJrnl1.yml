  - name: Weather Hazards
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: |-
        <h2>Weather Hazards</h2>
        <h3>Sandstorm</h3>
        <p>Visibility drops to a few feet. Travel is impossible or at a crawl; the party is treated as heavily obscured. Navigation is at +5 DC and no foraging is possible. Shelter is the only real answer.</p>
        <h3>Extreme Heat</h3>
        <p>A day above 130 °F. Water requirements are multiplied by 4 for anyone travelling. Sheltering through the worst hours is often cheaper than the distance gained.</p>
        <h3>Cold Night</h3>
        <p>Open desert after dark drops near freezing, and mountains below it. A creature without shelter, a fire, or cold-weather gear makes a DC 10 Constitution save at dawn or gains 1 exhaustion level.</p>
        <h3>Strong Wind</h3>
        <p>Ranged attacks are made with disadvantage, as are Wisdom (Perception) checks relying on hearing. Open flames are extinguished. Combined with loose sand, treat as a sandstorm.</p>
    _id: dseSrvWeathr08A0
