  - name: Foraging and Finding Water
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: |-
        <h2>Foraging and Finding Water</h2>
        <p>One attempt per character per day, and <strong>only at a slow pace</strong>. A character who forages does not also cover normal distance, and cannot forage while marching at night.</p>
        <p>Make a Wisdom (Survival) check against the land's abundance:</p>
        <table>
        <thead>
        <tr><th>Land offers</th><th>DC</th></tr>
        </thead>
        <tbody>
        <tr><td>Abundant food and water</td><td>10</td></tr>
        <tr><td>Limited resources</td><td>15</td></tr>
        <tr><td>Very little</td><td>20</td></tr>
        </tbody>
        </table>
        <p>Much of Athas offers nothing, and no check is possible. The Dungeon Master sets abundance from the terrain.</p>
        <p>On a success, find <strong>1d6 + Wisdom modifier</strong> pounds of food. Roll again separately for gallons of water.</p>
        <p>Foraging is not a supply plan. It is a way to stretch one that already exists.</p>
    _id: dseSrvForage05A0
