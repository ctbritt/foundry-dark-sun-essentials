  - name: Pack Beasts and Containers
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: |-
        <h2>Pack Beasts</h2>
        <table>
        <thead>
        <tr><th>Beast</th><th>Water per day</th><th>Carries</th></tr>
        </thead>
        <tbody>
        <tr><td>Kank</td><td>2 gallons</td><td>400 lb</td></tr>
        <tr><td>Inix</td><td>8 gallons</td><td>2,000 lb</td></tr>
        <tr><td>Mekillot</td><td>16 gallons</td><td>8,000 lb — 40,000 lb drawing a wagon</td></tr>
        </tbody>
        </table>
        <p>Heat and night modifiers apply to beasts exactly as to characters.</p>
        <p>Beasts carry casks rather than waterskins and are limited by weight alone.</p>
        <p>A beast denied its full water for two or more consecutive days becomes unreliable — refusing to move, bolting, or worse, at the Dungeon Master's discretion. The risk grows each further day.</p>
        <blockquote><p><strong>On the limits of a kank train.</strong> Kanks drink enough that adding more of them stops helping after about a week — two kanks and four kanks reach nearly the same distance. Genuinely long hauls need inix or mekillots. This is why merchant houses run the big beasts and adventurers do not.</p></blockquote>
        <hr />
        <h2>Containers</h2>
        <table>
        <thead>
        <tr><th>Container</th><th>Holds</th><th>Weight full</th></tr>
        </thead>
        <tbody>
        <tr><td>Waterskin</td><td>½ gallon</td><td>4 lb</td></tr>
        <tr><td>Cask (beast- or wagon-borne)</td><td>10 gallons</td><td>85 lb</td></tr>
        </tbody>
        </table>
        <p>Water weighs roughly 8⅓ lb per gallon.</p>
    _id: dseSrvPackBs09A0
