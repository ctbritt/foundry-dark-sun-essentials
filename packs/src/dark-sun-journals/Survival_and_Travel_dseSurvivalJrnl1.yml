  - name: Food
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: |-
        <h2>Food</h2>
        <h3>Daily Need</h3>
        <p>1 lb per day for a Medium creature. Half rations count as half a day without food.</p>
        <h3>Starvation</h3>
        <p>A creature can go <strong>3 + its Constitution modifier</strong> days without food before it begins to starve. Each day past that limit is 1 exhaustion level.</p>
        <p>Eating a full day's ration reduces the days-without-food count by 2. Until that count reaches zero, at least one level of exhaustion cannot be removed by any means except eating.</p>
    _id: dseSrvFood0004A0
