      content: "<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"><span style=\"color:#212121;font-family:Lato\"><span style=\"font-size:14.6667px;white-space:pre-wrap\">The city-states in the Tyr Region enjoy an uneasy peace. Although hostilities simmer and raids provoke retaliation, these incidents seldom grow into larger conflicts. Open war between two city-states leaves one or both vulnerable to neighbors that might take advantage ofweakness and attack. The current arrangement of powers has lasted for a long time, but the ruins ofYaramuke show that things can change. </span></span></span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"><span style=\"color:#212121;font-family:Lato\"><span style=\"font-size:14.6667px;white-space:pre-wrap\">Long ago, Yaramuke was the fourth city-state along the Road of Kings, Raam’s nearest neighbor and occasional ally. Yaramuke’s sorcerer-queen Sielba doomed her people when she reached too far. Sielba had long coveted the obsidian of the Smoking Crown, so she sent prospectors into the mountains to establish new quarries. When Hamanu of Urik discovered Yaramite miners in his mountains, he rounded them up and sent their heads back to Yaramuke as a warn ing against further encroachments.</span></span></span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\">Incensed, Sielba sent an army of new slaves to take\_the mines by force, but Hamanu’s Imperial Guard crushed them easily. Since it was clear that Sielba\_hadn’t understood his warning, Hamanu chose to\_strike back. He led a small army up the Road of\_Kings, moving slowly as a sign of his disdain for his\_opponent. When his army arrived a month later, he\_found Yaramuke well defended, its walls protected by\_thousands of warriors.</p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\">The Urikite legions surrounded the city but did not\_attack. Instead, Hamanu climbed to the highest hill\_overlooking the city and began a terrible incantation.\_So powerful was this ritual, so destructive its force,\_that Hamanu drew the life from all the plants and\_animals for miles around. His magic shattered the\_city’s walls, killed its defenders, and swept through\_the streets, slaying thousands in a rain of fiery death.\_Not even the Urikite army was spared, and many of\_Hamanu’s soldiers fell alongside those of Yaramuke. By the time the magic had run its course, the city was\_reduced to rubble, and the lands around were poisoned, defiled, and ruined for all time.\_Although Yaramuke was destroyed, the citystate\_was never sacked, and some believe that it still\_contains secrets and riches. The promise of Sielba’s\_vast wealth is enough for many adventurers to set\_aside common sense and plunge headlong into the\_devastated city.</p>"
