    text:
      format: 1
      content: |-
        <p>The valley of the Last Sea is ringed on</p>
        <p>three sides by the Thunder Mountains.</p>
        <p>Only the eastern edge lies open to the</p>
        <p>Burning Plains instead. Together, these</p>
        <p>nearly impassable barriers make a formidable</p>
        <p>natural fence around the entire valley.</p>
        <p>The Thunder Mountains are nearly</p>
        <p>impenetrable, but for three passes. The</p>
        <p>North Pass is rarely used, as few civilized</p>
        <p>peoples live to the north of Marnita's valley.</p>
        <p>The West Pass is a bit more traveled, but</p>
        <p>since it cascades out of the mountains and</p>
        <p>into the Crimson Savanna, there are also</p>
        <p>few visitors coming from that direction. The</p>
        <p>South Pass, on the other hand, is the main</p>
        <p>gate into the valley of the Last Sea.</p>
        <p>The South Pass</p>
        <p>It's through the South Pass that merchants</p>
        <p>from Saragar make their twice-annual</p>
        <p>pilgrimage to the outlands to meet with</p>
        <p>caravans from distant Tradenest. It's also</p>
        <p>the means by which most outsiders make</p>
        <p>it into the valley, especially if they are not</p>
        <p>willing to brave the Burning Plains.</p>
        <p>Because of this, the pass is, of course, the</p>
        <p>most well-guarded of the valley's entrances.</p>
        <p>The North and West Passes have almost</p>
        <p>no security measures outside of the Border</p>
        <p>of the Guardians. The South Pass, on the</p>
        <p>other hand, is guarded by a high watchtower.</p>
        <p>This small fortress is built on the inside of</p>
        <p>the Border of Guardians, so it is mostly</p>
        <p>a secondary line of defense, one that has</p>
        <p>rarely been used.</p>
        <p>The watchtower is staffed at all times by</p>
        <p>a full patrol of 10 proctors and a single</p>
        <p>239</p>
        <p>Beyond the Tyr Region</p>
        <p>lawkeeper to watch over them. The patrols keep watch in</p>
        <p>split shifts of four hours each (four hours on, four hours</p>
        <p>off, four hours on, four hours off, eight hours of sleep).</p>
        <p>This way, they are always relatively fresh and alert.</p>
        <p>Thus, the watchtower holds 30 proctors and three</p>
        <p>lawkeeper at all times. Fresh troops are brought in from</p>
        <p>Saragar fortnightly.</p>
        <p>At night, the pass is lit by dozens of torches, making</p>
        <p>it difficult to sneak through unnoticed. Nevertheless,</p>
        <p>sneaky adventurers sometimes find some way to get past</p>
        <p>unnoticed.</p>
        <p>The Great Trade Days</p>
        <p>Every year just before midsummer's and midwinter's eve,</p>
        <p>the ssurran traders from Tradenest make their biannual</p>
        <p>journey to a sheltered clearing nestled in between the</p>
        <p>Thunder Mountains and the Scorched Plateau. To these</p>
        <p>meetings, they bring all sorts of exotic foods and trinkets,</p>
        <p>anything that might possibly catch the eyes of the Last</p>
        <p>Sea merchants who are permitted to travel outside of the</p>
        <p>valley's boundaries for this express purpose.</p>
        <p>In exchange, the homelanders (as the denizens of the</p>
        <p>Last Sea are fond of referring to themselves) bring all</p>
        <p>sorts of unique things to trade: metal weapons, sails</p>
        <p>made from puddingfish hide (in high demand for the</p>
        <p>extremely different ships that sail the Silt Sea), and –</p>
        <p>most importantly – fresh water (directly from Saragar's</p>
        <p>desalination plant, making it some of the purest water to</p>
        <p>be found on the entire planet).</p>
        <p>The Great Trade has become a famous tradition in</p>
        <p>the valley. At the height of the festivals – far and away</p>
        <p>the two most important holidays in the entire valley –</p>
        <p>the caravans of merchant wagons return from beyond</p>
        <p>the mountains, overloaded with a veritable cornucopia of</p>
        <p>exotic foods and other items.</p>
        <p>People from all across the valley arrive in Saragar for</p>
        <p>the festivals, and these are the only times of the year</p>
        <p>that the unity these people all feel, regardless of any</p>
        <p>arguing they might do the rest or me year, is blatantly</p>
        <p>obvious. Even the Lizard Men normally reclusive in their</p>
        <p>undersea kingdom, surface and join the festivities of the</p>
        <p>air breathers for a few short hours.</p>
        <p>The festivals are also the only times of the year that</p>
        <p>all of the lawkeepers can be seen to act like civilized</p>
        <p>creatures. Only the most horrid crimes are prosecuted</p>
        <p>during the festivals, mostly because the lawkeepers are</p>
        <p>having far too much fun and can't be troubled to go after</p>
        <p>someone for something like jaywalking.</p>
        <p>Many of the people who have escaped from or sneaked</p>
        <p>into the valley of the Last Sea have done so during one</p>
        <p>of these festivals. The security at even the South Pass is</p>
        <p>notoriously lax at these times of year; only five proctors</p>
        <p>are on watch at any given time and they are often caught</p>
        <p>up in participating in their own miniature version of the</p>
        <p>festivals.</p>
        <p>Under no circumstances, however, are the merchants</p>
        <p>ever willing to bring someone back across the border with</p>
        <p>them. They might do so unwittingly, but to knowingly</p>
        <p>invite the terrible repercussions of the lawmakers for such</p>
        <p>a transgression is something that not even the greediest</p>
        <p>merchant would do-if he valued his life in the slightest.</p>
