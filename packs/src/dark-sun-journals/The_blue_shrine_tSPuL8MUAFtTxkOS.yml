    text:
      format: 1
      content: "<p>For most residents ofAthas, it’s a commonly accepted fact that if gods ever existed in the world, they are long since dead or driven off. The Blue Shrine, however, suggests otherwise. This ancient structure\_remains untouched by the hands of time, its white</p>\n<p>marble gleaming in the crimson sun. Within the\_shrine, an endlessly smoking throne rests before the\_altar. Those who sit in the throne and breathe the\_smoke experience a dizzying rush of visions: enormous, shining warriors battling beasts of living rock</p>\n<p>and wind, armies of priests kneeling in obeisance,\_the smell of incense, and the sound of ancient hymns\_rising to the sky.</p>"
