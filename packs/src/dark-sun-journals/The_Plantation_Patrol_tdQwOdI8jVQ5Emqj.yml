    image: {}
    text:
      format: 1
      content: >-
        <h1>Encounter Level: 16 (15,000 XP)</h1><p>As the party passes one of
        the active plantation estates, they encounter not mere guards, but a
        significant military force—evidence of just how dangerous the Tablelands
        have become.</p><h1>Setup</h1><h1>Read aloud:</h1><div class="fvtt
        narrative"><p>Ahead, the road passes between two massive stone pylons
        topped with iron spikes and  warning glyphs. This isn't just an estate
        boundary—it's a fortress. Fields of erdlu grain stretch away on both
        sides, where work gangs labor under the watch of mounted overseers and
        half-giant sentries. The sign reads "House Beryl War-Estate—Trespassers
        Will Be Enslaved or Executed."</p><p>As you approach, a horn blast
        echoes from watchtowers flanking the road. Armed figures emerge from
        concealed positions—this is clearly a well-prepared military checkpoint,
        not a simple guard post.</p></div><p>Read when the party comes within 60
        feet:</p><div class="fvtt narrative"><p>A woman in ornate battle armor
        rides forward on a heavily armored crodlu, flanked by elite soldiers
        whose gear bears the marks of veteran campaigners. Behind them, you hear
        the creaking of loaded ballistas.</p><p>"I am War-Captain Kyra Beryl!"
        she calls out, her voice carrying absolute authority. "You will state
        your business, submit to inspection, and pay the transit tax—or you will
        not pass at all. The Free City's chaos ends at our
        borders!"</p></div><h2><strong>Environmental
        Factors</strong></h2><h4>@UUID[Compendium.dnd-dungeon-masters-guide.equipment.dmgBallista00000]{Ballista}
        Emplacements (2)</h4><p><em>Large objects</em></p><p><strong>Armor
        Class</strong> 15<br /><strong>Hit Points</strong> 50 each<br
        /><strong>Damage Threshold</strong> 10</p><p>Each ballista is crewed by
        2 guards and can fire once per round: <strong>Ballista Bolt.</strong>
        <em>Ranged Weapon Attack:</em> +6 to hit, range 120/480 ft., one target.
        <em>Hit:</em> 22 (3d10 + 6) piercing damage.</p><h4><strong>Fortified
        Positions</strong></h4><ul><li>Guards begin behind 3/4 cover (+5
        AC)</li><li>Half-giants positioned to flank any retreat</li><li>Psion
        starts on elevated platform (20 feet
        up)</li></ul><h1><strong>Tactics</strong></h1><p><strong>Round
        1:</strong></p><ul><li>Psion casts <em>hypnotic pattern</em> to disable
        multiple party members</li><li>Ballistas target obvious
        spellcasters</li><li>Kyra uses Command to position guards for formation
        fighting</li></ul><p><strong>Round 2-3:</strong></p><ul><li>Guards
        advance in formation using pikes</li><li>Half-giants attempt to grapple
        and isolate party members</li><li>Psion focuses on <em>counterspell</em>
        and battlefield control</li></ul><p><strong>Round
        4+:</strong></p><ul><li>Kyra uses legendary actions to Rally wounded
        allies</li><li>Psion switches to <em>dominate person</em> on dangerous
        targets</li><li>Tactical retreat if Kyra drops below 50 hit
        points</li></ul><h1><strong>Resolution
        Options</strong></h1><h4><strong>Diplomatic Resolution</strong>
        <em>(Recommended)</em></h4><p><strong>Skill Challenge:</strong> 4
        successes before 3 failures, varying DCs</p><p><strong>Possible
        Approaches:</strong></p><p><strong>Persuasion (DC
        18):</strong></p><ul><li>Present the letter from Kled (+2 to
        roll)</li><li>Offer substantial payment (1,000+ gp)</li><li>Demonstrate
        legitimate business</li><li>Success: Kyra grants passage and shares
        strategic intelligence</li></ul><p><strong>Intimidation (DC
        16):</strong></p><ul><li>Display epic-level magical
        power</li><li>Reference cosmic threats you've faced</li><li>Success:
        Kyra recognizes you as too dangerous to
        oppose</li></ul><p><strong>Deception (DC 20):</strong></p><ul><li>Claim
        to be envoys from another sorcerer-king</li><li>Pretend to be
        investigating threats to all nobles</li><li>Success: Kyra provides
        escort and detailed briefing</li></ul><p><strong>Insight (DC
        15):</strong></p><ul><li>Recognize Kyra's fear of losing noble
        privilege</li><li>Understand House Beryl's desperation</li><li>Success:
        Gain advantage on subsequent social checks</li></ul><h4><strong>Combat
        Consequences</strong></h4><p><strong>If Combat
        Erupts:</strong></p><ul><li>This becomes a major incident affecting
        faction relationships</li><li>Tyr's authorities will
        investigate</li><li>Sets tone for how party handles political
        opposition</li></ul><h3><strong>Information
        Gained</strong></h3><p>Successful resolution reveals critical
        intelligence:</p><p><strong>About Tyr's Military
        Situation:</strong></p><ul><li>"The city's defenses are a joke—too many
        factions pulling different directions"</li><li>"Rikus trains his freed
        slaves well, but they lack discipline and proper
        equipment"</li><li>"King Tithian has been requesting 'military
        assessments' from all the noble houses"</li></ul><p><strong>About
        Economic Warfare:</strong></p><ul><li>"House Vordon grows
        desperate—they're making deals with slavers from other
        cities"</li><li>"The iron shortage affects more than tribute—we can't
        properly arm our forces"</li><li>"Someone's been buying up weapons and
        supplies in bulk, but quietly"</li></ul><p><strong>About Political
        Intelligence:</strong></p><ul><li>"Councilor Agis hasn't been seen in a
        week—the nobles are getting nervous"</li><li>"Templars have been asking
        about strangers with 'unusual capabilities'"</li><li>"There are rumors
        about secret meetings in the old ziggurat"</li></ul><p><strong>About
        External Threats:</strong></p><ul><li>"Urik's spies are
        everywhere—Hamanu hasn't forgotten about our iron"</li><li>"Strange
        weather omens—unseasonably cold winds from the
        southeast"</li><li>"Merchants report seeing unusual creatures in the
        deep
        desert"</li></ul><h3><strong>Aftermath</strong></h3><h4><strong>Friendly
        Resolution</strong></h4><ul><li>Kyra provides military escort to Tyr's
        gates</li><li>Letter of introduction to Matriarch Shoshana
        Beryl</li><li>Warning about specific threats in the city</li><li>+2
        reputation with Noble faction</li></ul><h4><strong>Hostile
        Resolution</strong></h4><ul><li>Immediate message sent to Tyr via
        magical means</li><li>Enhanced security measures at all gates</li><li>-2
        reputation with Noble faction</li><li>+1 reputation with Revolutionary
        faction (if news spreads)</li></ul>
