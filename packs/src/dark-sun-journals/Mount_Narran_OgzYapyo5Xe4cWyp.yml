    text:
      format: 1
      content: "<p>The steep slopes of this dark peak are sometimes\_visible from the walls of Tyr, especially when witch\_lights play within its gaping mouths. Tunnels, tombs,\_and long-looted ruins riddle the mountain’s lower\_reaches. On a plateau near the summit stand the\_crumbled\_ walls of an ancient githyanki outpost.\_</p>\n<p>Today, the only inhabitants of the ruins, the tunnels,\_and the winding stairs beneath are gith that hunt\_the Ringing Mountains, ambushing sources of food.\_</p>\n<p>The warrens below Mount Narran contain thousands more fierce gith. It is said that they revere an old statue hidden far below the surface, where they carry\_out savage rites of blood and sacrifice.</p>"
