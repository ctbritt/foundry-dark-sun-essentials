      content: "<p>In addition to the encounters (Friend in Need, Girl Trouble, Treachery, Plots, and</p>\n<p>Kindness of Strangers), Part Two contains a number of shorter scenes. These scenes</p>\n<p>are brief incidents that function separately from the main action of the adventure,</p>\n<p>and can occur at numerous times and places. The scenes let PCs further develop the</p>\n<p>friendships set up in Part One (and gain new enemies). A specific scene may, thus,</p>\n<p>affect future encounters, but no one scene is critical to the progress of the adventure.</p>\n<p>The first group of scenes that follows further develops alliances begun in Part</p>\n<p>One. The second group provides new antagonists for the PCs while teaching them</p>\n<p>the harshness of slave life.</p>\n<p>Scene: Allies</p>\n<p>Setup. The following scenes occur over a period of one or more days (or nights) and</p>\n<p>should interlace with the encounters of Part Two. Each of these scenes introduces the</p>\n<p>PCs to a friendly NPC who may become an ally for the remainder of Freedom.</p>\n<p>Descriptions and statistics for these NPCs appear on pp. 13-16 of the Background</p>\n<p>Book. Before selecting a scene to run, consult your notes on the encounters you used</p>\n<p>in Part One. Determine which (if any) of the NPCs look favorably on the PCs, and</p>\n<p>which PC in particular has been kindest or most helpful to the NPC. The NPC will</p>\n<p>deal with that PC only. Don\x92t use an encounter unless the PCs have genuinely</p>\n<p>earned the NPC\x92s trust. Ask the players to turn to Players\x92 Book p. 39\x97Slave</p>\n<p>Pens.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Elf Brawl. The friendly NPC is Orman of the Waste, the</p>\n<p>half-elf the PCs helped. In the pens, Orman warily introduces</p>\n<p>himself to the PC that helped him most and asked why</p>\n<p>he was helped: he neither asked for nor wanted the PC\x92s aid.</p>\n<p>His eyes narrow suspiciously if the character seems to have</p>\n<p>acted altruistically. Shaking his head, Orman grumbles,</p>\n<p>\x93Now I owe you a favor,\x94 and stalks back to his own corner of</p>\n<p>the pit. He refuses to talk with the PC after this and makes</p>\n<p>clear that wants to be left alone. Orman will, however, aid the PC once to pay off his</p>\n<p>debt. Orman\x92s statistics appear at the end of the Background Book.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Serious Offense. The friendly NPC in this scene is the mul</p>\n<p>fruit-vendor, Hamash. He approaches the PC who was most</p>\n<p>hostile to nobleman Verrasi. Though Hamash dislikes the</p>\n<p>PC, he dislikes Verrasi even more. \x93So, that son-of-an-mix</p>\n<p>Verrasi got you too,\x94 he snarls by way of introduction. \x93I\x92d</p>\n<p>like to wring the water from that saucy whelp!\x94 Hamash continues</p>\n<p>his berating if the PC responds in kind. Make it clear</p>\n<p>to the PC that the two are only bound by their hatred of Verrasi.</p>\n<p>Hamash will not help the PC in the pens, but may prove useful in later adventures.</p>\n<p>Hamash\x92s statistics appear at the end of the Background Book.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Preservers! The friendly NPC is Mahlanda, the woman protected</p>\n<p>from the templars. She works the slave kitchens and</p>\n<p>brings extra food, water, and even an obsidian dagger to the</p>\n<p>PC who most aided her. (Note: If any PC betrayed her, she is</p>\n<p>not present for the adventure.) The supplies prevent dehydration</p>\n<p>for 1 to 3 people per day. If encouraged, Mahlanda</p>\n<p>drops hints about the Veiled Alliance, attempting to recruit</p>\n<p>the PC to sabotage the ziggurat. Mahlanda\x92s statistics appear</p>\n<p>at the end of the Background Book.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Press Gang. The friendly NPC is Eramas, the gladiator (if</p>\n<p>not already dead). During the day, he spots the PC who</p>\n<p>fought most valiantly in the encounter. \x93Old friend!\x94 he</p>\n<p>roars, throwing down his tools and striding to the PC\x92s side,</p>\n<p>pushing slaves and overseers out of the way. A fight almost</p>\n<p>erupts before a wall of guards arrives and restores order. That</p>\n<p>night, Eramas seeks out the PC, bringing a bottle of palm</p>\n<p>wine he purloined. If in the area, Eramas will stand by the PC</p>\n<p>in any fight, no matter what the odds. Eramas\x92s statistics appear at the end of the</p>\n<p>Background Book.</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>Shanghaied. The friendly NPC is Chch\x92kraran, the thrikreen</p>\n<p>at the inn. It cautiously approaches the PC most scalded</p>\n<p>by the soup and says nothing for a long time. Finally it asks</p>\n<p>in blunt, buzzing tones, \x93Were you tck-akken att the inn?\x94</p>\n<p>After the PC answers, the creature bows with stiff formality</p>\n<p>and introduces itself. By its code of conduct, the thri-kreen</p>\n<p>and PC are bonded by misfortune. It will aid the PC as a</p>\n<p>pack-mate, but expects no less in return. The thri-kreen is</p>\n<p>never cordial\x97always formal\x97and its obligation in no way extends to other PCs.</p>\n<p>Chch\x92kraran\x92s statistics appear at the end of the Background Book.</p>"
