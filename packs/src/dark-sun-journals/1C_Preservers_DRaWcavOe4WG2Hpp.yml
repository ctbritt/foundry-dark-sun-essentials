      content: "<p>Setup. This encounter occurs in a wine\_shop or inn. Tell the players to turn to\_Players\x92 Book p. 44\x97Wine Shop.</p>\n<p>Start. Have the players indicate which table\_their characters are occupying. One\_seat remains empty. Read the following:</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>The cool air in your lungs and the</p>\n<p>sweet wine on your lips ease the day\x92s</p>\n<p>tensions. All about, a cheerful clink of</p>\n<p>mugs and rattle of conversation fill the</p>\n<p>air, and the rich aroma of roasting</p>\n<p>meat bodes well for the meal to come.</p>\n<p>\_</p>\n<p>Encounter. Once the PCs become comfortable,\_the inn door bursts open and a\_woman frantically dashes into the room.\_She searches for someone table-to-table.\_When she reaches the PCs, a commotion\_comes at the door. The woman abruptly\_takes the empty seat at the PC table. Three templars with\_eight mul fighters march into the hall and block all exits. The\_head templar harshly demands, \x93Where is the renegade Preserver?\_</p>\n<p>\x94 No one says a word.</p>\n<p>\_</p>\n<p>Role-Playing. Play the templars as cold-hearted and merciless.\_As they move among the tables, the muls twist patrons\_around for a better look at them. Their search starts at a table\_far from the PCs and works slowly toward them. The templars\_\x92 irritation grows with each failure.\_</p>\n<p>The customers sullenly refuse to speak. They loathe and fear the templars. Make\_it clear the PCs can expect no help if a fight begins. Several patrons glance significantly\_toward the woman.\_The woman fights to seem calm. She studies the reactions of all the PCs. If any\_smile or show reassurance, she relaxes. If any show hostility, she readies a spell.</p>\n<p>\_</p>\n<p>Dialogue\_</p>\n<p>\x93King Kalak will favor anyone able to help us.\x94</p>\n<p>\x93Look at Templar Mandax when he speaks!\x94 [Mul twists man\x92s head]</p>\n<p>\x93It\x92s been so long! How is your family?\x94 [Woman to PC]</p>\n<p>Outcome. No NPC betrays the woman. If the PCs likewise hold their tongues, the</p>\n<p>templars arrest everyone in the place. Though angry, no one dares resist. If any PC</p>\n<p>betrays the woman, that character is rewarded with an sp and a pledge of Kalak\x92s favor,</p>\n<p>then released. The woman and other PCs are arrested as Veiled Alliance spies.</p>\n<p>Next. The PCs go to work on the ziggurat; the woman, bound and gagged, is taken</p>\n<p>elsewhere. If all the PCs are captured, go to Part Two. Otherwise, continue with</p>\n<p>Encounter 1A, 1B, 1D, or 1E.</p>"
