  - name: Chardalyn
    type: text
    src: null
    text:
      content: >-
        <section class="wa-section main-content"><img
        src="https://www.worldanvil.com/uploads/images/85af22a52837a08246d24b52680b7ef8.webp"
        /><p>Chardalyn is a rare, naturally occurring substance mined in nugget
        form in <span class="article-link article-explorer-link entity-link
        wa-link" data-article-privacy="public"
        data-article-id="bb065af0-d962-454d-8fa3-629984d54202"
        data-template-type="location"
        data-article="bb065af0-d962-454d-8fa3-629984d54202">The Frozen
        Expanse</span> of <span class="article-link article-explorer-link
        entity-link wa-link" data-article-privacy="public"
        data-article-id="9a3001f6-8c32-4bcf-b419-e23d9d659cca"
        data-template-type="location"
        data-article="9a3001f6-8c32-4bcf-b419-e23d9d659cca">Azthir-Terra</span></p></section><section
        data-section-id="pronunciation" class="wa-section
        public"><dl><dt><p>Pronunciation</p></dt><dd><p>/ˈtʃɑːrdɑːlɪn/</p></dd></dl></section><section
        data-section-id="type" class="wa-section
        public"><dl><dt><p>Type</p></dt><dd><p>Metamaterial</p></dd></dl></section><section
        data-section-id="characteristics" class="wa-section
        public"><h2>Characteristics</h2><p>A single chardalyn could absorb one
        spell, which was released when the stone was crushed or destroyed. This
        was a natural ability of the substance and did not require any magical
        preparation or treatment beforehand. The spell stayed encased in the
        chardalyn indefinitely—it could be released seconds or centuries later.
        Usually, the spell was cast with the chardalyn as the target and it was
        absorbed without fail, but an empty chardalyn had a slightly better than
        even chance to absorb a spell that did not target it directly, as long
        as it was in the spell's area of effect. Once a chardalyn was imbued
        with a spell, additional spells had no effect on the stone. When
        shattered, the attributes (power, volume, duration, damage, etc.) of the
        spell were unchanged and the focal point was the exact location where
        the breakage occurred.</p><p>The ancient Netherese tried for many years
        to find a use for the powder residue left behind after smashing a
        chardalyn, but to no avail.</p><hr /></section><section
        data-section-id="origin" class="wa-section
        public"><h2>Origin</h2><p>When first discovered in Netheril, these
        oval-shaped black stones were described as "useless rocks" by miners,
        but their affinity for magic was soon discovered. These nuggets were as
        brittle as glass and turned into a powder when they were forcefully
        struck or when hurled against a solid object. Until the early 1370s DR,
        the rarity and fragility of chardalyns contributed to their high base
        value of 20,000 gp. Once techniques like gem magic became more
        widespread, the base value of chardalyns dropped to 8,000 gp for a large
        stone that could hold the most powerful magics, and even lower for
        smaller, more limited stones.</p><hr /></section>
