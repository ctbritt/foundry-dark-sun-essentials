  - name: Mythallar
    type: text
    src: null
    text:
      content: >-
        <section class="wa-section main-content"><img
        src="https://www.worldanvil.com/uploads/images/e79cd9eb045f89a1e95554db06ef6367.jpeg"
        /><p>A mythallar was a device found in the <span class="article-link
        article-explorer-link entity-link wa-link" data-article-privacy="public"
        data-article-id="f81b8f57-20e4-4dd3-aadb-042202024827"
        data-template-type="organization"
        data-article="f81b8f57-20e4-4dd3-aadb-042202024827">Nether Empire</span>
        that allowed access to vast amounts of raw magic.</p><p>Created in −3014
        DR by Ioulaum, the mythallars allowed arcanists to create quasimagical
        items without draining their lifeforce. This allowed for a rising trade
        with the middle class. The first large scale application, the floating
        city, appeared in the year 866 NY (−2954 DR), Ioulaum's Enclave, named
        Xinlenal. By −2811 DR (1048 NY), thirteen had been constructed. By −2207
        DR (1652 NY), Netheril began lifting one enclave into the sky per
        year.</p><p>In the floating city of Sakkor, High Arcanist Xolund the
        Maker improved on mythallar design by infusing his enclave's mythallar
        with a rudimentary sentience, giving it self-awareness and also
        increasing the mythallar's powers. This breakthrough caused a great stir
        among the empire's arcanists, but the fall of the empire prevented any
        further effort of duplicating Xolund's feat, making Sakkors' mythallar
        one of a kind.</p><p>Almost all mythallars in <span class="article-link
        article-explorer-link entity-link wa-link" data-article-privacy="public"
        data-article-id="9a3001f6-8c32-4bcf-b419-e23d9d659cca"
        data-template-type="location"
        data-article="9a3001f6-8c32-4bcf-b419-e23d9d659cca">Azthir-Terra</span>
        were destroyed or rendered powerless as a result of Karsus's Folly,
        resulting in the fall of the <span class="article-link
        article-explorer-link entity-link wa-link" data-article-privacy="public"
        data-article-id="f81b8f57-20e4-4dd3-aadb-042202024827"
        data-template-type="organization"
        data-article="f81b8f57-20e4-4dd3-aadb-042202024827">Nether
        Empire</span>.</p><p></p></section>
