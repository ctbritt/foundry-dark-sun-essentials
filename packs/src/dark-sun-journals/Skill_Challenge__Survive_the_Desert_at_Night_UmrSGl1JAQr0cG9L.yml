      content: >-
        <h3><strong>Skill Challenge: Surviving a Night in the
        Desert</strong></h3><p><strong>Challenge Level</strong>: Equal to the
        party's average level (rewards XP equal to the value of <strong>three
        medium-difficulty encounters</strong> for the party's
        level).</p><p><strong>Complexity</strong>: <strong>3</strong> (Requires
        <strong>8 successes</strong> before <strong>3
        failures</strong>).</p><p><strong>Primary Skills</strong>:
        <strong>Athletics</strong>, <strong>Constitution (Endurance)</strong>,
        <strong>Medicine</strong>, <strong>Nature</strong>.</p><hr
        /><h3><strong>Primary Skill
        Checks</strong></h3><ol><li><p><strong>Athletics</strong> (Moderate DC
        by level)</p><ul><li><strong>Description</strong>: The character climbs
        <strong>rocky ledges</strong>, jumps over <strong>crevices hidden in
        shadow</strong>, or trudges through <strong>soft silt</strong>, helping
        the party bypass rough terrain and avoid <strong>hazards obscured by
        darkness</strong>.</li><li><strong>Outcome</strong>: Success indicates
        that the party <strong>avoids dangerous terrain</strong> and makes
        steady progress. Failure means the party <strong>stumbles</strong> or
        <strong>slows down</strong>, risking more exposure to <strong>nocturnal
        predators</strong>.</li><li><strong>Limit</strong>: This skill can
        provide a <strong>maximum of 2 successes</strong> in this
        challenge.</li></ul></li><li><p><strong>Constitution
        (Endurance)</strong> (Hard DC by
        level)</p><ul><li><strong>Description</strong>: The character endures
        the <strong>chill of the desert night</strong> and keeps the
        <strong>pace up</strong> despite <strong>fatigue</strong>. They help the
        party resist the <strong>cold winds</strong> that sweep through the
        <strong>open terrain</strong>.</li><li><strong>Outcome</strong>: Success
        means the character resists the effects of <strong>cold</strong> and
        <strong>exhaustion</strong> and keeps the party moving. Failure results
        in the character gaining <strong>1 level of exhaustion</strong> from the
        <strong>cold</strong> or
        <strong>fatigue</strong>.</li><li><strong>Limit</strong>: This skill can
        provide a <strong>maximum of 4 successes</strong> in this
        challenge.</li></ul></li><li><p><strong>Medicine</strong> (Moderate DC
        by level)</p><ul><li><strong>Description</strong>: Using the
        <strong>meager resources</strong> the party has, the character treats
        <strong>injuries</strong> and <strong>cramps</strong> caused by the
        <strong>cold night air</strong> and <strong>exertion</strong>. They use
        <strong>herbs</strong> or <strong>bandages</strong> to prevent
        <strong>frostbite</strong> or <strong>muscle
        strain</strong>.</li><li><strong>Outcome</strong>: Success means the
        party is able to recover some <strong>vitality</strong> and stay
        <strong>warm enough</strong> to avoid further harm. Failure means the
        character cannot adequately treat the <strong>cold-related
        injuries</strong>, causing <strong>minor hit point
        loss</strong>.</li><li><strong>Limit</strong>: This skill can provide a
        <strong>maximum of 2 successes</strong> in this
        challenge.</li></ul></li><li><p><strong>Nature</strong> (Moderate DC by
        level)</p><ul><li><strong>Description</strong>: The character navigates
        by the <strong>stars</strong>, finds <strong>safe paths</strong> through
        the darkness, and identifies <strong>dangerous terrain</strong> or
        <strong>nocturnal predators</strong> before the party stumbles into
        trouble. They might also find <strong>caves</strong> or <strong>rock
        overhangs</strong> for shelter from the
        wind.</li><li><strong>Outcome</strong>: Success indicates the party
        makes progress without <strong>wasting energy</strong> or
        <strong>wandering off course</strong>. Failure means the character
        struggles to find a safe path, and the party faces <strong>additional
        risks</strong>.</li><li><strong>Limit</strong>: This skill can provide a
        <strong>maximum of 4 successes</strong> in this
        challenge.</li></ul></li></ol><hr /><h3><strong>Secondary Skill
        Check</strong></h3><ol><li><p><strong>Perception</strong> (Moderate DC
        by level)</p><ul><li><strong>Description</strong>: The character uses
        <strong>keen senses</strong> to spot <strong>distant landmarks</strong>,
        <strong>predators</strong> stalking in the darkness, or <strong>hidden
        dangers</strong> like <strong>silt pits</strong> or <strong>sharp
        rocks</strong>.</li><li><strong>Outcome</strong>: Success grants the
        <strong>next Nature check</strong> made in this challenge a <strong>+2
        bonus</strong>. Failure means that the character misses a
        <strong>significant hazard</strong>, resulting in no immediate penalty
        but leaving the party vulnerable to
        <strong>complications</strong>.</li></ul></li></ol><hr
        /><h3><strong>Desert Complications (Setbacks)</strong></h3><p>After
        every <strong>2-4 skill checks</strong> (choose an appropriate interval
        based on the party’s progress and roleplay), the environment presents a
        new <strong>challenge</strong>. Use one of the following setbacks to
        represent the <strong>perils of night travel</strong> in
        <strong>Athas</strong>:</p><ol><li><p><strong>Chilling
        Winds</strong></p><ul><li><strong>Group Endurance Check</strong>
        (Moderate DC by level).</li><li><strong>Outcome</strong>: If more than
        half the party succeeds, they gain <strong>1 success</strong> in the
        challenge. If they fail, each character <strong>gains 1 level of
        exhaustion</strong> from the <strong>cold night air</strong>, which
        cannot be removed until the next <strong>extended
        rest</strong>.</li></ul></li><li><p><strong>False
        Shadows</strong></p><ul><li><strong>Group Perception Check</strong>
        (Moderate DC by level).</li><li><strong>Outcome</strong>: Success means
        the party <strong>avoids hidden dangers</strong> and gains <strong>1
        success</strong> in the challenge. If they fail, they are misled by
        <strong>shifting shadows</strong> and <strong>faint starlight</strong>,
        taking a <strong>-2 penalty</strong> to their next <strong>Nature
        check</strong> as they lose their
        bearings.</li></ul></li><li><p><strong>Night
        Predator</strong></p><ul><li><strong>Group Stealth Check</strong>
        (Moderate DC by level).</li><li><strong>Outcome</strong>: Success means
        the party manages to <strong>move quietly</strong>, avoiding a
        <strong>nocturnal predator</strong> that prowls nearby, gaining
        <strong>1 success</strong> in the challenge. If they fail, they alert a
        <strong>Pack of Night Stalkers</strong> (use <strong>Gnoll
        stats</strong>) to their location, forcing them into
        <strong>combat</strong> or
        <strong>flight</strong>.</li></ul></li><li><p><strong>Rockslide</strong></p><ul><li><strong>Group
        Dexterity (Acrobatics) Check</strong> (Easy DC by
        level).</li><li><strong>Outcome</strong>: Success means the party
        <strong>avoids triggering a rockslide</strong> as they navigate a
        <strong>narrow canyon path</strong>. They gain <strong>1
        success</strong>. If they fail, <strong>falling rocks</strong> deal
        <strong>2d6 bludgeoning damage</strong> to each character, and until the
        next setback, each character takes a <strong>-2 penalty</strong> on
        <strong>Athletics checks</strong> due to <strong>minor
        injuries</strong>.</li></ul></li></ol><hr /><h3><strong>Success and
        Failure Outcomes</strong></h3><ul><li><p><strong>Success</strong>: If
        the characters achieve <strong>8 successes</strong> before <strong>3
        failures</strong>, they survive the night and reach a <strong>safe
        location</strong> to rest before dawn. If they manage to succeed without
        any failures, they find <strong>scavenged supplies</strong>, gaining
        <strong>1 day’s worth of water</strong> for each party member or the
        location of a <strong>hidden
        cave</strong>.</p></li><li><p><strong>Failure</strong>: If the
        characters reach <strong>3 failures</strong>, they suffer from the
        <strong>harsh conditions</strong> of the night. Each adventurer gains
        <strong>1 level of exhaustion</strong>, and they cannot regain
        <strong>lost hit dice</strong> or <strong>exhaustion levels</strong>
        until they find <strong>shelter</strong> in
        <strong>Kled</strong>.</p></li></ul>
