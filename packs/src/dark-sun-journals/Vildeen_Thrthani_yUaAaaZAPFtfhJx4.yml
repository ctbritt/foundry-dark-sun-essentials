    text:
      format: 1
      content: >-
        <p>One of the more influential voices in the Council, Tyrthani often
        serves as a moderating force during heated debates. She has the
        political skill to silence even the most chaotic council sessions and
        frequently finds herself mediating between competing factions. Her
        ability to cut through arguments and restore order makes her valuable to
        all sides, though this also makes her a target for those who prefer
        chaos to compromise.</p>
