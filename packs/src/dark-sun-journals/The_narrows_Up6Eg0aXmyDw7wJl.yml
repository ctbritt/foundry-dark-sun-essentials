    text:
      format: 1
      content: "<p>After Draj, a trade road travels east, following the\_land’s contours until it passes through Bitter Well.\_For many, this distant outpost marks the world’s end,\_since few dare travel the ancient road farther for\_fear of the Narrows. Aptly named, the Narrows is a stony strand between the natural Maze of Draj to the\_north and the yawning Sea of Silt to the south. Each\_year, the silt encroaches a little more, threatening to\_swallow the ancient highway one day. Giants plague\_the area, wading through the dust sinks to\_ snatch\_caravans from the roads. The wreckage of splintered\_wagons litters the Narrows, testifying to the giants’\_incredible appetites.</p>"
