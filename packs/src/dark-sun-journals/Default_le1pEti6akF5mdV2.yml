        /></td><td style="padding:2rem;font-size:1.5rem"><p><strong>Name:
        </strong>Kaine</p><p><strong>Race:
        @UUID[Actor.MGaVUXIa6we7RMQA.Item.1ZAalv1EPD5TmNIi]{Half-Elf}</strong></p><p><strong>Age:
        </strong>34</p><p><strong>Background:
        @UUID[Actor.MGaVUXIa6we7RMQA.Item.rgqLSgqy2aFO30BN]{Pirate}</strong></p></td></tr><tr
        style="background:transparent"><td
        style="padding-right:1rem;vertical-align:top"><h3>Backstory</h3><p>Kaine
        Strongjaw – devilishly charming with a face blessed by Sune herself –
        was born in the port town of Athkatla in realm of Amn, to a human
        shopkeeper and a Elven ship captain. Kaine’s father was frequently away,
        delivering goods up and down the coast on his cargo ship, The Rôthgimil.
        On short runs, he would bring Kaine along and the young boy began
        learning the seafaring ways, both how to run a ship and how to deal with
        the rough and tumble crew. During these short times at sea, Anandor, an
        accomplished swordsman, also would teach his son the art of the blade.
        Those lessons must stay on the water, for Kaine’s mother would scold
        both of them if she learned the man was teaching his son swordplay.
        While Anandor was away, Kaine would roam the streets with his friends
        chasing trouble and girls, and running various schemes, away from his
        mother’s eyes preoccupied with running her shop. He never did well in
        school (when he went), but he could spot a gullible sucker from a mile
        away and learned to easily slip into the shadows when the poor sap
        called the town guard about his missing coinpurse. Around Kaine’s 15th
        birthday. Anandor’s ship was rumored to have been attacked by pirates
        and sunk along the Sword Coast during a seemingly routine run. Locals
        would report a dark and mysterious brigantine with a wolf-shaped
        figurehead preying on passing vessels in the area. Depressed from the
        loss of her husband, Kaine’s mother neglected her shop and quickly fell
        onto hard times. When a fever befell her, she didn’t have the will to
        fight it and she died shortly after Kaine’s 16th birthday. Alone and
        with no other prospects, Kaine joined up on the crew a passing merchant
        vessel. For five years, he lived the seadog life, wasting his meager
        wages during port calls on women and ale. That is, until the ship he
        crewed was destroyed off the Sword Coast. It was nighttime when a
        cacophony of booms woke him from his bunk. A salvo of blasts ripped
        through the ship as he went topside. In the distance, the flash from a
        broadside of Eldrich cannons illuminated a large brigantine with a wolfs
        head figurehead. As he registered the implications of what was before
        him, a cannon shot struck the magazine of his own ship, igniting the
        powder and ripping the ship in half. As the ship sank, the predator
        sailed away, leaving Kaine clinging to a crate of limes. The next day he
        and a small handful of crew that managed to survive were rescued by a
        passing sloop and taken to the nearest port. Over pity drinks at the
        tavern, Kaine proposed a radical plan to his friends. Why waste away on
        a ship for chump change, only to get ripped apart by predators? They
        must BE the predators. Steal a small ship and become pirates themselves.
        It would be true freedom. But secretly, Kaine had the plan to hoard his
        earnings, and acquire a ship big and powerful enough to hunt down that
        brigantine. When the next sloop pulled into port, Kaine used his charm
        on the pair that drew the short straw to mind the ship. As he regaled
        the two with fanciful stories, Kaine’s compatriots swam up to ship and
        boarded her, catching the two men unawares. The group threw the men to
        the dock and shoved off, sailing into the horizon on a ship of their
        own, with Kaine as Captain. For the next decade, the men pirated up and
        down the Sword Coast. They avoided direct combat whenever necessary,
        preferring to catch ships when their minders’ guards were down. Often
        that meant pulling the same scam as before, targeting ships while the
        crew was on shore leave and sailing off with a new ship and its cargo.
        But when the crew put up a fight, Kaine would talk them down or
        challenge the biggest one to a duel and them slice him up like Swiss
        cheese. Once the heat on the Sword Coast got too hot, Kaine sailed far
        away to the North, plundering the easily-fenced shipments of mined
        resources transiting across the Sea of Moving Ice. Once the Rime set in,
        though, ice trapped Kaine’s boat and the gang had to take their schemes
        to land. Out of their element, the group had a rough going, and one by
        one each member either abandoned or was picked up by guards for theft or
        similar crimes as they could not sail away. Kaine, however, managed to
        avoid the brig and found a comfortable niche charming the pantaloons off
        the few noble or well-to-do wives across Ten-Towns and cleaning out
        their jewelry boxes. Kaine's stay at Revel's Ends stemmed from his
        attempt to land a (figurative) whale, in the form of visiting royalty.
        Kaine managed to work his way into the bed of Lady Eowyra Passeia, the
        Queen of Essear visiting Bryn Shandar for trade talks. When he tried to
        make off with her infamous blood ruby necklace as she slept, her
        personal guard proved far more observant and capable than the typical
        hacks manning the town watches. In what he claims was a political stunt,
        Speaker Duvessa Shane sent Kaine to Revel’s End under a sentence that
        outweighed the letter of the law.</p></td><td
        style="vertical-align:top"><h3>Personality</h3><p>Kaine embodies the
        spirit of the sea itself—untamed, boundless, and ever-changing. To him,
        the ocean represents the ultimate freedom, an endless horizon that
        promises adventure and the liberty to chart his own course. His life is
        a dance with the waves, moving where they will, unbound by the
        constraints of the land-bound world.</p><p>The ship is Kaine's kingdom,
        the deck beneath his feet more familiar than any home on shore. For him,
        the vessel is a constant in the ever-shifting tapestry of his life, more
        vital than any single crewmate or captain. His allegiance is to the ship
        and the sea it sails upon, everything else is as transient as the
        tides.</p><p>Kaine's eyes sparkle with mischief, unable to resist the
        lure of unattended coins or trinkets that cross his path. His pockets
        are a trove of small treasures, each a memento of an adventure or a tale
        waiting to be told. And tales are something Kaine is never short of; he
        weaves stories as easily as the wind fills the sails, each one more
        embellished than the last. The truth is a flexible friend in Kaine's
        narratives, stretched and shaped to captivate and entertain his
        listeners.</p><p>Bets and wagers are his language of camaraderie, a way
        to bond with friend and stranger alike over the thrill of chance. Kaine
        lives for these moments of friendly competition, finding in them the
        essence of life's unpredictability and the joy of the
        unexpected.</p><p>Kaine is a creature of the sea, where freedom is as
        vast as the waters themselves. His life is a journey across a boundless
        blue canvas, filled with tales of adventure, the allure of hidden
        treasures, and the brotherhood found among those who share his love for
        the unfettered existence.</p></td></tr></tbody></table>
