    text:
      format: 1
      content: >-
        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;padding-top:0px;white-space:pre-wrap;padding-left:0px">The
        centerpiece of the Golden City is the Imperial Golden Tower, home to the
        King of Tyr. The great structure, constructed of rare golden granite
        from the Walis area of the Ringing Mountains, serves as the personal
        residence and offices of the Tyrian king. The building contains dozens
        of rooms connected by a labyrinth of winding, sloping passageways. There
        are three entrances to the Tower: the <span class=" aw5Odc"
        style="box-sizing:border-box;color:#006580;text-decoration-line:underline"><a
        class="XqQF9c"
        style="box-sizing:border-box;text-decoration-line:none;pointer-events:all"
        href="https://sites.google.com/view/darksunforgms/geography/the-tyr-region/city-state-of-tyr/exploring-tyr/the-golden-city?authuser=0">Tower
        Bridge</a></span>, the secret Garden Gate, and the obsidian-paved,
        underground tunnel from the ziggurat. The underground tunnel has been
        filled with sand and magically sealed by order of King Tithian. Only the
        King, his personal staff, high templars, and special imperial guests are
        allowed to enter the tower. To others, entry is considered trespassing
        and punishable by a slow, lingering death.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Crossing
        from the Tower Bridge, a visitor enters the third level of the Golden
        Tower. Immediately, one is struck with the richness of its furnishings.
        In the antechamber, two sweeping onyx staircases gently rise to the
        library on the upper level beyond. Massive iron-bound doors block the
        way to the Royal Receiving Room. Inside, an opulent hand wrought-iron
        throne rests upon an equally majestically designed dais. Scattered about
        the iron throne are luxuriant cushions and pillows crafted from the
        exotic furs of tagsters, tigones, and other great cats. The floor
        directly in front of the dais is scored with long, stained blood
        grooves, remnants of Kalak's brutal reign. Near the walls, fluted
        granite columns rise to the ceiling, where copper-gilded rafters support
        mystic globes of light, lending the room the appearance of an Athasian
        sunset. Masking the rear of the irregularly shaped chamber, a cloud-ray
        curtain conceals the King's private stairwell, leading down to his
        personal chambers.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">The
        uppermost level of the Tower houses the Royal Tyrian Library, an
        enormous collection of books, scrolls, and ancient manuscripts. Aged
        tomes rest on large sweeping bookshelves placed in concentric arcs about
        the room. The mysteries of the ancients are buried within the pages of
        these books. Thousands of treatises on spell preparation and research
        may be found here. The only other noticeable feature of the library is a
        large mosaic in the center of the room depicting Kalak's profile. For
        some reason, King Tithian has decreed the library off-limits and closed
        until his return. Two to four illiterate half-giants patrol the library
        to enforce this command.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">Descending
        from the throne room the architecture takes on a surreal quality. The
        renowned, hard, angular Athasian architecture metamorphs into shadowy,
        convoluted forms. Hallways develop a slanting quality, and abruptly end
        in small, uninhabited rooms or niches. Grotesque stone carvings of
        fantastic creatures and bizarre races appear randomly amongst the
        ceiling rafters. The floor here is purposely uneven, and seems to rise
        and fall as if it flowed from the desert sands. The walls undulate with
        twists like the mind of a defiler. The habitable rooms on this level
        possess a macabre juxtaposition of luxury and madness. Uneven walls and
        strangely shaped rooms are adorned with silk-covered beds, silver
        doorknobs, and gold-gilted mirrors. These chambers are showplaces
        designed to impress through conspicuous consumption.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px">The
        rooms enclose an ancient bathhouse. The bath is comprised of three
        separate rooms, each room designed for different hedonistic pleasures.
        Water can be dripped upon super-heated stones to fill the first room
        with steam. In an adjoining room, blocks of frozen water would be
        created enabling guests to enjoy their refreshing chill. In the third
        room, a sluice riddled with scores of tiny holes is attached to the
        ceiling. Water, gently poured down the sluice, creates an artificial
        rain fall. Due to Kalak's obsession with attaining dragon form and his
        caustic attitude toward the other sorcererkings, no imperial guest has
        used these chambers in over 10-score years. A concealed entrance to the
        lower level is contained in one of the other empty rooms.</p>

        <p class="CDt4Ke zfr3Q" dir="ltr"
        style="box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato,
        sans-serif;line-height:1.6667;padding-bottom:0px;white-space:pre-wrap;padding-left:0px">On
        the level below resides the King's private chambers, a narrow stair
        emerges into a small private dining area. Narrow passages swirl from
        this central room. Spartan sleeping quarters lie next to a private
        workshop. The workshop contains a miniature scale model of the city and
        surrounding environs. The adjoining private library and meditation
        chamber are austere in design and appearance. The mirror-walled sparring
        room contains an array of unused equipment and wooden practice weapons.
        A mirrored panel in this room swivels to reveal a concealed door. Behind
        the door, a short unlit hallway ends at the back of a secret garden
        exit. This secret access allows passage to the tower garden. The
        superbly crafted door is twice as difficult to spot (from the garden
        side) than a normal secret door. Off another curving passage, an empty
        cylindrical room lined with pure obsidian awaits. Many other passages
        lead to empty or unused rooms. Perhaps the oddest room contains strange
        beasthead carvings, inset in the walls from floor to ceiling that seem
        to have fed some bizarre obsession held by Kalak. Some carvings are
        small and grotesque, others huge and horrible. The mouths of several
        carvings are trapped to close and amputate any limbs thrust in their
        orifices. Inside, the carved head of an Athasian sloth is a lever that
        opens a secret trapdoor in an adjoining room. The trapdoor leads to the
        King's private treasure vault. The cavernous circular vault stands empty
        now, its vast riches gone. Rows of storage and weapons racks that line
        the walls appear to have once held a kings ransom. Broken urns and
        discarded strongboxes lie on the floor. Tithian inherited a major
        portion of the wealth, but a significant number of the coins were spent
        clandestinely to sustain the collapsing economy. The only other feature
        in the room is an immense stone block covering the trap door to the
        infamous obsidian tunnel. The tunnel has been sealed and it sections
        filled with sand. Defiler mages and earth priests were conscripted to
        cast curses, protection glyphs, and wards on both sides of this trap
        door.</p>
