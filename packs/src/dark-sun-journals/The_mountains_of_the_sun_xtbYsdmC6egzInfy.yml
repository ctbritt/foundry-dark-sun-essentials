      content: "<p>Standing like a line of tired sentinels a few hundred\_miles east of the isle of Waverly, the Mountains of the\_Sun are almost buried in silt. The range is very old\_and no longer has the jagged edges and sheer cliffs of\_younger ranges such as the Ringing Mountains. Deep\_passes of silt separate the individual peaks; each\_rises a few hundred to a few thousand feet above the\_dust. From the highest mountains in the center of the\_range, a traveler can see an endless ash storm far to\_the east in the middle of the Sea of Silt.\_</p>\n<p>The Mountains of the Sun have few sources of\_water. Some of the older peaks support a few acres\_of sparse scrub along their leeward sides, but most\_are barren. Thousands of years of isolation from\_the mainland, coupled with the lack of water, have\_weeded out all but the hardiest inhabitants. The\_small number of peaks that can support life attract\_powerful flying monsters such as wyverns or rocs.</p>\n<p>Resilient goats and erdlus survive on some of the\_larger mountains. In the caves that crisscross the\_oldest peaks lurk degenerate tribes of hejkins and\_colonies of monstrous spiders.</p>\n<p>\_</p>\n<p>Rising from the central Sea of Silt, the Mountains</p>\n<p>of the Sun are a mighty range that is slowly</p>\n<p>dying. The fierce storms of the deep silt have been</p>\n<p>weathering the mountains for thousands of years,</p>\n<p>and with each day a little more of their substance is</p>\n<p>broken apart by the heat of the sun and the cold of</p>\n<p>the night, to be carried away by the endless winds.</p>\n<p>The scale of this change is beyond human comprehension;</p>\n<p>only a few inches of dirt and rock might be</p>\n<p>lost in the lifetime of a man.</p>\n<p>The Mountains of the Sun are very old and no</p>\n<p>longer possess the jagged edges and sheer cliffs of</p>\n<p>younger ranges such as the Ringing Mountains.</p>\n<p>The softer rock has all been worn away, and only the</p>\n<p>rounded domes of granite that once composed the</p>\n<p>mountains\x92 hearts are left today. The individual</p>\n<p>peaks range from 200-3,000' high and are often separated</p>\n<p>by broad tracts of deep silt. Each mountain is</p>\n<p>anywhere from one to ten miles across and rises one</p>\n<p>to eight miles from its neighbors. From the highest</p>\n<p>peaks in the center of the range, it is barely possible</p>\n<p>to see the ash storm surrounding the Valley of Dust</p>\n<p>and Fire.</p>\n<p>There are few sources of water in the mountains</p>\n<p>and fewer foliated regions. Some of the older mountains</p>\n<p>support a few acres of sparse scrub along their</p>\n<p>leeward shores. Most are barren. Any given peak</p>\n<p>has a 25% chance for a spring or cavern lake. Peaks</p>\n<p>with water sources have vegetation half the time.</p>\n<p>The wildlife of the Mountains of the Sun is unusual.</p>\n<p>Thousands of years of isolation from the mainland</p>\n<p>have weeded out all but a few tough species.</p>\n<p>2 I</p>\n<p>Those peaks that support life are the lairs of power- The Black Isle</p>\n<p>ful avians such as wyverns, dragonnels, or rocs. A</p>\n<p>few hardy goats and erdlu still survive on some of</p>\n<p>the larger peaks. The dominant predators are a bewildering</p>\n<p>variety of spiders, including huge, giant,</p>\n<p>and phase species.</p>\n<p>Scattered groups of intelligent beings inhabit the</p>\n<p>Mountains of the Sun. A few small clans of aarakoera</p>\n<p>live in the high peaks, and underground degenerate</p>\n<p>tribes of hej-kin guard most of the hidden</p>\n<p>water supplies. Surprisingly, a few small clans of feral</p>\n<p>dwarves inhabit the mountains as well. The</p>\n<p>dwarves and the hej-kin are the last remnants of</p>\n<p>large populations that migrated to this area before</p>\n<p>the Silt Sea became impassable. A dying breed of</p>\n<p>less than 100, the dwarves here are cannibals and</p>\n<p>wretched savages who constantly war with the spiders</p>\n<p>and the hej-kin. Needless to say, the dwarves</p>\n<p>are not doing very well. It is a testament to their innate</p>\n<p>toughness that they are even there at all.</p>\n<p>The hej-kin and spiders attack anything foolish</p>\n<p>enough to cross their paths. The dwarves, regrettably,</p>\n<p>are not much different. They have never known anything</p>\n<p>but a world full of enemies. However, a dwarf</p>\n<p>PC might get th e dwarves to speak to him before they</p>\n<p>try to kill him. The dwarves of the Mountains of the</p>\n<p>Sun may be ignorant savages, but they possess a lot of</p>\n<p>unusual oral legends concerning the days before the</p>\n<p>Dragon. Unfortunately, they firmly believe the rest of</p>\n<p>the world to be uninhabitable silt.</p>\n<p>Feral dwarves (1-8): AL N; AC 3 (skins); MV 6;</p>\n<p>HD 1+3; THAC0 13; #AT 1; Dmg by weapon</p>\n<p>+2; SD save at +4 vs. poison or magic; ML 10.</p>\n<p>Armed with slings, stone clubs, bone spears.</p>\n<p>Huge spiders: AL N; AC 6; MV 18; HD 2+2;</p>\n<p>THAC0 13; #AT 1; Dmg 1d6 + poison; SA jump</p>\n<p>The Silt Archipelago</p>\n<p>and surprise at -6; ML 8.</p>\n<p>Giant spiders: AL CE; AC 4; MV 3, Wb 12;</p>\n<p>HD 4+4; #AT 1; Dmg 1d8 + poison; ML 13.</p>\n<p>Hej-kin: AL NE; AC 10; MV 6, phase 3; HD 2;</p>\n<p>THAC0 13; #AT 2; Dmg 1d4/1d4; SA surprise at</p>\n<p>-2, psionics; ML 10.</p>"
