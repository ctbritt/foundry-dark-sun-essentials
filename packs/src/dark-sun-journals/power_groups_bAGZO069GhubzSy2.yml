    text:
      format: 1
      content: "<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;white-space:pre-wrap;padding-left:0px\">Tithian, the former high templar, is now recognized as King of Tyr. However, his throne is far from secure. King Tithian holds his crown at the sufferance of the other templars and the heads of powerful groups who wield great influence but are not yet strong enough to overthrow him.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\">In Tyr, a number of groups fight for power in the wake of Kalak’s death. Fortunately for Tithian and the other templars, no single group has managed to consolidate its influence enough to challenge the new king’s rule. Members of these factions meet frequently, sometimes in large gatherings, to make decisions and forge treaties that affect the balance of power in the city-state. Factions that have great influence in Tyr include the following.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Deposers of Kalak</span></span>: The rebels who challenged and defeated Kalak are highly regarded by most citizens. In addition to Tithian, the deposers include Rikus, a mul ex-gladiator who leads the Crimson Legion; Sadira, a half-elf ex-slave and a secret member of the Veiled Alliance; Agis of Asticles, a high-ranking noble of the Asticles house in Tyr and a practitioner of the Way; and Neeva, another ex-gladiator.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">The Freed</span></span>: Former slaves make up a large portion of Tyr’s population. Although they are poor and largely uneducated, their sheer numbers give them considerable power. Their leaders include Shivrin, a half-elf from the Warrens (rumored to have ties to the Toothcutters, a criminal gang); and Nori, a mul from the fields who is known as an eloquent speaker. During her time as a slave, Nori was a favored gladiator in the stadium games.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Commoners</span></span>: Many revolutionaries were common folk of Tyr. Those who have reained a good deal of influence in the wake of their success include Rowan, a half-elf innkeeper from the Caravan District; and Xalos, a mul stonecutter of the Artisan District. Xalos secretly receives a stipend to spy for the city-state of Urik, but no one in Tyr suspects anything . . . yet.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">House Merchants</span></span>: Merchant house representatives are no strangers to power and influence in Tyr, although now they must deal with competing factions rather than a single monarch. The dominant merchants include Davith Vordon of House Vordon, whose major interests include Tyr’s iron mines and the slave trade beyond the city-state’s borders; and Belana Wavir of House Wavir, a house headquartered in Balic.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Templars</span></span>: Tehosian, the Minister of Laws, is responsible for setting up a new system of justice. Mashastra, the Minister of Defense, marshals the army and organizes the defense of Tyr according to Tithian’s directives.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Nobles</span></span>: Shoshana Beryl, matriarch of Beryl Manor, seeks to move the government toward a senate of nobles. She believes that only the nobles have the education and the means to administer the city-state.<br style=\"box-sizing:border-box\" />Murter Dyan, who holds a partial interest in Tyr’s iron mines, secretly belongs to the True— a group of holdouts hoping for Kalak’s return.</p>\n<div id=\"h.p8hp14ilykc8\" class=\"GV3q8e aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px;font-family:sans-serif;font-size:16px;white-space:pre-wrap\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:25px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);opacity:0;top:12.5px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.p8hp14ilykc8_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nKing Tithian</div>\n<h3 id=\"h.p8hp14ilykc8_l\" class=\"CDt4Ke zfr3Q OmQG5e\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:16px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:15pt;font-family:Lato, sans-serif;line-height:1.25;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h3>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px;white-space:pre-wrap;padding-left:0px\">While the factions of Tyr seethe and quarrel, King Tithian works steadily to establish his own authority independent of the power groups. He must move carefully, because any attempt to seize too much control too quickly could provoke a reaction from the other influential players in the city-state, and Tithian does not yet have the strength to hold his throne in the face of unified opposition. Every decree and decision made by the king is subject to the tacit approval of the various factions—a situation the proud, ambitious Tithian deeply resents. His support is strong among the former templars of Kalak; even so, many of them resent his betrayal of their royal master, and a few wonder if they could replace him. The former high templar is currently exploring Kalak’s sorcerous libraries and treasuries, searching out the deposed king’s magical secrets. Some of Tyr’s leaders fear that Tithian intends to become a new tyrant if only he can find the power he needs to defy them.</p>"
