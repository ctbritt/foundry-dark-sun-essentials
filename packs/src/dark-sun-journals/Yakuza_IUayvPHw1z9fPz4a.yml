pages:
  - name: Description
    type: text
    text:
      content: >-
        <p>The Yakuza are a well-organized guild under the leadership of
        Campaign/NPCs/Bral/Ozamata Murawa, one of the city's Underbarons. They
        are the undisputed masters of Shou-Town and most of the Low City and
        prefer to operate through extortion and racketeering, rather than
        burglary or territorial wars. The Yakuza of Bral number about 40, and
        Ozamata, as an Underbaron, can easily muster 50 to 60 thugs and fighters
        should things get ugly. No Shou will willingly betray the Yakuza. (Use
        the Thug stat block)</p><p>&lt;strong&gt;Symbol:&lt;/strong&gt;
        Tattoos.\

        &lt;strong&gt;Membership:&lt;/strong&gt; Bralian-born Shou.

        &lt;strong&gt;Agenda:&lt;/strong&gt; Maintain status quo.</p>
