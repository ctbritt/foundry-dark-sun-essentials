      content: "<p>\_</p>\n<p>“The songs of Bav-rem still fill the heart</p>\n<p>of my heart with rising joy.”</p>\n<p>—Anonymous poem</p>\n<p>Bav-rem is now an empty ruin of abandoned basement pits and discarded articles. Once</p>\n<p>this was a small but thriving community in the north, near the falls of the same name.</p>\n<p>(The village was named for the waterfall, whose name means “death drop.“) Just a few</p>\n<p>months ago, a group of climbers carrying messages and provisions to Bav-rem found—</p>\n<p>nothing. All of the inhabitants and even the village’s buildings, had vanished.</p>\n<p>Subsequent expeditions determined that something large and amorphous strayed</p>\n<p>68</p>\n<p>through the village. Disturbingly, according to the tracks it left, it seemed to grow larger</p>\n<p>as it slithered through the community. Everything organic—halflings, buildings, lifeshaped</p>\n<p>creations, and even the wild plants growing nearby—were no more. One of the</p>\n<p>explorers noticed that there were no insects in the area. Only inorganic materials and</p>\n<p>objects remained.</p>\n<p>The Truth</p>\n<p>The cause of the disappearance of Bav-rem has not yet been discovered, but it has</p>\n<p>alarmed a great many people. Many felt that other villages would be attacked in a similar</p>\n<p>way, but as of yet, nothing has happened. Most believe that a horror from the swamp</p>\n<p>destroyed the village. Others fear that the kreen were again on the move and this time</p>\n<p>made it all the way up to Bav-rem.</p>\n<p>The actual origin of the calamity was a furtive life-shaping experiment gone awry.</p>\n<p>Three life-shapers in the local sanctuary had discovered an ancient formula for producing</p>\n<p>a new life-shaped construct. Although it contained principles they did not understand,</p>\n<p>they chose to use the formula anyway, thinking that if they were successful, their</p>\n<p>fame would be assured. As it was, the fateful consequences of their actions were so pervasive</p>\n<p>and complete that they did not even achieve infamy.</p>\n<p>The accidental formulation created a semi-sentient creature with the ability to absorb</p>\n<p>other organic substances into its body, convert the material, and add the substance to its</p>\n<p>own mass. It began first as a tiny blob of protoplasm, then it started to grow at an alarming</p>\n<p>rate. It consumed the life-shaped creations in the laboratory where it was born. Next</p>\n<p>it absorbed its creators and the other life-shapers in the sanctuary, consuming their constructs</p>\n<p>as well. Spreading out from the shapers’ sanctuary, it groped its way through the</p>\n<p>village, drawing every living thing into its ever expanding bulk. Nothing escaped. The</p>\n<p>creature then wandered to a nearby cave to rest. The giant protoplasmic creature has</p>\n<p>lost much of its mass, and eventually it must feed again. To make matters worse, the</p>\n<p>beast may go into mitosis and produce a duplicate of itself.</p>\n<p>69</p>\n<p>Adventurers may go to Bav-rem out of simple curiosity, or as investigators searching for</p>\n<p>clues to the causes of the destruction after the disappearance of an entire vertical forest</p>\n<p>near their own community. The creature, again on the move, could have devoured the</p>\n<p>forest and is hibernating again, with the PC’s village being its next target. Player characters</p>\n<p>who explore the ruins of Bav-rem can probably determine that the creature’s swath</p>\n<p>of destruction originated at a point where once stood a life-shaper sanctuary. Perhaps</p>\n<p>that knowledge could give them a clue about how to stop or destroy it.</p>"
