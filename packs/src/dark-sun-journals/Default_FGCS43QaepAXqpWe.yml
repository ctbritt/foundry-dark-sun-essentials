        src="s3/artwork/spelljammer/spelljammer%20intro%20splash.jpeg" /><p>You
        have taken sail to the stars! After escaping the Battle of Chambon, you
        traveled to Bral where you became embroiled in local politics with much
        larger stakes than you realized. Indeed, you might have accidentally
        started the Second Unhuman War.</p><p>Fleeing the pursuing Scro and
        suspicious of the Elves, you took refuge in Grommspace and then made
        your way to the Library of Osra, where you discovered that Levistus had
        plans for you. Time was bent to his will after the events of Icewind
        Dale, and now you are caught up in a struggle that spans time and
        space.</p><p>As you made your way to Norrath, you've found your self
        seeking to free the people who are oppressed by the vile vampire lord,
        T'Laan.</p>
