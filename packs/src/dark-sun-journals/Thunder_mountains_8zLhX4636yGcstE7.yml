      content: |-
        <p>For the traveler who decides not to try braving the</p>
        <p>Burning Plains, the only other way to reach the valley</p>
        <p>of the Last Sea is by somehow traversing the Thunder</p>
        <p>Mountains. These tall, craggy peaks are so named for the</p>
        <p>fact that they are one of the few places on Athas that</p>
        <p>regularly sees thunderstorms. Due to the dryness of the</p>
        <p>atmosphere of Athas, water from Marnita evaporates into</p>
        <p>the air above at an astonishing rate. When this warm,</p>
        <p>damp air tries to escape over the western mountains the</p>
        <p>terrible cold of the heights leeches its moisture as snow</p>
        <p>and rain. The resultant storms ring out for miles around,</p>
        <p>and the thunder booming from their hearts echoes from</p>
        <p>the rocky peaks, to be heard by people clear across the</p>
        <p>sea in the city of Saragar.</p>
        <p>The Thunder Mountains are steep and, in most places,</p>
        <p>nearly impassable. There are very few passes that cut</p>
        <p>clear through the high rocks, and in the few places that</p>
        <p>the walls are pierced in such a way, the Mind Lords'</p>
        <p>security measures ensure that none shall pass unhindered.</p>
        <p>Outside of the valley, legend has it that the mysterious</p>
        <p>and ancient devices which seal the passes have fallen into</p>
        <p>decay, and in some spots, a wayfarer can even walk right</p>
        <p>into the valley of the Last Sea. But none of the legends</p>
        <p>identify clearly where these unguarded passes are to be</p>
        <p>found.</p>
        <p>Of course, the Thunder Mountains were so labeled</p>
        <p>long before the Mind Lords determined to cut the valley</p>
        <p>off from the rest of the world. This had a great deal to</p>
        <p>do with the large population of “crag” giants who lived in</p>
        <p>the western end of the mountains. In ancient days, during</p>
        <p>thunderstorms, these creatures crawled out of their caves</p>
        <p>high in the hills and celebrated until the rain was over.</p>
        <p>This same tribe of giants was subsequently chased out</p>
        <p>of the mountains by the Mind Lords. They were made</p>
        <p>an offer: stay where you are and be eventually defeated</p>
        <p>and exterminated, or concede to our might and move</p>
        <p>to the Lonely Butte, where you will be left alone for all</p>
        <p>time. A few of the nobler giants resisted, but they were</p>
        <p>quickly destroyed by the powerful psionicists. Soon after,</p>
        <p>the remaining giants accepted the Mind Lords' offer and</p>
        <p>took up residence on the Lonely Butte. A small clan of</p>
        <p>them remains there to this day.</p>
