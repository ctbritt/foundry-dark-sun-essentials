      content: "<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"><span style=\"color:#212121;font-family:Lato\"><span style=\"font-size:14.6667px;white-space:pre-wrap\">The Isle of Shault lies east of Lake Island, far out in the Sea of Silt. Frequently hidden by blowing dust and virtually inaccessible by silt skimmer, Shault holds a secret: a thriving lowland forest. Except for a range of small mountains a long the southern edge, the entire island is thickly forested with bizarre, exotic, and sometimes dangerous trees, the likes ofwhich have been forgotten by the rest of Athas. Shault’s fertility stems partially from its geography (the forest is protected on three sides by tall cliffs that block the searing winds from the silt, and numerous springs feed up from below the surface) and partially from the primal magic of the half-giant druid Mearedes, who protects the island.</span></span></span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">The green, forested isle of Shault is one of the most pleasing locations in the entire Silt Sea. The powerful druid Mearedes (female human/16th-level druid/N) and a clan of good giants protect the island, making sure its resources aren’t abused. Legends claim that Mearedes came to the island when its forest was all but dead and has since nurtured it back to vibrant health. Whatever the history of the place, travelers should be warned that the druid and the giants eagerly attack those who would despoil the island paradise.</span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"><span style=\"color:#212121;font-family:Lato\"><span style=\"font-size:14.6667px;white-space:pre-wrap\">If visitors can persuade Mearedes that they mean no harm, she and her three apprentices tolerate the intruders. However, the druids’ hospitality comes at a price. The goliath is determined to ensure that knowledge of Shault’s existence and location does not spread, lest unscrupulous types plunder the island. She insists that all visitors be subject to a ritual that compels them never to speak of the isle. Mearedes and her apprentices attack all who refuse, with full intent to kill; she does not revel in violence, but she considers the preservation of Shault more important than any individual life. In addition to her apprentices, Mearedes can call on some forty giants of varying kinds at need, all of them fiercely loyal to the druid. In the heart of Shault’s jungle, far from Mearedes and the homesteads of the giants, an ancient city has been ravaged by the march of time. The press of the jungle has torn down chunks of the walls and collapsed buildings as the greenery grows over the stone. Neither Mearedes nor the giants of Shault know who built the city or why; the murals and carvings that survive display script in an unknown language. Since the island receives few visitors and the druids avoid the ruins, its vaults and tombs remain undisturbed. Mearedes doesn’t mind if adventurers explore the city—assuming that they prove cooperative enough for her to tolerate their presence at all—but she warns them that dangerous beasts lair within the ruins.</span></span></span><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\">ators infest it.</span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\">\_</p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"><span style=\"color:#212121;font-family:Lato\"><span style=\"font-size:14.6667px;white-space:pre-wrap\">A rare forested isle in the Silt, Shault is one of the greenest areas left in the Tyr Region. A powerful druid and a clan of 40 good giants protect the isle. The Athasian giants live in small family groups of two to four. They attack intruders who abuse the island \x92s resources. In the heart of the jungle covering the island\x92s interior is a mysterious ruin of white marble. Now overgrown with ivy and scrub, it was once a large city. Even in its ruin it is apparent that the city was strikingly beautiful in its days of glory. Not even the druid of Shault can say who built the city or why it was abandoned. The city of white marble was one of the last cities of the original inhabitants, before they became the nomadic raiders they are today. The giants are not inquisitive, and though the druid of the isle is curious about the ruins, she is not overly so. The ruins are infested with dangerous predators such as giant centipedes and scorpions. Visitors to Shault who conduct themselves in a respectful manner and avoid angering the giants will eventually meet the druid. She says they are welcome to stay as long as they wish, but asks that they do not tell anyone of Shault\x92s existence when they leave.</span></span></span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"><span style=\"color:#212121;font-family:Lato\"><span style=\"font-size:14.6667px;white-space:pre-wrap\"><span style=\"color:#212121;font-family:Lato\"><span style=\"font-size:14.6667px;white-space:pre-wrap\">Mearedes Human Druid 15th Level Neutral Str 7 Dex 16 Con 12 hp: 55 Int 11 Wis 19 Cha 16 AC: 2 (bracers of defense) The Isle of Ash #AT: 1 T H A C 0 1 2 Dmg: 1d6+2 (obsidian spear +3) Movement 12 Mearedes is the guardian of the island of Shault. She is a weatherbeaten human of 60 who enjoys the physical condition and health of someone half her age. She understands how precious Shault is, and she has spent her life nurturing the isle. The island was slowly dying before she came to it; now it is strong and green again. Mearedes is a friend to the giants of the island, who are happy to help her in her task. If anyone threatens her, dozens of giants leap to her defense. They call her \x93little grandmot her\x94 and treat her like a member of their clan. Giants (1-4): AL NG; AC 4; MV 15; HD 15; THAC0 5; #AT 1; Dmg 2d8+14 or rock for 2d10; SD immune to psionics; ML 17.</span></span></span></span></span></p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\">\_</p>\n<p dir=\"ltr\" style=\"line-height:1.6667;margin-top:9pt;margin-bottom:0pt\"><span style=\"font-size:11pt;font-family:Lato;color:#212121;font-variant-numeric:normal;font-variant-east-asian:normal;vertical-align:baseline;white-space:pre-wrap\"><span style=\"color:#212121;font-family:Lato\"><span style=\"font-size:14.6667px;white-space:pre-wrap\"><span style=\"color:#212121;font-family:Lato\"><span style=\"font-size:14.6667px;white-space:pre-wrap\"><img src=\"data:image/png;base64,\" width=\"689\" height=\"378\" /></span></span></span></span></span></p>"
