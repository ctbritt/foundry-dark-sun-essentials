    text:
      format: 1
      content: "<p><strong>Setup</strong>. This encounter occurs in a wine shop or inn. Tell the players to turn to Players' Book p. 44-Wine Shop.</p>\n<p>\_</p>\n<p><strong>Start</strong>. Have the player indicate which table their characters are occupying. One\_seat remains empty. Read the following</p>\n<p>The cool air in your lungs and the sweet wine on your lips ease the day's tensions. All about, a cheerful clink of mugs and rattle of conversation fill the air, and the rich aroma of roasting meat bodes well for the meal to come.</p>\n<p><strong>Encounter</strong>. Once the PCs become comfortable, the inn door bursts open and a woman frantically dashes into the room. She searches for someone table-to-table. When she reaches the PCs, a commotion comes at the door. The woman abruptly takes the empty seat at the PC table. Three templars with eight mul fighters march into the hall and block all exits. The head templar harshly demands, \"Where is the renegade Preserver?\" No one says a word.</p>\n<p><strong>Role Playing, </strong>Play the templars as cold-hearted and merciless. As they move among the tables, the muls twist patrons around for a better look at them. Their search starts at a table far from the PCs and works slowly toward them. The templars irritation grows with each failure.</p>\n<p>The customers sullenly refuse to speak. They loathe and fear the templars. Make it clear the PCs can expect no help if a fight begins Several patrons glance signific cantly toward the woman</p>\n<p>\_</p>\n<p>The woman fights to seem calm. She studies the reactions of all the PCs. It any smile or show reasurance, she relaxes. If any show hostility, she readies a spell</p>\n<p><strong>Dialogue\_</strong></p>\n<p>\"King Kalak will favor anyone able to help us \"Look at Templar Mandax when he speakes (Mul twists man's head)</p>\n<p>It's been so long! How is your family?\" (Woman to PC)</p>\n<p>\_</p>\n<p>Outcome No NPC betrays the woman If the PCs likewise hold their tongues, the templars arrest everyone in the place Though angry, no one dares resist. If any PC betrays the woman, that character is rewarded with an SP and a pledge of Kalaks favour and is then released.</p>\n<p>The woman and other PCs are arrested as Veiled Alliance spies.</p>\n<p>\_</p>\n<p>Next. The PCs go to work on the ziggurat; the woman, bound and gagged, is taken elsewhere. If all the PCs are captured, go to Part Two. Otherwise, continue with</p>\n<p>\_</p>\n<p>Encounter 1A, 1B, 1D, or 1E</p>"
