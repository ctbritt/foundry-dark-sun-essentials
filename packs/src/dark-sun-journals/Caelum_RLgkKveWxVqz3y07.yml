    text:
      format: 1
      content: "<p>As you enter the shadowed interior of Kled’s central hall, a figure stands near a large, circular mosaic on the stone floor, depicting a radiant sun inlaid with shards of gold and bone. The dwarf before you is bare of hair like the others, but his skin is bronzed and deeply lined, as if the sun itself has etched its mark into him. He wears loose robes of ochre and crimson, their colors faded from years of desert heat, but still vibrant enough to catch the eye. Across his chest and shoulders, intricate tattoos form patterns that resemble <strong>solar flares</strong>, extending from a central symbol of the <strong>sunburst</strong> that adorns a pendant hanging around his neck.</p>\n<p>Despite the weight of years, Caelum stands unbowed, with a\_<strong>broad-shouldered frame</strong> that hints at the strength of a warrior, though age has softened the edge of his build. His gaze is sharp and clear, a piercing golden hue that almost glows in the dim light of the chamber, as if he carries a piece of the desert’s sun within him. His hands, calloused and scarred, rest upon a <strong>bronze-tipped staff</strong>, which clinks lightly against the stone floor as he shifts his weight.</p>\n<p>When he speaks, his voice carries a warmth that contrasts with the cool stone walls—a deep, resonant tone that seems to <strong>command the air around him</strong>. It is a voice used to <strong>offering guidance</strong> in times of hardship, but one that also bears a note of <strong>stern expectation</strong>:</p>\n<p><em>“You walk under the same sun that scorches the sands and gives life to the cacti. Respect its heat, and you may find more than just survival in this land. Disrespect it, and you’ll find only ashes.\"</em></p>"
