        jM4h8qpyxwTpfNli:
          notes: >-
            <h3><strong>Caelum (Sun Cleric)</strong></h3>

            <ul>

            <li><strong>Role</strong>: <strong>Spiritual leader</strong> of
            Kled&rsquo;s small <strong>sun-worshiping community</strong>,
            responsible for maintaining the <strong>solar mosaic</strong> and
            performing rituals to ensure <strong>prosperity</strong> and
            <strong>protection</strong>.</li>

            <li><strong>Appearance</strong>: A <strong>bald, powerfully built
            dwarf</strong>, with <strong>tanned skin</strong> and <strong>ritual
            tattoos</strong> of <strong>sun sigils</strong> covering his arms
            and chest. He wears a <strong>golden pendant</strong> in the shape
            of a <strong>sunburst</strong> and carries a <strong>bronze-tipped
            staff</strong>.</li>

            <li><strong>Personality</strong>: <strong>Devout, zealous, and
            intense</strong>, Caelum believes deeply in the <strong>power of the
            sun</strong> and sees its <strong>fury and grace</strong> as
            necessary for survival. He is less suspicious of outsiders than
            Baranus but is wary of those who might disrespect <strong>sun
            worship</strong> or <strong>the elemental spirits</strong>.</li>

            <li><strong>Motivations</strong>:

            <ul>

            <li>Ensure that Kled&rsquo;s <strong>spiritual practices</strong>
            remain strong and maintain the <strong>balance with the sun&rsquo;s
            power</strong>.</li>

            <li>Protect the <strong>solar mosaic</strong> and ensure that the
            <strong>village&rsquo;s survival</strong> is tied to the
            <strong>sun&rsquo;s blessings</strong>.</li>

            <li>Prevent <strong>defilers</strong> from corrupting the land
            around Kled.</li>

            </ul>

            </li>

            <li><strong>Interaction with the Party</strong>: Caelum might offer
            <strong>blessings</strong> or <strong>healing</strong> to the party
            if they show <strong>respect for the sun</strong> or <strong>aid
            Kled</strong> in a significant way. He may also offer
            <strong>visions</strong> or <strong>interpret dreams</strong> the
            party has, tying them to the <strong>Sundering</strong> or the
            <strong>cosmic shifts</strong> in Athas.</li>

            <li><strong>Dialogue Example</strong>:

            <ul>

            <li><em>&ldquo;The sun is both a blessing and a curse, but without
            its light, Athas would be nothing but shadow. Respect its radiance,
            and it may guide you through the dark.&rdquo;</em></li>

            <li><em>&ldquo;Kemalok&rsquo;s spirit remains, burned into the
            stones by the sun&rsquo;s wrath. But spirits and stones are not
            enough to rebuild a world. What do you seek, travelers? Light or
            shadow?&rdquo;</em></li>

            </ul>

            </li>

            </ul>
