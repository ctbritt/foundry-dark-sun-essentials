      content: "<section class=\"readaloud\">\n<p>You enter the dimly lit chamber within the stone walls of Kled, surrounded by piles of weathered scrolls and cracked tablets. The air is thick with the scent of old parchment and dust and you see a lean and wiry human\_with hair that has gone almost completely white, falling in thin strands that barely cover his scalp. His skin is pale and sallow, a stark contrast to the sun-bronzed dwarves around him, as if he spends far more time poring over texts than standing under Athas' burning sun. His face is creased with the lines of a lifetime spent in study, and a pair of <strong>spectacles</strong> made from polished crystal rests on the bridge of his nose, their lenses catching the faint light and reflecting it in brief flashes.</p>\n</section>\n<p>\_</p>"
