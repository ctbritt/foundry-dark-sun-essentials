        jM4h8qpyxwTpfNli:
          notes: >-
            <h3><strong>Er&rsquo;Stali (Scholar and Translator)</strong></h3>

            <ul>

            <li><strong>Role</strong>: <strong>Historian and translator</strong>
            of the <strong>Book of the Kemalok Kings</strong>, a human scholar
            from <strong>Urik</strong> who has made Kled his home.</li>

            <li><strong>Appearance</strong>: A <strong>middle-aged
            human</strong> with a <strong>thin frame</strong>, <strong>wispy
            white hair</strong>, and <strong>spectacles</strong> made from
            <strong>polished crystal</strong>. He wears <strong>simple
            robes</strong> and carries a <strong>satchel</strong> filled with
            <strong>scrolls</strong> and <strong>translation notes</strong>. He
            often has <strong>ink-stained fingers</strong> from his work.</li>

            <li><strong>Personality</strong>: <strong>Inquisitive, gentle, and
            introspective</strong>, Er&rsquo;Stali is fascinated by
            <strong>Athasian history</strong> and <strong>dwarven lore</strong>.
            Unlike Baranus, he is more <strong>open to outsiders</strong>,
            seeing them as a potential source of <strong>new
            perspectives</strong> and <strong>knowledge</strong>. He is eager to
            <strong>discuss ancient history</strong> but is wary of
            <strong>power-seekers</strong>.</li>

            <li><strong>Motivations</strong>:

            <ul>

            <li>Continue translating the <strong>Book of the Kemalok
            Kings</strong> and uncover the lost <strong>wisdom of the
            dwarves</strong>.</li>

            <li>Protect the <strong>sanctity of dwarven history</strong> and
            ensure that <strong>Kemalok&rsquo;s past</strong> is not exploited
            by <strong>defilers</strong> or
            <strong>Sorcerer-Kings</strong>.</li>

            <li>Seek out any <strong>lost texts</strong> or
            <strong>artifacts</strong> that could shed light on the
            <strong>Sundering</strong> and the <strong>Drying</strong>.</li>

            </ul>

            </li>

            <li><strong>Interaction with the Party</strong>: Er&rsquo;Stali
            could become a valuable <strong>ally</strong> for the party if they
            show genuine interest in <strong>history</strong> or
            <strong>Kemalok</strong>. He might share <strong>clues</strong>
            about the <strong>mythallar</strong> or ancient <strong>Norrathian
            knowledge</strong> hidden in the <strong>ruins</strong> if the party
            gains his trust.</li>

            <li><strong>Dialogue Example</strong>:

            <ul>

            <li><em>&ldquo;Ah, travelers from beyond the desert! You&rsquo;ve
            come at an auspicious time. The winds whisper of long-lost tales...
            and perhaps, you might add a chapter of your own.&rdquo;</em></li>

            <li><em>&ldquo;Kemalok fell long before my time, but its echoes
            still reach us. Imagine the secrets buried there&mdash;words of
            kings and heroes, hidden beneath the sands. But not all secrets are
            meant to be unearthed.&rdquo;</em></li>

            </ul>

            </li>

            </ul>

            <p>&nbsp;</p>

            <p>Despite the frailty of his frame, his hands are steady and
            precise as he adjusts the placement of a delicate parchment, written
            in faded dwarven runes. His eyes, sharp and inquisitive, dart up
            from his work as you enter, peering over the rims of his spectacles
            with a gaze that seems to dissect every detail of your appearance.
            There&rsquo;s a glimmer of curiosity in his expression, a hunger for
            knowledge that has not dulled with age, but also a guarded
            caution.</p>

            <p>He adjusts his robes&mdash;a patchwork of frayed fabric dyed in
            shades of deep brown and faded red, stitched together from materials
            salvaged over the years. A worn leather belt holds various small
            pouches, likely filled with <strong>charcoal</strong>,
            <strong>ink</strong>, and <strong>quills</strong> for his work,
            along with a <strong>dagger</strong> that looks like it hasn&rsquo;t
            been used in years.</p>

            <p>His voice, when he finally speaks, is soft but carries a certain
            <strong>raspiness</strong>, as if too many years in dusty rooms have
            dried it out. It carries a tone of both <strong>intrigue and
            suspicion</strong>, his words slow and measured, like someone who
            has spent more time with books than with people:**</p>

            <p><em>&ldquo;Ah, travelers, and... curious ones, I see. Few wander
            this far to seek old words and ancient stories. And fewer still
            understand the weight of the tales they uncover. But tell me, what
            is it that draws you to a place forgotten by time, where even the
            stones remember what men have long since lost?&rdquo;</em></p>
