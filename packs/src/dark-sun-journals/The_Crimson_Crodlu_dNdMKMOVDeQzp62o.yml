      content: >-
        <p>Located at the dusty edge where the Caravan District meets the main
        thoroughfare into Tyr, the Crimson Crodlu serves those who drive the
        caravans rather than own them. The three-story mudbrick structure leans
        slightly eastward, as if yearning toward the open desert. Its namesake—a
        faded crimson crodlu painted across the western wall—has been repeatedly
        defaced and repainted, each iteration adding to its increasingly fierce
        appearance.</p>

        <p>The inn's sign, a carved wooden crodlu head with peeling red paint
        and real crodlu feathers for a crest, creaks ominously in the desert
        wind. Locals say the sign was made from the skull of Old Crimson
        himself, a legendary war-crodlu that supposedly killed seventeen
        gladiators before being put down in the arena.</p>

        <h2><strong>Proprietor</strong></h2>

        <p><strong>Ghazak "Three-Finger" Tomblador</strong> (male mul, former
        gladiator) runs the Crimson Crodlu with an iron fist—or rather, an iron
        hand, since his left hand is a crude metal prosthetic. The grizzled mul
        lost two fingers and eventually his whole hand in the arena, but claims
        he won that match anyway. His bald head bears ritual scarring from his
        gladiator days, and he moves with a permanent limp that doesn't seem to
        slow him down when breaking up fights.</p>

        <p>Ghazak maintains order through a combination of intimidation and
        respect. He offers free drinks to any gladiator who can prove they've
        won ten matches, and keeps a "Wall of Scars" where regular patrons can
        nail up tokens from their adventures. He claims to never forget a face
        or a debt, and his establishment operates on a simple rule: "Start
        trouble, become trouble."</p>

        <h2><strong>Layout &amp; Atmosphere</strong></h2>

        <p><strong>Ground Floor:</strong> The common room reeks of erdlu stew,
        unwashed bodies, and fermented kank nectar. Mismatched tables and chairs
        salvaged from a dozen different sources fill the space. The bar, made
        from a single massive agafari wood beam supposedly stolen from a
        templar's villa, bears thousands of knife marks, stains, and carved
        initials. A fighting pit in the corner (really just a rope circle) hosts
        nightly brawls for copper pieces.</p>

        <p><strong>Second Floor:</strong> Eight small rooms with straw
        mattresses (5 bits per night). Each room fits two people uncomfortably,
        three if they're friendly. The walls are thin enough to hear everything
        in adjacent rooms. One room has a hole in the floor that looks directly
        into the common room—Ghazak charges half price for this "ventilated
        suite."</p>

        <p><strong>Third Floor:</strong> The "luxury" accommodations—four rooms
        with actual cots and a communal balcony overlooking the crodlu pens (1
        ceramic piece per night). The balcony is missing several boards and the
        railing is purely decorative at this point.</p>

        <p><strong>Basement:</strong> Ghazak's private quarters and a "storage
        area" that definitely doesn't connect to any smuggling tunnels,
        regardless of what anyone might claim.</p>

        <h2><strong>The Crodlu Pens</strong></h2>

        <p>Behind the inn, a dusty courtyard holds pens for crodlu, erdlu, and
        the occasional kank. The stablehand, a sun-weathered halfling named
        <strong>Pip</strong> who claims to speak fluent crodlu, charges 2 bits
        per night per mount. Pip also runs a side business selling "crodlu
        whisper"—a foul-smelling ointment that supposedly makes the beasts more
        docile. Most suspect it's just fermented kank dung mixed with mint.</p>

        <h2><strong>Services &amp; Amenities</strong></h2>

        <ul>

        <li><strong>Meals:</strong> Erdlu stew (2 bits), mystery meat skewers (1
        bit), pickled cactus (1 bit), "desert surprise" (3 bits, contents vary
        wildly)</li>

        <li><strong>Drinks:</strong> Broy (1 bit), cactus wine (2 bits),
        fermented kank nectar "Kickjuice" (3 bits), water (1 ceramic)</li>

        <li><strong>Fighting Pit:</strong> Entry fee 1 bit, winner takes 70% of
        the pot</li>

        <li><strong>Ghazak's Special:</strong> For 5 ceramic pieces, Ghazak will
        "forget" he saw you for a week</li>

        <li><strong>Message Board:</strong> 1 bit to post, free to read (mostly
        caravan job postings and bounties)</li>

        <li><strong>"Medical" Services:</strong> Rakik the Scarred (half-elf
        defiler) will patch wounds for ceramic, no questions asked</li>

        </ul>

        <h2><strong>Notable Regulars</strong></h2>

        <ul>

        <li><strong>Skarr Longtooth</strong> (half-giant caravan guard): Always
        hiring muscle for desert runs. Pays poorly but reliably.</li>

        <li><strong>Veiled Jessa</strong> (human smuggler): Never removes her
        face wrappings. Trades in information and "hard to find" goods.</li>

        <li><strong>Crooked Tam</strong> (dwarf ex-templar): Drinks to forget
        his past. Becomes dangerously talkative about templar operations when
        drunk.</li>

        <li><strong>The Dustwalker Twins</strong> (elf rangers): Scouts for hire
        who claim to know every oasis within 50 miles of Tyr.</li>

        <li><strong>Morg the Moneylender</strong> (human): Offers loans at
        "reasonable" 20% weekly interest. His two mul enforcers ensure timely
        payment.</li>

        </ul>

        <h2><strong>Current Rumors (roll d6)</strong></h2>

        <ol>

        <li>"Ghazak's been buying up water rights outside the city. Something
        big is coming."</li>

        <li>"That new caravan master, Krellan? His last three crews never made
        it back from the Tablelands."</li>

        <li>"Someone's been killing elven smugglers in the Warrens. Templar
        work, or something worse?"</li>

        <li>"Old Crimson's ghost haunts the fighting pit. That's why nobody ever
        dies in there—he won't allow it."</li>

        <li>"There's a hidden gladiator training camp in the desert, preparing
        fighters for something. Revolution, maybe?"</li>

        <li>"The Veiled Alliance meets here every new moon. Or was it the True?
        I can never remember which secret society is which."</li>

        </ol>

        <h2><strong>Plot Hooks</strong></h2>

        <ul>

        <li>Ghazak needs someone to collect a debt from a noble who claims he
        never visited such a "low establishment"</li>

        <li>Pip's favorite crodlu has gone missing, along with three others. The
        tracks lead toward the Warrens.</li>

        <li>A dying caravan guard stumbles in claiming his entire caravan was
        taken by "shadows that walked like men"</li>

        <li>The fighting pit has attracted a mysterious patron offering 50
        ceramic to anyone who can last three rounds with their champion</li>

        <li>Crooked Tam has sobered up and wants to hire protection—he's
        remembered something about his templar days that certain people would
        kill to keep quiet</li>

        </ul>

        <h2><strong>DM Notes</strong></h2>

        <p>The Crimson Crodlu serves as an excellent information hub for
        lower-class adventurers and those operating on the fringes of Tyrian
        society. Unlike the Golden Inix or Sweetwater Inn, the Crodlu attracts
        those who work in the shadows—smugglers, discharged soldiers, desperate
        merchants, and adventurers down on their luck.</p>

        <p>Ghazak maintains neutrality in most conflicts, but he has old
        gladiator connections that run deep. He harbors a special hatred for
        particular templar families who bet against him in his final match. The
        basement does indeed connect to smuggling tunnels, which in turn connect
        to the Warrens—for the right price, people or goods can disappear
        quickly.</p>

        <p>The inn works best as a recurring location where the party can
        develop relationships with the regulars, pick up side quests, and gather
        information about the seedier side of Tyr. The fighting pit can provide
        quick entertainment or a way for martial characters to earn some coin
        and reputation.</p>
