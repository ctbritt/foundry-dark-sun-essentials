      content: "<p>The White Mountains, near the shores of the Silt Sea,\_are named for the pearly white snow that covers their\_uppermost peaks. This snow cover lasts the year round,\_for it's always cold and wet at the mountain's highest\_elevations. It's among these frozen peaks that the village\_of Winter Nest can be found.</p>\n<p>A large tribe of civilized aarakocra settled Winter Nest\_long ago. They call themselves “silvaarak,” the people\_of the silver wing. These bird-people believe themselves\_to be superior to all other creatures due to their ability\_to fly above the world. This perspective naturally gives\_them great confidence and pride in\_ themselves, and they\_possess a certain amount of sympathy for all land-bound\_creatures.</p>\n<p>Winter Nest is formed from a mixture of ice, stone,\_and shaped bricks. The combination creates an amazing\_spectacle that is unlike any other place in Athas. The\_use of ice alone makes it a strange and fascinating place.\_</p>\n<p>Like the structures of the halflings of the Jagged Cliffs,\_everything in Winter Nest has a vertical orientation. As\_home to flying creatures, it doesn't matter where doors\_are placed, and walkways and ladders aren't necessary.\_</p>\n<p>Instead, buildings are surrounded by a series of landing\_platforms and resting perches that only vaguely resemble\_the streets and market places of human cities.</p>\n<p>For the most part, the aarakocra of Winter Nest stay\_in the peaks of the White Mountains. Traders from the\_village travel to Kurn a few times each year, but otherwise\_the community tends to keep to itself. Problems with the\_Bandit States and Eldaarich make such a policy seem\_reasonable. Many young bird-people, however, want to\_explore the world beyond the mountains and interact\_with other civilized cultures. If the vocal and persistent\_segment of the population is successful, Winter Nest may\_completely abandon its isolationist ways.</p>\n<p>Traaka leads the village. She prefers to keep Winter\_Nest separate from the lower lands in order to maintain\_its safety. However, she also understands the call of the\_sky that makes the young aarakocra want to soar beyond\_the summits and explore the world. She's desperately\_trying to define a policy that allows such exploration\_without endangering the whole community.</p>\n<p>\_</p>\n<p><img src=\"data:image/png;base64,\" /></p>"
