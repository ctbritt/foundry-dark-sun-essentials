    text:
      format: 1
      content: "<p>The Tyrian Guard doesn't venture into the Noble District. Instead, the major noble families provide a small private army of watch officers. Called the Scarlet Helms after their distinctive red-dyed headwear of mixed scales, this force maintains order in the streets and escorts non-residents out of the district by nightfall. It keeps special watch on the borders where trade districts adjoin noble neighborhoods.</p>\n<p>A Scarlet Helms squad consists of a leader (usually a human or mul gladiator) and several half-giant guards. A number of ex-gladiators have hired on with the Scarlet Helms in the weeks since Kalak died and the slaves were freed.</p>\n<p>\_</p>"
