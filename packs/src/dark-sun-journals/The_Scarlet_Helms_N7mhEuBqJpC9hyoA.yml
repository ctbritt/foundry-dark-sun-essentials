        wgCeShTrqHJFBbDr:
          notes: >-
            <p>The Scarlet Helms represent the noble families' attempt to
            maintain their exclusive enclave within Tyr's changing social order.
            They can serve as obstacles for parties trying to access the Noble
            District, potential allies if the party gains noble backing, or
            sources of information about aristocratic activities. Their
            ex-gladiator membership creates interesting dynamics—former slaves
            now protecting the wealthy elite who once owned them. This tension
            could lead to recruitment opportunities, moral dilemmas, or
            infiltration possibilities depending on how the party approaches
            them. Their distinctive red-scaled helmets make them easily
            recognizable throughout the city.</p>
        scrollPos: '{".tab.description .tab-inner":0}'
