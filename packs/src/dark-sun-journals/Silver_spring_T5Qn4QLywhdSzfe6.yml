      content: "<div id=\"page-content\"><p>For the price of two pieces of silver, visitors are admitted into the stone walls where they receive access to the small pond of bad-tasting water. The elves also maintain a small market inside the compound.</p><p>A fortified caravanserai stands at the oasis along the\_trade route between Tyr and Urik. This roadside inn\_is a preferred stop for many house merchants and\_dune traders. Its faded, worn walls have greeted travelers for more than a century with flickering lanterns</p><p>lit just after nightfall, snippets of exotic song, and the\_clamor of excited trade.\_</p><p>Silver Spring Oasis is a great walled square, with\_the central courtyard open to the elements. The inner wall of the courtyard is riddled with doors that lead to sleeping chambers, a common room, food stores,\_stables, and vaults where dune traders can safeguard\_</p><p>their merchandise. The courtyard also contains the eponymous “Silver Spring,” a central well that yields\_cloudy, foul-tasting water. (Whoever named the well\_apparently did so a long time ago, when the water\_was fresh, or the name might be ajoke.) Still, the</p><p>water is safe for people and mounts to drink, and\_when properly filtered, it becomes suitable for the\_famous “silver baths” that only the wealthiest traders\_can afford. Carts and stalls of minor merchants fill\_the courtyard around the well.</p><p>The proprietors are a tribe of elves called the\_Silver Hands. Unlike others of their kind, the elves\_are not nomadic herders or raiders; they have run\_Silver Spring Oasis for several generations. The current leader of the tribe and head of the caravanserai\_is Chief Toramund, who greets all newcomers, settles\_all conflicts, and oversees orderly trade. Those who\_violate the inn’s primary rule (do not steal from\_another visitor) are ejected through the gate without\_their trade items, belongings, or clothing.</p><p>\_</p><p>\_</p></div>"
