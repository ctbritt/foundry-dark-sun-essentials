      content: "<img src=\"worlds/dsr/Fort_Walls.webp\" /><p>Fort Harbeth Map</p><p>1) Main Gate. The\_ gatehouse\_ frames\_ a\_ high\_ gate\_ with\_ a\_ portcullis made of\_ agafari\_ poles\_\_</p><p>from\_ Gulg.\_ The\_ portcullis\_ is open during the day (except when the fortress is\_ under\_ attack),\_</p><p>and closed at\_ night.\_ A\_ force\_ of\_ four\_ men\_ is\_ kept\_ in\_ the gatehouse at all times,\_ watching\_</p><p>\_for\_ caravans\_ approach ing\_ from\_ the\_ road.</p><p>2) Walls. These stone walls are\_ 20\_ feet\_ high\_ and\_ topped\_ with machicolations. Each side of the\_</p><p>fort is manned\_ by\_ two\_ guards at all times, and\_ alarm\_ gongs\_ are\_ mounted\_ at\_ the\_ cen ter\_</p><p>of each wall, If rung, these\_ gongs\_ will\_ rouse\_ all\_ of\_ the\_ guards\_ to\_ the\_ defense\_ of\_ the\_\_</p><p>fortress.</p><p>Sections of the walls are trapped with many 8\"-diameter round pits,\_ spined\_ to\_ prevent\_ a\_\_</p><p>trapped\_ person\_ from\_ removing a foot or\_ limb.\_ The\_ pits\_ are\_ covered\_ with\_ sun-baked\_\_</p><p>clay,\_ and they are easily spotted in daylight. Thus,\_ they\_ present\_ a\_ hazard only to a night\_</p><p>traveler,\_ or\_ to\_ an\_ attacker\_ coming\_ quickly over the wall.\_ Hurgen\_ has\_ trained\_ his\_ men\_ to\_</p><p>\_chan nel attackers scaling the walls\_ into\_ one\_ of\_ these\_ areas\_ to\_ further delay their\_</p><p>invasion. Hurgen himself has\_ no\_ fear\_ of these areas, as the pits are\_ too\_ small\_ to\_ catch\_ his\_</p><p>\_massive\_ feet. The exact location of trapped areas is left for the DM to determine.</p><p>A\_machicolation\_(French: mâchicoulis) is a floor opening between the supporting corbels of a battlement, through which stones or other material, such as boiling water or boiling cooking oil, could be dropped on attackers at the base of a defensive wall.</p><p>\_</p><p>3) Warehouse. This building holds\_ the\_ trade\_ goods\_ of Fort Harbeth.\_ Most\_ of\_ the\_ building\_ is\_</p><p>\_a\_ warehouse,\_ covered by a roof\_ of\_ leather\_ on\_ a\_ wooden\_ framework.\_ The\_ roof\_ keeps\_ the\_\_</p><p>sun\_ from\_ beating\_ down\_ directly\_ on\_ the\_ trade\_ goods,\_ but\_ the warehouse is\_ still\_ hellish\_\_</p><p>during\_ midday.\_ The\_ rear\_ sec-\_ tion of the\_ building\_ is\_ the\_ slave\_ quarters;\_ 80\_ slave\_\_</p><p>laborers\_ are\_ herded\_ into\_ this\_ section\_ and\_ locked\_ in\_ at\_ \_ \_night.</p><p>4) Trading Office. This building is both the\_ trading\_ office and the\_ residence\_ of\_ the\_ master\_\_</p><p>trader.\_ The\_ building\_ has two stories; a small staircase winds up the front of the building to\_</p><p>the entrance on the second\_ floor.\_ The\_ second floor is the trading area; it\_ is\_ austere\_ and\_\_</p><p>functional.\_ This\_ floor also holds the chambers of Waltian's four personal slaves.</p><p>The lower floor, which is partially underground and therefore\_ considerably\_ cooler,\_ is\_ Waltian's\_</p><p>\_ home.\_ This\_ floor is filled with accommodations, including a direct pipe\_ to\_ carry water from\_</p><p>the cistern to a bathing well for the master\_ trader's personal comfort. This bathing well, and the\_</p><p>water it consumes,\_ is\_ a\_ sore\_ point\_ with\_ some\_ traders\_ forced\_ to\_ make\_ do\_ with\_ the\_ water\_</p><p>\_in\_ the\_ outer\_ troughs.</p><p>\_</p><p>\_</p><p>5) Trader's Barracks. This building houses\_ Kelira\_ and\_ the other traders who serve Waltian Inika.\_</p><p>The building is divided into three bedrooms, each holding\_ three\_ traders\_ and one personal slave\_</p><p>each. A central common room allows the traders\_ to\_ eat\_ and\_ discuss\_ the\_ day's\_ business\_ in\_\_</p><p>the\_ shade.\_ Waltian\_ rarely\_ comes\_ here.</p><p>6) Garrison Barracks. Forty soldiers and\_ their\_ 10\_ slaves reside in the\_ longer\_ main\_ building;\_\_</p><p>the\_ square\_ building\_ to\_ the south is Hurgen's quarters, with ceiling and\_ furniture suitable to\_</p><p>his large size. A kitchen has been added to the building, jutting out to the\_ east;\_ the\_ garrison\_\_</p><p>cook\_ is\_ respon-\_ sible\_ for\_ feeding\_ all\_ of\_ the\_ staff\_ of\_ the fortress.</p><p>7) Cisterns. These large stone cylinders hold the accu- mulated\_ water\_ from\_ the\_ spring.\_ Should\_\_</p><p>the\_ spring\_ fail,\_ there\_ \_ is enough water in\_ the\_ cisterns\_ at\_ any\_ one\_ time\_ to\_ support\_\_</p><p>the full complement of freemen in the fortress for six months. (Should slaves and erdlu be\_ given\_\_</p><p>water\_ in\_ that time of duress, the cistern would only last two months.)\_ The\_ spring water flows\_</p><p>directly into the cisterns, and the heavy leather awnings over these tanks,\_ combined\_ with\_ the\_\_</p><p>cool\_ flow from the spring, keep the water from becoming\_ too warm\_ and\_ stagnant\_ during\_ the\_\_</p><p>day.</p><p>8) Erdlu Pen. This low\_ hollow\_ is\_ the\_ pen\_ for\_ the\_ erdlu\_ herd. The herd is allowed\_ to\_\_</p><p>forage\_ for\_ scrub\_ during\_ the\_ day, but at night it is kept\_ here.\_ The\_ sides\_ of\_ the\_ hollow\_\_</p><p>are\_ too\_ steep for the erdlu to climb;\_ the\_ birds\_ can\_ enter\_ and\_ leave\_ only through the\_</p><p>narrow, gently-sloped pass. The pass is blocked\_ by\_ a\_ rough\_ gate\_ made\_ of\_ mekillot\_ \_ bones.</p><p>9)\_ Caravanserai.\_ This\_ large,\_ level\_ area\_ \_of\_ \_hard-packed\_ \_earth is where merchants and\_</p><p>their caravans\_ camp\_ when\_ vis-\_ iting Fort Harbeth.\_ A\_ narrow\_ pipe\_ from\_ the\_ cisterns\_ inside\_</p><p>\_the fortress can be opened to fill the water troughs on\_ the\_ western edge; the water can\_ be\_\_</p><p>shut\_ off\_ from\_ inside,\_ preserv-\_ ing the water supply in case of siege. The area is kept\_ clear\_</p><p>of\_ brush\_ by\_ the\_ garrison\_ and\_ by\_ the\_ grazing\_ \_erdlus.</p><p>10) Stable. This building houses the\_ small\_ hive\_ of\_ kanks\_ that serves this fortress as\_ mounts.\_</p><p>\_There\_ is\_ supposed\_ to\_ be\_ a full\_ complement\_ of\_ 20\_ kanks\_ at\_ Fort\_ Harbeth at\_ all\_ times.\_</p><p>The fort, however, is often at less than\_ full\_ strength.\_ The kank tenders must ensure that the\_</p><p>brood\_ queens\_ do\_ not\_ lay eggs in the stable, so the area is kept free from\_ vegetation.\_ Gravid\_</p><p>brood-queens are\_ driven\_ to\_ a\_ \_nearby\_ valley\_ where the hive\_ can\_ raise\_ the\_ new\_ brood.\_\_</p><p>Once\_ the\_ hatching\_ period is over, the kanks are driven back to the\_ fortress.\_ Excess kanks\_ are\_</p><p>sold or driven\_ \_away.</p><p>\_</p><hr /><p>Fort Harbeth</p><p>Esreva's\_ Journal</p><p>Fort Harbeth was the first fortress I visited with\_ my master after he acquired me and learned of\_</p><p>my unusual memory. It was\_ also\_ the\_ site\_ of\_ my\_ first\_ escape\_ attempt.\_ We were inside the\_\_</p><p>keep,\_ at\_ the\_ small\_ house\_ they\_ main- tain for important visitors. I decided\_ to\_ climb\_ over\_\_</p><p>the\_ low\_ walls and make my way into the\_ desert. From there I\_ would either return to my trading\_</p><p>house or take my chances with\_ one\_ of\_ the\_ slave tribes in\_ the\_ \_desert.\_</p><p>There were few guards, and\_ the\_ watchmen\_ were\_ look- ing outward into the\_ desert.\_ I\_ found\_ an\_\_</p><p>unguarded\_ ladder and made my way to the upper\_ walkway.\_ I\_ quickly pulled the ladder\_ up\_ to\_\_</p><p>the\_ top\_ and\_ flipped\_ it\_ down\_ the far side of the\_ wall.\_ As\_ I\_ moved\_ across\_ the\_ walkway,\_\_</p><p>my\_ foot suddenly broke through the clay and plunged in\_ to\_ a barbed pit. The down ward pointing\_</p><p>spikes that lined the narrow tube bit into my\_ leg\_ and\_ held\_ me\_ fast.\_ I\_ cried\_ out and\_ was\_\_</p><p>quickly\_ subdued\_ by\_ the\_ guards.\_</p><p>The fort commander had me interrogated by a mind- bender and discovered that I was once a merchant.\_</p><p>He presumed that I\_ was\_ working\_ for\_ a\_ rival\_ merchant\_ house\_ and wan ted\_ me\_ executed\_\_</p><p>immediately.\_ My\_ master\_ and\_ the commander fought bitterly.\_ My\_ master\_ truly\_ did\_ not\_ care if\_</p><p>I lived or died, but he would not\_ allow\_ anyone\_ to destroy\_ the\_ property\_ of\_ the state.\_</p><p>My master\_ eventually\_ won-else\_ I\_ would\_ not\_ be\_ here to\_ tell this story.\_ He\_ was\_ angry,\_\_</p><p>however, and\_ his\_ \_punishment was swift. My back still bears the scars fram\_ the lashing\_ I\_ received.\_</p><hr /><p>Fort Harbeth is the major fort of House Inika\_ in\_ the\_ Ivory\_ Triangle region. The fortress is\_</p><p>located in the southwestern foothills\_ of the\_ Mekillot\_ Mountains,\_ at the\_ \_intersection\_ of the\_</p><p>caravan routes between Gulg, Salt View, and North Ledopolus. It\_ stands\_ at\_ the\_ top\_ of\_ a\_ large\_</p><p>\_hill\_ in\_ the\_ stony barrens,\_ its\_ rear\_ and\_ sides\_ protected\_ not\_ \_only\_ \_by\_ \_the\_ \_fortress\_</p><p>wall\_ but\_ also\_ by\_ the\_ sheer\_ sides\_ of\_ the\_ hill\_ which\_ act\_ as\_ natural\_ palisades.\_ A\_\_</p><p>winding\_ road\_ brings\_ \_caravans\_ \_up\_ \_the\_ \_hillside\_ to\_ the\_ main\_ gate.\_ In\_ keeping\_ with\_\_</p><p>the\_ traditions\_ of\_ this house,\_ its\_ defenses\_ are\_ quietly\_ understated,\_ \_but\_ \_the\_ \_nomads\_</p><p>and\_ raiders\_ of the\_ Triangle\_ have\_ learned\_ better\_ than\_ \_to attack\_ \_this\_ \_powerful\_ \_fort.</p><hr /><p>History</p><p>Fort Harbeth began as a supply post of House Riben for caravans on the Gulg-Ledopolus trade route.\_</p><p>Located at the\_ rough midpoint between the two\_ cities,\_ the\_ fort\_ was\_ blessed\_ with a natural\_</p><p>spring\_ which was\_ too\_ small\_ to\_ support\_ an\_ oasis but provided enough water\_ for\_ as\_ many\_ as\_\_</p><p>200\_ men\_ each day. House Riben built a cistern for\_ the\_ flow\_ and\_ a\_ small\_ walled\_ keep\_ to\_\_</p><p>protect\_ the\_ \_cistern.</p><p>The\_ small\_ outpost\_ remained\_ in\_ Riben\_ hands\_ for\_ over\_ 100 years.\_ \_Shortly\_ \_after\_ House\_ \_</p><p>Inika\_ \_split\_ \_off\_ \_from\_ \_House\_ \_Riben, a brief\_ interhouse\_ dispute\_ left\_ the\_ fortress\_ in\_\_</p><p>the\_ hands\_ of House\_ Inika,\_ which\_ used\_ it\_ as\_ a\_ more\_ \_discreet\_ location\_ to\_ form\_ \_the\_ \_</p><p>spice\_ \_caravans\_ \_that\_ \_traveled\_ \_from\_ \_Gulg\_ \_to\_ Tyr.</p><p>The outpost also allowed\_ House\_ Inika\_ to\_ tap\_ into\_ trade\_ with the nomads. Elven merchants,\_</p><p>herdsmen, and\_ hunters\_ were\_ all\_ welcomed\_ to\_ the\_ fort.\_ Raiders\_ occasionally\_ attacked,\_ so\_</p><p>the defenses of\_ the\_ small\_ keep\_ were\_ slowly\_ improved\_ until\_ no\_ \_raiding\_ \_tribe\_ \_would\_ \_</p><p>consider\_ \_attacking again.</p><p>As is the case with virtually all merchant outposts,\_ the\_ traders at the fort refused to conduct\_</p><p>business with raiding\_ tribes. Merchant houses recognize that the best way to dis- courage raids on\_</p><p>their caravans is to close their markets\_ to\_ stolen\_ goods-unless, of\_ course,\_ they\_ are\_\_</p><p>actively\_ encourag- ing raids on\_ a\_ rival\_ house. Unfortunately, it\_ is\_ not\_ always\_ easy to tell\_</p><p>just where a traveler obtained his\_ cargo.\_ The elven tribes, on the other hand, are always eager\_</p><p>to make purchases\_ without\_ asking\_ too\_ many\_ \_questions.</p><p>Initially,\_ \_the\_ \_traders\_ \_of\_ \_Fort\_ \_Harbeth\_ \_also\_ \_refused\_ \_to\_ \_trade with renegade slaves. As the\_ slave\_ tribes\_ became\_ more\_ stable\_ and began to produce goods\_</p><p>rather than just steal them, this stricture was lifted. This willingness to trade with ex-slaves\_</p><p>improved the lot of the slave\_ tribes,\_ allowing\_ them\_ to\_ expand and\_ stabilize.</p><p>The fort's importance increased as North and South Ledopolus grew. The presence of these\_ dwarven\_\_</p><p>settlements and their silt skimmers made shipment of cargo across the Estuary of the Forked Tongue\_</p><p>to Balic profitable.\_ House\_ Inika established an alliance\_ with\_ House\_ Wavir\_ in\_ which the\_</p><p>houses would wholesale goods to one another at the crossing. A premium would be paid to the house\_</p><p>that assumed the risk of transporting the cargo across the giant- plagued estuary. The\_ arrangement\_</p><p>\_worked\_ out\_ very\_ well\_ for both houses, and Inika eventually established a small emporium in\_</p><p>Balic. That base serves primarily as an admin istrative office and an outlet for some\_ of\_\_</p><p>Inika's\_ most\_ exotic\_ wares.</p><p>Fort Harbeth's importance grew again when Fort Fyra was founded. This enterprise, the most\_\_</p><p>well-established\_ of\_ all the\_ slave\_ tribe\_ endeavors,\_ has\_ become\_ an\_ important\_ \_trading</p><p>partner\_ for\_ Fort\_ Harbeth.\_ The\_ fort's\_ \"nomad\_ trade\"\_ \_ \_ has</p><p>grown, and House Inika has used the additional\_ profit\_ to\_ increase\_ the\_ staff\_ of\_ this\_ small\_ \_</p><p>\_outpost.</p><hr /><p>The\_ Fort\_ Today</p><p>Lying near the crossroads of three major trade routes, Fort Harbeth is frequented by nomads,\_</p><p>merchant caravans, slave tribes, and even some elven tribes. Some of House Inika's caravans to\_</p><p>North Ledopolus and points beyond pass\_ through Harbeth's gates, but the task of\_ marshalling\_ the\_\_</p><p>car-\_ avans for Tyr has fallen to\_ the\_ headquarters\_ of\_ the\_ house\_ in\_ Gulg. Recently, trade\_</p><p>with North Ledopolus has\_ led\_ to\_ an increase in the supply of dwarven items, particularly\_</p><p>weapons, passing through this fortress. Such items can be purchased in the\_ fort,\_ although\_ they\_\_</p><p>are\_ even\_ more\_ expen-\_ sive\_ here\_ than\_ in\_ \_Gulg.</p><p>In addition to the standard trade goods, Fort Harbeth maintains a large herd of\_ erdlu.\_ These\_\_</p><p>birds\_ thrive\_ on\_ the rough scrub which dots the foothills\_ of\_ the\_ Mekillot\_ Moun-\_ tains\_ and,\_\_</p><p>with\_ the\_ ready\_ supply\_ of\_ \_water\_ provided\_ \_by\_ \_ \_the</p><p>spring,\_ are\_ able\_ to\_ survive\_ year-round\_ \_without\_ \_ever\_ \_ straying</p><p>far\_ from\_ the fortress.</p><p>The fortress is an important supply point\_ for\_ the\_ traders\_ who canvass this region. It is rare\_</p><p>for a week\_ to go by without\_ \_ \_ \_ \_ a small caravan wandering in or out of the gates. Most of the\_</p><p>caravans are of House Inika but some are from other houses, notably\_ House\_ Wavir\_ and\_ the\_\_</p><p>Renythi\_ \_League.</p><p>Fort Harbeth caters to the small, fast caravans favored by\_ House Inika. These caravans haul cargo\_</p><p>on\_ the\_ backs\_ of\_ kank or inix rather than using the slow mekillot wagons. The enormous lizards'\_</p><p>need for huge\_ quantities of\_ water\_ make\_ such caravans unpopular visitors. The fortress can,\_</p><p>however, accommodate mekillot wagons when necessary. In an emer- gency, the interior of the\_ fort\_\_</p><p>can\_ hold\_ all\_ the\_ beasts\_ of\_ a\_ small caravan, but for normal traffic, there is a good cara-\_</p><p>vanserai\_ \_just\_ \_outside\_ \_the gates.</p><p>House Inika actually has good relations with several\_ elven trading tribes, and such tribes\_\_</p><p>occasionally\_ stop\_ at Fort Harbeth. The master trader\_ is\_ naturally\_ suspicious\_ of\_ elves he\_</p><p>does not know, and will not allow a\_ tribe\_ to\_ unload\_ booty\_ which\_ they\_ have\_ obviously\_ just\_\_</p><p>stolen\_ in\_ a\_ raid.</p><p>The master trader will not permit\_ thri-kreen\_ inside\_ the\_ walls, although he will allow them to\_</p><p>trade here.\_ When\_ thri- kreen come to the\_ fortress,\_ a\_ special\_ trading\_ table\_ is\_ set\_ up on\_</p><p>the hillside outside the fortress, and\_ all\_ trading\_ is\_ done\_ from there.</p><hr /><p>The Garrison</p><p>Fort Harbeth's garrison includes a staff of 10 traders, including the master trader Waltian Inika\_</p><p>and his assistant, Kelira Legar. This small trading group is defended by\_ 40\_ soldiers led by\_</p><p>Hurgen Vurst, a half-giant.\_ Four\_ of\_ the\_ soldiers are 7th-level sergeants, the rest\_ are\_ all\_</p><p>\_5th-level\_ fighters.\_ The troops wear hide armor and carry bone battle axes, light crossbows,\_ and\_</p><p>\_stretched\_ leather\_ shields.</p><p>The garrison is supported by a well-defended fortress. In addition to the usual defenses of high\_</p><p>walls\_ and\_ strong\_ gates, the outer defenses of the fortress are\_ littered\_ with traps. Most of\_</p><p>these traps are fairly simple. They consist of covered pits and spined traps along the tops of the\_</p><p>walls, intentionally loosened stones on the outer face to deter climbers, and other delaying or\_</p><p>injuring barriers.\_ These\_ traps are intended to deter stealthy attacks;\_ the\_ garrison\_ is\_ quite\_\_</p><p>sufficient\_ to\_ repel\_ any\_ direct\_ attack\_ by\_ \_ force.</p><p>The garrison has recently been enlarged\_ in\_ response\_ to growing\_ concerns\_ that\_ the\_ slaves\_ \_of\_</p><p>\_ Salt\_ \_View\_ \_might\_ \_choose to raid the fort rather than\_ trade\_ with\_ it.\_ Caravans\_ and\_</p><p>traders\_ are\_ watched\_ carefully,\_ and\_ Hurgen\_ \_Vurst\_ \_has\_ \_standing orders to forbid entry of\_</p><p>more than 10 non-House Inika individuals\_ to\_ the\_ fortress.\_ Some\_ of\_ the\_ passing\_ \_traders\_ \_</p><p>who\_ have\_ been\_ forced\_ \_to\_ \_sleep\_ \_in\_ \_the\_ \_caravanserai\_ \_have\_ \_grumbled at this policy,\_</p><p>but to date, Fort\_ Harbeth\_ has\_ not\_ been\_ successfully\_ \_ attacked.</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Personalities</p><p>Waltian lnika</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Male\_ \_Human\_ \_Trader,\_ \_Lawful\_ \_Neutral</p><p>\_</p><p>Armor\_ \_Class\_ \_8\_ \_(padded\_ \_armor)\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Str\_ 17</p><p>Movement\_ 12\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ Dex\_ 13\_</p><p>Level\_ \_7\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_\_</p><p>Con\_ 12\_</p><p>Hit\_ \_Points\_ \_27\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Int\_ 13</p><p>THAC0\_ 15\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Wis\_ 17\_</p><p>No.\_ \_of\_ \_Attacks\_ \_1\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Cha 12\_</p><p>\_</p><p>Damage/Attack: 1d4+1 (bronze dagger), 1d4+2 (sling bullet)</p><p>Psionic Summary: PSPs 63; Wild Talent-contact\_ (PS\_ 17;\_ Cost: special+1/round), send thoughts (PS\_</p><p>12; Cost: con- tact+2/round)\_</p><p>\_</p><p>Waltian Inika is a tall, slender man with dark hair and a closely-cropped beard. His silken\_ robes\_\_</p><p>and\_ confident\_ bear-\_ ing make it obvious that he is the chief\_ trader\_ of\_ Fort\_ Har- beth.</p><p>Waltian\_ is a\_ man\_ whose\_ ambition\_ exceeds\_ his\_ ability. While competent, he does not have the\_</p><p>vision\_ or\_ strength\_ of character\_ to\_ \_become\_ \_a\_ \_leader.\_ \_He\_ \_has\_ \_spent\_ \_much\_ \_of\_ \_his\_\_</p><p>\_life in House Inika's most vital trading posts, first as\_ an\_ assistant\_ outpost master and agent,\_</p><p>now as master trader of an increasingly important\_ base.\_ He\_ has\_ spent\_ little\_ time\_ on\_ car-\_\_</p><p>avans, considering the risks of such an uncomfortable and dangerous\_ \_lifestyle\_ \_much\_ \_greater\_ \_</p><p>than\_ \_the\_ \_potential\_ \_ \_ rewards.</p><p>He has been consistently\_ assigned\_ to the\_ outer\_ posts, away from the cities, for a number of\_</p><p>reasons. First,\_ although\_ Waltian is a shrewd and\_ cunning\_ trader,\_ he has\_ made\_ a\_ number\_ \_of\_\_</p><p>\_serious\_ \_mistakes\_ \_that\_ \_have\_ \_cost\_ \_the\_ \_house\_ \_consid-</p><p>erably\_ in\_ lost\_ profits.\_ These\_ incidents\_ are\_ in\_ the\_ past,\_ but\_ the</p><p>leaders\_ of\_ House\_ Inika\_ have\_ long\_ \_ \_memories.</p><p>Second, his natural telepathic abilities make him an ideal representative for a distant\_ outpost.\_\_</p><p>He\_ has\_ sufficient\_ psionic power to make a short daily report\_ back\_ to\_ the\_ main\_ chapter-\_\_</p><p>house\_ in\_ Gulg.\_ Since\_ his\_ \_most\_ \_potent\_ \_telepathic\_ \_ability\_ \_is\_ \_only\_ one-way\_ and\_ his\_\_</p><p>psionic\_ strength\_ is\_ too\_ low\_ to\_ allow\_ him\_ \_to attempt to use his power more than once or\_\_</p><p>twice\_ a\_ day,\_ he\_ would\_ \_not\_ be\_ as\_ useful\_ \_in\_ a\_ central\_ \_ \_location.</p><p>Finally, Waltian's personality has stood in the way of advancing\_ his\_ career\_ in\_ Gulg.\_ Advisers\_\_</p><p>to\_ the\_ house\_ \_matri- arch, Andiama Inika,\_ disdain\_ his\_ pompous\_ attitudes\_ toward\_ those of\_</p><p>equal\_ or\_ lower\_ rank\_ and\_ his\_ obsequious\_ fawning\_ toward everyone above\_ him.\_ Waltian\_\_</p><p>fancies\_ himself\_ an\_ expert on everything and has an exaggerated sense of self- importance.\_\_</p><p>Andiama's\_ advisers\_ hope\_ \_that\_ \_the\_ \_responsibili- ties\_ of\_ running\_ the\_ fort\_ will\_\_</p><p>eventually\_ \_tone\_ \_Waltian\_ \_down and allow him to develop some polish.\_ No\_ one\_ objects\_ to\_\_</p><p>Waltian's wish to rise\_ in\_ the\_ hierarchy;\_ they\_ are\_ just\_ con- cerned\_ that\_ he\_ may\_ simply\_\_</p><p>not\_ have\_ what\_ it\_ \_ \_ takes.</p><p>\_</p><p>Kelira Legar</p><p>Female\_ \_Human\_ \_Trader,\_ \_Lawful\_ Good</p><p>Armor\_ \_Class\_ \_8\_ \_(padded\_ \_armor)\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Str 15</p><p>Movement\_ \_12\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Dex\_ 13\_</p><p>Level\_ 5\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Con\_ 7</p><p>Hit\_ \_Points\_ \_13\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Int\_ 11</p><p>THACO\_ 17\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ Wis\_ 17\_</p><p>No.\_ \_of\_ \_Attacks\_ \_1\_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_ \_Cha 17\_</p><p>\_</p><p>Damage/Attack:\_ 1d4\_ (bronze\_ dagger\_ or\_ light\_ \_crossbow)</p><p>Psionic\_ Summary:\_ PSPs\_ 31;\_ Wild\_ Talent-Aging\_ (PS 2;\_ cost: 15)\_</p><p>\_</p><p>Kelira Legar is a lovely young\_ woman\_ in\_ her\_ late\_ twenties.\_ While she\_ has\_ been\_ a\_ trader\_\_</p><p>for\_ several\_ years,\_ most\_ of\_ her career has\_ been\_ spent\_ as\_ an\_ administrator\_ in\_ House\_\_</p><p>Inika's main\_ chapterhouse\_ in\_ Gulg.\_ Her\_ career\_ there\_ was\_ \_fairly\_ \_set; she\_ was\_ likely\_ \_</p><p>to\_ \_remain\_ \_a\_ \_low-level\_ \_functionary\_ \_for\_ \_the\_ \_rest of her days. This seemed to suit\_</p><p>Kelira Legar\_ well,\_ as\_ her essentially gentle nature was ill-suited to the competitive character\_</p><p>of\_ a\_ \_potential\_ \_house\_ \_leader.\_ She\_ \_was\_ \_not\_ \_actually of\_ \_the\_ \_Inika\_ \_family,\_ \_so\_ \_</p><p>any\_ \_attempt\_ \_to\_ \_rise\_ high\_ \_within\_ the</p><p>house\_ would\_ \_be\_ difficult\_ \_at\_ best.</p><p>Thus it was very surprising four months ago when\_ she\_ requested a transfer to a desert\_ outpost.\_\_</p><p>She\_ explained\_ to Burette,\_ her\_ superior,\_ that\_ she\_ felt\_ the\_ move\_ would\_ broaden\_ her base\_</p><p>of experience and would later serve to increase her usefulness in Gulg. Burette\_ agreed\_ that\_ the\_\_</p><p>house\_ would always\_ benefit\_ from\_ administrators\_ with\_ field\_ \_experience, and arranged to have\_</p><p>Kelira sent to Fort Harbeth.\_ The request was\_ sudden\_ and\_ somewhat\_ out\_ of character for Kelira.\_</p><p>\_ Consequently,\_ \_her\_ \_superior\_ \_has\_ \_advised\_ \_Waltian\_ \_to keep\_ an\_ eye\_ on\_ \_her.</p><p>Rather than watch Kelira,\_ Waltian\_ has\_ simply\_ kept\_ her outside any of his business\_ dealings.\_\_</p><p>He\_ suspects\_ that\_ Kelira\_ may\_ be\_ a\_ spy\_ from\_ a\_ rival\_ in\_ \_Gulg\_ \_and\_ \_believes\_ \_that\_</p><p>until\_ she\_ exposes\_ herself,\_ \_he\_ will\_ not\_ give\_ her\_ the\_ opportunity\_ \_ to\_ jeopardize\_\_</p><p>Inika's\_ trade.\_ She\_ spends\_ \_her\_ \_days\_ \_visiting\_ \_with the caravans, but she has not been\_</p><p>permitted\_ to actually negotiate deals with them. She has become increasingly\_ self-\_ confident\_\_</p><p>and\_ outgoing\_ in\_ the\_ desert\_ \_outpost\_ \_and\_ \_most\_ \_cara-\_ van masters prefer her pleasant\_\_</p><p>company\_ to that\_ of the arrogant Waltian. Word is returning\_ to\_ Gulg\_ that\_ Kelira\_ is\_ showing\_\_</p><p>promise\_ and\_ may\_ \_have\_ \_potential\_ \_developing\_ \_busi-\_ ness\_ \_relationships\_ \_for\_ \_the\_ \_</p><p>house.</p><p>Whether she\_ has\_ the\_ talent\_ to\_ become\_ a\_ dealmaker\_ will\_ never become\_ evident\_ as long\_ as\_</p><p>she\_ works\_ for\_ Waltian. While the house makes an effort to groom talent, it is the responsibility\_</p><p>of an agent's superior to identify and promote promising\_ agents.\_ Burette\_ would\_ happily\_ \_take\_ \_</p><p>Kelira\_ \_back\_ \_in,\_ but\_ now\_ that\_ she\_ is\_ under\_ Waltian's\_ control,\_ it\_ is\_ unlikely\_ she\_\_</p><p>will\_ be\_ allowed\_ back\_ \_to\_ \_Gulg.\_ \_The\_ \_decision-makers\_ \_of\_ \_the house have business to\_</p><p>attend to, and\_ Kelira\_ will\_ soon\_ be\_ forgotten.\_ \_Her\_ \_career\_ \_has,\_ \_like\_ \_Waltian's,\_ \_\_</p><p>essentially\_ \_ \_stalled.</p><p>No one but Kelira herself knows that her request for transfer had nothing to do with advancing her\_</p><p>career. Recently, she discovered that she\_ was\_ a\_ psionic\_ wild\_ talent.\_ For years she had\_ hoped\_</p><p>\_to\_ manifest\_ the\_ power\_ of\_ the\_ mind,\_ but when it came, she was horrified-her ability\_ was\_\_</p><p>the\_ power of agzng. She fears that she has let some kind\_ of\_ demon out of her soul,\_ and\_ is\_\_</p><p>concerned\_ that\_ she\_ will\_ be\_ unable to resist the temptation of using the power on those around\_</p><p>her. In truth, Kelira rarely has a\_ harsh\_ word\_ to\_ say,\_ much less enough anger to cause her to\_</p><p>lash out with such a powerful psionic discipline. The power places such demands on her\_ weak\_\_</p><p>physique\_ that\_ it\_ is\_ unlikely\_ she\_ will ever\_ use\_ it,\_ but\_ this\_ does\_ not\_ reduce\_ her fear.</p><p>\_</p><p>Hurgen Vurst</p><p>Male\_ \_ \_Half-Giant\_ \_ \_Fighter/Psionicist,\_ \_ \_Lawful\_ \_ 7</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Armor Class -1 (braxat hide+Dex) Movement 15\_</p><p>Level\_ 9/9</p><p>Hit\_ Points\_ 115</p><p>THAC0 8 (6 with missiles)\_ No.\_ \_ of\_ \_Attacks\_ \_3/2</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Str 21</p><p>Dex\_ 17\_</p><p>Con\_ 17\_</p><p>Int 15 Wis l5 Cha\_ 13\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>\_</p><p>Damage/Attack: 1d10+7 (bronze two-handed sword); 1d6+9\_ (thrown\_ stones)</p><p>Psionic\_ Summary:\_ PSPs\_ \_102</p><p>Defense Modes-intellect fortress (PS 12; Cost: 4), mental barrier\_ (PS\_ 13,\_ Cost:\_ 3),\_ mind\_\_</p><p>blank\_ (PS\_ 8;\_ Cost:\_ 0),\_ thought</p><p>shield\_ (PS\_ 12;\_ Cost\_ 1),\_ tower\_ of\_ iron\_ will\_ (PS\_ 13;\_ Cost:\_ \_ 6)</p><p>Psychokinesis-Sciences:\_ project force\_ (PS\_ 15;\_ \_Cost: 10), telekinesis PS 12; Cost: 3+1/round+);\_</p><p>Devotions: animate object (PS 12,\_ Cost:\_ 8+3/round),\_ control\_ body (PS\_ 15;\_ Cost:\_ 8+8/round),\_\_</p><p>control\_ flames\_ (PS\_ 14;\_ Cost:\_</p><p>\_</p><p>\_</p><p>6+3/round), inertial\_ barrier\_ (PS\_ 14;\_ Cost: 7+5/round)</p><p>Psychometabolism- Devotions: biofeedback (PS\_ 15;\_ Cost: 6+3/round), body equilibrium (PS 14; Cost:\_</p><p>2+2/round),\_ \_lend\_ \_health\_ \_(PS\_ \_16;\_ \_Cost:\_ \_4)</p><p>Telepathy- Sciences: domination (PS 11; Cost: con- tact+varies), mindlink (PS 10; Cost:\_</p><p>contact+S/round), switch personality (PS 13; Cost: contact+30); Devotions: aversion (PS 11; Cost:\_</p><p>contact+S/turn), contact (PS 15; Cost: varies+1 /round), daydream (PS 15; Cost: con- tact+3/round),\_</p><p>life detection (PS 13; Cost: 3+3/round), mind\_ bar\_ (PS\_ 13;\_ Cost:\_ 6+4/round)</p><p>Hurgen Vurst is the half-giant garrison chief\_ for\_ Fort\_ Har-\_ beth. He is 11 feet tall, with\_</p><p>broad shoulders and enormous strength. He is basically lawful, and tends toward lawful neutral in\_</p><p>imitation\_ of\_ Waltian\_ Inika,\_ the\_ master\_ trader\_ in\_ the fortress. Hurgen is more clever\_ than\_\_</p><p>most\_ half-giants,\_ which makes him a particularly dangerous adversary. He is responsible\_ for\_ the\_</p><p>\_network\_ of\_ traps\_ that\_ defend\_ the\_ outer walls,\_ \_although\_ \_he\_ leaves\_ their\_ \_detailed\_ \_</p><p>design\_ \_to\_ those\_ \_with</p><p>more crafting skill.\_ He\_ is\_ as\_ respected\_ a\_ commander\_ as\_ can\_ be\_ \_found\_ in\_ \_House\_ Inika.</p><p>\_</p><p>\_</p><p>\_</p>"
