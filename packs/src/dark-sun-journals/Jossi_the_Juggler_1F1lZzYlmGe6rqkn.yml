    text:
      format: 1
      content: >-
        <p>Jossi is an elf street performer seen all over the Caravan District,
        demonstrating impressive juggling skills for coin. Her performance
        involves singing, selecting volunteers from the crowd to participate in
        her stunts, and othe  tricks designed to delight.</p>
