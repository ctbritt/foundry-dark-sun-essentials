        wgCeShTrqHJFBbDr:
          notes: >-
            <p>Jossi is actually a thief who supplements her income by serving
            as a messenger (and sometimes an assassin) for Tyr’s Eyes—a network
            of beggars, thieves, and other street people. She also works for
            various criminal elements in the city, including the Toothcutters
            gang in the Warrens. Jossi sizes up visitors to Tyr, making a note
            of the inn or tavern where they take lodging. She never knows when
            information about rich or unusual travelers from the desert might be
            worth something.</p>
    _id: 1woLOOw25J2eg2Si
