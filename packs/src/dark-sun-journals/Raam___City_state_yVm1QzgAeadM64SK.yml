      content: >-
        <p>The center of Raam is dominated by a rocky outcropping known as
        Queen’s Hill. On the highest point of this hill</p><p>sits the Ivory
        Palace; a spectacular display of the sorcerer-queen’s power and
        dominance. Surrounding The Ivory</p><p>Palace is the Templar District, a
        sprawling complex of administrative buildings, courts, records halls,
        and living</p><p>quarters for the Templar caste. Collectively, the Ivory
        Palace and the Templar District are referred to as The</p><p>Official
        Quarter. Encircling both the palace and the Templar District is an
        imposing wall, defensive breastworks,</p><p>and bristling ditches,
        access through which is tightly controlled by well-paid guards, trained
        Templars, magic and</p><p>psionics.</p><p>The Ivory Palace: The
        Sorcerer-Queen’s palace is the jeweled crown atop Queen’s Hill. A
        fabulous citadel</p><p>constructed of ivory and alabaster, and inlaid
        with silver tracery, it is a testimony to Abalach-Re’s excess.
        The</p><p>palace contains perhaps a hundred rooms or more, including
        great halls, ballrooms, kitchens, bedrooms,</p><p>treasure vaults, and
        more. While an impressive defensive fortress, the Ivory Palace is more a
        tower of exile and</p><p>isolation for Abalach-Re. Beneath the
        sorcerer-queen’s dwelling, extensive caverns house her prized armory -
        a</p><p>collection of weapons, armor and other battle
        equipment.</p><p>Market District: In a wide plaza on the east side of
        the city-state, where the Road of Kings meets the Draji</p><p>Road, the
        city market of Raam and the Trade Emporiums lie, with very little
        distinction between the two. Filled</p><p>with store-fronts, booths and
        tents displaying dozens and dozens of merchants’ and artisans’ goods,
        much of the</p><p>Market remains vibrant and bustling every
        day.</p><p>The Elven Market: This portion of Raam houses and provides
        the nomadic race of Elves a place to peddle what</p><p>goods and
        materials they can. The elven market, however, serves a more important
        role as a meeting place and</p><p>a skirmish ground between mansabdar
        (the feared corrupt public police force of Raam) factions.</p><p>The
        Psiumarkh: This establishment is the most prestigious of the psionic
        schools in Raam, and in all of the Tyr</p><p>Region. The school can
        trace its founding back to the founder of modern psionic principles,
        Tarandas, over 900</p><p>years ago. The Psiumarkh has always maintained
        strict neutrality in the struggles that afflict Raam, allowing
        them</p><p>not to anger any of the city’s powerful factions.</p><p>The
        Barracks: Located just outside the Official Quarter, close to the Ivory
        Palace, the Barracks are a multi-story</p><p>building used to quarter
        the elite warriors and officers of the Raamish army.</p><p>The Arena:
        Not unlike arenas in most other city-states, the arena is nothing
        extraordinary. There is the main</p><p>arena surrounded by seating and
        cages. And like other arena found throughout Athas, some gladiators
        and</p><p>contestants enter the pit of death and walk out to live
        another day, while others do not.</p>
