      content: "<p>A wide belt of dunes stretches hundreds of miles from\_Urik all the way south past Altaruk, paralleling the\_Ringing Mountains. Over the ages, sand washed from\_the mouths of mountain canyons has accumulated\_into a vast desert known as the Great Alluvial Sand\_Wastes. This region walls off Tyr and the foothills of\_the Ringing Mountains from the rest of the Tablelands\_(and the Tyr Region in general). Although the terrain\_is difficult to travel, it is not especially harsh, and tiny\_wells and oases lie scattered across its golden expanse.</p>\n<p>\_</p>\n<p>Slither, the Crawling Citadel</p>\n<p>A century ago, a\_mul defiler named Yarnath used a powerful ritual to\_create a crawling citadel of bone in the wastes south\_of Tyr. However, the ritual took an unexpected turn,\_and Yarnath drained his own life as well as those of\_the slaves he intended to sacrifice. He passed into\_undeath and became a powerful lich.\_Despite the unforeseen sacrifice, Yarnath’s ritual\_succeeded in animating the fortified palace of Slither\_to serve as his roving citadel. Slither is built from the\_gargantuan skeletons of seven mekillot driks bound\_together by beams of fused bone. Turrets and sharp\_spires of bone rise crookedly from the drik-shell structure, which slowly crawls across sand wastes,\_scrub plains, salt flats, and ridged foothills with\_equal facility.</p>\n<p>Yarnath leads a band of raiders who primarily\_target trade caravans on the way to Altaruk or the\_Silver Spring Oasis. The lich’s marauders hide their\_citadel a quarter-day’s journey from wherever they set\_their ambushes, so no one realizes the secret of their\_mobile encampment. The raiders bear snake-skull\_tattoos, and Yarnath has established a network of\_spies and agents from Ledopolus to Silver Spring.\_</p>\n<p>\_</p>\n<p>Vault of House Madar</p>\n<p>The merchant dynasty\_of House Madar fell to the machinations of House\_Tsalaxa a hundred years ago, but Tsalaxa’s victory was\_incomplete. The last Madars concealed a goodly part of\_their wealth in a hidden redoubt before Tsalaxa’s assassins slew all who knew the secret of its resting place.\_Supposedly, the vault is somewhere in the sandy\_wastes east of Tyr. Its entrance is said to resemble a\_natural, wind-carved portico set flush in the shadowed\_face of a canyon wall. Inside, a hidden entrance opens\_into a labyrinth of tunnels containing the treasury\_vault of House Madar. Undead (apparently consisting</p>\n<p>of buried Madar ancestors and servitors), constructs,\_traps, and wards guard the place. Despite the elaborate traps and real wealth stored here, the tomb could be\_false—a ploy meant to distract notice from the true and\_as yet undiscovered vault of House Madar.</p>"
