      content: >-
        <h2><strong>Slavery</strong></h2>

        <p class="p2">Slavery is everywhere. It’s not hidden—it’s the system.
        City-states run on it: mines, fields, construction, even entertainment.
        Born into chains, stolen into them, or punished with them—those are the
        options for most Athasians. Some slaves fight in arenas. Most die in the
        dust. “Freedom” is a cruel joke here.</p>

        <p class="p2">Note: Tyr outlawed slavery recently—but nobles, templars,
        and merchants are undermining that law at every turn. In practice, it’s
        chaos, and no one agrees on what counts as legal anymore.</p>

        <h2><strong>Tyr: City of Iron and Revolution</strong></h2>

        <p class="p2">Kalak, the tyrant-sorcerer, was slain about a decade ago.
        A gladiator-led rebellion gave power to a people’s council… briefly.
        Now, Tithian—a former templar—calls himself King. He claims to defend
        freedom, but he’s consolidating power fast. The city is torn: slaves
        demanding justice, nobles demanding restitution, and templars clinging
        to what’s left of their control.</p>

        <p class="p2">The iron mines make Tyr vital. Whoever controls them
        controls the region’s economy. All factions know this—and some are
        preparing for war over it.</p>

        <p class="p2">Rumor: Tithian’s throne is cursed—any ruler of Tyr who
        sits on it without Kalak’s blessing is doomed to die within a year.
        (Unconfirmed. Tithian still lives.)</p>

        <h2><strong>Templars</strong></h2>

        <p class="p2">Don’t mistake them for clerics. Templars draw magic from
        their kings—not from gods. Their power is political, arcane, and backed
        by fear. Most are petty tyrants: tax collectors, inquisitors, enforcers.
        Some still believe their king is divine.</p>

        <p class="p2">Each city’s templars differ:</p>

        <ul class="ul1">

        <li class="li2">Tyr’s templars are fractured—some loyal to Tithian, some
        to the idea of the Council.</li>

        <li class="li2">Urik’s templars are fanatics. Yellow-robed.
        Dangerous.</li>

        <li class="li2">Nibenay’s templars are his wives. All of them. And
        they’re trained sorcerers .</li>

        </ul>

        <p class="p2">If they suspect you’re an arcane caster, they’ll kill you.
        Or worse—use you.</p>

        <h2><strong>The Veiled Alliance</strong></h2>

        <p class="p2">They found me. Or maybe you found them.</p>

        <p class="p2">The Veiled Alliance is a secret network of
        preservers—arcane spellcasters who don’t defile the land. They hide
        their power behind disguises and illusions. Most people fear all
        wizards, so the Alliance has no choice but to operate underground.</p>

        <p class="p2">Their goals:</p>

        <ul class="ul1">

        <li class="li2">Stop the defiler kings.</li>

        <li class="li2">Protect arcane knowledge.</li>

        <li class="li2">Preserve what little life Athas has left.</li>

        </ul>

        <p class="p2">Some trust me. Most don’t. You can’t blame them. They
        hinted there are others like us who’ve come from beyond this world.
        That’s how you learned our arrival was no accident.</p>

        <p class="p2">Note: Some in the Alliance whisper that templars can smell
        arcane energy like hounds—trained to hunt defilers. You haven't seen
        proof… but you don’t doubt it.</p>

        <h2><strong>Geography &amp; Factions of the Tablelands</strong></h2>

        <p class="p2">Here’s what you know so far:</p>

        <ul class="ul1">

        <li class="li2">Tyr: The only “free” city. Turmoil. Slavery recently
        abolished. Center of rebellion and potential revolution.</li>

        <li class="li2">Urik: Tyr’s enemy. Militarized, ruled by Hamanu the
        “Lion King.” Still has templars, still has slaves, still has
        order—brutally.</li>

        <li class="li2">Nibenay: Controlled by a shadowy sorcerer-king and his
        templar-wives. Secretive and arcane.</li>

        <li class="li2">Gulg: Jungle city ruled by a priest-queen. Xenophobic.
        Brutal justice.</li>

        </ul>

        <p class="p2">The Road of Kings connects most of them, though it’s more
        of a caravan route than a proper road. Between cities: desert, raiders,
        elves, silt, and death.</p>

        <h2><strong>Magic</strong></h2>

        <p class="p2">Magic here is poison and miracle both.</p>

        <ul class="ul1">

        <li class="li2">Defilers burn the land to cast spells. Ash rings follow
        in their wake. Every city’s devastation is their legacy.</li>

        <li class="li2">Preservers draw magic more carefully—slowly, cleanly,
        and secretly.</li>

        <li class="li2">Clerics call on elements—earth, fire, water, wind.
        You’ve felt something, but the gods we knew aren’t here.</li>

        <li class="li2">Psionics (called the Way) are common. Everyone has some
        gift. That’s how people survive.</li>

        </ul>

        <p class="p2">One Veiled Alliance contact suggested that psionics and
        magic once came from the same source—split by some ancient sundering. If
        that’s true, perhaps they can be reunited. If not, it’s a dangerous
        thought.</p>

        <h2><strong>Final Notes</strong></h2>

        <ul class="ul1">

        <li class="li2">Water is precious. Waste nothing.</li>

        <li class="li2">Trust no templar.</li>

        <li class="li2">The Veiled Alliance believes this world can heal… if it
        doesn’t die first.</li>

        </ul>

        <p class="p2">Let’s not make things worse.</p>

        <p class="p3"><em>— Cadice Bernier, Paladin of What’s Left</em></p>
