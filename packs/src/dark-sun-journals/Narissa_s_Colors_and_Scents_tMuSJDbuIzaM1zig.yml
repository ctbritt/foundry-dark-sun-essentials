        wgCeShTrqHJFBbDr:
          notes: "<p><strong>Proprietor Details:</strong></p><ul class=\"[&:not(:last-child)_ul]:pb-1 [&:not(:last-child)_ol]:pb-1 list-disc space-y-1.5 pl-7\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0); font-style: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: auto; text-align: start; text-indent: 0px; text-transform: none; white-space: normal; widows: auto; word-spacing: 0px; -webkit-text-stroke-width: 0px; text-decoration: none;\"><li class=\"whitespace-normal break-words\"><strong>Narissa</strong><span class=\"Apple-converted-space\">\_</span>(Beautiful Half-Elf): Elegant and professionally discrete</li><li class=\"whitespace-normal break-words\"><strong>Noble Connections</strong>: Rumored illegitimate daughter of an important templar</li><li class=\"whitespace-normal break-words\"><strong>Absolute Discretion</strong>: Never reveals customer purchases or identities</li><li class=\"whitespace-normal break-words\"><strong>Selective Service</strong>: Poison sales limited to trusted, established clientele</li></ul><p class=\"whitespace-normal break-words\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0); font-style: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: auto; text-indent: 0px; text-transform: none; white-space: normal; widows: auto; word-spacing: 0px; -webkit-text-stroke-width: 0px; text-decoration: none; text-align: start\"><strong>Shop Atmosphere:</strong></p><ul class=\"[&:not(:last-child)_ul]:pb-1 [&:not(:last-child)_ol]:pb-1 list-disc space-y-1.5 pl-7\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0); font-style: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: auto; text-align: start; text-indent: 0px; text-transform: none; white-space: normal; widows: auto; word-spacing: 0px; -webkit-text-stroke-width: 0px; text-decoration: none;\"><li class=\"whitespace-normal break-words\"><strong>Refined Interior</strong>: Tastefully decorated with mirrors and display cases</li><li class=\"whitespace-normal break-words\"><strong>Pleasant Aromas</strong>: Subtle blend of perfumes and exotic scents</li><li class=\"whitespace-normal break-words\"><strong>Private Consultation</strong>: Discrete areas for sensitive transactions</li><li class=\"whitespace-normal break-words\"><strong>Upscale Clientele</strong>: Attracts nobles, courtesans, and wealthy merchants</li></ul><p class=\"whitespace-normal break-words\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0); font-style: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: auto; text-indent: 0px; text-transform: none; white-space: normal; widows: auto; word-spacing: 0px; -webkit-text-stroke-width: 0px; text-decoration: none; text-align: start\"><strong>Role in Adventures</strong>: Narissa's shop serves the dual purpose of legitimate cosmetics business and covert poison supplier. Her noble connections provide protection and access to high-society information. Characters seeking beauty supplies, theatrical disguises, or lethal substances can find both here—though earning access to her poison inventory requires significant trust-building. Her absolute discretion makes her valuable for sensitive purchases, and her templar parentage means she likely has access to political intelligence.</p>"
