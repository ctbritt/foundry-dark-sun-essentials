    text:
      format: 1
      content: "<p><em><strong>Narissa's Colors and Scents - Cosmetics &amp; Discrete Poisons\_</strong></em></p>\n<p><em><strong>Narissa, Proprietor</strong></em></p>\n<p>Goods include perfumes, body oils, face paints, colorful feathers, and (for favored customers) poisons. Narissa, a beautiful half-elf said to be the illegitimate daughter of an important templar, is the soul of discretion, no matter the purchase.</p>\n<p><strong>Services &amp; Inventory:</strong></p>\n<ul>\n<li>\n<p>Perfumes &amp; Fragrances: Exotic scents from across the Tablelands</p>\n</li>\n<li>\n<p>Body Oils: Moisturizing and aromatic preparations for Athas's harsh climate</p>\n</li>\n<li>\n<p>Face Paints: Cosmetic pigments and theatrical makeup</p>\n</li>\n<li>\n<p>Decorative Feathers: Colorful plumage for fashion and ceremonies</p>\n</li>\n</ul>"
