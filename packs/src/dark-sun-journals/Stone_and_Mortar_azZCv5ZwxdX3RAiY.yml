      content: "<div class=\"font-claude-message  relative  leading-[1.65rem]  [&amp;_pre&gt;div]:bg-bg-000/50  [&amp;_pre&gt;div]:border-0.5  [&amp;_pre&gt;div]:border-border-400  [&amp;_.ignore-pre-bg&gt;div]:bg-transparent  [&amp;&gt;div&gt;div&gt;:is(p,blockquote,h1,h2,h3,h4,h5,h6)]:pl-2  [&amp;&gt;div&gt;div&gt;:is(p,blockquote,ul,ol,h1,h2,h3,h4,h5,h6)]:pr-8\" style=\"caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:auto;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;-webkit-text-stroke-width:0px;text-decoration:none\"><div><div class=\"grid-cols-1 grid gap-2.5 [&amp;_&gt;_*]:min-w-0\"><p class=\"whitespace-normal break-words\">In this store, customers order stone in bulk or to custom specification from a quarry outside the walls of Tyr. Xalos, the mul owner, is often absent, sitting in on secret meetings with other powerful citizens.</p><p class=\"whitespace-normal break-words\"><strong>Services Offered:</strong></p><ul class=\"[&amp;:not(:last-child)_ul]:pb-1 [&amp;:not(:last-child)_ol]:pb-1 list-disc space-y-1.5 pl-7\"><li class=\"whitespace-normal break-words\"><strong>Bulk Stone Orders</strong>: Raw materials for construction projects</li><li class=\"whitespace-normal break-words\"><strong>Custom Specifications</strong>: Carved stonework to client requirements</li><li class=\"whitespace-normal break-words\"><strong>Quarry Connections</strong>: Direct access to Tyr's stone suppliers</li></ul><p class=\"whitespace-normal break-words\"><strong>Owner Details:</strong></p><ul class=\"[&amp;:not(:last-child)_ul]:pb-1 [&amp;:not(:last-child)_ol]:pb-1 list-disc space-y-1.5 pl-7\"><li class=\"whitespace-normal break-words\"><strong>Xalos</strong><span class=\"Apple-converted-space\">\_</span>(Mul Stonecutter): Council representative for the Artisan District</li><li class=\"whitespace-normal break-words\"><strong>Public Role</strong>: Speaks for masons and laborers in city government</li><li class=\"whitespace-normal break-words\"><strong>Secret Activity</strong>: Urik spy receiving payments for intelligence gathering</li><li class=\"whitespace-normal break-words\"><strong>Frequent Absences</strong>: Often away attending Council meetings or clandestine contacts</li></ul><p class=\"whitespace-normal break-words\"><strong>Role in Adventures</strong>: Xalos's Stone Yard provides a perfect cover for espionage activities. The shop's legitimate business gives Xalos access to construction projects throughout the city, while his Council position grants him political intelligence valuable to Urik. Party members might discover his treachery, attempt to turn him as a double agent, or use his Urik connections for their own purposes. His frequent absences also make the shop a potential meeting place for secretive activities.</p></div></div></div><div class=\"absolute bottom-0 right-2 pointer-events-none\" style=\"caret-color:rgb(0, 0, 0);color:rgb(0, 0, 0);font-style:normal;font-variant-caps:normal;font-weight:400;letter-spacing:normal;orphans:auto;text-align:start;text-indent:0px;text-transform:none;white-space:normal;widows:auto;word-spacing:0px;-webkit-text-stroke-width:0px;text-decoration:none;transform:none\"><div class=\"rounded-lg transition min-w-max pointer-events-auto translate-x-2 translate-y-full pt-2\"><div class=\"text-text-300 flex items-stretch justify-between\"><div><div class=\"relative\"><p></p></div></div><div class=\"flex items-center gap-0.5\"><p></p></div></div></div></div>"
