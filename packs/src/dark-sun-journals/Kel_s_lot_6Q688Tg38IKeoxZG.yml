      content: |-
        <p>Kel's Lot is the westernmost oasis village in the Glowing</p>
        <p>Desert. This Bandit State is unique as it's the only</p>
        <p>one that isn't simply a glorified slave tribe. In fact, with</p>
        <p>the exception of a few individuals, the members of this</p>
        <p>community have never known the bonds of slavery. Kel's</p>
        <p>Lot's members are all dwarves who settled this village</p>
        <p>decades ago. The village was already in place when the</p>
        <p>slave tribes started to move in, and it has a long history</p>
        <p>of using raiding as a means to survive.</p>
        <p>The ancient dwarf named Kel serves as the leader of</p>
        <p>this Bandit State. Of all the bandit lords, he most clearly</p>
        <p>understands Talid of Ravage's vision. Unfortunately, his</p>
        <p>prejudice against the mul (and all muls in general) causes</p>
        <p>him to dismiss it as beneath the notice of his tribe. To</p>
        <p>Kel and his followers, dwarves are the greatest of all races,</p>
        <p>worthy of ruling the entire world. Muls, however, have</p>
        <p>been rendered impure by their mixed heritages and are</p>
        <p>considered less than dwarves. The fact that Talid's tribe</p>
        <p>prospers above Kel's makes the dwarf bandit lord even</p>
        <p>more spiteful toward the mul.</p>
