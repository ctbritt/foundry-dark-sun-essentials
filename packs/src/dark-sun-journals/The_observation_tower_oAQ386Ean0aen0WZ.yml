      content: "<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">The Observation Tower</div>\n<h2 id=\"h.fgs3vaik8kvc_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#226e93;font-size:19pt;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none;white-space:pre-wrap\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">To gain admission to the Observation Tower or the Golden Tower, one must first petition for admittance. This bureaucratic paperwork limits which templars or imperial guests gain access to which particular ingress. A special department is staffed at the High Bureaus to process all requests. Having gained written permission for right of access, a templar travels to one of the Observation Tower entrances for a preliminary interview with the Senior Templar. Located outside the walls of the King's Garden, the Observation Tower appears as a smaller version of the Golden Tower. The most impressive feature is the 75- foot stone bridge that connects the Observation Tower to the Golden Tower. The Senior Templar maintains his offices here. Very important individuals on errands of imperial business are escorted from the High Bureaus to the Observation Tower.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">A pair of thick agafari doors reinforced with steel secure the entrance to the tower. The room is bare save for a single padded settee that dominates the center of the room.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">This first level serves as an waiting room for visitors wishing an audience. Two stairwells ascend on either side of the room. The staircase to the right ends on the third floor, while the left stairwell climbs to the fourth story.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">The meetings between the Senior Templar and members of his staff and visitors take place on the second floor of the Tower, which contains a large table and chairs, and boasts a long, semi-circular bookcase. The right-hand staircase continues its climb to the third level.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">The third level contains the Templars Library. Bookcases line the outer walls, and two curved bookcases stand at the center of the floor. The staircase continues to the fourth level of the tower.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">The fourth level is spartan, containing only a ladder leading to trap door to the roof. Three narrow windows look out upon the Golden City. A pair of doors, identical to those of the first level, open onto the causeway between the two towers.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration-line:inherit;color:#212121;font-size:11pt;font-family:Lato, sans-serif;line-height:1.6667;white-space:pre-wrap\">\_</p>"
