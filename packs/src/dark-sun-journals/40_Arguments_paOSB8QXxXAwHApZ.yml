      content: "<p><img src=\"data:image/png;base64,\" /></p>\n<p>\x93I am Hivash, a leader of my people in these vile pits. I speak</p>\n<p>for all true-blooded dwarves when I say that we are wasting</p>\n<p>time! How can we sleep another night knowing that the lash</p>\n<p>will be upon us in the morn? We must escape now before the</p>\n<p>night is gone! How many of us will be left tomorrow? Three?</p>\n<p>Four? And will those survivors also fret away their nights in</p>\n<p>futile talk? Tarra and Flandofar died today under the templars</p>\n<p>\x92 whips, and Cinar died yesterday of thirst. If we remain, we will all die, whether</p>\n<p>quick by the knife or slow by the whip and sun! Not me! I will escape tonight, and</p>\n<p>tomorrow I will have salve for my back, wine for my tongue, and bread for my belly. I</p>\n<p>will have freedom!\x92\x92</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>#2. Granj</p>\n<p>\x93Rash action will bring certain death! Look at this pit\x97</p>\n<p>fortified and guarded\x97it is designed to thwart a mindless</p>\n<p>rush for freedom! They think we are stupid and desperate</p>\n<p>beasts, and as long as we act that way, we haven\x92t a chance.</p>\n<p>No\x97we must use foresight and patience. We must marshal</p>\n<p>the warriors and psionicists among us, then use our talents to</p>\n<p>get out alive. If we rush the walls like stampeding erdlus, the</p>\n<p>guards will skewer us and roast us alive. But with patience and planning, we\x92ll each</p>\n<p>march from here with a templar\x92s head on a gythka.\x94</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>#3. Cavasaideen the Mul</p>\n<p>\x93Escape is hopeless. To what would we escape? Where can</p>\n<p>we run? The streets of Tyr hold only death for us, as too does</p>\n<p>the vast desert. Death lies behind every corner. But the certainty</p>\n<p>of death gives us true freedom\x97freedom from the future!</p>\n<p>If we must die, let us die in valor rather than squalor! Let</p>\n<p>us die rebels and martyrs, not slaves! Why should my blood</p>\n<p>mortar Kalak\x92s ziggurat? Let the blood of templars mortar</p>\n<p>my grave! I may die tomorrow, but I will hold in my hand the still-beating heart of</p>\n<p>Tithian, the high templar!\x94</p>\n<p><img src=\"data:image/png;base64,\" /></p>\n<p>#4. Niave of the Waste, a half-elf</p>\n<p>\x93You slaves are pathetic. What a bunch of dreaming, windblown</p>\n<p>refuse you are. You plan and wait - \x97talk of heroic</p>\n<p>deaths and mass escapes\x97 but you only want someone to hold</p>\n<p>your hand as you die! Give it up: let everyone find his own</p>\n<p>way out. One of us alone stands a better chance than a skittish</p>\n<p>rabble. I say we split up and each find our own escape.\x94</p>"
