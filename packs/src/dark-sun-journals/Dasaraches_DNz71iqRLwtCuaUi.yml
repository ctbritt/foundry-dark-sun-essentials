      content: >-
        <p>Within the sheltering bowl of the Dragon’s Crown is a rare sight on
        Athas: a small but lush woodland known as the Silent Forest. Its
        dangerous predators and poisonous plants keep most travelers away. At
        the center of the wood, on an island in the middle of a muddy lake, sits
        a ruined fortress called Dasaraches. This ancient palace is home to a
        menacing cabal of psionicists who call themselves the Order. Uninvited
        guests are likely to have their memories erased and find themselves
        under a compulsion to return home by the swiftest route.</p>
