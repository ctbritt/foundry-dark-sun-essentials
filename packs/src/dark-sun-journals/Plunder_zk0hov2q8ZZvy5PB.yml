      content: |-
        <p>Plunder is the second of two village oases in the</p>
        <p>Scorpion Plains. Its raiding tribe consists mainly of elves</p>
        <p>who have been cast out of their tribes for a variety of</p>
        <p>transgressions, though there are also the assorted collection</p>
        <p>of muls, humans, and a few humanoids. The tribe calls</p>
        <p>itself Evartu's Ghosts, because according to elven tradition</p>
        <p>those who are cast out from the elf community are dead.</p>
        <p>If their one-time families have set them adrift in the land</p>
        <p>of the dead, then the outcasts feel justified taking on the</p>
        <p>roles of ghostly avengers.</p>
        <p>Evartu leads the Ghosts of Plunder in terrifying, often</p>
        <p>violent, fashion. While the tribe attacks any travelers it</p>
        <p>comes across for spoils and sport, the Ghosts especially</p>
        <p>enjoy striking at the elf tribes of the Scorched Plateau.</p>
        <p>When they go on a raid, the Ghosts wear the trappings</p>
        <p>of the elven death myths – tattered clothing, burial paint,</p>
        <p>and weapons decorated with blood. This adds to their</p>
        <p>frightful image and often unnerves even the strongest elf</p>
        <p>warriors.</p>
        <p>When targets are particularly scarce, the raiders from</p>
        <p>Plunder don't hesitate to attack the dwarf fortress at</p>
        <p>the nearby oasis of Foul Puddle. While the mud-brick</p>
        <p>fortress is formidable, the dwarves usually “pay tribute” to</p>
        <p>the Evartu's raiders after a short, bloody battle. However,</p>
        <p>Evartu never sends all of his warriors away from Plunder</p>
        <p>at the same time, as he must guard against attacks by the</p>
        <p>raiders of the village of Pillage.</p>
