      content: "<p>“Road of Kings? Road of slaves, perhaps. The high and mighty sorcerer-kings squabble likejhakars worrying at a\_carcass, throwing away armies with all the care of spoiled\_children. Such are kings on Athas.”</p>\n<p>—Alon, House M’ke trader</p>\n<hr />\n<p>Far to the north, beyond the Great Alluvial Sand\_Wastes and crowning the punishing barrens of the\_Tablelands, stretches the Road of Kings, a war-torn,\_shattered land defined by the ambitious sorcererkings who vie for dominance in the\_ region. Three city-states dominate the Road of Kings, each straddling the ancient routes. Quarrelsome and greedy,\_they frequently war with one another, as scorched\_battlefields and countless bones testify in the haunted\_lands between\_ them.\_In the west, one finds mighty Urik, a proud and\_powerful city-state whose armies have no match\_among the Seven Cities. Traveling east, past the Dragon’s Bowl, one comes to the troubled city of Raam,\_beset by strife and famine.\_</p>\n<p>Beyond tragic Raam, far to the east, stands proud Draj. Blessed with abundant\_fields, Draj supplies food to other cities, transporting grains and hemp to far-flung markets while its\_bloodthirsty warriors scour the wilds for captives to\_\_sacrifice on their king’s altar. In the empty stretches\_between Urik, Raam, and Draj, caravan routes,\_herder trails, and ancient highways link the three\_city-states together.\_The region takes its name from the ancient Road\_of Kings, the\_ route stretching from Urik across the\_stony barrens to Raam and extending eastward to\_Draj and beyond. Although the Road of Kings is given\_to the same desolation as found elsewhere on Athas,\_the region is bustling and active, crowded\_ with caravans, travelers, and skirmishing armies.</p>\n<p>\_</p>\n<p>EXPLORING THE\_ROAD OF KINGS</p>\n<p>Much like the Tablelands or the Estuary of the\_Forked Tongue, the Road of Kings is dotted with\_tiny desert villages, mining camps, nomadic tribes,\_and trade outposts. Most such camps or posts are\_tent cities surrounded by crude walls\_ formed from\_stacked stone, bones, and brush. Others are built\_atop hidden wells. Dune traders wander the trails\_meandering through the barrens, swapping goods\_and rumors with the folk of the desert. Life in the\_\_arid wasteland is hard but\_ not impossible. Travelers\_in this region are rarely more than a few miles from\_shelter, water, and food. The only question is whether\_the desert denizens will bargain to share their\_resources or defend them from intruders.\_</p>\n<p>The Road of Kings is plagued by bandits, raiders, hungry savages such as ssurrans or gith, vicious marauders such as belgoi and braxats, and all sorts of desert predators. These creatures usually give the city-states a wide berth, but they pose a threat\_to travelers who go more than a few days’ journey\_from civilization.</p>"
