      content: >-
        <p>The construction of the brick Ziggurat of Kalak was a monumental
        effort that hurried hundreds of slaves to their deaths. Today, the
        Brickyards continue to produce bricks, although production has been
        diverted to the many civil projects that languished so long while the
        ziggurat was being built. The Brickyards no longer use slaves, instead
        paying laborers for a day's service. Ironically, many laborers are
        ex-slaves who once worked under the threat of the lash.</p><p>The site
        remains under the authority of the city (that is, King Tithian and the
        templars), but workers have begun demanding control. Almost daily,
        protests and demonstrations begin in the Brickyards and march through
        other districts. Each parade includes workers loudly chanting
        "Brickyards for the Brickers!" and similar slogans. So far, only minor
        scuffles have resulted from brushes with the Tyrian Guard.</p><p></p>
