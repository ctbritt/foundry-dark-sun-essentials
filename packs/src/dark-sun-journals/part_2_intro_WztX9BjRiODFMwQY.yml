      content: "<p>Into the Slave Pens</p>\n<p>\_</p>\n<p>After all the players arrive at the slave pens (through whatever means) describe to them the processing of new arrivals. If the PCs are captured in several groups, wait</p>\n<p>\_</p>\n<p>until all are captured before describing the processing procedure. Processing occurs with callous efficiency. Ever-present guards quell escape at tempts while slaves, with no regard to gender or species, are stripped of all clothes and items. As clothing is heaped onto bonfires, the supervising templar pockets items that interest him and distributes those that do not. Next a team of guards shave beards and heads to eliminate lice, and each slave receives a loincloth (or shift), a blanket, and a small waterskin. Once within the pits proper, a taskmaster assembles the slaves and assigns each to a work crew commanded by an overseer. Work crews perform one menial task, such as hauling water, mixing mud, forming bricks, hauling bricks, setting bricks, cutting wood supports, and so forth. Assign the PCs to the same crew or to two crews that work closely together (hauling water</p>\n<p>\_</p>\n<p>and mixing mud, for example). Daily life in the pens drags by with dreary brutality. Just before dawn, slaves line up to receive water rations: any slave who cannot get to the water station or whol arrives late must survive that day without water. The overseers gather their crews, beating and whipping any who are slow to assemble. Meanwhile, clean-up crews scour the pens, removing the bodies of dead slaves and applying savage punishment to stragglers. Slaves too weak to work are killed.</p>\n<p>\_</p>\n<p>The crews work until sundown, with only two short breaks during the day. Each. overseer drives his slaves hard to meet near-impossible quotas. If he fails, the over seer loses his rank and returns to the pens, where he can expect little love from his former crew. The overseers are, thus, merciless in their duties Any malingering is rewarded with the whip. Little passes unseen by the eyes of the guards, though they are mainly concerned</p>\n<p>\_</p>\n<p>with staying out of the sun and halting escape. Occasionally guards enter the pens to</p>\n<p>\_</p>\n<p>stop large fights or prevent riots, operating in groups of eight to ten: guards never</p>\n<p>\_</p>\n<p>leave their necks or weapons unprotected when in the company of slaves. Sometimes even able-bodied slaves must be killed: a man goes mad under the burning sun, a brute attacks an overseer or templar a laborer soils the ziggurat with his sweat or blood. On other occasions, though, a slave may attract the notice of the Master of the Games and be sent to the ladiator pits. Improved treatment little. compensates gladiators for their high mortality rate.</p>\n<p>\_</p>\n<p>At night, slaves return to the pits and overseers go to special quarters. The daily. meal-a worm-infested gruel-is served along with another ration of water. Those who do not reach the kitchen in time are not fed. After the meal, slaves sleep where they can. The strongest and their followers claim the few huts and shelters, all others sleep outside.</p>\n<p>Practical Information</p>\n<p>Food and Water. Even if characters receive their full allotment of food and water,</p>\n<p>they still suffer the loss of 1d4 Con points to dehydration per day. Characters can</p>\n<p>prevent this loss only by getting more water: hopefully they will be resourceful</p>\n<p>enough to do so without harm to others but, yes, PCs can gain water by depriving</p>\n<p>other slaves.</p>\n<p>Spells and Psionics. Unless they swallowed their spellbooks before being processed</p>\n<p>(and regurgitated them afterward), Preservers and Defilers will only know spells</p>\n<p>memorized at the time of capture. (Their spellbooks, though stripped from them,</p>\n<p>escaped notice during processing.) Due to the exhausting schedule in the pits, clerics</p>\n<p>and druids have only a 30% chance each day to gain the rest and time needed to</p>\n<p>pray for spells. Characters regain no Psionic Strength Points (PSPs) during hard</p>\n<p>labor, 3 PSPs per hour of light exertion, and 12 PSPs per each of the 4 hours</p>\n<p>allowed for sleep.</p>\n<p>Tools and Weapons. Weapons, obviously, are strictly outlawed to slaves. Ingenuity,</p>\n<p>bribery, and improvisation, however, can provide substitutes for weapons. Every</p>\n<p>character has material to make one weapon\x97a sap\x97by filling a piece of cloth with</p>\n<p>sand and stones. Stones, sticks, and rope can also be scavenged. With these materials,</p>\n<p>characters can make slings, garrotes, lassoes, bolas, wooden daggers, crude</p>\n<p>flails, and clubs. Stolen tools\x97mauls, wooden clubs, wooden pitchforks, and possibly</p>\n<p>even a small obsidian hand-axe\x97might be used in a pinch. Finally, a few slaves</p>\n<p>have sufficient contacts and influence to acquire \x93real\x94 weapons. These slaves usually</p>\n<p>head powerful and wide-spread gangs within the pens.</p>\n<p>Modifiers for Improvised Weapons</p>\n<p>Weapon THAC0 Roll</p>\n<p>Bola - 2</p>\n<p>Flail - 2</p>\n<p>M a u l 0</p>\n<p>S a p - 1</p>\n<p>Dagger (wood) - 3</p>\n<p>Damage</p>\n<p>1d6</p>\n<p>1d6</p>\n<p>1d6</p>\n<p>1d4</p>\n<p>1 d 4 - 2</p>\n<p>Though improvised weapons abound in the pens, possessing any weapon is officially</p>\n<p>a crime. Slaves carefully hide their weapons to prevent theft by a slave and</p>\n<p>discovery by a diligent guard.</p>\n<p>Bribery. Because of Kalak\x92s deadline, Tithian, High Templar of the King\x92s Works,</p>\n<p>has outlawed the lucrative practice of bribing one\x92s way to freedom. (Templars</p>\n<p>caught accepting bribes are stripped of office and imprisoned.) Even so, money and</p>\n<p>friends are critical commodities in the pens. Both can assure better treatment, an</p>\n<p>overseer title, weapons, food, water\x97even exemption from work. Freedom is perhaps</p>\n<p>the only thing that cannot be bought.</p>\n<p>To be effective, the slave must have resources outside the pens: because slaves are</p>\n<p>stripped of property upon entering the pits, only money and friends outside can</p>\n<p>bribe a templar or guard. A noble may want to ensure good treatment for a valued</p>\n<p>craftsman or a caravan master may make arrangements to keep his former mekillot</p>\n<p>drivers from harm\x97both do so in hopes that their slaves will be returned when Kalak</p>\n<p>\x92s task is done.</p>\n<p>Guards. During the work day, 2d4 guards watch every operation (but not as a single</p>\n<p>group). Templars also oversee with a 30% frequency. At night, the number of guards</p>\n<p>increases to 2d8, but no templars remain. For any disturbance in the pens, 1d8 + 7</p>\n<p>guards will appear.</p>\n<p>Statistics. Unless otherwise noted, all slaves, overseers, guards, and templars encountered</p>\n<p>use the general NPC statistics found in the Background Booklet.</p>\n<p>Crimes. Though the pits abound with petty prohibitions (e.g., against weapon ownership,</p>\n<p>laziness, and exhaustion), four serious offenses exist: murder of a templar,</p>\n<p>murder of a guard, murder of an overseer, and attempted escape. Killing a templar</p>\n<p>brings death by slow torture. Slaves who kill a guard are handed over to other guards</p>\n<p>for execution. A slave who kills an overseer is usually slain on the spot, though</p>\n<p>particularly strong killers may enter the arena (and those who slay inefficient overseers</p>\n<p>often replace them). Escape attempts bring deprivation of water and food,</p>\n<p>which hastens the loss of Con by an added 1d4 points per day.</p>\n<p>Escape. For the purposes of Freedom, you do not want the PCs to escape unless a</p>\n<p>specific encounter calls for escape. The players, on the other hand, will certainly try</p>\n<p>to escape. All their attempts should fail. Still the players must believe they had a fair</p>\n<p>chance to succeed. The following tactics let you program \x93fair\x94 failure for the PCs,</p>\n<p>both thwarting and rewarding their escape attempts.</p>\n<p>Informers. Unless the characters take wise precautions, their plans can be betrayed</p>\n<p>to the guards by an informer who is seeking better treatment. Thus, escape</p>\n<p>attempts might lead straight into a trap. As a reward for careful play, the PCs might</p>\n<p>catch the informer before the trap is sprung.</p>\n<p>Psionics. The PCs aren\x92t the only ones with psionics: templars and notable</p>\n<p>guards might detect psionic use or read thoughts. An escape attempt can be</p>\n<p>scrubbed by letting the PCs know their plans have been psionically detected.</p>\n<p>Psionic-capable characters may be rewarded by detecting these eavesdroppers if they</p>\n<p>think of it.</p>\n<p>Bad Luck. Even the best plans cannot control fate. A noise, a broken rope, an</p>\n<p>unexpected change in guards, and so forth can ruin a careful plan. The reward to</p>\n<p>this approach is that if characters make all their die rolls, they just might win freedom.</p>\n<p>If the characters do manage an escape, use an encounter from Part One to reel</p>\n<p>them in again. When they are returned to the pens, the Chief Overseer will remember</p>\n<p>the escapees and drive them mercilessly.</p>\n<p>DMing Part Two</p>\n<p>Part Two contains two different types of events: scenes and encounters. Scenes are</p>\n<p>short incidents that function independently of the adventure\x92s main action and that</p>\n<p>help to develop the alliances introduced in Part One (as well as some new animosities).</p>\n<p>Encounters are more complex incidents tied directly to the PCs\x92 overall goals</p>\n<p>for the adventure.</p>\n<p>Neither the scenes nor the encounters in Part Two occur in a set order. You select</p>\n<p>which events happen and when they occur. Each encounter in Part Two introduces a</p>\n<p>storyline that will involve specific NPCs and events throughout the rest of the adventure.</p>\n<p>You needn\x92t follow any one storyline: PCs naturally follow storylines that reflect</p>\n<p>their abilities and personalities. A Preserver would be ill-suited for gladiatorial combat,</p>\n<p>but could thrive in the Veiled Alliance. Thus, characters in one party may well</p>\n<p>follow separate storylines of Freedom. That\x92s fine. Typically the disparate goals of</p>\n<p>these PCs will be harmonious, but sometimes player characters may find themselves</p>\n<p>at odds with each other.</p>\n<p>To help you choose which encounters to use from Part Two, the storyline for each</p>\n<p>appears below. Some storylines work better for specific classes or races; such information</p>\n<p>appears in parentheses after the encounter title.</p>\n<p>Friend In Need. The friend in this case is a half-giant. Through the brute, the PC</p>\n<p>gains the attention first of a nobleman looking for muscle and eventually of Agis\x97</p>\n<p>leader of the rebellion. Thereafter the PC may become key to several diplomatically</p>\n<p>sensitive missions.</p>\n<p>Girl Trouble. (Gladiators) The PC aids a gladiator named Lissan, who introduces</p>\n<p>him to the arena and Neeva, a well-known and powerful gladiator (and rebel). Eventually,</p>\n<p>the PC helps rescue Neeva,</p>\n<p>Treachery. (Psionicist, Rogue) Through shady deeds, the PC achieves overseer status</p>\n<p>and thus draws the attention of Tithian\x97High Templar of the King\x92s Works and</p>\n<p>Games, templar, and rebel (and eventually king). From this association, the PC</p>\n<p>becomes involved in struggles among the still-powerful templars of Tyr.</p>\n<p>Plots. (Warrior) The PC aids plans for rebellion and thus becomes a minor leader in</p>\n<p>the revolution, coming under command of R\x92kus, leader of the slave faction. The</p>\n<p>PC helps keep the rebel army under control and deals with threats to the fledgling</p>\n<p>rebellion.</p>\n<p>Kindness of Strangers. (Preserver) The PC aids the Veiled Alliance by delivering</p>\n<p>messages. This office leads him to Sadira, a mystical figure in the rebellion; she</p>\n<p>entrusts to the PCs important tasks to further the cause of justice and freedom.</p>"
