      content: "<section><div><div><div><div><div><div><div><div><div><p>Caravan Way snakes into the Merchant District from the east. The main thoroughfare reaches its terminus in the shadow of the ziggurat at Iron Square, where the road divides to surround the center of trade. Assortments of loyal guards and laborers work in the warehouses that adjoin the emporiums. Each of the largest trading houses on Athas maintains emporiums, offices, and homes in the Merchant District. Grandiose trading parlors line Iron Square, each branded with the name and emblem of the controlling merchant house and staffed by junior members of the house. Between the prominent emporiums sit small traders that fill niche markets and handle cargo that the bigger merchants avoid due to too little profit or too much risk. Fierce rivalries and subtle intrigues are daily considerations of merchants in Tyr; most houses hire dependable caravan guards for their frequent cross-desert trade treks.Emporiums fronting Iron Square include the following.</p><p>House Vordon: Headquartered in Tyr, House Vordon is the region’s primary iron trader. Trade Goods: iron, weapons, artwork, textiles, and salves (outside Tyr). Emblem: a black diamond.</p><p>House Wavir: Based in Balic, this house has good relations with the reigning government of Tyr. Trade Goods: grain, ceramics, precious metals, hardwood, gems, and exotic animals. Emblem: a silver crodlu.</p><p>House Shom: Based in Nibenay, Shom suffers from decadence and corruption. Trade Goods: obsidian, water, wood, art, and weapons. Emblem: three white dragonflies.</p><p>House Tsalaxa: Based in Draj, House Tsalaxa is known for blackmail, espionage, and assassination. Trade Goods: rope, grain, and “recovered” stolen cargo. Emblem: two glaring, bestial eyes.</p><p>House Stel: Based in Urik, Stel is openly militaristic and hostile to lesser houses that it targets for acquisition. Trade Goods: slaves (outside Tyr), weapons, hardwood, feathers, and hostages for ransom. Emblem: crossed black scimitars.</p><p>House M’ke: Based in Raam, House M’ke fights to protect its trade routes and outposts from attacks and runs of “bad luck” orchestrated by Tsalaxa or Stel. Trade Goods: nuts, spices, and glassware. Emblem: a silver quill pen.</p><p>House Ianto: A small Tyrian house formerly engaged exclusively in the slave trade, Ianto is attempting to relaunch its business through speculative cargos. Trade Goods: none right now. Emblem: a green inix.</p></div></div></div></div></div></div></div></div></div></section><section><div><p>\_</p></div><div><div><div><div><div><div><div><div><div><p>Merchant District Personality</p><p>A ruthless, 30-year-old human trader, Haneth uses his position as House Tsalaxa’s representative in Tyr to amass as much personal wealth as possible. He is an expert at blackmail, double-dealing, and extortion. When residents of the Merchant District see Haneth on their doorstep, they know they are in for an unpleasant interaction. Ironically, it’s when Haneth hasn’t been seen for a while that people worry most—the house agent is adept at espionage and assassination.</p><p>The oddest characteristic about Haneth is a secret that he keeps at all costs, even from members of his own house: He has a natural ability to change his shape, which serves him well in his dirty dealings. Born (apparently) of human parents, Haneth doesn’t know where his ability comes from, but he guesses that it might be psionic in nature.</p></div></div></div></div></div></div></div></div></div></section>"
