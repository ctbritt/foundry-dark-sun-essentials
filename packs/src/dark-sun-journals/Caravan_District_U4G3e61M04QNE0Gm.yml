        src="https://rime-of-the-frostmaiden.s3.us-east-1.amazonaws.com/fcb/location-image-1757307755701.jpeg"
        alt="" width="50" /><p class="initial">The Caravan District is the
        primary trade and visitor's district in Tyr. Regular visitors and dune
        traders enter the city-state through the massive Caravan Gate. The area
        just inside the gate is a confusion of animal pens, transports, crates
        of exotic goods packed for travel, and traders screaming about their
        loads. The gate is usually watched by a Tyrian Guard detachment that
        questions newcomers and collects taxes from merchants (about 5 percent
        of the declared value of a wagon of trade goods). The Guard records the
        names of foreign visitors and their purpose in coming to the
        city.</p><p>Past the press of caravans and new arrivals near the gate,
        Caravan Way meanders west through the heart of the main trade district.
        By day, the road is dotted with clusters of pedestrians and street
        vendors hawking their wares. Permanent shops throng Caravan Way, selling
        myriad goods, including clothing, caravan supplies, feed for mounts,
        rations, spirits, collectibles, arms, and armor.</p>
