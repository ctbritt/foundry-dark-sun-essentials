      content: "<p>Far to the southeast of the Estuary of the Forked\_Tongue lies the Silt Archipelago, an unusual region\_of shallow silt and mudflats. Much of the sediment\_here is shallow enough to be crisscrossed by “giants’\_roads”—pathways where the tall creatures can wade.\_The islets of the archipelago are home to many of the\_same deadly creatures that haunt smaller mudflats\_and shallows throughout the Sea of Silt, as well as\_a number of tiny villages. Life on the islets is hard,\_but it is also free. The residents believe themselves\_beyond the reach of the sorcerer-kings, and they do\_not practice slavery. Raider tribes from the mainland\_and slavers from Balic attack the villages from time\_to time, but the archipelago’s human and dwarf warriors are fierce and determined, and if they cannot\_turn away an attack, several giant tribes in the area</p>\n<p>are willing to lend a hand.\_</p>\n<p>A few merchant houses based in Balic send caravans to the Silt Archipelago to trade for staple goods\_such as food, wood, hemp, and giant hair. In return,\_the traders obtain mekillot hide and bone, kank\_nectar, and manufactured goods of glass and worked\_stone that are beyond the villagers’ ability to make.</p>\n<p>\_</p>\n<p>\_</p>\n<p>The Silt Archipelago is an unusual region of</p>\n<p>shallow silt and mud flats nearly 180 miles long by</p>\n<p>100 miles wide. It is believed by some to be the last</p>\n<p>remnant of the fabled sea of water that once occupied</p>\n<p>the lands covered now by silt. Whether this is</p>\n<p>true, one of the largest sources of water left in the</p>\n<p>22</p>\n<p>region is obviously buried beneath a few feet of dust</p>\n<p>and mud.</p>\n<p>The silt surrounding the vast mud flats of this area</p>\n<p>is shallow, ranging from 4-30\x92. The mud flats are</p>\n<p>passable, but their central regions are too wet to allow</p>\n<p>the formation of crust. The mud in the center of</p>\n<p>the flats reaches 30\x92 deep, and characters who try to</p>\n<p>wade this will meet a bad end.</p>\n<p>The flora and fauna of the Silt Archipelago are</p>\n<p>the same as mud flats and shallow silt elsewhere.</p>\n<p>The mud flats are plagued by kluzd, carnivorous</p>\n<p>bats, and wyverns. The shallow silt is populated by</p>\n<p>silt horrors, floaters, and razorwings. The few solid</p>\n<p>isles of the region are populated by plains giants.</p>\n<p>The single most remarkable feature of the Silt</p>\n<p>Archipelago is the number of villages it supports.</p>\n<p>Humans, dwarves, and giants account for most of</p>\n<p>the people of the area. The folk of the different</p>\n<p>races tend to cooperate rather than fight in exploiting</p>\n<p>the resources of the Archipelago. Trade between</p>\n<p>the villages is not only common, it is a way of life for</p>\n<p>many hundreds of people.</p>\n<p>Life in the Silt Archipelago is hard, but it is also</p>\n<p>free. The people are beyond the reach of the</p>\n<p>sorcerer-kings and do not practice slavery. Occasionally</p>\n<p>raiding tribes from the Tyr region or slavers</p>\n<p>from Balic attempt an expedition to the Archipelago.</p>\n<p>But human and dwarf warriors fight a fierce</p>\n<p>campaign until enough giants can be mobilized to</p>\n<p>end any threat.</p>\n<p>Though the Archipelagans resist any raids or</p>\n<p>contact with the sorcerer-kings, they welcome traders</p>\n<p>with open arms. A few small houses of Balic</p>\n<p>sometimes send caravans to the Silt Archipelago to</p>\n<p>trade for food, wood, hemp, and giant hair. In return,</p>\n<p>they bring mekillot hide and bone, bank honey,</p>\n<p>and finished products beyond the islanders\x92</p>\n<p>ability to make. The Archipelagans are known to</p>\n<p>range far to the south and the east of the Tyr region,</p>\n<p>but none of the Seven Cities knows what places they</p>\n<p>may visit on the far shores of the Silt Sea.</p>\n<p>Humans of the Silt Archipelago are the most numerous</p>\n<p>of the races. They form farming villages,</p>\n<p>trade villages of silt skimmers, and hunting tribes.</p>\n<p>The tribes have domesticated pterrax and use them</p>\n<p>for mounts, flying far over the silt in search of prey.</p>\n<p>The human silt skimmer communities are gypsylike,</p>\n<p>roaming from place to place in their high wagons.</p>\n<p>Some have traveled as far as Balic and South</p>\n<p>Ledopolus. Tribes sometimes develop serious rivalries</p>\n<p>that occasionally break into feuding.</p>\n<p>Dwarves are usually traders. They have refined</p>\n<p>the building of silt skimmers into an art, and their</p>\n<p>vehicles are some of the largest and strongest found</p>\n<p>anywhere. When the Archipelago becomes impassable,</p>\n<p>the dwarves gather in extended clans of four to</p>\n<p>six skimmers, stake them to the ground, and settle</p>\n<p>down to perform repairs and raise crops.</p>\n<p>Giants here are some of the friendliest and most</p>\n<p>cooperative anywhere. They prefer to inhabit the</p>\n<p>larger plains islands and raise livestock, but many</p>\n<p>offer their services as silt waders and cargo haulers</p>\n<p>to the traders of the Archipelago. Frequent dealings</p>\n<p>with humans and dwarves have led them to view</p>\n<p>these races with special friendship, inasmuch as the</p>\n<p>little folk always seem so nice and polite.</p>\n<p>Large numbers of gith raiders inhabit the shores</p>\n<p>of this area, but they rarely cross the silt to pursue</p>\n<p>their raids. More dangerous are the hordes of silt</p>\n<p>runners who plague the region. Though no village</p>\n<p>has been attacked by the gith in living memory,</p>\n<p>these loathsome vermin may set upon lone silt skimmers</p>\n<p>and small bands of travelers.</p>\n<p>All the people of the Silt Archipelago hold clerics</p>\n<p>and druids in high esteem. Each village is led by a</p>\n<p>cleric-chieftain who is usually on good terms with</p>\n<p>the nearby druids. Mages of any kind are taken as</p>\n<p>defilers and driven away as quickly as possible.</p>\n<p>Human pterrax-rider (1-6): AL varies; AC 7</p>\n<p>(studded leather armor); MV 12, mounted Fl 12</p>\n<p>(C); 2nd to 5th level warrior (d4+1); THAC0 varies;</p>\n<p>#AT varies; Dmg by weapon; ML 13. Usually</p>\n<p>armed with short bows, spears, nets, and poisoned</p>\n<p>arrows.</p>\n<p>23</p>\n<p>2 4</p>\n<p>Pterrax: AL N; AC 7; MV 12, Fl 12 (B); HD 5;</p>\n<p>THAC0 15; #AT 3; Dmg 1d8/1d8/2d6; SA psionics;</p>\n<p>ML 10. MC drops to C when ridden.</p>\n<p>Dwarven traders (5-20): AL varies; AC 6 (hide</p>\n<p>armor); MV 6; HD 1; THAC0 13; #AT 1; Dmg</p>\n<p>by weapon +2; SD +4 on saves vs. magic, poison;</p>\n<p>ML 13. Encountered with silt skimmer.</p>\n<p>Plains giants (1-6): AL CC; AC 5; MV 15; HD</p>\n<p>16; THAC0 5; #AT 1; Dmg 2d8+14; SA hurl</p>\n<p>rocks for 2-20; SD immune to psionics; ML 15.\_</p>\n<p>Silt runners (5-30): AL CE; AC 7; MV 48; HD</p>\n<p>2; THAC0 19; #AT 3; Dmg 1d3/1d3/1d6; SA</p>\n<p>psionics; ML 9.</p>"
