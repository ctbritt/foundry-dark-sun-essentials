      content: >-
        <h2><strong>Encounter: The Crisis at Redemption
        Camp</strong></h2><p><strong>Encounter Level:</strong> 16 (15,000
        XP)</p><p>As the party approaches Tyr, they come upon a scene of
        immediate crisis that will establish their reputation and political
        standing in the Free
        City.</p><h3><strong>Setup</strong></h3><h3><strong>The
        Battlefield</strong></h3><p>The camp spans a 200-foot by 300-foot area
        with several key features:</p><p><strong>Central Plaza:</strong> Where
        most civilians are gathered, defended by Jorik and half the fighters
        <strong>Supply Depot:</strong> Contains food and weapons, threatened by
        earth elementals <strong>Escape Routes:</strong> Three paths leading
        toward Tyr, blocked by templar enforcers <strong>High Ground:</strong>
        Ruined garden walls provide tactical advantage <strong>Shelter
        Areas:</strong> Tents and lean-tos where non-combatants
        hide</p><h3><strong>Tactical Situation</strong></h3><p><strong>Templar
        Strategy:</strong></p><ul><li>High Templar Malachar uses
        <em>earthquake</em> and <em>fire storm</em> to break organized
        resistance</li><li>Enforcers cast <em>hold person</em> to disable
        leaders</li><li>Earth elementals collapse shelters and block escape
        routes</li><li>Iron construct intimidates civilians into
        surrender</li></ul><p><strong>Refugee
        Strategy:</strong></p><ul><li>Jorik rallies defenders around key
        positions</li><li>Fighters use guerrilla tactics and knowledge of
        terrain</li><li>Civilians evacuate toward Tyr while fighters buy
        time</li><li>Hope for outside intervention (enter the
        party)</li></ul><h3><strong>Dynamic
        Elements</strong></h3><p><strong>Round 1:</strong> Earth elementals
        cause tent collapse, threatening 20 civilians <strong>Round 3:</strong>
        Malachar casts <em>earthquake</em>, creating difficult terrain and
        threatening shelters <strong>Round 5:</strong> Iron construct breaches
        the supply depot <strong>Round 7:</strong> Templar reinforcements arrive
        if combat continues</p><h3><strong>Resolution
        Options</strong></h3><h4><strong>Direct Intervention</strong></h4><p>The
        party can enter combat immediately, shifting the balance
        decisively:</p><ul><li><strong>Success:</strong> Templars withdraw,
        refugees saved, +2 reputation with Freed
        Slaves</li><li><strong>Failure:</strong> Massacre occurs, -2 reputation
        with all factions except Templars</li></ul><h4><strong>Diplomatic
        Intervention</strong></h4><p><strong>Skill Challenge:</strong> 4
        successes before 3 failures</p><p><strong>Possible
        Approaches:</strong></p><ul><li><strong>Intimidation (DC 18):</strong>
        Display power to force templar withdrawal</li><li><strong>Persuasion (DC
        20):</strong> Negotiate temporary truce or refugee
        relocation</li><li><strong>Deception (DC 22):</strong> Claim authority
        from King Tithian</li><li><strong>Religion/History (DC 16):</strong>
        Cite legal precedents about refugee
        rights</li></ul><h4><strong>Strategic
        Intervention</strong></h4><ul><li>Disable the earth elementals with
        targeted spells</li><li>Create magical barriers to protect
        civilians</li><li>Use illusion magic to confuse
        attackers</li><li>Teleport key civilians to
        safety</li></ul><h3><strong>Consequences and
        Information</strong></h3><h4><strong>If Refugees Are
        Saved:</strong></h4><p><strong>Jorik's
        Gratitude:</strong></p><blockquote><p><em>"You've given us more than our
        lives—you've given us hope. The Free City has powerful friends, it
        seems. Know that every freed slave in Tyr will hear of this
        deed."</em></p></blockquote><p><strong>Intelligence
        Gained:</strong></p><ul><li>"King Tithian's policies change with the
        wind—yesterday he supported refugee camps, today he orders
        raids"</li><li>"High Templar Malachar answers directly to the
        throne—this wasn't local initiative"</li><li>"Strange things happening
        in the Golden Tower—meetings at all hours, cold air in the
        desert"</li><li>"Rumor says Councilor Agis questioned the King's
        judgment—now he's vanished"</li></ul><p><strong>Resources
        Offered:</strong></p><ul><li>Safe passage and introduction to camp
        contacts in Tyr</li><li>Information about safe houses and allied
        merchants</li><li>Warning about templar checkpoints and patrol
        schedules</li></ul><h4><strong>If Templars
        Succeed:</strong></h4><p><strong>Political
        Ramifications:</strong></p><ul><li>Word spreads that even powerful
        outsiders won't challenge Tithian's authority</li><li>Refugee population
        becomes more desperate and radical</li><li>Noble houses interpret this
        as green light for harsher measures</li></ul><p><strong>Future
        Complications:</strong></p><ul><li>Increased templar presence throughout
        the region</li><li>Underground resistance networks become more
        secretive</li><li>Higher difficulty for social encounters with oppressed
        groups</li></ul>
