      content: "<section id=\"h.6f57064c2432ee82_35\" class=\"yaqOZd\" style=\"display:table;box-sizing:border-box;background-size:cover;position:relative;table-layout:fixed;width:1661px;padding-bottom:1.5rem;padding-top:1.5rem;font-family:sans-serif;font-size:16px\">\n<div class=\"mYVXT\" style=\"box-sizing:border-box;display:table-cell;vertical-align:middle;width:1661px\">\n<div class=\"LS81yb VICjCf\" style=\"box-sizing:border-box;width:1280px;margin:0px auto;max-width:1280px;padding-left:48px;padding-right:48px;outline:0px\" tabindex=\"-1\">\n<div class=\"hJDwNd-AhqUyc-uQSCkd purZT-AhqUyc-II5mzb pSzOP-AhqUyc-qWD73c JNdkSc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1184px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\n<div class=\"oKdM2c Kzv0Me\" style=\"box-sizing:border-box;width:1154.41px;margin-top:0px;margin-bottom:0px;max-width:1280px\">\n<div id=\"h.6f57064c2432ee82_32\" class=\"hJDwNd-AhqUyc-uQSCkd jXK9ad D2fZ2 OjCsFc wHaque GNzUNc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1154.41px;white-space:pre-wrap;overflow-wrap:break-word\">\n<div class=\"jXK9ad-SmKAyb\" style=\"box-sizing:border-box;width:1154.41px\">\n<div class=\"tyJCtd mGzaTb baZpAe\" style=\"box-sizing:border-box;position:relative;width:1154.41px;padding:8px\">\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px;padding-left:0px\">“Is it true? Kalak dead? Slaves freed? Magic wild in the streets? Doubtful, but we’ll know soon enough.”</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">— Shahin, wandering hermit</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">\_</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">As far as most Athasians are concerned, Tyr has always existed. Certainly it has endured through the entire Desert Age, and even with the fall of its sorcerer-king, it seems likely to endure for centuries to come. And throughout all the long years of its existence, it was a city-state enslaved. That has all changed.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">In the courts of the other city-states, rumors of King Kalak’s overthrow are only whispered, but in Tyr, the repercussions howl through the streets. Many scheme to succeed Kalak, and the templars and other power groups vying for control struggle to keep the city-state from disintegrating into anarchy at the hands of people eager to enjoy their freedom. Nobles and merchants clamor for influence, and commoners and freed slaves openly celebrate, challenging civic authority and social boundaries at every turn.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">Tyr is a flashpoint of intrigue and change on Athas. Its Golden Tower and sealed Ziggurat are unique wonders that awe most visitors.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Population</span></span>: Roughly 15,000 within the city walls, and about as many in the noble estates and villages of the Tyr Valley. Humans are the majority, constituting two-thirds of the population. Dwarves, elves, goliaths, and muls make up most of the rest.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Water</span></span>: Seventeen public wells reach down below Tyr to tap one of the deepest, oldest aquifers on Athas, fed by runoff from the nearby Ringing Mountains. A Tyrian Guard detachment protects each well. Tithian (under pressure from others) has declared that each citizen is entitled to one hand-carried container of water per day. Those who try to get around this law risk being exiled. The city-state also has many private wells, such as in the King’s Gardens and in the Templar District.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Supplies</span></span>: A wide variety of basic supplies is available in the Caravan and Merchant Districts, as well as in the Elven Market in the Warrens. Most days, a ragtag bazaar springs up near the Stadium of Tyr.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Defense</span></span>: Most of Tyr’s army disbanded after Kalak fell, but the templars are currently rebuilding it as the Tyrian Guard. An uneasy mix of soldiers who formerly served Kalak, noble house contingents, revolutionary fighters, and freed gladiators and slaves, the Guard forms a standing army of about five thousand warriors of varying quality. The marshal is a mul ex-mercenary named Zalcor. In addition to the Guard, many noble and merchant houses keep large contingents of private soldiers on hand.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Inns and Taverns</span></span>: The Caravan District and the Merchant District have more than thirty inns and an equal number of taverns between them. The Warrens offers more squalid spaces, including abandoned buildings that host squatters.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">\_</p>\n<div id=\"h.qn18mfakc317\" class=\"CobnVe aP9Z7e\" style=\"box-sizing:border-box;margin-bottom:0px\"></div>\n<div class=\"CjVfdc\" style=\"box-sizing:border-box;display:inline-block;max-width:100%;pointer-events:all;position:relative\">\n<div class=\"PPhIP rviiZ\" style=\"box-sizing:border-box;font-size:0px;height:35.4531px;line-height:1;pointer-events:none;position:absolute;z-index:10;right:-37px;padding-left:9px\">\n<div class=\"U26fgb mUbCce fKz7Od LRAOtb Znu9nd M9Bg4d\" style=\"box-sizing:border-box;user-select:none;transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1) 0s;border:0px;border-radius:50%;cursor:pointer;display:inline-block;flex-shrink:0;height:28px;outline:none;overflow:hidden;position:relative;text-align:center;-webkit-tap-highlight-color:transparent;width:28px;z-index:0;color:rgba(0, 0, 0, 0.54);fill:rgba(0, 0, 0, 0.54);opacity:0;top:17.7188px;vertical-align:middle;transform:translateY(-50%)\" aria-describedby=\"h.qn18mfakc317_l\" aria-label=\"Kopiér overskriftslink\" aria-disabled=\"false\" data-tooltip=\"Kopiér overskriftslink\" aria-hidden=\"true\" data-tooltip-position=\"top\" data-tooltip-vertical-offset=\"12\" data-tooltip-horizontal-offset=\"0\">\n<div class=\"VTBa7b MbhUzd\" style=\"box-sizing:border-box;transform:translate(-50%, -50%) scale(0);transition:opacity 0.2s ease 0s, visibility 0s ease 0.2s, -webkit-transform 0s ease 0.2s;background-size:cover;left:0px;opacity:0;pointer-events:none;position:absolute;top:0px;visibility:hidden;background-image:radial-gradient(circle farthest-side, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12) 80%, rgba(0, 0, 0, 0) 100%)\">\_</div>\n</div>\n</div>\nTyrian backgrounds</div>\n<h2 id=\"h.qn18mfakc317_l\" class=\"CDt4Ke zfr3Q JYVBee\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:20px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#226e93;font-size:19pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.4;pointer-events:none\" tabindex=\"-1\"></h2>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">The sudden end of King Kalak’s oppressive reign has left Tyr and its citizens in a state of confusion and chaos. Tyrian characters are surrounded by new opportunities—and new perils.</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">Associated Skills: <span style=\"box-sizing:border-box\"><s style=\"box-sizing:border-box\">Endurance, Streetwise</s></span></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">Language: Elven</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Embedded Spy</span></span>: Tyr’s newfound freedom has caused no shortage of consternation among the Seven Cities. The other sorcerer-kings have dispatched agents to gather intelligence about the liberated citystate and create conflict where possible. You are one such spy. Were you born in Tyr, or are you from another city-state? To whom do you report? How do you view the rebellion?</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Freed Slave</span></span>: Following Kalak’s death, King Tithian outlawed slavery in Tyr. You were one of thousands set free. Do you think your liberty will last? Who owned you? How do you feel about your former master?</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Noble of Conscience</span></span>: You have enjoyed comfort and privilege throughout your life, but you know that your wealth was earned through the efforts of people who didn’t have enough. You want to help the oppressed, but should you keep your title and become a protector of the weak, or should you fight to erode the power and influence of your noble peers?</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\"><span style=\"box-sizing:border-box;font-family:Lato\"><span style=\"font-weight:bold;-webkit-font-smoothing:antialiased;box-sizing:border-box\">Revolutionary</span></span>: You worked to overthrow Kalak in the final months of his reign. Whether you spied on his nobles, preached rebellion to slaves in the brickyards, or carried messages for rebel leaders, you played a part in the king’s downfall. What will you do now that you have succeeded? What secrets did you learn? Do you have contacts among the groups vying for power in the city-state?</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-left:0px\">\_</p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px\">\_</p>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<section id=\"h.3ecd82f9be0efde6_8\" class=\"yaqOZd\" style=\"display:table;box-sizing:border-box;background-size:cover;position:relative;table-layout:fixed;width:1661px;padding-bottom:1.5rem;padding-top:1.5rem;font-family:sans-serif;font-size:16px\">\n<div class=\"IFuOkc\" style=\"box-sizing:border-box;background-size:cover;display:table-cell;table-layout:fixed;height:483px;left:0px;pointer-events:none;position:absolute;top:0px;width:1661px\">\_</div>\n<div class=\"mYVXT\" style=\"box-sizing:border-box;display:table-cell;vertical-align:middle;width:1661px\">\n<div class=\"LS81yb VICjCf\" style=\"box-sizing:border-box;width:1280px;margin:0px auto;max-width:1280px;padding-left:48px;padding-right:48px;outline:0px\" tabindex=\"-1\">\n<div class=\"hJDwNd-AhqUyc-II5mzb JNdkSc L6cTce-purZT L6cTce-pSzOP\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:394.656px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\_</div>\n</div>\n</div>\n<div class=\"hJDwNd-AhqUyc-II5mzb purZT-AhqUyc-II5mzb pSzOP-AhqUyc-II5mzb JNdkSc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:394.656px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\n<div class=\"oKdM2c Kzv0Me\" style=\"box-sizing:border-box;width:365.062px;margin-top:0px;margin-bottom:0px;max-width:1280px\">\n<div id=\"h.3ecd82f9be0efde6_11\" class=\"hJDwNd-AhqUyc-II5mzb pSzOP-AhqUyc-II5mzb jXK9ad D2fZ2 OjCsFc wHaque\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:365.062px\">\n<div class=\"jXK9ad-SmKAyb\" style=\"box-sizing:border-box;width:365.062px\">\n<div class=\"tyJCtd baZpAe\" style=\"box-sizing:border-box;position:relative;width:365.062px\">\n<div class=\"t3iYD\" style=\"box-sizing:border-box;overflow:hidden\"><img class=\"CENy8b\" style=\"border:0px;display:block;width:365.062px;margin:0px\" src=\"https://lh4.googleusercontent.com/88CUy_8vF_eiXPj-abTcPkoL7IuamLxu42T6LiD7Jg3wNB_Q1PwTsc_hCsj7ZPUk6hfCq_Rdi6_tJq7nOpfkrPU6PNHhfYl0G2QQsmzOsgTdIRVrCn6cXFzDhgOQkbWOOA=w1280\" /></div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n<div class=\"hJDwNd-AhqUyc-II5mzb JNdkSc L6cTce-purZT L6cTce-pSzOP\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:394.656px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\_</div>\n</div>\n</div>\n</div>\n</div>\n</section>\n<section id=\"h.3ecd82f9be0efde6_7\" class=\"yaqOZd qeLZfd\" style=\"display:table;box-sizing:border-box;background-size:cover;position:relative;table-layout:fixed;width:1661px;padding-bottom:1.5rem;padding-top:1.5rem;font-family:sans-serif;font-size:16px\">\n<div class=\"IFuOkc\" style=\"box-sizing:border-box;background-size:cover;display:table-cell;table-layout:fixed;height:770.875px;left:0px;pointer-events:none;position:absolute;top:0px;width:1661px\">\_</div>\n<div class=\"mYVXT\" style=\"box-sizing:border-box;display:table-cell;vertical-align:middle;width:1661px\">\n<div class=\"LS81yb VICjCf\" style=\"box-sizing:border-box;width:1280px;margin:0px auto;max-width:1280px;padding-left:48px;padding-right:48px;outline:0px\" tabindex=\"-1\">\n<div class=\"hJDwNd-AhqUyc-uQSCkd purZT-AhqUyc-II5mzb pSzOP-AhqUyc-qWD73c JNdkSc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1184px\">\n<div class=\"JNdkSc-SmKAyb\" style=\"box-sizing:border-box;padding-left:14.7969px;padding-right:14.7969px\">\n<div style=\"box-sizing:border-box\">\n<div class=\"oKdM2c Kzv0Me\" style=\"box-sizing:border-box;width:1154.41px;margin-top:0px;margin-bottom:0px;max-width:1280px\">\n<div id=\"h.3ecd82f9be0efde6_4\" class=\"hJDwNd-AhqUyc-uQSCkd jXK9ad D2fZ2 OjCsFc wHaque GNzUNc\" style=\"box-sizing:border-box;display:inline-block;padding-left:0px;padding-right:0px;position:relative;vertical-align:top;width:1154.41px;white-space:pre-wrap;overflow-wrap:break-word\">\n<div class=\"jXK9ad-SmKAyb\" style=\"box-sizing:border-box;width:1154.41px\">\n<div class=\"tyJCtd mGzaTb baZpAe\" style=\"box-sizing:border-box;position:relative;width:1154.41px;padding:8px\">\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:0px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-top:0px\"><em style=\"box-sizing:border-box\">After a score of days beneath the burning sun, the sight of the great walled city meant trading the stench of beasts for that of beggars. My tongue rasped over my cracked, dry lips in anticipation of the Tyrian ale I'd soon be drinking. </em></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><em style=\"box-sizing:border-box\">The stories heard slaves freed, Kalak dead, and magic wild in the streets. The truth would soon be known. Such information would fetch a high price with the templars of Nibenay, perhaps an audience with the Most High Concubine of the Palace might even be in order! This was my first trip to Tyr, and I planned to drink my fill of the city.</em></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><em style=\"box-sizing:border-box\">Some things never change though, like the black heart of a templar. The scrawny vulture at the gate ran his jaundiced eye over our cargo, sizing up the bribe he could extort from \"honest\" traders. I played the game, passed him some ceramics, and entered the city. A vagrant breeze swirled the dust as we emerged from the caravan gate and, when I'd wiped my eyes, a colorfully dressed, wrinkled man stood before me. \"You paid too much,\" he declared. \"What? Who are you? What business do you have with me?\" I asked. I let my hand drop to the hilt of my scimitar to punctuate my point.</em></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><em style=\"box-sizing:border-box\">\"I? I am Ojoba, a draqoman. You are new here, that is obvious. You have business to do and assisting with your business is my business. Many are Tyr's wonders, and many are its hazards. I can help you.\" He seemed to expect me to say something. I didn't.</em></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><em style=\"box-sizing:border-box\">\"You will want a place to stay, yes? A place for your mounts? You have no friends here? I am not your friend, but I can help you. I know this city. I know its markets, its inns, its streets. I speak several tongues and know local customs and laws. You want a good price for your cargo. Maybe you have some trade goods that require special handling, away from the prying eyes of the templars, yes? I can help you. You will profit, to be sure. As for my services, I ask only five ceramics for every gold you make. Consider my offer. You'll find none better.\"</em></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><em style=\"box-sizing:border-box\">\"Five for every gold! You mistake me for a nobleman or a lunatic! I have dealt with your kind before. Even the arrogant bloodsuckers of Nibenay ask no more than one silver a day and a ceramic for every gold and hope to bargain for one or the other. I'll give you five ceramics for the day, what remains of it, and no more.\" </em></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><em style=\"box-sizing:border-box\">\"Spoken like a true trader,\" he said, inclining his head slightly. \"Obviously you are neither nobility nor a mad man, but surely you would not value an associate who would meekly accept a traders first offer. The sun already begins its descent, so let us not tarry. A silver for the day and three ceramics for every gold each day after this. Include a drink of water and a morsel to eat, and I am at your service.\"</em></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><em style=\"box-sizing:border-box\">\"A silver and two ceramics per gold, and you feed yourself, draqoman Ojoba. Your first job is to guide us to the market where we might sell our goods. Then you can show me which winehouse boasts the comeliest serving wenches. Have we a deal?\"</em></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><em style=\"box-sizing:border-box\">\"Indeed we do. First things first, now we go to the stadium\". </em></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667\"><em style=\"box-sizing:border-box\">\"I have business to do, you ugly renk! Are you deaf?\" </em></p>\n<p class=\"CDt4Ke zfr3Q\" dir=\"ltr\" style=\"box-sizing:border-box;font-variant-ligatures:none;margin-top:12px;margin-bottom:0px;outline:none;position:relative;text-decoration:inherit;color:#212121;font-size:11pt;font-style:inherit;font-family:Lato, sans-serif;line-height:1.6667;padding-bottom:0px\"><em style=\"box-sizing:border-box\">\"Yes, yes, business, but the stadium serves as the market in Tyr, except on festival days. It is there that you'll get the best price. Later to Shadow Square, where your thirst for wine shall soon be sated. You see, you do profit by me already, though not a coin has passed between us.\"</em></p>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</div>\n</section>"
