  - type: text
    name: Darra
    _id: K4Z88xqTLNljkneD
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<h2>Darraspace</h2>\n<blockquote>\n<p>As your ship glides through the phlogiston and approaches the shimmering boundary of the Darraspace crystal sphere, the swirling colors of the Flow give way to an expanse of deep, endless black. Crossing the threshold feels like passing through a veil of cool mist, and a moment later, you find yourselves within the enigmatic realm of Darraspace.</p>\n<p>Before you, the vastness of Wildspace stretches out in all directions. Unlike the familiar voids between stars, this sphere is eerily devoid of a central sun, casting the entire expanse into a twilight gloom. Far in the distance, you can just make out the faint, ominous glow of Infernia, the fire world, a baleful red ember against the dark backdrop.</p>\n</blockquote>\n<section class=\"secret\">\n<p><strong>Overview:</strong> Darraspace is an enigmatic region of Wildspace, defined by its lack of a central star and its diverse and often hostile environments. It spans a radius of 500 million miles and is home to four main planets, each with unique characteristics and dangers. This system presents a challenge to any adventurers brave enough to traverse its depths, especially with the mysterious Planet 3, <em>Arkaelion</em>, being the main inhabited world and the party's destination.</p>\n<h4><strong>Planet 1: Pyraxia</strong></h4>\n<ul>\n<li><strong>Location:</strong> 50 million miles from the center</li>\n<li><strong>Diameter:</strong> 800 miles</li>\n<li><strong>Type:</strong> Smoke World (Air &amp; Fire)</li>\n<li><strong>Environment:</strong> Pyraxia is a world of thick, deadly smoke and extreme heat. The atmosphere reduces visibility by tenfold, creating a hazardous environment where only the most resilient creatures can survive.</li>\n<li><strong>Inhabitants:</strong> Aberrations, monstrosities, humanoids, beasts, and plant creatures</li>\n<li>\n<p><strong>Moons:</strong></p>\n<ul>\n<li><strong>Ignis:</strong> A 200-mile diameter air world that orbits 70,000 miles from Pyraxia. Despite the extreme heat, Ignis boasts fresh air, though visibility is similarly reduced. It is inhabited by undead, fey, elementals, aberrations, monstrosities, humanoids, beasts, and plant creatures.</li>\n</ul>\n</li>\n</ul>\n<h4><strong>Planet 2: Thalassara</strong></h4>\n<ul>\n<li><strong>Location:</strong> 100 million miles from the center</li>\n<li><strong>Diameter:</strong> 60 miles</li>\n<li><strong>Type:</strong> Water World</li>\n<li><strong>Environment:</strong> Thalassara is a water planet with foul air quality and extreme heat, making it almost impossible to breathe without magical assistance. Visibility is heavily reduced, and the planet is dominated by lush but uninhabitable plant life.</li>\n<li><strong>Inhabitants:</strong> The planet is largely uninhabited, with no sentient life forms.</li>\n</ul>\n<h4><strong>Planet 3: Arkaelion</strong></h4>\n<ul>\n<li><strong>Location:</strong> 200 million miles from the center</li>\n<li><strong>Diameter:</strong> 9,000 miles</li>\n<li><strong>Type:</strong> Earth World</li>\n<li><strong>Environment:</strong> Arkaelion is the main inhabited world in the Frostburn System. It is a temperate planet with fresh air and clear visibility, offering a stark contrast to the other worlds in the system.</li>\n<li><strong>Inhabitants:</strong> Aberrations, monstrosities, humanoids, beasts, and plant creatures thrive here, creating a diverse and vibrant ecosystem.</li>\n<li>\n<p><strong>Moons:</strong></p>\n<ul>\n<li><strong>Ember:</strong> A fire world with a diameter of 400 miles, orbiting 100,000 miles from Arkaelion. It has a deadly atmosphere and extreme heat, reducing visibility by tenfold. Inhabitants include undead, fey, elementals, aberrations, monstrosities, humanoids, beasts, and plant creatures.</li>\n<li><strong>Zephyris:</strong> An air world with a diameter of 500 miles, orbiting 400,000 miles from Arkaelion. It suffers from foul air and extreme cold, making it inhospitable to most life forms. However, a few air elementals call it home.</li>\n<li><strong>Aquara:</strong> A water world with a diameter of 400 miles, orbiting 800,000 miles from Arkaelion. It has fresh air but reduced visibility due to the extreme cold. The moon is home to monstrosities, humanoids, beasts, and plant creatures.</li>\n</ul>\n</li>\n</ul>\n<h4><strong>Planet 4: Infernia</strong></h4>\n<ul>\n<li><strong>Location:</strong> 250 million miles from the center</li>\n<li><strong>Diameter:</strong> 9,000 miles</li>\n<li><strong>Type:</strong> Fire World</li>\n<li><strong>Environment:</strong> Infernia is a blazing inferno with foul air and extreme, unnatural heat. Visibility is reduced by tenfold, and anyone on the planet suffers 1d6 fire damage per minute unless they have fire resistance.</li>\n<li><strong>Inhabitants:</strong> There are no native inhabitants, but a few resilient monstrosities can be found.</li>\n</ul>\n<h3>Narrative Description:</h3>\n<p>Darraspace is a wildspace system without a central star, making it an anomaly in the cosmos. The system's name is derived from its contrasting elements of extreme heat and biting cold found across its planets and moons. At its heart lies <em>Arkaelion</em>, the main world and the destination of many spacefarers, including our party. Arkaelion is a temperate haven amidst the chaos, providing fresh air and unhindered visibility in stark contrast to its neighboring worlds.</p>\n<p><em>Pyraxia</em>, the closest planet to the center, is a hostile smoke world where visibility is severely reduced, and the atmosphere is deadly. Its moon, <em>Ignis</em>, shares similar traits but offers fresh air despite the intense heat.</p>\n<p>Further out, <em>Thalassara</em> presents a water world covered in plant life but marred by foul air and extreme heat, making it almost impossible to survive without magical aid.</p>\n<p>At 200 million miles lies <em>Arkaelion</em>, a vibrant and diverse earth world teeming with life. Its three moons—<em>Ember</em>, <em>Zephyris</em>, and <em>Aquara</em>—each present their unique challenges and environments, ranging from deadly fire and air worlds to frigid water realms.</p>\n<p>The farthest planet, <em>Infernia</em>, is a fire world of unimaginable heat and peril. With no native inhabitants, only the most formidable monstrosities can endure its fiery embrace.</p>\n<h3>Background</h3>\n<p>\"That's Darraspace. It's only on a few maps, but it's documented. Hardly anyone enters it, but people know its there. Athaspace should be right beside it.\"</p>\n<p>For a few minutes the crew strained their necks trying to see what else was in the flow near this enemorous sphere. It was Djan who finally noticed something.</p>\n<p>\"Over here,\" he called. \"It looks like Darraspace, well, bulges on this side.\"</p>\n<p>Bagath took a scope and looked carefully at the anomoloy in the sphere. After a few minutes he finally spoke.</p>\n<p>\"There are two, perhaps three small spheres over there,\" he said, \"on the far side of the big one. One of them has to be it.\"</p>\n<p>Tiegorus didn't say a word, but just jestured to Bagath.</p>\n<p>\"Tempest,\" the druid called, \"at your discression.\"</p>\n<p>The Calla Maraine banked to the right and picked up a lesser current that would carry it around Darraspace. Several hours later, three small crystal spheres, dwarfed by the larger one, appeared. Again Skot halted the ship as measurements and readings were taken.</p>\n<p>\"The middle-sized one,\" Skot finally decided. \"According to this chart, that's the one.\"</p>\n<p>The rest of the crew aggreed, and Tempest started willing the ship to one of the small spheres. Actually, the sphere was almost the size of Realmspace. Against the giant sphere of Darraspace, however, it was dwarfed to almost nothing. The three spheres had literally been lost in plain sight. They were so overshadowed by the giant sphere, that unless you knew exactly where to look you would miss them. Apparently, for over one-thousand years that was precicely what had happened.</p>\n<p>A day later, the spherewall stood before the Calla Maraine's piercing ram. Everyone stood on deck for several minutes. Cherry had brought up a large bottle of the magical elixer and passed it around to every spell caster on the ship. She had five bottles, and this one was now half-empty. She hoped they would have plenty. Finally, she sent for Gaye.</p>\n<p>\"It's time, Gaye,\" she said quietly, as if fortelling her own death.</p>\n<p>Gaye looked at the spherewall and paused. Kender feel no fear, but she was still hesitant. Curiosity was another characteristic of her race, but this time her curiosity was lacking. After several long minutes, she closed her eyes and started the sequence. Different types of psionic vibrations eminated from her mind, tapping and moulding the spherewall. Finally, a section of the black wall began to swirl like a small cloud.</p>\n<p>\"Now,\" Tiegorus said in the speaking tube.</p>\n<p>Tempest willed the ship forward, into the swirling cloud. For several minutes the Calla Maraine travelled through what seemed like a thick, black fog. Finally, a bright orange light appeared, and stars came into view. They were inside.</p>\n<p>The air on the ship suddenly felt heavy and uncomfortably warm. Bagath took out a special spy glass, one that filtered out large amounts of light, and looked at the sun in the distance.</p>\n<p>It had an eerie look to it. With the aid of the filter he could see the star clearly. It was a deep orange in color, with what appeared to be cracks of fire all over it. The corona was dark red, with prominances moving slowly… like lava. He turned away and lowered the scope, looking briefly at a notepad.</p>\n<p>\"This is it,\" he whispered. \"That's the dark sun.\"</p>\n<p>\"Is the locator working?\" Cherry asked.</p>\n<p>\"Yes,\" Skot answered, \"for now. I see six planets, including an earth world, the second one from the sun.\"</p>\n<p>\"Lay in a course, and proceed at your discression,\" Cherry said quietly. \"And Tempest,\" she added, \"if the helm gives you any kind of trouble, say so immediately.\"</p>\n<p>\"Aye, captain,\" the human answered.</p>\n<p>The Calla Maraine held still for a few more seconds, then rapidly started toward the second planet of the system.</p>\n<p>For the first time in over one thousand years, a spelljammer traveled the balmy night of Athaspace.</p>\n</section>\n<p>\_</p>"
