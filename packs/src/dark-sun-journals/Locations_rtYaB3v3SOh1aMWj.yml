pages:
  - name: Osraspace
    text:
      markdown: ''
      format: 1
      content: "<p>Not too distant from the Radiant Triangle lies a crystal sphere known as Osraspace. A key sphere in a small cluster of humanoid-dominated spheres, Osraspace was the location of several major battles during the last Unhuman War. Evidence of those battles can be found throughout the sphere.\_</p><section class=\"secret\" id=\"secret-6WU0D7phgYKN6rzJ\"><p>Osrad, the most important of the planets within Osraspace, is where I have placed the setting location for the Mayfair Games' Role Aids product \"Dark Folk\", published in 1983. Within that publication there is much information about orcs, kobolds, goblins, gnolls, and trolls, including setting information on towns, villages, fortresses and dungeons, and a map of the continent of Mamaryl.</p></section><table><thead><tr><th></th><th></th><th></th><th></th><th></th><th></th></tr></thead><tbody><tr><td>1.</td><td>Rastur</td><td>Fire World</td><td>Size H</td><td>Spherical</td><td>Primary</td></tr></tbody></table><table><thead><tr><th></th><th></th><th></th><th></th><th></th><th></th></tr></thead><tbody><tr><td>2.</td><td>Rasturell</td><td>Earth World</td><td>Size C - 900 mi</td><td>Spherical</td><td>40 million miles</td></tr></tbody></table><p>The name of this world translates to \"Son of Rastur\". The sun-blasted planet has what would be considered extreme deserts at the poles, however everywhere else on the planet the heat is so intense as to be completely hostile to all normal life. Sparsely scattered about its surface are communities of fire elemental creatures such as azer.</p><table><thead><tr><th></th><th></th><th></th><th></th><th></th><th></th></tr></thead><tbody><tr><td>3.</td><td>Torsia</td><td>Earth World</td><td>Size D - 3500 mi</td><td>Spherical</td><td>140 million miles</td></tr></tbody></table><p>Temperate and tropical plains 20%, Forests 30%, Deserts 30%, Mountains 10%, Cold (arctic) plains 10%</p><p>Torsia is unusual in that there are no oceans or clouds and is believed to have no free surface water. Water exists, however is entirely underground. Native plant species have unusually deep roots that allow them to extract water from beneath the surface. Highland areas tend to be deserts, and mountains are lifeless, as there is no reachable water. Native animal species get all of their water from the food (plant or animal) they consume.</p><p>A great civilization once existed on Torsia, but it mysteriously collapsed and disappeared over 5000 years ago. Ruins can be found all over the planet, all heavily damaged often to the point of being difficult to distinguish from natural rock outcropings. Rumors persist of preserved underground structures. Torsia is now thought to have no native intelligent life. The current small, reclusive human population consists of refuges and shipwreck survivors, many descendents from the Unhuman War.</p><table><thead><tr><th></th><th></th><th></th><th></th><th></th><th></th></tr></thead><tbody><tr><td>3a.</td><td>Ryan</td><td>Water World</td><td>Size C - 200 mi</td><td>Spherical</td><td>moon of Torsia</td></tr></tbody></table><p>Ryan has no atmosphere, so landing on its watery surface is quite problematic. Any ship contacting Ryan would lose its atmosphere as well, so it remains relatively unexplored. There does not seem to be any native life. It seems to be the irony of the multiverse, to have a planet with not a drop of surface water with a moon composed of nothing but water. There have been radical Osrad sages that have postulated that this is not a coincidence, and that Ryan is the water that once was on Torsia.</p><table><thead><tr><th></th><th></th><th></th><th></th><th></th><th></th></tr></thead><tbody><tr><td>4.</td><td>Tefir</td><td>Air World</td><td>Size G</td><td>Spherical</td><td>240 million miles</td></tr></tbody></table><p>The most notable feature of Tefir is a fire ring that surrounds the planet. Cloud cover is complete and impenetrable, and thus it may not be obvious that the planet is an air world. There are numerous, yet small, earth bodies that move through the air world, all less than a quarter mile in diameter. Tefir is the homeworld of a race of winged \"wind elves\" that call themselves \"zephyr\".</p><table><thead><tr><th></th><th></th><th></th><th></th><th></th><th></th></tr></thead><tbody><tr><td>5.</td><td>The Curtain</td><td>Earth World</td><td>Size B</td><td>Asteroid Belt</td><td>800 million miles</td></tr></tbody></table><p>The Curtain is a very wide asteroid belt occupying a region resembling the equatorial third of a sphere. Even though Greyspace's massive Grinder is a complete sphere, the Curtain represents many times the volume of the Grinder because its radius is 4 times greater. Within this chaotic jumble of rocky asteroids can be found many pirate bases, salvage yards, rogue outposts, and headquarters for secret organizations. Many of these are humanoid in nature, though not all. It is believed that there are several secret bases housing the remains of the humanoid fleets, the ogre fleet being perhaps the most dangerous. There is a persistent rumor of a secret ogre shipyard that was suddenly abandoned during the last Unhuman War for unknown reasons, with several ogre mammoths in various states of completion. The shipyard may also be lost to the ogres themselves, as they seem to still be searching for it. The immensity of the Curtain makes that a difficult process. The absence of any major ports of call on the planets inside the Curtain mean that few spelljamming crews bother to take on the dangers of the Curtain - making it the perfect location for the activities that it does see, of course.</p><table><thead><tr><th></th><th></th><th></th><th></th><th></th><th></th></tr></thead><tbody><tr><td>6.</td><td>Osrad</td><td>Earth World</td><td>Size E</td><td>Spherical</td><td>1400 million miles</td></tr></tbody></table><p>As one approaches Osrad, one of the dangerous legacies of the last Unhuman War will quite commonly become apparent. In orbit around Osrad are countless hard jagged white balls that will be picked up by the gravity planes of passing ships. When these balls land on deck, they will move and unfold into skeletons and attack (Lorebook of the Void p. 62-63, and Skull and Crossbones p. 54). Many of the skeletons are humanoid in nature, and can sometimes be surprisingly tougher than expected.</p><p>Osrad is an ancient goblin-kin homeland, and contains very large populations of kobolds, goblins, orcs, ogres, and gnolls. The variety of troll species here, the higher-than-expected intelligence of some of those species, and their long history seems to suggest that Osrad may possibly be the original troll homeworld.\_</p><p>There are 6 continents, and numerous large islands of note. The three largest continents are dominated by humanoid populations, sometimes with secretive and beleagured human populations struggling to survive. There are two smaller continents that are dominated by human and demihuman populations, although humanoids are still quite common. One of these is the continent - and human nation - of Mamaryl (which is described in the \"Dark Folk\" publication described above). The last continent, smaller than the rest and thankfully isolated from the others by wide seas, is a continent overrun by humanoid undead. Why they are there is unknown. Some have theorized the existence of a mysterious and powerful undead ruler, while others suggest the effects of a powerful artifact or ancient spell effect. Whatever the cause, it may explain the unusually high numbers of undead-manned ships in the Curtain.\_</p><table><thead><tr><th></th><th></th><th></th><th></th><th></th><th></th></tr></thead><tbody><tr><td>7.</td><td>Yarga</td><td>Water World</td><td>Size C - 200 mi</td><td>Spherical</td><td>2000 million miles</td></tr></tbody></table><p>From space, it looks like a frozen ice world, however Yarga actually consists of liquid water below a 10 km thick ice crust. The planet's name means \"Where Yarg lives\". Yarg (short for Yargnarrel) is one of the gods of the troll pantheon on Osrad. There is no native life on the surface of Yarga, and virtually nothing is known of what lies below its thick icy crust. From orbit, the surface seems fairly uniform and featureless, except for a 5 mile diameter depression in its northern hemisphere that seems to have been filled with more recent ice.</p><table><thead><tr><th></th><th></th><th></th><th></th><th></th><th></th></tr></thead><tbody><tr><td>7a.</td><td>Shard</td><td>Ice World</td><td>Size B - 5 x 25 mi</td><td>Spindle</td><td>moon of Yarga</td></tr></tbody></table><p>Shard is a spindle-shaped solid chunk of ice orbiting Yarga. There is a forgotten legend from prehistory of an ancient colossal god-like elemental beast that was banished from Osrad many millenia ago by the pantheon. It remains in suspended animation, locked within Shard, and may someday awaken.</p>"
