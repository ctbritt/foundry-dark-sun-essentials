  - name: Free City of Greyhawk
    _id: v6hFV9vOIvjYM2KC
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <table style="width:100%;border:none;background:transparent"><tbody><tr
        style="background:transparent"><td
        style="vertical-align:top;width:70%;padding:2rem"><p>The Free City of
        Greyhawk is a powerful city-state located in the central Flanaess. It is
        known as the Gem of the Flanaess. It is also varyingly referred to as
        Greyhawk City, Greyhawk, or simply the Free City. The word "Greyhawk" is
        additionally used in reference to those lands controlled by the Free
        City, though the proper term for the entire realm is the Domain of
        Greyhawk.</p><h3>History</h3><h4><strong>Early
        history</strong></h4><p>Greyhawk, named for the small grey hawks which
        populate the region, was originally a trading outpost on the Selintan
        specializing in local wood and woven garments, which was known by that
        name as early as 330 OR (-315 CY). In time, the town developed strong
        textile and meat-packing industries. From the earliest days, Greyhawk
        was ruled by a warlord who took the title "Landgraf of the Selintan."
        This first Landgraf's son was then married to the Gynarch of Hardby's
        daughter. The nuptials formalized a political alliance that served as
        the basis for rule over the Lanstadt of Selintan, the area that
        eventually became known as the Domain of Greyhawk.</p><p>In 4 CY,
        Greyhawk came under the domination of the Great Kingdom of Aerdy and
        remained so while strong Overkings ruled from the Malachite Throne in
        Rauxes. The Great Kingdom's influence over the city began to wane during
        the third and especially the fourth centuries as the House of Rax
        declined and the Overkings hold on distant provinces became increasingly
        tenuous.</p><h4><strong>Rise to prominence, decline and
        recovery</strong></h4><p>In approximately 310 CY, the mage Xagig
        Yragerne emerged from the Wild Coast and bribed his way into a seat on
        the Directing Oligarchy. Approximately 320 CY, the Oligarchs elected
        Xagig Lord Mayor of the city.</p><p>Greyhawk subsequently rose in fame
        and prominence under the leadership of Lord Mayor Xagig. He instituted
        legal reform, developed a new currency, fortified the walls, founded the
        city's first university, and embarked on a major building program. Most
        notably, he directed the construction of nearby Castle
        Greyhawk.</p><p>Although Xagig—later known as Xagyg—became increasingly
        erratic over time, his rule is generally considered to be the most
        effective in the Free City's history and brought widespread prosperity
        to the region. Much to the annoyance of Dyvers and other rival cities,
        Xagig proclaimed Greyhawk to be the "Gem of the Flanaess," and did much
        to ensure this moniker was justified. Unfortunately, the "Mad Archmage"
        disappeared in 421 CY, leaving no clues regarding his whereabouts, and
        no heir to inherit the title of Landgraf.</p><p>In 498 CY, after decades
        of Xagig's absence, the Landstadt was therefore abolished, the title of
        Landgraf permanently retired, and the Free City's Directing Oligarchy
        assumed political authority. The new Lord Mayor Paerinn officially
        proclaimed Greyhawk a free city, though it had been effectively
        independent of the Great Kingdom's rule for over a century.</p><p>Soon
        thereafter, the city lost its claim over Hardby and the Wild Coast, as
        the leading women of Hardby broke from Greyhawk and established the
        ruling office of Despotrix. This loss of lands sent the Free City into
        economic decline, a situation that persisted for several decades.
        Fortunately, the discovery of treasure in the dungeons beneath Castle
        Greyhawk and other nearby locales set off a gold rush of sorts, and
        Greyhawk's economic fortunes recovered substantially in the second half
        of the sixth century CY.</p><h4><strong>The Greyhawk Wars and the
        post-war situation</strong></h4><p>The Free City of Greyhawk had less
        direct involvement in the Greyhawk Wars than many other political
        entities across the Flanaess. The war has come to be named for the city
        because the "Great Council" who ended the war met in the Free City at
        the Old City Great Hall. That is where the truce which ended the
        fighting in 584 CY and the final treaty which followed in 585 CY were
        brokered and signed.</p><p>The Wars had several important effects on the
        city, however, particularly in that the unrest drove Hardby and the Wild
        Coast cities of Safeton and Narwell to re-submit to the rule of the
        Directing Oligarchs. This situation is unstable, however, as it was
        largely fear of Turrosh Mak's humanoid raiders from the Pomarj that
        prompted this move, and the Despotrix and the Wild Coast cities once
        again agitate for increased independence.</p><p>Also as a result of the
        Wars, the city has seen an influx of new citizens. Some of these are
        wealthy diplomats, and some are "nobles" who have contributed
        significantly to Greyhawk's coffers with the purchase of various
        counterfeit titles and documents. But many newcomers to Greyhawk are
        destitute refugees or are merely using the city as a base for hatching
        political plots and intrigues across the Flanaess. In particular, there
        are persistent rumors of covert Scarlet Brotherhood operations in the
        city.</p><p>The post-war situation for the Free City is therefore mixed.
        Greyhawk's finances are in the best shape they have been in since
        Xagig's departure, but the city faces significant challenges arising
        from political instability and increasing criminal
        activity.</p><h3>Geography</h3><p>The Free City of Greyhawk is located
        centrally in the Flanaess, which is the easternmost part of the
        continent of Oerik on the world of Oerth. The city controls a large
        swath of land along the Selintan River from the Nyr Dyv south to Woolly
        Bay, most of the Cairn Hills, parts of the Gnarley Forest, the northern
        Wild Coast, and parts of the Abbor-Alz. The entire region is officially
        known as the Domain of Greyhawk. The Domain is bordered on the east by
        the Abbor-Alz and its western border lies within the Gnarley Forest. The
        area south of Greyhawk City along the Selintan is known as the Plain of
        Greyhawk.</p><h3>Cityscape</h3><p>The Free City of Greyhawk is divided
        into eight Quarters. The Thieves' Quarter, the Slum Quarter, the
        Artisans' Quarter, Clerkburg, the Foreign Quarter, the River Quarter,
        the Garden Quarter, and the High Quarter. Generally speaking, the
        poorest sections of town are to the south, on lower ground, while the
        wealthier quarters are to the north, at higher elevation. The Thieves'
        and Slum Quarters are known collectively as Old City, while the other
        six quarters are referred to as New City.</p><p>Areas of note
        immediately outside the city walls include Shacktown, Barge End, Far
        Bank, and the Stone Ring.</p></td><td
