      markdown: >-
        **Faeriespace** is a strange and magical crystal sphere dominated by an
        enormous tree.


        ## Overview


        Faeriespace is a beautiful, exotic sphere full of wonder and new
        experiences. The underlying magical quality of Faeriespace ensures this
        strange, alien sphere instills in its visitors a constant sense of
        astonishment.


        Faeriespace has a unique society in that the entire solar system is one
        large community. Despite the wide variety of races and cultures that
        exist there, all are peaceful and unified. The common tongue has no word
        for this unusual state of peaceful co-existence, but in the faerie
        tongue it is called _shrakma_. The word _shrakma_ actually has two
        totally contradictory meanings. In one sense, it refers to the unifying
        force in Faeriespace that ties its people together as one. But it can
        also refer to the carefree, chaotic spirit of the inhabitants that make
        up this mystical, faerie sphere.


        Dominating the crystal sphere is an unimaginably huge tree that is
        impossible to see in its entirety. The branches and leaves of the tree
        are so enormous that they have their own gravity and maintain a
        virtually inexhaustible air supply. Hanging from certain branches around
        the tree are its strange fruit: giant, burning suns. Together they
        provide the entire sphere with brilliant illumination. Supported on the
        branches of the tree are eight planets; exactly half the number of suns
        on the tree.


        The leaves of the tree are constantly shifting and changing position. In
        this manner, they selectively block the light of the many suns during
        certain times, effectively creating night and day on the various
        planets. Where the trunk of the mammoth tree splits into three main
        branches lies a vast, beautiful city, named Armon, the capital of
        Faeriespace and home of Aelivere, the One King.


        ## Location


        Faeriespace is a free floating crystal sphere in the Flow, and has
        connections to Herospace and Darkspace.


        ## Celestial bodies


        Faeriespace is unique in that its 'primary' is in fact an enormous tree
        which fills the sphere (see starbeasts). Hanging from select branches
        are sixteen burning suns which together provide illumination for the
        entire sphere, including eight planets which rest on various branches of
        the tree.


        The system operates as one gigantic community rather than eight separate
        worlds. Because the planets are resting on the branches of the great
        tree, a person can literally walk from one planet onto the great tree,
        and then walk along the tree's branches to another planet. Although the
        distances involved are enormous, this link helps to foster the sense of
        community and unity that is so important to Faeriespace.


        ## The Great Tree


        Technically, Faeriespace's primary is an unimaginably huge tree that
        dominates the crystal sphere. Impossible to see in its entirety, the
        roots of the tree disappear at the “bottom” of the crystal sphere. The
        branches and leaves of the tree are so enormous that they have their own
        gravity and maintain a virtually inexhaustible air supply. Hanging from
        certain branches around the tree are sixteen burning suns, which
        together provide the entire sphere with brilliant illumination.
        Supported on the branches of the tree are eight planets. Where the trunk
        of the mammoth tree splits into three main branches lies a vast,
        beautiful city, named Armon, the capital of Faeriespace and home of
        Aelivere, the One King.


        ### Armon


        **Armon**, the capital city of Faeriespace, is a place of wonder and
        curiosity. In few other places in the universe can you find humans,
        elves, brownies, nymphs, orcs, and other strange and magical creatures
        living together in one place. There is even a gold dragon named Xilinon
        living in the wondrous city. Armon has a population of about 30,000
        creatures. It has no government in the traditional sense, as it has no
        real need for one. Creatures that are accustomed to coexisting
        peacefully constitute the majority of the population of Armon, but even
        those creatures that are normally aggressive by nature (humans, orcs,
        etc.) seem to naturally fall in line with the way of things in
        Faeriespace. Located at the center of the great capital is Aelivere’s
        palace, a structure made of a conglomeration of giant mushrooms.


        ### The Sixteen Suns


        Hanging from certain branches around the great tree, like giant radiant
        fruit, are sixteen burning suns. Together they provide constant
        illumination for the entire sphere. The leaves of the tree are
        constantly shifting and changing position, and in this manner, they
        selectively block the light of the many suns during certain times,
        effectively creating night and day on the various planets.


        ### Upgood


        The region known as **Upgood** encompasses the upper branches of the
        great tree which support the four planets that collectively serve as
        home to most of the good-aligned inhabitants of Faeriespace. The four
        upper worlds are known as **Genia**, **Freemor**, **Agron** and
        **Tiqua**.


        The planets of Faeriespace are very similar to each other, with a wide
        variety of terrain types ranging from tall mountain peaks to desert
        wastelands. Dalelands, moors, hills, forests and just about any type of
        geography can be found on the worlds of Faeriespace. On the whole, most
        visitors to the faerie sphere prefer the four upper planets of Upgood.


        While Upgood is home to most of the good-aligned inhabitants of
        Faeriespace, the region itself should in no way be considered
        good-aligned. In keeping with the sphere's philosophy of _shrakma_, no
        place in Faeriespace is truly good or evil; instead it is simply part of
        a greater whole.


        ### Vastdarken


        The region known as **Vastdarken** encompasses the lower branches of the
        great tree which support the four planets that collectively serve as
        home to most of the evil-aligned inhabitants of Faeriespace. The four
        lower worlds are known as **Morath**, **Krag**, **Beastra** and
        **Mish**.


        The planets of Faeriespace are very similar to each other, with a wide
        variety of terrain types ranging from tall mountain peaks to desert
        wastelands. Dalelands, moors, hills, forests and just about any type of
        geography can be found on the worlds of Faeriespace. However, on the
        lower planets, the sky always appears overcast and stormy, which has a
        particularly unnerving effect on off-world visitors.


        While Vastdarken is home to most of the evil-aligned inhabitants of
        Faeriespace, the region itself should in no way be considered
        evil-aligned. In keeping with the sphere's philosophy of _shrakma_, no
        place in Faeriespace is truly good or evil; instead it is simply part of
        a greater whole.
