        100%;-webkit-mask-image:url('../modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:100%"
        /><section id="secret-IwdxwYyjDBVDhwrH"
        class="secret"><p><strong>Krynnspace</strong> is a crystal sphere that
        is home to the DRAGONLANCE Campaign Setting, and is named for its most
