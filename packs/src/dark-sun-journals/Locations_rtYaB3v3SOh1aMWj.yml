  - sort: 7000
    name: Greyspace
    type: text
    _id: sRwhA2BvnwiYsP1p
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <img
        src="https://greyhawkonline.com/greyhawkwiki/images/5/58/Greyspace03.png"
        style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('../modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:100%"
        /><p><strong>Greyspace</strong> is the common name given to the
        planetary system of <a
        href="https://greyhawkonline.com/greyhawkwiki/Oerth">Oerth</a>.</p><section
        class="secret" id="secret-05XXVKmo1pxUgPvO"><p>It is the home to the <a
        href="https://greyhawkonline.com/greyhawkwiki/Greyhawk"><em>Greyhawk</em></a>
        campaign setting.</p></section><p>Unlike most planetary systems,
        Greyspace is geocentric; a terrestrial body—in this case, Oerth—is the
        center of the system, about which other celestial bodies
        orbit.</p><h2>Physical characteristics</h2><p><strong>The crystal
        sphere</strong></p><p>Greyspace, like all planetary systems in the
        <em>Spelljammer</em> universe, is encased in a vast sphere of an
        indestructible substance. At 16 billion miles across, Greyspace's sphere
        is one of the largest known. From the outside it is as reflective as
        polished steel, and from a distance beautiful colors, like the
        iridescent hues in mother-of-pearl, can be discerned. From the inside it
        is night-black and completely nonreflective. It is, in fact, the night
        sky itself. It cannot be touched, exactly; it is perceivable only as a
        barrier beyond which nothing can go, except through portals opened
        magically into the chaos outside.</p><p>The "stars" that can be seen on
        clear nights are actually titanic gemstones somehow buried in the
        surface of the sphere. It has been surmised that they contain portals
        within them to the Positive Energy Plane or the Quasielemental Plane of
        Radiance, or that they were mined from the gods from the stuff of the
        Positive Energy Plane. The heat from them can only be felt from less
        than a hundred feet away (where it is deadly), but their light can be
        seen (obviously) for billions of miles. The constellations are described
        as occupying the midpoint between Law and Chaos; patterns can be
        discerned, but the greater order behind them, if any, seems elusive.
        Oerthly sages identify 12 Lairs of the Zodiac and have given names to
        many other constellations as well, such as the Druid, the Dancer of
        Swords, and the Swan.</p><h2>Wildspace</h2><p>The vacuum of space
        between the worlds and stars of Greyspace is cooler than that of <a
        href="http://spelljammer.wikia.com/wiki/Realmspace">Realmspace</a>, but
        not as frigid as <a
        href="http://spelljammer.wikia.com/wiki/Krynnspace">Krynnspace</a>. It
        is almost always 40 to 45 degrees Fahrenheit, except close to the
        sun.</p><h2>Celestial</h2><p>The major celestial bodies of Greyspace,
        from the center out, include:</p><ul><li><a
        href="https://greyhawkonline.com/greyhawkwiki/Oerth"><strong>Oerth</strong></a>:
        Terrestrial planet.</li><li><a
        href="https://greyhawkonline.com/greyhawkwiki/Kule"><strong>Kule</strong></a>,
        also known as <strong>Celene</strong>: Tidally-locked terrestrial body.
        Covered with the ruins of a humanoid civilization, but lacking any air
        whatsoever. A magical cataclysm is suspected to have caused the
        depopulation. It is one of Oerth's moons.</li><li><a
        href="https://greyhawkonline.com/greyhawkwiki/Raenei"><strong>Raenei</strong></a>,
        also known as <strong>Luna</strong>: Terrestrial planet, covered with
        earthlike features, including animals and monsters, but no sentient
        life. It is one of Oerth's moons.</li><li><a
        href="https://greyhawkonline.com/greyhawkwiki/Liga"><strong>Liga</strong></a><strong>,
        the Sun</strong>: Fire body. Has many small lakes of elemental water to
        keep it from burning too hot. Larger than
        Oerth.</li><li><strong>The</strong> <a
        href="https://greyhawkonline.com/greyhawkwiki/Grinder"><strong>Grinder</strong></a>:
        Spherical asteroid belt.</li><li><a
        href="https://greyhawkonline.com/greyhawkwiki/Edill"><strong>Edill</strong></a>:
        Gas giant, populated primarily by <a
        href="https://greyhawkonline.com/greyhawkwiki/Dragon">dragons</a>.</li><li><a
        href="https://greyhawkonline.com/greyhawkwiki/Gnibile"><strong>Gnibile</strong></a>:
        Dark-red gas giant, with blobs of lava and shards of ice in the
        interior. Contains a gate to the <a
        href="https://greyhawkonline.com/greyhawkwiki/Negative_Material_Plane">Negative
        Material Plane</a>. Populated primarily by undead.</li><li><a
        href="https://greyhawkonline.com/greyhawkwiki/Conatha"><strong>Conatha</strong></a>:
        Elliptical water world with two solid cores that orbit around each
        other. Populated by many piscine creatures, including merfolk and <a
        href="https://greyhawkonline.com/greyhawkwiki/Sahuagin">sahuagin</a>.</li><li><a
        href="https://greyhawkonline.com/greyhawkwiki/index.php?title=Ginsel&amp;action=edit&amp;redlink=1"><strong>Ginsel</strong></a>:
        Crescent-shaped world that resembles a sphere with a giant bite taken
        out of it. Has an atmosphere on the inside of the crescent. Basic
        civilized fantasy world.</li><li><a
        href="https://greyhawkonline.com/greyhawkwiki/index.php?title=Borka&amp;action=edit&amp;redlink=1"><strong>Borka</strong></a>:
        Spherical asteroid cluster with a common atmosphere. Formerly a planet
        inhabited by <a
        href="https://greyhawkonline.com/greyhawkwiki/Orc">orcs</a>, <a
        href="https://greyhawkonline.com/greyhawkwiki/Goblin">goblins</a> and
        other humanoids, it was devastated by the magic of the <a
        href="https://greyhawkonline.com/greyhawkwiki/Elf">elves</a>.</li><li><a
        href="https://greyhawkonline.com/greyhawkwiki/index.php?title=Greela&amp;action=edit&amp;redlink=1"><strong>Greela</strong></a>:
        Another spherical asteroid cluster with a common atmosphere, although
        many of the asteroids bear huge forests. Home to
        elves.</li><li><strong>The</strong> <a
        href="https://greyhawkonline.com/greyhawkwiki/index.php?title=Spectre&amp;action=edit&amp;redlink=1"><strong>Spectre</strong></a>:
        A flat, circular disc of rock that appears to vanish and re-appear as it
        is seen edgewise, then rotates to show its full face. Also called
        <strong>The Wink</strong>. Has an atmosphere and water, but no
        life.</li></ul><h2>Other features of Greyspace</h2><ul><li>The <a
        href="https://greyhawkonline.com/greyhawkwiki/index.php?title=Sisters&amp;action=edit&amp;redlink=1"><strong>Sisters</strong></a>:
        A constellation of nine star-like objects, resembling a single bright
        star from Oerth. They are surrounded by a region of reverse gravity and
        dead magic. Those who pass between them end up far removed in space or
        time.</li><li><strong>The</strong> <a
        href="https://greyhawkonline.com/greyhawkwiki/index.php?title=Great_Sargasso&amp;action=edit&amp;redlink=1"><strong>Great
        Sargasso</strong></a>: A region of dead magic a million miles in
        diameter.</li><li><strong>The</strong> <a
        href="https://greyhawkonline.com/greyhawkwiki/Habitat"><strong>Habitat</strong></a>:
        A mile-long ellipsoid of some dark blue-gray metal (perhaps
        superficially resembling the far smaller artifact in the <a
        href="https://greyhawkonline.com/greyhawkwiki/Pits_of_Azak-Zil">Pits of
        Azak-Zil</a>).</li><li><strong>Dark Stars</strong>: At least three
        objects similar to <em>Spheres of Annihilation</em>, but several miles
        in diameter.</li></ul><h2>Other possible features of
        Greyspace</h2><ul><li><a
        href="https://greyhawkonline.com/greyhawkwiki/Atropus"><strong>Atropus</strong></a>,
        the World Born Dead, is a small moonlet that travels through space,
        erasing all life it encounters.</li><li>The <strong>Dragon's
        Tear</strong> comet, which appears in the sky every 27 years, opening
        the Vast Gate to the <a
        href="https://greyhawkonline.com/greyhawkwiki/Far_Realm">Far Realm</a>
        with the enormous reserve of potential magical energy it builds up
        during its long interplanetary journey.</li><li>A fiery red comet
        heralds the approach of <a
        href="https://greyhawkonline.com/greyhawkwiki/Ragnorra">Ragnorra</a>.</li><li>The
        floating castle of <a
        href="https://greyhawkonline.com/greyhawkwiki/Sardior"><strong>Sardior</strong></a>,
        which stays forever on the night side of the world away from the sun. On
        the nights it can be seen, it has been mistaken for a small red moon.
        Periodically it moves between planes.</li></ul><section class="secret"
        id="secret-ALahGyv0oSEoQXI7"><p>Full information on Greyspace can be
        found here:
        @UUID[Compendium.shareddata.sj-journals.JournalEntry.PLk94XGPLyljkVuR]{Greyspace}</p></section>
