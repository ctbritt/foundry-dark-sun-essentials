  - type: text
    name: Crystalspace
    _id: lurWUmRIBY6xuUe8
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p>There is little to recommend Crystalspace, other than its natural beauty. It was like an enormous geode. It had a sun, but no planets to speak of, just a handful of rocks floating around in empty space. All along the sphere wall there were natural, crystaline spires, some several hundred miles high. Pools and lakes of water could be found in a variety of places. Cities could be found on the banks of these lakes.</p><p>Crystalspace was sparcely populated, because the terrain was made entirely of hard crystals. What's more, the sun never set, and the crystals captured the rays of light. Being in Crystalspace was like flying around inside of an enemorous lantern. Despite the odd climate, the sphere was a marvel to behold.</p><p>The main city on the inside of the sphere is Diamondburgh, on the far side of where the party comes in. As the party travels the colors of Crystalspace continuously changed below them.</p><p>Crystalspace is an impressive place to visit, and Diamondburgh is a fascinating city, carved into the very crystal that formed the landscape of Crystalspace, but the crew of the\_Izume Dzan\_has to go elsewhere. After spending two days getting provisions, supplies, and a wide variety of emergency equipment, the\_Calla Maraine\_left the sphere, again using the psionic procedure.</p>"
