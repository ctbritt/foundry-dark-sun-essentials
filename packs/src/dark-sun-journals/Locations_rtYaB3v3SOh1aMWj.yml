  - name: Faeriespace
    _id: RX1YuyDuyoqMd0UI
    type: text
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 2
      content: >-
        <p><strong>Faeriespace</strong> is a strange and magical crystal sphere
        dominated by an enormous tree.</p>

        <h2>Overview</h2>

        <p>Faeriespace is a beautiful, exotic sphere full of wonder and new
        experiences. The underlying magical quality of Faeriespace ensures this
        strange, alien sphere instills in its visitors a constant sense of
        astonishment.</p>

        <p>Faeriespace has a unique society in that the entire solar system is
        one large community. Despite the wide variety of races and cultures that
        exist there, all are peaceful and unified. The common tongue has no word
        for this unusual state of peaceful co-existence, but in the faerie
        tongue it is called <em>shrakma</em>. The word <em>shrakma</em> actually
        has two totally contradictory meanings. In one sense, it refers to the
        unifying force in Faeriespace that ties its people together as one. But
        it can also refer to the carefree, chaotic spirit of the inhabitants
        that make up this mystical, faerie sphere.</p>

        <p>Dominating the crystal sphere is an unimaginably huge tree that is
        impossible to see in its entirety. The branches and leaves of the tree
        are so enormous that they have their own gravity and maintain a
        virtually inexhaustible air supply. Hanging from certain branches around
        the tree are its strange fruit: giant, burning suns. Together they
        provide the entire sphere with brilliant illumination. Supported on the
        branches of the tree are eight planets; exactly half the number of suns
        on the tree.</p>

        <p>The leaves of the tree are constantly shifting and changing position.
        In this manner, they selectively block the light of the many suns during
        certain times, effectively creating night and day on the various
        planets. Where the trunk of the mammoth tree splits into three main
