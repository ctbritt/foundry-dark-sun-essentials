    text:
      format: 1
      content: "<h2>Center: Type G Firebody</h2><p>Patria's primary, boringly-named \"the Sun,\" is a very typical firebody, standard in all respects.</p><h2>Planets</h2><h3>1. Sylvanara</h3><p>Size F earth body. 40 million miles from the Sun</p><p>A largely untamed wilderness planet, populated by various monstrous species. It's known for its dense forests and the rich variety of magical plants and herbs that can be found here. Many adventurers and explorers come here to seek rare ingredients or hunt monsters. A few scattered settlements of brave (or foolish) pioneers can be found as well.</p><h3>2. Goliath's Reach</h3><p>Size D earth body, 110 million miles from the Sun</p><p>This planet is known for its dramatic landscape, with huge mountain ranges, deep canyons, and expansive plains. Despite its inhospitable terrain, it's home to several hardy races. The most notable inhabitants are a race of Goliaths who have mastered the art of mountaineering and live in scattered tribes across the mountains. The Goliaths are generally friendly but fiercely competitive.</p><h3>3. Delos - the Main Planet – a planet with three major continents bounded on all sides by water</h3><p>A size E earth body 240 million miles from the sun</p><h4>Its kingdoms</h4><ul><li><p>Hélianthe - the Western Empire</p><ul><li><p>This is a land of knights, castles, and chivalry. The people are disciplined and hold honor in high regard. The current ruler, Emperor Aleron, is popular among the people and is known for his just rule</p></li></ul></li><li><a href=\"https://www.notion.so/Land-of-Yamato-50960d927b054c38a9617c4937b7cae0?pvs=21\">Land of Yamato</a></li><li><p>Al-andus the southern empire (Arabian)</p><ul><li><p>An exotic and vibrant land, known for its bustling markets, grand palaces, and skilled magicians. The people are known for their hospitality and love for storytelling.</p></li></ul></li><li><p>Kyth: The Frozen Isle (evil/necromantic located to the north)</p><ul><li><p>To the north lies the cursed Kyth, a land ruled by dark magic and necromancers. Its residents live in fear, constantly under the threat of the undead.</p></li></ul></li></ul><h4>Smaller countries</h4><ul><li>Jyodo – a small theocracy based around a deity incarnate in the northwestern mountains of Yamato</li><li>Skaar – a barbarian isle even beaker than Kyth; in perpetual war with its mystical adversary</li><li>Dun Kilter - A land of kilted dwarves</li><li>The Great Forest of Eldenar</li><li>The Black Desert of Nethor</li><li>The Misty Mountains of Arduin</li><li>The Southern Swamps of Zul'Tar</li></ul><h3>4.Aquaen\_</h3><p>Size D water body 520 million miles from the Sun. Aquaen is a planet completely covered in water, with an abundance of marine life. Sea monsters of myth and legend inhabit the deep oceans, making travel by water very dangerous. A race of aquatic elves have established undersea cities, while pirate strongholds dot the few islands that break the water's surface.</p><h3>5. Asteroid Belt</h3><p>720 million miles from the Sun.</p><p>The Asteroid Belt is a chaotic expanse filled with mineral-rich asteroids. Mining colonies have been set up by various spacefaring races. The area is plagued by pirates and privateers who prey on the rich mineral payloads. Adventure awaits those brave enough to venture into the Asteroid Belt.</p><h3>Sphere wall is 4,000 million miles from the Asteroid Belt</h3><p>\_</p>"
