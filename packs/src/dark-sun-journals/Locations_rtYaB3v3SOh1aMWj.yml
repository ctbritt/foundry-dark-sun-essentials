        by spelljamming travelers. At roughly 8,000 million miles in diameter,
        Krynnspace is considerably larger than Realmspace, and is also notably
        colder than other known spheres and as such is plagued by small lethal
        clouds of freezing vapour.</p><h2>Location</h2><p>Krynnspace is part of
        a stable triangular configuration in the phlogiston that also includes
        Realmspace and Greyspace. The Flow allows one-way spelljammer travel
        from Krynnspace to Realmspace, as well as one-way travel from Greyspace
        to Krynnspace. Krynnspace also has Flow connections to Clusterspace,
        Pathspace, and Vodonispace.</p><h2>Celestial bodies</h2><p>Krynnspace is
        a heliocentric system, with the system primary, a fire body known as the
        Sun, lying at the centre of the sphere and orbited by 6 planets and an
        asteroid cluster. Most of the planets are named for the deities of
        Krynnspace, as are the constellations.</p><h3>The Sun</h3><p>The Sun is
        Krynnspace's system primary and is a size H spherical fire
        body.</p><h3>Sirrion</h3><p>Sirrion is a size D spherical inert fire
        body.</p><h3>Reorx</h3><p>Reorx is a size D spherical earth body. It has
        one moon.</p><h3>Krynn</h3><p>Krynn is a size D spherical earth body. It
        has three moons.</p><h3>Chislev</h3><p>Chislev is a size E spherical
        earth body. It has been classified as a
        liveworld.</p><h3>Zivilyn</h3><p>Zivilyn is a size F spherical air body.
        It has twelve moons.</p><h3>Nehzmyth</h3><p>Nehzmyth is a size C ovoid
        earth body. It has been suspected of being a liveworld and it orbits
        within the Black Clouds.</p><h3>Stellar Islands</h3><p>The Stellar
        Islands are a cluster of size A earth bodies. The five largest
        asteroidsin the cluster are connected by magical
        walkways.</p><h2>Additional Astronomicals</h2><h3>Clouds of Freezing
        Vapor</h3><p><strong>The Clouds of Freezing Vapor</strong> resemble
        billowy, nearly transparent clouds and are a phenomenon unique to
        Krynnspace. Scholars believe they form as a result of Krynnspace's
        unusually low temperature freezing any moisture that enters
        wildspace.</p><h3>The Black Clouds</h3><p><strong>The Black
        Clouds</strong> are in some respects the complete opposite of the Cloud
        of Freezing Vapor. Invisible against the blackness of the outer reaches
        of wildspace, the Black Clouds are boiling to the touch and have been
        the doom of many spelljamming ships that foolishly passed through
        them.</p><h2>Crystal Shell</h2><p>Krynnspace's crystal shell resembles a
        great, sparkling disk, and because of its great size, appears relatively
        flat to observers. Similar to all other known spheres, the crystal shell
        is made of a dark ceramic material that is impenetrable, since no known
        physical force or magical spell has been able to pass through or sunder
        it. Despite this, circular openings, known as portals, appear at
        irregular intervals throughout the sphere.</p><p>These openings, edged
        in silver-blue and ranging in size from a yard (1 meter) to nearly a
        half-mile across (0.8 kilometre), allow objects that contain at least a
        trace of life to pass through the shell. This includes both spelljamming
        ships with living crews and as well as creatures that live in the
        phlogiston or in wildspace. It is through these portals that
