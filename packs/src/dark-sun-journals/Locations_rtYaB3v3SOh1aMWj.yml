  - name: Terraspace
    text:
      markdown: ''
      format: 1
      content: "<img src=\"s3/images/terra%20sphere.webp\" style=\"-webkit-mask-size:100% 100%;-webkit-mask-image:url('../modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:100%\" /><p>The crystal sphere containing Azthir-Terra is based on Realmspace. Other than Toril and the exceptions noted below, it is identical. It consists of:</p><ul><li>The Sun</li><li>Anadia</li><li>Colier</li><li><p>Azthir-Terra</p><ul><li>Selune</li></ul></li><li><a>Karpri</a></li><li>Chandos</li><li><p><a>Asteroid belt</a></p><ul><li>Caer Windlauer</li></ul></li><li><p>Glyth</p><ul><li>The Rings of Glyth</li><li>Haven</li><li>Mingabwe and Polluter</li></ul></li><li>Garden</li><li>H'Catha</li></ul><p>Much of the Terra Sphere is uninhabited. Azthir-Terra is the only fully populated world in this system.</p><section class=\"secret\" id=\"secret-KqTXt9qsQgUJbU0l\"><p>That said, there are some non-Terrans in the sphere. These include</p><ul><li><a href=\"https://www.dndbeyond.com/sources/sais/lox/terrors-of-the-void#TopolahsTower\">Topolah</a>, a female wizard who inhabits a tower on a flat-topped asteroid in the Belt. Her home is Caer Windlauer.</li><li>A group of stranded <a href=\"https://www.dndbeyond.com/monsters/2821155-autognome\">autognomes</a> at the southern pole of Karpri. They crashed landed about a century ago, and have been unable to repair this ship with the parts at hand. The party's ship would be excellent material for spare parts! The following bodies are described briefly below:</li></ul></section><h1>The Sun</h1><p>TYPE: Spherical Fire Body<br />SIZE: H <br />ESCAPE TIME: 24 Turns <br />SATELLITES: 8 planetoids <br />DAY LENGTH: 37 hours <br />YEAR LENGTH: None <br />POPULATION: None, perhaps creatures from the elemental plane of fire</p><p>The Sun, as in most solar systems, is the primary orbital attractor and the exact center of the crystal sphere. All the planets of the solar system circumnavigate it in their relentless or- bits. This fiery body burns with so much fury that it can maintain an unusually warm temperature within the whole crystal sphere, without damaging the planets that orbit it.</p><p>Many sages believe that crystal sphere warming is a naturally occurring phenomenon. They say that the older a system is, the warmer the sphere. If this is the case, Terra Sphere is the oldest system encountered so far. This warming allows for comfortable spelljamming anywhere within the sphere.</p><p>The Sun, when safely viewed, can be seen as a seething ball of fire. Its surface is continually spitting up solar flares, columns of fire millions of miles high.</p><table><thead><tr><th id=\"distance/time_from:\">DISTANCE/TIME FROM:</th><th></th></tr></thead><tbody><tr><td>Anadia</td><td>50 Million Miles, 12 hours travel</td></tr><tr><td>Coliar</td><td>100 Million Miles, 1 day travel</td></tr><tr><td>Azthir-Terra</td><td>200 million miles, 2 days travel</td></tr><tr><td>Karpri</td><td>300 million miles, 3 days travel</td></tr><tr><td>Chandos</td><td>400 million miles, 4 days travel</td></tr><tr><td>Asteroid Belt</td><td>600 million miles, 6 days travel</td></tr><tr><td>Glyth</td><td>1,000 million miles, 10 days travel</td></tr><tr><td>Garden</td><td>1,200 million miles, 12 days travel</td></tr><tr><td>H'Catha</td><td>1,600 million miles, 16 days travel</td></tr><tr><td>Sphere</td><td>3,200 million miles, 32 days travel</td></tr></tbody></table><h2>Anadia</h2><p>PLANET TYPE: Spherical earth body <br />PLANET SIZE: B <br />ESCAPE TIME: 2 turns <br />SATELLITES: 0 <br />DAY LENGTH: 12 hours <br />YEAR LENGTH: 30 days</p><p>This planet is the closest to the Sun in the Terran' system. Much of its surface cracks into gargantuan canyons that dwarf the Great Rift on Azthir-Terra. This is because the persistent heat from Anadia's proximity to the Sun keeps the equatorial regions of the planet dry and unlivable by most humanoids' standards. This heat and lack of foliage has made this small planet the perfect home for umber hulks and many other rock-eating creatures.</p><table><thead><tr><th id=\"distance/time_from:\">DISTANCE/TIME FROM:</th><th></th></tr></thead><tbody><tr><td>The Sun</td><td>50 Million Miles, 12 hours travel</td></tr><tr><td>Coliar</td><td>50-100 Million Miles, 0.5-1.5 days travel</td></tr><tr><td>Azthir-Terra</td><td>150-250 million miles, 1.5-2.5 days travel</td></tr><tr><td>Karpri</td><td>250-350 million miles, 2.5-3.5 days travel</td></tr><tr><td>Chandos</td><td>350-450 million miles, 3.5-4.5 days travel</td></tr><tr><td>Asteroid Belt</td><td>550 million miles, 5.5 days travel</td></tr><tr><td>Glyth</td><td>950-1,050 million miles, 9.5-10.5 days travel</td></tr><tr><td>Garden</td><td>1,150-1,250 million miles, 11.5-12.5 days travel</td></tr><tr><td>H'Catha</td><td>1,550-1,650 million miles, 15.5-16.5 days travel</td></tr><tr><td>Sphere</td><td>3,150 million miles, 31.5 days travel</td></tr></tbody></table><h2>Coliar</h2><p>PLANET TYPE: Spherical air body <br />PLANET SIZE: G <br />ESCAPE TIME: 12 Turns <br />SATELLITES: 0 <br />DAY LENGTH: 30 Hours<br />YEAR LENGTH: 8 months</p><p>Coliar, the second planet from the sun in the Terra Sphere, is a spherical gas giant. Because of its close proximity to the Sun, the planet is quite warm. The temperature never falls below 75 degrees except at the poles, where it can reach as low as 40 during the winter.</p><p>Inside the huge atmospheric envelope of this planet float hundreds of earth and water islands. Every 30 hours or so, they revolve around the central gravitational point of the planet, which creates day and night effects for the islands' inhabitants.</p><p>One should not be deceived into believing that all of these islands levitate at the same alti- tude. Each one floats about in its own orbit. Most islands lie between 50 miles and 30,000 miles from the planet's center. This phenomenon causes several \"eclipses\" every day for most of the islands, as higher ones pass before the Sun and cast their shadows onto the islands directly below them.</p><table><thead><tr><th id=\"distance/time_from:\">DISTANCE/TIME FROM:</th><th></th></tr></thead><tbody><tr><td>The Sun</td><td>100 Million Miles, 1 day travel</td></tr><tr><td>Anadia</td><td>50-100 Million Miles, 0.5-1.5 days travel</td></tr><tr><td>Azthir-Terra</td><td>100-300 million miles, 1-3 days travel</td></tr><tr><td>Karpri</td><td>200-400 million miles, 2-4 days travel</td></tr><tr><td>Chandos</td><td>300-500 million miles, 3-5 days travel</td></tr><tr><td>Asteroid Belt</td><td>400 million miles, 4 days travel</td></tr><tr><td>Glyth</td><td>900-1100 million miles, 9-11 days travel</td></tr><tr><td>Garden</td><td>1,100-1,300 million miles, 11-13 days travel</td></tr><tr><td>H'Catha</td><td>1,500-1,700 million miles, 15-17 days travel</td></tr><tr><td>Sphere</td><td>3,100 million miles, 31 days travel</td></tr></tbody></table><h2>Azthir-Terra</h2><img src=\"https://worldanvil.com/uploads/maps/e3bace337897962dfb28bb432d8b77ac.png\" /><p>PLANET TYPE: Spherical earth body<br />PLANET SIZE: E <br />ESCAPE TIME: 4 turns <br />SATELLITES: 1 <br />DAY LENGTH: 24 hours <br />YEAR LENGTH: 365 days <br />POPULATION: Millions of humanoids and other creatures</p><table><thead><tr><th id=\"distance/time_from:\">DISTANCE/TIME FROM:</th><th></th></tr></thead><tbody><tr><td>The Sun</td><td>200 Million Miles, 2 day travel</td></tr><tr><td>Anadia</td><td>150-250 Million Miles, 1.5-2.5 days travel</td></tr><tr><td>Coliar</td><td>100-300 million miles, 1-3 days travel</td></tr><tr><td>Karpri</td><td>100-500 million miles, 1-5 days travel</td></tr><tr><td>Chandos</td><td>200-600 million miles, 2-6 days travel</td></tr><tr><td>Asteroid Belt</td><td>300 million miles, 3 days travel</td></tr><tr><td>Glyth</td><td>900-1100 million miles, 9-11 days travel</td></tr><tr><td>Garden</td><td>1,100-1,300 million miles, 11-13 days travel</td></tr><tr><td>H'Catha</td><td>1,500-1,700 million miles, 15-17 days travel</td></tr><tr><td>Sphere</td><td>3,100 million miles, 31 days travel</td></tr></tbody></table><h2>Karpri</h2><p>PLANET TYPE: Spherical water body<br />PLANET SIZE: D <br />ESCAPE TIME: 3 turns <br />SATELLITES: 0 <br />DAY LENGTH: 1 hour, 12 minutes <br />YEAR LENGTH: 650 days</p><p>This planet is a water body in the purest form, with no islands of land to speak of. The surface of Karpri can be split into three separate sections: the frigid polar region, the clear sailing area, and the equatorial sargasso.</p><p>The planet is a truly beautiful thing when viewed from space. The Karpri sky usually is clear and bright, allowing the sun to warm the equatorial regions, raising the humidity to almost unbearable limits. This is a scene of unmistakable peace and beauty, but which belies a dangerous place.</p><p>The poles are covered in a thick ice pack hundreds of miles thick. Many types of predatory animals live and hunt here, some with limited intelligence. The weather is constantly bitter cold. The air is so frigid that it pulls the humidity right out of the air in the form of hard driving sleet. Even during the summer months, these polar regions never get above -10 degrees.</p><p>Travelers who have stopped here have complained of nosebleeds and having their shoes stick to the ice, but the predacious creatures that relentlessly track them down are the biggest deterrent to stopping on this planet. Another major problem is taking off from the ice cap once the ship has been there for a significant amount of time. When a spelljammer, coming from the relative warmth of the wildspace, lands here, the bottom of the ship temporarily melts the ice. When this melting ice freezes again, it efficiently traps the spelljammer. The only way to escape is to physically chip the ice away from the landing gear. If this is not done before the ship departs, the craft runs the risk of losing its landing gear. A saving throw vs. crushing blow is required to avoid this fate.</p><p>The creatures that make their homes near the poles are those able to withstand—or in love with—the sheer coldness this part of the planet holds: such animals as the polar bear, homonculous, cryohydra, white deadly pudding, remorhaz, ice toad, winter wolf, and yeti, as well as many more. There are even reports of a group of gnomes living somewhere on the southern polar region, eking out a miserable existence. The decimated remains of their crashed spelljammer lies directly on the pole; they still use the ship as protection, but they are also tunneling to expand their domain. They use torches of continual fire to warm their caves to almost the freezing point.</p><p>The equatorial region of the planet is a huge bed of floating seaweed and kelp thick enough and large enough to support weights exceeding a few thousand pounds, while there are plants here with leaves the size of city blocks that can support a spelljamming ship weighing up to five tons. Occasionally, these large plants are used to support a damaged ship while repairs are being made. A few lighter ships that stopped for repairs are still there, untouched and still dam- aged, their crews long ago eaten by the gargantuan insect life that lives among the plants. What the insects don't eat eventually ends up in the ocean, where predacious fish finish off the remains. Heavier ships that suffered similar fates have long sunk through the flora sargasso down to the core of the planet.</p><section class=\"secret\" id=\"secret-ap7V8wrBjmJS1yPL\"><p>The insect and arachnid life here can grow to double the largest size stated in the Monstrous Compendiums. All the damage that they inflict is also doubled, but saving throws vs. poison or spell remain the same. The most fearsome predator on the equatorial region, besides the various breeds of giant spiders, is the gargantuan praying mantis. This beast is believed responsible for the deaths of more spelljammer crews than all other predators combined.</p><p>Living within the labyrinth of seaweed, roots, and whatever else at the equator are thousands of breeds of saltwater and ocean life. The Monstrous Compendiums are a wonderful source of information for these animals. Since there is a lack of soil on this planet, the water has to supply the necessary nutrients the plants need to survive. The bacteria in the water break down waste and byproducts into their basic components for assimilation by the plants, which in turn oxygenize the water and the air. Surprisingly, although Karpri supports an abundance of aquatic and semi-aquatic life, there are only a few species of winged insects. Those breeds are the dragonflies, huge horseflies, and ladybugs.</p><p>The area between the poles and the equatorial sargasso is open water so clear that a person can see for hundreds of feet down. There are no surface plants or land masses to land a spelljammer on, so the only ships that can land safely are those with the capacity to float.</p><p>Within the depths of the clear sailing zones live schools of telepathic dolphins, which speak only with the other animals living in their oceans. Deep within the heart of Karpri is a group of creatures known as the Eye of the Deep. These fearsome beasts are nothing more than a breed of beholder adapted for life in the depths of the salty oceans. Luckily, they do not approach the surface of the oceans often, or else they would be the only creature left on the planet. These beholderkin prefer to live in the husks of sunken spelljammers. A sage once hypothesized that there must be hundreds of ships at the bottom of the Karpri oceans.</p><h3>Important NPCs</h3><p>Name: Wizpop Occupation: Leader of the <a href=\"https://www.dndbeyond.com/monsters/2821155-autognome\">Autognome</a> Encampment, Southern Ice Cap</p><pre><code>monster: Autognome\n</code></pre><p>Wizpop and six other autognomes have survived on the polar cap since their ship, the <em>Rambling Whirligig</em>, crashed hundreds of years ago. Wizpop (whose name is etched in Gnomish on a little brass plaque bolted to their chest) suffered vocal cord damage as well as other structural damage. The autognome has 6 hit points remaining, can’t speak, and makes occasional whirring, hissing, and popping noises. Wizpop stops making these strange noises and regains the ability to speak once all their hit points are restored.</p><p>A character can try to repair Wizpop using spare autognome parts and tinker’s tools. To find the right parts, a character must spend 10 minutes searching through debris on the Hollow Deck and succeed on a DC 15 Intelligence (<a href=\"https://www.dndbeyond.com/compendium/rules/basic-rules/using-ability-scores#Arcana\">Arcana</a>) check. Once the parts are found, a character who is proficient with tinker’s tools can use the parts and the tools to make repairs. At the end of each hour of repairs, Wizpop regains 1d6 hit points.</p><p><strong>Quote:</strong>“\_<em>Hsssssshhh….pop..whirrr.. shsss…pop!”</em>\_[shudders in fear]”</p></section><h2>Chandos</h2><h2>Asteroid Belt</h2><p>PLANET TYPE: Thousands of small planetoids <br />PLANET SIZE: Vary in size from a pebbles to several hundred miles in diameter <br />ESCAPE TIME: N/A <br />SATELLITES: N/A DAY LENGTH: N/A <br />YEAR LENGTH: About 7.5 years depending on exact distance from the Sun <br />POPULATION: 1 - Topolah</p><section class=\"secret\" id=\"secret-7TmpCdpelak004zQ\"><p>This belt of (mostly) abandoned rocks is all that remains of a planet, lost aeons ago to some cataclysm. If the party chooses to explore some of the larger rocks, other than Topolah's, roll a 1d100. On a roll of 1 or 100, the find some evidence of what once was. A small bit of silverware stuck in the rock, a bone or fossil entombed in the stone. Perhaps a piece of building jutting out. There's nothing really of value, but it should communicated loss, age, and cataclysm.</p><h3><a href=\"https://www.dndbeyond.com/sources/sais/lox/terrors-of-the-void#TopolahsTower\">Topolah's Castle</a></h3><p>As the player approach the asteroid, read the following:</p><pre><code>title: Read Aloud\ncollapse: open\nicon: horn-call\nA crooked tower perches atop a small asteroid, surrounded by a cloud of twinkling cosmic dust. There's a decrepit wooden pier jutting from one side of the rock.\n</code></pre><p>Assuming the players approach, read the following:</p><pre><code>title: Read Aloud\ncollapse: open\nicon: horn-call\nScores of pelicans, mollymawks, and smaller birds nesting on the asteroid squawk as you approach the rickety dock. At the end of the dock, two gray, shark-like creatures fight over the remains of a pelican.\n\nA woman with frayed robes and bare feet sits in a rocking chair at the base of the tower watching the fracas, her face half hidden by a wide-brimmed hat that has a blue jay perched on it. The woman leaps to her feet, brandishes a staff, and snarls, “Go on, git!” A fiery ray springs from her fingertip, frightening away the shark-like creatures.\n</code></pre><p>The rest of the encounter can be lifted from the Light of Xaryxis's adventure.</p></section><h2>Glyth</h2><h2>Garden</h2><h2>H'Catha</h2><h2>Sphere</h2>"
