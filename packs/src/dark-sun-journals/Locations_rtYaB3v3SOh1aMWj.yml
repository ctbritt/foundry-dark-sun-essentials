  - name: A'Lantean
    type: text
    sort: 1000
    _id: UKWQ14zV2y1NRRYK
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <img src="s3/artwork/spelljammer/dead%20god%20cropped.webp"
        style="-webkit-mask-size:100%
        100%;-webkit-mask-image:url('../modules/simple-quest/assets/mask/mask1.webp');object-fit:cover;border:none;border-radius:5px;width:100%"
        /><p>A'Lantean is an almost empty system … except for the body of a
        gigantic god floating in it. The star is a type K large star and the
        body of the god -- who knows what god it is? -- floats 93 million miles
        away from the central sun. it's not a big system, as the god is the only
        celestial body in the system.</p><section class="secret"
        id="secret-Iv3BRPnczxFLAEmD"><p>If the party decides to investigate
        further, give them this description:</p><blockquote><p>In the cold,
        infinite expanse of space, a dead god floats. It is a being of immense
        size, its twisted and gnarled body seeming to stretch on for eternity.
        Its skin is a sickly, pale hue, and its eyes are sunken and lifeless.
        Yet despite its death, you feel a sense of dread and unease. Its aura is
        palpable, a sense of malevolence emanating from its cold, dead form. As
        you gaze upon it, you are filled with a creeping sense of horror, as if
        the very sight of the dead god is enough to drive one mad.</p><p>You
        think to yourselves that the dead god is a reminder of the fleeting
        nature of life and the ultimate power of death. It is a being to be
        feared and avoided at all costs, for it is a creature beyond human
        comprehension, a being that exists outside of the realm of mortals, a
        testament to the limits of human understanding and the infinite
        mysteries of the cosmos. It is a sight to behold, but one that is best
        left to the imagination.</p></blockquote></section>
