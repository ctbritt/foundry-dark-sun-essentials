  - name: Athas
    type: text
    title:
      show: false
      level: 1
    text:
      format: 1
      content: >-
        <section class="secret" id="secret-jGO5lQXmm0tqHlFI"><p><a
        href="http://www.spelljammer.org/worlds/CrimsonSphere/" target="_blank"
        rel="noopener">Athas of the Dark Sun.</a> Rickvon's homeworld, now
        ecologicially ravaged.</p></section><p><span class="drop-cap">T</span>he
        sphere of the Dark Sun is massive, or perhaps it seems massive. Between
        the outermost world and the spherewall is the Black Gulf, a cold, dark
        region that takes no less than two months to cross. The Black Gulf is
        haunted by unimaginable horrors; most ships that attempt to cross it are
        never heard from again. Those that survive speak of almost constant
        attacks, their ships torn and near ruin.</p><p>The spelljamming cultures
        of the Crimson Sphere are quite primitive. If anything, resources are
        scarcer than on Athas itself. The largest cities are ruled over by
        terrible sorcerer kings who construct armadas from the husks of gigantic
        insects. They battle over rare verdant asteroids and tiny caches of ever
        precious iron. Always in the shadows are the illithids, awaiting the
        time when the might of the sorcerer kings fail and they can sweep over
        the cities, expanding their rule.</p><p>The ships of the Crimson Sphere
        are small asteroid-hoppers powered by psionic helms or terrible
        lifejammers; true spelljammer helms are unheard of. Catapults and
        ballistae are rare devices, highly coveted but impossible to repair.
        Ships from other spheres, such as hammerships, are unknown. If one were
        found, it would be a one-of-a-kind, a relic to be fought over until it
        falls apart from lack of repairs, for none would know how to or have the
        materials to properly repair such a craft. Most ships cannot survive a
        landing on a large world, as their hulls are too fragile for such things
        and their helms too weak to escape the pull of large
        planets.</p><h2>Worlds of The Crimson
        Sphere</h2><h3>Sun</h3><p><strong>Size I Spherical fire
        body</strong></p><p>The sun of the Crimson Sphere is a large, hot red
        fiery orb at the heart of the sphere. Ancient texts once described it as
        either a hot blue or a hot yellow sun, long ago. What manner of magic
        that darken the sun is unknown, but the illithids are extremely
        interested in it. If they can darken the sun more, they will no long be
        adversely affected by its light, and their power will
        increase.</p><p>For all the mystery surrounding the sun, very little is
        found there. It is a barren wasteland of fire. Neither cities of
        effreti, or azer, nor any intelligent creature that makes fire its home
        dwell upon the sun. Although the sun is quite barren, occasionally some
        creatures have been found, such as elmarin, lavaworms, and the
        occasional focoid.</p><h3>Cinder</h3><p><strong>Size C Spherical earth
        body</strong></p><p>Cinder is all that is left of an unnamed inner world
        that was consumed by the sun. It orbits barely an hour’s journey outside
        the sun’s corona. So close is it that Cinder is occasionally charred by
        solar flares.</p><p>The planet is tidally locked. On the far side of
        Cinder, facing away from the sun, is a patch of habitable land maybe 90
        miles in diameter. This grassland gives way to thin mountain forests at
        the center. This is the domain of the city-state of Mahda. The ruler of
        this city-state is said to be an undead creature, his body charred and
        burned beyond recognition. He uses his subjects as cattle for his
        experiments.</p><h3>Athas</h3><p><strong>Size E Spherical earth body, 2
        moons</strong></p><p>The world of the Dark Sun, Athas is a desert world.
        It is the primary world of the sphere, and is detailed extensively in
        the Dark Sun line of products from TSR.</p><p>Few ships visit Athas
        these days. Even ships from the Crimson Sphere rarely visit Athas, for
        the dangers of such a trip almost always outweigh any benefit. The moons
        of Guthay and Ral are slightly more inviting, but have thin atmospheres.
        A few slave villages can be found on Guthay, well-hidden in deep caves.
        The illithids are interested in establishing bases on the moons, but
        their efforts are always foiled by the sorcerer-kings.</p><p>Behind
        Guthay is the city-state of Sentinel. It orbits Guthay in a stable
        fashion that always keeps the city hidden from Athas. Sentinel is a
        disc-shaped city with strong walls and shelters to last a year-long
        siege. Rajaat built it as a last line of defense against any invasion of
        Athas from other worlds. The Warden-King of Sentinel is Dabi, the Shield
        of Rajaat. He was the most trusted of Rajaat’s Wardens, but was quickest
        to betray his master. Dabi attempted many short-cuts to become a full
        dragon, and was horribly deformed by the process.</p><h3>The
        Sextant</h3><p><strong>Size A to B Asteroid belt</strong></p><p>In the
        ancient texts, this thin asteroid belt was a whole world. It shattered
        long ago in some unrecorded disaster. Today the asteroids are found in
        six clusters that share roughly the same orbit. Most of the asteroids
        are barren rocks with thin atmospheres, unsuitable for habitation. A
        few, maybe one in every twenty, has enough air and water to support
        plant life. The rare verdant asteroids amount to the bread-basket of
        spelljamming cultures in the Crimson Sphere. These prizes are fiercely
        fought over by the city-states and raided for slaves by the
        illithids.</p><p><strong>Shard Islands</strong> – The largest cluster is
        the Shard Islands. The asteroids are the domain of the city-state of
        Hopa. Nearby asteroids are farmed and fiercely protected by the Hopa
        navy.</p><p><strong>Verdant Stones</strong> – The city-state of Nijhal
        is found at the heart of this, the most prosperous cluster. There are
        dozens of farmable asteroids, worked by slaves of Nijhal. The cluster is
        well-patrolled by Nijhal’s navy.</p><p><strong>Cursed Cluster</strong> –
        This cluster is dotted with hundreds of abandoned villages. Ravishes by
        battles between the invaders and the Wardens, the Cursed Cluster has
        been stripped of all life.</p><p><strong>Far Clutch</strong> – Most
        distant of the clusters from the major cities, the Far Clutch sees
        little trade. As such, it is a popular hiding place for escaped slaves.
        The illithids have begun to prowl the Far Clutch for new sources of
        slaves.</p><p><strong>Salt Shoals</strong> – The ruins of an unnamed
        city-state are buried somewhere in this cluster. The Warden-King of the
        city defied Borys, who ordered the city destroyed and the land salted as
        a lesson to those that would defy his power.</p><p><strong>Gray
        Reef</strong> – Found between the Shoal Islands and the Verdant Stones,
        the Gray Reef is a warzone. Ships from both city-states stalk each
        other. Free villages are becoming few and scattered as they fall
        one-by-one to one power or another.</p><h3>K’ydon</h3><p><strong>Size C
        Spherical earth body</strong></p><p>A dwarf of a world far beyond the
        Sextant, K’ydon has much in common with Athas. Both are dry, desert
        worlds with little life and scarce resources. K’ydon is a cold desert
        with long winters and short summers. Water can be found trapped in the
        permafrost tundra, but is difficult to tap.</p><p>K’ydon’s most
        remarkable feature is the city-state that shares the same name. It is
        ruled by the ruthless Warden-Queen Hu. The city is marked by a
        five-sided ziggurat, a solid stone fortress, and a market square. It is
        found on the equator in the shadow of four great
        hills.</p><h3>Rajaat</h3><p><strong>Size F Spherical air body, 3
        moons</strong></p><p>The largest planet in the Crimson Sphere was named
        by the Wardens for their master. It is a dark, cold, ash-choked air
        world devoid of life. The interior is unexplored but probably hides
        ships lost during the Cleansing War as several battles were fought above
        Rajaat’s clouds.</p><p>The moons have been conquered by invaders from
        other spheres. Prime of these are the illithids, who rule from their
        throne-world of Th-ki-chu. Slaves toil away in mindless bliss in caverns
        under the illithid fortresses. The ruins of dozens of these fortresses
        dot the surface of Th-ki-chu, casualties of the Cleansing War. Such was
        the destruction that even after two millennia, the illithids are but a
        fraction of their numbers when they first invaded the sphere. Other
        moons include the remains of Hejin, a broken moon haunted by undead
        beholders, and At-ur, the obsidian moon.</p><h3>Black Gulf</h3><p>Just
        beyond Rajaat is the dreaded Black Gulf, the region that divides the
        worlds of the Crimson Sphere from the spherewall. The Black Gulf has
        swallowed many ships that have dared to venture into its inky depths.
        From the accounts of those that survived trips into this forsaken region
        give a terrifying account.</p><p>At first, light begins to dim all
        around the ship. After two days, the stars twinkle out. After the fifth,
        the sun is no longer visible. Light from candles and lanterns dim, as if
        oppressed by some unseen shadow. Always one feels as if he is being
        watched. That is when the attacks begin. At first, lone watchmen at
        attacked by unseen creatures. Then the attacks intensify. After the
        tenth day, the attacks come hourly. While light can drive the strange
        creatures away, they can summon darkness at will, snuffing out any light
        source. Some creatures are so strong they can rend metal and rip off and
        carry away whole sections of ships. After many days, if the ship and
        crew have survived to this point, they escape the Black
        Gulf.</p><h3>Spherewall</h3><p>The spherewall is believed to give the
        Crimson Sphere its name, as it is very dark red in color from the
        inside. It has a rough texture, as if like sand, and cold to the touch.
        Standard portal spells work on the spherewall, but any metal that
        travels through the spherewall has a 75% chance of changing to
        stone.</p><p>The Stars appear to be great fires just behind the
        spherewall, burning furiously to escape from some crystal prison.
        Strangely, the starlight can be seen through the Black Gulf from the
        planets, but those that travel within the Black Gulf cannot see the
        starlight.</p><h2>Additional Astronomicals</h2><h3>The Dead
        Forest</h3><p>Somewhere near the Shard Islands is this lost forest of
        dead, butterfly-like trees. The trees, once magnificent and vast, are
        black and shriveled. Strangely, all have interior hollows, as if they
        were once used as dwellings.</p><h3>The Fallen Forge</h3><p>This rouge
        asteroid is perhaps 1000’ in diameter. A great dwarven face is carved
        into one side of it. Tunnels and chambers run through the heart of the
        asteroid’s heart, as if built by dwarves of great skill. Despite many
        centuries of looting, the Fallen Forge still yields treasure from time
        to time, such as gold, gems, and even precious steel
        weapons.</p><h3>Forlorn Sargasso</h3><p>Found not far from the edge of
        the Black Gulf is this strange collection of ancient ships. A terrible
        battle was fought here, one that left almost fifty ships smashed and
        ruined. Due to the defiling magic unleashed during the battle, nothing
        from the ships could be salvaged; all wood, metal, and weapons crumble
        to dust when touched.</p><h3>The Messenger</h3><p>A legendary comet that
        made a regular, 45-year cycle around the Crimson Sphere, the Messenger
        has mysteriously vanished. Strangely, even before the Messenger
        disappeared, none could approach it. Those that tried were never heard
        from again.</p><h3>Paradise Forlorn</h3><p>According to legend there is
        an asteroid with groves of fruit trees, water in fountains, and lost
        caches of steel weapons. This paradise is a false one, for the asteroid
        will seek to devour any that would dare tread upon
        it.</p><h3>Suntree</h3><p>The home for space-dwelling thri-kreen is the
        Suntree, probably the largest tree in all of the Crimson Sphere. It is
        several miles tall and orbits close to the Sun. It is immune to defiling
        magic, and even resists preserving magic as well.</p><h3>City-States of
        the Stars</h3><p><strong>City-State of Hopa</strong> – The asteroid that
        Hopa is built upon is shaped like a great coin, about five miles in
        diameter and 1000’ thick. Dwellings are built not upon the surface of
        the coin, but in shallow caves in the cliffs. The top and bottom of the
        coin is extensively farmed. The individual dwellings can be easily
        fortified, making invasion difficult. A network of tunnels makes the
        whole city a well-defended fortress.</p><p><strong>City-State of
        K’ydon</strong> – this city is ruled by the ruthless Warden-Queen Hu.
        Her seat of power is a five-sided ziggurat. Regular sacrifices to her
        are made at the dawn of each day. Depending on the day, these sacrifices
        range from fruit to roasted animals to sentient beings. After dawn
        sacrifice, the citizens begin their daily activities. The heart of the
        city is a market square, where anything can be bought, for a price.
        Above the city, on a high, steep-cliff hill is Fortress Soom, which
        guards the approaches to K’ydon.</p><p><strong>City-State of
        Nijhal</strong> – Found at the heart of the Verdant Stones is Nijhal,
        the Jewel of the Sextant. The city sits at the top of a hill on a large
        asteroid, surrounded by sparse hills. It is in a constant state of
        turmoil as various races clash over petty issues. The ruler of Nijhal is
        the Warden-King Husam, who ruthlessly seized power ten years ago. He
        keeps the various factions at each others’ throats instead of his own in
        a bid to hold on to power. Nijhal has seen more than one hundred coups,
        each just as bloody as the last.</p><p><strong>City-State of
        Mahda</strong> – The shadow of Cinder protects this city-state. It is
        surrounded by a hot jungle that seems to press down on the city like a
        siege. The templars are frantically searching the sphere for anything
        that will heal their Warden-King Arun, who was burned horribly in
        battle. Arun takes his frustrations out on his people, ordering random
        executions.</p><p><strong>City-State of Sentinel</strong> – Hidden from
        view from Athas by Guthay, Sentinel is a large, fortified city. It is
        shaped like a great ziggurat, 10 miles per side and 3 miles tall.
        Buildings are along the nine ledges, with the poorest citizens living at
        the bottom ledge and templars living at the top ledges. Dabi, the
        Warden-King of Sentinel, has not been seen in over a century, and some
        suspect he perished.</p><h2>History of the Crimson Sphere</h2><p>It is
        not known what the Crimson Sphere was like prior to the Cleansing War.
        Fragments of ancient star charts hint at a prosperous family of planets,
        perhaps even ports and civilization beyond Athas. Much like on Athas,
        the Cleansing War swept over the rest of the sphere like an encroaching
        plague. Rajaat knew well that the Cleaning War would attract those
        seeking to take advantage of the warfare to their own ends, not his own.
        To counter the threat from other worlds, Rajaat anointed twelve Wardens.
        One by one, each Warden constructed a great ziggurat. In each of these
        ziggurats was placed one of the twelve Shards of the Zodiac. At the
        zenith of each zodiac, a ziggurat lifted into the sky and disappeared
        into the night. Each bore a great army within their stone halls, led by
        their Warden captains.</p><p>As Rajaat foresaw, the start of the
        Cleansing War caught the attention of beings from other worlds. Alien
        creatures, known elsewhere as illithids and beholders, sent their agents
        and fleets. Others came as well, such as the elves of the Imperial
        Fleet, pirates from a hundred spheres, and countless petty warlords. The
        Wardens battled them all, leaving much destruction in their
        wake.</p><p>Sometime during the 162nd King's Age, the Wardens' defense
        of Athas was on the brink of collapse. Fearful of being overrun, they
        brought about the Black Gulf to cut off the reinforcements of their many
        enemies. The tactic worked all too well; the invaders' supply lines were
        severed, but no one, not even the Wardens themselves, could escape the
        Crimson Sphere.</p><p>The Wardens played little part in Borys' rebellion
        against Rajaat. Indeed, so focused were they on destroying the last of
        the invaders that the event passed them by without them even knowing it.
        Not until the 170th King's Age did they learn of Rajaat's imprisonment,
        when they were approached by Borys. The Wardens were given a choice:
        side with Borys, or be destroyed. Those that sided with Borys gained
        great power that in time became not unlike that of the sorcerer-kings.
        Those that did not perished. Borys instructed the Wardens to continue
        their vigilance against the surviving invaders. The Wardens each claimed
        a city-state and began two millennium of petty warfare against one
        another.</p><h3>Warden-Kings and Their Subjects</h3><p>The Warden-Kings
        are not unlike the Sorcerer-Kings of Athas. Most are dragon-like
        creatures that grant spells to Templar followers. Unlike the
        Sorcerer-Kings, the Warden-Kings are limited in their power, held in
        check by the Shads of the Zodiac (see
        below).</p><p><strong>Arun</strong> – This Warden-King was horribly
        burned in battle decades ago. Although his flesh was greatly damaged, he
        did not die. He locked himself away in his city to slowly heal. His
        injuries are magical in nature, and cannot be healed through time.
        Instead, he must rely on rare herbs and powerful healing magic to
        restore himself. His templar are frantically searching the whole Crimson
        Sphere for the magic needed to heal their Warden-King. Those than return
        empty-handed are executed. Powerful spells keep the templars bound to
        Arun and prevent them from simply fleeing the
        city.</p><p><strong>Dabi</strong> – This defiler was the greatest and
        most powerful of the Wardens, such that Rajaat named him his “Shield”.
        From the city of Sentinel Dabi directed the defense of Athas against the
        invaders. After becoming a Warden-King, Dabi attempted to take
        short-cuts to become a full-fledged dragon. His attempt failed
        miserably, and is now a terribly deformed, yet powerful and dangerous,
        creature. His templars keep Dabi secluded in the catacombs of his
        ziggurat, tending him in hopes that he will recover his
        sanity.</p><p><strong>Hananka</strong> – Called the Warrior-Warden by
        his followers, Hananka is the strongest and most ruthless of the
        Warden-Kings. He is unafraid to board his personal warship, a
        fully-armed hammership, and lead his powerful navy into battle himself.
        Hananka has a personal hatred of illithids, creatures he distastes
        greatly. At the edges of his city, Hopa, hundreds of illithid skulls
        have been placed on pikes, a sign to invaders that Hananka will never
        stop fighting them. Three Shards of the Zodiac have fallen into his
        possession.</p><p><strong>Hu</strong> – The so called “Queen of a
        Thousand Faces”, Hu is a most terrible queen. Every year she selects the
        most beautiful girl in her city and drains that girl of all life and
        beauty. Hu takes the face of the girl she just murdered and wears it for
        a year. She ages rapidly, such that by the end of the year, she appears
        to be in her 80’s. Hu is the most brutal of the Warden-Kings, subjecting
        her people to harsh and unyielding rule. Her city is K’ydon, the most
        distant and isolated of the City-States, and has thusly been on the
        frontline of the war against the Invaders for many, many
        centuries.</p><p><strong>Husam</strong> – This king seized power roughly
        10 years ago, claiming Nijhal’s symbol of authority, a black obsidian
        sword known as Slayer. He is an aggressive, ambitious king who seeks to
        expand his rule at the expense of other city-states and to crush the
        invaders, once and for all. Husam is not what he seems. In truth, he has
        been possessed by Slayer, a magical blade forged by Rajaat himself. Long
        ago, the Warden who first wielded it perished, but he transferred his
        essence into the sword. He then possesses those who would attempt to use
        Slayer, and masquerades as that warrior. Slayer encourages bloody coups
        so that only the strongest warriors will try to “claim”
        him.</p><p><strong>Zol</strong> – This preserver has the distinction of
        being the only (known) creature to have escaped the Crimson Sphere and
        managed to return. He left the sphere believing that the means to save
        Athas lay somewhere in other spheres. After many centuries of searching,
        Zol has come to believe that the key to Athas’ salvation is to be found
        on Athas itself, not in some distant sphere. He has only recently
        returned, and has not yet returned to Athas itself. Zol is a partially
        transformed preserver metamorphosis, having achieved only a low
        metamorphosis stage.</p><h2>Peoples of
        Crimsonspace</h2><p><strong>Aarakocra</strong> – Despite the vast open
        spaces of the void, the confining nature of small air envelopes do not
        provide the space these wind-loving creatures desire. All aarakocra in
        space have been brought there against their
        will.</p><p><strong>Dwarves</strong> – The strong backs and
        single-minded devotion dwarves possess proved desirable to the Wardens,
        so they brought many dwarves with them into space. Dwarves can be found
        in any of the cities and villages throughout the
        sphere.</p><p><strong>Elves</strong> – The confined conditions of
        asteroids and ships is too much for the plains-loving elves of Athas, so
        very few of them make it into space. Elves tend to seek out their own
        kind and form wandering, gypsy-like clans. These clans are not
        well-liked, but tolerated for the entertainment they
        bring.</p><p><strong>Halflings</strong> – Halflings are virtually
        unknown in space. They feel extremely uncomfortable when taken off of
        Athas, as if they don’t belong. After a while, they become jumpy and
        agitated a feeling that stays with them until they are returned to
        Athas.</p><p><strong>Half-Giants</strong> – These enormous creatures
        would not ordinarily be expected to be found in large numbers in the
        confined spaces aboard ships. Yet the great strength of these creatures
        has earned them a place in the Crimson Sphere as shock troops for the
        armies of the Warden-Kings.</p><p><strong>Humans</strong> – Humans make
        up the majority of the people in the Crimson Sphere. They are found
        everywhere that one can find civilization. A few are descendants from
        humans from other spheres; such people must hide their heritage, as they
        are greatly hated by the natives. These “invader-spawn” are a convenient
        scapegoat for the Warden-Kings.</p><p><strong>Muls</strong> – Many muls
        work as slaves and gladiators in all of the city-states. They are
        considered property and have no rights, although rare muls have been
        able to win freedom if they prove themselves in the
        arena.</p><p><strong>Ptreen</strong> – Almost non-existent beyond Athas,
        the few ptreen in space keep to themselves. They avoid city-states and
        most villages. It is suspected they have their own villages carefully
        hidden somewhere in the sphere, but thus far none have been
        found.</p><p><strong>Thri-Kreen</strong> – The center of thri-kreen
        civilization in space is the Suntree, a large free-floating tree
        orbiting close to the sun. The kreen are welcomed in the city-states,
        but tend to be isolated in ghettos of their own people.</p><h2>Ships of
        the Crimson Sphere</h2><p>There are few variations of ships in the
        Crimson Sphere. Shortages of wood and tools have forced most travelers
        to use the carcasses of giant insects and other creatures. Ships from
        other spheres might be encountered, but they will be unique in the
        sphere. The ships presented below represent the most common craft flown
        in the sphere.</p><p><strong>Dragonfly</strong> – Tonnage 5 tons, Hull
        Points 5, Crew 1/5, Maneuvering Class C, Landing – Ground only, Armor
        Rating 9, Saves As thin wood, Power Type Psijammer, Cargo 2 tons, Keel
        30’, Beam 15’.</p><p>The thri-kreen make use of this small, unusual
        ship. The hull is the carcass of a giant insect while the wings are an
        unusual, paper-like material that the thri-kreen can make. Dragonflies
        travel in packs, as they are easy prey otherwise. Use the standard
        deckplan of a dragonfly, with the following modifications: remove the
        ship weapon and cargo hold, reduce the dimensions of the forward half of
        the ship to 30’ by 15’, and remove the stairs to the upper deck.
        Thri-kreen simply jump to get to the top
        deck.</p><p><strong>Eel</strong> – Tonnage 15 tons, Hull Points 15, Crew
        4/15, Maneuvering Class C, Landing – Water only, Armor Rating 8, Saves
        As thin wood, Power Type Psijammer, Cargo 8 tons, Keel 110’, Beam
        15’.</p><p>The eel is a fairly common tradesman in the Crimson Sphere.
        It is the one ship that can still be built, even if pieces of chitin are
        used instead of wood. All eels are unarmed, by order of the
        Warden-Kings. Use the standard deckplans of an eelship, except removing
        the weapons.</p><p><strong>Lamprey</strong> – Tonnage 15 tons, Hull
        Points 15, Crew 6/15, Maneuvering Class D, Landing – Water only, Armor
        Rating 7, Saves As thin wood, Power Type Psijammer, Cargo 8 tons, Keel
        100’, Beam 20’.</p><p>Primary vessel of the illithid nations, the
        lamprey is a ship made from bones and chitin. It is indeed a terrible
        vessel to behold, decorated with human skulls and human-skin sails. A
        medium weapon is carried, firing forward. Other weapons are removed from
        the standard lamprey deckplan, as the illithids do not have the
        resources to properly outfit such craft. The grappling ram is likewise
        removed, making room for slave quarters at the bow of the
        ship.</p><p><strong>Lesser Ziggurat</strong> – Tonnage 90 tons, Hull
        Points 90, Crew 6/90, Maneuvering Class F, Landing – Ground only, Armor
        Rating 1, Saves As stone, Power Type Lifejammer, Cargo 25 tons, Keel
        80’, Beam 80’.</p><p>The lesser Ziggurat is pyramid-shaped and serves as
        the battleship of the Crimson Sphere. The interior is largely hollow
        with a much smaller pyramid at the center, from which the Templar
        commands his minions. A small army is carried aboard a lesser Ziggurat,
        up to six hundred men. Use the standard deckplans for the Flying
        Pyramid, removing all by four heavy ballistae and sealing most of the
        gun ports.</p><p><strong>Scarabship</strong> – Tonnage 15 tons, Hull
        Points 15, Crew 6/15, Maneuvering Class C, Landing – Ground only, Armor
        Rating 8, Saves As bone, Power Type Lifejammer, Cargo 12 tons, Keel 75’,
        Beam 20’.</p><p>The Scarabship is another ship made from the chitin hide
        of a colossal insect, except made from a beetle. It has a pair of wings
        to improve maneuvering, but rarely armed. It is commonly used to carry
        important cargo or as a transport for troops. Use the standard deckplans
        for the scorpionship with the following modifications: remove all ship
        weapons including the claw rams, remove the tail, and shorten the legs
        to one-quarter the original length.</p><p><strong>Scorpionship</strong>
        – Tonnage 15 tons, Hull Points 15, Crew 6/15, Maneuvering Class D,
        Landing – Ground only, Armor Rating 7, Saves As bone, Power Type
        Lifejammer, Cargo 12 tons, Keel 75’, Beam 20’.</p><p>The Scorpionship is
        made from the chitin hide of a colossal scorpion. Wooden decks have been
        installed, but conditions can be cramped. The only armament of these
        ships is their claws, which are kept operable by wooden gears. A pair of
        half-giants operates the claws. The lifejammer is kept in the head of
        the scorpion and watched over by a third half-giant or other strong
        guard. Use the standard scorpion deckplans for this ship, modifying by
        removing the ballista and catapults.</p><h2>Artifacts and
        Helms</h2><p>There are only two types of helms commonly found in the
        Crimson Sphere: the psijammer and the lifejammer. Standard spelljamming
        helms are almost unique artifacts, rare to the point of
        myth.</p><p><strong>Psijammer</strong> – the psijammer helm is the
        lesser of the spelljamming helms. It is a throne-like stone chair made
        to tune into psionic energy. A creature that can use psionic abilities
        can use the psijammer. A helmsman sits in the chair and expends 1 PSP
        (3e: Power Points) for every five tons of the ship per every hour he
        uses the helm. Thus, the helmsman must expend 4 PSP per hour to fly a
        20-ton ship. The psijammer has an upper limit of 25 tons, and moves a
        ship at the rate of 1 ship’s rating for every 4 levels of the
        helmsman.</p><p>Landing a ship using a psijammer is very tricky, as
        gravity puts great stress on the helmsman. For every size category of
        the planet, double the PSP cost. Thus, to land on Athas using a 15-ton
        ship, it requires 96 PSP. That is, base cost of 3 PSP doubled 5 five
        times for the size E planet. If the helmsman lacks the PSP, the ship
        crashes.</p><p><strong>Lifejammer</strong> – the lifejammer is the most
        powerful spelljamming device common to the Crimson Sphere. It is a
        terrible device of black stone and defiling magic. When a humanoid
        creature is placed in the throne-like chair, it steals from him life to
        fly a spelljammer. The helm drains away 1 point of constitution per
        every 8 hours the victim is confined to the chair; those drained to 0
        points of constitution perish and cannot be revived. The loss of
        constitution is permanent. A lifejammer can power a ship of up to 100
        tons at the speed of 1 ship’s rating per every 3 levels or HD of the
        victim in the helm</p><h3>Shards of the Zodiac</h3><p>This artifact is
        said to have originally appeared as a midnight-back orb fitted with
        diamonds that represented the 12 zodiac creatures. It was shattered into
        twelve pieces, once for each zodiac. Possession of a shard provides
        great power onto the owner. In effect, a shard can be used, given time,
        research, and much ceremony, to turn the owner into a dragon. It took
        the Wardens at least three centuries to discover the process to turn
        themselves from powerful beings into full-fledged Warden-Kings,
        contemporaries to the Sorcerer-Kings of Athas. It is suspected that the
        aide of Borys is required for the process to be successful. Fortunately,
        the Warden-Kings are limited in the growth of their power; to advance,
        they need an additional shard. In theory, if all 12 shards were
        recovered by a single Warden-King, he could potentially become a dragon
        even more powerful than Borys. Such an event is highly unlikely, since
        the Warden-Kings have searched franticly for the missing shards and have
        turned up nothing in the last 2,000 years.</p>
