      content: >-
        <div class="page" title="Page 63"><div class="layoutArea"><div
        class="column"><p>This distinctive space landmark is a huge crystal
        sphere dominated by a pair of very large, deep red fire
        worlds.</p><p>Lying between human- and illithid-dominated areas. Redeyes
        has often been a battleground. It is littered with salvageable space
        debris because only the desperate or very well-armed come
        scavenging.</p><section id="secret-IBWFGk6MgdiZp5lU"
        class="secret"><p>Redeyes is home to at least one rogue
        @Compendium[shareddata.ddb-monsters.2ASXzkHp0fFzJUcG]{Death Tyrant},
        lots of scavvers, and cinnamon-brown, red-eyed space-stirges (identical
        to normal stirges, but unaffected by temperature changes or fouled air),
        and a host of human and humanoid reavers.</p><p>Few Redeyes raiders have
        enough treasure to be worth fighting. Many trading guilds, secret
        societies and military brotherhoods, however, make venturing into
        Redeyes (and bringing back a space-stirge corpse as proof) an initiation
        rite.</p></section></div></div></div>
