    text:
      format: 1
      content: "<p>The Forest Ridge’s eastern marches are protected by a\_chain of colossi half buried in the jungle, great statues\_that\_ anchor an ancient primal ward against defiling magic.\_Halfling shamans say that their ancestors created the\_ward to\_ safeguard their homeland from the ravages of the\_Cleansing Wars, and that to this day the defiler kings of\_the\_ lowlands cannot defeat it. If the ward still functions,\_it does not appear to prevent typical defiling magic from\_working.\_ However, defilers in the Forest Ridge often find\_that the jungle turns against them. Savage predators,\_ carnivorous plants, and deadly snares beset those who use\_defiling magic in the Forest Ridge.</p>"
