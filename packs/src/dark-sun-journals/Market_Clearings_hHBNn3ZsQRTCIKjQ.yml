    text:
      format: 1
      content: "<p>The oba rules over an essentially closed economy. While citizens</p>\n<p>may freely exchange goods with one another, outsiders are</p>\n<p>faced with a daunting body of regulations and barriers to trade</p>\n<p>within the city.</p>\n<p>The oba owns all property in Gulg. The internal market is</p>\n<p>seen simply as the natural redistribution of the oba\x92s property.</p>\n<p>The templars evaluate the productive capacity of each dagada</p>\n<p>and client village, and assess a certain quantity of grain and</p>\n<hr />\n<p>The City Market</p>\n<p>The internal, or city, market takes place every five days in the</p>\n<p>market clearings of the city. Sellers arrive early to sweep the</p>\n<p>ground where they will spread out their wares. Craft dagadas</p>\n<p>usually send one member to sell the surplus goods they have</p>\n<p>manufactured. The sellers erect awnings of brightly-colored</p>\n<p>cloth\x97the traditional sign of a vendor\x92s stall in Gulg. Buyers</p>\n<p>negotiate vigorously before settling a trade in either barter or</p>\n<p>ceramic pieces. Bards can be found performing at some of the</p>\n<p>clearings until dusk, when all of the markets shut down.</p>\n<p>With the exception of the high sun and low sun festivals,</p>\n<p>there are no customs restricting trade on non-market days. On</p>\n<p>any given day, individual sellers can be seen sitting at busy</p>\n<p>crossroads with a small supply of goods. In the evenings there</p>\n<p>are a few sellers in the clearings (though no more than three in</p>\n<p>any location) with necessities that one may have run out of or</p>\n<p>forgotten to purchase on market day. Loaves, wine, sugar, grain,</p>\n<p>and hot coals can always be found here.</p>\n<p><img src=\"data:image/png;base64,\" /></p>"
