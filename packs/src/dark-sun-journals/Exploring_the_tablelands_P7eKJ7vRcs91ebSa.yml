      content: "<p>“Beyond Tyr, who knows what we’ll meet? Maybe earth\_quakes, scouring sand squalls, monstrous abominations,\_attacks by violent raiders.. . sure you’re upfor the trip?”</p><p>—Shahin, dune trader</p><hr /><p>Stretching from the foothills of the Ringing Mountains to the Great Ivory Plain and from the Lost Oasis\_to the Dragon’s Bowl, the Tablelands are a vast territory of sand, stone, and scrub plains. The picturesque\_mesas and buttes for which the region is named jut\_from the plains or rise like broken ramparts from\_the badlands, painted in broad striations of orange,\_yellow, and ocher. These ancient lands, inhabited\_by a wide variety of almost all the speaking peoples\_of Athas, hold dusty trading posts, hidden villages,\_and crumbling ruins. When city-dwelling Athasians\_think of deserts and desert people, they usually picture the Tablelands and its denizens. In fact, some\_city residents use the term “Tablelands” to describe\_everything between the Ringing Mountains and the\_Sea of Silt.</p><p>Two city-states dominate the Tablelands: Tyr and\_Urik. Tyr claims the broad central belt, and Urik’s\_influence extends over the northern portion. With\_the death of King Kalak of Tyr, the old rivalry has\_taken on a new complexion. Tyr’s revolutionaries\_dream of spreading their uprising to new cities, while\_Hamanu of Urik plots to seize Tyr’s iron mines and\_extend his control all the way to Tyr’s walls. However,\_there is a difference between what each city claims\_and what it truly controls. Outside a narrow belt of\_patrols and outposts ringing the two cities, the only\_laws a traveler need worry about are the laws of the\_desert: Trust no one, guard your water, and watch\_where you step.</p><p>\_</p><p>EXPLORING THE\_TABLELANDS</p><p>The Tablelands around Tyr hide a number of intriguing sites, including plantations of Tyr’s nobles, client\_villages, raider camps, old ruins, and lairs of danger\_ous monsters. Trade routes snake eastward from Tyr,\_leading to the cities of Balic, Gulg, and Urik. Great\_mekillot-drawn argosies creak slowly along these\_well-traveled paths, but the roads are far from safe.</p>"
