      content: "<p>A legendary city of the silt, Tarelon lies on a buried\_highland that is sometimes revealed as bare\_stone. The winds that scour this region of the Sea of\_Silt create a shifting border region of shallow dust.</p>\n<p>The exact area revealed by the winds seems to\_change every day; travelers who have visited Tarelon\_report that they could not find it a second time.\_</p>\n<p>Tarelon seems to have been a large city, but not so\_great as Waverly or Bodach. Like Arkhold, many of\_its buildings are permanently buried beneath the\_silt, and others are sometimes revealed. One great\_ancient temple stands at the center of the ruined\_city, carved with powerful and mystical symbols. It\_was once dedicated to the deities of the Elemental\_Plane of Earth.</p>\n<p>Despite its appearance and reputation as a\_haunted city, Tarelon is inhabited. The ruins conceal\_a small slave tribe, the Silt Raiders. The Sea of\_Silt is their chief protection\x97and their greatest foe.\_Though no slavers or soldiers of the sorcerer-kings\_will ever find the tribe in the midst of the Silt Sea,\_the barrenness of their home strains their resources\_and cunning to the utmost. They can only manage\_to grow a few meagre acres of scant crops, and they\_must rely on trade and raiding to furnish their basic\_supplies.</p>\n<p>The Silt Raiders, about 100 slaves of all races, are\_led by an Earth cleric, known as Kelestes, who\_dreams of seeing the ancient temple restored to its\_former glory. Visitors to Tarelon find that the slaves\_are eager for supplies and trade but are hardly fools;</p>\n<p>they attack foes within the maze of crumbling walls\_and buried buildings. The raiders know the ruins\_perfectly, and in many places they have built secret\_tunnels and passages from one buried building to\_another. It is a very defensible position.</p>\n<p>In return for food, the raiders produce crafts and\_volunteer their services as guards and scouts. They\_refuse to work for any merchant who uses slaves.</p>\n<p>Another source of income lies in the ancient treasures\_they find in the ruins of Tarelon itself. They\_hoard steel armor and weapons and trade them for\_months of supplies. Adventurers hoping to loot the\_ruins during their visit discover that the tribe regards the city as a crucial resource by the raiders. In\_their eyes, plundering the ancient town would be\_akin to harvesting another man\x92s crops.</p>"
