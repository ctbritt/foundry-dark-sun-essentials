      content: "<p>Poortool’s Horde</p>\n<p>A young candidate of the veiled alliance suddenly runs</p>\n<p>away into the desert, templars burst through the door just</p>\n<p>as a sale of magic components is completed, an elf tribe</p>\n<p>is attacked by gith who strip the elves bare and leave</p>\n<p>them in the desert – a bizarre and seemingly unrelated</p>\n<p>series of events.</p>\n<p>It is actually the activity of a small but increasingly</p>\n<p>influential raiding tribe of the Ivory Triangle. Poortool’s</p>\n<p>Horde is a tribe of mages tended to by slaves and</p>\n<p>defended by gith. This bizarre confederation is the result</p>\n<p>of Poortool’s desire to create a place where he could</p>\n<p>pursue magic openly and in the company of other mages.</p>\n<p>A place where he was not beholden to the suffocating</p>\n<p>secrecy of the Veiled Alliance, nor subservient to the will</p>\n<p>of the king in the ranks of the city’s defilers. The pursuit</p>\n<p>of this goal has led the ruthless preserver to found the</p>\n<p>most unlikely raiding tribe in the Ivory Triangle region.</p>\n<p>Organization</p>\n<p>An extraordinarily dispassionate man, Poortool runs his</p>\n<p>tribe as an even-handed autocrat. He is willing to hear</p>\n<p>out the opinions of even his gith sentries and scullery</p>\n<p>slaves. He believes that anyone may have valuable</p>\n<p>information to contribute to his decision making. He does</p>\n<p>not suppose, however, that everyone is equally qualified to</p>\n<p>\_</p>\n<p>make decisions and disdains the time-wasting, consensus-</p>\n<p>building processes of democracy. He has at times, reversed</p>\n<p>\_</p>\n<p>a decision in response to dissension. He does not see</p>\n<p>this as a sign of weakness, but rather as proof that he is</p>\n<p>open-minded and dedicated to the best interests of the</p>\n<p>community.</p>\n<p>Poortool leaves the day to day administration of village</p>\n<p>affairs to Tordos, his second in command. Tordos tracks</p>\n<p>inventory of dry goods as well as magic components.</p>\n<p>He also directs the staff of slaves that the village has</p>\n<p>acquired both through raids and the slave markets of the</p>\n<p>city-states. The slaves are employed in all aspects of life</p>\n<p>in the village. The mages need only get involved in the</p>\n<p>mundane tasks of day to day life to the extent that it</p>\n<p>interests them.</p>\n<p>The security of the village is the responsibility of</p>\n<p>Garreth, a human soldier who escaped the prisons of</p>\n<p>\_</p>\n<p>Gulg on a Red Moon Hunt and sought asylum in</p>\n<p>Poortool’s village. He commands the gith warriors who</p>\n<p>protect the community, and he coordinates their raids.</p>\n<p>Poortool himself decides who will comprise the parties</p>\n<p>that are sent on various missions required to advance the</p>\n<p>interests of the community and its allies.</p>\n<p>There are currently eight mages in the tribe, in addition</p>\n<p>to Poortool and Tordos. They are encouraged to spend</p>\n<p>their time engaged in study and research and to leave</p>\n<p>the administration of day to day affairs with Poortool.</p>\n<p>Poortool arranges for the purchase of necessary goods</p>\n<p>through House Tsalaxa.</p>\n<p>Poortool allows the members to pursue whatever</p>\n<p>interests they may have, but they must be prepared to</p>\n<p>leave at a moment’s notice to undertake a mission for</p>\n<p>the community or of its allies. Poortool demands the</p>\n<p>unquestioning responsiveness of a military organization in</p>\n<p>all missions and raiding activity. They respect Poortool’s</p>\n<p>vision and realize that he has only succeeded because of</p>\n<p>a willingness to make hard decisions. There are two young</p>\n<p>mages within the Gulg Veiled Alliance who are loyal to</p>\n<p>Poortool, and one in Nibenay.</p>\n<p>There are 50 gith who serve as the camp garrison.</p>\n<p>The gith come from tribes who have been displaced</p>\n<p>by Blackspear’s activity. Their efforts are coordinated by</p>\n<p>Garreth, the garrison commander. They serve the tribe in</p>\n<p>exchange for the goods they steal in raids, as well as the</p>\n<p>aid Poortool offers in defending their own tribes against</p>\n<p>Blackspear. None of the warriors are psionicists.</p>\n<p>Twenty slaves comprise Tordos’ staff. Among these</p>\n<p>slaves are some artisans who maintain the buildings and</p>\n<p>fences, a kitchen staff, herders, and a few laborers. The</p>\n<p>slaves are treated well and not overworked. This is not</p>\n<p>because of any compassion on Poortool’s part. But it</p>\n<p>simply reflects his idea of how to enhance the productivity</p>\n<p>of his property.</p>\n<p>Operations and Means of Existence</p>\n<p>The tribe mounts two types of raids. The first are the</p>\n<p>shakedown raids and the second are raids in the service</p>\n<p>of their allies. The shakedown raids are used as part of</p>\n<p>Poortool’s recruiting campaigns within the Veiled Alliance.</p>\n<p>They are attacks on elven tribes that are intended to drive</p>\n<p>the elves away from a particular city-state. This in turn</p>\n<p>\_</p>\n<p>160</p>\n<p>Settlements</p>\n<p>\_</p>\n<p>drives up the cost of magic components and reduces their</p>\n<p>availability. The Veiled Alliance naturally feels the impact</p>\n<p>of such a change, and the first thing to suffer within the</p>\n<p>organization is the training of younger members. Poortool</p>\n<p>uses this tactic to heighten the discontent of the lower</p>\n<p>ranks of the secretive society and then uses his insiders to</p>\n<p>flush out potential tribe members.</p>\n<p>Raids are also conducted for the benefit of Poortool’s</p>\n<p>allies. These currently include the tribes of gith who</p>\n<p>serve him and the merchant House Tsalaxa of Draj.</p>\n<p>The tribe will send mages to support the gith as needed.</p>\n<p>Poortool has recently struck an alliance with House</p>\n<p>Tsalaxa, which hopes to increase its influence on both</p>\n<p>Gulg and Nibenay. The tribe is often requested to escort</p>\n<p>caravans carrying sensitive cargo. They are also hired to</p>\n<p>raid competitor’s caravans or client villages. The tribe uses</p>\n<p>the revenue from their mercenary work to purchase goods</p>\n<p>directly from the merchant house. They also sell some</p>\n<p>of the magic components that they acquire through their</p>\n<p>shakedown raids to House Tsalaxa.</p>\n<p>Poortool draws upon the gith tribes to supplement his</p>\n<p>garrison for particularly difficult attacks. He also dedicates</p>\n<p>at least two mages to each raiding party. He is currently</p>\n<p>looking for a few psionicists to augment the mobility and</p>\n<p>communications capabilities of his raiding parties.</p>\n<p>Daily living within the camp is attended by the staff of</p>\n<p>slaves. These slaves are fairly dedicated to the tribe, partly</p>\n<p>out of fear and partly because they are treated well and</p>\n<p>know that their lives would be much more difficult back</p>\n<p>in the city-states or with the slave tribes in the wilderness.</p>\n<p>The slaves’ activities include minding the camp’s small</p>\n<p>erdlu herd and preparing meals.</p>\n<p>Origin</p>\n<p>Poortool’s intelligence showed as a child, and he was</p>\n<p>taken into the tutelage of the king’s defilers in Nibenay.</p>\n<p>He had an insatiable appetite for knowledge, but little</p>\n<p>patience for discipline. His master recommended he be</p>\n<p>sent for psionic study to improve his concentration before</p>\n<p>he continued studying magic. He quit his magical studies</p>\n<p>and continued to serve as a clerk to the templars. His</p>\n<p>talent had not gone unnoticed, however, and he was soon</p>\n<p>recruited by the Veiled Alliance. Starting from scratch,</p>\n<p>he began his magical training as a preserver. Over time,</p>\n<p>\_</p>\n<p>however, he found the secretiveness of the organization</p>\n<p>that oppressed him and the structure stifled his growth.</p>\n<p>He eventually stole a contact’s spellstring and set out into</p>\n<p>the scrubland.</p>\n<p>He had been traveling for a week when he was set</p>\n<p>upon by a small pack of gith. He quickly disabled his</p>\n<p>attackers and decided to ransom them back to their tribe.</p>\n<p>The incident earned him the respect of the gith warriors,</p>\n<p>who admired his cunning. He offered to assist the gith in</p>\n<p>planning a raid and, while they were suspicious, the success</p>\n<p>of the raid confirmed the young half-elf’s intelligence and</p>\n<p>formed the basis of his current relationship with them.</p>\n<p>Poortool decided to establish a permanent base</p>\n<p>and called upon the gith to help him capture some slaves</p>\n<p>from the caravans traveling out of Nibenay. Once he had</p>\n<p>put the slaves to work building the small encampment, he</p>\n<p>set out to recruit some like-minded young mages. Through</p>\n<p>a series of clandestine meetings reinforced by a sudden</p>\n<p>scarcity of magic components, Poortool quickly-found a</p>\n<p>handful of initiates. It was the gith who named the tribe as</p>\n<p>they saw the young mage begin to collect adherents. Over</p>\n<p>the years, Poortool has expanded his small community.</p>\n<p>He hopes now to tap into the cities of Balic, Raam, and</p>\n<p>Dral for more tribe members.</p>\n<p>Location and Defenses</p>\n<p>The encampment of Poortool’s Horde lies about 20</p>\n<p>miles due east of Nibenay. It lies at the edge of the</p>\n<p>scrub plains, where the rocky badlands of the Blackspine</p>\n<p>Mountains begin to take shape to the northeast and</p>\n<p>the salt flats of the Great Ivory Plain spread out to the</p>\n<p>south. The camp consist of a small village with modest</p>\n<p>fortifications. There is a low earth wall topped with wooden</p>\n<p>spikes, built to discourage predators. A garrison of 50 gith</p>\n<p>maintain watch in three shifts. The sentries surround the</p>\n<p>village and maintain visual contact with one another. The</p>\n<p>area is gith territory and as a result few travelers or raiding</p>\n<p>bands pass by unmolested.</p>\n<p>Relations with Others</p>\n<p>Poortool fully recognizes that his tribe will remain</p>\n<p>fugitives from the law as long as the sorcerer-kings remain</p>\n<p>in power, or at least until his tribe can grow in strength</p>\n<p>to the point that they can defy the sorcerer-kings and</p>\n<p>\_</p>\n<p>161</p>\n<p>Settlements</p>\n<p>\_</p>\n<p>conduct their affairs openly. That day, however, is unlikely</p>\n<p>to come to pass in this King’s Age. Consequently, a</p>\n<p>strict policy of secrecy must be maintained outside the</p>\n<p>community.</p>\n<p>Even the tribe’s allies at House Tsalaxa know the tribe</p>\n<p>as a roving band of mercenaries. Only their gith allies of</p>\n<p>the Blackspine Mountains know of the encampment.</p>\n<p>Poortool views the Veiled Alliance with disdain. While</p>\n<p>he recruits from their ranks, he tends to view them as a</p>\n<p>secret society of doddering old men and intriguers. He</p>\n<p>enjoys exposing their weaknesses and culling the most</p>\n<p>promising mages from their ranks. While they are not</p>\n<p>currently aware of his tribe, were an Alliance chapter to</p>\n<p>approach Poortool, he would entertain the value of an</p>\n<p>accord with them just as he would any other organization.</p>\n<p>Poortool has no particular aversion to defiling magic,</p>\n<p>but he does not believe it is practical to allow defilers</p>\n<p>to join the community when there are so many mages</p>\n<p>working together in close proximity. He does occasionally</p>\n<p>provide a passing defiler with spell components or a place</p>\n<p>to hide. He reminds his preservers that all mages are</p>\n<p>fugitives and that such relationships may sometimes prove</p>\n<p>valuable.</p>\n<p>He sees the tribe’s relationship with House Tsalaxa as a</p>\n<p>way of meeting the tribe’s needs for various goods without</p>\n<p>exposing the group unnecessarily to the city-states and</p>\n<p>villages of the region. He would, however, gladly enter into</p>\n<p>a relationship with another merchant house if it served</p>\n<p>his interests. Presently, the availability of goods, combined</p>\n<p>with a single point of contact, make the House Tsalaxa</p>\n<p>relationship quite satisfactory.</p>\n<p>To this point, the tribe has only maintained alliances</p>\n<p>with solitary gith tribes that have been displaced by</p>\n<p>Blackspear. Poortool is now preparing to establish an</p>\n<p>alliance with Blackspear himself. The mage believes that</p>\n<p>one day when his small tribe has become a nation, he will</p>\n<p>need an army to carve out its home.</p>\n<p>Neither the elf tribes whom Poortool’s gith harass, nor</p>\n<p>the templars whom he occasionally aids, are aware of</p>\n<p>the existence of the tribe. The mages generally remain</p>\n<p>concealed in the raids on the elf tribes. Consequently, the</p>\n<p>elves simply think the attacks are just the random strikes</p>\n<p>of roving gith tribes. The templars of the city-states believe</p>\n<p>that the tips they receive simply come from concerned</p>\n<p>citizens.</p>\n<p>\_</p>\n<p>Poortool will strike a deal with anyone if he believes</p>\n<p>that it will serve the long-term interests of the community.</p>\n<p>He has hired small bands of mercenaries to find odd</p>\n<p>items for the tribe or to serve as escorts on Tsalaxa</p>\n<p>caravans.</p>\n<p>Joining the Tribe</p>\n<p>Strangers happening upon the encampment are likely</p>\n<p>to wake up a distance away with no recollection of having</p>\n<p>ever seen the place. Poortool has no qualms about killing</p>\n<p>intruders if necessary. It would not attract undue attention</p>\n<p>for traveler’s to fall prey to gith and disappear in the</p>\n<p>vicinity of the Blackspine Mountains. Poortool will,</p>\n<p>however, actually extend hospitality to mages and their</p>\n<p>traveling companions. His intention, of course, is to find</p>\n<p>new members for the tribe.</p>\n<p>A mage expressing interest in joining the tribe is</p>\n<p>interviewed by Poortool and Prasad, the tribe’s psionicist.</p>\n<p>They use magic and psionics to confirm the veracity of</p>\n<p>their candidate’s answers. The candidate is permitted to</p>\n<p>remain in the community for a week, enjoying the open</p>\n<p>company of other mages. The candidate is then taken</p>\n<p>\_</p>\n<p>162</p>\n<p>Settlements</p>\n<p>\_</p>\n<p>on a raid. If the mage proves him or herself, he or she</p>\n<p>is accepted into the tribe. Interestingly, only the gith are</p>\n<p>permitted to evaluate a candidate’s performance on a raid.</p>\n<p>Defilers are not permitted to practice in the</p>\n<p>community but will be shown hospitality.</p>\n<p>Personalities</p>\n<p>Poortool: Poortool is a tall, bald half-elf with extremely</p>\n<p>pale skin. He burns easily in the sun and always wears</p>\n<p>a wide, formless straw hat to shade his face. His taste in</p>\n<p>clothing is simple and he favors a functional leather jerkin</p>\n<p>that he ties at the waist.</p>\n<p>Poortool is in all ways a brutally pragmatic man. At</p>\n<p>times he exhibits the ruthless efficiency of the templars</p>\n<p>he once served. He is an excellent negotiator and always</p>\n<p>honors his agreements. He is dedicated to advancing his</p>\n<p>own knowledge of magic and psionics, and he believes that</p>\n<p>his community provides the best chance to accomplish</p>\n<p>this. While he would never voice such an ambition, he is</p>\n<p>establishing a power base that he believes may one day</p>\n<p>rival that of the sorcerer-kings.</p>\n<p>He has, over the past few years, developed an increasing</p>\n<p>interest in the Way of the Unseen. The discipline that he</p>\n<p>lacked as a child has come in maturity threefold and has</p>\n<p>been fed by his continuing mastery of his innate psionic</p>\n<p>ability.</p>\n<p>Poortool is not an emotional man. He has a talent for</p>\n<p>understanding what motivates individuals, and his tolerant</p>\n<p>manner is borne of political acumen rather than kindness.</p>\n<p>A natural leader, Poortool is a solid ally and a dangerous</p>\n<p>enemy.</p>\n<p>Garreth: Garreth is a warrior who joined the tribe as</p>\n<p>garrison commander after surviving an attack on a client</p>\n<p>village he was defending. Garreth had been hired as a</p>\n<p>mercenary to protect the village of the House Inika of</p>\n<p>Gulg. Poortool’s Horde descended on the community</p>\n<p>and rounded up the four slaves in the town, one of which</p>\n<p>was Garreth’s. After the raiders left, Garreth set out to</p>\n<p>find his manservant. While he was uncertain whether the</p>\n<p>slave would still be alive, he was furious that someone</p>\n<p>would take his property.</p>\n<p>Garreth, a stubborn man, tracked the gith party all the</p>\n<p>way back to Poortool’s encampment. He lay in the scrub</p>\n<p>\_</p>\n<p>and watched the village for several days and was confused</p>\n<p>by what he saw there: humans and half-elf wizards milling</p>\n<p>about and casting spells, slaves tending an erdlu herd,</p>\n<p>gith sentries. On the third evening he resolved to steal</p>\n<p>into the camp and recapture his slave. The gith alerted</p>\n<p>Poortool when Garreth tripped an unseen magical alarm.</p>\n<p>Garreth was taken into custody, but his perseverance</p>\n<p>and skill had impressed the gith so much that Poortool</p>\n<p>returned his slave to him and extended the hospitality of</p>\n<p>the tribe. The difficult man soon found himself agreeing</p>\n<p>to serve as captain of the village garrison.</p>\n<p>Garreth is a large, disagreeable man who wears black</p>\n<p>studded leather armor and pulls his long black hair back</p>\n<p>in a knot. His abrasive personality and vindictive manner</p>\n<p>have won him the comraderie of the gith. He is something</p>\n<p>of a freebooter and is well suited to his task.</p>\n<p>Tordos: Tordos is a middle-aged human with thick</p>\n<p>black hair and a neat beard. He wears a decorative</p>\n<p>pillbox hat and can usually be seen carrying a large</p>\n<p>wooden box on his back like a knapsack. The box has</p>\n<p>two doors which open like a cupboard and are held fast</p>\n<p>\_</p>\n<p>163</p>\n<p>Settlements</p>\n<p>\_</p>\n<p>by a small loop of leather. When open, the box can be</p>\n<p>seen to house a countless array of tiny drawers, each with</p>\n<p>a small round handle. The drawers are used to store</p>\n<p>magic components as well as the herbs and powders with</p>\n<p>which Tordos experiments.</p>\n<p>Tordos was the first mage to join Poortool’s tribe and</p>\n<p>is undeniably the most dedicated. Tordos had been</p>\n<p>an innkeeper with a large family in Nibenay. He was</p>\n<p>an initiate of the Veiled Alliance in that city, and he</p>\n<p>allowed the group to use his inn as a contact point</p>\n<p>and meeting place for his cell. The pressure of all of</p>\n<p>his responsibilities had driven him to take a trip to visit</p>\n<p>a friend in South Ledopolus. Tordos was traveling with</p>\n<p>a caravan that was attacked by Poortool and his gith.</p>\n<p>Poortool mentally dominated the mage and used him</p>\n<p>to complete the violent attack. He then had his gith</p>\n<p>immobilize Tordos’s hands, gag him, and lead him back</p>\n<p>to the village with a handful of slaves.</p>\n<p>Through various magical and psionic means, Poortool</p>\n<p>completely controlled the older man for several days.</p>\n<p>During this time Poortool mulled over the best way to</p>\n<p>turn this puppet into a willing ally. Finally, Poortool took</p>\n<p>Tordos into a field and prepared to speak to him of his</p>\n<p>dream. He released his control of Tordos and waited for</p>\n<p>his reaction. Rather than anger or bitterness, the man</p>\n<p>seemed filled with almost childish wonder. He marveled</p>\n<p>at the death that had been caused by his hands in the</p>\n<p>caravan raid. Total enslavement for Tordos had been an</p>\n<p>invigorating release. He spoke of the thrill of abdicating</p>\n<p>all responsibility for his actions. Not since he was a child</p>\n<p>had he felt the freedom of knowing that someone else</p>\n<p>had to feed him, to clothe him, to decide how his magic</p>\n<p>would blind a man.</p>\n<p>Poortool began to speak of his vision. “Why let a bunch</p>\n<p>of old men whom you don’t even know decide what spells</p>\n<p>you should learn? Why take orders from people who hide</p>\n<p>in the shadows? Why is there no community where a</p>\n<p>man can choose his own path and where his acquisition</p>\n<p>of greater ability is limited only by his intelligence?” The</p>\n<p>discussion soon turned into a fascinating exchange on the</p>\n<p>techniques of somatic concealment. He enthusiastically</p>\n<p>agreed to join the young preserver and has proven to</p>\n<p>be Poortool’s right arm. Tordos has never contacted his</p>\n<p>family, who believes that he was killed in a gith raid.</p>\n<p>The gentleman now administers the day-to-day affairs and</p>\n<p>\_</p>\n<p>directs the slaves.</p>\n<p>1. Mage’s Quarters: These buildings are made of dirt</p>\n<p>brick and a sod roof. They are divided into a sleeping cell</p>\n<p>and a sitting room. The residents are prepared to abandon</p>\n<p>the village at a moment’s notice. All the mages learn to</p>\n<p>store their spells in a series of intricate knots on strings</p>\n<p>which they wear as belts. Each mage’s quarters contains a</p>\n<p>cabinet mounted with straps so that it can be carried on</p>\n<p>the back. These are used to store spell components and</p>\n<p>valuable objects. Beneath each of the mage’s quarters is a</p>\n<p>cellar used for individual research.</p>\n<p>2. Slaves’ Quarters: This large single-room building</p>\n<p>contains thatch mats and small chests that contain the</p>\n<p>private effects of the slaves. The mages have magically</p>\n<p>warded the chests so that each slave can open only his</p>\n<p>or her own chest. This small recognition of privacy seems</p>\n<p>to please the Slaves.</p>\n<p>3. Dining Hall: This large hall holds several large</p>\n<p>tables flanked by benches. There is a large open fire pit</p>\n<p>at the north end of the hall where meals are prepared.</p>\n<p>Meat is cleaned and dressed in the adjacent smokehouse.</p>\n<p>All tribe members eat here, although the mages will</p>\n<p>sometimes take meals in their quarters.</p>\n<p>4. The Well: This deep well provides water to the</p>\n<p>village year round.</p>\n<p>5. The Corral: This fenced area is used to contain the</p>\n<p>erdlu herd managed by the slaves.</p>\n<p>6. The Storehouse: This room stores various dry goods</p>\n<p>used by the community. Items here are generally purchased</p>\n<p>from House Tsalaxa.</p>\n<p>7. The Barracks: This building houses Garreth and</p>\n<p>the gith warriors. The gith prefer to sleep on the floor, on</p>\n<p>a nest of cloth. Garreth has taken to sleeping this way as</p>\n<p>well. The warriors all chests warded as the slave’s chests</p>\n<p>are. The warriors all sleep with their weapons. At any</p>\n<p>given time, one third of the garrison is sleeping here.</p>\n<p>8. The Pit: This is a 40-foot-deep pit that has been</p>\n<p>\_</p>\n<p>164</p>\n<p>Settlements</p>\n<p>\_</p>\n<p>dug to hold a so-ut that one of the mages plans to capture</p>\n<p>for purposes of research. So far he has been unsuccessful,</p>\n<p>and the pit is empty.</p>\n<p>9. The Amphitheater: This is a 10-foot-deep pit with</p>\n<p>several tiers of benches leading to the floor. It is used for</p>\n<p>demonstrations and instruction. Thirty feet below the floor</p>\n<p>of this amphitheater is a room with a 20 foot ceiling and</p>\n<p>identical lateral dimensions. It is used for presentations,</p>\n<p>experimentation and testing.</p>\n<p>\_</p>\n<p>10. The Drop: This is a 40 foot drop that opens</p>\n<p>up into the subterranean amphitheater. The pit has no</p>\n<p>handholds and has a hard stone floor. The mages can use</p>\n<p>any number of magical means to descend the tunnel and</p>\n<p>enter the room below. There is a rope in the storehouse</p>\n<p>in the event that a slave needs to gain access to the room</p>\n<p>for cleaning or for repairs.</p>"
