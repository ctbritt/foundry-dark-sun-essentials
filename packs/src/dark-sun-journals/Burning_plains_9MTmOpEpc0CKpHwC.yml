      content: >-
        <p>The Burning Plains The Burning Plains are one of the</p>

        <p>most mysterious phenomena on Athas. The region's soil</p>

        <p>is some of the richest remaining on the planet, fertilized</p>

        <p>by centuries of dead grasses mixed into the black earth.</p>

        <p>Most likely, when a traveler first comes to the Burning</p>

        <p>Plains, he will see vast stretches of chest height grasses</p>

        <p>waving in the dry wind. Many newcomers take this as a</p>

        <p>sign that they have finally reached the Last Sea. After</p>

        <p>all, how could such bounty survive without vast sources</p>

        <p>of water nearby?</p>

        <p>After walking a ways into the grassy fields, though,</p>

        <p>the traveler notices that the ground below the seemingly</p>

        <p>serene blanket of burnished white grass is covered in</p>

        <p>blackest ash. These ashes are the result of the countless</p>

        <p>wildfires that have ravaged the Burning Plains.</p>

        <p>If there is any sort of a breeze, the air above the plains</p>

        <p>becomes hazy with a fine gray ash that sticks to skin</p>

        <p>and clothing, coating just about everything it comes into</p>

        <p>contact with.</p>

        <p>While the ash can be extremely annoying, gumming</p>

        <p>nostrils and eyes and clogging throats, it is only a harbinger</p>

        <p>of disaster to come. The ash is, of course, the remnants</p>

        <p>of thousands of years of wildfires that have plagued the</p>

        <p>Burning Plains since the Mind Lords closed the borders</p>

        <p>of the Last Sea nine millennia ago.</p>

        <p>In some places, the ashes have heaped up like massive</p>

        <p>dunes rising dozens of feet into the air. In most places,</p>

        <p>though, the ash is only knee deep. Still, this has the</p>

        <p>effect of slowing ground traffic across the plains. All</p>

        <p>overland movement rates across the plains are reduced</p>

        <p>rate, meaning any trip across the plains is going to require</p>

        <p>at least two days to complete.</p>

        <p>The grass on the Burning Plains grows extremely</p>

        <p>quickly, at the rate of more than a foot a day, starting at</p>

        <p>the surface of the ash. The roots of the firegrass (as the</p>

        <p>Last Sea residents call it) aren't very strong, though, and</p>

        <p>they don't provide enough of a network to actually provide</p>

        <p>a foundation across which travelers can walk. Anyone</p>

        <p>stepping onto the false floor formed by the bottom of</p>

        <p>the firegrass is in for a surprise, as they will instantly fall</p>

        <p>through the ash to the actual floor of the plains if they</p>

        <p>weigh more than about thirty pounds.</p>

        <p>The same happens to any hapless creatures that wander</p>

        <p>through the area. The Burning Plains are populated,</p>

        <p>however, by mice, prairie dogs, and even meerkats which</p>

        <p>can walk along the false floor formed by the firegrass roots.</p>

        <p>They nest in tunnels clawed out of the ash, and when a</p>

        <p>fire comes, they burrow deep into the ash and even into</p>

        <p>the sandy ground beneath.</p>

        <p>Flashfires</p>

        <p>Although the winds off of Marnita occasionally bless</p>

        <p>the Burning Plains with a gentle rain, this water is not</p>

        <p>enough to keep the grasses from drying to straw beneath</p>

        <p>the terrible rays of the dark sun. Inevitably, whether</p>

        <p>from lightning or from overheated straw spontaneously</p>

        <p>combusting, fire breaks out on the Burning Plains. The</p>

        <p>desiccated grass goes up in flame like flash paper, and the</p>

        <p>entire plain is swept by a raging inferno.</p>

        <p>More than one group of travelers has met a flaming</p>

        <p>doom after being caught in the middle of the Burning</p>

        <p>Plains when a wildfire broke out. Since these fires occur</p>

        <p>irregularly and unpredictably, most people wisely give wide</p>

        <p>berth to these deceptively peaceful fields. All too often,</p>

        <p>the alternative is to become just another cinder sifted into</p>

        <p>the fine ash that coats the ground of the Burning Plains.</p>

        <p>Adventurers may be tempted to try the same thing,</p>

        <p>but they should consider that, unlike most humanoids,</p>

        <p>the local rodents can live on very little air. When the</p>

        <p>fire comes, it can literally suck the oxygen out of the</p>

        <p>fauna's tiny tunnels if they are not sealed against such</p>

        <p>an occurrence. Unless travelers can accomplish something</p>

        <p>similar, they are doomed to suffocate, buried in the ash all</p>

        <p>around them and trapped beneath the raging fire above.</p>

        <p>The best time to travel on the Burning Plains is the</p>

        <p>237</p>

        <p>Beyond the Tyr Region</p>

        <p>day immediately after a fire (fires last 1-2 days), when the</p>

        <p>grasses are bare shoots above the ash, and there is little</p>

        <p>left to burn. Of course, the journey will generally take at</p>

        <p>least two days, and on the second day the chance of a</p>

        <p>flashfire is higher.</p>

        <p>For this reason, most travelers do not bother with trying</p>

        <p>to cross the Burning Plains, at least not on foot. Even</p>

        <p>the Thunder Mountains are more hospitable than this</p>

        <p>blistering land.</p>

