      content: "<p>\_</p>\n<p><em>“The Tablelands are arid, hot, and barren. Even on wind\_less days, the sky isfilled with a yellow green haze of\_floating silt. The crimson sun blazes with merciless intensity, and the breezefrels like the hot breath of the Dragon\_itself”</em></p>\n<p><em>—The Wanderer’s Journal</em></p>\n<hr />\n<p>Athas is a desert world, but that doesn’t mean the planet is uniformly covered with sand or barren\_wastes. Deserts come in many forms. Some are habitable, some are brutal killing grounds, and some are\_wastelands that seem empty but are full of hidden\_life. Knowing the types of deserts one might encounter while traveling across Athas is a vital survival\_skill one that might mean the difference between a\_successful journey and a hard death in the wilds.\_</p>\n<p>\_</p>\n<p><strong>BOULDER FIELDS</strong></p>\n<p>Boulder fields consist of broken, jagged rock. Some\_are old lava flows long since cooled, and others are\_valleys choked with rockslides or slopes of scree.\_They usually lie near mountains, and most are no\_larger than a few miles across. Boulder fields are for\_midable obstacles since they lack water,\_ vegetation,\_and shade, and if travelers do not have sturdy boots or\_sandals, the sharp rocks can cut their feet to ribbons.\_\_Deep gulches and crevices crisscross boulder fields,\_offering plenty of hiding places.\_</p>\n<p>\_</p>\n<p><strong>DUST SINKS</strong></p>\n<p>Windblown dust, ash, and silt accumulate in depressions to form dust sinks or silt basins. The largest\_known example is the Sea of Silt, but smaller sinks\_exist in almost any low-lying terrain. Even a light\_wind stirs the dust into billowing clouds. On calm\_days, a dust sink appears to be a smooth plain\_ of pale\_gray or dun powder. Appearances are deceptive. The\_dust is too light to support a traveler’s weight, but it is\_thick enough to suffocate anyone who falls in. Sometimes, the ground beneath the powder is uneven,\_concealing a dangerous drop. One misstep, and a\_traveler can disappear\_ beneath the dust.\_</p>\n<p>Large bodies of silt often extend like the rivers of old into more solid terrain, following narrow channels called estuaries. Many estuaries of silt are shallow enough for human-sized travelers to wade with care. Very tall creatures such as giants can navigate correspondingly deeper silt; a giant can\_ wade through silt 10 feet deep without difficulty. Many large sinks and estuaries are sprinkled with islands of high ground, isolated from the “mainland” by stretches of dust of varying depths. Some of these islands are rocky protrusions just large enough to accommodate a giant or two, and others\_ can support an entire village. Miles of silt have sheltered many islands over the years from the touch of defiling magic, and those islands remain surprisingly verdant</p>\n<p>\_</p>\n<p><strong>MOUNTAINS</strong></p>\n<p>Low ranges such as the Mekillot Mountains, the Stormclaw Mountains, and the Black Spine Mountains dot the Tyr Region. They are daunting obstacles. Their bare, rocky peaks—sometimes as tall as 6,000 feet—offer little water or shelter to make the\_ climb worthwhile. After a daytime temperature of well over 100 degrees, temperatures at night can plunge near the freezing point. Most of the exposed rock crumble under the twin hammers of heat and cold, so great slopes of broken rock and frequent rockslides make\_for arduous travel.</p>\n<p>Mountain vales, on the other hand, often are\_watered and filled with heavy scrub, cacti, or sparse\_forest. Little of the land is suitable for cultivation,\_but savages and monsters such as goliaths, gith, and\_kirres make their homes in vales. Large networks\_ of\_caverns lie under most of the low mountain ranges,\_home to all sorts of strange creatures that prefer to\_hide from the sun.</p>\n<p>A truly awesome mountain range marks the\_western border of the Tyr Region the Ringing Mountains, whose highest peaks reach 20,000 feet or\_more. Some of these peaks have thin but permanent\_snowcaps.</p>\n<p>\_</p>\n<p><strong>MUDFLATS</strong></p>\n<p>Little open water remains on the surface ofAthas;\_most is buried underground. In a few places, water\_seeps upward, saturating the land to create mudflats.\_Most common near or in dust sinks (especially the\_shallows of the Sea of Silt), mudflats hide\_ beneath the\_churning dust, revealed only when the winds clear\_an area and expose the soupy mess to the air. Uncovered mudflats usually dry out in short order, leaving\_behind hard, cracked clay that might or might not be\_solid enough to support a\_ traveler’s weight.\_A few mudflats manage to survive, sometimes\_through cultivation and sometimes by happenstance.\_These areas are lush with vegetation, including\_desert grasses, thorny bushes, and small trees. Where\_mudflats stand in silt basins,\_ low islands of dense vegetation rise above the dust. These mudflats are rarely\_large; most measure only a few hundred feet across.\_Tangled underbrush and mucky ground make travel\_ing through these areas difficult but not impossible.\_In general,\_ mudflats offer little to travelers; there isn’t\_much standing water, and dangerous predators hunt\_creatures that subsist on the greenery.\_</p>\n<p>\_</p>\n<p><strong>ROCKY BADLANDS</strong></p>\n<p>Most hilly regions on Athas are rocky badlands—highly eroded mazes of sharp-edged ridges, winding\_canyons, and thorn-choked ravines. Daunting escarpments force travelers into meandering courses along\_the ravine floors, which often end in blind\_ canyons\_or loop back on themselves. Badlands can be barren,\_waterless wastes, but many are filled with thorny\_brush that can completely clog the ravine floors.\_Rocky badlands are difficult to cross, no matter\_which way a traveler means to go.\_ Sticking to a canyon’s floor is easy enough, but a canyon rarely leads in\_the direction one desires, and the thick, prickly brush\_makes for very hard going. Climbing up the walls to\_crest a badland ridge usually involves a dangerous\_scramble of several\_ hundred feet, and travel along the\_top of a knife-edged ridge is equally challenging.\_</p>\n<p>\_</p>\n<p><strong>SALT FLATS\_</strong></p>\n<p>Great flat plains encrusted with salt that is white,\_brown, or black, salt flats can extend for miles. Some\_are dotted with briny marshland, but most are barren\_and lifeless. Any water is usually too brackish to drink\_and might be poisonous. Salt flats\_ offer no shelter, and\_the temperatures reach more brutal extremes than\_anywhere else on Athas. Sun sickness can kill an unprotected traveler caught in a salt flat.\_If the salt flats have one asset, it’s that no creatures\_linger in them for long. A prepared\_ traveler can cross\_a flat without risking an encounter with a wild beast\_or roving band.\_</p>\n<p>\_</p>\n<p><strong>SALT MARSHES</strong></p>\n<p>Salt marshes and shallow, ephemeral lakes can form\_in and near salt flats, dust sinks, and sandy wastes.\_ Most are only a mile or two across, but a few—such\_as the Salt Meres or the Maze of Draj—extend for\_as much as hundreds of miles. The water,\_ too salty\_or alkaline to sustain life, is undrinkable. Many salt\_marshes dry out completely in the months of High\_Sun, and some remain dry year-round if the following\_Lowsun comes and goes without rain.\_A salt marsh contains low grasses, reeds, or\_ brush.\_Ankle-deep channels of briny water encrusted with\_caked salt wind through the marsh, sometimes opening out into large, shallow lakes. Here and there,\_tough stands of scrub or the occasional tree stand\_above the grasses. Few creatures can\_ digest the tough\_vegetation, but the marshes buzz with tiny insects\_that can drive a traveler half mad.</p>\n<p>\_</p>\n<p><strong>SANDY WASTES</strong></p>\n<p>Vast stretches of yellow sand, sandy wastes are the\_most identifiable deserts ofAthas. Some wastes are\_plains where the air is still and no winds disturb the\_trackless land. In other wastes, the landscape takes\_on a rumpled appearance as winds pile up\_ sand to\_form great dunes. The topography of such wastes\_changes endlessly; old dunes slowly erode under the\_wind, and new ones form when deadly sandstorms\_whip up with little warning. Travelers caught in a\_storm hear the wind howl in a\_ deafening scream\_while stinging sand bites their skin. The worst storms\_can scour flesh from bones.\_In the flat areas of Athas, sandy wastes do not\_hinder travel. Oases, wells, and stands of tough scrub\_can sustain desert-dwelling creatures and people indefinitely. Flat sand is easy for travelers, although a\_lack of landmarks increases the risk ofbecoming lost.\_In areas that have dunes, travel is more challenging. Mekillot dunes, named for their passing\_resemblance to the huge drakes, can be hundreds\_ of\_feet tall, but most dunes rise no higher than a hundred feet. In wastes where the winds shift or collide,\_star dunes might form. The ridges of these mounds\_extend away from the main mass, forming arms that\_spread out like tentacles in all\_ directions.</p>\n<p>\_</p>\n<p><strong>SCRUB PLAINS</strong></p>\n<p>Scrub plains are savanna, prairie, or chaparral with\_just enough water to support extensive vegetation.\_Tough, dry grass punctuated by creosote bushes and\_tumbleweed dominates the ground. One can even\_find a few small trees scattered across the\_ landscape.\_By Athasian standards, scrub plains are almost lush,\_supporting a high concentration of wildlife.\_Excessive grazing and the use of defiling magic\_have reduced some scrub plains in the Tyr Region to\_ruin. Only a few such areas survive in the\_ wild lands\_between the city-states, protected by primal guardians who use ancient magic to destroy intruders and\_safeguard their homes. However, beyond the Ringing Mountains stretch vast scrub plains such as the\_Crimson Savanna.</p>\n<p>\_</p>\n<p><strong>STONY BARRENS</strong></p>\n<p>Stony barrens dominate the Tablelands. Most barrens\_are bedrock shelves exposed by windstorms. These\_weathered plains are covered with rocks that range\_in size from pebbles and gritty dust to huge piles of\_standing boulders. In places, the bare\_ rock gives way\_to hard-packed red earth, and yellow sand collects\_in crevices, forming dunes or drifts. Huge mesas and\_pointed buttes dot the plains, a testimony to the erosive power of the elements.\_Cacti proliferate in stony barrens. Hundreds of species grow throughout, appearing in all shapes\_and sizes, from small, thorny buttons to towering\_saguaros. Some cacti are edible, making suitable\_fare for travelers low on supplies. Others are stealthy\_predators that can kill careless travelers; in the\_ Athasian wilderness, one can never be certain who is the\_hunter and who is the hunted.</p>"
