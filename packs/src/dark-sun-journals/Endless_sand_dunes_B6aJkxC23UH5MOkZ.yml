      content: "<p>South of Balic lie the Endless Sand Dunes, a waste\_land that stretches for hundreds, perhaps thousands,\_of miles. It is the domain of the nomadic people\_known as the Tamwar, herders who struggle to survive at the outskirts of the dunes.</p><p>In centuries past,\_the Tamwar gathered in plundering hordes to strike\_at Balic, Kalidnay, or Tyr, but no great leader has\_appeared among them in many generations. The\_Tamwar tell stories of ancient kingdoms buried under\_the vast dune sea—the homelands of their sacred\_ancestors. The nomads turn on outsiders who venture\_into their holy places.</p><p>\_</p><p>HERUMAR,\_THE SAND SCOURGE</p><p>A terrible monster slumbers deep in the Endless Sand\_Dunes—the beast known as Herumar, the Sand Scourge.\_The creature resembles a seven-headed hydra of immense\_size, whose breath gives rise to scouring sandstorms. A\_cult of vicious elementalists worships Herumar, believing that blood spilled in the dunes slakes the elemental\_creature’s thirst and earns the cultists its favor.</p>"
