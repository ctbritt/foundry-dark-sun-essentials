      content: >-
        <p style="box-sizing:border-box;user-select:text;color:#191813">Unlike
        its sister islands, Morghaz has no active volcanoes and is surprisingly
        verdant. Scrub brush covers much of the land, and here and there stand
        small copses of forest. A small tribe could live here easily, yet the
        island is uninhabited. The</p>

        <p
        style="box-sizing:border-box;user-select:text;color:#191813">Khal-Ish-Thaas
        tribe and the clans of Avegdaar avoid Morghaz, believing it to be
        haunted, and they are correct. A shattered keep on the southeastern tip
        of the island was the home of an ancient order of preservers. The former
        leader of the order, a powerful ghost named Haakar, still lingers in the
        ruins.</p>
