      content: "<p>Setup. The barracks are at location 5I on the map of Yaramuke. For this encounter, have</p>\n<p>the players turn to the Player\x92s Book, page 43\x97Barracks.</p>\n<p>Start. Only the top of the barracks\x92 clay dome is visible above the dune. Characters must</p>\n<p>clear away the sand before they can enter the building. It takes one character two rounds</p>\n<p>to clear sand away from the window to the commander\x92s quarters. Getting to the door on</p>\n<p>the floor below the commander\x92s quarters is impossible without heavy excavating equipment.</p>\n<p>Encounter. Once the characters have cleared the sand away from the window into the</p>\n<p>commander\x92s quarters, they may squeeze in one at a time. Half-giants and thri-kreen cannot</p>\n<p>fit through and must remain outside.</p>\n<p>The barracks once housed an elite group of templars who were Sielba\x92s bodyguards</p>\n<p>during her frequent trips away from Yaramuke. Unfortunately, the templars were caught</p>\n<p>off guard by King Hamanu\x92s attack and were slain before they could gather their wits</p>\n<p>about them. A skeleton fills each bed here, their very bones shattered and charred by</p>\n<p>some powerful force. Other than these grisly reminders of a war long past, little of interest</p>\n<p>remains here. Areas numbered on the map of the barracks are described below.</p>\n<p>Room 1\x97The Commander\x92s Quarters: The templar in charge of Sielba\x92s personal</p>\n<p>bodyguard was caught napping when disaster befell his city. Characters who search the</p>\n<p>bed discover a scorpion hidden among the bedclothes. Unless extreme caution is taken</p>\n<p>when removing the blankets from the bed, the scorpion automatically gains surprise, striking</p>\n<p>first. Once the scorpion is defeated, the characters can notice three rings on the skeleton</p>\n<p>\x92s left hand. All are normal rings with no magical properties, but are of finely wrought</p>\n<p>copper and are worth 1 sp each. The desk here contains only inconsequential items such</p>\n<p>as signet seals, wax and a handf of faded papyrus fragments. The altar is bare save for</p>\n<p>the tattered, molding cloth covering it.</p>\n<p>Room 2- Templars\x92 Area: If the characters descend the ladder to this room, they find</p>\n<p>the skeletons of 13 of Sielba\x92s finest templars in the beds here. A chest in the corner once</p>\n<p>contained their weapons and armor, but Hamanu\x92s looters took most of these after the</p>\n<p>war. Those who search the chest discover a secret panel in its bottom on a roll of 1 on</p>\n<p>1d6. (Thieves may use their Find/Remove Traps score for this search.) A tiny cavity</p>\n<p>within the chest\x92s bottom holds a steel dagger +1. This dagger is attuned to the Orb and</p>\n<p>will vibrate slightly if within 50 feet of it (a character feels these vibrations only if he or</p>\n<p>she is holding the dagger). Within 20 feet of the Orb, the dagger vibrates more intensely;</p>\n<p>a character will notice the vibrations unless the dagger is in a backpack. Within 10 feet of</p>\n<p>the Orb, the dagger vibrates so strongly that it can be noticed even through a backpack.</p>\n<p>Statistics. Scorpion: AL Nil; AC 5; MV 9; HD 2+2; hp 17; THAC0 19; #AT 3;</p>\n<p>Dmg 1-4/1-4/1, if stung save vs. poison +2 or die next round; SZ S; ML 8.</p>\n<p>Next. Characters may continue to examine the ruins.</p>"
