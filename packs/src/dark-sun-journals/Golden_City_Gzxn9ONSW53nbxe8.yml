      content: >-
        <p>Once reserved for King Kalak and his top administrators and templars,
        the Golden City retains many of its restrictions on visitation, despite
        the growing clamor of ordinary Tyrians.</p><p>On one day every week,
        commoners are allowed to tour the King's Gardens and the Golden Tower.
        Only about a hundred citizens are let in on any given day, despite the
        fact that far more wish to see the fabled gardens with their own eyes.
        Resentment is brewing, even though the templars have tried to explain
        that if the gardens were opened freely to all citizens of Tyr, the place
        would suffer irreparable damage.</p>
