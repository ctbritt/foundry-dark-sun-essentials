      content: >-
        <h2>Daveys</h2><p>"Daveys"are drifting spacefarers found in space,
        either dead or in suspended animation. This is a human term of unknown
        origin.</p><p>Elves and dwarves usually refer to such hapless
        individuals as "drifters," but this term can cause confusion: it's also
        the space-wide salvage term for a disabled vessel, drifting in space
        without power.</p><p>Slaving races in space usually refer to such
        creatures as "meat."</p><section class="secret"
        id="secret-N1FRfpIWjv8ebgCw"><p>DMs may use Daveys to provide PCs with
        minor treasure (coins, potions, spell scrolls, or maps). More rarely, a
        drifting ex-adventurer can provide PCs with a spellbook or magic item—or
        death, in the form of spaceworms, disease, or other infestations. Or PCs
        may be in need of reinforcements— or enemies.</p><p>Give him or her
        skills and personal pos- sessions that would suit a spacefarer. Don't go
        over- board (pardon the pun) with posses- sions. Consider what someone
        might reasonably be carrying when the sit- uation occurred that caused
        them to become a drifter. Decide why this character became a Davey. What
        could have happened to set this character adrift (alive or dead) in
        vastness of space? Did a fearsome accident occur? Was this being encased
        in magical softwood by doomed allies in hopes that his life might be
        preserved? Has it become undead? Is he the sole survivor of a band of
        adventurers? Is the Davey"trapped,"possibly a host for a horrible space
        monster that lies dormant waiting for a new, living
        host?</p></section><div><div><h2>Debris Fields</h2><p>Contact with a
        debris field of sufficient mass causes a spelljamming ship to slow to
        'normal' movement. A spelljammer will be able to 'feel' the field as the
        ship slows, but will not be able to detect other ships within or beyond
        it, due to the large amount of movement of debris fragments.</p><p>There
        is, however, another sort of debris field, sometimes called a "rubble
        field." This is a field deliberately laid in space as a defense for
        bases or disabled ships. Raiders sometimes arrange fields to provide
        cover, using magic, chain-linkages, even captured power sources to move
        rocks as missiles.</p></div><section class="secret"
        id="secret-H3sB0JBMKYEYBWrC"><p>A ship slowing down to cautiously work
        its way around or through such a field may suddenly be rammed (as if by
        a ship with a blunt ram) by a large asteroid that unexpectedly lunges at
        them.</p><p>Determine hull and personnel damage according to the
        situation. A rough guideline for determining such damage follows.
        Extrapolate damage for a given rock from this example: A large asteroid
        (a ton or more in weight) will cause at least [[/r 2d8]] hull points of
        damage and a 50% chance of a "Ship Shaken" Critical Hit if it strikes a
        ship with a direct hit.</p><h3>Ship Shaken</h3><main
        class="apsj-black-overlay"><p class="apsj-data">The power of the attack
        has knocked everyone aboard the ship off balance. The first attack made
        by each Gunner before the end of their next turn is made at
        disadvantage. If the ship suffers additional instances of Ship Shaken in
        the same turn, the number of attacks made at disadvantage increases by 1
        each.</p></main><div><div><p>A glancing hit from the same size of
        asteroid, where it skips along the deck or rigging, menaces all crew in
        that area (attack rolls on each, [[/r 3d8]] dmg to all hit), has a 50%
        chance of doing [[/r 1d4]] hull points of damage.</p><p>Less hostile,
        natural sorts of debris fields may harbor strange types of spacefaring
        monsters (ones that don't breathe—undead and void scawers especially
        seem to haunt such places).</p><p>PCs may well find small treasures
        (such as dropped swords, messages in bottles, and individual coins or
        gems) floating in the field. The wise DM uses such goodies as arrows
        pointing to future adventures as of- ten as possible.</p><p>Space is
        limitless, and with a good ship one can go in just about any
        direction—so why not give PCs the urge to go in every direction, all the
        time?</p><p>If PCs start to slow down and comb every debris field they
        come across, the DM can always bring on lurking monsters. . . after all,
        who better to encourage tales of treasure (and leave trails of gold
        floating in the void) than
        slavers?</p></div></div></section><div><h2>Dust Clouds</h2><p>Here and
        there in wildspace lie little-known 'dark regions,' feared by some
        spacefarers because they afford concealment to pirates and monsters of
        the void (like the ever-present scavvers).</p><p>Entering such a cloud
        slows a spelljamming ship to 'normal' speed and immediately fouls a
        ship's air envelope. Sometimes (20% chance) mold spores, krajen spores,
        gas spore rhizomes, or other harmful substances are floating among the
        cloud, and even more often one or more sizeable rocks tumble around in
        them. Blindly-faring ships will almost certainly collide with such
        rocks</p><section class="secret" id="secret-aJ31OG7QZt4Haya0"><p>(see
        @JournalEntry[iKzQ3sUePrXBg4pV]{Debris Field}, above, for a damage
        example).</p><p>@Compendium[shareddata.ddb-spells.38cRGSQ2nwDiO2NU]{Light}
        spells and magical item effects used within a dust cloud will cause the
        entire cloud to light up, perhaps attracting the attention of nearby
        ships. To the crew of a ship inside the cloud, however, visibility is
        increased only by 60' to 110' ([[/r 1d6 + 5]] x 10 feet), depending on
        the thickness of the dust, as the dust all around glows in a blinding,
        swirling maelstrom.</p><p>Fog-creating and other moisture-related spells
        cannot replenish (freshen) a ship's air while in a dust cloud. If they
        are cast inside a cloud, mud globules will fill the air, halving the
        time that the already-fouled air will last before becoming
        deadly.</p><p>Additional applications of such spells will reverse this
        condition if cast after the ship leaves the dust cloud, but the ship
        will be covered with slippery mud. If any spores lurk amid the dust,
        such extra moisture will cause them to grow and react, presenting the
        crew with a new danger.</p><h3>Hazards</h3><ul><li><p>Size: 2d4 Hexes
        Entering slows ship to tactical speed and fouls ships
        air.</p></li><li><p>20% chance of spore cloud effects (Spore
        Table)</p></li><li><p>30% chance of floating rocks:</p></li><li><p>1 in
        20 chance of collision per hex. 2d8 Hull Points Dmg and 50% chance of
        ship shaken critical hit. 2 in 20 chance per hex of glancing blow. 3d8
        hit points to anyone on deck failing a save vs. breath and 50% chance of
        1d4 Hull points Dmg.</p></li><li><p>If cloud life sustainable, 1d4-1
        Space Beasts in cloud. Visibility - 50', with light spell up to 110'
        (1d6+50)</p></li></ul></section><h2>Flow Beacons</h2><p>In the
        everchanging rainbow mists of the phlogiston, spacefarers occa-sionally
        come across floating, spindle-shaped metal 'stars' which glow with
        periodically-blinking patches of phosphorescence and emit a constant
        singing sound. Each star sings in a different pitch.</p><p>Most sages
        and space captains believe them to be magical buoys marking routes
        through phlogiston, for they never seem to move in the flow, holding
        their positions even more steadily than the spheres.</p><p>But who
        placed these marker buoys in space, and where they mark the way to, is
        unknown—lost now amid the mists of passing time.</p><section
        class="secret" id="secret-HiKbu1KwbUemfiTH"><p>No known weapon,
        including ship ramming, can move or harm a beacon or cause it to react
        in any way. Flow beacons reflect all spells cast on them back upon the
        caster, and never stop or alter their singing.</p><p>The legendary
        spacefarer Grimbeard Holast, a dwarf who made several fortunes running
        precious cargoes through the void over many years, went to his deathbed
        claiming that he saw The Spelljammer sweep past a beacon in the flow one
        day, and the buoy lit up with racing streams of flashing lights as the
        ship passed, quieting again when the mighty ship of space had
        disappeared. Elminster (among others) believes him, but certainly The
        Spell- jammer has been seen far from known buoys, and seems to go about
        ignoring them entirely.</p><p>Khelben Blackstaff and his mysterious
        colleague Grimwald have remarked that they have often seen Mercane near
        flow beacons, and venture the hypothesis that the 'beacons' are actually
        Arcane ships, probes, or supply caches. Arcane seem not to hear or
        understand queries about the mysterious, ancient buoys.</p><p>Veteran
        spacefarers warn, however, that far less mysterious ships— pirate ships
        and slavers—have been known to use the buoys themselves as
        rallying-points and landmarks. "<em>Heed, they say, and fly thy ship
        accordingly…</em>"</p></section><h2>Gas Clouds</h2><p>These strange gas
        mixtures drift in wildspace and outer reaches of planetary atmospheres.
        They may or may not be clearly visible. Some are transparent. Most are
        translucent (sort of misty), colored purple, green, amber, or
        yellow.</p><p>Their gases can be highly flammable or poisonous,
        perfectly breathable and atmosphere-replenishing, or produce
        unpredictable side-effects in those breathing them.</p><section
        class="secret" id="secret-h2tgcNXXbVmuHQB7"><p>These side-effects have
        been known to include the following (the DM is encouraged to develop his
        or her own new effects): confusion, fear, or feeblemindedness, lasting
        [[/r 2d6]] rounds; breathers are enlarged, petrified, made invisible or
        diminished for [[/r 1d8]] turns; breathers forget all spells, command
        words, and true names or summoning names currently memorized; breathers
        involuntarily turn gaseous (attaining wraith form, this condition
        lasting [[/r 1d12]] rounds regardless of character attempts to end it,
        and then ending abruptly); breathers suffer [[/r 1d4]] internal damage,
        and cough flames or small arcs of lightning for 1 round (1 point of
        damage to those struck, range 5'—plus effects on flammables or
        phlogiston, if present); all curses (including lycanthropy and mummy
        rot) and diseases that a being is carrying or is infected with are
        instantly cured, damage and all; injured characters are healed and
        spontaneously regenerate, and so on. Note that any or all of these
        conditions could affect different members of the same crew at the same
        time.</p><p>The DM can use any random method of determining what effects
        occur. In all cases, PCs should be unable to anticipate what a given
        cloud will do, unless they have passed through it before within the same
        day. Note that natural spell-like powers may be as affected as character
        magic, and that monsters will suffer strange gas-cloud effects as well
        as PCs.</p><p>Roll first for @UUID[RollTable.qX32Kz1qrTHLPQmA]{Gas
        Clouds - Color} and then @UUID[RollTable.GbAxtYbB01S7XMrL]{Gas Clouds -
        Effects}</p></section><h2>Ice Fists</h2><p>A recurring peril of space
        travel is bombardment by ice fists flying at high speeds. These
        concretions of frozen water seem to be most common in the colder spheres
        of wildspace, but may be encountered anywhere.</p><p>Though many ice
        fists float forever in space, drifting slowly or trapped amid debris
        fields, most are met hurtling in a hurry.</p><section class="secret"
        id="secret-6KKsQKXhBQ58lups"><p>Collision with an ice fist of sufficient
        size can result in a "Ship Shaken" Critical Hit and up to [[/r 2d6]]
        hull points of damage. These ice balls usually shatter on impact,
        driving spear-like ice slivers everywhere, which endanger crew
        (typically, all crew on deck or in the rigging must face three attack
        rolls, hits doing them [[/r 2d4]] piercing damage each).</p><p>Contact
        with ice fists (particularly if a ship can avoid any form of violent
        collision) can be beneficial. Ice fists can release trapped fresh air
        and replenish supplies of drinking water.</p><p>Unfortunately, one out
        of every eight ice fists contain gases such as methane, which are
        flammable or harmful, fouling the ship's atmosphere.</p><p>Ice fists can
        be formed in many ways. Sometimes such balls are formed of the
        waste-water of a ship, jettisoned before reaching port. Rare ice fists
        may contain a frozen monster or even treasure—but these are more common
        in spacebar tales than in real
        life.</p><p>@UUID[RollTable.S2vNLdPqkS79m0Nl]{Ice
        Fists}</p></section><h2>Sargassos</h2><p>Although the inhabitants of
        some worlds use this term to mean a graveyard for sea-going ships, in
        space it refers to a specific and very deadly menace to
        spaceships.</p><p>Certain areas of wildspace, for unknown reasons, are
        'magic-dead.' Spells cast within or into these areas will not function
        and will be lost, magic items and artifacts entering them flicker and
        fail, 'losing power' until removed from the area, and magical travel or
        scrying across or into such areas is impossible.</p><p>Some of these
        areas are clearly visible as different from their surroundings, such as
        the Sea of Shadows, but most are invisible— deadly menaces into which
        spacefarers may readily blunder.</p><p>A spelljamming individual can
        'feel' a sargasso when near, as a yawning, sickening emptiness. Too
        near, usually. A spelljamming ship can pass within feet of the unseen
        boundaries of a sargasso without harm. A ship that touches or crosses
        those boundaries, however, may be doomed forever.</p><section
        class="secret" id="secret-kEUPBbB5G8F3FKBU"><p>Contact with a sargasso
        gives a spelljamming individual a sickening, gut-wrenching feeling, as
        if some . . . thing is sucking at him. No hit point loss
        occurs.</p><p>Spelljamming and all other magical power sources fade to
        half-speed in a single round, cease on the next round, and come back to
        half-speed on the third round.</p><p>On the fourth round, such a power
        source will regain normal operation if out of the sargasso, or fail
        completely if still in contact with it. The helm or other engine cannot
        be restarted while the ship is still in the magic-dead area, and the
        ship usually drifts slowly on, until it either exits the sargasso or
        strikes something that alters or stops its progress.</p><p>By this time,
        the crew may be long dead from lack of air. Softwood and contingency
        spells or other protections will not function until the ship is free of
        the sargasso.</p><p>When their helm suddenly fades, experienced
        spelljammers strain everything to swing their ship around or reverse its
        path by looping sharply up or down. Those unfamiliar with sargassos
        usually do nothing until it is too late—the steering change must be made
        before the third round 'pulse' of final power.</p><p>Allow NPC
        spelljammers and those PC spelljammers whose players do not take action
        an Intelligence Check and a Dexterity Check. If both succeed, the
        spelljammer instinctively did the right things, and the ship will
        immediately or shortly escape the sargasso.</p><p>If only one succeeds,
        the ship may be turned to a course that will let it escape from the
        sargasso just before death comes, or something else may occur, as the DM
        desires (such as a collision with an atmosphere-rich wreck within the
        sargasso).</p></section><h2>Spore Fields</h2><p>Many spore clouds float
        in space. Some appear as dust clouds, while others, such as "drifts" of
        krajen spores, are made up of spores too small to be seen unless a crew
        is specifically looking for them.</p><p>Some spores are relatively
        harmless. They may carry the miniature forerunners of glowmoss or other
        edible (such as "moonmint," a parsley-like garnish that grows on
        planetoids near fire worlds) or harmless plants (such as the ferns known
        as "spacefronds," which grow in asteroid belts everywhere).</p><section
        class="secret" id="secret-dQ7vM5d8sPFrY99i"><p>Other spores are more
        deadly. They may carry space spore rhizomes (a variation of the gas
        spore), spores that will become other monstrous fungi (see "Fungus" in
        Monstrous Compendium) and other things that grow rapidly in the lungs
        (for simplicity, handle these as ingestive Poisons).</p><p>This danger
        has led to the term 'disease field,' applied to several known
        semipermanent spore fields (marked on star charts—one of the most
        valuable warnings thereon!).</p><p>The DM may develop specific diseases
        if desired (note that mummy rot and lycanthropy are properly curses, not
        diseases, and cannot be contracted from spores).</p><p>Other spores,
        such as krajen, are harmful to a ship or its cargo— including food, air,
        and water, even if not directly harmful to the crew.</p><p>The DM is
        encouraged to develop these latter menaces—the search for antidotes can
        suddenly make a boring space jaunt into something urgent and
        exciting!</p></section></div></div>
