    text:
      format: 1
      content: "<p>An ominous range of volcanic peaks rising in a ringlike\_formation north of Urik, the Smoking Crown is\_a dangerous land, barely habitable. The peaks belch\_plumes of steam, ash, and cinders that rain down\_over everything. Lava sometimes streams from the\_fissures in the slopes, spilling in fiery rivers down the\_mountainsides. Other fissures vent steam that scalds\_flesh or colorless, poisonous gases that kill without\_warning. Despite the danger, slaves excavate the\_mountains for obsidian and pumice. The quarries are\_hellish places to work, with unbearable temperatures\_and jagged black glass on all sides.</p>\n<p>\_</p>\n<p>City of the Fire King</p>\n<p>Miners tell of glimpsing\_dizzying ramparts and sinister gates through the\_clouds of steam and ash that fill the blasted plateau\_at the heart of the Smoking Crown. The citadels\_reported by the miners are said to be the homes of\_fearsome fire giants, fire titans, and salamanders that</p>\n<p>waylay workers who venture into the Crown.\_</p>"
