      content: "<p>Possibly unique on Athas,\_This geyser sits in the middle of a salt flat. Over the years, the steaming waters have washed the salt away for several miles around the fountain, and now it is surrounded by a beautiful forest of pinion trees.</p>\n<p>The so-called Lost Oasis features a natural geyser that periodically shoots scalding water to the surface. Despite its high mineral content, the steaming water nourishes a grove of trees, perhaps with the help of the thri-kreen druid Durwadala, who claims Lost Oasis as her home. Travelers who are allowed by Durwadala to enter Lost Oasis never see her, and those she determines to be enemies of life (such as defilers, aberrant creatures, and templars) are slain. How she manages this feat is a mystery. Either Durwadala is especially powerful or, as has been reported by raiders, the druid is linked to the geyser in some way, using it to ambush intruders with blasts of scalding water.</p>\n<p>Many years ago one Lionus, an invoker from Balic, discovered ancient scrolls relating to the early history of the dragon and the sorcerer-kings. He never told anyone what he found, but he left shortly after and took up residence at this oasis, near the ruins of Kalidnay. The old hermit has explored the ruins ever since, growing riper and hairier with each season. Despite a lack of results and numerous close calls with death, Lionus still believes the destroyed city holds some powerful secret. He tells visitors, with some excitement if not coherence, his theory that the dragon destroyed the city. \"The sorcerer-king here tried t' do somethin'. against the dragon, may. be... dunno. Tried t' kill a whole lot o' folks. Maybe some kind o' folks we never heard of. Dun- no why. You help me explore, I just know we'll find somethin.\" Lionus has explored some of the extensive ruins and thinks he may have befriended the local druid, the thri-keen Darwadala. Though not quite crazy, the old wizard ha had little social contact for decades and barely resembles his old Alliance associates.</p>\n<p><strong>Lionus </strong>(5th-level human invoker): AL LN; AC 10; MV 6; HD 5; hp 15; THACO 19; #AT 1; Dmg by spell; SZ M; ML 6; Str 12; Dex 13; Con 15; Int 16; Wis 9; Cha 8.</p>"
