      content: "<p>“You are not clutch. You are not pack. You are not kreen.\_And you are not welcome.”</p>\n<p>—Klut Takcha, Jhol-kreen huntmaster</p>\n<hr />\n<p>Beyond the Ringing Mountains and the Forest Ridge,\_an unexplored region of flat plains seems to go on\_forever. This area, the Western Hinterlands, has no cities, no known villages, and few ruins or ancient\_sites—only a handful of shy and suspicious herding tribes, which stay out of the way of the similarly\_scarce packs of thri-kreen and vicious bands of gnolls.\_</p>\n<p>Like the desolate wastes beyond the Endless Sand\_Dunes to the south or the broken badlands of the\_Barrier Wastes to the north, little of the Western Hinterlands is occupied.</p>\n<p>Although one might go days or weeks without\_encountering signs of permanent habitation in these\_lands, explorers are drawn into the remote region.\_Adventurers looking for undiscovered ruins and\_refugees seeking a haven beyond the grasp of the\_sorcerer-kings cross the Ringing Mountains and head\_westward. The boldest or most desperate dune traders lead caravans southwest around the mountains or\_north through the Barrier Wastes, searching for thri-kreen to do business with or new resources to exploit.</p>\n<p>Eventually, most traders abandon such notions and\_return to civilized lands.</p>\n<p>\_</p>\n<p>THE KREEN KHANATES</p>\n<p>The endless grasslands of the Crimson Savanna are\_home to the Kreen Khanates, sometimes referred\_to as the “Kreen Empire” by the soft-skinned races\_of the Tyr Region. To call the thri kreen civilization\_an empire is to invest it with far more centralization\_than it actually has. Each khanate is a nomadic horde\_that roams within a vast territory, fiercely guarding\_its borders from raids or invasions by other thri-kreen\_khans. The balance of power among the khanates\_waxes and wanes as the hordes follow their ancient\_migratory patterns. At present, the Jhol and T’keetch Khanates are the largest, although the J’kez Khanate’s neutrality gives it more influence than its size\_would dictate.\_</p>\n<p>Each khanate has a similar organization. The khan\_is usually the smartest and strongest thri-kreen of\_noble lineage. A council of the wisest scholars and\_most gifted hunters advises him or her. Below the\_khan’s advisors are the senior hunters, those who\_have been blooded in open warfare, and those who\_have been called to the worship of the Sand Father (a\_primal spirit that the kreen revere as their creator).</p>\n<p>Below those ranks are the younger hunters, apprentices to Sand Father worshipers, and kreen who\_remain in camp to tend to the young and mend or\_manufacture supplies.</p>\n<p>The recent uniting of the Tondi-kreen into a proper\_khanate under the charismatic warrior Atark Aakusk\_has upset the balance of power on the Crimson\_Savanna. The presence of a new khanate establishing\_its own migratory patterns has thrown off the migrations of the older khanates. Some wonder if Atark\_might be the haazi, the khan of khans whose coming\_has long been foretold.</p>\n<p>\_</p>\n<p>EXPLORING THE WESTERN HINTERLANDS</p>\n<p>The known hinterlands can be divided into roughly\_three regions: <strong>the Empty Plains</strong> (west of the Ringing\_Mountains and the Forest Ridge), <strong>the Jagged Cliffs</strong>\_(marking the end of the plains), and <strong>the Crimson\_Savanna</strong> (which lies beyond the cliffs).\_</p>\n<p>\_</p>\n<p>\_</p>\n<p>\_</p>\n<p>\_</p>\n<p>\_</p>"
