  - name: Introduction
    type: text
    text:
      format: 1
      content: "<div class=\"rd__b  rd__b--0\" data-roll-name-ancestor=\"Introduction\">\n<h1 class=\"rd__h rd__h--0\" data-title-index=\"2\"><span class=\"entry-title-inner\">Introduction</span></h1>\n<p><em>\"Nothing is at last sacred but the integrity of your own mind.\"—Emerson</em></p>\n<p>Psionics have a long and storied history in Dungeons &amp; Dragons, having been a part of nearly every edition of the game. While psionics were added to many prior editions, they were integral to a few campaign settings. The Eberron campaign setting, most notably, was built with the assumption that both psionics and magic existed in the world from the very beginning.</p>\n<p>The Psion's Primer is a supplement for both players and Dungeon Masters. Within these pages, you will find everything you need to create a psionic character, reward or claim psionic treasure, and devise cunning psionic encounters for your 5th edition Dungeons &amp; Dragons campaign!</p>\n<div class=\"rd__b  rd__b--1\" data-roll-name-ancestor=\"What You Need to Play\">\n<h2 class=\"rd__h rd__h--1\" data-title-index=\"3\"><span class=\"entry-title-inner\">What You Need to Play</span></h2>\n<p>To use <em>The Korranberg Chronicle: Psion's Primer</em>, you will need the 5th edition <em><span class=\"bold\">Dungeon Master's Guide</span></em>, <em><span class=\"bold\">Monster Manual</span></em>, and <em><span class=\"bold\">Player's Handbook</span></em>. In addition, if you are using the psionic rules presented in this book to run an Eberron campaign, it is recommended that you familiarize yourself with the Eberron campaign setting by reading <span class=\"bold\">Exploring Eberron</span>, the <em>Wayfinder's Guide to Eberron</em>, <em><span class=\"bold\">Eberron: Rising from the Last War.</span></em> and other products in the <em>Korranberg Chronicle</em> product line.</p>\n<p>As a note, the Psion's Primer is completely independent of the psionic material presented in Unearthed Arcana, including the Mystic playtest and the psionic dice mechanic.</p>\n</div>\n<div class=\"rd__b-special rd__b-inset \" data-roll-name-ancestor=\"Psionics In Other Settings\">\n<h4 class=\"entry-title-inner\">Psionics In Other Settings</h4>\n<span class=\"rd__h rd__h--2-inset\" data-title-index=\"4\"><span class=\"ve-flex-vh-center\"> <span class=\"rd__title-link rd__title-link--inset\">p1</span></span></span>\n<p>While the lore in this product defaults to the Eberron campaign setting, the mechanics presented in it can be used in any setting, perhaps even in some where psionics is more prevalent and widespread than magic.</p>\n<p>Throughout this book, sidebars such as these will discuss ways of incorporating psionic elements into other settings, to facilitate use of the system presented here in a wide variety of Dungeons &amp; Dragons games.</p>\n<div class=\"float-clear\">\_</div>\n</div>\n<div class=\"rd__b  rd__b--1\" data-roll-name-ancestor=\"Why Use Psionics?\">\n<h2 class=\"rd__h rd__h--1\" data-title-index=\"5\"><span class=\"entry-title-inner\">Why Use Psionics?</span></h2>\n<p>Psionic power has been presented as using a radically different subsystem from other forms of magic in most editions of Dungeons &amp; Dragons. Why use a separate subsystem, with brand new rules to learn, to represent psionics rather than reflavoring regular spellcasting?</p>\n<p>In the Eberron campaign setting, magic holds no mystery for the people of Khorvaire. Arcane magic is routinely studied and industry is fueled by experts in the field. For a commoner of the Five Nations, encountering magic spells is a familiar, nearly every- day occurrence.</p>\n<p>Psionics, then, is a foreign and mystic kind of power. From the Inspired and kalashtar of Sarlona, to the secretive cults dedicated to mad entities lurking in Khyber, psionic powers are a kind of magic that most Khorvairians know nothing about. Introducing psionics into your game as a separate system only reinforces the allure and mystery of this esoteric form of magic.</p>\n</div>\n<div class=\"rd__b  rd__b--1\" data-roll-name-ancestor=\"Psionics: The Basics\">\n<h2 class=\"rd__h rd__h--1\" data-title-index=\"6\"><span class=\"entry-title-inner\">Psionics: The Basics</span></h2>\n<p>Psionics, as a form of magic, has some similarities to spellcasting. There are two types of psionic powers: psionic talents and psionic augments.</p>\n<p>Psionic talents are cantrips and are similar to arcane or divine cantrips. Their primary distinction is that they have an indefinite duration that lasts for as long as you focus on them. You can only focus on one psionic talent at a time, and you only lose focus if you lose consciousness.</p>\n<p>Psionic augments are powers that look like spells in most ways: they have schools of magic, they range from 1st to 9th level, and you can only use (or manifest) them a limited number of times between long rests. They are not spells, however, and rather than expending spell slots, you must expend psi points to manifest them. The number of psi points you have, and the limits of their use, typically depend on your levels in a class that grants psionic powers.</p>\n<p>Additionally, each augment is a psionic power that modifies or amplifies a specific psionic talent, and you can only manifest an augment while you are focusing on the talent it is keyed to.</p>\n<p>Psionic classes are presented in Chapter 1, while Chapter 4 goes into greater detail on the use of psionic powers during play.</p>\n</div>\n<div class=\"rd__b  rd__b--1\" data-roll-name-ancestor=\"Psionics of Eberron\">\n<h2 class=\"rd__h rd__h--1\" data-title-index=\"7\"><span class=\"entry-title-inner\">Psionics of Eberron</span></h2>\n<p>Psionic power is a form of magic inherent to the Eberron campaign setting, though it is often placed just out of focus of the setting's main conflicts. The kalashtar's shadow war with the Inspired, for example, can easily be overlooked, and the psionic aspects of the mind flayers and their cults can be downplayed. But if one chooses, there is a plethora of lore about the origins of psionic power in Eberron and societies that employ psionics as adeptly as the Five Nations does arcane magic, hidden just below the surface.</p>\n<div class=\"rd__b  rd__b--2\" data-roll-name-ancestor=\"Planes of Thought\">\n<h3 class=\"rd__h rd__h--2\" data-title-index=\"8\"><span class=\"entry-title-inner\">Planes of Thought</span></h3>\n<div class=\"float-clear\">\_</div>\n<div>\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" src=\"assets/homebrew/img/jpgVayO.jpg\" /></div>\n</div>\n<p>Psionic power typically flows from one of two planes of existence: Dal Quor and Xoriat. The essence of each of these planes is inherently tied to the mind. Fernia is the Sea of Fire and home to beings of elemental flame. Dolurrh, the Realm of the Dead, is where ghosts and spirits of death reside. But as the planes of Dream and Madness, respectively, Dal Quor and Xoriat touch upon the power inherent to the mind like no other planes.</p>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"Dal Quor, The Region of Dreams\"><span class=\"rd__h rd__h--3\" data-title-index=\"9\"> <span class=\"entry-title-inner\">Dal Quor, The Region of Dreams.</span></span>\n<p>In the world of Eberron, mortals psychically project their minds into another plane of existence whenever they dream, and that plane is Dal Quor. The dreamscapes of mortals swirl around the borderlands of this plane, each a bubble of light in an ever-roiling expanse of darkness. These dreamscapes wink in and out of existence as their mortal dreamers slumber and wake, forever revolving around the stable center of the plane. At the center of Dal Quor are the great cities and strongholds of the quori, a massive civilization of pure terror and malice given form by the nightmarish heart of the plane, il-Lashtavar, or the \"Darkness That Dreams.\"</p>\n<p>The quori and other beings with strong ties to Dal Quor, such as the kalashtar and thri-kreen, have inherent psionic abilities that they draw from this plane. Others can hone their natural connection to Dal Quor and draw energy from the emotions and pure imagination that make up that plane of existence, manifesting their thoughts on the material plane as psionic powers.</p>\n<p>While the current nature of Dal Quor is that of a dark nightmare, the inherent essence of the plane remains that of all dreams, so psionic powers originating from Dal Quor are not inherently evil.</p>\n</div>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"Xoriat, the Realm of Madness\"><span class=\"rd__h rd__h--3\" data-title-index=\"10\"> <span class=\"entry-title-inner\">Xoriat, the Realm of Madness.</span></span>\n<p>Xoriat is often misunderstood as a realm of alien entities and unnatural horrors beyond imagining, but it is actually formed from the wildest possibilities of the sentient mind stripped of its limits. All thinking minds touch upon the Realm of Madness, some to a greater degree than others. And while Xoriat is an inherently evil- aligned plane of existence, not all of those with a strong connection to the Realm of Madness need be a detriment to society. While the insane cultist acting upon violent delusions is a reflection of Xoriat, so too is the genius artificer innovating brilliant, never-before-thought-of designs.</p>\n<p>Cultists and aberrations who draw their psionic power from this plane often refer to it as the Realm of Revelations, rather than one of madness. To them, Xoriat is the truth of reality, and one can only see the truth when they accept that their mind has the ability to create reality.</p>\n</div>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"The Sea of Siberys\"><span class=\"rd__h rd__h--3\" data-title-index=\"11\"> <span class=\"entry-title-inner\">The Sea of Siberys.</span></span>\n<p>While Dal Quor and Xoriat are the most commonly identified planes of thought in Eberron, psionic potential may also be drawn from the Sea of Siberys, also known as the Astral Sea or Astral Plane. The Astral Sea is the medium through which Eberron's outer planes orbit the Material Plane. Currents of psychic wind churn in the vast silver void of the plane, and the rare few natives of the plane often possess psychic potential. While Dal Quor and Xoriat are focused, distilled expressions of thought, the Sea of Siberys is diffuse and ephemeral in its connection to the mind.</p>\n</div>\n</div>\n</div>\n<div class=\"float-clear\">\_</div>\n<div>\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" src=\"assets/homebrew/img/nZfKoJj.png\" /></div>\n</div>\n<div class=\"rd__b-special rd__b-inset \" data-roll-name-ancestor=\"Psionics In Other Settings\">\n<h4 class=\"entry-title-inner\">Psionics In Other Settings</h4>\n<span class=\"rd__h rd__h--2-inset\" data-title-index=\"12\"><span class=\"ve-flex-vh-center\"> <span class=\"rd__title-link rd__title-link--inset\">p3</span></span></span>\n<p>Several of the rules and abilities presented in this book presume the existence of planes of thought, but you do not need to use Dal Quor and Xoriat if your game is not set in Eberron. In other campaign settings, you can use alternative planes of thought, such as the following:</p>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"The Astral Plane\"><span class=\"rd__h rd__h--3\" data-title-index=\"13\"> <span class=\"entry-title-inner\">The Astral Plane.</span></span>\n<p><span class=\"bold\">Appendix C of the Player's Handbook</span> describes the Astral Plane as a \"the realm of thought and dream.\" Like Eberron's Sea of Siberys, many of the rare inhabitants of the Astral Plane have inherent psionic power, and the plane responds to thoughts and ideals, allowing psionic characters to draw energy and matter from it.</p>\n</div>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"The Far Realm\"><span class=\"rd__h rd__h--3\" data-title-index=\"14\"> <span class=\"entry-title-inner\">The Far Realm.</span></span>\n<p>In campaigns using the Great Wheel cosmology, the Far Realm is an alien place that exists outside the known planes of existence. Horrible alien monstrosities and aberrations originate from this place and are associated with psionic power. Consider allowing rules elements that draw on the psionic power of madness to originate from the Far Realm.</p>\n</div>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"The Feywild\"><span class=\"rd__h rd__h--3\" data-title-index=\"15\"> <span class=\"entry-title-inner\">The Feywild.</span></span>\n<p>As an alternative to the Astral Plane, the power of dreams can be ascribed to the fey and the Feywild in core D&amp;D campaigns, as evidenced by supplemental material like the @class[druid|xge|Circle of Dreams druid|Circle of Dreams] subclass in <span class=\"bold\">Xanathar's Guide to Everything</span>. Consider powers that deal with dreams to originate from the Feywild for settings that do not have a dedicated plane of dreams. If the DM wishes, the quori may even be a race of dark fey in such campaigns, rather than fiends or aberrations.</p>\n</div>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"The Will and the Way\"><span class=\"rd__h rd__h--3\" data-title-index=\"16\"> <span class=\"entry-title-inner\">The Will and the Way.</span></span>\n<p>In some settings, psionics have no external source and are a natural extension of a psionic creature itself. A psion in such a setting, for instance, would owe their power to no other entity or source but their own mind. Whenever a character in such a campaign setting uses a power or ability that interacts with a plane of thought, the psionic potential of the action originates with the character, and they merely pull matter or energy from a plane of existence that is amenable to such interaction, such as the Astral Plane.</p>\n</div>\n<div class=\"float-clear\">\_</div>\n</div>\n<div class=\"rd__b  rd__b--1\">\n<div class=\"rd__b  rd__b--2\" data-roll-name-ancestor=\"Psionic Societies\">\n<h3 class=\"rd__h rd__h--2\" data-title-index=\"17\"><span class=\"entry-title-inner\">Psionic Societies</span></h3>\n<p>While psionic power originates from the planes in Eberron, cultures that employ psionics exist on the material plane itself. The most organized, established, and advanced of these are the psionic societies of Sarlona, though several cults of the Dragon Below in Khorvaire also nurture psionic power among their numbers.</p>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"Khyber Cults\"><span class=\"rd__h rd__h--3\" data-title-index=\"18\"> <span class=\"entry-title-inner\">Khyber Cults.</span></span>\n<div class=\"float-clear\">\_</div>\n<div>\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" src=\"assets/homebrew/img/mCdyRKs.png\" /></div>\n</div>\n<p>Secretive cults dedicated to the powers of the Dragon Below hide among all levels of Khorvairian society. They are not, however, a monolithic force. Each cult has its own independent circle of followers, culled from the insane, the desperate, and the vulnerable. Some of these cults arise naturally from societal pressures and charismatic leaders. Other cults originate from aberrations and creatures of Khyber manipulating the downtrodden and performing obscene experiments on them which may result in the manifestation of psionic powers.</p>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"Madness Manifested\"><span class=\"rd__h rd__h--3\" data-title-index=\"19\"> <span class=\"entry-title-inner\">Madness Manifested.</span></span>\n<p>Though most links to Xoriat were sealed by the Gatekeeper druids some nine millennia ago, several manifest zones tied to the Realm of Madness still exist, predominantly in the deep swamps of the Shadow Marches. Sometimes people born within one of these zones are gifted with raw psionic potential. These people are typically called \"wild savants\" and are ostracized by others for their strange abilities. If driven too far into the fringes of society, they may find greater psionic power by succumbing to the call of Xoriat, and begin forming their own cults in service to their mad egos or mounting delusions.</p>\n</div>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"Mind Flayer Thralls\"><span class=\"rd__h rd__h--3\" data-title-index=\"20\"> <span class=\"entry-title-inner\">Mind Flayer Thralls.</span></span>\n<p>Illithids and their kin are the most widely feared and psionically potent aberrations in Khyber, and they often create hereditary cults dedicated to them to ensure a steady diet of humanoid brains. Members of these cults with psionic potential are seen as possessing the blessing of the mind flayers and are exempted from harvest, becoming lieutenants in the cult hierarchy. In reality, their illithid masters merely see them as useful thralls and puppets, elevated from livestock.</p>\n</div>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"The Silent Cults\"><span class=\"rd__h rd__h--3\" data-title-index=\"21\"> <span class=\"entry-title-inner\">The Silent Cults.</span></span>\n<p>Some of the Khyber cults that most commonly attract psionic followers are those dedicated to the Master of Silence, one of the horrific entities from Xoriat known as the daelkyr that were sealed in Khyber at the end of the Xoriat Invasion nine millennia ago. The Master of Silence is whispered to possess the most immense psychic might of all the daelkyr. Admittance into cults dedicated to this entity usually impose a vow of silence onto their initiates, as uttering even a single word is blasphemy to these cults. Instead, communication is nonverbal, with those capable of telepathy being the most blessed and favored, often leading the cults of Silence.</p>\n</div>\n</div>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"Sarlona\"><span class=\"rd__h rd__h--3\" data-title-index=\"22\"> <span class=\"entry-title-inner\">Sarlona.</span></span>\n<div class=\"float-clear\">\_</div>\n<div>\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" src=\"assets/homebrew/img/EDmJkq6.png\" /></div>\n</div>\n<p>Sarlona is a continent in the eastern hemisphere of the world of Eberron and the birthplace of humanity. It had a long and storied history of both divine and arcane magical traditions, and when Sarlonan settlers emigrated to Khorvaire these traditions formed the basis for the magical knowledge of what would become the Five Nations. After the events known as the Sundering of Sarlona 1,500 years ago, however, Sarlona saw a sharp decline in the use of all forms of magic other than psionics. The Sundering was a continent-spanning conflict that saw most existing nations and power structures of Sarlona collapse. From the devastation, the Inspired rose and formed the Unity of Riedra.</p>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"Inspired Riedra\"><span class=\"rd__h rd__h--3\" data-title-index=\"23\"> <span class=\"entry-title-inner\">Inspired Riedra.</span></span>\n<p>The Unity of Riedra dominates the continent of Sarlona and is ruled by the Inspired, a caste of people the populace believes to be spiritually guided by the enlightened spirits of their ancestors. The populace attributes the peaceful golden age following the Sundering to the enlightened, benevolent rulership of the Inspired. In truth, the Sundering was orchestrated by the quori, malevolent beings from Dal Quor, and the Inspired leaders of Riedra are mortal vessels eugenically bred for quori possession. The Riedran empire is ruled by psionic fiends, and the populace is kept controlled by nightly psychic broadcasts projected into their dreaming minds.</p>\n<p>While psionic ability in Sarlona is not as widespread as arcane knowledge is in Khorvaire, the Inspired and their favored servants tend to be more powerful than typical spellcasters in the Five Nations. Most Sarlonan settlements are locked in simple agrarian lifestyles, while rare Riedran cities benefit from psionic conveniences and marvels, such as a network of permanent teleportation gateways, reserved exclusively for the use of the Inspired and their entourages.</p>\n</div>\n<div class=\"rd__b  rd__b--3\" data-roll-name-ancestor=\"The Kalashtar and Adar\"><span class=\"rd__h rd__h--3\" data-title-index=\"24\"> <span class=\"entry-title-inner\">The Kalashtar and Adar.</span></span>\n<p>The Sundering of Sarlona, the arrival of the Inspired, and the near-total unification of the continent under the Riedran empire did not occur by mere happenstance or whim. Before the empty vessels for Inspired possession were created, the first mortal vessels for quori were sixty-seven human monks from a single monastery in the mountain range of Adar. Unlike the quori that would come to dominate Sarlona nearly a millennium later, the first quori to arrive on the Material Plane were virtuous rebels and refugees, dissatisfied with the ever- present evil and darkness of their home.</p>\n<p>Adar had always been a place of refuge, so when these runaway quori came to Adaran monks in their dreams and begged for asylum, it was granted. The quori merged with their willing human hosts, creating the kalashtar bloodlines.</p>\n<p>Since then, the techniques and disciplines of psionic power have become widespread in Adar, even outside kalashtar lineages. The safety of the region itself is ensured by the Shroud, a massive psionic barrier that protects the mountains and monasteries from invasion. The Shroud has defended Adar from a centuries-long siege by the Inspired aimed at wiping out the kalashtar and the rebel quori who have merged with their bloodlines.</p>\n</div>\n</div>\n</div>\n</div>\n</div>"
