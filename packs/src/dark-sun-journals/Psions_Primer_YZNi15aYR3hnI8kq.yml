  - name: Psionic Friends & Foes
    type: text
    text:
      format: 1
      content: >-
        <div class="rd__b  rd__b--0" data-roll-name-ancestor="Psionic Friends
        &amp; Foes">

        <h1 class="rd__h rd__h--0" data-title-index="74"><span
        class="entry-title-inner">Psionic Friends &amp; Foes</span></h1>

        <p>The potential for psionic power does not solely lie within humanoid
        characters. Some monsters and creatures are naturally psionic, due to
        their origins or natures. Be they fiend, aberration, undead, or
        otherwise, the monsters characters may face in the world of Eberron may
        challenge them with psionic might.</p>

        <p>This chapter's monsters first appear in a bestiary, followed by a
        listing of generic NPCs that make use of the psionic system presented in
        this book.</p>

        <div class="rd__b  rd__b--1" data-roll-name-ancestor="New Special
        Traits">

        <h2 class="rd__h rd__h--1" data-title-index="75"><span
        class="entry-title-inner">New Special Traits</span></h2>

        <p>Below are two new special traits for psionic monsters and NPCs.
        Special traits are the abilities that appear after a monster or NPC's
        stat block, after their challenge rating.</p>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Innate Psionic
        Powers">

        <h3 class="rd__h rd__h--2" data-title-index="76"><span
        class="entry-title-inner">Innate Psionic Powers</span></h3>

        <p>A creature with natural psionic abilities has the Innate Psionic
        Powers trait. Many creatures in the Monster Manual and other books have
        the "Innate Spellcasting (Psionics)" trait, but this book offers
        alternative versions of those creatures, giving them access to psionic
        talents and augments presented in
        @UUID[JournalEntry.YZNi15aYR3hnI8kq.JournalEntryPage.0000000000000005]{Psionic
        Powers} through this trait.</p>

        <p>Creatures with innate psionics do not need to focus on a psionic
        talent in order to manifest an innate psionic augment. Their natural
        psionic abilities fulfill the augmenting requirement of any such power.
        Each augment's effects can be dispelled by dispel magic as if it was a
        spell of the same level as the augment's power level. Additionally, an
        innate power can have special rules or restrictions. For example, when a
        psionic mind flayer manifests @spell[mystic traveler|Psions Primer] or
        @spell[mystic caravan|Psions Primer], it can target itself only.</p>

        <p>A creature can innately manifest a psionic augment without spending
        psi points at the noted frequency. Unless otherwise noted, an innate
        psionic augment is manifested at its minimum psi cost. If a higher psi
        point manifestation is noted, it is the additional psi points spent to
        intensify the power above its minimum psi cost. If a creature has a
        psionic talent where its level matters and no level is given, use the
        creature's challenge rating as its level.</p>

        <p>A creature's innate powers can't be swapped out with other powers. If
        a monster's innate powers don't require attack rolls, no attack bonus is
        given for them.</p>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Psionic Powers">

        <h3 class="rd__h rd__h--2" data-title-index="77"><span
        class="entry-title-inner">Psionic Powers</span></h3>

        <p>A creature with the Psionics class feature has a pool of psi points
        and a psi limit, which it uses to manifest psionic powers (as explained
        in
        @UUID[JournalEntry.YZNi15aYR3hnI8kq.JournalEntryPage.0000000000000005]{Psionic
        Powers}). Its level as a psionic character is noted in the trait.</p>

        <p>The creature has a number of psionic talents known from a particular
        class, and knows a number of powers that augment those talents. The list
        of powers known may include powers from a feature in that class, such as
        the Expanded Knowledge feature of the psion.</p>

        <p>The psi point cost for each augment a creature knows is listed in
        parentheses after the augment. The creature may spend additional psi
        points above an augment's minimum psi cost to increase its power level
        or to intensify it as noted in the power. A power's noted psi cost will
        include a '+' symbol if there is an intensify option the creature can
        afford for that power.</p>

        <p>You can change the talents and augments a creature knows, replacing
        any power on a creature's power list with a different power of the same
        minimum level and from the same class list. If you do so, you might
        cause the creature to be a greater or lesser threat than suggested by
        its challenge rating.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--1" data-roll-name-ancestor="Psionic Monsters">

        <h2 class="rd__h rd__h--1" data-title-index="78"><span
        class="entry-title-inner">Psionic Monsters</span></h2>

        <p>See the <span class="bold">monsters</span> entries</p>

        </div>

        <div class="rd__b  rd__b--1" data-roll-name-ancestor="Psionic NPCs">

        <h2 class="rd__h rd__h--1" data-title-index="79"><span
        class="entry-title-inner">Psionic NPCs</span></h2>

        <p>This section contains statistics for various humanoid nonplayer
        characters (NPCs) with psionic capabilities that adventurers might
        encounter in a Dungeons &amp; Dragons campaign that makes use of the
        psionic rules presented in this book. These stat blocks can be used to
        represent both human and nonhuman NPCs and can be customized in the ways
        detailed in Appendix B of the Monster Manual, as well as one new way,
        detailed below.</p>

        <p>See the <span class="bold">monsters</span> entries</p>

        <div class="rd__b  rd__b--2">

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Power Swaps"><span
        class="rd__h rd__h--3" data-title-index="80"> <span
        class="entry-title-inner">Power Swaps.</span></span>

        <p>A new way to customize a psionic NPC is to replace one or more of the
        talents or powers it knows from a class. You can substitute any power on
        the NPC's power list with a different power of the same level from the
        same class list. Ensure that any new 1st-level or higher power you
        select augments a psionic talent the NPC already knows, or else swap out
        a talent for a new one and select new augments for it. Swapping powers
        in this manner doesn't alter an NPC's challenge rating.</p>

        </div>

        </div>

        </div>

        <div class="rd__b  rd__b--1" data-roll-name-ancestor="Quori-Possessed
        NPCs">

        <h2 class="rd__h rd__h--1" data-title-index="81"><span
        class="entry-title-inner">Quori-Possessed NPCs</span></h2>

        <p>The Quori have two kinds of hosts available to them for extraplanar
        possession: normal, willing humanoids, and the eugenically created
        Chosen bloodlines.</p>

        <p>See the <span class="bold">monsters</span> entries</p>

        <div class="rd__b  rd__b--2">

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="The Willing"><span
        class="rd__h rd__h--3" data-title-index="82"> <span
        class="entry-title-inner">The Willing.</span></span>

        <p>In the current timeline of Eberron, the quori have managed to
        manipulate events in the material plane to direct the construction of
        numerous monuments known as the hanbalani altas. These structures act as
        a planar anchor between Eberron and Dal Quor, drawing the Region of
        Dreams metaphysically closer to the material plane. Because of this
        increased proximity, the quori have recently gained the ability to
        possess willing humanoids when they dream.</p>

        <p>Hashalaq quori are typically the first to make contact with the mind
        of a sleeping mortal. The hashalaq caste's natural talent for empathic
        psionic powers allows them to find and exploit the prospective vessel's
        weakn esses and flaws. Eventually, through this manipulation, the host
        may concede to the quori and allow possession. Though hashalaqs often
        set up the deal, they are not always the ones to actually possess the
        host. Tsucora quori are the agents of the Dreaming Dark that most
        frequently infiltrate Khorvairian society through the use of humanoid
        hosts, though examples of all castes exist on the material plane,
        possessing willing hosts, and carrying out the agenda of the Dreaming
        Dark.</p>

        <p>When possessing a willing host, the quori gains complete control over
        the body. It cannot be forced out by a host that becomes unwilling after
        the quori is already inhabiting its body.</p>

        </div>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="The Chosen"><span
        class="rd__h rd__h--3" data-title-index="83"> <span
        class="entry-title-inner">The Chosen.</span></span>

        <p>Over centuries of manipulation, the Quori have directed several human
        bloodlines to intermingle with just the right traces of fiendish and
        elven blood to create the perfect mortal hosts for a possessing quori
        spirit.</p>

        <p>These carefully engineered hosts, called "empty vessels" by the quori
        and "the Chosen" by those they rule, are the second highest caste of
        society in the Riedran Empire. The Chosen are raised in the lap of
        luxury and conditioned to accept and look forward to their possession by
        the quori, though this is more of a precautionary measure; Chosen are
        eugenically engineered to have no mental or spiritual defense whatsoever
        against possession by quori spirits.</p>

        <p>In Riedra, the only beings with more authority, influence, and
        privilege than the Chosen are those among them inhabited by what the
        cowed population calls the <em>il-altas</em> or "great spirits." These
        Chosen, thus possessed, are called the Inspired, and the spirits that
        inhabit them are not divine beings, but the Quori.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Willing Hosts">

        <h3 class="rd__h rd__h--2" data-title-index="84"><span
        class="entry-title-inner">Willing Hosts</span></h3>

        <p>Willingly possessed humanoid NPCs use the basic rules for the quori's
        Possession ability, except that the quori can make full use of the
        host's knowledge, class features, and traits. These hosts are not the
        Inspired, but regular humanoids used as deep cover agents of the
        Dreaming Dark. The vast majority of possessed quori hosts in Khorvaire
        are willing humanoids, not Inspired.</p>

        <p>Because they don't dream or sleep, kalashtar, thri-kreen, warforged,
        and full-blooded elves cannot be willingly possessed by a quori that
        resides on Dal Quor, as these races do not psychically project into the
        plane.</p>

        <p>If possession of a willing humanoid host ends, the quori is
        transported to Dal Quor and must wait for the host to go to sleep and
        begin dreaming before it can attempt to possess it again.</p>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Inspired NPCs">

        <h3 class="rd__h rd__h--2" data-title-index="85"><span
        class="entry-title-inner">Inspired NPCs</span></h3>

        <p>Unlike a normal humanoid host, the Chosen were specifically
        engineered to be ideal vessels, allowing the quori to retain a greater
        measure of their power while possessing them. These are the
        Inspired.</p>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Empty
        Vessel"><span class="rd__h rd__h--3" data-title-index="86"> <span
        class="entry-title-inner">Empty Vessel.</span></span>

        <p>The Chosen are the perfect vessels for quori for two very important
        reasons:</p>

        <p>First, a Chosen is always considered a willing host, regardless of
        its actual disposition or intent. It is never allowed to make a saving
        throw to resist a quori's Possession, f ailing automatically
        instead.</p>

        <p>Second, Chosen are always psychically projecting into Dal Quor
        subconsciously, even while fully awake, allowing a quori to possess a
        Chosen any time of day or night. Thus, if a possessing quori spirit is
        ejected from a Chosen vessel, the Quori can use its Possession ability
        to re-inhabit the Chosen almost instantly, without needing to wait for
        the Chosen to go to sleep.</p>

        </div>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Inspiration"><span
        class="rd__h rd__h--3" data-title-index="87"> <span
        class="entry-title-inner">Inspiration.</span></span>

        <p>The Inspired presented in Eberron: Rising from the Last War is a
        mid-level diplomat or soldier of Riedra, but any generic NPC can
        represent a Chosen host. Typically Chosen are not trained as
        spellcasters, as the culture of Riedra vilifies spellcasting. Instead,
        most of Sarlona's Chosen and Inspired would be made from the psionic NPC
        statistics provided earlier in this chapter.</p>

        <p>A DM may create an Inspired by applying the effects of the quori's
        Possession ability to a Chosen NPC, excep t that the quori can make full
        use of the Chosen's knowledge, class features, and traits. In addition,
        an Inspired NPC has the Dual Mind trait and one or more additional
        traits depending on which type of quori is possessing the host:</p>

        </div>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Dual Mind"><span
        class="rd__h rd__h--3" data-title-index="88"> <span
        class="entry-title-inner">Dual Mind.</span></span>

        <p>While possessed by a quori, a Chosen has advantage on Wisdom saving
        throws.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Hashalaq">

        <h3 class="rd__h rd__h--2" data-title-index="89"><span
        class="entry-title-inner">Hashalaq</span></h3>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Suggestion
        (3/Day)"><span class="rd__h rd__h--3" data-title-index="90"> <span
        class="entry-title-inner">Suggestion (3/Day).</span></span>

        <p>The Inspired can innately manifest the post-hypnotic suggestion power
        (power save DC 8 + proficiency + Charisma modifier), requiring no focus
        or psi points.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Kalaraq">

        <h3 class="rd__h rd__h--2" data-title-index="91"><span
        class="entry-title-inner">Kalaraq</span></h3>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="All-Around
        Vision"><span class="rd__h rd__h--3" data-title-index="92"> <span
        class="entry-title-inner">All-Around Vision.</span></span>

        <p>The Inspired can't be surprised.</p>

        </div>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Mind Seed
        (1/Day)"><span class="rd__h rd__h--3" data-title-index="93"> <span
        class="entry-title-inner">Mind Seed (1/Day).</span></span>

        <p>The Inspired can innately manifest the mind seed power (power save DC
        8 + proficiency + Charisma modifier), requiring no focus or psi
        points.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Tsoreva">

        <h3 class="rd__h rd__h--2" data-title-index="94"><span
        class="entry-title-inner">Tsoreva</span></h3>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Natural
        Mindblades"><span class="rd__h rd__h--3" data-title-index="95"> <span
        class="entry-title-inner">Natural Mindblades.</span></span>

        <p>The Inspired can cast the mindblade psionic talent, and when it does
        it may create two mindblades instead of one.</p>

        <p>If the Inspired already has a multiattack option, it may replace any
        of the attacks noted in its multiattack with mindblade attacks.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Tsucora">

        <h3 class="rd__h rd__h--2" data-title-index="96"><span
        class="entry-title-inner">Tsucora</span></h3>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Pandemonium
        (1/Day)"><span class="rd__h rd__h--3" data-title-index="97"> <span
        class="entry-title-inner">Pandemonium (1/Day).</span></span>

        <p>The Inspired can innately manifest the pandemonium power (power save
        DC 8 + proficiency + Charisma modifier), requiring no focus or psi
        points.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Usvapna">

        <h3 class="rd__h rd__h--2" data-title-index="98"><span
        class="entry-title-inner">Usvapna</span></h3>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Mind Schism"><span
        class="rd__h rd__h--3" data-title-index="99"> <span
        class="entry-title-inner">Mind Schism.</span></span>

        <p>The Inspired can focus on two psionic talents at once.</p>

        </div>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Inception
        (1/Day)"><span class="rd__h rd__h--3" data-title-index="100"> <span
        class="entry-title-inner">Inception (1/Day).</span></span>

        <p>The Inspired can innately manifest the inception power (power save DC
        8 + proficiency + Charisma modifier), requiring no focus or psi
        points.</p>

        </div>

        </div>

        </div>

        </div>
