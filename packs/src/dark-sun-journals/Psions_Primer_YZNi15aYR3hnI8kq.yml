  - name: Psionic Powers
    type: text
    text:
      format: 1
      content: >-
        <div class="rd__b  rd__b--0" data-roll-name-ancestor="Psionic Powers">

        <h1 class="rd__h rd__h--0" data-title-index="48"><span
        class="entry-title-inner">Psionic Powers</span></h1>

        <p>Psionic powers come in two forms, talents and augments. Talents are
        cantrips which last as long as you focus on them, while augments are
        abilities that can be layered on top of these cantrips to modify their
        effects.</p>

        <div class="rd__b  rd__b--1">

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Saving Throws">

        <h3 class="rd__h rd__h--2" data-title-index="49"><span
        class="entry-title-inner">Saving Throws</span></h3>

        <p>Many psionic powers specify that a target can make a saving throw to
        avoid some or all of a power's effects. The power specifies the ability
        that the target uses for the save and what happens on a success or
        failure. The DC to resist one of your powers equals 8 + your psionic
        ability modifier + your proficiency bonus + any special modifiers.</p>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Attack Rolls">

        <h3 class="rd__h rd__h--2" data-title-index="50"><span
        class="entry-title-inner">Attack Rolls</span></h3>

        <p>Some powers require you to make an attack roll to determine whether
        the psionic effect hits the intended target. Your attack bonus with a
        power attack equals your psionic ability modifier + your proficiency
        bonus. Most powers that require attack rolls involve ranged attacks.
        Remember that you have disadvantage on a ranged attack roll if you are
        within 5 feet of a hostile creature that can see you and that isn't
        &amp;Reference[condition=incapacitated].</p>

        </div>

        </div>

        <div class="rd__b  rd__b--1" data-roll-name-ancestor="Using a Psionic
        Talent">

        <h2 class="rd__h rd__h--1" data-title-index="51"><span
        class="entry-title-inner">Using a Psionic Talent</span></h2>

        <p>Talents are psionic powers that are also cantrip spells, and follow
        most of the normal rules for casting spells, such as casting time,
        range, and area of effect. There are three exceptions to this; as
        psionic powers, talents have different rules for schools of magic, spell
        components, and duration.</p>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Psionic Schools of
        Magic">

        <h3 class="rd__h rd__h--2" data-title-index="52"><span
        class="entry-title-inner">Psionic Schools of Magic</span></h3>

        <p>Scholars of psychic manifestations categorize psionic effects
        differently than mages do their spells. The following psionic schools
        help describe psionic effects. These schools have no rules of their own,
        but other rules might refer to these new schools or to "psionic spells,"
        which are any spells that have a psionic school. A detect magic spell
        can determine a psionic school of magic as easily as a normal
        school.</p>

        <div class="rd__b  rd__b--3"
        data-roll-name-ancestor="Clairsentience"><span class="rd__h rd__h--3"
        data-title-index="53"> <span
        class="entry-title-inner">Clairsentience.</span></span>

        <p>This school encompasses psionic effects that impart knowledge,
        enhance senses, or alter probability. Spells and abilities that defend
        against divination, such as mind blank, also provide protection from
        clairsentience powers.</p>

        </div>

        <div class="rd__b  rd__b--3"
        data-roll-name-ancestor="Metacreativity"><span class="rd__h rd__h--3"
        data-title-index="54"> <span
        class="entry-title-inner">Metacreativity.</span></span>

        <p>Powers of this school typically draw thoughts into reality, shaping
        imagined things into matter.</p>

        </div>

        <div class="rd__b  rd__b--3"
        data-roll-name-ancestor="Psychokinesis"><span class="rd__h rd__h--3"
        data-title-index="55"> <span
        class="entry-title-inner">Psychokinesis.</span></span>

        <p>This school consists of effects that manifest energy or telekinetic
        force.</p>

        </div>

        <div class="rd__b  rd__b--3"
        data-roll-name-ancestor="Psychometabolism"><span class="rd__h rd__h--3"
        data-title-index="56"> <span
        class="entry-title-inner">Psychometabolism.</span></span>

        <p>Some psionic effects impose will over flesh, pushing living biology
        beyond its normal limits. Spells and abilities that defend against
        transmutation also provide protection from psychometabolism powers.</p>

        </div>

        <div class="rd__b  rd__b--3"
        data-roll-name-ancestor="Psychoportation"><span class="rd__h rd__h--3"
        data-title-index="57"> <span
        class="entry-title-inner">Psychoportation.</span></span>

        <p>Psionic effects that move objects or creatures through time, space,
        and planes of existence belong to this school.</p>

        </div>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Telepathy"><span
        class="rd__h rd__h--3" data-title-index="58"> <span
        class="entry-title-inner">Telepathy.</span></span>

        <p>Telepathic effects touch upon the minds of others, whether to
        communicate with them, influence their thoughts or perceptions, or
        barrage them with pure damaging psychic power.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Psionic
        Components">

        <h3 class="rd__h rd__h--2" data-title-index="59"><span
        class="entry-title-inner">Psionic Components</span></h3>

        <p>Most psionic talents do not have normal components (verbal, somatic,
        or material), as they are products entirely of the mind. However, the
        act of casting a psionic cantrip is oftentimes obvious to observers, and
        such psionic effects have the following components:</p>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Auditory
        (A)"><span class="rd__h rd__h--3" data-title-index="60"> <span
        class="entry-title-inner">Auditory (A).</span></span>

        <p>Some manner of noise audible to all within 60 feet accompanies the
        use of psionic powers with this component. Creatures within 30 feet can
        determine the origin of the sound as easily as if it were regular, clear
        speech.</p>

        </div>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Observable
        (O)"><span class="rd__h rd__h--3" data-title-index="61"> <span
        class="entry-title-inner">Observable (O).</span></span>

        <p>Some psionic powers come with a visible display when they manifest or
        are cast. The origin of such an effect can be visually traced back to
        its creator by creatures within line of sight.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Psionic Focus">

        <h3 class="rd__h rd__h--2" data-title-index="62"><span
        class="entry-title-inner">Psionic Focus</span></h3>

        <p>All psionic talents have a duration of Focus. You can only focus on
        one effect at a time, and you may focus on an effect indefinitely while
        you remain conscious. Your focus ends if you are knocked
        &amp;Reference[condition=unconscious], if you begin focusing on another
        spell or effect, or if the psionic talent you are focusing on is
        dispelled. You may also choose to stop focusing at any time, requiring
        no action.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--1" data-roll-name-ancestor="Manifesting
        Augments">

        <h2 class="rd__h rd__h--1" data-title-index="63"><span
        class="entry-title-inner">Manifesting Augments</span></h2>

        <p>Psionic powers that magnify the effects of psionic talents are called
        augments. Augments follow many of the same rules as spells: range,
        targets, areas of effect, saving throws, attack rolls, and combining
        magical effects (described in <span class="bold">Chapter 10:
        Spellcasting of the Player's Handbook</span>). However psionic augments
        are not spells and have a few rules unique to them, described below.</p>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Power Level">

        <h3 class="rd__h rd__h--2" data-title-index="64"><span
        class="entry-title-inner">Power Level</span></h3>

        <p>Each psionic augment has a listed power level, ranging from 1 to 9.
        When you manifest an augment, it increases the spell level of the
        psionic talent it is augmenting to be equal to the augment's power
        level. This increase in the talent's spell level begins when you
        initiate the manifesting time of the power, and lasts until the
        augment's duration ends (augments with an instantaneous duration end
        immediately upon use).</p>

        <p>As cantrips, unaugmented talents have a spell level of 0 and their
        spell level is only increased by augments you manifest while you focus
        on them. If your focus on a talent ends but the duration of an augment
        continues, the talent does not automatically gain the increased spell
        level if you cast it again before the augment's duration ends.</p>

        <p>Augments aren't spells, but the effects of augments with non-
        instantaneous durations can be ended early with dispel magic by
        dispelling the psionic talent they are augmenting at its augmented spell
        level. An augment that is manifested without focusing on a talent, such
        as one cast via certain magic items, has a spell level equal to its
        power level for the purpose of adjudicating dispel magic.</p>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="School">

        <h3 class="rd__h rd__h--2" data-title-index="65"><span
        class="entry-title-inner">School</span></h3>

        <p>Augments have the same psionic schools of magic that talents do. Most
        augments are of the same school as the talent they modify, but
        manifesting some augments changes the school of the psionic talent they
        augment for the duration of their effects.</p>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Augmenting">

        <h3 class="rd__h rd__h--2" data-title-index="66"><span
        class="entry-title-inner">Augmenting</span></h3>

        <p>Each augment's entry specifies which psionic talent you must
        currently be focusing on in order to manifest it. You cannot manifest an
        augment for one psionic talent while you are focusing on a different
        talent.</p>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Psi Cost">

        <h3 class="rd__h rd__h--2" data-title-index="67"><span
        class="entry-title-inner">Psi Cost</span></h3>

        <p>Manifesting psionic powers does not expend spell slots. Instead, in
        order to augment a psionic talent, you must possess a reserve of
        potential psionic energy and expend a portion of it. This energy is
        represented by psi points. Casting a psionic talent cantrip does not
        expend psi points, but manifesting an augment does. Each psionic augment
        specifies the minimum number of psi points you must expend in order to
        manifest it.</p>

        <p>The number of psi points available to you usually depends on your
        character level and your class or subclass. Your number of psi points
        can't go below 0, or over your maximum. Your psi point total returns to
        its maximum when you finish a long rest.</p>

        <p>You may spend psi points you have on any augments you know,
        regardless of the source of those augments and whether or not they are
        normally manifested through the expenditure of psi points.</p>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Psi Limit"><span
        class="rd__h rd__h--3" data-title-index="68"> <span
        class="entry-title-inner">Psi Limit.</span></span>

        <p>The number of psi points you can spend on a single manifestation of a
        psionic power is limited. This limit usually depends on your character
        level and your class or subclass, and is specified therein. Your race,
        or other character options such as feats, might specify a psi limit as
        well. Your psi limit for all psionic effects you know is always the
        highest psi limit you have, regardless of source, unless that source is
        specifically limited to certain effects. If the psi cost of a psionic
        power is greater than your limit, you cannot manifest that power.</p>

        </div>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Intensify"><span
        class="rd__h rd__h--3" data-title-index="69"> <span
        class="entry-title-inner">Intensify.</span></span>

        <p>The listed psi cost for all augments is a minimum. You may always
        choose to spend more psi points than an augment's minimum cost up to
        your limit, increasing the augment's power level by 1 for every 2 psi
        points beyond the minimum you spend. When a power's description includes
        a specific intensify option, it states the effects spending additional
        psi points beyond the minimum has on the power in addition to increasing
        its power level. Your psi limit applies to the total cost of manifesting
        an augment, which includes any psi points spent to intensify it.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Manifesting Time">

        <h3 class="rd__h rd__h--2" data-title-index="70"><span
        class="entry-title-inner">Manifesting Time</span></h3>

        <p>Manifesting an augment requires the same kind of actions that casting
        a spell might (actions, bonus actions, reactions, etc.), but it is not
        casting a spell. Rules that refer to casting or casting times do not
        apply to the manifesting of psionic augments.</p>

        <div class="rd__b  rd__b--3" data-roll-name-ancestor="Powers and
        Spells"><span class="rd__h rd__h--3" data-title-index="71"> <span
        class="entry-title-inner">Powers and Spells.</span></span>

        <p>Manifesting a psionic augment and casting a spell are two different
        ways of creating magical effects that are typically mutually exclusive
        of one another. You cannot cast a non- psionic spell and manifest an
        augment in the same turn. In addition, if you manifest an augment as a
        bonus action, the only psionic power you can produce with your action is
        casting a psionic talent with a casting time of 1 action.</p>

        </div>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Components">

        <h3 class="rd__h rd__h--2" data-title-index="72"><span
        class="entry-title-inner">Components</span></h3>

        <p>Manifesting an augment on a psionic talent does not usually require
        material (M), somatic (S), or verbal (V) spell components, though they
        might display the auditory (A) or observable (O) components that some
        psionic talents have, making it apparent you are amplifying your active
        psionic powers.</p>

        </div>

        <div class="rd__b  rd__b--2" data-roll-name-ancestor="Duration">

        <h3 class="rd__h rd__h--2" data-title-index="73"><span
        class="entry-title-inner">Duration</span></h3>

        <p>Psionic powers have the same kinds of durations as spells do. Note
        that an augment with a duration of concentration does not end if your
        focus on the psionic talent it is augmenting ends.</p>

        <p>A talent being augmented by a power that has a set duration inherits
        the duration of that augment, though that talent may have no discernible
        effect if focus is not maintained on it.</p>

        </div>

        </div>

        </div>
