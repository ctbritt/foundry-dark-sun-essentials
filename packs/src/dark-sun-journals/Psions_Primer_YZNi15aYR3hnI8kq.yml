      content: "<div class=\"rd__b  rd__b--0\" data-roll-name-ancestor=\"Psionic Classes\">\n<h1 class=\"rd__h rd__h--0\" data-title-index=\"25\"><span class=\"entry-title-inner\">Psionic Classes</span></h1>\n<p>The full potential of psionic power can only be achieved by dedicated focus and meditation, represented by taking levels in psionic classes, or choosing subclasses that also grant psionic power. The <strong>Empath</strong>, <strong>Icon</strong> and <strong>Psion </strong> are new classes capable of reaching the pinnacle of mortal psionic power, while the <strong>Adamant</strong>, <strong>Lurk</strong>, and <strong>Soulknife</strong> are new subclasses for existing <span class=\"bold\">Player's Handbook</span> classes. Additionally, optional multiclassing rules for psionic classes and subclasses are provided at the end of this chapter.</p>\n<div class=\"rd__b  rd__b--1\" data-roll-name-ancestor=\"Empath\">\n<h2 class=\"rd__h rd__h--1\" data-title-index=\"26\"><span class=\"entry-title-inner\">Empath</span></h2>\n<div class=\"rd__wrp-gallery\">\n<div class=\"float-clear\">\_</div>\n<div class=\"rd__wrp-gallery-image\">\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" title=\"Mystic\" src=\"assets/homebrew/img/Ij60KLT.png\" alt=\"Mystic\" /></div>\n<div class=\"rd__image-title\">\n<div class=\"rd__image-title-inner\">Mystic</div>\n</div>\n</div>\n<div class=\"float-clear\">\_</div>\n<div class=\"rd__wrp-gallery-image\">\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" title=\"Occultist\" src=\"assets/homebrew/img/lrFP2fq.jpg\" alt=\"Occultist\" /></div>\n<div class=\"rd__image-title\">\n<div class=\"rd__image-title-inner\">Occultist</div>\n</div>\n</div>\n<div class=\"float-clear\">\_</div>\n<div class=\"rd__wrp-gallery-image\">\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" title=\"Wilder\" src=\"assets/homebrew/img/kicFGcN.png\" alt=\"Wilder\" /></div>\n<div class=\"rd__image-title\">\n<div class=\"rd__image-title-inner\">Wilder</div>\n</div>\n</div>\n</div>\n<p>See the @class[Empath|Psions Primer] entry</p>\n</div>\n<div class=\"rd__b  rd__b--1\" data-roll-name-ancestor=\"Icon\">\n<h2 class=\"rd__h rd__h--1\" data-title-index=\"27\"><span class=\"entry-title-inner\">Icon</span></h2>\n<div class=\"rd__wrp-gallery\">\n<div class=\"float-clear\">\_</div>\n<div class=\"rd__wrp-gallery-image\">\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" title=\"The Heart\" src=\"assets/homebrew/img/cpEm3JT.png\" alt=\"The Heart\" /></div>\n<div class=\"rd__image-title\">\n<div class=\"rd__image-title-inner\">The Heart</div>\n</div>\n</div>\n<div class=\"float-clear\">\_</div>\n<div class=\"rd__wrp-gallery-image\">\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" title=\"The Warrior\" src=\"assets/homebrew/img/fCVSibm.png\" alt=\"The Warrior\" /></div>\n<div class=\"rd__image-title\">\n<div class=\"rd__image-title-inner\">The Warrior</div>\n</div>\n</div>\n</div>\n<p>See the @class[Empath|Psions Primer] entry</p>\n</div>\n<div class=\"rd__b  rd__b--1\" data-roll-name-ancestor=\"Psion\">\n<h2 class=\"rd__h rd__h--1\" data-title-index=\"28\"><span class=\"entry-title-inner\">Psion</span></h2>\n<div class=\"rd__wrp-gallery\">\n<div class=\"float-clear\">\_</div>\n<div class=\"rd__wrp-gallery-image\">\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" title=\"Dominator\" src=\"assets/homebrew/img/hGEGgVH.png\" alt=\"Dominator\" /></div>\n<div class=\"rd__image-title\">\n<div class=\"rd__image-title-inner\">Dominator</div>\n</div>\n</div>\n<div class=\"float-clear\">\_</div>\n<div class=\"rd__wrp-gallery-image\">\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" title=\"Kineticist\" src=\"assets/homebrew/img/vwNR9uH.png\" alt=\"Kineticist\" /></div>\n<div class=\"rd__image-title\">\n<div class=\"rd__image-title-inner\">Kineticist</div>\n</div>\n</div>\n<div class=\"float-clear\">\_</div>\n<div class=\"rd__wrp-gallery-image\">\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" title=\"A Shaper's Eidolon\" src=\"assets/homebrew/img/yhhGBmk.png\" alt=\"A Shaper's Eidolon\" /></div>\n<div class=\"rd__image-title\">\n<div class=\"rd__image-title-inner\">A Shaper's Eidolon</div>\n</div>\n</div>\n</div>\n<p>See the @class[Psion|Psions Primer] entry</p>\n</div>\n<div class=\"rd__b  rd__b--1\" data-roll-name-ancestor=\"Psionic Subclasses\">\n<h2 class=\"rd__h rd__h--1\" data-title-index=\"29\"><span class=\"entry-title-inner\">Psionic Subclasses</span></h2>\n<div class=\"rd__b  rd__b--2\" data-roll-name-ancestor=\"Fighter: Adamant\">\n<h3 class=\"rd__h rd__h--2\" data-title-index=\"30\"><span class=\"entry-title-inner\">Fighter: Adamant</span></h3>\n<div class=\"float-clear\">\_</div>\n<div>\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" title=\"Adamant\" src=\"assets/homebrew/img/khX10zN.png\" alt=\"Adamant\" /></div>\n<div class=\"rd__image-title\">\n<div class=\"rd__image-title-inner\">Adamant</div>\n</div>\n</div>\n<p>See the @class[fighter|phb|Adamant|adamant|Psions Primer] entry</p>\n</div>\n<div class=\"rd__b  rd__b--2\" data-roll-name-ancestor=\"Monk: Way of the Soulknife\">\n<h3 class=\"rd__h rd__h--2\" data-title-index=\"31\"><span class=\"entry-title-inner\">Monk: Way of the Soulknife</span></h3>\n<div class=\"float-clear\">\_</div>\n<div>\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" title=\"Soulknife\" src=\"assets/homebrew/img/EJVC2Jx.png\" alt=\"Soulknife\" /></div>\n<div class=\"rd__image-title\">\n<div class=\"rd__image-title-inner\">Soulknife</div>\n</div>\n</div>\n<p>See the @class[monk|phb|Way of the Soulknife|soulknife|Psions Primer] entry</p>\n</div>\n<div class=\"rd__b  rd__b--2\" data-roll-name-ancestor=\"Rogue: Lurk\">\n<h3 class=\"rd__h rd__h--2\" data-title-index=\"32\"><span class=\"entry-title-inner\">Rogue: Lurk</span></h3>\n<div class=\"float-clear\">\_</div>\n<div>\n<div class=\"rd__wrp-image relative\"><img class=\"rd__image\" title=\"Lurk\" src=\"assets/homebrew/img/izvmwqT.png\" alt=\"Lurk\" /></div>\n<div class=\"rd__image-title\">\n<div class=\"rd__image-title-inner\">Lurk</div>\n</div>\n</div>\n<p>See the @class[rogue|phb|Lurk|lurk|Psions Primer] entry</p>\n</div>\n</div>\n<div class=\"rd__b  rd__b--1\" data-roll-name-ancestor=\"Multiclassing\">\n<h2 class=\"rd__h rd__h--1\" data-title-index=\"33\"><span class=\"entry-title-inner\">Multiclassing</span></h2>\n<p>See the @variantrule[Multiclassing Psionic Characters|Psions Primer|Multiclassing Psionic Characters] optional rule</p>\n</div>\n</div>"
