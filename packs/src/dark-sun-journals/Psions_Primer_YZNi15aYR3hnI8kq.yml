name: Psions Primer
pages:
  - name: A Friendly Warning
    type: text
    text:
      format: 1
      content: >-
        <div class="rd__b  rd__b--0" data-roll-name-ancestor="A Friendly
        Warning">

        <p><em>It's a little... "The changeling waved his hand in the air, quill
        tilting lazily through his fingers, "hard to believe. Sentient
        nightmares that are planning world domination and pretending to be
        enlightened individuals bringing us vital, humanitarian aid? Sorry, but
        unless you have some actual proof..."</em></p>

        <p><em>The woman on the other side of the table, contriving to look calm
        despite the developing bar brawl building in the Lhazaar tavern, tilted
        her head with the same faint smile she'd worn throughout the
        conversation. She leaned forward, resting her elbow on the table, and
        with a flash of light from her eyes and chest, a blade of radiant blue
        energy appeared around her hand. "Will this qualify?"</em></p>

        <p><em>"Minor illusio—" Rhen replied, before the blade was brought down
        to cut his mug, a cheap, wooden thing he'd suspected was leaking, into
        two neat pieces. "—cannot do that." He stared at the useless halves of
        the mug on the table, frowning despite his lack of enthusiasm for the
        swill that used to be in the mug when it was whole.</em></p>

        <p><em>"Would you need more evidence that what I am here to tell you is
        not of your arcanism?" Evatana dismissed her blade as Rhen debated
        whether another drink was worth trying to get the bartender's attention.
        "Very few of my people would even consider offering an outsider any of
        this information at all."</em></p>

        <p><em>Glancing over to the corner where Ardiane had settled herself to
        watch the meeting, Rhen nodded in acknowledgement, then flagged down the
        bartender for another mug of ale, deciding he did, in fact, need
        something to help him take this all in. "Then why now and why me?" He
        could feel Ardiane's eyes burning the back of his skull, despite her
        being several feet away and possessed of no such magical gaze abilities.
        He knew she was carefully watching for any trickery on Evatana's
        part.</em></p>

        <p><em>A growl from another section of the tavern drew his attention in
        that direction, but he didn't miss Evatana's next words. "I believe that
        the people of these lands can be made allies rather than left as
        ignorant lambs before the onslaught of the Darkness."</em></p>

        <p><em>She followed his gaze as well, where a Jorash'tar half-orc from
        the Mror Holds had drawn the attention of a Lhazaarite pirate who'd
        gotten too close. The Mror lowlander lifted the offender off the ground,
        growling in his face. The pirate's friends came to his defense, and soon
        the area around the bar was a flurry of splinters and punches. "This is
        what they will do," Evatana gestured broadly at the room, "but on a
        grander scale. They will divide your people, let them fight themselves,
        and when you are weak, they will come as saviors."</em></p>

        <p><em>Rhen paused, looking suspiciously at the woman, then gestured to
        the bar brawl. "This isn't your influence, is it?" Evatana shook her
        head, both in answer and, apparently, to warn off Ardiane. "So these
        quori are just waiting for us to destroy ourselves in some sort of
        apocalyptic war..." A chill ran down his spine, and he put his head in
        his hands.</em></p>

        <p><em>Evatana gave him a moment, in which Ardiane abandoned all
        subtlety to sit next to him, glaring at Evatana suspiciously as she put
        an arm around his waist. "Yes," Evatana replied. "Whether or not they
        had a hand in its beginning, you were never so vulnerable as you are
        now. Certainly, their hidden hands seek to renew the destruction of the
        Last War."</em></p>

        <p><em>"And I just happen to be in the right place for you to pass this
        message on?" Rhen looked up, taking a deep gulp from the new mug.
        "They're eating at the fractures, and these 'psionic powers' are what
        they're using to do it." He coughed as the unexpectedly strong Lhazaar
        alcohol burned the back of his throat. How strong was the ale here?
        "Then you're right. Tell me about the quori and how we can fight their
        designs. I don't know if we can, but..."</em></p>

        <p><em>Evatana offered a small smile. "Your people fight horrors like
        this all the time. Psionic powers are not as foreign to Khorvaire as you
        think. Beneath the surface of this land, the mind flayers and their
        aberrant kin know these techniques too, and despite the taint of this
        psionic corruption spreading through cults and warped bloodlines, your
        protectors in the forests fought them and won. It is not a war of blood
        and steel. This is a war of hearts and righteousness. If you Dream of a
        better Age, the world will Turn to it."</em></p>

        </div>
