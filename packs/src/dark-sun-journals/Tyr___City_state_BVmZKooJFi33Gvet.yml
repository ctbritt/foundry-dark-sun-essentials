      content: "<p>A wide, shallow valley surrounds Tyr like a sinkhole in\_the mountains. Through the heat shimmer, a traveler\_can just glimpse the great ziggurat and Golden Tower\_of Tyr rising above the city walls.</p>\n<p>\_</p>\n<p>To the north and east of the great city are the sprawling\_estates of Tyr\x92s nobles and higher-ranking templars.\_Fields of faro and gray cotton stand in regimented rows\_along the fertile (by Athasian standards) bottom of the\_valley. Other plantations provide gladiatorial training\_grounds and holding areas for vicious animals or monsters\_captured for the arena. While slaves used to form\_the pool of gladiators, those nobles still interested in\_the games train teams of free gladiators for the no longer-lethal arena. Private soldiers patrol the nobles\x92\_lands to ward off raiders and dangerous beasts while\_laborers toil beneath the burning sun to bring the\_crops to harvest. Several paths and small roads run\_between and around the various estates, converging in\_a common road that leads to the stadium gate. Sweeping\_west, the fields give way to isolated patches of rockstem\_and stunted cactus.</p>\n<p>\_</p>\n<p>The area west of Tyr is largely unsettled. A hedge of\_scrub plants encircles the perimeter of the lower node\_of the walled city (that area that houses the templars\x92\_quarters). The hedge, known as \x93the barrier,\x94 flanks\_the area near the Grand Gate, through which valuable\_iron shipments pass from the mine. A 20-foot buffer</p>\n<p>exists between the barrier and the road approaching\_the grand gate. Under Kalak, the barrier served two\_purposes: First, to hinder anyone from entering the city\_on foot except at the three major gates; second, to give\_Kalak a tremendous source of power to fuel his defiling\_magics.</p>\n<p>Farther out, where the valley\x92s walls rise in knotted\_ridges to meet the Ringing Mountains, a scrub plain\_covers several miles of landscape. Herdsmen sometimes\_forage among the sandy-root trees there, but not\_overly so. Druids of the scrub plain watch the area and\_kill those who damage the local environment. Grazing</p>\n<p>is permitted provided it doesn\x92t outstrip the land\x92s\_ability to regenerate the foliage lost. Predators prowl\_the thickets, though, and losses are high to animals and\_herdsmen both!</p>\n<p>The herdsmen of the Tyr valley primarily drive herds\_of erdlus and z\x92tal. A nearby plantation raises large\_numbers of kips as well. The owner supplements their\_foraging with regular shipments of garbage from Tyr.</p>\n<p>The road curves southwest from the grand gate,\_skirting the foothills for eight or nine miles through the\_southern Tyr valley. The ground grows steeper then, the\_road becoming more twisted as it weaves its way\_through boulder fields to end at the Tyrian iron mines.\_Here, that most precious metal, iron, is wrested from</p>\n<p>the bowels of Athas at great cost, both in terms of gold\_and of men.</p>\n<p>Under the city is the ruins of former inkarnations of the city back ti the time of Tyr'agi.</p>\n<p>several monsters live here such as yan-ti, wererats and a cult of druids from the circle of spores</p>\n<p>\_</p>"
