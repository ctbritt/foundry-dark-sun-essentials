    text:
      format: 1
      content: >-
        <p>Timor represents the old guard of templars trying to maintain order
        in the new regime. A short, frail man with pointed features and thinning
        hair, he speaks with an authority that belies his unimposing appearance.
        Coming from three generations of templar service, he possesses vast
        networks of informants and contacts inherited from his father. His
        obsession with order and predictability (he learned astronomy to find
        comfort in the stars' regularity) made the revolution devastating for
        him personally, but his organizational skills proved invaluable in
        preventing complete collapse. Tithian wisely appointed him Senior
        Templar, and now Timor serves as the bureaucratic backbone holding the
        government together. He trusts no one, constantly verifies that orders
        are carried out, and can alter plans instantly without missing a beat.
        Characters meeting him often feel scrutinized and violated by his
        uncanny ability to see through deceptions and cut to the heart of
        matters.</p>
