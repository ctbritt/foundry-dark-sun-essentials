      content: "<p dir=\"ltr\">Giustenal is another of the great cities of the ancients. The city has many different walls, some of which wind down into the Sea of Silt. it is possible to wade several miles into the dust by walking along the tops of these walls, but I would advise against such foolishness. There seems to be an unusual concentration of silt horrors around the city.</p>\n<p dir=\"ltr\">Giustenal appears relatively deserted, perhaps even peaceful, and it is. However, there is something lurking out there in the quarters buried by the Sea of Silt. Psionicists claim that it is a being - or an object - of incredible power that makes contact with vulnerable minds and calls to them.</p>\n<p dir=\"ltr\">l have never felt this pull, but one night while we were camped inside the city ruins, a glassy look came over my psionicist companion and he began conversing with an unseen partner in a strange language. Two days later, he went insane and murdered our kank drivers. I was forced to kill him to defend myself.</p>\n<hr />\n<p dir=\"ltr\">Forty miles east of Cromlin lies a ruin largely forgot\_ten by most ofAthas. Rumors in the Ivory Triangle\_speak of Giustenal, a crumbled city on the far side of\_the Black Spine Mountains. Silt skimmers passing by\_the Bay of Maray steer far out on the shoals and give\_the\_ city a wide berth, seeking to pass by swiftly and\_in daylight. Brave souls who venture near find a maze\_of walls and broken ramparts encircling Giustenal,\_many winding down into the silt for hundreds of\_yards. Silt horrors thrive beneath the dust here.\_Within the maze,\_ the city is half buried in silt. It\_appears deserted, and its ruins show evidence of a\_terrible sorcerous battle fought here long ago. Giustenal was destroyed swiftly but never sacked; the few\_looters who have raided the city claim that a great\_deal of treasure still lies in the\_ ruins.\_</p>\n<p dir=\"ltr\">No people are known to linger nearby, but dangerous beasts lair in the remains of the city. From time to time, travelers passing by in the desert report feeling\_the lure of a psychic presence calling them toward\_Giustenal. All that is known about this mysterious\_spirit,\_ referred to as the Caller, is the effect it has on\_its victims—trusted companions go into a shrieking,\_ violent fit, killing pack animals or fellow travelers\_before fleeing into the desert, heading straight for the\_ruined city. Even those touched only lightly by the\_Caller’s\_ power speak of feeling an unnatural desire to\_pass through the gates of Giustenal and be consumed.</p>\n<p dir=\"ltr\">Some say that the Caller is the collective remnant of\_Giustenal’s long-dead populace, trapped on Athas\_by the mystical turbulence stirred up by the city’s\_destruction. Others believe that the Caller devours\_those it lures into the city, adding their souls to its\_own\_ tormented legions.\_</p>\n<hr />\n<p dir=\"ltr\">DREGOTH, THE UNDEAD\_SORCERER-KiNG</p>\n<p dir=\"ltr\">A dreadful secret lies beneath Giustenal’s dusty streets:\_The sorcerer-king of this destroyed city still exists in a\_subterranean network of caverns and tunnels. Once\_Giustenal was a city-state as grand as Tyr or Nibenay, ruled\_by its powerful sorcerer-king Dregoth. Here,\_ Dregoth\_forged a new race of followers—the dragonborn, or dray.\_But almost two thousand years ago, the other sorcererkings\_conspired to kill Dregoth, fearing his growing\_strength. The resulting magical duel turned Giustenal\_into a vast tomb. In the end, Dregoth fell\_ dead, and his\_opponents left the ruined city to the desert. But with the\_last of his power, Dregoth made the transition to undeath.\_The Dread King has secretly gathered his few surviving\_templars and slaves underground. Now, after all these\_centuries, the undead Dregoth\_ schemes to take his place\_as ruler of Athas.</p>"
