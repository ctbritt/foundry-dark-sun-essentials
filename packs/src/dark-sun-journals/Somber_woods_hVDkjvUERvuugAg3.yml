      content: |-
        <p>The Somber Woods clings to the eastern side of a</p>
        <p>small mountain range and serves as home to related tribes</p>
        <p>of hunter-gatherers. This forest is a dark, brooding place</p>
        <p>shrouded in an ancient cloak of antiquity. There are, it</p>
        <p>seems, as many dead or dying trees as there are vibrant,</p>
        <p>living ones. Old beyond imagining and twisted with the</p>
        <p>weight of their years, these trees press in upon themselves,</p>
        <p>creating a claustrophobic maze.</p>
        <p>Adding to the feeling of desolation, most of the creatures</p>
        <p>and insects living in the forest are nocturnal. During the</p>
        <p>day, the woods appear to be deserted and eerily silent.</p>
        <p>Travelers can wander for hours without seeing or hearing</p>
        <p>another living thing. At night, the opposite is true. As the</p>
        <p>twin moons rise overhead, the woods become a shadowy,</p>
        <p>bustling terrain painted with the pallid luminescence of</p>
        <p>moonlight. Pale creatures with large, glowing eyes emerge</p>
        <p>to hunt, prowling the forest with vigor. This is also when</p>
        <p>the tribes inhabiting the woods become active, moving like</p>
        <p>spirits through this ancient wilderness.</p>
        <p>The tribes have customs in common with the Gulgs,</p>
        <p>though their culture and lifestyle is much more primitive</p>
        <p>than that of Lalali-Puy's subjects. Their society has</p>
        <p>developed around the hunt and the forest. Because</p>
        <p>the creatures of the woods only come out at night, the</p>
        <p>people of the woods (mostly humans, with an assortment</p>
        <p>of adopted individuals from other races) have become</p>
        <p>nocturnal as well. Because of their wilderness skills, their</p>
        <p>strange activity cycle, and their savage, mystical customs,</p>
        <p>many weird legends concerning the Somber Woods' tribes</p>
        <p>have developed. Others inhabiting the Scorched Plateau</p>
        <p>believe that the forest is haunted and that the members of</p>
        <p>the forest tribes are the ghosts of the ancients. The tribes</p>
        <p>do nothing to discourage these beliefs, as such legends</p>
        <p>work to their benefit in most situations.</p>
