      content: "<p><strong>Setup.</strong> This encounter can begin anytime the characters are in a public area. As well as arranging the characters arrest, this encounter teaches them how power works in Tyr. Have the playem turn to Players' Book p. 33-Street Scene.</p>\n<p>\_</p>\n<p><strong>Start</strong>. Read the following to the shortest-tempered PC The red sky above Tyr is smudged with the soot of cooking fires, the thick odor of\_exotic spices hangs in the still air. A dull broil radiates from the stonework walls, and people bustle hotly through the streets. As you round a corner, someone\_suddenly knocks you sprawling into a fruit-vendor's stall.</p>\n<p><strong>Encounter. </strong>The PC has been purposely pushed by the gladiator-slave of a young nobleman. Three gladiators are callously clearing a path for their master through the crowd. Make clear to the PC that he was shoved by the slave, then immediately have the fruit-vendor shout in outrage.</p>\n<p>\_</p>\n<p><strong>Role-Playing.</strong> The fruit-vendor is a mul slave. The wailing mul is panicked by the loss of his fruit. He claims exorbitant damages, hoping for a large payment to placate his master, Have the mul scream loudly about robbery and vandalism.</p>\n<p>\_</p>\n<p>The young nobleman, Verrasi of Minthur, pays no attention to the PC plight and takes grave offense at any suggestion that he is to blame. His slaves sneer at the PCs, insulting them and lying about who pushed whom. They extravagantly claim that the mul and PCs are thieves planning to rob Verasi and that they merely protected their master. The mul answer with more indignant howls.</p>\n<p>\_</p>\n<p><strong>Dialogue</strong></p>\n<p>\_</p>\n<p>\"Look at this! The finest fruit in Tyr -all ruined and mush!\" \"You are the son of an inix. No other thief could be so stupid.\"</p>\n<p>\_</p>\n<p>\"I. Senator Verrasi, do not as hide threats from rabble. Templars, deal with them! \"(Tingle of coins)</p>\n<p>\_</p>\n<p>\"Thief! Thief am\_ I?!\_ My master will beat me with a thousand canes when he\_hears this!\"\"</p>\n<p>\_</p>\n<p><strong>Reactions</strong>. No matter what happens, the commotion attracts a templar patrol that comes to restore \"order. The noble bribes the templats to arrest the party. Be sure\_the PCs see the transaction and know the nobleman's name</p>\n<p>\_</p>\n<p><strong> Outcome.</strong> The arrested characters are led to the ziggurat as slaves. Tell the players to read Players Book p. 8-Verrasi of Minthur</p>\n<p>\_</p>\n<p>Next. It all the characters are arrested, go to Part Two Otherwise choose from Encounters 1A. IC. ID, or E</p>"
