      content: "<aside class=\"notable\"><p>“Beware the city dwellers,for they have the tongues of serpents, and their daggers are made of silver coins.”</p><p>—A Tamwar saying</p></aside><hr /><p>The Tyr Region is rimmed by the Ringing Mountains to the west and the Sea of Silt to the east, but to the south is nothing but desert—a vast desert that never ends, as far as anyone knows. As one travels south from the shores of the Estuary of the Forked Tongue\_villages and outposts peter out to wild lands where only a few lonely nomads roam. Beyond that, the traveler comes to silent, empty lands where no one lives at all, and even the vicious predators that haunt the deserts of the Tablelands and the Ivory Triangle grow\_few and far between. These are the Southern Wastes,\_a desolate expanse that in all likelihood girdles the\_rest of the world.</p><p>The wastes have no verdant areas or oases large\_enough to support a city. In fact, the desert takes on\_a capricious, elemental character as one ventures\_farther south. Just as the Sea of Silt is an incursion of\_elemental power into the world, the Southern Wastes</p><p>are home to other sorts of incursions: mazes of windcarved canyons, plains of smoking ash, forests of stone columns that drift with the gusts, rivers of fire, seas of salt, and more. Perhaps other populated lands like the Tyr Region exist somewhere beyond these\_terrible wastes . . . or perhaps not.</p><h2>EXPLORING THE\_SOUTHERN WASTES</h2><p>Much like the deserts of the Tyr Region, the Southern Wastes are the graveyard of ancient realms. Ruins dot this awesome expanse and seem to grow older the farther south one travels. Some sages claim that the peoples of the Tyr Region once lived in these lands\_and were driven northward century by century as the\_decay of Athas slowly enveloped the south.</p>"
