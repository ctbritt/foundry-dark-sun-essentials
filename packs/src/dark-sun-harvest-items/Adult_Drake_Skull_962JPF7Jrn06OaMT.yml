name: Adult Drake Skull
type: weapon
img: icons/commodities/bones/skull-lizard-brown.webp
system:
  description:
    value: >-
      <section class="secret" id="null"><p>If a creature with at least 15
      Strength lifts the skull above their head as an action, each creature
      within 120 feet of the skull must make a [[/save wis dc=16 format=long]]
      or become  &amp;Reference[frightened ]for 1 minute. A creature can repeat
      the saving throw at the end of each of its turns, ending the effect on
      itself on a success. If a creature's saving throw is successful or the
      effect ends for it, the creature is immune to this effect for the next 24
      hours. The skull can be mastercrafted (smith’s tools and woodcarver’s
      tools) into one of the following items: </p><ul><li><p>wall
      trophy</p></li><li><p>warhorse
      barding</p></li><li><p>helmet</p></li><li><p>shield</p></li><li><p>or a
      ship’s figurehead. </p></li></ul></section><p>The skull from the Drake you
      killed</p>
